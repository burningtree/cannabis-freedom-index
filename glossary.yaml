# Words the site uses that a reader may not know. When the pages are built, the first time one of
# them appears in a text (a profile section, a history entry, an article, an atlas entry) it gets a
# dashed underline and this explanation on hover, focus or tap (src/lib/terms.js). The source texts
# are not changed.
#   id:   the word as it is usually written; `also` lists other forms that should match
#   text: one or two plain sentences, no citations: what the word means on this site
# Words for cannabis itself belong in Culture (culture/language/), not here; those are underlined
# too and lead to their atlas entry.

# Local words for cannabis that have no atlas entry yet (a language entry in culture/language/
# takes over a word once it is written, and the word should then be removed from here)
- id: rongony
  text: The Malagasy word for cannabis, used in Madagascar for the plant and for what is smoked.
- id: prensado
  text: Spanish for "pressed". Herbal cannabis compressed into hard blocks for transport, typical of the cannabis grown in Paraguay and sold across South America.
- id: chira
  text: A North African name for hashish, used in Morocco and in the colonial drug laws of France and Belgium.

- id: decriminalised
  also: [decriminalized, decriminalisation, decriminalization, decriminalise, decriminalize]
  text: Still against the law, but no longer a crime. Having a small amount brings at most a fine or a warning, and no criminal record.
- id: depenalised
  also: [depenalized, depenalisation, depenalization]
  text: Still a crime on paper, but in practice no punishment is imposed for small amounts.
- id: toleration policy
  also: [tolerated, gedoogbeleid]
  text: Illegal, but the authorities have decided not to prosecute, as with the Dutch coffeeshops.
- id: administrative offence
  also: [administrative offense, administrative offences, Ordnungswidrigkeit, přestupek]
  text: A breach handled by an authority instead of a criminal court, usually with a fine and no criminal record.
- id: misdemeanour
  also: [misdemeanor, misdemeanours, misdemeanors]
  text: A minor crime, below a felony. It can bring a short jail term and leaves a criminal record.
- id: felony
  also: [felonies]
  text: A serious crime, usually one that can bring more than a year in prison.
- id: trafficking
  also: [drug trafficking]
  text: In drug law, supplying drugs to anyone else, sold or given away, not only smuggling them across borders.
- id: presumption of trafficking
  also: [presumed trafficking, presumed to be trafficking]
  text: A rule that treats anyone holding more than a set amount as a dealer, unless they prove otherwise.
- id: mandatory minimum
  also: [mandatory minimums, minimum sentence, minimum sentences]
  text: A prison term the judge must impose at least, whatever the circumstances of the case.
- id: caning
  also: [strokes of the cane]
  text: Corporal punishment with a rattan cane, still imposed for drug crimes in Singapore and Malaysia.
- id: fixed penalty notice
  also: [fixed penalty, fixed-penalty notice]
  text: An on-the-spot fine, like a parking ticket, paid without going to court.
- id: diversion
  also: [diverted, diversion programme, diversion program]
  text: Sending someone to treatment, education or a warning instead of to court.
- id: expungement
  also: [expunged, expunge, record clearing, records cleared]
  text: Removing an old conviction from a person's criminal record.
- id: Single Convention
  also: [Single Convention on Narcotic Drugs]
  text: The United Nations treaty of 1961 that obliges countries to control cannabis and to limit it to medical and scientific use.
- id: Schedule I
  also: [Schedule IV, Schedule 1]
  text: The strictest classes in a drug law's lists. Schedule I in the United States is for drugs said to have no accepted medical use; Schedule IV of the 1961 UN treaty was for drugs considered especially dangerous.
- id: THC
  also: [tetrahydrocannabinol, delta-9-THC, Δ9-THC]
  text: Tetrahydrocannabinol, the main substance in cannabis that makes people high.
- id: HHC
  also: [hexahydrocannabinol]
  text: Hexahydrocannabinol, a semi-synthetic cannabinoid usually made from CBD and sold as a legal high, until many countries banned it.
- id: cannabinoid
  also: [cannabinoids]
  text: A substance that acts on the body's cannabinoid receptors, such as THC or CBD.
- id: endocannabinoid
  also: [endocannabinoids, endocannabinoid system]
  text: A cannabinoid the body makes itself, such as anandamide.
- id: per se limit
  also: [per-se limit, fixed THC limit, fixed limit]
  text: A driving rule under which a set level of THC in the blood is an offence by itself, whether or not the driver is impaired.
- id: ng/ml
  also: [ng/mL, nanograms per millilitre]
  text: Nanograms per millilitre, the unit for THC in blood or serum. A nanogram is a billionth of a gram.
- id: edibles
  also: [edible]
  text: Food or sweets made with cannabis, such as cookies, chocolate or gummies.
- id: concentrates
  also: [concentrate, cannabis concentrates]
  text: Strong extracts of cannabis, such as oil, wax or shatter, with far more THC than the flower.
- id: cultivation association
  also: [cultivation associations, growing association, growing associations, Anbauvereinigung]
  text: A non-profit club whose members grow cannabis together and share the harvest only among themselves.
- id: regulated market
  also: [regulated cannabis market, legal market]
  text: A legal market in which the state licenses growers and sellers and sets rules on products, prices or buyers.
- id: home growing
  also: [home grow, home cultivation]
  text: Growing a few cannabis plants at home for one's own use, legal in some countries within a set number of plants.
- id: telemedicine
  also: [telemedicine platforms, online clinics]
  text: Doctors' consultations held online, through which some countries' patients get cannabis prescriptions without a visit.

# Treaties and international bodies
- id: Convention on Psychotropic Substances
  also: [1971 Convention, Psychotropic Substances Convention]
  text: The United Nations treaty of 1971 that controls psychotropic substances, among them THC itself; the cannabis plant is controlled by the treaty of 1961.
- id: 1988 Convention
  also: [Convention against Illicit Traffic]
  text: The United Nations treaty of 1988 against drug trafficking. It also asks countries to make possession for personal use a criminal offence, within the limits of their constitutions.
- id: UNODC
  also: [UN Office on Drugs and Crime, United Nations Office on Drugs and Crime]
  text: The United Nations Office on Drugs and Crime, which collects countries' drug figures and publishes the yearly World Drug Report.
- id: International Narcotics Control Board
  also: [INCB]
  text: The UN body that watches whether countries keep the drug treaties, and criticises those that legalise cannabis.
- id: Commission on Narcotic Drugs
  also: [CND]
  text: The UN commission where governments vote on which substances the drug treaties control. In 2020 it took cannabis out of the treaty's strictest list.
- id: EUDA
  also: [EMCDDA, European Union Drugs Agency]
  text: The European Union Drugs Agency in Lisbon, called the EMCDDA until 2024, which gathers drug figures from the EU countries.
- id: rescheduling
  also: [rescheduled, reschedule]
  text: Moving a drug to another list of a drug law or treaty, which changes how strictly it is controlled.

# The law and the courts
- id: personal use
  also: [for personal use, own use]
  text: Holding or using drugs for oneself rather than to supply anyone else. Many laws punish it far more lightly than dealing.
- id: aggravated
  also: [aggravating circumstances, aggravated offence, aggravated offense]
  text: An offence treated as more serious because of its circumstances, such as selling to children, near a school or as part of a gang, which raises the punishment.
- id: suspended sentence
  also: [suspended sentences, suspended prison sentence]
  text: A prison term the court imposes but does not enforce, unless the person offends again within a set period.
- id: probation
  text: A sentence served in the community under supervision instead of in prison, with conditions such as regular drug tests.
- id: day fine
  also: [day fines, day-fine]
  text: A fine counted in days, each day worth a share of the person's income, so the same offence costs the rich more. Used in Germany and the Nordic countries.
- id: amnesty
  also: [amnesties]
  text: A decision that frees people from punishment for past offences or clears their convictions, usually after a law has changed.
- id: zero tolerance
  text: A driving rule under which any trace of THC in the body is an offence, however long ago the cannabis was used.
- id: paraphernalia
  also: [drug paraphernalia]
  text: Equipment for using drugs, such as pipes, bongs, papers and grinders. Some laws make selling or holding it an offence.

# Treatment and registers
- id: compulsory treatment
  also: [compulsory rehabilitation, drug rehabilitation centre, rehabilitation centre]
  text: Drug treatment ordered by a court or the authorities, sometimes in a closed rehabilitation centre, that the person cannot refuse.
- id: dissuasion commission
  also: [dissuasion commissions]
  text: In Portugal, a panel of health and social workers to which the police send people caught with drugs for their own use, instead of to a court.
- id: narcological register
  also: [drug users' register]
  text: In Russia and other former Soviet states, an official list of people known to use drugs, which can cost them a driving licence and some jobs.
- id: harm reduction
  text: Measures that reduce the damage drug use does, such as drug checking or advice on safer use, without first requiring people to stop.

# Medicines and products
- id: Sativex
  also: [nabiximols]
  text: A mouth spray made from cannabis extracts, with THC and CBD in roughly equal parts, approved in many countries for muscle stiffness in multiple sclerosis. Its generic name is nabiximols.
- id: dronabinol
  text: THC made as a medicine, mainly against nausea and loss of appetite.
- id: nabilone
  text: A man-made substance similar to THC, prescribed against nausea during chemotherapy.
- id: magistral preparation
  also: [magistral preparations, magistral]
  text: A medicine made up by a pharmacist for one patient from a doctor's prescription, such as a cannabis oil dosed for that person.
- id: THCA
  also: [THC-A, tetrahydrocannabinolic acid]
  text: The acid form of THC found in the raw plant. It does not make people high until it is heated, which some sellers use to sell strong flower as "hemp".
- id: synthetic cannabinoids
  also: [synthetic cannabinoid]
  text: Laboratory chemicals that act like THC, often far stronger and more dangerous, sold under names such as Spice or K2.
- id: hash oil
  also: [honey oil]
  text: A strong liquid extract of cannabis, with much more THC than the flower or hashish.
- id: potency
  text: How strong a cannabis product is, usually given as its share of THC.

# The market and enforcement
- id: excise
  also: [excise tax, excise duty, excise duties]
  text: A tax on a particular product, such as alcohol, tobacco or legal cannabis, charged on top of ordinary sales tax.
- id: eradication
  also: [eradication campaign, eradication campaigns]
  text: Destroying cannabis crops, by hand, by burning or by spraying from the air, usually by police or soldiers.
