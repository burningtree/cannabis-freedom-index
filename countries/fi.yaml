segments:
  possession:
    text: >-
      Possession of a small amount for personal use is a 'drug-user offence', a category created in
      2001, punishable by a fine or up to six months in prison. Sentencing guidance sets 5–20
      day-fines for under 15 g. Because day-fines scale with income, the cost varies widely.
    sources:
      - wiki
  cultivation:
    text: Growing even one plant is a narcotics offence, treated more seriously than use.
    sources:
      - wiki
  enforcement:
    text: Fines in almost all user cases, issued by police on the spot; prison is available in law.
    sources:
      - wiki
      - td
  sharing:
    text: Supply is a narcotics offence with prison.
    sources:
      - wiki
  consumption:
    text: >-
      Finland criminalises use itself, not just possession — a positive test can ground a drug-user
      offence.
    sources:
      - wiki
      - nordic
  access:
    text: >-
      No legal source. A citizens' initiative for decriminalisation reached parliament and was voted
      down in 2022; a second, for legal regulation, gathered the required 50,000 signatures in 2023.
    sources:
      - td
      - wiki
context:
  production:
    text: No licensed production.
    sources:
      - wiki
  products:
    text: One approved cannabinoid medicine, plus imported medical flower by special permit.
    sources:
      - wiki
  medical:
    text: >-
      Extremely limited: a mouth spray for multiple sclerosis as a last resort, and Dutch medical
      flower only through an individual special permit held by a small number of patients.
    sources:
      - wiki
      - nordic
  consequences:
    text: >-
      Drug-user fines are recorded in police registers and can affect security clearances, some
      professions and a driving licence.
    sources:
      - td
      - nordic
  planting:
    seeds: grey
    seeds_trade: unclear
    clones: grey
    clones_trade: unclear
    text: >-
      Finnish law punishes growing hemp only when it is grown as a drug. In 2020 the Court of
      Appeal of Eastern Finland overturned the conviction of a man who grew hemp to collect
      seed for breeding and had told the police beforehand. A criminal-law professor
      commenting on the case said selling seeds so that drugs are made from them is certainly
      a crime, while selling them for other purposes can be allowed; both professors quoted
      stressed that it was a single case.
    sources:
      - yle20
  driving:
    status: zero
    text: >-
      Under the criminal code a driver commits an offence if a narcotic is found in the blood
      at all, unless it comes from a medicinal product the person has a right to use; a second
      provision covers impaired driving. Police may stop at random and test on suspicion, with
      an oral-fluid test after a physical test and blood taken at a hospital or police
      station. The detection offence carries up to 120 day-fines or six months in prison,
      impaired driving at least 60 day-fines or up to two years, and the ban can last up to
      five years.
    sources:
      - euda_dd
  clubs:
    status: none
    text: >-
      No clubs are known. A Europe-wide survey of cannabis social clubs carried out in 2018
      and 2019 found, after online searches and contact with people in the field, that there
      did not seem to be any active club in Finland. The model is prohibited throughout the
      European Union. Nothing more recent was found.
    sources:
      - pardal20
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. British travel advice says illegal
      drugs, including cannabis, are prohibited even in small quantities and warns of jail
      sentences of up to 10 years and heavy fines for possessing, using, buying or smuggling
      them, also in transit. Airport scanners are also used on the baggage of passengers in
      transit.
    sources:
      - td
      - wiki
      - fcdo
