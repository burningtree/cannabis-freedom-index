segments:
  possession:
    text: >-
      Law No. 7 of 1990 on narcotics, as amended in 1996, prohibits cannabis in every form.
      Possession or use for personal purposes is punished with prison — sources give around two
      years, with a range of one to ten — and substantial fines.
    sources:
      - cr
      - law
  cultivation:
    text: Cultivation is criminalised by the same law.
    sources:
      - law
      - cr
  enforcement:
    text: >-
      Enforcement is fragmented between rival authorities and armed groups running checkpoints,
      which makes outcomes arbitrary rather than lenient. Libya is a major transit route for
      Moroccan hashish.
    sources:
      - cr
  sharing:
    text: Trafficking can bring life imprisonment or death in aggravated cases.
    sources:
      - cr
  consumption:
    text: Use is a crime.
    sources:
      - cr
  access:
    text: None.
    sources:
      - cr
