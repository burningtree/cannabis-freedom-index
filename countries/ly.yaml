segments:
  possession:
    text: >-
      Law 7 of 1990 lists hashish and the cannabis plant among its controlled substances (Tables
      1 and 5). Article 37 punishes holding, buying or growing for personal use with prison and a
      fine of 1,000 to 5,000 dinars; the court may order treatment in a clinic for six months to a
      year instead. Law 23 of 2002 added Article 35 bis: intent to traffic is established even for
      a single act, a small quantity, or when the offender cannot prove another purpose.
    sources:
      - law7
      - law2002
  cultivation:
    text: >-
      Article 30 bans growing, holding or trading in the Table 5 plants, seeds included, except for
      medical or scientific purposes. Growing for trade carries death or life imprisonment and a
      fine (Article 34); growing for personal use falls under Article 37.
    sources:
      - law7
  enforcement:
    text: >-
      The statute sets prison for personal use (Article 37) and allows treatment instead, and no
      prosecution if the user comes forward for treatment on their own. How it is applied is not
      shown by the text.
    sources:
      - law7
  sharing:
    text: >-
      Supplying a user for payment carries life imprisonment or at least ten years (Article 35).
      Supplying without payment carries prison and a fine of 2,000 to 5,000 dinars. Article 35 bis
      of 2002 treats even a one-off act as trading.
    sources:
      - law7
      - law2002
  consumption:
    text: >-
      Article 37 punishes actually using drugs with prison and a fine of 1,000 to 5,000 dinars,
      unless the person is licensed; treatment can replace the penalty.
    sources:
      - law7
  access:
    text: >-
      None for personal use. Medical and scientific use is allowed only under licence (Articles 30
      and following).
    sources:
      - law7
context:
  death_penalty:
    text: >-
      Article 34 of Law 7 of 1990 punishes trading in drugs, or growing or importing Table 5 plants
      with intent to trade, with death or life imprisonment and a fine of 10,000 to 50,000
      dinars.
    sources:
      - law7
