segments:
  possession:
    text: >-
      Article 37 of Law 7 of 1990 punishes personal use, possession, purchase, transport or growing
      for personal use with three to fifteen years and a 1,000–5,000 dinar fine; the court may order
      six to twelve months' treatment instead, and a user who seeks treatment before prosecution can
      avoid it.[@law7,penal] "Imprisonment" in the Penal Code means three to fifteen years, which is
      why the article's bare wording is a long term.[@penal] Article 35 bis of 2002 lets a single act
      or a tiny quantity establish intent to traffic, so a possession case can escalate.[@law2002]
    sources:
      - law7
      - law2002
      - penal
    currency: LYD
    penalties:
      - label: Personal use, possession or growing
        treatment: criminal
        term: Personal use
        prison_min: 3 years
        prison: 15 years
        fine_min: 1000
        fine: 5000
        note: Article 37; treatment for six to twelve months may replace the penalty
      - label: Drug acts without intent to traffic or use
        treatment: criminal
        term: Other drug offence
        prison_min: 3 years
        prison: 10 years
        fine_min: 500
        fine: 3000
        note: Article 38
  cultivation:
    text: >-
      Growing for personal use falls under Article 37: three to fifteen years and a 1,000–5,000
      dinar fine.[@law7] Planting or trading Table 5 plants or their seeds with intent to traffic or
      promote is an Article 34 offence carrying death or life and a 10,000–50,000 dinar fine; death
      is mandatory where an aggravating fact applies.[@law7,law2002] There is no plant-count
      threshold.[@law7]
    sources:
      - law7
      - law2002
    currency: LYD
    penalties:
      - label: Growing for personal use
        treatment: criminal
        term: Personal use
        prison_min: 3 years
        prison: 15 years
        fine_min: 1000
        fine: 5000
      - label: Cultivation or plant trade with intent
        treatment: criminal
        term: Trafficking
        death: true
        fine_min: 10000
        fine: 50000
        note: Death or life imprisonment; death mandatory with Article 35(2) aggravating facts
  enforcement:
    text: >-
      Enforcement is split between eastern and western agencies and no national series is
      published.[@lana24,almenassa25] The eastern agency reported 2,073 drug arrests and 951 g of
      hashish in 2024, alongside much larger pill and cocaine seizures.[@lana24] Its Tripoli
      counterpart recorded 238 cannabis cases and 354 suspects in the first quarter of 2025, with
      about 359 kg seized.[@almenassa25] Courts imposed life terms for importing cannabis seeds in
      2025 and for a cultivation operation in 2026.[@libyaherald25,libyaobserver26a]
    sources:
      - lana24
      - almenassa25
      - libyaherald25
      - libyaobserver26a
  sharing:
    text: >-
      Supply with intent to traffic carries life or ten to fifteen years and a 5,000–20,000 dinar
      fine; supplying without payment carries three to fifteen years and a 2,000–5,000 dinar
      fine.[@law7] Importing, producing, manufacturing or promoting drugs, or trading Table 5 plants
      or seeds, with intent, carries death or life and a 10,000–50,000 dinar fine.[@law7,law2002]
      A place managed for drug use carries six months to three years.[@law7]
    sources:
      - law7
      - law2002
    currency: LYD
    penalties:
      - label: Supply with intent to traffic
        treatment: criminal
        term: Trafficking
        prison_min: 10 years
        prison: 15 years
        fine_min: 5000
        fine: 20000
        note: Life imprisonment is available
      - label: Supply without payment
        treatment: criminal
        term: Supply
        prison_min: 3 years
        prison: 15 years
        fine_min: 2000
        fine: 5000
      - label: Import, production or promotion with intent
        treatment: criminal
        term: Trafficking
        death: true
        fine_min: 10000
        fine: 50000
        note: Death or life; death mandatory with Article 35(2) aggravating facts
      - label: Premises managed for drug use
        treatment: criminal
        term: Premises
        prison_min: 6 months
        prison: 3 years
        fine_min: 100
        fine: 500
  consumption:
    text: >-
      Use is punished under Article 37 with three to fifteen years and a 1,000–5,000 dinar
      fine.[@law7] The court may order treatment for six to twelve months instead, and a user who
      comes forward for treatment before prosecution is not prosecuted.[@law7] There is no
      standalone lower penalty for consumption.[@law7]
    sources:
      - law7
    currency: LYD
    penalties:
      - label: Use
        treatment: criminal
        term: Personal use
        prison_min: 3 years
        prison: 15 years
        fine_min: 1000
        fine: 5000
  access:
    text: >-
      No legal source for personal use. Articles 30–31 allow licensed medical and scientific handling,
      including cultivation by public services and research centres, but not patient supply.[@law7]
      No medical cannabis programme or dispensary was found.[@law7]
    sources:
      - law7
answers:
  buy:
    answer: no
    text: No legal source; licensed medical and scientific handling only
context:
  recreational:
    text: >-
      All recreational use is prohibited. Personal use or possession carries three to fifteen years
      and a 1,000–5,000 dinar fine, and a single act or tiny quantity can be treated as trafficking
      under the 2002 amendment.[@law7,law2002] Import, production or cultivation with intent carries
      death or life, with death mandatory where an aggravating fact applies.[@law7]
      [The 1990 law set the framework.](/history/libya-narcotics-law-1990/)
    sources:
      - law7
      - law2002
  death_penalty:
    text: >-
      Death is prescribed by Article 34 for importing, exporting, producing, manufacturing or
      promoting drugs, or planting or trading Table 5 plants or seeds, with intent to traffic; the
      court may choose life instead. Death becomes mandatory where an Article 35(2) aggravating fact
      applies, such as a prior drug conviction, a minor, a school or an organised gang.[@law7,law2002]
      Simple possession and ordinary sale do not carry death.[@law7] No recent cannabis execution was
      found; the executions resumed in eastern Libya in August 2026 concerned military cases, while
      recent drug death sentences concerned pills.[@hrw_exec26,amnesty_exec26]
    sources:
      - law7
      - law2002
      - hrw_exec26
      - amnesty_exec26
  production:
    status: none
    text: >-
      No commercial cannabis production. Article 34 bans importing, exporting, producing, extracting,
      manufacturing or promoting narcotics, and planting Table 5 plants or seeds, outside the
      medical and scientific scheme.[@law7] Articles 30–31 allow cultivation only for medical or
      scientific institutions.[@law7]
    sources:
      - law7
  medical:
    text: >-
      No medical cannabis programme. Cannabis is a Table 1 narcotic and a Table 5 plant; Articles
      30–31 let the health committee license public services, scientific institutes and research
      centres to grow banned plants for medical or scientific work.[@law7] That is not a patient
      route, and no approved cannabis medicine or dispensary was found.[@law7]
    sources:
      - law7
  hemp:
    status: none
    text: >-
      No hemp or CBD regime and no THC threshold. Table 5 bans the cannabis plant at every stage,
      and Table 6 exempts only stalk fibre and roasted seeds that cannot germinate.[@law7] Growing
      low-THC hemp is not licensed.[@law7]
    sources:
      - law7
  consequences:
    text: >-
      A conviction can be published under Article 46, and licences can be revoked under Article
      47.[@law7] Article 49 allows residence restrictions, banishment and bans on certain professions
      for repeat felony offenders, and foreigners can face banishment.[@law7] The law also provides
      confiscation of drugs, equipment and proceeds.[@law7]
    sources:
      - law7
  planting:
    seeds: illegal
    seeds_trade: banned
    clones: illegal
    clones_trade: banned
    text: >-
      Article 30 bans growing, importing, owning, holding, buying or selling the listed plants at any
      stage of growth, as well as their seeds, except for licensed medical or scientific
      purposes.[@law7] Only cannabis seeds roasted so they cannot germinate, and stalk fibre, are
      exempt.[@law7] Personal growing or holding falls under Article 37; trade falls under Article 34.[@law7]
    sources:
      - law7
  clubs:
    status: none
    text: >-
      No cannabis clubs are known. Managing or preparing a place for paid drug use carries six months
      to three years, and supply is separately prohibited.[@law7]
    sources:
      - law7
  visitors:
    status: none
    text: >-
      There is no legal supply for visitors. They face the same offences, and a foreigner with repeat
      drug convictions can be banished under Article 49.[@law7]
    sources:
      - law7
  driving:
    status: impairment
    text: >-
      Traffic Law 11 of 1984, article 58, punishes driving a vehicle, cart or bicycle while
      intoxicated or narcotised with one to three years in prison, withdrawal of the licence for one
      to three years, and confiscation of the substances.[@traffic1984] There is no numeric THC
      limit; the trigger is a state of intoxication or narcosis.[@traffic1984]
    sources:
      - traffic1984
  black_market:
    text: >-
      Libya is a transit route for Moroccan resin and a smaller producer of its own. UNODC puts the
      2024 retail resin price at 20,000–35,000 dinars a kilogram and records four 2024 seizures worth
      8.37–14.65 million dinars.[@unodc_libya26] Reported seizures range from 951 g by the eastern
      agency in 2024 to 5.47 tonnes of resin at Misrata customs in June 2026; the figures cover
      different agencies and are not a time series.[@lana24,libyaobserver26b]
    sources:
      - unodc_libya26
      - lana24
      - libyaobserver26b
  arrests:
    text: >-
      No national arrest total was published. The eastern agency reported 2,073 drug arrests in 2024,
      with 951 g of hashish among much larger pill and cocaine seizures.[@lana24] The Tripoli agency
      recorded 351 cases and 550 suspects in the first quarter of 2025, including 238 cannabis cases
      and 354 suspects.[@almenassa25] In 2025 the eastern agency reported 6.4 tonnes of hashish, and
      Misrata customs seized 5.47 tonnes in June 2026.[@bignews25,libyaobserver26b]
    sources:
      - lana24
      - almenassa25
      - bignews25
      - libyaobserver26b
