name: Libya
region: Africa
iso_numeric: 434
recreational: death
medical: none
updated: "2026-10-28"
summary: >-
  Cannabis is banned in every form. Personal use or possession carries three to fifteen years;
  import, production or cultivation with intent to traffic carries death or life, and death is
  mandatory with aggravating facts.
