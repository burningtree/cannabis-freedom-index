segments:
  possession:
    text: >-
      Cannabis is a Category 2 narcotic under the Narcotics Hazard Prevention Act, alongside
      amphetamines. Possession carries up to two years in prison.
    sources:
      - ts
  cultivation:
    text: >-
      Growing cannabis was punished with a minimum of five years until the Constitutional Court
      found that disproportionate. A 2022 amendment set one to seven years and a fine of up to NT$1
      million for growing for personal use where circumstances are minor.
    sources:
      - tn
      - ts
  enforcement:
    text: >-
      Strictly enforced, with arrests rising and little political appetite for reform despite annual
      4/20 demonstrations in Taipei.
    sources:
      - ts
      - aj
  sharing:
    text: Selling can bring life imprisonment; giving it to others is also a serious offence.
    sources:
      - ts
  consumption:
    text: >-
      Use is a crime with up to three years. First-time users are normally sent to observation and
      rehabilitation instead of being prosecuted.
    sources:
      - ts
  access:
    text: None.
    sources:
      - aj
context:
  production:
    text: None; even industrial hemp cultivation is not permitted.
    sources:
      - aj
  products:
    text: >-
      CBD is regulated as a medicine and may be imported for personal use with a prescription; THC
      content must be negligible.
    sources:
      - aj
      - ts
  medical:
    text: No medical cannabis programme beyond prescription CBD.
    sources:
      - aj
  consequences:
    text: A conviction is a criminal record; rehabilitation orders are recorded.
    sources:
      - ts
