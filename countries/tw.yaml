name: Taiwan
region: Asia
iso_numeric: 158
recreational: illegal
medical: limited
updated: '2026-10-27'
summary: "Category 2 narcotic: up to three years for use; growing for personal use carries one to seven years since 2022, other cultivation at least five."
scores:
  possession: 0
  cultivation: 0
  enforcement: 1
  sharing: 0
  consumption: 0
  access: 0
segments:
  possession:
    currency: TWD
    penalties:
      - over: 0 g
        treatment: criminal
        prison: 2 years
        fine: 200000
        note: >-
          Ordinary Category 2 possession; the separate pure-narcotic threshold below increases the
          sentence
      - label: More than 20 g pure Category 2 narcotic
        treatment: criminal
        prison_min: 6 months
        prison: 5 years
        fine: 700000
        note: Pure narcotic weight, not 20 g of flower
    text: >-
      Cannabis is a Category 2 narcotic. Ordinary possession carries up to two years, detention or
      a fine up to NT$200,000. Above 20 g of pure Category 2 narcotic, the range is six months to
      five years, with an additional fine up to NT$700,000. Pure narcotic weight is not the gross
      weight of cannabis flower.[@moj]
    sources:
      - moj
  cultivation:
    currency: TWD
    penalties:
      - over: 0 plants
        treatment: criminal
        prison_min: 1 year
        prison: 7 years
        fine: 1000000
        note: >-
          Minor personal-use cultivation under article 12(3); the circumstances, not a plant-count
          cap, determine eligibility
      - label: Cultivation with intent to manufacture outside the minor personal-use tier
        treatment: criminal
        prison_min: 5 years
        prison: 15 years
        fine: 5000000
        note: >-
          Five-year minimum under article 12(2); ordinary fixed-term ceiling under Criminal Code
          article 33
    text: >-
      Cultivating cannabis with intent to manufacture narcotics carries at least five years and an
      optional fine up to NT$5 million. Since 4 May 2022, minor personal-use cases carry one to
      seven years and an optional fine up to NT$1 million.[@moj,mojhistory] The lower band
      requires those circumstances; it is not a permitted plant allowance.[@courtclarification]
      The ordinary fixed-term ceiling for the general tier is fifteen years, before any separately
      applicable enhancement.[@code33]
    sources:
      - moj
      - mojhistory
      - courtclarification
      - code33
  enforcement:
    text: >-
      Strictly enforced, with arrests rising and little political appetite for reform despite annual
      4/20 demonstrations in Taipei.
    sources:
      - ts
      - aj
  sharing:
    text: Selling can bring life imprisonment; giving it to others is also a serious offence.
    sources:
      - ts
  consumption:
    text: >-
      Use is a crime with up to three years. First-time users are normally sent to observation and
      rehabilitation instead of being prosecuted.
    sources:
      - ts
  access:
    text: >-
      Individual prescription imports of CBD medicines are possible; specified hospitals may apply
      for controlled cannabinoid preparations for two rare epilepsy syndromes. Routine operating
      THC supply was not verified.[@moh2020]
    sources:
      - moh2020
context:
  production:
    status: none
    text: None; even industrial hemp cultivation is not permitted.
    sources:
      - aj
  medical:
    text: >-
      CBD medicines have a prescription-and-import route, with individual approval required for
      personal imports.[@moh2020] The Health Ministry also describes a special hospital
      application route for controlled cannabinoid preparations for Dravet and Lennox–Gastaut
      syndromes.[@moh2020] This is a narrow authorisation framework; routine patient dispensing of
      THC preparations was not established in the reviewed evidence.[@moh2020]
    sources:
      - moh2020
  consequences:
    text: A conviction is a criminal record; rehabilitation orders are recorded.
    sources:
      - ts
  planting:
    seeds: illegal
    seeds_trade: banned
    clones: illegal
    clones_trade: banned
    text: >-
      The Narcotics Hazard Prevention Act names cannabis seeds directly. Possessing them
      carries up to one year in prison, possessing or transferring them with intent to sell up
      to two years, and transporting or selling them for cultivation at least two years
      (Articles 13 and 14). Growing the plant is a crime under Article 12, with one to seven
      years where the case is minor and for personal use.
    sources:
      - moj
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited.
    sources:
      - tn
      - ts
  visitors:
    status: none
    text: >-
      Customs warns against importing cannabis flower, wax, gummies and vape oil, even from places
      where they are legal.[@customs2024] Transporting Category 2 narcotics under Article 4 carries
      life imprisonment or at least ten years, with a possible fine up to NT$15 million; Article 17
      allows a reduction for a confessed, minor personal-use transport offence.[@moj] Ordinary
      possession separately carries up to two years, detention or NT$200,000; more than 20 g pure
      narcotic brings six months to five years and a possible additional fine up to NT$700,000. Flower
      weight alone does not establish that pure-drug threshold.[@moj]
    sources:
      - customs2024
      - moj
  driving:
    status: zero
    text: >-
      The Road Traffic Management and Penalty Act punishes a driver found by a test to have
      taken drugs, narcotics or similar controlled substances, with no level set. Car drivers
      are fined 30,000 to 120,000 New Taiwan dollars and motorcyclists 15,000 to 90,000; the
      vehicle is removed and the licence suspended for one to two years, or revoked for good
      after a crash causing serious injury or death. Refusing the test costs 180,000 dollars
      and the licence, and officers may take the driver for sampling by force.
    sources:
      - rtmpa35
  arrests:
    text: >-
      The Taiwan High Prosecutors' Office reported in October 2024 that seizures of
      cannabis reached 2.3 tonnes in 2023, 9.7 times the 240.5 kg of 2021, and that 15,360
      plants were seized in the first eight months of 2024. It described cannabis as one
      of the most popular narcotics in Taiwan and increasingly used by young people.
      Prosecutors said they would keep offering drug users deferred prosecution with
      addiction treatment, after which 22.5 per cent reoffend, a lower rate than after the
      other measures. The report gave no count of people charged over cannabis.
    sources:
      - tt24
  black_market:
    text: >-
      The Taiwan High Prosecutors' Office
      reported 2.3 tonnes of cannabis seized in 2023, against 240.5 kg in 2021, and 15,360
      plants in the first eight months of 2024. Prosecutors called cannabis one of the most popular narcotics in
      Taiwan.
    sources:
      - tt24
  recreational:
    text: >-
      Holding, using and growing cannabis remain controlled offences; the lower personal-growing
      band still carries prison.[@moj] The court identifies very small crops for the grower’s own
      use as an example of a minor case, leaving the assessment to judges.[@courtclarification]
      There is no adult-use retail permission in these provisions.[@moj]
    sources:
      - moj
      - courtclarification
  hemp:
    status: strict
    text: >-
      CBD is regulated separately from cannabis and THC as a medicine.[@moh2020] Product-specific
      exceptions need separate reading: the 2026 cosmetics guidance allows hemp-seed oil
      ingredients only with a final-product THC residue of no more than 10 ppm.[@cosmetics2026]
      That cosmetic threshold is not a permission to grow cannabis plants.[@moj,cosmetics2026]
    sources:
      - moh2020
      - cosmetics2026
      - moj
