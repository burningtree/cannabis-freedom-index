answers:
  caught:
    answer: 'no'
    label: Prison
    text: >-
      Possession can bring prison; more than 20 g of pure Category 2 narcotic carries six months
      to five years
  buy:
    answer: limited
    text: >-
      Narrow prescription/import and special hospital authorisation routes exist; routine THC
      dispensing was not verified
