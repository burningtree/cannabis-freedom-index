name: Taiwan
region: Asia
iso_numeric: 158
recreational: illegal
medical: limited
updated: '2026-10-27'
summary: "Category 2 narcotic: up to three years for use; growing for personal use carries one to seven years since 2022, other cultivation at least five."
scores:
  possession: 0
  cultivation: 0
  enforcement: 1
  sharing: 0
  consumption: 0
  access: 0
segments:
  possession:
    currency: TWD
    penalties:
      - over: 0 g
        treatment: criminal
        term: Possession
        prison: 2 years
        fine: 200000
        note: >-
          Ordinary Category 2 possession; the separate pure-narcotic threshold below increases the
          sentence
      - label: More than 20 g pure Category 2 narcotic
        treatment: criminal
        term: Possession
        prison_min: 6 months
        prison: 5 years
        fine: 700000
        note: Pure narcotic weight, not 20 g of flower
    text: >-
      Cannabis is a Category 2 narcotic. Ordinary possession carries up to two years, detention or
      a fine up to NT$200,000. Above 20 g of pure Category 2 narcotic, the range is six months to
      five years, with an additional fine up to NT$700,000. Pure narcotic weight is not the gross
      weight of cannabis flower.[@moj]
    sources:
      - moj
  cultivation:
    currency: TWD
    penalties:
      - over: 0 plants
        treatment: criminal
        term: Personal growing
        prison_min: 1 year
        prison: 7 years
        fine: 1000000
        note: >-
          Minor personal-use cultivation under article 12(3); the circumstances, not a plant-count
          cap, determine eligibility
      - label: Cultivation with intent to manufacture outside the minor personal-use tier
        treatment: criminal
        term: Cultivation
        prison_min: 5 years
        prison: 15 years
        fine: 5000000
        note: >-
          Five-year minimum under article 12(2); ordinary fixed-term ceiling under Criminal Code
          article 33
    text: >-
      Cultivating cannabis with intent to manufacture narcotics carries at least five years and an
      optional fine up to NT$5 million. Since 4 May 2022, minor personal-use cases carry one to
      seven years and an optional fine up to NT$1 million.[@moj,mojhistory] The lower band
      requires those circumstances; it is not a permitted plant allowance.[@courtclarification]
      The ordinary fixed-term ceiling for the general tier is fifteen years, before any separately
      applicable enhancement.[@code33]
    sources:
      - moj
      - mojhistory
      - courtclarification
      - code33
  enforcement:
    text: >-
      Enforcement remains strict. Prosecutors reported 2,493 kg of cannabis and 13,917 plants seized
      in 2024, with 1,305 people prosecuted for cannabis use; the 2025 annual report recorded
      1,469.1 kg, and a single Taichung seizure in June 2026 reached 766 kg.[@hpo25,report25,tt26]
      Border interceptions rose even as the annual total fell, so the series are not directly
      comparable.[@mof26] Annual 4/20 rallies continue, but no reform has passed.[@green26]
    sources:
      - hpo25
      - report25
      - tt26
      - mof26
      - green26
  sharing:
    text: >-
      Manufacturing, transporting or selling a Category 2 narcotic carries life imprisonment or at
      least ten years, with a fine up to NT$15 million.[@moj] Possession with intent to sell carries
      at least five years, and transferring or giving it to another person six months to five
      years.[@moj] Sale or transfer to a minor or pregnant woman can be increased by up to one
      half.[@moj] A public official who uses their position for the same conduct can face death or
      life.[@moj]
    sources:
      - moj
    currency: TWD
    penalties:
      - label: Manufacture, transport or sale (article 4)
        treatment: criminal
        term: Trafficking
        prison_min: 10 years
        fine: 15000000
        note: Life imprisonment is the maximum
      - label: Possession with intent to sell (article 5)
        treatment: criminal
        term: Possession for sale
        prison_min: 5 years
        fine: 5000000
      - label: Transfer or gift (article 8)
        treatment: criminal
        term: Supply
        prison_min: 6 months
        prison: 5 years
        fine: 700000
      - label: Public official using office (article 15)
        treatment: criminal
        term: Official trafficking
        death: true
        note: Death or life imprisonment; the only capital cannabis route
  consumption:
    text: >-
      Use of a Category 2 narcotic carries up to three years.[@moj] First-time users are normally
      sent to observation and rehabilitation for up to two months, then compulsory treatment for six
      to twelve months, with non-prosecution after completion; a repeat within three years is
      prosecuted.[@moj] The 2004 procedure set the earlier five-year rule.[@report25]
    sources:
      - moj
      - report25
    currency: TWD
    penalties:
      - label: Use (article 10)
        treatment: criminal
        term: Personal use
        prison: 3 years
        note: First use normally leads to observation and treatment rather than prosecution
  access:
    text: >-
      A narrow patient route exists for one CBD medicine: Epidyolex was licensed on 19 January 2024
      and reimbursed from 1 April 2024 for Dravet syndrome and tuberous sclerosis complex, with
      strict prescribing criteria.[@epidyolex,nhi24] Individual imports of CBD medicines are also
      possible with a prescription, and specified hospitals may apply for controlled cannabinoid
      preparations.[@moh2020] No general THC or flower supply was verified, so the access score
      stays at zero.[@moh2020]
    sources:
      - epidyolex
      - nhi24
      - moh2020
context:
  production:
    status: none
    text: >-
      No lawful cannabis production. Cannabis plants remain Category 2 narcotics even for fibre or
      seed, and no industrial-hemp cultivation exception exists.[@moj] Article 12 makes cultivation
      with intent to manufacture an offence of at least five years, or one to seven years for minor
      personal use.[@moj]
    sources:
      - moj
  medical:
    text: >-
      A patient route exists for one CBD medicine. Epidyolex was licensed on 19 January 2024 and
      reimbursed from 1 April 2024 for Dravet syndrome from age two and tuberous sclerosis complex
      from age one, after at least three anti-epileptic drugs have failed.[@epidyolex,nhi24] Only
      paediatric or neurology specialists may prescribe it, with annual review.[@nhi24] Individual
      CBD imports and a special hospital route for controlled cannabinoid preparations remain
      available, but no general THC or flower dispensing was verified.[@moh2020]
    sources:
      - epidyolex
      - nhi24
      - moh2020
  consequences:
    text: A conviction is a criminal record; rehabilitation orders are recorded.[@moj] A foreigner
      convicted can also be deported and banned from re-entry.[@customs2024]
    sources:
      - moj
      - customs2024
  planting:
    seeds: illegal
    seeds_trade: banned
    clones: illegal
    clones_trade: banned
    text: >-
      The Narcotics Hazard Prevention Act names cannabis seeds directly.[@moj] Possessing them
      carries up to one year in prison, possessing or transferring them with intent to sell up
      to two years, and transporting or selling them for cultivation up to two years.[@moj]
      (Articles 13 and 14). Growing the plant is a crime under Article 12, with one to seven
      years where the case is minor and for personal use.[@moj]
    sources:
      - moj
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited.[@moj,tn]
    sources:
      - moj
      - tn
  visitors:
    status: none
    text: >-
      Customs warns against importing cannabis flower, wax, gummies and vape oil, even from places
      where they are legal.[@customs2024] Transporting Category 2 narcotics under Article 4 carries
      life imprisonment or at least ten years, with a possible fine up to NT$15 million; Article 17
      allows a reduction for a confessed, minor personal-use transport offence.[@moj] Ordinary
      possession separately carries up to two years, detention or NT$200,000; more than 20 g pure
      narcotic brings six months to five years and a possible additional fine up to NT$700,000. Flower
      weight alone does not establish that pure-drug threshold.[@moj]
    sources:
      - customs2024
      - moj
  driving:
    status: consumption
    text: >-
      The Road Traffic Management and Penalty Act punishes a driver found by a test to have taken
      drugs with the maximum statutory fine: NT$120,000 for a motorcycle and NT$150,000 for a car,
      with the vehicle impounded and the licence revoked.[@rtmpa35] Refusing the drug test costs
      NT$270,000 and the licence, and a person confirmed by police to have used drugs can lose the
      licence without driving.[@rtmpa35] The Criminal Code separately sets a urine THC-COOH
      threshold of 15 ng/mL and an impairment route, with fatal drug-driving carrying three to ten
      years.[@crim185]
    sources:
      - rtmpa35
      - crim185
  arrests:
    text: >-
      The High Prosecutors' Office reported 2,493 kg of cannabis and 13,917 plants seized in 2024,
      with 1,305 people prosecuted for cannabis use; the annual drug report gives a slightly lower
      2,323.3 kg for the same year.[@hpo25,report24] In 2025 the annual report recorded 1,469.1 kg,
      48 drug labs and 13 cultivation sites, while a September sweep arrested 245 people.[@report25,newtalk25]
      The figures combine herbal cannabis and derivatives and do not give a resin-only series.[@report25]
    sources:
      - hpo25
      - report24
      - report25
      - newtalk25
  black_market:
    text: >-
      Reported cannabis seizures reached 2.3 tonnes in 2023, against 240.5 kg in 2021, and the
      High Prosecutors' Office counted 2,493 kg and 13,917 plants in 2024.[@tt24,hpo25] The 2025
      total fell to 1,469.1 kg, but Taipei Customs alone intercepted 1,602 kg of cannabis and
      derivatives that year.[@report25,mof26] A single Taichung case in June 2026 found 766.09 kg of
      dried flower, the largest in a decade.[@tt26] No herb/resin split is published.[@report25]
    sources:
      - tt24
      - hpo25
      - report25
      - mof26
      - tt26
  recreational:
    text: >-
      Holding, using and growing cannabis remain controlled offences; the lower personal-growing
      band still carries prison.[@moj] The court identifies very small crops for the grower’s own
      use as an example of a minor case, leaving the assessment to judges.[@courtclarification]
      There is no adult-use retail permission in these provisions.[@moj]
    sources:
      - moj
      - courtclarification
  death_penalty:
    text: >-
      Ordinary cannabis possession, use, cultivation, transfer and sale are not capital; the maximum
      for sale or transport is life imprisonment.[@moj] The only capital route is article 15(1): a
      public official who uses their position to manufacture, transport or sell a Category 2 narcotic
      may receive death or life.[@moj] No cannabis death sentence or execution was found.[@moj]
    sources:
      - moj
  research:
    status: licensed
    text: >-
      Article 18 permits possession of controlled drugs for medical, research or training purposes,
      and the Controlled Drugs Act licenses institutions.[@moj] No cannabis research programme,
      licence or clinical trial was found.[@moj]
    sources:
      - moj
  hemp:
    status: none
    text: >-
      No hemp cultivation regime and no THC threshold for growers. Cannabis plants remain Category 2
      narcotics even for fibre or seed.[@moj] CBD is regulated as a medicine, and the 2026 cosmetics
      guidance allows hemp-seed oil only where the finished product has no more than 10 ppm THC; that
      residue limit is not a permission to grow hemp.[@cosmetics2026,moj]
    sources:
      - cosmetics2026
      - moj
