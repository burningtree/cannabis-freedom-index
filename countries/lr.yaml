segments:
  possession:
    text: >-
      The 2023 amendments to the Controlled Drugs and Substances Act separated users from
      traffickers. Use or possession for personal use is a bailable second-degree felony with three
      to eighteen months in prison — down from five to twenty years under the old law.
    sources:
      - nd
      - idpc
  cultivation:
    text: Cultivation is a non-bailable first-degree felony with ten to twenty years.
    sources:
      - nd
  enforcement:
    text: >-
      Much lighter for users than before 2023, but still prison, and far heavier for anything
      classed as dealing.
    sources:
      - nd
      - idpc
  sharing:
    text: Sale and trafficking are non-bailable, with ten to twenty years.
    sources:
      - nd
  consumption:
    text: Consumption is covered by the same three-to-eighteen-month offence.
    sources:
      - nd
  access:
    text: None.
    sources:
      - idpc
