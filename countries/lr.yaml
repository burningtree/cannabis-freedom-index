  planting:
    seeds: grey
    seeds_trade: unclear
    clones: illegal
    clones_trade: banned
    text: >-
      Section 14.108 of the Controlled Drugs and Substances Act 2014 makes it an offence to
      plant, cultivate or culture a scheduled plant without a licence from the Minister, and
      the Act names the cannabis plant in its definition of cultivation. The 2014 text does
      not mention seeds; the 2023 amendments were not read.
    sources:
      - cdsa14
