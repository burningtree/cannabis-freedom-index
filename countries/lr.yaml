name: Liberia
region: Africa
iso_numeric: 430
recreational: illegal
medical: none
updated: "2026-10-21"
summary: >-
  Cannabis use carries four months to one year on a first offence under the 2023 law. Possession
  and growing for personal use are separate felonies; trafficking is non-bailable.
scores:
  possession: 1
  cultivation: 1
  enforcement: 1
  sharing: 1
  consumption: 1
  access: 0
segments:
  possession:
    text: >-
      Section 14.89 makes unlicensed possession or purchase an offence. For Schedule I cannabis it
      distinguishes first-degree felony possession for trafficking from second-degree felony
      possession otherwise. Second-degree cases require cash bail worth twice the bond. The
      penalty paragraph gives 10–20 years or the Penal Law’s sentencing rules; those rules
      ordinarily cap a second-degree felony at five years, leaving the interaction of the two
      clauses unresolved.
    sources:
      - cdsa23
      - penal
  cultivation:
    text: >-
      Section 14.90 distinguishes growing Schedule I cannabis for trafficking, a non-bailable
      first-degree felony, from growing otherwise, a second-degree felony with cash bail worth
      twice the bond. Its penalty clause gives 10–20 years or sentencing under Penal Law sections
      50.5–50.6. No personal plant allowance is specified.
    sources:
      - cdsa23
  enforcement:
    text: >-
      The enacted 2023 law requires cash bail for cannabis-use cases and denies bail for
      first-degree trafficking offences. First-time Schedule I use carries four months to one
      year; repeat use is a second-degree felony carrying one to five years or more under the
      stated sentencing references.
    sources:
      - cdsa23
  sharing:
    text: >-
      Giving cannabis away is covered by the supply offence and the definition of trafficking.
      Schedule I trafficking is a first-degree felony, non-bailable, carrying 10–20 years or
      sentencing under Penal Law sections 50.5–50.6.
    sources:
      - cdsa23
  consumption:
    text: >-
      Section 14.91(a) makes unauthorised use of Schedule I drugs a first-degree misdemeanor with
      four months to one year, escalating on second apprehension to a second-degree felony with
      one to five years or more under the sentencing references. Cash bail is required. Cannabis,
      resin, extracts and tinctures are listed in Schedule I. The express rehabilitation
      alternative appears in the separate paragraph for Schedules II–IV.
    sources:
      - cdsa23
  access:
    text: None.
    sources:
      - idpc
context:
  production:
    text: None.
    sources:
      - idpc
  products:
    text: None.
    sources:
      - idpc
  medical:
    text: No medical cannabis.
    sources:
      - idpc
  consequences:
    text: >-
      Section 14.100 requires immediate deportation of a non-Liberian convicted of an offence
      under the drug law after serving the sentence or sanction. Section 14.101 requires drug
      clearance for admission, enrolment or employment in public institutions and directs private
      institutions to introduce such measures; failure to comply can justify refusal.
    sources:
      - cdsa23
  planting:
    seeds: illegal
    seeds_trade: banned
    clones: illegal
    clones_trade: banned
    text: >-
      Section 14.82 expressly includes cannabis seeds and all parts of the plant in its definition
      of cannabis, covering viable seeds and cuttings. It excludes sterilised seeds that cannot
      germinate, mature stalks and fibre, and seed oil or cake. Unlicensed possession, supply and
      cultivation are offences under sections 14.85, 14.89 and 14.90.
    sources:
      - cdsa23
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited.
    sources:
      - cdsa23
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for visitors. Under section 14.100, a non-Liberian
      convicted of any crime in the drug-law subchapter must be deported immediately after serving
      the sentence or sanction, including convictions for use.
    sources:
      - cdsa23
  driving:
    status: impairment
    text: >-
      The government-published Vehicle and Traffic Law section 10.90 prohibits operating a motor
      vehicle when alcohol or a narcotic drug impairs driving ability, and covers non-narcotic
      drugs causing dizziness or inability to drive safely. It also has a separate
      habitual-narcotic-user prohibition, so not every limb requires proof of impairment on that
      occasion. Lawful entitlement to use a drug is expressly no defence. The published statute
      lists a $1,000 fine ceiling or one year’s imprisonment; current currency treatment,
      amendments and tariffs were not certified. Section 2.61 requires licence revocation on a
      section 10.90 conviction; under section 2.69 a new application may be made after one year
      from surrender, subject to investigation and licensing conditions. The implied
      specimen-consent and refusal-hearing provisions concern alcohol and were not treated as
      cannabis-testing powers. Current drug-specific testing rules and a THC cutoff remain
      unverified.
    sources:
      - trafficPublished
  black_market:
    text: >-
      Figures reported by the government to the UN drugs office record 2,581 kg of herbal cannabis
      seized in 2024, against 596 kg in 2023. The UN publishes them as kilogram equivalents, and
      countries count seizures differently, so the figures are not comparable across borders.
    sources:
      - unodc_szr
