segments:
  possession:
    text: >-
      Recreational possession remains a crime under the narcotics law. The 2021 Cannabis Act did not
      change that: it covers only licensed medicinal, scientific and research activity.
    sources:
      - loc
  cultivation:
    text: Growing cannabis without a licence is an offence under the Cannabis Act.
    sources:
      - act
      - loc
  enforcement:
    text: >-
      Criminal penalties apply to users and unlicensed growers; no source consulted gives reliable
      detail on sentencing practice.
    sources:
      - loc
  sharing:
    text: Unlicensed distribution is an offence.
    sources:
      - act
  consumption:
    text: Recreational use remains illegal.
    sources:
      - loc
  access:
    text: None for the public.
    sources:
      - loc
context:
  production:
    text: >-
      Two laws of 20 May 2021 created a licensing system: the medicines regulator licenses
      cultivation, manufacture, storage, distribution, import and export of cannabis for medicinal,
      scientific or research purposes, and a separate Act covers hemp at up to 0.3% THC. They
      followed a 2019 cabinet decision to pursue cannabis exports.
    sources:
      - loc
      - hemp
  products:
    text: Licensed medicinal products and industrial hemp.
    sources:
      - act
      - hemp
  medical:
    text: Provided for under licence; practical patient access is minimal.
    sources:
      - loc
  consequences:
    text: A conviction is a criminal record.
    sources:
      - loc
  planting:
    seeds: licensed
    seeds_trade: regulated
    clones: licensed
    clones_trade: regulated
    text: >-
      The Industrial Hemp Act 2021 defines hemp to include viable seed with no more than 0.3%
      THC and requires a licence to grow, process, distribute or buy it. It has separate
      sections on importing and exporting hemp seed, on the varieties that may be grown and on
      seed production and multiplication. The Act comes into force only on a date the minister
      appoints.
    sources:
      - iha
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited.
    sources:
      - act
      - loc
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. British travel advice says it is
      illegal to possess or use drugs, including marijuana, and that drug use and smuggling
      are serious offences.
    sources:
      - loc
      - fcdo
