name: Zambia
region: Africa
iso_numeric: 894
recreational: illegal
medical: limited
updated: 2026-10-23
summary: >-
  The Cannabis Act of 2021 would license medicinal growing, but it has not come into force.
  Industrial hemp has been under licence since 3 January 2025. Possession without lawful
  authority remains a serious offence.
scores:
  possession: 0
  cultivation: 0
  enforcement: 1
  sharing: 0
  consumption: 1
  access: 0
segments:
  possession:
    text: >-
      The Narcotic Drugs and Psychotropic Substances Act, in force since 20 May 2021, makes
      possession of a drug without lawful authority an offence of up to fifteen years. For
      cannabis, that Act provides an admission-of-guilt fine of up to 1,200 penalty units.
      Since 16 January 2026 the Controlled Substances Act also makes possession of a listed
      controlled substance, without authorisation under that Act or another written law, an
      offence of up to fifteen years, and it lists cannabis and cannabis resin. The Cannabis
      Act, which would license medicinal activity, has not come into force.
    sources:
      - ndps
      - csa
  cultivation:
    text: >-
      Growing a plant that can be used as a drug, without lawful authority, is an offence
      under the Narcotic Drugs and Psychotropic Substances Act: a fine of up to one million
      penalty units, up to ten years, or both. The Cannabis Act would require a licence to
      grow cannabis for medicine or research, but that Act has not come into force.
    sources:
      - ndps
      - act
  enforcement:
    text: >-
      Possession and unauthorised cultivation are criminal offences. No source consulted
      gives reliable detail on how often courts jail users.
    sources:
      - ndps
  sharing:
    text: >-
      Trading in a drug without lawful authority can bring up to twenty-five years under the
      Narcotic Drugs and Psychotropic Substances Act. Producing, importing, selling or
      distributing a drug for cultivation or manufacture, without lawful authority, can bring
      one to fifteen years. The Cannabis Act's distribution licence is not in force.
    sources:
      - ndps
  consumption:
    text: >-
      Using a drug without lawful authority is an offence under the Narcotic Drugs and
      Psychotropic Substances Act: a fine of up to 200,000 penalty units, or up to two years.
    sources:
      - ndps
  access:
    text: >-
      There is no public retail. The Cannabis Act's medicinal licences are not in force.
      Industrial hemp may be grown, processed and sold under a licence.
    sources:
      - act
      - hemp
context:
  production:
    text: >-
      The Cannabis Act was published on 20 May 2021. It comes into operation only on a date
      the Minister appoints, and ZambiaLII records that it has not come into force. It would
      let the medicines regulator license cultivation, manufacture, production, storage,
      distribution, import and export for medicinal, scientific or research purposes. The
      Industrial Hemp Act, published the same day, has been in force since 3 January 2025.
      It licenses growing, processing, distribution, buying, export and research on hemp of
      not more than 0.3% THC.
    sources:
      - act
      - hemp
      - hemporder
  products:
    text: >-
      Industrial hemp is licensed under the Act in force since 3 January 2025. Cannabis and
      cannabis resin are listed as narcotic drugs under the Controlled Substances Act, in
      force since 16 January 2026, which licenses manufacture, import, export and dealing in
      controlled substances. The Cannabis Act's own medicinal-production licences are not in
      force.
    sources:
      - hemp
      - csa
      - act
  medical:
    text: >-
      The Cannabis Act's licensing system for medicinal cannabis has not come into force.
      The Controlled Substances Act, in force since 16 January 2026, licences controlled
      substances used as medicine and lists cannabis. No commenced Cannabis Act programme
      for patients was read.
    sources:
      - act
      - csa
  consequences:
    text: A conviction under the narcotics law is a criminal conviction.
    sources:
      - ndps
  planting:
    seeds: licensed
    seeds_trade: regulated
    clones: licensed
    clones_trade: regulated
    text: >-
      The Industrial Hemp Act has been in force since 3 January 2025. It defines industrial
      hemp to include viable seed with no more than 0.3% THC, and a person must not grow,
      process, distribute, buy, export or research it without a licence. Import and export
      of hemp seed must follow this Act and the seed and plant-pest laws. The Minister may
      prescribe the varieties that may be grown.
    sources:
      - hemp
      - hemporder
  clubs:
    status: none
    text: >-
      No cannabis clubs are known. Growing a plant for use as a drug, and trading in a drug,
      are both offences without lawful authority.
    sources:
      - ndps
  visitors:
    status: none
    text: >-
      There is no legal recreational supply. Possession of cannabis without lawful authority
      is a crime under the narcotics law. The Cannabis Act's medicinal licences are not in
      force.
    sources:
      - ndps
      - act
  driving:
    status: impairment
    text: >-
      Road Traffic Act section 157 prohibits driving or attempting to drive on a road when
      intoxicating liquor or narcotic drugs make proper vehicle control impossible. It
      provides a fine up to 20,000 penalty units, up to five years' imprisonment, or both;
      penalty units are not a kwacha amount. Section 156 separately covers being in charge
      while not driving and has different penalties. The Third Schedule requires licence
      suspension and endorsement for section 157, with cancellation also available; no
      universal suspension length is specified in that table. The 2022 amendment requires
      a medical examination or breathalyser test after arrest under either section, with
      the medical examination conducted by a medical practitioner. This is an impairment
      rule, not a specified THC concentration limit.
    sources:
      - road2002
      - road2022
  black_market:
    text: >-
      Figures reported by the government to the UN drugs office record 15,606 kg of herbal
      cannabis seized in 2024, against 16,577 kg in 2023. The UN publishes them as
      kilogram equivalents, and countries count seizures differently, so the figures are
      not comparable across borders.
    sources:
      - unodc_szr
