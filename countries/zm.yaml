segments:
  possession:
    text: >-
      Recreational possession remains a crime under the narcotics law. The 2021 Cannabis Act did not
      change that: it covers only licensed medicinal, scientific and research activity.
    sources:
      - loc
  cultivation:
    text: Growing cannabis without a licence is an offence under the Cannabis Act.
    sources:
      - act
      - loc
  enforcement:
    text: >-
      Criminal penalties apply to users and unlicensed growers; no source consulted gives reliable
      detail on sentencing practice.
    sources:
      - loc
  sharing:
    text: Unlicensed distribution is an offence.
    sources:
      - act
  consumption:
    text: Recreational use remains illegal.
    sources:
      - loc
  access:
    text: None for the public.
    sources:
      - loc
context:
  production:
    text: >-
      Two laws of 20 May 2021 created a licensing system: the medicines regulator licenses
      cultivation, manufacture, storage, distribution, import and export of cannabis for medicinal,
      scientific or research purposes, and a separate Act covers hemp at up to 0.3% THC. They
      followed a 2019 cabinet decision to pursue cannabis exports.
    sources:
      - loc
      - hemp
  products:
    text: Licensed medicinal products and industrial hemp.
    sources:
      - act
      - hemp
  medical:
    text: Provided for under licence; practical patient access is minimal.
    sources:
      - loc
  consequences:
    text: A conviction is a criminal record.
    sources:
      - loc
  planting:
    seeds: licensed
    seeds_trade: regulated
    clones: licensed
    clones_trade: regulated
    text: >-
      The Industrial Hemp Act 2021 defines hemp to include viable seed with no more than 0.3%
      THC and requires a licence to grow, process, distribute or buy it. It has separate
      sections on importing and exporting hemp seed, on the varieties that may be grown and on
      seed production and multiplication. The Act comes into force only on a date the minister
      appoints.
    sources:
      - iha
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited.
    sources:
      - act
      - loc
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. Recreational possession remains a crime
      under the narcotics law; the Cannabis Act of 2021 covers only licensed medicinal,
      scientific and research activity.
    sources:
      - loc
  driving:
    status: impairment
    text: >-
      Road Traffic Act section 157 prohibits driving or attempting to drive on a road when
      intoxicating liquor or narcotic drugs make proper vehicle control impossible. It
      provides a fine up to 20,000 penalty units, up to five years' imprisonment, or both;
      penalty units are not a kwacha amount. Section 156 separately covers being in charge
      while not driving and has different penalties. The Third Schedule requires licence
      suspension and endorsement for section 157, with cancellation also available; no
      universal suspension length is specified in that table. The 2022 amendment requires
      a medical examination or breathalyser test after arrest under either section, with
      the medical examination conducted by a medical practitioner. This is an impairment
      rule, not a specified THC concentration limit.
    sources:
      - road2002
      - road2022
  black_market:
    text: >-
      Figures reported by the government to the UN drugs office record 15,606 kg of herbal
      cannabis seized in 2024, against 16,577 kg in 2023. The UN publishes them as
      kilogram equivalents, and countries count seizures differently, so the figures are
      not comparable across borders.
    sources:
      - unodc_szr
