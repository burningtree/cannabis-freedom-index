name: Nigeria
region: Africa
iso_numeric: 566
recreational: illegal
medical: none
updated: 2026-10-24
summary: >-
  Possession carries long mandatory prison terms under the NDLEA Act. The compiled Indian Hemp Act
  still prints death or at least 21 years for cultivation. A 2026 bill to repeal that Act is before
  the Senate and is not law.
scores:
  possession: 0
  cultivation: 0
  enforcement: 1
  sharing: 0
  consumption: 1
  access: 0
segments:
  possession:
    text: >-
      Under the NDLEA Act, possession of cannabis ('Indian hemp') without lawful authority carries a
      prison term of not less than fifteen and not more than twenty-five years. In practice many
      small cases end in much shorter sentences through plea deals or lesser charges — but the
      statutory minimum is among the highest anywhere.
    sources:
      - om
      - lii
  cultivation:
    text: >-
      A 2017 review of West African drug laws summarises the NDLEA Act as punishing production,
      planting or growing with life imprisonment. Section 2(1) of the compiled Indian Hemp Act
      sentences a person who knowingly plants or cultivates any plant of the genus cannabis
      either to death or to imprisonment for not less than 21 years. A 2026 bill transmitted to
      the Senate would repeal that Act. It has been referred for legislative processing and is
      not law.
    sources:
      - idpc17
      - iha
      - naltf
      - om
  enforcement:
    text: >-
      The drug agency runs constant raids, farm destructions and arrests. Nigeria has one of the
      largest populations of cannabis users in the world, so the law touches very large numbers of
      people.
    sources:
      - aa
      - om
  sharing:
    text: >-
      Selling, buying, offering for sale or otherwise dealing carries life imprisonment under
      the NDLEA Act. In July 2025 the Federal High Court in Ibadan gave a man 16 years for
      dealing in 407 grams of cannabis, noting he was not a first offender.
    sources:
      - idpc17
      - gaz25
      - aa
  consumption:
    text: >-
      The NDLEA Act makes no distinction between possession and use: both carry fifteen to
      twenty-five years. The Indian Hemp Act separately sets at least four years, with no option
      of a fine, for smoking Indian hemp or knowingly possessing it, and at least five for
      possessing a pipe or other smoking utensil.
    sources:
      - idpc17
      - iha
  access:
    text: >-
      None: the NDLEA Act punishes possession, growing and dealing alike, with no lawful channel
      for adults.
    sources:
      - idpc17
  context:
  death_penalty:
    text: >-
      Section 2(1) of the compiled Indian Hemp Act sentences knowing cultivation of any cannabis
      plant either to death or to imprisonment for not less than 21 years. Sale and export under
      the same compilation are prison terms of not less than 21 years. A 2026 bill transmitted
      to the Senate would repeal the Indian Hemp Act and the NDLEA Act together. It has been
      referred for legislative processing and is not law.
    sources:
      - iha
      - naltf
  production:
    text: >-
      None. Bills to license medical and industrial cannabis have been introduced in the National
      Assembly without passing; the drug agency opposes them. When the governor of Ondo State, where
      much cannabis is grown, was reported to have urged the federal government to take medical
      cultivation seriously after a visit to Thailand with the agency's head, the agency denied it
      and said the trip had been about moving farmers away from drug crops.
    sources:
      - om
      - cgh
  products:
    text: None.
    sources:
      - om
  medical:
    text: No medical cannabis programme.
    sources:
      - om
  consequences:
    text: >-
      A conviction is a criminal record; the agency also pushes drug testing for students,
      politicians and couples before marriage.
    sources:
      - om
  planting:
    seeds: illegal
    seeds_trade: banned
    clones: illegal
    clones_trade: banned
    text: >-
      The Indian Hemp Act defines Indian hemp as "any plant or part of a plant of the genus
      cannabis", with no exception for seed, and makes it an offence knowingly to plant or
      cultivate any cannabis plant, as well as to import, sell or possess Indian hemp.
    sources:
      - iha
  black_market:
    text: >-
      The whole market is illegal and largely home-grown. A 2019 UN survey documented 8,900
      hectares of cannabis across six southern states; cultivation is concentrated in Ekiti,
      Ondo, Ogun, Oyo and Osun in the South-West and Delta and Edo in the South-South, while
      use is rising among young people in northern states such as Kano, Kaduna and Borno. The
      drug agency NDLEA destroyed 847 hectares of plantations in 2013 and more than 4,500 in
      2014, and has destroyed many farms since 2021, yet growing continues. In 2023 the agency
      set up an alternative development unit to move cannabis farmers to food crops and
      livestock.
    sources:
      - nan25
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited.
    sources:
      - om
      - aa
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. The penalties are fifteen to twenty-five
      years for possession or use under the drug agency's Act, and at least four years with no
      option of a fine for smoking or possessing Indian hemp under the older Act.
    sources:
      - idpc17
      - iha
  arrests:
    text: >-
      The drug agency NDLEA reports its figures for all drugs together. Its chairman said that
      between January 2021 and March 2025 it arrested 62,595 suspects, 68 of them described as
      drug barons, secured 11,628 convictions and seized about 10.3 million kg of drugs. In
      the first ten months of 2025 it reported more than 16,304 arrests, about 3,000
      convictions and 4.5 million kg seized. Cannabis is counted separately only by land:
      1,331 hectares of cannabis farms destroyed in the four-year period and 612 hectares from
      January to October 2025.
    sources:
      - ndlea25
      - ndlea25b
  driving:
    status: impairment
    text: >-
      Section 22 of the Federal Road Safety Commission Act prohibits driving on a highway
      under the influence of intoxicating drugs, including inability to maintain proper
      control of the vehicle. It provides a fine of 5,000 naira, up to two years in prison,
      or both on conviction. The separate 0.5 g/l value in the section concerns alcohol,
      not THC. FRSC's published notice-of-offence schedule lists drug/alcohol driving as
      five points and a 5,000-naira payment; that payment schedule does not replace the
      court's imprisonment power. A THC concentration limit and a fixed licence-ban
      duration were not established in the sources reviewed.
    sources:
      - frscact
      - frscdui
