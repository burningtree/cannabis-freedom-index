name: Northern Cyprus
region: Europe
disputed:
  part_of: cy
  note: >-
    The Turkish Republic of Northern Cyprus has governed the north of the island since 1974 and
    declared independence in 1983. Only Turkey recognises it; other countries regard it as part of
    the Republic of Cyprus, whose law is not applied there.
flag: 🏳️
recreational: illegal
medical: none
updated: '2026-10-29'
summary: >-
  Cannabis possession and use remain criminal offences, but eligible people can accept supervised
  treatment before sentence. Successful completion avoids a sentence and a conviction entry. Growing
  and supply are excluded from that route, and people who breach its conditions can return to
  sentencing.
scores:
  possession: 1
  cultivation: 0
  enforcement: 2
  sharing: 0
  consumption: 1
  access: 0
segments:
  possession:
    text: >-
      Possession remains a criminal offence. The 2016 law offers eligible people convicted of
      possession or use supervised release before sentence, involving one to three years of
      monitoring, treatment or rehabilitation. Successful completion means no sentence and no
      conviction entered on the record; refusing the option or breaching its conditions returns the
      case to the ordinary process.[@treatment] Ordinary cannabis offences fall under the general
      maximum of fifteen years; the reviewed text and appellate judgment give a fine alternative, or
      both punishments.[@druglaw,appeal15] The judgment reproduces the general fine ceiling as TRY50
      after redenomination.[@appeal15]
    sources:
      - treatment
      - druglaw
      - appeal15
    currency: TRY
    penalties:
      - label: Unlawful cannabis possession — ordinary statutory maximum
        treatment: criminal
        term: Article 24(2)(A)
        prison: 15 years
        fine: 50
        note: Prison or a fine, or both; eligible defendants may complete supervised treatment instead
  cultivation:
    text: >-
      Growing any Cannabis sativa plant is an offence; prosecutors do not need to prove that it has
      flowering or fruiting tops.[@druglaw] The ordinary maximum is fifteen years or a fine, or
      both; the appellate judgment reproduces the general fine ceiling as TRY50.[@druglaw,appeal15]
      Cultivation convictions are excluded from the [2016 treatment
      route](/history/northern-cyprus-drug-treatment-option-2016/).[@treatment] In a [2019
      case](https://tracker.cannabisfreedom.fyi/report/northern-cyprus-three-plants-sentence-2019/), three plants and importation of 3
      g led together to eighteen months in prison.[@grow19]
    sources:
      - druglaw
      - appeal15
      - treatment
      - grow19
    currency: TRY
    penalties:
      - label: Growing Cannabis sativa without lawful authority
        treatment: criminal
        term: Articles 8 and 24(2)(A)
        prison: 15 years
        fine: 50
        note: Prison or a fine, or both; growing excluded from supervised treatment
  enforcement:
    text: >-
      The law provides a conditional treatment route alongside criminal prosecution. It excludes
      supply and growing convictions, and bars repeat access for a similar conviction within three
      years after completing an earlier programme.[@treatment] At Nicosia’s June 2025 court closing
      session, a board member reported 42 beneficiaries over the period beginning in September 2023
      and programmes for 36 people continuing. Those are general drug-case figures presented at that
      court, without a separate cannabis count.[@court2025] In [September 2026](https://tracker.cannabisfreedom.fyi/report/northern-cyprus-treatment-programme-report-2026/), an official account reported 218 supervised-release participants across drug cases.[@pio26]
    sources:
      - treatment
      - court2025
      - pio26
  sharing:
    text: >-
      Unlawful cannabis supply falls under the general drug-offence provision, with up to fifteen
      years in prison or a fine, or both.[@druglaw] The appellate judgment reproduces the general
      fine ceiling as TRY50; the higher annex-drug maxima concern a separate statutory
      list.[@appeal15,druglaw] Selling and trading convictions are excluded from the
      supervised-treatment route.[@treatment]
    sources:
      - druglaw
      - appeal15
      - treatment
    currency: TRY
    penalties:
      - label: Unlawful cannabis supply
        treatment: criminal
        term: Article 24(2)(A)
        prison: 15 years
        fine: 50
        note: Prison or a fine, or both; supply excluded from supervised treatment
  consumption:
    text: >-
      Use remains a drug offence. The supervised-release law covers eligible people convicted of
      using drugs, with a treatment option before sentence; monitoring includes regular blood and
      urine testing under the programme.[@treatment] Ordinary offences under the drug law carry up
      to fifteen years or a fine, or both; the appellate judgment gives the general fine ceiling as
      TRY50.[@druglaw,appeal15]
    sources:
      - treatment
      - druglaw
      - appeal15
    currency: TRY
    penalties:
      - label: Unlawful cannabis use — ordinary statutory maximum
        treatment: criminal
        term: Article 24(2)(A)
        prison: 15 years
        fine: 50
        note: Prison or a fine, or both; eligible defendants may complete supervised treatment instead
  access:
    text: >-
      There is no general recreational retail route under the drug law’s controlled possession and
      distribution provisions.[@druglaw] Allowing premises to be used for cannabis smoking or
      trading is itself an offence.[@druglaw]
    sources:
      - druglaw
context:
  production:
    status: none
    text: >-
      Cannabis cultivation is a criminal offence under section 8 of the drug law.[@druglaw]
      Premises used for cannabis smoking or trading are also prohibited.[@druglaw] The treatment
      programme excludes growing, manufacture and supply convictions.[@treatment]
    sources:
      - druglaw
      - treatment
  medical:
    text: >-
      Cannabis import requires a licence under the northern drug law; a prescription alone is not
      that permission.[@druglaw] Manufacture and distribution are also subject to
      authorisation.[@druglaw] The supervised-release programme provides treatment for drug use and
      dependence, rather than a route to prescribed cannabis products.[@treatment]
    sources:
      - druglaw
      - treatment
  consequences:
    text: >-
      Successful completion of supervised treatment avoids both a sentence and entry of the
      conviction on the criminal record.[@treatment] Refusal or breach returns the person to the
      ordinary sentencing process.[@treatment] Participants must provide blood and urine tests at least once every fifteen days; certified poverty exempts them from the state laboratory testing fee.[@treatment] The drug law also permits confiscation and disposal
      of the seized substance even where a defendant is not convicted.[@druglaw]
    sources:
      - treatment
      - druglaw
  clubs:
    status: none
    text: >-
      Allowing premises to be used for smoking or trading cannabis is expressly
      criminalised.[@druglaw] Growing and supply convictions also fall outside supervised
      treatment.[@treatment]
    sources:
      - druglaw
      - treatment
  visitors:
    status: none
    text: >-
      Non-citizens are excluded from supervised release if they are in the territory unlawfully, or
      if the court considers they seek it to remain there instead of receiving treatment or
      rehabilitation.[@treatment] The law’s personal-import route lists cannabis and resin at twelve
      grams in its schedule, with further court assessment for quantities outside the schedule.
      These are sentencing rules for an offence, so importing cannabis remains unlawful.[@treatment]
    sources:
      - treatment
  recreational:
    text: >-
      Adults have no general permission to buy, hold or grow cannabis for recreation.[@druglaw]
      Eligible people convicted of possession or use can accept supervised treatment before
      sentencing under the [2016
      law](/history/northern-cyprus-drug-treatment-option-2016/).[@treatment] Growing and supply
      convictions are excluded, so a few home-grown plants do not receive that treatment
      option.[@treatment]
    sources:
      - druglaw
      - treatment
  hemp:
    status: none
    text: >-
      The growing prohibition covers any Cannabis sativa plant.[@druglaw] It requires
      no proof that flowers or fruiting tops have developed.[@druglaw] The reviewed provision
      contains no THC percentage exemption for a household hemp crop.[@druglaw]
    sources:
      - druglaw
  planting:
    seeds: grey
    seeds_trade: unclear
    clones: illegal
    clones_trade: banned
    text: >-
      Growing any Cannabis sativa plant is an offence, and the law expressly dispenses with proof
      of flowering or fruiting tops.[@druglaw] A young plant or rooted cutting therefore falls
      under the cultivation prohibition.[@druglaw] The definition of cannabis concerns flowering
      or fruiting tops and separately covers resin; the reviewed text does not settle standalone
      seed trade, so that exclusion does not give permission to plant seeds.[@druglaw]
    sources: [druglaw]
  driving:
    status: zero
    text: >-
      The [2022 road-safety law](/history/northern-cyprus-road-drug-testing-law-2022/) sets the
      drug threshold at zero units in a biological sample for every driver.[@road22] Police can
      require saliva screening on reasonable suspicion or after a traffic accident, with biological
      samples analysed at the state laboratory.[@road22] A conviction can bring up to two years
      in prison, a fine of up to five monthly gross minimum wages at the time of the offence,
      or both; the court can also disqualify the driver.[@road22]
    sources: [road22]
  black_market:
    text: >-
      Cannabis remains an illicit market under the possession, supply and cultivation
      prohibitions.[@druglaw] In an [August 2026 Famagusta operation](https://tracker.cannabisfreedom.fyi/report/northern-cyprus-famagusta-seizure-2026/),
      police reported 1.2 kg of suspected cannabis and a precision scale, arresting two men.[@seizure26]
      The case was still under investigation when announced; the seizure is a local enforcement
      example, with no national market-size estimate in that report.[@seizure26]
    sources: [druglaw, seizure26]
  culture:
    text: >-
      The [2026 school survey](/history/northern-cyprus-school-survey-2026/) analysed 1,049 students in northern Cyprus and reported 1.2% had used cannabis in their lifetime.[@survey26]
      It covered the 2025–2026 study period and also asked about alcohol, tobacco and gambling.[@survey26]
      The findings were presented at an August 2026 scientific panel in Kyrenia.[@survey26]
    sources: [survey26]
