  access: 0
segments:
  possession:
    text: >-
      Possession is a criminal offence tried in the Heavy Criminal Court. In one reported case a
      young first offender caught with 14 g and later 12 g of cannabis, plus half a gram of cocaine,
      was sentenced to a year in prison, with the judge treating the small amount and the fact that
      cannabis is among the lightest drugs as mitigation.
    sources:
      - kg
  cultivation:
    text: >-
      Growing is a criminal offence. No tolerated number of plants is known.
    sources:
      - kg
      - wiki
  enforcement:
    text: >-
      Prison sentences for small amounts are routine, and local courts report them regularly.
    sources:
      - kg
  sharing:
    text: >-
      Supply is prosecuted as dealing, with longer prison terms than for possession.
    sources:
      - kg
  consumption:
    text: >-
      Use is illegal. A first 420 gathering was held in north Nicosia in 2015, and in April 2017
      protesters outside parliament called for regulated sale and use.
    sources:
      - wiki
  access:
    text: >-
      No legal source.
    sources:
      - wiki
context:
  production:
    text: >-
      None. In 2020 a governing-party deputy said that producing medical cannabis might be discussed
      in parliament; no law followed that could be confirmed.
    sources:
      - wiki
  products:
    text: >-
      No legal cannabis products are known.
    sources:
      - wiki
  medical:
    text: >-
      No medical programme could be confirmed. The medical cannabis laws passed in 2017 and 2019
      were those of the Republic of Cyprus, in the south.
    sources:
      - wiki
  consequences:
    text: >-
      Surveys between 2003 and 2015 found that 4.5% to 7.7% of adults had tried cannabis, the most
      widely used illegal drug among Turkish Cypriots.
    sources:
      - wiki
