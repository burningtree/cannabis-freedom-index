name: Northern Cyprus
region: Europe
disputed:
  part_of: cy
  note: >-
    The Turkish Republic of Northern Cyprus has governed the north of the island since 1974 and
    declared independence in 1983. Only Turkey recognises it; other countries regard it as part of
    the Republic of Cyprus, whose law is not applied there.
flag: 🏳️
recreational: illegal
medical: none
updated: "2026-10-25"
summary: >-
  Cannabis possession and use remain criminal offences, but eligible people can accept supervised
  treatment before sentence. Successful completion avoids a sentence and a conviction entry. Growing
  and supply are excluded from that route, and people who breach its conditions can return to
  sentencing.
scores:
  possession: 1
