name: Northern Cyprus
region: Europe
disputed:
  part_of: cy
  note: >-
    The Turkish Republic of Northern Cyprus has governed the north of the island since 1974 and
    declared independence in 1983. Only Turkey recognises it; other countries regard it as part of
    the Republic of Cyprus, whose law is not applied there.
flag: "🏳️"
population:
  2025: 380000
cannabis_use:
  prevalence: 5.7
  estimate: true
  users: 14000
recreational: illegal
medical: none
updated: 2026-10-04
summary: >-
  Possession of a few grams is tried in the criminal courts and regularly ends in prison. Cannabis
  is the most widely used illegal drug among Turkish Cypriots, and there have been small protests
  calling for legalisation.
scores:
  possession: 0
