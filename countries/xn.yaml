  enforcement: 2
  sharing: 0
  consumption: 1
  access: 0
segments:
  possession:
    text: >-
      Possession remains a criminal offence. The 2016 law offers eligible people convicted of
      possession or use supervised release before sentence, involving one to three years of
      monitoring, treatment or rehabilitation. Successful completion means no sentence and no
      conviction entered on the record; refusing the option or breaching its conditions returns the
      case to the ordinary process.[@treatment]
    sources:
      - treatment
  cultivation:
    text: >-
      Growing remains a drug offence, and the supervised-release law expressly excludes people
      convicted of growing plants from its treatment alternative to sentencing.[@treatment]
    sources:
      - treatment
  enforcement:
    text: >-
      The law provides a conditional treatment route alongside criminal prosecution. It excludes
      supply and growing convictions, and bars repeat access for a similar conviction within three
      years after completing an earlier programme.[@treatment] At Nicosia’s June 2025 court closing
      session, a board member reported 42 beneficiaries over the period beginning in September 2023
      and programmes for 36 people continuing. Those are general drug-case figures presented at
      that court, without a separate cannabis count.[@court2025]
    sources:
      - treatment
      - court2025
  sharing:
    text: >-
      The supervised-release law excludes people convicted of selling or trading drugs from its
      treatment route. It offers no comparable supply route alongside the provisions for possession,
      use and qualifying personal imports.[@treatment]
    sources:
      - treatment
  consumption:
    text: >-
      Use remains a drug offence. The supervised-release law covers eligible people convicted of
      using drugs, with a treatment option before sentence; monitoring includes regular blood and
      urine testing under the programme.[@treatment]
    sources:
      - treatment
  access:
    text: "No legal source: possession, growing and supply are all prosecuted as criminal offences."
    sources:
      - kg
context:
  production:
    text: >-
      None. In 2020 a governing-party deputy said that producing medical cannabis might be discussed
      in parliament; no law followed that could be confirmed.
    sources:
      - wiki
  products:
    text: No legal cannabis products are known.
    sources:
      - wiki
  medical:
    text: >-
      No medical programme could be confirmed. The medical cannabis laws passed in 2017 and 2019
      were those of the Republic of Cyprus, in the south.
    sources:
      - wiki
  consequences:
    text: >-
      Surveys between 2003 and 2015 found that 4.5% to 7.7% of adults had tried cannabis, the most
      widely used illegal drug among Turkish Cypriots.
    sources:
      - wiki
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited.
    sources:
      - kg
      - wiki
  visitors:
    status: none
    text: >-
      Non-citizens are excluded from supervised release if they are in the territory unlawfully, or
      if the court considers they seek it to remain there instead of receiving treatment or
      rehabilitation.[@treatment] The law’s personal-import route lists cannabis and resin at twelve
      grams in its schedule, with further court assessment for quantities outside the schedule.
      These are sentencing rules for an offence, so importing cannabis remains unlawful.[@treatment]
    sources:
      - treatment
