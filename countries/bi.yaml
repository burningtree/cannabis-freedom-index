name: Burundi
region: Africa
iso_numeric: 108
recreational: illegal
medical: none
updated: "2026-10-21"
summary: >-
  Cannabis possession and use are crimes; judges can impose one to five years in prison, a fine, or
  both.
scores:
  possession: 1
  cultivation: 1
  enforcement: 1
  sharing: 1
  consumption: 1
  access: 0
segments:
  possession:
    text: >-
      Illicit possession of a controlled drug carries one to five years in prison, a fine of 50,000
      to 100,000 Burundian francs, or both, under Article 510 of the 2017 Penal Code. The code
      leaves drug classification to health-ministry orders.
    sources:
      - cp17
  cultivation:
    text: >-
      Growing narcotic plants is prohibited outside conditions set by the health ministry. The
      general regulatory offence carries one to five years in prison, a fine of 100,000 to 250,000
      Burundian francs, or both. The code separately punishes illicit production with ten to fifteen
      years and a fine up to one million francs, and orders confiscated crops destroyed.
    sources:
      - cp17
  enforcement:
    text: >-
      Mainline's country briefing reports that people who use drugs face arrest, imprisonment or
      fines. Its interviewees described court supervision for consumption as rarely implemented
      because institutions lacked staff and resources. These accounts cover drugs generally; the
      report gives no cannabis-specific imprisonment rate.
    sources:
      - ml
  sharing:
    text: >-
      Helping someone else use a controlled drug, for payment or free, carries one to five years in
      prison and a fine of 50,000 to one million Burundian francs. This includes providing a place
      for use. Production, import, manufacture and export carry ten to fifteen years and a fine up
      to one million francs; organised-group penalties are doubled.
    sources:
      - cp17
  consumption:
    text: >-
      Illicit consumption carries one to five years in prison, a fine of 50,000 to 100,000 Burundian
      francs, or both. Judges must also impose supervision intended to prevent repeat offending.
      This can include treatment after medical assessment or training, with further imprisonment if
      ordered care or training is refused.
    sources:
      - cp17
  access:
    text: >-
      Growing, selling, transporting and holding controlled drugs are prohibited outside conditions
      set by the health ministry. The reviewed sources establish no authorised supply for
      recreational users.
    sources:
      - cp17
      - ml
context:
  production:
    text: No licensed production.
    sources:
      - wiki
  products:
    text: No legal products.
    sources:
      - wiki
  medical:
    text: The retained sources do not establish whether a medical cannabis programme operates.
    sources: []
  consequences:
    text: >-
      The drug provisions require confiscation of controlled plants and substances and equipment
      used for consumption, manufacture or transport. Courts must order confiscated crops destroyed;
      the offender bears the cost when authorities carry out the destruction.
    sources:
      - cp17
  visitors:
    status: none
    text: >-
      The reviewed sources establish no legal recreational supply for visitors. Illicit possession
      or consumption carries one to five years in prison, a fine of 50,000 to 100,000 Burundian
      francs, or both.
    sources:
      - cp17
      - ml
