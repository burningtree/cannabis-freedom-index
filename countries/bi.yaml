name: Burundi
region: Africa
iso_numeric: 108
recreational: illegal
medical: none
updated: 2026-10-12
summary: Holding or consuming cannabis carries one to five years in prison under the Penal Code.
scores:
  possession: 1
  cultivation: 1
  enforcement: 1
  sharing: 1
