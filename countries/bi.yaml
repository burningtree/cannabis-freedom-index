segments:
  possession:
    text: >-
      Illegal under the 2009 Penal Code: anyone who unlawfully holds or consumes a narcotic faces
      one to five years in prison and a fine of 50,000 to 100,000 francs, or one of the two.
    sources:
      - wiki
  cultivation:
    text: Cultivation is a crime.
    sources:
      - wiki
  enforcement:
    text: Prison is a real outcome for users, and there are few health-based alternatives.
    sources:
      - ml
  sharing:
    text: >-
      No current sentence for trafficking was found. British travel advice says to expect a long
      jail sentence and heavy fines for possessing, using or smuggling drugs. A 1977 report recorded
      only fines, of 100 to 100,000 francs, for growing, transporting or possessing cannabis, and
      said enforcement was rare.
    sources:
      - fcdo
      - wiki
  consumption:
    text: >-
      Use is punished like possession: British travel advice says to expect a long jail sentence and
      heavy fines for possessing, using or smuggling drugs.
    sources:
      - fcdo
  access:
    text: No legal source.
    sources:
      - wiki
context:
  production:
    text: No licensed production.
    sources:
      - wiki
  products:
    text: No legal products.
    sources:
      - wiki
  medical:
    text: The retained sources do not establish whether a medical cannabis programme operates.
    sources: []
  consequences:
    text: The retained sources do not establish collateral consequences beyond the penalties described above.
    sources: []
  planting:
    seeds: grey
    seeds_trade: unclear
    clones: illegal
    clones_trade: banned
    text: >-
      According to a 2025 country sheet by the harm-reduction group Mainline, Article 490 of
      the Penal Code prohibits growing, selling, carrying, holding and using narcotic drugs
      except as allowed by order of the health ministry. The sheet does not mention seeds, and
      the code itself was not read.
    sources:
      - ml
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited.
    sources:
      - wiki
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. British travel advice says illegal
      drugs, including cannabis, carry severe penalties and tells travellers to expect a long
      jail sentence and heavy fines for possessing, using or smuggling them, also when only
      changing planes. Airport scanners are also used on the baggage of passengers in transit.
    sources:
      - wiki
      - fcdo
