segments:
  possession:
    text: >-
      Illegal under the 2009 Penal Code: anyone who unlawfully holds or consumes a narcotic faces
      one to five years in prison and a fine of 50,000 to 100,000 francs, or one of the two.
    sources:
      - cr
      - wiki
  cultivation:
    text: Cultivation is a crime.
    sources:
      - wiki
  enforcement:
    text: Prison is a real outcome for users, and there are few health-based alternatives.
    sources:
      - ml
      - cr
  sharing:
    text: Trafficking carries up to twenty years.
    sources:
      - cr
  consumption:
    text: Consumption is punished on the same terms as possession.
    sources:
      - cr
  access:
    text: No legal source.
    sources:
      - wiki
