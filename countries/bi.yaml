segments:
  possession:
    text: >-
      The Penal Code as revised in 2017 prohibits possessing narcotics, defined as the
      substances and plants that a health ministry order classes as such. The penalty is one to
      five years of penal servitude, a fine of 100,000 to 250,000 Burundian francs, or one of
      the two.
    sources:
      - cp17
  cultivation:
    text: >-
      Growing narcotic plants is prohibited by the same articles of the Penal Code, with one to
      five years of penal servitude, a fine of 100,000 to 250,000 Burundian francs, or one of
      the two.
    sources:
      - cp17
  enforcement:
    text: Prison is a real outcome for users, and there are few health-based alternatives.
    sources:
      - ml
  sharing:
    text: >-
      Selling and transporting narcotics fall under the same articles of the 2017 Penal Code as
      possession: one to five years of penal servitude, a fine of 100,000 to 250,000 Burundian
      francs, or one of the two. No heavier tier for trafficking was found in those articles. A
      1977 report recorded only fines, of 100 to 100,000 francs, for growing, transporting or
      possessing cannabis, and said enforcement was rare.
    sources:
      - cp17
      - wiki
  consumption:
    text: >-
      Consuming narcotics is prohibited alongside possession and carries the same penalty: one
      to five years of penal servitude, a fine of 100,000 to 250,000 Burundian francs, or one of
      the two.
    sources:
      - cp17
  access:
    text: >-
      No legal source: the Penal Code's drug articles make growing narcotic plants and holding
      or supplying narcotics offences.
    sources:
      - cp17
context:
  production:
    text: No licensed production.
    sources:
      - wiki
  products:
    text: No legal products.
    sources:
      - wiki
  medical:
    text: The retained sources do not establish whether a medical cannabis programme operates.
    sources: []
  consequences:
    text: The retained sources do not establish collateral consequences beyond the penalties described above.
    sources: []
  planting:
    seeds: grey
    seeds_trade: unclear
    clones: illegal
    clones_trade: banned
    text: >-
      According to a 2025 country sheet by the harm-reduction group Mainline, Article 490 of
      the Penal Code prohibits growing, selling, carrying, holding and using narcotic drugs
      except as allowed by order of the health ministry. The sheet does not mention seeds, and
      the code itself was not read.
    sources:
      - ml
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited.
    sources:
      - wiki
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. The Penal Code punishes possessing,
      consuming, transporting or selling narcotics with one to five years of penal servitude, a
      fine of 100,000 to 250,000 Burundian francs, or one of the two.
    sources:
      - cp17
