name: Oman
region: Asia
iso_numeric: 512
recreational: death
medical: none
updated: 2026-10-12
summary: Minimum prison terms for possession; trafficking can carry the death penalty.
scores:
  possession: 0
  cultivation: 0
  enforcement: 1
  sharing: 0
  consumption: 0
  access: 0
segments:
  possession:
    text: >-
      Under the new narcotics law issued by Royal Decree 67/2026, anyone who possesses, acquires or
      buys drugs for their own consumption faces one to three years in prison and a fine of 1,000 to
      5,000 rials.
    sources:
      - rd67
      - gn
      - oo
  cultivation:
    text: >-
      Growing a listed plant for personal use falls under the same one-to-three-year provision of
      Article 41; growing for trafficking is punished far more heavily.
    sources:
      - rd67
      - gn
  enforcement:
    text: >-
      Mandatory prison for users. The death penalty applies to smuggling for trafficking in
      aggravated cases such as repeat offences, abuse of office or involvement with international
      gangs.
    sources:
      - hoc
      - gn
  sharing:
    text: >-
      Possessing, selling or distributing for trafficking carries a minimum of 15 years and a fine
      of 10,000 to 25,000 rials.
    sources:
      - gn
      - oo
  consumption:
    text: Use is covered by the personal-consumption offence.
    sources:
      - oo
  access:
    text: None.
    sources:
      - gn
context:
  death_penalty:
    text: >-
      The death penalty applies to smuggling for trafficking in aggravated cases such as repeat
      offences, abuse of office or involvement with international gangs.
    sources:
