name: Oman
region: Asia
iso_numeric: 512
recreational: death
medical: none
updated: 2026-10-25
summary: >-
  Personal possession, use and growing carry one to three years and a fine, with treatment
  alternatives for established dependence. Unpaid supply carries seven to fifteen years;
  specified import and production offences for trade can bring death or life imprisonment.
