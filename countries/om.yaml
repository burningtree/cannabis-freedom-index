segments:
  possession:
    text: >-
      Article 41 sets one to three years in prison and a fine of 1,000–5,000 rials for possessing,
      buying or producing drugs, or growing listed plants, for personal use. A court can order
      residential or specialist outpatient treatment instead for established dependence. Residential
      treatment lasts six months to one year, with release decided by the court on a committee’s
      recommendation.[@rd67]
    sources:
      - rd67
  cultivation:
    text: >-
      Articles 3 and 7 prohibit unauthorised growing of listed plants and reserve growing licences for
      specified public bodies, colleges and research institutions for medical or scientific purposes.
      Cannabis is expressly listed. Personal-use growing carries one to three years and a fine of
      1,000–5,000 rials under article 41; growing for trade falls under article 37’s death-or-life
      range and fine of 35,000–60,000 rials.[@rd67]
    sources:
      - rd67
  enforcement:
    text: >-
      Personal possession, growing and use carry one to three years, with treatment alternatives for
      established dependence. Article 57 separately punishes refusal of a drug-test sample in
      specified circumstances, including possession of drugs or equipment, signs of use in public, a
      prosecution arrest order, or a report by relatives: six months to three years and a fine of
      100–1,000 rials. Specified import, manufacture and growing offences for trade carry death or life imprisonment.
      Smuggling for trade and specified aggravated supply cases carry death.[@rd67]
    sources:
      - rd67
  sharing:
    text: >-
      Under article 39, supplying drugs for consumption or preparing premises for use without payment
      carries seven to fifteen years and a fine of 5,000–15,000 rials. Article 38 separately sets at
      least fifteen years and a fine of 10,000–25,000 rials for trading, including transfers made for
      that purpose, and supply for payment.[@rd67]
    sources:
      - rd67
  consumption:
    text: >-
      Article 41 expressly punishes unauthorised use with the same one-to-three-year prison range and
      1,000–5,000-rial fine as personal holdings. Article 43 protects people seeking treatment
      voluntarily or through specified relatives before they are caught using or prosecuted. Treatment
      information is confidential under article 44.[@rd67]
    sources:
      - rd67
  access:
    text: >-
      There is no recreational supply route. Articles 9 and 15 restrict authorised drug dealings to
      listed medical, pharmaceutical, veterinary, public and research bodies, and article 27 requires
      a licensed doctor’s prescription for pharmacy dispensing.[@rd67]
    sources:
      - rd67
context:
  death_penalty:
    text: >-
      Article 37 sets death or life imprisonment and a fine of 35,000–60,000 rials for specified
      unauthorised import, export, production, manufacture and growing offences for trade. Smuggling
      for trade and its listed aggravated cases require death. Trading and supplying for payment are
      separately punished under article 38, starting at fifteen years.[@rd67]
    sources:
      - rd67
  production:
    text: >-
      Reliable national information about lawful cannabis production was not established by the
      retained sources.
    sources: []
  products:
    text: >-
      Reliable national information about legally available cannabis products was not established by
      the retained sources.
    sources: []
  medical:
    text: The retained sources do not establish whether a medical cannabis programme operates.
    sources: []
  consequences:
    text: >-
      Article 61 requires permanent deportation of foreigners convicted under the law, except its
      residual article 56 offences. It also reaches repeated accusations on serious grounds and
      acquittals on formal grounds when evidence indicates involvement. Article 60 allows additional
      measures for convicted Omanis, including health monitoring, residence restrictions, a travel ban
      and community service; article 51 provides for confiscation of drugs and property or vehicles
      used in offences.[@rd67]
    sources:
      - rd67
  planting:
    seeds: illegal
    seeds_trade: banned
    clones: illegal
    clones_trade: banned
    text: >-
      Article 3 prohibits unauthorised growing and dealings in listed plants, their parts at every
      growth stage and their seeds. Schedule 5 expressly names male and female cannabis; schedule 6
      exempts stalk fibres and seeds treated so they cannot germinate. Article 7 permits growing
      licences for specified public bodies, colleges and research institutions for medical or
      scientific purposes.[@rd67]
    sources:
      - rd67
  clubs:
    status: none
    text: >-
      The statute provides no recreational cannabis-club route. Unauthorised personal growing and
      supplying another person are criminal, including supply without payment.[@rd67]
    sources:
      - rd67
  visitors:
    status: none
    text: >-
      There is no recreational supply route. Personal possession, use and growing carry one to three
      years and a fine of 1,000–5,000 rials, with treatment alternatives for established dependence.
      Article 61 provides for permanent deportation of foreign offenders, apart from the residual
      article 56 offences.[@rd67]
    sources:
      - rd67
  driving:
    status: impairment
    text: >-
      The amended Traffic Law article 50 bis prohibits driving on a road under the influence of
      alcohol, a narcotic or another psychotropic substance. The police-published text provides one to
      six months’ imprisonment and OMR400–800; illness or inability to work exceeding 30 days raises
      this to six to twelve months and OMR600–1,200, while death or permanent total disability brings
      one to three years and OMR1,500–3,000. Stronger penalties under other laws are reserved. Article
      49 separately punishes refusal of a breath sample or medical detection test where police have
      offence-related grounds to believe the person used these substances: one to three months and
      OMR200–500. Article 54 allows the court to withdraw a driving licence for up to one year, or two
      years for repetition. A numeric THC cutoff, specimen-specific confirmation rules and later
      implementing-regulation details were not established.
    sources:
      - trafficRop
      - traffic2016
