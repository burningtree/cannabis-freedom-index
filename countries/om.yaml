segments:
  possession:
    text: >-
      Under the new narcotics law issued by Royal Decree 67/2026, anyone who possesses, acquires or
      buys drugs for their own consumption faces one to three years in prison and a fine of 1,000 to
      5,000 rials.
    sources:
      - gn
      - oo
  cultivation:
    text: >-
      Producing for personal consumption falls under the same one-to-three-year provision; producing
      for trafficking is punished far more heavily.
    sources:
      - gn
  enforcement:
    text: >-
      Mandatory prison for users. The death penalty applies to smuggling for trafficking in
      aggravated cases such as repeat offences, abuse of office or involvement with international
      gangs.
    sources:
      - hoc
      - gn
  sharing:
    text: >-
      Possessing, selling or distributing for trafficking carries a minimum of 15 years and a fine
      of 10,000 to 25,000 rials.
    sources:
      - gn
      - oo
  consumption:
    text: Use is covered by the personal-consumption offence.
    sources:
      - oo
  access:
    text: None.
    sources:
      - gn
