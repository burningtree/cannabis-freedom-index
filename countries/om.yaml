  medical:
    text: No medical cannabis.
    sources:
      - gn
  consequences:
    text: Foreigners are deported after serving their sentence.
    sources:
      - oo
  planting:
    seeds: illegal
    seeds_trade: banned
    clones: illegal
    clones_trade: banned
    text: >-
      The 2026 narcotics law bans growing, holding, buying or selling a listed plant, any part
      of it at any stage of growth, and its seeds. Cannabis is on the list. Only cannabis
      seeds treated so they cannot germinate, and stalk fibre, are exempt. The law defines
      cultivation as starting with sowing for germination, and licences to grow go only to
      state bodies and recognised research institutes.
    sources:
      - rd67
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited, and the law provides for the death
      penalty for the most serious drug offences.
    sources:
      - rd67
      - gn
      - oo
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. Under the narcotics law issued by Royal
      Decree 67/2026, anyone who possesses, acquires or buys drugs for their own consumption
      faces one to three years in prison and a fine of 1,000 to 5,000 rials.
    sources:
      - rd67
      - gn
      - oo
  driving:
    status: impairment
    text: >-
      The amended Traffic Law article 50 bis prohibits driving on a road under the influence of
      alcohol, a narcotic or another psychotropic substance. The police-published text provides one to
      six months’ imprisonment and OMR400–800; illness or inability to work exceeding 30 days raises
      this to six to twelve months and OMR600–1,200, while death or permanent total disability brings
      one to three years and OMR1,500–3,000. Stronger penalties under other laws are reserved. Article
      49 separately punishes refusal of a breath sample or medical detection test where police have
      offence-related grounds to believe the person used these substances: one to three months and
      OMR200–500. Article 54 allows the court to withdraw a driving licence for up to one year, or two
      years for repetition. A numeric THC cutoff, specimen-specific confirmation rules and later
      implementing-regulation details were not established.
    sources:
      - trafficRop
      - traffic2016
