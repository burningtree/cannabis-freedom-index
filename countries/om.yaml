segments:
  possession:
    text: >-
      Under the new narcotics law issued by Royal Decree 67/2026, anyone who possesses, acquires or
      buys drugs for their own consumption faces one to three years in prison and a fine of 1,000 to
      5,000 rials.
    sources:
      - rd67
      - gn
      - oo
  cultivation:
    text: >-
      Growing a listed plant for personal use falls under the same one-to-three-year provision of
      Article 41. Growing, importing or exporting a listed plant or its seeds for trafficking
      can bring death or life imprisonment and a fine of 35,000 to 60,000 rials.
    sources:
      - rd67
      - gn
  enforcement:
    text: >-
      Using a drug carries one to three years. Importing, exporting, producing or manufacturing
      a scheduled drug for trafficking, or growing a listed plant or its seeds for trafficking,
      can bring death or life imprisonment and a fine of 35,000 to 60,000 rials. Death is the
      only penalty for smuggling those things for trafficking, for a repeat of that offence, for
      an official charged with drug control, and for taking part in an international smuggling
      gang.
    sources:
      - rd67
  sharing:
    text: >-
      Supplying a drug to a user without payment, or preparing a place for use without payment,
      carries seven to fifteen years and a fine of 5,000 to 15,000 rials. Supplying a user for
      payment, or possessing, selling or handing a drug over in order to traffic, carries at
      least fifteen years and a fine of 10,000 to 25,000 rials. An unpaid transfer made in order
      to traffic can still fall under that fifteen-year offence.
    sources:
      - rd67
  consumption:
    text: Use is covered by the personal-consumption offence.
    sources:
      - oo
  access:
    text: None.
    sources:
      - gn
context:
  death_penalty:
    text: >-
      Importing, exporting, producing or manufacturing a scheduled drug for trafficking, or
      growing, importing or exporting a listed plant or its seeds for trafficking, can be
      punished by death or by life imprisonment, and by a fine of 35,000 to 60,000 rials. Death
      is the sentence for smuggling those things for trafficking, for a repeat of that offence,
      for an official charged with drug control, and for taking part in an international
      smuggling gang. Selling or handing a drug over in order to traffic, without that import
      or manufacture, starts at fifteen years.
    sources:
      - rd67
  production:
    text: None.
    sources:
      - gn
  products:
    text: None.
    sources:
      - gn
  medical:
    text: No medical cannabis.
    sources:
      - gn
  consequences:
    text: Foreigners are deported after serving their sentence.
    sources:
      - oo
  planting:
    seeds: illegal
    seeds_trade: banned
    clones: illegal
    clones_trade: banned
    text: >-
      The 2026 narcotics law bans growing, holding, buying or selling a listed plant, any part
      of it at any stage of growth, and its seeds. Cannabis is on the list. Only cannabis
      seeds treated so they cannot germinate, and stalk fibre, are exempt. The law defines
      cultivation as starting with sowing for germination, and licences to grow go only to
      state bodies and recognised research institutes.
    sources:
      - rd67
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited, and the law provides for the death
      penalty for the most serious drug offences.
    sources:
      - rd67
      - gn
      - oo
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. Under the narcotics law issued by Royal
      Decree 67/2026, anyone who possesses, acquires or buys drugs for their own consumption
      faces one to three years in prison and a fine of 1,000 to 5,000 rials.
    sources:
      - rd67
      - gn
      - oo
  driving:
    status: impairment
    text: >-
      The amended Traffic Law article 50 bis prohibits driving on a road under the influence of
      alcohol, a narcotic or another psychotropic substance. The police-published text provides one to
      six months’ imprisonment and OMR400–800; illness or inability to work exceeding 30 days raises
      this to six to twelve months and OMR600–1,200, while death or permanent total disability brings
      one to three years and OMR1,500–3,000. Stronger penalties under other laws are reserved. Article
      49 separately punishes refusal of a breath sample or medical detection test where police have
      offence-related grounds to believe the person used these substances: one to three months and
      OMR200–500. Article 54 allows the court to withdraw a driving licence for up to one year, or two
      years for repetition. A numeric THC cutoff, specimen-specific confirmation rules and later
      implementing-regulation details were not established.
    sources:
      - trafficRop
      - traffic2016
