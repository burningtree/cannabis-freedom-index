name: Rwanda
region: Africa
iso_numeric: 646
recreational: illegal
medical: limited
updated: "2026-10-21"
summary: >-
  Medical and research cannabis activities require licences. Unauthorised possession and use remain
  crimes, with community service available instead of prison.
scores:
  possession: 0
  cultivation: 0
  enforcement: 1
  sharing: 0
  consumption: 0
  access: 0
segments:
  possession:
    text: >-
      The drug offence as amended in 2019 expressly covers being caught with narcotics or
      psychotropic substances, alongside use. Its stated penalty is one to two years in prison or
      community service. General sentencing rules adopted in 2023 allow judges to reduce a fixed
      term to half the statutory minimum when mitigating circumstances are accepted.
    sources:
      - law19
      - law23
  cultivation:
    text: >-
      Growing cannabis requires a licence for medical or research purposes under the 2021 order.
      Unauthorised production falls within the criminal law’s highest drug category, which specifies
      life imprisonment and a fine of more than 20 million and up to 30 million francs. General
      mitigating-circumstance rules allow life imprisonment to be reduced to at least fifteen years.
    sources:
      - og24
      - sched19
      - law19
      - law23
  enforcement:
    text: >-
      Community service is an express alternative to imprisonment for possession or use. The
      government’s 2014 report to the UN counted 1,910 people incarcerated in 2011 for smoking
      cannabis; that is historical evidence of imprisonment, not a current sentencing rate. The 2023
      general rules widened judges’ powers to reduce sentences.
    sources:
      - law19
      - report14
      - law23
  sharing:
    text: >-
      Unauthorised giving to another person is included alongside production, transport, storage and
      sale. Cannabis is in the highest drug category, whose statutory tariff is life imprisonment
      and a fine of more than 20 million and up to 30 million Rwandan francs. The 2023 general rules
      allow mitigation, including reducing life imprisonment to at least fifteen years.
    sources:
      - law19
      - sched19
      - law23
  consumption:
    text: >-
      Illicit consumption remains a criminal offence. The stated punishment is one to two years in
      prison or community service, with general judicial powers to reduce or suspend qualifying
      sentences under the 2023 amendments.
    sources:
      - law19
      - law23
  access:
    text: >-
      The 2021 order permits medical use on prescription by a doctor with written health-ministry
      authority and requires registration of finished products. No cannabis or cannabinoid medicine
      was found in the FDA’s published September 2026 pharmaceutical register. Practical patient
      supply, including exceptional imports, was not established in this review.
    sources:
      - og24
      - fda26
context:
  production:
    text: >-
      The 2021 order licenses medical and research cultivation and processing. In May 2025, the
      development board reported off-site infrastructure for the Musanze project 83% complete, with
      fencing still outstanding; reporting described the licensed private producer’s plans as aimed
      mainly at cannabis oils for export.
    sources:
      - og24
      - site25
  products:
    text: >-
      Finished cannabis products require registration, and importing or exporting them requires a
      permit for each shipment. Licensed activities are restricted to medical or research purposes.
    sources:
      - og24
  medical:
    text: >-
      Medical use requires a prescription from a doctor whom the health ministry has authorised in
      writing to prescribe cannabis. The reviewed September 2026 pharmaceutical register contained
      no cannabis or cannabinoid medicine; prescribing rules alone do not establish patient supply.
    sources:
      - og24
      - fda26
  consequences:
    text: >-
      Community service is a criminal sentence. Under the 2023 general rules, deliberate failure to
      carry it out properly requires the remaining sentence to be served in a correctional facility.
    sources:
      - law23
  planting:
    seeds: licensed
    seeds_trade: regulated
    clones: licensed
    clones_trade: regulated
    text: >-
      The 2021 ministerial order defines cannabis to include its seeds for agricultural purposes and
      lists eight licences and permits. A cultivation licence covers developing genetic material,
      and separate import and export permits are required for seeds, genetic materials and other
      planting material. Everything is confined to medical or research use.
    sources:
      - og24
  visitors:
    status: none
    text: >-
      There is no recreational supply route in the reviewed laws. The possession/use offence states
      one to two years in prison or community service; authorised medical use requires a
      prescription from a doctor with written health-ministry authority.
    sources:
      - law19
      - og24
  arrests:
    text: >-
      The government told the UN Human Rights Committee in 2014 that 1,910 people had been
      incarcerated in 2011 for smoking cannabis. It separately recorded 2,402 arrests connected with
      banned substances across 2011–2012. These are historical counts, and the latter figure covers
      drugs generally.
    sources:
      - report14
