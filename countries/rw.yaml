name: Rwanda
region: Africa
iso_numeric: 646
recreational: illegal
medical: limited
updated: 2026-10-27
summary: >-
  Cannabis sits in the highest drug category. Caught use or possession carries one to
  two years or community service; supply, transport, storage and production carry life
  imprisonment with a fine of more than 20 million and up to 30 million francs, subject
  to mitigation down to at least fifteen years. A licensing regime for medical cannabis
  exists but no patient supply was found.
scores:
  possession: 1
  cultivation: 0
  enforcement: 1
  sharing: 0
  consumption: 1
  access: 0
segments:
  possession:
    text: >-
      The drug offence as amended in [2019](/history/rwanda-possession-clause-2019/)
      expressly covers being caught with narcotics or psychotropic substances, alongside
      use.[@law19] Its stated penalty is one to two years in prison or community
      service.[@law19] General sentencing rules adopted in [2023](/history/rwanda-sentencing-discretion-2023/)
      let judges halve fixed terms of at least six months and quarter fines when mitigating
      circumstances are accepted.[@law23]
    sources:
      - law19
      - law23
    currency: RWF
    penalties:
      - label: Caught with or using narcotics
        treatment: criminal
        term: Drug use or possession
        prison_min: 1 year
        prison: 2 years
        note: Or community service. Mitigation can halve the term
  cultivation:
    text: >-
      Growing cannabis requires a licence for medical or research purposes under the [2021
      order](/history/rwanda-medical-2021/).[@og24] Unauthorised production falls within the
      criminal law's highest drug category, which specifies life imprisonment and a fine of
      more than 20 million and up to 30 million francs.[@law19,sched19] General
      mitigating-circumstance rules allow life imprisonment to be reduced to at least
      fifteen years.[@law23]
    sources:
      - og24
      - law19
      - sched19
      - law23
    currency: RWF
    penalties:
      - label: Unlicensed production (Category I drugs)
        treatment: criminal
        term: Production
        fine_min: 20000000
        fine: 30000000
        note: Life imprisonment. Mitigation possible under the 2023 rules
  enforcement:
    text: >-
      Community service is an express alternative to imprisonment for possession or
      use.[@law19] The government's 2014 report to the UN counted 1,910 people incarcerated
      in 2011 for smoking cannabis; that is historical evidence of imprisonment, not a
      current sentencing rate.[@report14] The 2023 general rules widened judges' powers to
      reduce sentences.[@law23]
    sources:
      - law19
      - report14
      - law23
  sharing:
    text: >-
      Unauthorised giving to another person is included alongside production, transport,
      storage and sale.[@law19] Cannabis is in the highest drug category, whose statutory
      tariff is life imprisonment and a fine of more than 20 million and up to 30 million
      Rwandan francs.[@law19,sched19] The 2023 general rules allow mitigation, including
      reducing life imprisonment to at least fifteen years.[@law23]
    sources:
      - law19
      - sched19
      - law23
    currency: RWF
    penalties:
      - label: Giving, selling, transporting or storing (Category I drugs)
        treatment: criminal
        term: Supply
        fine_min: 20000000
        fine: 30000000
        note: Life imprisonment. Mitigation possible under the 2023 rules
  consumption:
    text: >-
      Illicit consumption remains a criminal offence.[@law19] The stated punishment is one to
      two years in prison or community service, with general judicial powers to reduce or
      suspend qualifying sentences under the 2023 amendments.[@law19,law23]
    sources:
      - law19
      - law23
    currency: RWF
    penalties:
      - label: Using narcotics
        treatment: criminal
        term: Drug use
        prison_min: 1 year
        prison: 2 years
        note: Or community service. Mitigation can halve the term
  access:
    text: >-
      The 2021 order permits medical use on prescription by a doctor with written
      health-ministry authority and requires registration of finished products.[@og24] No
      cannabis or cannabinoid medicine was found in the FDA's published September 2026
      pharmaceutical register.[@fda26] Practical patient supply, including exceptional
      imports, was not established in this review.[@fda26]
    sources:
      - og24
      - fda26
context:
  recreational:
    text: >-
      Cannabis is prohibited and the penalties are severe, yet police keep intercepting
      large cross-border loads: in December 2017 they seized 400 kg trafficked from DR
      Congo on the Rubavu–Nyabihu road, as [that seizure](/history/rwanda-rubavu-cannabis-seizure-2017/)
      records.[@rnp17] Rubavu in the west and Kirehe in the east are marked as major
      cannabis trafficking routes, and Rwanda runs joint operations with Tanzania against
      cross-border trafficking and farm destruction.[@rnp17] Use persists: the government
      counted 1,910 people jailed for smoking cannabis in 2011.[@report14]
    sources:
      - rnp17
      - report14
  medical:
    text: >-
      Medical use requires a prescription from a doctor whom the health ministry has
      authorised in writing to prescribe cannabis.[@og24] The reviewed September 2026
      pharmaceutical register contained no cannabis or cannabinoid medicine; prescribing
      rules alone do not establish patient supply.[@fda26]
    sources:
      - og24
      - fda26
  hemp:
    status: none
    text: >-
      No Rwandan law sets a THC line for hemp: cannabis sits in Category I of very severe
      drugs, and the 2021 order licenses only medical or research growing.[@sched19,og24]
      No fibre, food or CBD regime appears in the sources reviewed.[@og24]
    sources:
      - sched19
      - og24
  production:
    status: medical
    text: >-
      The 2021 order licenses medical and research cannabis cultivation and
      processing.[@og24] In May 2025, the development board reported off-site infrastructure
      for the Musanze project 83% complete, with fencing still outstanding; reporting
      described the licensed private producer's plans as aimed mainly at cannabis oils for
      export.[@site25]
    sources:
      - og24
      - site25
  consequences:
    text: >-
      Community service is a criminal sentence.[@law23] Under the 2023 general rules,
      deliberate failure to carry it out properly requires the remaining sentence to be
      served in a correctional facility.[@law23]
    sources:
      - law23
  planting:
    seeds: grey
    seeds_trade: unclear
    clones: illegal
    clones_trade: banned
    text: >-
      The 2021 ministerial order defines cannabis to include its seeds for agricultural
      purposes and lists eight licences and permits.[@og24] A cultivation licence covers
      developing genetic material, and separate import and export permits are required for
      seeds, genetic materials and other planting material.[@og24] Everything is confined
      to medical or research use.[@og24]
    sources:
      - og24
  visitors:
    status: none
    text: >-
      There is no recreational supply route in the reviewed laws.[@og24] The possession and
      use offence states one to two years in prison or community service; authorised
      medical use requires a prescription from a doctor with written health-ministry
      authority.[@law19,og24]
    sources:
      - og24
      - law19
  arrests:
    text: >-
      The government told the UN Human Rights Committee in 2014 that 1,910 people had been
      incarcerated in 2011 for smoking cannabis.[@report14] It separately recorded 2,402
      arrests connected with banned substances across 2011–2012.[@report14] These are
      historical counts, and the latter figure covers drugs generally.[@report14]
    sources:
      - report14
  black_market:
    text: >-
      Rwanda is a destination for Congolese cannabis: police say the narcotics in the
      [December 2017 seizure](/history/rwanda-rubavu-cannabis-seizure-2017/) were trafficked
      from DR Congo, and mark Rubavu and Kirehe as major trafficking routes.[@rnp17] Joint
      Rwanda–Tanzania operations target cross-border trafficking and destroy cannabis farms
      along the Kagera.[@rnp17]
    sources:
      - rnp17
  culture:
    text: >-
      In Rwanda cannabis is [injaga](/culture/language/injaga/), and Codere's 1959–60 photo
      survey found its use virtually confined to Twa men.[@codere75] They smoked it in the
      urumogi gourd water-pipe, with deep inhalations that made the water bubble loudly,
      expecting strong doses to produce violence — an expectation users and onlookers
      shared.[@codere75] Condemnation was near-universal: 99 of 113 respondents opposed it,
      a stance the [1960 confinement findings](/history/rwanda-twa-cannabis-confinement-1960/)
      record.[@codere75]
    sources:
      - codere75
sources:
  law19:
    title: Minijust Rwanda — consolidated penal code with 2019 drug amendments (PDF)
    url: https://www.minijust.gov.rw/fileadmin/user_upload/Minijust/Publications/Laws/Offences_and_penalties_in_general_2019.pdf
    locator: >-
      Articles 257–264 (2018 code), Article 11 (2019 amendment). Use and possession: one to
      two years or community service. Highest-category supply and production: life
      imprisonment, fine above 20 to 30 million.
  law23:
    title: Minijust Rwanda — 2023 penal code amendments on fines, mitigation and community service (PDF gazette extract).
    url: https://www.minijust.gov.rw/fileadmin/user_upload/Minijust/Official_gazettes_2/_______2023_Official_Gazettes/December/OG_n___Special_of_05.12.2023_Imiburanishirize_Imanza_inshinjabyaha_PP___Ibyaha_Ibihano_muri_rusange_CP.pdf
    locator: >-
      Articles 1–3, 23. Mitigation: life to at least 15 years; fixed terms halved; fines
      quartered. Wilful community-service failure: remainder served in custody.
  og24:
    title: RLRC — cannabis order, consulted in 2024 (copy)
    url: https://www.rlrc.gov.rw/fileadmin/user_upload/RLRC/Laws_of_Rwanda_v2/Domestic_laws/Laws_in_force/7._Administrative/7.8._Health/7.8.3._Tobacco_and_drugs/7.8.3.8_Cannabis_and_cannabis_products_MO_no_003_of_2021.pdf
  codere75:
    title: Helen Codere — Social and Cultural Context of Cannabis Use in Rwanda (1975), chapter in Rubin (ed), Cannabis and Culture
    url: https://archive.org/details/cannabisitsusein0000unse_v4f6
    locator: >-
      Printed pp. 217–226. In Rwanda the drug is injaga; found confined to Twa men;
      urumogi gourd water-pipe; 99 of 113 Rwandan male interviewees against allowing use.
      Passages read in the local PDF of the Rubin volume.
  sched19:
    title: Rwanda — 2019 narcotics categorisation order (Ministry of Health, PDF)
    url: https://www.moh.gov.rw/fileadmin/user_upload/Moh/Publications/Laws/new_law/Ministerial_Order_List_of_narcotics_and_their_categorization-43-57__3_.pdf
    locator: Articles 1–4. Cannabis, cannabis oil and cannabis resin in Category I (very severe narcotic drugs). THC and cannabis oil in the Schedule I psychotropics list.
  site25:
    title: Rwanda Development Board — Musanze medical cannabis project update (May 2025)
    url: https://rdb.rw/musanze-medical-cannabis-project-gains-momentum/
  fda26:
    title: Rwanda FDA — human medicines register (consulted list, September 2026 edition)
    url: https://monitoring.rwandafda.gov.rw/register/hmdr/
    locator: >-
      Full HTML table downloaded 27 October 2026: over 2,600 rows; searched cannabis,
      cannabidiol, tetrahydrocannabinol, dronabinol, nabilone, nabiximols, Sativex,
      Epidiolex and Epidyolex; no matches; does not cover individual exceptional
      imports.
  report14:
    title: Rwanda — 2014 report to the UN Human Rights Committee (PDF)
    url: https://www.minijust.gov.rw/fileadmin/user_upload/Minijust/Publications/Reports/UN_reports/4_2014_CCPR_STATE_REPORT_2014.pdf
    locator: Paras 166–167. 1,910 incarcerations for cannabis smoking in 2011; 2,402 all-drug arrests in 2011–12; treaty ratification dates.
  rnp17:
    title: Rwanda National Police — Breaking chain of drug supply, 400kgs of cannabis seized (19 December 2017)
    url: https://police.gov.rw/media/news-detail/news/breaking-chain-of-drug-supply-400kgs-of-cannabis-seized/?tx_news_pi1%5Bcontroller%5D=News&tx_news_pi1%5Baction%5D=detail&cHash=d8596c67fd8e3187ecde20579e1fcdd9
