segments:
  possession:
    text: >-
      Recreational possession and use are crimes. News reports on the 2021 medical order cite prison
      terms of several years and fines of 500,000 to 5 million Rwandan francs for anyone found
      illegally using marijuana.
    sources:
      - nation
      - ea
  cultivation:
    text: Unlicensed cultivation is a serious crime.
    sources:
      - ea
  enforcement:
    text: Strictly enforced, with prison for users.
    sources:
      - nation
      - ea
  sharing:
    text: Trafficking carries very long sentences, up to life.
    sources:
      - ea
  consumption:
    text: Consumption for recreational purposes remains illegal and is punished.
    sources:
      - nation
  access:
    text: None for the public.
    sources:
      - ea
context:
  production:
    text: >-
      A ministerial order of June 2021 allows investors to cultivate, process, import and export
      cannabis for medical or research purposes, under tight security requirements. It is an export
      strategy rather than a domestic market.
    sources:
      - ea
      - nation
  products:
    text: Licensed products are for export.
    sources:
      - ea
  medical:
    text: >-
      Medical and research use is permitted in principle under the 2021 order; no real patient
      programme exists.
    sources:
      - nation
  consequences:
    text: A conviction is a criminal record; users may also be sent to rehabilitation centres.
    sources:
      - nation
  planting:
    seeds: licensed
    seeds_trade: regulated
    clones: licensed
    clones_trade: regulated
    text: >-
      The 2021 ministerial order defines cannabis to include its seeds for agricultural
      purposes and lists eight licences and permits. A cultivation licence covers developing
      genetic material, and separate import and export permits are required for seeds, genetic
      materials and other planting material. Everything is confined to medical or research
      use.
    sources:
      - og24
