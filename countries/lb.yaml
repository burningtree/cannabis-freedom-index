segments:
  possession:
    text: >-
      Personal use and possession are crimes under the 1998 narcotics law, punishable by three
      months to three years in prison and a fine. The law allows treatment as an alternative to
      prosecution, but arrests of users remain common.
    sources:
      - idpc
  cultivation:
    text: >-
      Unlicensed cultivation is a crime, yet hashish farming in the Bekaa Valley is a decades-old
      open secret, periodically raided.
    sources:
      - idpc
      - mjb
  enforcement:
    text: >-
      Users are jailed, often in pre-trial detention, while large growers have historically enjoyed
      protection.
    sources:
      - idpc
  sharing:
    text: Trafficking carries long prison sentences.
    sources:
      - idpc
  consumption:
    text: Use is a criminal offence.
    sources:
      - idpc
  access:
    text: No legal source.
    sources:
      - mjb
context:
  production:
    text: >-
      Law 178 of April 2020 legalised licensed cultivation for medical and industrial purposes,
      aimed at export and recommended by consultants as a way to revive the economy. Implementation
      stalled for years; a regulatory authority was only appointed in 2025.
    sources:
      - law
      - mjb
  products:
    text: No legal consumer products.
    sources:
      - mjb
  medical:
    text: The 2020 law concerns production for export; no domestic patient programme is operating.
    sources:
      - mjb
      - idpc
  consequences:
    text: A drug record affects employment and travel.
    sources:
      - idpc
  planting:
    seeds: licensed
    seeds_trade: regulated
    clones: licensed
    clones_trade: regulated
    text: >-
      Under Law 178 of 2020 the cannabis regulatory authority may authorise cultivation of the
      plant "whether in the form of seeds or seedlings" for medical, pharmaceutical and
      industrial products. Outside such an authorisation cultivation remains a crime.
    sources:
      - cmsg
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited.
    sources:
      - idpc
      - mjb
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone, so a visitor has no lawful way to buy
      cannabis. The sources behind this profile describe no separate rule for visitors.
    sources:
      - mjb
  black_market:
    text: >-
      Hashish from the Bekaa valley is grown entirely outside the law, because the legal
      industry promised in 2020 has not started. The Cannabis Regulatory Authority was
      formally set up only in the summer of 2025, five years after the law that created it;
      its head, appointed in July 2025, said in February 2026 that the timetable was too tight
      for a first legal harvest that year, while farmers in growing areas such as Saideh were
      pressing for the season to begin.
    sources:
      - olj26
