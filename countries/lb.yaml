segments:
  possession:
    text: >-
      Personal use and possession are crimes under the 1998 narcotics law, punishable by three
      months to three years in prison and a fine. The law allows treatment as an alternative to
      prosecution, but arrests of users remain common.
    sources:
      - idpc
  cultivation:
    text: >-
      Unlicensed cultivation is a crime, yet hashish farming in the Bekaa Valley is a decades-old
      open secret, periodically raided.
    sources:
      - idpc
      - mjb
  enforcement:
    text: >-
      Users are jailed, often in pre-trial detention, while large growers have historically enjoyed
      protection.
    sources:
      - idpc
  sharing:
    text: Trafficking carries long prison sentences.
    sources:
      - idpc
  consumption:
    text: Use is a criminal offence.
    sources:
      - idpc
  access:
    text: No legal source.
    sources:
      - mjb
context:
  production:
    text: >-
      Law 178 of April 2020 legalised licensed cultivation for medical and industrial purposes,
      aimed at export and recommended by consultants as a way to revive the economy. Implementation
      stalled for years; a regulatory authority was only appointed in 2025.
    sources:
      - law
      - mjb
  products:
    text: No legal consumer products.
    sources:
      - mjb
  medical:
    text: The 2020 law concerns production for export; no domestic patient programme is operating.
    sources:
      - mjb
      - idpc
  consequences:
    text: A drug record affects employment and travel.
    sources:
      - idpc
