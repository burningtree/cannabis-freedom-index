name: Lebanon
region: Asia
iso_numeric: 422
recreational: illegal
medical: none
updated: "2026-10-28"
summary: >-
  A 2020 law legalised licensed cultivation for medical and industrial use, but no licence had been
  issued by August 2026. Recreational use remains illegal: a small quantity for personal use brings
  three months to three years, while other possession or supply can bring life.
scores:
  possession: 1
  cultivation: 1
  enforcement: 2
  sharing: 1
  consumption: 1
  access: 0
segments:
  possession:
    text: >-
      Law 673 of 16 March 1998 bans possession of cannabis, which is in Table 1 of highly dangerous
      drugs with no medical use.[@law673] A small quantity for personal use carries three months to
      three years in prison and a fine of LBP 2–5 million under article 127; the law sets no gram
      threshold, leaving the boundary to the court.[@law673] Any other possession carries life
      imprisonment with hard labour and a fine of LBP 25–100 million under article 125, read with
      article 13.[@law673] Treatment can replace prosecution in some cases, but the Drug Addiction
      Committee handles fewer than 10% of eligible cases.[@law673,hri26]
    sources:
      - law673
      - hri26
    currency: LBP
    penalties:
      - label: Small quantity for personal use
        treatment: criminal
        term: Personal use
        prison_min: 3 months
        prison: 3 years
        fine_min: 2000000
        fine: 5000000
        note: Article 127; no statutory quantity threshold
      - label: Possession outside personal use
        treatment: criminal
        term: Possession
        fine_min: 25000000
        fine: 100000000
        life: mandatory
  cultivation:
    text: >-
      Article 11 bans cultivating cannabis, including seeds and plants at any stage, and article 125
      punishes unlicensed cultivation with life imprisonment with hard labour and LBP 25–100
      million.[@law673] Law 178 of 2020 created a licensing exception for medical, therapeutic,
      scientific and industrial cultivation, but it did not reschedule cannabis or legalise
      recreational growing.[@law178] The Cannabis Regulatory Authority was appointed only in July
      2025, and no cultivation licence had been issued by August 2026.[@olj26,beiruter26] Licensed
      growers who break the area or application rules face one to three years and LBP 20–50 million
      under article 33 of Law 178.[@law178]
    sources:
      - law673
      - law178
      - olj26
      - beiruter26
    currency: LBP
    penalties:
      - label: Unlicensed cultivation
        treatment: criminal
        term: Cultivation
        fine_min: 25000000
        fine: 100000000
        life: mandatory
      - label: Licensed cultivation outside the authorised area
        treatment: criminal
        term: Licensed cultivation
        prison_min: 1 year
        prison: 2 years
        fine_min: 20000000
        fine: 40000000
        note: Licence withdrawal under Law 178 article 33
      - label: False statement in a licence application
        treatment: criminal
        term: Licence application
        prison_min: 1 year
        prison: 3 years
        fine_min: 30000000
        fine: 50000000
        note: Licence withdrawal under Law 178 article 33
      - label: Violence or resistance to an inspector
        treatment: criminal
        term: Obstruction
        prison_min: 3 months
        prison: 2 years
        fine_min: 10000000
        fine: 20000000
  enforcement:
    text: >-
      Enforcement is uneven: users are jailed, often in pre-trial detention, while large growers
      have historically enjoyed political protection.[@jied] In 2023, 790 people were sentenced for
      substance use, down from 1,202 in 2021, and 87% of prisoners were held without trial.[@hri26]
      The army destroyed cannabis fields in the Bekaa in 2025 and the interior ministry announced a
      network bust with 720 kg of hashish in September 2025.[@lorient25,arabnews25]
    sources:
      - jied
      - hri26
      - lorient25
      - arabnews25
  sharing:
    text: >-
      Article 126 punishes selling or offering cannabis for personal consumption, facilitating its
      use free or for payment, keeping a place for use, or supplying a minor with life imprisonment
      with hard labour and LBP 25–100 million; there is no quantity threshold.[@law673] Article 125
      covers transport, import, export, brokerage and other supply on the same terms.[@law673] The
      law does not distinguish small-scale sharing from trafficking.[@law673]
    sources:
      - law673
    currency: LBP
    penalties:
      - label: Sale, supply or brokerage
        treatment: criminal
        term: Trafficking
        fine_min: 25000000
        fine: 100000000
        life: mandatory
      - label: Giving or facilitating use
        treatment: criminal
        term: Facilitation
        fine_min: 25000000
        fine: 100000000
        note: Includes free supply;
        life: mandatory
      - label: Supplying a minor
        treatment: criminal
        term: Supply to a minor
        fine_min: 25000000
        fine: 100000000
        life: mandatory
  consumption:
    text: >-
      Article 127 punishes use of a small quantity for personal consumption with three months to
      three years and LBP 2–5 million.[@law673] Article 197 applies the same penalties when
      treatment is refused.[@law673] Treatment before prosecution can exempt an addicted person on
      certified recovery, but the committee is underused.[@law673,hri26]
    sources:
      - law673
      - hri26
    currency: LBP
    penalties:
      - label: Personal consumption
        treatment: criminal
        term: Use
        prison_min: 3 months
        prison: 3 years
        fine_min: 2000000
        fine: 5000000
        note: Article 127; no statutory quantity threshold
  access:
    text: >-
      None. Cannabis is Table 1 with no medical use, and Law 178 licenses production for export and
      industrial use, not patient access.[@law673,law178] No domestic medical-cannabis programme,
      pharmacy product or CBD consumer market was verified.[@idpc,beiruter26]
    sources:
      - law673
      - law178
      - idpc
      - beiruter26
context:
  recreational:
    text: >-
      There is no legal recreational supply. A small quantity for personal use brings three months
      to three years and LBP 2–5 million; any other possession or supply can bring life.[@law673]
      Bekaa hashish farming is a decades-old open secret, periodically raided, and users face jail
      while large growers have historically been protected.[@jied]
    sources:
      - law673
      - jied
  production:
    status: medical
    text: >-
      Law 178 of 2020 allows licensed cultivation for medical, therapeutic, scientific and
      industrial purposes, aimed at export.[@law178] The regulator was appointed in July 2025, but
      no licence had been issued by August 2026 and its chairman said the timetable was too tight
      for a 2026 harvest.[@olj26,beiruter26]
    sources:
      - law178
      - olj26
      - beiruter26
  medical:
    text: >-
      No patient route. Cannabis remains Table 1 "no medical use"; Law 178 licenses production, not
      consumption, and does not reschedule the plant.[@law673,law178] Patients have no legal pathway
      to medical cannabis, and no product or prescription route was verified.[@idpc,beiruter26]
    sources:
      - law673
      - law178
      - idpc
      - beiruter26
  hemp:
    status: strict
    text: >-
      Law 178 includes industrial hemp among the licensed cannabis uses and lets the regulator
      license seeds for industrial hemp, but it leaves the THC limit to the authority; a 1% figure
      appears in ministry guidance, not the law.[@law178,cms] No hemp licence or legal hemp market
      existed by August 2026, and CBD remains a controlled substance.[@beiruter26,cms]
    sources:
      - law178
      - cms
      - beiruter26
  consequences:
    text: >-
      A drug conviction is a criminal record. Article 152 requires permanent expulsion for a foreign
      national convicted of a felony or repeat misdemeanour, and removal for one to five years for a
      misdemeanour; article 161 bars early release during the first two-thirds of a sentence of a
      year or more.[@law673] The currency collapse has made the fines nominal while the life
      sentence remains.[@jied,cms]
    sources:
      - law673
      - jied
      - cms
  planting:
    seeds: licensed
    seeds_trade: regulated
    clones: licensed
    clones_trade: regulated
    text: >-
      Law 178 article 3 lets the regulator license cannabis seeds for industrial hemp and seedlings
      at any growth stage for medical use; outside a licence, planting is cultivation under article
      11 and carries life.[@law178,law673] There is no personal seed or clone exception.[@law673]
    sources:
      - law178
      - law673
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited.[@law673] Law 178 is a production licensing
      route, not a members' club.[@law178]
    sources:
      - law673
      - law178
  visitors:
    status: none
    text: >-
      There is no legal supply for anyone. A small quantity for personal use brings three months to
      three years and LBP 2–5 million; other possession or supply can bring life.[@law673] A foreign
      national convicted of a felony or repeat misdemeanour faces permanent expulsion, and a
      misdemeanour can bring removal for one to five years.[@law673]
    sources:
      - law673
  driving:
    status: impairment
    text: >-
      Article 143 punishes driving a land vehicle under the influence of an illegally used highly
      dangerous narcotic with three months to two years and LBP 2–5 million; the court may withdraw
      the licence for three months to three years, permanently after a mass-casualty
      accident.[@law673] Article 144 applies the same penalty for refusing the health ministry's
      test or continuing to drive.[@law673] There is no per-se THC limit.[@law673]
    sources:
      - law673
  culture:
    text: >-
      Cannabis in Lebanon is known as [hashish](/culture/language/hashish/), and the Bekaa Valley
      has been the centre of [hashish production](/culture/traditions/hashish-in-the-bekaa/) for a
      century.[@jied] The trade shaped village economies and political networks, and the 2020
      licensing law was presented as a way to bring it into the legal economy.[@jied,law178] No
      public cannabis culture is visible today; the crop remains illegal and periodically
      eradicated.[@jied,lorient25]
    sources:
      - jied
      - law178
      - lorient25
  black_market:
    text: >-
      No consolidated official cannabis seizure series is published. Reported cases include 6.4 kg
      of hashish at Beirut airport in June 2024, army destruction of fields in the Bekaa in August
      and September 2025, and 720 kg of hashish in a September 2025 network
      bust.[@lorient24,lorient25,arabnews25] The Bekaa has produced hashish for a century: a 1928
      estimate put output at 60 tonnes, and a 2022 estimate put cultivation at 20,000–40,000
      hectares.[@jied] Fines in Law 673 have been eroded by the currency collapse, while the life
      sentence remains.[@jied,cms]
    sources:
      - lorient24
      - lorient25
      - arabnews25
      - jied
      - cms
  arrests:
    text: >-
      In 2023, 790 people were sentenced for substance use, down 35% from 1,202 in 2021, and 2,518
      people were questioned and released without charge in 2021.[@hri26] About 87% of prisoners
      were held without trial in 2023, with prisons at almost 200% capacity, partly because of
      low-level drug offences.[@hri26] A 2018 study estimated that about 77% of annual drug arrests
      targeted users and 15% low- or mid-level supply, with kingpins rarely prosecuted.[@jied] No
      consolidated 2024–2026 cannabis arrest series was found.[@hri26]
    sources:
      - hri26
      - jied
