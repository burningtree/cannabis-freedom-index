segments:
  possession:
    text: >-
      The 1997 Drug Code classifies cannabis (yamba) as a narcotic. Possession of a small quantity
      for personal consumption carries two months to one year in prison and a fine of three times
      the drug's value. Courts may order treatment instead.
    sources:
      - mo
  cultivation:
    text: Cultivation was upgraded from a misdemeanour to a serious crime by the 2007 'Latif Guèye' law.
    sources:
      - mo
  enforcement:
    text: >-
      Short prison terms for users and very long ones for traffickers; use remains widespread
      despite decades of repression.
    sources:
      - mo
  sharing:
    text: Trafficking carries ten to twenty years since 2007.
    sources:
      - mo
  consumption:
    text: Use is an offence under the Drug Code.
    sources:
      - mo
  access:
    text: None.
    sources:
      - cdd97
context:
  production:
    text: Reliable national information about lawful cannabis production was not established by the retained sources.
    sources: []
  products:
    text: Reliable national information about legally available cannabis products was not established by the retained sources.
    sources: []
  medical:
    text: The retained sources do not establish whether a medical cannabis programme operates.
    sources: []
  consequences:
    text: A conviction is a criminal record.
    sources:
      - mo
  planting:
    seeds: grey
    seeds_trade: unclear
    clones: illegal
    clones_trade: banned
    text: >-
      Article 8 of the 1997 Drug Code bans growing the cannabis plant anywhere in the country,
      and landholders must destroy such plantations or report them. The articles read do not
      mention seeds. The copy read stops at Article 108 and predates the 2007 amendments.
    sources:
      - cdd97
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited.
    sources:
      - mo
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. Under the 1997 Drug Code, possession of
      a small quantity for personal consumption carries two months to one year in prison and a
      fine of three times the drug's value; courts may order treatment instead.
    sources:
      - mo
  arrests:
    text: >-
      Figures presented in Dakar in February 2026 put seizures of cannabis in 2025 at
      5,238 kg, with 1,302 people arrested in anti-drug operations, most of them tied to
      distribution networks in the informal sector. The gendarmerie's spokesman said in
      October 2025 that cannabis was the largest drug seized by weight that year.
    sources:
      - soleil26
      - soleil25
  black_market:
    text: >-
      Figures reported by the government to the UN drugs office record 23,024 kg of herbal
      cannabis seized in 2024, against 12,738 kg in 2023, and 38.8 kg of cannabis resin
      seized in 2024, against 23.1 kg in 2023. The UN publishes them as kilogram
      equivalents, and countries count seizures differently, so the figures are not
      comparable across borders.
    sources:
      - unodc_szr
