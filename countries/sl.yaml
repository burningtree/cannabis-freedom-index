segments:
  possession:
    text: >-
      Unlawful possession of a drug is an offence under section 8 of the National Drugs Control Act
      2008, with multi-year prison sentences and no fine-only route for small amounts. Recent
      sentences under that section have been extreme — 25 years for 30.5 g — though those cases
      involved 'kush', a synthetic drug, rather than cannabis.
    sources:
      - act
      - pm1
  cultivation:
    text: Cultivation is a serious offence under the Act; cannabis (jamba) is nonetheless widely grown.
    sources:
      - act
  enforcement:
    text: >-
      Courts have been handing down exemplary sentences since a national emergency over kush was
      declared in 2024, and the same Act and section apply to cannabis.
    sources:
      - pm1
      - pm2
  sharing:
    text: Dealing carries very long sentences, ten to thirty years in recent cases.
    sources:
      - pm2
      - pm1
  consumption:
    text: Use is prosecuted through possession.
    sources:
      - act
  access:
    text: None.
    sources:
      - act
