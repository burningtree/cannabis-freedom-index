  planting:
    seeds: illegal
    seeds_trade: banned
    clones: illegal
    clones_trade: banned
    text: >-
      The National Drugs Control Act 2008 defines cannabis as any part of the cannabis plant,
      including the seeds and leaves, so seeds are a prohibited drug like the rest of the
      plant. Its definition of cultivating covers planting, sowing, scattering seed, growing
      and tending.
    sources:
      - ndca
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited.
    sources:
      - act
      - pm2
      - pm1
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. British travel advice tells travellers
      not to become involved with drugs of any kind and says there are heavy penalties for
      drug trafficking, including prison sentences in harsh conditions.
    sources:
      - act
      - fcdo
