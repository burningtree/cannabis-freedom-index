    seeds_trade: banned
    clones: illegal
    clones_trade: banned
    text: >-
      The National Drugs Control Act 2008 defines cannabis as any part of the cannabis plant,
      including the seeds and leaves, so seeds are a prohibited drug like the rest of the
      plant. Its definition of cultivating covers planting, sowing, scattering seed, growing
      and tending.
    sources:
      - ndca
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited.
    sources:
      - act
      - pm2
      - pm1
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. Unlawful possession is an offence under
      section 8 of the National Drugs Control Act 2008, with multi-year prison sentences and no
      fine-only route for small amounts.
    sources:
      - act
      - pm1
  driving:
    status: impairment
    text: >-
      Road Traffic Act section 102 prohibits driving or attempting to drive on a road while alcohol or
      drugs make proper control of the vehicle impossible. The published 2007 Act grades imprisonment
      by harm: up to six months for no or minor bodily injury to another person, one to two years for
      aggravated bodily injury, and three to five years where death occurs. The court may also order
      compensation. Current fines and later penalty amendments were not certified; the original
      monetary figures should not be read as current new-leone amounts. Section 107(3) requires police
      to consult a medical practitioner and follow that advice on drug-impairment questions arising
      under its detention provisions. Sections 104–106 describe alcohol-oriented breath/specimen
      procedures and hospital safeguards, not a verified cannabis concentration limit. Current drug
      toxicology, refusal rules and offence-specific licence-point assignments remain follow-ups.
    sources:
      - traffic2007
