name: Sierra Leone
region: Africa
iso_numeric: 694
recreational: illegal
medical: limited
updated: "2026-10-23"
summary: >-
  Cannabis possession and use remain crimes. The Pharmacy Board has rules for licensed medical
  cultivation and processing for export; patient access through local pharmacies has not been
  established.
scores:
  possession: 0
  cultivation: 0
  enforcement: 1
  sharing: 0
  consumption: 0
  access: 0
segments:
  possession:
    text: >-
      Cannabis possession has been prosecuted under the 2008 drug law, including a 2023 case in
      which two defendants were refused bail.[@court2023] The Act sets at least five years for
      unlawful drug possession but lets courts impose a shorter term or a fine when that penalty
      would be harsh or unconscionable.[@act]
    sources:
      - court2023
      - act
  cultivation:
    text: >-
      Personal growers face criminal restrictions: growing a narcotic-producing plant requires
      the Pharmacy Board's written consent, and the pharmacy law sets at least fifteen years for
      cannabis offences.[@pharmacy2001] The Board has separate rules for licensed medical
      cultivation and processing for export.[@medgrow]
    sources:
      - pharmacy2001
      - medgrow
  enforcement:
    text: >-
      In August 2023 a Freetown magistrate refused bail to two men accused of cannabis and kush
      possession under the 2008 Act.[@court2023] The law allows prison terms for possession and
      use, with discretion to impose a shorter term or a fine in some circumstances.[@act]
    sources:
      - court2023
      - act
  sharing:
    text: >-
      The pharmacy law prohibits supplying cannabis prepared for smoking, and its
      cannabis-specific penalty requires at least fifteen years in prison for an individual
      convicted under the Act.[@pharmacy2001] The 2008 Act also punishes unlawful drug supply
      and prevails where the laws conflict.[@act]
    sources:
      - pharmacy2001
      - act
  consumption:
    text: >-
      The 2008 Act makes taking a drug by smoking, inhaling, sniffing, injecting or otherwise
      introducing it into the body a crime.[@act] The pharmacy law also expressly prohibits
      smoking cannabis and visiting premises used for it.[@pharmacy2001]
    sources:
      - act
      - pharmacy2001
  access:
    text: >-
      The Pharmacy Board provides a licensed route for medical cultivation and processing
      focused on export.[@medgrow] The reviewed production guidelines describe applications,
      site controls and product quality; they do not set out a local patient prescription or
      dispensing service.[@medgrow]
    sources:
      - medgrow
context:
  production:
    text: >-
      Licensed companies, manufacturers and approved health organisations may apply to
      cultivate, harvest and process medical cannabis.[@medgrow] Applicants need suitable staff
      and secure premises; the Board inspects compliance and can revoke licences for security
      failures.[@medgrow]
    sources:
      - medgrow
  products:
    text: >-
      The medical production guidelines cover cannabis as a starting material for pharmaceutical
      products, including cannabis extracts, with quality standards for cultivation, harvesting
      and processing.[@medgrow] Their stated purpose includes production and manufacture for
      export.[@medgrow]
    sources:
      - medgrow
  medical:
    text: >-
      The Pharmacy Board's guidelines permit licensed medical cultivation and processing for
      export, drawing on the written-consent power in the 2001 pharmacy
      law.[@medgrow,pharmacy2001] The guidelines give an effective date of 17 May
      2024.[@medgrow] They describe production licensing and quality controls; a local patient
      access programme has not been verified.[@medgrow]
    sources:
      - medgrow
      - pharmacy2001
  consequences:
    text: A conviction is a criminal record.
    sources:
      - pm1
  planting:
    seeds: licensed
    seeds_trade: unclear
    clones: licensed
    clones_trade: unclear
    text: >-
      Cannabis is defined to include seeds and leaves in the 2008 Act.[@act] Licensed medical
      growers must use traceable planting material labelled by species, variety, chemical type
      and origin; the guidelines require female cuttings for production.[@medgrow] The reviewed
      guidelines do not specify a public seed or cutting retail channel.[@medgrow]
    sources:
      - act
      - medgrow
  clubs:
    status: none
    text: >-
      Personal cultivation and supplying cannabis are criminally restricted under the pharmacy
      law.[@pharmacy2001] The medical production guidelines provide applications for licensed
      companies, manufacturers and approved health organisations.[@medgrow]
    sources:
      - pharmacy2001
      - medgrow
  visitors:
    status: none
    text: >-
      The 2008 drug law permits courts to order deportation or cancellation of a visa after a
      drug conviction.[@act] Its possession and use offences apply without a visitor
      exemption.[@act]
    sources:
      - act
  driving:
    status: impairment
    text: >-
      Road Traffic Act section 102 prohibits driving or attempting to drive on a road while
      alcohol or drugs make proper control of the vehicle impossible. The published 2007 Act
      grades imprisonment by harm: up to six months for no or minor bodily injury to another
      person, one to two years for aggravated bodily injury, and three to five years where death
      occurs. The court may also order compensation. Current fines and later penalty amendments
      were not certified; the original monetary figures should not be read as current new-leone
      amounts. Section 107(3) requires police to consult a medical practitioner and follow that
      advice on drug-impairment questions arising under its detention provisions. Sections
      104–106 describe alcohol-oriented breath/specimen procedures and hospital safeguards, not
      a verified cannabis concentration limit. Current drug toxicology, refusal rules and
      offence-specific licence-point assignments remain follow-ups.
    sources:
      - traffic2007
  black_market:
    text: >-
      Figures reported by the government to the UN drugs office record 1,632 kg of herbal
      cannabis seized in 2024, against 22,778 kg in 2023. The UN publishes them as kilogram
      equivalents, and countries count seizures differently, so the figures are not comparable
      across borders.
    sources:
      - unodc_szr
