name: Sierra Leone
region: Africa
iso_numeric: 694
recreational: illegal
medical: none
updated: "2026-10-27"
summary: >-
  Cannabis possession and use remain crimes. The Pharmacy Board has rules for licensed medical
  cultivation and processing for export; patient access through local pharmacies has not been
  established.
scores:
  possession: 0
  cultivation: 0
  enforcement: 1
  sharing: 0
  consumption: 0
  access: 0
words:
  - { word: Diamba, lang: Krio, meaning: "cannabis; the coast-wide word carried by seamen and traders", sources: [duvall19] }
  - { word: Kush, lang: Krio, meaning: "the smoked drug devastating youth since the 2020s; prosecuted as kush in court", sources: [court2023, pm1] }
segments:
  possession:
    text: >-
      Cannabis possession has been prosecuted under the 2008 drug law, including a 2023 case in
      which two defendants were refused bail.[@court2023] The Act sets at least five years for
      unlawful drug possession but lets courts impose a shorter term or a fine when that penalty
      would be harsh or unconscionable.[@act]
    sources:
      - court2023
      - act
    penalties:
      - label: Unlawful drug possession
        treatment: criminal
        term: Possession
        prison_min: 5 years
        note: At least five years; courts may impose a shorter term or a fine where that would be harsh or unconscionable
  cultivation:
    text: >-
      Personal growers face criminal restrictions: growing a narcotic-producing plant requires
      the Pharmacy Board's written consent, and the pharmacy law sets at least fifteen years for
      cannabis offences.[@pharmacy2001] The Board has separate rules for licensed medical
      cultivation and processing for export.[@medgrow]
    sources:
      - pharmacy2001
      - medgrow
    penalties:
      - label: Cannabis offences (Pharmacy and Drugs Act)
        treatment: criminal
        term: Cultivation
        prison_min: 15 years
        note: At least fifteen years for cannabis offences; Board written consent required
      - label: Licensed medical cultivation and processing for export
        treatment: legal
        term: Licensed medical production
        note: Pharmacy Board guideline PBSL/GL/022; export only, no local patient supply verified
  enforcement:
    text: >-
      In August 2023 a Freetown magistrate refused bail to two men accused of cannabis and kush
      possession under the 2008 Act.[@court2023] The law allows prison terms for possession and
      use, with discretion to impose a shorter term or a fine in some circumstances.[@act]
    sources:
      - court2023
      - act
  sharing:
    text: >-
      The pharmacy law prohibits supplying cannabis prepared for smoking, and its
      cannabis-specific penalty requires at least fifteen years in prison for an individual
      convicted under the Act.[@pharmacy2001] The 2008 Act also punishes unlawful drug supply
      and prevails where the laws conflict.[@act]
    sources:
      - pharmacy2001
      - act
  consumption:
    text: >-
      The 2008 Act makes taking a drug by smoking, inhaling, sniffing, injecting or otherwise
      introducing it into the body a crime.[@act] The pharmacy law also expressly prohibits
      smoking cannabis and visiting premises used for it.[@pharmacy2001]
    sources:
      - act
      - pharmacy2001
  access:
    text: >-
      The Pharmacy Board provides a licensed route for medical cultivation and processing
      focused on export.[@medgrow] The reviewed production guidelines describe applications,
      site controls and product quality; they do not set out a local patient prescription or
      dispensing service.[@medgrow]
    sources:
      - medgrow
context:
  recreational:
    text: >-
      There is no legal recreational supply: possession can bring at least five years (courts may
      reduce it where harsh or unconscionable), and unlicensed cultivation at least fifteen
      years.[@act,pharmacy2001] The only licensed cannabis activity is medical cultivation and
      processing for export under Pharmacy Board guidelines; nothing is lawfully sold
      locally.[@medgrow] A 2023 case refused bail to two men accused of cannabis and kush
      possession.[@court2023]
    sources:
      - act
      - pharmacy2001
      - medgrow
      - court2023
  hemp:
    status: none
    text: >-
      No industrial-hemp exception was verified: the pharmacy law restricts narcotic-producing
      plants to Board consent with no low-THC distinction, the 2008 Act lists dangerous drugs
      without a hemp carve-out, and licensed activity is medical cultivation for
      export.[@pharmacy2001,act,medgrow]
    sources:
      - pharmacy2001
      - act
      - medgrow
  production:
    status: medical
    text: >-
      Licensed companies, manufacturers and approved health organisations may apply to
      cultivate, harvest and process medical cannabis.[@medgrow] Applicants need suitable staff
      and secure premises; the Board inspects compliance and can revoke licences for security
      failures.[@medgrow]
    sources:
      - medgrow
  medical:
    text: >-
      The Pharmacy Board's guidelines permit licensed medical cultivation and processing for
      export, drawing on the written-consent power in the 2001 pharmacy
      law.[@medgrow,pharmacy2001] The guidelines give an effective date of 17 May
      2024.[@medgrow] They describe production licensing and quality controls; a local patient
      access programme has not been verified.[@medgrow]
    sources:
      - medgrow
      - pharmacy2001
  consequences:
    text: >-
      A conviction is a criminal record.[@pm1] Sentences run heavy for small amounts: a youth got
      25 years for possessing 30.5 grams of kush, and a dealer 10 years.[@pm1,pm2]
    sources:
      - pm1
      - pm2
  planting:
    seeds: licensed
    seeds_trade: unclear
    clones: licensed
    clones_trade: unclear
    text: >-
      Cannabis is defined to include seeds and leaves in the 2008 Act.[@act] Licensed medical
      growers must use traceable planting material labelled by species, variety, chemical type
      and origin; the guidelines require female cuttings for production.[@medgrow] The reviewed
      guidelines do not specify a public seed or cutting retail channel.[@medgrow]
    sources:
      - act
      - medgrow
  clubs:
    status: none
    text: >-
      Personal cultivation and supplying cannabis are criminally restricted under the pharmacy
      law.[@pharmacy2001] The medical production guidelines provide applications for licensed
      companies, manufacturers and approved health organisations.[@medgrow]
    sources:
      - pharmacy2001
      - medgrow
  visitors:
    status: none
    text: >-
      The 2008 drug law permits courts to order deportation or cancellation of a visa after a
      drug conviction.[@act] Its possession and use offences apply without a visitor
      exemption.[@act]
    sources:
      - act
  driving:
    status: impairment
    text: >-
      Road Traffic Act section 102 prohibits driving or attempting to drive on a road while
      alcohol or drugs make proper control of the vehicle impossible.[@traffic2007] The published
      2007 Act grades imprisonment by harm: up to six months for no or minor bodily injury to
      another person, one to two years for aggravated bodily injury, and three to five years
      where death occurs.[@traffic2007] The court may also order compensation. Current fines and
      later penalty amendments were not certified; the original monetary figures should not be
      read as current new-leone amounts.[@traffic2007] Section 107(3) requires police to consult
      a medical practitioner and follow that advice on drug-impairment questions arising under
      its detention provisions.[@traffic2007] Sections 104–106 describe alcohol-oriented
      breath/specimen procedures and hospital safeguards, not a verified cannabis concentration
      limit.[@traffic2007] Current drug toxicology, refusal rules and offence-specific
      licence-point assignments remain follow-ups.
    sources:
      - traffic2007
  arrests:
    text: >-
      Enforcement runs on kush: an evaluation of the 2024–2025 national response counted 891
      kush-related arrests and 189.7 kg seized, including 47 high-level
      traffickers.[@researchsquare25] In January 2026 the organised-crime unit reported 52
      convictions, most in the Western Area.[@tocu26] President Bio responded in November 2025
      with a special drug court and a joint police-army security unit.[@telegraph25]
    sources:
      - researchsquare25
      - tocu26
      - telegraph25
  black_market:
    text: >-
      Figures reported by the government to the UN drugs office record 1,632 kg of herbal
      cannabis seized in 2024, against 22,778 kg in 2023.[@unodc_szr] The UN publishes them as
      kilogram equivalents, and countries count seizures differently, so the figures are not
      comparable across borders.[@unodc_szr] At home the trade centres on kush: the 2025 task
      force seized 198 kg of kush alongside 300 kg of cannabis, and police report wraps counted
      by the hundred in Freetown raids.[@tocu26]
    sources:
      - unodc_szr
      - tocu26
  culture:
    text: >-
      Two coast-wide words meet in Sierra Leone: [diamba](/culture/language/diamba/), the
      Bantu word carried up the coast, and [kush](/culture/language/kush/), now the street name
      of the drug devastating youth.[@duvall19,court2023] Sierra Leonean seamen once carried
      diamba along West African sea routes — in 1938 one was arrested with it in New York (see
      the [1938 seamen entry](/history/sierra-leone-seamen-regional-trafficking-1938/)).[@duvall19]
      The colonial state banned the plant in 1926 (see the [1926
      ordinance](/history/sierra-leone-dangerous-drugs-ordinance-1926/)), and the 2008 drug law
      took effect on a president-set date after a cocaine plane forced its urgency (see the [2008
      commencement](/history/sierra-leone-drugs-commencement-amendment-2008/)).
    sources:
      - duvall19
      - court2023
