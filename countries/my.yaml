segments:
  possession:
    text: >-
      Section 6 of the Dangerous Drugs Act 1952 punishes possession of cannabis, or of the seeds of
      the plant, with a fine of up to RM20,000, up to five years in prison, or both.[@dda] Section 39A
      raises this by weight: 20 g or more but under 50 g brings two to five years and three to nine
      strokes of the cane; 50 g or more brings five years to life and at least ten strokes.[@dda] A
      person found with 200 g or more is presumed to be trafficking.[@dda] Adult caning is capped at
      twenty-four strokes; women and men over fifty are exempt for these offences.[@cpc288]
    sources:
      - dda
      - cpc288
    currency: MYR
    penalties:
      - label: Basic possession, Section 6
        treatment: criminal
        term: Section 6
        prison: 5 years
        fine: 20000
        note: Up to RM20,000, up to five years, or both
      - label: 20 g or more but under 50 g, Section 39A
        treatment: criminal
        term: Section 39A
        prison_min: 2 years
        prison: 5 years
        note: Caning exclusions apply
        caning:
          - 3
          - 9
      - label: 50 g or more, Section 39A
        treatment: criminal
        term: Section 39A
        prison_min: 5 years
        life: possible
        note: >-
          Life imprisonment available; at 200 g, rebuttable trafficking presumption; caning exclusions
          apply
        caning:
          - 10
          - 24
  cultivation:
    text: >-
      Section 6B forbids planting or cultivating any plant from which cannabis can be obtained, and
      allowing it on land one owns or occupies.[@dda] The penalty is imprisonment for life and at
      least six strokes of the cane, with no lesser tier for a single plant, and a person found on the
      land is presumed to be the grower.[@dda] Only a public officer authorised by the Minister may
      grow, for research, educational, experimental or medical purposes.[@dda] Adult caning is capped
      at twenty-four strokes; women and men over fifty are exempt for these offences.[@cpc288]
    sources:
      - dda
      - cpc288
    penalties:
      - label: Planting or cultivating, Section 6B
        over: 0 plants
        treatment: criminal
        term: Section 6B
        life: mandatory
        note: Life imprisonment, even for a single plant; caning exclusions apply
        caning:
          - 6
          - 24
  enforcement:
    text: >-
      Prison and caning for possession, and the death penalty still available for trafficking.[@hrw] The
      2023 reform let over a thousand death-row prisoners apply for resentencing.[@mh]
    sources:
      - hrw
      - mh
  sharing:
    text: >-
      Supply is trafficking. Since July 2023, section 39B provides discretionary death or life
      imprisonment; a person not sentenced to death also receives at least twelve strokes of the cane.[@dda]
    sources:
      - dda
    penalties:
      - label: Trafficking, Section 39B (since 2023)
        treatment: criminal
        term: Section 39B
        death: true
        life: possible
        note: Discretionary death or life imprisonment, plus at least twelve strokes if not death
  consumption:
    text: >-
      Section 15 makes consuming or self-administering a listed drug an offence with a fine of
      up to RM5,000 or up to two years in prison.[@dda]
    sources:
      - dda
    currency: MYR
    penalties:
      - label: Consumption, Section 15
        treatment: criminal
        term: Section 15
        prison: 2 years
        fine: 5000
        note: Up to RM5,000 or up to two years
  access:
    text: >-
      None. The Dangerous Drugs Act 1952 allows cannabis to be imported only with the
      Minister's authorisation, punishes possession without such authority, and lets only an
      authorised public officer grow the plant.[@dda]
    sources:
      - dda
context:
  recreational:
    text: >-
      All recreational use is prohibited. Possession starts at up to five years, weight bands add
      caning, 200 g or more is presumed trafficking, and trafficking can bring discretionary death;
      consumption brings up to two years.[@dda,wiki]
    sources:
      - dda
      - wiki
  death_penalty:
    text: >-
      The death penalty remains available for trafficking, which is presumed from 200 g of cannabis.[@dda]
      Since July 2023 it is discretionary, not mandatory, and the reform let over a thousand death-
      row prisoners apply for resentencing.[@hrw,mh]
    sources:
      - dda
      - hrw
      - mh
  production:
    status: none
    text: >-
      No lawful cannabis production. Only a public officer authorised by the Minister may grow,
      for research, educational, experimental or medical purposes.[@dda]
    sources:
      - dda
  research:
    status: licensed
    text: >-
      Only a public officer authorised by the Minister may grow cannabis, for research,
      educational, experimental or medical purposes; no wider research programme
      operates.[@dda]
    sources:
      - dda
  medical:
    text: >-
      Medical or research use is lawful only with authorisation from the health minister.[@dda] No
      cannabis-based medicine is currently registered for patients: Sativex was registered in 2014
      and cancelled in 2017 at the company's request.[@moh_faq] CBD has no separate exemption, and
      products sold as CBD require registration as medicines.[@moh_faq] In March 2025 the Health
      Ministry said applicants with scientific evidence could submit cannabis products for
      registration, but no product has been approved.[@star25]
    sources:
      - dda
      - moh_faq
      - star25
  hemp:
    status: none
    text: >-
      No industrial-hemp or low-THC exemption was found. Cannabis is a dangerous drug under the
      1952 Act, and only a public officer authorised by the minister may grow it for research,
      education, experiment or medicine; applications from the public or private companies are not
      considered.[@dda,moh_faq] Hemp-derived CBD products require registration as medicines, and no
      fibre-hemp licensing scheme was found.[@dda]
    sources:
      - dda
      - moh_faq
  culture:
    text: >-
      Cannabis in Malaysia is known as [ganja](/culture/language/ganja/), a word carried across
      the Indian Ocean world. The plant has a long history in Malay and Indian-Muslim materia
      medica, but the modern Dangerous Drugs Act treats it as a dangerous drug with no cultural
      exemption.[@dda]
    sources:
      - dda
  consequences:
    text: >-
      A cannabis conviction is a criminal record. At 20 g or more, possession also carries mandatory
      caning; a trafficking conviction can bring life imprisonment and at least twelve strokes, or
      death.[@dda] Since the [2023 reform](/history/malaysia-mandatory-death-abolished-2023/) death
      is discretionary rather than mandatory.[@dda]
    sources:
      - dda
  planting:
    seeds: illegal
    seeds_trade: banned
    clones: illegal
    clones_trade: banned
    text: >-
      Section 6 of the Dangerous Drugs Act 1952 makes it an offence to possess cannabis "or
      the seeds of the plants from which they may be obtained" without authorisation, with up
      to five years in prison.[@dda52] Section 6B forbids planting or cultivating any plant from which
      cannabis may be obtained.[@dda52]
    sources:
      - dda52
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited, and the law provides for the death
      penalty for the most serious drug offences.[@dda]
    sources:
      - dda
  visitors:
    status: none
    text: >-
      Importing cannabis without ministerial authorisation is a separate offence under section 4,
      carrying three to five years in prison.[@dda] Simple possession is also an offence; 20 g or more
      brings caning as well as prison, while 200 g or more creates a rebuttable trafficking
      presumption.[@dda] If trafficking is established under section 39B, the sentence is death or
      life imprisonment, with at least twelve strokes where death is not imposed.[@dda]
    sources:
      - dda
  driving:
    status: impairment
    text: >-
      Road Transport Act section 44 covers drug influence that makes the driver incapable
      of proper control and causes injury or death.[@road333] A first conviction causing injury
      carries seven to ten years in prison, a RM30,000–50,000 fine and at least seven years'
      licence disqualification.[@road333] Causing death carries ten to fifteen years, RM50,000–100,000
      and at least ten years' disqualification; repeat convictions bring higher penalties.[@road333]
      Section 45 separately covers an unfit person in charge of a vehicle on a road or public
      place while not driving.[@road333] A first conviction carries RM1,000–5,000, possible imprisonment
      up to two years and at least two years' disqualification, subject to a statutory
      defence about no likelihood of driving while unfit.[@road333] Probationary licences are revoked
      on conviction under either section.[@road333] Section 45A's concentration offence concerns
      alcohol, not a THC limit; the section 44 penalties above require injury or death.[@road333]
    sources:
      - road333
  black_market:
    text: >-
      Figures reported by the government to the UN drugs office record 4,025 kg of herbal
      cannabis seized in 2024, against 4,800 kg in 2023.[@unodc_szr] The UN publishes them as kilogram
      equivalents, and countries count seizures differently, so the figures are not
      comparable across borders.[@unodc_szr]
    sources:
      - unodc_szr
  arrests:
    text: >-
      The federal police narcotics department reported 248,885 arrests for drug offences
      of all kinds between March 2024 and 16 February 2025, including 719 civil servants,
      and seizures of 102 tonnes of drugs.[@fmt25] Cannabis accounted for 3,203 kg of that, far
      behind methamphetamine at 39,397 kg and ketum at 53,879 kg.[@fmt25] The police gave no
      breakdown of the arrests by drug or by offence.[@fmt25]
    sources:
      - fmt25
