name: Malaysia
region: Asia
iso_numeric: 458
recreational: death
medical: none
updated: '2026-10-28'
summary: >-
  Possession of 200 g or more is presumed trafficking, which can carry death (no longer mandatory
  since 2023). No cannabis medicine is registered for patients.
