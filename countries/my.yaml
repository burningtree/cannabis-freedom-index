segments:
  possession:
    text: >-
      Under the Dangerous Drugs Act 1952: possession of under 20 g carries up to five years in
      prison or a fine of up to RM20,000, or both; 20–50 g carries two to five years plus three to
      nine strokes of the cane; 50–200 g carries five years to life plus at least ten strokes. At
      200 g you are presumed to be a trafficker.
    sources:
      - wiki
  cultivation:
    text: Cultivating a cannabis plant carries life imprisonment and caning.
    sources:
      - wiki
  enforcement:
    text: >-
      Prison and caning for possession, and the death penalty still available for trafficking. The
      2023 reform let over a thousand death-row prisoners apply for resentencing.
    sources:
      - hrw
      - mh
  sharing:
    text: >-
      Any supply is trafficking. Since July 2023 the death penalty for trafficking is discretionary
      rather than mandatory; the alternative is life imprisonment — now 30 to 40 years — with at
      least twelve strokes of the cane.
    sources:
      - hrw
      - mh
  consumption:
    text: >-
      Self-administration is an offence with up to two years or a fine, proved by urine test, and
      can lead to compulsory rehabilitation.
    sources:
      - wiki
  access:
    text: None.
    sources:
      - wiki
context:
  death_penalty:
    text: >-
      The death penalty remains available for trafficking, which is presumed from 200 g of cannabis.
      Since July 2023 it is discretionary, not mandatory, and the reform let over a thousand death-
      row prisoners apply for resentencing.
    sources:
      - hrw
      - mh
  production:
    text: None.
    sources:
      - wiki
  products:
    text: None; hemp-derived CBD products require registration as medicines.
    sources:
      - wiki
  medical:
    text: >-
      Medical or research use is lawful only with authorisation from the health minister, which is
      rarely granted. The government has studied a medical framework for several years without
      enacting one.
    sources:
      - wiki
  consequences:
    text: >-
      Registered drug users face supervision orders; foreigners are deported after serving their
      sentence.
    sources:
      - wiki
  planting:
    seeds: illegal
    seeds_trade: banned
    clones: illegal
    clones_trade: banned
    text: >-
      Section 6 of the Dangerous Drugs Act 1952 makes it an offence to possess cannabis "or
      the seeds of the plants from which they may be obtained" without authorisation, with up
      to five years in prison. Section 6B forbids planting or cultivating any plant from which
      cannabis may be obtained.
    sources:
      - dda52
