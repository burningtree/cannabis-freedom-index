segments:
  possession:
    text: >-
      Cannabis is controlled under the Narcotic Drugs, Psychotropic Substances and Substance Abuse
      Act 2015. An amendment gives cannabis special treatment: a person holding up to twice the
      scheduled quantity, who tests positive and has no trafficking record, is charged with
      'substance abuse' — leading to treatment and counselling — instead of trafficking. Larger
      amounts are treated as intent to supply, with prison of several years.
    sources:
      - tb1
      - trip
  cultivation:
    text: >-
      Cultivation is illegal, although cannabis grows wild across Bhutan and was traditionally used
      as pig feed and for fibre.
    sources:
      - trip
  enforcement:
    text: >-
      Treatment-first for small-scale cannabis users, prison for anything that looks like dealing;
      youth drug arrests are a prominent public concern.
    sources:
      - tb1
      - tb2
  sharing:
    text: Trafficking carries heavy sentences, scaled to quantity.
    sources:
      - tb2
  consumption:
    text: >-
      Use is the 'substance abuse' offence, handled through compulsory treatment and rehabilitation,
      with penalties for repeat cases.
    sources:
      - tb1
  access:
    text: None.
    sources:
      - trip
