name: Bhutan
region: Asia
iso_numeric: 64
recreational: illegal
medical: none
updated: '2026-10-28'
summary: >-
  Cannabis grows wild across the country but possession is a criminal offence: up to 50 g of
  herbal cannabis is a misdemeanour carrying one to under three years, and larger amounts or
  trafficking reach five to under nine years. A treatment route covers up to twice the threshold
  in limited cases.
scores:
  possession: 1
  cultivation: 0
  enforcement: 2
  sharing: 0
  consumption: 1
  access: 0
segments:
  possession:
    text: >-
      Under the Narcotic Drugs, Psychotropic Substances and Substance Abuse Act 2015, as amended
      in 2018, cannabis is a Schedule I narcotic with no medicinal value.[@act2018] Possession up
      to the Schedule VII thresholds — 50 g of herbal cannabis, 7 g of hashish or 3 ml of hashish
      oil — is a misdemeanour carrying one to under three years in prison.[@act2018] Above the
      threshold up to twice it is a fourth-degree felony carrying three to under five years, and
      more than twice it is a third-degree felony carrying five to under nine years.[@act2018] A
      person holding up to twice the threshold who tests positive, has no trafficking record and is
      not shown to be trafficking is treated as a substance-abuse case under section 141A instead
      of a trafficker.[@act2018]
    sources:
      - act2018
    penalties:
      - label: Up to 50 g herbal, 7 g hashish or 3 ml hashish oil
        treatment: criminal
        term: Illegal possession
        prison_min: 1 year
        prison: 3 years
        note: Misdemeanour; Schedule VII threshold
      - label: Above the threshold up to twice it
        treatment: criminal
        term: Illegal possession
        prison_min: 3 years
        prison: 5 years
        note: Fourth-degree felony; section 141A may treat it as substance abuse
      - label: More than twice the threshold
        treatment: criminal
        term: Illegal possession
        prison_min: 5 years
        prison: 9 years
        note: Third-degree felony
  cultivation:
    text: >-
      Growing, domesticating or harvesting cannabis is an offence under section 128.[@act2018]
      Fewer than five plants is a misdemeanour carrying one to under three years; five to fewer
      than ten is a fourth-degree felony carrying three to under five years; ten or more is a
      third-degree felony carrying five to under nine years.[@act2018] Harvesting up to 50 g is a
      misdemeanour, over 50 g to 100 g a fourth-degree felony, and over 100 g a third-degree
      felony.[@act2018] Section 130 allows fibre or animal-feed production only "as prescribed
      under rules and regulations", but the 2024 and 2026 rules contain no cannabis or hemp
      provision, so no operational licence was found.[@act2018,regs2026]
    sources:
      - act2018
      - regs2026
    penalties:
      - label: Fewer than five plants
        treatment: criminal
        term: Cultivation
        prison_min: 1 year
        prison: 3 years
        note: Misdemeanour
      - label: Five to fewer than ten plants
        treatment: criminal
        term: Cultivation
        prison_min: 3 years
        prison: 5 years
        note: Fourth-degree felony
      - label: Ten or more plants
        treatment: criminal
        term: Cultivation
        prison_min: 5 years
        prison: 9 years
        note: Third-degree felony
      - label: Harvest up to 50 g
        treatment: criminal
        term: Harvesting
        prison_min: 1 year
        prison: 3 years
        note: Misdemeanour
      - label: Harvest over 50 g to 100 g
        treatment: criminal
        term: Harvesting
        prison_min: 3 years
        prison: 5 years
        note: Fourth-degree felony
      - label: Harvest over 100 g
        treatment: criminal
        term: Harvesting
        prison_min: 5 years
        prison: 9 years
        note: Third-degree felony
  enforcement:
    text: >-
      Cannabis seizures rose from 2.37 kg in the first half of 2025 to 47.43 kg in the first half
      of 2026, and cannabis-trafficking cases from three to thirteen, even as total drug cases fell
      from 819 to 713.[@bhutanese26] In 2024 police arrested 3,319 people for drug offences,
      referred 2,578 to treatment and convicted 229; the Royal Bhutan Police yearbook recorded 25
      cannabis-trafficking and 10 cannabis-possession offences that year.[@bhutanese25,rbp24] The
      force began a nationwide cannabis uprooting campaign in May 2025.[@uproot25]
    sources:
      - bhutanese26
      - bhutanese25
      - rbp24
      - uproot25
  sharing:
    text: >-
      Section 133 makes trafficking — possessing, importing, exporting, storing, selling,
      purchasing, transporting, distributing or supplying — an offence above the Schedule VII
      thresholds.[@act2018] Over 50 g to 100 g of herbal cannabis, over 7 g to 14 g of hashish or
      over 3 ml to 6 ml of oil is a fourth-degree felony carrying three to under five years; more
      than twice the threshold is a third-degree felony carrying five to under nine years.[@act2018]
      Because the offence requires more than the threshold, selling or sharing up to 50 g is not
      clearly trafficking and may be charged as possession; the Act creates no separate small-scale
      supply offence.[@act2018] Soliciting another person to use is a separate misdemeanour.[@act2018]
    sources:
      - act2018
    penalties:
      - label: Trafficking over the threshold up to twice it
        treatment: criminal
        term: Trafficking
        prison_min: 3 years
        prison: 5 years
        note: Fourth-degree felony
      - label: Trafficking more than twice the threshold
        treatment: criminal
        term: Trafficking
        prison_min: 5 years
        prison: 9 years
        note: Third-degree felony
      - label: Selling or sharing up to the threshold
        treatment: criminal
        term: Possession
        prison_min: 1 year
        prison: 3 years
        note: No separate small-scale supply offence; may be charged as possession
  consumption:
    text: >-
      Section 152 treats substance abuse as a treatment offence rather than a prison offence for
      the first three findings: at least three months' compulsory treatment if addicted, or one
      month's counselling, then at least six months, then treatment plus at least a year's community
      service.[@act2018] A fourth finding is a misdemeanour carrying one to under three years, with
      treatment and community service.[@act2018] The no-possession route in section 152 expressly
      excludes cannabis; cannabis substance abuse generally requires possession of no more than the
      Schedule VII quantity plus a positive test.[@act2018]
    sources:
      - act2018
  access:
    text: >-
      None. Cannabis is Schedule I with no medicinal value, and no patient, CBD or hemp consumer
      route exists.[@act2018] Section 18 allows the competent authority to authorise Schedule I
      substances for medical or scientific research, teaching or forensic work, but not
      treatment.[@act2018]
    sources:
      - act2018
context:
  recreational:
    text: >-
      There is no legal recreational supply. Possession up to 50 g of herbal cannabis is a
      misdemeanour carrying one to under three years, with higher felony bands above that; a person
      holding up to twice the threshold who tests positive and has no trafficking record may be
      treated as a substance-abuse case instead.[@act2018] Cannabis grows wild across the country
      and was traditionally used to fatten pigs and, less often, for textile fibre.[@bbs23] Local
      leaders in Samdrup Jongkhar asked Parliament in 2023 to allow sale for medicinal purposes.[@bbs23]
    sources:
      - act2018
      - bbs23
  production:
    status: none
    text: >-
      No lawful cannabis production. Section 130 allows fibre or animal-feed production only as
      prescribed by rules, but neither the 2024 nor the 2026 narcotics rules contains a cannabis or
      hemp provision, and no licence was found.[@act2018,regs2026]
    sources:
      - act2018
      - regs2026
  research:
    status: licensed
    text: >-
      Section 18 allows the competent authority to authorise production, import, use or holding of
      Schedule I substances for medical or scientific research, teaching or forensic work, and the
      2026 rules set research authorisations.[@act2018,regs2026] No active cannabis research
      programme was verified beyond that permission.[@act2018]
    sources:
      - act2018
      - regs2026
  medical:
    text: >-
      No medical cannabis programme. Cannabis is Schedule I, described as having no medicinal
      value; section 18 permits research, teaching or forensic work, not treatment.[@act2018] No
      CBD medicine was found.[@act2018]
    sources:
      - act2018
  hemp:
    status: none
    text: >-
      There is no legal hemp category and no THC ceiling. All cannabis is Schedule I, and the
      definition expressly includes seeds.[@act2018] Section 130's fibre and animal-feed exception
      has not been implemented in the 2024 or 2026 rules, and no hemp licence was found.[@act2018,regs2026]
    sources:
      - act2018
      - regs2026
  consequences:
    text: >-
      A trafficking conviction is a felony with prison, and a felony conviction is a serious
      criminal record.[@act2018] Substance-abuse findings lead to compulsory treatment and
      counselling, and a fourth finding becomes a misdemeanour.[@act2018]
    sources:
      - act2018
  planting:
    seeds: illegal
    seeds_trade: banned
    clones: illegal
    clones_trade: banned
    text: >-
      Cannabis includes the plant, flowering tops, seeds and leaves.[@act2018] Planting a seed is
      cultivation under section 128, and there is no seed-sale, seed-import or hemp-seed exception;
      even fewer than five plants is a misdemeanour.[@act2018] The only exceptions are a section 18
      research authorisation and the unoperationalised section 130 fibre and animal-feed
      permission.[@act2018,regs2026]
    sources:
      - act2018
      - regs2026
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited.[@act2018]
    sources:
      - act2018
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. Possession up to 50 g of herbal cannabis is
      a misdemeanour carrying one to under three years, and larger amounts or trafficking reach
      higher felony bands; no separate rule for visitors was found.[@act2018]
    sources:
      - act2018
  driving:
    status: impairment
    text: >-
      Road Safety and Transport Act 1999 section 34 prohibits driving while under the influence of
      any drug of addiction to an extent that proper control is impossible; the fine is 25 penalty
      units, or Nu 1,250.[@roadact1999] Section 37 cancels the licence and disqualifies the driver
      for at least six months, or as the court determines.[@roadact1999] The 2026 Road Safety
      Regulations, in force from 1 July 2026, retain drug-testing kits and a standard operating
      procedure but set no THC cutoff.[@roadregs2026] The offence is impairment-based.[@roadact1999]
    sources:
      - roadact1999
      - roadregs2026
  black_market:
    text: >-
      The government reported 13.2 kg of herbal cannabis and 1.3 kg of cannabis resin seized in
      2024, against 1.1 kg of resin in 2023.[@unodc_szr] The Royal Bhutan Police reported 13.15 kg
      of leaves, 1.26 kg of hashish and 337 cannabis plants in 2024.[@rbp24] Seizures rose sharply
      in 2026: 47.4 kg in the first half, against 2.37 kg a year earlier, including 28.5 kg in
      parcel consignments in February and 22.34 kg at the airport in September.[@bhutanese26,kuensel26]
      The figures use different categories and are not directly comparable.[@unodc_szr,rbp24]
    sources:
      - unodc_szr
      - rbp24
      - bhutanese26
      - kuensel26
  arrests:
    text: >-
      Police arrested 3,319 people for drug offences in 2024, down from 3,667 in 2023; 2,578 were
      referred for treatment and 229 were convicted.[@bhutanese25] The Royal Bhutan Police yearbook
      recorded 326 drug offences that year, including 25 cannabis-trafficking and 10
      cannabis-possession cases.[@rbp24] In the first half of 2026 police recorded 713 drug cases and
      1,373 arrests, with 13 cannabis-trafficking and 10 possession cases.[@bhutanese26] The figures
      use different counting bases and are not a single continuous series.[@bhutanese25,rbp24]
    sources:
      - bhutanese25
      - rbp24
      - bhutanese26
