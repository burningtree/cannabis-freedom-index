  consequences:
    text: Compulsory treatment is recorded; a trafficking conviction is a serious criminal record.
    sources:
      - tb1
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited.
    sources:
      - tb2
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. British travel advice says there are
      strict penalties for possession, use and trafficking: a prison sentence and a heavy
      fine, with sentences from a minimum of 3 years up to life depending on the type and
      quantity of drug.
    sources:
      - fcdo
  driving:
    status: impairment
    text: >-
      Road Safety and Transport Act section 34 prohibits driving when an addictive
      drug makes proper vehicle control impossible. It specifies 25 penalty units;
      section 37 requires licence/certificate cancellation after conviction and
      disqualification for a period stated as at least six months or as determined
      by the court. These statutory conviction consequences are distinct from the
      regulations' administrative
      schedule. The authority's 2021 Regulations provide standard drug-testing kits
      and require its operating procedure under sections 454–455. Schedule X item
      13 specifies at least six months' suspension and referral to BNCA for an
      ordinary licence; the professional/commercial column specifies six months,
      one demerit point and referral. Section 478 permits stopping drug-impaired
      driving. The authority confirms regulation commencement on 1 July 2022,
      although its linked PDF leaves the commencement field blank. No THC cutoff,
      kit positivity presumption or complete operational confirmation/refusal protocol
      was established. The alcohol schedule is not a cannabis fine table.
    sources:
      - roadact1999
      - roadregulations2021
      - regulationcommencement
