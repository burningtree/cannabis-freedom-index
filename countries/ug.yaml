name: Uganda
region: Africa
iso_numeric: 800
recreational: illegal
medical: limited
updated: 2026-10-12
summary: >-
  Possession carries up to twenty years with no lesser tier for personal use; a handful of
  licences exist for medical cultivation for export.
scores:
  possession: 0
  cultivation: 1
  enforcement: 1
  sharing: 0
  consumption: 1
  access: 0
segments:
  possession:
    text: >-
      Section 4 of the Narcotic Drugs and Psychotropic Substances (Control) Act 2024 makes
      possession of a narcotic drug an offence with a fine of up to 50,000 currency points, a
      billion shillings, or three times the drug's market value if that is more, up to twenty
      years in prison, or both. No lesser tier is set for a small amount or for personal use.
      The Act was re-enacted after the Constitutional Court annulled the 2016 law for lack of a
      quorum.
    sources:
      - gaz24
      - ab
  cultivation:
    text: >-
      Section 11 forbids knowingly cultivating or gathering a prohibited plant without a licence
      from the health minister. The penalty is a fine of up to 120 currency points, 2.4 million
      shillings, or three times the market value of the plants if that is more, up to five years
      in prison, or both; a second or later offence brings imprisonment for life.
    sources:
      - gaz24
  enforcement:
    text: >-
      One of East Africa's stricter laws, combining long sentences, large fines and asset
      forfeiture.
    sources:
      - ab
      - ml
  sharing:
    text: >-
      Trafficking carries a fine of up to 50,000 currency points or three times the drug's
      market value, imprisonment for life, or both (Section 5). The Act's definition of
      trafficking includes giving and supplying, so passing cannabis to another person unpaid is
      treated the same way.
    sources:
      - gaz24
  consumption:
    text: >-
      Section 6 makes it an offence to smoke, inhale, sniff, chew or otherwise use a narcotic
      drug, to be found without excuse in a place people use for it, or to possess a pipe or
      other utensil for it: a fine of up to 50,000 currency points, up to ten years in prison,
      or both.
    sources:
      - gaz24
  access:
    text: No legal source.
    sources:
      - ab
context:
  production:
    text: >-
      The 2024 Act allows licensed cultivation strictly for medical use, with all licences issued by
      the health ministry. A few export-oriented projects have operated.
    sources:
      - ab
      - act
  products:
    text: No legal consumer products.
    sources:
      - ab
  medical:
    text: Medical use is permitted in principle under licence; there is no accessible patient programme.
    sources:
      - ab
      - ml
  consequences:
    text: A conviction is a criminal record; property can be forfeited.
    sources:
      - ab
  planting:
    seeds: grey
    seeds_trade: open
    clones: illegal
    clones_trade: banned
    text: >-
      The 2024 narcotics act defines cannabis as the flowering or fruiting tops of the plant,
      "excluding the seeds", so loose seed is not itself a narcotic drug. Cultivating is
      defined to include "sowing or scattering the seed", and growing the plant without a
      licence is an offence.
    sources:
      - ndps24
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited.
    sources:
      - ab
      - act
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. The 2024 Act sets up to twenty years in
      prison for possession, up to ten for using a drug or being found where it is used, and
      life for trafficking.
    sources:
      - gaz24
  driving:
    status: impairment
    text: >-
      Section 112 of the Traffic and Road Safety Act prohibits driving or attempting to drive
      under drug influence. It expressly includes pharmaceutical and prescribed drugs, with
      no numerical THC allowance stated. Conviction carries up to 300 currency points
      (UGX6 million), up to three years' imprisonment, or both. Section 113 permits blood
      or urine testing on reasonable suspicion; refusal of a required blood specimen carries
      up to 100 currency points and is prima facie evidence of drug influence or excess
      alcohol. The 2023 Regulations allow police to escort a suspected drug-influenced driver
      for a medical test and impound the vehicle. A fixed cannabis-specific licence-ban
      duration was not established: the consolidated Act's section 46 contains an alcohol
      condition alongside a cross-reference to section 112, which must not be presented
      as an unconditional drug-driving ban.
    sources:
      - trafficact
      - drugtraffic2023
