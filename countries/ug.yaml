segments:
  possession:
    text: >-
      Possession is a crime under the Narcotic Drugs and Psychotropic Substances (Control) Act 2024,
      re-enacted after the Constitutional Court annulled the 2015 law on procedural grounds. It
      carries heavy fines and prison terms measured in years.
    sources:
      - act
      - ab
  cultivation:
    text: >-
      Unauthorised growing of cannabis is specifically penalised, with lengthy prison terms and
      forfeiture of property.
    sources:
      - ab
      - act
  enforcement:
    text: >-
      One of East Africa's stricter laws, combining long sentences, large fines and asset
      forfeiture.
    sources:
      - ab
      - ml
  sharing:
    text: Trafficking carries very long sentences, up to life.
    sources:
      - act
  consumption:
    text: Use is an offence; smoking and being found in a place used for smoking are both punishable.
    sources:
      - act
      - ml
  access:
    text: No legal source.
    sources:
      - ab
context:
  production:
    text: >-
      The 2024 Act allows licensed cultivation strictly for medical use, with all licences issued by
      the health ministry. A few export-oriented projects have operated.
    sources:
      - ab
      - act
  products:
    text: No legal consumer products.
    sources:
      - ab
  medical:
    text: Medical use is permitted in principle under licence; there is no accessible patient programme.
    sources:
      - ab
      - ml
  consequences:
    text: A conviction is a criminal record; property can be forfeited.
    sources:
      - ab
