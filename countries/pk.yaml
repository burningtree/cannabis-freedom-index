  consumption:
    text: >-
      The Act deals with users through registration and treatment: each province is to register
      addicts, who must carry a registration card, and the federal government pays for a first
      compulsory detoxification.[@cnsa23] Holding the drug to use it is punished as
      possession.[@cnsa23] Use is culturally embedded, particularly at Sufi shrines, and bhang
      drinks are consumed at festivals.[@malang20]
    sources:
      - cnsa23
      - malang20
  access:
    text: >-
      No legal source for adults: Section 6 of the Control of Narcotic Substances Act forbids
      possessing any narcotic and Section 4 forbids cultivating any cannabis plant without a
      government licence.[@cnsa23] The Cannabis Control and Regulatory Authority licenses medical
      and industrial production, but no patient or adult retail supply was found.[@ccra_scope]
    sources:
      - cnsa23
      - ccra_scope
context:
  recreational:
    text: >-
      Illegal on paper, widely used in practice: charas is smoked widely and police often ignore
      it, and use is culturally embedded at Sufi shrines and festivals.[@shc] Minimum prison terms
      apply to possession of any amount, but no legal adult-use source exists.[@cnsa23] No price or
      purity data were found.
    sources:
      - cnsa23
      - shc
  production:
    status: medical
    text: >-
      The cannabis regulator publishes an application route for industrial-hemp cultivation,
      controlled and open-field medicinal cannabis cultivation, extraction, pharmaceutical
      manufacturing and research.[@ccra_scope] Applicants must meet tax, police-clearance,
      financial, technical and site-security requirements; foreign investors need a Pakistani
      joint-venture partner holding at least 51%.[@ccra_scope] Cultivation-only applicants may
      apply as individuals, while other activities have their own documentary requirements.[@ccra_scope]
    sources:
      - ccra_scope
  medical:
    text: >-
      No working patient programme or legal consumer product was found. The Cannabis Control and
      Regulatory Authority licenses medicinal cultivation, extraction and pharmaceutical
      manufacturing, but the licensing scheme is still being built and no prescription or pharmacy
      supply route was verified.[@ccra_scope] Medical status stays limited.
    sources:
      - ccra_scope
  hemp:
    status: standard
    text: >-
      Industrial hemp is a licensed category with a THC ceiling of 0.3%. The regulator issues
      A-1 cultivation licences in three size classes, from up to 50 acres to more than 250 acres,
      with police clearance, tax registration and site-security conditions.[@ccra_policy] The 2026
      licensing rules add application and issuance fees, a five-year term and THC testing.[@ccra_rules]
      Recreational use remains illegal.[@ccra_policy]
    sources:
      - ccra_policy
      - ccra_rules
  consequences:
    text: >-
      A narcotics conviction carries a criminal record.[@shc] The Act sets mandatory minimum
      prison terms for possession and trafficking, and the 2023 amendment removed death from the
      remaining federal drug-law rows while leaving life imprisonment as the maximum.[@na23]
    sources:
      - shc
      - na23
  planting:
    seeds: grey
    seeds_trade: open
    clones: illegal
    clones_trade: banned
    text: >-
      The Control of Narcotic Substances Act 1997 defines cannabis as the resin and the flowering
      or fruiting tops, "excluding the seed and leaves when not accompanied by the tops", so loose
      seed is not a narcotic drug.[@cnsa] Section 4 forbids cultivating any cannabis plant or
      gathering any portion of one, unless the government licenses it for medical, scientific or
      industrial purposes.[@cnsa]
    sources:
      - cnsa
  clubs:
    status: none
    text: >-
      No cannabis clubs in the modern sense are known, and the law leaves no room for them:
      growing and supplying cannabis are prohibited.[@cnsa23] The collective use that does exist is
      religious and much older. Malangs, the wandering mendicants found at Sufi shrines such as
      Lal Shahbaz Qalandar in Sehwan, commonly smoke charas and drink bhang, which they regard as
      part of their devotion.[@malang20] That is a devotional custom, not a members' association.
    sources:
      - cnsa23
      - malang20
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. The narcotics act sets minimum prison terms
      for possession of any amount: at least ten months for up to 499 g of charas and at least six
      months for up to 999 g of bhang, each with a fine.[@cnsa23] The law makes no exception for
      visitors.[@cnsa23]
    sources:
      - cnsa23
  driving:
    status: impairment
    text: >-
      The Provincial Motor Vehicles Ordinance's section 100 prohibits driving or attempting to
      drive while drink or drugs prevent proper vehicle control.[@motortraffic] The published
      version provides up to six months' imprisonment or a fine or both for a first offence, and up
      to two years for a repeat; section 18(2) provides at least six months' disqualification.[@motortraffic]
      No numeric THC threshold is stated, and provincial amendments mean the fine figures are not a
      uniform nationwide tariff.[@motortraffic]
    sources:
      - motortraffic
  black_market:
    text: >-
      The whole market is illegal, and hashish (charas) is the drug the authorities seize most. In
      2024 Pakistan reported seizing 167.4 tonnes of cannabis resin and 9.9 tonnes of herbal
      cannabis, a sharp rise from 102.4 tonnes of resin in 2023.[@unodc] The 2025 INCSR recorded
      138.63 tonnes of hashish in the twelve months to June 2024, alongside 11.1 tonnes of heroin
      and 16.8 tonnes of opium, and estimated that cannabis had become the most popular
      drug.[@incsr] No price or purity data were found.
    sources:
      - unodc
      - incsr
  arrests:
    text: >-
      The 2025 INCSR recorded about 93,440 drug-related arrests in the twelve months to June 2024,
      predominantly low-level dealers, and 8 million people who had used drugs in 2024.[@incsr]
      The number of people imprisoned under the narcotics act rose from 19,636 in 2023 to 23,367
      in 2024 and 25,168 in June 2026, when they made up 22.31% of Pakistan's prison
      population.[@jpp] The figures cover all drugs and give no cannabis breakdown.
    sources:
      - incsr
      - jpp
  culture:
    text: >-
      Pakistan's cannabis culture centres on [charas](/culture/language/charas/), the hand-rubbed
      resin, and [hashish](/culture/language/hashish/) more broadly. The Hindu Kush gave its name to
      [kush](/culture/language/kush/), and the old farmers' populations of the region are
      [landraces](/culture/language/landrace/); the botanical split between
      [indica and sativa](/culture/language/indica-and-sativa/) also drew on South Asian drug
      types.[@wiki] At Sufi shrines, malangs smoke charas and drink bhang as part of their
      devotion.[@malang20]
    sources:
      - wiki
      - malang20
