segments:
  possession:
    text: >-
      Under the Control of Narcotic Substances Act as amended in 2022, possessing up to 499 g of
      charas (hashish) carries prison of at least ten months and up to five years, plus a fine;
      sentences rise steeply above that. Charas is nonetheless smoked widely and police often ignore
      it or take a bribe, so the law's severity and daily reality diverge sharply.
    sources:
      - shc
      - wiki
  cultivation:
    text: >-
      Cultivation is a criminal offence, though cannabis grows wild across the north and is farmed
      in the tribal districts.
    sources:
      - wiki
  enforcement:
    text: >-
      Mandatory minimum prison terms on paper, with uneven enforcement that falls hardest on the
      poor.
    sources:
      - shc
      - wiki
  sharing:
    text: Supply is trafficking, with sentences up to life or death for large quantities.
    sources:
      - shc
  consumption:
    text: >-
      Use is illegal but culturally embedded, particularly at Sufi shrines, and bhang drinks are
      consumed at festivals.
    sources:
      - wiki
  access:
    text: No legal source.
    sources:
      - wiki
context:
  death_penalty:
    text: >-
      Trafficking carries sentences up to life or death for large quantities.
    sources:
      - shc
  production:
    text: >-
      A Cannabis Control and Regulatory Authority was created in 2024 to license cultivation and
      processing for medical and industrial purposes; the framework is still being built.
    sources:
      - wiki
  products:
    text: No legal consumer products.
    sources:
      - wiki
  medical:
    text: No working medical programme yet.
    sources:
      - wiki
  consequences:
    text: A narcotics conviction carries a criminal record.
    sources:
      - shc
  planting:
    seeds: grey
    seeds_trade: open
    clones: illegal
    clones_trade: banned
    text: >-
      The Control of Narcotic Substances Act 1997 defines cannabis as the resin and the
      flowering or fruiting tops, "excluding the seed and leaves when not accompanied by the
      tops", so loose seed is not a narcotic drug. Section 4 forbids cultivating any cannabis
      plant or gathering any portion of one, unless the government licenses it for medical,
      scientific or industrial purposes.
    sources:
      - cnsa
  black_market:
    text: >-
      The whole market is illegal, and hashish (charas) is the drug the Anti-Narcotics Force
      seizes most. In the twelve months to mid-2023 the force reported 157.5 tonnes of drugs
      seized nationwide, of which 61.8 tonnes were hashish, ahead of 43.2 tonnes of opium and
      9.3 tonnes of heroin; 1,652 people were arrested in 1,678 cases. Eight operations at sea
      in 2023, run with foreign agencies on the force's intelligence, took another 13.3 tonnes
      of charas, which points to a large export trade as well as a domestic one.
    sources:
      - dt23
  clubs:
    status: none
    text: >-
      No cannabis clubs in the modern sense are known, and the law leaves no room for them:
      growing and supplying cannabis are prohibited, and the law provides for the death
      penalty for the most serious drug offences. The collective use that does exist is
      religious and much older. Malangs, the wandering mendicants found in large numbers at
      Sufi shrines such as that of Lal Shahbaz Qalandar in Sehwan, commonly smoke charas and
      drink bhang, which they regard as part of their devotion and an aid to ecstatic dance
      and trance, according to a 2020 study in a Lahore university journal. That is a
      devotional custom outside respectable society, not a members' association.
    sources:
      - wiki
      - shc
      - malang20
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. British travel advice says possession
      of even small quantities can bring a prison sentence, and that British nationals
      arrested on trafficking charges have been held for long periods while their cases go
      through the courts.
    sources:
      - wiki
      - fcdo
