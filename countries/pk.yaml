segments:
  possession:
    text: >-
      Under the Control of Narcotic Substances Act as amended in 2022, possessing up to 499 g of
      charas (hashish) carries prison of at least ten months and up to five years, plus a fine;
      sentences rise steeply above that. Charas is nonetheless smoked widely and police often ignore
      it or take a bribe, so the law's severity and daily reality diverge sharply.
    sources:
      - shc
      - wiki
  cultivation:
    text: >-
      Cultivation is a criminal offence, though cannabis grows wild across the north and is farmed
      in the tribal districts.
    sources:
      - wiki
  enforcement:
    text: >-
      Mandatory minimum prison terms on paper, with uneven enforcement that falls hardest on the
      poor.
    sources:
      - shc
      - wiki
  sharing:
    text: Supply is trafficking, with sentences up to life or death for large quantities.
    sources:
      - shc
  consumption:
    text: >-
      Use is illegal but culturally embedded, particularly at Sufi shrines, and bhang drinks are
      consumed at festivals.
    sources:
      - wiki
  access:
    text: No legal source.
    sources:
      - wiki
context:
  death_penalty:
