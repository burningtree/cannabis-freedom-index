name: Pakistan
region: Asia
iso_numeric: 586
recreational: illegal
medical: limited
updated: '2026-10-28'
summary: >-
  Illegal, yet charas is widely used and largely tolerated in parts of the country. The cannabis
  regulator publishes licence categories and application requirements for medicinal cultivation,
  extraction, manufacturing and industrial hemp.
scores:
  possession: 1
  cultivation: 1
  enforcement: 1
  sharing: 1
