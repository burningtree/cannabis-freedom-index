name: Pakistan
region: Asia
iso_numeric: 586
recreational: illegal
medical: limited
updated: 2026-10-12
summary: >-
  Illegal, yet charas is widely used and largely tolerated in parts of the country. A regulatory
  authority for medical and industrial cannabis was created in 2024.
scores:
  possession: 1
  cultivation: 1
  enforcement: 1
  sharing: 1
  consumption: 2
  access: 0
segments:
  possession:
    text: >-
      Section 6 of the Control of Narcotic Substances Act forbids possessing any narcotic, and
      Section 9 sets the sentence by drug and weight. In the consolidated text, up to 499 g of
      charas (hashish) carries ten months to five years in prison and a fine of up to 40,000
      rupees, and 500 to 999 g five to nine years; up to 999 g of bhang, the herbal form,
      carries six months to three years and a fine of up to 10,000 rupees. Charas is nonetheless
      smoked widely and police often ignore it or take a bribe, so the law's severity and daily
      reality diverge sharply.
    sources:
      - cnsa23
      - shc
      - wiki
  cultivation:
    text: >-
      Section 4 forbids cultivating any cannabis plant, letting land for it, or gathering any
      part of the plant; under Section 5 as amended in 2022 the penalty is one to seven years in
      prison and a fine. The federal government, or a province it authorises, may license
      cultivation for medical, scientific or industrial purposes only. Cannabis nonetheless
      grows wild across the north and is farmed in the tribal districts.
    sources:
      - cnsa23
      - wiki
  enforcement:
    text: >-
      Mandatory minimum prison terms on paper, with uneven enforcement that falls hardest on the
      poor.
    sources:
      - shc
      - wiki
  sharing:
    text: Supply is trafficking, with sentences up to life imprisonment for the largest quantities.
    sources:
      - shc
      - na23
      - hri24
  consumption:
    text: >-
      The Act deals with users through registration and treatment: each province is to register
      addicts, who must carry a registration card, and the federal government pays for a first
      compulsory detoxification. Holding the drug to use it is punished as possession. Use is
      culturally embedded, particularly at Sufi shrines, and bhang drinks are consumed at
      festivals.
    sources:
      - cnsa23
      - wiki
  access:
    text: >-
      No legal source for adults: Section 6 of the Control of Narcotic Substances Act forbids
      possessing any narcotic and Section 4 forbids cultivating any cannabis plant without a
      government licence.
    sources:
      - cnsa23
context:
  production:
    text: >-
      A Cannabis Control and Regulatory Authority was created in 2024 to license cultivation and
      processing for medical and industrial purposes; the framework is still being built.
    sources:
      - wiki
  products:
    text: No legal consumer products.
    sources:
      - wiki
  medical:
    text: No working medical programme yet.
    sources:
      - wiki
  consequences:
    text: A narcotics conviction carries a criminal record.
    sources:
      - shc
  planting:
    seeds: grey
    seeds_trade: open
    clones: illegal
    clones_trade: banned
    text: >-
      The Control of Narcotic Substances Act 1997 defines cannabis as the resin and the
      flowering or fruiting tops, "excluding the seed and leaves when not accompanied by the
      tops", so loose seed is not a narcotic drug. Section 4 forbids cultivating any cannabis
      plant or gathering any portion of one, unless the government licenses it for medical,
      scientific or industrial purposes.
    sources:
      - cnsa
  black_market:
    text: >-
      The whole market is illegal, and hashish (charas) is the drug the Anti-Narcotics Force
      seizes most. In the twelve months to mid-2023 the force reported 157.5 tonnes of drugs
      seized nationwide, of which 61.8 tonnes were hashish, ahead of 43.2 tonnes of opium and
      9.3 tonnes of heroin; 1,652 people were arrested in 1,678 cases. Eight operations at sea
      in 2023, run with foreign agencies on the force's intelligence, took another 13.3 tonnes
      of charas, which points to a large export trade as well as a domestic one.
    sources:
      - dt23
  clubs:
    status: none
    text: >-
      No cannabis clubs in the modern sense are known, and the law leaves no room for them:
      growing and supplying cannabis are prohibited. The collective use that does exist is
      religious and much older. Malangs, the wandering mendicants found in large numbers at
      Sufi shrines such as that of Lal Shahbaz Qalandar in Sehwan, commonly smoke charas and
      drink bhang, which they regard as part of their devotion and an aid to ecstatic dance
      and trance, according to a 2020 study in a Lahore university journal. That is a
      devotional custom outside respectable society, not a members' association.
    sources:
      - wiki
      - shc
      - malang20
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. The narcotics act sets minimum prison
      terms for possession of any amount: at least ten months for up to 499 g of charas and at
      least six months for up to 999 g of bhang, each with a fine.
    sources:
      - cnsa23
  driving:
    status: impairment
    text: >-
      The Provincial Motor Vehicles Ordinance's section 100 prohibits driving or attempting
      to drive while drink or drugs prevent proper vehicle control. The version published
      by Pakistan's Ministry of Law provides up to six months' imprisonment or a fine or
      both for a first offence, and up to two years or a fine or both for a repeat. Section
      18(2) provides at least six months' disqualification on conviction under section 100.
      This describes the published baseline Ordinance: provincial amendments and separate
      highway legislation mean its fine figures should not be treated as a current uniform
      nationwide tariff. No numeric THC threshold is stated in section 100. Current
      provincial ticket schedules, testing procedures and any special rules for medical
      patients remain to be verified.
    sources:
      - motortraffic
