segments:
  possession:
    text: >-
      Section 6 of the Control of Narcotic Substances Act forbids possessing any narcotic, and
      Section 9 sets the sentence by drug and weight.[@cnsa23] In the consolidated text, up to
      499 g of charas (hashish) carries ten months to five years in prison and a fine of up to
      40,000 rupees, and 500 to 999 g five to nine years.[@cnsa23] Up to 999 g of bhang, the
      herbal form, carries six months to three years and a fine of up to 10,000 rupees.[@cnsa23]
      Hashish oil has its own higher scale, starting at fourteen months to seven years for up to
      499 g.[@cnsa23] Charas is nonetheless smoked widely and police often ignore it or take a
      bribe, so the law's severity and daily reality diverge sharply.[@shc]
    sources:
      - cnsa23
      - shc
    currency: PKR
    penalties:
      - label: Bhang up to 999 g
        treatment: criminal
        term: Possession
        prison_min: 6 months
        prison: 3 years
        fine: 10000
      - label: Charas up to 499 g
        treatment: criminal
        term: Possession
        prison_min: 10 months
        prison: 5 years
        fine: 40000
      - label: Hashish oil up to 499 g
        treatment: criminal
        term: Possession
        prison_min: 14 months
        prison: 7 years
        fine: 40000
        note: Higher bands for all three drugs are on the sharing table
  cultivation:
    text: >-
      Section 4 forbids cultivating any cannabis plant, letting land for it, or gathering any
      part of the plant; under Section 5 as amended in 2022 the penalty is one to seven years in
      prison and a fine.[@cnsa23] The federal government, or a province it authorises, may license
      cultivation for medical, scientific or industrial purposes only.[@cnsa23] Cannabis
      nonetheless grows wild across the north and is farmed in the tribal districts.[@wiki]
    sources:
      - cnsa23
      - wiki
    currency: PKR
    penalties:
      - label: Unauthorised cultivation
        treatment: criminal
        term: Cultivation
        prison_min: 1 year
        prison: 7 years
        note: Fine also imposed; a government licence is possible for medical, scientific or industrial purposes
  enforcement:
    text: >-
      Mandatory minimum prison terms apply on paper, with uneven enforcement that falls hardest on
      the poor.[@shc] The Anti-Narcotics Force reported 1,652 arrests in 1,678 cases in the twelve
      months to mid-2023, and 157.5 tonnes of drugs seized, of which 61.8 tonnes were
      hashish.[@dt23] No national cannabis-specific arrest figures for 2024–2026 were found.
    sources:
      - shc
      - dt23
  sharing:
    text: >-
      Supply is trafficking under Sections 6 to 8, and Section 9 applies the same weight table as
      possession. For bhang, the bands run from six months to three years for up to 999 g, to a
      minimum of fourteen years and possible life imprisonment from 20 kg. Charas starts at ten
      months to five years for up to 499 g and reaches a minimum of twenty years and possible life
      imprisonment from 10 kg. Hashish oil starts at fourteen months to seven years and reaches a
      minimum of twenty years and possible life from 5 kg.[@cnsa23]
    sources:
      - cnsa23
    currency: PKR
    penalties:
      - label: Bhang up to 999 g
        treatment: criminal
        term: Trafficking
        prison_min: 6 months
        prison: 3 years
        fine: 10000
      - label: Bhang 1,000–9,999 g
