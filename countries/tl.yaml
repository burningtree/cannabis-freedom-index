  consequences:
    text: >-
      Under Article 17 of Law 2/2017, the owner or manager of a hotel, restaurant, café, club or
      venue who allows it to be used for illicit drug use or trafficking faces 2 to 8 years in
      prison.
    sources:
      - l2
  planting:
    seeds: grey
    seeds_trade: unclear
    clones: illegal
    clones_trade: banned
    text: >-
      Law 2/2017 lists cannabis as the leaves and flowering or fruiting tops of the plant, and
      its articles do not mention seeds. Growing without authorisation is trafficking under
      Article 7; growing only for one's own use falls under Article 26, with up to six months
      in prison or a fine.
    sources:
      - l2
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited.
    sources:
      - wiki
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. Possession for personal use is a crime
      under Article 26 of Law 2/2017, with up to six months in prison or a fine.
    sources:
      - l2
