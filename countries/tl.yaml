  medical:
    text: No medical cannabis.
    sources:
      - wiki
  consequences:
    text: A conviction is a criminal record.
    sources:
      - plmj
  planting:
    seeds: grey
    seeds_trade: unclear
    clones: illegal
    clones_trade: banned
    text: >-
      Law 2/2017 lists cannabis as the leaves and flowering or fruiting tops of the plant, and
      its articles do not mention seeds. Growing without authorisation is trafficking under
      Article 7; growing only for one's own use falls under Article 26, with up to six months
      in prison or a fine. The text read is the 2017 version, before the 2023 amendments.
    sources:
      - l2
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited.
    sources:
      - wiki
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. British travel advice tells travellers
      not to get involved with illegal drugs and says there are severe penalties on
      conviction.
    sources:
      - wiki
      - fcdo
