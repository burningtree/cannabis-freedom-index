segments:
  possession:
    text: >-
      Illegal for all purposes. A dedicated anti-drug law adopted in 2017 and amended in 2023 sits
      alongside the Penal Code; possession for consumption is prosecuted as a less serious offence
      than trafficking, though still a crime.
    sources:
      - wiki
      - plmj
  cultivation:
    text: Cultivation is a crime.
    sources:
      - wiki
  enforcement:
    text: >-
      The president has said publicly that drug policy should distinguish cannabis from more
      dangerous drugs — a rare signal in the region — but the law has not changed.
    sources:
      - mb
  sharing:
    text: Trafficking carries four to twelve years under the Penal Code.
    sources:
      - wiki
  consumption:
