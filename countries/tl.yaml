name: Timor-Leste
region: Asia
iso_numeric: 626
recreational: illegal
medical: none
updated: '2026-10-23'
summary: >-
  Cannabis use, possession and growing solely for personal consumption are criminal offences,
  punishable by up to one year in prison or a fine, with a higher ceiling above the statutory
  quantity threshold. Courts may waive punishment for an occasional user in the lower band.
  Trafficking carries five to fifteen years, while the law provides confidentiality and treatment
  options for people who use drugs.
