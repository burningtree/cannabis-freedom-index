segments:
  possession:
    text: >-
      Illegal for all purposes. Under Article 26 of Law 2/2017, a person who holds or
      acquires cannabis only for personal use faces up to six months in prison or a fine
      of up to 60 days. Above five times the daily reference amount in the law's annex (1
      g of herbal cannabis, 0.5 g of resin, 0.25 g of oil) the ceiling rises to one year
      or a fine of up to 120 days. An occasional user may be let off the penalty.
    sources:
      - l2
  cultivation:
    text: >-
      Growing without authorisation is trafficking under Article 7, with 5 to 15 years in
      prison. Growing only for one's own use falls under Article 26: up to six months in
      prison or a fine of up to 60 days.
    sources:
      - l2
  enforcement:
    text: >-
      The president has said publicly that drug policy should distinguish cannabis from more
      dangerous drugs — a rare signal in the region — but the law has not changed.
    sources:
      - mb
  sharing:
    text: >-
      Offering, selling, distributing or giving cannabis to another person is trafficking
      under Article 7 of Law 2/2017, punished with 5 to 15 years. Where the wrong is
      considerably smaller, Article 11 sets 1 to 5 years, and a person who deals only to
      obtain drugs for personal use faces up to two years or a fine under Article 12.
    sources:
      - l2
  consumption:
    text: >-
      Consumption itself is an offence under Article 26 of Law 2/2017, with up to six
      months in prison or a fine of up to 60 days; an occasional user may be let off the
      penalty. A user who asks a doctor or health institution for help is guaranteed
      anonymity under Article 27.
    sources:
      - l2
  access:
    text: >-
      None. Law 2/2017 treats unauthorised growing and supply as trafficking and punishes
      growing for one's own use as well.
    sources:
      - l2
