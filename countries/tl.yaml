name: Timor-Leste
region: Asia
iso_numeric: 626
recreational: illegal
medical: none
updated: '2026-10-23'
summary: >-
  Cannabis use, possession and growing solely for personal consumption carry up to one year or a
  fine; above 5 g of herb, 2.5 g of resin or 1.25 g of oil the ceiling is two years. Trafficking
  carries five to fifteen years. Courts may waive punishment for an occasional user.
scores:
  possession: 1
  cultivation: 1
  enforcement: 1
  sharing: 1
  consumption: 1
  access: 0
segments:
  possession:
    text: >-
      Illicit possession or acquisition solely for personal use carries up to one year in prison or
      a fine assessed over up to 120 days. Above 5 g of herbal cannabis, 2.5 g of resin or 1.25 g of
      oil, the ceiling rises to two years or a 240-day fine. An occasional user in the lower band may
      have punishment waived.[@law]
    sources:
      - law
    currency: USD
    penalties:
      - label: Personal possession or acquisition
        treatment: criminal
        term: Personal use
        prison: 1 year
        note: Or a fine of up to 120 day-rates
      - label: Above 5 g herb, 2.5 g resin or 1.25 g oil
        treatment: criminal
        term: Personal use
        prison: 2 years
        note: Or a fine of up to 240 day-rates
  cultivation:
    text: >-
      Growing solely for personal consumption falls under the personal-use offence: up to one year
      in prison or a 120-day fine, rising to two years or a 240-day fine above the same weight
      thresholds.[@law] Unauthorised cultivation outside the personal-use offence falls under
      trafficking, with five to fifteen years in prison.[@law]
    sources:
      - law
    currency: USD
    penalties:
      - label: Growing for personal use
        treatment: criminal
        term: Personal growing
        prison: 1 year
        note: Or a fine of up to 120 day-rates
      - label: Growing above the personal-use weight threshold
        treatment: criminal
        term: Personal growing
        prison: 2 years
        note: Or a fine of up to 240 day-rates
      - label: Cultivation for trafficking
        treatment: criminal
        term: Trafficking
        prison_min: 5 years
        prison: 15 years
  enforcement:
    text: >-
      Prison is used in cannabis cases: Lusa reported a three-and-a-half-year sentence for
      Australian resident Tony Crean in October 2017, followed by a planned defence
      appeal.[@conviction] In a different 2022 drug case, nine suspects were placed under
      identity-and-residence declarations and periodic reporting.[@release] The law allows fines,
      waiver for occasional users in the lower band and suspension of prison for a person with drug
      dependence who voluntarily accepts treatment.[@law]
    sources:
      - conviction
      - release
      - law
  sharing:
    text: >-
      Offering, selling, distributing or giving controlled cannabis to another person without
      authorisation falls under trafficking, normally five to fifteen years.[@law] A considerably
      less serious case carries one to five years, while dealing exclusively to obtain drugs for the
      dealer’s own use carries up to two years or a fine.[@law]
    sources:
      - law
  consumption:
    text: >-
      Illicit consumption is a separate offence carrying up to one year in prison or a 120-day fine
      in the lower band; courts may waive punishment for an occasional user in that band.[@law]
      People seeking help from a doctor or health institution have confidentiality protections, and
      medical staff are not required to report their identity or treatment to the criminal
      authorities.[@law]
    sources:
      - law
  access:
    text: >-
      The drug law provides no recreational retail exception. It requires Health Ministry licensing,
      authorisations and supervision for handling substances in its controlled-drug tables, under
      rules to be set in a separate instrument.[@law] The 2025 pharmaceutical law continues to
      define narcotics and psychotropic substances by reference to those tables.[@pharma]
    sources:
      - law
      - pharma
context:
  production:
    status: none
    text: >-
      Cultivation, manufacture, trade and imports of controlled cannabis outside the personal-use
      offence attract trafficking penalties; no lawful commercial producer was found.[@law] In June 2022, police reported seizing a package of live cannabis
      seedlings sent from Ireland and referring its recipient for an initial court hearing.[@police]
    sources:
      - law
      - police
  medical:
    text: >-
      No medical cannabis programme operates. The law allows Health Ministry licensing for handling
      controlled drugs, but no implementing decree, registered cannabis medicine or prescribing
      route was found.[@law] In his November 2022 independence-anniversary address, President José
      Ramos-Horta advocated legalising medical cannabis, without a law following.[@nov]
    sources:
      - law
      - nov
  consequences:
    text: >-
      A hotel, café, club or venue operator who permits illicit drug use, production or trafficking,
      or knowingly fails to prevent it, faces two to eight years in prison.[@law] A foreigner
      convicted under the law may also be expelled for up to twenty years.[@law]
    sources:
      - law
  planting:
    seeds: grey
    seeds_trade: unclear
    clones: illegal
    clones_trade: banned
    text: >-
      The final law expressly schedules cannabis seeds not intended for sowing, alongside leaves,
      flowering tops, resin and oil.[@law] It also punishes growing solely for personal consumption
      with up to one year in prison or a fine in the lower band. Unauthorised cultivation outside
      that offence falls under trafficking; personal growing remains a criminal offence.[@law]
    sources:
      - law
  clubs:
    status: none
    text: >-
      The drug law provides no cannabis-club exception to its unauthorised growing and supply
      offences.[@law] A club or venue operator who permits illicit use or trafficking, or knowingly
      fails to stop it, may face two to eight years in prison.[@law]
    sources:
      - law
  visitors:
    status: none
    text: >-
      Personal-use possession remains a criminal offence, carrying up to one year in prison or a
      fine in the lower band.[@law] Unauthorised imports outside the personal-use offence fall under
      trafficking, and a foreigner convicted under the drug law may also be expelled for up to
      twenty years.[@law]
    sources:
      - law
  recreational:
    text: >-
      All recreational use is prohibited. Personal possession or use carries up to one year or a
      120-day fine, or two years above 5 g of herb, 2.5 g of resin or 1.25 g of oil; trafficking
      carries five to fifteen years.[@law] No adult-use supply exists.[@law]
    sources:
      - law
  hemp:
    status: none
    text: >-
      No hemp or CBD regime and no THC threshold. Table I-C expressly includes hemp (Cannabis
      sativa) and its derivatives, and cultivation requires Health Ministry authorisation.[@law]
      No industrial-hemp or consumer-CBD route was found.[@law]
    sources:
      - law
  driving:
    status: impairment
    text: >-
      Penal Code article 208(2) punishes driving while unfit because of narcotics or psychotropic
      substances with up to two years or a fine, and article 88 allows a licence suspension of three
      months to two years.[@penal2009] There is no numeric THC limit.[@penal2009]
    sources:
      - penal2009
  black_market:
    text: >-
      No national cannabis seizure series is published, and UNODC has no Timor-Leste rows.[@unodc_szr]
      A 2012 UNFPA assessment found cannabis locally grown and easily available, with hashish
      brought from Indonesia; it is the only qualitative account.[@unfpa12] The 2022 case involved
      hashish, hashish chocolate, 0.50 g of methamphetamine and $4,139.25 in cash.[@tatoli25]
    sources:
      - unodc_szr
      - unfpa12
      - tatoli25
  arrests:
    text: >-
      No national cannabis arrest count is published.[@unodc_szr] The 2022 raids led to a case
      against 13 defendants that reached pre-trial debate in May 2025 and was adjourned without a
      date in May 2026.[@tatoli25,tatoli26] Police said in 2024 that drug samples still had to be
      sent to Portugal for confirmation, which delayed cases.[@tatoli24]
    sources:
      - unodc_szr
      - tatoli25
      - tatoli26
      - tatoli24
