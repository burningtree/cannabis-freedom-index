  possession: 2
  cultivation: 3
  enforcement: 4
  sharing: 1
  consumption: 2
  access: 3
# The channel the access score cannot name (src/lib/answers.js).
answers:
  buy:
    answer: limited
    text: From licensed outlets, with a prescription from the practitioner on site
segments:
  possession:
    text: >-
      Since 26 June 2025 cannabis flower has been a "controlled herb", and lawful possession
      requires a PT 33 prescription from a Thai-licensed practitioner naming the product and
      quantity, for no more than 30 days.[@tilleke,thaiger] Unauthorised possession is not a clear
      standalone criminal offence: the 1999 Act's penalty covers unlicensed sale, processing, export
      or research, not simple possession, and the 2025 notice regulates sale rather than
      possession.[@tilleke,dtam] The flower can be seized and the seller prosecuted. Extracts with more
      than 0.2% THC remain narcotics, with up to two years and a 40,000 baht fine for personal
      possession.[@tilleke]
    sources:
      - tilleke
      - thaiger
      - dtam
    currency: THB
    penalties:
      - label: Prescribed flower
        treatment: legal
        term: Controlled herb
        note: PT 33 prescription, maximum 30 days; no criminal record
      - label: Flower without a prescription
        treatment: tolerated
        term: Controlled herb
        note: No clear standalone possession offence; seizure and seller prosecution
      - label: Extract over 0.2% THC for personal use
        treatment: criminal
        term: Narcotic
        prison: 2 years
        fine: 40000
  cultivation:
    text: >-
      Households may grow cannabis without a permit, in any number of plants, under the DTAM's 2026
      guidance, but the harvested flower is a controlled herb and cannot be sold without a licence.[@dtam]
      Commercial cultivation, processing and sale require a section 46 licence and certified
      standards; unlicensed sale or processing carries up to one year and a 20,000 baht fine.[@tilleke]
    sources:
      - tilleke
      - dtam
    currency: THB
    penalties:
      - label: Registered household growing
        treatment: legal
        term: Registered growing
        note: Plookganja registration; flower controlled after harvest
      - label: Commercial cultivation without a licence
        treatment: criminal
        term: Unlicensed cultivation
        prison: 1 year
        fine: 20000
  enforcement:
    text: >-
      Breaches of the controlled-herb rules are punished with fines and up to a year in prison
      rather than narcotics-law sentences.[@tilleke] Bringing cannabis into or out of the country is treated
      as trafficking.[@thaiger]
    sources:
      - thaiger
      - tilleke
  sharing:
    text: >-
      Supplying flower to someone without a prescription is an offence under the controlled-herb
      rules, whether or not money changes hands.[@tilleke]
    sources:
      - tilleke
    currency: THB
    penalties:
      - label: Sale without a prescription or licence
        treatment: criminal
        term: Unlicensed sale
        prison: 1 year
        fine: 20000
      - label: Export or import without permission
        treatment: criminal
        term: Smuggling
        prison: 1 year
        fine: 20000
        note: Customs law can add up to ten years or a 500,000 baht fine
      - label: Extract over 0.2% THC without a licence
        treatment: criminal
        term: Narcotic
        prison: 5 years
        fine: 500000
  consumption:
    text: >-
      Smoking in public is an offence carrying up to one month and a 2,000 baht fine, according to
      the DTAM's 2026 guidance.[@dtam] Smoking inside a licensed cannabis shop is prohibited by the
      2025 notice and can bring licence sanctions of up to one year and 20,000 baht.[@dtam] Use is
      officially limited to medical purposes, in private.[@thaiger]
    sources:
      - thaiger
      - dtam
    currency: THB
    penalties:
      - label: Public smoking
        treatment: civil
        term: Public smoking
        prison: 1 month
        fine: 2000
        note: Up to one month and a 2,000 baht fine under DTAM's 2026 guidance
  access:
    text: >-
      Shops still exist, but from 1 May 2026 licences are limited to qualifying hospitals, pharmacies,
      herbal-product businesses, extract licensees, folk healers and cultivation sites selling to a
      licensee, with at least one DTAM-trained staff member on duty.[@premises26] Of 18,433 outlets at
      the end of 2025, 8,636 licences expired, 1,339 were renewed and 7,297 closed, leaving 11,136.[@straits26]
      The cabinet approved a draft Cannabis Control Act on 22 September 2026; it had not passed by
      late October.[@nation,edge]
    sources:
      - edge
      - nation
      - premises26
      - straits26
context:
  recreational:
    text: >-
      Recreational use is officially no longer permitted: since June 2025 flower is a controlled
      herb available only on prescription for medical use in private. Smoking in public brings a
      fine of up to 25,000 baht, and supplying flower without a prescription is an offence
      whether or not money changes hands.[@tilleke,thaiger]
    sources:
      - tilleke
      - thaiger
  production:
    status: medical
    text: >-
      Licences for cultivation, processing, export and sale are available, but they are limited to
      medical, pharmacy, herbal and cultivation operators rather than an adult-use market.[@premises26]
      Extracts above 0.2% THC remain Category 5 narcotics, with licensees restricted to Thai juristic
      persons, government agencies and the Thai Red Cross and old licences running to 31 December
      2026.[@extract26]
    sources:
      - premises26
      - extract26
  medical:
    text: >-
      The medical route is the whole legal system now: doctors, Thai traditional medicine
      practitioners and other licensed professionals can prescribe, often on site at the dispensary.[@thaiger]
      Foreign prescriptions are not recognised.[@thaiger] Flower is sold on prescription; extracts with more
      than 0.2% THC remain narcotics, THC edibles are tightly limited, and CBD products under the
      threshold are sold without prescription.[@tilleke]
    sources:
      - thaiger
      - tilleke
  hemp:
    status: high
    text: >-
      Hemp is defined as Cannabis sativa subsp. sativa with no more than 1.0% THC in its leaves and
      inflorescence.[@tilleke] Hemp extracts above 0.2% THC remain Category 5 narcotics, while CBD
      products below that line may be sold as registered food, cosmetics or herbal products.[@tilleke]
      Commercial processing and extraction need licences.[@tilleke]
    sources:
      - tilleke
  driving:
    status: impairment
    text: >-
      The Land Traffic Act punishes driving while impaired by alcohol or another intoxicant,
      including cannabis, with up to one year and a 5,000 to 20,000 baht fine, plus licence
      suspension.[@traffic] All intoxicants, including cannabis and extracts, fall under the same
      provision; there is no separate narcotics-driving offence in the traffic law.[@traffic] There is no per-se THC limit,
      and police lack an approved testing protocol, so enforcement turns on observed impairment.[@traffic]
    sources:
      - traffic
  consequences:
    text: >-
      No criminal record follows from lawful medical use, and thousands of earlier cannabis
      prisoners were released in 2022.[@tilleke] Driving under the influence is an offence, and the legal
      position has changed several times in three years, leaving users exposed to sudden rule
      changes.[@khaosod]
    sources:
      - tilleke
      - khaosod
  planting:
    seeds: legal
    seeds_trade: open
    clones: legal
    clones_trade: unclear
    text: >-
      Plants, seeds and unprocessed parts other than the flower sit outside the narcotics list, so
      domestic possession and trade are not narcotics offences; only the flower is a controlled
      herb.[@tg25] Importing whole plants, cuttings and unprocessed parts is prohibited, while seed
      imports follow Department of Agriculture and quarantine rules.[@tg25] Domestic clone sale is
      not specifically addressed.[@tg25]
    sources:
      - tg25
  culture:
    text: >-
      Cannabis in Thailand is known as [ganja](/culture/language/ganja/), and the 2022–2025
      dispensary boom created a new [dispensary](/culture/language/dispensary/) culture that the
      2025 medical rules then narrowed.[@tilleke] Thai [landrace](/culture/language/landrace/)
      varieties and the [Hmong hemp cloth](/culture/traditions/hmong-hemp-cloth/) tradition long
      predate the modern market.[@tilleke] Cannabis also entered
      [South-East Asian cooking](/culture/traditions/south-east-asian-cooking/) and, in the reform
      years, the political identity of [Anutin Charnvirakul](/culture/people/anutin-charnvirakul/).[@thaiger]
    sources:
      - tilleke
      - thaiger
  black_market:
    text: >-
      The best-documented illegal trade is export.[@ks25] In March 2025 police at Chiang Mai airport seized more than
      100 kg of cannabis flower in four days from foreign couriers bound mostly for London,
      and could charge almost none of them because carrying cannabis within Thailand was not
      an offence; the regional commander said smugglers had moved from Phuket to Bangkok to
      Chiang Mai as checks tightened.[@ks25] Since then sale has been narrowed to medical channels:
      rules in force in 2026 allow only registered health facilities, pharmacies and herbal
      shops to hold licences, and require a prescription of at most 30 days.[@ks26] No figure for
      unlicensed sales since the change was found.[@ks26]
    sources:
      - ks25
      - ks26
  clubs:
    status: none
    text: >-
      No cannabis clubs are known; Thailand's cannabis trade runs through licensed shops,
      which are businesses and not members' clubs.[@tilleke] Supplying flower to someone without a
      prescription is an offence whether or not money changes hands, which leaves no room for
      a club sharing its own harvest.[@tilleke]
    sources:
      - tilleke
  visitors:
    status: open
    text: >-
      Tourists are held to the same rule as residents: since June 2025 cannabis flower may be
      bought, held or used only with a prescription from a licensed Thai medical professional,
      for at most 30 days' supply, and foreign prescriptions are not accepted.[@tat2025,dtam] The tourism authority
      tells visitors to buy only through authorised channels and warns that unlicensed shops
      aimed at tourists may be operating illegally.[@tat25] Taking cannabis out of the country without
      permission from the authorities is against Thai law, the health minister said in May 2025,
      as cases of tourists caught smuggling it out rose.[@euronews25] A deportation
      regulation in force since 28 August 2026 allows foreigners to be deported without a
      criminal conviction for conduct judged contrary to public order or good morals, and
      introduces the possibility of re-entry bans.[@newland26]
    sources:
      - tat2025
      - tat25
      - euronews25
      - newland26
      - dtam
  arrests:
    text: >-
      The Royal Thai Police reported 203,637 people arrested for drug offences between 1
      October 2025 and 31 May 2026, over 20 per cent more than a year earlier, and 16,419
      drug networks broken up.[@pm26] The seizures it listed were of methamphetamine tablets,
      crystal methamphetamine, ecstasy and ketamine; cannabis, removed from the narcotics
      list in 2022, does not appear in the report.[@pm26]
    sources:
      - pm26
