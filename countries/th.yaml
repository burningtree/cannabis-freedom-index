name: Thailand
region: Asia
iso_numeric: 764
recreational: illegal
medical: legal
updated: '2026-10-27'
summary: >-
  Flower has been a controlled herb since November 2022 and since June 2025 requires a prescription,
  which narrowed the dispensary boom to medical supply. From 2026 licences are limited to qualifying
  medical, pharmacy, herbal and cultivation premises with trained staff. Recreational use is
  officially no longer permitted.
