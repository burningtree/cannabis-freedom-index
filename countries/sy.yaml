segments:
  possession:
    text: >-
      Hashish is controlled under the 1993 narcotics law. Possession for personal consumption is a
      crime, with prison terms reported at up to three years. People deemed addicts who complete
      state rehabilitation, and have no prior record, face no further penalty. Article 43 of the
      law, in the copy read, sets a term of detention and a fine of 100,000 to 500,000 pounds for
      having, buying or carrying drugs for personal use; the court may suspend the sentence and
      send an addict to a clinic for three months to a year, though not a third time.
    sources:
      - wiki
      - l2
  cultivation:
    text: >-
      Cultivation can bring life imprisonment or death; the 1993 law explicitly extended the death
      penalty to growers. Growing for personal use is not treated separately: Article 39 covers
      all unlicensed growing, and a court may reduce death to life or to at least twenty years.
    sources:
      - wiki
      - l2
  enforcement:
    text: >-
      The 1993 narcotics law grades its penalties steeply: detention and a fine for having drugs
      for personal use, which a court may suspend to send an addict for treatment; at least ten
      years for giving drugs to another person; life imprisonment for selling; and death or life
      for growing. No account of how the authorities that took power in December 2024 apply the
      law to users was found.
    sources:
      - l2
  sharing:
    text: >-
      Trafficking carries long terms, life or death for large quantities. Under the 1993 law
      selling, or possessing for sale, brings life imprisonment and a fine of one to five
      million pounds; giving drugs to another person without payment brings at least ten years.
    sources:
      - wiki
      - l2
  consumption:
    text: >-
      Use is an offence, with the treatment route for dependent users. No case is brought against
      a user who goes to the authorities for treatment of their own accord, or whose spouse or
      close relative asks for it, unless they were caught in the act; treatment is confidential.
    sources:
      - wiki
      - l2
  access:
    text: No legal source.
    sources:
      - wiki
      - l2
context:
  death_penalty:
    text: >-
      Trafficking in large quantities can bring life imprisonment or death, and a 1993 law
      explicitly extended the death penalty to growers. Article 39 names smuggling, making
      drugs and growing the listed plants. Mitigation is excluded for a repeat offender, an
      official charged with fighting drugs, someone who used a minor, or a member of an
      international smuggling gang. A judicial source in 2014 put the range for trafficking at
      ten years to death.
    sources:
      - wiki
      - l2
      - so14
  production:
    status: none
    text: >-
      None. Hashish production boomed during the civil war in areas outside state control: in
      the Kurdish enclaves from 2012 and in the hills of Idlib, where it paid for weapons. The
      Islamic State burned fields it found. After the fall of the Assad government the security
      forces destroyed about 15 tonnes of hashish in a few weeks.
    sources:
      - gn
      - rudaw13
      - cv14
      - occrp25
  products:
    text: Reliable national information about legally available cannabis products was not established by the retained sources.
    sources: []
  medical:
    text: The retained sources do not establish whether a medical cannabis programme operates.
    sources: []
  consequences:
    text: The retained sources do not establish collateral consequences beyond the penalties described above.
    sources: []
  arrests:
    text: >-
      No national figures for cannabis were found. A judicial source counted 620 drug cases
      before the courts in four months of 2014, against fewer than 500 in all of 2013. In the
      north-east, outside the state's control, the Autonomous Administration's security forces
      reported 1,875 arrests in a campaign from September 2020 to June 2021, 1,165 of them
      users, and 1,700 kilograms of hashish seized.
    sources:
      - so14
      - aawsat21
  planting:
    seeds: illegal
    seeds_trade: banned
    clones: illegal
    clones_trade: banned
    text: >-
      Article 30 of Law 2 of 1993 bans growing, importing, owning, holding or buying the
      listed plants at any stage of growth, as well as their seeds; plant parts named in a
      separate schedule are exempt. Only state institutions and recognised research centres
      can be licensed to grow them or import seeds. Article 39 sets the death penalty for
      unlicensed growing. The text read is a copy on a law firm's site.
    sources:
      - l2
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited, and the law provides for the death
      penalty for the most serious drug offences.
    sources:
      - wiki
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. Under the 1993 narcotics law, having or
      carrying drugs for personal use brings detention and a fine of 100,000 to 500,000 pounds,
      selling brings life imprisonment, and unlicensed growing death or life.
    sources:
      - l2
  black_market:
    text: >-
      Hashish circulates beside the far larger Captagon trade. The interior minister said
      in June 2025 that in the weeks after the fall of the Assad government the security
      forces had destroyed about 15 tonnes of hashish and about 100 million Captagon
      pills. In the north-east, the Autonomous Administration's security forces reported
      1,700 kg of hashish and 2,637 kg of hashish paste seized, and 1,875 people arrested,
      in a campaign from September 2020 to June 2021.
    sources:
      - occrp25
      - aawsat21
