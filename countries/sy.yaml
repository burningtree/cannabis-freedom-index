name: Syria
region: Asia
iso_numeric: 760
recreational: death
medical: none
updated: "2026-10-28"
summary: >-
  Personal possession for use carries three to fifteen years and a fine, with a treatment route;
  smuggling, manufacture and cultivation carry death, and trafficking can bring death with
  aggravating facts. Captagon dominates enforcement.
