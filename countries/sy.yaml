segments:
  possession:
    text: >-
      Hashish is controlled under the 1993 narcotics law. Possession for personal consumption is a
      crime, with prison terms reported at up to three years. People deemed addicts who complete
      state rehabilitation, and have no prior record, face no further penalty.
    sources:
      - wiki
      - cr
  cultivation:
    text: >-
      Cultivation can bring life imprisonment or death; the 1993 law explicitly extended the death
      penalty to growers.
    sources:
      - wiki
  enforcement:
    text: >-
      The authorities that took power in December 2024 kept the existing law and have publicised
      seizures and destruction of drug stockpiles.
    sources:
      - cr
  sharing:
    text: Trafficking carries long terms, life or death for large quantities.
    sources:
      - cr
      - wiki
  consumption:
