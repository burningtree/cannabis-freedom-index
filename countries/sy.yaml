  possession: 0
  cultivation: 0
  enforcement: 1
  sharing: 0
  consumption: 1
  access: 0
segments:
  possession:
    text: >-
      Article 43 of the 1993 narcotics law punishes possessing, buying, holding or transporting a
      drug for personal use with temporary detention and a fine of 100,000–500,000 Syrian pounds.[@law1993]
      "Temporary detention" is three to fifteen years under article 44 of the Penal Code, where the
      special law sets no other term, so the profile's earlier "up to three years" was wrong.[@penal1949]
      A court may suspend the sentence and send a proven addict to a clinic for three to twelve
      months; a person who seeks treatment, or whose spouse or close relative asks for it, is not
      prosecuted unless caught in the act.[@law1993] Residual possession outside use or trade carries
      up to one year and a small fine.[@law1993]
    sources:
      - law1993
      - penal1949
    currency: SYP
    penalties:
      - label: Possession for personal use (Article 43)
        treatment: criminal
        term: Personal use
        prison_min: 3 years
        prison: 15 years
        fine_min: 100000
        fine: 500000
        note: Treatment for three to twelve months may replace the sentence
      - label: Residual possession (Article 45)
        treatment: criminal
        term: Other possession
        prison: 1 year
        fine: 5000
  cultivation:
    text: >-
      Growing a listed plant is banned at every stage, including seeds.[@law1993] Unlicensed
      cultivation for trade is an Article 39 offence carrying death, with mitigation to life or at
      least twenty years and a fine of 1–5 million pounds; mitigation is barred for a repeat offender,
      an anti-drug official, use of a minor, an international gang or abuse of office.[@law1993]
      Growing for personal use is charged under Article 43, with three to fifteen years.[@law1993]
      There is no plant-count threshold.[@law1993]
    sources:
      - law1993
    currency: SYP
    penalties:
      - label: Cultivation for personal use (Article 43)
        treatment: criminal
        term: Personal use
        prison_min: 3 years
        prison: 15 years
        fine_min: 100000
        fine: 500000
      - label: Cultivation for trade (Article 39)
        treatment: criminal
        term: Cultivation
        death: true
        fine_min: 1000000
        fine: 5000000
        note: Mitigation to life where the court finds grounds
  enforcement:
    text: >-
      Enforcement is dominated by Captagon, not cannabis. The interior ministry reported 1,550
      anti-narcotics operations and 90 international networks dismantled between December 2024 and
      June 2026, with about 697 million Captagon pills, 15 tonnes of hashish and 221 tonnes of
      precursors seized.[@sana26] The 15 tonnes are cumulative, not annual, and the figures cover all
      drugs.[@sana26] No national cannabis-only arrest series is published.[@incsr05] The 1993 law
      remains in force: the Raqqa criminal court applied Article 40 on 21 October 2026.[@raqqa26]
    sources:
      - sana26
      - incsr05
      - raqqa26
  sharing:
    text: >-
      Selling, possessing for sale, transporting for sale, brokering or managing a drug den for
      payment carries life imprisonment and a 1–5 million pound fine.[@law1993] Death is available
      for the same conduct with a prior drug conviction, an anti-drug official, a minor, an
      international gang, abuse of office, or in a school, camp, prison, place of worship or sports
      institution; without those facts the sentence is life.[@law1993] Giving drugs free or
      facilitating use carries at least ten years, and life where a minor is involved.[@law1993]
      Importing, manufacturing or cultivating for trade carries death.[@law1993]
    sources:
      - law1993
    currency: SYP
    penalties:
      - label: Sale or possession for sale (Article 40)
        treatment: criminal
        term: Trafficking
        fine_min: 1000000
        fine: 5000000
        note: Death with the Article 39(b) aggravating facts or in listed sensitive places
      - label: Giving drugs free or facilitating use (Article 42)
        treatment: criminal
        term: Supply
        prison_min: 10 years
        fine_min: 500000
        fine: 2000000
        note: Life where a minor is involved or coercion, deception or enticement is used
      - label: Import, manufacture or cultivation for trade (Article 39)
        treatment: criminal
        term: Trafficking
        death: true
        fine_min: 1000000
        fine: 5000000
        note: Mitigation to life where the court finds grounds
      - label: Presence in a place prepared for drug use (Article 46)
        treatment: criminal
        term: Presence
        prison_min: 6 months
        prison: 1 year
        fine_min: 1000
        fine: 5000
  consumption:
    text: >-
      There is no standalone consumption offence in the 1993 law.[@law1993] A user is charged under
      Article 43 for possessing with intent to use, with three to fifteen years and a
      100,000–500,000 pound fine, or under Article 46 for knowingly being in a place prepared for
      drug use, with six months to a year.[@law1993] The treatment route can suspend the sentence or
      bar prosecution.[@law1993]
    sources:
      - law1993
  access:
    text: >-
      No legal source for patients or recreational users. Article 31 lets the health minister license
      state institutions, scientific institutes and recognised research centres to grow prohibited
      plants or import seed for medical or scientific purposes, but that is not a patient-supply
      route.[@law1993] No registered cannabis medicine or prescription programme was found.[@law1993]
    sources:
      - law1993
answers:
  buy:
    answer: no
    text: No legal source; only institutional medical and research handling is excepted
context:
  recreational:
    text: >-
      All recreational use is prohibited. Personal possession for use carries three to fifteen years
      and a 100,000–500,000 pound fine, with a treatment route; supply carries life or, with
      aggravating facts, death.[@law1993] The death penalty is not available for simple possession.[@law1993]
      [The 1993 law still governs.](/history/syria-death-penalty-1993/)
    sources:
      - law1993
  death_penalty:
    text: >-
      Article 39 imposes death for any smuggling, unlicensed manufacture or unlicensed cultivation
      of a listed plant, with no quantity threshold; mitigation to life or at least twenty years is
      possible unless a listed aggravating fact applies.[@law1993] Article 40 allows death for
      trafficking, possession for sale or keeping a drug den only with a prior drug conviction, an
      anti-drug official, a minor, an international gang, abuse of office or a sensitive location.[@law1993]
      Simple possession under Article 43 cannot bring death.[@law1993] No cannabis death sentence or
      execution was confirmed in 2024–2026; Syria recorded no executions in 2025, and the first
      post-Assad death sentence, in November 2025, was for murder.[@amnesty25,euaa26]
    sources:
      - law1993
      - amnesty25
      - euaa26
  production:
    status: none
    text: >-
      No lawful cannabis production. Article 30 bans the listed plants at every stage, including
      seeds, and the only exception is research by state institutions and recognised research
      centres.[@law1993] Hashish production expanded during the civil war in areas outside state control,
      in the Kurdish enclaves from 2012 and in Idlib; after the fall of the Assad government the
      security forces destroyed about 15 tonnes of hashish.[@rudaw13,cv14,occrp25]
    sources:
      - law1993
      - rudaw13
      - cv14
      - occrp25
  medical:
    text: >-
      No medical cannabis programme. The 1993 law allows controlled narcotic medicines to be
      prescribed and dispensed through pharmacies, but cannabis is a prohibited plant rather than a
      listed medicine.[@law1993] Article 31 permits institutional cultivation or seed import for
      medical or scientific research, not patient access.[@law1993]
    sources:
      - law1993
  hemp:
    status: none
    text: >-
      No hemp or CBD regime and no THC threshold. Article 30 bans the cannabis plant at every stage
      of growth, including seeds, and the only exception is institutional research cultivation.[@law1993]
      No fibre-hemp or CBD exemption was found.[@law1993]
    sources:
      - law1993
  consequences:
    text: >-
      Article 59 requires confiscation of drugs, equipment and proceeds, and the law provides for
      closure of premises used in an offence.[@law1993] A conviction is a criminal record. No separate
      collateral consequence, such as deportation, was verified.[@law1993]
    sources:
      - law1993
  planting:
    seeds: illegal
    seeds_trade: banned
    clones: illegal
    clones_trade: banned
    text: >-
      Article 30 bans growing, importing, owning, holding or buying the listed plants at any stage of
      growth, as well as their seeds; only plant parts named in a separate schedule are exempt.[@law1993]
      Only state institutions, scientific institutes and recognised research centres may be licensed
      to grow them or import seeds.[@law1993]
    sources:
      - law1993
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited, and the law provides death for the most
      serious drug offences.[@law1993]
    sources:
      - law1993
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. Personal possession for use carries three to
      fifteen years and a 100,000–500,000 pound fine; supplying another person carries life, or death
      with aggravating facts.[@law1993]
    sources:
      - law1993
  driving:
    status: unknown
    text: >-
      No cannabis-specific driving offence or THC limit was verified. The traffic law is Law 31 of
      2004 as amended in 2008, and a replacement was being drafted in October 2026.[@sana_traffic]
      Whether the current text uses an impairment test or a prohibited-substance rule could not be
      confirmed.[@sana_traffic]
    sources:
      - sana_traffic
  black_market:
    text: >-
      Hashish circulates beside the far larger Captagon trade. The interior ministry said in June
      2026 that the security forces had destroyed about 15 tonnes of hashish and about 697 million
      Captagon pills since December 2024, and that the hashish price rose from about $220 to $600 a
      kilogram.[@sana26] Individual cannabis cases include 800 kg in Aleppo in June 2025 and nearly
      500 kg in Sweida in July 2026.[@sana_jun25,sana_jul26] In the north-east, the Autonomous
      Administration reported 1,700 kg of hashish and 2,637 kg of hashish paste seized in its
      2020–21 campaign.[@aawsat21]
    sources:
      - sana26
      - sana_jun25
      - sana_jul26
      - aawsat21
  arrests:
    text: >-
      No national cannabis arrest series is published.[@incsr05] In 2004 the authorities recorded
      3,677 arrests in 2,540 narcotics cases, all drugs.[@incsr05] The 2026 campaign figures (1,550
      operations) also cover all drugs and Captagon.[@sana26] Recent cannabis cases include two
      Lebanese nationals arrested in Aleppo with 800 kg in June 2025 and four people arrested in
      Damascus with 36 kg in October 2026.[@sana_jun25,sana_oct26]
    sources:
      - incsr05
      - sana26
      - sana_jun25
      - sana_oct26
