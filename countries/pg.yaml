segments:
  possession:
    text: >-
      Until 2022 possession of a dangerous drug carried three months to two years in prison. The
      Dangerous Drugs (Amendment) Act 2021, passed in response to methamphetamine trafficking,
      raised the maximum for knowingly possessing any dangerous drug to a fine of up to one million
      kina or up to 40 years in prison, or both. District courts dealing with small amounts of
      marijuana impose far lower sentences.
    sources:
      - act
      - case
  cultivation:
    text: >-
      Cultivation is an offence under the same Act. Highlands-grown cannabis is a major informal
      crop.
    sources:
      - act
  enforcement:
    text: >-
      Short prison terms and fines are typical for small marijuana cases in the district courts; the
      new maximums give courts enormous discretion.
    sources:
      - case
      - act
  sharing:
    text: Supply falls under the same greatly increased maximums.
    sources:
      - act
  consumption:
    text: Use is covered by the possession offence.
    sources:
      - case
