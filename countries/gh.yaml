name: Ghana
region: Africa
iso_numeric: 288
recreational: illegal
medical: limited
updated: 2026-10-23
summary: >-
  The 2020 Narcotics Control Commission Act fines possession for personal use. Buying a narcotic
  drug or plant for personal use is a separate offence, and the Second Schedule allows a fine of
  2,000 to 10,000 penalty units or four to ten years in prison. A 2023 amendment licenses low-THC
  cultivation for industrial and medicinal purposes.
scores:
  possession: 2
  cultivation: 1
  enforcement: 3
  sharing: 1
  consumption: 1
  access: 0
segments:
  possession:
    text: >-
      Holding a narcotic drug or plant for personal use is an offence under sections 37(2)(a) and
      41(2)(a). The Second Schedule sets a fine of 200 to 500 penalty units (roughly
      GH¢2,400–6,000), and up to fifteen months in prison if that fine is not paid. Buying a
      narcotic drug or plant for personal use is section 45(2). The Schedule sets that penalty at
      2,000 to 10,000 penalty units or four to ten years in prison, the same range as buying with
      intent to sell. A court may also order the buyer to attend treatment at a facility approved
      by the Commission. The earlier law imposed a minimum of ten years for possession.
    sources:
      - acttext
      - ghalii
      - idpc
  cultivation:
    text: >-
      Illegal. Growers of 'wee' are still arrested and remanded. The Act allows licences only for
      cannabis with no more than 0.3% THC for industrial and medicinal purposes; that provision was
      struck down by the Supreme Court in 2022 on procedural grounds and re-enacted by Parliament in
      2023.[@act, graphic] On 31 July 2026 the commission issued the first two of those licences, to
      MG Adom Limited and Juliopta Limited.[@ncc2631]
    sources:
      - act
      - graphic
      - ncc2631
  enforcement:
    text: >-
      Possession for personal use is punished with a fine. Buying for personal use can be punished
      with four to ten years in prison or with a fine of 2,000 to 10,000 penalty units. Cultivation
      and trafficking still carry long sentences. The Act was the first in West Africa to replace
      prison with a fine for simple possession.
    sources:
      - acttext
      - idpc
  sharing:
    text: Supply is trafficking, with long prison sentences.
    sources:
      - act
  consumption:
    text: >-
      Drug use is treated as a public-health matter, with treatment as an alternative to punishment,
      but it has not been legalised.
    sources:
      - idpc
      - graphic
  access:
    text: >-
      No legal source for THC cannabis. Buying it without lawful authority is an offence under
      section 45.
    sources:
      - graphic
      - acttext
context:
  production:
    text: >-
      Licences are limited to cannabis with no more than 0.3% THC for industrial, medicinal and
      research use.[@act] On 31 July 2026 the Narcotics Control Commission issued the first two, to
      MG Adom Limited and Juliopta Limited.[@ncc2631] Recreational cultivation stays illegal.[@ncc2631]
    sources:
      - act
      - ncc2631
  products:
    text: No legal THC products.
    sources:
      - graphic
  medical:
    text: >-
      No medical programme for THC cannabis.[@graphic] The July 2026 licences cover low-THC cultivation
      for industrial, medicinal and research purposes, not a supply for patients.[@ncc2631]
    sources:
      - graphic
      - ncc2631
  consequences:
    text: >-
      A conviction for possession for personal use is a fine, and the record remains. A conviction
      for buying for personal use can be a prison sentence of four to ten years.
    sources:
      - acttext
  planting:
    seeds: licensed
    seeds_trade: regulated
    clones: licensed
    clones_trade: regulated
    text: >-
      Only cannabis with no more than 0.3% THC may be grown, and only under a licence from the
      Narcotics Control Commission; the regulator repeated in April 2026 that anything above
      that limit falls outside the law. Seed and planting material therefore exist legally
      only inside the licensed industrial and medicinal scheme.
    sources:
      - act
      - nacoc26
  black_market:
    text: >-
      All cannabis on sale is illegal. The Narcotics Control Commission burned about 50 tonnes
      of seized drugs, mostly cannabis, in February 2023, valued at 50 million cedis; it had
      been intercepted between 2021 and 2023, mainly in the Volta and Eastern regions, and the
      commission called it one of its biggest hauls in recent years. It warned drivers and
      vehicle owners against being used as couriers.
    sources:
      - gr23
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited.
    sources:
      - act
      - graphic
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. Possession for personal use is a fine of
      200 to 500 penalty units, with up to fifteen months in prison if the fine is not paid.
      Buying cannabis for personal use is a separate offence and can bring four to ten years in
      prison or a fine of 2,000 to 10,000 penalty units.
    sources:
      - acttext
      - ghalii
      - graphic
