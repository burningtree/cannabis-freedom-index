segments:
  possession:
    text: >-
      The 2020 Narcotics Control Commission Act replaced prison for possession for personal use with
      a fine of 200 to 500 penalty units (roughly GH¢2,400–6,000). It is still an offence, and
      failure to pay can lead to jail. The earlier law imposed a minimum of ten years.
    sources:
      - idpc
      - act
  cultivation:
    text: >-
      Illegal. Growers of 'wee' are still arrested and remanded. The Act allows licences only for
      cannabis with no more than 0.3% THC for industrial and medicinal purposes; that provision was
      struck down by the Supreme Court in 2022 on procedural grounds and re-enacted by Parliament in
      2023.
    sources:
      - act
      - graphic
  enforcement:
    text: >-
      A fine rather than prison for personal possession — the first such reform in West Africa —
      while cultivation and trafficking still carry heavy sentences.
    sources:
      - idpc
      - act
  sharing:
    text: Supply is trafficking, with long prison sentences.
    sources:
      - act
  consumption:
    text: >-
      Drug use is treated as a public-health matter, with treatment as an alternative to punishment,
      but it has not been legalised.
    sources:
      - idpc
      - graphic
  access:
    text: No legal source for THC cannabis.
    sources:
      - graphic
context:
  production:
    text: Licences are limited to low-THC cannabis for fibre, seed and medicinal use.
    sources:
      - act
  products:
    text: No legal THC products.
    sources:
      - graphic
  medical:
    text: No medical programme for THC cannabis.
    sources:
      - graphic
  consequences:
    text: The fine follows a conviction, so a record remains.
    sources:
      - act
  planting:
    seeds: licensed
    seeds_trade: regulated
    clones: licensed
    clones_trade: regulated
    text: >-
      Only cannabis with no more than 0.3% THC may be grown, and only under a licence from the
      Narcotics Control Commission; the regulator repeated in April 2026 that anything above
      that limit falls outside the law. Seed and planting material therefore exist legally
      only inside the licensed industrial and medicinal scheme.
    sources:
      - act
      - nacoc26
  black_market:
    text: >-
      All cannabis on sale is illegal. The Narcotics Control Commission burned about 50 tonnes
      of seized drugs, mostly cannabis, in February 2023, valued at 50 million cedis; it had
      been intercepted between 2021 and 2023, mainly in the Volta and Eastern regions, and the
      commission called it one of its biggest hauls in recent years. It warned drivers and
      vehicle owners against being used as couriers.
    sources:
      - gr23
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited.
    sources:
      - act
      - graphic
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. British travel advice says possession
      of illegal drugs, including cannabis, carries severe penalties, that bail is not
      normally granted, and that even small amounts of cannabis can lead to a prison sentence
      of more than 5 years, usually after a long and expensive legal process. The same applies
      to passengers in transit.
    sources:
      - graphic
      - fcdo
