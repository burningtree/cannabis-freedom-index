name: Malawi
region: Africa
iso_numeric: 454
recreational: illegal
medical: limited
updated: 2026-10-12
summary: >-
  The 2020 Cannabis Regulation Act legalised cultivation for medical and industrial use.
  Recreational use of the famous 'Malawi Gold' remains illegal.
scores:
  possession: 1
  cultivation: 1
  enforcement: 2
  sharing: 1
  consumption: 1
  access: 0
segments:
  possession:
    text: >-
      Recreational possession of chamba is a criminal offence under the Dangerous Drugs Act. Small
      amounts typically bring a fine or a short sentence.
    sources:
      - giq
      - bg
  cultivation:
    text: >-
      Unlicensed cultivation is a crime: under the 2020 Act, growing, processing or distributing
      cannabis illegally carries up to 25 years in prison and a large fine. 'Malawi Gold' is
      nonetheless grown widely in remote areas.
    sources:
      - giq
      - bg
  enforcement:
    text: Fines and short sentences for users, with very long maximums for unlicensed growing and trade.
    sources:
      - giq
  sharing:
    text: Illegal distribution carries the same heavy penalties.
    sources:
      - giq
  consumption:
    text: Recreational use is not authorised by the 2020 Act and remains illegal.
    sources:
      - act
      - giq
  access:
    text: No legal source for adult use.
    sources:
      - giq
context:
  production:
    text: >-
      The Cannabis Regulation Act 2020 created a Cannabis Regulatory Authority that licenses
      cultivation, processing, storage, export and research for medicinal, industrial and scientific
      purposes — part of a drive to replace tobacco as an export crop.
    sources:
      - act
      - bg
  products:
    text: Licensed medicinal and hemp products.
    sources:
      - act
  medical:
    text: Medical use is provided for in the Act, under licence; patient access is limited in practice.
    sources:
      - act
      - giq
  consequences:
    text: A conviction is a criminal record.
    sources:
      - giq
  planting:
    seeds: licensed
    seeds_trade: regulated
    clones: licensed
    clones_trade: regulated
    text: >-
      The Cannabis Regulation Act 2020 puts cultivating, propagating, supplying, possessing
      and selling cannabis under licences from the Cannabis Regulatory Authority, and import
      or export under a ministerial permit. Only seed that has been crushed or processed so it
      cannot germinate falls outside the controlled plant, so viable seed and planting
      material are lawful only within the licensed medicinal and hemp schemes.
    sources:
      - cra20
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited.
    sources:
      - giq
      - bg
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. Recreational possession is a criminal
      offence under the Dangerous Drugs Act; small amounts typically bring a fine or a short
      sentence.
    sources:
      - giq
      - bg
  driving:
    status: impairment
    text: >-
      Road Traffic Act section 128 prohibits driving on a public road under the influence of
      a drug having a narcotic effect. It also covers occupying the driver's seat with the
      engine running and sitting beside a learner as the licensed supervisor. Drug-analysis
      evidence is admissible; police may require blood or urine samples, and refusal can
      lead to arrest. The statutory text provides up to three years' imprisonment, or a fine
      or both; injury or death raises the prison ceiling to five years. Section 60 requires
      licence and permit suspension of at least six months for a first offence, one year
      for a second and five years for a third or later offence. The numerical concentration
      rule is for alcohol, not THC. The source's monetary fine amounts were not verified
      against subsequent revisions and are not presented as current ticket tariffs.
    sources:
      - roadtraffic
