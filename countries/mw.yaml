name: Malawi
region: Africa
iso_numeric: 454
recreational: illegal
medical: limited
updated: 2026-10-27
summary: >-
  The 2020 Cannabis Regulation Act legalised cultivation for medical and industrial use,
  including industrial hemp at up to 1% THC, under a licensing authority. Recreational
  use of the famous 'Malawi Gold' remains illegal.
scores:
  possession: 1
  cultivation: 1
  enforcement: 2
  sharing: 1
  consumption: 1
  access: 0
words:
  - { word: Chamba, lang: Yao, meaning: "cannabis; the Yao word for Malawi's local sativa, Malawi Gold", sources: [duvall19] }
segments:
  possession:
    text: >-
      Recreational possession of chamba is a criminal offence. Under the Dangerous Drugs
      Act (Cap. 35:02), acting in contravention — including unlicensed possession under
      Regulation 4(a) of the Dangerous Drugs Regulations — draws a fine of K500,000
      and up to life imprisonment, as amended in 1995.[@dda] Parliament confirmed in
      March 2024 that being found with chamba without a licence remains an offence and
      that the amendment "does not legalise smoking".[@nation24] Courts impose well
      below the maximum in practice: eight years' hard labour for 134 kg was sent for
      High Court review over excess and fair-trial compliance.[@salc22]
    sources:
      - dda
      - nation24
      - salc22
    currency: MWK
    penalties:
      - label: Unlicensed possession (Regulation 4(a), DDA s19(1))
        treatment: criminal
        term: Possession
        fine: 500000
        life: possible
        note: Maximum of life imprisonment
  cultivation:
    text: >-
      Growing without a Cannabis Regulatory Authority licence is a crime under two
      regimes. The 2020 Act punishes anyone who cultivates, propagates, produces,
      processes, stores, distributes or uses cannabis in contravention with a K50 million
      fine and 25 years in prison — about US$70,000 at passage, according to AP
      reporting.[@cra20,bg] Cultivation is separately an offence under Regulation 6 of
      the Dangerous Drugs Regulations as read with section 19 of the Dangerous Drugs
      Act.[@dda] Police still uproot unlicensed gardens: in May 2024 Jenda police
      arrested two men growing 350 and 100 plants after they failed to produce
      permits.[@fom24]
    sources:
      - cra20
      - bg
      - dda
      - fom24
    currency: MWK
    penalties:
      - label: Unlicensed cultivation and related acts (2020 Act s50(1))
        treatment: criminal
        term: Unlicensed cultivation
        prison: 25 years
        fine: 50000000
        note: About US$70,000 at 2020 passage (AP)
      - label: Unlicensed cultivation (Dangerous Drugs Regulations reg 6, DDA s19(1))
        treatment: criminal
        term: Unlicensed cultivation
        fine: 500000
        life: possible
        note: Maximum of life imprisonment
  enforcement:
    text: >-
      Police enforce actively, from roadblocks to tip-off raids: 30 bags (100 kg)
      seized at a Senzani checkpoint in October 2025,[@fom25] 15 kg found in a Lilongwe
      bedroom in February 2026,[@fom26] and two unlicensed growers arrested in Mzimba in
      May 2024.[@fom24] Officers may arrest without warrant anyone reasonably suspected
      of an offence against the Dangerous Drugs Act.[@dda] Sentences can be severe — eight
      years' hard labour for a 17-year-old with 134 kg — but the High Court reviews such
      cases for excess and fair-trial compliance.[@salc22]
    sources:
      - fom25
      - fom26
      - fom24
      - dda
      - salc22
  sharing:
    text: >-
      Supply is punished as heavily as growing: distributing cannabis in contravention of
      the 2020 Act draws the same K50 million fine and 25 years.[@cra20] Seizures show an
      export-scale trade: police recorded 952 trafficking cases and 36.6 tonnes seized in
      1999 alone,[@pana00] and road interceptions continue — 100 kg stopped in Ntcheu in
      October 2025[@fom25] after 30-bag loads were already moving by vehicle. The crop's
      fame travels under its own name: [Malawi Gold](/culture/language/chamba/).
    sources:
      - cra20
      - pana00
      - fom25
  consumption:
    text: >-
      Smoking chamba recreationally remains a criminal offence. The March 2024 amendment
      debate confirmed the law "does not legalise smoking",[@nation24] and use falls
      under the Dangerous Drugs Act's general prohibition, punishable with a K500,000
      fine and up to life imprisonment.[@dda]
    sources:
      - nation24
      - dda
  access:
    text: >-
      No legal source for adult use: licensing covers medicinal, industrial and
      scientific production only, and parliament has not decriminalised recreational
      use.[@giq]
    sources:
      - giq
context:
  production:
    status: medical
    text: >-
      The Cannabis Regulation Act 2020 created a Cannabis Regulatory Authority that
      licenses cultivation, processing, storage, export and research for medicinal,
      industrial and scientific purposes — part of a drive to replace tobacco as an
      export crop.[@cra20,bg] In April 2021 the Authority had issued 86 licences to 35
      companies and cooperatives for industrial hemp production.[@fa21] A March 2024
      amendment brought the local variety — chamba — into the licensed
      system.[@nation24] By late 2025 the Authority was issuing cultivation, processing
      and export licences as tobacco earnings declined.[@heka25]
    sources:
      - cra20
      - bg
      - fa21
      - nation24
      - heka25
  recreational:
    text: >-
      Recreational cannabis is fully illegal: the licensing scheme covers medicinal,
      industrial and scientific production only, and parliament "has not decriminalized
      it for recreational use".[@giq] What is illegal is famous — Malawi Gold, the local
      sativa, draws cannabis tourists.[@giq] Parliament's March 2024 debate turned on the word
      chamba itself: the amendment regulated "a locally produced variety", while the
      Leader of the House stressed that growing it without a licence, or being found
      with it, stays an offence.[@nation24] Its names are traced in
      [chamba](/culture/language/chamba/).
    sources:
      - giq
      - nation24
  hemp:
    status: high
    text: >-
      Industrial hemp is a licensed crop, defined as cannabis plant material with no more
      than 1% delta-9 THC, or another ceiling the Minister gazettes.[@cra20] The Act
      licenses open-field hemp cultivation subject to security conditions — fencing or
      armed guards, intrusion alarms, monthly inspections, product bar-coding and
      distance from schools and markets.[@cra20] First licences went out in 2021, 86 to
      35 companies and cooperatives,[@fa21] and licensed production is geared to
      processing and export as tobacco earnings fall.[@heka25] Early results
      disappointed: a Mchinji cooperative leader said industrial hemp took long to find
      any buyer, with imported seed expensive, while high-THC cannabis had buyers on the
      ground — the gap the 2024 amendment addressed.[@voa24]
    sources:
      - cra20
      - fa21
      - heka25
      - voa24
  medical:
    text: >-
      The Act provides for medicinal cannabis as approved final products — processed
      flowers, extracts, resin, crude oil, distillates and isolates — with qualified
      patients tracked through a registry and caregivers for minors and the critically
      ill.[@cra20] Malawian clinicians argue the country should exploit the plant's
      medical and economic potential, including CBD-based therapies.[@mmj22] Licensed
      production so far is export- and research-oriented, and no patient-facing
      dispensing system is documented in the sources read.[@heka25,zenred]
    sources:
      - cra20
      - mmj22
      - heka25
      - zenred
  black_market:
    text: >-
      Police recorded 952 trafficking cases and seized 36.6 tonnes in 1999
      alone.[@pana00] The trade runs on in bulk: 100 kg stopped at a Senzani checkpoint
      in October 2025,[@fom25] and 15 kg found in a Lilongwe bedroom in February
      2026.[@fom26] Destructions continued at scale: over three tonnes seized between
      September 2024 and August 2025 were burned at Nkhatabay in November 2025 on a
      magistrate's order,[@nkhta25] and over five tonnes seized from unlawful possessors
      were torched in Salima in January 2026, unclaimed after six months as the law
      requires.[@salima26] Growing and packing traditions — remote hillside plots, women
      cultivating and men selling, flowering tops bound in leaf-wrapped cobs — are
      described in [chamba](/culture/language/chamba/).
    sources:
      - pana00
      - fom25
      - fom26
      - nkhta25
      - salima26
  arrests:
    text: >-
      Arrests run from street level to bulk: a 62-year-old woman held with 15 kg in
      Lilongwe in February 2026,[@fom26] two growers with 350 and 100 plants in Mzimba in
      May 2024,[@fom24] and 100 kg seized at Senzani in October 2025.[@fom25] Punishment
      can be heavy — eight years' hard labour imposed on an unrepresented 17-year-old
      for 134 kg in June 2022 — but the High Court in Blantyre took the case up for
      review the next month over fair-trial and child-justice concerns.[@salc22]
    sources:
      - fom26
      - fom24
      - fom25
      - salc22
  consequences:
    text: >-
      A conviction is a criminal record. Forfeited cannabis is burned or destroyed in
      front of a police officer of sergeant rank or above.[@dda] Unlicensed possession
      carries up to life imprisonment on the books,[@dda] and unlicensed growing or
      dealing up to 25 years plus a K50 million fine under the 2020 Act.[@cra20]
    sources:
      - dda
      - cra20
  planting:
    seeds: licensed
    seeds_trade: regulated
    clones: licensed
    clones_trade: regulated
    text: >-
      The Cannabis Regulation Act 2020 puts cultivating, propagating, supplying, possessing
      and selling cannabis under licences from the Cannabis Regulatory Authority, and import
      or export under a ministerial permit.[@cra20] Only seed that has been crushed or processed
      so it cannot germinate falls outside the controlled plant, so viable seed and planting
      material are lawful only within the licensed medicinal and hemp schemes.[@cra20]
    sources:
      - cra20
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis
      and supplying it to another person are both prohibited.[@cra20,dda]
    sources:
      - cra20
      - dda
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone: possession without a licence is a
      criminal offence under the Dangerous Drugs Act, and parliament confirmed in 2024
      that the law does not legalise smoking.[@dda,nation24] Medical visitors have no
      route either — no patient-access framework operates, medical cannabis is not
      available domestically or to tourists, and importing cannabis products, even with a
      prescription, remains legally risky and is not officially permitted.[@zenred] Do not
      buy on the street: street sales are illegal.[@zenred]
    sources:
      - dda
      - nation24
      - zenred
  driving:
    status: impairment
    text: >-
      Road Traffic Act section 128 prohibits driving on a public road under the influence of
      a drug having a narcotic effect.[@roadtraffic] It also covers occupying the driver's
      seat with the engine running and sitting beside a learner as the licensed
      supervisor.[@roadtraffic] Drug-analysis evidence is admissible; police may require blood
      or urine samples, and refusal can lead to arrest.[@roadtraffic] The statutory text
      provides up to three years' imprisonment, or a fine or both; injury or death raises the
      prison ceiling to five years.[@roadtraffic] Section 60 requires licence and permit
      suspension of at least six months for a first offence, one year for a second and five
      years for a third or later offence.[@roadtraffic] The numerical concentration rule is
      for alcohol, not THC.[@roadtraffic] The source's monetary fine amounts were not verified
      against subsequent revisions and are not presented as current ticket tariffs.
    sources:
      - roadtraffic
  culture:
    text: >-
      Cannabis is chamba in Malawi, and the word travelled with the crop's fame: Malawi
      Gold, the local sativa sold in hard leaf-wrapped cobs. Duvall documents a deep
      vocabulary — pre-1915 Chichewa could discuss several cannabis varieties including
      one grown for oilseed, and Yao speakers gave the word chamba — and places the
      "chamba heartland" among Chichewa speakers in a 1906 account of smokers taking
      hemp "instead of food and drink" when tired.[@duvall19] The names are traced in
      [chamba](/culture/language/chamba/).[@duvall19] Duvall describes earth-pipe smoking
      stretching "from the Cape to the Congo" into the 1900s — a pipe of shaped earth
      that left nothing for police to find, and was made for that reason under
      prohibition; its use among the Ngoni, who moved north into today's Malawi, is
      described in [the earth pipe](/culture/traditions/the-earth-pipe/).[@duvall19] A
      pre-1922 oral history recorded at Lake Malawi tells of an island discovered by
      "hearing the cough of a man who was smoking hemp," the performance cough described
      in [the smoker's cough](/culture/traditions/the-smokers-cough/).[@duvall19]
      Malawi's Rastafari
      community, about 15,000 people, uses cannabis for spiritual and medicinal
      purposes;[@voa24] its courtroom victories so far concern religious expression
      rather than the herb — in January 2020 the High Court ordered the country's
      7,000-odd government schools to admit Rastafari children with dreadlocks.[@salc20]
    sources:
      - duvall19
      - salc20
      - voa24
answers:
  buy:
    answer: no
    text: No patient or adult-use purchase route verified
