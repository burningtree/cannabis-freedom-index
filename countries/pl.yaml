segments:
  possession:
    text: >-
      Article 62 of the drug law punishes possession of any quantity with up to three years in
      prison, or up to one year in minor cases. Article 62a, added in 2011, lets prosecutors drop a
      case involving a small amount for personal use — but it is discretionary and has been used
      sparingly, so thousands are still convicted each year.
    sources:
      - dr
      - ch
  cultivation:
    text: >-
      Growing cannabis is a crime with up to three years, more for larger crops. Patients may not
      grow their own.
    sources:
      - ch
  enforcement:
    text: >-
      Prison is rarely imposed for small possession, but arrest, a night in custody and a suspended
      sentence or fine are common outcomes.
    sources:
      - dr
  sharing:
    text: Supply is a crime, with heavier sentences when for profit or to minors.
    sources:
      - ch
      - dr
  consumption:
    text: Use itself is not an offence, but possession is, which amounts to the same thing in practice.
    sources:
      - dr
  access:
    text: >-
      No adult-use source. But medical cannabis flower has been dispensed by pharmacies since 2017,
      and with over 100,000 patients in 2025 it is one of Europe's largest medical markets. In
      November 2024 the government required an in-person first consultation, which sharply cut
      online prescribing.
    sources:
      - giq
      - boc
context:
  production:
    text: >-
      Domestic cultivation for medical use is restricted to state research institutes; almost all
      supply is imported.
    sources:
      - ch
  products:
    text: Prescription dried flower and extracts from pharmacies; low-THC hemp products.
    sources:
      - ch
      - giq
  medical:
    text: >-
      Any doctor except a vet can prescribe cannabis for any condition where they judge it
      appropriate, with no list of indications. Patients pay in full.
    sources:
      - ch
      - boc
  consequences:
    text: >-
      A conviction is a criminal record. Drug-driving is punished on the basis of any detectable
      THC.
    sources:
      - dr
