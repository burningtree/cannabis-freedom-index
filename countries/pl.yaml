name: Poland
region: Europe
iso_numeric: 616
recreational: illegal
medical: legal
updated: '2026-10-28'
summary: >-
  Possession and home growing remain crimes, though small personal-possession cases can be
  dropped. Patients can obtain prescribed cannabis through pharmacies; prescribing normally
  requires an in-person examination. A proposal to exempt 15 g and one personal plant remains
  before parliament.
scores:
  possession: 1
  cultivation: 1
  enforcement: 2
  sharing: 1
  consumption: 1
  access: 3
segments:
  possession:
    text: >-
      Possessing cannabis without authorisation carries up to three years in prison; minor cases
      can bring a fine, restricted liberty or up to one year, and a significant quantity one to
      ten years.[@act] Prosecutors may drop cases involving a small amount for personal use when
      punishment would be pointless given the circumstances and harm involved.[@act] Possession
      of any amount became punishable in 2000, ending the earlier personal-use exception.[@ipa]
      [Possession of any amount became punishable in 2000.](/history/poland-criminalisation-2000/)
    sources:
      - act
      - ipa
    penalties:
      - label: Unauthorised possession
        treatment: criminal
        term: Possession of a narcotic drug
        prison: 3 years
        note: Up to three years in prison
      - label: Minor possession case
        treatment: criminal
        term: Possession of a narcotic drug
        prison: 1 year
        note: Fine, restricted liberty or up to one year
      - label: Significant quantity
        treatment: criminal
        term: Possession of a narcotic drug
        prison_min: 1 year
        prison: 10 years
        note: One to ten years
  cultivation:
    text: >-
      Growing cannabis other than fibre hemp without authorisation carries up to three years in
      prison, rising to six months to eight years where the crop could yield a significant
      quantity.[@act] A bill submitted in March 2026 proposes exempting one plant for personal
      use, kept away from public access; parliament has not passed it.[@proposal, process]
      [Possession of any amount became punishable in 2000.](/history/poland-criminalisation-2000/)
      [A 2026 bill would exempt 15 g and one plant.](/history/poland-decriminalisation-bill-2026/)
    sources:
      - act
      - proposal
      - process
    penalties:
      - label: Unlawful cultivation (basic case)
        treatment: criminal
        term: Unlawful cultivation of cannabis
        prison: 3 years
        note: Up to three years in prison
      - label: Where the crop could yield a significant quantity
        treatment: criminal
        term: Unlawful cultivation of cannabis
        prison_min: 6 months
        prison: 8 years
        note: Significant-quantity growing; the 2026 bill would exempt one personal plant
  enforcement:
    text: >-
      Small personal-possession cases can be dropped before a formal investigation begins, but
      the decision depends on the circumstances and social harm.[@act] A Polish Drug Policy
      Network analysis reported 2,307 such dismissals in 2012: 2,145 by prosecutors and 162 by
      courts.[@dr]
      [Prosecutors gained the dismissal power in 2011.](/history/poland-prosecutor-discretion-2011/)
    sources:
      - act
      - dr
  sharing:
    text: >-
      Giving cannabis to another person carries up to three years in prison in the basic
      case.[@act] Supplying a minor or a significant quantity carries six months to eight years;
      supply for financial or personal gain carries one to ten years in the basic case.[@act]
    sources:
      - act
    penalties:
      - label: Giving cannabis to another person (basic case)
        treatment: criminal
        term: Supply of a narcotic drug
        prison: 3 years
        note: Up to three years in prison
      - label: Supplying a minor or a significant quantity
        treatment: criminal
        term: Supply of a narcotic drug
        prison_min: 6 months
        prison: 8 years
        note: Minors and significant quantities; gain motive raises the track to one to ten years
      - label: Supply for financial or personal gain
        treatment: criminal
        term: Supply of a narcotic drug
        prison_min: 1 year
        prison: 10 years
        note: One to ten years in the basic case
  consumption:
    text: >-
      Possessing cannabis for personal consumption remains punishable, with the possibility of
      dropping a case involving a small amount.[@act] There is no fixed gram allowance in that
      exception: officials assess the quantity and circumstances.[@act]
    sources:
      - act
  access:
    text: >-
      Patients can obtain prescription preparations made from authorised cannabis flower,
      extracts or resin through pharmacies.[@act] Since 7 November 2024 prescribing normally
      requires an in-person examination; a doctor providing contracted primary care may continue
      an existing treatment remotely under the stated exception.[@rx] Recreational supply
      remains prohibited.[@act]
      [Remote prescribing was restricted in 2024.](/history/poland-telemedicine-restricted-2024/)
      [Medical cannabis became legal in 2017.](/history/poland-medical-2017/)
    sources:
      - act
      - rx
context:
  recreational:
    text: >-
      There is no legal recreational supply. Possession without authorisation brings up to
      three years, though prosecutors may drop small personal-use cases where punishment
      would be pointless; there is no fixed gram allowance.[@act] A 2026 bill to exempt one
      home plant has not passed.[@proposal,process] Giving cannabis to another person brings
      up to three years.[@act]
      [A 2026 bill would exempt 15 g and one plant.](/history/poland-decriminalisation-bill-2026/)
    sources:
      - act
      - proposal
      - process
  production:
    status: medical
    text: >-
      Research institutes supervised by the agriculture minister may grow medical cannabis with
      permission from the Chief Pharmaceutical Inspector.[@act] Permits last up to five years,
      with security, supervision and records of the crop required.[@act] Fibre hemp is defined
      by no more than 0.3% combined THC and THCA in the flowering or fruiting tops, subject to
      the statutory rounding rule.[@act]
      [State institutes may grow medical cannabis since 2022.](/history/poland-hemp-act-2022/)
    sources:
      - act
  medical:
    text: >-
      Doctors can prescribe cannabis preparations made from authorised pharmaceutical raw
      materials — flower, extracts, tinctures and resin; veterinarians cannot issue these prescriptions.[@act] An in-person examination
      is normally required, with a limited exception for continuing treatment through contracted
      primary care.[@rx]
      [Medical cannabis became legal in 2017.](/history/poland-medical-2017/)
      [The first pharmacy dispensing followed in 2018.](/history/poland-first-pharmacy-cannabis-2018/)
    sources:
      - act
      - rx
  consequences:
    text: >-
      A conviction enters the criminal record; once it is legally expunged, the entry is removed
      and the conviction is treated as having never occurred.[@code] Drug-impaired driving can
      bring up to three years in prison and a driving ban of at least three years.[@code]
    sources:
      - code
  arrests:
    text: >-
      Recorded possession offences rose from 1,896 in 1999 to 31,260 in 2007 and stood at 18,441
      in 2012, according to a 2014 Polish Drug Policy Network analysis.[@dr] The Institute of
      Public Affairs recorded 30,548 possession offences in 2008, when possession accounted for
      53% of drug-act charges and trafficking 24%.[@ipa] Its court-file research found marijuana
      involved in 65% of charges, while the network reported that 79% of marijuana possession
      cases in the Kraków study involved less than three grams.[@ipa, dr] The institute reported
      714 people imprisoned for drug possession in 2007.[@ipa] The national possession totals
      cover all drugs.[@dr, ipa]
    sources:
      - dr
      - ipa
  research:
    status: licensed
    text: >-
      Institutional research growing runs through the agriculture minister's research
      institutes, which may grow medical cannabis with the Chief Pharmaceutical Inspector's
      permission on permits of up to five years, under security, supervision and crop
      records.[@act] No separate research programme, trial or published study was
      established in the retained sources.[@act]
      [State institutes may grow medical cannabis since 2022.](/history/poland-hemp-act-2022/)
    sources:
      - act
  culture:
    text: >-
      Hemp fed Poland as well as clothed it. In Silesia [siemieniotka](/culture/traditions/siemieniotka/),
      a soup of crushed hemp seed, is one of the dishes of the Christmas Eve table.[@slaskie]
      Around Shrovetide, Polish women performed high-jumping [hemp dances](/culture/traditions/the-hemp-dance/)
      so the crop would grow as tall as they could leap.[@mnzp] The folk memory survived the
      twentieth century's bans: the 2022 hemp act that let state institutes grow medical cannabis
      also fixed fibre hemp at 0.3% THC and THCA.[@act]
      [State institutes may grow medical cannabis since 2022.](/history/poland-hemp-act-2022/)
    sources:
      - slaskie
      - mnzp
      - act
  planting:
    seeds: grey
    seeds_trade: open
    clones: illegal
    clones_trade: banned
    text: >-
      Seeds are excluded from the statutory definition of non-fibre cannabis herb.[@act] That
      definition covers above-ground material exceeding 0.3% combined THC and THCA, subject to
      rounding.[@act] Growing cannabis other than fibre hemp without authorisation is a separate
      offence, so the seed exclusion does not permit home growing.[@act]
    sources:
      - act
  hemp:
    status: standard
    text: >-
      Fibre hemp is cannabis at no more than 0.3% combined THC and THCA in the flowering or
      fruiting tops, subject to the statutory rounding rule; seeds are excluded from the
      non-fibre herb definition but that does not permit home growing.[@act] The retained
      sources establish no CBD retail regime beyond authorised pharmaceutical raw
      materials.[@act]
      [State institutes may grow medical cannabis since 2022.](/history/poland-hemp-act-2022/)
    sources:
      - act
  driving:
    status: consumption
    text: >-
      Poland sets no laboratory THC limit. Driving after using a substance that acts like alcohol
      is a misdemeanour under article 87 of the Code of Petty Offences: arrest or a fine of at
      least 2,500 zlotys, and a driving ban.[@kw, gliwice] Driving
      under the influence of a narcotic is a separate crime, with up to three years in prison and
      a driving ban of at least three years.[@code] A court in Gliwice held that an inactive THC
      metabolite shows only earlier cannabis use, and that the crime depends on the effect on that
      driver rather than on a concentration.[@gliwice] The Supreme Court held that a positive
      screening test and an admission of earlier use were not enough, on their own, to prove the
      crime.[@sn]
    sources:
      - kw
      - code
      - gliwice
      - sn
  clubs:
    status: underground
    text: >-
      A European survey conducted in 2018–19 received a response from one Polish cannabis social
      club; its authors could not establish the full national count.[@pardal20] Growing and
      supplying recreational cannabis remain offences, leaving clubs without an authorised
      growing-and-distribution route.[@act]
    sources:
      - pardal20
      - act
  visitors:
    status: none
    text: >-
      Visitors have no authorised recreational supply: giving or selling cannabis remains an
      offence.[@act] Personal possession carries up to three years in prison in the basic case,
      though a small personal-use case may be dropped under the law’s conditions.[@act]
    sources:
      - act
  black_market:
    text: >-
      The EU drugs agency records 7,058 kg of herbal cannabis and 1,635 kg of resin seized in
      Poland in 2024, against 4,251 kg and 783 kg in 2023.[@euda_szr] Herbal cannabis was seized
      on 20,222 occasions and resin on 809.[@euda_szr] Plant seizures totalled 18,130
      plants.[@euda_szr]
    sources:
      - euda_szr
