name: Poland
region: Europe
iso_numeric: 616
recreational: illegal
medical: legal
updated: "2026-10-23"
summary: >-
  Possession and home growing remain crimes, though small personal-possession cases can be
  dropped. Patients can obtain prescribed cannabis through pharmacies; prescribing normally
  requires an in-person examination. A proposal to exempt 15 g and one personal plant remains
  before parliament.
scores:
  possession: 1
  cultivation: 1
  enforcement: 2
  sharing: 1
  consumption: 1
  access: 3
segments:
  possession:
    text: >-
      Possessing cannabis without authorisation carries up to three years in prison; minor cases
      can bring a fine, restricted liberty or up to one year, and a significant quantity one to
      ten years.[@act] Prosecutors may drop cases involving a small amount for personal use when
      punishment would be pointless given the circumstances and harm involved.[@act] Possession
      of any amount became punishable in 2000, ending the earlier personal-use exception.[@ipa]
    sources:
      - act
      - ipa
  cultivation:
    text: >-
      Growing cannabis other than fibre hemp without authorisation carries up to three years in
      prison, rising to six months to eight years where the crop could yield a significant
      quantity.[@act] A bill submitted in March 2026 proposes exempting one plant for personal
      use, kept away from public access; parliament has not passed it.[@proposal, process]
    sources:
      - act
      - proposal
      - process
  enforcement:
    text: >-
      Small personal-possession cases can be dropped before a formal investigation begins, but
      the decision depends on the circumstances and social harm.[@act] A Polish Drug Policy
      Network analysis reported 2,307 such dismissals in 2012: 2,145 by prosecutors and 162 by
      courts.[@dr]
    sources:
      - act
      - dr
  sharing:
    text: >-
      Giving cannabis to another person carries up to three years in prison in the basic
      case.[@act] Supplying a minor or a significant quantity carries six months to eight years;
      supply for financial or personal gain carries one to ten years in the basic case.[@act]
    sources:
      - act
  consumption:
    text: >-
      Possessing cannabis for personal consumption remains punishable, with the possibility of
      dropping a case involving a small amount.[@act] There is no fixed gram allowance in that
      exception: officials assess the quantity and circumstances.[@act]
    sources:
      - act
  access:
    text: >-
      Patients can obtain prescription preparations made from authorised cannabis flower,
      extracts or resin through pharmacies.[@act] Since 7 November 2024 prescribing normally
      requires an in-person examination; a doctor providing contracted primary care may continue
      an existing treatment remotely under the stated exception.[@rx] Recreational supply
      remains prohibited.[@act]
    sources:
      - act
      - rx
context:
  production:
    text: >-
      Research institutes supervised by the agriculture minister may grow medical cannabis with
      permission from the Chief Pharmaceutical Inspector.[@act] Permits last up to five years,
      with security, supervision and records of the crop required.[@act] Fibre hemp is defined
      by no more than 0.3% combined THC and THCA in the flowering or fruiting tops, subject to
      the statutory rounding rule.[@act]
    sources:
      - act
  products:
    text: >-
      Cannabis flower, extracts, tinctures and resin can serve as authorised pharmaceutical raw
      materials for prescription preparations.[@act] Selling or giving cannabis to recreational
      users remains an offence.[@act]
    sources:
      - act
  medical:
    text: >-
      Doctors can prescribe cannabis preparations made from authorised pharmaceutical raw
      materials; veterinarians cannot issue these prescriptions.[@act] An in-person examination
      is normally required, with a limited exception for continuing treatment through contracted
      primary care.[@rx]
    sources:
      - act
      - rx
  consequences:
    text: >-
      A conviction enters the criminal record; once it is legally expunged, the entry is removed
      and the conviction is treated as having never occurred.[@code] Drug-impaired driving can
      bring up to three years in prison and a driving ban of at least three years.[@code]
    sources:
      - code
  arrests:
    text: >-
      Recorded possession offences rose from 1,896 in 1999 to 31,260 in 2007 and stood at 18,441
      in 2012, according to a 2014 Polish Drug Policy Network analysis.[@dr] The Institute of
      Public Affairs recorded 30,548 possession offences in 2008, when possession accounted for
      53% of drug-act charges and trafficking 24%.[@ipa] Its court-file research found marijuana
      involved in 65% of charges, while the network reported that 79% of marijuana possession
      cases in the Kraków study involved less than three grams.[@ipa, dr] The institute reported
      714 people imprisoned for drug possession in 2007.[@ipa] The national possession totals
      cover all drugs.[@dr, ipa]
    sources:
      - dr
      - ipa
  planting:
    seeds: grey
    seeds_trade: open
    clones: illegal
    clones_trade: banned
    text: >-
      Seeds are excluded from the statutory definition of non-fibre cannabis herb.[@act] That
      definition covers above-ground material exceeding 0.3% combined THC and THCA, subject to
      rounding.[@act] Growing cannabis other than fibre hemp without authorisation is a separate
      offence, so the seed exclusion does not permit home growing.[@act]
    sources:
      - act
  driving:
    status: zero
    text: >-
      Poland sets no statutory numerical THC threshold: courts distinguish driving after drug
      use from driving under its influence by examining the effect on the driver.[@sn] The
      Supreme Court held that a positive screening test and an admission of earlier cannabis use
      were insufficient on their own to prove the criminal offence.[@sn] Drug-impaired driving
      carries up to three years in prison and a driving ban of at least three years.[@code]
    sources:
      - sn
      - code
  clubs:
    status: underground
    text: >-
      A European survey conducted in 2018–19 received a response from one Polish cannabis social
      club; its authors could not establish the full national count.[@pardal20] Growing and
      supplying recreational cannabis remain offences, leaving clubs without an authorised
      growing-and-distribution route.[@act]
    sources:
      - pardal20
      - act
  visitors:
    status: none
    text: >-
      Visitors have no authorised recreational supply: giving or selling cannabis remains an
      offence.[@act] Personal possession carries up to three years in prison in the basic case,
      though a small personal-use case may be dropped under the law’s conditions.[@act]
    sources:
      - act
  black_market:
    text: >-
      The EU drugs agency records 7,058 kg of herbal cannabis and 1,635 kg of resin seized in
      Poland in 2024, against 4,251 kg and 783 kg in 2023.[@euda_szr] Herbal cannabis was seized
      on 20,222 occasions and resin on 809.[@euda_szr] Plant seizures totalled 18,130
      plants.[@euda_szr]
    sources:
      - euda_szr
