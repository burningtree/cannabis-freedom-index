name: Poland
region: Europe
iso_numeric: 616
recreational: illegal
medical: legal
updated: 2026-10-13
summary: >-
  Possession of any amount has been a crime since December 2000, though prosecutors may drop
  small-amount cases. Medical flower has been legal on any doctor's prescription since 2017 and in
  pharmacies since late 2018. A bill to stop punishing 15 grams and one plant has waited in the
  Sejm since March 2026.
scores:
  possession: 1
  cultivation: 1
  enforcement: 2
  sharing: 1
  consumption: 1
  access: 3
segments:
  possession:
    text: >-
      Article 62 of the drug law punishes possession of any quantity with up to three years in
      prison, up to one year in minor cases, and one to ten years for a large quantity. From 1985
      to 1997 possession was not an offence at all, and until December 2000 a small amount for
      personal use went unpunished. Article 62a, in force since December 2011, lets prosecutors
      drop a case involving a small amount for personal use, but it is discretionary and has been
      used sparingly: in 2012 it ended 2,307 cases, 11.6% of those prosecutors handled. In 2014
      the Constitutional Tribunal held that punishing possession and growing is constitutional.
    sources:
      - dr
      - ch
      - a2011
      - tk
  cultivation:
    text: >-
      Growing cannabis is a crime with up to three years, more for larger crops. Patients may not
      grow their own: the first draft of the 2017 medical law would have allowed it, and that part
      was removed. A bill filed in March 2026 would stop punishing one plant; it has not been
      debated.
    sources:
      - ch
      - drm
      - bankier
  enforcement:
    text: >-
      Prison is rarely imposed for small possession, but arrest, a night in custody and a suspended
      sentence or fine are common outcomes.
    sources:
      - dr
  sharing:
    text: Supply is a crime, with heavier sentences when for profit or to minors.
    sources:
      - ch
      - dr
  consumption:
    text: Use itself is not an offence, but possession is, which amounts to the same thing in practice.
    sources:
      - dr
  access:
    text: >-
      No adult-use source. Medical cannabis has been legal since November 2017, but the first
      product reached pharmacies only in December 2018: seven kilograms, sold in three cities.
      With over 100,000 patients in 2025 it is now one of Europe's largest medical markets. In
      November 2024 the government required an in-person first consultation, which sharply cut
      online prescribing.
    sources:
      - giq
      - boc
      - sw19
context:
  production:
    text: >-
      Since May 2022 research institutes supervised by the agriculture minister may grow
      cannabis for pharmaceutical raw material, under a permit from the Chief Pharmaceutical
      Inspector valid for up to five years and with each plant tracked. Nobody else may; almost
      all supply is imported. Fibre hemp, with no more than 0.3% of THC and THCA together, is a
      legal crop.
    sources:
      - ch
      - a2022
  products:
    text: Prescription dried flower and extracts from pharmacies; low-THC hemp products.
    sources:
      - ch
      - giq
  medical:
    text: >-
      Any doctor except a vet can prescribe cannabis for any condition where they judge it
      appropriate, with no list of indications. Patients pay in full.
    sources:
      - ch
      - boc
  consequences:
    text: >-
      A conviction is a criminal record. Drug-driving is punished on the basis of any detectable
      THC.
    sources:
      - dr
  arrests:
    text: >-
      Recorded possession offences rose from 1,896 in 1999, the last full year before any amount
      became a crime, to 31,260 in 2007 and 30,548 in 2008, and stood at 18,441 in 2012. In 2008
      possession made up 53% of charges under the drug act and trafficking 24%; 65% of charges
      involved marijuana. A study of Kraków court files from 2008 found 79% of marijuana cases
      involved less than three grams. In 2007, 714 people were in prison for possession. These
      are the latest figures found; all cover every drug, not cannabis alone.
    sources:
      - dr
      - ipa
  planting:
    seeds: grey
    seeds_trade: open
    clones: illegal
    clones_trade: banned
    text: >-
      The drug law defines the herb of non-fibrous cannabis as any above-ground part of the
      plant with more than 0.3% THC, excluding the seeds, so seeds themselves are not a
      controlled drug. Growing the plant is a crime, which covers germinating seeds and
      keeping cuttings.
    sources:
      - upn
  driving:
    status: zero
    text: >-
      No THC limit is set: under the criminal code the offence is committed if a drug is
      detected. Police need suspicion to stop a driver but may test at random, using a
      roadside oral-fluid test and blood taken at a hospital or police station. Penalties are
      up to two years in prison, up to 360 day-fines and a ban of one to ten years.
    sources:
      - euda_dd
  clubs:
    status: underground
    text: >-
      Clubs exist without any legal basis. A Europe-wide survey of cannabis social clubs
      carried out in 2018 and 2019 received answers from one club in Poland, and its authors
      could not say how many more were active. It also found that clubs had existed in Poland
      since the late 1990s. The study notes that the model is prohibited throughout the
      European Union, that clubs sit in a legally sensitive position, and that many have been
      dissolved after court decisions or police raids. Nothing more recent was found.
    sources:
      - pardal20
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. Article 62 of the drug law punishes
      possession of any quantity with up to three years in prison, up to one year in minor
      cases, and one to ten years for a large quantity.
    sources:
      - dr
      - giq
      - boc
  black_market:
    text: >-
      The EU drugs agency's statistical bulletin records 7,058 kg of herbal cannabis and
      1,635 kg of cannabis resin seized in Poland in 2024, against 4,251 kg and 783 kg in
      2023. Herbal cannabis was seized on 20,222 occasions and resin on 809. Plant seizures came to 18,130 plants. Countries record seizures differently, so the
      figures are not comparable across borders.
    sources:
      - euda_szr
