name: Comoros
region: Africa
iso_numeric: 174
recreational: illegal
medical: none
updated: 2026-10-13
summary: >-
  The 2021 Penal Code punishes holding, buying or using narcotics with 10 to 15 years in prison and
  production with 10 to 20 years. Cannabis was briefly legal here from 1975 to 1978.
scores:
  possession: 0
  cultivation: 0
  enforcement: 0
  sharing: 0
  consumption: 0
  access: 0
words:
  - { word: Indian hemp, lang: French (Comoros), meaning: "cannabis; named alongside hashish in article 328 of the 1995 penal code", sources: [pc1995] }
segments:
  possession:
    text: >-
      Article 208 of the Penal Code of 2020 (Law 20-038/AU, promulgated 16 February 2021) punishes
      transporting, holding, offering, transferring, acquiring or unlawfully using narcotics with 10
      to 15 years in prison and a fine of 10,000,000 to 20,000,000 Comorian francs.[@pc2020] The article has
      no lighter tier for personal use. The text uses the word "stupéfiants" and does not name
      cannabis; the earlier code did name hashish and Indian hemp. Cannabis was legal from 1975 to
      1978 under President Ali Soilih.[@wiki]
    sources:
      - pc2020
      - wiki
    currency: KMF
    penalties:
      - label: Holding or using narcotics (no personal-use tier)
        treatment: criminal
        term: Possession
        prison_min: 10 years
        prison: 15 years
        fine: 20000000
        note: Fine of 10,000,000 to 20,000,000 francs; maximum doubles in listed aggravating cases
  cultivation:
    text: >-
      Article 206 punishes illicit production or manufacture of narcotics with 10 to 20 years, and
      15 to 25 when committed by an organised gang.[@pc2020] Article 205 gives life imprisonment
      for leading a group that grows, makes or supplies narcotics.[@pc2020]
    sources:
      - pc2020
    penalties:
      - label: Illicit production or manufacture
        treatment: criminal
        term: Production
        prison_min: 10 years
        prison: 20 years
        note: 15 to 25 years when committed by an organised gang
      - label: Leading a group that grows, makes or supplies narcotics (article 205)
        treatment: criminal
        term: Production
        life: mandatory
        note: Life imprisonment for group leadership
  enforcement:
    text: >-
      The code sets 10 to 15 years for holding or using, with no personal-use tier, and doubles
      the maximum in listed aggravating cases (Article 214).[@pc2020] How courts apply it is not
      shown by the text.
    sources:
      - pc2020
  sharing:
    text: >-
      Article 210 punishes giving or offering narcotics to a person for their personal consumption
      with 5 to 10 years and a fine of 3,000,000 to 5,000,000 francs; 7 to 10 years if offered to
      minors or at schools.[@pc2020] Article 208 also punishes offering or transferring (10 to 15
      years).[@pc2020]
    sources:
      - pc2020
  consumption:
    text: >-
      Article 208 punishes the unlawful "emploi" (use) of narcotics with 10 to 15
      years.[@pc2020]
    sources:
      - pc2020
  access:
    text: >-
      No lawful source; acquiring and holding narcotics is punished under Article
      208.[@pc2020]
    sources:
      - pc2020
context:
  recreational:
    text: >-
      There is no legal recreational market. Holding or using narcotics carries ten to fifteen
      years in prison and a heavy fine, with no lighter tier for personal use — though cannabis
      was legal from 1975 to 1978 under President Ali Soilih.[@pc2020,wiki]
    sources:
      - pc2020
      - wiki
  hemp:
    status: none
    text: >-
      No industrial-hemp exception was verified: the 2020 code punishes narcotics production
      with no low-THC distinction, and no hemp production is documented.[@pc2020] No lawful
      cannabis products were identified in the reviewed sources.
    sources: [pc2020]
  production:
    status: none
    text: >-
      No licensed cannabis production exists: Article 206 punishes illicit production with ten
      to twenty years, rising for organised gangs, and the reviewed law shows no licensing
      route.[@pc2020]
    sources:
      - pc2020
  medical:
    text: >-
      The reviewed Penal Code punishes unlawful use with ten to fifteen years and sets no
      patient programme or supply route.[@pc2020]
    sources:
      - pc2020
  consequences:
    text: >-
      The reviewed provisions set the penalties themselves in Articles 205–214; no separate
      collateral-consequence regime beyond those penalties was shown in the reviewed
      text.[@pc2020]
    sources:
      - pc2020
  planting:
    seeds: grey
    seeds_trade: unclear
    clones: illegal
    clones_trade: banned
    text: >-
      The 2020 Penal Code punishes the illicit production of narcotics with ten to twenty
      years (Article 206) and does not name cultivation or seeds separately.[@pc2020] Whether
      growing a plant counts as production under the code was not confirmed.
    sources:
      - pc2020
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited.[@pc2020]
    sources:
      - pc2020
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone.[@pc2020] Holding or using narcotics
      carries ten to fifteen years under Article 208, with no separate visitor
      regime in the reviewed law.[@pc2020]
    sources:
      - pc2020
  culture:
    text: >-
      Cannabis was legal from 1975 to 1978 under President [Ali
      Soilih](/culture/people/ali-soilih/), as that [1975
      legalisation](/history/comoros-legalisation-1975/) and the [1978
      re-ban](/history/comoros-ban-restored-1978/) record.[@wiki] The earlier code named the
      plant [Indian hemp](/culture/language/indian-hemp/) alongside hashish in article
      328.[@pc1995]
    sources:
      - wiki
      - pc1995
  black_market:
    text: >-
      Figures reported by the government to the UN drugs office record 316 kg of herbal
      cannabis seized in 2024, against 2,263 kg in 2023, and 121 kg of cannabis resin
      seized in 2024, against 57.5 kg in 2023.[@unodc_szr] The UN publishes them as kilogram
      equivalents, and countries count seizures differently, so the figures are not
      comparable across borders.[@unodc_szr]
    sources:
      - unodc_szr
