segments:
  possession:
    text: >-
      Article 208 of the Penal Code of 2020 (Law 20-038/AU, promulgated 16 February 2021) punishes
      transporting, holding, offering, transferring, acquiring or unlawfully using narcotics with 10
      to 15 years in prison and a fine of 10,000,000 to 20,000,000 Comorian francs. The article has
      no lighter tier for personal use. The text uses the word "stupéfiants" and does not name
      cannabis; the earlier code did name hashish and Indian hemp. Cannabis was legal from 1975 to
      1978 under President Ali Soilih.
    sources:
      - pc2020
      - wiki
  cultivation:
    text: >-
      Article 206 punishes illicit production or manufacture of narcotics with 10 to 20 years, and 15
      to 25 when committed by an organised gang. Article 205 gives life imprisonment for leading a
      group that grows, makes or supplies narcotics.
    sources:
      - pc2020
  enforcement:
    text: >-
      The code sets 10 to 15 years for holding or using, with no personal-use tier, and doubles the
      maximum in listed aggravating cases (Article 214). How courts apply it is not shown by the
      text.
    sources:
      - pc2020
  sharing:
    text: >-
      Article 210 punishes giving or offering narcotics to a person for their personal consumption
      with 5 to 10 years and a fine of 3,000,000 to 5,000,000 francs; 7 to 10 years if offered to
      minors or at schools. Article 208 also punishes offering or transferring (10 to 15 years).
    sources:
      - pc2020
  consumption:
    text: >-
      Article 208 punishes the unlawful "emploi" (use) of narcotics with 10 to 15 years.
    sources:
      - pc2020
  access:
    text: >-
      No lawful source; acquiring and holding narcotics is punished under Article 208.
    sources:
      - pc2020
context:
  production:
    text: No licensed production.
    sources:
      - wiki
  products:
    text: No legal products.
    sources:
      - wiki
  medical:
    text: The retained sources do not establish whether a medical cannabis programme operates.
    sources: []
  consequences:
    text: The retained sources do not establish collateral consequences beyond the penalties described above.
    sources: []
  planting:
    seeds: grey
    seeds_trade: unclear
    clones: illegal
    clones_trade: banned
    text: >-
      The 2020 Penal Code punishes the illicit production of narcotics with ten to twenty
      years (Article 206) and does not name cultivation or seeds separately. Whether growing a
      plant counts as production under the code was not confirmed.
    sources:
      - pc2020
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited.
    sources:
      - pc2020
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. British travel advice says drug
      trafficking and possession are serious offences that can bring a long prison sentence
      and a fine.
    sources:
      - pc2020
      - fcdo
  black_market:
    text: >-
      Figures reported by the government to the UN drugs office record 316 kg of herbal
      cannabis seized in 2024, against 2,263 kg in 2023, and 121 kg of cannabis resin
      seized in 2024, against 57.5 kg in 2023. The UN publishes them as kilogram
      equivalents, and countries count seizures differently, so the figures are not
      comparable across borders.
    sources:
      - unodc_szr
