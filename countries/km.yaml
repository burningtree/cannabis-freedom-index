    sources:
      - cr
  consequences:
    text: A conviction is a criminal record; foreigners are deported.
    sources:
      - tb
  planting:
    seeds: grey
    seeds_trade: unclear
    clones: illegal
    clones_trade: banned
    text: >-
      The 2020 Penal Code punishes the illicit production of narcotics with ten to twenty
      years (Article 206) and does not name cultivation or seeds separately. Whether growing a
      plant counts as production under the code was not confirmed.
    sources:
      - pc2020
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited.
    sources:
      - pc2020
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. British travel advice says drug
      trafficking and possession are serious offences that can bring a long prison sentence
      and a fine.
    sources:
      - pc2020
      - fcdo
