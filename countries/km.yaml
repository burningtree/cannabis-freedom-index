segments:
  possession:
    text: >-
      Illegal under a 1995 drug-control law. Travel-advice sources report a mandatory minimum of
      five years for drug convictions, plus heavy fines and deportation for foreigners. A historical
      curiosity: cannabis was legal here from 1975 to 1978 under President Ali Soilih.
    sources:
      - wiki
      - tb
  cultivation:
    text: Cultivation is a crime.
    sources:
      - cr
  enforcement:
    text: >-
      Long sentences are reported; how consistently they are applied to small amounts is not well
      documented.
    sources:
      - tb
      - cr
  sharing:
    text: Trafficking carries five to fifteen years.
