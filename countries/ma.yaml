segments:
  possession:
    text: >-
      Recreational possession and use are illegal under a 1974 decree, punishable by prison of up to
      a year and a fine. Kif smoking is nonetheless deeply traditional and widely tolerated in the
      north, so enforcement is uneven.
    sources:
      - cms
  cultivation:
    text: >-
      Illegal for personal use. Growing is lawful only for farmers in designated Rif provinces who
      join a cooperative and hold an authorisation from the cannabis agency, selling their whole
      crop to licensed processors.
    sources:
      - anrac
      - map
  enforcement:
    text: >-
      Users can be jailed, though often are not; traffickers face long sentences. The 2024 pardon
      was limited to growers.
    sources:
      - cms
      - ata
  sharing:
    text: Supply is trafficking.
    sources:
      - cms
  consumption:
    text: >-
      Use is an offence, with prosecution avoidable by accepting treatment. Tolerated in practice in
      much of the Rif.
    sources:
      - cms
  access:
    text: No legal adult-use source; the law of 2021 explicitly excludes recreational use.
    sources:
      - map
      - cms
context:
  production:
    text: >-
      Law 13-21 legalised cultivation, processing, export and sale for medical, pharmaceutical and
      industrial purposes. In 2024 the agency issued over 3,000 authorisations, most to small
      farmers, and a royal pardon cleared thousands of growers with past convictions or warrants.
    sources:
      - ata
      - anrac
  products:
    text: >-
      Licensed medical, cosmetic and food-supplement products; THC above 1% only for pharmaceutical
      use.
    sources:
      - map
      - cms
  medical:
    text: >-
      Cannabis-based medicines can be registered and sold through pharmacies; the domestic medical
      market is young.
    sources:
      - map
      - ata
  consequences:
    text: A drug conviction is a criminal record; the pardon removed that burden for many Rif farmers.
    sources:
      - ata
  planting:
    seeds: licensed
    seeds_trade: regulated
    clones: licensed
    clones_trade: regulated
    text: >-
      Under Law 13-21 importing or exporting cannabis seeds and plants needs an authorisation
      from the regulator ANRAC, and licence holders may bring in only seed the agency has
      approved. Certified lots must carry the variety's certification number and THC level.
      The first imported seed arrived in April 2023 and went to cooperatives in Al Hoceima and
      Chefchaouen.
    sources:
      - hesp23
