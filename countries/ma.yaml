name: Morocco
region: Africa
iso_numeric: 504
recreational: illegal
medical: limited
updated: '2026-10-26'
summary: >-
  Law 13-21 (2021) legalised cultivation for medical, cosmetic and industrial use in the Rif
  provinces. Recreational kif remains illegal but is widely tolerated; thousands of growers were
  pardoned in 2024.
scores:
  possession: 1
  cultivation: 1
  enforcement: 2
  sharing: 1
  consumption: 2
  access: 1
segments:
  possession:
    text: >-
      Unauthorised holding is prohibited separately from use. Article 2 of the 1974 law expressly
      punishes illicit possession, import, production, transport and export with five to ten years
      and a 5,000–50,000 dirham fine. Article 8’s lower two-month-to-one-year term concerns illicit
      use, with a 500–5,000 dirham fine or either penalty alone; it is not a universal statutory
      ceiling for possession.[@law1974] Traditional kif use is widely tolerated in the north, with
      uneven enforcement.[@idpc17,cms]
    sources:
      - law1974
      - idpc17
      - cms
  cultivation:
    text: >-
      Illegal for personal use. Growing is lawful only for farmers in designated Rif provinces who
      join a cooperative and hold an authorisation from the cannabis agency, selling their whole
      crop to licensed processors.
    sources:
      - anrac
      - map
  enforcement:
    text: >-
      Users can be jailed, though often are not; traffickers face long sentences. The 2024 pardon
      was limited to growers.[@cms,ata] The statutory personal-use offence has a 500–5,000 dirham
      fine, while illicit holding has a separate five-to-ten-year penalty; charging practice must
      not be inferred from the use offence alone.[@law1974]
    sources:
      - cms
      - ata
      - law1974
  sharing:
    text: >-
      Article 3 punishes facilitating another person’s use, whether paid or free, with two to ten
      years and a 5,000–500,000 dirham fine. Article 2 separately punishes illicit holding and
      transport with five to ten years.[@law1974]
    sources:
      - law1974
  consumption:
    text: >-
      Article 8 punishes illicit use with two months to one year in prison and 500–5,000 dirhams, or
      either penalty alone. Under its conditions, accepting medically supervised detoxification can
      avoid prosecution.[@law1974] Use is tolerated in practice in much of the Rif.[@cms]
    sources:
      - law1974
      - cms
  access:
    text: No legal adult-use source; the law of 2021 explicitly excludes recreational use.
    sources:
      - map
      - cms
context:
  recreational:
    text: >-
      There is no legal recreational market. Traditional kif smoking is widely tolerated in the
      northern growing regions, with uneven enforcement, while users elsewhere can be jailed
      though often are not.[@idpc17,cms] The 2021 law opened a legal route only for authorised
      Rif growers selling their whole crop to licensed processors — not for users.[@anrac,map]
    sources:
      - idpc17
      - cms
      - anrac
      - map
  culture:
    text: >-
      The Rif’s kif economy is also its culture: cannabis ranks with the region’s chief cash
      crops, smoked as a work stimulant that violates no religious sanction.[@joseph75] The
      [sebsi pipe](/culture/traditions/kif-and-the-sebsi/) and the word
      [kif](/culture/language/kif/) belong to Berber men of middle age and older — an
      establishment habit, not rebellion — with no ritual or Sufi blessing attached; the
      1959 growers’ confrontation with the government is part of the same story, see [the 1959
      confrontation](/history/morocco-kif-cultivators-1959-confrontation/).[@joseph75]
    sources:
      - joseph75
  production:
    text: >-
      Law 13-21 legalised cultivation, processing, export and sale for medical, pharmaceutical and
      industrial purposes. In 2024 the agency issued over 3,000 authorisations, most to small
      farmers, and a royal pardon cleared thousands of growers with past convictions or warrants.
    sources:
      - ata
      - anrac
  products:
    text: >-
      Licensed medical, cosmetic and food-supplement products; THC above 1% only for pharmaceutical
      use.
    sources:
      - map
      - cms
  medical:
    text: >-
      Cannabis-based medicines can be registered and sold through pharmacies; the domestic medical
      market is young.
    sources:
      - map
      - ata
  consequences:
    text: A drug conviction is a criminal record; the pardon removed that burden for many Rif farmers.
    sources:
      - ata
  planting:
    seeds: licensed
    seeds_trade: regulated
    clones: licensed
    clones_trade: regulated
    text: >-
      Under Law 13-21 importing or exporting cannabis seeds and plants needs an authorisation
      from the regulator ANRAC, and licence holders may bring in only seed the agency has
      approved. Certified lots must carry the variety's certification number and THC level.
      The first imported seed arrived in April 2023 and went to cooperatives in Al Hoceima and
      Chefchaouen.
    sources:
      - hesp23
  black_market:
    text: >-
      Morocco is the world's biggest producer of cannabis resin according to the United
      Nations, and the illegal trade still dwarfs the legal one. Official figures put illegal
      cultivation at 55,000 hectares in 2019, in a Rif economy on which up to 120,000 families
      depend; hashish from there is smuggled mainly to Europe. Official estimates of
      trafficking revenue fell from about 540 million dollars in the early 2000s to almost 350
      million in 2020. The licensed medical and industrial sector created by the 2021 law is
      growing but small beside it: about 3,141 hectares farmed by 4,776 licensed growers in
      2025, producing 19,576 quintals of dried cannabis, and the regulator withdrew 1,308
      farming licences that year after inspections.
    sources:
      - afp24
      - mwn26
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited.
    sources:
      - anrac
      - map
      - cms
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. Recreational possession and use are
      illegal under a 1974 decree, punishable by up to a year in prison and a fine; the licensed
      growing allowed since 2021 is for medical and industrial use only.
    sources:
      - cms
      - map
  arrests:
    text: >-
      The national police's report for 2025 counts 106,117 drug cases and 134,126 people
      arrested in them, 378 of them foreign nationals; the figures cover all drugs. Police
      seized nearly 170 tonnes and 796 kg of cannabis resin and its derivatives during the
      year, against 1.7 tonnes of cocaine and about 6 kg of heroin. Controlled deliveries run
      with Spain accounted for 55 tonnes of resin and 38 arrests.
    sources:
      - dgsn25
  driving:
    status: impairment
    text: >-
      The government's July 2024 consolidation of Road Code 52-05, article 183, prohibits driving
      under the influence of narcotics or certain medicines after which driving is forbidden.
      It provides six months–one year in prison and MAD5,000–10,000, or either punishment, plus
      a court-ordered licence suspension of six months–one year. Repetition within five years
      of a final judgment for similar conduct doubles both penalties and the suspension.
      The same article applies to instructors accompanying learners and refusal of the specified
      tests or checks. Article 99 provides a six-point deduction for drug-influence driving or
      the listed refusals; it is distinct from the court suspension. Articles 213–214 distinguish
      screening from subsequent medical, clinical and biological checks after a positive result,
      refusal or inability to undergo screening. A numeric THC cutoff, medical-cannabis exemption
      and amendments after this consolidation were not verified.
    sources:
      - road_code24
  spotlights:
    - title: The growers who beat the ban debate
      text: >-
        Rif growers faced down the government in 1959, demanding alcohol be banned too if kif
        went — see [the 1959 confrontation](/history/morocco-kif-cultivators-1959-confrontation/).[@joseph75]
        Law 13-21 later legalised their crop for medical and industrial sale through
        cooperatives, and a 2024 royal pardon cleared thousands of growers.[@anrac,ata]
      sources:
        - joseph75
        - anrac
        - ata
