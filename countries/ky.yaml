name: Cayman Islands
region: North America
iso_numeric: 136
dependency:
  of: gb
  kind: British Overseas Territory
  note: >-
    The Cayman Islands are a British Overseas Territory with their own parliament and drug laws. The
    United Kingdom answers for them internationally, so any reform must fit the UN drug conventions
    the UK has signed.
recreational: illegal
medical: limited
words:
  - word: ganja
    lang: English (Cayman Islands)
    meaning: The Law Reform Commission's word for the drug in police statistics — 73 ganja-possession and 15 ganja-supply offences recorded in 2023
    sources:
      - lrc
updated: "2026-10-28"
summary: >-
  Cannabis possession, use, growing and supply remain criminal offences. A doctor may prescribe
  extracts and tinctures through the medical route introduced in 2016. Voters backed decriminalising
  small amounts in April 2025; after a public consultation, the premier expected reform
  recommendations and supporting legislation in November or December 2026.
scores:
  possession: 1
  cultivation: 1
  enforcement: 2
  sharing: 1
  consumption: 0
  access: 1
segments:
  possession:
    text: >-
      Unauthorised possession is an offence. For cannabis or resin below one pound, the statutory
      maximum is CI$20,000 and seven years in prison with hard labour, rising to ten years on a
      repeat conviction; larger amounts attract higher repeat-offence penalties.[@law] These are
      statutory maxima; the Act also provides community service and attendance orders as sentencing
      options in specified cases.[@law]
      [The 1977 penalties were the modern starting point.](/history/cayman-cannabis-penalties-1977/)
    sources:
      - law
    currency: KYD
    penalties:
      - upto: 1 lb
        treatment: criminal
        term: Unauthorised possession under 1 lb
        fine: 20000
        prison: 7 years
        note: Rises to ten years on a repeat conviction
      - over: 1 lb
        treatment: criminal
        term: Unauthorised possession over 1 lb
        note: Larger amounts attract higher repeat-offence penalties
  cultivation:
    text: >-
      Producing cannabis without authorisation is an offence, and the Act’s definition of production
      includes cultivation.[@law] The 2026 consultation asked whether to permit up to four plants
      per household; the existing law provides no personal home-growing
      allowance.[@law,lrc](/history/cayman-cannabis-reform-consultation-2026/) Unauthorised
      production was first brought under a single modern drug law in
      1973.(/history/cayman-modern-drug-law-1973/)
    sources:
      - law
      - lrc
    currency: KYD
    penalties:
      - label: Production under 1 lb
        treatment: criminal
        term: Production
        fine: 20000
        prison: 7 years
        note: Second or later conviction CI$20,000 and ten years
      - label: Production 1 lb or more
        treatment: criminal
        term: Production
        fine: 20000
        prison: 7 years
        note: Second or later conviction fine and fifteen years
  enforcement:
    text: >-
      Police recorded 73 ganja-possession offences and 16 consumption offences among 150 drug crimes
      in 2023; possession offences rose by 36 in 2024. The Law Reform Commission reports that police
      say drug charges often arise from supply investigations or encounters for other reasons.[@lrc]
      Courts may make community service or attendance orders in specified cases, alongside or
      instead of other sentencing options; the prison maxima do not describe every sentence
      imposed.[@law]
    sources:
      - lrc
      - law
  sharing:
    text: >-
      Unauthorised supply or distribution of cannabis is an offence, including supplying it without
      payment.[@law] The Law Reform Commission records 15 ganja-supply offences in 2023.[@lrc]
    sources:
      - law
      - lrc
  consumption:
    text: >-
      Unauthorised consumption is a separate offence, with a maximum fine of CI$3,000 and three
      years in prison with hard labour, rising to CI$10,000 and ten years from the third conviction.
      Possessing a pipe or utensil for consuming controlled drugs is also an offence.[@law]
      Prescribed medical extracts and tinctures have an express lawful-use exception.[@law]
    sources:
      - law
    currency: KYD
    penalties:
      - label: Unauthorised consumption
        treatment: criminal
        term: Unauthorised consumption
        fine: 3000
        prison: 3 years
      - label: Unauthorised consumption, third or later conviction
        repeat: 3
        treatment: criminal
        term: Unauthorised consumption (repeat)
        fine: 10000
        prison: 10 years
  access:
    text: >-
      A locally licensed medical doctor may prescribe cannabis extracts or tinctures for a patient
      under that doctor’s care and must set the dose. The authorised supply route includes licensed
      pharmacists, retail pharmacies and lawful
      importers.[@law](/history/cayman-medical-extracts-2016/) Buying or supplying cannabis for
      recreational use remains an offence.[@law]
    sources:
      - law
context:
  recreational:
    text: >-
      There is no lawful recreational supply. Possession, use, growing and supply remain
      criminal offences, though voters backed decriminalising small amounts in April
      2025.[@answer](/history/cayman-decriminalisation-referendum-2025/) After a public
      consultation on 30 grams, four plants and clearing old
      convictions,(/history/cayman-cannabis-reform-consultation-2026/) the premier expected reform
      recommendations and legislation in November or
      December 2026.[@lrc,timetable]
    sources:
      - answer
      - lrc
      - timetable
  production:
    status: medical
    text: >-
      The Act prohibits unauthorised production, including cultivation; its medical exception
      provides for extracts and tinctures through doctors, pharmacists and importers.[@law] In
      August 2017, Canadian producer Cronos reported a completed oil shipment to Caribbean Medical
      Distributors, working with a George Town hospital pharmacy.[@cronos]
    sources:
      - law
      - cronos
  medical:
    text: >-
      The medical-extract amendment commenced on 18 November
      2016.(/history/cayman-medical-extracts-2016/) A doctor licensed locally may
      prescribe extracts or tinctures for medical or therapeutic purposes and determines the
      dosage.[@law] The Law Reform Commission’s July 2026 review focused on recreational possession
      and use because medical and therapeutic use was already permitted.[@lrc]
    sources:
      - law
      - lrc
  hemp:
    status: none
    text: >-
      No legal hemp or CBD category was found in the reviewed law; the cannabis definition covers
      any part of the plant except separated mature stalk and fibre.[@law] The 2026 consultation
      asked whether importation, production, distribution and sale should remain
      illegal.[@consult](/history/cayman-cannabis-reform-consultation-2026/)
    sources:
      - law
      - consult
  consequences:
    text: >-
      After the April 2025 referendum, Premier André Ebanks told Parliament that 55.64% had
      supported decriminalisation and that the issue would go to the Law Reform
      Commission.[@answer](/history/cayman-decriminalisation-referendum-2025/)
      Its July 2026 paper asked about 30 grams of dried cannabis, 150 grams wet, four plants per
      household and clearing old minor
      convictions.[@lrc](/history/cayman-cannabis-reform-consultation-2026/) In October the premier
      expected the final report and supporting legislation in November or
      December.[@timetable]
    sources:
      - answer
      - lrc
      - timetable
  clubs:
    status: none
    text: >-
      Unauthorised supply and distribution remain offences, with no exception for supplying cannabis
      through a recreational club.[@law] The 2026 consultation asked whether importation,
      production, distribution and sale should remain
      illegal.[@consult](/history/cayman-cannabis-reform-consultation-2026/)
    sources:
      - law
      - consult
  visitors:
    status: none
    text: >-
      Recreational possession, use and importation are offences under the Act.[@law] The lawful
      medical route requires extracts or tinctures prescribed by a doctor licensed under Cayman’s
      Health Practice Act for a patient under that doctor’s care.[@law]
    sources:
      - law
  planting:
    seeds: illegal
    seeds_trade: banned
    clones: illegal
    clones_trade: banned
    text: >-
      Cannabis means any plant of the genus Cannabis or any part of it, except separated mature
      stalk and fibre; seeds are not excluded.[@law] Growing any cannabis plant is unauthorised
      production, and supplying seeds or cuttings is unauthorised supply or distribution.[@law]
    sources:
      - law
  black_market:
    text: >-
      Police recorded 15 ganja-supply offences and 2 ganja-importation offences in 2023, down from
      18 and 3 the year before.[@lrc] The commission notes charges often arise from supply
      investigations or encounters for other reasons rather than targeted possession
      enforcement.[@lrc]
    sources:
      - lrc
  arrests:
    text: >-
      Police recorded 73 ganja-possession offences and 16 consumption offences among 150 drug
      crimes in 2023; possession offences rose by 36 in 2024.[@lrc] Courts may make community service
      or attendance orders in specified cases instead of or alongside other sentences.[@law]
    sources:
      - lrc
      - law
