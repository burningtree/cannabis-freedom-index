name: Cayman Islands
region: North America
iso_numeric: 136
dependency:
  of: gb
  kind: British Overseas Territory
  note: >-
    The Cayman Islands are a British Overseas Territory with their own parliament and drug laws. The
    United Kingdom answers for them internationally, so any reform must fit the UN drug conventions
    the UK has signed.
population:
  2024: 88833
cannabis_use:
  prevalence: 4.98
  estimate: true
  users: 2900
recreational: illegal
medical: limited
updated: 2026-10-17
summary: >-
  Possessing or consuming cannabis is a crime with heavy maximum penalties, and possession is the
  most common drug offence the police record. Prescribed cannabis extracts are legal. Voters backed
  decriminalising small amounts in a 2025 referendum, and draft legislation is expected at the end
  of 2026.
scores:
  possession: 1
  cultivation: 1
  enforcement: 2
  sharing: 1
  consumption: 0
  access: 1
segments:
  possession:
    text: >-
      Possession of cannabis is an offence under the Misuse of Drugs Act. For less than a pound the
      maximum is a fine of CI$20,000 and seven years' imprisonment with hard labour, rising to ten
      years for a repeat conviction; larger amounts carry more.
    sources:
      - lrc
  cultivation:
    text: >-
      Producing cannabis is an offence under the same section as possession and supply, with no
      exception for a few plants at home. A home-cultivation limit is one of the options in the 2026
      reform consultation.
    sources:
      - lrc
  enforcement:
    text: >-
      Possession of ganja was by far the most common drug offence in 2023: 73 of 150 recorded drug
      crimes, with a further 16 for consuming it. Possession offences rose again in 2024. The police
      say these charges mostly arise from investigations into supply or importation, or from
      encounters for other reasons.
    sources:
      - lrc
  sharing:
    text: >-
      Selling, supplying, distributing or giving cannabis to another person is an offence, with no
      exception for sharing without payment. Fifteen ganja supply offences were recorded in 2023.
    sources:
      - lrc
  consumption:
    text: >-
      Consuming cannabis is an offence in itself, punishable by a fine of CI$3,000 and three years'
      imprisonment with hard labour, and up to CI$10,000 and ten years from the third conviction.
      Possessing a pipe or utensil for consuming it is also an offence.
    sources:
      - lrc
  access:
    text: >-
      No legal adult-use source. Section 2A of the Misuse of Drugs Act allows cannabis extracts and
      tinctures to be used for medical or therapeutic purposes on a doctor's prescription; other
      cannabis products remain controlled.
    sources:
      - lrc
context:
  production:
    text: >-
      No licensed cannabis production. The reform under consultation concerns personal possession,
      use and home cultivation, not a commercial market.
    sources:
      - lrc
      - ky26
  products:
    text: >-
      Only prescribed cannabis extracts and tinctures. Outside a prescription, extracts, tinctures,
      cannabinol and its derivatives are classed as hard drugs with higher penalties than herbal
      cannabis.
    sources:
      - lrc
  medical:
    text: >-
      A doctor may prescribe cannabis extracts and tinctures for medical or therapeutic purposes.
      The Law Reform Commission notes that medical use is already permitted and left it out of the
      reform review.
    sources:
      - lrc
  consequences:
    text: >-
      In a non-binding referendum in April 2025, 55.64% of voters backed decriminalising the
      consumption and possession of small amounts. Cabinet referred the question to the Law Reform
      Commission, whose July 2026 paper put options to consultation, among them a 30 g possession
      limit and up to four plants per household, administrative penalties and the treatment of
      historic convictions. In October 2026 the Premier said the final report and draft legislation
      were expected in November or December.
    sources:
      - lrc
      - ky26
      - wikiref
  clubs:
    status: none
    text: >-
      No cannabis clubs are known. Supplying cannabis to another person is an offence.
    sources:
      - lrc
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone, and importing cannabis is an offence. The
      prescription route covers only extracts and tinctures.
    sources:
      - lrc
