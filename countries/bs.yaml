summary: >-
  Cannabis remains criminal. The 2024 Act created a Cannabis Authority, but its possession,
  medical-use and licensing provisions have not been brought into force.
scores:
  possession: 1
  cultivation: 1
  enforcement: 2
  sharing: 1
  consumption: 1
