segments:
  possession:
    text: >-
      Unauthorised possession remains an offence under the Dangerous Drugs Act. Although the 2024
      Cannabis Act contains an uncommenced $250 fixed-penalty route for possession below 30 g, the
      sections creating that route have not been commenced.
    sources:
      - dda
      - cannabis_act
      - appointed_day
  cultivation:
    text: >-
      Home growing is a criminal offence. The Dangerous Drugs Act prohibits growing any plant of
      the genus Cannabis; its narrow exception requires ministerial authority for medical or
      scientific purposes.
    sources:
      - dda
  enforcement:
    text: >-
      Possession can be prosecuted under the Dangerous Drugs Act and prison remains legally
      possible. The Cannabis Act's fixed-penalty provisions are not among the sections in force.
    sources:
      - dda
      - appointed_day
  sharing:
    text: Supplying or offering to supply cannabis remains a criminal offence, including unpaid transfer.
    sources:
      - dda
  consumption:
    text: >-
      Recreational possession and use remain unlawful. The religious-use licence contemplated by
      the 2024 Act is not yet available because its licensing Part has not commenced.
    sources:
      - cannabis_act
      - appointed_day
  access:
    text: >-
      There is no lawful retail source. The 2024 Act provides for medical and religious retail
      licences, but those provisions have not commenced and licence applications had still not
      opened in July 2026.
    sources:
      - cannabis_act
      - appointed_day
      - trib26
context:
  production:
    text: >-
      The Cannabis Authority exists, but the Act's cultivation, manufacturing, retail, testing,
      research, transport and religious-use licensing Part has not commenced.
    sources:
      - cannabis_act
      - appointed_day
  products:
    text: No licensed cannabis products are yet available.
    sources:
      - trib26
  medical:
    text: >-
      The 2024 Act lays out a prescription and dispensary system, but those sections and the
      companion Dangerous Drugs and Pharmacy amendments remain out of force. In July 2026 the
      Cannabis Authority had still not opened licence applications.
    sources:
      - cannabis_act
      - appointed_day
      - not_in_force
      - trib26
  consequences:
    text: The 2024 framework has not removed criminal liability for personal possession.
    sources:
      - appointed_day
      - dda
  planting:
    seeds: illegal
    seeds_trade: banned
    clones: illegal
    clones_trade: banned
    text: >-
      The Dangerous Drugs Act defines Indian hemp as all parts of any plant of the genus Cannabis,
      whether growing or not, and prohibits cultivating or trading it without narrow ministerial
      authority. Viable seeds and cuttings therefore remain controlled; the 2024 licence system
      that would govern cultivation and supply has not commenced.
    sources:
      - dda
      - cannabis_act
      - appointed_day
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited.
    sources:
      - dda
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. British travel advice says penalties
      for possessing or trafficking drugs are severe. It notes that tourists may come across
      drugs in pubs and bars, that police are vigilant, and that a visitor could face a
      substantial fine, deportation or imprisonment.
    sources:
      - cannabis_act
      - appointed_day
      - trib26
      - fcdo
