segments:
  possession:
    text: >-
      Under the cannabis reform package passed in 2024, possession of less than 30 g is no longer
      prosecuted: it carries a $250 fixed penalty that leaves no criminal record if paid on time.
      Larger amounts remain criminal. Implementation has been gradual as the new Cannabis Authority
      is set up.
    sources:
      - mm
      - ewn
  cultivation:
    text: >-
      Home growing for personal use is not permitted. Cultivation requires a licence from the
      Cannabis Authority.
    sources:
      - mm
      - gleaner
  enforcement:
    text: >-
      A fixed penalty for under 30 g; prosecution and possible prison for larger quantities and
      unlicensed dealing.
    sources:
      - mm
      - ewn
  sharing:
    text: Supply outside the licensed medical and religious channels remains an offence.
    sources:
      - mm
  consumption:
    text: >-
      Recreational use remains unlawful and is covered by the fixed penalty. Rastafari may use
      cannabis as a sacrament under a religious-use licence.
    sources:
      - gleaner
      - mm
  access:
    text: >-
      No adult-use sales. The law provides retail licences for medical, research and religious
      supply only.
    sources:
      - mm
      - ewn
context:
  production:
    text: >-
      The Cannabis Authority issues cultivation, manufacturing, retail, testing, research, transport
      and religious-use licences, with ownership rules favouring Bahamians.
    sources:
      - mm
      - gleaner
  products:
    text: Medical products through licensed retailers as the system comes online.
    sources:
      - mm
  medical:
    text: >-
      Legal under the 2024 law on a practitioner's prescription, through licensed outlets. In July
      2026 the Cannabis Authority had still not opened licence applications, so no licensed outlet
      was operating.
    sources:
      - ewn
      - mm
      - trib26
  consequences:
    text: The reform provides for expunging existing records for possession of small amounts.
    sources:
      - mm
