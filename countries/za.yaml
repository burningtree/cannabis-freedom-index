name: South Africa
region: Africa
iso_numeric: 710
recreational: legal
medical: limited
updated: '2026-10-27'
summary: >-
  A 2018 Constitutional Court ruling protects adult possession, use and cultivation in private, and
  the 2024 Cannabis for Private Purposes Act writes that into law. The Act is not yet in force:
  draft regulations published in February 2026 propose caps of 750 g and five plants. Buying and
  selling remain illegal.
scores:
  possession: 6
  cultivation: 6
  enforcement: 6
  sharing: 3
  consumption: 3
  access: 1
segments:
  possession:
    text: >-
      Adults may possess cannabis in private for their own use, with no gram limit: the
      [Constitutional Court's 2018 ruling](/history/south-africa-constitutional-court-2018/) reads
      that exception into the drugs law.[@prince] Outside that protection, possession is still a
      crime under the 1992 Drugs and Drug Trafficking Act, punishable by a fine, up to 15 years in
      prison, or both.[@dda] The [2024 Act](/history/south-africa-private-purposes-act-2024/) would
      also allow carrying cannabis in public, but it is not yet in force.[@act] Draft regulations
      gazetted in [February 2026](/history/south-africa-draft-regulations-2026/) propose a cap of
      750 g, at home or carried out of sight in public.[@bd]
    sources:
      - prince
      - dda
      - act
      - bd
    penalties:
      - label: Adult, in private, for own use
        treatment: legal
        note: No gram limit set; 750 g proposed in the 2026 draft regulations
      - label: Possession outside that protection, such as in public
        treatment: criminal
        term: Use or possession of an undesirable dependence-producing substance
        prison: 15 years
        note: Prison or a fine, or both; the fine has no set maximum
  cultivation:
    text: >-
      Adults may grow cannabis in a private place for their own consumption, with no licence,
      registration or plant limit.[@prince] Growing for anyone else counts as dealing, which carries
      up to 25 years in prison.[@dda] A Cape Town court ruled in
      [2022](/history/south-africa-haze-club-ruling-2022/) that the right cannot be handed to a grow
      club.[@dm22] The February 2026 draft regulations would cap growing at five plants per adult, of
      any size or strain; if adopted, this segment's score would fall.[@bd]
    sources:
      - prince
      - dda
      - dm22
      - bd
    penalties:
      - label: Adult, private place, for own consumption
        treatment: legal
        note: No plant limit set; five plants proposed in the 2026 draft regulations
      - label: Growing for others or for sale
        treatment: criminal
        term: Dealing (the law counts cultivation as dealing)
        prison: 25 years
        note: Prison must be imposed; a fine may be added
  enforcement:
    text: >-
      Private adult possession, use and cultivation are not punished.[@prince] Since
      [August 2023](/history/south-africa-police-arrest-directive-2023/) a directive of the national
      police commissioner has told officers not to arrest adults on a presumption of dealing,
      because no law fixes how much an adult may hold; in December 2024 the Human Rights Commission
      said it still received complaints of such arrests, particularly of Rastafari.[@sahrc24] Public
      possession and dealing remain crimes.[@dda] On
      [29 September 2022](/history/south-africa-child-cannabis-2022/) the Constitutional Court ruled
      that no child may be arrested, prosecuted or diverted for using or possessing cannabis; a child
      may be referred to civil processes, and dealing stays outside the order.[@zacc2022]
    sources:
      - prince
      - sahrc24
      - dda
      - zacc2022
  sharing:
    text: >-
      Any sale or supply of cannabis is dealing, punishable by up to 25 years in prison, and a court
      must impose prison.[@dda] Since [1997](/history/south-africa-minimum-sentences-1997/) dealing
      in drugs worth more than R50,000, or more than R10,000 by a syndicate, carries a minimum of 15
      years for a first offender.[@claa] The 2024 Act would let one adult give cannabis to another
      in private without payment and lower the maximum for dealing to ten years, but it has not come
      into force.[@act] The 2018 ruling protects only possession, use and growing for oneself.[@prince]
    sources:
      - dda
      - claa
      - act
      - prince
    penalties:
      - label: Dealing (selling, supplying or growing for others)
        treatment: criminal
        term: Dealing in an undesirable dependence-producing substance
        prison: 25 years
        note: Prison must be imposed; a fine may be added
      - label: Dealing in drugs worth more than R50,000
        treatment: criminal
        term: Dealing under the minimum-sentence law
        prison_min: 15 years
        prison: 25 years
        note: Also over R10,000 by a group or syndicate; 20 and 25 years minimum for later offences
  consumption:
    text: >-
      An adult may use cannabis in private.[@prince] Use elsewhere still falls under the drugs law's
      offence of using an undesirable substance.[@dda] The 2024 Act would turn public use, use in a
      vehicle on a public road and use in front of a child or a non-consenting adult into offences
      punished by a fine of up to R2,000, but it has not come into force.[@act]
    sources:
      - prince
      - dda
      - act
  access:
    text: >-
      There is no legal way to buy cannabis for adult use, and the 2024 Act would not create one.[@act]
      The health regulator has licensed no shop: retail outlets calling themselves dispensaries,
      sometimes displaying cultivation licences that do not cover sales, operate illegally.[@gray25,chats25]
      Private grow clubs remain open to prosecution.[@dm22] The only lawful route to THC is a
      doctor's application for an unregistered medicine.[@gray25]
    sources:
      - act
      - gray25
      - chats25
      - dm22
context:
  recreational:
    text: >-
      A South African adult can lawfully grow and smoke dagga at home but cannot lawfully buy it, so
      most cannabis is grown at home, shared, or bought from the illicit trade.[@prince,act] Recent
      (past three months) cannabis use among people aged 15 and over rose from 1.5% in 2002 to 7.8%
      in 2017, according to five national household surveys.[@mutai] Since 2018 the supply has
      shifted from the old outdoor dagga of Mpondoland in the Eastern Cape towards home grows and
      imported high-potency strains, and Mpondoland growers reported in 2024 that a 20-litre bucket
      had fallen to 500 rand.[@gu24] In towns, cannabis shops, smoking lounges and "private clubs"
      have spread; in Durban's Chatsworth in 2025 residents said they were opening in every area, and
      police said they would act against both sellers and buyers.[@chats25] Low-dose CBD is sold
      legally over the counter (see Hemp and CBD).[@sahpra_cbd]
    sources:
      - prince
      - act
      - mutai
      - gu24
      - chats25
      - sahpra_cbd
  medical:
    text: >-
      A patient who needs THC must find a doctor willing to apply to the
      [South African Health Products Regulatory Authority](https://www.sahpra.org.za/) for
      permission to prescribe an unregistered medicine for that named patient; by December 2025 no
      THC-containing medicine had been registered, and the regulator does not publish how many such
      permits it grants.[@gray25] CBD above the over-the-counter limits is a prescription-only
      medicine.[@sahpra_cbd] The regulator had issued a little over a hundred licences to grow and
      export cannabis for medical use by late 2025, but these cover raw material, not sales to
      patients.[@gray25] The 2024 Act would let a responsible adult give a child cannabis prescribed
      by a doctor, and it has not come into force.[@act]
    sources:
      - gray25
      - sahpra_cbd
      - act
  clubs:
    status: underground
    text: >-
      After the 2018 ruling allowed private growing, many grow clubs appeared: members supply seed,
      the club grows the plants and hands back the harvest, charging for the gardening and not for
      the cannabis.[@dm22] Police raided one, The Haze Club, in October 2020.[@dm22] In
      [August 2022](/history/south-africa-haze-club-ruling-2022/) the Western Cape High Court refused
      to declare the model lawful, holding that the right to grow for private use cannot be
      outsourced and that an unregulated club could in practice legalise dealing.[@dm22,sdl22] Until
      the law provides for them, clubs risk prosecution under the Drugs and Drug Trafficking
      Act.[@sdl22]
    sources:
      - dm22
      - sdl22
  planting:
    seeds: grey
    seeds_trade: unclear
    clones: grey
    clones_trade: unclear
    text: >-
      Nothing in the law names seeds or cuttings for private growers: the 2018 ruling protects an
      adult's own cultivation in private, and selling cannabis for adult use remains
      dealing.[@prince] The Cannabis for Private Purposes Act defines cannabis as the flowering or
      fruiting tops and leaves out the seed and the seedling, and would let an adult, without
      payment, give cannabis to or receive it from another adult in a private place; it has not
      come into force.[@act] For hemp, the agricultural framework in effect since 1 December 2025
      uses a 2% delta-9 THC crop limit and requires permits for cultivation and propagation
      material.[@hemp2025,hempregs2025]
    sources:
      - prince
      - act
      - hemp2025
      - hempregs2025
  hemp:
    status: high
    text: >-
      Hemp is a farm crop under the agriculture department, and since
      [1 December 2025](/history/south-africa-hemp-two-percent-2025/) a plant counts as hemp if its
      leaves and flowering heads hold no more than 2% delta-9 THC, up from 0.2%.[@hemp2025]
      Growing, breeding and selling propagation material need permits under the plant improvement
      rules.[@hempregs2025] By April 2025 the department had issued 1,400 hemp cultivation permits and
      registered 24 businesses to grow and sell hemp seed and seedlings.[@hempq25] Since
      [2019](/history/south-africa-cbd-over-the-counter-2019/) low-dose CBD can be sold without a
      prescription: a product with no more than 600 mg per pack and 20 mg a day, making only a
      low-risk health claim, is a complementary medicine.[@sahpra_cbd] Processed products with no
      more than 0.001% THC are also exempt from the medicine schedules.[@sahpra_cbd]
    sources:
      - hemp2025
      - hempregs2025
      - hempq25
      - sahpra_cbd
  production:
    status: medical
    text: >-
      Cannabis may be grown commercially only for medicine and export, under a licence from the
      health regulator; just over a hundred such licences had been issued by late 2025, and none
      allows sales to the public.[@gray25] Hemp under the 2% THC line is a separate agricultural crop
      with its own permits.[@hemp2025,hempregs2025] Commercial adult-use sales remain illegal, and
      the 2024 Act would not change that.[@act] The trade department planned a commercialisation
      policy for Cabinet by April 2026 and an overarching cannabis bill by mid-2027; none of this
      had been adopted.[@gray25] In September 2026 the small-business department
      [sought legal options for recognising indigenous growers](/history/south-africa-indigenous-growers-legal-options-2026/);
      its notice commissions policy work while existing licensing rules continue.[@growers2026]
    sources:
      - gray25
      - hemp2025
      - hempregs2025
      - act
      - growers2026
  black_market:
    text: >-
      Adult-use cannabis sales remain illegal, but the market has changed shape since the
      Constitutional Court allowed private growing in 2018.[@gu24] The traditional source,
      Mpondoland in the Eastern Cape, where villages have grown dagga for more than a century and
      police never managed to stop the trade, has been collapsing.[@gu19,gu24] Growers reported in
      2024 that a 20-litre bucket that once fetched 1,500 to 2,000 rand now sold for 500, and some
      burned harvest they could not sell.[@gu24] A researcher puts this down to the rise of home
      growing, to imported high-potency strains (the local landrace has 2.5 to 8% THC against 20 to
      28%), and to an often illicit but largely unpoliced city trade of businesses he calls a
      "cowboy" sector.[@gu24] In 2025 the health regulator warned that so-called dispensaries were
      displaying its licences, which do not authorise them to sell.[@chats25]
    sources:
      - gu24
      - gu19
      - chats25
  visitors:
    status: none
    text: >-
      Nobody can buy cannabis legally, visitor or resident.[@gray25] The 2018 ruling protects an
      adult's own possession, growing and use in a private place, and it does not separate residents
      from visitors.[@prince] The 2024 Act is not in force, and draft regulations published in
      February 2026 would cap possession at 750 g and growing at five plants.[@bd] A visitor
      therefore has no legal source, and use or possession in public can still be prosecuted under
      the drugs law.[@dda]
    sources:
      - gray25
      - prince
      - bd
      - dda
  driving:
    status: impairment
    text: >-
      There is no THC limit for drivers.[@sacq19] The road traffic law prohibits driving under the
      influence of alcohol or of a drug having a narcotic effect, so a prosecution depends on
      showing impairment.[@sacq19] A 2019 review in the South African Crime Quarterly found that
      testing drivers for substances other than alcohol is rarely done, and called for a statutory
      definition and detailed testing provisions.[@sacq19] The 2024 Act would add a fine of up to
      R2,000 for using cannabis in a vehicle on a public road, once it comes into force.[@act]
    sources:
      - sacq19
      - act
  arrests:
    text: >-
      No current national count of cannabis arrests was found.[@sahrc24] The last long series is
      historical: police reported [5,762 dagga arrests in 1932](/history/south-africa-dagga-arrests-count-1932/),
      23,289 at the 1955 peak and [over 30,000 a year](/history/south-africa-dagga-arrests-1968/) in
      1967 and 1968.[@historia] Since 23 August 2023 a police directive has told officers that adults
      may not be arrested on a presumption of selling.[@sahrc24] In December 2024 the Human Rights
      Commission said it was still receiving complaints of cannabis users being arrested, especially
      from the Rastafari community, and urged the government to bring the 2024 Act into
      force.[@sahrc24]
    sources:
      - sahrc24
      - historia
  consequences:
    text: >-
      A conviction for dagga stays on the criminal record, and many South Africans carry one from
      decades of mass arrests.[@historia] The 2024 Act would expunge convictions for using or
      possessing cannabis under the 1971 and 1992 drug laws and the laws of the former homelands,
      some automatically, but it has not come into force.[@act] Since the
      [2022 judgment](/history/south-africa-child-cannabis-2022/) a child's conviction for use or
      possession can be expunged on application.[@zacc2022] Workplace testing and dismissal for a
      positive test remain contested in the courts, and driving under the influence is an
      offence.[@adams,sacq19]
    sources:
      - historia
      - act
      - zacc2022
      - adams
      - sacq19
  culture:
    text: >-
      South Africa's word for cannabis, [dagga](/culture/language/dagga/), came from a Khoisan
      language of the Western Cape and had entered Cape Town speech
      [by 1658](/history/south-africa-dagga-word-record-1658/).[@duvall] Men across the region
      smoked it through horn water pipes and [earth pipes](/culture/traditions/the-earth-pipe/), with
      pastimes such as the [spit-bubble game](/culture/traditions/the-spit-bubble-game/) and the
      [smoker's cough](/culture/traditions/the-smokers-cough/).[@duvall] When the
      [1922 ban](/history/south-africa-national-ban-1922/) was debated, Natal officials said older
      men who smoked by custom should not be made criminals by a stroke of the pen, and the health
      department promised police discretion; the atlas tells this as the
      [elder's morning pipe](/culture/traditions/the-morning-pipe/).[@waetjen18] The ban fell
      hardest on Black and Coloured South Africans: in 1948 almost all possession convictions were of
      Africans and Coloured people.[@watt61] Gareth Prince, who had lost a
      [2002 case](/history/south-africa-prince-law-society-2002/) to be admitted as an attorney
      despite his Rastafarian use of cannabis, was the lead applicant, with Jeremy Acton of the
      [Dagga Party](/history/south-africa-dagga-party-2009/), in the
      [2018 ruling](/history/south-africa-constitutional-court-2018/).[@prince] Rastafari remain
      among those most often arrested, the Human Rights Commission said in 2024.[@sahrc24] Since
      2018 grow clubs modelled loosely on [cannabis social clubs](/culture/traditions/cannabis-social-clubs/)
      have spread, without legal footing.[@dm22]
    sources:
      - duvall
      - waetjen18
      - watt61
      - prince
      - sahrc24
      - dm22
  genetics:
    text: >-
      The local landrace of Mpondoland is low in THC, 2.5 to 8% by one researcher's account, and is
      losing ground to imported high-potency strains.[@gu24] A
      [September 2026 report](/history/south-africa-landrace-return-report-2026/) describes the
      African Cultural Heritage Trust, Druids Garden and farmer partners' plans to characterise
      landrace genetics and return verified cultivars through community nurseries.[@landrace2026]
      Druids Garden's chief executive said a seed bank collected in Southern Africa in 1948–1972 was
      donated in 2024.[@landrace2026] The broader research partnership dates to 2019; community
      nurseries, shared ownership and royalties are described as programme objectives.[@landrace2026]
    sources:
      - gu24
      - landrace2026
  spotlights:
    - title: Legal to grow, illegal to buy
      text: >-
        Since 2018 an adult may grow and smoke as much cannabis as they like at home, yet there is
        still no legal way to buy a seed, a clone or a gram.[@prince,act] Into that gap stepped
        grow clubs, which a court said in 2022 were still dealing, and shops calling themselves
        dispensaries, which the health regulator says it has never licensed.[@dm22,gray25] Police
        warn that they will act against buyers as well as sellers, so the customer of a shop that
        looks legal can still be charged.[@chats25]
      sources:
        - prince
        - act
        - dm22
        - gray25
        - chats25
