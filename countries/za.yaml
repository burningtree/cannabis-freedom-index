summary: >-
  A 2018 Constitutional Court ruling protects adult possession, use and cultivation in private, and
  the 2024 Cannabis for Private Purposes Act writes that into law. The Act is not yet in force:
  draft regulations published in February 2026 propose caps of 750 g and five plants. Buying and
  selling remain illegal.
