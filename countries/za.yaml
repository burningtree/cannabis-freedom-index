summary: >-
  A 2018 Constitutional Court ruling protects adult possession, use and cultivation in private, and
  the 2024 Cannabis for Private Purposes Act writes that into law. The Act is not yet in force:
  draft regulations published in February 2026 propose caps of 750 g and five plants. Buying and
  selling remain illegal.
scores:
  possession: 6
  cultivation: 6
  enforcement: 6
  sharing: 3
  consumption: 3
  access: 1
segments:
  possession:
    text: >-
      Adults 18+ may possess cannabis for private purposes, kept out of public view. The 2024 Act
      sets no gram limit itself and is not yet in force; draft regulations gazetted on 2 February
      2026 propose a cap of 750 g, at home or carried concealed in public. Until they are adopted,
      the right rests on the Constitutional Court's 2018 privacy ruling, with no fixed number.
    sources:
      - act
      - bd
  cultivation:
    text: >-
      Adults may grow cannabis in a private place for their own use, with no licence or
      registration. The February 2026 draft regulations would cap this at five plants per adult, of
      any size or strain. That cap is not yet law; if adopted, this segment's score would fall.
    sources:
      - act
      - bd
  enforcement:
    text: >-
      Private adult conduct is not punished. Dealing remains a criminal offence with prison terms,
      and smoking in public or around children is an offence. Children caught with cannabis are
      diverted rather than prosecuted.
    sources:
      - act
      - idpc
  sharing:
    text: >-
      Any exchange for payment or other reward is 'dealing' and remains a crime. Sharing between
      adults in private without payment is not clearly protected by the Act, leaving it a grey area.
    sources:
      - act
      - adams
  consumption:
    text: >-
      Legal in a private place only. Smoking or consuming in public is an offence, as is use in the
      presence of a child or of a non-consenting adult.
    sources:
      - act
  access:
    text: >-
      There is no legal way to buy cannabis for adult use — the Act deliberately excludes trade.
      Private 'grow clubs' and dispensaries operate in a legal grey zone and are periodically
      raided.
    sources:
      - adams
      - idpc
context:
  production:
    text: >-
      No commercial recreational licensing exists. The health regulator licenses cultivation of
      medical cannabis, largely for export, and hemp permits are issued separately. A commercial
      framework has been promised but not enacted.
    sources:
      - sahpra
      - adams
  products:
    text: >-
      Whatever you make at home for yourself is lawful; nothing may be sold. Low-dose CBD products
      are available over the counter; THC products are not legally sold outside the medical route.
    sources:
      - sahpra
      - act
  medical:
    text: >-
      Medical access is possible but narrow: a doctor must apply to the regulator for permission to
      prescribe an unregistered cannabis medicine for a named patient. The Act also provides for
      cannabis prescribed to a child.
    sources:
      - sahpra
      - act
  consequences:
    text: >-
      The Act provides for old convictions for possession or use to be expunged. Workplace testing
      and dismissal for a positive test remain contested in the courts, and driving under the
      influence is an offence.
    sources:
      - act
      - adams
  planting:
    seeds: legal
    seeds_trade: unclear
    clones: legal
    clones_trade: unclear
    text: >-
      The Cannabis for Private Purposes Act defines cannabis as the flowering or fruiting tops
      and expressly leaves out the seed and the seedling, and its definition of cultivating
      includes propagating a plant. Adults may give cannabis to, or receive it from, another
      adult only without payment; the Act sets no separate rule for selling seeds or cuttings.
    sources:
      - act
  clubs:
    status: underground
    text: >-
      After the 2018 ruling allowed private growing, many 'grow clubs' appeared: members
      supply seed, the club grows the plants and hands back the harvest, charging for the
      gardening and not for the cannabis. Police raided one, The Haze Club, in October 2020.
      In 2022 the Cape Town High Court refused to declare the model lawful, holding that the
      right to grow for private use cannot be outsourced and that an unregulated club could in
      practice legalise dealing. Until the law provides for them, clubs risk prosecution under
      the Drug Trafficking Act.
    sources:
      - sdl22
  black_market:
    text: >-
      Selling cannabis remains illegal, so everything bought is bought outside the law, but
      the market has changed shape since the Constitutional Court allowed private growing in
      2018. The traditional source, Mpondoland in the Eastern Cape, where villages have grown
      dagga for more than a century and police never managed to stop the trade, has been
      collapsing: growers reported in 2024 that a 20-litre bucket that once fetched 1,500 to
      2,000 rand now sold for 500, and some burned harvest they could not sell. A researcher
      puts this down to the rise of home growing, to imported high-potency strains (the local
      landrace has 2.5 to 8% THC against 20 to 28%), and to an often illicit but largely
      unpoliced city trade of businesses he calls a "cowboy" sector. The only legal route for
      a grower is a medical cultivation licence, which small farmers cannot afford.
    sources:
      - gu24
      - gu19
  driving:
    status: impairment
    text: >-
      There is no THC limit for drivers. The road traffic law prohibits driving under the
      influence of alcohol or of a drug having a narcotic effect, so a prosecution depends on
      showing impairment. A 2019 review in the South African Crime Quarterly found that
      testing drivers for substances other than alcohol is rarely done, and called for a
      statutory definition and detailed testing provisions.
    sources:
      - sacq19
  arrests:
    text: >-
      No national count of cannabis arrests was found. Since 23 August 2023 a directive of the
      national police commissioner has told officers that adults may not be arrested on a
      presumption of selling, because no law fixes the quantity an adult may hold or grow. In
      December 2024 the Human Rights Commission said it was still receiving complaints of
      cannabis users being arrested, especially from the Rastafari community, and urged the
      government to bring the 2024 Act into force.
    sources:
      - sahrc24
  visitors:
    status: none
    text: >-
      Nobody can buy cannabis legally: the 2024 Act deliberately leaves out trade. What it
      protects is an adult's own possession, growing and use in a private place, without
      distinguishing residents from visitors; draft regulations published in February 2026
      would cap possession at 750 g and growing at five plants. A visitor therefore has no
      legal source, and using cannabis in public remains an offence.
    sources:
      - adams
      - bd
