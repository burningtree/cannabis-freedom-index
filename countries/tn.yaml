name: Tunisia
region: Africa
iso_numeric: 788
recreational: illegal
medical: none
updated: 2026-10-13
summary: >-
  'Law 52' imposed a mandatory one-year sentence for use. Since 2017 judges have discretion, but
  thousands are still jailed.
scores:
