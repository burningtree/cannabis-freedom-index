segments:
  possession:
    text: >-
      Law 52 of 1992 imposed a mandatory minimum of one year in prison and a fine for possessing or
      using cannabis (zatla), with no room for mitigating circumstances. An April 2017 amendment
      gave judges discretion to go below that for first-time users. Prison remains the standard
      outcome for others.
    sources:
      - hrw
      - td
  cultivation:
    text: Cultivation is a serious crime.
    sources:
      - hrw
  enforcement:
    text: >-
      Drug cases, mostly cannabis use, have accounted for a large share of Tunisia's prison
      population, and the 2017 reform has not changed that.
    sources:
      - td
      - hrw
  sharing:
    text: Supply carries long sentences.
    sources:
      - hrw
  consumption:
    text: >-
      Use is a crime, typically proved by a urine test taken in custody. In 2021 a court in El Kef
      sentenced three young men to 30 years for smoking cannabis in a public stadium, triggering
      protests.
    sources:
      - mesh
      - hrw
  access:
    text: None.
    sources:
      - td
