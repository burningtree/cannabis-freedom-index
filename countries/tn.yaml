words:
  - word: zatla
    lang: Tunisian Arabic
    say: "zaṭla"
    meaning: cannabis, especially hashish; the everyday word
    atlas: zatla
    sources: [zatla_word]
  - word: takrouri
    lang: Arabic
    say: "takrūrī"
    meaning: the older name used in protectorate decrees
    atlas: zatla
