  medical:
    text: No medical cannabis.
    sources:
      - td
  consequences:
    text: A conviction is a criminal record that blocks public-sector jobs and travel.
    sources:
      - hrw
  planting:
    seeds: grey
    seeds_trade: unclear
    clones: illegal
    clones_trade: banned
    text: >-
      Law 92-52 covers the listed narcotic plants at any stage of their growth and bans
      growing, holding, buying or handing them over. The articles do not mention seeds.
      Landholders must destroy narcotic plants that come up on their own, or pay 50 dinars per
      plant.
    sources:
      - l52
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited.
    sources:
      - l52
      - hrw
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. Law 52 of 1992 sets a minimum of one
      year in prison and a fine for possessing or using cannabis; since 2017 judges may go below
      that for first-time users.
    sources:
      - hrw
      - td
  arrests:
    text: >-
      The interior ministry told a parliamentary committee in June 2026 that about 15,253
      drug cases of all kinds were recorded in 2025, involving about 27,338 people, nearly
      89% of them aged 19 to 40. The figures are not broken down by drug.
    sources:
      - tnum26
  black_market:
    text: >-
      Figures reported by the government to the UN drugs office record 1,815 kg of
      cannabis resin seized in 2024, against 1,003 kg in 2023. The UN publishes them as
      kilogram equivalents, and countries count seizures differently, so the figures are
      not comparable across borders.
    sources:
      - unodc_szr
