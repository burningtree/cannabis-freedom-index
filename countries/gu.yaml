name: Guam
region: Oceania
iso_numeric: 316
dependency:
  of: us
  kind: Unincorporated territory
  note: >-
    Guam is an unincorporated territory of the United States with its own legislature and laws.
    Federal drug law applies there as in the states.
recreational: legal
medical: limited
updated: '2026-10-28'
summary: >-
  Adults 21 and over may hold limited amounts, give cannabis away and grow six plants per residence,
  with no more than three flowering. Medical patients have a separate home-growing permit. Commercial
  supply has faced years of delays: the first grower's operating permit was approved in June 2026,
  with retail still pending.
scores:
  possession: 5
  cultivation: 4
  enforcement: 6
  sharing: 5
  consumption: 3
  access: 0
segments:
  possession:
    text: >-
      The 2019 Cannabis Industry Act allows adults 21 and over to hold one ounce of cannabis, eight
      grams of concentrate or infused products containing up to 800 mg THC.[@industry19,current] It
      also protects possession of cannabis produced by the permitted personal plants on the premises
      where it was grown.[@industry19] No current cannabis-specific penalty for possession above
      those limits was found: the 2019 Act declassified cannabis and repealed the old marijuana
      tiers, while the general controlled-substances provision is not a clean fit.[@ucsa]
    sources:
      - industry19
      - current
      - ucsa
    currency: USD
    penalties:
      - label: Within adult limits
        treatment: legal
        term: Adult possession
        note: One ounce of flower, eight grams of concentrate or 800 mg THC in infused products
  cultivation:
    text: >-
      Adults may grow no more than six plants per residence, including no more than three mature
      flowering plants.[@industry19] The growing area must be enclosed, locked and hidden from public
      view, on property the grower lawfully possesses or uses with consent.[@industry19,current] A
      separate medical permit scheme allows six flowering and twelve juvenile plants while no
      medical dispensary is operating.[@home18]
    sources:
      - industry19
      - current
      - home18
    currency: USD
    penalties:
      - label: Within the home-grow limits
        treatment: legal
        term: Home growing
        note: Six plants, no more than three flowering; enclosed, locked and not visible
      - label: Location or security breach within the plant allowance
        treatment: civil
        term: Home growing
        fine: 500
        note: Fine of up to $500
  enforcement:
    text: >-
      Personal activities within the adult-use limits are exempt from criminal and civil punishment
      under Guam law.[@industry19] Public consumption carries a fine of up to $100, and breaking the
      home-growing location or security rules while otherwise within the plant allowance carries up
      to $500.[@industry19,current] The law expressly preserves federal enforcement.[@industry19]
    sources:
      - industry19
      - current
  sharing:
    text: >-
      Adults may give cannabis to another person aged 21 or over without payment: up to one ounce of
      cannabis, eight grams of concentrate or infused products containing up to 800 mg
      THC.[@industry19,current] The law also expressly allows transfers of immature plants.[@industry19]
    sources:
      - industry19
      - current
  consumption:
    text: >-
      Private consumption is legal for adults 21 and over.[@industry19] Open public consumption is
      prohibited, with a fine of up to $100, unless permitted through Cannabis Control Board
      regulations.[@industry19,current] Employers and people controlling private property retain
      authority to restrict cannabis there.[@industry19]
    sources:
      - industry19
      - current
    currency: USD
    penalties:
      - label: Private adult consumption
        treatment: legal
        term: Consumption
      - label: Open public consumption
        treatment: civil
        term: Public consumption
        fine: 100
        note: Fine of up to $100
  access:
    text: >-
      The first cultivation operating permit went to Deep Green Guam on 24 June 2026, after February
      licence approval and inspections.[@june26] The tax department said further steps were required
      before production and sales.[@pit26] The commercial rules distinguish a licence from an
      operating permit; a temporary testing exemption allows qualifying licensed flower sales while
      no qualifying laboratory is available.[@rulesBody,waiver24,extension26]
    sources:
      - june26
      - pit26
      - rulesBody
      - waiver24
      - extension26
context:
  recreational:
    text: >-
      Adults 21 and over may hold one ounce of cannabis, eight grams of concentrate or infused
      products with up to 800 mg THC, give those amounts away without payment, and grow six plants per
      residence with no more than three flowering.[@industry19,current] Private consumption is legal;
      public consumption is fined up to $100.[@industry19] Personal activities within the limits are
      exempt from criminal and civil punishment under Guam law, which expressly preserves federal
      enforcement.[@industry19]
    sources:
      - industry19
      - current
  production:
    status: open
    text: >-
      The board approved a cultivation licence for Pacific Root LLC, trading as Pacific Cultivation,
      and conditional approval for Guam Real Deal LLC, trading as Deep Green Guam, in February
      2026.[@feb26] Deep Green Guam obtained the first operating permit in June, with further steps
      still needed before production and sales.[@june26,pit26]
    sources:
      - feb26
      - june26
      - pit26
  medical:
    text: >-
      Voters approved medical cannabis on 4 November 2014.[@medical14] Since October 2018, qualified
      patients or designated caregivers may apply for a $15 annual home-cultivation permit while no
      medical dispensary is operating, allowing six flowering and twelve juvenile plants.[@home18]
      December 2018 amendments expressly protected compliant growers from arrest, prosecution and
      property forfeiture.[@protection18] No dispensary was operating in 2023–24.[@current]
    sources:
      - medical14
      - home18
      - protection18
      - current
  hemp:
    status: none
    text: >-
      No operational hemp licensing regime. The cannabis definition has no hemp THC threshold, and
      low-THC hemp is dealt with through a final Guam Hemp Plan dated November 2023 that follows the
      federal 0.3 per cent line, but implementing rules were still draft in September
      2025.[@hempPlan] Shops sell hemp-derived THC products under federal law; federal changes in
      late 2026 are expected to remove most intoxicating hemp products from the federal hemp
      definition.[@hempFederal]
    sources:
      - hempPlan
      - hempFederal
  clubs:
    status: none
    text: >-
      No licensed cannabis clubs or on-site consumption lounges are known. The Act recognises
      cultivation, testing, manufacturing and retail establishments, and public consumption is
      fined.[@industry19,current] No tolerated club scene was found.[@industry19]
    sources:
      - industry19
      - current
  planting:
    seeds: legal
    seeds_trade: gift
    clones: legal
    clones_trade: gift
    text: >-
      Seeds are part of the legal cannabis definition, and adults may keep and sow them within the
      six-plant home grow.[@industry19] Immature plants may be gifted, and licensed growers may
      receive seeds or immature plants from adults.[@industry19,current] No retail seed or clone
      sales are licensed yet.[@rulesBody]
    sources:
      - industry19
      - current
      - rulesBody
  driving:
    status: impairment
    text: >-
      The Safe Streets Act prohibits driving while impaired by cannabis, with a first offence
      carrying 48 hours to one year in prison and a $1,000–5,000 fine, plus a six-month licence
      suspension.[@traffic16] There is no THC blood limit; the standard is impairment.[@traffic16]
      The DUI definition incorporates the controlled-substances chapter, from which cannabis was
      removed in 2019, so the cannabis route is legally awkward.[@ucsa,traffic16]
    sources:
      - traffic16
      - ucsa
  black_market:
    text: >-
      With no legal retail yet, all sale is illegal. Guam Customs seized 31.2 kg of marijuana and
      derivatives in 2023 and 136.1 kg in 2024 to 12 August, plus 4,000 marijuana cigarettes; FY2025
      figures fell to 1.7 lb in eight seizures, valued at $34,250.[@customs24] A 2002 DEA assessment
      priced local marijuana at $12,800 a pound, $800 an ounce and $20 a joint, with higher prices to
      Japanese tourists, and described imports from Palau, Hawaii and Micronesia.[@ndic03]
    sources:
      - customs24
      - ndic03
  arrests:
    text: >-
      Guam does not publish cannabis-only arrest counts. The 2024 statistical yearbook recorded 575
      drug or narcotic arrests in 2023, down from 788 in 2021.[@yearbook24] In 1999, 98 of 447 adult
      drug arrests were marijuana-related.[@ndic03] Customs reported 54 drug cases in 2024 to 12
      August, against 63 in 2023.[@customs24]
    sources:
      - yearbook24
      - ndic03
      - customs24
  consequences:
    text: >-
      Adult-use legalisation did not erase penalties already incurred or proceedings begun before
      the law took effect.[@industry19] Employers may maintain workplace restrictions, and people
      controlling private property may prohibit possession, use or growing there.[@industry19,employment24]
    sources:
      - industry19
      - employment24
  visitors:
    status: none
    text: >-
      The adult-use possession and unpaid-gifting rules apply to people aged 21 and over without a
      residency condition in those clauses.[@industry19] The verified June 2026 commercial milestone
      was a grower's operating permit, with further steps required before production and
      sales.[@june26,pit26]
    sources:
      - industry19
      - june26
      - pit26
