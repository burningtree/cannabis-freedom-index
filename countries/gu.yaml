name: Guam
region: Oceania
iso_numeric: 316
dependency:
  of: us
  kind: Unincorporated territory
  note: >-
    Guam is an unincorporated territory of the United States with its own legislature and laws.
    Federal drug law applies there as in the states.
recreational: legal
medical: limited
updated: '2026-10-22'
summary: >-
  Adults 21 and over may hold limited amounts, give cannabis away and grow six plants per residence,
  with no more than three flowering. Medical patients gained a separate home-growing permit route in
  2018. Commercial supply has faced years of delays: the first grower’s operating permit was
  approved in June 2026, with further steps still required before production and sales.
scores:
  possession: 5
  cultivation: 4
  enforcement: 6
  sharing: 5
  consumption: 3
  access: 0
segments:
  possession:
    text: >-
      The 2019 law allows adults 21 and over to hold one ounce of cannabis, eight grams of
      concentrate or infused products containing up to 800 mg THC. It also protects possession of
      cannabis produced by the permitted personal plants on the premises where it was grown.
    sources:
      - industry19
      - current
  cultivation:
    text: >-
      Adults may grow no more than six plants per residence, including no more than three mature
      flowering plants. The growing area must be enclosed, locked and hidden from public view, on
      property the grower lawfully possesses or uses with consent. A separate medical permit scheme
      allows six flowering and twelve juvenile plants while no medical dispensary is operating.
    sources:
      - industry19
      - home18
  enforcement:
    text: >-
      Personal activities within the adult-use limits are exempt from criminal and civil punishment
      under Guam law. Public consumption carries a fine of up to $100; breaking the home-growing
      location or security rules while otherwise within the plant allowance carries up to $500. The
      law expressly preserves federal enforcement.
    sources:
      - industry19
      - current
  sharing:
    text: >-
      Adults may give cannabis to another person aged 21 or over without payment: up to one ounce of
      cannabis, eight grams of concentrate or infused products containing up to 800 mg THC. The law
      also expressly allows transfers of immature plants.
    sources:
      - industry19
      - current
  consumption:
    text: >-
      Private consumption is legal for adults 21 and over. Open public consumption is prohibited,
      with a fine of up to $100, unless permitted through Cannabis Control Board regulations.
      Employers and people controlling private property retain authority to restrict cannabis there.
    sources:
      - industry19
      - current
  access:
    text: >-
      The first cultivation operating permit went to Deep Green Guam on 24 June 2026, after February
      licence approval and inspections. The tax department said further steps were required before
      production and sales. The commercial rules distinguish a licence from an operating permit; a
      temporary testing exemption allows qualifying licensed flower sales while no qualifying
      laboratory is available.
    sources:
      - june26
      - pit26
      - rulesBody
      - waiver24
      - extension26
context:
  production:
    status: open
    text: >-
      The board approved a cultivation licence for Pacific Root LLC, trading as Pacific Cultivation,
      and conditional approval for Guam Real Deal LLC, trading as Deep Green Guam, in February 2026.
      Deep Green Guam obtained the first operating permit in June, with further steps still needed
      before production and sales.
    sources:
      - feb26
      - june26
      - pit26
  products:
    text: >-
      Adult-use limits cover cannabis, concentrate and infused products containing up to 800 mg THC.
      The temporary testing exemption requires cannabis flower or buds to carry batch and harvest
      details, producer identification and an untested-contaminants warning, with cultivators’ sworn
      assurances about contaminants.
    sources:
      - industry19
      - waiver24
      - extension26
  medical:
    text: >-
      Voters approved medical cannabis on 4 November 2014. Since October 2018, qualified patients or
      designated caregivers may apply for a $15 annual home-cultivation permit while no medical
      dispensary is operating, allowing six flowering and twelve juvenile plants. December 2018
      amendments expressly protected compliant growers from arrest, prosecution and property
      forfeiture.
    sources:
      - medical14
      - home18
      - protection18
  consequences:
    text: >-
      Adult-use legalisation did not erase penalties already incurred or proceedings begun before
      the law took effect. Employers may maintain workplace cannabis restrictions, and people
      controlling private property may prohibit possession, use or growing there.
    sources:
      - industry19
  visitors:
    status: none
    text: >-
      The adult-use possession and unpaid-gifting rules apply to people aged 21 and over without a
      residency condition in those clauses. The verified June 2026 commercial milestone was a
      grower’s operating permit, with further steps required before production and sales.
    sources:
      - industry19
      - june26
      - pit26
