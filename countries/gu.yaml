name: Guam
region: Oceania
iso_numeric: 316
dependency:
  of: us
  kind: Unincorporated territory
  note: >-
    Guam is an unincorporated territory of the United States with its own legislature and laws.
    Federal drug law applies there as in the states.
recreational: legal
medical: limited
updated: 2026-10-17
summary: >-
  Adults 21 and over have been allowed since April 2019 to carry an ounce of cannabis, pass it to
  other adults and grow six plants at home. Seven years later no shop has opened: the first licensed
  business, a cultivator, received its permit to operate only in June 2026, and most people still
  rely on growing their own, for medical as well as recreational use.
scores:
  possession: 5
  cultivation: 4
  enforcement: 6
  sharing: 5
  consumption: 3
  access: 0
segments:
  possession:
    text: >-
      Under the Guam Cannabis Industries Act, signed on 4 April 2019 with immediate effect, adults 21
      and over may possess up to 1 oz of cannabis flower and up to 8 g of concentrate. Before that,
      possessing less than an ounce outside a school zone was a civil infraction with a $100 fine.
    sources:
      - norml
      - wiki
  cultivation:
    text: >-
      Adults may grow up to six plants, no more than three of them mature, in an enclosed, locked
      space.
    sources:
      - norml
  enforcement:
    text: >-
      Inside the limits nothing is punished. Public consumption remains a violation of the law.
    sources:
      - norml
  sharing:
    text: >-
      Adults may transfer up to 1 oz of flower or 8 g of concentrate to another adult, the same
      amounts they may possess.
    sources:
      - norml
  consumption:
    text: >-
      Use is legal in private; consuming cannabis in public is still a violation.
    sources:
      - norml
  access:
    text: >-
      There is still no legal place to buy cannabis. The Cannabis Control Board approved its first
      cultivation licences in February 2026 and issued its first permit to operate, to a grower, in
      June 2026; the tax department said further steps were needed before it could begin production
      and sales. No dispensary had been licensed, which reporters put down to regulatory delays and
      the lack of a licensed testing facility. Most people rely on home cultivation.
    sources:
      - isla26
      - isla26b
      - pit26
context:
  production:
    text: >-
      Commercial cultivation is only beginning: in February 2026 Pacific Cultivation received a
      cultivation licence and Deep Green Guam a conditional one, and in June Deep Green Guam received
      its permit to operate.
    sources:
      - isla26
      - isla26b
  products:
    text: >-
      No licensed products are on sale yet. Adults may hold flower and concentrate within the legal
      limits, from their own plants or gifts.
    sources:
      - norml
      - isla26
  medical:
    text: >-
      Voters approved medical cannabis for debilitating conditions in a November 2014 referendum,
      making Guam the first US territory to legalise it. In 2017 the governor vetoed a bill that would
      have let medical licence holders grow at home. No medical dispensary has been reported open.
    sources:
      - wiki
      - pit26
  consequences:
    text: >-
      The Act gave the Cannabis Control Board one year to adopt rules for licensed businesses; the
      process instead took years, and the first business permit came in June 2026.
    sources:
      - norml
      - isla26
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and no licensed premises for consumption exist.
    sources:
      - pit26
  visitors:
    status: none
    text: >-
      There is no legal place to buy cannabis for anyone, visitor or resident.
    sources:
      - isla26
