name: South Korea
region: Asia
iso_numeric: 410
recreational: illegal
medical: limited
updated: '2026-10-27'
summary: >-
  Up to five years for use, enforced even for use abroad by citizens. Sale carries at least a year,
  import or export life or at least five years, and profit-making or habitual import can bring
  death. A few cannabinoid medicines can be imported through a state agency.
scores:
  possession: 0
  cultivation: 0
  enforcement: 1
  sharing: 0
  consumption: 0
  access: 1
segments:
  possession:
    text: >-
      Simple possession, acquisition, transport or storage of cannabis carries up to five years in
      prison or a fine up to 50 million won.[@slg] Unauthorised import or export, including possession
      for that purpose, is a separate offence carrying life imprisonment or at least five years under
      Article 58(1)(5).[@nca2026] Customs controls also cover cannabis products such as vape
      cartridges and CBD oil.[@customs]
    sources:
      - slg
      - nca2026
      - customs
    currency: KRW
    penalties:
      - label: Possession, acquisition, transport or storage
        treatment: criminal
        term: Possession
        prison: 5 years
        fine: 50000000
        note: Simple possession; prison or a fine. Import/export is a separate offence
  cultivation:
    text: >-
      Cultivation falls under the same up-to-five-year provision, with heavier penalties when for
      sale.[@nca2026]
    sources:
      - nca2026
    currency: KRW
    penalties:
      - label: Personal cultivation
        treatment: criminal
        term: Cultivation
        prison: 5 years
        fine: 50000000
      - label: Cultivation for sale, export or manufacture
        treatment: criminal
        term: Commercial cultivation
        prison_min: 1 year
  enforcement:
    text: >-
      Strict and actively enforced, with customs screening, hair testing and prosecutions of
      celebrities making regular headlines.[@kt1] First offenders often receive suspended
      sentences.[@spo25]
    sources:
      - kt1
      - spo25
  sharing:
    text: Supplying or selling is punished more severely, with a minimum of one year.[@nca2026]
    sources:
      - nca2026
    penalties:
      - label: Sale, manufacture or brokerage
        treatment: criminal
        term: Trafficking
        prison_min: 1 year
        note: Habitual offenders face at least three years
      - label: Import or export
        treatment: criminal
        term: Import or export
        prison_min: 5 years
        note: Life imprisonment or at least five years
      - label: Profit-making or habitual import or export
        treatment: criminal
        term: Aggravated import
        death: true
        prison_min: 10 years
        note: Death or life imprisonment also available
      - label: Giving cannabis to a minor
        treatment: criminal
        term: Supply to a minor
        prison_min: 2 years
  consumption:
    text: >-
      Smoking or ingesting cannabis is itself an offence with up to five years. Korean criminal law
      follows citizens abroad: the government has repeatedly warned that Koreans who use cannabis in
      Canada, Thailand or US states where it is legal can be prosecuted on return, and hair tests
      can detect use months later.[@kt1,filter]
    sources:
      - kt1
      - filter
    currency: KRW
    penalties:
      - label: Smoking or ingesting cannabis
        treatment: criminal
        term: Personal use
        prison: 5 years
        fine: 50000000
  access:
    text: >-
      A patient may apply through the state orphan-drug centre to import a small number of
      foreign-approved cannabis medicines for self-treatment. The route requires medical records,
      a doctor's opinion and approval for each import.[@mfds]
    sources:
      - mfds
context:
  recreational:
    text: >-
      All recreational use is prohibited, including edibles and vapes from abroad. Possession
      brings up to five years, supply at least one year, and smoking or ingesting up to five
      years; citizens are prosecuted for use abroad, detected by hair tests months
      later.[@kt2,slg,kt1,filter]
    sources:
      - kt2
      - slg
      - kt1
      - filter
  death_penalty:
    text: >-
      Death is available only for profit-making or habitual import or export of cannabis under
      Article 58(2); ordinary possession, use, cultivation and sale are not capital.[@nca2026] The
      prosecutors' 2025 white paper records no life or death sentence in cannabis cases in
      2023–2025.[@spo25] No cannabis execution was found.[@spo25]
    sources:
      - nca2026
      - spo25
  research:
    status: licensed
    text: >-
      Licensed academic researchers may grow or import cannabis for research with MFDS approval and
      reporting.[@nca2026] Universities, KIST and the Andong zone do cannabis and CBD work, but no
      patient clinical trial was verified.[@nca2026]
    sources:
      - nca2026
  hemp:
    status: strict
    text: >-
      No national hemp THC threshold and no general hemp regime. Cannabis is controlled even when
      grown for fibre or seed; the 0.3% line exists only in the Andong regulation-free zone, which
      was extended to 2027.[@slg,asiae20,andong24] The Supreme Court held in May 2025 that CBD, CBN
      and THC are "cannabis" even when extracted from seeds, roots or mature stalks, so the seed and
      stalk exclusions do not create a consumer CBD route.[@scourt25]
    sources:
      - slg
      - asiae20
      - andong24
      - scourt25
  production:
    status: hemp
    text: >-
      Hemp is grown under permit for fibre and seed in designated areas, and the Andong
      regulation-free zone allows hemp below 0.3% THC for CBD extraction as a pharmaceutical raw
      material.[@slg,asiae20] No domestic medical-cannabis production is licensed; medicines are
      imported.[@mfds] A GMP CBD API plant broke ground in Andong in December 2025.[@gmp25]
    sources:
      - slg
      - asiae20
      - mfds
      - gmp25
  medical:
    text: >-
      South Korea allows imported cannabis medicines, not domestic production or general
      prescribing. The MFDS approves the patient and the import, and the Korea Orphan and Essential
      Drug Center supplies the medicine; Epidiolex, Sativex, Marinol, Canemes and Cesamet are
      formally available, but only Epidiolex was actually distributed in 2024.[@mfds,spo25] Since
      April 2021 Epidiolex has been reimbursed for Dravet and Lennox–Gastaut syndromes after five
      other epilepsy drugs fail.[@nhi21] About 300 prescriptions a month were reported in early 2026,
      and a plan to widen manufacturing was halted in October 2025.[@medical26,halt25]
    sources:
      - mfds
      - spo25
      - nhi21
      - medical26
      - halt25
  consequences:
    text: >-
      A drug conviction carries heavy social stigma and ends careers.[@slg] A foreigner sentenced
      to imprisonment faces deportation under the Immigration Act and a five-year entry ban; a fine
      may still lead to visa cancellation or departure.[@immigration]
    sources:
      - slg
      - immigration
  arrests:
    text: >-
      The prosecution service recorded 2,459 cannabis offenders in 2025, down 25.9% from 3,317 in
      2024 and 4,085 in 2023.[@spo25] The 2025 group included 1,016 users, 503 sellers, 335
      smugglers, 230 possessors and 77 cultivators; 1,955 cases and 237 people detained.[@spo25]
      All drug offenders numbered 23,403 in 2025, and smuggling offenders reached a record
      1,772.[@spo25]
    sources:
      - spo25
  planting:
    seeds: grey
    seeds_trade: unclear
    clones: illegal
    clones_trade: banned
    text: >-
      The Narcotics Control Act's definition of marijuana expressly excludes "the seeds and
      roots of the hemp plant", its mature stalks and products made from them. The hemp plant
      itself is marijuana, and only a licensed cultivator may grow it, for the purpose of
      collecting fibre or seed.[@nca]
    sources:
      - nca
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited.[@kt2,slg]
    sources:
      - kt2
      - slg
  visitors:
    status: none
    text: >-
      Bringing or mailing cannabis into South Korea without authorisation can be prosecuted as
      importation: Article 58(1)(5) provides life imprisonment or at least five years.[@nca2026]
      Customs prohibits cannabis, resin, cannabis vape cartridges and CBD oil; products legally bought
      abroad can be controlled at entry.[@customs] Simple domestic possession carries up to five years
      or a fine up to 50 million won.[@slg] Patients seeking approved cannabis medicines must use the
      separate medical-records and import-approval route.[@mfds] A foreigner sentenced to
      imprisonment faces deportation and a five-year entry ban.[@immigration]
    sources:
      - nca2026
      - customs
      - slg
      - mfds
      - immigration
  driving:
    status: impairment
    text: >-
      The Road Traffic Act punishes driving when normal driving is difficult because of drugs,
      which include narcotics, psychotropics and cannabis.[@fn26] Under amendments in force from
      April 2026 the maximum penalty rose from three years in prison or a 10 million won fine
      to five years or 20 million won, and from 2 April 2026 refusing a drug test became an offence
      punished at the same level.[@fn26] Police said a prescribed medicine does not by itself lead to punishment:
      the test is whether attention and motor skills are actually impaired.[@fn26] Officers may use
      saliva tests, behavioural checks and urine or blood tests.[@fn26]
    sources:
      - fn26
  black_market:
    text: >-
      The 2025 white paper records 128.6 kg of herbal cannabis, 5.6 kg of resin and 0.3 kg of
      seed seized, within a total of 1,156.4 kg of drugs of which 65.4% was imported.[@spo25]
      UNODC's government-reported series records 99 kg of herbal cannabis and 5.1 kg of resin in
      2024, against 114 kg and 3.2 kg in 2023; the two series use different coverage.[@unodc_szr]
      A September 2026 case involved 646 kg shipped from Thailand, the largest domestic-sale
      cannabis import on record.[@yakuza26]
    sources:
      - unodc_szr
      - spo25
      - yakuza26
