name: South Korea
region: Asia
iso_numeric: 410
recreational: illegal
medical: limited
updated: 2026-10-13
summary: >-
  Up to five years for use, enforced even for use abroad by citizens. A few cannabinoid medicines
  can be imported through a state agency.
scores:
  possession: 0
  cultivation: 0
  enforcement: 1
  sharing: 0
  consumption: 0
  access: 1
segments:
  possession:
    text: >-
      Under the Narcotics Control Act, possessing, acquiring, transporting or storing cannabis
      carries up to five years in prison or a fine of up to 50 million won. This includes edibles,
      vapes and gummies brought or mailed from abroad.
    sources:
      - kt2
      - slg
    currency: KRW
    penalties:
      - label: Possession, acquisition, transport or storage
        treatment: criminal
        prison: 5 years
        fine: 50000000
        note: Up to five years or up to 50 million won, including edibles and vapes from abroad
  cultivation:
    text: >-
      Cultivation falls under the same up-to-five-year provision, with heavier penalties when for
      sale.
    sources:
      - kt2
    currency: KRW
    penalties:
      - label: Cultivation
        treatment: criminal
        prison: 5 years
        fine: 50000000
        note: Same ceiling; heavier when for sale
  enforcement:
    text: >-
      Strict and actively enforced, with customs screening, hair testing and prosecutions of
      celebrities making regular headlines. First offenders often receive suspended sentences.
    sources:
      - kt1
      - slg
  sharing:
    text: Supplying or selling is punished more severely, with a minimum of one year.
    sources:
      - slg
    penalties:
      - label: Supply or sale
        treatment: criminal
        prison_min: 1 year
        note: Minimum one year; punished more severely than possession
  consumption:
    text: >-
      Smoking or ingesting cannabis is itself an offence with up to five years. Korean criminal law
      follows citizens abroad: the government has repeatedly warned that Koreans who use cannabis in
      Canada, Thailand or US states where it is legal can be prosecuted on return, and hair tests
      can detect use months later.
    sources:
      - kt1
      - filter
  access:
    text: >-
      A patient may apply through the state orphan-drug centre to import a small number of
      foreign-approved cannabis medicines for self-treatment. The route requires medical records,
      a doctor's opinion and approval for each import.
    sources:
      - mfds
context:
  recreational:
    text: >-
      All recreational use is prohibited, including edibles and vapes from abroad. Possession
      brings up to five years, supply at least one year, and smoking or ingesting up to five
      years; citizens are prosecuted for use abroad, detected by hair tests months
      later.[@kt2,slg,kt1,filter]
    sources:
      - kt2
      - slg
      - kt1
      - filter
  hemp:
    status: standard
    text: >-
      Hemp is grown under permit for fibre and seed in designated areas. Since July 2020 two
      districts of Andong form a regulation-free zone where hemp with less than 0.3% THC may be
      grown and CBD extracted as a pharmaceutical raw material.[@slg,asiae20]
    sources:
      - slg
      - asiae20
  production:
    status: medical
    text: >-
      Hemp is grown under permit for fibre and seed in designated areas. Since July 2020 two
      districts of Andong form a regulation-free zone where hemp with less than 0.3% THC may be
      grown and CBD extracted as a pharmaceutical raw material. No other production.
    sources:
      - slg
      - asiae20
  medical:
    text: >-
      In November 2018 South Korea became the first East Asian country to allow cannabis-based
      medicines, but only a handful of approved pharmaceuticals for conditions such as severe
      epilepsy, imported patient by patient through a state orphan-drug centre. No consumer
      products, CBD included, unless approved as a medicine.
    sources:
      - mfds
      - slg
      - filter
      - kt2
  consequences:
    text: >-
      A drug conviction carries heavy social stigma, ends careers, and leads to deportation for
      foreigners.
    sources:
      - slg
  arrests:
    text: >-
      The prosecution service recorded 27,611 people caught for drug offences of all kinds in
      2023, against 18,395 in 2022, the first time the figure passed 20,000; 1,477 were
      teenagers and 3,151 foreigners. The published report did not give a figure for cannabis.
      An older count put cannabis at about 1% of the 11,916 drug arrests of 2015.
    sources:
      - kt24
      - wiki
  planting:
    seeds: grey
    seeds_trade: open
    clones: illegal
    clones_trade: banned
    text: >-
      The Narcotics Control Act's definition of marijuana expressly excludes "the seeds and
      roots of the hemp plant", its mature stalks and products made from them. The hemp plant
      itself is marijuana, and only a licensed cultivator may grow it, for the purpose of
      collecting fibre or seed.
    sources:
      - nca
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited.
    sources:
      - kt2
      - slg
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. Under the Narcotics Control Act,
      possessing, acquiring, transporting or storing cannabis carries up to five years in prison
      or a fine of up to 50 million won, and this includes edibles, vapes and gummies brought or
      mailed from abroad.
    sources:
      - kt2
      - slg
  driving:
    status: impairment
    text: >-
      The Road Traffic Act punishes driving when normal driving is difficult because of drugs,
      which include narcotics, psychotropics and cannabis. Under amendments in force from
      April 2026 the maximum penalty rose from three years in prison or a 10 million won fine
      to five years or 20 million won, and refusing a drug test became an offence punished at
      the same level. Police said a prescribed medicine does not by itself lead to punishment:
      the test is whether attention and motor skills are actually impaired. Officers may use
      saliva tests, behavioural checks and urine or blood tests.
    sources:
      - fn26
  black_market:
    text: >-
      Figures reported by the government to the UN drugs office record 99 kg of herbal
      cannabis seized in 2024, against 114 kg in 2023, and 5.1 kg of cannabis resin seized
      in 2024, against 3.2 kg in 2023. The UN publishes them as kilogram equivalents, and
      countries count seizures differently, so the figures are not comparable across
      borders.
    sources:
      - unodc_szr
