name: Italy
region: Europe
iso_numeric: 380
recreational: decriminalised
medical: legal
updated: 2026-10-28
summary: >-
  Personal possession brings administrative sanctions such as licence suspension. Courts have
  tolerated minimal home growing. Medical cannabis is legal since 2013; a 2025 decree banned the
  hemp-flower trade.
scores:
  possession: 3
  cultivation: 2
  enforcement: 4
  sharing: 1
  consumption: 2
  access: 2
# The quick answers the scores would get wrong (src/lib/answers.js): possession and use are not
# crimes, and Article 75 punishes with suspended documents, not with a fine.
answers:
  carry:
    answer: limited
    text: Not a crime, but it can cost you your driving licence or passport for a few months
  caught:
    answer: limited
    label: Licence suspension
    text: Your driving licence, passport or firearms licence can be suspended for one to three months, or a first small case can end in a formal warning
segments:
  possession:
    text: >-
      Possession for personal use is not a crime but an administrative offence under Article 75 of
      the drug law. There is no fine; instead the prefect can suspend your driving licence, passport
      or firearms licence for one to three months for cannabis, or issue a formal warning for a
      first small case.[@dpnsee,giq] Quantity guidelines help distinguish personal use from dealing.[@dpnsee]
      [The 1993 referendum took personal possession out of criminal law.](/history/italy-referendum-1993/)
    sources:
      - dpnsee
      - giq
    penalties:
      - label: Personal-use possession (Article 75, administrative)
        treatment: civil
        term: Possession
        note: No fine; prefect can suspend documents for one to three months, or warn a first small case
  cultivation:
    text: >-
      Cultivation is a crime on paper, but in 2019 the Court of Cassation's united sections ruled
      that small-scale home growing with rudimentary means, a handful of plants and a modest yield
      for the grower's own use is not punishable.[@diritto,giq] There is no fixed plant number, so each case turns
      on the judge.[@diritto]
      [Home growing for personal use left the criminal offence in 2019.](/history/italy-home-growing-2019/)
    sources:
      - diritto
      - giq
    penalties:
      - label: Minimal domestic growing for own use (2019 ruling)
        treatment: civil
        term: Cultivation
        note: Excluded from the criminal offence; Article 75 administrative sanctions still apply
      - label: Cultivation as production, minor cannabis case
        treatment: criminal
        term: Cultivation
        prison_min: 6 months
        prison: 4 years
        note: Larger cases carry far more; minimal domestic growing excluded since 2019
  enforcement:
    text: >-
      Users face licence suspensions rather than prosecution.[@dpnsee,giq] Dealing is punished with prison — six
      months to four years for minor cases involving cannabis, far more for larger ones.[@dpnsee,giq]
      [The 1993 referendum took personal possession out of criminal law.](/history/italy-referendum-1993/)
    sources:
      - dpnsee
      - giq
  sharing:
    text: >-
      Handing cannabis to someone else is supply, a criminal offence, though minor cases are treated
      as a lesser crime.[@dpnsee] Group purchase for shared use has sometimes been treated as personal use by
      the courts.[@dpnsee]
    sources:
      - dpnsee
    penalties:
      - label: Dealing, minor cannabis case
        treatment: criminal
        term: Supply
        prison_min: 6 months
        prison: 4 years
        note: Minor cannabis cases; larger cases carry far more
  consumption:
    text: >-
      Use itself is not an offence, but being found with cannabis triggers the same administrative
      sanctions as possession.[@dpnsee,giq]
    sources:
      - dpnsee
      - giq
  access:
    text: >-
      No legal adult-use source. Until 2025 low-THC 'cannabis light' flower was sold in thousands of
      shops; a security decree in April 2025 banned processing, selling, transporting and
      delivering hemp flowers and products made from them, whatever their THC content.[@hemp,giq] Shops and
      farms closed and police seized stock across the country, but the ban has fared badly in
      court: of 25 concluded cases followed by a hemp trade observatory, 18 ended with the goods
      returned, 6 were dropped and 1 ended in acquittal, and three judges have referred the ban to
      the Constitutional Court.[@ilpost26]
      [The 2025 security decree banned hemp flowers.](/history/italy-hemp-flower-ban-2025/)
    sources:
      - hemp
      - giq
      - ilpost26
context:
  recreational:
    text: >-
      There is no legal recreational supply. Personal-use possession is administrative, not
      criminal: the prefect can suspend a driving licence, passport or firearms licence for
      one to three months, or warn a first small case — there is no fine.[@dpnsee,giq]
      Small home growing for own use is not punishable under the 2019 Cassation ruling, with
      no fixed plant number.[@diritto,giq] Dealing brings prison: six months to four years
      for minor cannabis cases.[@dpnsee,giq]
      [The 1993 referendum took personal possession out of criminal law.](/history/italy-referendum-1993/)
      [Home growing for personal use left the criminal offence in 2019.](/history/italy-home-growing-2019/)
    sources:
      - dpnsee
      - giq
      - diritto
  production:
    status: medical
    text: >-
      Medical cannabis is grown by the military pharmaceutical plant in Florence and imported under
      state control.[@giq] Hemp farming for fibre and seed remains legal; flower production does not.[@hemp]
      [The army's pharmaceutical plant started supplying medical cannabis in 2014.](/history/italy-army-cannabis-2014/)
    sources:
      - giq
      - hemp
  medical:
    text: >-
      Legal since 2013. Any doctor can prescribe cannabis prepared by pharmacies; reimbursement
      depends on the region, and supply shortages are frequent.[@giq]
      [Italy legalised medical cannabis in 2013.](/history/italy-medical-2013/)
      [The army's pharmaceutical plant started supplying medical cannabis in 2014.](/history/italy-army-cannabis-2014/)
    sources:
      - giq
  consequences:
    text: >-
      The sanction for users is itself a civil consequence: loss of a driving licence, passport or
      residence-permit eligibility for months.[@dpnsee,giq] A positive drug test can also end in a criminal
      drug-driving case, but not by itself: since the Constitutional Court's January 2026 ruling
      the substance must be found close to the time of driving in a kind and amount able to
      impair a driver (see Driving).[@cc10]
    sources:
      - dpnsee
      - giq
      - cc10
  planting:
    seeds: grey
    seeds_trade: open
    clones: grey
    clones_trade: unclear
    text: >-
      The Court of Cassation's united sections held in 2012 that merely offering cannabis
      seeds for sale is not prohibited: it is an unpunishable preparatory act, since the
      buyer's use of the seed cannot be known.[@su2012] Selling seeds together with growing
      instructions may still be prosecuted as incitement.[@su2012] Grown plants fall under the cultivation
      rules above.[@diritto,giq]
      [Offering seeds for sale is not punishable since 2012.](/history/italy-seeds-ruling-2012/)
    sources:
      - su2012
      - diritto
      - giq
  driving:
    status: impairment
    text: >-
      A 2024 reform renamed the offence from driving in a state of alteration to driving after
      taking drugs, which was widely read as making a positive test enough.[@cc10] The Constitutional
      Court upheld the new wording in January 2026 only on a narrow reading: the mere fact
      that use came before driving is not enough.[@cc10] The offence covers driving within a period
      in which the substance can reasonably be presumed still able to alter the driver's
      condition and create a danger to road safety well above that of ordinary driving.[@cc10]
      Ordinarily that means finding in the driver's body fluids, close to the time of driving,
      a substance in a kind and amount generally capable of impairing an average user.[@cc10] There
      is no fixed THC limit.[@cc10]
    sources:
      - cc10
  hemp:
    status: strict
    text: >-
      Hemp farming for fibre and seed stays legal, but the 2025 decree criminalised
      low-THC hemp flowers and flower-derived products whatever their THC content,
      shuttering the cannabis-light shops; of 25 court cases tracked by the hemp trade,
      18 ended with the goods returned.[@hemp] Flower production is not licensed — only
      the military pharmaceutical plant grows medical cannabis under state
      control.[@hemp]
    sources:
      - hemp
  arrests:
    text: >-
      The EU drugs agency's statistical bulletin records 37,963 cannabis-related drug law
      offences in Italy in 2024, against 38,349 in 2023.[@euda_dlo] Of the 2024 total, 27,503 were for
      use or possession for use.[@euda_dlo] The number was above 50,000 in 2017 and 2018.[@euda_dlo] Countries count
      these differently (offences or offenders, criminal or administrative), so the figure is
      not comparable across borders.[@euda_dlo]
    sources:
      - euda_dlo
  clubs:
    status: underground
    text: >-
      Italian law leaves no room for the Spanish model, yet a few clubs exist.[@pardal20] A Europe-wide
      survey carried out in 2018 and 2019 received answers from two clubs in Italy.[@pardal20] Lawyers
      for an initiative in Pisa explained in 2015 that the grey zone Spanish clubs rely on
      does not exist in Italy, where possession for personal use is itself an administrative
      offence punished by suspension of a driving licence or passport.[@vice15] The best-known groups
      using the name are patient associations that inform and lobby rather than grow: the
      Cannabis Social Club in Bolzano, with 1,272 registered members in 2023, advises patients
      on prescriptions for medical cannabis.[@cscbz]
      [Patients with multiple sclerosis founded a cannabis club in Puglia in 2013.](/history/italy-racale-patient-club-2013/)
      [The Court of Cassation ordered a retrial for a Rastafarian in 2008.](/history/italy-rastafari-ruling-2008/)
    sources:
      - pardal20
      - vice15
      - cscbz
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. Possession for personal use is an
      administrative offence under Article 75 of the drug law: there is no fine, but the prefect
      can suspend a driving licence, passport or firearms licence for one to three months.[@dpnsee,giq]
      [The 1993 referendum took personal possession out of criminal law.](/history/italy-referendum-1993/)
    sources:
      - dpnsee
      - giq
  black_market:
    text: >-
      The EU drugs agency's statistical bulletin records 28,752 kg of herbal cannabis and
      17,333 kg of cannabis resin seized in Italy in 2024, against 40,225 kg and 27,075 kg
      in 2023.[@euda_szr] Herbal cannabis was seized on 4,876 occasions and resin on 10,900.[@euda_szr] Plant seizures came to 154,819 plants.[@euda_szr] Countries record seizures differently, so the
      figures are not comparable across borders.[@euda_szr]
    sources:
      - euda_szr
  culture:
    text: >-
      Hemp built inland villages. In [Carmagnola and Castelponzone](/culture/traditions/italian-hemp-rope-makers/),
      museums preserve the tools, rope-walks and vocabulary of the cordai who turned hemp fibre
      into rope.[@ropemakers] The craft faded through competition from sisal and other fibres, not
      prohibition alone; growers later rebuilt hemp as an industry, with Assocanapa founded in 1998
      and a 2016 hemp law.[@ropemakers]
      [Growers founded Assocanapa to revive industrial hemp in 1998.](/history/italy-assocanapa-founded-1998/)
      Lucia Spiri and Andrea Trisciuoglio founded [LaPianTiamo](/culture/traditions/cannabis-social-clubs/) in Racale in January 2013 for collective cultivation for patients facing delays and costs.[@clubs] Courts have weighed sacramental use: the Cassation sent a Rastafarian's dealing conviction back for retrial in 2008, faulting courts that relied on weight alone — see the [Rastafari sacrament](/culture/traditions/rastafari-sacrament/).[@rasta]
    sources:
      - ropemakers
      - clubs
      - rasta
