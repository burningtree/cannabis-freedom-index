summary: >-
  Personal possession brings administrative sanctions such as licence suspension. Courts have
  tolerated minimal home growing. Medical cannabis is legal since 2013; a 2025 decree banned the
  hemp-flower trade.
scores:
  possession: 3
  cultivation: 2
  enforcement: 4
  sharing: 1
  consumption: 2
  access: 2
segments:
  possession:
    text: >-
      Possession for personal use is not a crime but an administrative offence under Article 75 of
      the drug law. There is no fine; instead the prefect can suspend your driving licence, passport
      or firearms licence for one to three months for cannabis, or issue a formal warning for a
      first small case. Quantity guidelines help distinguish personal use from dealing.
    sources:
      - dpnsee
      - giq
  cultivation:
    text: >-
      Cultivation is a crime on paper, but in 2019 the Court of Cassation's united sections ruled
      that small-scale home growing with rudimentary means, a handful of plants and a modest yield
      for the grower's own use is not punishable. There is no fixed plant number, so each case turns
      on the judge.
    sources:
      - diritto
      - giq
  enforcement:
    text: >-
      Users face licence suspensions rather than prosecution. Dealing is punished with prison — six
      months to four years for minor cases involving cannabis, far more for larger ones.
    sources:
      - dpnsee
      - giq
  sharing:
    text: >-
      Handing cannabis to someone else is supply, a criminal offence, though minor cases are treated
      as a lesser crime. Group purchase for shared use has sometimes been treated as personal use by
      the courts.
    sources:
      - dpnsee
  consumption:
    text: >-
      Use itself is not an offence, but being found with cannabis triggers the same administrative
      sanctions as possession.
    sources:
      - dpnsee
      - giq
  access:
    text: >-
      No legal adult-use source. Until 2025 low-THC 'cannabis light' flower was sold in thousands of
      shops; a security decree in April 2025 banned processing, selling, transporting and
      delivering hemp flowers and products made from them, whatever their THC content. Shops and
      farms closed and police seized stock across the country, but the ban has fared badly in
      court: of 25 concluded cases followed by a hemp trade observatory, 18 ended with the goods
      returned, 6 were dropped and 1 ended in acquittal, and three judges have referred the ban to
      the Constitutional Court.
    sources:
      - hemp
      - giq
      - ilpost26
context:
  production:
    text: >-
      Medical cannabis is grown by the military pharmaceutical plant in Florence and imported under
      state control. Hemp farming for fibre and seed remains legal; flower production does not.
    sources:
      - giq
      - hemp
  products:
    text: >-
      Prescription medical flower and oils only. Hemp flower and flower-derived products were banned
      in 2025.
    sources:
      - hemp
      - giq
  medical:
    text: >-
      Legal since 2013. Any doctor can prescribe cannabis prepared by pharmacies; reimbursement
      depends on the region, and supply shortages are frequent.
    sources:
      - giq
  consequences:
    text: >-
      The sanction for users is itself a civil consequence: loss of a driving licence, passport or
      residence-permit eligibility for months. Drug-driving rules were tightened in 2024 so that a
      positive test is enough, without proof of impairment.
    sources:
      - dpnsee
      - giq
  planting:
    seeds: grey
    seeds_trade: open
    clones: grey
    clones_trade: unclear
    text: >-
      The Court of Cassation's united sections held in 2012 that merely offering cannabis
      seeds for sale is not prohibited: it is an unpunishable preparatory act, since the
      buyer's use of the seed cannot be known. Selling seeds together with growing
      instructions may still be prosecuted as incitement. Plants fall under the cultivation
      rules.
    sources:
      - su2012
  driving:
    status: impairment
    text: >-
      A 2024 reform renamed the offence from driving in a state of alteration to driving after
      taking drugs, which was widely read as making a positive test enough. The Constitutional
      Court upheld the new wording in January 2026 only on a narrow reading: the mere fact
      that use came before driving is not enough. The offence covers driving within a period
      in which the substance can reasonably be presumed still able to alter the driver's
      condition and create a danger to road safety well above that of ordinary driving.
      Ordinarily that means finding in the driver's body fluids, close to the time of driving,
      a substance in a kind and amount generally capable of impairing an average user. There
      is no fixed THC limit.
    sources:
      - cc10
  arrests:
    text: >-
      The EU drugs agency's statistical bulletin records 37,963 cannabis-related drug law
      offences in Italy in 2024, against 38,349 in 2023. Of the 2024 total, 27,503 were for
      use or possession for use. The number was above 50,000 in 2017 and 2018. Countries count
      these differently (offences or offenders, criminal or administrative), so the figure is
      not comparable across borders.
    sources:
      - euda_dlo
  clubs:
    status: underground
    text: >-
      Italian law leaves no room for the Spanish model, yet a few clubs exist. A Europe-wide
      survey carried out in 2018 and 2019 received answers from two clubs in Italy. Lawyers
      for an initiative in Pisa explained in 2015 that the grey zone Spanish clubs rely on
      does not exist in Italy, where possession for personal use is itself an administrative
      offence punished by suspension of a driving licence or passport. The best-known groups
      using the name are patient associations that inform and lobby rather than grow: the
      Cannabis Social Club in Bolzano, with 1,272 registered members in 2023, advises patients
      on prescriptions for medical cannabis.
    sources:
      - pardal20
      - vice15
      - cscbz
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. British travel advice says illegal
      drugs, including cannabis, carry severe penalties and tells travellers to expect a long
      jail sentence and heavy fines for possessing, using or smuggling them, also when only
      changing planes. Airport scanners are also used on the baggage of passengers in transit.
    sources:
      - hemp
      - giq
      - fcdo
