name: Czechia
region: Europe
iso_numeric: 203
recreational: legal
medical: legal
updated: 2026-10-27
summary: >-
  Since 1 January 2026 adults aged 21+ may grow three plants and keep 100 g of cannabis at home or
  25 g elsewhere. Recreational sales remain illegal. Pharmacies dispense medical cannabis on
  electronic prescription, with insurance covering 90% of the cost up to 30 g a month.
scores:
  possession: 6
  cultivation: 4
  enforcement: 6
  sharing: 1
  consumption: 5
  access: 1
segments:
  possession:
    text: >-
      Adults aged 21+ may keep up to 100 g of cannabis in their own dwelling and up to 25 g
      elsewhere.[@z167] More than 100 g and up to 200 g at home, or more than 25 g and up to 50 g
      elsewhere, is an administrative offence.[@z167] Above 200 g at home or 50 g elsewhere,
      possession for personal use is a crime.[@z40]
    sources:
      - z167
      - z40
    currency: CZK
    penalties:
      - upto: 25 g
        treatment: legal
        note: Amounts outside the home; at home every limit is four times higher (100 g, 200 g, 2 kg, 20 kg)
      - over: 25 g
        upto: 50 g
        treatment: civil
        term: Administrative offence (přestupek)
        fine: 50000
      - over: 50 g
        upto: 500 g
        treatment: criminal
        term: Crime (trestný čin)
        prison: 6 months
      - over: 500 g
        upto: 5 kg
        treatment: criminal
        term: Crime (trestný čin)
        prison: 3 years
      - over: 5 kg
        treatment: criminal
        term: Crime (trestný čin)
        prison_min: 6 months
        prison: 5 years
  cultivation:
    text: >-
      Adults aged 21+ may grow, harvest and process up to three cannabis plants for themselves on
      property they own or otherwise have a legal right to use.[@z167] Four or five plants is an
      administrative offence; more than five is a crime.[@z167, z40]
    sources:
      - z167
      - z40
    currency: CZK
    penalties:
      - upto: 3 plants
        treatment: legal
        note: Adults aged 21 and over, on property they may use
      - over: 3 plants
        upto: 5 plants
        treatment: civil
        term: Administrative offence (přestupek)
        fine: 50000
      - over: 5 plants
        upto: 50 plants
        treatment: criminal
        term: Crime (trestný čin)
        prison: 6 months
      - over: 50 plants
        upto: 500 plants
        treatment: criminal
        term: Crime (trestný čin)
        prison: 3 years
      - over: 500 plants
        treatment: criminal
        term: Crime (trestný čin)
        prison_min: 6 months
        prison: 5 years
  enforcement:
    text: >-
      Possession and growing within the age and quantity limits are lawful; the next band above
      those limits brings an administrative penalty of up to CZK50,000.[@z167] Crossing the criminal
      threshold for personal possession or growing carries up to six months in prison in the basic
      case, with higher sentences for larger quantities.[@z40]
    sources:
      - z167
      - z40
  sharing:
    text: >-
      Selling cannabis or giving it to someone else remains a crime, including a gift between
      friends.[@z40] The basic supply offence carries up to one year in prison, with higher
      sentences for aggravated cases.[@z40]
    sources:
      - z40
  consumption:
    text: >-
      Adults aged 21+ may possess cannabis for their own use within the legal limits.[@z167] Smoking
      bans still apply in public transport, schools, playgrounds and indoor restaurant areas, among
      other places.[@smoking]
    sources:
      - z167
      - smoking
  access:
    text: >-
      Adults can grow their own cannabis within the three-plant limit.[@z167] Selling it or giving
      it to others remains a criminal offence, so recreational shops and supply clubs have no
      authorised route to distribute it.[@z40] Pharmacies dispense prescribed medical cannabis as
      flower or extracts.[@sukl]
    sources:
      - z167
      - z40
      - sukl
context:
  recreational:
    text: >-
      There is still nowhere to buy cannabis legally, so adults who use it either grow their own,
      up to three plants, or buy from dealers.[@z167,z40] The national monitoring centre reports
      that home growing covers personal and community demand, and that dealers increasingly sell
      through social networks, darknet markets and couriers.[@nms25] Herbal cannabis seized by
      police in 2024 averaged 11% THC.[@nms25] Home growers may dry their harvest and make
      ointments, but concentrating cannabinoids by chemical extraction is still treated as illegal
      manufacture.[@advd] Giving any of it to a friend is a crime.[@z40]
    sources:
      - z167
      - z40
      - nms25
      - advd
  medical:
    text: >-
      Patients receive medical flower or extracts on an electronic prescription, dispensed through
      pharmacies.[@sukl] Approved prescribers include general practitioners as well as the listed
      specialists; [since April 2025](/history/czechia-general-practitioners-2025/) GPs may prescribe for long-term pain that nothing else relieves,
      and by early 2026 more than 800 doctors were prescribing, over 250 of them GPs.[@sukl,ct26]
      Pharmacies dispensed a record amount in 2025, almost half as much again as in 2024.[@ct26]
      Public health insurance [covers 90%](/history/czechia-medical-insurance-2020/) of the cost of up to 30 g a month; reimbursement above
      that quantity needs the insurer's approval.[@sukl] The [State Institute for Drug
      Control](https://sukl.gov.cz/) licenses growers and publishes the list of prescribers.[@z167,ct26]
    sources:
      - sukl
      - ct26
      - z167
  hemp:
    status: high
    text: >-
      [Since 2022](/history/czechia-hemp-one-percent-2022/) the law counts as technical hemp any plant from which no more than 1% THC can be
      obtained, or one grown from an EU-listed variety; it is not treated as cannabis, and the 1%
      line also runs through the criminal and administrative rules.[@z167,z40] Farmers growing more
      than 100 m² must report it.[@z167] Hemp is a small crop, about 140 hectares in 2024.[@fao]
      CBD products are sold openly.[@tight26] HHC, a semi-synthetic cannabinoid that had been sold
      in shops to anyone, minors included, was [moved onto the list of banned addictive substances](/history/czechia-hhc-banned-2026/) by the government on 16 March
      2026, so holding it is now a crime.[@ct23,hhc26] In June 2026 the new government [announced plans](/history/czechia-tightening-plan-2026/)
      to cut the hemp limit to 0.3% and ban CBD products; none of this had been adopted.[@tight26]
    sources:
      - z167
      - z40
      - fao
      - ct23
      - hhc26
      - tight26
  production:
    status: medical
    text: >-
      There is no legal commercial market for recreational cannabis: growing for others and
      selling are crimes.[@z40] Medical cannabis may be grown only under a [five-year
      licence](/history/czechia-medical-cultivation-opened-2022/) from
      the State Institute for Drug Control, granted after it has inspected the growing site.[@z167]
      Hemp farming and the CBD trade are legal businesses within the 1% THC limit.[@z167] Since
      November 2025 licensed businesses may also sell kratom under the new law on
      psychomodulatory substances; cannabis is not on that list.[@pm25,hhc26]
    sources:
      - z40
      - z167
      - pm25
      - hhc26
  culture:
    text: >-
      Czech cannabis culture is above all a culture of growing at home. Long before the 2026 law,
      the national monitoring centre found that home growers covered much of what people used,
      sharing with friends and their community.[@nms25] Use is common: UNODC puts past-year use at
      9.4% of people aged 15 to 64 in 2023.[@unodc] Medicine is a thread running through it: the
      psychotherapist Dušan Dvořák and his association Konopí je lék ('cannabis is medicine')
      openly grew and handed out cannabis for patients for decades, until a three-year prison sentence in 2019 made him a cause célèbre.[@rp19]
      The chemist [Lumír Hanuš](/culture/people/lumir-hanus/) became one of the best-known voices
      for medical cannabis, and the drug coordinator [Jindřich Vobořil](/culture/people/jindrich-voboril/) of
      the push to regulate it.[@hanus,ct23] Every year Prague's exhibition grounds host Cannafest,
      a cannabis trade fair billed as one of the largest in the world.[@e15cf]
    sources:
      - nms25
      - unodc
      - rp19
      - hanus
      - ct23
      - e15cf
  research:
    status: licensed
    text: >-
      Czech cannabis science goes back to Palacký University in Olomouc, where Zdeněk Krejčí's
      department reported antibacterial effects of cannabis in 1955, and where the chemist
      [Lumír Hanuš](/culture/people/lumir-hanus/) grew and analysed cannabis from the 1970s.[@hanus]
      In Jerusalem in 1992 he was first author of the paper describing [anandamide](/history/anandamide-discovered-1992/), the first
      cannabinoid found in the human brain.[@science92] Czech researchers publish around fifty
      papers on cannabis a year, 57 in 2025, and 14 clinical trials with a cannabis treatment had
      been registered in the country by October 2026.[@openalex,ctgov] The government's [National
      Monitoring Centre for Drugs and Addiction](https://www.drogy-info.cz/) reports every year on
      use, seizures, potency and the drug market.[@nms25]
    sources:
      - hanus
      - science92
      - openalex
      - ctgov
      - nms25
  spotlights:
    - title: Grow it, but don't share it
      text: >-
        [Since 2026](/history/czechia-home-grow-2026/) an adult may grow three plants and keep 100 g at home, but may not give a single
        joint to anyone else: any supply, even a gift between friends, is a crime with up to a year
        in prison.[@z167,z40] A legal commentary warns that friends who grow together and divide the
        harvest are taking part in that crime.[@advd] The law therefore protects the lone home
        grower, and leaves anyone who cannot grow, or does not want to, with dealers.[@z40]
      sources:
        - z167
        - z40
        - advd
    - title: Twenty-one, not eighteen
      text: >-
        The permission to possess and grow starts at 21, not at 18, the age of adulthood. Anyone
        under 21 who keeps up to 200 g at home or 50 g elsewhere, or grows up to five plants,
        commits an administrative offence with a fine of up to CZK 50,000; above that the criminal
        rules apply as for everyone.[@z167,z40]
      sources:
        - z167
        - z40
    - title: A legal market for kratom first
      text: >-
        The 2024 reform created a new class of 'psychomodulatory' substances, which licensed
        businesses may sell to adults under state rules instead of banning them.[@pm25] The first
        government list, in force since November 2025, holds only kratom and kratom extract;
        substances with unknown effects go on a second list to be studied for up to two years.[@pm25,hhc26]
        HHC went the other way, onto the banned list, in March 2026.[@hhc26] The scheme came from
        the former drug policy coordinator [Jindřich Vobořil](/culture/people/jindrich-voboril/),
        who had proposed it for CBD and HHC as well as kratom.[@ct23] The new government has
        announced it wants kratom off sale altogether.[@tight26]
      sources:
        - pm25
        - hhc26
        - ct23
        - tight26
  consequences:
    text: >-
      People aged 18–20 remain outside the personal possession and growing permission, which starts
      at 21.[@z167] Driving has a separate rule: reaching 2 ng/ml of delta-9-THC in blood makes a
      driver legally affected, even when their possession of cannabis is lawful.[@police_thc]
    sources:
      - z167
      - police_thc
  planting:
    seeds: legal
    seeds_trade: open
    clones: legal
    clones_trade: unclear
    text: >-
      The Addictive Substances Act defines cannabis as the flowering or fruiting top, or an
      above-ground part containing the top.[@z167] Seeds and young plants without those tops fall
      outside that definition.[@z167] Growing cannabis is separately regulated: adults aged 21+ may
      grow up to three plants for their own use.[@z167]
    sources:
      - z167
  driving:
    status: limit
    text: >-
      At 2 ng/ml of delta-9-THC in blood, a driver is legally affected under Regulation
      41/2014.[@police_thc] The Supreme Court's separate threshold of 10 ng/ml in blood serum
      supports a finding of unfitness to drive for the criminal offence.[@ns20] Administrative
      driving under the influence carries a CZK7,000–25,000 fine, six points and a
      six-to-eighteen-month driving ban.[@besip_penalties] Refusing testing carries
      CZK25,000–75,000, six points and an eighteen-to-thirty-six-month ban.[@besip_penalties]
    sources:
      - police_thc
      - ns20
      - besip_penalties
  black_market:
    text: >-
      In 2024 police found 109 indoor growing sites, down from 138 in 2023, mostly with at most 50
      plants.[@nms25] Home growing supplied personal and community demand; organised groups bought
      some surpluses for export, mainly to Slovakia and Austria.[@nms25] Criminal-case seizures
      totalled 609 kg of dried cannabis and 7,100 plants; average herbal cannabis potency was 11%
      THC.[@nms25] The monitoring centre also reports drug sales through social networks, darknet
      markets and couriers.[@nms25]
    sources:
      - nms25
  arrests:
    text: >-
      These figures cover 2024, before the 2026 personal-use reform.[@nms25, z167] Police recorded about 4,200
      primary drug crimes, 2% of all crime.[@nms25] Cannabis accounted for about 35% of people
      detained for drug crimes and methamphetamine 47%; personal possession accounted for 21% of
      detainees.[@nms25] Across all drugs, courts convicted 2,545 people: 53% received suspended
      sentences and 26% prison.[@nms25] Authorities also recorded 10,369 administrative offences,
      almost all for small personal quantities.[@nms25]
    sources:
      - nms25
      - z167
  visitors:
    status: none
    text: >-
      The personal possession permission applies to adults aged 21+, with a limit of 25 g outside
      their own dwelling.[@z167] Visitors have no authorised recreational shop or club supply:
      selling cannabis or giving it to another person remains a crime.[@z40] Importing it across the
      border is also a supply offence.[@z40]
    sources:
      - z167
      - z40
  clubs:
    status: underground
    text: >-
      A survey conducted in 2018–19 received responses from two Czech cannabis social
      clubs.[@pardal20] The current law permits personal growing and possession, while supplying
      other people remains a crime.[@z167, z40] A legal commentary on the 2026 rules treats joint
      growing followed by dividing the harvest as joint participation in the supply offence.[@advd]
    sources:
      - pardal20
      - z167
      - z40
      - advd
