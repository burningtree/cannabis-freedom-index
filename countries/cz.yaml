summary: >-
  From 1 January 2026 adults may grow up to three plants and keep up to 100 g at home (25 g in
  public). There is no regulated recreational market. Medical cannabis is on e-prescription with
  insurance cover, and low-THC products are sold freely.
scores:
  possession: 6
  cultivation: 4
  enforcement: 6
  sharing: 1
  consumption: 5
  access: 1
segments:
  possession:
    text: >-
      Since 1 January 2026, adults aged 21+ may keep up to 100 g of dried cannabis at home and carry
      up to 25 g in public. Above that it steps up: 26–50 g in public or 101–200 g at home is a
      misdemeanour, and more than 200 g is a felony.
    sources:
      - expats
      - norml
  cultivation:
    text: >-
      Up to three plants per adult aged 21+, at your primary residence only. Four or five plants is
      a misdemeanour; more than five is a felony.
    sources:
      - expats
      - norml
  enforcement:
    text: >-
      Inside the limits nothing is punished, and the first band above them is a misdemeanour. Larger
      quantities and any supply are crimes, though the 2026 reform also reduced sentences for
      cannabis offences compared with other drugs.
    sources:
      - norml
      - expats
  sharing:
    text: >-
      The reform covers only your own possession and growing. Selling or handing cannabis to someone
      else is still a supply offence under the criminal code, even between friends and without
      payment.
    sources:
      - expats
      - boc
  consumption:
    text: >-
      Use itself has never been an offence, and the 2026 law does not create consumption zones or
      bans of its own. Smoking restrictions and municipal ordinances apply, and there are no
      licensed venues.
    sources:
      - expats
  access:
    text: >-
      There is no legal recreational market: no shops and no cannabis clubs (clubs may be considered
      later). Products under 1% THC are sold freely, and pharmacies dispense medical cannabis on
      prescription.
    sources:
      - expats
      - boc
context:
  production:
    text: >-
      Only personal cultivation is allowed. Commercial growing is limited to licensed medical
      producers, a sector that is expanding and exporting, and to low-THC hemp.
    sources:
      - boc
      - sakl
  products:
    text: >-
      Home-grown flower for personal use, low-THC hemp and CBD products up to 1% THC, and
      pharmacy-dispensed medical flower and extracts. No legal THC edibles or concentrates for adult
      use.
    sources:
      - boc
      - expats
  medical:
    text: >-
      Medical cannabis is issued on electronic prescription and dispensed in pharmacies; public
      health insurance reimbursed most of the cost up to a monthly quantity, and prescribing has
      been extended beyond specialists to general practitioners.
    sources:
      - sakl
      - boc
  consequences:
    text: >-
      The Czech Republic effectively applies zero tolerance for THC at the wheel, with a very low
      blood threshold that regular users can exceed long after use. The age limit of 21 leaves
      18–20-year-olds outside the legal regime.
    sources:
      - expats
  planting:
    seeds: legal
    seeds_trade: open
    clones: legal
    clones_trade: unclear
    text: >-
      The Addictive Substances Act defines cannabis as the flowering or fruiting top of the
      plant, or an above-ground part that includes the top. Seeds, and young plants without
      tops, fall outside that definition; cuttings count towards the three plants an adult may
      grow. Seeds, not being cannabis in law, fall outside the controls on selling it; the Act
      has no rule on selling cuttings.
    sources:
      - z167
  driving:
    status: limit
    text: >-
      A government regulation sets a lower limit of 2 nanograms of THC per millilitre of blood
      serum; above it a driver is treated as affected and commits at least an administrative
      offence. The Supreme Court fixed a second line in 2015: at 10 ng/ml or more the driver
      is in a state excluding the ability to drive, which is the crime of endangerment under
      the influence of an addictive substance. The 2026 cannabis reform did not change these
      limits.
    sources:
      - epravo16
  black_market:
    text: >-
      With no legal shops, cannabis is supplied by home growing and a domestic illegal market.
      The national monitoring centre describes cultivation as mostly for the grower's own
      supply, alongside small grow rooms: police uncovered 109 indoor sites in 2024, down from
      138, most with fewer than 50 plants, while large operations keep declining. Production
      usually covers local or community demand; smaller surpluses are bought up by organised
      groups and exported, mainly to Slovakia and Austria. Seizures in criminal cases in 2024
      came to 609 kg of dried cannabis and 7,100 plants, with an average potency of 11% THC.
      Sales are moving online, through social networks, darknet markets and couriers.
    sources:
      - nms25
  arrests:
    text: >-
      These figures predate the 2026 reform and cover all illegal drugs unless stated. In 2024
      police recorded about 4,200 primary drug crimes, 2% of all crime; about 35% of the
      people detained for them were held in connection with cannabis, second to
      methamphetamine at about 47%. Possession for personal use made up 21% of those detained,
      a share that keeps rising. Courts convicted 2,545 people, most often giving a suspended
      sentence (53%); 26% went to prison. There were also 10,369 administrative offences,
      almost all for holding a small amount for personal use.
    sources:
      - nms25
  visitors:
    status: none
    text: >-
      There are no shops and no clubs, so nobody, resident or visitor, can buy recreational
      cannabis legally; the 2026 reform covers only an adult's own possession and home
      growing. Products under 1% THC are sold freely to anyone.
    sources:
      - expats
  clubs:
    status: underground
    text: >-
      The law has no place for cannabis clubs, but some exist. A Europe-wide survey carried
      out in 2018 and 2019 received answers from two clubs in Czechia and found that clubs had
      been present there since the late 1990s. An impact study for a regulated market in 2022
      proposed licensed non-profit associations of up to 50 members growing five plants each,
      and the government draft of January 2024 still included clubs, but the reform in force
      since 2026 covers only personal growing and possession. Growing together and dividing
      the harvest is not treated as each person's own growing: a legal commentary on the new
      code classes it as joint commission of the supply offence, and growing for someone else
      as an attempt at it.
    sources:
      - pardal20
      - mk22
      - ex24
      - advd
      - expats
