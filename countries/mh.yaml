segments:
  possession:
    text: >-
      Illegal under the Narcotic Drugs (Prohibition and Control) Act 1987. A first offence involving
      one ounce or less carries a fine of $1,000–5,000 or six months to a year in prison, or both;
      more than an ounce carries $5,000–25,000 or one to five years. Penalties rise steeply for
      repeat offences.
    sources:
      - wiki
      - law
  cultivation:
    text: >-
      Section 903(b) prohibits knowingly planting or cultivating a prohibited drug. Section 902
      includes cannabis seeds and growing plants in marijuana.
    sources:
      - law
  enforcement:
    text: >-
      Under the 1987 Act a first offence involving one ounce or less carries a fine of at least
      $1,000 or at least six months in prison. The minimum fine alone is large relative to local
      incomes, and prison is an option even for a first small offence.
    sources:
      - law
  sharing:
    text: >-
      Distribution includes giving, transferring and delivering to another. The general marijuana
      penalty ladder in section 909 applies; an unpaid transfer is not a separate legal route.
    sources:
      - law
  consumption:
    text: >-
      Section 903(c) prohibits self-administration except as the Act permits. Consumption is
      therefore expressly covered, rather than merely inferred from possession.
    sources:
      - law
  access:
    text: >-
      No recreational route. Sections 904–907 allow specified professional and prescription
      exceptions; their existence does not establish that cannabis medicines are supplied in
      practice.
    sources:
      - law
context:
  production:
    text: None.
    sources:
      - wiki
  products:
    text: None.
    sources:
      - wiki
  medical:
    text: >-
      Sections 904–907 provide prescription and professional-use exceptions, with licences
      specifying drugs and quantities. Actual cannabis-medicine availability was not established.
    sources:
      - law
  consequences:
    text: >-
      Sections 909–910 provide confiscation and forfeiture, including property used in an offence,
      with procedures for innocent ownership claims.
    sources:
      - law
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited.
    sources:
      - wiki
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. British travel advice says there are severe
      penalties for all drug offences, including long prison sentences and heavy fines.
    sources:
      - wiki
      - fcdo
  planting:
    seeds: illegal
    seeds_trade: banned
    clones: illegal
    clones_trade: banned
    text: >-
      Section 902 includes seeds and any part of a growing cannabis plant. Section 903 prohibits
      possession, planting, cultivation and distribution outside the Act’s exceptions; no personal
      seed or cutting exemption was identified.
    sources:
      - law
