name: Marshall Islands
region: Oceania
iso_numeric: 584
recreational: illegal
medical: limited
updated: '2026-10-23'
summary: >-
  Cannabis offences carry fines or prison, with higher penalties for larger amounts and repeat
  convictions.
scores:
  possession: 1
  cultivation: 1
  enforcement: 2
  sharing: 1
  consumption: 1
  access: 0
segments:
  possession:
    text: >-
      For a first marijuana offence involving one ounce or less, the statutory range is a
      $1,000–5,000 fine or six months to one year in prison, or both. More than an ounce on a first
      offence, or an ounce or less after a previous conviction, carries $5,000–25,000 or one to five
      years, or both.[@law]
    sources:
      - law
  cultivation:
    text: >-
      Knowingly planting or cultivating a prohibited drug is an offence. Marijuana includes growing
      cannabis plants, seeds and resin; the law provides no ordinary personal plant allowance.[@law]
    sources:
      - law
  enforcement:
    text: >-
      The law allows a fine, imprisonment or both for the smallest first marijuana offences.[@law] A
      January 2020 newspaper report described a six-month suspended sentence and a $1,000 fine for a
      personal marijuana import.[@journal] The 2025 amendment also requires witnesses to report drug
      activity, with a $1,000 fine for failing to do so.[@reporting]
    sources:
      - law
      - journal
      - reporting
  sharing:
    text: >-
      Distribution includes giving, transferring, delivering, bartering and exchanging drugs.
      Marijuana offences follow the quantity and conviction-history penalty ladder, with additional
      penalties for supplying someone under eighteen.[@law]
    sources:
      - law
  consumption:
    text: >-
      Self-administration is expressly prohibited outside the law’s exceptions.[@law] In a March–May
      2022 high school survey, 13.8% of participants reported marijuana use in the preceding thirty
      days.[@survey]
    sources:
      - law
      - survey
  access:
    text: >-
      The law permits specified professional handling and possession under a valid medical
      prescription. Licensed practitioners obtain drugs through the government, which is the sole
      importer and distributor for that channel.[@law]
    sources:
      - law
context:
  production:
    status: medical
    text: >-
      Planting, cultivation, production and manufacture are prohibited outside the Act’s exceptions.
      Practitioners handling drugs for professional work, approved research, teaching or analysis
      require licences specifying the drug and quantity.[@law]
    sources:
      - law
  products:
    text: >-
      The law separates marijuana from marijuana concentrate, including hashish and THC, with
      different penalty bands. Both are expressly included in the current prohibited-drug
      definition.[@law]
    sources:
      - law
  medical:
    text: >-
      The Act expressly extends its medical and professional exceptions to marijuana and
      concentrates. It recognises licensed professional handling and possession under a valid
      prescription. Practitioner licences identify the drugs and exact quantities and last one year;
      receipt and dispensing records must be retained for two years.[@law]
    sources:
      - law
  consequences:
    text: >-
      Drugs may be confiscated, and property used in drug transport, import or export can be seized
      and forfeited. Owners have one month to seek recovery through the High Court.[@law] The 2020
      amendment expressly added cash to seizure powers.[@amendment]
    sources:
      - law
      - amendment
  clubs:
    status: none
    text: >-
      Ordinary cannabis cultivation and distribution, including gifts and transfers, are prohibited.
      The Act’s exceptions concern licensed professional or prescribed medical handling.[@law]
    sources:
      - law
  visitors:
    status: none
    text: >-
      Importing and possessing cannabis are prohibited outside the Act’s specified exceptions. A
      small first marijuana offence can bring a fine, imprisonment or both, and larger quantities or
      previous convictions raise the penalty range.[@law]
    sources:
      - law
  planting:
    seeds: illegal
    seeds_trade: banned
    clones: illegal
    clones_trade: banned
    text: >-
      Marijuana includes seeds and any part of a cannabis plant, growing or otherwise. The Act
      prohibits possession, planting, cultivation and distribution outside its specified
      exceptions.[@law]
    sources:
      - law
