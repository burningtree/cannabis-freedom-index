name: Marshall Islands
region: Oceania
iso_numeric: 584
recreational: illegal
medical: limited
updated: '2026-10-28'
summary: >-
  Cannabis offences carry fines or prison, with higher penalties for larger amounts and repeat
  convictions.
scores:
  possession: 1
  cultivation: 1
  enforcement: 2
  sharing: 1
  consumption: 1
  access: 0
segments:
  possession:
    text: >-
      For a first marijuana offence involving one ounce or less, the statutory range is a
      $1,000–5,000 fine or six months to one year in prison, or both. More than an ounce on a first
      offence, or an ounce or less after a previous conviction, carries $5,000–25,000 or one to five
      years, or both; a repeat over an ounce carries $25,000–50,000 or five to fifteen years.[@law]
      Marijuana concentrate is treated separately: under a quarter of an ounce carries $5,000–50,000
      or one to fifteen years, and half an ounce or more carries at least $100,000 or at least
      twenty-five years.[@law]
    sources:
      - law
    currency: USD
    penalties:
      - label: Herb, one ounce or less, first offence
        treatment: criminal
        term: Possession
        prison_min: 6 months
        prison: 1 year
        fine_min: 1000
        fine: 5000
      - label: Herb, over one ounce, first offence
        treatment: criminal
        term: Possession
        prison_min: 1 year
        prison: 5 years
        fine_min: 5000
        fine: 25000
      - label: Herb, over one ounce, repeat
        treatment: criminal
        term: Possession
        prison_min: 5 years
        prison: 15 years
        fine_min: 25000
        fine: 50000
      - label: Concentrate, under a quarter ounce, first offence
        treatment: criminal
        term: Possession
        prison_min: 1 year
        prison: 15 years
        fine_min: 5000
        fine: 50000
      - label: Concentrate, half an ounce or more
        treatment: criminal
        term: Possession
        prison_min: 25 years
        fine_min: 100000
        note: No statutory maximum for this band
  cultivation:
    text: >-
      Knowingly planting or cultivating a prohibited drug is an offence. Marijuana includes growing
      cannabis plants, seeds and resin; the law provides no ordinary personal plant allowance and
      grades cultivation by the amount of drug involved, not by plant count.[@law]
    sources:
      - law
    currency: USD
    penalties:
      - label: Cultivation graded by quantity
        treatment: criminal
        term: Cultivation
        prison_min: 6 months
        prison: 15 years
        fine_min: 1000
        fine: 50000
        note: Section 909 herb bands; concentrate can reach at least twenty-five years
  enforcement:
    text: >-
      The law allows a fine, imprisonment or both for the smallest first marijuana offences.[@law] A
      January 2020 newspaper report described a six-month suspended sentence and a $1,000 fine for a
      personal marijuana import.[@journal] The 2025 amendment also requires witnesses to report drug
      activity, with a $1,000 fine for failing to do so.[@reporting]
    sources:
      - law
      - journal
      - reporting
  sharing:
    text: >-
      Distribution includes giving, transferring, delivering, bartering and exchanging drugs.
      Marijuana offences follow the quantity and conviction-history penalty ladder, with additional
      penalties for supplying someone under eighteen.[@law]
    sources:
      - law
    currency: USD
    penalties:
      - label: Herb, one ounce or less, first offence
        treatment: criminal
        term: Distribution
        prison_min: 6 months
        prison: 1 year
        fine_min: 1000
        fine: 5000
      - label: Herb, over one ounce, first offence
        treatment: criminal
        term: Distribution
        prison_min: 1 year
        prison: 5 years
        fine_min: 5000
        fine: 25000
      - label: Supply to a minor, herb
        treatment: criminal
        term: Distribution to a minor
        prison_min: 5 years
        prison: 15 years
        fine_min: 25000
        fine: 50000
        note: Additional to the section 909 penalty
      - label: Supply to a minor, concentrate
        treatment: criminal
        term: Distribution to a minor
        prison_min: 25 years
        fine_min: 100000
        note: Additional to the section 909 penalty; no statutory maximum
  consumption:
    text: >-
      Self-administration is expressly prohibited outside the law’s exceptions.[@law] In a March–May
      2022 high school survey, 13.8% of participants reported marijuana use in the preceding thirty
      days.[@survey]
    sources:
      - law
      - survey
  access:
    text: >-
      The law permits specified professional handling and possession under a valid medical
      prescription. Licensed practitioners obtain drugs through the government, which is the sole
      importer and distributor for that channel.[@law]
    sources:
      - law
context:
  recreational:
    text: >-
      There is no legal way for an adult to buy cannabis, and growing a plant at home is a
      crime.[@law] The market is small and local, with no licensed shops or clubs.[@ocindex] Cannabis
      is the illicit drug most often reported by young people: 13.8% of high school students in the
      2022 survey had used it in the past 30 days, against 1.0% for meth or cocaine.[@survey] Police
      and court reports describe small quantities found alongside methamphetamine and crack, not a
      large commercial trade.[@journal,courts2025]
    sources:
      - law
      - ocindex
      - survey
      - journal
      - courts2025
  production:
    status: medical
    text: >-
      Planting, cultivation, production and manufacture are prohibited outside the Act’s exceptions.
      The Act allows licensed professional handling and approved research or teaching, but creates no
      commercial cannabis cultivation or manufacturing licence; the government is the sole importer
      and distributor of narcotic drugs.[@law]
    sources:
      - law
  medical:
    text: >-
      A doctor may prescribe a narcotic drug, and the Act deems marijuana a narcotic for its medical
      and professional sections, so possession under a valid prescription is exempt from the ban.[@law]
      The Act creates no medical cannabis programme: no product list, patient registry or pharmacy
      supply route was found, and the government is the sole importer of narcotic drugs.[@law] A
      practitioner needs a one-year licence from the Board of Health Professions naming the drug and
      quantity, and must keep records for two years.[@law]
    sources:
      - law
  consequences:
    text: >-
      Drugs may be confiscated, and property used in drug transport, import or export can be seized
      and forfeited. Owners have one month to seek recovery through the High Court.[@law] The 2020
      amendment expressly added cash to seizure powers.[@amendment]
    sources:
      - law
      - amendment
  clubs:
    status: none
    text: >-
      Ordinary cannabis cultivation and distribution, including gifts and transfers, are prohibited.
      The Act’s exceptions concern licensed professional or prescribed medical handling.[@law]
    sources:
      - law
  visitors:
    status: none
    text: >-
      Importing and possessing cannabis are prohibited outside the Act’s specified exceptions. A
      small first marijuana offence can bring a fine, imprisonment or both, and larger quantities or
      previous convictions raise the penalty range.[@law]
    sources:
      - law
  hemp:
    status: none
    text: >-
      The Act has no THC threshold for hemp. “Marijuana” covers any part of the cannabis plant,
      growing or not, including seeds and resin, and “marijuana concentrate” covers hashish and THC;
      the only exceptions are medical, professional and research licences.[@law] No hemp licensing
      scheme or CBD rule was found.[@law]
    sources:
      - law
  driving:
    status: impairment
    text: >-
      Driving while under the influence of alcohol or drugs, including marijuana, is a crime when it
      makes you unable to drive with the caution of a sober person.[@dui] There is no THC limit: a
      breath test is taken if police ask, a blood test if breath testing is unavailable, and refusing
      a test costs the licence for six months.[@dui] A first conviction carries 3 days to 1 year in
      jail, a $100–$1,000 fine and a 30-day to 6-month licence suspension.[@dui] The Motor Traffic
      Act’s definition of “drug” expressly includes marijuana.[@motor]
    sources:
      - dui
      - motor
  black_market:
    text: >-
      The cannabis market is small and local. The Global Organized Crime Index rates the cannabis
      trade 2.5 out of 10 and says low profit margins keep large criminal actors out, while cocaine
      and methamphetamine dominate trafficking.[@ocindex] Police reports describe small quantities
      mixed with other drugs: a 2024 jail raid found marijuana and meth in the same cells, and a 2024
      home search found marijuana, meth and crack.[@journal] The Marshall Islands reports no cannabis
      seizure data to UNODC, so there is no national series of kilograms seized for 2015–2024.[@unodc_szr]
    sources:
      - ocindex
      - journal
      - unodc_szr
  arrests:
    text: >-
      Police recorded charges in two possession-of-illegal-substance cases and five
      selling-or-distribution cases in 2024, up from none of either in 2023; the figures cover all
      drugs and do not separate cannabis.[@mipd] The High Court counted two “narcotic drugs” cases
      among 21 criminal filings in Majuro in 2024, and in 2025 five drug-possession cases among 26
      Majuro filings and one marijuana-selling case among five Ebeye filings.[@courts2024,courts2025]
      The court reports give case counts, not arrest numbers, and the possession figures mix cannabis
      with methamphetamine and cocaine.[@courts2025]
    sources:
      - mipd
      - courts2024
      - courts2025
  death_penalty:
    text: >-
      No cannabis offence carries death. The Prohibited Drugs Act provides fines or imprisonment for
      marijuana and concentrate offences; none of its penalty provisions provides a death
      sentence.[@law]
    sources:
      - law
  planting:
    seeds: illegal
    seeds_trade: banned
    clones: illegal
    clones_trade: banned
    text: >-
      Marijuana includes seeds and any part of a cannabis plant, growing or otherwise. The Act
      prohibits possession, planting, cultivation and distribution outside its specified
      exceptions.[@law]
    sources:
      - law
