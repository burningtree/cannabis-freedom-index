segments:
  possession:
    text: >-
      Illegal under the Narcotic Drugs (Prohibition and Control) Act 1987. A first offence involving
      one ounce or less carries a fine of $1,000–5,000 or six months to a year in prison, or both;
      more than an ounce carries $5,000–25,000 or one to five years. Penalties rise steeply for
      repeat offences.
    sources:
      - wiki
      - law
  cultivation:
    text: Cultivation is regulated and penalised by the same Act.
    sources:
      - wiki
  enforcement:
    text: >-
      The minimum fine alone is large relative to local incomes, and prison is an option even for a
      first small offence.
    sources:
      - wiki
  sharing:
    text: Sale and distribution carry heavier penalties.
    sources:
      - wiki
  consumption:
    text: Use is covered by the possession offence.
    sources:
      - wiki
  access:
    text: None.
