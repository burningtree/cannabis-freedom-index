segments:
  possession:
    text: >-
      Under the Drug Control Act as amended in 2014, a first-time offender with between 0.1 g and
      150 g of cannabis faces a fine of 50,000 to 100,000 dalasi or six months to a year in prison,
      or both. The amendment was meant to ease prison overcrowding, but the fine is far beyond most
      people's means, so many serve the prison term in default.
    sources:
      - point
      - gam
  cultivation:
    text: Cultivation is a crime with heavier penalties.
    sources:
      - point
  enforcement:
    text: >-
      Courts regularly impose six-figure fines for small amounts of cannabis, with imprisonment if
      unpaid.
    sources:
      - gam
      - point
  sharing:
    text: Trafficking carries long sentences; the death penalty for drug offences has been abolished.
    sources:
