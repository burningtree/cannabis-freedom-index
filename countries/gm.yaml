  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited.
    sources:
      - point
      - hoc
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. Under the Drug Control Act as amended in
      2014, a first-time offender with between 0.1 g and 150 g of cannabis faces a fine of
      50,000 to 100,000 dalasi or six months to a year in prison, or both.
    sources:
      - point
      - gam
  driving:
    status: impairment
    text: >-
      Motor Traffic Act section 48(1) prohibits drug-impaired driving, attempting to drive, or being
      in charge of a motor vehicle on a road, parking place or other public place. It covers both
      inability to control the vehicle properly and impaired efficiency as a driver. Section 48(3)
      permits a uniformed police officer to arrest an offender without warrant. The security-
      legislation publication is marked Issue 1/2009: its main text describes twelve-month
      disqualification with a special-reasons exception, while section 100 and the penalty schedule
      give different sanction wording, including a five-year disqualification. Current fines and
      licence-ban terms are therefore left unresolved pending amendment/consolidation checks. Drug
      toxicology, specimen-refusal rules and a numeric THC cutoff were not established.
    sources:
      - traffic2009
  arrests:
    text: >-
      The Drug Law Enforcement Agency reported 1,219 people arrested in 1,208 drug cases
      in 2024; 1,014 were Gambians and 205 foreigners. It seized 1.9 tonnes of cannabis
      sativa and 2.2 tonnes from plantations, and cannabis made up 54.7% of all seizures.
    sources:
      - point25
  black_market:
    text: >-
      Figures reported by the government to the UN drugs office record 1,924 kg of herbal
      cannabis seized in 2024, against 1,954 kg in 2023, and 14 kg of cannabis resin
      seized in 2024, against 9.6 kg in 2023. The UN publishes them as kilogram
      equivalents, and countries count seizures differently, so the figures are not
      comparable across borders.
    sources:
      - unodc_szr
