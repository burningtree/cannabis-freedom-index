segments:
  possession:
    text: >-
      The enacted 2014 amendment gives first-time cannabis possession its own scale. For 0.1–150
      grams it allows a fine of 50,000–100,000 dalasi, one to two years in prison, or both; for
      151–500 grams, 100,000–150,000 dalasi or two to five years, or both; from 501 grams,
      150,000–250,000 dalasi or three to ten years, or both. The general possession rule remains
      separate, as do trafficking offences.
    sources:
      - amend2014
      - law2003
  cultivation:
    text: >-
      Unauthorised cannabis growing is prohibited. The 2014 amendment expressly extends the
      cultivation provision to prohibited drugs and the First Schedule, where cannabis is listed;
      its penalty allows a fine of at least 50,000 dalasi, at least three years in prison, or both.
      The law separately provides for specifically authorised scientific cultivation.
    sources:
      - law2003
      - amend2014
  enforcement:
    text: >-
      Prison remains possible for first-time cannabis possession, alongside a fine alternative. The
      drug agency’s 2019–2023 strategy described burdensome fines, prison sentences and limited
      rehabilitation, and called for alternatives for young and first-time offenders.
    sources:
      - amend2014
      - strategy2019
  sharing:
    text: >-
      The 2011 amendment raised the minimum fine in the general trafficking clause to ten million
      dalasi, alongside at least ten years in prison. The quantity rule covers more than ten grams
      of cannabis resin or two kilograms of cannabis, unless the accused proves the possession was
      not for trafficking. Separate supply offences also apply.
    sources:
      - law2003
      - amend2010
      - amend2011
  consumption:
    text: Use is prosecuted through possession.
    sources:
      - point
  access:
    text: None.
    sources:
      - point
