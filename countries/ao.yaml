    text: The retained sources do not establish whether a medical cannabis programme operates.
    sources: []
  consequences:
    text: The retained sources do not establish collateral consequences beyond the penalties described above.
    sources: []
  planting:
    seeds: grey
    seeds_trade: unclear
    clones: illegal
    clones_trade: banned
    text: >-
      Law 3/99 punishes anyone who, without authorisation, cultivates, sells, buys, transports
      or holds plants listed in its tables with eight to twelve years in prison. The law does
      not mention seeds.
    sources:
      - l399
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited.
    sources:
      - lei3
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. Law 3/99 punishes using a listed drug,
      or holding, buying or growing it for one's own use, with up to three months in prison, or
      up to one year where the amount exceeds the average individual need for three days.
    sources:
      - lei3
  black_market:
    text: >-
      Figures reported by the government to the UN drugs office record 22,362 kg of herbal
      cannabis seized in 2024, against 33,032 kg in 2023. The UN publishes them as
      kilogram equivalents, and countries count seizures differently, so the figures are
      not comparable across borders.
    sources:
      - unodc_szr
