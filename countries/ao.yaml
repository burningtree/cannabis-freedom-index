segments:
  possession:
    text: >-
      Article 23 of Law 3/99 punishes anyone who unlawfully uses, or holds, buys or grows for their
      own use, a plant or substance in Tables I to IV with up to three months in prison. If the
      amount exceeds the average individual need for three days, the penalty is up to one year.
      Cannabis, its resin and its oil are in Table I-C. A court can suspend the sentence of a
      user it finds dependent, on condition of treatment (Article 26).
    sources:
      - lei3
  cultivation:
    text: >-
      Growing for your own use falls under the same Article 23 offence (up to three months, or
      up to a year above three days' supply). Cultivation without authorisation for any other
      purpose is trafficking under Article 4: 8 to 12 years.
    sources:
      - lei3
  enforcement:
    text: >-
      The statute sets prison, not a fine, for personal use, but only up to three months, and
      allows a suspended sentence with treatment. Anonymous health care is guaranteed to a user
      who asks for it (Article 24). How often users are jailed is not shown by the statute.
    sources:
      - lei3
  sharing:
    text: >-
      Giving or handing cannabis to another person without authorisation is trafficking under
      Article 4 (8 to 12 years). If the aim is only to get the drug for personal use, Article 9
      sets up to two years and a fine, unless the amount exceeds five days' supply.
    sources:
      - lei3
  consumption:
    text: >-
      Using cannabis is itself a crime under Article 23 (up to three months in prison).
    sources:
      - lei3
  access:
    text: >-
      No lawful source for personal use. Trading without authorisation is punished under Article
      4; the law leaves authorised activity to licences.
    sources:
      - lei3
