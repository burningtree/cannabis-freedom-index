name: Angola
region: Africa
iso_numeric: 24
recreational: illegal
medical: none
updated: 2026-10-13
summary: >-
  Holding or using cannabis (liamba) for personal use is a crime with up to three months in prison,
  or up to a year above three days' supply; a court can suspend the sentence for treatment.
scores:
  possession: 1
  cultivation: 1
  enforcement: 2
  sharing: 1
  consumption: 1
  access: 0
segments:
  possession:
    text: >-
      Article 23 of Law 3/99 punishes anyone who unlawfully uses, or holds, buys or grows for their
      own use, a plant or substance in Tables I to IV with up to three months in prison. If the
      amount exceeds the average individual need for three days, the penalty is up to one year.
      Cannabis, its resin and its oil are in Table I-C. A court can suspend the sentence of a
      user it finds dependent, on condition of treatment (Article 26).
    sources:
      - lei3
    penalties:
      - label: Personal use, up to three days' supply
        treatment: criminal
        prison: 3 months
        note: The statute sets prison, not a fine
      - label: Personal use, over three days' supply
        treatment: criminal
        prison: 1 year
        note: Amount exceeds the average individual need for three days
  cultivation:
    text: >-
      Growing for your own use falls under the same Article 23 offence (up to three months, or
      up to a year above three days' supply). Cultivation without authorisation for any other
      purpose is trafficking under Article 4: 8 to 12 years.
    sources:
      - lei3
    penalties:
      - label: Growing for own use
        treatment: criminal
        prison: 3 months
        note: Up to a year above three days' supply
      - label: Unauthorised cultivation (trafficking, Article 4)
        treatment: criminal
        prison_min: 8 years
        prison: 12 years
  enforcement:
    text: >-
      The statute sets prison, not a fine, for personal use, but only up to three months, and
      allows a suspended sentence with treatment. Anonymous health care is guaranteed to a user
      who asks for it (Article 24). How often users are jailed is not shown by the statute.
    sources:
      - lei3
  sharing:
    text: >-
      Giving or handing cannabis to another person without authorisation is trafficking under
      Article 4 (8 to 12 years). If the aim is only to get the drug for personal use, Article 9
      sets up to two years and a fine, unless the amount exceeds five days' supply.
    sources:
      - lei3
    penalties:
      - label: Getting the drug for personal use (Article 9)
        treatment: criminal
        prison: 2 years
        note: Up to two years and a fine, unless over five days' supply
      - label: Giving or handing to another person (trafficking, Article 4)
        treatment: criminal
        prison_min: 8 years
        prison: 12 years
  consumption:
    text: >-
      Using cannabis is itself a crime under Article 23 (up to three months in prison).
    sources:
      - lei3
  access:
    text: >-
      No lawful source for personal use. Trading without authorisation is punished under Article
      4; the law leaves authorised activity to licences.
    sources:
      - lei3
context_not_applicable:
  death_penalty:
    text: >-
      Angola abolished the death penalty by constitution in 1992; no cannabis offence carries
      a capital sentence.[@wikipdp]
    sources: [wikipdp]
context:
  recreational:
    text: >-
      There is no legal way to get cannabis. Using it, or holding, buying or growing it for
      one's own use, brings up to three months in prison, or up to a year above three days'
      supply; a dependent user's sentence can be suspended for treatment.[@lei3]
    sources:
      - lei3
  culture:
    text: >-
      Cannabis is known as *diamba* or *liamba*.[@wiki] [Livingstone
      recorded](/history/angola-livingstone-observation-1857/) that under Portuguese rule a
      slave's use was considered a crime, while diamba was sold openly in Luanda's
      market.[@tni_rd] A 2009 UN drugs report called cannabis the most common illicit drug in
      the country, grown in almost every province.[@incb09]
    sources:
      - wiki
      - tni_rd
      - incb09
  production:
    status: none
    text: No licensed production.
    sources:
      - wiki
  medical:
    text: >-
      No patient programme is documented. Law 3/99 punishes use and personal possession
      without authorisation, with suspension for treatment only for dependent users.[@lei3]
    sources:
      - lei3
  consequences:
    text: >-
      The retained sources describe no consequence beyond the sentence itself, which a court
      can suspend for a dependent user on condition of treatment; anonymous healthcare is
      guaranteed to a user who asks for it.[@lei3]
    sources:
      - lei3
  planting:
    seeds: grey
    seeds_trade: unclear
    clones: illegal
    clones_trade: banned
    text: >-
      Law 3/99 punishes anyone who, without authorisation, cultivates, sells, buys, transports
      or holds plants listed in its tables with eight to twelve years in prison. The law does
      not mention seeds.
    sources:
      - l399
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited.
    sources:
      - lei3
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. Law 3/99 punishes using a listed drug,
      or holding, buying or growing it for one's own use, with up to three months in prison, or
      up to one year where the amount exceeds the average individual need for three days.
    sources:
      - lei3
  black_market:
    text: >-
      Figures reported by the government to the UN drugs office record 22,362 kg of herbal
      cannabis seized in 2024, against 33,032 kg in 2023. The UN publishes them as
      kilogram equivalents, and countries count seizures differently, so the figures are
      not comparable across borders.
    sources:
      - unodc_szr
