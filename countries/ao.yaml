  planting:
    seeds: grey
    seeds_trade: unclear
    clones: illegal
    clones_trade: banned
    text: >-
      Law 3/99 punishes anyone who, without authorisation, cultivates, sells, buys, transports
      or holds plants listed in its tables with eight to twelve years in prison. The law does
      not mention seeds.
    sources:
      - l399
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited.
    sources:
      - lei3
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. British travel advice says drug taking
      and smuggling are offences, that punishments can be severe and that prison conditions
      are very poor.
    sources:
      - lei3
      - fcdo
