segments:
  possession:
    text: >-
      Under Law 3/99 on trafficking and consumption of narcotics, possessing a small amount of
      liamba for your own use is a crime punished with up to about three months in prison, rising to
      up to a year if the quantity exceeds roughly three days' supply. Courts can suspend the
      sentence if a dependent user accepts treatment.
    sources:
      - cr
      - wiki
  cultivation:
    text: >-
      Growing for personal use falls under the same consumption offence; larger cultivation is
      trafficking.
    sources:
      - cr
  enforcement:
    text: Short prison terms for users, often suspended; long ones for traffickers.
    sources:
      - cr
  sharing:
    text: Trafficking carries eight to twelve years.
    sources:
      - cr
  consumption:
    text: Consumption is itself an offence under Law 3/99.
    sources:
      - cr
  access:
