  planting:
    seeds: illegal
    seeds_trade: banned
    clones: illegal
    clones_trade: banned
    text: >-
      The national code defines marihuana as all parts of the plant Cannabis sativa, whether
      growing or not, and names the seeds, so seeds and cuttings are a controlled substance
      like the rest of the plant. Only sterilised seed that cannot germinate is left out. The
      four state codes were not read.
    sources:
      - code
  clubs:
    status: none
    text: >-
      No cannabis clubs are known. Delivering marijuana is trafficking, with one carve-out:
      handing over no more than an ounce for no payment is treated as simple possession.
      Nothing in the code provides for collective growing.
    sources:
      - code
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone, so a visitor has no lawful way to buy
      cannabis. The sources behind this profile describe no separate rule for visitors.
    sources:
      - code
