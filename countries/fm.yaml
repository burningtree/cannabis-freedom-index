segments:
  possession:
    text: >-
      Marihuana is a controlled substance under Title 11, Chapter 11 of the FSM Code. Section 1142
      sets a fine of at most $50 for one ounce or less; for more than an ounce but under 2.2 pounds,
      up to three months, a fine of up to $500, or both; for 2.2 pounds or more, up to one year and a
      $1,000 fine, with a rebuttable presumption of trafficking. A first-time possession offender
      may be given a conditional discharge (Section 1148). The four state codes were not read.
    sources:
      - code
  cultivation:
    text: >-
      "Manufacture" is defined to include production and propagation, and "production" to include
      planting, cultivation and growing (Section 1112). Manufacturing a controlled substance other
      than a narcotic drug carries up to five years and a $5,000 fine (Section 1141).
    sources:
      - code
  enforcement:
    text: >-
      The national penalty for one ounce or less is a fine of at most $50, and a first-time
      possession offender may receive a conditional discharge. Prison is possible for larger
      amounts. How courts apply it is not shown by the text.
    sources:
      - code
  sharing:
    text: >-
      Delivering marihuana is trafficking, up to five years and a $5,000 fine (Section 1141), except
      that distributing no more than one ounce for no payment is treated as possession of that
      amount: a fine of at most $50.
    sources:
      - code
  consumption:
    text: >-
      The code makes possession an offence; no separate offence for use itself was found.
    sources:
      - code
  access:
    text: None; marihuana is a controlled substance with no authorised supply route in the sections read.
    sources:
      - code
