name: Micronesia
region: Oceania
iso_numeric: 583
recreational: illegal
medical: none
updated: "2026-10-27"
summary: >-
  Cannabis penalties vary by state. The national code’s $50 small-possession provision is not a
  nationwide ceiling: published state laws also allow custody, and the available Chuuk drug-law
  appendix is historical.
scores:
  possession: 2
  cultivation: 1
  enforcement: 3
  sharing: 2
  consumption: 2
  access: 0
segments:
  possession:
    text: >-
      National section 1142 gives a maximum $50 fine for an ounce or less, but state law differs.
      Pohnpei’s 2012 Code permits up to one month, $100 or both for that amount. Yap permits up to
      30 days, $100 or both, with a fine-only rule for first drug offenders. Kosrae classifies it as
      a category-three misdemeanor: up to six months, $500 or both. Chuuk’s website reproduces a $50
      provision in an unrevised 1980 reference appendix; this does not verify its current law. Later
      state amendments and representative sentencing remain gaps.
    sources:
      - code
      - pohnpei2012
      - yapdrugs
      - kosraedrugs
      - kosraemisd
      - chuukappendix
      - chuukstatus
  cultivation:
    text: >-
      National law treats cultivation as production/manufacture. Pohnpei similarly includes planting
      and growing in production and criminalises unauthorised manufacture. Yap has a separate
      marijuana-production offence carrying up to one year, $1,000 or both. Kosrae’s trafficking
      definition includes manufacture; a 1987 court also applied possession law to growing plants.
      No recreational home-growing permission was established. These published editions do not
      establish typical sentences or every later amendment.
    sources:
      - code
      - pohnpei2012
      - yapdrugs
      - kosraedrugs
      - paulino1987
  enforcement:
    text: >-
      The statutes do not establish a single nationwide sentencing pattern. National law and Pohnpei
      provide discretionary conditional discharge for qualifying first possession offences, while
      Yap expressly limits first-time small-possession offenders to a fine. Kosrae’s published
      penalty allows custody even in the smallest category. The 2023 Ehsa order left national
      jurisdiction over locally grown plants open. These observations are not a representative
      sentencing survey; the country’s numerical ratings remain provisional while state amendments
      and actual outcomes are checked.
    sources:
      - code
      - pohnpei2012
      - yapdrugs
      - kosraedrugs
      - kosraemisd
      - ehsa2023
  sharing:
    text: >-
      The national code treats an unpaid transfer of no more than an ounce as small possession, with
      a maximum $50 fine. Pohnpei has the same exception from ordinary trafficking, but its
      small-possession penalty allows one month, $100 or both. Yap’s published delivery offence has
      no equivalent small unpaid-gift exception and carries up to three years, $5,000 or both.
      Kosrae includes delivery in its felony trafficking definition without a gift exception in that
      section. The national carve-out is therefore not a uniform state-law rule.
    sources:
      - code
      - pohnpei2012
      - yapdrugs
      - kosraedrugs
  consumption:
    text: >-
      The national and state drug provisions reviewed focus on possession, manufacture and delivery
      rather than establishing general permission to consume. Additional conduct offences apply: Yap
      expressly prohibits marijuana consumption while driving and while in a vehicle on a highway.
      No complete survey of municipal or public-consumption rules was established.
    sources:
      - code
      - pohnpei2012
      - yapdrugs
      - kosraedrugs
      - yapdriving
  access:
    text: >-
      No functioning cannabis patient or recreational supply service was established. National and
      Pohnpei law distinguish Schedule I research from ordinary dispensing provisions for other
      schedules. Yap lists marijuana among hallucinogens and expressly prohibits writing
      prescriptions for the hallucinogenic substances in section 1004. Research powers and general
      prescription exceptions must not be represented as permission to obtain cannabis in every
      state.
    sources:
      - code
      - pohnpei2012
      - yapdrugs
context:
  production:
    text: >-
      Sections 1132–1133 provide registration for controlled-substance manufacture and distribution,
      including controls over Schedule I substances. These statutory powers do not establish issued
      cannabis licences or production volumes. Locally grown plants were at issue in the 2023 Ehsa
      proceeding, which left national jurisdiction open.
    sources:
      - code
      - ehsa2023
  products:
    text: >-
      The definition of marihuana in section 1112 includes the plant, seeds, resin and preparations,
      while excluding mature stalks and specified fibre or seed products, including sterilised
      non-germinating seed. This identifies statutory scope, not currently marketed legal cannabis
      products.
    sources:
      - code
  medical:
    text: >-
      The national code and Pohnpei’s published code provide controlled research registration for
      Schedule I substances.[@code,pohnpei2012] In Yap, section 1005 expressly bars prescriptions for the listed
      hallucinogens, which include marijuana.[@yapdrugs] No patient treatment route was verified in the
      reviewed national and state texts. Research registration does not establish one; later state
      amendments remain incompletely verified.
    sources:
      - code
      - pohnpei2012
      - yapdrugs
  consequences:
    text: >-
      National section 1148 and Pohnpei section 4-130 allow qualifying first possession offenders,
      with consent, to receive probation without judgment. Successful completion leads to discharge
      without a conviction for statutory disqualifications, and an expungement application is
      possible, apart from a retained nonpublic eligibility record. This is discretionary and
      once-only; the same route was not established for all four states.
    sources:
      - code
      - pohnpei2012
  planting:
    seeds: illegal
    seeds_trade: banned
    clones: illegal
    clones_trade: banned
    text: >-
      National and Pohnpei definitions include the plant, viable seeds, resin and preparations, with
      specified exclusions for mature stalks, fibre and sterilised non-germinating seed. Yap defines
      marijuana as all parts of the genus Cannabis, including seeds, without reproducing those
      exclusions in section 1003(c); it separately prohibits marijuana production. A uniform
      national seed exemption should not be assumed under every state law. Kosrae’s seed-specific
      position and a current Chuuk consolidation remain unverified.
    sources:
      - code
      - pohnpei2012
      - yapdrugs
  clubs:
    status: none
    text: >-
      No recreational collective-growing permission was established in the reviewed framework. The
      national and Pohnpei small unpaid-transfer rules leave the conduct criminal, and Yap and
      Kosrae have broader delivery offences. Those limited gifting rules do not authorise a club to
      cultivate or distribute cannabis. Current informal club activity was not verified.
    sources:
      - code
      - pohnpei2012
      - yapdrugs
      - kosraedrugs
  visitors:
    status: none
    text: >-
      No lawful recreational purchase route for visitors was established. A visitor should not treat
      the national $50 possession provision as a state-law ceiling: Pohnpei, Yap and Kosrae publish
      different penalties, and Yap expressly prohibits cannabis prescriptions. Current Chuuk law and
      recognition of foreign prescriptions were not verified.
    sources:
      - code
      - pohnpei2012
      - yapdrugs
      - kosraedrugs
      - kosraemisd
  driving:
    status: impairment
    text: >-
      Rules are state-specific. Pohnpei section 71 PC 12-105 prohibits driving when drug influence
      makes safe driving impossible, with up to one year, $500 or both in the 2012 edition. Yap
      section 704 defines drug influence through impaired driving ability, but also mentions
      habitual narcotic users; sections 705–706 separately prohibit marijuana consumption while
      driving or in a vehicle on a highway. Kosrae section 13.710 prohibits driving under
      controlled-substance influence. Chuuk’s draft section 1305 addresses narcotic drugs and other
      drugs impairing safe operation, with separate habitual-user wording. No numerical THC limit
      was established in these provisions; the map classification concerns the reviewed influence
      offences, not an absence of additional rules. Later amendments and testing practice remain
      unverified.
    sources:
      - pohnpei2012
      - yapdriving
      - kosraedriving
      - chuukdriving
  black_market:
    text: >-
      Historical local evidence: Oneisom’s five-month Chuuk study in 1985, published in 1991,
      described mostly part-time or family cannabis dealing alongside a dealer network, with locally
      grown cannabis and reported supplies from other islands. It did not establish sufficient
      evidence of exports from Chuuk. This exploratory study is not a current nationwide market
      estimate.
    sources:
      - oneisom1991
  arrests:
    text: >-
      Historical Chuuk figures, not nationwide totals: Oneisom reproduced monthly police reports
      showing 26 arrests in 30 reported cases in 1983 and 40 arrests in 56 cases in 1984. Daily
      officer reports instead listed 36 cases for 1984 and did not consistently record arrests.
      These incompatible series should not be combined, and none is a current arrest rate.
    sources:
      - oneisom1991
answers:
  buy:
    answer: no
    text: No patient or adult-use purchase route verified
