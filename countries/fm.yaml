segments:
  possession:
    text: >-
      Cannabis is a Schedule I controlled substance. Under the national Controlled Substances Act,
      possession of one ounce or less carries a maximum fine of $50; more than an ounce, up to 2.2
      lb, carries up to three months and a $500 fine. Each of the four states — Chuuk, Pohnpei, Yap
      and Kosrae — also has its own criminal code, so treatment varies.
    sources:
      - cr
      - code
  cultivation:
    text: Cultivation is prohibited under national and state law.
    sources:
      - cr
  enforcement:
    text: >-
      The statutory penalty for a small amount is among the lightest of any prohibition country,
      though foreign travel advisories still warn of severe treatment.
    sources:
      - cr
      - trip
  sharing:
    text: Supply is an offence with heavier penalties.
    sources:
      - cr
  consumption:
    text: Use is covered by the possession offence.
    sources:
      - trip
