    sources:
      - wiki
  consequences:
    text: The retained sources do not establish collateral consequences beyond the penalties described above.
    sources: []
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited.
    sources:
      - wiki
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone, so a visitor has no lawful way to buy
      cannabis. The sources behind this profile describe no separate rule for visitors.
    sources:
      - wiki
  black_market:
    text: >-
      Figures reported by the government to the UN drugs office record 110 kg of herbal
      cannabis seized in 2024, against 120 kg in 2023. The UN publishes them as kilogram
      equivalents, and countries count seizures differently, so the figures are not
      comparable across borders.
    sources:
      - unodc_szr
