segments:
  possession:
    text: >-
      Illegal. Possession or use of a personal amount can bring a fine or up to about five years in
      prison.
    sources:
      - wiki
  cultivation:
    text: Cultivation is a crime; the climate makes it rare.
    sources:
      - wiki
  enforcement:
    text: >-
      By one summary, offenders may be fined or sentenced to up to five years in prison for
      producing, selling or possessing cannabis. No account of enforcement was found; use is low,
      since the legal stimulant khat is preferred.
    sources:
      - wiki
  sharing:
    text: >-
      Sale carries the same range, a fine or up to five years by one summary. The port is a transit
      point for cannabis moving from Asia to Africa, the Middle East and Europe.
    sources:
      - wiki
  consumption:
    text: >-
      Use is an offence. Cannabis use is uncommon; the legal stimulant khat is the country's drug of
      choice.
    sources:
      - wiki
  access:
    text: No legal source.
    sources:
      - wiki
context:
  production:
    text: No licensed production.
    sources:
      - wiki
  products:
    text: Reliable national information about legally available cannabis products was not established by the retained sources.
    sources: []
  medical:
    text: No medical cannabis programme.
    sources:
      - wiki
  consequences:
    text: The retained sources do not establish collateral consequences beyond the penalties described above.
    sources: []
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited.
    sources:
      - wiki
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone, so a visitor has no lawful way to buy
      cannabis. The sources behind this profile describe no separate rule for visitors.
    sources:
      - wiki
  black_market:
    text: >-
      Figures reported by the government to the UN drugs office record 110 kg of herbal
      cannabis seized in 2024, against 120 kg in 2023. The UN publishes them as kilogram
      equivalents, and countries count seizures differently, so the figures are not
      comparable across borders.
    sources:
      - unodc_szr
