segments:
  possession:
    text: >-
      Illegal. Possession or use of a personal amount can bring a fine or up to about five years in
      prison.
    sources:
      - wiki
      - cr
  cultivation:
    text: Cultivation is a crime; the climate makes it rare.
    sources:
      - wiki
  enforcement:
    text: Fines or prison for users; long sentences for traffickers.
    sources:
      - cr
  sharing:
    text: Sale and supply are punished far more heavily, reportedly up to life.
    sources:
      - cr
  consumption:
    text: >-
      Use is an offence. Cannabis use is uncommon; the legal stimulant khat is the country's drug of
      choice.
