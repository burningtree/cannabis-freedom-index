segments:
  possession:
    text: >-
      Illegal. The Penal Code's section on trafficking and use of narcotics punishes illicit use
      with one year in prison and a fine of 200,000 francs (Article 359). Holding narcotics falls
      under Article 356, with transport, offer and sale: ten years in prison and a fine of 500
      million francs. The code sets no personal-use amount.
    sources:
      - cp
  cultivation:
    text: >-
      The Penal Code does not single out growing; producing narcotics falls under Article 355 with
      importing, manufacturing and exporting: twenty years of criminal imprisonment and a fine of
      500 million francs. The climate makes cultivation rare.
    sources:
      - cp
      - wiki
  enforcement:
    text: >-
      The code's penalties are heavy on paper: one year for use, ten for holding or selling,
      twenty for producing or importing, and life for leading a trafficking group. No account of
      how cases are handled in practice was found; use is low, since the legal stimulant khat is
      preferred.
    sources:
      - cp
      - wiki
  sharing:
    text: >-
      Selling or offering narcotics to a person for their own use carries five years in prison and
      a fine of 5 million francs, rising to ten years where minors, schools or government premises
      are involved (Article 358). Other sale, offer and transport carries ten years (Article 356).
      The port is a transit point for cannabis moving from Asia to Africa, the Middle East and
      Europe.
    sources:
      - cp
      - wiki
  consumption:
    text: >-
      Illicit use of narcotics is an offence under Article 359 of the Penal Code: one year in
      prison and a fine of 200,000 francs. Cannabis use is uncommon; the legal stimulant khat is
      the country's drug of choice.
    sources:
      - cp
      - wiki
  access:
    text: >-
      No legal source: the Penal Code punishes acquiring, holding, offering and selling narcotics
      alike.
    sources:
      - cp
context:
  production:
