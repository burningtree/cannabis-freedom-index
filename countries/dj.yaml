segments:
  possession:
    text: >-
      Article 356 of the 1995 Penal Code sets ten years and a 500 million franc fine for illicit
      possession, acquisition, transport or supply. The code defines no personal-use quantity.
      Articles 70–73 let courts impose just one listed penalty and reduce prison terms or fines, so
      the listed term and fine are not invariably imposed together.
    sources:
      - cp
  cultivation:
    text: >-
      Article 355 sets twenty years and a 500 million franc fine for illicit production,
      manufacture, import or export. It does not separately define a personal-growing tier. The
      general sentencing rules in Articles 70–73 allow one listed penalty alone and reductions in
      sentence.
    sources:
      - cp
  enforcement:
    text: >-
      In August 2026, the Einguella gendarmerie reported seizing 88 cannabis packages weighing 12 kg
      at a Balbala storage site. Several suspects were held in police custody pending presentation
      to justice authorities. This report does not establish the usual outcome of personal-use
      cases.
    sources:
      - rtd2026
  sharing:
    text: >-
      Giving or offering narcotics directly for another person’s consumption carries five years and
      a 5 million franc fine under Article 358, rising to ten years where minors, education centres
      or government premises are involved. General supply under Article 356 carries ten years.
      Articles 70–73 allow courts to select one penalty alone and reduce sentences.
    sources:
      - cp
  consumption:
    text: >-
      Article 359 sets one year and a 200,000 franc fine for illicit use. The general sentencing
      rules allow a court to impose a fine alone or a shorter prison term. The maximum written in
      the offence is not a mandatory one-year sentence.
    sources:
      - cp
  access:
    text: >-
      The Penal Code criminalises illicit acquisition, possession, offering and supply. Free-zone
      rules also expressly exclude cannabis, hashish and cannabis resin from the goods admitted to
      those commercial zones.
    sources:
      - cp
      - freezone
context:
  production:
    status: none
    text: No licensed production.
    sources:
      - wiki
  products:
    text: >-
      Reliable national information about legally available cannabis products was not established by
      the retained sources.
    sources: []
  medical:
    text: No medical cannabis programme.
    sources:
      - wiki
  consequences:
    text: >-
      For drug offences, courts can impose professional restrictions, suspend or cancel a driving
      licence and confiscate property. Article 366 permits permanent exclusion, or exclusion for up
      to ten years, of foreigners convicted under Articles 355–357; the clause does not list the
      separate simple-use offence in Article 359.
    sources:
      - cp
  clubs:
    status: none
    text: >-
      The Penal Code criminalises illicit production, possession and supply and provides no
      recreational cannabis-club exception.
    sources:
      - cp
  visitors:
    status: none
    text: >-
      Illicit possession and supply remain offences for visitors. Foreigners convicted of
      production, import, general possession or supply, or drug-money laundering under Articles
      355–357 can also be excluded permanently or for up to ten years. The foreigner-exclusion
      clause does not list simple use or direct supply to a consumer.
    sources:
      - cp
  black_market:
    text: >-
      Figures reported by the government to the UN drugs office record 110 kg of herbal cannabis
      seized in 2024, against 120 kg in 2023. The UN publishes them as kilogram equivalents, and
      countries count seizures differently, so the figures are not comparable across borders.
    sources:
      - unodc_szr
