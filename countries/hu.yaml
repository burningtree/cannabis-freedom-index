summary: >-
  Zero-tolerance policy, toughened further in 2025; diversion is available only for first-time
  small-quantity offenders.
scores:
  possession: 1
  cultivation: 1
  enforcement: 2
  sharing: 0
  consumption: 1
  access: 0
segments:
  possession:
    text: >-
      Possession or use of a small amount is a crime with up to two years in prison. A 'small
      amount' is defined by active content — up to 1 g of THC, which is a larger quantity of plant
      than most countries' thresholds. First-time offenders could avoid trial by completing a
      six-month diversion programme; since the 2025 crackdown that is available only if the person
      names their supplier, and only twice in a lifetime.
    sources:
      - wiki
      - cms
  cultivation:
    text: >-
      Growing a small amount for yourself falls under the same up-to-two-years offence; more is
      production.
    sources:
      - wiki
  enforcement:
    text: >-
      Among the EU's strictest regimes, tightened further in 2025 with a 'war on drugs' package that
      forces users into an informer role to avoid prosecution.
    sources:
      - cms
      - boc
  sharing:
    text: Supply is trafficking, with two to eight years or more.
    sources:
      - wiki
  consumption:
    text: >-
      Consumption itself is a criminal offence. In 2025 the constitution was amended to state that
      producing, using, distributing and promoting narcotics is prohibited in Hungary.
    sources:
      - boc
      - cms
  access:
    text: None.
    sources:
      - wiki
context:
  production:
    text: Industrial hemp only.
    sources:
      - wiki
  products:
    text: CBD products in a restricted grey zone.
    sources:
      - wiki
  medical:
    text: No medical cannabis programme.
    sources:
      - wiki
      - boc
  consequences:
    text: >-
      A conviction is a criminal record; even diversion involves six months of mandatory weekly
      sessions.
    sources:
      - wiki
  planting:
    seeds: licensed
    seeds_trade: regulated
    clones: licensed
    clones_trade: regulated
    text: >-
      Government Decree 162/2003 lets only low-THC hemp from the national or EU variety list
      be grown, sown from sealed certified seed, and only low-THC hemp seed may be put on the
      market. Breeding, research growing and seed production of high-THC hemp are reserved for
      organisations holding a licence from the public health authority. The decree does not
      mention cuttings.
    sources:
      - d162
  driving:
    status: impairment
    text: >-
      The criminal code punishes driving while impaired and sets no THC limit. Police may stop
      at random and test on suspicion; there is no roadside oral-fluid test, and blood is
      taken at a police station. The penalty is up to one year in prison where there are no
      aggravating circumstances, and a driving ban of one to ten years or for life.
    sources:
      - euda_dd
  arrests:
    text: >-
      The EU drugs agency's statistical bulletin records 3,845 cannabis-related drug law
      offences in Hungary in 2024, against 3,478 in 2023. Of the 2024 total, 3,266 were for
      use or possession for use. Countries count these differently (offences or offenders,
      criminal or administrative), so the figure is not comparable across borders.
    sources:
      - euda_dlo
  clubs:
    status: underground
    text: >-
      Clubs exist without any legal basis. A Europe-wide survey of cannabis social clubs
      carried out in 2018 and 2019 received answers from one club in Hungary, and its authors
      could not say how many more were active. The study notes that the model is prohibited
      throughout the European Union, that clubs sit in a legally sensitive position, and that
      many have been dissolved after court decisions or police raids. Nothing more recent was
      found.
    sources:
      - pardal20
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. British travel advice says illegal
      drugs, including cannabis, carry severe penalties and tells travellers to expect a long
      jail sentence and heavy fines for possessing, using or smuggling them, also when only
      changing planes. Airport scanners are also used on the baggage of passengers in transit.
    sources:
      - wiki
      - fcdo
