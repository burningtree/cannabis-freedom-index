name: Malta
region: Europe
iso_numeric: 470
recreational: legal
medical: legal
updated: 2026-10-04
summary: >-
  First EU country to legalise (2021): 7 g in public, 50 g at home, four plants per household, and
  licensed non-profit associations. Public consumption remains prohibited.
scores:
  possession: 4
  cultivation: 4
  enforcement: 6
  sharing: 2
  consumption: 3
  access: 4
segments:
  possession:
    text: >-
      Adults 18+ may carry up to 7 g in public and keep up to 50 g of dried cannabis at home.
      Between 7 g and 28 g in public is not a crime but goes to a tribunal with a fine of €50–100.
      Above 28 g, ordinary drug law applies.
    sources:
      - cap628
      - euda
  cultivation:
    text: >-
      Up to four plants per household (not per adult), which must not be visible from outside. The
      dried harvest kept at home may not exceed 50 g.
    sources:
      - cap628
      - euda
  enforcement:
    text: >-
      Among Europe's mildest for users: conduct inside the limits is unpunished, and small overages
      or public use are handled by a tribunal with fines rather than courts. Trafficking still
      carries prison.
    sources:
      - cap628
      - mt
  sharing:
    text: >-
      The law provides for personal use and for distribution by licensed associations to their own
      members. There is no explicit right to give cannabis to another adult, and supply outside an
      association remains trafficking.
    sources:
      - cap628
  consumption:
    text: >-
      Private only. Consuming in public is prohibited and fined €235; consuming in front of a minor
      is fined €300–500. Associations may not allow consumption on their premises.
    sources:
      - mt
      - cap628
  access:
    text: >-
      No shops. The only legal source besides home growing is a licensed non-profit Cannabis Harm
      Reduction Association: maximum 500 members, residents only, one association per person, at
      most 7 g a day and 50 g a month. Tourists have no legal source.
    sources:
      - aruc
      - cap628
context:
  production:
    text: >-
      Only licensed non-profit associations may grow, for their own members, under ARUC supervision
      and away from schools and youth centres. For-profit recreational production is not allowed.
      Medical production is separately licensed.
    sources:
      - aruc
  products:
    text: >-
      Associations distribute dried flower (and seeds). Edibles and concentrates are not part of the
      regulated adult-use channel. Advertising is banned.
    sources:
      - aruc
      - cap628
  medical:
    text: >-
      Legal since 2018 on prescription from a registered doctor, with an approval card for the
      patient, dispensed in pharmacies. Products are limited and paid out of pocket.
    sources:
      - euda
  consequences:
    text: >-
      People convicted of simple possession before the reform can have the conviction struck from
      their record. Association membership is recorded, though privacy rules limit access. Driving
      under the influence remains an offence.
    sources:
      - cap628
      - aruc
