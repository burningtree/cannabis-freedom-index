summary: >-
  All drugs were decriminalised in 2001: up to 25 g of flower is an administrative matter for a
  dissuasion commission. Cultivation remains a crime. Portugal is a major medical exporter.
scores:
  possession: 3
  cultivation: 1
  enforcement: 5
  sharing: 1
  consumption: 3
  access: 1
segments:
  possession:
    text: >-
      Since July 2001 possessing up to a ten-day supply — 25 g of cannabis flower or 5 g of hashish
      — is an administrative matter, not a crime. Police confiscate it and refer you to a regional
      dissuasion commission, which can suspend the case, fine you or recommend treatment. It is
      decriminalised, not legal.
    sources:
      - law
      - qmhc
  cultivation:
    text: >-
      Not covered by decriminalisation. Growing any number of plants, even one for yourself, is a
      criminal offence under the drug-trafficking law.
    sources:
      - qmhc
      - grow
  enforcement:
    text: >-
      Users are not prosecuted; sanctions are administrative and often waived. Growing and dealing
      carry prison sentences.
    sources:
      - qmhc
      - law
  sharing:
    text: >-
      Supplying cannabis to someone else is trafficking, with a reduced sentence available for
      people who deal only to fund their own use.
    sources:
      - qmhc
      - erowid
  consumption:
    text: >-
      Using is an administrative infraction handled by the dissuasion commission. In practice
      first-time non-dependent users usually have proceedings suspended with no sanction.
    sources:
      - law
      - qmhc
  access:
    text: >-
      No legal source for adult use: no shops, no clubs, no home growing. Bills to regulate have
      been debated without passing. The only lawful route is medical: since 2018 a doctor may
      prescribe approved cannabis preparations, dispensed in pharmacies, but few products are
      authorised and take-up is low.
    sources:
      - grow
      - qmhc
context:
  production:
    text: >-
      Portugal is one of Europe's largest licensed medical cannabis producers, with dozens of
      companies cultivating almost entirely for export under licence from the medicines agency.
    sources:
      - grow
  products:
    text: Low-THC hemp products and prescription medical preparations only.
    sources:
      - grow
  medical:
    text: >-
      Legal since 2018 and regulated by the medicines agency. A doctor may prescribe approved
      cannabis preparations when conventional treatments have failed, dispensed in pharmacies; few
      products are authorised and take-up is low.
    sources:
      - grow
      - qmhc
  consequences:
    text: >-
      No criminal record for use. Commission proceedings are confidential, though they can include
      bans on visiting certain places or holding certain licences.
    sources:
      - law
      - qmhc
  planting:
    seeds: licensed
    seeds_trade: regulated
    clones: licensed
    clones_trade: regulated
    text: >-
      Industrial hemp cultivation requires annual authorisation, certified seed and sowing under
      prescribed conditions; it must be grown outdoors from seed, and transplanting plants is not
      allowed. Medical cultivation and wholesale trade in the plant or parts of it are separately
      licensed through INFARMED. Seeds and clones are therefore confined to authorised industrial
      or medical channels, not general adult sale.
    sources:
      - hemp_rules
      - cannabis_rules
  driving:
    status: zero
    text: >-
      No THC limit is set: under the road law the offence is committed if a narcotic or
      psychotropic substance is detected. Police may stop at random and test on suspicion,
      with a roadside oral-fluid test and blood taken at a hospital. The road-law penalty is a
      fine of 500 to 2,500 euros and a ban of two months to two years; where danger is caused
      the criminal code allows up to three years in prison.
    sources:
      - euda_dd
  arrests:
    text: >-
      The EU drugs agency's statistical bulletin records 12,109 cannabis-related drug law
      offences in Portugal in 2024, against 16,304 in 2023. Of the 2024 total, 6,637 were for
      use or possession for use. Use is an administrative matter handled by dissuasion
      commissions, and the agency warns that the 2017 to 2021 figures are incomplete.
      Countries count these differently (offences or offenders, criminal or administrative),
      so the figure is not comparable across borders.
    sources:
      - euda_dlo
  clubs:
    status: underground
    text: >-
      The sources disagree. A Europe-wide survey of cannabis social clubs carried out in 2018
      and 2019 found, after online searches and contact with people in the field, that there
      did not seem to be any active club in Portugal. A 2024 trade-press guide describes
      private member associations that grow collectively for their members and operate
      discreetly in a legal grey area, mainly in Lisbon and Porto and reportedly in the
      Algarve; joining takes a referral from a member, often proof of Portuguese residency and
      an annual fee of 50 to 150 euros, and clubs vet newcomers carefully to avoid police
      attention. The authorities have not endorsed the clubs' reading of the law, and the
      model is prohibited throughout the European Union.
    sources:
      - pardal20
      - giq24
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. British travel advice says illegal
      drugs, including cannabis, carry severe penalties and tells travellers to expect a long
      jail sentence and heavy fines for smuggling them, also in transit. Airport scanners are
      also used on the baggage of passengers in transit.
    sources:
      - grow
      - qmhc
      - fcdo
