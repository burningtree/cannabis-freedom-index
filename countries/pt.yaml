name: Portugal
region: Europe
iso_numeric: 620
recreational: decriminalised
medical: legal
updated: '2026-10-27'
summary: >-
  All drugs were decriminalised in 2001. Since 1 October 2023, 25 g of flower and 5 g of hashish are
  the ten-day reference amounts: proven personal possession stays an administrative matter for a
  dissuasion commission even above them, while a larger amount can still start a criminal inquiry.
  Cultivation remains a crime. Portugal is a major medical exporter.
scores:
  possession: 3
  cultivation: 1
  enforcement: 5
  sharing: 1
  consumption: 3
  access: 1
segments:
  possession:
    text: >-
      Personal-use possession is an administrative offence under the [2001
      reform](/history/portugal-decriminalisation-2001/), with confiscation and referral to a
      dissuasion commission.[@use] Since [1 October
      2023](/history/portugal-personal-use-quantity-2023/), exceeding the ten-day reference amount
      is evidence of a possible different purpose, rather than an automatic possession crime: proven
      exclusive personal use is referred back to the commission.[@law55] The existing reference
      amounts are 25 g flower and 5 g resin.[@qmhc] For a non-dependent user, the statutory cannabis
      fine converts to €24.94–149.64; first cases without an earlier administrative proceeding must
      be provisionally suspended.[@use,euro]
    sources:
      - use
      - law55
      - qmhc
      - euro
    currency: EUR
    penalties:
      - label: Personal-use possession or use
        treatment: civil
        term: Law 30/2000, Articles 2, 11, 15–16
        fine_min: 24.94
        fine: 149.64
        note: >-
          Fine range for non-dependent users; first proceedings must be suspended if statutory
          conditions apply; dependent users receive non-monetary sanctions
  cultivation:
    text: >-
      Growing for personal use remains criminal under current Article 40(1): up to three months in
      prison or a fine of up to thirty days.[@drug] The court may waive punishment under paragraph
      5.[@drug] There is no statutory one-plant exemption; growing for supply falls under the
      separate trafficking provisions.[@drug]
    sources:
      - drug
    penalties:
      - label: Unauthorised cultivation for personal use
        treatment: criminal
        term: Decree-Law 15/93, Article 40(1), (5)
        prison: 3 months
        note: Or a fine of up to thirty days; punishment may be waived; no statutory plant allowance
      - label: Unauthorised cultivation for supply — ordinary offence
        treatment: criminal
        term: Article 21(1)
        prison_min: 4 years
        prison: 12 years
        note: Lesser-gravity and other special provisions can apply
  enforcement:
    text: >-
      Personal use and possession go through dissuasion commissions, with mandatory provisional
      suspension for a first non-dependent case where the statutory conditions apply.[@use] The 2023
      clarification keeps proven exclusive personal possession administrative even beyond the
      ten-day reference amount.[@law55] Cultivation and supplying another person remain outside that
      protection.[@drug]
    sources:
      - use
      - law55
      - drug
  sharing:
    text: >-
      Article 21 covers offering, giving and providing cannabis to another person as well as
      selling; its ordinary range is four–twelve years.[@drug] Considerably reduced seriousness can
      bring one–five years under Article 25.[@drug] Article 26 permits up to three years or a fine
      where the exclusive aim is obtaining drugs for personal use, but excludes holdings above its
      separate five-day amount.[@drug]
    sources:
      - drug
    penalties:
      - label: Ordinary unlawful cannabis supply, including giving
        treatment: criminal
        term: Article 21(1)
        prison_min: 4 years
        prison: 12 years
      - label: Trafficking of considerably reduced seriousness
        treatment: criminal
        term: Article 25(a)
        prison_min: 1 year
        prison: 5 years
      - label: Trafficker-consumer within the specific statutory conditions
        treatment: criminal
        term: Article 26(1), (3)
        prison: 3 years
        note: >-
          Or a criminal fine; exclusive personal-use funding purpose and no more than the five-day
          amount
  consumption:
    text: >-
      Use is an administrative offence, including in private.[@use] The commission must
      provisionally suspend a first non-dependent user’s proceeding where there is no previous
      proceeding under the law.[@use] Where a sanction is imposed, non-dependent users may receive a
      fine or a non-monetary measure; dependent users receive non-monetary sanctions.[@use]
    sources:
      - use
    currency: EUR
    penalties:
      - label: Cannabis consumption — administrative proceeding
        treatment: civil
        term: Law 30/2000, Articles 2, 11, 15–16
        fine_min: 24.94
        fine: 149.64
        note: >-
          Fine range for non-dependent users; first proceedings must be suspended if statutory
          conditions apply; dependent users receive non-monetary sanctions
  access:
    text: >-
      Decriminalisation provides no general recreational shop or supply authorisation, and personal
      growing remains criminal.[@drug,use] The [2018 medical law](/history/portugal-medical-2018/)
      permits prescribed authorised cannabis products dispensed through pharmacies.[@medical18]
      INFARMED’s first-half 2026 report lists sixteen marketing authorisations and 5,413 prescribed
      packages; authorisations are not a count of products stocked by every pharmacy.[@inf26]
    sources:
      - drug
      - use
      - medical18
      - inf26
context:
  recreational:
    text: >-
      Possession and consumption for personal use are administrative offences, handled through
      commissions rather than criminal sentencing.[@use] The ten-day amount guides assessment of
      purpose, while proven exclusive personal possession remains within that route above the
      reference.[@law55] Growing for personal use still carries a criminal penalty; supplying
      another person is separately punishable.[@drug]
    sources:
      - use
      - law55
      - drug
  production:
    status: medical
    text: >-
      INFARMED’s report records 27 valid cultivation authorisations and 24 manufacturing
      authorisations at its 2 June 2026 update.[@inf26] It reports exports of 66,305 kg of plant,
      preparations and substances in the first half of 2026, compared with 79,883 kg in all of
      2025.[@inf26] Germany was the largest destination, with 37,442 kg.[@inf26] Licensing and
      inspections cover security, records, traceability and product quality.[@inf26]
    sources:
      - inf26
  medical:
    text: >-
      Any doctor may prescribe authorised products for the approved indications when conventional
      treatment has failed or causes significant adverse effects, with dispensing confined to
      pharmacies.[@inf] The 2018 law also permits the patient to hold and transport the prescribed
      quantity for personal treatment.[@medical18] The first-half 2026 report records sixteen
      marketing authorisations and 5,413 prescribed packages, against 7,023 packages across
      2025.[@inf26] These package counts are not unique patient totals.[@inf26]
    sources:
      - inf
      - medical18
      - inf26
  consequences:
    text: >-
      Personal use or possession is an administrative offence rather than a criminal
      conviction.[@use] Commission sanctions can include restrictions on specified places,
      activities or travel and periodic reporting.[@use] Growing and supply remain criminal, so the
      personal-possession rule does not prevent a record for those offences.[@drug]
    sources:
      - use
      - drug
  planting:
    seeds: licensed
    seeds_trade: regulated
    clones: licensed
    clones_trade: regulated
    text: >-
      Certified sowing-seed producers must be licensed by DGAV, with common-catalogue varieties;
      seed multiplication above 0.3% THC also needs prior INFARMED permission.[@propagation]
      Producers of rooted clones require medical-cannabis licensing, phytosanitary registration and
      documented movements to other authorised professionals.[@propagation] Industrial
      fibre/feed-seed cultivation is a separate DGAV authorisation and does not allow
      transplants.[@dgav]
    sources:
      - propagation
      - dgav
  hemp:
    status: strict
    text: >-
      DGAV authorises cultivation for fibre and seeds not intended for sowing, including food or
      animal-feed uses.[@dgav] Applications are annual and require certified seed; the crop must be
      sown outdoors, without transplanting.[@dgav] The [March 2023
      amendment](/history/portugal-hemp-thc-limit-2023/) sets the statutory THC ceiling at no more
      than 0.3% for eligible common-catalogue varieties.[@hemp23] Other crop purposes require an
      INFARMED route.[@dgav]
    sources:
      - dgav
      - hemp23
  driving:
    status: impairment
    text: >-
      Driving under the influence of a psychotropic substance is forbidden.[@ce81,ce157,stj10] A
      driver is under that influence when an examination under the road code, and the rules that
      complement it, says so in a medical or expert report.[@ce81,ce157,stj10] Detection alone is
      not that report.[@ce81,ce157,stj10] The fine is 500 to 2,500 euros.[@ce81,ce157,stj10] Where
      there are signs of influence, or after a crash with a death or a serious injury, the driver is
      tested.[@ce81,ce157,stj10] A positive screen bars driving for 48 hours, unless a new screen is
      negative sooner.[@ce81,ce157,stj10] That bar is not the offence.[@ce81,ce157,stj10] A Supreme
      Court judgment published on 15 July 2024, about an insurer's claim after a crash, held that
      the insurer must prove the substance diminished the driver's fitness to drive safely, shown by
      a medical or expert examination.[@ce81,ce157,stj10] In that case 0.8 ng/mL of THC and 4.3
      ng/mL of THC-COOH, without such a report, did not establish influence.[@ce81,ce157,stj10]
    sources:
      - ce81
      - ce157
      - stj10
  arrests:
    text: >-
      The EU drugs agency's statistical bulletin records 12,109 cannabis-related drug law offences
      in Portugal in 2024, against 16,304 in 2023.[@euda_dlo] Of the 2024 total, 6,637 were for use
      or possession for use.[@euda_dlo] Use is an administrative matter handled by dissuasion
      commissions, and the agency warns that the 2017 to 2021 figures are incomplete.[@euda_dlo]
      Countries count these differently (offences or offenders, criminal or administrative), so the
      figure is not comparable across borders.[@euda_dlo]
    sources:
      - euda_dlo
  clubs:
    status: underground
    text: >-
      The sources disagree.[@pardal20,giq24,de_cang,mt_cap628] A Europe-wide survey of cannabis
      social clubs carried out in 2018 and 2019 found, after online searches and contact with people
      in the field, that there did not seem to be any active club in
      Portugal.[@pardal20,giq24,de_cang,mt_cap628] A 2024 trade-press guide describes private member
      associations that grow collectively for their members and operate discreetly in a legal grey
      area, mainly in Lisbon and Porto and reportedly in the Algarve; joining takes a referral from
      a member, often proof of Portuguese residency and an annual fee of 50 to 150 euros, and clubs
      vet newcomers carefully to avoid police attention.[@pardal20,giq24,de_cang,mt_cap628] The
      authorities have not endorsed the clubs' reading of the law, and no law in Portugal provides
      for them.[@pardal20,giq24,de_cang,mt_cap628] Malta (since 2021) and Germany (since 2024)
      license non-profit cannabis associations, but only under their own
      laws.[@pardal20,giq24,de_cang,mt_cap628]
    sources:
      - pardal20
      - giq24
      - de_cang
      - mt_cap628
  visitors:
    status: none
    text: >-
      There is no general recreational supply route, and growing for personal use remains a
      crime.[@drug] The personal-use administrative regime does not make cannabis a legal retail
      product.[@use,drug] Above the ten-day reference amount an inquiry may be needed; proven
      exclusive personal possession goes back to the commission.[@law55]
    sources:
      - drug
      - use
      - law55
  black_market:
    text: >-
      The EU drugs agency's statistical bulletin records 1,845 kg of herbal cannabis and 7,344 kg of
      cannabis resin seized in Portugal in 2024, against 1,549 kg and 37,945 kg in 2023.[@euda_szr]
      Herbal cannabis was seized on 798 occasions and resin on 4,446.[@euda_szr] Plant seizures came
      to 2,635 plants.[@euda_szr] Countries record seizures differently, so the figures are not
      comparable across borders.[@euda_szr]
    sources:
      - euda_szr
  culture:
    text: >-
      The [João Goulão atlas entry](/culture/people/joao-goulao/) follows the physician associated
      with Portugal’s approach to drug use.[@goulao26] In February 2026 parliament commended his
      role in designing, implementing and consolidating the prevention, harm-reduction and treatment
      model.[@goulao26] The [2001 reform](/history/portugal-decriminalisation-2001/) gives that
      approach a concrete mechanism: commission proceedings and conditional suspension for
      personal-use cases.[@use]
    sources:
      - goulao26
      - use
