name: Portugal
region: Europe
iso_numeric: 620
recreational: decriminalised
medical: legal
updated: 2026-10-04
summary: >-
  All drugs were decriminalised in 2001: up to 25 g of flower is an administrative matter for a
  dissuasion commission. Cultivation remains a crime. Portugal is a major medical exporter.
scores:
  possession: 3
  cultivation: 1
  enforcement: 5
  sharing: 1
  consumption: 3
  access: 0
segments:
  possession:
    text: >-
      Since July 2001 possessing up to a ten-day supply — 25 g of cannabis flower or 5 g of hashish
      — is an administrative matter, not a crime. Police confiscate it and refer you to a regional
      dissuasion commission, which can suspend the case, fine you or recommend treatment. It is
      decriminalised, not legal.
    sources:
      - law
      - qmhc
  cultivation:
    text: >-
      Not covered by decriminalisation. Growing any number of plants, even one for yourself, is a
      criminal offence under the drug-trafficking law.
    sources:
      - qmhc
      - grow
  enforcement:
    text: >-
      Users are not prosecuted; sanctions are administrative and often waived. Growing and dealing
      carry prison sentences.
    sources:
      - qmhc
      - law
  sharing:
    text: >-
      Supplying cannabis to someone else is trafficking, with a reduced sentence available for
      people who deal only to fund their own use.
    sources:
      - qmhc
      - erowid
  consumption:
    text: >-
      Using is an administrative infraction handled by the dissuasion commission. In practice
      first-time non-dependent users usually have proceedings suspended with no sanction.
    sources:
      - law
      - qmhc
  access:
    text: >-
      No legal source for adult use: no shops, no clubs, no home growing. Bills to regulate have
      been debated without passing.
    sources:
      - grow
      - qmhc
context:
  production:
    text: >-
      Portugal is one of Europe's largest licensed medical cannabis producers, with dozens of
      companies cultivating almost entirely for export under licence from the medicines agency.
    sources:
      - grow
  products:
    text: Low-THC hemp products and prescription medical preparations only.
    sources:
      - grow
  medical:
    text: >-
      Legal since 2018 and regulated by the medicines agency. A doctor may prescribe approved
      cannabis preparations when conventional treatments have failed, dispensed in pharmacies; few
      products are authorised and take-up is low.
    sources:
      - grow
      - qmhc
  consequences:
    text: >-
      No criminal record for use. Commission proceedings are confidential, though they can include
      bans on visiting certain places or holding certain licences.
    sources:
      - law
      - qmhc
