name: Portugal
region: Europe
iso_numeric: 620
recreational: decriminalised
medical: legal
updated: 2026-10-23
summary: >-
  All drugs were decriminalised in 2001. Since 1 October 2023, 25 g of flower and 5 g of hashish
  are the ten-day reference amounts: proven personal possession stays an administrative matter
  for a dissuasion commission even above them, while a larger amount can still start a criminal
  inquiry. Cultivation remains a crime. Portugal is a major medical exporter.
scores:
  possession: 3
  cultivation: 1
  enforcement: 5
  sharing: 1
  consumption: 3
  access: 1
segments:
  possession:
    text: >-
      Since July 2001, possession for personal use is an administrative matter. Police confiscate
      the cannabis and refer the person to a regional dissuasion commission, which can suspend
      the case, fine them or recommend treatment. Since 1 October 2023 the figures of 25 g of
      flower and 5 g of hashish are the average ten-day amounts. Holding more is a sign that the
      purpose may be something other than personal use, and the police can still seize it and
      open an inquiry. Where a judicial authority finds the cannabis was only for personal use,
      it closes the criminal case and sends the person to the commission.
    sources:
      - law
      - law55
      - qmhc
    penalties:
      - label: Personal-use possession (administrative)
        treatment: civil
        note: Confiscation and referral to a dissuasion commission, which can suspend the case, fine or recommend treatment; 25 g flower and 5 g hashish are the ten-day reference amounts
  cultivation:
    text: >-
      Not covered by decriminalisation. Growing any number of plants, even one for yourself, is a
      criminal offence under the drug-trafficking law.
    sources:
      - qmhc
      - grow
  enforcement:
    text: >-
      Personal use is handled with administrative sanctions, often waived. Above the ten-day
      reference amount, a criminal inquiry can continue until exclusive personal use is shown.
      Growing and dealing carry prison sentences.
    sources:
      - qmhc
      - law
      - law55
  sharing:
    text: >-
      Supplying cannabis to someone else is trafficking, with a reduced sentence available for
      people who deal only to fund their own use.
    sources:
      - qmhc
      - erowid
  consumption:
    text: >-
      Using is an administrative infraction handled by the dissuasion commission. In practice
      first-time non-dependent users usually have proceedings suspended with no sanction.
    sources:
      - law
      - qmhc
  access:
    text: >-
      No legal source for adult use: no shops, no clubs, no home growing. Bills to regulate have
      been debated without passing. The only lawful route is medical: since 2018 a doctor may
      prescribe approved cannabis preparations, dispensed in pharmacies, but few products are
      authorised and take-up is low.
    sources:
      - grow
      - qmhc
context:
  recreational:
    text: >-
      There is no legal recreational supply. Since 2001 personal-use possession is
      administrative: police confiscate and refer to a dissuasion commission, which can
      suspend, fine or recommend treatment. 25 g of flower and 5 g of hashish are the
      average ten-day amounts; more signals possible dealing.[@law,law55,qmhc] Growing any
      number of plants, even one, stays criminal.[@qmhc,grow]
    sources:
      - law
      - law55
      - qmhc
      - grow
  production:
    status: medical
    text: >-
      Portugal is one of Europe's largest licensed medical cannabis producers, with dozens of
      companies cultivating almost entirely for export under licence from the medicines agency.
    sources:
      - grow
  products:
    text: Low-THC hemp products and prescription medical preparations only.
    sources:
      - grow
  medical:
    text: >-
      Legal since 2018 and regulated by the medicines agency. A doctor may prescribe approved
      cannabis preparations when conventional treatments have failed, dispensed in pharmacies; few
      products are authorised and take-up is low.
    sources:
      - grow
      - qmhc
  consequences:
    text: >-
      No criminal record for use. Commission proceedings are confidential, though they can include
      bans on visiting certain places or holding certain licences.
    sources:
      - law
      - qmhc
  planting:
    seeds: licensed
    seeds_trade: regulated
    clones: licensed
    clones_trade: regulated
    text: >-
      Industrial hemp cultivation requires annual authorisation, certified seed and sowing under
      prescribed conditions; it must be grown outdoors from seed, and transplanting plants is not
      allowed. Medical cultivation and wholesale trade in the plant or parts of it are separately
      licensed through INFARMED. Seeds and clones are therefore confined to authorised industrial
      or medical channels, not general adult sale.
    sources:
      - hemp_rules
      - cannabis_rules
  hemp:
    status: strict
    text: >-
      Industrial hemp needs annual authorisation, certified seed and sowing outdoors from
      seed under prescribed conditions; transplanting plants is not allowed.[@hemp_rules]
      Medical cultivation and wholesale go through separate INFARMED licences.[@cannabis_rules]
    sources:
      - hemp_rules
      - cannabis_rules
  driving:
    status: impairment
    text: >-
      Driving under the influence of a psychotropic substance is forbidden. A driver is under
      that influence when an examination under the road code, and the rules that complement it,
      says so in a medical or expert report. Detection alone is not that report. The fine is
      500 to 2,500 euros. Where there are signs of influence, or after a crash with a death or
      a serious injury, the driver is tested. A positive screen bars driving for 48 hours,
      unless a new screen is negative sooner. That bar is not the offence. A Supreme Court
      judgment published on 15 July 2024, about an insurer's claim after a crash, held that
      the insurer must prove the substance diminished the driver's fitness to drive safely,
      shown by a medical or expert examination. In that case 0.8 ng/mL of THC and 4.3 ng/mL
      of THC-COOH, without such a report, did not establish influence.
    sources:
      - ce81
      - ce157
      - stj10
  arrests:
    text: >-
      The EU drugs agency's statistical bulletin records 12,109 cannabis-related drug law
      offences in Portugal in 2024, against 16,304 in 2023. Of the 2024 total, 6,637 were for
      use or possession for use. Use is an administrative matter handled by dissuasion
      commissions, and the agency warns that the 2017 to 2021 figures are incomplete.
      Countries count these differently (offences or offenders, criminal or administrative),
      so the figure is not comparable across borders.
    sources:
      - euda_dlo
  clubs:
    status: underground
    text: >-
      The sources disagree. A Europe-wide survey of cannabis social clubs carried out in 2018 and
      2019 found, after online searches and contact with people in the field, that there did not
      seem to be any active club in Portugal. A 2024 trade-press guide describes private member
      associations that grow collectively for their members and operate discreetly in a legal grey
      area, mainly in Lisbon and Porto and reportedly in the Algarve; joining takes a referral from
      a member, often proof of Portuguese residency and an annual fee of 50 to 150 euros, and clubs
      vet newcomers carefully to avoid police attention. The authorities have not endorsed the
      clubs' reading of the law, and no law in Portugal provides for them. Malta (since 2021) and
      Germany (since 2024) license non-profit cannabis associations, but only under their own laws.
    sources:
      - pardal20
      - giq24
      - de_cang
      - mt_cap628
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. Possession for personal use is an
      administrative matter: police confiscate it and refer the person to a regional dissuasion
      commission, which can suspend the case, fine them or recommend treatment. Since 1 October
      2023, 25 g of flower and 5 g of hashish are reference amounts for ten days. A larger amount
      can still start a criminal inquiry until exclusive personal use is shown.
    sources:
      - law
      - law55
      - qmhc
  black_market:
    text: >-
      The EU drugs agency's statistical bulletin records 1,845 kg of herbal cannabis and
      7,344 kg of cannabis resin seized in Portugal in 2024, against 1,549 kg and 37,945
      kg in 2023. Herbal cannabis was seized on 798 occasions and resin on 4,446. Plant seizures came to 2,635 plants. Countries record seizures differently, so the
      figures are not comparable across borders.
    sources:
      - euda_szr
