  consequences:
    text: >-
      A user who does not enter the required bond, or who breaches it, is sent to a
      rehabilitation centre for three months. A flagrant breach of that centre's rules brings
      unpaid manual work of 45 to 90 hours a week.
    sources:
      - gnlm26
  planting:
    seeds: grey
    seeds_trade: unclear
    clones: illegal
    clones_trade: banned
    text: >-
      The 1993 narcotics law counts the cannabis plant itself as a narcotic drug and punishes
      cultivating it with five to ten years in prison. The law does not mention seeds.
    sources:
      - ndps93
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited, and the law provides for the death
      penalty for the most serious drug offences.
    sources:
      - tni
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. Holding even a small quantity for
      personal use carries five to ten years in prison under Section 16 of the 1993 narcotics
      law. More than 100 grams of marijuana, marijuana extract, or both is deemed possession
      for sale.
    sources:
      - tni18
      - law
      - gnlm26
  black_market:
    text: >-
      Cannabis is a small part of the drugs the authorities seize. Among the drugs seized
      between June 2024 and May 2025 and burned in June 2025 were over 597 kg of
      marijuana, against 1,744 kg of heroin, over 1,334 kg of opium, over 8,573 kg of
      ketamine and 281 million methamphetamine tablets.
    sources:
      - dvb25
