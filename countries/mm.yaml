name: Myanmar
region: Asia
iso_numeric: 104
recreational: death
medical: none
updated: '2026-10-28'
summary: >-
  Drug use itself carries no prison term. A user who does not enter the required treatment
  bond, or who breaks it, is sent to a rehabilitation centre for three months. Possession
  still carries multi-year minimum sentences, and more than 100 grams is deemed to be for sale.
scores:
  possession: 0
  cultivation: 0
  enforcement: 1
  sharing: 0
  consumption: 2
  access: 0
segments:
  possession:
    text: >-
      Possession remains a serious crime under the 1993 narcotics law: a person caught with even
      a small quantity for personal use risks five to ten years in prison, and may also be fined,
      under Section 16.[@ndps93] In 2018 parliament rejected a clause that would have spared small
      amounts, and softened only the treatment of use.[@tni18] The 2025 amendment deems possession
      of more than 100 grams of marijuana, marijuana extract, or both to be possession for
      sale.[@gnlm26]
    sources:
      - ndps93
      - tni18
      - gnlm26
    penalties:
      - label: Small quantity for personal use, Section 16
        treatment: criminal
        term: Possession
        prison_min: 5 years
        prison: 10 years
        note: A fine may also be imposed
      - label: Over 100 g, deemed for sale (2025)
        treatment: criminal
        term: Possession for sale
        note: Moves to the ten-years-to-life sale tier under Section 19
  cultivation:
    text: >-
      Cultivation of any amount carries five to ten years and a fine under Section 16(a), not
      merely a five-year minimum.[@ndps93] Production for sale falls under the
      fifteen-years-to-death trafficking tier.[@gnlm26]
    sources:
      - ndps93
      - gnlm26
    penalties:
      - label: Cultivation, Section 16(a)
        treatment: criminal
        term: Cultivation
        prison_min: 5 years
        prison: 10 years
        note: A fine may also be imposed
  enforcement:
    text: >-
      Possession and cultivation carry five to ten years; sale and production carry ten years to
      life, and production, sale or import and export fifteen years to life or death.[@ndps93,gnlm26]
      Police reported 3,832 drug cases and 5,286 prosecutions in January–August 2024; the figures
      cover all drugs.[@incsr25] Since the 2021 coup, enforcement has become more
      arbitrary.[@tni,idpc]
    sources:
      - ndps93
      - gnlm26
      - incsr25
      - tni
      - idpc
  sharing:
    text: >-
      Possession or transport for sale carries ten years to life, and production, sale, import or
      export carries fifteen years to life imprisonment, or death.[@ndps93,gnlm26] The 2025
      amendment defines life imprisonment as incarceration until death.[@gnlm26]
    sources:
      - ndps93
      - gnlm26
    penalties:
      - label: Possession or transport for sale
        treatment: criminal
        term: Possession for sale
        prison_min: 10 years
        note: Ten years to life imprisonment
      - label: Production, sale, import or export
        treatment: criminal
        term: Trafficking
        prison_min: 15 years
        death: true
        note: Fifteen years to life imprisonment, or death; life means incarceration until death
  consumption:
    text: >-
      Drug use itself carries no prison term. A court must send a user to a rehabilitation centre
      for three months when the user does not enter the required bond or breaches its conditions.
      A user sent there who flagrantly breaks the centre's rules must do unpaid manual work, such
      as cleaning, repairing roads and bridges or planting trees, for 45 to 90 hours a
      week.[@gnlm26,idpc]
    sources:
      - gnlm26
      - idpc
  access:
    text: >-
      None. The cannabis plant itself is a narcotic drug under the 1993 law, and no medical, hemp
      or CBD exception was found.[@ndps93] The 2019 Mandalay hemp prosecution is the leading
      example.[@voa19]
    sources:
      - ndps93
      - voa19
context:
  death_penalty:
    text: >-
      Production, sale, import or export carries fifteen years to life imprisonment, or death.
      The 2025 amendment defines life imprisonment as incarceration until death.[@ndps93,gnlm26]
    sources:
      - ndps93
      - gnlm26
  recreational:
    text: >-
      All recreational use is prohibited. Possession of even a small quantity for personal use
      risks five to ten years, over 100 g is deemed for sale, and trafficking can bring death;
      use itself leads to treatment rather than prison.[@tni18,tni,law,gnlm26,idpc]
    sources:
      - tni18
      - tni
      - law
      - gnlm26
      - idpc
  production:
    status: none
    text: >-
      No lawful cannabis production. Cultivation carries five to ten years; production for sale
      falls under the fifteen-years-to-death trafficking tier.[@ndps93,gnlm26]
    sources:
      - ndps93
      - gnlm26
  medical:
    text: >-
      No medical cannabis. The 1993 law defines the cannabis plant as a narcotic and makes no
      hemp, CBD or patient exception; the 2019 Mandalay hemp prosecution is the leading
      example.[@ndps93,voa19]
    sources:
      - ndps93
      - voa19
  consequences:
    text: >-
      A user who does not enter the required bond, or who breaches it, is sent to a
      rehabilitation centre for three months. A flagrant breach of that centre's rules brings
      unpaid manual work of 45 to 90 hours a week.[@gnlm26]
    sources:
      - gnlm26
  planting:
    seeds: grey
    seeds_trade: unclear
    clones: illegal
    clones_trade: banned
    text: >-
      The 1993 narcotics law counts the cannabis plant itself as a narcotic drug and punishes
      cultivating it with five to ten years in prison.[@ndps93] The law does not mention
      seeds.[@ndps93]
    sources:
      - ndps93
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited, and the law provides for the death
      penalty for the most serious drug offences.[@ndps93,gnlm26]
    sources:
      - ndps93
      - gnlm26
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone.[@ndps93] Holding even a small quantity
      for personal use carries five to ten years in prison under Section 16 of the 1993 narcotics
      law.[@ndps93] More than 100 grams of marijuana, marijuana extract, or both is deemed
      possession for sale.[@gnlm26]
    sources:
      - ndps93
      - gnlm26
  black_market:
    text: >-
      Cannabis is a small part of the drugs the authorities seize. Among the drugs seized between
      June 2024 and May 2025 and burned in June 2025 were over 597 kg of marijuana, against
      1,744 kg of heroin, over 1,334 kg of opium, over 8,573 kg of ketamine and 281 million
      methamphetamine tablets.[@dvb25] On 26 June 2026 the regime burned more than 50 tonnes of
      drugs, including marijuana, valued at about US$600 million.[@ap26] Cultivation has spread in
      Ayadaw township and along the Myinmu border in southern Sagaing since 2022–23, with
      residents estimating more than thirty acres across six villages.[@irrawaddy25] No
      cannabis-only seizure series is published.[@incsr25]
    sources:
      - dvb25
      - ap26
      - irrawaddy25
      - incsr25
  hemp:
    status: none
    text: >-
      No legal hemp category or THC threshold. The 1993 law treats the cannabis plant itself as a
      narcotic drug, with no distinction for fibre or low-THC varieties.[@ndps93] In 2019 police
      raided a 20-acre plantation whose operator claimed industrial-hemp and CBD permission; the
      supervisor was sentenced to twenty years.[@voa19]
    sources:
      - ndps93
      - voa19
  driving:
    status: impairment
    text: >-
      The Road Safety and Motor Vehicle Management Law 2020 prohibits driving under the influence
      of narcotic or psychotropic substances, with up to one month in prison or a 100,000 kyat
      fine, or both; a repeat within a year brings up to three months or 300,000 kyats.[@road2020]
      A crash causing death can also be prosecuted under the Penal Code, with up to seven years,
      or ten where the driver had knowledge.[@penalcode] The rule is impairment-based, with no
      THC blood limit.[@road2020]
    sources:
      - road2020
      - penalcode
  arrests:
    text: >-
      Police reported 3,832 drug cases and 5,286 prosecutions in January–August 2024; the figures
      cover all drugs.[@incsr25] Seizures from June 2024 to May 2025 included 597 kg of marijuana,
      alongside 1,744 kg of heroin and 281 million methamphetamine tablets.[@dvb25] On 26 June
      2026 the regime burned more than 50 tonnes of drugs, including marijuana, valued at about
      US$600 million.[@ap26] No cannabis-only arrest count is published.[@incsr25]
    sources:
      - incsr25
      - dvb25
      - ap26
