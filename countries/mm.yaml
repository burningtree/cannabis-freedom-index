segments:
  possession:
    text: >-
      Possession remains a serious crime under the 1993 narcotics law: a person caught with even
      a small quantity for personal use risks five to ten years in prison under Section 16. In
      2018 parliament rejected a clause that would have spared small amounts, and softened only
      the treatment of use.
    sources:
      - tni18
      - tni
      - law
  cultivation:
    text: Cultivation carries a minimum of five years.
    sources:
      - tni
  enforcement:
    text: >-
      A public-health reform on paper, undermined because users are usually caught in possession.
      Since the 2021 coup, enforcement has become more arbitrary.
    sources:
      - tni
      - idpc
  sharing:
    text: Production, sale, import or export carries fifteen years to an unlimited term, or death.
    sources:
      - tni
  consumption:
    text: >-
      Since 2018 drug use itself is no longer punished with prison: users are required to register
      for treatment and can be ordered to do community service such as cleaning or road repair.
    sources:
      - idpc
      - law
  access:
    text: None.
    sources:
      - tni
