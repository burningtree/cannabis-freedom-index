segments:
  possession:
    text: >-
      Possession remains a serious crime under the 1993 narcotics law: a person caught with even
      a small quantity for personal use risks five to ten years in prison under Section 16. In
      2018 parliament rejected a clause that would have spared small amounts, and softened only
      the treatment of use. The 2025 amendment deems possession of more than 100 grams of
      marijuana, marijuana extract, or both to be possession for sale.
    sources:
      - tni18
      - tni
      - law
      - gnlm26
  cultivation:
    text: Cultivation carries a minimum of five years.
    sources:
      - tni
  enforcement:
    text: >-
      A public-health reform on paper, undermined because users are usually caught in possession.
      Since the 2021 coup, enforcement has become more arbitrary.
    sources:
      - tni
      - idpc
  sharing:
    text: >-
      Production, sale, import or export carries fifteen years to life imprisonment, or death.
      The 2025 amendment defines life imprisonment as incarceration until death.
    sources:
      - tni
      - gnlm26
  consumption:
    text: >-
      Drug use itself carries no prison term. A court must send a user to a rehabilitation centre
      for three months when the user does not enter the required bond or breaches its conditions.
      A user sent there who flagrantly breaks the centre's rules must do unpaid manual work, such
      as cleaning, repairing roads and bridges or planting trees, for 45 to 90 hours a week.
    sources:
      - gnlm26
      - idpc
  access:
    text: None.
    sources:
      - tni
