summary: >-
  Cannabis is illegal under the Narcotic Drugs Ordinance, but since 2021 the prosecution guideline
  drops cases of up to 5 g once the drugs are surrendered. Between 5 and 250 g prosecutors ask for at
  most a month in prison, often suspended. There is no legal source, medical or recreational.
scores:
  possession: 3
