segments:
  possession:
    text: >-
      Possession is an offence under the Landsverordening verdovende middelen, which distinguishes
      soft drugs from hard drugs. Under the prosecutor-general's guideline in force since 11 February
      2021, a user amount of up to 5 g of soft drugs is dropped once the drugs are surrendered, unless
      combined with another offence, in repeat cases, for minors, or in places such as a carnival
      parade, a workplace or a government building. For 5 to 250 g the demand is at most one month in
      prison, wholly or partly suspended, with three years' probation.
    sources:
      - om21
  cultivation:
    text: >-
      Growing cannabis is an offence under the ordinance. The guideline sets no lenient amount for
      plants; penalties follow the quantity involved.
    sources:
      - om21
  enforcement:
    text: >-
      Small amounts are seized and destroyed without prosecution, and penalties above that rise with
      the quantity, halved compared with cocaine from 250 g. Resident first offenders are usually
      offered partly suspended sentences.
    sources:
      - om21
  sharing:
    text: >-
      Intermediaries in soft drugs face demands of up to two months for 5 to 250 g, organisers up to
      four. No exception is made for sharing without payment.
    sources:
      - om21
  consumption:
    text: >-
      Small personal amounts are not prosecuted for adults, but use in public places such as carnival
      parades or government buildings removes the leniency, and minors with a user amount are
      prosecuted so that help can be imposed.
    sources:
      - om21
  access:
    text: >-
      No legal source. No medical cannabis programme is in operation.
    sources:
      - om21
context:
  production:
    text: >-
      None licensed.
    sources:
      - om21
  products:
    text: >-
      No legal cannabis products.
    sources:
      - om21
  medical:
    text: >-
      No medical cannabis programme is in operation; the prosecution guideline makes no exception for
      medical users.
    sources:
      - om21
  consequences:
    text: >-
      Drugs are always seized and destroyed, and the prosecution service aims to confiscate criminal
      proceeds. Repeat offences within five years raise the penalty demand.
    sources:
      - om21
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and there is no coffeeshop tolerance.
    sources:
      - om21
  visitors:
    status: none
    text: >-
      There is no legal supply for anyone. The guideline generally does not offer probation-service
      reports to non-residents, and suspended sentences are aimed at residents.
    sources:
      - om21
