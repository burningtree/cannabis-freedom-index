name: Aruba
region: North America
iso_numeric: 533
dependency:
  of: nl
  kind: Country within the Kingdom of the Netherlands
  note: >-
    Aruba is a self-governing country within the Kingdom of the Netherlands, with its own
    parliament, criminal law and public prosecution service. The Dutch coffeeshop policy does
    not apply there.
recreational: illegal
medical: none
updated: "2026-10-23"
summary: >-
  Cannabis possession remains an offence, but the revised 2025 prosecution instruction provides
  for surrender and dismissal in the 0–30 g band, with exceptions. Larger personal amounts can
  attract fine requests. Low-THC CBD has a separate medicinal import route.
# the search-result description, where the generated one runs long (src/lib/seo.js)
seo_description: >-
  Cannabis is illegal in Aruba, but prosecutors dismiss cases of up to 30 g once the cannabis is
  surrendered, with exceptions; larger amounts can bring a fine. No medical cannabis.
