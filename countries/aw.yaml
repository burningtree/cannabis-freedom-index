segments:
  possession:
    text: >-
      Cannabis possession is prohibited under the ordinance.[@amendment] The revised prosecution
      instruction sets surrender and dismissal for the 0–30 g soft-drug band, with exceptions
      for minors, repeat offending, another offence and specified settings.[@om25] The next
      30–100 g band has a proposed fine of AWG 250.[@om25]
    sources:
      - amendment
      - om25
  cultivation:
    text: >-
      The ordinance’s cannabis controls cover growing, preparation and manufacture.[@amendment]
      The government created a medicinal-cannabis agency and invited proposals for licensed
      production, with awards contingent on legislative changes and agreements.[@bureau, rfp] In
      a documented individual case, the minister refused a business cultivation permission in
      March 2023.[@court]
    sources:
      - amendment
      - bureau
      - rfp
      - court
  enforcement:
    text: >-
      The revised instruction governs prosecution decisions and sentencing requests.[@om25] Its
      possession/courier table calls for fines of AWG 250 in the 30–100 g band, AWG 750 in the
      100–300 g band and AWG 1,500 in the 300–500 g band; from 500 g, requests are half the
      hard-drug table.[@om25] Qualifying resident defendants can receive a request for a wholly
      or partly suspended sentence with three years’ probation.[@om25]
    sources:
      - om25
  sharing:
    text: >-
      The ordinance controls selling, delivering and supplying cannabis.[@amendment] The
      instruction distinguishes users, dealers and people organising transport; it says a
      dealer’s duration of activity, intensity and profit can be more useful sentencing factors
      than the quantity found.[@om25]
    sources:
      - amendment
      - om25
  consumption:
    text: >-
      The ordinance prohibits using cannabis alongside possession.[@amendment] The
      small-quantity prosecution policy has exceptions for possession during a carnival parade,
      at work or in a government building, as well as for minors and repeat offending.[@om25]
    sources:
      - amendment
      - om25
  access:
    text: >-
      Commercial import, storage and distribution of CBD medicines with no more than 0.2% THC
      require ministerial permission following a health-inspectorate assessment.[@iva] Growing
      and supplying other cannabis remain controlled by the ordinance; the government’s
      medicinal-production invitation made awards contingent on legislation and
      agreements.[@amendment, rfp]
    sources:
      - iva
      - amendment
      - rfp
context:
  production:
    status: none
    text: >-
      The medicinal-cannabis agency was created to supervise cultivation, manufacturing, quality
      and trade, including stocks and exports.[@bureau] A subsequent invitation sought proposals
      for cultivation, processing, or both, with limited exemptions to follow agreements and
      legislative changes.[@rfp]
    sources:
      - bureau
      - rfp
  products:
    text: >-
      The 2019 rules designated CBD and its preparations as medicines, including preparations
      combined with THC, and excluded CBD preparations with no more than 0.2% THC from a
      narcotics designation.[@cbd82, cbd83] The separate exception for specified supplements,
      foods and external-use products was withdrawn in January 2020.[@repeal] Current commercial
      guidance applies a 0.2% THC maximum to the CBD medicinal import route.[@iva]
    sources:
      - cbd82
      - cbd83
      - repeal
      - iva
  medical:
    text: >-
      CBD products with no more than 0.2% THC are treated as medicines under the health
      inspectorate’s import rules.[@iva] The government’s medicinal-cannabis production
      proposals required further legislative changes and agreements before awards.[@rfp] A later
      court record documents one business being refused growing and manufacturing permission in
      2023.[@court]
    sources:
      - iva
      - rfp
      - court
  consequences:
    text: >-
      The prosecution instruction calls for confiscation and destruction of drugs and seeks
      recovery of criminal proceeds.[@om25] Repeat offending within five years raises the
      sentencing request; the person’s role, profit and circumstances also matter.[@om25]
    sources:
      - om25
  clubs:
    status: none
    text: >-
      The ordinance prohibits growing and supplying cannabis outside its
      permissions.[@amendment] The medicinal-production invitation concerns selected operators
      working under agreements and exemptions.[@rfp]
    sources:
      - amendment
      - rfp
  visitors:
    status: none
    text: >-
      The instruction’s small-quantity table is expressed in quantities and circumstances;
      separate guidance on suspended sentencing requests applies to qualifying Aruba
      residents.[@om25] It generally does not request probation-service reports for
      non-residents, while allowing defendants or lawyers to present personal
      circumstances.[@om25]
    sources:
      - om25
