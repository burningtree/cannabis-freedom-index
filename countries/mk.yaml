segments:
  possession:
    text: >-
      Possession for personal use is not explicitly criminalised as such, but there is no defined
      threshold, and people caught with small amounts are routinely charged under the offence of
      'enabling the use of narcotics' or with unauthorised production and trade. In practice it is
      treated as a crime.
    sources:
      - gi
  cultivation:
    text: Unlicensed cultivation is a crime with prison.
    sources:
      - gi
      - kp
  enforcement:
    text: >-
      Users are prosecuted through neighbouring offences; sentences for production and trade are
      heavy.
    sources:
      - gi
  sharing:
    text: Supply is a crime.
    sources:
      - gi
  consumption:
    text: >-
      Use is not itself an offence in the Criminal Code, though it brings police attention and
      related charges.
    sources:
      - gi
  access:
    text: No adult-use source. Pharmacies can dispense cannabis oils on prescription.
    sources:
      - pp
      - kp
context:
  production:
    text: >-
      Medical cultivation and manufacturing were legalised in March 2016, and by 2022 the state had
      issued 66 licences — far more than the domestic market needs. Exports were at first limited to
      oils and extracts, with dried flower exports opened later; diversion from licensed sites has
      been a recurring scandal.
    sources:
      - pp
      - gi
  products:
    text: Prescription oils and extracts.
    sources:
      - kp
      - pp
  medical:
    text: >-
      Legal since 2016 for a list of serious conditions, on specialist prescription, dispensed in
      pharmacies.
    sources:
      - kp
      - pp
  consequences:
    text: A conviction is a criminal record.
    sources:
      - gi
  planting:
    seeds: licensed
    seeds_trade: regulated
    clones: licensed
    clones_trade: regulated
    text: >-
      The narcotics law defines medical cannabis as all above-ground parts of the plant
      "including the seeds". Cannabis may be grown only for medical or scientific purposes, by
      companies holding health ministry approval given with the government's consent, and they
      need a further approval from the agriculture ministry before sowing or planting.
    sources:
      - cms
