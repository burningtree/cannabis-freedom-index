segments:
  possession:
    text: >-
      Possession for personal use is not explicitly criminalised as such, but there is no defined
      threshold, and people caught with small amounts are routinely charged under the offence of
      'enabling the use of narcotics' or with unauthorised production and trade. In practice it is
      treated as a crime.
    sources:
      - gi
  cultivation:
    text: Unlicensed cultivation is a crime with prison.
    sources:
      - gi
      - kp
  enforcement:
    text: >-
      Users are prosecuted through neighbouring offences; sentences for production and trade are
      heavy.
    sources:
      - gi
  sharing:
    text: Supply is a crime.
    sources:
      - gi
  consumption:
    text: >-
      Use is not itself an offence in the Criminal Code, though it brings police attention and
      related charges.
    sources:
      - gi
  access:
    text: No adult-use source. Pharmacies can dispense cannabis oils on prescription.
    sources:
      - pp
      - kp
context:
  production:
    text: >-
      Medical cultivation and manufacturing were legalised in March 2016, and by 2022 the state had
      issued 66 licences — far more than the domestic market needs. Exports were at first limited to
      oils and extracts, with dried flower exports opened later; diversion from licensed sites has
      been a recurring scandal.
    sources:
      - pp
      - gi
  products:
    text: Prescription oils and extracts.
    sources:
      - kp
      - pp
  medical:
    text: >-
      Legal since 2016 for a list of serious conditions, on specialist prescription, dispensed in
      pharmacies.
    sources:
      - kp
      - pp
  consequences:
    text: A conviction is a criminal record.
    sources:
      - gi
  planting:
    seeds: licensed
    seeds_trade: regulated
    clones: licensed
    clones_trade: regulated
    text: >-
      The narcotics law defines medical cannabis as all above-ground parts of the plant
      "including the seeds". Cannabis may be grown only for medical or scientific purposes, by
      companies holding health ministry approval given with the government's consent, and they
      need a further approval from the agriculture ministry before sowing or planting.
    sources:
      - cms
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited.
    sources:
      - gi
      - kp
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. Possession for personal use is not
      explicitly criminalised, but there is no defined threshold, and people caught with small
      amounts are routinely charged under the offence of enabling the use of narcotics.
    sources:
      - gi
  driving:
    status: impairment
    text: >-
      Drug-related inability to drive safely can lead to immediate removal from
      traffic and temporary licence withdrawal under Road Safety Law article 341.
      The Interior Ministry's published consolidation includes amendments through
      Gazette 193/2025. Articles 336–338 provide police testing, medical examination
      and blood/urine analysis, with health safeguards. Article 336(6) specifies a
      EUR500-equivalent refusal fine and one year's driving prohibition in that
      consolidation; the neighbouring EUR400 provision concerns alcohol findings,
      not a generic cannabis-driving tariff. Drug driving also engages Criminal Code
      article 297-a: the ministry reported a drug-related arrest under that article
      in January 2026. The Constitutional Court confirms that Gazette 16/2026 changed
      article 297-a and added mandatory-ban and vehicle-confiscation provisions,
      applicable from 1 February. The final criminal amendment and its correction
      were not fully retrieved here, so exact current criminal penalties, ban lengths
      and confiscation conditions remain unresolved. No numerical THC allowance,
      positive-test-only offence or general prescription defence is inferred.
    sources:
      - roadtrafficpublished
      - criminalamendment2026
      - drugenforcement2026
