name: San Marino
region: Europe
iso_numeric: 674
recreational: illegal
medical: limited
updated: '2026-10-28'
summary: >-
  Personal possession and use remain criminal, normally carrying six months to three years under the
  statutory scale, with a possible reduction for particularly minor personal cases. Medical
  cultivation and prescribing have separate authorisation rules.
scores:
  possession: 1
  cultivation: 1
  enforcement: 2
  sharing: 1
  consumption: 1
  access: 1
segments:
  possession:
    text: >-
      Unauthorised possession, including for personal use, carries second-degree imprisonment: six
      months to three years.[@druglaw,code2026] A judge may reduce a particularly minor personal-use
      case by one grade, to three months–one year; the law sets no gram cutoff.[@druglaw,code2026]
    sources:
      - druglaw
      - code2026
    penalties:
      - label: Unauthorised possession
        treatment: criminal
        term: Prigionia di secondo grado
        prison_min: 6 months
        prison: 3 years
      - label: Particularly minor case for personal use; discretionary reduction
        treatment: criminal
        term: Prigionia di primo grado
        prison_min: 3 months
        prison: 1 year
        note: A judge may reduce the ordinary penalty by one grade; no fixed gram threshold
  cultivation:
    text: >-
      Unauthorised cultivation or production remains punishable under the drug law; the ordinary
      second-degree range is six months to three years.[@druglaw,code2026,l113english] Particularly
      minor personal production may receive a one-grade reduction to three months–one
      year.[@druglaw,code2026] The [medical industry
      law](/history/san-marino-medical-cannabis-law-2021/) requires authorisation for its greenhouse
      cultivation route.[@l113english]
    sources:
      - druglaw
      - code2026
      - l113english
    penalties:
      - label: Unauthorised cultivation or production
        treatment: criminal
        term: Prigionia di secondo grado
        prison_min: 6 months
        prison: 3 years
      - label: Particularly minor personal production; discretionary reduction
        treatment: criminal
        term: Prigionia di primo grado
        prison_min: 3 months
        prison: 1 year
        note: A judge may reduce the ordinary penalty by one grade; no fixed gram threshold
  enforcement:
    text: >-
      The law gives judges discretion to reduce particularly minor personal cases and to impose
      probation, supervision or treatment conditions.[@druglaw] Those possibilities do not create a
      fixed non-criminal allowance for possession or use.[@druglaw]
    sources:
      - druglaw
  sharing:
    text: >-
      Supplying cannabis for payment or free carries the ordinary six-month-to-three-year
      range.[@druglaw,code2026] Particularly serious cases can be increased by one to three grades,
      giving third-degree two–six years, fourth-degree four–ten years or fifth-degree six–fourteen
      years.[@druglaw,code2026] The aggravating grounds include quality and quantity, a predominant
      profit motive or supplying someone aged twenty-one or younger.[@druglaw]
    sources:
      - druglaw
      - code2026
    penalties:
      - label: Supply, including without payment
        treatment: criminal
        term: Prigionia di secondo grado
        prison_min: 6 months
        prison: 3 years
      - label: Particularly serious offence; one-grade increase
        treatment: criminal
        term: Prigionia di terzo grado
        prison_min: 2 years
        prison: 6 years
      - label: Particularly serious offence; two-grade increase
        treatment: criminal
        term: Prigionia di quarto grado
        prison_min: 4 years
        prison: 10 years
      - label: Particularly serious offence; three-grade increase
        treatment: criminal
        term: Prigionia di quinto grado
        prison_min: 6 years
        prison: 14 years
  consumption:
    text: >-
      Personal use is itself criminal and carries six months to three years, with a possible
      reduction to three months–one year for particularly minor cases.[@druglaw,code2026] Use
      conforming to a prescription issued or recognised by the Social Security Institute is
      exempt.[@druglaw]
    sources:
      - druglaw
      - code2026
    penalties:
      - label: Unauthorised personal use
        treatment: criminal
        term: Prigionia di secondo grado
        prison_min: 6 months
        prison: 3 years
      - label: Particularly minor personal use; discretionary reduction
        treatment: criminal
        term: Prigionia di primo grado
        prison_min: 3 months
        prison: 1 year
        note: A judge may reduce the ordinary penalty by one grade; no fixed gram threshold
  access:
    text: >-
      Medical retail supply is reserved to state pharmacies against a medical prescription; the
      legal categories include cannabis-derived medicines and pharmaceutical
      material.[@amend2023,asccfaq] The law authorises a patient route, while routine dispensing of
      flower has not been verified in the reviewed sources.[@asccfaq]
    sources:
      - amend2023
      - asccfaq
context:
  production:
    text: >-
      Businesses can seek authorisation for medical cannabis cultivation, processing and wholesale
      trade through the ASCC and Congress of State.[@amend2023] The rules require indoor
      technological greenhouses, security documentation and qualified technical
      staff.[@licensing2023] In September 2026, a local report said seven companies had obtained the
      government’s preliminary clearance and one, Health Farm, had begun cultivation.[@industry2026]
      Those are reported production milestones, while the state-pharmacy retail route has separate
      requirements.[@industry2026,asccfaq]
    sources:
      - amend2023
      - licensing2023
      - industry2026
      - asccfaq
    status: medical
  medical:
    text: >-
      Patients have a prescription-based route, with retail sales reserved to state
      pharmacies.[@amend2023,asccfaq] The authorised categories include flowers, preparations and
      pharmaceutical raw material, but routine availability of dispensed flower has not been
      verified.[@amend2023,asccfaq] The [1997 drug law](/history/san-marino-drugs-law-1997/)
      separately exempts personal use in accordance with a prescription issued or recognised by the
      Social Security Institute.[@druglaw]
    sources:
      - amend2023
      - asccfaq
      - druglaw
  consequences:
    text: >-
      In minor personal-use proceedings, a judge can order health checks, treatment, supervision or
      community activity.[@druglaw] The law also allows conditions on driving licences, passports
      and other permits.[@druglaw] A non-resident foreigner may face an entry or stay prohibition
      during proceedings or the judicial measure; particularly aggravated trafficking has a separate
      expulsion rule after imprisonment.[@druglaw]
    sources:
      - druglaw
  planting:
    text: >-
      Medical cultivation rules require certified seed or cuttings from certified seed, with records
      of origin and traceability.[@licensing2023] Plants must be grown in approved indoor
      technological greenhouses for the authorised medicinal production route.[@licensing2023] The
      2023 replacement definition includes seeds and plant parts without the original 0.2% THC
      wording.[@amend2023]
    sources:
      - licensing2023
      - amend2023
    seeds: licensed
    seeds_trade: regulated
    clones: licensed
    clones_trade: regulated
  clubs:
    text: >-
      The law provides no recreational collective-growing or gifting exception: free supply is
      punishable under the ordinary drug offence.[@druglaw] The Criminal Code also penalises
      providing a venue for drug consumption and attending such a venue to consume drugs.[@code2026]
      Medical retail supply is reserved to state pharmacies.[@asccfaq]
    sources:
      - druglaw
      - code2026
      - asccfaq
    status: none
  visitors:
    text: >-
      Visitors have no recreational supply exception: possession, import and personal use remain
      covered by the criminal law.[@druglaw] The medical-use exception depends on a prescription
      issued or recognised by the Social Security Institute.[@druglaw] A judge can impose an entry
      or stay prohibition on a non-resident foreigner in the circumstances described by the
      personal-use procedure.[@druglaw]
    sources:
      - druglaw
    status: none
  driving:
    status: impairment
    text: >-
      Driving with psychophysical impairment caused by drugs or medication abuse is criminal under
      Road Code article 57.[@roadcodepublished] Article 63 provides immediate licence withdrawal,
      while the original text uses graded criminal penalties whose current monetary conversion was
      not verified in this review.[@roadcodepublished] The Civil Police’s Dräger DrugTest 5000 was
      approved in 2024 and its approval ratified on 16 January
      2025.[@drugtestapproval,drugtestratification] An April 2026 amendment added a zero-alcohol
      rule for professional transport while leaving the drug-impairment requirement
      distinct.[@roadamendment2026]
    sources:
      - roadcodepublished
      - drugtestapproval
      - drugtestratification
      - roadamendment2026
  recreational:
    text: >-
      Recreational possession and use remain criminal, including when the cannabis is solely for the
      holder.[@druglaw] A particularly minor personal case can receive a lower sentencing grade at
      the judge’s discretion.[@druglaw] Free supply is also punishable, so passing cannabis to a
      friend falls under the supply rule.[@druglaw]
    sources:
      - druglaw
  hemp:
    text: >-
      The medical cultivation system covers the plant and its parts, including seeds, flowers and
      resin.[@amend2023] The [2023 amendment](/history/san-marino-medical-definition-revised-2023/)
      removed the original medical law’s reference to THC above 0.2%.[@amend2023,l113english] That
      old definition therefore supplies no current general retail allowance for low-THC flower or
      CBD.[@amend2023] Cultivation under the medicinal route requires approved indoor facilities and
      authorisation.[@licensing2023]
    sources:
      - amend2023
      - l113english
      - licensing2023
    status: none
