name: San Marino
region: Europe
iso_numeric: 674
recreational: illegal
medical: limited
updated: 2026-10-26
summary: Medical use is permitted; recreational reform has been proposed by citizens' initiative.
scores:
  possession: 1
  cultivation: 1
  enforcement: 2
  sharing: 1
  consumption: 1
  access: 1
segments:
  possession:
    text: >-
      Possession is a criminal offence. The statutory penalty for illicit possession or use of
      narcotics is severe on paper — prison and a fine — though small personal amounts are dealt
      with more leniently in practice.
    sources:
      - cann
      - wiki
  cultivation:
    text: Home growing is illegal.
    sources:
      - cann
  enforcement:
    text: Criminal penalties apply, with leniency for small amounts.
    sources:
      - cann
  sharing:
    text: Supply is a crime.
    sources:
      - cann
  consumption:
    text: Use is covered by the same offence as possession.
    sources:
      - cann
  access:
    text: >-
      Cannabis-based medicines are available through the state pharmacy on prescription. There is
      no adult-use source; a proposal for 30 g and four plants was shelved in 2020.
    sources:
      - l113
      - ascc
context:
  production:
    text: >-
      Since Law 113 of 2021 cannabis may be grown in authorised greenhouses and processed for
      medicines only, under an authorisation from the health authority. Whether any authorisation
      has been issued was not confirmed. There is no production for adult use.
    sources:
      - l113
  products:
    text: >-
      The authorised medical framework includes cannabis flower and preparations.[@l113english,ascc]
      State pharmacies may retail cannabis medicines and pharmaceutical-grade raw material;
      actual dispensing of flower has not been verified.[@asccfaq]
    sources:
      - l113english
      - ascc
      - asccfaq
  medical:
    text: >-
      The 2021 framework permits prescribed medical cannabis, including authorised flower and
      preparations. Retail supply is through state pharmacies; home growing remains illegal.
      Actual availability of dispensed flower has not been verified.[@l113english,asccfaq]
    sources:
      - l113english
      - asccfaq
  consequences:
    text: A conviction is a criminal record.
    sources:
      - cann
  planting:
    seeds: licensed
    seeds_trade: regulated
    clones: licensed
    clones_trade: regulated
    text: >-
      The 2021 medical cannabis law counts the seeds as part of the cannabis plant when THC
      exceeds 0.2% and allows seeds and plants to be grown only in authorised greenhouses for
      medicines. Growing, processing and trading all require an authorisation from the health
      authority.
    sources:
      - l113
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited.
    sources:
      - cann
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. British travel advice describes a
      zero-tolerance policy towards possession and use of illegal drugs, with a prison
      sentence or a heavy fine on conviction.
    sources:
      - wiki
      - vice
      - fcdo
  driving:
    status: impairment
    text: >-
      Road Code article 57 criminalises driving with psychophysical alteration caused
      by narcotic or psychotropic substances or medication abuse. It permits objective
      evidence, non-invasive checks and portable instruments approved by decree;
      refusal to attend a health facility when the specified indications exist is
      also punishable. Article 63 provides immediate licence withdrawal. The reviewed
      original statute uses graded criminal penalties, whose current fine and duration
      conversions have not been established here. Decree 170/2024 specifically approves
      the Civil Police's Dräger DrugTest 5000 Analyzer and was ratified without
      amendments on 16 January 2025. The April 2026 amendment to article 57 introduces
      zero alcohol for professional transport: it is not a numerical THC limit or
      a replacement of the drug-alteration requirement. Its novice-driver suspension
      reduction applies only under stated non-criminal conditions and must not be
      assumed to halve a criminal drug-driving ban. Current consolidated penalties,
      confirmatory toxicology procedures and any prescription exception remain
      follow-up questions; no safe waiting interval is inferred.
    sources:
      - roadcodepublished
      - drugtestapproval
      - drugtestratification
      - roadamendment2026
