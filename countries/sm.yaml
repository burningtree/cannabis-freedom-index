segments:
  possession:
    text: >-
      Possession is a criminal offence. The statutory penalty for illicit possession or use of
      narcotics is severe on paper — prison and a fine — though small personal amounts are dealt
      with more leniently in practice.
    sources:
      - cann
      - wiki
  cultivation:
    text: Home growing is illegal.
    sources:
      - cann
  enforcement:
    text: Criminal penalties apply, with leniency for small amounts.
    sources:
      - cann
  sharing:
    text: Supply is a crime.
    sources:
      - cann
  consumption:
    text: Use is covered by the same offence as possession.
    sources:
      - cann
  access:
    text: >-
      Cannabis-based medicines are available through the state pharmacy on prescription. There is
      no adult-use source; a proposal for 30 g and four plants was shelved in 2020.
    sources:
      - l113
      - ascc
context:
  production:
    text: >-
      Since Law 113 of 2021 cannabis may be grown in authorised greenhouses and processed for
      medicines only, under an authorisation from the health authority. Whether any authorisation
      has been issued was not confirmed. There is no production for adult use.
    sources:
      - l113
  products:
    text: Cannabis-based medicines only; no flower.
    sources:
      - cann
  medical:
    text: >-
      Legal since a 2016 citizens' petition: approved cannabis-based medicines for conditions such
      as multiple sclerosis, spinal injury and neuropathic pain, provided free to residents. No
      flower and no home growing.
    sources:
      - ascc
      - l113
  consequences:
    text: A conviction is a criminal record.
    sources:
      - cann
  planting:
    seeds: licensed
    seeds_trade: regulated
    clones: licensed
    clones_trade: regulated
    text: >-
      The 2021 medical cannabis law counts the seeds as part of the cannabis plant when THC
      exceeds 0.2% and allows seeds and plants to be grown only in authorised greenhouses for
      medicines. Growing, processing and trading all require an authorisation from the health
      authority.
    sources:
      - l113
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited.
    sources:
      - cann
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. British travel advice describes a
      zero-tolerance policy towards possession and use of illegal drugs, with a prison
      sentence or a heavy fine on conviction.
    sources:
      - wiki
      - vice
      - fcdo
