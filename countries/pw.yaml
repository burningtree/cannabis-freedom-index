segments:
  possession:
    text: >-
      Marijuana is a Schedule I substance under Palau law, but small-scale possession is punished by
      a fine rather than prison: $500 for a first offence and $1,000 for a second, for amounts
      reported as up to two ounces. People are cited rather than jailed.
    sources:
      - pit1
      - it
  cultivation:
    text: Cultivation is illegal and prosecuted as production.
    sources:
      - pit1
  enforcement:
    text: Fines and citations for users; prison for trafficking.
    sources:
      - it
      - pit1
  sharing:
    text: >-
      Trafficking carries up to eight years and a fine of up to $5,000 — but giving away less than
      an ounce is punished like simple possession, an unusual explicit carve-out for sharing.
    sources:
      - pit1
  consumption:
    text: >-
      Use is illegal; Palau has long had one of the highest reported rates of cannabis use in the
      world. Under a drug law signed in May 2026 (RPPL 12-5), testing positive for an illegal drug
      is treated as possession of a small amount.
    sources:
      - pit1
      - pina
  access:
    text: None.
    sources:
      - pit2
context:
  production:
