  medical:
    text: >-
      None. A Medical Marijuana Act was introduced in 2015 and shelved; a later president said he
      supported medical but not recreational use, and advocates have kept pressing.
    sources:
      - pit2
      - pit1
  consequences:
    text: A citation is recorded but does not mean custody.
    sources:
      - it
