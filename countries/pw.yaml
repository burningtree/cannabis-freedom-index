  products:
    text: None.
    sources:
      - pit2
  medical:
    text: >-
      None. A Medical Marijuana Act was introduced in 2015 and shelved; a later president said he
      supported medical but not recreational use, and advocates have kept pressing.
    sources:
      - pit2
      - pit1
  consequences:
    text: A citation is recorded but does not mean custody.
    sources:
      - it
  clubs:
    status: none
    text: >-
      No cannabis clubs are known. Trafficking carries up to eight years, with one carve-out:
      giving away less than an ounce is punished like simple possession. Nothing in the law
      provides for collective growing.
    sources:
      - pit1
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. British travel advice says there are
      heavy penalties for all drug offences and that possessing even a small amount of an
      illegal drug can bring a fine or a prison sentence.
    sources:
      - pit2
      - fcdo
