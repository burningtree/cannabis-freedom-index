name: Palau
region: Oceania
iso_numeric: 585
recreational: illegal
medical: none
updated: '2026-10-28'
summary: >-
  Small possession is a $500 citation, not prison; giving away an ounce or less is treated the same.
  Cultivation and sale are felonies carrying up to eight years.
scores:
  possession: 2
  cultivation: 1
  enforcement: 3
  sharing: 2
  consumption: 1
  access: 0
segments:
  possession:
    text: >-
      Marijuana is a Schedule II controlled substance under 34 PNC section 3106, not Schedule
      I.[@pnc34] Possession of two ounces or less is a citation: $500 for a first offence and
      $1,000 for each later one, with no prison.[@pnc34] More than two ounces up to one pound is a
      first conviction of one year and up to $3,000, with eleven months normally suspended and
      counselling or testing required; later convictions reach two years and $5,000.[@pnc34]
      More than one pound reaches ten years and $15,000.[@pnc34] A positive blood or urine test is
      deemed possession of under one gram.[@pnc34]
    sources:
      - pnc34
    currency: USD
    penalties:
      - label: Two ounces or less
        treatment: civil
        term: Possession
        fine: 500
        note: Citation; $1,000 for each later violation; no prison
      - label: More than two ounces up to one pound
        treatment: criminal
        term: Possession
        prison: 1 year
        fine: 3000
        note: Eleven months normally suspended with counselling or testing; later convictions up to two years and $5,000
      - label: More than one pound
        treatment: criminal
        term: Possession
        prison: 10 years
        fine: 15000
  cultivation:
    text: >-
      Production includes planting, cultivation, growing and harvesting.[@pnc34] Unauthorised
      manufacture or production of marijuana is a felony carrying up to eight years and a $5,000
      fine, with no plant-count tier.[@pnc34]
    sources:
      - pnc34
    currency: USD
    penalties:
      - label: Cultivation or production
        treatment: criminal
        term: Production
        prison: 8 years
        fine: 5000
  enforcement:
    text: >-
      Simple possession of two ounces or less is a citation, while cultivation, sale and larger
      possession are felonies.[@pnc34] Enforcement is overwhelmingly methamphetamine-focused;
      cannabis cases are mainly cultivation and trafficking raids plus simple-possession
      citations.[@it24] No aggregate cannabis-arrest count is published.[@yearbook23]
    sources:
      - pnc34
      - it24
      - yearbook23
  sharing:
    text: >-
      Delivery or sale of marijuana carries up to eight years and a $5,000 fine.[@pnc34] Giving
      away one ounce or less without payment is treated like simple possession, a $500 first
      citation or $1,000 later.[@pnc34] Selling to a person under 18 who is at least three years
      younger can double the imprisonment to sixteen years.[@pnc34]
    sources:
      - pnc34
    currency: USD
    penalties:
      - label: Sale or delivery, any amount
        treatment: criminal
        term: Delivery
        prison: 8 years
        fine: 5000
      - label: Gift of one ounce or less
        treatment: civil
        term: Gift
        fine: 500
        note: Treated like possession; $1,000 for each later violation
      - label: Sale to a person under 18 at least three years younger
        treatment: criminal
        term: Delivery to a minor
        prison: 16 years
        fine: 5000
  consumption:
    text: >-
      There is no standalone cannabis-use offence in Title 34.[@pnc34] Possession is the hook, and
      since 2026 a positive blood or urine test is deemed possession of under one gram.[@pnc34]
      Public use would likely be charged as possession or a public-order offence; no cannabis-specific
      consumption charge was verified.[@pnc34]
    sources:
      - pnc34
  access:
    text: >-
      None. There is no dispensary, patient programme, club or home-grow right, and no hemp or CBD
      licensing route.[@pnc34]
    sources:
      - pnc34
context:
  recreational:
    text: >-
      All recreational use is prohibited. Possession of two ounces or less is a $500 citation,
      $1,000 for each later violation; more than two ounces reaches one year, and more than a pound
      ten years.[@pnc34] Cultivation and sale carry up to eight years.[@pnc34] Use is widespread:
      15.2 per cent of adults reported past-30-day marijuana use in the 2023 Palau Hybrid Survey,
      and 41.6 per cent of current users used daily.[@survey23]
    sources:
      - pnc34
      - survey23
  production:
    status: none
    text: >-
      No lawful cannabis production. Planting, cultivation, growing and harvesting fall within
      "production" and carry up to eight years and a $5,000 fine.[@pnc34] No hemp or medical
      production permission was found.[@pnc34]
    sources:
      - pnc34
  medical:
    text: >-
      No medical cannabis programme. A Medical Marijuana Act was introduced in 2015 and shelved,
      and a 2021 compassionate-use bill passed first reading without becoming law.[@pit17] There is
      no licensed cannabis medicine, prescriber pathway or dispensary.[@pnc34]
    sources:
      - pnc34
      - pit17
  hemp:
    status: none
    text: >-
      No legal hemp category or THC threshold. "Marijuana" covers all parts of Cannabis sativa L.,
      growing or not, seeds, resin and every derivative, excluding only mature stalks, stalk fibre,
      seed oil or cake and sterilised non-germinating seed.[@pnc34] No hemp licensing or pilot
      programme was found.[@pnc34]
    sources:
      - pnc34
  consequences:
    text: >-
      A citation is recorded but does not mean custody.[@pnc34] A first marijuana-possession offence
      may be conditionally discharged and expunged under section 3308, despite the general exclusion
      of Schedule I and II drugs in the same section.[@pnc34]
    sources:
      - pnc34
  planting:
    seeds: illegal
    seeds_trade: banned
    clones: illegal
    clones_trade: banned
    text: >-
      Marijuana includes seeds, and production expressly includes planting, cultivation, growing
      and harvesting.[@pnc34] There is no personal seed or clone exception; cultivation carries up
      to eight years and a $5,000 fine.[@pnc34]
    sources:
      - pnc34
  clubs:
    status: none
    text: >-
      No cannabis clubs are known. Cultivation and supply are prohibited, and nothing in the law
      provides for collective growing.[@pnc34]
    sources:
      - pnc34
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. Possession of two ounces or less is a $500
      citation, more than two ounces reaches one year, and more than a pound ten years.[@pnc34]
    sources:
      - pnc34
  driving:
    status: unknown
    text: >-
      42 PNC section 514 prohibits driving under the influence of "narcotic drugs", but the
      controlled-substances definition limits "narcotic drug" to opium and coca derivatives, and a
      1974 Trust Territory case held that marijuana is not a narcotic.[@pnc42,pnc34] The 2026 drug
      law adds field sobriety testing for "another controlled substance" and treats a positive test
      as possession of under one gram; refusal can bring a six-month licence revocation after a
      hearing.[@pnc42] No standalone cannabis-DUI offence was verified.[@pnc42]
    sources:
      - pnc42
      - pnc34
  black_market:
    text: >-
      UNODC records 2.3 kg of herbal cannabis seized in 2024.[@unodc_szr] Palau's local market is
      small and localised, with cannabis processed into cigarettes and sold through small
      outlets.[@ocindex25] In 2019 police seized and burned over a tonne in Peleliu; in 2021 they
      found 635 plants, 136 joints and about 250 lb; in 2024 they seized 182 plants and $31,600 in
      cash.[@it19,it21,it24] In 2026 THC gummies hospitalised three women in Koror, and a Meyuns
      search found 11.52 g of marijuana alongside meth.[@it26a,it26b]
    sources:
      - unodc_szr
      - ocindex25
      - it19
      - it21
      - it24
      - it26a
      - it26b
  arrests:
    text: >-
      No aggregate cannabis-arrest count is published for 2024–2026. The 2023 statistical yearbook
      recorded illegal marijuana cultivation cases of 11 in 2020, 10 in 2021, 14 in 2022 and 3 in
      2023.[@yearbook23] Specific recent cases include 182 plants in Peleliu in 2024, a 14-year-old
      selling marijuana at Palau High School in 2025, and the 2026 gummies and Meyuns
      cases.[@it24,it25,it26a,it26b]
    sources:
      - yearbook23
      - it24
      - it25
      - it26a
      - it26b
