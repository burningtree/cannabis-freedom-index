segments:
  possession:
    text: >-
      Up to 6 g of cannabis (2 g of hashish) is an administrative offence under Article 6.8 of the
      Code of Administrative Offences: a fine of 4,000–5,000 roubles or up to 15 days' detention.
      Above 6 g it is a crime under Article 228 of the Criminal Code — up to three years for a
      'significant amount' (6–100 g) and three to ten years above 100 g. For hashish the
      tiers begin at 2 g and 25 g. Foreigners are deported even for the administrative offence.
    sources:
      - wiki
      - res1002
  cultivation:
    text: >-
      Growing up to 20 cannabis plants is an administrative offence with a fine or short detention;
      20 or more is a crime.
    sources:
      - wiki
  enforcement:
    text: >-
      Article 228 is known as the 'people's article' because so many prisoners are held under it.
      The low thresholds, planted-evidence scandals and long sentences for anything resembling
      supply make this far harsher than the 6 g rule suggests.
    sources:
      - wiki
  sharing:
    text: Any transfer is 'sale' under Article 228.1, starting at four to eight years.
    sources:
      - wiki
  consumption:
    text: >-
      Using without a prescription is a separate administrative offence, provable by a drug test,
      with a fine or up to 15 days and possible compulsory treatment.
    sources:
      - wiki
  access:
    text: No legal source.
    sources:
      - wiki
context:
  production:
    text: >-
      Registered varieties of hemp may be grown for industry if the leaves and flowering tops
      hold no more than 0.1% THC; seed of the fourth and later generations may not be sown. The
      area was about 2,000 hectares in 2012 and 10,200 in 2019, against nearly a million in the
      Soviet Union of 1928. Growing cannabis for medicine is not allowed. No other production.
    sources:
      - res101
      - konop
  products:
    text: Reliable national information about legally available cannabis products was not established by the retained sources.
    sources: []
  medical:
    text: No medical cannabis; cannabis is on the list of substances banned from medical use.
    sources:
      - wiki
  consequences:
    text: >-
      Users can be placed on a narcological register, which blocks driving licences and some jobs.
      'Propaganda' of drugs, including online, is also penalised.
    sources:
      - wiki
  planting:
    seeds: grey
    seeds_trade: open
    clones: illegal
    clones_trade: banned
    text: >-
      Lawyers answering on a Russian legal advice site say hemp seeds are part of the plant
      but contain no narcotic, are not on the government's lists, and may be bought and sold
      for any purpose except sowing. Growing is what the law punishes: fewer than 20 plants is
      an administrative offence with a fine or up to 15 days' arrest, and 20 or more is a
      crime under Article 231 of the Criminal Code.
    sources:
      - har1
      - har2
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited.
    sources:
      - wiki
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. British travel advice says a person
      can be prosecuted for possessing even small quantities of any drug, including cannabis,
      and should expect a long prison sentence and heavy fines, also in airport transit, where
      baggage is scanned. A foreigner detained by the authorities could face months or years
      in prison.
    sources:
      - wiki
      - fcdo
  driving:
    status: zero
    text: >-
      The Code of Administrative Offences punishes driving in a state of intoxication with a
      fine of 45,000 roubles and loss of the licence for one and a half to two years, where
      the act is not a crime. A note to the article defines the state: for alcohol it gives
      measured levels, but for drugs liability arises from the presence of narcotic or
      psychotropic substances in the body, with no level set.
    sources:
      - koap128
  arrests:
    text: >-
      Russian figures cover all drugs together. In 2024 courts convicted 69,900 people of drug
      crimes, 50,800 of them under Article 228, the possession article: about 13% of all
      512,800 convictions that year, a share that has held steady for several years. One in
      five of those convicted under Article 228 as the main charge was sent to prison, most
      often for three to five years, and fewer than 1% were released from punishment. By
      various estimates about a third of all prisoners are serving time for drugs. The
      Interior Ministry counted 69,700 people prosecuted for drug crimes in 2024, nearly 10%
      fewer than in 2023, while seizures reached a seven-year record of 37.8 tonnes.
    sources:
      - komm25
      - rtvi25
