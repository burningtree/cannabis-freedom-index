answers:
  carry:
    answer: 'no'
    text: Unlawful; administrative/criminal thresholds differ for plant material, resin and oil
  caught:
    answer: 'no'
    label: Prison or detention
    text: >-
      Administrative detention is possible; cannabis oil has a 0.4 g criminal grading figure, rather
      than the 6 g plant figure
