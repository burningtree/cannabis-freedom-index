segments:
  possession:
    text: >-
      Cannabis remains illegal, but for adults possession of up to 3 g for personal use has the
      lowest prosecution priority: police make a simplified record and usually nothing further
      happens. This does not apply to minors, or where there is public nuisance or an aggravating
      circumstance such as being near a school.
    sources:
      - dpf
      - wiki
  cultivation:
    text: >-
      One cultivated plant per adult falls under the same lowest-priority rule as 3 g. It is not
      legal — the plant can be seized — and anything more is prosecuted.
    sources:
      - dpf
      - wiki
  enforcement:
    text: >-
      Adult users within the 3 g rule are not prosecuted. Above it, or with nuisance, fines and
      prison of three months to a year are possible, and dealing is punished more heavily.
    sources:
      - dpf
      - cms
  sharing:
    text: >-
      Supply is an offence. Cannabis social clubs that tried to pool members' one-plant allowances
      have been prosecuted and convicted.
    sources:
      - wiki
      - cms
  consumption:
    text: >-
      Use in public or in the presence of minors takes a case out of the low-priority category and
      leads to prosecution. Private use by adults is in practice left alone.
    sources:
      - dpf
      - wiki
  access:
    text: >-
      No legal source. There are no coffeeshops or tolerated clubs, and many Belgians buy across the
      Dutch border.
    sources:
      - wiki
      - cms
context:
  production:
    text: No licensed adult-use or general medical cultivation. Hemp is grown under EU rules.
    sources:
      - cms
  products:
    text: A cannabis-based mouth spray on prescription and low-THC products sold under ambiguous rules.
    sources:
      - cms
      - wiki
  medical:
    text: >-
      Very limited: a 2015 royal decree allows cannabis-based medicines, in practice one mouth spray
      for multiple-sclerosis spasticity. Pharmacies may not dispense herbal cannabis.
    sources:
      - wiki
      - cms
  consequences:
    text: >-
      The police record made for small possession is not a conviction. Roadside saliva tests apply a
      very low THC threshold.
    sources:
      - dpf
      - wiki
  planting:
    seeds: grey
    seeds_trade: unclear
    clones: illegal
    clones_trade: banned
    text: >-
      The 2017 royal decree says growing cannabis plants "is prohibited and cannot be
      authorised", apart from hemp grown under EU farm rules, and it does not mention seeds.
      Growing for personal use falls under the lighter penalties of the drug law, and one
      plant is treated with the same low priority as three grams.
    sources:
      - ar2017
  clubs:
    status: underground
    text: >-
      Clubs have no legal basis; they lean on the directive that gives lowest priority to an
      adult's possession of 3 g or one plant, arguing that members may pool their one plant
      each. The first, Trekt Uw Plant in Antwerp, was founded in 2006, went to court twice and
      was acquitted in 2010; others followed in Hasselt, Liège, Andenne and Namur. In 2020
      there were five registered clubs, the largest with about 400 members. The courts have
      not accepted the model: organisers of the Mambo Social Club, raided in 2013, were
      convicted of possession, production and sale, the court ruling that the tolerance for
      personal possession cannot be stretched to a shared growing room, and the club stopped
      growing.
    sources:
      - leafly20
      - wikibe
