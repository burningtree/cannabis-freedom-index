answers:
  carry:
    answer: limited
    text: >-
      Up to 3 g for adult personal use normally has low prosecution priority; prosecution and
      fines remain possible
  caught:
    answer: limited
    label: Prosecutorial discretion
    text: >-
      A simplified report is usual within the policy conditions; prosecutors can still bring
      charges
