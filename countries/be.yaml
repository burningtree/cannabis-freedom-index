name: Belgium
region: Europe
iso_numeric: 56
recreational: decriminalised
medical: limited
updated: '2026-10-27'
summary: >-
  For adults, up to 3 g or one plant is the lowest prosecution priority — usually a simple police
  record. Medical access is confined to a few pharmaceutical products.
scores:
  possession: 3
  cultivation: 2
  enforcement: 4
  sharing: 1
  consumption: 2
  access: 1
segments:
  possession:
    text: >-
      Cannabis possession remains an offence. Adults with up to 3 g for personal use, without
      aggravating circumstances or public nuisance, normally receive a simplified police report
      and lowest prosecution priority. Prosecutors may still bring charges with reasons.[@justice]
    sources:
      - justice
  cultivation:
    text: >-
      One plant for adult personal use receives the same low prosecution priority as 3 g, subject
      to the other conditions. Growing remains unlawful; the policy gives no immunity from
      prosecution.[@justice]
    sources:
      - justice
  enforcement:
    text: >-
      Police normally send a simplified report for eligible small adult possession. Prosecutors
      retain discretion to prosecute with reasons; fines remain possible within the low-priority
      threshold.[@justice] Larger quantities and dealing can bring prison.[@cms]
    sources:
      - justice
      - cms
  sharing:
    text: >-
      Supply is an offence. Cannabis social clubs that tried to pool members' one-plant allowances
      have been prosecuted and convicted.
    sources:
      - wiki
      - cms
  consumption:
    text: >-
      Use in public or in the presence of minors takes a case out of the low-priority category and
      leads to prosecution. Private use by adults is in practice left alone.
    sources:
      - dpf
      - wiki
  access:
    text: >-
      Medical access is lawful but narrow: a specialist may prescribe Sativex for multiple-sclerosis
      spasticity and a pharmacy may dispense it. There are no legal adult-use shops or tolerated clubs.
    sources:
      - fagg
context:
  production:
    text: No licensed adult-use or general medical cultivation. Hemp is grown under EU rules.
    sources:
      - cms
  products:
    text: A cannabis-based mouth spray on prescription and low-THC products sold under ambiguous rules.
    sources:
      - fagg
      - wiki
  medical:
    text: >-
      Very limited: a 2015 royal decree allows cannabis-based medicines, in practice one mouth spray
      for multiple-sclerosis spasticity. Pharmacies may not dispense herbal cannabis.
    sources:
      - fagg
  consequences:
    text: >-
      The police record made for small possession is not a conviction. Roadside saliva tests apply a
      very low THC threshold.
    sources:
      - dpf
      - wiki
  planting:
    seeds: grey
    seeds_trade: unclear
    clones: illegal
    clones_trade: banned
    text: >-
      The 2017 royal decree says growing cannabis plants "is prohibited and cannot be
      authorised", apart from hemp grown under EU farm rules, and it does not mention seeds.
      Growing for personal use falls under the lighter penalties of the drug law, and one
      plant is treated with the same low priority as three grams.
    sources:
      - ar2017
  clubs:
    status: underground
    text: >-
      Clubs have no legal basis; they lean on the directive that gives lowest priority to an
      adult's possession of 3 g or one plant, arguing that members may pool their one plant
      each. The first, Trekt Uw Plant in Antwerp, was founded in 2006, went to court twice and
      was acquitted in 2010; others followed in Hasselt, Liège, Andenne and Namur. In 2020
      there were five registered clubs, the largest with about 400 members. The courts have
      not accepted the model: organisers of the Mambo Social Club, raided in 2013, were
      convicted of possession, production and sale, the court ruling that the tolerance for
      personal possession cannot be stretched to a shared growing room, and the club stopped
      growing.
    sources:
      - leafly20
      - wikibe
  driving:
    status: limit
    text: >-
      The roadside THC saliva screen uses 25 ng/mL; evidentiary saliva analysis uses 10 ng/mL.
      Blood analysis, where saliva testing or analysis cannot be performed under article 63,
      measures THC in plasma at a 1 ng/mL threshold. These specimen-specific values are distinct
      from proof of actual impairment.[@trafficlaw] The driving ban runs from one month to five
      years and the fine from 1,000 to 10,000 euros.[@euda_dd]
    sources:
      - trafficlaw
      - euda_dd
  arrests:
    text: >-
      The EU drugs agency's statistical bulletin records 45,123 cannabis-related drug law
      offences in Belgium in 2024, against 37,940 in 2023. Of the 2024 total, 34,294 were for
      use or possession for use. That is the highest figure in the series, which starts in
      2007. Countries count these differently (offences or offenders, criminal or
      administrative), so the figure is not comparable across borders.
    sources:
      - euda_dlo
  visitors:
    status: none
    text: >-
      No legal recreational supply exists. The adult 3 g/one-plant policy is a low prosecution
      priority, with no guaranteed immunity; fines and prosecution remain possible.[@justice]
    sources:
      - justice
  black_market:
    text: >-
      The EU drugs agency's statistical bulletin records 9,983 kg of herbal cannabis and
      711 kg of cannabis resin seized in Belgium in 2024, against 850 kg and 4,515 kg in
      2023. Herbal cannabis was seized on 886 occasions and resin on 17. Countries record
      seizures differently, so the figures are not comparable across borders.
    sources:
      - euda_szr
