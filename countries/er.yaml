    text: >-
      The 2015 Penal Code punishes growing a controlled plant with three to five years in
      prison (Article 387), or with six to twelve months or a fine when it is for personal use
      (Article 396). Which plants are controlled is left to regulations that were not read.
      The code does not mention seeds.
    sources:
      - pc2015
