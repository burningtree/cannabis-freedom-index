name: Eritrea
region: Africa
iso_numeric: 232
recreational: illegal
medical: none
updated: '2026-10-28'
summary: >-
  Cannabis remains prohibited. Eritrea’s published 2015 drug penalties were still awaiting
  enforcement in the government’s 2024 account and a 2025 UN report.
scores:
  possession: 1
  cultivation: 1
  enforcement: 2
  sharing: 0
  consumption: 1
  access: 0
segments:
  possession:
    text: >-
      The government identified the Transitional Penal Code as the working law in November
      2024.[@gov2024] The
      older code published by the Justice Ministry includes unauthorised acquisition, receipt and
      storage of narcotic substances among its drug offences.[@workingCode] A current cannabis-specific possession
      tariff has not been verified; the six-to-twelve-month tariff in the published 2015 replacement
      is not an established operative
      penalty.[@pc2015,gov2024,un2025](/history/eritrea-new-code-awaits-enforcement-2024/)
    sources:
      - workingCode
      - gov2024
      - un2025
      - pc2015
  cultivation:
    text: >-
      The published 2015 code would distinguish personal cultivation from commercial growing, but
      the government and a 2025 UN report said that code was not in
      force.[@pc2015,gov2024,un2025](/history/eritrea-new-code-awaits-enforcement-2024/) The older narcotics
      provision covers unauthorised production.[@workingCode] The current cannabis-specific growing penalty and
      any subsidiary plant-control rules remain unverified.[@gov2024,un2025]
    sources:
      - workingCode
      - gov2024
      - un2025
      - pc2015
  enforcement:
    text: >-
      Canadian government advice warns of prison sentences and heavy fines for possession, use and
      trafficking of illegal drugs in Eritrea.[@travelCanada] The published 2015 fine alternative is not evidence
      of the sentence available under the working transitional law.[@gov2024,un2025] Cannabis-specific sentencing
      practice remains unverified.[@gov2024,un2025]
    sources:
      - travelCanada
      - gov2024
      - un2025
  sharing:
    text: >-
      The older code’s narcotics offence covers unauthorised distribution and procuring substances
      for another person, with more serious provisions for organised or professional
      trafficking.[@workingCode]
      The published 2015 definition that expressly includes giving and transferring drugs cannot
      establish the current rule while that code awaits
      commencement.[@pc2015,gov2024,un2025](/history/eritrea-new-code-awaits-enforcement-2024/)
    sources:
      - workingCode
      - gov2024
      - un2025
      - pc2015
  consumption:
    text: >-
      Canadian government advice describes illegal drug use as punishable by imprisonment and heavy
      fines.[@travelCanada] The older code separately covers knowingly providing premises for drug use.[@workingCode] A current
      cannabis-specific use offence and penalty have not been verified.[@gov2024,un2025]
    sources:
      - travelCanada
      - workingCode
      - gov2024
      - un2025
  access:
    text: >-
      No lawful recreational source is established by the reviewed materials.[@gov2024,travelCanada] The government’s
      account identifies the older transitional criminal law as the working
      system.[@gov2024](/history/eritrea-new-code-awaits-enforcement-2024/)
    sources:
      - gov2024
      - travelCanada
context:
  recreational:
    text: >-
      Cannabis is prohibited: the working Transitional Penal Code criminalises narcotics offences
      including unauthorised acquisition, supply and production, with no personal-use allowance
      established.[@workingCode,gov2024] Eritrea confirmed in 2024 that the published 2015
      replacement code was still awaiting
      enforcement.(/history/eritrea-new-code-awaits-enforcement-2024/)
    sources:
      - workingCode
      - gov2024
  production:
    status: none
    text: >-
      No licensed cannabis production was established in the reviewed materials; the older
      narcotics provision covers unauthorised production.[@workingCode,gov2024,un2025]
    sources:
      - workingCode
      - gov2024
      - un2025
  hemp:
    status: none
    text: >-
      No industrial-hemp exception or lawful cannabis product was established in the reviewed
      materials.[@workingCode,gov2024,un2025]
    sources:
      - workingCode
      - gov2024
      - un2025
  medical:
    text: >-
      No medical cannabis programme was established in the reviewed materials.[@workingCode,gov2024,un2025]
    sources:
      - workingCode
      - gov2024
      - un2025
  consequences:
    text: >-
      The retained sources do not establish collateral consequences beyond the penalties described
      above.[@workingCode,gov2024,un2025]
    sources:
      - workingCode
      - gov2024
      - un2025
  planting:
    seeds: grey
    seeds_trade: unclear
    clones: illegal
    clones_trade: banned
    text: >-
      Unauthorised production covers growing under the older narcotics provision; no seed-specific
      rule was verified in the reviewed materials.[@workingCode] The grey seed status records that
      uncertainty rather than a verified permission.[@workingCode,gov2024,un2025]
    sources:
      - workingCode
      - gov2024
      - un2025
  visitors:
    status: none
    text: >-
      There is no established recreational supply route for visitors. Canadian government advice
      warns that possessing, using or trafficking illegal drugs can lead to imprisonment and heavy
      fines.[@travelCanada]
    sources:
      - travelCanada
sources:
  pc2015:
    title: Penal Code of the State of Eritrea, 2015 (FAOLEX copy)
    url: https://faolex.fao.org/docs/pdf/eri210565.pdf
  workingCode:
    type: law
    title: Eritrea Ministry of Justice — Penal Code download, text of the Ethiopian Penal Code 1957
    url: https://mojeritrea.net/wp-content/uploads/2023/05/Penal-Code.pdf
    locator: >-
      Ministry laws page labels this Penal Code; downloaded text is 1957 code, not 2015; Article 510
      at PDF pp. 164–165
  gov2024:
    type: report
    title: Government of Eritrea — Replies to the Committee on the Rights of the Child, CRC/C/ERI/RQ/5-6
    url: >-
      https://docstore.ohchr.org/SelfServices/FilesHandler.ashx?enc=sagHwNR7WH2SUzy8jYRuvr%2Bm%2B580wfdNJs9E8JkxsFMuEtz0tRzEp7cRskH%2FhvznPiY4LPnVlgu%2BBAN3x4VpGA%3D%3D
    year: 2024
    locator: >-
      Received 6 November, distributed 11 November 2024; paragraphs 40–41 identify the working law
      and state that the 2015 code is not yet enforced
  un2025:
    type: report
    title: UN Special Rapporteur on Eritrea — Report A/HRC/59/24, 2025
    url: https://www.ecoi.net/en/file/local/2126167/g2506895.pdf
