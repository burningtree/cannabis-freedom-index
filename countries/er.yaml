segments:
  possession:
    text: >-
      Article 395 of the 2015 Penal Code makes possession of controlled drugs for personal use a
      Class 1 petty offence: 6 to 12 months in prison, or a fine of 20,001 to 50,000 nakfa. Article
      396 gives the same penalty for possessing a controlled plant for personal use. Which plants
      and drugs are controlled is set by separate Drug Offences Regulations, which were not available.
    sources:
      - pc2015
  cultivation:
    text: >-
      Growing a controlled plant for personal use carries the same 6 to 12 months or fine (Article
      396). Other cultivation carries 3 to 5 years (Article 387), 5 to 7 for a commercial quantity
      and 7 to 10 for a large commercial quantity (Articles 385 and 386).
    sources:
      - pc2015
  enforcement:
    text: >-
      The code lets a court choose a fine instead of prison for personal use (Articles 395 and 396).
      How courts apply it is not shown by the text.
    sources:
      - pc2015
  sharing:
    text: >-
      Article 377 defines trafficking to include to "give" or "transfer", so passing a drug to
      another person is trafficking: 3 to 5 years (Article 380), 5 to 7 for a commercial quantity
      and 7 to 10 for a large commercial quantity. Buying for your own use is not trafficking
      (Article 381).
    sources:
      - pc2015
  consumption:
    text: >-
      The code punishes possession for personal use or consumption (Articles 395 and 396); no separate offence for use itself was found.
    sources:
      - pc2015
  access:
    text: >-
      No lawful source. Possession of controlled plants and drugs is an offence unless authorised.
    sources:
      - pc2015
