segments:
  possession:
    text: >-
      Illegal under Articles 269–274 of the 2015 Penal Code. Possession for personal use is reported
      to carry about 6 to 12 months in prison, or a fine of roughly 20,000 to 50,000 nakfa.
    sources:
      - cr
  cultivation:
    text: Preparing or cultivating controlled plants is prohibited.
    sources:
      - cr
  enforcement:
    text: >-
      A fine or under a year for users on paper. Eritrea publishes almost nothing about how its
      courts operate, and detention without trial is common.
    sources:
      - cr
  sharing:
    text: Trafficking even small amounts carries five to seven years, up to ten for larger quantities.
    sources:
      - wiki
      - cr
  consumption:
    text: Use is covered by the possession offence.
    sources:
      - cr
