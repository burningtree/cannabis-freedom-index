name: Eritrea
region: Africa
iso_numeric: 232
recreational: illegal
medical: none
updated: '2026-10-21'
summary: >-
  Cannabis remains prohibited. Eritrea’s published 2015 drug penalties were still awaiting
  enforcement in the government’s 2024 account and a 2025 UN report.
scores:
  possession: 1
  cultivation: 1
  enforcement: 2
  sharing: 0
  consumption: 1
  access: 0
segments:
  possession:
    text: >-
      The government identified the Transitional Penal Code as the working law in November 2024. The
      older code published by the Justice Ministry includes unauthorised acquisition, receipt and
      storage of narcotic substances among its drug offences. A current cannabis-specific possession
      tariff has not been verified; the six-to-twelve-month tariff in the published 2015 replacement
      is not an established operative penalty.
    sources:
      - workingCode
      - gov2024
      - un2025
  cultivation:
    text: >-
      The published 2015 code would distinguish personal cultivation from commercial growing, but
      the government and a 2025 UN report said that code was not in force. The older narcotics
      provision covers unauthorised production. The current cannabis-specific growing penalty and
      any subsidiary plant-control rules remain unverified.
    sources:
      - workingCode
      - gov2024
      - un2025
  enforcement:
    text: >-
      Canadian government advice warns of prison sentences and heavy fines for possession, use and
      trafficking of illegal drugs in Eritrea. The published 2015 fine alternative is not evidence
      of the sentence available under the working transitional law. Cannabis-specific sentencing
      practice remains unverified.
    sources:
      - travelCanada
      - gov2024
      - un2025
  sharing:
    text: >-
      The older code’s narcotics offence covers unauthorised distribution and procuring substances
      for another person, with more serious provisions for organised or professional trafficking.
      The published 2015 definition that expressly includes giving and transferring drugs cannot
      establish the current rule while that code awaits commencement.
    sources:
      - workingCode
      - gov2024
      - un2025
  consumption:
    text: >-
      Canadian government advice describes illegal drug use as punishable by imprisonment and heavy
      fines. The older code separately covers knowingly providing premises for drug use. A current
      cannabis-specific use offence and penalty have not been verified.
    sources:
      - travelCanada
      - workingCode
  access:
    text: >-
      No lawful recreational source is established by the reviewed materials. The government’s
      account identifies the older transitional criminal law as the working system.
    sources:
      - gov2024
      - travelCanada
context:
