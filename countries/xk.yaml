segments:
  possession:
    text: >-
      Possession is a crime under the Criminal Code, with one to three years in prison available.
      For a first offence the usual outcome is a fine of around €250–300 rather than custody.
    sources:
      - cann
      - wiki
  cultivation:
    text: Growing cannabis is illegal; industrial hemp may be grown by registered entities.
    sources:
      - cann
  enforcement:
    text: Fines for first-time users, prison possible for repeat offences and for growing or selling.
    sources:
      - cann
  sharing:
    text: Supply is a crime with prison.
    sources:
      - wiki
  consumption:
    text: Use is prosecuted through possession.
    sources:
      - wiki
  access:
    text: None.
    sources:
      - wiki
context:
  production:
    text: >-
      Hemp only; commentators have argued Kosovo should follow its neighbours into medical
      production.
    sources:
      - k2
      - cann
  products:
    text: No legal THC products.
    sources:
      - cann
  medical:
    text: No medical cannabis programme.
    sources:
      - cann
      - wiki
  consequences:
    text: A conviction is a criminal record.
    sources:
      - cann
