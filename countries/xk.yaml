name: Kosovo
region: Europe
recreational: illegal
medical: none
updated: '2026-10-24'
summary: >-
  Possession is criminal. A first offence with less than three grams can bring a fine or up to
  one year in prison.
scores:
  possession: 1
  cultivation: 1
  enforcement: 2
  sharing: 1
  consumption: 1
  access: 0
segments:
  possession:
    text: >-
      Unauthorised possession carries a fine and one to three years in prison. For a first
      offence involving less than three grams of cannabis or hashish for personal use, the
      penalty is a fine or up to one year; the drugs are confiscated.[@code2019]
    sources:
      - code2019
  cultivation:
    text: >-
      Growing cannabis to produce narcotic drugs carries one to ten years in prison, with
      confiscation of the plants and cultivation equipment. The drug law also prohibits growing
      plants from which narcotics can be obtained.[@code2019,l128]
    sources:
      - code2019
      - l128
  enforcement:
    text: >-
      The small-possession tier permits a fine for a first offence below three grams, with
      imprisonment also available.[@code2019] Police continue to investigate supply: in January
      2025 they arrested four men after seizing 25.2 kg of suspected marijuana in
      Pristina.[@kp25]
    sources:
      - code2019
      - kp25
  sharing:
    text: >-
      Unauthorised distribution or sale carries a fine and two to twelve years in prison. Buying
      or holding drugs with intent to sell or distribute carries a fine and two to eight
      years.[@code2019] The drug law’s restrictions also cover free delivery.[@l128]
    sources:
      - code2019
      - l128
  consumption:
    text: >-
      The drug law restricts cannabis activities to scientific research, educational and police
      purposes.[@l128] Possessing cannabis for personal use remains a criminal offence,
      including below three grams for a first-time offender.[@code2019]
    sources:
      - l128
      - code2019
  access:
    text: >-
      Cannabis, resin, extracts and tinctures are in Table I, whose permitted purposes are
      scientific research, education and police work. The prescription and ordinary
      medical-treatment rules apply to other tables.[@l128]
    sources:
      - l128
context:
  production:
    text: >-
      The drug law prohibits cultivating plants from which narcotics can be obtained and places
      cannabis in Table I, restricted to scientific research, educational and police
      purposes.[@l128] Growing cannabis for drug production carries one to ten years in
      prison.[@code2019]
    sources:
      - l128
      - code2019
  products:
    text: >-
      Table I expressly includes cannabis, cannabis resin and cannabis extracts and tinctures.
      Activities involving them are restricted to scientific research, education and police
      purposes.[@l128]
    sources:
      - l128
  medical:
    text: >-
      Cannabis is in Table I, whose exceptions cover scientific research, education and police
      work. The law’s ordinary medical prescribing and licensed health-institution routes
      concern other tables, leaving patients without a cannabis prescribing route under this
      law.[@l128]
    sources:
      - l128
  consequences:
    text: >-
      Even the first-offence tier for less than three grams is a criminal offence, punishable by
      a fine or up to one year in prison, with confiscation of the drugs. Ordinary unauthorised
      possession carries a fine and one to three years.[@code2019]
    sources:
      - code2019
  planting:
    seeds: illegal
    seeds_trade: banned
    clones: illegal
    clones_trade: banned
    text: >-
      The drug law includes supplying and holding seeds, sowing and growing within cultivation
      for obtaining narcotics, and prohibits cultivating plants from which narcotics can be
      obtained. Cannabis is expressly listed in Table I.[@l128]
    sources:
      - l128
  clubs:
    status: none
    text: >-
      The drug law restricts cannabis activities to research, education and police purposes,
      including restrictions on free delivery.[@l128] The criminal code punishes growing
      cannabis for drug production and unauthorised distribution, leaving no lawful recreational
      growing-and-sharing club route.[@code2019]
    sources:
      - l128
      - code2019
  visitors:
    status: none
    text: >-
      Cannabis is restricted to scientific research, education and police purposes.[@l128] The
      criminal possession rule includes a fine or up to one year for first-time offenders with
      less than three grams for personal use; unauthorised import or export carries a fine and
      three to ten years.[@code2019]
    sources:
      - l128
      - code2019
  driving:
    status: zero
    text: >-
      Road Traffic Law 08/L-186 article 232 prohibits driving under narcotic or other
      prohibited-drug influence. Article 234(3) establishes drugs in the body through
      appropriate equipment, medical examination or blood and urine analysis; no separate
      numerical THC allowance is specified. The drug provisions use this presence evidence
      rather than an alcohol concentration band. Article 232(3) sets a EUR150 fine, three
      months' driving prohibition and two negative points. Article 241 authorises police
      screening and referral for medical examination or blood and urine analysis, including
      after a positive drug screen. A motor driver or instructor refusing the required control,
      examination or samples faces the separate EUR150 refusal fine, at least six months'
      driving prohibition and three points; the non-driver refusal tariff differs. Article 216
      requires testing after serious accidents, with a doctor's exception where samples would
      harm health. No general prescription defence was verified. Kosovo Police's May 2026
      statement confirms continued implementation of this 2024 law.
    sources:
      - traffic2024
      - trafficimplementation2026
