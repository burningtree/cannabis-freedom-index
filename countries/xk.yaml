name: Kosovo
region: Europe
recreational: illegal
medical: none
updated: '2026-10-28'
summary: >-
  Possession is criminal. A first offence with less than three grams can bring a fine or up to
  one year in prison.
scores:
  possession: 1
  cultivation: 1
  enforcement: 2
  sharing: 1
  consumption: 1
  access: 0
segments:
  possession:
    text: >-
      Unauthorised possession carries a fine and one to three years in prison under the [2019
      Criminal Code](/history/kosovo-criminal-code-2019/), which kept prison possible even for
      first-time possession.[@code2019] For a first offence involving less than three grams of
      cannabis or hashish for personal use, the penalty is a fine or up to one year; the drugs
      are confiscated.[@code2019]
    sources:
      - code2019
    penalties:
      - label: First offence, under 3 g for personal use
        treatment: criminal
        term: Possession
        prison: 1 year
        note: Fine or up to one year; drugs confiscated
      - label: Other unauthorised possession
        treatment: criminal
        term: Possession
        prison_min: 1 year
        prison: 3 years
        note: Fine and one to three years
  cultivation:
    text: >-
      Growing cannabis to produce narcotic drugs carries one to ten years in prison, with
      confiscation of the plants and cultivation equipment.[@code2019] The drug law also
      prohibits growing plants from which narcotics can be obtained.[@code2019,l128]
    sources:
      - code2019
      - l128
    penalties:
      - label: Growing to produce narcotic drugs
        treatment: criminal
        term: Production
        prison_min: 1 year
        prison: 10 years
        note: Plants and equipment confiscated
  enforcement:
    text: >-
      A first personal-possession offence below three grams can still bring
      imprisonment.[@code2019] National police data record 443 marijuana trafficking and
      possession cases and 584 arrested suspects in 2024.[@socta2025] The 2025 annual report
      records 553 marijuana cases and 21 cannabis-plant cultivation cases, without a
      cannabis-only arrest total.[@annual2025]
    sources:
      - code2019
      - socta2025
      - annual2025
  sharing:
    text: >-
      Unauthorised distribution or sale carries a fine and two to twelve years in prison. Buying
      or holding drugs with intent to sell or distribute carries a fine and two to eight
      years.[@code2019] The drug law’s restrictions also cover free delivery.[@l128]
    sources:
      - code2019
      - l128
    penalties:
      - label: Holding or buying with intent to supply
        treatment: criminal
        term: Purchase or possession with intent to sell or distribute
        prison_min: 2 years
        prison: 8 years
        note: Fine and imprisonment; drugs and relevant means confiscated
      - label: Distribution or sale
        treatment: criminal
        term: Distribution and sale
        prison_min: 2 years
        prison: 12 years
        note: Fine and imprisonment; drugs and relevant means confiscated
      - label: Import or export
        treatment: criminal
        term: Unauthorised import or export
        prison_min: 3 years
        prison: 10 years
        note: Fine and imprisonment; drugs and relevant means confiscated
  consumption:
    text: >-
      The drug law restricts cannabis activities to scientific research, educational and police
      purposes.[@l128] Possessing cannabis for personal use remains a criminal offence,
      including below three grams for a first-time offender.[@code2019]
    sources:
      - l128
      - code2019
  access:
    text: >-
      Cannabis, resin, extracts and tinctures are in Table I, whose permitted purposes are
      scientific research, education and police work. The prescription and ordinary
      medical-treatment rules apply to other tables.[@l128]
    sources:
      - l128
context:
  recreational:
    text: >-
      There is no legal recreational supply. Possessing cannabis for personal use is a criminal
      offence, including below three grams for a first-time offender, where the penalty is a
      fine or up to one year with confiscation.[@code2019] The [2019
      code](/history/kosovo-criminal-code-2019/) deliberately kept prison possible for
      first-time possession.[@code2019]
    sources:
      - code2019
  production:
    status: none
    text: >-
      Cannabis cultivation is prohibited by the [2008 drug
      law](/history/kosovo-narcotics-law-2008/), and Table I cannabis activities are restricted
      to scientific research, education and police work.[@l128] Article 16 permits licensed
      institutions to acquire, possess and use Table I substances for research, with Interior
      Ministry authorisation after committee approval; it does not establish a commercial
      growing licence.[@l128] Unauthorised cultivation for drug production carries one to ten
      years in prison.[@code2019]
    sources:
      - l128
      - code2019
  medical:
    text: >-
      Cannabis is in Table I, whose exceptions cover scientific research, education and police
      work. The table expressly includes cannabis, resin, extracts and tinctures.[@l128] The
      law’s ordinary medical prescribing and licensed health-institution routes concern other
      tables, leaving patients without a cannabis prescribing route under this law.[@l128]
    sources:
      - l128
  hemp:
    status: none
    text: >-
      Cannabis, resin, extracts and tinctures sit in Table I of the drug law, whose exceptions
      concern scientific research, education and police purposes.[@l128] The law also prohibits
      cultivating plants from which narcotics can be obtained.[@l128] These provisions provide
      no THC-based industrial growing exemption.[@l128]
    sources:
      - l128
  consequences:
    text: >-
      Even the first-offence tier for less than three grams is a criminal offence, punishable by
      a fine or up to one year in prison, with confiscation of the drugs. Ordinary unauthorised
      possession carries a fine and one to three years.[@code2019]
    sources:
      - code2019
  planting:
    seeds: illegal
    seeds_trade: banned
    clones: illegal
    clones_trade: banned
    text: >-
      The drug law includes supplying and holding seeds, sowing and growing within cultivation
      for obtaining narcotics, and prohibits cultivating plants from which narcotics can be
      obtained. Cannabis is expressly listed in Table I.[@l128]
    sources:
      - l128
  clubs:
    status: none
    text: >-
      The drug law restricts cannabis activities to research, education and police purposes,
      including restrictions on free delivery.[@l128] The criminal code punishes growing
      cannabis for drug production and unauthorised distribution, leaving no lawful recreational
      growing-and-sharing club route.[@code2019]
    sources:
      - l128
      - code2019
  visitors:
    status: none
    text: >-
      Cannabis is restricted to scientific research, education and police purposes.[@l128] The
      criminal possession rule includes a fine or up to one year for first-time offenders with
      less than three grams for personal use; unauthorised import or export carries a fine and
      three to ten years.[@code2019]
    sources:
      - l128
      - code2019
  driving:
    status: zero
    text: >-
      Road Traffic Law 08/L-186 article 232 prohibits driving under narcotic or other
      prohibited-drug influence. Article 234(3) confirms drugs in the body through appropriate
      equipment, medical examination or blood and urine analysis; no separate numerical THC
      allowance is specified.[@traffic2024] The drug provisions use this presence evidence
      rather than an alcohol concentration band. Article 232(3) sets a EUR150 fine, three
      months' driving prohibition and two negative points.[@traffic2024] Article 241 authorises
      police screening and referral for medical examination or blood and urine analysis,
      including after a positive drug screen. A motor driver or instructor refusing the required
      control, examination or samples faces the separate EUR150 refusal fine, at least six
      months' driving prohibition and three points; the non-driver refusal tariff
      differs.[@traffic2024] Article 216 requires testing after serious accidents, with a
      doctor's exception where samples would harm health. No general prescription defence was
      verified.[@traffic2024] Kosovo Police's May 2026 statement confirms continued
      implementation of this 2024 law.[@trafficimplementation2026]
    sources:
      - traffic2024
      - trafficimplementation2026
  black_market:
    text: >-
      Kosovo Police’s 2025 threat assessment describes both imports from Albania and domestic
      cultivation.[@socta2025] Its 2024 table records 1,279.8 kg of marijuana
      seized.[@socta2025] The [2025 annual
      report](/history/kosovo-police-cannabis-results-2025/) records 1,315.8691 kg of marijuana
      and 6,587 cannabis plants seized during that year; weight and plant counts are separate
      measures.[@annual2025]
    sources:
      - socta2025
      - annual2025
  arrests:
    text: >-
      The police threat assessment records 443 marijuana trafficking and possession cases and
      584 arrested suspects in 2024.[@socta2025] It combines possession and trafficking, so
      these are not counts of personal-use arrests or convictions.[@socta2025] The 2025 annual
      report lists 553 marijuana cases and another 21 cannabis-plant cultivation cases, while
      its 961 drug-related arrests cover all drugs.[@annual2025]
    sources:
      - socta2025
      - annual2025
