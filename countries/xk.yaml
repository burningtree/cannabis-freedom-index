segments:
  possession:
    text: >-
      Possession is a crime under the Criminal Code, with one to three years in prison available.
      For a first offence the usual outcome is a fine of around €250–300 rather than custody.
    sources:
      - cann
      - wiki
  cultivation:
    text: Growing cannabis is illegal; industrial hemp may be grown by registered entities.
    sources:
      - cann
  enforcement:
    text: Fines for first-time users, prison possible for repeat offences and for growing or selling.
    sources:
      - cann
  sharing:
    text: >-
      Supply is a crime with prison. Kosovo Police charge suspects with the unauthorised
      purchase, possession, distribution and sale of narcotics, as in a January 2025 operation
      in Pristina in which four men were arrested over 25 kg of marijuana.
    sources:
      - kp25
      - wiki
  consumption:
    text: Use is prosecuted through possession.
    sources:
      - wiki
  access:
    text: >-
      None: Kosovo Police charge the unauthorised purchase, possession, distribution and sale of
      narcotics alike.
    sources:
      - kp25
context:
  production:
    text: >-
      Hemp only; commentators have argued Kosovo should follow its neighbours into medical
      production.
    sources:
      - k2
      - cann
  products:
    text: No legal THC products.
    sources:
      - cann
  medical:
    text: No medical cannabis programme.
    sources:
      - cann
      - wiki
  consequences:
    text: A conviction is a criminal record.
    sources:
      - cann
  planting:
    seeds: illegal
    seeds_trade: banned
    clones: illegal
    clones_trade: banned
    text: >-
      Law 02/L-128 defines cultivation of plants for narcotics as including the supply and
      possession of seeds, sowing and growing, and Article 3.2 prohibits cultivating plants
      from which narcotics can be obtained. The law names cannabis among those plants. The
      text read is the 2008 gazette version.
    sources:
      - l128
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited.
    sources:
      - cann
      - wiki
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. Possession is a crime under the Criminal
      Code, with one to three years in prison available; for a first offence the usual outcome
      is a fine of around €250 to €300.
    sources:
      - cann
      - wiki
  driving:
    status: zero
    text: >-
      Road Traffic Law 08/L-186 article 232 prohibits driving under narcotic or
      other prohibited-drug influence. Article 234(3) establishes drugs in the body
      through appropriate equipment, medical examination or blood and urine analysis;
      no separate numerical THC allowance is specified. The drug provisions use this
      presence evidence rather than an alcohol concentration band. Article 232(3)
      sets a EUR150 fine, three months' driving prohibition and two negative points.
      Article 241 authorises police screening and referral for medical examination or
      blood and urine analysis, including after a positive drug screen. A motor driver
      or instructor refusing the required control, examination or samples faces the
      separate EUR150 refusal fine, at least six months' driving prohibition and three
      points; the non-driver refusal tariff differs. Article 216 requires testing
      after serious accidents, with a doctor's exception where samples would harm
      health. No general prescription defence was verified. Kosovo Police's May 2026
      statement confirms continued implementation of this 2024 law.
    sources:
      - traffic2024
      - trafficimplementation2026
