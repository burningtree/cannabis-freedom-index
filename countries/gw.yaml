  planting:
    seeds: grey
    seeds_trade: unclear
    clones: illegal
    clones_trade: banned
    text: >-
      Decree-Law 2-B/93 punishes anyone who, without authorisation, cultivates, sells, buys,
      transports or holds plants listed in its first two tables with two to twelve years in
      prison. The decree-law does not mention seeds.
    sources:
      - dl2b93
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited.
    sources:
      - un
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. Possession of cannabis for one's own use
      carries one to six months in prison, from which a first-time offender can be exempted;
      supplying it, even free of charge, is trafficking.
    sources:
      - idpc17
      - dl2b93
  black_market:
    text: >-
      Figures reported by the government to the UN drugs office record 9,579 kg of herbal
      cannabis seized in 2023, against 291 kg in 2022. The UN publishes them as kilogram
      equivalents, and countries count seizures differently, so the figures are not
      comparable across borders.
    sources:
      - unodc_szr
