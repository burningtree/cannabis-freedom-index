    clones: illegal
    clones_trade: banned
    text: >-
      Decree-Law 2-B/93 punishes anyone who, without authorisation, cultivates, sells, buys,
      transports or holds plants listed in its first two tables with two to twelve years in
      prison. The decree-law does not mention seeds.
    sources:
      - dl2b93
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited.
    sources:
      - cr
      - un
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. British travel advice says there are
      severe penalties for all drug offences and that local prison conditions are harsh.
    sources:
      - cr
      - fcdo
