segments:
  possession:
    text: >-
      Illegal under Decree-Law 2-B/93 and a 2010 drug law. Possession for personal use is punishable
      by up to three months in prison or a fine — a separate, much lighter provision than the
      2-to-12-year trafficking offence.
    sources:
      - cr
      - un
  cultivation:
    text: >-
      Growing for personal consumption is covered by the same lighter provision; other cultivation
      is trafficking.
    sources:
      - cr
      - un
  enforcement:
    text: >-
      Light penalties for users on paper. The country's drug enforcement is dominated by its role as
      a cocaine transit point, and the justice system is weak.
    sources:
      - cr
      - un
  sharing:
    text: >-
      Transferring drugs, even free of charge, falls under the trafficking offence with 2 to 12
      years.
    sources:
      - cr
  consumption:
    text: Consumption is an offence under the personal-use provision.
