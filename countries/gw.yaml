name: Guinea-Bissau
region: Africa
iso_numeric: 624
recreational: illegal
medical: none
updated: "2026-10-15"
summary: >-
  The 1993 decree-law criminalises use and small personal possession or cultivation, with different
  custody bands for high-risk plants, cannabis oil and other cannabis derivatives. Its youth waiver
  is conditional, not a general first-offender exemption.
scores:
  possession: 1
  cultivation: 1
  enforcement: 2
  sharing: 0
  consumption: 0
  access: 0
segments:
  possession:
    text: >-
      Article 20 of Decree-Law 2-B/93 separates small quantities intended for personal consumption
      from ordinary trafficking. It sets two months to one year for high-risk plants or substances,
      expressly including cannabis oil, and one to six months for cannabis derivatives other than
      oil. It does not state a gram threshold or a fine alternative in that article. The earlier
      three-month-or-fine claim was unsupported; representative sentencing practice remains
      unverified, so the possession rating is provisional.
    sources:
      - dl2b93
  cultivation:
    text: >-
      Small-quantity cultivation for personal consumption falls within article 20, with the same
      substance-dependent prison bands as personal possession. Other unauthorised cultivation of
      Table I/II plants falls under article 3, whose maximum is twelve years. The compilation prints
      an editorial two-year minimum but notes that the official gazette omitted that number. No
      legal home-growing allowance or fixed plant limit was established.
    sources:
      - dl2b93
  enforcement:
    text: >-
      The law permits custody for personal use. A discretionary waiver under article 20(2) requires
      all three conditions: the person is below legal adulthood, has no repeat offence, and solemnly
      undertakes before a magistrate not to repeat it. Article 22 allows a dependent offender’s
      sentence to be suspended on treatment conditions, with revocation for culpable noncompliance.
      These are statutory routes, not evidence that adult users usually receive fines; the
      enforcement rating remains provisional pending actual outcomes.
    sources:
      - dl2b93
  sharing:
    text: >-
      Article 3 includes offering, distributing, transferring or providing high-risk drugs to
      another person, with no general exemption for an unpaid gift. Its maximum is twelve years; the
      printed two-year minimum is flagged by the editor as absent from the official gazette. Article
      12 separately punishes inciting or facilitating illicit use. Passing cannabis to another adult
      is not a lawful sharing route.
    sources:
      - dl2b93
  consumption:
    text: >-
      Use itself is an offence under article 20. The text distinguishes high-risk plants or
      substances including cannabis oil (two months to one year) from other cannabis derivatives
      (one to six months). It should not be reduced to a single one-to-six-month tariff for all
      cannabis. The waiver is restricted to qualifying minors, not all first offenders. Article 21
      protects anonymity and medical confidentiality for people voluntarily seeking health
      assistance.
    sources:
      - dl2b93
  access:
    text: >-
      No lawful recreational supply route or operating cannabis patient service was established.
      Article 3 distinguishes authorised conduct from illicit supply, but does not itself show that
      cannabis licences or medicines are available. Voluntary addiction care under article 21 is not
      a permission to obtain cannabis.
    sources:
      - dl2b93
context:
  production:
    status: medical
    text: >-
      Article 3 distinguishes unauthorised cultivation and manufacture from conduct under an
      authorisation; licence-holders acting outside their authorisation face separate penalties.
      This recognises an authorisation framework, but the reviewed text does not establish issued
      cannabis production licences, an industrial-hemp exemption or lawful production volumes.
    sources:
      - dl2b93
  products:
    text: >-
      Table I expressly lists cannabis and cannabis resin. Article 20 distinguishes cannabis oil
      from other derivatives when setting personal-use penalties. These statutory categories do not
      establish any product currently available through legal retail or patient supply.
    sources:
      - dl2b93
  medical:
    text: >-
      Articles 21–23 regulate care for people using drugs: voluntary attendance carries anonymity
      and professional secrecy, while treatment ordered within proceedings involves reports to the
      court, normally every three months. These addiction-treatment provisions do not establish a
      cannabis prescribing programme or patient supply service.
    sources:
      - dl2b93
  consequences:
    text: >-
      Articles 16–17 provide forfeiture of drug-related equipment, proceeds and associated assets.
      Under article 19, a court may expel a foreign national convicted of trafficking for at least
      ten years; this is not an automatic consequence of every small personal-possession conviction.
      Specified premises offences can also lead to closure for one to five years.
    sources:
      - dl2b93
  planting:
    seeds: grey
    seeds_trade: unclear
    clones: illegal
    clones_trade: banned
    text: >-
      Article 20 covers small personal cultivation without legalising it, while article 3 covers
      other unauthorised cultivation. Table I lists cannabis and resin, but the reviewed text does
      not expressly settle isolated seed possession or seed trading. The grey seed label records
      that unresolved scope, not a verified permission. Growing cuttings has no recreational
      exemption.
    sources:
      - dl2b93
  clubs:
    status: none
    text: >-
      The reviewed law establishes no recreational collective-growing or supply permission: personal
      cultivation remains an offence under article 20 and transferring cannabis to another person
      falls under article 3. This legal restriction does not establish whether informal associations
      exist.
    sources:
      - dl2b93
  visitors:
    status: none
    text: >-
      No recreational visitor supply route was established. Article 20 permits custody for small
      personal possession or use, and its waiver requires minority, no repeat offence and a solemn
      undertaking. Foreign nationals convicted of trafficking may additionally face expulsion for at
      least ten years under article 19.
    sources:
      - dl2b93
  black_market:
    text: >-
      Figures reported by the government to the UN drugs office record 9,579 kg of herbal cannabis
      seized in 2023, against 291 kg in 2022. The UN publishes them as kilogram equivalents, and
      countries count seizures differently, so the figures are not comparable across borders.
    sources:
      - unodc_szr
