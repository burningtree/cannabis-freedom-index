name: Guinea-Bissau
region: Africa
iso_numeric: 624
recreational: illegal
medical: none
updated: 2026-10-27
summary: >-
  The 1993 decree-law criminalises use and small personal possession or cultivation, with different
  custody bands for high-risk plants, cannabis oil and other cannabis derivatives. Its youth waiver
  is conditional, not a general first-offender exemption.
scores:
  possession: 1
  cultivation: 1
  enforcement: 2
  sharing: 0
  consumption: 0
  access: 0
segments:
  possession:
    text: >-
      Article 20 of [Decree-Law 2-B/93](/history/guinea-bissau-drug-law-1993/)
      separates small quantities intended for personal consumption from ordinary
      trafficking. It sets two months to one year for high-risk plants or substances,
      expressly including cannabis oil, and one to six months for cannabis derivatives
      other than oil.[@dl2b93] It does not state a gram threshold or a fine alternative
      in that article.[@dl2b93]
    sources:
      - dl2b93
    penalties:
      - label: Cannabis oil, small amount for personal use
        treatment: criminal
        term: Personal use
        prison_min: 2 months
        prison: 1 year
        note: Or waiver for qualifying minors
      - label: Other cannabis derivatives, small amount for personal use
        treatment: criminal
        term: Personal use
        prison_min: 1 month
        prison: 6 months
        note: Or waiver for qualifying minors
  cultivation:
    text: >-
      Small-quantity cultivation for personal consumption falls within article 20, with
      the same substance-dependent prison bands as personal possession.[@dl2b93] Other
      unauthorised cultivation of Table I/II plants falls under article 3, whose maximum
      is twelve years; the compilation prints an editorial two-year minimum but notes
      that the official gazette omitted that number.[@dl2b93]
    sources:
      - dl2b93
    penalties:
      - label: Cannabis oil, small amount grown for personal use
        treatment: criminal
        term: Personal use
        prison_min: 2 months
        prison: 1 year
        note: Or waiver for qualifying minors
      - label: Other derivatives, small amount grown for personal use
        treatment: criminal
        term: Personal use
        prison_min: 1 month
        prison: 6 months
        note: Or waiver for qualifying minors
      - label: Other unauthorised cultivation (article 3)
        treatment: criminal
        term: Unlicensed cultivation
        prison: 12 years
        note: Maximum twelve years; printed minimum omitted in the gazette
  enforcement:
    text: >-
      The law permits custody for personal use. A discretionary waiver under article
      20(2) requires all three conditions: the person is below legal adulthood, has no
      repeat offence, and solemnly undertakes before a magistrate not to repeat
      it.[@dl2b93] Article 22 allows a dependent offender's sentence to be suspended on
      treatment conditions, with revocation for culpable noncompliance.[@dl2b93]
    sources:
      - dl2b93
  sharing:
    text: >-
      Article 3 includes offering, distributing, transferring or providing high-risk
      drugs to another person, with no general exemption for an unpaid gift.[@dl2b93]
      Its maximum is twelve years; the printed two-year minimum is flagged by the
      editor as absent from the official gazette.[@dl2b93] Article 12 separately
      punishes inciting or facilitating illicit use.[@dl2b93]
    sources:
      - dl2b93
    penalties:
      - label: Offering or providing high-risk drugs to another person
        treatment: criminal
        term: Trafficking
        prison: 12 years
        note: Maximum twelve years; printed minimum omitted in the gazette
  consumption:
    text: >-
      Use itself is an offence under article 20. The text distinguishes high-risk plants
      or substances including cannabis oil (two months to one year) from other cannabis
      derivatives (one to six months).[@dl2b93] The waiver is restricted to qualifying
      minors, not all first offenders.[@dl2b93]
    sources:
      - dl2b93
    penalties:
      - label: Cannabis oil, personal use
        treatment: criminal
        term: Drug use
        prison_min: 2 months
        prison: 1 year
        note: Or waiver for qualifying minors
      - label: Other cannabis derivatives, personal use
        treatment: criminal
        term: Drug use
        prison_min: 1 month
        prison: 6 months
        note: Or waiver for qualifying minors
  access:
    text: >-
      No lawful recreational supply route or operating cannabis patient service was
      established.[@dl2b93] Article 3 distinguishes authorised conduct from illicit
      supply, but does not itself show that cannabis licences or medicines are
      available.[@dl2b93]
    sources:
      - dl2b93
context:
  recreational:
    text: >-
      Cannabis is prohibited: small personal possession, cultivation and use carry
      custody bands, and supply carries up to twelve years.[@dl2b93] The youth waiver
      needs minority, no repeat offence and a solemn undertaking together, so it is no
      general first-offender exemption.[@dl2b93]
    sources:
      - dl2b93
  medical:
    text: >-
      Articles 21–23 regulate care for people using drugs: voluntary attendance carries
      anonymity and professional secrecy, while treatment ordered within proceedings
      involves reports to the court.[@dl2b93] These addiction-treatment provisions do
      not establish a cannabis prescribing programme or patient supply service.[@dl2b93]
    sources:
      - dl2b93
  hemp:
    status: none
    text: >-
      The provisions reviewed set no THC line for hemp and no fibre or food exception:
      cannabis and resin sit in Table I, and unauthorised cultivation is punished
      regardless of claimed use.[@dl2b93]
    sources:
      - dl2b93
  production:
    status: medical
    text: >-
      Article 3 distinguishes unauthorised cultivation and manufacture from conduct
      under an authorisation; licence-holders acting outside their authorisation face
      separate penalties.[@dl2b93] This recognises an authorisation framework, but the
      reviewed text does not establish issued cannabis production licences for medical
      purposes, an industrial-hemp exemption or lawful production volumes.[@dl2b93]
    sources:
      - dl2b93
  consequences:
    text: >-
      Articles 16–17 provide forfeiture of drug-related equipment, proceeds and
      associated assets.[@dl2b93] Under article 19, a court may expel a foreign
      national convicted of trafficking for at least ten years.[@dl2b93]
    sources:
      - dl2b93
  planting:
    seeds: grey
    seeds_trade: unclear
    clones: illegal
    clones_trade: banned
    text: >-
      Article 20 covers small personal cultivation without legalising it, while article
      3 covers other unauthorised cultivation.[@dl2b93] Table I lists cannabis and
      resin, but the reviewed text does not expressly settle isolated seed possession
      or seed trading.[@dl2b93]
    sources:
      - dl2b93
  clubs:
    status: none
    text: >-
      The reviewed law provides no recreational collective-growing or supply
      permission: personal cultivation remains an offence under article 20 and
      transferring cannabis to another person falls under article 3.[@dl2b93]
    sources:
      - dl2b93
  visitors:
    status: none
    text: >-
      No recreational visitor supply route was established.[@dl2b93] Article 20 permits
      custody for small personal possession or use, and its waiver requires minority,
      no repeat offence and a solemn undertaking.[@dl2b93]
    sources:
      - dl2b93
  black_market:
    text: >-
      Figures reported by the government to the UN drugs office record 9,579 kg of
      herbal cannabis seized in 2023, against 291 kg in 2022.[@unodc_szr] The UN
      publishes them as kilogram equivalents, and countries count seizures differently,
      so the figures are not comparable across borders.[@unodc_szr] Cross-border flow
      continues: police arrested a courier near Sédhiou in February 2026 with part of a
      56 kg convoy bound for Guinea-Bissau, and Senegal's Ziguinchor customs seized more
      than 10 tonnes of cannabis in the first half of 2026, as that [border
      interception](/history/guinea-bissau-senegal-cannabis-convoy-2026/) records.[@aq26]
    sources:
      - unodc_szr
      - aq26
