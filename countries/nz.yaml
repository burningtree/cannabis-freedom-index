summary: >-
  Illegal, but since 2019 police must consider a health-based response before prosecuting. A
  legalisation referendum narrowly failed in 2020; the medical scheme has operated since.
scores:
  possession: 2
  cultivation: 1
  enforcement: 4
  sharing: 1
  consumption: 1
  access: 2
segments:
  possession:
    text: >-
      Possession is a criminal offence with a maximum of three months' prison or a NZ$500 fine, and
      a legal presumption against imprisonment. Since August 2019 police must consider whether a
      health-based response would be more beneficial than prosecution, and many cases now end in a
      warning or referral — but thousands are still charged.
    sources:
      - moh
      - pmcsa
  cultivation:
    text: Growing any cannabis plant is a criminal offence, with up to seven years on indictment.
    sources:
      - pmcsa
  enforcement:
    text: >-
      Mostly warnings and fines for users, with prosecutions down since 2019 but far from gone.
      Cultivation and supply carry prison.
    sources:
      - moh
      - nh
  sharing:
    text: >-
      Supply, including giving it away, is an offence; holding 28 g or more creates a presumption of
      supply.
    sources:
      - pmcsa
  consumption:
    text: >-
      Use is an offence under the same provision as possession, handled with the same police
      discretion.
    sources:
      - moh
      - pmcsa
  access:
    text: >-
      No adult-use source. A 2020 referendum on a regulated legal market failed narrowly, 50.7% to
      48.4%. Medicinal cannabis is available on prescription from pharmacies.
    sources:
      - ref
      - pmcsa
context:
  production:
    text: >-
      Since April 2020 the Medicinal Cannabis Scheme licenses commercial cultivation and manufacture
      for medicinal use only.
    sources:
      - pmcsa
      - ref
  products:
    text: Prescription flower and oils that meet the scheme's quality standard; nothing else.
    sources:
      - pmcsa
  medical:
    text: >-
      Any doctor can prescribe approved medicinal cannabis products for any condition. Products are
      unsubsidised and costly.
    sources:
      - pmcsa
  consequences:
    text: >-
      A conviction is a criminal record affecting travel and work. Roadside oral-fluid drug testing
      was introduced with penalties for THC.
    sources:
      - pmcsa
      - nh
  planting:
    seeds: illegal
    seeds_trade: banned
    clones: illegal
    clones_trade: banned
    text: >-
      New Zealand Police list cannabis seed and cannabis plant as Class C controlled drugs.
      Possessing cannabis seed carries up to one year in prison or a NZ$500 fine, cultivating
      the plant up to seven years, and supplying a Class C drug up to eight years.
    sources:
      - police
  clubs:
    status: underground
    text: >-
      Clubs are illegal and the best-known one has been shut down repeatedly. The Daktory ran
      openly in Auckland from late 2008 to 2012 as a members' club where cannabis was sold
      over the counter and smoked on the premises; it drew more than 2,000 members before
      police raided and closed it. Its founder reopened it in Wellington, where police raided
      it in August 2019, charging him and another man with offences including possession for
      supply, and again in December 2019, a month after it had reopened.
    sources:
      - spin20
      - one19
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone, so a visitor has no lawful way to buy
      cannabis. Whatever legal supply exists is medical, for patients with a prescription or
      registration. The sources behind this profile describe no separate rule for visitors.
    sources:
      - ref
      - pmcsa
  driving:
    status: limit
    text: >-
      Police can stop any driver and screen saliva at the roadside for four drugs, THC among
      them. Testing began in Wellington on 15 December 2025, with a national roll-out planned
      from April 2026. The device reacts only at or above a built-in threshold, which police
      say is set to show recent use and to exclude past use and passive exposure. A positive
      screen leads to a second one and a saliva sample for the laboratory; two positive
      screens mean a 12-hour driving ban on the spot. A fine follows only if the laboratory
      confirms the drug at or above its threshold: 200 dollars and 50 demerit points for one
      drug, 400 dollars and 75 points for two or more, and the same 400 dollars and 75 points
      for refusing the test. In blood, a concentration within the tolerance level is an
      infringement and one at the high-risk level a crime. Patients prescribed cannabis can
      still test positive; they must take the test and may apply afterwards for a medical
      defence if they took the medicine as prescribed.
    sources:
      - pdd1
      - pdd2
      - pdd3
      - pdd4
  arrests:
    text: >-
      Ministry of Justice figures reported in March 2026 show 3,438 people charged with
      possessing cannabis in 2025, up from 2,881 in 2024 and 2,287 in 2023, the highest number
      since a 2019 law change told police to consider a health-based response first. Charges
      had fallen from 3,719 in 2017 to a low of 2,055 in 2021. Of all convictions for cannabis
      offences, 82% came alongside charges unrelated to cannabis; 506 people were convicted of
      cannabis offences alone in 2025, against 387 in 2023. Police said the rise tracks higher
      use seen in wastewater testing, and that the charge figures leave out the warnings
      officers give for possession.
    sources:
      - zb26
