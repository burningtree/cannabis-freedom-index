name: New Zealand
region: Oceania
iso_numeric: 554
recreational: illegal
medical: legal
updated: 2026-10-28
summary: >-
  Illegal, but since 2019 police must consider a health-based response before prosecuting. A
  legalisation referendum narrowly failed in 2020; the medical scheme has operated since.
scores:
  possession: 2
  cultivation: 1
  enforcement: 4
  sharing: 1
  consumption: 1
  access: 2
segments:
  possession:
    text: >-
      Possession is a criminal offence with a maximum of three months' prison or a NZ$500 fine. For a
      Class C plant or seed offence, there is a legal presumption against imprisonment unless there
      are previous convictions or exceptional circumstances; Class B preparations do not have that
      custody presumption.[@mda,pmcsa] Since August 2019 police must consider whether a
      health-based response would be more beneficial than prosecution, and many cases now end in a
      warning or referral — but thousands are still charged.[@moh] The 1975 Act that still governs
      cannabis is traced in the [1975 Act](/history/new-zealand-misuse-of-drugs-1975/), and the 2019
      discretion in its [amendment](/history/new-zealand-police-discretion-2019/).
    sources:
      - moh
      - pmcsa
      - mda
    currency: NZD
    penalties:
      - label: Ordinary Class B/C personal possession
        treatment: criminal
        term: Possession
        prison: 3 months
        fine: 500
        note: Class C only has the presumption against imprisonment; health response considered first
  cultivation:
    text: >-
      Growing cannabis is a criminal offence, with up to seven years.[@pmcsa] The one
      exception is low-THC hemp, at most 1% THC by dry weight: since 28 May 2026 it may be grown
      without a licence for specified purposes, such as breeding, making hemp products or
      supplying the medicinal scheme, after notifying both Police and the Ministry for Primary
      Industries, and a notification lasts a year.[@hemp_regs,police_hemp] It gives no right to grow cannabis to use.[@hemp_regs]
    sources:
      - hemp_regs
      - police_hemp
      - pmcsa
    currency: NZD
    penalties:
      - label: Growing cannabis
        treatment: criminal
        term: Unlicensed cultivation
        prison: 7 years
      - label: Hemp growing with notification (from 28 May 2026)
        treatment: legal
        term: Licensed hemp
        note: Notify Police and MPI; 1% THC max; one-year notification; no right to grow for use
  enforcement:
    text: >-
      Warnings and health referrals have reduced user prosecutions since 2019, although many people
      are still charged.[@moh,nh] Ordinary Class B/C personal possession can carry up to three
      months and/or NZ$500. The Class C presumption against imprisonment does not apply to Class B
      preparations.[@mda] Supply accusations have different penalties: up to fourteen years for
      Class B preparations and eight years for Class C plant offences under section 6. The supply
      presumptions differ by form and can be rebutted.[@police_penalties,mda]
    sources:
      - moh
      - nh
      - police_penalties
      - mda
  sharing:
    text: >-
      Unauthorised supply is an offence even below the presumption amounts. Possessing 28 g of Class
      C cannabis plant material, 5 g of a Class B cannabis preparation such as hashish or oil, or
      250 mg of the separately scheduled THC creates a rebuttable presumption of supply; it is not
      an automatic conviction. The cannabis rows also specify 100 cigarettes containing the drug.
      Section 6 supply offences carry up to fourteen years for Class B and eight years for Class C;
      lower-level Class C supply can instead fall under section 7.[@mda,police_penalties]
    sources:
      - mda
      - police_penalties
    currency: NZD
    penalties:
      - label: Selling or supplying Class C cannabis
        treatment: criminal
        term: Supply
        prison: 8 years
      - label: Supplying Class C cannabis to a person under 18
        treatment: criminal
        term: Supply to a minor
        prison: 8 years
      - label: Giving Class C cannabis without sale
        treatment: criminal
        term: Gift
        prison: 3 months
        fine: 500
      - label: Supplying Class B cannabis
        treatment: criminal
        term: Supply
        prison: 14 years
      - label: Possession for supply
        treatment: criminal
        term: Possession for supply
        prison: 14 years
        note: 8 years for Class C plant, 14 for Class B preparations
  consumption:
    text: >-
      Use is an offence under the same provision as possession, handled with the same police
      discretion.[@moh,pmcsa]
    sources:
      - moh
      - pmcsa
  access:
    text: >-
      No adult-use source. A 2020 referendum on a regulated legal market failed narrowly, 50.7% to
      48.4%.[@ref] Medicinal cannabis is available on prescription from pharmacies.[@pmcsa] The vote
      is traced in the [2020 referendum](/history/new-zealand-referendum-2020/).
    sources:
      - ref
      - pmcsa
context:
  production:
    status: medical
    text: >-
      Since April 2020 the Medicinal Cannabis Scheme has licensed commercial cultivation and
      manufacture of medicinal cannabis under the Misuse of Drugs Act and the 2019
      regulations.[@moh_industry] Since 28 May 2026 low-THC hemp (at most 1% THC) may be grown,
      processed and supplied within New Zealand without a licence for specified purposes, after the
      grower notifies Police and the Ministry for Primary Industries.[@hemp_regs] Importing and
      exporting hemp plants and seed still needs a licence.[@hemp_regs]
    sources:
      - moh_industry
      - hemp_regs
  medical:
    text: >-
      Any doctor or nurse practitioner can prescribe a verified medicinal cannabis product for any
      condition; pharmacist prescribers are limited to CBD and some Class B1 dosage
      products.[@pmcsa] Products are unsubsidised and costly.[@pmcsa] Prescription flower and oils must meet the
      scheme's quality standard; CBD products meeting the legal definition are prescription-only
      medicines, and hemp flower or leaf is not a food.[@pmcsa,moh_hemp] The scheme's launch is
      traced in the [2020 scheme](/history/new-zealand-medicinal-scheme-2020/).
    sources:
      - pmcsa
      - moh_hemp
  recreational:
    text: >-
      Recreational cannabis is fully illegal: possession is a crime even if police must now consider
      a health response first, and the only public vote on a legal market failed.[@moh,ref] A tinny —
      a small foil-wrapped deal — remains the street-level unit, sold from ordinary-looking tinny
      houses; researchers found their young, often Maori buyers showed no wider drug
      escalation.[@nzdf07]
    sources:
      - moh
      - ref
      - nzdf07
  hemp:
    status: high
    text: >-
      Hemp at most 1% THC may be grown without a licence for specified purposes since May 2026,
      after notifying Police and the Ministry for Primary Industries.[@hemp_regs] It gives no right to
      grow cannabis to use, and importing or exporting hemp plants and seed still needs a
      licence.[@hemp_regs] CBD remains prescription-only, and hemp leaf or flower is not a food.[@moh_hemp]
    sources:
      - hemp_regs
      - moh_hemp
  consequences:
    text: >-
      A conviction is a criminal record affecting travel and work.[@pmcsa] Roadside oral-fluid drug testing
      was introduced with penalties for THC.[@nh]
    sources:
      - pmcsa
      - nh
  planting:
    seeds: conditional
    seeds_trade: conditional
    clones: conditional
    clones_trade: conditional
    text: >-
      Since 28 May 2026, qualifying hemp seeds, seedlings and cuttings may be held, procured, sold and
      supplied domestically for the permitted hemp purposes under regulation 14A.[@hemp_regs] Supply
      must be to a person legally entitled to possess hemp; growers notify Police and the Ministry for
      Primary Industries, with notifications valid for one year.[@hemp_regs] Hemp cultivars must
      contain no more than 1% THC by dry weight. Clones, tissue, seedlings and seeds of high-THC
      cultivars are not hemp, even when young material itself contains little THC.[@moh_hemp]
      Ordinary cannabis seed is a Class C controlled drug, so possessing or germinating it remains an
      offence; only qualifying hemp material is outside the licence requirement.[@mda,hemp_regs]
      Importing or exporting whole hemp seed or plant material still needs a licence.[@hemp_regs,
      moh_hemp]
    sources:
      - hemp_regs
      - moh_hemp
      - mda
  clubs:
    status: underground
    text: >-
      Clubs are illegal and the best-known one has been shut down repeatedly. The Daktory ran
      openly in Auckland from late 2008 to 2012 as a members' club where cannabis was sold
      over the counter and smoked on the premises; it drew more than 2,000 members before
      police raided and closed it.[@spin20] Its founder reopened it in Wellington, where police raided
      it in August 2019, charging him and another man with offences including possession for
      supply, and again in December 2019, a month after it had reopened.[@one19]
    sources:
      - spin20
      - one19
  culture:
    text: >-
      A tinny is a small foil-wrapped deal, and a tinny house the ordinary-looking home that sells
      it to anyone with cash — the country's street-level trade, which researchers found drew
      younger, often Maori buyers without spreading harder-drug use, deflating a 2000s panic that
      the houses pushed methamphetamine.[@nzdf07] Its story is traced in
      [tinny](/culture/language/tinny/).[@nzdf07]
    sources:
      - nzdf07
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone, so a visitor has no lawful way to buy
      cannabis.[@ref] Whatever legal supply exists is medical, for patients with a prescription or
      registration.[@pmcsa] A visitor may bring a prescribed medicinal cannabis product for personal
      use with a copy of the prescription or a prescriber's letter; there is no recreational
      route.[@healthnz]
    sources:
      - ref
      - pmcsa
      - healthnz
  driving:
    status: limit
    text: >-
      Police can stop any driver and screen saliva at the roadside for four drugs, THC among
      them.[@pdd2] Testing began in Wellington on 15 December 2025 and went nationwide on 1 July
      2026.[@pdd1,pdd5] The device reacts only at or above a built-in threshold, which police
      say is set to show recent use and to exclude past use and passive exposure.[@pdd2] A positive
      screen leads to a second one and a saliva sample for the laboratory; two positive
      screens mean a 12-hour driving ban on the spot.[@pdd3] A fine follows only if the laboratory
      confirms the drug at or above its threshold (5 ng/mL of THC in oral fluid): 200 dollars
      and 50 demerit points for one
      drug, 400 dollars and 75 points for two or more, and the same 400 dollars and 75 points
      for refusing the test.[@lab2025,pdd3] In blood, a concentration within the tolerance level is an
      infringement and one at the high-risk level a crime.[@lab2025] Patients prescribed cannabis can
      still test positive; they must take the test and may apply afterwards for a medical
      defence if they took the medicine as prescribed.[@pdd4]
    sources:
      - lab2025
      - pdd1
      - pdd2
      - pdd3
      - pdd4
      - pdd5
  arrests:
    text: >-
      Ministry of Justice figures reported in March 2026 show 3,438 people charged with
      possessing cannabis in 2025, up from 2,881 in 2024 and 2,287 in 2023, the highest number
      since a 2019 law change told police to consider a health-based response first.[@zb26] Charges
      had fallen from 3,719 in 2017 to a low of 2,055 in 2021.[@zb26] Of all convictions for cannabis
      offences, 82% came alongside charges unrelated to cannabis; 506 people were convicted of
      cannabis offences alone in 2025, against 387 in 2023.[@zb26] Police said the rise tracks higher
      use seen in wastewater testing, and that the charge figures leave out the warnings
      officers give for possession.[@zb26] Official court finalisations for the year to 30 June 2026
      show 5,690 cannabis charges and 3,543 people charged, down slightly from 5,854 and 3,606;
      2,551 people were convicted, 558 received imprisonment as the most serious sentence, and 464
      of 2,596 conviction instances were cannabis-only.[@moj26]
    sources:
      - zb26
      - moj26
  black_market:
    text: >-
      Figures reported by the government to the UN drugs office record 1,136 kg of herbal
      cannabis seized in 2024, against 812 kg in 2023, and 4.7 kg of cannabis resin seized
      in 2024, against 2.7 kg in 2023.[@unodc_szr] The UN publishes them as kilogram equivalents, and
      countries count seizures differently, so the figures are not comparable across borders.[@unodc_szr]
      Police plant-material seizures are larger and measured differently: Operation Beryl reported
      more than 10 tonnes in 2025 and Operation Blackout more than five tonnes in 2026, counted as
      cannabis material rather than dried herb.[@beryl25,blackout26]
    sources:
      - unodc_szr
      - beryl25
      - blackout26
