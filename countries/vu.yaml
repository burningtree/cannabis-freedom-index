segments:
  possession:
    text: >-
      Possession is an offence under the Dangerous Drugs Act, whose maximum penalties — fines up to
      VT 100 million and up to 20 years in prison — apply across possession, supply and cultivation.
      Courts typically give small-scale offenders suspended sentences or community work.
    sources:
      - dp
      - ib
  cultivation:
    text: Cultivating any cannabis plant without a licence is prohibited under the same Act.
    sources:
      - dp
  enforcement:
    text: Very high maximum penalties on paper; lighter outcomes for small amounts in practice.
    sources:
      - dp
  sharing:
    text: Supply is an offence with the same maximum penalties.
    sources:
      - dp
  consumption:
    text: Use is prohibited.
    sources:
      - dp
  access:
    text: No legal source for the public.
    sources:
      - dp
context:
  production:
    text: >-
      The Industrial Hemp and Medical Cannabis Act 2021 allows a small number of export-oriented
      licences: applicants need ten years' industry experience and pay an annual fee of VT 10
      million, which shuts out local growers.
    sources:
      - act
      - ib
  products:
    text: Licensed products are for export.
    sources:
      - ib
  medical:
    text: The law is about production for export, not a patient programme.
    sources:
      - act
      - dp
  consequences:
    text: A conviction is a criminal record.
    sources:
      - dp
  planting:
    seeds: licensed
    seeds_trade: regulated
    clones: licensed
    clones_trade: regulated
    text: >-
      The Industrial Hemp and Medical Cannabis Act 2021 was passed to regulate "the
      importation and cultivation of hemp and cannabis seeds". Importing and growing seed
      needs a licence from the agriculture minister, who is to issue at least three for hemp
      and at least two for medical cannabis; each licence covers import, cultivation,
      manufacture and export together.
    sources:
      - ihmca
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited.
    sources:
      - dp
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. British travel advice tells travellers
      to avoid all recreational drugs and says possession of even small quantities can lead to
      imprisonment and a large fine.
    sources:
      - dp
      - fcdo
  driving:
    status: impairment
    text: >-
      Road Traffic (Control) Act section 16 prohibits driving on a road when a drug
      or alcohol makes proper vehicle control impossible, and permits arrest without
      a warrant. The official 2020 consolidation's section 53(3) sets up to VT100,000
      or one year's imprisonment or both for that offence, rather than the lower
      general penalty for other contraventions. Under section 55 the court may also
      disqualify the driver for up to five years and endorse the licence; that is a
      discretionary maximum, not an automatic five-year ban. Section 54(2) allows
      detention of a vehicle involved in an offence seriously jeopardising road-user
      safety. The Supreme Court distinguishes court punishment from separate public-
      transport impoundment and permit processes; the vehicle owner must not simply
      be treated as the offending driver. No numeric THC
      allowance, operational roadside drug-screening protocol or medical-use defence
      was established in these reviewed sources.
    sources:
      - traffic2020
      - trafficjudgment
