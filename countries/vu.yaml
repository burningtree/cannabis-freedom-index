name: Vanuatu
region: Oceania
iso_numeric: 548
recreational: illegal
medical: limited
updated: '2026-10-24'
summary: >-
  Cannabis possession, supply and unlicensed growing are crimes. Court guidance distinguishes
  small personal grows from commercial cultivation. Medical-cannabis licences authorise
  production for export, while adult-use sales remain prohibited.
scores:
  possession: 1
  cultivation: 1
  enforcement: 2
  sharing: 1
  consumption: 1
  access: 0
segments:
  possession:
    text: >-
      Cannabis possession carries a maximum of twenty years in prison, a VT100 million fine, or
      both.[@law,aru] Court guidance also applies a lesser personal-use category to possession;
      a small personal case can receive a fine or community sentence.[@aru,lovis]
    sources:
      - law
      - aru
      - lovis
  cultivation:
    text: >-
      Unlicensed cannabis growing is criminal.[@kaiding] Courts distinguish small personal
      grows, small commercial grows and large commercial operations; fines and community
      measures are usual for the first group, with short custody possible in more serious
      cases.[@lovis] The separate industry law licenses medical cultivation for export.[@hemp]
    sources:
      - kaiding
      - lovis
      - hemp
  enforcement:
    text: >-
      The general drug-law maximum is twenty years or VT100 million, or both.[@law] Sentencing
      guidance directs courts to assess purpose, scale and circumstances.[@lovis] A first
      offender with five plants received a suspended sentence in 2024 after spending three
      months and two days in custody before bail.[@kaiding]
    sources:
      - law
      - lovis
      - kaiding
  sharing:
    text: >-
      Supplying cannabis is prohibited and falls under the general drug-law maximum of twenty
      years or VT100 million, or both.[@law] The sentencing guidance treats non-commercial
      supply differently from cultivation for profit, but allows greater penalties than for a
      purely personal grow.[@lovis]
    sources:
      - law
      - lovis
  consumption:
    text: >-
      Possession associated with cannabis use is criminal. Occupiers or managers may not permit
      their premises to be used for cannabis smoking.[@law]
    sources:
      - law
  access:
    text: >-
      Adult-use supply is prohibited.[@law] The licensed medical-cannabis industry is for
      export; officials reaffirmed in January 2026 that licensed products could not be sold
      locally.[@hemp,clarification] The drug law separately permits controlled medical imports
      and properly prescribed and dispensed medicines.[@law]
    sources:
      - law
      - hemp
      - clarification
context:
  production:
    status: medical
    text: >-
      Medical-cannabis cultivation under the industry law is for export. Its original licensing
      requirements included relevant experience, a local bank deposit, an agricultural lease and
      an export market or buyer.[@hemp] Officials said in January 2026 that licensing and secure
      management remained required, with no local sales.[@clarification]
    sources:
      - hemp
      - clarification
  products:
    text: >-
      The drug law lists cannabis, resin and resin-based preparations, and excludes separated
      mature stalks and their fibre from its cannabis definition.[@law] The industry Act defines
      hemp at no more than 0.3% delta-9 THC on a dry-weight basis.[@hemp]
    sources:
      - law
      - hemp
  medical:
    text: >-
      Medical cannabis under the industry licensing Act is grown for export.[@hemp] The drug law
      separately provides medical or scientific import permits and exemptions for medicines
      prescribed and properly supplied by qualified practitioners or pharmacists.[@law]
      Officials reaffirmed the export industry’s prohibition on local sales in January
      2026.[@clarification]
    sources:
      - hemp
      - law
      - clarification
  consequences:
    text: >-
      Prison, fines, supervision and community work can follow a cannabis conviction, depending
      on the case.[@law,lovis,kaiding] A suspended sentence can come after months already spent
      in custody before bail.[@kaiding] Drugs and related items can be condemned, destroyed or
      forfeited.[@law,niawiye]
    sources:
      - law
      - lovis
      - kaiding
      - niawiye
  planting:
    seeds: licensed
    seeds_trade: regulated
    clones: licensed
    clones_trade: regulated
    text: >-
      The licensing Act covers importing and cultivating hemp or cannabis seeds and
      manufacturing and exporting industrial hemp or medical cannabis. Providing or selling a
      seed or plant contrary to the Act is an offence.[@hemp]
    sources:
      - hemp
  clubs:
    status: none
    text: >-
      The drug law prohibits cannabis supply and unlicensed cultivation remains
      criminal.[@law,kaiding] Industry licences concern controlled export production.[@hemp]
    sources:
      - law
      - kaiding
      - hemp
  visitors:
    status: none
    text: >-
      Adult-use possession and supply remain criminal.[@law] The Act exempts a personal-use
      preparation carried into Vanuatu in a reasonable amount, correctly labelled and
      accompanied by a doctor’s letter from the traveller’s country of origin.[@law]
    sources:
      - law
  driving:
    status: impairment
    text: >-
      Road Traffic (Control) Act section 16 prohibits driving on a road when a drug or alcohol
      makes proper vehicle control impossible, and permits arrest without a warrant. The
      official 2020 consolidation's section 53(3) sets up to VT100,000 or one year's
      imprisonment or both for that offence, rather than the lower general penalty for other
      contraventions. Under section 55 the court may also disqualify the driver for up to five
      years and endorse the licence; that is a discretionary maximum, not an automatic five-year
      ban. Section 54(2) allows detention of a vehicle involved in an offence seriously
      jeopardising road-user safety. The Supreme Court distinguishes court punishment from
      separate public- transport impoundment and permit processes; the vehicle owner must not
      simply be treated as the offending driver. No numeric THC allowance, operational roadside
      drug-screening protocol or medical-use defence was established in these reviewed sources.
    sources:
      - traffic2020
      - trafficjudgment
