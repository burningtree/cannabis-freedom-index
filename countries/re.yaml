name: Réunion
region: Africa
iso_numeric: 638
dependency:
  of: fr
  kind: French overseas department
  note: >-
    Réunion is a French overseas department. French national drug law, including the Code de la
    santé publique prohibitions, is the applicable regime; there is no Réunion-specific cannabis
    statute.
recreational: illegal
medical: limited
updated: '2026-10-28'
summary: >-
  French prohibition applies: cannabis use, possession and growing are criminal offences, and the
  only patient route is the restricted national French medical framework. Locally the plant is
  known as zamal and grows wild in several regions.
scores:
  possession: 1
  cultivation: 1
  enforcement: 3
  sharing: 1
  consumption: 1
  access: 1
words:
  - { word: Zamal, lang: Réunion Creole, meaning: "cannabis; the island's Creole word, probably of Malagasy origin", sources: [benoist] }
segments:
  possession:
    text: >-
      Illicit use and possession fall under article L3421-1 of the Code de la santé publique: up
      to one year in prison and a €3,750 fine, with a national fixed-fine procedure for ordinary
      use cases.[@csp,sp_use]
    sources:
      - csp
      - sp_use
    currency: EUR
    penalties:
      - label: Ordinary illicit use
        treatment: criminal
        term: Drug use
        prison: 1 year
        fine: 3750
        note: National fixed-fine procedure applies to ordinary use cases
  cultivation:
    text: >-
      Growing cannabis is treated as production of narcotics: up to 20 years imprisonment and a
      €7.5 million fine, even for a few plants.[@cidj] In practice courts impose far lower
      sentences for small personal grows.[@cidj]
    sources:
      - cidj
    currency: EUR
    penalties:
      - label: Growing cannabis (production of narcotics)
        treatment: criminal
        term: Unlicensed cultivation
        prison: 20 years
        fine: 7500000
        note: Courts impose far lower sentences for small personal grows
  enforcement:
    text: >-
      The law is strict on paper, applied mainly through fines with the one-year prison maximum
      remaining available for ordinary use.[@cidj,csp]
    sources:
      - cidj
      - csp
  sharing:
    text: >-
      Giving cannabis to someone for their personal use is a specific offence with up to five
      years in prison under the national regime.[@cidj]
    sources:
      - cidj
  consumption:
    text: >-
      Ordinary illicit use is a criminal offence in public or private, with up to one year and
      €3,750; eligible ordinary-use cases can end through the national fixed-fine
      process.[@csp,sp_use] [France has punished any drug use with up to a year in prison since
      1970.](/history/france-use-criminalised-1970/) [Ordinary use moved into an on-the-spot fine in
      2020.](/history/france-fixed-fine-2020/) [The fine rose to €500 in
      2026.](/history/france-fixed-fine-2026/)
    sources:
      - csp
      - sp_use
  access:
    text: >-
      No Réunion-specific patient route exists; access follows the restricted national French
      medical framework, limited to patients carried over from the 2021 experiment during the
      transition to a permanent regime.[@sp] [France's medical cannabis experiment began in
      2021.](/history/france-medical-experiment-2021/) [Reimbursement rules for the permanent regime
      followed in 2026.](/history/france-reimbursement-decree-2026/)
    sources:
      - sp
context:
  recreational:
    text: >-
      There is no legal recreational supply on the island. Zamal grows wild in several regions
      and is smoked despite the ban; ordinary illicit use is a criminal offence carrying up to
      one year in prison and a €3,750 fine, with the national fixed-fine procedure for ordinary
      cases.[@benoist,csp,cidj]
    sources:
      - benoist
      - csp
      - cidj
  production:
    status: none
    text: >-
      Cannabis (zamal) grows wild in several regions, particularly the mid-altitude zones of the
      west, and is planted in cane fields and gardens; all of it is outside any legal production
      regime, and cultivation is a serious offence.[@benoist,cidj]
    sources:
      - benoist
      - cidj
  hemp:
    status: standard
    text: >-
      CBD flower and products under 0.3% THC are lawful to sell under the national French
      regime; there is no other lawful cannabis product on the island.[@cx] [France's top court
      allowed CBD flower sales in 2022.](/history/france-cbd-flower-2022/)
    sources:
      - cx
  medical:
    text: >-
      No Réunion-specific patient route exists; access follows the restricted national French
      medical framework, limited to patients carried over from the 2021 experiment during the
      transition to a permanent regime.[@sp] [France's medical cannabis experiment began in
      2021.](/history/france-medical-experiment-2021/) [Reimbursement rules for the permanent regime
      followed in 2026.](/history/france-reimbursement-decree-2026/)
    sources:
      - sp
  consequences:
    text: >-
      Use and possession convictions carry up to one year in prison and a €3,750 fine under the
      national provisions, with convictions recorded under national criminal-record
      rules.[@csp]
    sources:
      - csp
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone on the island. Ordinary illicit use is a
      criminal offence punishable by up to one year in prison and a €3,750 fine.[@csp,cidj]
    sources:
      - csp
      - cidj
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: cultivation is a
      production offence and giving cannabis to another person is a specific supply
      offence.[@cidj]
    sources:
      - cidj
  planting:
    seeds: grey
    seeds_trade: unclear
    clones: illegal
    clones_trade: banned
    text: >-
      Zamal is planted in cane fields and gardens, all of it outside any legal regime.[@benoist]
      A widespread belief that one or two plants for personal use are legal is false: growing
      is a production offence whatever the number of plants.[@ofdt21,cidj] Seed commerce is not
      separately addressed in the reviewed sources.
    sources:
      - benoist
      - ofdt21
      - cidj
  black_market:
    text: >-
      Trafficking runs on small networks built on mutual acquaintance, with local production
      and no transformation into resin — resin arrives imported, by post or by mules.[@ofdt21]
      Local zamal quality has declined over the last decade while its price rose from about
      €0.50 to €5 a gram; imported hybrids fill the
      gap.[@ofdt21](/history/reunion-ofdt-trend-2021-2022/) By 2025 home-grown zamal sold at about €10
      a roll of roughly 10 g with quality still declining, imported skunk at €10 a gram was
      supplanting it, and imported resin sold at about €20 a
      gram.[@ofdtre25](/history/reunion-drug-trend-2025-2026/)
    sources:
      - ofdt21
      - ofdtre25
  driving:
    status: zero
    text: >-
      Driving after using a narcotic is an offence whatever the amount; there is no threshold.[@onisr]
      Police screen heavily at national level: the road-safety observatory counted about 1.2 million
      drug screenings in 2024, of which 11.1% were positive.[@onisr] No Réunion-specific screening
      count was found.[@onisr]
    sources:
      - onisr
  arrests:
    text: >-
      In 2025 customs and police at Roland-Garros airport intercepted 58 air mules, 44 of them
      carrying drugs, and three operations searching all baggage seized 20 kg of cannabis
      resin.[@ofdtre25] No island-wide cannabis-only arrest series is published; nationally, police
      recorded 148,556 drug-use offences in 2024, almost three times as many as in 2017, with
      cannabis by far the commonest drug.[@onisr]
    sources:
      - ofdtre25
      - onisr
  culture:
    text: >-
      Zamal — the local name, apparently of Malagasy origin though absent from present-day
      Malagasy — probably arrived with enslaved Malagasy; the word jamala appears in Drury’s
      1729 vocabulary, and the term seems to have been rediffused to Madagascar through
      Réunion immigration.[@benoist] It is smoked at Malagasy-descended feasts and by Tamil
      priests as ciga in possession rites, while countryside smokers prepare pressed
      honey-and-alcohol cigars — see [zamal](/culture/language/zamal/) and [zamal on
      Réunion](/culture/traditions/zamal-on-reunion/).[@benoist]
    sources:
      - benoist
