name: Afghanistan
region: Asia
iso_numeric: 4
recreational: illegal
medical: none
updated: 2026-10-12
summary: Historically one of the world's largest hashish producers. The Taliban banned cultivation in 2023.
scores:
  possession: 0
  cultivation: 0
  enforcement: 0
  sharing: 0
  consumption: 1
  access: 0
segments:
  possession:
    text: >-
      Possession is illegal; the pre-2021 drug law set one to five years depending on amount. Under
      the Taliban, offenders are tried by sharia courts, with imprisonment and flogging.
    sources:
      - cann
      - am
  cultivation:
    text: >-
      On 19 March 2023 the Taliban's supreme leader issued a decree banning cannabis cultivation
      across the country: crops are destroyed and growers sent to court. Afghanistan had long been
      one of the world's largest hashish producers.
    sources:
      - am
      - aan
  enforcement:
    text: >-
      Sharia punishments including flogging, applied unevenly: hashish remains widely used and the
      cultivation ban has been enforced less thoroughly than the opium ban. In a 2025 case involving
      hashish trafficking, a Taliban court imposed prison terms and 10–39 lashes.
    sources:
      - aan
      - am
      - afj
  sharing:
    text: >-
      The available cannabis-specific legislation sets prison terms rather than death for trafficking.
      A 2025 Taliban ruling imposed seven months to three and a half years in prison, plus lashes, in a
      case involving hashish and narcotic tablets.
    sources:
      - sherloc
      - afj
  consumption:
    text: Use is prohibited; drug users have been rounded up into compulsory treatment camps.
    sources:
      - aan
      - cann
  access:
    text: None.
    sources:
      - cann
context_not_applicable:
  death_penalty:
    text: >-
      The available cannabis-specific legislation sets prison terms rather than death for
      trafficking.[@sherloc]
    sources: [sherloc]
context:
  recreational:
    text: >-
      There is no legal way to get cannabis. Hashish remains widely used despite the bans:
      offenders are tried by sharia courts, facing imprisonment and flogging, and drug users
      have been rounded up into compulsory treatment camps.[@am,aan] A 2025 Taliban ruling gave
      seven months to three and a half years plus lashes in a hashish trafficking
      case.[@afj]
    sources:
      - am
      - aan
      - afj
  black_market:
    text: >-
      Afghanistan long ranked among the world's largest hashish producers; [a 2023 Taliban
      decree banned all cannabis cultivation](/history/afghanistan-taliban-cultivation-ban-2023/),
      with crops destroyed and growers sent to court.[@am] The ban has been enforced less
      thoroughly than the opium ban, and hashish remains widely used.[@aan]
    sources:
      - am
      - aan
  culture:
    text: >-
      Afghanistan has a *chars* (resin) tradition: manufacture by sieving probably dates back
      to the nineteenth century, and growing cannabis and trading *chars* was a major economic
      asset around Balkh and the Khyber at the turn of the twentieth century.[@asc] Babur
      described eating *majoun*, a hashish confection, in his memoirs; nineteenth-century
      travellers from Elphinstone (1809) to Ferrier (1858) record Afghans drinking bhang and
      smoking chillums.[@asc]
    sources:
      - asc
  genetics:
    text: >-
      Afghan hemp has a documented wild-to-crop story: Vavilov observed that hemp farmers
      collected seeds from wild Afghan types to enrich their fields, and Clarke traces hashish
      from *Cannabis indica* forma *afghanica* in the north to a first report in
      1965.[@asc]
    sources:
      - asc
  production:
    status: none
    text: None; a pre-2021 plan for a licensed medical cannabis project came to nothing.
    sources:
      - aan
  medical:
    text: No medical cannabis.
    sources:
      - cann
  consequences:
    text: Forced detention in treatment centres is the main risk for users.
    sources:
      - aan
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited.
    sources:
      - am
      - aan
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. Possession is illegal; under the Taliban
      offenders are tried by sharia courts, with imprisonment and flogging.
    sources:
      - cann
      - am
