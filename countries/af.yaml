segments:
  possession:
    text: >-
      Possession is illegal; the pre-2021 drug law set one to five years depending on amount. Under
      the Taliban, offenders are tried by sharia courts, with imprisonment and flogging.
    sources:
      - cann
      - am
  cultivation:
    text: >-
      On 19 March 2023 the Taliban's supreme leader issued a decree banning cannabis cultivation
      across the country: crops are destroyed and growers sent to court. Afghanistan had long been
      one of the world's largest hashish producers.
    sources:
      - am
      - aan
  enforcement:
    text: >-
      Sharia punishments including flogging, applied unevenly: hashish remains widely used and the
      cultivation ban has been enforced less thoroughly than the opium ban.
    sources:
      - aan
      - am
  sharing:
    text: Trafficking can bring the death penalty.
    sources:
      - cann
  consumption:
    text: Use is prohibited; drug users have been rounded up into compulsory treatment camps.
    sources:
