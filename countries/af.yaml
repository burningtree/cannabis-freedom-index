segments:
  possession:
    text: >-
      The Taliban's Penal Code for Courts, signed on 4 January 2026, now sets the narcotics
      penalties. Article 101 grades sale and possession of hashish by weight: up to 5 g brings one
      year, over 5 g up to 30 g two years, over 30 g up to 100 g two and a half years, and over 100
      g six months for each additional 100 g, capped at seven years.[@code2026] Simple use is a
      separate six-month offence under article 102.[@code2026] The 2010 law's exemption for a
      certified addict holding up to 50 g of hashish is legacy; the 2026 code's only exemption is a
      general certificate under article 114, and no cannabis exemption programme was
      found.[@af2010,code2026] Offenders also face flogging in practice.[@am]
    sources:
      - code2026
      - af2010
      - am
    currency: AFN
    penalties:
      - label: Sale or possession, up to 5 g hashish (article 101)
        treatment: criminal
        term: Possession
        prison: 1 year
      - label: Over 5 g up to 30 g hashish
        treatment: criminal
        term: Possession
        prison: 2 years
      - label: Over 30 g up to 100 g hashish
        treatment: criminal
        term: Possession
        prison: 30 months
      - label: Over 100 g hashish
        treatment: criminal
        term: Possession
        prison_min: 3 years
        prison: 7 years
        note: Six months for each additional 100 g, capped at seven years
  cultivation:
    text: >-
      Article 94 of the 2026 code grades cannabis cultivation by area: under half a jerib (about 0.1
      hectare) brings six months, half a jerib nine months, over half up to one jerib one year, and
      over one jerib one year plus six months for each extra jerib and ten days for each extra
      half-jerib, capped at seven years.[@code2026] The crop is destroyed.[@code2026] The 2023
      Taliban decree banning cultivation nationwide remains in force.[@am]
    sources:
      - code2026
      - am
    currency: AFN
    penalties:
      - label: Under half a jerib
        treatment: criminal
        term: Cultivation
        prison: 6 months
      - label: Half a jerib
        treatment: criminal
        term: Cultivation
        prison: 9 months
      - label: Over half up to one jerib
        treatment: criminal
        term: Cultivation
        prison: 1 year
      - label: Over one jerib
        treatment: criminal
        term: Cultivation
        prison_min: 18 months
        prison: 7 years
        note: Six months per extra jerib and ten days per extra half-jerib, capped at seven years
  enforcement:
    text: >-
      Sharia punishments including flogging are applied alongside the code: hashish remains widely
      used, and the cultivation ban has been enforced less thoroughly than the opium ban.[@aan] In
      2025 Kabul courts imposed prison terms and 10 to 39 lashes in several hashish cases.[@afj] The
      2026 code's narcotics chapter has no life sentence or death penalty for cannabis, though the
      general article 14 "spreaders of disorder" clause could in theory be used in an extreme case;
      no cannabis case using it was found.[@code2026]
    sources:
      - aan
      - afj
      - code2026
  sharing:
    text: >-
      Article 101 applies the hashish sale-and-possession scale to dealing: one year up to 5 g, two
      years up to 30 g, two and a half years up to 100 g, and six months for each further 100 g,
      capped at seven years.[@code2026] Transport inside Afghanistan under article 95 runs from one
      year under 1 kg to three years for 5–30 kg, then one year for each extra 20 kg, and import
      under article 99 reaches seven years with one year for each extra 10 kg above 30
      kg.[@code2026] Repeat offences double the sentence and the vehicle is burned.[@code2026] There
      is no life sentence or death penalty for cannabis trafficking in the 2026 code.[@code2026]
    sources:
      - code2026
    currency: AFN
    penalties:
      - label: Sale or possession, up to 5 g hashish
        treatment: criminal
        term: Trafficking
        prison: 1 year
      - label: Over 5 g up to 30 g hashish
        treatment: criminal
        term: Trafficking
        prison: 2 years
      - label: Over 30 g up to 100 g hashish
        treatment: criminal
        term: Trafficking
        prison: 30 months
      - label: Transport, 5–30 kg hashish (article 95)
        treatment: criminal
        term: Transport
        prison: 3 years
        note: >-
          One year under 1 kg, two years for 1–5 kg, then one year per extra 20 kg above 30 kg,
          capped at seven years
      - label: Import, 5–30 kg hashish (article 99)
        treatment: criminal
        term: Import
        prison: 3 years
        note: >-
          One year under 1 kg, two years for 1–5 kg, then one year per extra 10 kg above 30 kg,
          capped at seven years
  consumption:
    text: >-
      Use is a six-month offence under article 102 of the 2026 code, with no fine.[@code2026] The
      2010 law's exemption for a certified addict holding up to 50 g of hashish is legacy, and the
      2026 code replaces it with a general exemption certificate that no cannabis programme
      operates.[@af2010,code2026] In practice users are also detained in compulsory treatment camps
      and flogged.[@aan,am]
    sources:
      - code2026
      - af2010
      - aan
      - am
    penalties:
      - label: Use (article 102)
        treatment: criminal
        term: Use
        prison: 6 months
        note: No fine; flogging and compulsory treatment also reported
  access:
    text: >-
      There is no legal source of cannabis for adults or patients, and no licensed medical or
      adult-use supply was found.[@cann] A pre-2021 plan for a licensed medical cannabis project
      came to nothing.[@aan]
    sources:
      - cann
      - aan
context:
  recreational:
    text: >-
      There is no legal way to get cannabis. Hashish remains widely used despite the bans:
      offenders are tried by sharia courts, facing imprisonment and flogging, and drug users have
      been rounded up into compulsory treatment camps.[@am,aan] A 2025 Taliban ruling gave seven
      months to three and a half years plus lashes in a hashish trafficking case.[@afj]
    sources:
      - am
      - aan
      - afj
  production:
    status: none
    text: >-
      No licensed production exists. The 2010 law allowed cultivation only under its penalty
      scale, and the 2023 Taliban decree bans it outright.[@af2010,am] A pre-2021 plan for a
      licensed medical cannabis project came to nothing.[@aan]
    sources:
      - af2010
      - am
      - aan
  medical:
    text: >-
      No medical cannabis programme or patient supply was found.[@cann] The 2010 law allowed
      government licences for medical and scientific work but listed cannabis as prohibited, and
      the 2026 code's only paper route is a general article 114 exemption certificate.[@af2010,code2026]
      The 2023 cultivation ban leaves no lawful production route.[@am]
    sources:
      - cann
      - am
      - af2010
      - code2026
  hemp:
    status: none
    text: >-
      No industrial-hemp exception, THC limit or licensing scheme was found. The 2023 decree bans
      cannabis cultivation, and neither the 2010 law nor the 2026 code distinguishes fibre
      hemp.[@am,af2010,code2026]
    sources:
      - am
      - af2010
      - code2026
  consequences:
    text: >-
      A drug offence can bring imprisonment and flogging, and users can be detained in compulsory
      treatment camps.[@aan] A 2025 trafficking case ended with prison terms of seven months to
      three and a half years and 10 to 39 lashes for eleven people.[@afj]
    sources:
      - aan
      - afj
  planting:
    seeds: grey
    seeds_trade: unclear
    clones: illegal
    clones_trade: banned
    text: >-
      The 2010 law controlled the cannabis plant and made no seed exception; sowing was
      cultivation and carried the Article 41 penalties.[@af2010] Clones are plants, so keeping or
      trading them falls under the same ban, and the 2023 decree prohibits cultivation
      outright.[@af2010,am] No seed-sale or clone market was found.
    sources:
      - af2010
      - am
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited.[@am,af2010]
    sources:
      - am
      - af2010
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. Possession is illegal; under the Taliban
      offenders are tried by sharia courts, with imprisonment and flogging.[@cann,am] The law
      makes no exception for visitors.[@af2010]
    sources:
      - cann
      - am
      - af2010
  driving:
    status: unknown
    text: >-
      No cannabis-specific driving offence or THC limit was found in the last codified drug law
      or in the Taliban decrees read.[@af2010,am] The status is left unverified rather than
      treating a general traffic rule as a drug-driving offence.
    sources:
      - af2010
      - am
  black_market:
    text: >-
      Afghanistan long ranked among the world's largest hashish producers;
      [a 2023 Taliban decree banned all cannabis cultivation](/history/afghanistan-taliban-cultivation-ban-2023/),
      with crops destroyed and growers sent to court.[@am] The ban has been enforced less
      thoroughly than the opium ban, and hashish remains widely used.[@aan] No recent national
      production or price figures were found.
    sources:
      - am
      - aan
  arrests:
    text: >-
      No independent national cannabis series exists. The Taliban said in October 2026 that they had
      carried out more than 8,000 anti-drug operations and arrested more than 10,000 people, figures
      that cover all drugs and are not independently verified.[@atlas26] The Afghanistan Justice
      Archive recorded Kabul cases in 2025 in which 11 and 17 people were sentenced for hashish and
      tablet offences, with prison terms of seven months to three and a half years and lashes.[@afj]
    sources:
      - afj
      - atlas26
  culture:
    text: >-
      Afghanistan has a [charas](/culture/language/charas/) and
      [hashish](/culture/language/hashish/) tradition: manufacture by sieving probably dates back
      to the nineteenth century, and growing cannabis and trading charas was a major economic
      asset around Balkh and the Khyber at the turn of the twentieth century.[@asc] Babur
      described eating majoun, a hashish confection, in his memoirs; nineteenth-century travellers
      from Elphinstone to Ferrier record Afghans drinking bhang and smoking chillums.[@asc] The
      Hindu Kush gave its name to [kush](/culture/language/kush/), and Afghan hashish plants were
      carried to California in the 1970s; the old farmers' populations are
      [landraces](/culture/language/landrace/).[@asc] The botanical vocabulary of
      [indica and sativa](/culture/language/indica-and-sativa/) also drew on Afghan drug types,
      which eighteenth- and nineteenth-century botanists placed under *Cannabis indica*.[@asc] [Chicken Street](/culture/traditions/chicken-street/)
      in Kabul became the travellers' quarter where the hashish trade met foreign customers and
      diplomatic pressure.[@asc]
    sources:
      - asc
  genetics:
    text: >-
      Afghan hemp has a documented wild-to-crop story: Vavilov observed that hemp farmers
      collected seeds from wild Afghan types to enrich their fields, and Clarke traces hashish
      from *Cannabis indica* forma *afghanica* in the north to a first report in
      1965.[@asc]
    sources:
      - asc
