name: Afghanistan
region: Asia
iso_numeric: 4
recreational: illegal
medical: none
updated: '2026-10-28'
summary: >-
  Cannabis is banned, and the Taliban's 2026 Penal Code for Courts sets fixed terms of six months
  to seven years for use, possession, cultivation and trafficking. There is no death penalty for
  cannabis in the code, but courts also impose flogging.
