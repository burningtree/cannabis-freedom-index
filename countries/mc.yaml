segments:
  possession:
    text: >-
      Article 5 of Law 890 of 1970 on narcotics punishes unlawful use, and possession for personal
      use, with six months to three years in prison, a fine, or one of the two. Courts usually
      impose suspended sentences or fines — one heavy user received ten months suspended — and
      police sometimes settle for a warning.
    sources:
      - l890
      - mt2
  cultivation:
    text: >-
      Unlawful growing carries five to ten years in prison and a fine under Article 2 of Law 890 of
      1970.
    sources:
      - l890
      - wiki
  enforcement:
    text: >-
      Prosecutions are routine in a small, heavily policed state, but outcomes are mostly suspended
      sentences and fines.
    sources:
      - mt2
      - mt1
  sharing:
    text: >-
      Article 2 of Law 890 punishes offering, selling, buying, transporting or supplying narcotics
      on any basis, and helping another person to use them, with five to ten years in prison and a
      fine. The penalties double where a minor is involved or the offence takes place in or near a
      school or prison.
    sources:
      - l890
  consumption:
    text: >-
      Use is itself an offence under Law 890, and it is prosecuted: in April 2025 a pensioner
      with a clean record was tried for possession and use over about 15 g found at his home and
      given one month in prison, suspended, with an obligation to undergo care.
    sources:
      - mt25
      - wiki
  access:
    text: >-
      None. In a 2025 trial the prosecutor cited a ministerial order banning cannabis and its
      derivatives, CBD products included, even at low THC levels.
    sources:
      - mt25
      - wiki
context:
  production:
    text: None.
    sources:
      - wiki
  products:
    text: >-
      None. Even CBD products are treated as prohibited, and people have been tried for holding
      them.
    sources:
      - mt1
  medical:
    text: No medical cannabis.
    sources:
      - wiki
      - mt1
  consequences:
    text: A conviction is a criminal record, which can affect a residence permit.
    sources:
      - mt1
  planting:
    seeds: grey
    seeds_trade: unclear
    clones: illegal
    clones_trade: banned
    text: >-
      Article 2 of Law 890 of 1970 punishes unlawfully growing, holding, buying or selling
      narcotics with five to ten years in prison. The law does not mention seeds.
    sources:
      - l890
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited.
    sources:
      - l890
      - wiki
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone, so a visitor has no lawful way to buy
      cannabis. The sources behind this profile describe no separate rule for visitors.
    sources:
      - wiki
  driving:
    status: consumption
    text: >-
      Penal Code article 391-15 criminalises driving a land vehicle after use of substances
      or plants classified as narcotics. It does not require the separate alcohol offence's
      intoxication standard. The current text provides one month to two years' imprisonment
      and a €2,250–9,000 fine, or either penalty alone. Article 391-15-1 allows drug screening
      in specified circumstances including suspected offences, certain traffic violations,
      crashes and preventive operations authorised by the Minister of State. A positive
      screen leads to a medical, chemical or biological examination, such as blood
      analysis; refusal carries the ordinary drug-driving penalties. The 2025 reform
      adds higher sanctions for specified professional drivers on duty: six months to
      three years and €9,000–18,000, or either alone. For the ordinary offence,
      complementary penalties include
      licence suspension up to two years, cancellation with a reapplication bar up to
      five years, or a Monaco driving ban up to five years for foreign-licence holders.
      No numerical THC allowance was established in the provisions reviewed.
    sources:
      - trafficpenal
