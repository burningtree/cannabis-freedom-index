segments:
  possession:
    text: >-
      Law 890 of 1970 on narcotics punishes use and possession with up to one year in prison and a
      fine. Courts usually impose suspended sentences or fines — one heavy user received ten months
      suspended — and police sometimes settle for a warning.
    sources:
      - wiki
      - mt2
  cultivation:
    text: Cultivation is a crime.
    sources:
      - wiki
  enforcement:
    text: >-
      Prosecutions are routine in a small, heavily policed state, but outcomes are mostly suspended
      sentences and fines.
    sources:
      - mt2
      - mt1
  sharing:
    text: Trafficking carries up to ten years.
    sources:
      - wiki
  consumption:
    text: Use is itself an offence under Law 890.
    sources:
      - wiki
  access:
    text: None.
    sources:
      - wiki
context:
  production:
    text: None.
    sources:
      - wiki
  products:
    text: >-
      None. Even CBD products are treated as prohibited, and people have been tried for holding
      them.
    sources:
      - mt1
  medical:
    text: No medical cannabis.
    sources:
      - wiki
      - mt1
  consequences:
    text: A conviction is a criminal record, which can affect a residence permit.
    sources:
      - mt1
