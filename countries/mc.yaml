updated: '2026-10-28'
summary: >-
  Personal possession and use can bring six months to three years in prison or a fine. Group use,
  cultivation, supply and imports face higher statutory penalties; CBD retail products have also
  been prosecuted.
scores:
  possession: 1
  cultivation: 1
