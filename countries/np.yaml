name: Nepal
region: Asia
iso_numeric: 524
recreational: illegal
medical: limited
updated: 2026-10-13
summary: >-
  Illegal since 1976 but widely tolerated, notably during Maha Shivaratri. Legalisation bills
  resurface regularly.
scores:
  possession: 1
  cultivation: 1
  enforcement: 2
  sharing: 1
  consumption: 2
  access: 0
segments:
  possession:
    text: >-
      The Narcotic Drugs (Control) Act of 1976 bans possession and use. Holding cannabis for
      personal use can bring up to a month in jail, with heavier sentences as quantities rise.
      Enforcement is relaxed in much of the country, where the plant grows wild.
    sources:
      - ok
      - wiki
  cultivation:
    text: >-
      Cultivation is prohibited, with prison scaled to the number of plants. In August 2026 Gandaki
      province legalised licensed farming for medical use, the first such step since the 1970s.
    sources:
      - ok
      - ap
  enforcement:
    text: Short jail terms are possible for users; traffickers face up to ten years or more.
    sources:
      - ok
  sharing:
    text: Sale and distribution are punishable by up to ten years depending on quantity.
    sources:
      - ok
  consumption:
    text: >-
      Use is an offence, but during Maha Shivaratri devotees smoke openly at Shiva temples such as
      Pashupatinath and police look the other way.
    sources:
      - wiki
      - ok
  access:
    text: >-
      No legal source. The government-licensed shops were closed in 1973, and the 1976 Act still
      bans sale; a 2026 law in Gandaki Province licenses growing for medicinal and industrial
      purposes only.
    sources:
      - nt26
      - wiki
context:
  production:
    text: >-
      The federal budget for 2024/25 announced legal arrangements for commercial cultivation for
      medicinal purposes, and Gandaki province now licenses farmers under supervision. A national
      framework is still pending.
    sources:
      - b360
      - ap
  products:
    text: No legal consumer products.
    sources:
      - wiki
  medical:
    text: >-
      Medical use is permitted in principle and now in Gandaki province, but there is no working
      national programme.
    sources:
      - ap
      - b360
  consequences:
    text: A drug conviction carries a criminal record.
    sources:
      - ok
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited.
    sources:
      - ok
      - ap
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. The Narcotic Drugs (Control) Act of 1976
      bans possession and use; holding cannabis for personal use can bring up to a month in
      jail, with heavier sentences as quantities rise.
    sources:
      - ok
      - wiki
  arrests:
    text: >-
      Narcotics Control Bureau figures for the last full fiscal year show 1,768 people
      arrested in the police's anti-trafficking operations nationwide and 993 cases
      registered, with 1,325 people charged; arrests were 5.55 per cent up on 2024/25.
      Seizures included 1,603 kg of cannabis, 204 kg of imported Thai cannabis and 41.5 kg
      of hashish.
    sources:
      - republica_ncb
  black_market:
    text: >-
      Cannabis is grown illegally across Nepal; one campaigner quoted by Nepali Times in
      2026 called it an open secret. Narcotics Control Bureau figures for the last full
      fiscal year show police seizing 1,603 kg of cannabis and 41.5 kg of hashish, and
      also 204 kg of cannabis imported from Thailand.
    sources:
      - republica_ncb
      - nt26
