segments:
  possession:
    text: >-
      The Narcotic Drugs (Control) Act of 1976 treats use and storage as different
      offences.[@ndca] Use can bring up to one month in prison or a fine of up to 2,000
      rupees.[@ndca] Storing, buying or selling up to 50 grams can bring up to three months or
      a fine of up to 3,000 rupees.[@ndca] From 50 grams to 500 grams the sentence is one month
      to one year and a fine of 1,000 to 5,000 rupees; from 500 grams to 2 kilograms it is six
      months to two years and a fine of 2,000 to 10,000 rupees; from 2 to 10 kilograms it is one
      to three years and a fine of 5,000 to 25,000 rupees; and 10 kilograms or more is two to
      ten years and a fine of 15,000 to 100,000 rupees.[@ndca] The Act writes the 50-gram and
      500-gram points into the neighbouring bands.[@ndca] Enforcement is relaxed in much of the
      country, where the plant grows wild.[@ok]
    sources:
      - ndca
      - ok
    currency: NPR
    penalties:
      - label: Up to 50 g stored or possessed
        treatment: criminal
        term: Storage

        prison: 3 months
        fine: 3000
      - label: 50 g to 500 g
        treatment: criminal
        term: Storage or sale
        prison_min: 1 month
        prison: 1 year
        fine_min: 1000
        fine: 5000
      - label: 500 g to 2 kg
