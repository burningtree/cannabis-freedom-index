segments:
  possession:
    text: >-
      The Narcotic Drugs (Control) Act of 1976 treats use and storage as different
      offences.[@ndca] Use can bring up to one month in prison or a fine of up to 2,000
      rupees.[@ndca] Storing, buying or selling up to 50 grams can bring up to three months or
      a fine of up to 3,000 rupees.[@ndca] From 50 grams to 500 grams the sentence is one month
      to one year and a fine of 1,000 to 5,000 rupees; from 500 grams to 2 kilograms it is six
      months to two years and a fine of 2,000 to 10,000 rupees; from 2 to 10 kilograms it is one
      to three years and a fine of 5,000 to 25,000 rupees; and 10 kilograms or more is two to
      ten years and a fine of 15,000 to 100,000 rupees.[@ndca] The Act writes the 50-gram and
      500-gram points into the neighbouring bands.[@ndca] Enforcement is relaxed in much of the
      country, where the plant grows wild.[@ok]
    sources:
      - ndca
      - ok
    currency: NPR
    penalties:
      - label: Use
        treatment: criminal
        term: Use
        prison: 1 month
        fine: 2000
        note: Up to one month or up to 2,000 rupees
      - label: Up to 50 g stored, bought or sold
        treatment: criminal
        term: Storage or sale
        prison: 3 months
        fine: 3000
      - label: 50 g to 500 g
        treatment: criminal
        term: Storage or sale
        prison_min: 1 month
        prison: 1 year
        fine_min: 1000
        fine: 5000
      - label: 500 g to 2 kg
        treatment: criminal
        term: Storage or sale
        prison_min: 6 months
        prison: 2 years
        fine_min: 2000
        fine: 10000
      - label: 2 kg to 10 kg
        treatment: criminal
        term: Storage or sale
        prison_min: 1 year
        prison: 3 years
        fine_min: 5000
        fine: 25000
      - label: 10 kg or more
        treatment: criminal
        term: Storage or sale
        prison_min: 2 years
        prison: 10 years
        fine_min: 15000
        fine: 100000
  cultivation:
    text: >-
      Cultivation is prohibited. Up to 25 plants can bring up to three months or a fine of up
      to 3,000 rupees; more than 25 plants can bring up to three years or a fine of 5,000 to
      25,000 rupees.[@ndca] In August 2026 Gandaki authenticated a law for licensed medicinal and
      industrial farming. Section 1(2) of the gazetted Act starts it on a later notice, and a
      review on 13 October had not found that notice.[@png] No licence can be issued until the
      province makes the rules.[@ktm12]
    sources:
      - ndca
      - ktm12
      - png
    currency: NPR
    penalties:
      - label: Up to 25 plants
        treatment: criminal
        term: Cultivation
        prison: 3 months
        fine: 3000
      - label: More than 25 plants
        treatment: criminal
        term: Cultivation
        prison: 3 years
        fine_min: 5000
        fine: 25000
        note: The Act sets the 25-plant line
  enforcement:
    text: >-
      Use can bring up to a month in prison or a fine of up to 2,000 rupees.[@ndca] Storage
      and sale follow quantity bands that reach two to ten years for 10 kilograms or
      more.[@ndca] Enforcement is uneven: the plant grows wild, and police have tolerated open
      smoking at Shivaratri while announcing arrests in other years.[@ok]
    sources:
      - ndca
      - ok
  sharing:
    text: >-
      Sale and distribution sit in the same quantity bands as storage: up to three months or
      a fine of up to 3,000 rupees for up to 50 grams, and two to ten years plus a fine for
      10 kilograms or more.[@ndca]
    sources:
      - ndca
  consumption:
    text: >-
      Use can bring up to one month in prison or a fine of up to 2,000 rupees.[@ndca] During
      Maha Shivaratri devotees smoke openly at Shiva temples such as Pashupatinath and police
      have often looked the other way, though arrests were announced in 2018.[@ok]
    sources:
      - ndca
      - ok
  access:
    text: >-
      No legal source. The government-licensed shops were closed in 1973, and the 1976 Act still
      bans sale.[@wiki, nt26] Gandaki's 2026 law is a framework for future medicinal and industrial
      growing. It is not a shop or a supply for patients.[@ktm07]
    sources:
      - nt26
      - wiki
      - ktm07
context:
  recreational:
    text: >-
      Illegal since 1976 but widely tolerated: the plant grows wild, enforcement is relaxed in
      much of the country, and devotees smoke openly at Shiva temples during Maha Shivaratri
      while police look the other way. Legalisation bills resurface regularly; no legal source
      exists.[@wiki,ok,nt26]
    sources:
      - wiki
      - ok
      - nt26
  production:
    status: none
    text: >-
      The federal budget for 2024/25 announced legal arrangements for commercial cultivation for
      medicinal purposes.[@b360] Gandaki authenticated a cultivation law on 3 August 2026. No grower
      may start until the Act commences and the province writes the rules.[@ktm12, png]
      A national framework is still pending.
    sources:
      - b360
      - ktm12
      - png
  medical:
    text: >-
      Medical use appears in federal plans.[@b360] Gandaki's 2026 Act is a cultivation framework
      for medicinal and industrial cannabis, and a patient still has no lawful supply under it.[@ktm07]
      A review on 13 October had not found the commencement notice that section 1(2) requires.[@png]
      No legal consumer products exist.[@wiki]
    sources:
      - b360
      - ktm07
      - png
      - wiki
  hemp:
    status: none
    text: >-
      No industrial-hemp exemption was found: the 1976 Act controls cannabis and cultivation is
      prohibited.[@ndca] A 2011 fair-trade project linked Himalayan hemp craft with Italian textile
      buyers, but it created no cultivation licence.[@italy] Gandaki's 2026 framework covers
      medicinal and industrial cannabis; it has not commenced and sets no THC limit yet.[@ktm12,png]
    sources:
      - ndca
      - italy
      - ktm12
      - png
  planting:
    seeds: grey
    seeds_trade: unclear
    clones: illegal
    clones_trade: banned
    text: >-
      The 1976 Act controls the cannabis plant and names no seed exception; sowing is cultivation
      and is punished under section 14.[@ndca] Clones are plants, so keeping or trading them falls
      under the same offence.[@ndca] No seed-sale or clone market was found.
    sources:
      - ndca
  driving:
    status: unknown
    text: >-
      The Narcotic Drugs (Control) Act contains no driving offence, and the sources read did not
      identify a cannabis-specific traffic rule or THC limit.[@ndca] The status is left unverified
      rather than treating a general careless-driving rule as a drug-driving offence.[@ok]
    sources:
      - ndca
      - ok
  culture:
    text: >-
      Nepal's cannabis culture is bound up with Shaiva devotion.[@fisher1975]
      [Sadhus](/culture/traditions/sadhus-and-the-chillum/) smoke
      [charas](/culture/language/charas/) and [hashish](/culture/language/hashish/) in clay
      chillums, especially at Pashupatinath, where the
      [Shivaratri festival](/culture/traditions/shivaratri-at-pashupatinath/) draws holy men and
      open smoking.[@fisher1975] Householders in Kathmandu's
      [bhajan circles](/culture/traditions/bhajan-circles-in-kathmandu/) shared hymns and sometimes
      a pipe.[@fisher1975] [Freak Street](/culture/traditions/freak-street/) became the travellers'
      quarter where licensed hashish shops traded until 1973.[@wiki] The plant grows wild in the
      hills, and charas is rubbed by hand from the living plant.[@fisher1975]
    sources:
      - fisher1975
      - wiki
  consequences:
    text: A drug conviction carries a criminal record.[@ok]
    sources:
      - ok
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited.[@ok,ap]
    sources:
      - ok
      - ap
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone.[@wiki] Use can bring up to one month
      in prison or a fine of up to 2,000 rupees. Storing up to 50 grams can bring up to three
      months or a fine of up to 3,000 rupees, and from 50 grams to 500 grams the sentence is
      one month to one year and a fine.[@ndca]
    sources:
      - ndca
      - wiki
  arrests:
    text: >-
      Narcotics Control Bureau figures for the last full fiscal year show 1,768 people
      arrested in the police's anti-trafficking operations nationwide and 993 cases
      registered, with 1,325 people charged; arrests were 5.55 per cent up on 2024/25.
      Seizures included 1,603 kg of cannabis, 204 kg of imported Thai cannabis and 41.5 kg
      of hashish.[@republica_ncb]
    sources:
      - republica_ncb
  black_market:
    text: >-
      Cannabis is grown illegally across Nepal; one campaigner quoted by Nepali Times in
      2026 called it an open secret.[@nt26] Narcotics Control Bureau figures for the last full
      fiscal year show police seizing 1,603 kg of cannabis and 41.5 kg of hashish, and
      also 204 kg of cannabis imported from Thailand.[@republica_ncb]
    sources:
      - republica_ncb
      - nt26
answers:
  buy:
    answer: no
    text: No patient or adult-use purchase route verified
