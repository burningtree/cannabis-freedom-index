name: Nepal
region: Asia
iso_numeric: 524
recreational: illegal
medical: none
updated: "2026-10-27"
summary: >-
  Illegal since 1976 but widely tolerated, notably during Maha Shivaratri. Legalisation bills
  resurface regularly.
scores:
  possession: 1
  cultivation: 1
  enforcement: 2
  sharing: 1
  consumption: 2
  access: 0
segments:
  possession:
    text: >-
      The Narcotic Drugs (Control) Act of 1976 treats use and storage as different offences.
      Use can bring up to one month in prison or a fine of up to 2,000 rupees. Storing,
      buying or selling up to 50 grams can bring up to three months or a fine of up to 3,000
      rupees. From 50 grams to 500 grams the sentence is one month to one year and a fine of
      1,000 to 5,000 rupees. From 500 grams to 2 kilograms it is six months to two years and
      a fine of 2,000 to 10,000 rupees. From 2 to 10 kilograms it is one to three years and a
      fine of 5,000 to 25,000 rupees, and 10 kilograms or more is two to ten years and a fine
      of 15,000 to 100,000 rupees. The Act writes the 50-gram
      and 500-gram points into the neighbouring bands. Enforcement is relaxed in much of the
      country, where the plant grows wild.
    sources:
      - ndca
      - ok
      - wiki
  cultivation:
    text: >-
      Cultivation is prohibited. Up to 25 plants can bring up to three months or a fine of up
      to 3,000 rupees; more than 25 plants can bring up to three years or a fine of 5,000 to
      25,000 rupees.[@ndca] In August 2026 Gandaki authenticated a law for licensed medicinal and
      industrial farming. Section 1(2) of the gazetted Act starts it on a later notice, and a
      review on 13 October had not found that notice.[@png] No licence can be issued until the
      province makes the rules.[@ktm12]
    sources:
      - ndca
      - ktm12
      - png
  enforcement:
    text: >-
      Use can bring up to a month or a fine. Storage and sale follow quantity bands that
      reach two to ten years for 10 kilograms or more.
    sources:
      - ndca
  sharing:
    text: >-
      Sale and distribution sit in the same quantity bands as storage: up to three months or
      a fine of up to 3,000 rupees for up to 50 grams, and two to ten years plus a fine for
      10 kilograms or more.
    sources:
      - ndca
  consumption:
    text: >-
      Use can bring up to one month in prison or a fine of up to 2,000 rupees. During Maha
      Shivaratri devotees smoke openly at Shiva temples such as Pashupatinath and police look
      the other way.
    sources:
      - ndca
      - wiki
      - ok
  access:
    text: >-
      No legal source. The government-licensed shops were closed in 1973, and the 1976 Act still
      bans sale.[@wiki, nt26] Gandaki's 2026 law is a framework for future medicinal and industrial
      growing. It is not a shop or a supply for patients.[@ktm07]
    sources:
      - nt26
      - wiki
      - ktm07
context:
  production:
    text: >-
      The federal budget for 2024/25 announced legal arrangements for commercial cultivation for
      medicinal purposes.[@b360] Gandaki authenticated a cultivation law on 3 August 2026. Farmers
      cannot obtain a licence until the Act commences and the province writes the rules.[@ktm12, png]
      A national framework is still pending.
    sources:
      - b360
      - ktm12
      - png
  products:
    text: No legal consumer products.
    sources:
      - wiki
  medical:
    text: >-
      Medical use appears in federal plans.[@b360] Gandaki's 2026 Act is a cultivation framework
      for medicinal and industrial cannabis, and a patient still has no lawful supply under it.[@ktm07]
      A review on 13 October had not found the commencement notice that section 1(2) requires.[@png]
    sources:
      - b360
      - ktm07
      - png
  consequences:
    text: A drug conviction carries a criminal record.
    sources:
      - ok
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited.
    sources:
      - ok
      - ap
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. Use can bring up to one month in
      prison or a fine of up to 2,000 rupees. Storing up to 50 grams can bring up to three
      months or a fine of up to 3,000 rupees, and from 50 grams to 500 grams the sentence is
      one month to one year and a fine.
    sources:
      - ndca
      - wiki
  arrests:
    text: >-
      Narcotics Control Bureau figures for the last full fiscal year show 1,768 people
      arrested in the police's anti-trafficking operations nationwide and 993 cases
      registered, with 1,325 people charged; arrests were 5.55 per cent up on 2024/25.
      Seizures included 1,603 kg of cannabis, 204 kg of imported Thai cannabis and 41.5 kg
      of hashish.
    sources:
      - republica_ncb
  black_market:
    text: >-
      Cannabis is grown illegally across Nepal; one campaigner quoted by Nepali Times in
      2026 called it an open secret. Narcotics Control Bureau figures for the last full
      fiscal year show police seizing 1,603 kg of cannabis and 41.5 kg of hashish, and
      also 204 kg of cannabis imported from Thailand.
    sources:
      - republica_ncb
      - nt26
answers:
  buy:
    answer: no
    text: No patient or adult-use purchase route verified
