segments:
  possession:
    text: >-
      The Narcotic Drugs (Control) Act of 1976 bans possession and use. Holding cannabis for
      personal use can bring up to a month in jail, with heavier sentences as quantities rise.
      Enforcement is relaxed in much of the country, where the plant grows wild.
    sources:
      - ok
      - wiki
  cultivation:
    text: >-
      Cultivation is prohibited, with prison scaled to the number of plants. In August 2026 Gandaki
      province legalised licensed farming for medical use, the first such step since the 1970s.
    sources:
      - ok
      - ap
  enforcement:
    text: Short jail terms are possible for users; traffickers face up to ten years or more.
    sources:
      - ok
  sharing:
    text: Sale and distribution are punishable by up to ten years depending on quantity.
    sources:
      - ok
  consumption:
    text: >-
      Use is an offence, but during Maha Shivaratri devotees smoke openly at Shiva temples such as
      Pashupatinath and police look the other way.
    sources:
      - wiki
      - ok
  access:
    text: No legal source.
    sources:
      - wiki
context:
  production:
    text: >-
      The federal budget for 2024/25 announced legal arrangements for commercial cultivation for
      medicinal purposes, and Gandaki province now licenses farmers under supervision. A national
      framework is still pending.
    sources:
      - b360
      - ap
  products:
    text: No legal consumer products.
    sources:
      - wiki
  medical:
    text: >-
      Medical use is permitted in principle and now in Gandaki province, but there is no working
      national programme.
    sources:
      - ap
      - b360
  consequences:
    text: A drug conviction carries a criminal record.
    sources:
      - ok
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited.
    sources:
      - ok
      - ap
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. British travel advice says a person
      caught with even a small amount of marijuana can go to prison for more than five years,
      after a long and costly court process. Skincare products and vape refills containing CBD
      are illegal and can lead to a possession charge.
    sources:
      - wiki
      - fcdo
