        prison_min: 2 years
        prison: 10 years
        fine_min: 15000
        fine: 100000
  consumption:
    text: >-
      Use can bring up to one month in prison or a fine of up to 2,000 rupees.[@ndca] During
      Maha Shivaratri devotees smoke openly at Shiva temples such as Pashupatinath and police
      have often looked the other way, though arrests were announced in 2018.[@ok] A person who
      undertakes in writing to enter treatment for up to a month, with fortnightly reports, may
      receive no punishment.[@ndca]
    sources:
      - ndca
      - ok
    currency: NPR
    penalties:
      - label: Use
        treatment: criminal
        term: Use
        prison: 1 month
        fine: 2000
        note: Prison or fine; a written treatment undertaking can avoid punishment
  access:
    text: >-
      No legal source. The government-licensed shops were closed in 1973, and the 1976 Act still
      bans sale.[@wiki, nt26] Gandaki's 2026 law is a framework for future medicinal and industrial
      growing. It is not a shop or a supply for patients.[@ktm07]
    sources:
      - nt26
      - wiki
      - ktm07
context:
  recreational:
    text: >-
      Illegal since 1976 but widely tolerated: the plant grows wild, enforcement is relaxed in
      much of the country, and devotees smoke openly at Shiva temples during Maha Shivaratri
      while police look the other way. Legalisation bills resurface regularly; no legal source
      exists.[@wiki,ok,nt26]
    sources:
      - wiki
      - ok
      - nt26
  production:
    status: none
    text: >-
      The federal budget for 2024/25 announced legal arrangements for commercial cultivation for
      medicinal purposes.[@b360] Gandaki authenticated a cultivation law on 3 August 2026. No grower
      may start until the Act commences and the province writes the rules.[@ktm12, png]
      A national framework is still pending.
    sources:
      - b360
      - ktm12
      - png
  medical:
    text: >-
      Medical use appears in federal plans.[@b360] The 1976 Act has a paper route: a doctor's
      recommendation and a licensed shop under section 5, or a special government licence for
      medicine or research under section 6, but no cannabis medicine or shop exists.[@ndca] Gandaki's 2026 Act is a cultivation framework
      for medicinal and industrial cannabis, and a patient still has no lawful supply under it.[@ktm07]
      A review on 13 October had not found the commencement notice that section 1(2) requires.[@png]
      No legal consumer products exist.[@wiki]
    sources:
      - b360
      - ndca
      - ktm07
      - png
      - wiki
  hemp:
    status: none
    text: >-
      No industrial-hemp exemption was found: the 1976 Act controls cannabis and cultivation is
      prohibited.[@ndca] A 2011 fair-trade project linked Himalayan hemp craft with Italian textile
      buyers, but it created no cultivation licence.[@italy] Gandaki's 2026 framework covers
      medicinal and industrial cannabis; it sets a THC ceiling but has not commenced.[@ktm12,png]
    sources:
      - ndca
      - italy
      - ktm12
      - png
  planting:
    seeds: grey
    seeds_trade: unclear
    clones: illegal
    clones_trade: banned
    text: >-
      The 1976 definition covers leaves, flowers, resin, fibre and extracts but not seeds; bhang
      seeds are sold openly as food, while sowing them is cultivation punished under section 14.[@ndca]
      Clones are plants, so keeping or trading them falls under the same offence.[@ndca] Seed trade
      for planting remains unclear.[@ndca]
    sources:
      - ndca
  driving:
    status: unknown
    text: >-
      The Narcotic Drugs (Control) Act contains no driving offence, and the sources read did not
      identify a cannabis-specific traffic rule or THC limit.[@ndca] Traffic police use SoToxa
      oral-fluid kits and THC urine tests and have booked drivers, but the Motor Vehicles Act
      trigger was not verified; the status stays unverified rather than treating a general
      careless-driving rule as a drug-driving offence.[@ktm_sofoxa]
    sources:
      - ndca
      - ktm_sofoxa
  culture:
    text: >-
      Nepal's cannabis culture is bound up with Shaiva devotion.[@fisher1975]
      [Sadhus](/culture/traditions/sadhus-and-the-chillum/) smoke
      [charas](/culture/language/charas/) and [hashish](/culture/language/hashish/) in clay
      chillums, especially at Pashupatinath, where the
      [Shivaratri festival](/culture/traditions/shivaratri-at-pashupatinath/) draws holy men and
      open smoking.[@fisher1975] Householders in Kathmandu's
      [bhajan circles](/culture/traditions/bhajan-circles-in-kathmandu/) shared hymns and sometimes
      a pipe.[@fisher1975] [Freak Street](/culture/traditions/freak-street/) became the travellers'
      quarter where licensed hashish shops traded until 1973.[@wiki] The plant grows wild in the
      hills, and charas is rubbed by hand from the living plant.[@fisher1975]
    sources:
      - fisher1975
      - wiki
  consequences:
    text: A drug conviction carries a criminal record.[@ok]
    sources:
      - ok
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited.[@ok,ap]
    sources:
      - ok
      - ap
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone.[@wiki] Use can bring up to one month
      in prison or a fine of up to 2,000 rupees. Storing up to 50 grams can bring up to three
      months or a fine of up to 3,000 rupees, and from 50 grams to 500 grams the sentence is
      one month to one year and a fine.[@ndca]
    sources:
      - ndca
      - wiki
  arrests:
    text: >-
      Police-wide figures for fiscal 2024/25 show 5,110 drug cases and 7,943 arrests, with
      51,439 kg of herbal cannabis seized, a record.[@ktm_april26] The Narcotics Control Bureau's
      anti-trafficking operations for 2025/26 recorded 993 cases, 1,768 arrests and 1,325 people
      charged, with 1,603 kg of cannabis, 204 kg of Thai cannabis and 41.5 kg of hashish; those
      figures cover all drugs and are not comparable with the police-wide series.[@republica_ncb]
      In June 2025, 6,126 of 29,012 prisoners were held on drug-trafficking charges.[@ktm_prison25]
    sources:
      - republica_ncb
      - ktm_april26
      - ktm_prison25
  black_market:
    text: >-
      Cannabis is grown illegally across Nepal, in 23 districts: the eastern hills supply herbal
      cannabis to Bihar, while the central and western hills produce charas for Delhi and overseas
      markets.[@nepalnews26] Police seized 51,439 kg of herbal cannabis in fiscal 2024/25, and
      3,332 kg in a single Saptari case in July 2026.[@ktm_april26,nepalnews_saptari26] Thai cannabis
      has also made Kathmandu airport a transit route to India.[@ok_thai25] One campaigner quoted by
      Nepali Times called the trade an open secret.[@nt26]
    sources:
      - nepalnews26
      - ktm_april26
      - nepalnews_saptari26
      - ok_thai25
      - nt26
