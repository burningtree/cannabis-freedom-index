name: South Sudan
region: Africa
iso_numeric: 728
recreational: illegal
medical: none
updated: 2026-10-24
summary: >-
  Possession or use is up to five years, a fine, or both. Dealing is up to fourteen years, a
  fine, or both. The death or life sentence is written for a dangerous drug other than cannabis.
