  planting:
    seeds: grey
    seeds_trade: open
    clones: illegal
    clones_trade: banned
    text: >-
      Section 382 of the Penal Code Act 2008 defines cannabis as the flowering or fruiting
      tops of the plant, "excluding the seeds and leaves when not accompanied by the tops", so
      loose seed is not a dangerous drug. The cannabis plant itself, defined as any plant of
      the genus, is a dangerous drug.
    sources:
      - law
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited, and the law provides for the death
      penalty for the most serious drug offences.
    sources:
      - rt
      - eye
      - law
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. British travel advice says there are
      severe penalties for using or trafficking drugs, including the death penalty and life
      imprisonment.
    sources:
      - law
      - fcdo
