segments:
  possession:
    text: >-
      Section 384 of the Penal Code Act 2008 makes acquiring or possessing a dangerous drug an
      offence, punished with up to five years, a fine, or both. Courts have jailed people for six
      months to a year for holding bhang.
    sources:
      - law
      - eye
  cultivation:
    text: >-
      Growing for one's own consumption is the section 384 offence, up to five years, a fine, or
      both. Growing in order to deal is the section 383 offence, up to fourteen years, a fine, or
      both. Cannabis is grown in Equatoria.
    sources:
      - law
      - rt
  enforcement:
    text: Young men are jailed for possession in group trials; enforcement varies widely between states.
    sources:
      - eye
      - rt
  sharing:
    text: >-
      Section 383 makes selling, supplying, transporting and other dealing an offence. The
      sentence is up to fourteen years, a fine, or both. Death or life imprisonment is written
      only where the drug was a dangerous drug other than cannabis and an aggravating circumstance
      is proved.
    sources:
      - law
  consumption:
    text: >-
      Section 384 makes ingesting, smoking or otherwise consuming a dangerous drug an offence, with
      up to five years, a fine, or both. Where the court finds that the person abuses or is
      addicted to the drug, it may order treatment as well as or instead of that sentence.
    sources:
      - law
  access:
    text: None.
    sources:
      - law
context:
  death_penalty:
    text: >-
      Section 383(3) defines the aggravating circumstances for death or life imprisonment as
      applying when the drug was a dangerous drug other than cannabis. Cannabis in that chapter
      means the flowering or fruiting tops. The cannabis plant, prepared cannabis and cannabis
      resin are defined separately and are not repeated in the exclusion. Other dealing is up to
      fourteen years, a fine, or both. No later statute replacing these sections was found.
    sources:
      - law
  production:
    text: None.
    sources:
      - law
  products:
    text: None.
    sources:
      - law
  medical:
    text: No medical cannabis.
    sources:
      - law
  consequences:
    text: A conviction is a criminal record.
    sources:
      - eye
  planting:
    seeds: grey
    seeds_trade: open
    clones: illegal
    clones_trade: banned
    text: >-
      Section 382 of the Penal Code Act 2008 defines cannabis as the flowering or fruiting
      tops of the plant, "excluding the seeds and leaves when not accompanied by the tops", so
      loose seed is not a dangerous drug. The cannabis plant itself, defined as any plant of
      the genus, is a dangerous drug.
    sources:
      - law
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them. Supplying a dangerous drug
      is dealing under section 383, punished with up to fourteen years, a fine, or both.
    sources:
      - law
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. Possession or use under section 384 is up
      to five years, a fine, or both. Courts have jailed people for six months to a year for
      holding bhang. Dealing under section 383 is up to fourteen years, a fine, or both.
    sources:
      - law
      - eye
