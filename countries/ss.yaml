name: South Sudan
region: Africa
iso_numeric: 728
recreational: illegal
medical: none
updated: "2026-10-25"
summary: >-
  Possession or use is up to five years, a fine, or both. Dealing is up to fourteen years, a fine,
  or both. The death or life sentence is written for a dangerous drug other than cannabis.
scores:
  possession: 0
  cultivation: 0
  enforcement: 1
  sharing: 0
  consumption: 0
  access: 0
words:
  - { word: Bangi, lang: South Sudanese English, meaning: "cannabis; the local name used in Bor and Juba seizure reports", sources: [eye] }
segments:
  possession:
    text: >-
      Acquiring or possessing a dangerous drug can bring up to five years in prison, a fine, or
      both.[@law] In Bor in May 2022, police reported that a court jailed five young men for six
      months to a year and fined another five SSP 50,000 each after a bhang case.[@eye]
    sources:
      - law
      - eye
    currency: SSP
    penalties:
      - label: Statutory maximum
        treatment: criminal
        term: Possession
        prison: 5 years
        note: Up to five years, a fine, or both
      - label: Bor bhang case in 2022
        treatment: criminal
        term: Possession
        prison: 1 year
        fine: 50000
        note: One jailed a year, four six months; five others fined SSP 50,000 each
  cultivation:
    text: >-
      Growing for personal consumption carries up to five years in prison, a fine, or both. Growing
      for dealing falls under the separate dealing offence, with an ordinary maximum of fourteen
      years, a fine, or both.[@law]
    sources:
      - law
    currency: SSP
    penalties:
      - label: Growing for personal consumption
        treatment: criminal
        term: Cultivation
        prison: 5 years
        note: Up to five years, a fine, or both
      - label: Growing for dealing
        treatment: criminal
        term: Dealing
        prison: 14 years
        note: Ordinary maximum; death-or-life tier requires a non-cannabis drug
  enforcement:
    text: >-
      A reported Bor case in 2022 ended with prison terms for five young men and fines for five
      others.[@eye] The code permits fines alongside or instead of prison for personal possession
      and use, and lets a court order treatment where it finds drug abuse or addiction.[@law]
    sources:
      - eye
      - law
  sharing:
    text: >-
      Selling, supplying, transporting and other dealing can bring up to fourteen years in prison, a
      fine, or both. The death-or-life tier requires a dangerous drug other than cannabis and one of
      the listed aggravating circumstances.[@law]
    sources:
      - law
    currency: SSP
    penalties:
      - label: Dealing, ordinary maximum
        treatment: criminal
        term: Dealing
        prison: 14 years
        note: Up to fourteen years, a fine, or both; death-or-life tier requires a non-cannabis drug
  consumption:
    text: >-
      Ingesting, smoking or otherwise consuming a dangerous drug can bring up to five years in
      prison, a fine, or both. Where the court finds drug abuse or addiction, it may order treatment
      as well as or instead of that sentence.[@law]
    sources:
      - law
  access:
    text: >-
      None: no lawful cannabis supply route operates.[@law]
    sources:
      - law
context_not_applicable:
  death_penalty:
    text: >-
      Section 383(3) expressly limits the death-or-life tier to a dangerous drug other than
      cannabis, so no cannabis offence carries a capital sentence; ordinary dealing is up to
      fourteen years, a fine, or both.[@law]
    sources: [law]
context:
  recreational:
    text: >-
      All recreational use is prohibited: possession or use can bring up to five years, a fine,
      or both, and dealing up to fourteen years. A 2022 Bor bhang case ended with prison terms
      and SSP 50,000 fines.[@law,eye]
    sources:
      - law
      - eye
  hemp:
    status: none
    text: >-
      No industrial-hemp exception was verified: the Penal Code defines cannabis and the cannabis
      plant as dangerous drugs with no low-THC distinction, and no hemp production is
      documented.[@law]
    sources:
      - law
  production:
    status: none
    text: >-
      No lawful cannabis production. The code only lets named professionals handle controlled
      drugs where necessary for their professional roles; no production or supply route
      operates.[@law]
    sources:
      - law
  medical:
    text: >-
      The code permits named medical, dental, veterinary, pharmaceutical, laboratory and state
      professionals to handle controlled drugs where necessary for their professional roles,
      including specified cannabis handling.[@law]
    sources:
      - law
  consequences:
    text: >-
      A conviction is a criminal record, as the Bor bhang sentences show: prison terms and SSP
      50,000 fines for possession.[@eye]
    sources:
      - eye
  planting:
    seeds: grey
    seeds_trade: open
    clones: illegal
    clones_trade: banned
    text: >-
      Section 382 of the Penal Code Act 2008 defines cannabis as the flowering or fruiting tops of
      the plant, "excluding the seeds and leaves when not accompanied by the tops", so loose seed is
      not a dangerous drug.[@law] The cannabis plant itself, defined as any plant of the genus, is a
      dangerous drug.[@law]
    sources:
      - law
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them. Supplying a dangerous drug
      is dealing under section 383, punished with up to fourteen years, a fine, or both.[@law]
    sources:
      - law
  culture:
    text: >-
      The local name is [bangi](/culture/language/bangi/): seized marijuana in Juba is known
      locally as bangi, and the Bor cases were bhang cases.[@eyeradio26,eye] The colonial ban arrived
      early —
      Sudan's replacement hashish law of 1924 covered the south and kept only medical use (see the
      [1924 ban](/history/south-sudan-ban-1924/), also traced for the north in
      [Sudan's article](/history/sudan-ban-1924/)).[@sudanord24] A century on, Juba's authorities
      still raid drug-selling spots: the [2026 Juba raids](/history/south-sudan-juba-raids-2026/)
      seized bangi with tramadol and codeine syrups.[@eyeradio26]
    sources:
      - eye
      - eyeradio26
      - sudanord24
  visitors:
    status: none
    text: >-
      Possession or use can bring up to five years in prison, a fine, or both; ordinary dealing can
      bring up to fourteen years, a fine, or both.[@law] The reported Bor cannabis case resulted in
      both prison terms and fines.[@eye]
    sources:
      - law
      - eye
