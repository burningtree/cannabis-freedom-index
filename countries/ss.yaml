segments:
  possession:
    text: >-
      Sections 383 and 384 of the Penal Code Act 2008 prohibit possessing and dealing in dangerous
      drugs. Possession is reported to carry several years on paper; in practice courts have jailed
      people for six months to a year for holding 'bhang'.
    sources:
      - eye
      - law
  cultivation:
    text: Cultivation is a crime; cannabis is grown in Equatoria.
    sources:
      - rt
  enforcement:
    text: Young men are jailed for possession in group trials; enforcement varies widely between states.
    sources:
      - eye
      - rt
