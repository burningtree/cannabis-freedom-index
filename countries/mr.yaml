  consequences:
    text: A conviction is a criminal record.
    sources:
      - trip
  planting:
    seeds: grey
    seeds_trade: unclear
    clones: illegal
    clones_trade: banned
    text: >-
      Law 93-37 punishes growing a high-risk drug with 15 to 30 years in prison, and with
      death for a repeat offence (Article 3). Which plants count is set by ministerial order,
      which was not read. The law speaks of substances and plants and does not mention seeds.
    sources:
      - l9337
