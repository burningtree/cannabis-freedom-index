name: Mauritania
region: Africa
iso_numeric: 478
recreational: death
medical: none
updated: 2026-10-21
summary: The 1993 law allows death for repeat or aggravated high-risk drug offences; simple use can mean up to two years, a fine alone, or both.
scores:
  possession: 0
  cultivation: 0
  enforcement: 1
  sharing: 0
  consumption: 1
  access: 0
segments:
  possession:
    text: >-
      Article 5 of the 1993 law includes possession and purchase of high-risk drugs among
      offences carrying 15–30 years and a fine, with death for a repeat offence. The separate
      simple-use offence carries up to two years, a fine alone, or both; its wording does not
      extend that penalty to personal possession.
    sources: [l9337]
  cultivation:
    text: >-
      Growing or producing high-risk drugs carries 15–30 years and a fine under Article 3 of
      the 1993 law, with death for a repeat offence. Article 13 also permits capital punishment
      in specified aggravated cases, including organised crime and violence or weapons.
    sources: [l9337]
  enforcement:
    text: >-
      Reliable figures on arrests or imprisonment of cannabis users remain unknown. Khalid
      Tinasti's 2017 analysis described scarce Mauritanian drug-use data and a public debate
      focused on trafficking. ECPM's 2024 assessment reported a moratorium on executions,
      with the last military-court execution in 1987.
    sources: [gdpo, ecpm2024]
  sharing:
    text: >-
      Giving a high-risk drug to another person, including without payment, falls under
      Article 5's 15–30 years and a fine. Repeat offences carry death; Article 13 also permits
      capital punishment for specified aggravated offences.
    sources: [l9337]
  consumption:
    text: >-
      Illicit use carries up to two years, a fine alone, or both under Article 39. Completing
      prescribed treatment or successful detoxification or medical supervision can prevent
      prosecution under Articles 44 and 51. Voluntary treatment seekers can request anonymity.
    sources: [l9337]
  access:
    text: >-
      Recreational supply is prohibited. The 2008 parliamentary debate concerned controlled
      medicines, with doctors prescribing and pharmacists dispensing under strict supervision.
    sources: [l9337, assembly2008]
context:
  death_penalty:
    text: >-
      The 1993 law prescribes death for repeat high-risk production, cultivation, import,
      export and trafficking offences under Articles 3–5. Article 13 also permits capital
      punishment where specified offences involve organised crime, violence or weapons, or
      drugs that caused a death. ECPM's 2024 assessment still listed these clauses and reported
      the last execution in 1987, following a military-court conviction.
    sources: [l9337, ecpm2024]
  production:
    status: none
    text: >-
      Tinasti's 2017 analysis cited limited earlier evidence of small cannabis production near
      the Senegal River in the south. Current production levels remain unknown.
    sources: [gdpo]
  products:
    text: Legal recreational products are prohibited by the drug law.
    sources: [l9337]
  medical:
    text: >-
      No operating medical cannabis programme is established by the retained sources. The
      2008 debate addressed the controlled supply of narcotic medicines under prescription.
    sources: [assembly2008]
  consequences:
    text: >-
      Article 17 of the 1993 law requires permanent territorial exclusion for foreigners
      convicted of listed offences, including illicit use. Courts can also impose travel
      restrictions, withdraw passports and suspend driving licences. The separate use chapter
      contains an additional exclusion clause with inconsistent cross-references.
    sources: [l9337]
  planting:
    seeds: grey
    seeds_trade: unclear
    clones: illegal
    clones_trade: banned
    text: >-
      Law 93-37 punishes growing a high-risk drug with 15–30 years and a fine, and death for
      a repeat offence (Article 3). Ministerial orders determine the domestic schedules.
      The law speaks of substances and plants and does not mention seeds.
    sources: [l9337]
  clubs:
    status: none
    text: >-
      The 1993 law prohibits growing and supplying high-risk drugs, including gifts, and
      provides no recreational club exception. Facilitating another person's use, including
      by providing premises, carries two to ten years and a fine.
    sources: [l9337]
  visitors:
    status: none
    text: >-
      There is no recreational supply exception for visitors. Simple illicit use can bring
      up to two years, a fine alone, or both. Article 17 requires permanent exclusion for
      foreigners convicted of listed drug offences, including use; the use chapter also
      contains a separate exclusion clause with inconsistent cross-references.
    sources: [l9337]
