segments:
  possession:
    text: >-
      Completely prohibited. The law imposes prison even for simple use or possession for personal
      use, with a maximum of two years and a fine.
    sources:
      - gdpo
      - wiki
  cultivation:
    text: >-
      Growers and producers can be sentenced to death under the drug law — unique in the Maghreb —
      though Mauritania has not carried out executions for decades.
    sources:
      - gdpo
  enforcement:
    text: >-
      Users are jailed in large numbers: one account estimates that roughly a third of the prison
      population is held for drug offences, nine in ten of them for simple possession or use.
    sources:
      - gdpo
  sharing:
    text: Trafficking is a capital offence on the statute book.
    sources:
      - gdpo
      - trip
  consumption:
    text: Use is punished with prison.
    sources:
      - gdpo
  access:
    text: None.
    sources:
      - wiki
context:
  death_penalty:
    text: >-
      Trafficking is a capital offence on the statute book, and growers and producers can also be
      sentenced to death, which is unique in the Maghreb. Mauritania has not carried out executions
      for decades.
    sources:
      - gdpo
      - trip
