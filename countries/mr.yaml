segments:
  possession:
    text: >-
      Article 5 of Law 93-037 treats holding, buying or transporting a high-risk drug as trafficking,
      whatever the amount: 15–30 years and a 10–100 million ouguiya fine, with death on a repeat
      conviction.[@l9337] Cannabis is a high-risk substance in Table I under the 2008 law.[@law2008]
      The separate use offence in Article 39 carries up to two years, a fine alone, or both, but its
      wording covers use only, not possession.[@l9337]
    sources:
      - l9337
      - law2008
    currency: MRU
    penalties:
      - label: Possession, purchase or transport of any amount
        treatment: criminal
        term: Trafficking
        prison_min: 15 years
        prison: 30 years
        fine_min: 10000000
        fine: 100000000
        note: Article 5; death on a repeat conviction
      - label: Simple use
        treatment: criminal
        term: Use
        prison: 2 years
        fine_min: 50000
        fine: 100000
        note: Article 39; prison, fine, or one only
  cultivation:
    text: >-
      Growing, producing or extracting a high-risk drug carries 15–30 years and a 10–100 million
      ouguiya fine, with death on a repeat conviction.[@l9337] The 2008 law separately bans cannabis
      cultivation and requires landowners and occupiers to destroy plants.[@law2008] The maximum is
      doubled, up to death, where the offence involves an organised group, violence or weapons, or
      drugs that caused a death.[@l9337]
    sources:
      - l9337
      - law2008
    currency: MRU
    penalties:
      - label: Cultivation or production
        treatment: criminal
        term: Production
        prison_min: 15 years
        prison: 30 years
        fine_min: 10000000
        fine: 100000000
        note: Article 3; death on a repeat conviction
      - label: Aggravated production or trafficking
        treatment: criminal
        term: Aggravated offence
        death: true
        note: Article 13; organised group, violence or weapons, or drugs that caused a death
  enforcement:
    text: >-
      Enforcement is focused on trafficking, and no national arrest series is published.[@unodc_szr]
      Police reported 101 drug cases and 156 suspects in the first half of 2023, with 12 kg of
      hashish and 7.1 kg of resin seized.[@cridem2023] In July–August 2026 the gendarmerie reported
      dismantling more than ten networks with over 40 arrests and individual resin seizures of 202,
      230 and 210 kg.[@lecalame2026] The death penalty remains in law but executions have been
      suspended since 1987.[@ecpm2025]
    sources:
      - unodc_szr
      - cridem2023
      - lecalame2026
      - ecpm2025
  sharing:
    text: >-
      Offering, delivering or transferring a high-risk drug, free or paid, falls under Article 5 and
      carries 15–30 years and a 10–100 million ouguiya fine, with death on a repeat conviction.[@l9337]
      Facilitating another person's use, including by providing premises, carries two to ten years,
      and criminal association ten to twenty.[@l9337] Attempt carries five to ten years.[@l9337]
    sources:
      - l9337
    currency: MRU
    penalties:
      - label: Supply or transfer, free or paid
        treatment: criminal
        term: Trafficking
        prison_min: 15 years
        prison: 30 years
        fine_min: 10000000
        fine: 100000000
        note: Article 5; death on a repeat conviction
      - label: Facilitating use, including premises
        treatment: criminal
        term: Facilitation
        prison_min: 2 years
        prison: 10 years
        fine_min: 200000
        fine: 1000000
      - label: Criminal association
        treatment: criminal
        term: Association
        prison_min: 10 years
        prison: 20 years
        fine_min: 100000
        fine: 1000000
  consumption:
    text: >-
      Illicit use carries up to two years, a 50,000–100,000 ouguiya fine, or one of those penalties
      alone.[@l9337] A person who completes prescribed treatment or detoxification can avoid
      prosecution, and those who seek treatment voluntarily may request anonymity.[@l9337]
    sources:
      - l9337
  access:
    text: >-
      No legal source. Cannabis is in Table I of the 2008 law, which bans all operations except
      licensed medical and scientific work on Tables II and III; the health minister may authorise
      research quantities under Article 81.[@law2008] No patient or recreational route was found.[@law2008]
    sources:
      - law2008
answers:
  buy:
    answer: no
    text: No legal source; only licensed medical and research handling is excepted
context:
  recreational:
    text: >-
      All recreational use is prohibited. Possession of any amount is treated as trafficking under
      Article 5, with 15–30 years and a large fine, while simple use carries up to two years.[@l9337]
      The death penalty applies on a repeat trafficking conviction, but no executions have been
      carried out since 1987.[@ecpm2025]
      [The 1993 law set the framework.](/history/mauritania-drug-law-1993/)
    sources:
      - l9337
      - ecpm2025
  death_penalty:
    text: >-
      Death is prescribed for a repeat conviction under Articles 3–5, and Article 13 allows it on a
      first conviction for organised crime, violence or weapons, or drugs that caused a death.[@l9337]
      Mauritania has a de facto moratorium: the last execution was in 1987, and it voted against the
      UN moratorium resolution on 17 December 2024.[@ecpm2025,amnesty2024] No drug-specific death
      sentence was verified for 2024–2026.[@ecpm2025]
    sources:
      - l9337
      - ecpm2025
      - amnesty2024
  production:
    status: none
    text: >-
      No lawful cannabis production. The 1993 law punishes growing high-risk drugs with 15–30 years,
      and the 2008 law expressly bans cannabis cultivation.[@l9337,law2008] Small-scale cultivation
      near the Senegal River was reported in earlier research, but current output is unknown.[@gdpo]
    sources:
      - l9337
      - law2008
      - gdpo
  medical:
    text: >-
      No medical cannabis programme. Cannabis is in Table I of the 2008 law, which the annex treats
      as having no real medical interest; licensed medical handling is limited to Tables II and
      III.[@law2008] Article 81 allows the health minister to authorise research or scientific-police
      quantities, not patient supply.[@law2008]
    sources:
      - law2008
  hemp:
    status: none
    text: >-
      No hemp or CBD regime and no THC threshold. The 2008 law bans cannabis cultivation without
      distinguishing industrial varieties, and Table I covers the plant and its preparations.[@law2008]
      No industrial licence was found.[@law2008]
    sources:
      - law2008
  consequences:
    text: >-
      Article 17 requires permanent exclusion for foreigners convicted of listed offences, including
      illicit use, and courts can impose travel bans and suspend licences.[@l9337] The law also
      provides civic-rights bans and confiscation.[@l9337]
    sources:
      - l9337
  planting:
    seeds: grey
    seeds_trade: unclear
    clones: illegal
    clones_trade: banned
    text: >-
      The 1993 law punishes growing a high-risk drug, and the 2008 law bans cannabis cultivation, but
      neither expressly mentions seeds; the Convention excludes seeds from "cannabis".[@l9337,law2008]
      Sowing is cultivation and clones are plants, so both fall under the ban; the seed statuses here
      are an inference.[@law2008]
    sources:
      - l9337
      - law2008
  clubs:
    status: none
    text: >-
      No cannabis clubs are known. Facilitating another person's use, including by providing
      premises, carries two to ten years, and the law provides no club exception.[@l9337]
    sources:
      - l9337
  visitors:
    status: none
    text: >-
      There is no legal supply for visitors. A foreigner convicted of a listed drug offence,
      including use, must be permanently excluded from Mauritania under Article 17.[@l9337]
    sources:
      - l9337
  driving:
    status: impairment
    text: >-
      The road code, Ordinance 2006-047, article 10(2), prohibits driving under the influence of
      substances capable of reducing physical or mental capacity, with 11 days to three months and a
      6,000–40,000 ouguiya fine, or one only.[@traffic2006] There is no numeric THC limit; the test is
      impairment.[@traffic2006]
    sources:
      - traffic2006
  black_market:
    text: >-
      UNODC records 4 kg of herbal cannabis and 40 kg of resin seized in 2024, figures that are
      probably partial.[@unodc_szr] Press reports in July–August 2026 described individual resin
      seizures of 202, 230 and 210 kg and more than 40 arrests, an order of magnitude above the
      annual figure; the difference reflects reporting methods, not a verified surge.[@lecalame2026]
    sources:
      - unodc_szr
      - lecalame2026
  arrests:
    text: >-
      No national arrest total for 2024–2026 was published.[@unodc_szr] Police reported 101 drug
      cases, 156 suspects, 12 kg of hashish and 7.1 kg of resin in the first half of 2023.[@cridem2023]
      In July–August 2026 the gendarmerie reported more than ten networks dismantled and over 40
      arrests.[@lecalame2026] A former president's sons were jailed in 2016 over 1.3 tonnes of
      cannabis.[@northafrica2016]
    sources:
      - unodc_szr
      - cridem2023
      - lecalame2026
      - northafrica2016
