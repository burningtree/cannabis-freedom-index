name: Mauritania
region: Africa
iso_numeric: 478
recreational: death
medical: none
updated: "2026-10-28"
summary: >-
  The 1993 law treats possession of any amount as high-risk trafficking: 15–30 years and a large
  fine, with death on a repeat conviction. Simple use can bring up to two years. Executions have
  been suspended since 1987.
