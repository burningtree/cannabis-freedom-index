name: Somaliland
region: Africa
disputed:
  part_of: so
  note: >-
    Somaliland declared independence from Somalia in 1991 and has its own government, courts and
    police. Most countries still regard it as part of Somalia.
flag: "🏳️"
population:
  2025: 5700000
cannabis_use:
  prevalence: 3.1
  estimate: true
  users: 110000
recreational: illegal
medical: none
updated: 2026-10-12
summary: >-
  Cannabis is banned outright. Police have publicly reported at least one cultivation arrest.
  Somaliland applies the old Somali penal code alongside sharia.
scores:
  possession: 0
  cultivation: 0
  enforcement: 1
  sharing: 0
  consumption: 1
  access: 0
segments:
  possession:
    text: >-
      Possession is a criminal offence. Somaliland still applies the Somali penal code, under which
      cannabis is prohibited, and prison is a realistic outcome. No specific sentence could be
      confirmed.
    sources:
      - wiki
      - ht
  cultivation:
    text: >-
      Growing is a crime. In October 2023 police in Hargeisa arrested a man accused of planting
      cannabis in the yard of a house he owned.
    sources:
      - ht
  enforcement:
    text: >-
      Police reported arresting a man accused of growing cannabis at a Hargeisa house in 2023. The
      report gave no plant count, charge, conviction or sentence, so wider enforcement and
      sentencing practice could not be confirmed.
    sources:
      - ht
  sharing:
    text: >-
      Any supply is a criminal offence.
    sources:
      - wiki
  consumption:
    text: >-
      Use is illegal.
    sources:
      - wiki
  access:
    text: >-
      No legal source.
    sources:
      - wiki
context:
  production:
    text: >-
      None.
    sources:
      - wiki
  products:
    text: >-
      No legal cannabis products.
    sources:
      - wiki
  medical:
    text: >-
      No medical cannabis programme.
    sources:
      - wiki
  consequences:
    text: >-
      Drug cases are heard under a mix of the penal code and sharia, so outcomes can vary from court
      to court.
    sources:
      - wiki
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited.
    sources:
      - ht
      - wiki
  arrests:
    text: >-
      A published police account from October 2023 described one arrest for alleged cultivation at
      a Hargeisa house. It gave no national total and did not report a conviction or sentence.
    sources:
      - ht
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone, so a visitor has no lawful way to buy
      cannabis. The sources behind this profile describe no separate rule for visitors.
    sources:
      - wiki
sources:
  ht:
    title: The Horn Tribune — Police arrest man accused of planting cannabis (13 October 2023)
    url: https://horntribune.com/2023/10/13/police-arrest-man-accused-of-planting-cannabis/
