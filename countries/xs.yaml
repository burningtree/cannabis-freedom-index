segments:
  possession:
    text: >-
      Possession is a criminal offence. Somaliland still applies the Somali penal code, under which
      cannabis is prohibited, and prison is a realistic outcome. No specific sentence could be
      confirmed.
    sources:
      - wiki
      - hd
  cultivation:
    text: >-
      Growing is a crime. In October 2023 police in Hargeisa arrested a man for growing cannabis
      plants in the yard of a house he owned.
    sources:
      - hd
  enforcement:
    text: >-
      Police act on small cases, as the 2023 arrest shows. Sentencing practice could not be
      confirmed.
    sources:
      - hd
  sharing:
    text: >-
      Any supply is a criminal offence.
    sources:
      - wiki
  consumption:
    text: >-
      Use is illegal.
    sources:
      - wiki
  access:
    text: >-
      No legal source.
    sources:
      - wiki
context:
  production:
