name: Somaliland
region: Africa
disputed:
  part_of: so
  note: >-
    Somaliland declared independence from Somalia in 1991 and has its own government, courts and
    police. Most countries still regard it as part of Somalia.
flag: 🏳️
recreational: illegal
medical: limited
updated: "2026-10-23"
summary: >-
  Cannabis is controlled through inherited Somali drug laws, with prison terms for unauthorised
  possession, cultivation and supply. Those laws contain medical licensing provisions.
  Somaliland police reported a cultivation arrest in Hargeisa in 2023.
scores:
  possession: 0
  cultivation: 0
  enforcement: 1
  sharing: 0
  consumption: 1
  access: 0
segments:
  possession:
    text: >-
      The inherited 1970 drug law sets two to seven years in prison and a fine for unauthorised
      acquisition or possession of listed narcotics.[@law] The accompanying schedule expressly
      lists cannabis, hashish and Indian hemp.[@schedule] Somaliland’s constitution keeps
      compatible earlier laws in force until replacement.[@constitution]
    sources:
      - law
      - schedule
      - constitution
  cultivation:
    text: >-
      The 1970 law requires health-ministry authorisation to cultivate, harvest or process
      plants yielding controlled drugs, with six months to two years in prison and a fine for a
      breach.[@law] Cannabis appears in the controlled list.[@schedule] Police reported a
      Hargeisa home-cultivation arrest in October 2023.[@arrest]
    sources:
      - law
      - schedule
      - arrest
  enforcement:
    text: >-
      Police reported arresting a man accused of growing cannabis in the yard of a house he
      owned in Hargeisa’s Ga’an Libaah district in October 2023.[@arrest] The published account
      describes traffic police working with the district station.[@arrest]
    sources:
      - arrest
  sharing:
    text: >-
      The 1970 law restricts transfers even without payment to authorised recipients.[@law] The
      later 1984 decree sets ten years in prison and a fine for unlawful manufacture,
      production, import, dealing or supplying drugs to another person.[@decree]
    sources:
      - law
      - decree
  consumption:
    text: >-
      The 1984 decree punishes allowing a public or private place to be used for drug
      consumption with five years in prison and a fine.[@decree] Entering such a place to
      consume carries three years and a fine.[@decree]
    sources:
      - decree
  access:
    text: >-
      The inherited drug law provides for authorised medical institutions and pharmacies, with
      prescription dispensing in medicinal doses and records of supply.[@law] Recreational
      acquisition, possession and supply fall under its criminal offences.[@law] Cannabis is
      included in the controlled list.[@schedule]
    sources:
      - law
      - schedule
context:
  production:
    text: >-
      The 1970 law places narcotic production under health-ministry control, with licences,
      annual production limits for authorised laboratories and records of quantities
      handled.[@law] The 1984 decree separately punishes unlawful drug manufacture and
      production with ten years in prison and a fine.[@decree]
    sources:
      - law
      - decree
  products:
    text: >-
      The 1970 schedule lists cannabis, hashish and Indian hemp.[@schedule] The law’s pharmacy
      route concerns drugs supplied as pharmaceutical preparations in medicinal doses on
      prescription.[@law]
    sources:
      - schedule
      - law
  medical:
    text: >-
      The inherited 1970 law provides a general medical route for controlled drugs through
      authorised institutions and prescription dispensing.[@law] It requires patient
      identification, prescribing details and pharmacy records, and punishes prescribing to
      encourage drug abuse.[@law]
    sources:
      - law
  consequences:
    text: >-
      The constitution requires crimes and punishments to be laid down by law and presumes
      accused people innocent until convicted.[@constitution] A person arrested on suspicion of
      an offence has a right to appear before a court within 48 hours, to legal representation
      and to appeal a conviction.[@constitution]
    sources:
      - constitution
  clubs:
    status: none
    text: >-
      Recreational growing and supply fall under the drug law’s authorisation requirements and
      criminal offences, without a club exemption.[@law] Even unpaid transfers must go to
      authorised recipients.[@law]
    sources:
      - law
  arrests:
    text: >-
      A published police account in October 2023 described one arrest for alleged cannabis
      cultivation at a Hargeisa house.[@arrest] It named the Eastern Division and Ga’an Libaah
      station commanders as the officers reporting the arrest.[@arrest]
    sources:
      - arrest
  visitors:
    status: none
    text: >-
      The inherited penal code applies to citizens and foreigners in the territory, subject to
      exceptions in national or international law.[@code] Cannabis possession and supply are
      covered by the separate drug law and controlled-substance list.[@law, schedule]
    sources:
      - code
      - law
      - schedule
