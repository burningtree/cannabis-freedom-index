  prevalence: 3.1
  estimate: true
  users: 110000
recreational: illegal
medical: none
updated: 2026-10-04
summary: >-
  Cannabis is banned outright and police arrest people for growing it. Somaliland applies the old
  Somali penal code alongside sharia. Khat, by contrast, is legal and widely chewed.
