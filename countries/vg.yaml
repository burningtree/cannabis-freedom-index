name: British Virgin Islands
region: North America
iso_numeric: 92
dependency:
  of: gb
  kind: British Overseas Territory
  note: >-
    The British Virgin Islands are a British Overseas Territory with their own House of Assembly
    and drug laws. The Governor must reserve a bill for the UK's decision if it appears
    inconsistent with international obligations, and the UK answers for the territory under the
    UN drug conventions.
recreational: illegal
medical: none
updated: "2026-10-23"
summary: >-
  Cannabis possession, supply, cultivation and use are offences. The House passed
  medical-licensing and record-clearing bills in 2020, but an official July 2026 review still
  reported both awaiting assent. In 2023 the premier proposed a route for doctors under existing
  legislation.
scores:
  possession: 1
  cultivation: 1
  enforcement: 2
  sharing: 1
  consumption: 1
  access: 0
segments:
  possession:
    text: >-
      Possessing cannabis is an offence, and more than 50 g of cannabis or resin creates a
      rebuttable presumption of possession for supply.[@law] The ordinary possession offence
      also applies below that threshold.[@law] In a reported June 2015 case, a visitor was fined
      $5,000 for 15.2 g, payable immediately or six months in prison.[@fine]
    sources:
      - law
      - fine
  cultivation:
    text: >-
      Growing any cannabis plant is prohibited, subject to regulations authorising activities
      under the Act.[@law] The 2020 licensing bill proposed a regulated cultivation system, but
      the July 2026 legal review still reported it awaiting assent.[@bill, lrc]
    sources:
      - law
      - bill
      - lrc
  enforcement:
    text: >-
      The Act provides imprisonment and fines for possession and cultivation; its schedules
      classify cannabis and resin as Class B drugs.[@law] The reported 2015 fine for 15.2 g
      included six months in prison in default of immediate payment.[@fine]
    sources:
      - law
      - fine
  sharing:
    text: >-
      Supplying, offering to supply or participating in supply of controlled drugs is an
      offence, subject to authorised exceptions.[@law] The Act defines supply to include
      distribution.[@law]
    sources:
      - law
  consumption:
    text: >-
      The Act expressly makes smoking or otherwise using a controlled drug an offence.[@law] It
      also penalises occupiers or managers who knowingly allow specified cannabis preparation or
      smoking on premises.[@law]
    sources:
      - law
  access:
    text: >-
      The Act provides powers for ministerial licences and regulations authorising specified
      activities.[@law] In January 2023 Premier Wheatley proposed using existing legislation to
      arrange medical administration by doctors.[@premier] The broader 2020 licensing bill still
      lacked assent in the July 2026 official review.[@lrc]
    sources:
      - law
      - premier
      - lrc
context:
  production:
    status: none
    text: >-
      Cannabis cultivation and production require authorisation under the drug law.[@law] The
      published 2020 bill proposed a licensing authority covering cultivation, processing,
      testing, import, export and distribution.[@bill] The July 2026 review recorded that bill
      as still unassented.[@lrc]
    sources:
      - law
      - bill
      - lrc
  products:
    text: >-
      Cannabis and resin are listed as Class B controlled drugs.[@law] The published 2020 bill
      proposed dispensary sales with different requirements for proof of age, a declaration of
      therapeutic use or a medical document.[@bill] The July 2026 review still reported the bill
      awaiting assent.[@lrc]
    sources:
      - law
      - bill
      - lrc
  medical:
    text: >-
      The Act gives the minister powers to regulate authorised controlled-drug activities,
      including professional medical and pharmacy handling, subject to specified
      restrictions.[@law] Premier Wheatley said in 2023 that work remained on arrangements for
      doctors to administer medical cannabis.[@premier] The 2020 licensing bill still lacked
      assent in the July 2026 review.[@lrc]
    sources:
      - law
      - premier
      - lrc
  consequences:
    text: >-
      The law permits forfeiture of drugs and property connected with offences, with special
      rules for conveyances used or intended for drug trafficking and procedures for owners to
      seek restoration.[@law] A 2020 bill proposed clearing some historic cannabis convictions,
      but it remained unassented in the July 2026 review.[@lrc]
    sources:
      - law
      - lrc
  clubs:
    status: none
    text: >-
      Supplying cannabis is controlled by the drug law, and occupiers or managers can commit an
      offence by knowingly permitting specified production, supply or smoking activities.[@law]
    sources:
      - law
  visitors:
    status: none
    text: >-
      Importing controlled drugs requires an applicable exception or a ministerial
      licence.[@law] A visitor arriving from the US Virgin Islands in 2015 admitted possessing
      cannabis found by customs officers in his luggage and received a $5,000 fine.[@fine]
    sources:
      - law
      - fine
