name: British Virgin Islands
region: North America
iso_numeric: 92
dependency:
  of: gb
  kind: British Overseas Territory
  note: >-
    The British Virgin Islands are a British Overseas Territory with their own House of Assembly and
    drug laws. The Governor must reserve a bill for the UK's decision if it appears inconsistent with
    international obligations, and the UK answers for the territory under the UN drug conventions.
recreational: illegal
medical: none
updated: 2026-10-17
summary: >-
  Possession of cannabis is a crime and courts have imposed heavy fines. Two 2020 laws, one licensing
  medical cannabis and one expunging old minor possession convictions, passed the House of Assembly
  but have still not received assent after the UK raised concerns about drug trafficking.
scores:
  possession: 1
  cultivation: 1
  enforcement: 2
  sharing: 1
  consumption: 1
  access: 0
segments:
  possession:
    text: >-
      Possession is an offence under the Drugs (Prevention of Misuse) Act. In 2015 a Road Town
      magistrate fined a man $5,000 for 15.2 g, payable immediately or six months in prison. A 2020
      amendment that would have expunged some historic convictions for up to 50 g of cannabis or
      10 g of resin has not received assent.
    sources:
      - vino15
      - lrc
  cultivation:
    text: >-
      Growing cannabis is an offence. The Cannabis Licensing Act 2020 would have licensed
      cultivation for medical purposes, but it has not received assent.
    sources:
      - lrc
  enforcement:
    text: >-
      Small possession cases end in fines, with prison if the fine is not paid. The UK cited a
      significant scale of drug trafficking through the territory, including a seizure of more than
      2,300 kg of cocaine in November 2020, when it held back the reform bills.
    sources:
      - vino15
      - lrc
  sharing:
    text: >-
      Supplying cannabis is an offence, with no exception for sharing without payment.
    sources:
      - lrc
  consumption:
    text: >-
      Use is dealt with through the possession offence. No place exists where it is tolerated.
    sources:
      - vino15
  access:
    text: >-
      No legal source. The UK Home Office remains the licensing authority for narcotics, including
      medical ones, and the medical cannabis regime of the 2020 Act has not come into force. In 2023
      the Premier said the government and the UK had found a way forward, focused on licensing local
      doctors to administer medical cannabis, without a timeline.
    sources:
      - lrc
      - vino23
context:
  production:
    text: >-
      No licensed production. The Cannabis Licensing Act 2020 would have set up a territorial
      authority to license cultivation, processing, import, export and sale for medical purposes,
      taking over from the Home Office.
    sources:
      - lrc
  products:
    text: >-
      No legal cannabis products. The 2020 Act would have allowed up to 1 g to be dispensed on proof
      of age and up to 50 g on a self-declaration, without a prescription, which in effect would have
      permitted recreational sales.
    sources:
      - lrc
  medical:
    text: >-
      No medical cannabis programme operates. In December 2020 the Governor said the Home Office and
      the territory had to agree preliminary steps before he could assent to the licensing law. In
      2023 the Premier noted that existing law lets the health minister make regulations allowing
      cannabis to be administered legally.
    sources:
      - lrc
      - vino23
  consequences:
    text: >-
      Progress on both 2020 bills was interrupted by political turmoil, including a Commission of
      Inquiry into corruption and the arrest of Premier Andrew Fahie in the United States on drug
      trafficking and money laundering charges. As of July 2026 neither had received assent.
    sources:
      - lrc
  clubs:
    status: none
    text: >-
      No cannabis clubs are known. Supply is an offence.
    sources:
      - lrc
  visitors:
    status: none
    text: >-
      There is no legal supply for anyone. In the 2015 case the man fined $5,000 had brought the
      cannabis from the US Virgin Islands.
    sources:
      - vino15
