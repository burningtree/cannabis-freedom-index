answers:
  carry:
    answer: limited
    text: >-
      The 30 g exemption coexists with separate school-zone possession rules and a rebuttable
      supply presumption
  grow:
    answer: limited
    text: >-
      Four plants per dwelling-house, excluding cultivation in or within 100 yards of school
      premises
  caught:
    answer: limited
    label: School-location restrictions
    text: >-
      School-location restrictions qualify the possession and growing allowances; a supply
      presumption can arise
