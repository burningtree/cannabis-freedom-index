name: Saint Lucia
region: North America
iso_numeric: 662
recreational: legal
medical: none
updated: '2026-10-27'
summary: >-
  Adults have a 30 g possession exemption and may grow four plants per dwelling-house, subject
  to school-location restrictions. There is no legal market.
scores:
  possession: 5
  cultivation: 4
  enforcement: 6
  sharing: 1
  consumption: 3
  access: 0
segments:
  possession:
    text: >-
      Section 8A exempts possession of up to 30 g cannabis or resin from the ordinary possession
      offence and prosecution and punishment under section 37.[@exemption8a] Section 12 separately
      prohibits possession in or within 100 yards of school premises and places the burden of
      rebutting presumed supply on the accused. Its interaction with the broad section 8A
      punishment exemption is not resolved in the reviewed texts.[@school12,exemption8a]
    sources:
      - exemption8a
      - school12
  cultivation:
    text: >-
      Up to four plants per dwelling-house are permitted.[@cult_regs] Cultivation in or within 100
      yards of school premises is prohibited, including nursery schools, universities and their
      off-site playing fields.[@schoolgrow]
    sources:
      - cult_regs
      - schoolgrow
  enforcement:
    text: >-
      The quantity exemptions have location restrictions: school-zone possession and its
      rebuttable supply presumption are addressed separately in section 12.[@school12] Section 8A
      also disapplies section 37 punishment for up to 30 g; the reviewed texts do not settle that
      interaction.[@exemption8a] Growing within 100 yards of school premises is
      prohibited.[@schoolgrow]
    sources:
      - school12
      - exemption8a
      - schoolgrow
  sharing:
    text: >-
      The 2021 amendment is limited to personal private use. Supplying cannabis to others remains an
      offence.
    sources:
      - mh
      - law
  consumption:
    text: Private use only. Smoking in public places remains an offence.
    sources:
      - mh
      - wiki
  access:
    text: >-
      No lawful place to buy. The Regulated Substances Authority was established in 2023, and a
      draft Cannabis and Industrial Hemp Bill was published for consultation in January 2025, but
      the draft itself did not open a retail system.
    sources:
      - rsa_act
      - bill_review
context:
  production:
    text: >-
      The Regulated Substances Authority is building a licensing and traceability system, but the
      cannabis-specific licensing bill remains a proposal rather than an operating market law.
    sources:
      - rsa_act
      - bill_review
  medical:
    text: No medical cannabis programme is in operation.
    sources:
      - wiki
      - voice
  consequences:
    text: >-
      The government authorised work on expunging records of people convicted over amounts under 30
      g where no violence was involved.
    sources:
      - wiki
  planting:
    seeds: legal
    seeds_trade: banned
    clones: legal
    clones_trade: banned
    text: >-
      A household may cultivate up to four cannabis plants, and the cultivation regulations
      expressly allow the grower to obtain cannabis seeds. Plants and propagating material count
      toward the four-plant limit; the personal-use exception does not authorise anyone to supply
      seeds or clones to another person.
    sources:
      - cult_regs
      - law
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and no law provides for them: the 2021 amendment is limited
      to personal private use, and supplying cannabis to others remains an offence.
    sources:
      - mh
      - law
  visitors:
    status: none
    text: >-
      There is no legal recreational shop. School-location restrictions qualify the 30 g and
      four-plant allowances; possession rules and the scope of the punishment exemption need to be
      read together.[@exemption8a,school12,schoolgrow]
    sources:
      - exemption8a
      - school12
      - schoolgrow
  driving:
    status: impairment
    text: >-
      Motor Vehicles and Road Traffic Act section 75 defines drug intoxication as
      impairment making the driver incapable of proper control. It prohibits driving
      on a road and care or control of a vehicle on a road or other public place even
      when stationary. The published 2023 consolidation sets a maximum EC$5,000 fine,
      one year's imprisonment, or both. Reasonable belief of an offence permits police
      to demand intoxication tests and require the driver to accompany them. Refusal
      without reasonable excuse is a separate offence with the same maxima and may
      support an adverse inference; it is not a numerical THC rule. Section 106 permits
      a court to impose a definite disqualification period based on the offence and
      driving record; after imprisonment that period starts on the following day. The
      2026 amendment changes section 28 licensing provisions, not these offences. No
      cannabis-specific cutoff or medical-use exemption was established.
    sources:
      - traffic75
      - traffic106
      - traffic2026
  recreational:
    text: >-
      Home growing provides a personal supply of up to four plants per dwelling-house, with a
      100-yard school exclusion. There is no authorised recreational retail
      market.[@cult_regs,schoolgrow,rsa_act,bill_review]
    sources:
      - cult_regs
      - schoolgrow
      - rsa_act
      - bill_review
