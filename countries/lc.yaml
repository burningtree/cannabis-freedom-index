name: Saint Lucia
region: North America
iso_numeric: 662
recreational: legal
medical: none
updated: 2026-10-12
summary: >-
  Since 2021 adults may hold up to 30 g and grow four plants per household. There is no legal
  market.
scores:
  possession: 5
  cultivation: 4
  enforcement: 6
  sharing: 1
  consumption: 3
  access: 0
segments:
  possession:
    text: >-
      Under the amendment passed by the House on 14 September 2021 and in force from 27 September, a person holding 30 g or less of cannabis or cannabis resin 'is not
      guilty of an offence', for personal, private use by adults. Above 30 g the ordinary offences
      apply.
    sources:
      - law
      - mh
  cultivation:
    text: >-
      Up to four plants per household are permitted alongside the 30 g rule. The limit is per
      household, not per adult.
    sources:
      - cult_regs
  enforcement:
    text: >-
      Nothing within the limits; above them the Drugs Act penalties, including prison for
      trafficking, still apply.
    sources:
      - law
      - mh
  sharing:
    text: >-
      The 2021 amendment is limited to personal private use. Supplying cannabis to others remains an
      offence.
    sources:
      - mh
      - law
  consumption:
    text: Private use only. Smoking in public places remains an offence.
    sources:
      - mh
      - wiki
  access:
    text: >-
      No lawful place to buy. The Regulated Substances Authority was established in 2023, and a
      draft Cannabis and Industrial Hemp Bill was published for consultation in January 2025, but
      the draft itself did not open a retail system.
    sources:
      - rsa_act
      - bill_review
context:
  production:
    text: >-
      The Regulated Substances Authority is building a licensing and traceability system, but the
      cannabis-specific licensing bill remains a proposal rather than an operating market law.
    sources:
      - rsa_act
      - bill_review
  products:
    text: Only home-grown cannabis and resin within the 30 g limit.
    sources:
      - law
  medical:
    text: No medical cannabis programme is in operation.
    sources:
      - wiki
      - voice
  consequences:
    text: >-
      The government authorised work on expunging records of people convicted over amounts under 30
      g where no violence was involved.
    sources:
      - wiki
  planting:
    seeds: legal
    seeds_trade: banned
    clones: legal
    clones_trade: banned
    text: >-
      A household may cultivate up to four cannabis plants, and the cultivation regulations
      expressly allow the grower to obtain cannabis seeds. Plants and propagating material count
      toward the four-plant limit; the personal-use exception does not authorise anyone to supply
      seeds or clones to another person.
    sources:
      - cult_regs
      - law
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and no law provides for them: the 2021 amendment is limited
      to personal private use, and supplying cannabis to others remains an offence.
    sources:
      - mh
      - law
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. British travel advice says there are
      severe penalties for all drug offences and tells travellers to pack their own luggage
      and carry nothing through customs for anyone else.
    sources:
      - rsa_act
      - bill_review
      - fcdo
  driving:
    status: impairment
    text: >-
      Motor Vehicles and Road Traffic Act section 75 defines drug intoxication as
      impairment making the driver incapable of proper control. It prohibits driving
      on a road and care or control of a vehicle on a road or other public place even
      when stationary. The published 2023 consolidation sets a maximum EC$5,000 fine,
      one year's imprisonment, or both. Reasonable belief of an offence permits police
      to demand intoxication tests and require the driver to accompany them. Refusal
      without reasonable excuse is a separate offence with the same maxima and may
      support an adverse inference; it is not a numerical THC rule. Section 106 permits
      a court to impose a definite disqualification period based on the offence and
      driving record; after imprisonment that period starts on the following day. The
      2026 amendment changes section 28 licensing provisions, not these offences. No
      cannabis-specific cutoff or medical-use exemption was established.
    sources:
      - traffic75
      - traffic106
      - traffic2026
