segments:
  possession:
    text: >-
      Under the amendment passed by the House on 14 September 2021 and in force from 27 September, a person holding 30 g or less of cannabis or cannabis resin 'is not
      guilty of an offence', for personal, private use by adults. Above 30 g the ordinary offences
      apply.
    sources:
      - law
      - mh
  cultivation:
    text: >-
      Up to four plants per household are permitted alongside the 30 g rule. The limit is per
      household, not per adult.
    sources:
      - cult_regs
  enforcement:
    text: >-
      Nothing within the limits; above them the Drugs Act penalties, including prison for
      trafficking, still apply.
    sources:
      - law
      - mh
  sharing:
    text: >-
      The 2021 amendment is limited to personal private use. Supplying cannabis to others remains an
      offence.
    sources:
      - mh
      - law
  consumption:
    text: Private use only. Smoking in public places remains an offence.
    sources:
      - mh
      - wiki
  access:
    text: >-
      No lawful place to buy. The Regulated Substances Authority was established in 2023, and a
      draft Cannabis and Industrial Hemp Bill was published for consultation in January 2025, but
      the draft itself did not open a retail system.
    sources:
      - rsa_act
      - bill_review
context:
  production:
    text: >-
      The Regulated Substances Authority is building a licensing and traceability system, but the
      cannabis-specific licensing bill remains a proposal rather than an operating market law.
    sources:
      - rsa_act
      - bill_review
  products:
    text: Only home-grown cannabis and resin within the 30 g limit.
    sources:
      - law
  medical:
    text: No medical cannabis programme is in operation.
    sources:
      - wiki
      - voice
  consequences:
    text: >-
      The government authorised work on expunging records of people convicted over amounts under 30
      g where no violence was involved.
    sources:
      - wiki
  planting:
    seeds: legal
    seeds_trade: banned
    clones: legal
    clones_trade: banned
    text: >-
      A household may cultivate up to four cannabis plants, and the cultivation regulations
      expressly allow the grower to obtain cannabis seeds. Plants and propagating material count
      toward the four-plant limit; the personal-use exception does not authorise anyone to supply
      seeds or clones to another person.
    sources:
      - cult_regs
      - law
