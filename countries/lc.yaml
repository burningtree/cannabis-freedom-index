name: Saint Lucia
region: North America
iso_numeric: 662
recreational: legal
medical: none
updated: 2026-10-04
summary: >-
  Since 2021 adults may hold up to 30 g and grow four plants per household. There is no legal
  market.
scores:
  possession: 5
  cultivation: 4
  enforcement: 5
  sharing: 1
  consumption: 3
  access: 0
segments:
  possession:
    text: >-
      Since 14 September 2021 a person holding 30 g or less of cannabis or cannabis resin 'is not
      guilty of an offence', for personal, private use by adults. Above 30 g the ordinary offences
      apply.
    sources:
      - law
      - mh
  cultivation:
    text: >-
      Up to four plants per household are permitted alongside the 30 g rule. The limit is per
      household, not per adult.
    sources:
      - wiki
  enforcement:
    text: >-
      Nothing within the limits; above them the Drugs Act penalties, including prison for
      trafficking, still apply.
    sources:
      - law
      - mh
  sharing:
    text: >-
      The 2021 amendment is limited to personal private use. Supplying cannabis to others remains an
      offence.
    sources:
      - mh
      - law
  consumption:
    text: Private use only. Smoking in public places remains an offence.
    sources:
      - mh
      - wiki
  access:
    text: >-
      No lawful place to buy. A Regulated Substances Authority bill to license a cannabis industry
      was introduced in 2023, following a Cannabis Commission set up in 2019, but no retail system
      is operating.
    sources:
      - voice
      - wiki
context:
  production:
    text: No commercial licences are being issued yet.
    sources:
      - voice
  products:
    text: Only home-grown cannabis and resin within the 30 g limit.
    sources:
      - law
  medical:
    text: No medical cannabis programme is in operation.
    sources:
      - wiki
      - voice
  consequences:
    text: >-
      The government authorised work on expunging records of people convicted over amounts under 30
      g where no violence was involved.
    sources:
      - wiki
