segments:
  possession:
    text: >-
      In June 2024 the Supreme Court ruled that possessing cannabis for personal use is not a crime,
      and set a presumption: up to 40 g counts as personal use. It is still prohibited — the
      cannabis is seized and the person receives an administrative measure such as a warning or a
      mandatory educational course. Police can still treat someone under 40 g as a dealer if there
      is other evidence, such as scales or packaging.
    sources:
      - conectas
      - sechat
  cultivation:
    text: >-
      The same ruling presumes that up to six female plants are for personal use, so growing them is
      an administrative infraction rather than a crime. It is not a right to grow: plants are
      seized. Some patients hold individual court orders allowing them to cultivate.
    sources:
      - sechat
      - gv
  enforcement:
    text: >-
      Users are no longer criminally punished, but Brazil's drug law is harsh on anyone classed as a
      dealer, and critics note that the line is drawn unevenly, falling hardest on poor and Black
      Brazilians.
    sources:
      - conectas
      - gv
  sharing:
    text: Any supply to another person is trafficking, a serious crime with a minimum of five years.
    sources:
      - gv
      - conectas
  consumption:
    text: >-
      Use remains an unlawful act subject to administrative measures, not criminal ones. Public use
      still leads to police stops and seizure.
    sources:
      - gv
      - sechat
  access:
    text: >-
      No adult-use sales. Pharmacies sell registered cannabis products on prescription, and patients
      can import with authorisation from the health regulator.
    sources:
      - anvisa
      - gv
context:
  production:
    text: >-
      In February 2026 the health regulator published rules allowing companies to cultivate low-THC
      cannabis (0.3% or less) for medical, pharmaceutical and research purposes under special
      authorisation, after a 2024 high-court order. The cultivation rules took effect on 4 August
      2026, and patient associations may grow for their members in a supervised trial scheme. No
      adult-use production.
    sources:
      - anvisa
  products:
    text: Prescription oils and extracts, mostly CBD-dominant; no legal flower for general sale.
    sources:
      - anvisa
  medical:
    text: >-
      Doctors can prescribe registered or imported cannabis products; costs are high, and patient
      associations and court-authorised home growers fill part of the gap.
    sources:
      - anvisa
      - gv
  consequences:
    text: >-
      Administrative measures do not create a criminal record. The ruling opened the way to review
      past convictions for small amounts.
    sources:
      - conectas
  planting:
    seeds: grey
    seeds_trade: unclear
    clones: illegal
    clones_trade: banned
    text: >-
      Law 11.343 does not name seeds. It treats sowing or growing plants for a small amount
      for personal use like possession, with a warning, community service or an educational
      course instead of prison (Article 28), and punishes growing without authorisation, or
      supplying raw material for drugs, as trafficking (Article 33).
    sources:
      - lei
  clubs:
    status: tolerated
    text: >-
      Brazil's clubs are patient associations rather than recreational ones. No law licenses
      them to grow; they rely on court orders, usually preventive habeas corpus, obtained one
      association at a time. A 2024 industry yearbook counted 259 cannabis associations and
      three federations, serving about 147,000 patients, roughly a fifth of the country's
      medical cannabis patients. Only 40 held an individual or collective court authorisation
      to cultivate: 23 in the Southeast, 11 in the Northeast, 4 in the South, 2 in the Centre-
      West and none in the North. The rest work without that protection.
    sources:
      - sechat40
