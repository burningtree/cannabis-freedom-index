name: Costa Rica
region: North America
iso_numeric: 188
recreational: decriminalised
medical: limited
updated: 2026-10-04
summary: Personal use is not penalised. A 2022 law legalised medical cannabis and hemp.
scores:
  possession: 3
  cultivation: 1
  enforcement: 4
  sharing: 1
  consumption: 3
  access: 1
segments:
  possession:
    text: >-
      The drug law punishes production and trafficking, not personal use, so possessing a small
      amount for your own consumption carries no criminal penalty. The law never defines 'small',
      leaving it to police and prosecutors, and the cannabis is confiscated.
    sources:
      - wiki
      - obs
  cultivation:
    text: >-
      Not legal. The law does not say whether growing for yourself is allowed, and provisions that
      would have let patients grow a few plants were removed from the 2022 medical law before it
      passed. Courts have occasionally acquitted small home growers.
    sources:
      - wiki
      - obs
  enforcement:
    text: Users are not prosecuted. Trafficking and cultivation carry eight to fifteen years in prison.
    sources:
      - wiki
      - obs
  sharing:
    text: Any supply to another person is trafficking.
    sources:
      - wiki
  consumption:
    text: >-
      Personal use is not punished. Smoking in public can lead to confiscation and police
      intervention but not criminal charges.
    sources:
      - wiki
      - obs
  access:
    text: >-
      No legal adult-use source of any kind. A government bill to regulate recreational sales was
      presented but not approved.
    sources:
      - lex
      - obs
context:
  production:
    text: >-
      Law 10113 of March 2022 created licences for medicinal cannabis cultivation and processing,
      and freed hemp for food and industrial use.
    sources:
      - law
      - obs
  products:
    text: Hemp and CBD products, and medicinal products under the 2022 law.
    sources:
      - law
  medical:
    text: >-
      Legal since 2022 on prescription, with licensed production and pharmacy dispensing. The market
      is still small.
    sources:
      - law
      - obs
  consequences:
    text: No criminal record for personal use.
    sources:
      - wiki
