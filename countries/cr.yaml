name: Costa Rica
region: North America
iso_numeric: 188
recreational: decriminalised
medical: limited
updated: '2026-10-26'
summary: >-
  Personal possession is not penalised, and courts require evidence of trafficking before
  punishing home cultivation. A 2022 law legalised medical cannabis and hemp.
scores:
  possession: 3
  cultivation: 2
  enforcement: 4
  sharing: 1
  consumption: 3
  access: 0
segments:
  possession:
    text: >-
      The drug law punishes production and trafficking, not personal use, so possessing a small
      amount for your own consumption carries no criminal penalty. The law never defines 'small',
      leaving it to police and prosecutors, and the cannabis is confiscated.
    sources:
      - law8204
      - obs
  cultivation:
    text: >-
      Law 8204 lists unauthorised cultivation among trafficking offences, but the Supreme Court let
      a 2016 home-grow acquittal stand because prosecutors had not shown that the plants were meant
      for sale or distribution. Personal cultivation is therefore tolerated case by case, without
      a statutory plant limit or an affirmative right to grow.
    sources:
      - law8204
      - court2018
  enforcement:
    text: >-
      Users are not prosecuted. Cultivation or possession proved to be for trafficking, and
      unauthorised supply, carry eight to fifteen years in prison.
    sources:
      - law8204
      - court2018
  sharing:
    text: Any supply to another person is trafficking.
    sources:
      - law8204
  consumption:
    text: >-
      Personal use is not punished. Smoking in public can lead to confiscation and police
      intervention but not criminal charges.
    sources:
      - law8204
      - obs
  access:
    text: >-
      No lawful adult-use supply exists. Law 10113 and its regulations provide medical routes, but
      an operating THC patient-supply route has not been verified. Registered-product pharmacy
      sales, individual import authorisations and pharmacy compounding have different
      requirements.[@medical44917,registration2026]
    sources:
      - medical44917
      - registration2026
context:
  recreational:
    text: >-
      There is no legal recreational market, but personal use is not punished: possessing a
      small amount for your own consumption carries no criminal penalty, though the law never
      defines small and the cannabis is confiscated.[@law8204,obs] Home growing is tolerated
      case by case after a 2016 acquittal stood, with no plant limit and no affirmative right
      to grow.[@law8204,court2018] Supply to another person is trafficking: eight to fifteen
      years.[@law8204]
    sources:
      - law8204
      - obs
      - court2018
  production:
    status: medical
    text: >-
      Law 10113 of March 2022 created licences for medicinal cannabis cultivation and processing,
      and freed hemp for food and industrial use.
    sources:
      - law10113
      - mag
  products:
    text: >-
      Hemp/CBD goods are distinct from prescription THC products. The medicinal framework permits
      registered dried flower and dosed products; individual pharmacy-made non-sterile preparations
      are exempt from finished-product registration, subject to their own controls. These
      permissions do not establish stocked products.[@medical44917]
    sources:
      - medical44917
  medical:
    text: >-
      Law 10113 created the medical framework in 2022.[@law10113] Decree 44917-S allows pharmacy
      sales of registered medicinal cannabis products; controlled products require a digital
      prescription. The Health Ministry opened applications in June 2025 and still publishes
      registration procedures. Routine pharmacy availability of a named approved THC product has not
      been established.[@medical44917,registration_open,registration2026] Section 8.4 separately
      allows the drug authority to authorise personal imports of unregistered medicines on medical
      documentation, including for qualifying patients treated abroad. Non-sterile pharmacy
      compounding also has a registration exception. Neither route is evidence that ordinary
      pharmacies already stock cannabis medicines.[@medical44917]
    sources:
      - law10113
      - medical44917
      - registration_open
      - registration2026
  consequences:
    text: No criminal record for personal use.
    sources:
      - law8204
  planting:
    seeds: grey
    seeds_trade: regulated
    clones: grey
    clones_trade: regulated
    text: >-
      Courts require evidence of trafficking before punishing cultivation for personal use, so
      possessing and planting one's own seed or cutting sits in the same case-specific grey area.
      Commercial propagation is regulated: Law 10113 covers seeds, seedlings and cuttings, and
      licensed medical or authorised hemp growers must use lawful, registered material. The
      Agriculture Ministry says there is no domestic commercial seed supplier, so seed must be
      imported under seed and plant-health rules.
    sources:
      - court2018
      - law10113
      - mag
  clubs:
    status: underground
    text: >-
      Clubs have no legal basis, and the one documented attempt was pushed out. High Club, a
      private members' space in San José where people could consume products with THC and CBD,
      opened in December 2020 and ran for about a year; its founder said municipal police
      parked a patrol nearby and came every night, a complaint was filed alleging a minor had
      smoked there, and the landlord took the premises back. Home growing and private use are
      not punished, but selling is. A bill discussed in Congress in 2022 would have allowed
      private cannabis clubs. No national picture of other clubs was found.
    sources:
      - lr22
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. The drug law punishes production and
      trafficking, not personal use, so possessing a small amount for one's own consumption
      carries no criminal penalty; the law never defines 'small', leaving it to police and
      prosecutors.
    sources:
      - law8204
      - obs
  driving:
    status: impairment
    text: >-
      Penal Code article 261 bis penalises driving under the influence of narcotics,
      psychotropic drugs or analogous substances affecting the driver. The current
      text provides one to three years' imprisonment plus disqualification from
      driving all vehicle types for two to four years; repeat offending increases
      the prison term by one-third. A sentence of two years or less can be converted
      by the court into the specified fine or public-service alternative. Traffic
      Law article 208 permits protocol-based testing of a suspected drug-influenced
      driver, a requested second test after a positive preliminary result, and
      referral to prosecutors where the criminal offence is established. Screening
      must not be treated as the criminal finding itself. Law 10860 was enacted in
      2026, but the official legal database identifies 28 March 2027 as its effective
      date. Its future drug wording, prescription exclusion and testing deadline
      are therefore not presented as already-operative protections. No numerical
      THC cutoff was verified in the current provisions.
    sources:
      - trafficpenal
      - traffic9078
  black_market:
    text: >-
      Figures reported by the government to the UN drugs office record 16,668 kg of herbal
      cannabis seized in 2024, against 15,847 kg in 2023, and 3.8 kg of cannabis resin
      seized in 2024. The UN publishes them as kilogram equivalents, and countries count
      seizures differently, so the figures are not comparable across borders.
    sources:
      - unodc_szr
