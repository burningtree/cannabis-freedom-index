segments:
  possession:
    text: >-
      Illegal under Article 525 of the 2004 Criminal Code, which also penalises unlawful use.
      Possession for personal use is reported to bring six months to five years depending on
      quantity and record.
    sources:
      - leaf
  cultivation:
    text: Cultivation can bring up to fifteen years where commercial intent is shown.
    sources:
      - leaf
  enforcement:
    text: >-
      British travel advice says drug offences are treated seriously and that possession can lead to
      five to ten years in prison and potentially large fines. No account of how the law is applied
      to ordinary users was found.
    sources:
      - fcdo
  sharing:
    text: Trafficking and sale carry up to fifteen years.
    sources:
      - leaf
  consumption:
    text: >-
      Use is an offence. This applies equally in Shashamane, the Rastafari settlement, despite its
      reputation.
    sources:
      - leaf
