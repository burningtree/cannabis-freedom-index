name: Ethiopia
region: Africa
iso_numeric: 231
recreational: illegal
medical: none
updated: 2026-10-27
summary: >-
  Possession for personal use can bring up to seven years' rigorous imprisonment and a fine of up
  to 50,000 Birr. Supply with the intent to traffic starts at five years.
scores:
  possession: 1
  cultivation: 1
  enforcement: 1
  sharing: 1
  consumption: 1
  access: 0
segments:
  possession:
    text: >-
      Article 525(4) of the 2004 Criminal Code punishes planting, buying, receiving, making,
      possessing, selling or delivering a narcotic for private use by oneself or another, and
      unlawful use, with rigorous imprisonment of up to seven years and a fine of up to 50,000
      Birr.[@et525,et525wipo] Those figures are the statutory ceilings. The 2005 code's separation of
      personal use from trafficking is traced in the [2005 code](/history/ethiopia-criminal-code-2005/).
    sources:
      - et525
      - et525wipo
    currency: ETB
    penalties:
      - label: Personal use (Article 525(4))
        treatment: criminal
        term: Personal use
        prison: 7 years
        fine: 50000
        note: Rigorous imprisonment up to seven years and fine up to 50,000 Birr; statutory ceilings
  cultivation:
    text: >-
      Growing for one's own use falls under the same ceiling of seven years. Growing with the
      intent to traffic is a different offence: rigorous imprisonment of not less than five years
      and a fine of up to 100,000 Birr. The aggravated trafficking cases start at ten years and a
      fine of up to 200,000 Birr.[@et525,et525wipo] The article states those minimums and does not set a maximum
      term for them.
    sources:
      - et525
      - et525wipo
    currency: ETB
    penalties:
      - label: Growing for own use
        treatment: criminal
        term: Personal use
        prison: 7 years
        note: Same seven-year ceiling as personal use
      - label: Growing with intent to traffic
        treatment: criminal
        term: Trafficking
        prison_min: 5 years
        fine: 100000
        note: At least five years and fine up to 100,000 Birr; no maximum term stated
      - label: Aggravated trafficking
        treatment: criminal
        term: Aggravated trafficking
        prison_min: 10 years
        fine: 200000
        note: At least ten years and fine up to 200,000 Birr; no maximum term stated
  enforcement:
    text: >-
      The personal-use offence is rigorous imprisonment of up to seven years. Trafficking-intent
      offences start at five years, and the aggravated cases at ten.[@et525] No account of how often
      ordinary users are jailed was found.
    sources:
      - et525
  sharing:
    text: >-
      Delivering or selling a narcotic for private use by another person is the personal-use
      offence, with up to seven years. Supply with the intent to traffic starts at five years, and
      the aggravated cases at ten.[@et525,et525wipo]
    sources:
      - et525
      - et525wipo
    penalties:
      - label: Supply for another person's private use
        treatment: criminal
        term: Personal use
        prison: 7 years
        note: Personal-use offence ceiling
      - label: Supply with intent to traffic
        treatment: criminal
        term: Trafficking
        prison_min: 5 years
        note: At least five years; no maximum term stated
      - label: Aggravated supply
        treatment: criminal
        term: Aggravated trafficking
        prison_min: 10 years
        note: At least ten years; no maximum term stated
  consumption:
    text: >-
      Use is an offence. This applies equally in Shashamane, the Rastafari settlement, despite its
      reputation.[@leaf]
    sources:
      - leaf
  access:
    text: None.[@leaf]
    sources:
      - leaf
context:
  recreational:
    text: >-
      There is no legal way to get cannabis. Personal use can bring rigorous imprisonment of up
      to seven years and a fine of up to 50,000 Birr.[@et525] Rastafari who [settled at
      Shashamane in the 1960s](/history/ethiopia-shashamane-settlement-1965/) get no
      exception: use is an offence there too.[@leaf]
    sources:
      - et525
      - leaf
  culture:
    text: >-
      In the 1960s Rastafari from the Caribbean [settled on land set aside for them near
      Shashamane](/history/ethiopia-shashamane-settlement-1965/); the town became known for
      growing cannabis, mostly for local use, with no exception in the law.[@leaf] The settlers'
      use belongs to the wider [Rastafari sacrament](/culture/traditions/rastafari-sacrament/)
      tradition, which Ethiopian law does not recognise.
    sources:
      - leaf
  production:
    status: none
    text: >-
      No licensed cannabis production exists; what is grown, including around Shashamane, is
      unlicensed and falls under the cultivation offences.[@leaf,et525]
    sources:
      - leaf
      - et525
  medical:
    text: >-
      No medical cannabis. In March 2019 the health minister said growing cannabis for medical
      purposes had never been recognised or approved, and the Investment Commission said it
      would issue no permit to grow it, after a proposed farm in the Amhara region caused a
      public outcry.[@rep19,fort19] The code draws no hemp distinction either: all forms,
      including CBD and hemp, count as illicit.[@zennjet]
    sources:
      - rep19
      - fort19
      - zennjet
  consequences:
    text: >-
      The retained sources describe no consequence beyond the sentence itself: personal use
      brings rigorous imprisonment of up to seven years and a fine of up to 50,000 Birr, with
      no account found of how often ordinary users are jailed.[@et525]
    sources:
      - et525
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. Possession for personal use can bring
      rigorous imprisonment of up to seven years and a fine of up to 50,000 Birr.[@et525]
      Bringing medical cannabis into the country, whatever the prescription, is equally
      prohibited.[@zennjet]
    sources:
      - et525
      - zennjet
  driving:
    status: consumption
    text: >-
      Article 75 of the 2024 Road Transport Traffic Control Regulation prohibits driving
      or attempting to drive under the influence of drugs or while taking them, including
      medication or substances that may diminish driving competence; it sets no numerical
      THC allowance.[@traffic2024] Drivers involved in a fatal crash may have to take a drug
      test, with refusal treated as positive, and traffic controllers may hold a
      drug-influenced driver's vehicle for twelve hours unless another fit person drives
      it.[@traffic2024] Article 98 repealed Regulation 208/2011 as amended by 395/2017 while
      preserving compatible earlier directives, and Article 95 refers penalties to Schedule
      B, but that schedule is absent from the Ministry of Justice PDF reviewed, so no current
      fine or licence-ban duration is asserted here.[@traffic2024]
    sources:
      - traffic2024
  hemp:
    status: none
    text: >-
      No hemp regime was found: no THC threshold, licence, or fibre exemption was located, and the
      2019 outcry ended the only proposed legal grow. All forms, including CBD and hemp-derived
      items, count as illicit.[@rep19,fort19,zennjet]
    sources:
      - rep19
      - fort19
      - zennjet
  planting:
    seeds: illegal
    seeds_trade: banned
    clones: illegal
    clones_trade: banned
    text: >-
      No seed or cutting exception was found: planting for private use falls under the
      personal-use offence, with up to seven years' rigorous imprisonment.[@et525] Shashamane is
      known for growing cannabis, mostly for local use, with no exception in the law.[@leaf]
    sources:
      - et525
      - leaf
  black_market:
    text: >-
      Ethiopia sits on a transit route: a March 2026 customs operation seized narcotics both
      smuggled in through border towns and destined for neighbouring countries, alongside 17
      suspects and 10 vehicles.[@etcustoms26] With no legal supply, all domestic cannabis moves
      through this illegal market.[@et525]
    sources:
      - etcustoms26
      - et525
  arrests:
    text: >-
      In a single March 2026 surveillance week, joint customs and police operations arrested 17
      suspects moving contraband that included narcotics.[@etcustoms26] No account of how often
      ordinary users are arrested was found.
    sources:
      - etcustoms26
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited.[@et525,leaf]
    sources:
      - et525
      - leaf
