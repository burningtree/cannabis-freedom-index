name: Ethiopia
region: Africa
iso_numeric: 231
recreational: illegal
medical: none
updated: 2026-10-23
summary: >-
  Possession for personal use can bring up to seven years' rigorous imprisonment and a fine of up
  to 50,000 Birr. Supply with the intent to traffic starts at five years.
scores:
  possession: 1
  cultivation: 1
  enforcement: 1
  sharing: 1
  consumption: 1
  access: 0
segments:
  possession:
    text: >-
      Article 525(4) of the 2004 Criminal Code punishes planting, buying, receiving, making,
      possessing, selling or delivering a narcotic for private use by oneself or another, and
      unlawful use, with rigorous imprisonment of up to seven years and a fine of up to 50,000
      Birr. Those figures are the statutory ceilings.
    sources:
      - et525
      - et525wipo
    currency: ETB
    penalties:
      - label: Personal use (Article 525(4))
        treatment: criminal
        prison: 7 years
        fine: 50000
        note: Rigorous imprisonment up to seven years and fine up to 50,000 Birr; statutory ceilings
  cultivation:
    text: >-
      Growing for one's own use falls under the same ceiling of seven years. Growing with the
      intent to traffic is a different offence: rigorous imprisonment of not less than five years
      and a fine of up to 100,000 Birr. The aggravated trafficking cases start at ten years and a
      fine of up to 200,000 Birr. The article states those minimums and does not set a maximum
      term for them.
    sources:
      - et525
      - et525wipo
    currency: ETB
    penalties:
      - label: Growing for own use
        treatment: criminal
        prison: 7 years
        note: Same seven-year ceiling as personal use
      - label: Growing with intent to traffic
        treatment: criminal
        prison_min: 5 years
        fine: 100000
        note: At least five years and fine up to 100,000 Birr; no maximum term stated
      - label: Aggravated trafficking
        treatment: criminal
        prison_min: 10 years
        fine: 200000
        note: At least ten years and fine up to 200,000 Birr; no maximum term stated
  enforcement:
    text: >-
      The personal-use offence is rigorous imprisonment of up to seven years. Trafficking-intent
      offences start at five years, and the aggravated cases at ten. No account of how often
      ordinary users are jailed was found.
    sources:
      - et525
  sharing:
    text: >-
      Delivering or selling a narcotic for private use by another person is the personal-use
      offence, with up to seven years. Supply with the intent to traffic starts at five years, and
      the aggravated cases at ten.
    sources:
      - et525
      - et525wipo
    penalties:
      - label: Supply for another person's private use
        treatment: criminal
        prison: 7 years
        note: Personal-use offence ceiling
      - label: Supply with intent to traffic
        treatment: criminal
        prison_min: 5 years
        note: At least five years; no maximum term stated
      - label: Aggravated supply
        treatment: criminal
        prison_min: 10 years
        note: At least ten years; no maximum term stated
  consumption:
    text: >-
      Use is an offence. This applies equally in Shashamane, the Rastafari settlement, despite its
      reputation.
    sources:
      - leaf
  access:
    text: None.
    sources:
      - leaf
context:
  recreational:
    text: >-
      There is no legal way to get cannabis. Personal use can bring rigorous imprisonment of up
      to seven years and a fine of up to 50,000 Birr.[@et525] Rastafari who [settled at
      Shashamane in the 1960s](/history/ethiopia-shashamane-settlement-1965/) get no
      exception: use is an offence there too.[@leaf]
    sources:
      - et525
      - leaf
  culture:
    text: >-
      In the 1960s Rastafari from the Caribbean [settled on land set aside for them near
      Shashamane](/history/ethiopia-shashamane-settlement-1965/); the town became known for
      growing cannabis, mostly for local use, with no exception in the law.[@leaf]
    sources:
      - leaf
  production:
    status: none
    text: None.
    sources:
      - leaf
  medical:
    text: >-
      No medical cannabis. In March 2019 the health minister said growing cannabis for medical
      purposes had never been recognised or approved, and the Investment Commission said it
      would issue no permit to grow it, after a proposed farm in the Amhara region caused a
      public outcry.
    sources:
      - leaf
      - rep19
      - fort19
  consequences:
    text: >-
      The retained sources describe no consequence beyond the sentence itself: personal use
      brings rigorous imprisonment of up to seven years and a fine of up to 50,000 Birr, with
      no account found of how often ordinary users are jailed.[@et525]
    sources:
      - et525
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. Possession for personal use can bring
      rigorous imprisonment of up to seven years and a fine of up to 50,000 Birr.
    sources:
      - et525
  driving:
    status: consumption
    text: >-
      Article 75 of the 2024 Road Transport Traffic Control Regulation prohibits driving
      or attempting to drive under the influence of drugs or while taking them. It also
      covers medication or substances that may diminish physical or mental driving
      competence. The rule extends beyond a requirement to prove impaired control; it
      does not establish a numerical THC allowance. Drivers involved in a fatal crash
      may be required to take a drug test, with refusal treated as a positive result.
      Traffic controllers may hold a drug-influenced driver's vehicle for twelve hours
      unless another fit person drives it. Article 98 repealed Regulation 208/2011 as
      amended by 395/2017, while preserving compatible earlier directives. Article 95
      refers penalties to Schedule B, but that schedule is absent from the Ministry of
      Justice PDF reviewed; no current fine or fixed licence-ban duration is asserted
      here from the repealed regulation.
    sources:
      - traffic2024
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited.
    sources:
      - leaf
