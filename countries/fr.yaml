segments:
  possession:
    text: >-
      Using or possessing cannabis is a criminal offence punishable by up to one year in prison and
      a €3,750 fine. Since September 2020 police can instead issue a fixed fine on the spot for
      amounts under 50 g: €200, reduced to €150 if paid within 15 days and raised to €450 if late.
      Accepting it means the cannabis is destroyed and the offence is entered on the criminal
      record.
    sources:
      - cidj
  cultivation:
    text: >-
      Growing cannabis is treated as production of narcotics, a serious crime with sentences far
      above those for use, even for a few plants.
    sources:
      - cidj
  enforcement:
    text: >-
      Among Europe's strictest laws on paper, applied mainly as mass fixed fines — hundreds of
      thousands a year — concentrated in poorer neighbourhoods.
    sources:
      - cidj
  sharing:
    text: Giving cannabis to someone for their personal use is a specific offence with up to five years.
    sources:
      - cidj
  consumption:
    text: Use itself is the offence in French law, public or private.
    sources:
      - cidj
  access:
    text: >-
      No legal source. CBD flower under 0.3% THC has been lawful to sell since France's highest
      administrative court struck down a ban in December 2022.
    sources:
      - cx
context:
  production:
    text: >-
      Hemp cultivation is long established; medical cannabis production has awaited a permanent
      legal framework.
    sources:
      - hl
  products:
    text: CBD flower and products under 0.3% THC; medical preparations for trial patients only.
    sources:
      - cx
      - sp
  medical:
    text: >-
      A national experiment began in 2021 for a few thousand patients with severe conditions. It
      formally ended on 31 December 2024 with no permanent regime in place; existing patients were
      kept on treatment through extensions to 31 March 2026.
    sources:
      - hl
      - sp
  consequences:
    text: >-
      The fixed fine is recorded on the criminal record and in a national database for ten years.
      Roadside saliva tests penalise any trace of THC.
    sources:
      - cidj
