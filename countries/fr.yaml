name: France
region: Europe
iso_numeric: 250
recreational: illegal
medical: limited
updated: '2026-10-28'
summary: >-
  One of Europe's strictest laws alongside its highest use rates. Since 20 August 2026 ordinary
  illicit use can be ended by a fixed fine of €500, or €400 if paid within 15 days and €1,000 if the
  fine is increased. A medical experiment has run since 2021. CBD flower is legal.
scores:
  possession: 1
  cultivation: 1
  enforcement: 3
  sharing: 1
  consumption: 1
  access: 1
segments:
  possession:
    text: >-
      Ordinary illicit use of a drug scheduled as a narcotic is a criminal offence punishable by up
      to one year in prison and a €3,750 fine. Since 20 August 2026 the prosecution for that
      offence, including a repeat offence, can be ended by a fixed fine of €500, reduced to €400 if
      paid within 15 days and raised to €1,000 once the fine is increased. Article L3421-1 sets no
      gram amount for that fine. Accepting it means the cannabis is destroyed and the offence is
      entered on the criminal record.[@csp,loi2026,cidj] Use during or in connection with
      public-authority or public-service duties, or specified safety-sensitive transport duties,
      carries up to five years and €75,000. This aggravated offence is outside the ordinary-use
      fixed-fine procedure.[@sp_use,csp]
      [France made cannabis use punishable on the spot in 2020.](/history/france-fixed-fine-2020/)
      [France raised the on-the-spot fine to 500 euros in 2026.](/history/france-fixed-fine-2026/)
    sources:
      - csp
      - loi2026
      - cidj
      - sp_use
    currency: EUR
    penalties:
      - label: Ordinary illicit use
        treatment: criminal
        term: Possession
        prison: 1 year
        fine: 3750
        note: Prosecution can end in a fixed fine of €500 (€400 within 15 days, €1,000 if increased); no gram amount set
      - label: Use connected with public-authority duties or safety-sensitive transport
        treatment: criminal
        term: Possession
        prison: 5 years
        fine: 75000
  cultivation:
    text: >-
      Growing cannabis is treated as production of narcotics: the law treats cultivation as trafficking,
      punished with up to 20 years and EUR 7,500,000.[@cidj] Courts treat even a few plants as a production
      offence, though limited personal-use plots draw far lighter use-like sentences in practice —
      while still leaving a trafficking conviction on the record.[@cidj]
      [The 1970 law criminalised use and trafficking.](/history/france-use-criminalised-1970/)
    sources:
      - cidj
    currency: EUR
    penalties:
      - label: Growing cannabis (production of narcotics)
        treatment: criminal
        term: Cultivation
        prison: 20 years
        fine: 7500000
        note: Limited personal-use plots draw far lighter use-like sentences, but the conviction stays trafficking
  enforcement:
    text: >-
      Among Europe's strictest laws on paper, applied mainly as fixed fines of €500 — hundreds of
      thousands a year — concentrated in poorer neighbourhoods. The ordinary-use one-year prison
      maximum remains available.[@cidj,csp] Use during or in connection with public-authority or
      public-service duties, or specified safety-sensitive transport duties, carries up to five
      years and €75,000. This aggravated offence is outside the ordinary-use fixed-fine
      procedure.[@sp_use,csp]
    sources:
      - cidj
      - csp
      - sp_use
  sharing:
    text: >-
      Giving cannabis to someone for their personal use is a specific offence with up to five
      years and a €75,000 fine; the prison term rises to ten years when the recipient is a minor
      or the act happens in or near a school or educational setting.[@cidj,ofdt_legal]
      [France toughened trafficking sentences in 1987.](/history/france-trafficking-law-1987/)
    sources:
      - cidj
      - ofdt_legal
    currency: EUR
    penalties:
      - label: Supply for another person's personal use
        treatment: criminal
        term: Supply
        prison: 5 years
        fine: 75000
        note: Rises to ten years when sold to minors or in/near schools
  consumption:
    text: >-
      Ordinary illicit use is a criminal offence in public or private, with up to one year and
      €3,750; eligible ordinary-use cases can end through the €500 fixed-fine process.[@csp,sp_use]
      Use during or in connection with public-authority or public-service duties, or specified
      safety-sensitive transport duties, carries up to five years and €75,000. This aggravated
      offence is outside the ordinary-use fixed-fine procedure.[@sp_use,csp]
      [France let police settle cannabis use with a payment in 2014.](/history/france-transaction-penale-2014/)
    sources:
      - csp
      - sp_use
  access:
    text: >-
      Extremely restricted medical access survives for patients enrolled before 27 March 2024.[@sp]
      They may continue to receive prescriptions and pharmacy dispensing during the transition;
      no new patients can enter.[@sp] CBD flower under 0.3% THC is also lawful to sell.[@cx]
      [France started a medical cannabis experiment in 2021.](/history/france-medical-experiment-2021/)
      [France reauthorised cannabis medicines in 2013.](/history/france-medicines-decree-2013/)
    sources:
      - cx
      - sp
context:
  recreational:
    text: >-
      There is no legal recreational market. Ordinary illicit use is a criminal offence, but
      since August 2026 most cases end in a fixed fine — €500, €400 if paid within 15 days,
      €1,000 if increased — rather than court, and the law sets no gram amount for
      it.[@csp,loi2026,cidj] Use connected with public-authority duties or safety-sensitive
      transport is treated far more severely, up to five years and €75,000.[@sp_use]
      [France made cannabis use punishable on the spot in 2020.](/history/france-fixed-fine-2020/)
    sources:
      - csp
      - loi2026
      - cidj
      - sp_use
  production:
    status: medical
    text: >-
      Hemp cultivation is long established; medical cannabis production has awaited a permanent
      legal framework.[@hl]
      [France started a medical cannabis experiment in 2021.](/history/france-medical-experiment-2021/)
    sources:
      - hl
  hemp:
    status: standard
    text: >-
      Only certified seed of authorised Cannabis sativa varieties at or below 0.3% THC may be
      used, and only active farmers may cultivate hemp flowers and leaves; selling plants and
      taking cuttings are expressly prohibited.[@hemp_order] CBD flower and products under 0.3%
      THC are lawful to sell.[@cx]
      [France's top court allowed CBD flower sales in 2022.](/history/france-cbd-flower-2022/)
    sources:
      - hemp_order
      - cx
  medical:
    text: >-
      A national experiment began in 2021 for a few thousand patients with severe conditions.[@hl] It
      formally ended on 31 December 2024 with no permanent regime in place.[@hl,sp] Existing patients remain
      eligible for prescriptions and dispensing during a transitional extension lasting until three
      months after the forthcoming health-technology assessment is published.[@sp] A decree setting out
      how cannabis medicines will be assessed and reimbursed went to the Conseil d'État on 2 July
      2026; first prescriptions under a permanent regime are expected in 2027 at the earliest.[@chn]
      [France started a medical cannabis experiment in 2021.](/history/france-medical-experiment-2021/)
    sources:
      - hl
      - sp
      - chn
  consequences:
    text: >-
      Since 20 August 2026, a paid criminal fixed fine for cannabis use generally appears on
      bulletin no. 2 (B2) of the criminal record for three years from payment; the statute also
      specifies a starting point for increased unpaid fines.[@cpp775,cc2026] Only specified authorities,
      administrations and authorised employers can obtain B2 information, so employment or
      professional-licensing consequences are possible.[@cpp775] Judicial exclusion can be requested.[@cpp775,cc2026]
      Longer retention in other registers is separate: the cited guidance describes ten years in
      a national database.[@cidj] A court conviction under L3421-1 or L3421-6 may also bring up to
      three years' suspension of driving or powered-boat licences.[@loi2026]
      [France raised the on-the-spot fine to 500 euros in 2026.](/history/france-fixed-fine-2026/)
    sources:
      - cpp775
      - cc2026
      - cidj
      - loi2026
  planting:
    seeds: licensed
    seeds_trade: regulated
    clones: illegal
    clones_trade: banned
    text: >-
      Only certified seed of authorised Cannabis sativa varieties at or below 0.3% THC may be used,
      and only active farmers may cultivate hemp flowers and leaves.[@hemp_order] The sale of plants and taking
      cuttings are expressly prohibited, so psychoactive seed is not an adult-use route and clones
      cannot lawfully be supplied.[@hemp_order]
    sources:
      - hemp_order
  black_market:
    text: >-
      All cannabis sold in France is illegal, and it is the largest drug market by volume.[@ofdt25] A
      study for the national drug observatory OFDT estimated that 397 tonnes were consumed in
      mainland France in 2023, worth about 2.7 billion euros.[@ofdt25] The volume has been almost flat
      since 2017 (up 2.3%), in line with use.[@ofdt25] In value, cocaine overtook cannabis for the
      first time, at 3.1 billion euros; together the two make up nearly 90% of a drug market
      estimated at 6.8 billion euros.[@ofdt25]
    sources:
      - ofdt25
  clubs:
    status: underground
    text: >-
      Clubs have no legal footing and the one organised attempt was shut down by the courts.[@vice13]
      In March 2013 a federation of Cannabis Social Clubs registered itself with the
      prefecture in Tours as an act of open defiance, claiming about 150 clubs growing for
      their members' own use; only six declared themselves.[@tl13] Its spokesman was given a six-
      month suspended sentence and a 2,000 euro fine in April 2013 after 126 plants were found
      at his home, and in June 2013 the Tours court dissolved the federation as unlawful and
      contrary to good morals and barred its members from meeting.[@tl13,vice13] Other branches faced the
      same dissolution proceedings.[@vice13] No source read describes clubs operating openly since.
    sources:
      - tl13
      - vice13
  driving:
    status: zero
    text: >-
      Driving after using a narcotic is an offence whatever the amount; there is no threshold.[@onisr]
      Police screen heavily: the road-safety observatory counted about 1.2 million drug
      screenings in 2024, of which 11.1% were positive.[@onisr] Nine in ten were preventive checks or
      followed another traffic offence, and those were positive 11.7% of the time; of the
      55,886 screenings carried out after an injury or fatal crash, 6.2% were positive.[@onisr]
    sources:
      - onisr
  arrests:
    text: >-
      Use itself is a criminal offence and is policed on a large scale.[@onisr] The road-safety
      observatory's compilation of police data records 148,556 offences of drug use in 2024,
      almost three times as many as in 2017; the figure covers all narcotics, of which
      cannabis is by far the commonest.[@onisr]
      [France made cannabis use punishable on the spot in 2020.](/history/france-fixed-fine-2020/)
    sources:
      - onisr
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone.[@csp] Ordinary illicit use is a criminal offence
      punishable by up to one year in prison and a €3,750 fine.[@csp] Since 20 August 2026 the prosecution
      can be ended by a fixed fine of €500, or €400 if paid within 15 days and €1,000 if the fine is
      increased.[@csp,loi2026,cx] Use during or in connection with public-authority or
      public-service duties, or specified safety-sensitive transport duties, carries up to five
      years and €75,000.[@sp_use] This aggravated offence is outside the ordinary-use fixed-fine
      procedure.[@sp_use,csp]
      [France made cannabis use punishable on the spot in 2020.](/history/france-fixed-fine-2020/)
    sources:
      - csp
      - loi2026
      - cx
      - sp_use
  culture:
    text: >-
      Paris discovered hashish twice. In the 1840s the Club des Hashischins gathered writers and
      doctors around Jacques-Joseph Moreau's experiments with dawamesk, and Paris hospitals treated
      cholera with hashish tincture.[@moreau] A century later France banned cannabis as a medicine
      in 1953, removing it from the pharmacopoeia.[@goldenage]
      [Moreau published the first clinical study of hashish in 1845.](/history/france-moreau-du-hachisch-1845/)
      [Paris hospitals treated cholera with hashish tincture in 1848.](/history/france-hashish-cholera-treatment-1848/)
      [France banned cannabis as a medicine in 1953.](/history/france-medical-ban-1953/)
    sources:
      - moreau
      - goldenage
