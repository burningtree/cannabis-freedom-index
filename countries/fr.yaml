segments:
  possession:
    text: >-
      Using or possessing cannabis is a criminal offence punishable by up to one year in prison and
      a €3,750 fine. Since September 2020 police can instead issue a fixed fine on the spot for
      amounts under 50 g: €200, reduced to €150 if paid within 15 days and raised to €450 if late.
      Accepting it means the cannabis is destroyed and the offence is entered on the criminal
      record.
    sources:
      - cidj
  cultivation:
    text: >-
      Growing cannabis is treated as production of narcotics, a serious crime with sentences far
      above those for use, even for a few plants.
    sources:
      - cidj
  enforcement:
    text: >-
      Among Europe's strictest laws on paper, applied mainly as mass fixed fines — hundreds of
      thousands a year — concentrated in poorer neighbourhoods.
    sources:
      - cidj
  sharing:
    text: Giving cannabis to someone for their personal use is a specific offence with up to five years.
    sources:
      - cidj
  consumption:
    text: Use itself is the offence in French law, public or private.
    sources:
      - cidj
  access:
    text: >-
      No legal source. CBD flower under 0.3% THC has been lawful to sell since France's highest
      administrative court struck down a ban in December 2022.
    sources:
      - cx
context:
  production:
    text: >-
      Hemp cultivation is long established; medical cannabis production has awaited a permanent
      legal framework.
    sources:
      - hl
  products:
    text: CBD flower and products under 0.3% THC; medical preparations for trial patients only.
    sources:
      - cx
      - sp
  medical:
    text: >-
      A national experiment began in 2021 for a few thousand patients with severe conditions. It
      formally ended on 31 December 2024 with no permanent regime in place; existing patients were
      kept on treatment through extensions, the latest to 31 December 2026. A decree setting out how
      cannabis medicines will be assessed and reimbursed went to the Conseil d'État on 2 July 2026;
      first prescriptions under a permanent regime are expected in 2027 at the earliest.
    sources:
      - hl
      - sp
      - chn
  consequences:
    text: >-
      The fixed fine is recorded on the criminal record and in a national database for ten years.
      Roadside saliva tests penalise any trace of THC.
    sources:
      - cidj
  planting:
    seeds: licensed
    seeds_trade: regulated
    clones: illegal
    clones_trade: banned
    text: >-
      Only certified seed of authorised Cannabis sativa varieties at or below 0.3% THC may be used,
      and only active farmers may cultivate hemp flowers and leaves. The sale of plants and taking
      cuttings are expressly prohibited, so psychoactive seed is not an adult-use route and clones
      cannot lawfully be supplied.
    sources:
      - hemp_order
  black_market:
    text: >-
      All cannabis sold in France is illegal, and it is the largest drug market by volume. A
      study for the national drug observatory OFDT estimated that 397 tonnes were consumed in
      mainland France in 2023, worth about 2.7 billion euros. The volume has been almost flat
      since 2017 (up 2.3%), in line with use. In value, cocaine overtook cannabis for the
      first time, at 3.1 billion euros; together the two make up nearly 90% of a drug market
      estimated at 6.8 billion euros.
    sources:
      - ofdt25
  clubs:
    status: underground
    text: >-
      Clubs have no legal footing and the one organised attempt was shut down by the courts.
      In March 2013 a federation of Cannabis Social Clubs registered itself with the
      prefecture in Tours as an act of open defiance, claiming about 150 clubs growing for
      their members' own use; only six declared themselves. Its spokesman was given a six-
      month suspended sentence and a 2,000 euro fine in April 2013 after 126 plants were found
      at his home, and in June 2013 the Tours court dissolved the federation as unlawful and
      contrary to good morals and barred its members from meeting. Other branches faced the
      same dissolution proceedings. No source read describes clubs operating openly since.
    sources:
      - tl13
      - vice13
  driving:
    status: zero
    text: >-
      Driving after using a narcotic is an offence whatever the amount; there is no threshold.
      Police screen heavily: the road-safety observatory counted about 1.2 million drug
      screenings in 2024, of which 11.1% were positive. Nine in ten were preventive checks or
      followed another traffic offence, and those were positive 11.7% of the time; of the
      55,886 screenings carried out after an injury or fatal crash, 6.2% were positive.
    sources:
      - onisr
  arrests:
    text: >-
      Use itself is a criminal offence and is policed on a large scale. The road-safety
      observatory's compilation of police data records 148,556 offences of drug use in 2024,
      almost three times as many as in 2017; the figure covers all narcotics, of which
      cannabis is by far the commonest.
    sources:
      - onisr
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. British travel advice says illegal
      drugs, including cannabis, carry severe penalties, including imprisonment and heavy
      fines, for possessing, using or smuggling them, also when transiting through airports,
      ports and Eurostar stations, whose scanners are used on transit baggage too.
    sources:
      - cx
      - fcdo
