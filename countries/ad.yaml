segments:
  possession:
    text: >-
      Possessing cannabis for one's own use is a minor offence (contravenció penal) under
      article 499 of the Criminal Code, punished with arrest and a fine of €500 to
      €1,200.[@criminalcurrent] For minor offences arrest means at most eight weekends, a month
      of house arrest or two months of partial daily arrest. In practice small amounts usually
      bring a fine or a conditional sentence, often for people stopped at the border with Spain
      or France.[@cann] The new Criminal Code passed in July 2026 keeps the same rule, as
      article 545.[@criminaldeferred2026]
    sources:
      - criminalcurrent
      - criminaldeferred2026
      - cann
    currency: EUR
    penalties:
      - label: Possession for own use (minor offence)
        treatment: criminal
        fine: 1200
        note: Fine €500–1,200; arrest at most eight weekends, a month of house arrest or two months of partial daily arrest
  cultivation:
    text: >-
      Growing cannabis for one's own use falls under the same minor offence as possession:
      arrest and a fine of €500 to €1,200.[@criminalcurrent] Growing to supply others is drug
      trafficking.[@cann]
    sources:
      - criminalcurrent
      - cann
    currency: EUR
    penalties:
      - label: Growing for own use (minor offence)
        treatment: criminal
        fine: 1200
        note: Same €500–1,200 fine and arrest forms as possession
  enforcement:
    text: Fines and conditional sentences are the norm for small amounts; prison is available.
    sources:
      - alto
  sharing:
    text: >-
      Supply is a crime; a 2025 case brought an 18-month conditional sentence for sharing a joint
      with a minor.
    sources:
      - alto
  consumption:
    text: >-
      Using cannabis is punished like possession for one's own use, with arrest and a fine of
      €500 to €1,200. Using it in a public place, or together with other people, brings arrest
      and €600 to €1,500 under article 500.
    sources:
      - criminalcurrent
  access:
    text: No legal source.
    sources:
      - cann
context:
  production:
    text: No licensed production.
    sources:
      - cann
  products:
    text: No legal THC products.
    sources:
      - cann
  medical:
    text: No medical cannabis programme; a government-backed study of a possible model began in 2021.
    sources:
      - cann
  consequences:
    text: The retained sources do not establish collateral consequences beyond the penalties described above.
    sources: []
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited.
    sources:
      - cann
      - alto
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. Bringing cannabis into the
      country for one's own use is part of the same minor offence as possession, punished with
      arrest and a fine of €500 to €1,200.
    sources:
      - cann
      - criminalcurrent
  driving:
    status: zero
    text: >-
      Traffic Code article 112(k) treats driving with drugs or analogous substances
      in the body as a very serious administrative offence when it is not a criminal
      offence: EUR201–400 and up to two months' licence suspension under article 115.
      Article 82 provides authorised saliva screening and a right to a confirmatory
      blood or saliva test. Criminal Code article 268 separately covers drug influence:
      ordinary driving can bring up to one year's imprisonment or arrest, up to three
      years' driving deprivation/prohibition and EUR300–3,000. Certain passenger or
      heavy transport has higher maxima. Article 269 penalises refusing a lawful test
      and also declining blood analysis; its ordinary fine starts at EUR600. The July
      2026 procedural amendment requires police licence retention and judicial review
      within ten days. The new July 2026 Criminal Code has a four-month publication
      delay and is not yet operative on 12 October: its renumbered article 300 adds
      blood/saliva evidence of consumption and removes the arrest alternative. No
      numerical THC allowance or general medical-use exception was verified.
    sources:
      - trafficcode
      - criminalcurrent
      - licenceretention2026
      - criminaldeferred2026
  black_market:
    text: >-
      Figures reported by the government to the UN drugs office record 2.5 kg of herbal
      cannabis seized in 2024, against 3.5 kg in 2023, and 2.9 kg of cannabis resin seized
      in 2024, against 5.9 kg in 2023. The UN publishes them as kilogram equivalents, and
      countries count seizures differently, so the figures are not comparable across
      borders.
    sources:
      - unodc_szr
