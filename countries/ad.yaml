segments:
  possession:
    text: >-
      Possession of any amount is a criminal offence under the Penal Code, punishable by up to 12
      months in prison and a €1,200 fine. In practice small amounts usually bring a fine or a
      conditional sentence — often for people stopped at the border with Spain or France.
    sources:
      - cr
      - cann
  cultivation:
    text: Cultivation is treated as trafficking.
    sources:
      - cann
  enforcement:
    text: Fines and conditional sentences are the norm for small amounts; prison is available.
    sources:
      - cr
      - alto
  sharing:
    text: >-
      Supply is a crime; a 2025 case brought an 18-month conditional sentence for sharing a joint
      with a minor.
    sources:
      - alto
  consumption:
    text: >-
      Public consumption is punished more heavily than possession, with up to two years and an
      €1,800 fine.
    sources:
      - cr
  access:
    text: No legal source.
    sources:
      - cann
context:
  production:
    text: No licensed production.
    sources:
      - cann
  products:
    text: No legal THC products.
    sources:
      - cann
  medical:
    text: No medical cannabis programme; a government-backed study of a possible model began in 2021.
    sources:
      - cann
  consequences:
    text: A conviction is a criminal record; foreigners can be expelled.
    sources:
      - cr
