segments:
  possession:
    text: >-
      Possession of any amount is a criminal offence under the Penal Code, punishable by up to 12
      months in prison and a €1,200 fine. In practice small amounts usually bring a fine or a
      conditional sentence — often for people stopped at the border with Spain or France.
    sources:
      - cann
  cultivation:
    text: Cultivation is treated as trafficking.
    sources:
      - cann
  enforcement:
    text: Fines and conditional sentences are the norm for small amounts; prison is available.
    sources:
      - alto
  sharing:
    text: >-
      Supply is a crime; a 2025 case brought an 18-month conditional sentence for sharing a joint
      with a minor.
    sources:
      - alto
  consumption:
    text: >-
      British travel advice says Andorra has a zero-tolerance policy on the possession and use of
      illegal drugs, and that even the smallest amount can bring refusal of entry, expulsion, fines
      and prison sentences.
    sources:
      - fcdo
  access:
    text: No legal source.
    sources:
      - cann
context:
