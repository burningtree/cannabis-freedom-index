  consequences:
    text: The retained sources do not establish collateral consequences beyond the penalties described above.
    sources: []
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited.
    sources:
      - cann
      - alto
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. British travel advice describes a
      zero-tolerance policy on possession and use: even the smallest amount can bring refusal
      of entry, expulsion from the country, a fine or a prison sentence.
    sources:
      - cann
      - fcdo
  driving:
    status: zero
    text: >-
      Traffic Code article 112(k) treats driving with drugs or analogous substances
      in the body as a very serious administrative offence when it is not a criminal
      offence: EUR201–400 and up to two months' licence suspension under article 115.
      Article 82 provides authorised saliva screening and a right to a confirmatory
      blood or saliva test. Criminal Code article 268 separately covers drug influence:
      ordinary driving can bring up to one year's imprisonment or arrest, up to three
      years' driving deprivation/prohibition and EUR300–3,000. Certain passenger or
      heavy transport has higher maxima. Article 269 penalises refusing a lawful test
      and also declining blood analysis; its ordinary fine starts at EUR600. The July
      2026 procedural amendment requires police licence retention and judicial review
      within ten days. The new July 2026 Criminal Code has a four-month publication
      delay and is not yet operative on 12 October: its renumbered article 300 adds
      blood/saliva evidence of consumption and removes the arrest alternative. No
      numerical THC allowance or general medical-use exception was verified.
    sources:
      - trafficcode
      - criminalcurrent
      - licenceretention2026
      - criminaldeferred2026
  black_market:
    text: >-
      Figures reported by the government to the UN drugs office record 2.5 kg of herbal
      cannabis seized in 2024, against 3.5 kg in 2023, and 2.9 kg of cannabis resin seized
      in 2024, against 5.9 kg in 2023. The UN publishes them as kilogram equivalents, and
      countries count seizures differently, so the figures are not comparable across
      borders.
    sources:
      - unodc_szr
