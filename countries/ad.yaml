name: Andorra
region: Europe
iso_numeric: 20
recreational: illegal
medical: none
updated: '2026-10-28'
summary: >-
  Possessing or growing cannabis for personal use is a minor offence under the Criminal Code,
  punished with a short arrest and a fine of €500–1,200. No medical programme.
scores:
  possession: 1
  cultivation: 1
  enforcement: 2
  sharing: 1
  consumption: 1
  access: 0
segments:
  possession:
    text: >-
      Possessing or importing cannabis for personal use is a criminal minor offence: arrest and a
      €500–1,200 fine.[@criminalcurrent] Arrest can mean weekend detention, house arrest or partial
      daily detention.[@criminalcurrent] The [replacement code passed in July
      2026](/history/andorra-new-criminal-code-2026/) keeps the same personal-use rule but has a
      four-month publication delay.[@criminaldeferred2026]
    sources:
      - criminalcurrent
      - criminaldeferred2026
    currency: EUR
    penalties:
      - label: Possession or import for own use
        treatment: criminal
        term: Contravenció penal
        fine_min: 500
        fine: 1200
        note: Arrest also applies; its weekend, home or partial-daily forms depend on the sentence
  cultivation:
    text: >-
      Growing for personal use carries arrest and a €500–1,200 fine; production for supply falls
      under the trafficking provisions.[@criminalcurrent]
    sources:
      - criminalcurrent
    currency: EUR
    penalties:
      - label: Growing for own use
        treatment: criminal
        term: Contravenció penal
        fine_min: 500
        fine: 1200
        note: Arrest also applies; its weekend, home or partial-daily forms depend on the sentence
  enforcement:
    text: >-
      The [2025 CBD flower appeal](/history/andorra-cbd-ruling-2025/) shows how serious a border
      case can become: the final sentence included twelve months of immediate imprisonment and five
      years’ expulsion for a resident convicted of large-quantity trafficking.[@cbdjudgment]
    sources:
      - cbdjudgment
  sharing:
    text: >-
      Giving cannabis to one other person to use together carries arrest and a €600–1,500
      fine.[@criminalcurrent] Supplying a small quantity to an adult carries up to one year in
      prison or arrest and €500–1,000; ordinary cannabis trafficking carries up to two years and a
      fine up to twice the drug’s value.[@criminalcurrent] Aggravated trafficking carries three to
      six years, rising to six to twelve for specified large-scale organised or multiply aggravated
      cases.[@criminalcurrent]
    sources:
      - criminalcurrent
    currency: EUR
    penalties:
      - label: Joint use with one other person
        treatment: criminal
        term: Cessió per al consum conjunt
        fine_min: 600
        fine: 1500
        note: Arrest also applies
      - label: Small quantity supplied to an adult
        treatment: criminal
        term: Tipus privilegiat
        prison: 1 year
        fine_min: 500
        fine: 1000
        note: Arrest may replace prison
      - label: Ordinary cannabis trafficking
        treatment: criminal
        term: Tipus bàsic
        prison: 2 years
        note: Also a value-based fine
      - label: Aggravated cannabis trafficking
        treatment: criminal
        term: Tipus qualificat
        prison_min: 3 years
        prison: 6 years
        note: Also a value-based fine
      - label: Specified aggravated large-scale trafficking
        treatment: criminal
        term: Tipus qualificat
        prison_min: 6 years
        prison: 12 years
        note: Also a value-based fine
  consumption:
    text: >-
      Individual use carries arrest and €500–1,200; public or group use carries arrest and
      €600–1,500.[@criminalcurrent]
    sources:
      - criminalcurrent
    currency: EUR
    penalties:
      - label: Individual use
        treatment: criminal
        term: Consum individual
        fine_min: 500
        fine: 1200
        note: Arrest also applies
      - label: Public or group use
        treatment: criminal
        term: Consum en local públic o en grup
        fine_min: 600
        fine: 1500
        note: Arrest also applies
  access:
    text: >-
      Cannabis flower containing THC has no lawful retail route, including flower sold as CBD; the
      Constitutional Court upheld that interpretation in July 2025.[@cbdjudgment]
    sources:
      - cbdjudgment
context:
  arrests:
    text: >-
      Police reported 957 people detained for all offences in 2024, 6% fewer than in
      2023.[@police2024] Detentions for drug consumption, possession or trafficking rose
      15%.[@police2024] The report combines drug types and does not provide a cannabis-only
      detention total, so these figures cannot be read as the number arrested for
      cannabis.[@police2024]
    sources:
      - police2024
  production:
    text: >-
      A commercial medicinal crop was still a government plan in September 2026.[@cultivation2026]
      The proposal envisaged one licence and indoor cultivation, with a separate cannabis bill still
      to be brought to parliament.[@cultivation2026] Farmers’ collective representation was part of
      the accompanying agriculture reform.[@cultivation2026]
    sources:
      - cultivation2026
    status: none
  medical:
    text: >-
      A claimed therapeutic purpose did not protect the resident convicted in the CBD flower case:
      the court recorded that no doctor had prescribed cannabis to him.[@cbdjudgment] The [2026
      cultivation plan](/history/andorra-medicinal-cultivation-plan-2026/) concerned future
      medicinal production.[@cultivation2026] The report described a cannabis bill still to come,
      leaving patients without a verified domestic dispensing programme.[@cultivation2026]
    sources:
      - cbdjudgment
      - cultivation2026
  consequences:
    text: >-
      A resident’s cannabis conviction can affect where they may live: the [CBD flower
      case](/history/andorra-cbd-ruling-2025/) ended with five years’ expulsion.[@cbdjudgment] The
      appellant said it had cost him his work and home in Andorra, where his partner
      lived.[@cbdjudgment] The Constitutional Court dismissed his appeal and ordered him to pay the
      constitutional proceedings’ costs.[@cbdjudgment]
    sources:
      - cbdjudgment
  clubs:
    text: >-
      Cannabis sharing has no club exception in the Criminal Code: supplying another person is
      punishable, and even joint use by two people carries arrest and a fine.[@criminalcurrent]
    sources:
      - criminalcurrent
    status: none
  visitors:
    text: >-
      Visitors have no legal recreational supply, and bringing cannabis across the border for
      personal use is punishable under the same rule as possession.[@criminalcurrent] Low THC
      content did not prevent a trafficking conviction in the CBD flower case.[@cbdjudgment] That
      resident’s final sentence also included five years’ expulsion.[@cbdjudgment]
    sources:
      - criminalcurrent
      - cbdjudgment
    status: none
  driving:
    status: zero
    text: >-
      Driving with drugs in the body is a very serious administrative offence under Traffic Code
      article 112(k), carrying €201–400 and up to two months’ licence suspension when it is not a
      crime.[@trafficcode] Criminal Code article 268 separately punishes driving under drug
      influence with up to a year in prison or arrest, a €300–3,000 fine and up to three years’
      driving deprivation or prohibition.[@criminalcurrent] Police may use saliva screening and
      drivers have a right to a confirmatory blood or saliva test.[@trafficcode] A July 2026
      amendment requires police retention of the licence and judicial review within ten
      days.[@licenceretention2026] The replacement Criminal Code has a four-month publication delay
      and is still pending on 28 October 2026.[@criminaldeferred2026]
    sources:
      - trafficcode
      - criminalcurrent
      - licenceretention2026
      - criminaldeferred2026
  black_market:
    text: >-
      Figures reported by the government to the UN drugs office record 2.5 kg of herbal cannabis
      seized in 2024, against 3.5 kg in 2023, and 2.9 kg of cannabis resin seized in 2024, against
      5.9 kg in 2023. The UN publishes them as kilogram equivalents, and countries count seizures
      differently, so the figures are not comparable across borders.[@unodc_szr]
    sources:
      - unodc_szr
  recreational:
    text: >-
      Adults have no lawful cannabis shops or home-growing allowance: possession, cultivation and
      import for personal use remain criminal offences.[@criminalcurrent] Smoking together is
      separately punishable, including sharing with one other person.[@criminalcurrent] These
      mandatory fines followed the [2020 penalty increase](/history/andorra-cannabis-fines-raised-2020/).[@criminalcurrent] The [July
      2025 CBD ruling](/history/andorra-cbd-ruling-2025/) also covers low-THC flower sold as
      CBD.[@cbdjudgment]
    sources:
      - criminalcurrent
      - cbdjudgment
  hemp:
    text: >-
      Flower sold as hemp or CBD can lead to prosecution when it contains THC.[@cbdjudgment]
      Parliament [rejected a CBD products bill in July
      2024](/history/andorra-rejects-cbd-bill-2024/).[@cbdvote] The government’s September 2026
      cultivation plan concerns an indoor medicinal crop, while outdoor hemp remains a possible
      future development.[@cultivation2026]
    sources:
      - cbdjudgment
      - cbdvote
      - cultivation2026
    status: none
  culture:
    text: >-
      The word [CBD](/culture/language/cbd/) became the centre of a public dispute when flower sold
      under that name led to imprisonment.[@cbdjudgment] Parliament rejected a bill to regulate CBD
      products in July 2024.[@cbdvote] The constitutional appeal the following year exposed the gap
      between buyers’ understanding of the product and its treatment under Andorran criminal
      law.[@cbdjudgment]
    sources:
      - cbdjudgment
      - cbdvote
