segments:
  possession:
    text: >-
      Unauthorised possession or acquisition of a plant or substance scheduled as a narcotic is
      punishable by two to ten years and a fine of CFA 250,000 to 50 million under Penal Code
      Article 208.
    sources:
      - penal
  cultivation:
    text: >-
      Unauthorised cultivation of a plant scheduled as a narcotic is covered by the same two-to-ten
      year offence.
    sources:
      - penal
  enforcement:
    text: >-
      Arrests of dealers are reported almost weekly in the local press; police statistics cite very
      large seizures in 2019–2020.
    sources:
      - gmt2
      - gmt1
  sharing:
    text: >-
      Offering, transferring or selling a scheduled narcotic is punishable by two to ten years.
      Facilitating another person's use, whether free or for payment, carries two to five years.
    sources:
      - penal
  consumption:
    text: >-
      Illicit use carries two months to one year and a fine. A court may instead order medical
      supervision or treatment where the person needs it.
    sources:
      - penal
  access:
    text: None.
    sources:
