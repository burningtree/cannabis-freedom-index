segments:
  possession:
    text: >-
      Growing, selling and possessing cannabis ('chanvre indien') is illegal under the Penal Code.
      The sources found report only trafficking cases; no reliable figure for simple personal
      possession was found.
    sources:
      - gmt1
  cultivation:
    text: >-
      Cultivation is a crime; northern Gabon near the Cameroon border is described as the centre of
      the trade.
    sources:
      - gmt1
  enforcement:
    text: >-
      Arrests of dealers are reported almost weekly in the local press; police statistics cite very
      large seizures in 2019–2020.
    sources:
      - gmt2
      - gmt1
  sharing:
    text: >-
      Importing or trafficking narcotics carries up to twenty years and a fine of five times the
      value of the seizure under Article 408.
