name: Gabon
region: Africa
iso_numeric: 266
recreational: illegal
medical: none
updated: 2026-10-21
summary: >-
  Cannabis is prohibited. The 2020 Penal Code separates illicit use, carrying up to one year
  and a fine, from general possession and direct supply, which carry longer prison terms.
scores:
  possession: 1
  cultivation: 1
  enforcement: 1
  sharing: 1
  consumption: 1
  access: 0
segments:
  possession:
    text: >-
      Outside separately specified trafficking offences, Article 208 of the 2020 code sets ten
      years in prison and a fine of up to 100 million CFA francs for illicit transport, possession,
      offering, transfer or acquisition of narcotics. Cannabis and its derivatives are expressly
      included. This differs from the separate, shorter offence of use.
    sources: [code20]
  cultivation:
    text: >-
      The 2020 code punishes organising illicit drug production or manufacture with twenty years
      and a fine of up to 50 million CFA francs, rising to thirty years for an organised group.
      Its drug clauses do not define a separate penalty tier for a small personal crop.
    sources: [code20]
  enforcement:
    text: >-
      In May 2026, Libreville prosecutors destroyed three truckloads of seized drugs, including
      cannabis, in the presence of the justice minister. The ministry said the aim was to prevent
      seized drugs returning to sale. Courts may order medical supervision or detoxification and
      withhold the use penalty; evading the order carries up to three years and a fine.
    sources: [justice26, code20]
  sharing:
    text: >-
      Giving or offering narcotics directly for another person's consumption carries up to five
      years and a fine of up to 10 million CFA francs. Helping another person obtain or use drugs,
      whether free or for payment, has the same maximums. The general possession and supply
      clause and organised-trafficking offences carry longer terms.
    sources: [code20]
  consumption:
    text: >-
      Illicit use carries up to one year and a fine of up to 1.5 million CFA francs. If the person
      needs medical treatment, a court can order supervision or detoxification in a public or
      private centre and withhold that punishment. Evading treatment carries up to three years
      and a fine of up to two million francs.
    sources: [code20]
  access:
    text: >-
      Recreational supply is prohibited. The 2026 Health Code limits specially authorised
      controlled-drug activities to medical and scientific purposes and requires special
      prescriptions for authorised narcotics.
    sources: [code20, health26]
context:
  production:
    text: >-
      The Health Code requires renewable special authorisation for controlled-drug production
      and other specified activities, exclusively for medical and scientific purposes. Conditions
      are to be set by regulation. Organising illicit production remains a serious criminal offence.
    sources: [health26, code20]
  products:
    text: The retained sources do not identify cannabis products available through a lawful patient supply programme.
    sources: []
  medical:
    text: >-
      The 2026 Health Code provides for specially authorised medical and scientific activities
      involving controlled drugs and for special narcotic prescriptions. The retained sources do
      not establish an operating medical cannabis programme.
    sources: [health26]
  consequences:
    text: >-
      Courts must order confiscation and destruction of drugs seized under the relevant drug
      provisions. Additional penalties can include restrictions on civic rights, residence or
      professional activity, withdrawal of a passport and closure of premises used in an offence.
    sources: [code20]
  planting:
    seeds: grey
    seeds_trade: unclear
    clones: illegal
    clones_trade: banned
    text: >-
      The code's drug provisions expressly cover cannabis and its derivatives and punish organising
      illicit production. They do not specify a personal plant allowance or separately settle
      possession and trade in ungerminated seeds.
    sources: [code20]
  clubs:
    status: none
    text: >-
      No cannabis clubs are known. Supplying drugs to another person remains criminal, including
      direct gifts for that person's consumption.
    sources: [code20]
  visitors:
    status: none
    text: >-
      Visitors have no lawful recreational supply route. The 2020 code expressly covers cannabis;
      possession and use have separate criminal penalties.
    sources: [code20]
  black_market:
    text: >-
      Cannabis is the drug Gabon's police intercept most. The commander of the National
      Police Forces reported in January 2026 that seizures rose from 433 kg in 2024 to 975
      kg in 2025, and that the anti-drug office OCLAD took part in operations accounting
      for nearly a tonne. He presented the increase as a sign of growing use and
      trafficking.
    sources: [gmt26]
