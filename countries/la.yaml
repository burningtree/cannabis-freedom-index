segments:
  possession:
    text: >-
      The 2007 Law on Narcotics and the 2017 Penal Code prohibit possession of cannabis. Penalties
      across cannabis offences range from three months to life imprisonment plus fines, depending on
      quantity and activity. In tourist towns cannabis is offered fairly openly, and visitors caught
      are more often made to pay on the spot than prosecuted.
    sources:
      - cms
  cultivation:
    text: Cultivation is prohibited; the cannabis plant is listed as a narcotic-producing plant.
    sources:
      - cms
  enforcement:
    text: >-
      Harsh on paper and arbitrary in practice: informal payments for tourists, prison for locals
      and for larger amounts.
    sources:
      - cms
  sharing:
    text: Trafficking carries the heaviest sentences.
    sources:
      - cms
  consumption:
    text: Use of narcotics is prohibited and can lead to compulsory treatment.
    sources:
      - cms
  access:
    text: No legal source for THC cannabis.
    sources:
      - cms
context:
  production:
    text: >-
      A December 2022 Ministry of Health decision allows regulated cultivation, processing and trade
      of hemp for medicines and products. The narcotics law and Penal Code were not amended to
      match, leaving the legal position unclear.
    sources:
      - cl
      - cms
  products:
    text: Hemp-based products under the 2022 decision, some requiring prescription.
    sources:
      - cl
  medical:
    text: Limited to hemp-derived medicines under the 2022 decision.
    sources:
      - cl
  consequences:
    text: Compulsory treatment centres are used for local drug users.
    sources:
      - cms
