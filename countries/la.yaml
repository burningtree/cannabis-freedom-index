name: Laos
region: Asia
iso_numeric: 418
recreational: illegal
medical: limited
updated: 2026-10-13
summary: Illegal but widely available in tourist areas; limited medical and hemp use has been authorised.
scores:
  possession: 1
  cultivation: 1
  enforcement: 2
  sharing: 1
  consumption: 2
  access: 0
segments:
  possession:
    text: >-
      The 2007 Law on Narcotics and the 2017 Penal Code prohibit possession of cannabis. Penalties
      across cannabis offences range from three months to life imprisonment plus fines, depending on
      quantity and activity. In tourist towns cannabis is offered fairly openly, and visitors caught
      are more often made to pay on the spot than prosecuted.
    sources:
      - cms
  cultivation:
    text: Cultivation is prohibited; the cannabis plant is listed as a narcotic-producing plant.
    sources:
      - cms
  enforcement:
    text: >-
      Harsh on paper and arbitrary in practice: informal payments for tourists, prison for locals
      and for larger amounts.
    sources:
      - cms
  sharing:
    text: >-
      Cannabis trafficking carries prison terms that rise with quantity. Capital provisions in the
      reviewed drug law apply to specified drugs such as heroin, not marijuana.
    sources:
      - lao_law
  consumption:
    text: Use of narcotics is prohibited and can lead to compulsory treatment.
    sources:
      - cms
  access:
    text: No legal source for THC cannabis.
    sources:
      - cms
context:
  production:
    text: >-
      A December 2022 Ministry of Health decision allows regulated cultivation, processing and trade
      of hemp for medicines and products. The narcotics law and Penal Code were not amended to
      match, leaving the legal position unclear.
    sources:
      - cl
      - cms
  products:
    text: Hemp-based products under the 2022 decision, some requiring prescription.
    sources:
      - cl
  medical:
    text: Limited to hemp-derived medicines under the 2022 decision.
    sources:
      - cl
  consequences:
    text: Compulsory treatment centres are used for local drug users.
    sources:
      - cms
  planting:
    seeds: licensed
    seeds_trade: regulated
    clones: licensed
    clones_trade: regulated
    text: >-
      A health ministry decision of December 2022 lets approved companies cultivate, process,
      import and export hemp, and requires the seeds used for cultivation to be registered.
      The Law on Narcotics and the Penal Code still prohibit producing, trading and using
      every other kind of cannabis, and acting without approval can be prosecuted under them.
    sources:
      - cmsg
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited.
    sources:
      - cms
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. The 2007 Law on Narcotics and the 2017
      Penal Code prohibit possession of cannabis, with penalties across cannabis offences from
      three months to life imprisonment plus fines, depending on quantity and activity.
    sources:
      - cms
  arrests:
    text: >-
      The public security minister told the National Assembly in November 2024 that the
      authorities had resolved 3,395 drug cases and arrested 5,168 suspects over the past
      eleven months, 199 of them foreigners. Seizures included 3,583 kg of marijuana,
      beside 81 million methamphetamine pills and 4,816 kg of crystal methamphetamine. The
      figures are not broken down by drug.
    sources:
      - kpl24
  black_market:
    text: >-
      Figures reported by the government to the UN drugs office record 3,274 kg of herbal
      cannabis seized in 2024, against 1,045 kg in 2023. The UN publishes them as kilogram
      equivalents, and countries count seizures differently, so the figures are not
      comparable across borders.
    sources:
      - unodc_szr
