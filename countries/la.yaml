name: Laos
region: Asia
iso_numeric: 418
recreational: illegal
medical: limited
updated: '2026-10-23'
summary: >-
  Cannabis possession can lead to treatment or prison; licensed low-THC hemp medicines are
  permitted.
scores:
  possession: 1
  cultivation: 1
  enforcement: 2
  sharing: 1
  consumption: 2
  access: 0
segments:
  possession:
    text: >-
      Possessing under five grams of cannabis for consumption leads to treatment under the Penal
      Code. Five to ten grams of dried cannabis for consumption carries six months to two years in
      prison and a fine of five to twenty million kip.[@penal]
    sources:
      - penal
  cultivation:
    text: >-
      Ordinary cannabis cultivation is prohibited under the narcotics rules.[@outlook] Approved
      companies may grow low-THC hemp under the health ministry’s licensing rules.[@jetro]
    sources:
      - outlook
      - jetro
  enforcement:
    text: >-
      The Penal Code provides treatment for the smallest personal quantities and prison for five to
      ten grams of dried cannabis.[@penal] A November 2024 government report recorded 5,168 suspects
      arrested across all drugs over eleven months, including 199 foreigners.[@kpl24]
    sources:
      - penal
      - kpl24
  sharing:
    text: >-
      Trading less than five kilograms of dried cannabis carries six months to three years in
      prison; five to ten kilograms carries three to seven years. Regular or organised trading, or
      more than ten kilograms, carries five to ten years. THC, hashish and derivatives have separate
      weight bands, reaching life imprisonment above 500 grams.[@penal]
    sources:
      - penal
  consumption:
    text: >-
      Consumption or possession for consumption of under five grams of cannabis leads to treatment.
      Addiction recurring after certified treatment brings escalating sanctions: public criticism
      and a fine after the first treatment, then possible prison after later treatments.[@penal]
    sources:
      - penal
  access:
    text: >-
      Health ministry rules permit prescribed low-THC hemp flower and medicines through approved
      businesses.[@hemp] Ordinary cannabis trading remains punishable under the Penal Code.[@penal]
    sources:
      - hemp
      - penal
context:
  production:
    text: >-
      Rules issued in December 2022 permit licensed hemp cultivation, processing and trade, with
      registered seeds and qualified technical staff.[@jetro]
    sources:
      - jetro
  products:
    text: >-
      The hemp rules distinguish prescribed flower and medicines from registered consumer products,
      including supplements, cosmetics and CBD beverages.[@hemp]
    sources:
      - hemp
  medical:
    text: >-
      The legal review describes prescribed dried hemp flower with a 1% THC ceiling, and medical
      products with a 0.2% ceiling and CBD at least four times the THC content.[@hemp]
    sources:
      - hemp
  consequences:
    text: >-
      After the first certified treatment, renewed addiction brings public criticism and a fine.
      After the second, the prison range is three months to one year; after the third, one to three
      years.[@penal]
    sources:
      - penal
  planting:
    seeds: licensed
    seeds_trade: regulated
    clones: licensed
    clones_trade: regulated
    text: >-
      Approved hemp businesses must use registered seed varieties.[@jetro] The Penal Code sets one
      to three years in prison for trading, distributing, transporting, possessing or moving more
      than ten grams of marijuana seeds across borders.[@penal]
    sources:
      - jetro
      - penal
  clubs:
    status: none
    text: >-
      The criminal rules prohibit ordinary cannabis cultivation and trading; the hemp permission is
      for approved businesses.[@outlook,jetro]
    sources:
      - outlook
      - jetro
  visitors:
    status: none
    text: >-
      Possessing five to ten grams of dried cannabis for consumption carries six months to two years
      in prison. The Penal Code also penalises importing and exporting cannabis for trade.[@penal]
    sources:
      - penal
  arrests:
    text: >-
      Public Security Minister Vilay Lakhamphong reported 5,168 suspects arrested in 3,395 drug
      cases over eleven months to parliament on 20 November 2024, including 199 foreigners. Seizures
      included 3,583 kilograms of marijuana. The arrest total covers all drugs together.[@kpl24]
    sources:
      - kpl24
  black_market:
    text: >-
      Figures reported by the government to the UN drugs office record 3,274 kg of herbal cannabis
      seized in 2024, against 1,045 kg in 2023. The UN publishes them as kilogram equivalents, and
      countries count seizures differently, so the figures are not comparable across borders.
    sources:
      - unodc_szr
