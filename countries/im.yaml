name: Isle of Man
region: Europe
iso_numeric: 833
dependency:
  of: gb
  kind: Crown Dependency
  note: >-
    The Isle of Man is a self-governing Crown Dependency. It is not part of the United Kingdom, and
    Tynwald, its parliament, makes its own drug laws; the United Kingdom answers for it
    internationally, including under the UN drug conventions.
recreational: illegal
medical: legal
updated: 2026-10-17
summary: >-
  Cannabis is a Class B drug and possession of even half a gram goes to court, usually ending in a
  fine of a few hundred pounds. Private medical prescriptions have been dispensed on the island
  since 2022. Tynwald backs a harm-reduction approach to drugs but rejected a citizens' jury on a
  regulated market in 2026.
scores:
  possession: 1
  cultivation: 1
  enforcement: 2
  sharing: 1
  consumption: 1
  access: 2
segments:
  possession:
    text: >-
      Possession is a criminal offence dealt with in court. In 2024 magistrates fined a woman £300
      plus £125 costs for half a gram, and a man £750 plus £125 costs for 2.6 g found in his bedroom,
      which he said helped him sleep.
    sources:
      - iom24a
      - iom24b
    currency: GBP
    penalties:
      - label: Half a gram in 2024
        treatment: criminal
        fine: 300
        note: Plus £125 costs
      - label: 2.6 g in 2024
        treatment: criminal
        fine: 750
        note: Plus £125 costs
  cultivation:
    text: >-
      Growing cannabis is an offence even for one plant: in 2022 a man who grew a single plant for
      what he said was medicinal use was fined £700 plus £125 costs. Commercial growing needs a
      licence from the Gambling Supervision Commission.
    sources:
      - mr22
      - gsc
    currency: GBP
    penalties:
      - label: Single plant in 2022
        treatment: criminal
        fine: 700
        note: Plus £125 costs
  enforcement:
    text: >-
      Small amounts usually end in a fine and a conviction. Supply is punished with prison: a man
      concerned in supplying 1.5 kg was jailed for three years and ten months in 2024.
    sources:
      - iom24a
      - iom24b
      - mr24
  sharing:
    text: >-
      Supplying cannabis is prosecuted as supply and punished with prison. No distinction is made
      for sharing without payment.
    sources:
      - mr24
    penalties:
      - label: Concerned in supplying 1.5 kg in 2024
        treatment: criminal
        prison: 3 years
        note: Plus ten months
  consumption:
    text: >-
      Use is dealt with through the possession offence. There are no places where it is tolerated.
    sources:
      - iom24a
  access:
    text: >-
      No legal adult-use source. Patients with a private prescription from a specialist doctor can
      have it dispensed by an island pharmacy: more than 650 patients used the first licensed
      pharmacy in its first year, mostly for chronic pain. The products are not available on the
      island's health service.
    sources:
      - cd24
context_not_applicable:
  death_penalty:
    text: >-
      The Isle of Man formally abolished capital punishment in 1993; the last execution on the
      island was in 1872. No cannabis offence carries a capital sentence.[@wikipdp]
    sources: [wikipdp]
context:
  recreational:
    text: >-
      There is no lawful recreational supply: possession of even half a gram goes to court and
      usually ends in a fine of a few hundred pounds.[@iom24a,iom24b] In May 2026 Tynwald rejected
      a citizens' jury on a regulated market, reaffirming harm-reduction principles instead.[@iom26]
    sources:
      - iom24a
      - iom24b
      - iom26
  production:
    status: medical
    text: >-
      The Gambling Supervision Commission regulates licensed cultivation, manufacture, extraction,
      import, export and industrial hemp. There is no production for adult
      use.
    sources:
      - gsc
  medical:
    text: >-
      From December 2022 a single pharmacy in Onchan dispensed private prescriptions in a year-long
      pilot. Since July 2024 any registered island pharmacy may apply to dispense, and private
      clinics may register to prescribe on the island; prescriptions must come from a doctor on the
      GMC specialist register. Clinics are inspected yearly and pharmacies every six months. About
      335 products a month were dispensed in the pilot year through licensed pharmacies supplied
      via UK wholesalers.
    sources:
      - cd24
  consequences:
    text: >-
      In 2024 Tynwald approved policy principles for tackling the harm caused by illegal drugs. In May 2026 it rejected a motion for a citizens' jury on timelines for a regulated
      recreational market, reaffirming those principles instead; the government said an action plan
      would follow that summer.
    sources:
      - iom26
  clubs:
    status: none
    text: >-
      No cannabis clubs are known. Supplying cannabis to another person is prosecuted with prison
      sentences.
    sources:
      - mr24
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone, so a visitor has no lawful way to obtain
      cannabis. Medical products are dispensed only on a private prescription.
    sources:
      - cd24
