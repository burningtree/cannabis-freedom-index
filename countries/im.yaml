name: Isle of Man
region: Europe
iso_numeric: 833
dependency:
  of: gb
  kind: Crown Dependency
  note: >-
    The Isle of Man is a self-governing Crown Dependency. It is not part of the United Kingdom, and
    Tynwald, its parliament, makes its own drug laws; the United Kingdom answers for it
    internationally, including under the UN drug conventions.
recreational: illegal
medical: legal
updated: '2026-10-28'
summary: >-
  Cannabis remains a Class B drug. Small possession cases can bring a fine or a drug-education
  referral; home growing remains criminal. Private medical dispensing expanded beyond a
  single-pharmacy pilot in 2024.
scores:
  possession: 1
  cultivation: 1
  enforcement: 2
  sharing: 1
  consumption: 1
  access: 2
segments:
  possession:
    text: >-
      Unauthorised Class B possession carries up to five years in prison on conviction on
      information, or a fine, or both.[@act] Small amounts can still lead to a court fine: 2024
      cases involving half a gram and 2.6 g brought £300 and £750 respectively, each with £125
      costs.[@iom24a,iom24b] Eligible first offenders may instead enter the Drug Arrest Referral
      Scheme.[@policy2024]
    sources:
      - act
      - iom24a
      - iom24b
      - policy2024
    penalties:
      - label: Unauthorised Class B possession; conviction on information
        treatment: criminal
        term: Possession of a controlled drug
        prison: 5 years
        note: Prison or an uncapped criminal fine, or both; summary proceedings have lower limits
  cultivation:
    text: >-
      Unauthorised cannabis cultivation carries up to fourteen years on conviction on information,
      or a fine, or both.[@act] Actual small-grow sentences can be much lower: a man who grew one
      plant for claimed medicinal use was fined £700 plus £125 costs in 2022.[@mr22] Commercial
      production needs the relevant GSC licence.[@gsc]
    sources:
      - act
      - mr22
      - gsc
    penalties:
      - label: Unauthorised cultivation; conviction on information
        treatment: criminal
        term: Cultivation of cannabis plant
        prison: 14 years
        note: Prison or an uncapped criminal fine, or both; summary proceedings have lower limits
  enforcement:
    text: >-
      Small possession cases can end in court fines, but the [Drug Arrest Referral
      Scheme](https://tracker.cannabisfreedom.fyi/report/isle-of-man-drug-arrest-referral-2014/) offers eligible first offenders
      education followed by a caution.[@iom24a,iom24b,policy2024] A 2024 government report says most
      referrals involved cannabis and records 108 entrants in 2021/22, of whom 93 completed the
      programme.[@policy2024]
    sources:
      - iom24a
      - iom24b
      - policy2024
  sharing:
    text: >-
      Supply or possession with intent to supply a Class B drug carries up to fourteen years on
      conviction on information, or a fine, or both.[@act] A 2024 case involving supply of 1.5 kg
      brought three years and ten months in prison.[@mr24]
    sources:
      - act
      - mr24
    penalties:
      - label: Supply or possession with intent to supply; conviction on information
        treatment: criminal
        term: Supply of a controlled drug
        prison: 14 years
        note: Prison or an uncapped criminal fine, or both; summary proceedings have lower limits
  consumption:
    text: >-
      Unauthorised use is policed through possession; patients have a separate prescription
      route.[@iom24a,pharmacy2024] A medical-consumption lounge received planning approval in 2026
      for adults to vaporise their own prescribed cannabis.[@loungeapproval]
    sources:
      - iom24a
      - pharmacy2024
      - loungeapproval
  access:
    text: >-
      There is no legal adult-use retail route.[@act] Since the [July 2024
      expansion](/history/isle-of-man-pharmacies-dispense-2024/), registered pharmacies may apply to
      dispense private cannabis prescriptions and private clinics may register
      locally.[@pharmacy2024] Karsons in Onchan and Kingsley Muti in Ballasalla had both been
      approved by August 2024.[@twopharmacies]
    sources:
      - act
      - pharmacy2024
      - twopharmacies
context_not_applicable:
  death_penalty:
    text: >-
      The Isle of Man formally abolished capital punishment in 1993; the last execution on the
      island was in 1872. No cannabis offence carries a capital sentence.[@wikipdp]
    sources:
      - wikipdp
context:
  recreational:
    text: >-
      Cannabis possession and home cultivation remain criminal offences, with [2024 court
      cases](https://tracker.cannabisfreedom.fyi/report/isle-of-man-small-possession-fines-2024/) showing fines even for small
      personal quantities.[@iom24a,iom24b,act] Eligible first possession cases can enter a
      drug-education referral scheme instead of proceeding directly to court.[@policy2024] Tynwald
      rejected a citizens’ jury on a regulated recreational market in May 2026.[@iom26]
    sources:
      - iom24a
      - iom24b
      - act
      - policy2024
      - iom26
  production:
    text: >-
      The GSC licenses cultivation, storage, transport, manufacture, extraction, import, export and
      analysis for the medicinal industry.[@gsc] Its FAQ describes the commercial system as
      licensing specified activities for export, with an on-island company and at least two local
      directors required.[@faq] The [withdrawal of Peel NRE’s proposed complex in
      2026](/history/isle-of-man-peel-cannabis-plan-withdrawn-2026/) illustrates the gap between
      licensing ambitions and construction; the BBC also reported that work had yet to start on a
      separate approved GrowLab facility.[@withdrawal]
    sources:
      - gsc
      - faq
      - withdrawal
    status: medical
  medical:
    text: >-
      Patients pay privately for specialist prescriptions and dispensing: the island’s health
      service does not provide the ordinary cannabis prescription route.[@pharmacy2024] The [pilot
      launched in December 2022](/history/isle-of-man-medical-pharmacy-pilot-2022/) used Karsons
      pharmacy in Onchan and prescriptions from registered English clinics.[@pharmacy2024] The [July
      2024 expansion](/history/isle-of-man-pharmacies-dispense-2024/) opened applications to other
      island pharmacies and local private prescribing clinics, with doctors required to be on the
      GMC specialist register.[@pharmacy2024] By August 2024, Karsons and Kingsley Muti had both
      secured approval.[@twopharmacies]
    sources:
      - pharmacy2024
      - twopharmacies
  consequences:
    text: >-
      The government’s 2024 drug-policy report describes how convictions can restrict work, travel
      and residency, and says these effects can be amplified in a small community.[@policy2024]
      Cautions can also appear on enhanced background checks.[@policy2024] Drug-related convictions
      are separately relevant to commercial cannabis licensing: the GSC requires disclosure even of
      spent convictions and says relevant drug or dishonesty convictions prevent approval.[@faq]
    sources:
      - policy2024
      - faq
  clubs:
    text: >-
      The Green Lounge received planning approval in January 2026 for adults to vaporise their own
      prescribed cannabis.[@loungeapproval] The [Ramsey venue left its premises in
      September](/history/isle-of-man-green-lounge-relocates-2026/) and was holding pop-ups in
      Douglas by October while seeking a permanent home.[@lounge] These accounts describe a patient
      social space rather than a collective cultivation or recreational supply
      scheme.[@loungeapproval,lounge]
    sources:
      - loungeapproval
      - lounge
    status: tolerated
  visitors:
    text: >-
      There is no recreational supply route for visitors.[@act] Local medical dispensing operates
      through licensed pharmacies and private specialist prescriptions.[@pharmacy2024] The GSC’s
      commercial import/export licences are business permissions, separate from the
      patient-dispensing arrangements.[@gsc,pharmacy2024]
    sources:
      - act
      - pharmacy2024
      - gsc
    status: none
  hemp:
    text: >-
      Industrial hemp cultivation needs a GSC licence and uses a THC ceiling of 0.2%.[@guidance] The
      regulator distinguishes a crop whose active parts must be destroyed from a crop whose active
      parts are used to produce medicinal CBD.[@guidance] Applicants for a With Use licence must
      show a lawful export route.[@faq]
    sources:
      - guidance
      - faq
    status: strict
  arrests:
    text: >-
      Police recorded 438 drug offences in 2023/24, compared with 480 in 2022/23, according to the
      November 2024 government report.[@policy2024] Those totals cover all controlled drugs and
      count recorded offences, rather than cannabis arrests.[@policy2024] The same report records
      108 Drug Arrest Referral Scheme entrants in 2021/22, most referred for cannabis possession,
      and 93 completions.[@policy2024]
    sources:
      - policy2024
  planting:
    text: >-
      Seeds can be imported or exported without a GSC cannabis licence for that activity alone,
      while shipments outside the UK/Isle of Man route require the plant-health paperwork described
      by the regulator.[@faq] Possessing seeds without cultivating them needs no licence according
      to GSC guidance.[@seedguide] Growing plants still needs permission, and licensed growers can
      supply seedlings and propagated plant parts within the commercial system.[@guidance]
    sources:
      - faq
      - seedguide
      - guidance
    seeds: grey
    seeds_trade: open
    clones: licensed
    clones_trade: regulated
  research:
    text: >-
      Researchers can obtain a GSC licence, separate from the commercial cultivation licence.[@faq]
      Research permission can cover indoor male and female plants for breeding and seed production,
      with measures to stop pollen reaching other sites.[@faq] Researchers may supply seeds,
      seedlings and live plants, while commercial biomass sales need the additional cultivation
      permission.[@faq]
    sources:
      - faq
    status: licensed
  culture:
    text: >-
      The [Green Lounge’s founders](/history/isle-of-man-green-lounge-approval-2026/) sought to reduce the stigma around medicinal cannabis by providing
      a social space for patients.[@loungeapproval] In October 2026 the cafe’s founder described
      keeping that community together through pop-ups after leaving the Ramsey premises.[@lounge]
      The space offered food, drinks and activities alongside its patient focus.[@lounge]
    sources:
      - loungeapproval
      - lounge
