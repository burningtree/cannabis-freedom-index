    text: >-
      Law 3 of 1993 bans growing the listed plants (Article 28) and, in Article 29, importing,
      owning, holding, buying or selling them at any stage of growth, as well as their seeds;
      plant parts named in a separate schedule are exempt. The Minister of Agriculture may
      license only government departments and scientific institutes to grow them or import
      seeds.
    sources:
      - l3
