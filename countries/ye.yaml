segments:
  possession:
    text: >-
      Article 38 sets five years in prison for holding or buying drugs, or growing listed plants, for
      personal use. A court can order residential treatment instead for a person proved dependent,
      with a stay of at least six months. A user who voluntarily enters treatment is protected from
      prosecution under that provision, with release decided by a committee after a stay of six months
      to two years.[@law93, l3]
    sources:
      - law93
      - l3
  cultivation:
    text: >-
      Articles 28–29 prohibit growing or dealing in the plants in schedule 5, which expressly includes
      male and female cannabis. Growing for personal use carries five years under article 38; growing
      for trade carries death or twenty-five years under article 34. Article 30 allows government
      departments and scientific institutes to obtain growing licences for research.[@law93, l3]
    sources:
      - law93
      - l3
  enforcement:
    text: >-
      Personal-use holdings and growing carry five years, with residential treatment possible instead
      for a person proved dependent. Unpaid supply carries death or twenty-five years; importing or
      manufacturing narcotics for trade carries death.[@law93] The internationally recognised
      government’s reported drug-use cases for 2025 are recorded below; those figures cover the
      governorates it controls.[@ym26]
    sources:
      - law93
      - ym26
  sharing:
    text: >-
      Article 35 sets death or twenty-five years for supplying drugs for consumption without payment
      or facilitating their use outside the authorised circumstances. Article 34 also applies death or
      twenty-five years to trading and running or preparing premises for drug use.[@law93]
    sources:
      - law93
  consumption:
    text: >-
      Article 38 sets five years for holding or buying drugs, or growing listed plants, for
      consumption or personal use, with a residential-treatment alternative for a person proved
      dependent. Article 40 sets up to one year for knowingly being present where drug consumption is
      taking place in premises prepared for it, with specified family exceptions.[@law93] Qat is legal
      and central to social life.[@albab]
    sources:
      - law93
      - albab
  access:
    text: >-
      Article 2 prohibits unauthorised possession and drug transactions. Articles 3–4 restrict imports
      to authorised medical and scientific channels, while article 14 requires a medical prescription
      for pharmacy dispensing. There is no recreational cannabis supply route in these
      provisions.[@law93]
    sources:
      - law93
context:
  death_penalty:
    text: >-
      Article 33 prescribes death for importing or manufacturing narcotics for trade. Articles
      34–35 prescribe death or twenty-five years for trading, growing for trade, unpaid supply
      and preparing premises for drug use.[@law93]
    sources:
      - law93
  production:
    text: Reliable national information about lawful cannabis production was not established by the retained sources.
    sources: []
  products:
    text: Reliable national information about legally available cannabis products was not established by the retained sources.
    sources: []
  medical:
    text: The retained sources do not establish whether a medical cannabis programme operates.
    sources: []
  consequences:
    text: >-
      Articles 36 and 43 provide for confiscation of criminal proceeds, drugs and equipment or
      vehicles used in offences. A conviction for an offence also bars a person from obtaining the
      drug-trading licence described in article 8.[@law93]
    sources:
      - law93
  planting:
    seeds: illegal
    seeds_trade: banned
    clones: illegal
    clones_trade: banned
    text: >-
      Articles 28–29 prohibit growing the listed plants and dealing in them at every stage of growth,
      including their seeds. Schedule 5 expressly names male and female cannabis. Schedule 6 exempts
      stalk fibres and cannabis seeds treated so they cannot germinate. Article 30 limits
      research-growing licences to government departments and scientific institutes.[@law93, l3]
    sources:
      - law93
      - l3
  clubs:
    status: none
    text: >-
      The statute provides no recreational cannabis-club route. Growing for personal use carries five
      years; supplying drugs without payment and preparing premises for consumption carry death or
      twenty-five years.[@law93]
    sources:
      - law93
  visitors:
    status: none
    text: >-
      Unauthorised possession for personal use carries five years, with residential treatment possible
      for a person proved dependent. Unpaid supply can bring death or twenty-five years, and imports
      for trade can bring death. The statute provides no recreational supply route.[@law93]
    sources:
      - law93
  arrests:
    text: >-
      The drug control administration of the internationally recognised government counted
      704 drug cases in 2025 in the governorates it controls, 488 of them for use, and
      1,260 suspects, of whom 827 were users. It seized 2,986 kg of hashish, beside 1,530
      kg of crystal methamphetamine and 169 kg of heroin. The figures do not cover areas
      held by the Houthi authorities.
    sources:
      - ym26
