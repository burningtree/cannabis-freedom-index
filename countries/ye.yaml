segments:
  possession:
    text: >-
      Article 38 of Law 3 of 1993 punishes holding, buying or growing for personal use with five
      years in prison. The court may order an addict into a clinic for at least six months instead,
      and no case is brought against a user who comes forward for treatment on their own. The copy read does not include the schedules, so it does not show which plants are in Table 5.
    sources:
      - law93
  cultivation:
    text: >-
      Article 28 bans growing the Table 5 plants. Growing them for trade carries death or 25 years
      (Article 34); growing for personal use carries five years (Article 38).
    sources:
      - law93
  enforcement:
    text: >-
      The statute sets five years for personal use and allows treatment instead (Article 38);
      the court may reduce a sentence only to the next lower penalty (Article 37). How it is
      applied is not shown by the text.
    sources:
      - law93
  sharing:
    text: >-
      Article 35 punishes giving drugs to a user without payment, or making use easier, with death
      or 25 years in prison, the same as trading (Article 34).
    sources:
      - law93
  consumption:
    text: >-
      Article 38 punishes holding or buying for personal use or consumption with five years in
      prison, with treatment possible instead. Qat, a mild stimulant leaf chewed daily by most
      Yemeni men, is legal and central to social life.
    sources:
      - law93
      - albab
  access:
    text: >-
      None for personal use. Imports for medical and scientific use need prior written permission
      from the health ministry (Article 3).
    sources:
      - law93
context:
