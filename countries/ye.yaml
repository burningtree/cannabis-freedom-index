segments:
  possession:
    text: >-
      Illegal under the 1993 narcotics law, which punishes possession for personal use with one to
      three years in prison and a fine.
    sources:
      - cr
      - trip
  cultivation:
    text: Cultivation carries ten to twenty-five years.
    sources:
      - cr
  enforcement:
    text: >-
      Severe law, with the country divided between rival authorities since 2014 and enforcement
      correspondingly inconsistent.
    sources:
      - trip
  sharing:
    text: Trafficking carries ten to twenty-five years, or death for repeat or aggravated offences.
    sources:
      - cr
      - trip
  consumption:
    text: >-
      Use is an offence. By contrast qat, a mild stimulant leaf chewed daily by most Yemeni men, is
      legal and central to social life.
