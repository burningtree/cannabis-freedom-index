name: Honduras
region: North America
iso_numeric: 340
recreational: illegal
medical: none
updated: 2026-10-23
summary: >-
  Since 25 June 2020 the criminal code punishes cannabis trafficking, cultivation and possession
  for those purposes with four to seven years, or one to three when the case is of lesser
  gravity. The 1989 compulsory-rehabilitation rule for personal use was repealed. That repeal
  does not declare personal possession lawful.
scores:
  possession: 1
  cultivation: 1
  enforcement: 2
  sharing: 1
  consumption: 1
  access: 0
segments:
  possession:
    text: >-
      Articles 16 to 30 of the 1989 drug law, including the personal-consumption security measure,
      were repealed when the criminal code commenced on 25 June 2020. Article 311 punishes
      possession when it is for trafficking or for promoting, favouring or facilitating illegal
      consumption. For cannabis, which article 321 treats as not causing grave harm, the basic
      sentence is four to seven years plus a fine, or one to three years when the circumstances
      show lesser gravity. The repeal does not declare that holding cannabis for oneself is lawful.
    sources:
      - penal
      - vigencia
    penalties:
      - label: Possession for trafficking or facilitating consumption (Article 311)
        treatment: criminal
        prison_min: 4 years
        prison: 7 years
        note: Plus a fine of 100–500 day-fines (income-based)
      - label: Lesser-gravity cases
        treatment: criminal
        prison_min: 1 year
        prison: 3 years
  cultivation:
    text: >-
      Article 311 punishes sowing, cultivation and harvest. For cannabis the basic sentence is
      four to seven years, or one to three years when the circumstances show lesser gravity.
      Domestic growing has expanded, much of it controlled by gangs.
    sources:
      - penal
      - ic
    penalties:
      - label: Sowing, cultivation and harvest (Article 311)
        treatment: criminal
        prison_min: 4 years
        prison: 7 years
        note: One to three years when the circumstances show lesser gravity
  enforcement:
    text: >-
      Article 311 sets prison for trafficking, cultivation and possession for those purposes.
      The repealed article 26 compulsory-rehabilitation rule is not the current penalty.
    sources:
      - penal
      - vigencia
  sharing:
    text: >-
      Article 311 punishes commerce, transport and trafficking, and possession for those purposes.
      For cannabis the basic sentence is four to seven years plus a fine of 100 to 500 days, or
      one to three years when lesser gravity is found. Aggravating circumstances are listed in
      article 312, which a 2021 decree later restated.
    sources:
      - penal
    penalties:
      - label: Commerce, transport and trafficking (Article 311)
        treatment: criminal
        prison_min: 4 years
        prison: 7 years
        note: Plus a fine of 100–500 day-fines; one to three years when lesser gravity is found
  consumption:
    text: >-
      The criminal code punishes promoting, favouring or facilitating illegal consumption. It does
      not restate the repealed compulsory-rehabilitation rule for personal use.
    sources:
      - penal
      - vigencia
  access:
    text: No legal source.
    sources:
      - penal
context_not_applicable:
  death_penalty:
    text: >-
      Honduras abolished the death penalty in 1956; no cannabis offence carries a capital
      sentence.[@wikipdp]
    sources: [wikipdp]
context:
  recreational:
    text: >-
      There is no legal way to get cannabis. The 1989 personal-use rule was repealed in 2020,
      and Article 311 punishes possession for trafficking or for facilitating consumption with
      four to seven years, or one to three in lesser-gravity cases; the repeal does not make
      holding cannabis for oneself lawful.[@penal,vigencia]
    sources:
      - penal
      - vigencia
  production:
    status: none
    text: No licensed production. Article 311 punishes sowing, cultivation and harvest.
    sources:
      - penal
  medical:
    text: >-
      No patient programme is documented. The code punishes possession for trafficking or for
      facilitating consumption and sets no medical route.[@penal]
    sources:
      - penal
  consequences:
    text: >-
      A conviction under article 311 is a prison sentence. The repealed article 26 internment rule
      is not the current penalty, and the repealed article 27 expulsion rule is not restated here.
    sources:
      - penal
      - vigencia
  planting:
    seeds: illegal
    seeds_trade: banned
    clones: illegal
    clones_trade: banned
    text: >-
      According to the Transnational Institute's summary of the 1989 drug law (Decree 126-89),
      Article 7 prohibits producing, planting, cultivating and gathering plants or seeds that
      contain narcotic or controlled ingredients. The statute itself was not read.
    sources:
      - tnihn
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited.
    sources:
      - ic
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. Articles 16 to 30 of the 1989 drug law
      were repealed on 25 June 2020, including the personal-consumption security measure and the
      expulsion rule for foreigners. Article 311 punishes possession for trafficking or for
      facilitating illegal consumption. For cannabis that basic sentence is four to seven years.
      Current immigration consequences were not read separately.
    sources:
      - penal
      - vigencia
  black_market:
    text: >-
      Marijuana is grown in the country. The armed forces said in June 2025 that they had
      secured 13 illegal marijuana fields with about 180,000 plants so far that year,
      beside 37 coca plantations with more than 770,000 bushes.
    sources:
      - pl25
