segments:
  possession:
    text: >-
      The 1989 drug law (Decree 126-89) prohibits possession in any quantity. For personal
      consumption the consequence is not prison but compulsory referral to a rehabilitation
      facility, with fines; quantities that suggest dealing bring six to fifteen years.
    sources:
      - law
  cultivation:
    text: Cultivation is a crime; domestic growing has expanded, much of it controlled by gangs.
    sources:
      - ic
  enforcement:
    text: >-
      Forced treatment for users and long sentences for sellers, in a country where the line between
      the two is drawn by police.
    sources:
      - ic
  sharing:
    text: >-
      The 1989 drug law, Decree 126-89, punishes trafficking and transport with three to twenty
      years in prison. It sets no quantity that separates dealing from personal use: the judge
      decides from the circumstances and the amount seized.
    sources:
      - tnihn
  consumption:
    text: Consumption is prohibited and leads to the same mandatory rehabilitation measures.
    sources:
      - law
  access:
    text: No legal source.
    sources:
      - law
context:
  production:
    text: Reliable national information about lawful cannabis production was not established by the retained sources.
    sources: []
  products:
    text: Reliable national information about legally available cannabis products was not established by the retained sources.
    sources: []
  medical:
    text: The retained sources do not establish whether a medical cannabis programme operates.
    sources: []
  consequences:
    text: Compulsory internment is the main consequence for users.
    sources:
      - law
  planting:
    seeds: illegal
    seeds_trade: banned
    clones: illegal
    clones_trade: banned
    text: >-
      According to the Transnational Institute's summary of the 1989 drug law (Decree 126-89),
      Article 7 prohibits producing, planting, cultivating and gathering plants or seeds that
      contain narcotic or controlled ingredients. The statute itself was not read.
    sources:
      - tnihn
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited.
    sources:
      - ic
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. The 1989 drug law prohibits possession
      in any quantity; for personal consumption the consequence is compulsory referral to a
      rehabilitation facility, with fines, and quantities that suggest dealing bring six to
      fifteen years.
    sources:
      - law
  black_market:
    text: >-
      Marijuana is grown in the country. The armed forces said in June 2025 that they had
      secured 13 illegal marijuana fields with about 180,000 plants so far that year,
      beside 37 coca plantations with more than 770,000 bushes.
    sources:
      - pl25
