segments:
  possession:
    text: >-
      Articles 16 to 30 of the 1989 drug law, including the personal-consumption security measure,
      were repealed when the criminal code commenced on 25 June 2020.[@vigencia] Article 311 punishes
      possession when it is for trafficking or for promoting, favouring or facilitating illegal
      consumption.[@penal] For cannabis, which article 321 treats as not causing grave harm, the basic
      sentence is four to seven years plus a fine, or one to three years when the circumstances
      show lesser gravity.[@penal] The repeal does not declare that holding cannabis for oneself is lawful.[@vigencia]
      [The 1989 law set the old penalties.](/history/honduras-drug-law-1989/)
      [The 2020 code replaced them.](/history/honduras-penal-code-2020/)
    sources:
      - penal
      - vigencia
    penalties:
      - label: Possession for trafficking or facilitating consumption (Article 311)
        treatment: criminal
        term: Possession for trafficking
        prison_min: 4 years
        prison: 7 years
        note: Plus a fine of 100–500 day-fines (income-based)
      - label: Lesser-gravity cases
        treatment: criminal
        term: Lesser-gravity possession
        prison_min: 1 year
        prison: 3 years
  cultivation:
    text: >-
      Article 311 punishes sowing, cultivation and harvest.[@penal] For cannabis the basic sentence is
      four to seven years, or one to three years when the circumstances show lesser gravity.[@penal]
      Domestic growing has expanded, much of it controlled by gangs.[@ic]
      [The 1989 law punished growing with nine to twelve years.](/history/honduras-drug-law-1989/)
      [The 2020 code replaced the penalties.](/history/honduras-penal-code-2020/)
      [180,000 plants were seized in half a year.](https://tracker.cannabisfreedom.fyi/report/honduras-marijuana-fields-2025/)
    sources:
      - penal
      - ic
    penalties:
      - label: Sowing, cultivation and harvest (Article 311)
        treatment: criminal
        term: Unlawful cultivation
        prison_min: 4 years
        prison: 7 years
        note: One to three years when the circumstances show lesser gravity
  enforcement:
    text: >-
      Article 311 sets prison for trafficking, cultivation and possession for those purposes.[@penal]
      The repealed article 26 compulsory-rehabilitation rule is not the current penalty.[@vigencia]
      [The 1989 law set the old penalties.](/history/honduras-drug-law-1989/)
      [The 2020 code replaced them.](/history/honduras-penal-code-2020/)
    sources:
      - penal
      - vigencia
  sharing:
    text: >-
      Article 311 punishes commerce, transport and trafficking, and possession for those purposes.[@penal]
      For cannabis the basic sentence is four to seven years plus a fine of 100 to 500 days, or
      one to three years when lesser gravity is found.[@penal] Aggravating circumstances are listed in
      article 312, which a 2021 decree later restated.[@penal]
      [The 2020 code replaced the penalties.](/history/honduras-penal-code-2020/)
    sources:
      - penal
    penalties:
      - label: Commerce, transport and trafficking (Article 311)
        treatment: criminal
        term: Trafficking
        prison_min: 4 years
        prison: 7 years
        note: Plus a fine of 100–500 day-fines; one to three years when lesser gravity is found
  consumption:
    text: >-
      The criminal code punishes promoting, favouring or facilitating illegal consumption.[@penal] It does
      not restate the repealed compulsory-rehabilitation rule for personal use.[@vigencia]
      [The 1989 law set the old penalties.](/history/honduras-drug-law-1989/)
    sources:
      - penal
      - vigencia
  access:
    text: >-
      No legal source.[@penal]
      [The 2020 code replaced the penalties.](/history/honduras-penal-code-2020/)
    sources:
      - penal
context_not_applicable:
  death_penalty:
    text: >-
      Honduras abolished the death penalty in 1956; no cannabis offence carries a capital
      sentence.[@wikipdp]
    sources: [wikipdp]
context:
  recreational:
    text: >-
      There is no legal way to get cannabis. The 1989 personal-use rule was repealed in 2020,
      and Article 311 punishes possession for trafficking or for facilitating consumption with
      four to seven years, or one to three in lesser-gravity cases; the repeal does not make
      holding cannabis for oneself lawful.[@penal,vigencia]
      [The 1989 law set the old penalties.](/history/honduras-drug-law-1989/)
      [The 2020 code replaced them.](/history/honduras-penal-code-2020/)
      [Export growing was proposed in 2022.](/history/honduras-cultivation-proposal-2022/)
    sources:
      - penal
      - vigencia
  production:
    status: none
    text: >-
      No licensed production. Article 311 punishes sowing, cultivation and harvest.[@penal]
      [The 2020 code replaced the penalties.](/history/honduras-penal-code-2020/)
    sources:
      - penal
  medical:
    text: >-
      No patient programme is documented. The code punishes possession for trafficking or for
      facilitating consumption and sets no medical route.[@penal]
      [A 2020 patients bill never advanced.](/history/honduras-cultivation-proposal-2022/)
    sources:
      - penal
  consequences:
    text: >-
      A conviction under article 311 is a prison sentence.[@penal] The repealed article 26 internment rule
      is not the current penalty, and the repealed article 27 expulsion rule is not restated here.[@vigencia]
      A 2012 commission draft would have replaced the 1989 law altogether, down to shooting down
      drug planes.(/history/honduras-draft-drug-law-2012/)
      [The 1989 law set the old penalties.](/history/honduras-drug-law-1989/)
    sources:
      - penal
      - vigencia
  planting:
    seeds: illegal
    seeds_trade: banned
    clones: illegal
    clones_trade: banned
    text: >-
      According to the Transnational Institute's summary of the 1989 drug law (Decree 126-89),
      Article 7 prohibits producing, planting, cultivating and gathering plants or seeds that
      contain narcotic or controlled ingredients.[@tnihn] The statute itself was not read.[@tnihn]
      [The 1989 law set the old penalties.](/history/honduras-drug-law-1989/)
    sources:
      - tnihn
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited.[@ic]
      [The 2020 code replaced the penalties.](/history/honduras-penal-code-2020/)
    sources:
      - ic
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone.[@penal] Articles 16 to 30 of the 1989 drug law
      were repealed on 25 June 2020, including the personal-consumption security measure and the
      expulsion rule for foreigners.[@vigencia] Article 311 punishes possession for trafficking or for
      facilitating illegal consumption. For cannabis that basic sentence is four to seven years.[@penal]
      Current immigration consequences were not read separately.[@vigencia]
      [The 2020 code replaced the penalties.](/history/honduras-penal-code-2020/)
    sources:
      - penal
      - vigencia
  black_market:
    text: >-
      Marijuana is grown in the country. The armed forces said in June 2025 that they had
      secured 13 illegal marijuana fields with about 180,000 plants so far that year,
      beside 37 coca plantations with more than 770,000 bushes.[@pl25]
      [180,000 plants were seized in half a year.](https://tracker.cannabisfreedom.fyi/report/honduras-marijuana-fields-2025/)
    sources:
      - pl25
  hemp:
    status: none
    text: >-
      No hemp exception operates. The 1989 drug law prohibited producing, planting,
      cultivating and gathering plants or seeds with narcotic or controlled ingredients,
      and the 2020 code punishes sowing, cultivation and harvest with no low-THC
      carve-out.[@tnihn,penal]
      [The 1989 law set the old penalties.](/history/honduras-drug-law-1989/)
      [Cannabis was first restricted around 1925.](/history/hn-first-restriction-estimate/)
    sources:
      - tnihn
      - penal
