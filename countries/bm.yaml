dependency:
  of: gb
  kind: British Overseas Territory
  note: >-
    Bermuda is a British Overseas Territory with its own parliament and drug laws. Its laws need the
    Governor's assent, and the United Kingdom answers for it internationally; in 2022 the UK
    instructed the Governor not to assent to a bill legalising cannabis.
