name: Bermuda
region: North America
iso_numeric: 60
dependency:
  of: gb
  kind: British Overseas Territory
  note: >-
    Bermuda is a British Overseas Territory with its own parliament and drug laws. Its laws need the
    Governor's assent, and the United Kingdom answers for it internationally; in 2022 the UK
    instructed the Governor not to assent to a bill legalising cannabis.
recreational: decriminalised
medical: limited
words:
  - word: marijuana
    lang: English (Bermuda)
    meaning: The word the 1969 inquiry into the 1968 disturbances used for the drug when it found search powers interpreted too widely in marijuana policing
    sources:
      - wooding69
updated: '2026-10-22'
summary: >-
  Simple possession of seven grams of cannabis or less has been decriminalised since 20 December
  2017, while police may seize it and unauthorised use, growing and supply remain offences.
  Qualifying old convictions can be cleared on application. Named cannabinoid medicines have been
  permitted on prescription since 2014; the UK blocked the broader cannabis licensing bill in 2022.
scores:
  possession: 3
  cultivation: 1
  enforcement: 3
  sharing: 1
  consumption: 1
  access: 1
segments:
  possession:
    text: >-
      Simple possession of seven grams of cannabis or less is exempt from the possession
      offence.[@decrim] Police may seize any amount, and evidence of intent to supply can still be
      prosecuted.[@drugs] Possession above seven grams remains an offence.[@drugs] The 2017 law did
      not automatically clear older convictions; a later application process allows qualifying
      records to be expunged.[@expungeCurrent]
    sources:
      - decrim
      - drugs
      - expungeCurrent
    penalties:
      - treatment: legal
        term: Exempt from possession offence
        upto: 7 g
        note: Simple possession; police may still seize any amount and supply intent is prosecutable
      - label: Over 7 g
        treatment: criminal
        term: Ordinary possession offence
        note: Amounts and sentences not stated in the retained sources
  cultivation:
    text: >-
      Growing a plant of the genus Cannabis is prohibited unless authorised under the drug law’s
      regulations. The 2019 hemp definition excludes low-THC hemp from the definition of cannabis,
      but the cultivation clause still refers to any plant of the genus. The broader personal and
      commercial licensing plan was blocked in 2022.
    sources:
      - drugs
      - hemp
      - blocked
  enforcement:
    text: >-
      The seven-gram exemption concerns simple possession;[@decrim] police retain seizure powers, and supply
      intent can still lead to prosecution below that weight. Cultivation, supply and unauthorised
      imports or use remain offences. The government’s fact sheet says the earlier caution policy
      for less than three grams ceased to have effect.[@fact] Cannabis resin is separately defined and
      controlled,[@drugs] and stop-and-search powers date to
      1966.(/history/bermuda-warrantless-drug-search-powers-1966/)
    sources:
      - decrim
      - drugs
      - fact
  sharing:
    text: >-
      Unauthorised supply or an offer to supply a controlled drug remains an offence. The law
      contains no general exemption for giving cannabis away without payment, and the seven-gram
      possession exemption does not authorise supply.
    sources:
      - drugs
      - decrim
  consumption:
    text: >-
      Unauthorised cannabis use remains an offence. The government’s explanation of the seven-gram
      reform expressly says smoking is still illegal in public and private places. Licensed medical
      use is governed separately.
    sources:
      - drugs
      - fact
  access:
    text: >-
      The 2014 law named Marinol, Cesamet and Sativex in the permitted medical schedules. Personal
      medical cannabis imports require ministerial authorisation; contemporary reporting of the 2016
      Brangman hearing confirmed the minister’s power to consider and refuse such applications. The
      wider adult-use licensing bill was blocked in 2022.
    sources:
      - meds
      - court
      - drugs
      - blocked
context:
  recreational:
    text: >-
      There is no legal recreational market. Simple possession of seven grams or less is exempt
      from the possession offence, but police may still seize any amount and supply intent can
      be prosecuted below that weight.[@decrim,drugs] Growing, supply and unauthorised imports
      or use remain offences, and the broader licensing plan was blocked in
      2022.[@drugs,blocked]
    sources:
      - decrim
      - drugs
      - blocked
  production:
    status: none
    text: >-
      The 2020 policy proposed licences for personal and commercial growing, manufacturing and
      retail. The UK instructed Bermuda’s governor not to assent to the resulting cannabis licensing
      bill in 2022. Cultivation still requires legal authorisation under the existing drug law.
    sources:
      - plan
      - blocked
      - drugs
  hemp:
    status: high
    text: >-
      Since November 2019, the drug law defines hemp as cannabis sativa, or any part of it, with
      no more than 1% THC and excludes it from the definition of cannabis. In July 2026, the
      government proposed clearer compliance rules for hemp-derived consumer products already
      being sold, with drafting instructions for hemp reforms and initial implementation targeted
      for the final quarter of the
      year.(/history/bermuda-medical-hemp-reform-timetable-2026/)
    sources:
      - hemp
      - drugs
      - future
  medical:
    text: >-
      Named cannabinoid medicines have a prescription route under the 2014 pharmaceutical law,
      alongside the minister’s personal-import licensing powers. A 2019 proposal for locally
      produced cannabis for medical
      inhalation(/history/bermuda-medical-consultation-2019/) became part of the wider licensing
      debate that produced the 2020 adult-use plan, blocked in
      2022.(/history/bermuda-adult-use-licensing-plan-2020/) In July 2026, the government targeted
      a further medical and hemp framework for the final quarter of the
      year.(/history/bermuda-medical-hemp-reform-timetable-2026/)
    sources:
      - meds
      - court
      - medicalDraft
      - future
  consequences:
    text: >-
      People with qualifying cannabis possession convictions predating 20 December 2017 can apply
      for an expungement order. From the order date, Bermuda law treats the person as not having
      committed, been prosecuted for, convicted of or sentenced for that offence, with disclosure
      and employment protections. Since November 2023, certain low-penalty records omitting the
      weight qualify under a statutory presumption. The government says Bermuda relief does not
      guarantee US admission.
    sources:
      - expungeCurrent
      - presumption
      - launch
  clubs:
    status: none
    text: >-
      The seven-gram possession exemption does not permit collective growing, supplying members or
      unauthorised consumption. The proposed licensing of retail and consumption premises did not
      become law.
    sources:
      - drugs
      - plan
      - blocked
  visitors:
    status: none
    text: >-
      The seven-gram exemption applies to simple possession in Bermuda and does not authorise
      importing cannabis. Imports of controlled drugs require an applicable legal exception or
      authorisation; a personal cannabis licence remains a separate decision.
    sources:
      - drugs
      - decrim
      - court
