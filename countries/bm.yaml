updated: 2026-10-17
summary: >-
  Since December 2017, possessing 7 g or less is not a criminal offence, though police seize it and
  smoking remains illegal. A 2022 bill to legalise and license cannabis passed parliament but was
  blocked by the United Kingdom. Medical access rests on a 2016 court ruling and imports, with a new
  medical framework targeted for late 2026.
