segments:
  possession:
    text: >-
      Since the Misuse of Drugs (Decriminalisation of Cannabis) Amendment Act 2017, simple
      possession of 7 g or less is no longer a criminal offence. It is still not legal: police may
      seize any amount, and possession of more than 7 g can lead to arrest, prosecution and a
      criminal conviction. The Act did not erase earlier convictions.
    sources:
      - fact
      - wiki
  cultivation:
    text: >-
      Cultivating cannabis remains an offence in any quantity. The licensing regime the government
      proposed in 2020 would have licensed personal cultivation, but it never became law.
    sources:
      - fact
      - gov20
  enforcement:
    text: >-
      Inside 7 g there is no prosecution for possession, though the Director of Public Prosecutions
      may still prosecute where the evidence points to supply. Above the threshold, and for
      importing, cultivating or supplying any amount, the criminal law applies in full.
    sources:
      - fact
      - lrc
  sharing:
    text: >-
      Supplying, selling or handling cannabis, and possessing it with intent to supply, remain
      offences in any quantity, with no exception for sharing without payment.
    sources:
      - fact
  consumption:
    text: >-
      Consuming cannabis is still an offence, whether in a public or a private place, even though
      possessing a small amount is not.
    sources:
      - fact
      - lrc
  access:
    text: >-
      No legal adult-use source. Medical use rests on a 2016 Supreme Court ruling; two doctors were
      licensed to prescribe in 2018, and since 2020 patients may import up to 2,000 g a year. There
      is no domestic legal supply.
    sources:
      - wiki
context:
  production:
    text: >-
      No licensed cannabis production. The government's 2020 plan proposed licences for personal and
      commercial cultivation and for retail shops. The resulting Cannabis Licensing Bill passed the
      House of Assembly in 2022, but in September 2022 the Governor was instructed not to assent to it because the UK found it inconsistent with the 1961
      and 1971 UN drug conventions.
    sources:
      - gov20
      - govuk
  products:
    text: >-
      Hemp-derived consumer products are sold without a clear compliance framework; in July 2026 the
      government said amendments would clarify their legal treatment.
    sources:
      - mns26
  medical:
    text: >-
      There is no medical cannabis law. In July 2026 the national security minister said drafting
      instructions had been issued for medical cannabis and hemp reforms, with initial
      implementation targeted for the fourth quarter of 2026; a regulated adult-use regime would take
      longer.
    sources:
      - mns26
      - wiki
  consequences:
    text: >-
      The 2017 Act gives no guarantee that a person will not be stopped when travelling to the
      United States, and earlier simple-possession convictions stand. Minors found with any amount
      are to be offered substance-abuse education or treatment.
    sources:
      - fact
  clubs:
    status: none
    text: >-
      No cannabis clubs are known. Supply and consumption remain offences, and the bill that would
      have licensed premises for use did not become law.
    sources:
      - fact
      - gov20
  visitors:
    status: none
    text: >-
      There is no legal supply for anyone. Importing cannabis remains an offence in any quantity,
      and the 7 g decriminalisation does not cover bringing cannabis into Bermuda.
    sources:
      - fact
