segments:
  possession:
    text: >-
      Cannabis is a Class B drug, and personal possession carries up to eight years in prison — one
      of the highest maximums in the EU. Holding 30 g or more creates a presumption of intent to
      supply. First-time offenders under 25 with small amounts can be handled with a reduced fine
      and counselling.
    sources:
      - wiki
      - lc
  cultivation:
    text: >-
      Three or more plants are presumed to be for supply; fewer are treated as personal possession,
      still a crime.
    sources:
      - lc
      - wiki
  enforcement:
    text: >-
      Courts regularly hand down prison sentences for possession, and multi-year terms for larger
      amounts.
    sources:
      - cm1
      - cm2
  sharing:
    text: Supply carries very long sentences, up to life.
    sources:
      - wiki
      - cm2
  consumption:
    text: >-
      Use is an offence, with up to life on the statute book but treatment-oriented handling for
      young first offenders.
    sources:
      - wiki
  access:
    text: >-
      No adult-use source. A 2019 law legalised medical cannabis, with pharmacy dispensing on
      specialist prescription.
    sources:
      - lc
      - wiki
context:
  production:
    text: >-
      The 2019 law allows a small number of licences to cultivate, import and export medical
      cannabis.
    sources:
      - lc
  products:
    text: Prescription medical cannabis and low-THC CBD products.
    sources:
      - lc
  medical:
    text: >-
      Legal since 2019 for listed conditions such as chronic pain and cancer-related symptoms,
      prescribed by specialists; rollout has been slow.
    sources:
      - lc
      - wiki
  consequences:
    text: A conviction is a criminal record; foreigners face deportation.
    sources:
      - cm1
  planting:
    seeds: grey
    seeds_trade: banned
    clones: illegal
    clones_trade: banned
    text: >-
      The narcotics law's definition of cannabis covers the flowering tops, leaves and stalk,
      not the seeds. Section 7A makes it an offence, with up to eight years in prison, to
      supply or sell cannabis seeds to someone you know intends to grow illegally, or to
      import cannabis seeds. Growing, planting or importing any cannabis plant is an offence
      under section 7; industrial hemp under the 2016 hemp law is exempt.
    sources:
      - l29
  driving:
    status: impairment
    text: >-
      The traffic law requires impairment and sets no THC limit, but in practice drivers are
      usually prosecuted under the narcotics law, since using and possessing drugs is a crime
      in itself and no effect on driving has to be shown. Police may stop and test at random
      with an oral-fluid test, and a second roadside sample is sent as evidence. Suspension
      and fine are left to the court, and prison of up to one year is possible.
    sources:
      - euda_dd
  arrests:
    text: >-
      The EU drugs agency's statistical bulletin records 770 cannabis-related drug law
      offences in Cyprus in 2024, against 846 in 2023. Of the 2024 total, 602 were for use or
      possession for use. Countries count these differently (offences or offenders, criminal
      or administrative), so the figure is not comparable across borders.
    sources:
      - euda_dlo
  clubs:
    status: none
    text: >-
      No clubs are known. A Europe-wide survey of cannabis social clubs carried out in 2018
      and 2019 found, after online searches and contact with people in the field, that there
      did not seem to be any active club in Cyprus. The model is prohibited throughout the
      European Union. Nothing more recent was found.
    sources:
      - pardal20
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. British travel advice describes a
      strictly enforced zero-tolerance policy that covers cannabis and laughing gas:
      possessing, using or smuggling drugs can bring a long prison sentence and heavy fines,
      also for passengers in transit, whose baggage is scanned.
    sources:
      - lc
      - wiki
      - fcdo
