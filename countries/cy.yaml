segments:
  possession:
    text: >-
      Cannabis is a Class B drug, and personal possession carries up to eight years in prison — one
      of the highest maximums in the EU. Holding 30 g or more creates a presumption of intent to
      supply. First-time offenders under 25 with small amounts can be handled with a reduced fine
      and counselling.
    sources:
      - wiki
      - lc
  cultivation:
    text: >-
      Three or more plants are presumed to be for supply; fewer are treated as personal possession,
      still a crime.
    sources:
      - lc
      - wiki
  enforcement:
    text: >-
      Courts regularly hand down prison sentences for possession, and multi-year terms for larger
      amounts.
    sources:
      - cm1
      - cm2
  sharing:
    text: Supply carries very long sentences, up to life.
    sources:
      - wiki
      - cm2
  consumption:
    text: >-
      Use is an offence, with up to life on the statute book but treatment-oriented handling for
      young first offenders.
    sources:
      - wiki
  access:
    text: >-
      No adult-use source. A 2019 law legalised medical cannabis, with pharmacy dispensing on
      specialist prescription.
    sources:
      - lc
      - wiki
context:
  production:
    text: >-
      The 2019 law allows a small number of licences to cultivate, import and export medical
      cannabis.
    sources:
      - lc
  products:
    text: Prescription medical cannabis and low-THC CBD products.
    sources:
      - lc
  medical:
    text: >-
      Legal since 2019 for listed conditions such as chronic pain and cancer-related symptoms,
      prescribed by specialists; rollout has been slow.
    sources:
      - lc
      - wiki
  consequences:
    text: A conviction is a criminal record; foreigners face deportation.
    sources:
      - cm1
