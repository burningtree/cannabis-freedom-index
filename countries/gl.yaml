name: Greenland
region: North America
iso_numeric: 304
dependency:
  of: dk
  kind: Self-governing territory
  note: >-
    Greenland is a self-governing part of the Kingdom of Denmark. It has made its own laws on
    euphoriant substances since it took over health matters in 1992, and its criminal code differs
    from Denmark's; Denmark answers for it internationally.
population:
  2025: 56542
cannabis_use:
  prevalence: 30
  year: 2018
  users: 11400
recreational: illegal
medical: limited
updated: 2026-10-17
summary: >-
  Hash use is widespread: in a 2018 national survey 30% of adults had smoked it in the past year. It is banned under Greenland's own law, and the criminal code answers with
  measures such as fines rather than prison terms as such. The government favours customs controls
  and prevention over legalisation.
scores:
  possession: 1
  cultivation: 1
  enforcement: 2
  sharing: 1
  consumption: 1
  access: 1
segments:
  possession:
    text: >-
      Possession of hash is an offence under Greenland's own law on euphoriant substances; the power
      to legislate on these substances passed to Greenland with health matters in 1992, so Danish
      rules such as the 0.2% THC limit do not apply there. Offences are dealt with under the
      Criminal Code for Greenland, which imposes measures rather than punishment: fines, or for
      graver cases placement in an institution.
    sources:
      - ina257
      - krim
  cultivation:
    text: >-
      Growing cannabis is an offence under the same law. No cultivation is licensed or tolerated.
    sources:
      - ina257
  enforcement:
    text: >-
      Hash cases end in measures such as fines: in February 2026 the High Court of Greenland upheld a
      conviction in a hash case but replaced the measure with a fine because the case had taken so
      long. The government has funded more customs officers since 2018, with three to five more in the 2025 budget, and once cannabis is
      past the border the police take over.
    sources:
      - lg26
      - ina26
  sharing:
    text: >-
      Passing hash on to others is an offence under the euphoriant substances law, with no exception
      for sharing without payment.
    sources:
      - ina257
  consumption:
    text: >-
      Use is common but not legal. In the 2018 survey 21% of adults smoked hash at least once a
      month and 3.8% daily or almost daily.
    sources:
      - sdu18
  access:
    text: >-
      No legal adult-use source. Approval of medicines, cannabis medicines included, rests with
      Greenland's own medicines committee; Danish rules on cannabis medicines cannot simply be
      extended to Greenland. Wikipedia reports that medical use on a doctor's prescription is
      allowed.
    sources:
      - ina273
      - wiki
context:
  production:
    text: >-
      No licensed production. Hash reaches Greenland by smuggling, and new airports in Qaqortoq and
      Ilulissat have prompted reviews of customs staffing.
    sources:
      - ina26
  products:
    text: >-
      No legal cannabis products. Greenland has not adopted Denmark's rule allowing products with up
      to 0.2% THC; in 2019 the government said such a limit would need a new Inatsisartut law.
    sources:
      - ina257
  medical:
    text: >-
      Cannabis medicines are a matter for Greenland's medicines committee. In 2019 the government
      explained that it could no longer extend Danish rules to Greenland and that any new rules would
      need an act of Inatsisartut.
    sources:
      - ina273
  consequences:
    text: >-
      In the 2018 survey 22% of regular hash users had at some point been treated for addiction.
      Allorfik, the national addiction service, has expanded treatment for cannabis dependence since
      2016. A 2024 report on the pros and cons of legalisation stressed the harm to children and young
      people, and in 2026 the government put the emphasis on customs and prevention.
    sources:
      - sdu18
      - ina26
  clubs:
    status: none
    text: >-
      No cannabis clubs are known. Passing hash on to others is an offence.
    sources:
      - ina257
  visitors:
    status: none
    text: >-
      There is no legal supply for anyone, and customs check arrivals for smuggled hash.
    sources:
      - ina26
