name: Greenland
region: North America
iso_numeric: 304
dependency:
  of: dk
  kind: Self-governing territory
  note: >-
    Greenland is a self-governing part of the Kingdom of Denmark. It has made its own laws on
    euphoriant substances since it took over health matters in 1992, and its criminal code
    differs from Denmark's; Denmark answers for it internationally.
recreational: illegal
medical: limited
updated: "2026-10-23"
summary: >-
  Recreational cannabis possession and supply remain prohibited. Greenland’s own rules provide
  medical and prescription permissions and an exception for products with no more than 0.2% THC
  brought in through authorised importers for local distribution. The government continues to
  emphasise customs controls, prevention and treatment.
scores:
  possession: 1
  cultivation: 1
  enforcement: 2
  sharing: 1
  consumption: 1
  access: 1
segments:
  possession:
    text: >-
      Cannabis possession is controlled under Greenland’s own drug law, with exceptions for
      authorised activities and people receiving medicines on valid prescriptions.[@law]
      Separate rules exempt qualifying products with no more than 0.2% THC when imported through
      an authorised legal entity for local distribution.[@order]
    sources:
      - law
      - order
  cultivation:
    text: >-
      Cultivation of controlled cannabis is restricted to activities permitted under the
      medicines rules.[@order] The regulation also controls experimental cultivation and
      requires safeguards against unauthorised access and removal.[@order]
    sources:
      - order
  enforcement:
    text: >-
      Breaches of the possession and supply prohibitions can lead to measures under Greenland’s
      Criminal Code.[@law] Repeated sales of particularly harmful substances, and supply
      intended for resale at schools or specified youth settings, are aggravating
      circumstances.[@law] In June 2026 the government highlighted stronger customs staffing and
      prevention.[@response]
    sources:
      - law
      - response
  sharing:
    text: >-
      Delivering or receiving controlled drugs is prohibited outside the law’s pharmacy,
      prescription and special-permission routes.[@law] Supplying them without payment for later
      resale at schools, concerts, festivals or other specified settings is an aggravating
      circumstance.[@law]
    sources:
      - law
  consumption:
    text: >-
      Controlled drugs may be used only for medical or scientific purposes.[@order] Qualifying
      low-THC cannabis products have a separate exception requiring authorised importation and
      local distribution.[@order]
    sources:
      - order
  access:
    text: >-
      The law permits people to receive controlled medicines from the national or hospital
      pharmacies under prescription rules.[@law] The low-THC route requires a permitted
      importer, a THC maximum of 0.2% and receipt at storage controlled by the importer before
      distribution.[@order]
    sources:
      - law
      - order
context:
  production:
    status: medical
    text: >-
      Controlled cannabis cultivation, manufacture and conversion must follow Greenland’s
      medicines rules, including protection against unauthorised access.[@order] The current
      low-THC exception is linked to authorised imports and distribution through local
      storage.[@order]
    sources:
      - order
  products:
    text: >-
      The cannabis listing covers above-ground plant parts from which resin has not been
      removed, excluding isolated seeds and hemp fibres.[@schedule] Products with no more than
      0.2% THC can fall outside the controlled-drug definition when the authorised-import and
      local-distribution conditions are met.[@order]
    sources:
      - schedule
      - order
  medical:
    text: >-
      Greenland’s law permits pharmacy supply and possession of controlled medicines under
      prescription rules.[@law] The regulation permits receipt and possession by people
      receiving treatment and authorised institutions.[@order] Approval of medicines, including
      cannabis medicines, falls to Greenland’s medicines committee, as explained in the
      government’s 2019 answer.[@reply273]
    sources:
      - law
      - order
      - reply273
  consequences:
    text: >-
      The current law provides criminal-code measures for breaches and treats specified supply
      in youth settings as more serious.[@law] In 2026 the government said Allorfik had expanded
      cannabis treatment and counselling since 2016, with an emphasis on early intervention and
      access for families and young people.[@response]
    sources:
      - law
      - response
  clubs:
    status: none
    text: >-
      The law restricts delivery, receipt and possession to pharmacy, prescription and
      special-permission routes.[@law] The regulation confines use of controlled cannabis to
      medical and scientific purposes.[@order]
    sources:
      - law
      - order
  visitors:
    status: none
    text: >-
      The low-THC exception requires importation by an authorised legal entity and local storage
      before distribution.[@order] Controlled-drug receipt and possession follow prescription,
      treatment or other specified permissions; the government continues to prioritise customs
      checks against illicit imports.[@order, response]
    sources:
      - order
      - response
