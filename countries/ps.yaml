segments:
  possession:
    text: >-
      In the West Bank, the Palestinian Authority's Decree-Law 18 of 2015 punishes possession
      without intent to traffic with four months to one year in prison, or a fine of 1,000 to 3,000
      Jordanian dinars. Gaza applies its own, harsher rules.
    sources:
      - law
      - amend
  cultivation:
    text: Cultivation carries at least ten years.
    sources:
      - amend
  enforcement:
    text: >-
      Prison or a fine for users in the West Bank. In Gaza a court issued a death sentence in 2022
      for possession with intent to traffic, which rights groups said the law does not provide for.
    sources:
      - shams
      - law
  sharing:
    text: Trafficking carries at least ten years, up to hard labour for life.
    sources:
      - amend
  consumption:
    text: Use is covered by the same provision as personal possession.
    sources:
      - law
  access:
    text: None.
    sources:
      - amend
