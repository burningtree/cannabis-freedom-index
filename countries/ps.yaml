  access: 0
segments:
  possession:
    text: >-
      In the West Bank, holding a drug for personal use is article 17(1) of Decree-Law 18 of
      2015, as amended in 2018: six months to two years, or a fine of 1,000 to 5,000 Jordanian
      dinars, or both. Article 16 is a separate offence, for possession that is neither for
      sale nor for personal use: four months to one year, or 1,000 to 3,000 dinars, or both.
      Gaza applies its own rules.
    sources:
      - ogb
      - law
  cultivation:
    text: >-
      In the West Bank, growing for one's own use is article 17(1): six months to two years, or
      a fine of 1,000 to 5,000 Jordanian dinars, or both. Growing in order to sell is article
      21: life imprisonment of at least fifteen years and a fine of at least 15,000 dinars.
      Gaza's penalty was not read.
    sources:
      - ogb
  enforcement:
    text: >-
      In the West Bank a person who uses a drug can be sentenced to prison or a fine under
      article 17. In Gaza a court issued a death sentence in 2022 for possession with intent
      to traffic, which rights groups said the law does not provide for.
    sources:
      - ogb
      - shams
  sharing:
    text: >-
      In the West Bank, dealing in order to traffic is article 21: life imprisonment of at
      least fifteen years and a fine of at least 15,000 dinars. Supplying a drug for payment
      can bring at least ten years under article 23; without payment, at least three years.
    sources:
      - ogb
  consumption:
    text: >-
      Use is article 17(1): six months to two years, or a fine of 1,000 to 5,000 dinars, or
      both. A person who comes forward for treatment, and a first-time user whom the
      prosecutor sends to a treatment centre, is not prosecuted while they follow the
      programme. A court may suspend the sentence so the person can be treated. A repeat
      offence, or driving under the influence, raises the minimum to two years or a fine of
      2,000 to 5,000 dinars.
    sources:
      - ogb
  access:
    text: None.
    sources:
      - amend
context:
  production:
    text: None; the law has no hemp or medical exemption.
    sources:
      - amend
  products:
    text: None.
    sources:
      - amend
  medical:
    text: No medical cannabis.
    sources:
      - amend
  consequences:
    text: A conviction is a criminal record.
    sources:
      - law
  planting:
    seeds: illegal
    seeds_trade: banned
    clones: illegal
    clones_trade: banned
    text: >-
      Article 2 of Decree-Law 18 of 2015 bans importing, growing, owning, holding, buying or
      selling plants that yield drugs, or their seeds, at any stage of growth. The law defines
      cultivation as sowing or planting for germination and any care of the plants or their
      seeds. Under Article 3 the minister may license growing or seed imports for medical and
      scientific purposes.
    sources:
      - dl18
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited.
    sources:
      - amend
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. In the West Bank, holding a drug for
      personal use can bring six months to two years or a fine of 1,000 to 5,000 Jordanian
      dinars. Gaza's penalty was not read.
    sources:
      - ogb
  black_market:
    text: >-
      Figures reported by the government to the UN drugs office record 32.3 kg of herbal
      cannabis seized in 2023, against 29.3 kg in 2021, and 51.8 kg of cannabis resin
      seized in 2023, against 25.6 kg in 2021. The UN publishes them as kilogram
      equivalents, and countries count seizures differently, so the figures are not
      comparable across borders.
    sources:
      - unodc_szr
