name: Palestine
region: Asia
iso_numeric: 275
recreational: illegal
medical: none
updated: 2026-10-23
summary: >-
  In the West Bank, holding a drug for personal use can bring six months to two years, or a
  fine of 1,000 to 5,000 Jordanian dinars. Gaza's penalties are a separate system.
scores:
  possession: 1
  cultivation: 0
  enforcement: 2
  sharing: 0
