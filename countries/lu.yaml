name: Luxembourg
region: Europe
iso_numeric: 442
recreational: legal
medical: legal
updated: '2026-10-28'
summary: >-
  Adults may grow four plants from seed per household and use their harvest at home. Small
  possession elsewhere can bring a €145 warning payment or a criminal fine. There is no legal
  recreational retail market.
scores:
  possession: 4
  cultivation: 4
  enforcement: 6
  sharing: 1
  consumption: 3
  access: 1
segments:
  possession:
    currency: EUR
    penalties:
      - upto: 3 g
        treatment: criminal
        fine: 500
        note: >-
          Away from the authorised home; €145 warning payment is an alternative to court.
          Lawfully grown harvest may be kept at home
        fine_min: 25
        term: Unauthorised personal possession
      - over: 3 g
        treatment: criminal
        prison_min: 8 days
        prison: 6 months
        fine: 2500
        note: >-
          Unauthorised personal possession; the home-grown harvest exception remains separate;
          prison or a fine, or both
        fine_min: 251
        term: Unauthorised personal possession
    text: >-
      Adults may keep the harvest of their lawful home-grown plants at home. Away from the
      authorised home, personal possession up to 3 g can be settled by a €145 warning payment;
      the court alternative is a €25–500 criminal fine. Above 3 g, the personal-possession range
      is eight days to six months and/or €251–2,500.[@loi2023]
    sources:
      - loi2023
  cultivation:
    currency: EUR
    penalties:
      - upto: 4 plants
        treatment: legal
        note: >-
          Adults, from seed, per household, at the authorised residence and hidden from public
          view
        term: Cultivation
      - over: 4 plants
        treatment: criminal
        prison_min: 8 days
        prison: 5 years
        fine: 250000
        term: Cultivation
        fine_min: 500
        note: Prison or a fine, or both
      - label: Cultivation outside the authorised residence
        treatment: criminal
        prison_min: 8 days
        prison: 5 years
        fine: 250000
        note: Applies even within the four-plant cap; Prison or a fine, or both
        term: Cultivation
        fine_min: 500
    text: >-
      Adults may grow four plants per household from seed at their home or habitual residence,
      out of public view. More than four plants, or cultivation outside the authorised location,
      carries eight days to five years and/or €500–250,000.[@loi2023]
    sources:
      - loi2023
  enforcement:
    text: >-
      Home cultivation and use are allowed within the conditions. Small unauthorised possession
      can receive a €145 warning payment or a criminal fine. More than 3 g, breaches of the
      cultivation conditions and use in specified settings can bring prison.[@homeguide]
    sources:
      - homeguide
  sharing:
    text: >-
      Selling, offering, importing or otherwise putting cannabis into circulation carries one to
      five years and/or €500–€1,250,000 under Article 8.[@druglaw] Specified locations raise the
      minimums to two years and €1,000; supplying minors or causing specified serious injury can
      bring five to ten years and €1,250–€1,250,000.[@druglaw] Organised activity or supply
      resulting in death can bring fifteen to twenty years and €1,250–€1,250,000, with life
      imprisonment where the death-related offence concerns a minor.[@druglaw] Facilitating
      another person’s cannabis use carries a separate €251–€25,000 fine.[@loi2023]
    sources:
      - druglaw
      - loi2023
    currency: EUR
    penalties:
      - label: Supply, sale or import
        treatment: criminal
        term: Supply
        prison_min: 1 year
        prison: 5 years
        fine_min: 500
        fine: 1250000
        note: Prison or a fine, or both; Article 8
      - label: Supply in specified locations
        treatment: criminal
        term: Supply
        prison_min: 2 years
        prison: 5 years
        fine_min: 1000
        fine: 1250000
        note: >-
          Prison or a fine, or both; prisons, schools, social-service centres or specified
          nearby activities
      - label: Supply to minors or causing specified serious injury
        treatment: criminal
        term: Aggravated supply
        prison_min: 5 years
        prison: 10 years
        fine_min: 1250
        fine: 1250000
        note: Article 9
      - label: Organised activity or supply causing death
        treatment: criminal
        term: Aggravated supply
        prison_min: 15 years
        prison: 20 years
        fine_min: 1250
        fine: 1250000
        note: Article 10
      - label: Death-related supply offence concerning a minor
        treatment: criminal
        term: Aggravated supply
        life: mandatory
        note: Article 10, second paragraph
      - label: Facilitating another person’s use
        treatment: criminal
        term: Facilitating cannabis use
        fine_min: 251
        fine: 25000
        note: Article 7-1(3)
  consumption:
    text: >-
      Adults may consume their lawful harvest at home.[@loi2023] Unauthorised public use can
      bring a €145 warning payment or €25–€500 criminal fine.[@loi2023] Using in front of
      minors, in schools or at work carries eight days to six months and/or
      €251–€2,500.[@loi2023] Offering cannabis to minors carries six months to two years and/or
      €500–€25,000.[@loi2023]
    sources:
      - loi2023
    currency: EUR
    penalties:
      - label: Lawful harvest at home
        treatment: legal
        term: Private consumption
      - label: Unauthorised public use
        treatment: criminal
        term: Cannabis use
        fine_min: 25
        fine: 500
        note: €145 warning payment may settle the case
      - label: Use before minors, at school or work
        treatment: criminal
        term: Cannabis use
        prison_min: 8 days
        prison: 6 months
        fine_min: 251
        fine: 2500
        note: Prison or a fine, or both; Article 7-1(4)
  access:
    text: >-
      The [2023 home-growing law](/history/luxembourg-home-grow-2023/) provides a personal
      harvest route, without recreational shops or licensed clubs.[@loi2023] Medical cannabis is
      prescribed by specially trained doctors and dispensed through hospital pharmacies under
      the [2018 medical law](/history/luxembourg-medical-2018/).[@druglaw]
    sources:
      - loi2023
      - druglaw
context:
  production:
    status: hemp
    text: >-
      Recreational commercial growing and supply remain subject to the drug-law
      offences.[@druglaw] The schedule separately excludes authorised agricultural hemp
      varieties and qualifying non-intoxicating commercial varieties below 1% THC.[@schedule]
      The medical programme uses centrally procured products dispensed by hospital
      pharmacies.[@medreport]
    sources:
      - druglaw
      - schedule
      - medreport
  medical:
    text: >-
      Patients obtain prescribed cannabis free from hospital pharmacies, through a doctor with
      the required certified training.[@patientguide] Eligibility covers specified severe pain
      conditions, chemotherapy-related nausea or vomiting, and multiple-sclerosis spasticity;
      patients must meet a residence, nationality or Luxembourg insurance
      condition.[@patientguide] From January 2025 the programme reduced the flower allowance to
      60 g per 28 days and stopped restocking THC-dominant flower, with existing stock
      dispensable until exhausted.[@med2025,medfaq] CBD-dominant and balanced flower and three
      cannabinoid profiles of oil remained in the announced programme.[@med2025]
    sources:
      - patientguide
      - med2025
      - medfaq
  consequences:
    text: >-
      Paying the €145 warning within forty-five days stops prosecution under the
      small-possession procedure.[@loi2023] Immediate payment entails surrender of the cannabis
      for destruction; a contested allegation leads to seizure for analysis.[@loi2023]
      Court-imposed criminal fines follow a separate route.[@loi2023]
    sources:
      - loi2023
  planting:
    seeds: legal
    seeds_trade: open
    clones: illegal
    clones_trade: banned
    text: >-
      Adults may grow up to four plants from seed per household at the authorised
      residence.[@loi2023] Seed labels must identify the producer, quantity and health
      warning.[@loi2023] The household permission expressly covers seed propagation; it provides
      no corresponding permission for cuttings.[@loi2023]
    sources:
      - loi2023
  visitors:
    status: none
    text: >-
      Recreational shops are not authorised.[@homeguide] A visitor carrying up to 3 g away from
      an authorised residence can receive the €145 warning payment or a criminal fine; larger
      amounts can bring prison.[@loi2023] Medical eligibility is broader than residence alone:
      Luxembourg nationality or insurance can also qualify a patient, subject to the programme’s
      medical conditions.[@patientguide]
    sources:
      - homeguide
      - loi2023
      - patientguide
  driving:
    status: limit
    text: >-
      A THC concentration of 1 ng/mL or more in blood serum is a drug-driving offence under the
      amended road-traffic law.[@healthfaq] In 2024 the mobility minister said no increase or
      penalty reduction was planned, and medical cannabis patients receive no separate status.
      Home-growing legalisation changed nothing on the road.[@lf24]
    sources:
      - healthfaq
      - lf24
  black_market:
    text: >-
      RELIS’s 2025 factsheet records 426.1 kg of cannabis resin and 99 kg of herb seized
      nationally in 2023; much of the resin was in transit.[@relis2025] Its 2024 laboratory
      samples averaged 16.4% THC for herb and 33.5% for resin.[@relis2025] In a [May 2026
      parliamentary answer](/history/luxembourg-synthetic-cannabinoid-samples-2026/), ministers
      reported synthetic cannabinoids in five samples sold as CBD/THC-A products by 15
      April.[@synthetics2026]
    sources:
      - relis2025
      - synthetics2026
  arrests:
    text: >-
      EUDA records 1,014 cannabis-related drug-law offences in Luxembourg in 2024, including 880
      for use or possession for use.[@euda_dlo] These are offences, rather than a cannabis-only
      arrest or prisoner count.[@euda_dlo] The separate police figure reported for 2024 was 207
      arrests involving all drugs.[@pj25]
    sources:
      - euda_dlo
      - pj25
  clubs:
    status: none
    text: >-
      The [2023 law](/history/luxembourg-home-grow-2023/) permits household growing and private
      use, while supply and facilitating another person’s use remain
      punishable.[@loi2023,druglaw] It provides no licensed growing-association
      route.[@loi2023] The 2018–2019 European club survey identified no active Luxembourg
      club.[@pardal20]
    sources:
      - loi2023
      - druglaw
      - pardal20
  recreational:
    text: >-
      Home growing is the lawful personal supply route: adults can raise four plants from seed
      per household at their usual residence.[@loi2023] The permission does not create shops or
      a right to pass cannabis to another household.[@homeguide] Carrying the harvest away from
      home brings the separate possession rules into play.[@loi2023]
    sources:
      - loi2023
      - homeguide
  hemp:
    status: high
    text: >-
      The controlled-drug schedule excludes hemp varieties eligible under the EU agricultural
      support system and qualifying non-intoxicating commercial varieties with less than 1%
      THC.[@schedule] The agricultural reference of 0.3% and food-safety limits serve different
      purposes.[@foodhemp] Smokable or vaporisable hemp flower and resin below 1% THC have been
      subject to excise and VAT since [March
      2019](/history/luxembourg-hemp-excise-2019/).[@excise] Cannabinoid-rich CBD food extracts
      require novel-food authorisation.[@foodhemp]
    sources:
      - schedule
      - foodhemp
      - excise
