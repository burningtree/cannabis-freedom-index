name: Luxembourg
region: Europe
iso_numeric: 442
recreational: legal
medical: legal
updated: '2026-10-27'
summary: >-
  Adults may grow four plants from seed per household and use their harvest at home. Small
  possession elsewhere can bring a €145 warning payment or a criminal fine. There is no legal
  recreational retail market.
scores:
  possession: 4
  cultivation: 4
  enforcement: 6
  sharing: 1
  consumption: 3
  access: 1
segments:
  possession:
    currency: EUR
    penalties:
      - upto: 3 g
        treatment: criminal
        fine: 500
        note: >-
          Away from the authorised home; €145 warning payment is an alternative to court. Lawfully
          grown harvest may be kept at home
      - over: 3 g
        treatment: criminal
        prison_min: 8 days
        prison: 6 months
        fine: 2500
        note: Unauthorised personal possession; the home-grown harvest exception remains separate
    text: >-
      Adults may keep the harvest of their lawful home-grown plants at home. Away from the
      authorised home, personal possession up to 3 g can be settled by a €145 warning payment; the
      court alternative is a €25–500 criminal fine. Above 3 g, the personal-possession range is
      eight days to six months and/or €251–2,500.[@loi2023]
    sources:
      - loi2023
  cultivation:
    currency: EUR
    penalties:
      - upto: 4 plants
        treatment: legal
        note: >-
          Adults, from seed, per household, at the authorised residence and hidden from public
          view
      - over: 4 plants
        treatment: criminal
        prison_min: 8 days
        prison: 5 years
        fine: 250000
      - label: Cultivation outside the authorised residence
        treatment: criminal
        prison_min: 8 days
        prison: 5 years
        fine: 250000
        note: Applies even within the four-plant cap
    text: >-
      Adults may grow four plants per household from seed at their home or habitual residence, out
      of public view. More than four plants, or cultivation outside the authorised location,
      carries eight days to five years and/or €500–250,000.[@loi2023]
    sources:
      - loi2023
  enforcement:
    text: >-
      Home cultivation and use are allowed within the conditions. Small unauthorised possession
      can receive a €145 warning payment or a criminal fine. More than 3 g, breaches of the
      cultivation conditions and use in specified settings can bring prison.[@homeguide]
    sources:
      - homeguide
  sharing:
    text: >-
      Not allowed. Home-grown cannabis is for the household's own use, and handing it to anyone
      else, paid or not, remains a supply offence.
    sources:
      - cms
      - mondaq
  consumption:
    text: >-
      Adults may use their lawful harvest at home. Public use can receive a €145 warning payment
      or €25–500 criminal fine. Use at work, in schools or in the presence of minors can bring
      eight days to six months and/or €251–2,500; using together with minors carries six months to
      two years and/or €500–25,000.[@homeguide]
    sources:
      - homeguide
  access:
    text: >-
      There is no legal place to buy cannabis. Seeds can be bought in shops or online; a planned
      second phase with state-regulated production and sale has not been enacted. Medical cannabis
      is dispensed through hospital pharmacies.
    sources:
      - cms
      - guide
context:
  production:
    text: >-
      No commercial production of recreational cannabis is permitted. Medical cannabis is imported
      under state contract.
    sources:
      - guide
  medical:
    text: >-
      Patients obtain prescribed cannabis free from hospital pharmacies, through a doctor with the
      required certified training.[@patientguide] Eligibility covers specified severe pain
      conditions, chemotherapy-related nausea or vomiting, and multiple-sclerosis spasticity;
      patients must meet a residence, nationality or Luxembourg insurance
      condition.[@patientguide] From January 2025 the programme reduced the flower allowance to 60
      g per 28 days and stopped restocking THC-dominant flower, with existing stock dispensable
      until exhausted.[@med2025,medfaq] CBD-dominant and balanced flower and three cannabinoid
      profiles of oil remained in the announced programme.[@med2025]
    sources:
      - patientguide
      - med2025
      - medfaq
  consequences:
    text: >-
      Paying a €145 warning and receiving a court-imposed criminal fine are different outcomes
      under the small-possession procedure.[@loi2023] Driving has a separate offence threshold of
      1 ng/mL or more in blood serum.[@healthfaq] Home-growing permission provides no exemption
      from that road rule.[@healthfaq]
    sources:
      - loi2023
      - healthfaq
  planting:
    seeds: legal
    seeds_trade: open
    clones: illegal
    clones_trade: banned
    text: >-
      Home growing is authorised only from seed: up to four plants per household. Seeds must
      be labelled with the producer's details, the number of seeds and a health warning. The
      law gives no permission to grow from cuttings, so cuttings remain cannabis that may not
      be sold.
    sources:
      - loi2023
  visitors:
    status: none
    text: >-
      Recreational shops are not authorised.[@homeguide] A visitor carrying up to 3 g away from an
      authorised residence can receive the €145 warning payment or a criminal fine; larger amounts
      can bring prison.[@loi2023] Medical eligibility is broader than residence alone: Luxembourg
      nationality or insurance can also qualify a patient, subject to the programme’s medical
      conditions.[@patientguide]
    sources:
      - homeguide
      - loi2023
      - patientguide
  driving:
    status: limit
    text: >-
      A THC concentration of 1 ng/mL or more in blood serum is a drug-driving offence under the
      amended road-traffic law.[@healthfaq] In 2024 the mobility minister said no increase or
      penalty reduction was planned, and medical cannabis patients receive no separate status.
      Home-growing legalisation changed nothing on the road.[@lf24]
    sources:
      - healthfaq
      - lf24
  black_market:
    text: >-
      Since nothing may be sold, anyone who does not grow buys illegally; reducing that was a
      stated aim of the 2023 law, and no data on whether it has worked were found. Luxembourg
      is also a transit point. Customs intercepted more than two tonnes of cannabis at the
      airport's cargo centre in 2025, and in March 2026 a single consignment of more than 123
      kg from the United States, bound for France. The public prosecutor says drugs seized in
      Luxembourg are as a rule destined for other European countries, not the home market, and
      that the volumes point to structured networks.
    sources:
      - pj26
      - pplu25
  arrests:
    text: >-
      The EU drugs agency's statistical bulletin records 1,014 cannabis-related drug law
      offences in Luxembourg in 2024, against 1,102 in 2023. Of the 2024 total, 880 were for
      use or possession for use. The police annual report for 2024 separately records 207
      arrests for drugs of all kinds, up 37% on the year before; holding up to 3 g in public
      is normally settled with a fine of 145 euros. Countries count these differently
      (offences or offenders, criminal or administrative), so the figure is not comparable
      across borders.
    sources:
      - euda_dlo
      - pj25
  clubs:
    status: none
    text: >-
      No clubs are known, and the law gives them no place. The 2023 law allows growing at home
      and nothing else: there is no licensed retail and no provision for cannabis clubs, and
      selling, swapping or giving cannabis to another person remains prohibited. A Europe-wide
      survey in 2018 and 2019 found no active club in Luxembourg. A public petition in 2025
      asked parliament to create a legal framework for clubs as an addition to home growing;
      after twelve days it had about 100 of the 5,500 signatures needed for a debate, and the
      press noted that the club model had hardly been seriously discussed in the country. A
      plan for state-controlled shops was dropped in 2022.
    sources:
      - pplu25
      - pardal20
      - le25
  recreational:
    text: >-
      Home growing is the lawful personal supply route: adults can raise four plants from seed per
      household at their usual residence.[@loi2023] The permission does not create shops or a
      right to pass cannabis to another household.[@homeguide] Carrying the harvest away from home
      brings the separate possession rules into play.[@loi2023]
    sources:
      - loi2023
      - homeguide
  hemp:
    status: standard
    text: >-
      Hemp from authorised industrial varieties is treated separately, with a field-crop THC
      reference of 0.3%.[@foodhemp] That crop threshold does not authorise the same concentration
      in food.[@foodhemp] Hemp seeds and their oil have an established food use, while
      cannabinoid-rich CBD extracts require novel-food authorisation before sale as
      food.[@foodhemp]
    sources:
      - foodhemp
