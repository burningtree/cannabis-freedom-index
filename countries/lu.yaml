summary: >-
  Since 2023 adults may grow four plants per household and consume at home. Carrying up to 3 g in
  public is a fine. There is no legal recreational market.
scores:
  possession: 4
  cultivation: 4
  enforcement: 6
  sharing: 1
  consumption: 3
  access: 1
segments:
  possession:
    text: >-
      At home there is no gram limit on what your own plants produce. In public, cannabis is still
      prohibited: carrying up to 3 g is no longer a crime but brings a €145 fine, and anything above
      3 g is a criminal offence. So possession is only really free inside your own home.
    sources:
      - mondaq
      - cms
  cultivation:
    text: >-
      Since 21 July 2023 adults may grow up to four plants per household — not per person — from
      seed, at their usual residence, indoors or out as long as the plants cannot be seen from the
      public road. Exceeding four plants or growing elsewhere is a criminal offence with fines.
    sources:
      - mondaq
      - idpc
  enforcement:
    text: >-
      Home use and growing within the limits are unpunished, and small public possession is a fixed
      fine rather than a prosecution. Above 3 g in public, more than four plants, and any supply
      remain criminal.
    sources:
      - mondaq
      - cms
  sharing:
    text: >-
      Not allowed. Home-grown cannabis is for the household's own use, and handing it to anyone
      else, paid or not, remains a supply offence.
    sources:
      - cms
      - mondaq
  consumption:
    text: >-
      Legal at home only. Consumption in public remains prohibited, and using in front of minors is
      an aggravating circumstance.
    sources:
      - idpc
      - mondaq
  access:
    text: >-
      There is no legal place to buy cannabis. Seeds can be bought in shops or online; a planned
      second phase with state-regulated production and sale has not been enacted. Medical cannabis
      is dispensed through hospital pharmacies.
    sources:
      - cms
      - guide
context:
  production:
    text: >-
      No commercial production of recreational cannabis is permitted. Medical cannabis is imported
      under state contract.
    sources:
      - guide
  products:
    text: >-
      Whatever a household makes from its four plants for its own use. Nothing may be sold; low-THC
      hemp products are sold under separate rules.
    sources:
      - guide
      - cms
  medical:
    text: >-
      Medical cannabis has been available since 2018 for a short list of conditions such as chronic
      pain, chemotherapy-related nausea and multiple-sclerosis spasticity, prescribed by trained
      doctors and dispensed free of charge by hospital pharmacies.
    sources:
      - guide
  consequences:
    text: >-
      The €145 fine leaves no criminal record. Drug-driving law uses a very low THC blood threshold,
      so a home user can be over the limit well after use.
    sources:
      - mondaq
      - guide
  planting:
    seeds: legal
    seeds_trade: open
    clones: illegal
    clones_trade: banned
    text: >-
      Home growing is authorised only from seed: up to four plants per household. Seeds must
      be labelled with the producer's details, the number of seeds and a health warning. The
      law gives no permission to grow from cuttings, so cuttings remain cannabis that may not
      be sold.
    sources:
      - loi2023
  visitors:
    status: none
    text: >-
      Nobody can buy cannabis legally in Luxembourg, resident or not. The only lawful source
      is up to four plants grown at a person's own habitual residence, which a visitor does
      not have, and passing cannabis to someone else is banned. In public a visitor is treated
      like anyone else: up to 3 g brings a fine of 145 euros, more than that is a criminal
      offence.
    sources:
      - pplu25
  driving:
    status: limit
    text: >-
      A driver may not have more than 1 nanogram of THC per millilitre of blood, a limit low
      enough that critics call it zero tolerance. The mobility minister told parliament in
      2024 that no increase is planned, that penalties will not be reduced, and that patients
      using medical cannabis get no separate status. Legalising home growing in 2023 changed
      nothing on the road.
    sources:
      - lf24
  black_market:
    text: >-
      Since nothing may be sold, anyone who does not grow buys illegally; reducing that was a
      stated aim of the 2023 law, and no data on whether it has worked were found. Luxembourg
      is also a transit point. Customs intercepted more than two tonnes of cannabis at the
      airport's cargo centre in 2025, and in March 2026 a single consignment of more than 123
      kg from the United States, bound for France. The public prosecutor says drugs seized in
      Luxembourg are as a rule destined for other European countries, not the home market, and
      that the volumes point to structured networks.
    sources:
      - pj26
      - pplu25
  arrests:
    text: >-
      The EU drugs agency's statistical bulletin records 1,014 cannabis-related drug law
      offences in Luxembourg in 2024, against 1,102 in 2023. Of the 2024 total, 880 were for
      use or possession for use. The police annual report for 2024 separately records 207
      arrests for drugs of all kinds, up 37% on the year before; holding up to 3 g in public
      is normally settled with a fine of 145 euros. Countries count these differently
      (offences or offenders, criminal or administrative), so the figure is not comparable
      across borders.
    sources:
      - euda_dlo
      - pj25
  clubs:
    status: none
    text: >-
      No clubs are known, and the law gives them no place. The 2023 law allows growing at home
      and nothing else: there is no licensed retail and no provision for cannabis clubs, and
      selling, swapping or giving cannabis to another person remains prohibited. A Europe-wide
      survey in 2018 and 2019 found no active club in Luxembourg. A public petition in 2025
      asked parliament to create a legal framework for clubs as an addition to home growing;
      after twelve days it had about 100 of the 5,500 signatures needed for a debate, and the
      press noted that the club model had hardly been seriously discussed in the country. A
      plan for state-controlled shops was dropped in 2022.
    sources:
      - pplu25
      - pardal20
      - le25
