segments:
  possession:
    text: >-
      At home there is no gram limit on what your own plants produce. In public, cannabis is still
      prohibited: carrying up to 3 g is no longer a crime but brings a €145 fine, and anything above
      3 g is a criminal offence. So possession is only really free inside your own home.
    sources:
      - mondaq
      - cms
  cultivation:
    text: >-
      Since 21 July 2023 adults may grow up to four plants per household — not per person — from
      seed, at their usual residence, indoors or out as long as the plants cannot be seen from the
      public road. Exceeding four plants or growing elsewhere is a criminal offence with fines.
    sources:
      - mondaq
      - idpc
  enforcement:
    text: >-
      Home use and growing within the limits are unpunished, and small public possession is a fixed
      fine rather than a prosecution. Above 3 g in public, more than four plants, and any supply
      remain criminal.
    sources:
      - mondaq
      - cms
  sharing:
    text: >-
      Not allowed. Home-grown cannabis is for the household's own use, and handing it to anyone
      else, paid or not, remains a supply offence.
    sources:
      - cms
      - mondaq
  consumption:
    text: >-
      Legal at home only. Consumption in public remains prohibited, and using in front of minors is
      an aggravating circumstance.
    sources:
      - idpc
      - mondaq
  access:
    text: >-
      There is no legal place to buy cannabis. Seeds can be bought in shops or online; a planned
      second phase with state-regulated production and sale has not been enacted. Medical cannabis
      is dispensed through hospital pharmacies.
    sources:
      - cms
      - guide
context:
  production:
    text: >-
      No commercial production of recreational cannabis is permitted. Medical cannabis is imported
      under state contract.
    sources:
      - guide
  products:
    text: >-
      Whatever a household makes from its four plants for its own use. Nothing may be sold; low-THC
      hemp products are sold under separate rules.
    sources:
      - guide
      - cms
  medical:
    text: >-
      Medical cannabis has been available since 2018 for a short list of conditions such as chronic
      pain, chemotherapy-related nausea and multiple-sclerosis spasticity, prescribed by trained
      doctors and dispensed free of charge by hospital pharmacies.
    sources:
      - guide
  consequences:
    text: >-
      The €145 fine leaves no criminal record. Drug-driving law uses a very low THC blood threshold,
      so a home user can be over the limit well after use.
    sources:
      - mondaq
      - guide
  planting:
    seeds: legal
    seeds_trade: open
    clones: illegal
    clones_trade: banned
    text: >-
      Home growing is authorised only from seed: up to four plants per household. Seeds must
      be labelled with the producer's details, the number of seeds and a health warning. The
      law gives no permission to grow from cuttings, so cuttings remain cannabis that may not
      be sold.
    sources:
      - loi2023
