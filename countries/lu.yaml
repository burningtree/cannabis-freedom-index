answers:
  carry:
    answer: limited
    text: >-
      Home-grown harvest may stay at home; up to 3 g elsewhere can bring a €145 warning payment
      or criminal fine
  caught:
    answer: limited
    label: Fine or prison
    text: >-
      Small unauthorised possession can bring a warning payment or criminal fine; over 3 g and
      cultivation breaches can bring prison
