segments:
  possession:
    text: >-
      Illegal under a 2008 law on drug trafficking and consumption. Possession for personal use is
      treated as an administrative or minor criminal offence depending on quantity; the one source
      describing this gives no figures.
    sources:
      - cr
  cultivation:
    text: Cultivation is a crime.
    sources:
      - wiki
  enforcement:
    text: >-
      A small country with small seizures — about 12 kg of cannabis (liamba) in 2018 — and visible
      checks at the airport and port.
    sources:
      - dn
      - cr
  sharing:
    text: Trafficking carries four to twelve years.
    sources:
      - cr
  consumption:
    text: Consumption is covered by the 2008 law.
    sources:
      - cr
  access:
    text: None.
    sources:
      - wiki
