name: São Tomé and Príncipe
region: Africa
iso_numeric: 678
recreational: illegal
medical: none
updated: 2026-10-12
summary: >-
  Personal possession, use or cultivation can bring up to three months in prison or a fine. An
  occasional consumer may be spared punishment, but giving or selling cannabis is trafficking.
scores:
  possession: 1
  cultivation: 1
  enforcement: 2
  sharing: 0
  consumption: 1
  access: 0
segments:
  possession:
    text: >-
      Acquiring or holding no more than the amount needed for three days of personal consumption
      carries up to three months in prison or a fine of up to 60 days. Above that threshold, the
      maximum rises to one year or a fine of up to 100 days.
    sources:
      - code2021
  cultivation:
    text: >-
      Growing cannabis for personal use is punished on the same three-day basis as possession: up
      to three months or a 60-day fine, rising to one year or a 100-day fine above the threshold.
      Cultivation outside the personal-use provision is trafficking, normally carrying two to
      twelve years.
    sources:
      - code2021
  enforcement:
    text: >-
      Prison remains available for a small personal amount, but the court may use a fine instead.
      An occasional consumer within the three-day threshold may be excused from punishment.
    sources:
      - code2021
  sharing:
    text: >-
      Offering, selling, distributing or giving cannabis to another person falls under the
      trafficking article, normally punishable by two to twelve years. A substantially less serious
      case carries one to five years.
    sources:
      - code2021
  consumption:
    text: >-
      Use itself is an offence. Up to the three-day personal quantity carries up to three months or
      a fine, although an occasional consumer may receive no punishment.
    sources:
      - code2021
  access:
    text: >-
      No lawful recreational source. The code provides for health-ministry authorisations involving
      controlled substances, but no operational cannabis access programme was confirmed.
    sources:
      - code2021
context:
  production:
    text: >-
      Unauthorised cultivation, production, manufacture, extraction or preparation of cannabis is
      trafficking, normally punishable by two to twelve years in prison. No lawful domestic
      cannabis production was confirmed in the sources read.
    sources:
      - code2021
  products:
    text: >-
      Schedule I-C lists cannabis leaves and flowering or fruiting tops, cannabis resin and
      cannabis oil. All remain controlled rather than available as legal consumer products.
    sources:
      - code2021
  medical:
    text: >-
      Cannabis flower, resin and oil appear in the most tightly controlled schedule. The law allows
      the health ministry to authorise controlled-drug activities for medical, veterinary,
      scientific or teaching needs, but the sources read establish no patient cannabis programme
      or available cannabis medicine.
    sources:
      - code2021
  consequences:
    text: >-
      Someone who voluntarily seeks treatment for personal drug use is guaranteed anonymity.
      Health staff must preserve professional secrecy and generally need not give police or courts
      information about the treatment.
    sources:
      - code2021
  clubs:
    status: none
    text: >-
      The law leaves no route for cannabis clubs: providing cannabis to another person is
      trafficking, while personal cultivation remains an offence.
    sources:
      - code2021
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for residents or visitors. British travel advice warns
      of severe penalties for all drug offences and tells travellers not to carry anything through
      customs for another person.
    sources:
      - fcdo
      - code2021
sources:
