name: São Tomé and Príncipe
region: Africa
iso_numeric: 678
recreational: illegal
medical: none
updated: '2026-10-24'
summary: >-
  Cannabis use, possession and personal growing are crimes. The Penal Code allows a fine instead
  of prison for a small personal quantity, and courts may excuse an occasional consumer. Giving
  cannabis to another person falls under trafficking.
scores:
  possession: 1
  cultivation: 1
  enforcement: 2
  sharing: 0
  consumption: 0
  access: 0
words:
  - { word: Liamba, lang: Portuguese (São Tomé), meaning: "cannabis; the police-press word for seized cannabis", sources: [park2025] }
segments:
  possession:
    text: >-
      Under the Penal Code, acquiring or holding up to a three-day personal quantity carries up
      to three months in prison or a fine of up to 60 days. Above that amount, the maximum is
      one year or a 100-day fine.[@code2021] A CEJ judicial training manual favours applying
      these criminal penalties where the code overlaps with the separate 2012 drug law.[@cej]
    sources:
      - code2021
      - cej
    penalties:
      - label: Up to a three-day personal quantity
        treatment: criminal
        term: Personal use
        prison: 3 months
        note: Fines run as day-fines up to 60 days, and courts may excuse an occasional consumer
      - label: Above a three-day personal quantity
        treatment: criminal
        term: Possession
        prison: 1 year
        note: Fines run as day-fines up to 100 days
  cultivation:
    text: >-
      Growing cannabis for personal use falls under the same rule as personal possession: up to
      three months or a 60-day fine, rising to one year or a 100-day fine above a three-day
      personal quantity.[@code2021] Other unauthorised cultivation falls under trafficking,
      normally carrying two to twelve years.[@code2021]
    sources:
      - code2021
    penalties:
      - label: Personal growing (three-day quantity tiers)
        treatment: criminal
        term: Personal use
        prison: 3 months
        note: Up to one year above a three-day quantity; day-fines in both bands
      - label: Other unauthorised cultivation (trafficking)
        treatment: criminal
        term: Unlicensed cultivation
        prison_min: 2 years
        prison: 12 years
        note: Normal trafficking band
  enforcement:
    text: >-
      The Penal Code allows prison or a fine for a small personal amount, and lets courts excuse
      an occasional consumer within the three-day threshold.[@code2021] Police arrested three
      men with cannabis and amphetamines in July 2025; judicial authorities imposed
      bail.[@park2025]
    sources:
      - code2021
      - park2025
  sharing:
    text: >-
      Offering, selling, distributing or giving cannabis to another person falls under
      trafficking, normally punishable by two to twelve years. A substantially less serious case
      carries one to five years; the code also has a separate rule for trafficking solely to
      obtain drugs for personal use.[@code2021]
    sources:
      - code2021
  consumption:
    text: >-
      Using cannabis is itself a crime, carrying up to three months in prison or a fine of up to
      60 days under the Penal Code. An occasional consumer within the basic personal-use rule
      may be excused from punishment.[@code2021]
    sources:
      - code2021
  access:
    text: >-
      Buying or receiving cannabis for personal use remains an offence, and supplying it to
      another person falls under trafficking. The Penal Code makes authorisation the dividing
      line for lawful controlled-drug activities.[@code2021]
    sources:
      - code2021
context:
  recreational:
    text: >-
      There is no legal recreational market. Acquiring or holding up to a three-day personal
      quantity carries up to three months in prison or a 60-day fine, and courts may excuse an
      occasional consumer; above that amount the maximum is one year or a 100-day
      fine.[@code2021] Police still call the seized drug liamba in press reports, as in the July
      2025 arrests.[@park2025]
    sources:
      - code2021
      - park2025
  hemp:
    status: none
    text: >-
      No industrial-hemp exception was verified: the Penal Code lists cannabis leaves, flowering
      tops, resin and oil as controlled drugs with no low-THC distinction, and no hemp production
      is documented.[@code2021]
    sources: [code2021]
  production:
    status: none
    text: >-
      No licensed cannabis production exists: unauthorised cultivation, production, manufacture,
      extraction or preparation falls under trafficking, normally carrying two to twelve years.
      Diverting drugs into illicit trade in breach of lawful-handling rules carries four to
      fifteen years.[@code2021]
    sources:
      - code2021
  medical:
    text: >-
      Cannabis flower, resin and oil are listed controlled drugs in Table I-C.[@code2021] The
      Penal Code recognises authorised controlled-drug activities and penalises doctors and
      pharmacists who prescribe or provide drugs for non-therapeutic purposes.[@code2021] No
      patient supply route was established.
    sources:
      - code2021
  consequences:
    text: >-
      Someone who voluntarily seeks help from a public or private health service for personal
      drug use is guaranteed anonymity. Treating health staff must keep professional secrecy and
      need not testify or give police information about the nature and progress of
      treatment.[@code2021]
    sources:
      - code2021
  clubs:
    status: none
    text: >-
      Supplying cannabis to another person falls under trafficking, and growing it for personal
      use is also an offence. The code separately punishes operators of clubs and other venues
      who allow illicit drug use or trafficking there.[@code2021]
    sources:
      - code2021
  visitors:
    status: none
    text: >-
      Visitors face the same personal-use and supply offences.[@code2021] A court may also order
      a convicted foreign national’s expulsion for up to ten years.[@code2021]
    sources:
      - code2021
  arrests:
    text: >-
      In July 2024 police Operation 971 raided cannabis fields and sales points, detaining seven
      men and two women for an initial judicial hearing, as that [operation](https://tracker.cannabisfreedom.fyi/report/sao-tome-cannabis-crop-raids-2024/)
      records.[@park2025] In July 2025 police arrested three men in São Tomé with 30 g of
      liamba, and judicial authorities imposed bail.[@park2025]
    sources:
      - park2025
  planting:
    seeds: grey
    seeds_trade: unclear
    clones: illegal
    clones_trade: banned
    text: >-
      Personal growing falls under the three-day-quantity tiers, not a legal home-grow
      allowance, and other unauthorised cultivation falls under trafficking.[@code2021] The code
      does not separately address seed possession or commerce.
    sources:
      - code2021
