segments:
  possession:
    text: >-
      Law 9 of 1987 on narcotics, amended in 2023, bans possession of cannabis in any form, seeds
      included. Sources give different ranges for personal possession — from six months to three
      years up to much longer terms — plus heavy fines. Trace amounts are prosecuted.
    sources:
      - cann
      - trip
  cultivation:
    text: Cultivation and production are banned with severe custodial penalties.
