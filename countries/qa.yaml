segments:
  possession:
    text: >-
      Law 9 of 1987 on narcotics, amended in 2023, bans possession of cannabis in any form, seeds
      included. Article 37, as quoted by a Qatari newspaper, sets six months to three years in
      prison and a fine of QR10,000 to QR20,000 for possession for personal use. A legal site's
      copy of the law gives a heavier Article 37: two to five years and QR50,000 to QR100,000
      for possessing or growing for personal use. Trace amounts are prosecuted.
    sources:
      - pen
      - cann
      - l9m
  cultivation:
    text: >-
      Growing the listed plants for trade is punished like trafficking, with ten to twenty years
      in prison and a fine of QR100,000 to QR300,000. Growing for personal use falls under the
      same article as possession for personal use.
    sources:
      - cann
      - l9m
  enforcement:
    text: >-
      Zero tolerance, with bags and passengers scanned at the airport; travellers have been
      arrested with very small quantities. A courier caught there with hashish in 2021 received
      five years, a fine of QR300,000 and deportation. A court may send an addict to a clinic
      for three months to a year in place of the sentence, and a user who comes forward for
      treatment is not prosecuted.
    sources:
      - cann
      - ap22
      - dn21
      - l9m
  sharing:
    text: >-
      Selling, or possessing with intent to sell, carries seven to fifteen years and a fine of
      QR100,000 to QR200,000; giving drugs to another person without payment three to seven
      years. Importing or producing for trade carries ten to twenty years, and repeat
      traffickers face life imprisonment or death.
    sources:
      - cann
      - l9m
  consumption:
    text: >-
      Use is a crime. The copy of the law read gives one to three years and a fine of QR10,000
      to QR20,000, or either, for use; in 2016 a man was sentenced to one year and QR10,000 for
      using drugs.
    sources:
      - l9m
      - pen16
  access:
    text: None.
    sources:
      - cann
context:
  death_penalty:
    text: >-
      Article 34 of the 1987 law provides death or life imprisonment for a repeat offence of
      importing, producing or growing for trade. Courts have passed death sentences for
      hashish: for 160 kg in 2008, in the defendant's absence, for about 600 kg of hashish and
      opium in 2013, and for 120 kg in 2016. No execution for drugs was found, and in 2013
      Qatar had reported no execution of any kind for more than a decade.
    sources:
      - cann
      - l9m
      - hoc08
      - dn13
      - pen16
  production:
    text: None.
    sources:
      - cann
  products:
    text: Reliable national information about legally available cannabis products was not established by the retained sources.
    sources: []
  medical:
    text: No medical cannabis.
    sources:
      - cann
  consequences:
    text: Non-residents convicted of drug offences are deported.
    sources:
      - cann
  planting:
    seeds: illegal
    seeds_trade: banned
    clones: illegal
    clones_trade: banned
    text: >-
      Law 9 of 1987 bans growing the listed plants (Article 28) and, in Article 29, importing,
      owning, holding, buying or selling them at any stage of growth, as well as their seeds;
      plant parts named in a separate schedule are exempt. The Minister of Public Health may
      license only government bodies and recognised research institutes to grow them or import
      seeds.
    sources:
      - l9
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited, and the law provides for the death
      penalty for the most serious drug offences.
    sources:
      - cann
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. British travel advice describes zero
      tolerance and tells visitors to expect a long prison sentence, deportation and heavy
      fines for using, possessing or smuggling drugs, cannabis and residual amounts included.
      This applies to passengers in transit, whose baggage is scanned.
    sources:
      - cann
      - fcdo
  driving:
    status: impairment
    text: >-
      Traffic Law article 57(2) prohibits driving under the influence of alcohol, drugs
      or other psychotropic substances. Its published English penalty provision, article
      94, sets one month to three years' imprisonment or a QR10,000–50,000 fine for that
      offence, without prejudice to more severe penalties in other laws. Drug-influenced
      driving carries six traffic points. The Traffic Department can suspend a licence,
      vehicle licence and number plates, or both, for up to ninety days under articles
      88–89; this administrative power is separate from the court penalty. Article 32 also
      bars public-vehicle licence applicants previously convicted of drug-influenced
      driving. The provisions reviewed do not specify a numeric THC allowance or a
      medical-cannabis defence.
    sources:
      - trafficdrug
      - trafficpenalty
      - trafficadmin
      - trafficpoints
      - trafficpublic
