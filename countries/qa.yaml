segments:
  possession:
    text: >-
      Article 37 of Law 9 of 1987, as amended by Law 3 of 2020, punishes possessing, buying,
      receiving, transporting, producing or growing a listed plant for personal use with six
      months to three years in prison and a fine of QR10,000 to QR20,000. A court may instead
      send a proven addict to a clinic for three months to a year. Article 29 bans the listed
      plants and their seeds.
    sources:
      - l9
  cultivation:
    text: >-
      Growing a listed plant for personal use is article 37: six months to three years and a fine
      of QR10,000 to QR20,000. Growing, importing or exporting a listed plant or its seeds for
      trade is article 34: death or life imprisonment and a fine of QR300,000 to QR500,000.
    sources:
      - l9
  enforcement:
    text: >-
      Zero tolerance, with bags and passengers scanned at the airport; travellers have been
      arrested with very small quantities. A courier caught there with hashish in 2021 received
      five years, a fine of QR300,000 and deportation. A court may send an addict to a clinic
      for three months to a year in place of the sentence, and a user who comes forward for
      treatment is not prosecuted.
    sources:
      - cann
      - ap22
      - dn21
      - l9
  sharing:
    text: >-
      Possessing or selling in order to trade carries ten to twenty years and a fine of QR200,000
      to QR400,000. Supplying a drug to a user, or preparing a place for use, carries the same
      sentence when it is done for payment, and five to ten years and a fine of QR100,000 to
      QR200,000 when it is done without payment. Importing or producing for trade is article 34:
      death or life imprisonment, and death on a repeat within five years.
    sources:
      - l9
  consumption:
    text: >-
      Use is the same offence as possession for personal use: six months to three years and a
      fine of QR10,000 to QR20,000. A court may send a proven addict to a clinic instead. In
      2016 a man was sentenced to one year and QR10,000 for using drugs.
    sources:
      - l9
      - pen16
  access:
    text: None.
    sources:
      - cann
context:
  death_penalty:
    text: >-
      Article 34 provides death or life imprisonment, and a fine of QR300,000 to QR500,000, for
      importing, producing or growing for trade. A repeat of that offence within five years is
      punished by death. Courts have passed death sentences for hashish: for 160 kg in 2008, in
      the defendant's absence, for about 600 kg of hashish and opium in 2013, and for 120 kg in
      2016. No execution for drugs was found, and in 2013 Qatar had reported no execution of any
      kind for more than a decade.
    sources:
      - l9
      - hoc08
      - dn13
      - pen16
  production:
    text: None.
    sources:
      - cann
  products:
    text: Reliable national information about legally available cannabis products was not established by the retained sources.
    sources: []
  medical:
    text: No medical cannabis.
    sources:
      - cann
  consequences:
    text: Non-residents convicted of drug offences are deported.
    sources:
      - cann
  planting:
    seeds: illegal
    seeds_trade: banned
    clones: illegal
    clones_trade: banned
    text: >-
      Law 9 of 1987 bans growing the listed plants (Article 28) and, in Article 29, importing,
      owning, holding, buying or selling them at any stage of growth, as well as their seeds;
      plant parts named in a separate schedule are exempt. The Minister of Public Health may
      license only government bodies and recognised research institutes to grow them or import
      seeds.
    sources:
      - l9
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited, and the law provides for the death
      penalty for the most serious drug offences.
    sources:
      - cann
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. Possessing a drug for personal use is
      article 37, as amended by Law 3 of 2020: six months to three years and a fine of QR10,000
      to QR20,000.
    sources:
      - l9
  driving:
    status: impairment
    text: >-
      Traffic Law article 57(2) prohibits driving under the influence of alcohol, drugs
      or other psychotropic substances. Its published English penalty provision, article
      94, sets one month to three years' imprisonment or a QR10,000–50,000 fine for that
      offence, without prejudice to more severe penalties in other laws. Drug-influenced
      driving carries six traffic points. The Traffic Department can suspend a licence,
      vehicle licence and number plates, or both, for up to ninety days under article
      87; this administrative power is separate from the court penalty. Article 32 also
      bars public-vehicle licence applicants previously convicted of drug-influenced
      driving. The provisions reviewed do not specify a numeric THC allowance or a
      medical-cannabis defence.
    sources:
      - trafficdrug
      - trafficpenalty
      - trafficadmin
      - trafficpoints
      - trafficpublic
  black_market:
    text: >-
      Figures reported by the government to the UN drugs office record 195 kg of herbal
      cannabis seized in 2024, against 29 kg in 2022, and 489 kg of cannabis resin seized
      in 2024, against 774 kg in 2022. The UN publishes them as kilogram equivalents, and
      countries count seizures differently, so the figures are not comparable across
      borders.
    sources:
      - unodc_szr
