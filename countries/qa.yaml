segments:
  possession:
    text: >-
      Law 9 of 1987 on narcotics, amended in 2023, bans possession of cannabis in any form, seeds
      included. Article 37, as quoted by a Qatari newspaper, sets six months to three years in
      prison and a fine of QR10,000 to QR20,000 for possession for personal use; other sources
      give much longer terms. Trace amounts are prosecuted.
    sources:
      - pen
      - cann
      - trip
  cultivation:
    text: Cultivation and production are banned with severe custodial penalties.
    sources:
      - cann
  enforcement:
    text: Zero tolerance, with strict screening at the airport.
    sources:
      - trip
      - cann
  sharing:
    text: Trafficking carries up to fifteen years; repeat traffickers face life imprisonment or death.
    sources:
      - cann
  consumption:
    text: Use is a crime.
    sources:
      - trip
  access:
    text: None.
    sources:
      - cann
