segments:
  possession:
    text: >-
      Article 37 of Law 9 of 1987, as amended by Law 1 of 2006, punishes possessing, buying,
      receiving, transporting, producing or growing a listed plant for personal use with six
      months to three years in prison and a fine of QR10,000 to QR20,000; there is no quantity
      threshold, and the law distinguishes personal use from trafficking by intent rather than
      weight. A court may instead send a proven addict to a clinic for three months to a year.
      Article 29 bans the listed plants and their seeds.[@l9,law2006]
    sources:
      - l9
      - law2006
    currency: QAR
    penalties:
      - label: Personal-use possession or growing (article 37)
        treatment: criminal
        term: Personal use
        fine: 20000
        prison_min: 6 months
        prison: 3 years
        note: No quantity threshold; clinic substitution for proven addicts
      - label: Possessing or selling in order to trade
        treatment: criminal
        term: Trafficking
        fine: 400000
        prison_min: 10 years
        prison: 20 years
        note: Ten to twenty years and QR200,000–400,000
      - label: Supplying to a user or preparing a place for use, without payment
        treatment: criminal
        term: Supply
        fine: 200000
        prison_min: 5 years
        prison: 10 years
        note: Five to ten years and QR100,000–200,000; same trade sentence as above when done for payment
  cultivation:
    text: >-
      Growing a listed plant for personal use is article 37: six months to three years and a fine
      of QR10,000 to QR20,000. Growing, importing or exporting a listed plant or its seeds for
      trade is article 34: death or life imprisonment and a fine of QR300,000 to QR500,000.[@l9]
      There is no plant-count threshold: the distinction is intent.[@l9]
    sources:
      - l9
    currency: QAR
    penalties:
      - label: Growing for personal use (article 37)
        treatment: criminal
        term: Personal growing
        prison_min: 6 months
        prison: 3 years
        fine_min: 10000
        fine: 20000
      - label: Growing or trading plants or seeds for trade (article 34)
        treatment: criminal
        term: Trafficking
        death: true
        fine_min: 300000
        fine: 500000
        note: Death or life imprisonment; death on a repeat within five years
  enforcement:
    text: >-
      Zero tolerance, with bags and passengers scanned at the airport; travellers have been
      arrested with very small quantities.[@cann] A courier caught there with hashish in 2021
      received five years, a fine of QR300,000 and deportation.[@dn21] A court may send an addict to
      a clinic for three months to a year in place of the sentence, and a user who comes forward for
      treatment is not prosecuted.[@l9]
    sources:
      - cann
      - dn21
      - l9
  sharing:
    text: >-
      Possessing or selling in order to trade carries ten to twenty years and a fine of QR200,000
      to QR400,000; life is available on a repeat.[@l9] Supplying a drug to a user, or preparing a
      place for use, carries the same sentence when it is done for payment, and five to ten years
      and a fine of QR100,000 to QR200,000 when it is done without payment.[@l9] Importing or
      producing for trade is article 34: death or life imprisonment, and death on a repeat within
      five years.[@l9] No quantity threshold applies; intent is the dividing line.[@l9]
    sources:
      - l9
    currency: QAR
    penalties:
      - label: Possession or sale for trade
        treatment: criminal
        term: Trafficking
        prison_min: 10 years
        prison: 20 years
        fine_min: 200000
        fine: 400000
        note: Life on a repeat
      - label: Supply without payment or managing a drug place
        treatment: criminal
        term: Supply
        prison_min: 5 years
        prison: 10 years
        fine_min: 100000
        fine: 200000
      - label: Import, production or cultivation for trade
        treatment: criminal
        term: Trafficking
        death: true
        fine_min: 300000
        fine: 500000
        note: Death or life; death on a repeat within five years
  consumption:
    text: >-
      Use is the same offence as possession for personal use: six months to three years and a
      fine of QR10,000 to QR20,000.[@l9] A court may send a proven addict to a clinic instead.[@l9]
      In 2016 a man was sentenced to one year and QR10,000 for using drugs.[@pen16]
    sources:
      - l9
      - pen16
  access:
    text: >-
      No legal source for personal use. The only licensed route is research cultivation or seed
      import for government bodies and recognised institutes under article 30.[@l9,cann]
    sources:
      - l9
      - cann
context:
  recreational:
    text: >-
      There is no legal recreational supply. Personal possession or growing brings six months
      to three years and QR10,000–20,000, though a court may send a proven addict to a clinic
      instead and self-seekers are not prosecuted.[@l9] Zero tolerance applies at the airport,
      where travellers have been arrested with tiny amounts.[@cann,dn21] Trading brings ten
      to twenty years; growing for trade can bring death.[@l9]
    sources:
      - l9
      - cann
      - dn21
  death_penalty:
    text: >-
      Article 34 provides death or life imprisonment, and a fine of QR300,000 to QR500,000, for
      importing, producing or growing for trade.[@l9] A repeat of that offence within five years is
      punished by death. Courts have passed death sentences for hashish: for 160 kg in 2008, in
      the defendant's absence, for about 600 kg of hashish and opium in 2013, and for 120 kg in
      2016.[@hoc08,dn13,pen16] No execution for a drug offence has been reported; Qatar's last known
      execution, in May 2020, was for murder.[@amnesty20]
    sources:
      - l9
      - hoc08
      - dn13
      - pen16
      - amnesty20
  production:
    status: none
    text: >-
      No lawful cannabis production. Article 34 bans importing, producing or growing for trade, and
      the only exception in article 30 is research by government bodies and recognised scientific
      institutes.[@l9] No commercial or patient-production route exists.[@l9]
    sources:
      - l9
  medical:
    text: >-
      No medical cannabis programme. Cannabis is a Schedule 1 narcotic, and the only licensed route
      is article 30 research cultivation or seed import for government bodies and recognised
      institutes.[@l9] No registered cannabis medicine or patient prescription route was found.[@l9]
    sources:
      - l9
  consequences:
    text: >-
      A court may order a non-resident deported after sentence under Penal Code article 77; courts
      commonly do so in drug cases, but deportation is discretionary rather than automatic.[@l9,penal]
    sources:
      - l9
      - penal
  planting:
    seeds: illegal
    seeds_trade: banned
    clones: illegal
    clones_trade: banned
    text: >-
      Law 9 of 1987 bans growing the listed plants (Article 28) and, in Article 29, importing,
      owning, holding, buying or selling them at any stage of growth, as well as their seeds;
      Schedule 5 exempts only stalk fibre and seeds roasted enough to prevent germination.[@l9]
      The Minister of Public Health may license only government bodies and recognised research
      institutes to grow them or import seeds.[@l9]
    sources:
      - l9
  hemp:
    status: none
    text: >-
      No hemp or CBD regime and no THC threshold. Article 29 bans the listed plants at every stage
      of growth as well as their seeds, and Schedule 5 exempts only stalk fibre and cannabis seeds
      roasted enough to prevent germination.[@l9] The customs prohibited-goods list also bans hemp
      seed and Cannabis sativa.[@customs] Licences to grow or import seed go only to government
      bodies and recognised research institutes.[@l9]
    sources:
      - l9
      - customs
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited, and the law provides for the death
      penalty for the most serious drug offences.[@l9,cann]
    sources:
      - l9
      - cann
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. Possessing a drug for personal use is
      article 37, as amended by Law 1 of 2006: six months to three years and a fine of QR10,000
      to QR20,000.[@l9,law2006]
    sources:
      - l9
      - law2006
  driving:
    status: impairment
    text: >-
      Traffic Law article 57(2) prohibits driving under the influence of alcohol, drugs
      or other psychotropic substances.[@trafficdrug] Its published English penalty provision, article
      94, sets one month to three years' imprisonment or a QR10,000–50,000 fine for that
      offence, without prejudice to more severe penalties in other laws.[@trafficpenalty] Drug-influenced
      driving carries six traffic points.[@trafficpoints] The Traffic Department can suspend a licence,
      vehicle licence and number plates, or both, for up to ninety days under article
      87; this administrative power is separate from the court penalty.[@trafficadmin] Article 32 also
      bars public-vehicle licence applicants previously convicted of drug-influenced
      driving.[@trafficpublic] The provisions reviewed do not specify a numeric THC allowance or a
      medical-cannabis defence.
    sources:
      - trafficdrug
      - trafficpenalty
      - trafficadmin
      - trafficpoints
      - trafficpublic
  black_market:
    text: >-
      Figures reported by the government to the UN drugs office record 195 kg of herbal
      cannabis seized in 2024, against 29 kg in 2022, and 489 kg of cannabis resin seized
      in 2024, against 774 kg in 2022.[@unodc_szr] The UN publishes them as kilogram equivalents,
      and countries count seizures differently, so the figures are not comparable across
      borders.[@unodc_szr]
    sources:
      - unodc_szr
  arrests:
    text: >-
      No annual cannabis arrest or prosecution count is published.[@pen24] Customs reported 6 kg of
      hashish in car parts at Hamad International Airport in May 2025, 1.984 kg in an electric oven
      in December 2025, 24.39 g at the Abu Samra crossing in August 2026, and 1.5 kg hidden in candy
      wrappers at the airport in September 2026.[@ql25,pen26c,qt26] Police announced two arrests in
      a trafficking raid in April 2024 without giving quantities.[@pen24]
    sources:
      - pen24
      - ql25
      - pen26c
      - qt26
  research:
    status: licensed
    text: >-
      The only institutional route doubles as the research route: the health minister may
      license government bodies and recognised research institutes to grow the listed plants
      or import seeds.[@l9] No separate research programme, trial or published study was
      established by the retained sources.
    sources:
      - l9
