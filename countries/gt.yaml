name: Guatemala
region: North America
iso_numeric: 320
recreational: illegal
medical: none
updated: "2026-10-22"
summary: >-
  Acquiring or possessing cannabis for personal consumption carries four months to two years in
  prison plus a fine. A reasonable amount for immediate use and the circumstances determine personal
  possession; the law gives no fixed gram allowance. Unauthorised growing and supply carry longer
  prison terms.
scores:
  possession: 1
  cultivation: 1
  enforcement: 1
  sharing: 1
  consumption: 1
  access: 0
segments:
  possession:
    text: >-
      Acquiring or possessing drugs for personal consumption carries four months to two years in
      prison and a Q200–Q10,000 fine. Personal use requires a reasonable quantity for immediate
      consumption and circumstances supporting that purpose. The law gives no fixed cannabis gram
      allowance.
    sources:
      - law
  cultivation:
    text: >-
      Unauthorised sowing, growing or harvesting of drug-producing seeds, plants, flowers or plant
      parts carries five to twenty years in prison and a Q10,000–Q100,000 fine. In October 2026 the
      Interior Ministry reported destroying 34,563 cannabis plants during weekend operations in
      Totonicapán and Petén.
    sources:
      - law
      - eradication2026
  enforcement:
    text: >-
      Police continue to eradicate cannabis crops: the Interior Ministry reported destroying 19,420
      plants near Momostenango and 15,143 in Ixmucané, Las Cruces, after weekend operations in
      October 2026. Prosecutors supported the work. Personal possession also remains a criminal
      offence under the drug law.
    sources:
      - eradication2026
      - law
  sharing:
    text: >-
      The trafficking offence includes unauthorised distribution, supply and transfer on any basis,
      as well as selling, storing and transporting controlled drugs or drug-producing seeds and
      plants. It carries twelve to twenty years in prison and a Q50,000–Q1,000,000 fine.
    sources:
      - law
  consumption:
    text: >-
      The law criminalises acquiring or possessing drugs for personal consumption, with four months
      to two years in prison plus a fine. It describes personal use through a reasonable amount for
      immediate consumption and the other circumstances of the case.
    sources:
      - law
  access:
    text: >-
      Recreational cannabis supply falls within the drug-law offences against unauthorised
      distribution and sale. A 2016 bill proposing licensed adult supply received an adverse
      committee opinion, followed by opposition to a medical cannabis bill in 2017.
    sources:
      - law
      - rejection2016
      - rejection2017
context:
  production:
    text: >-
      Unauthorised cultivation carries five to twenty years in prison plus a fine; unauthorised drug
      manufacture or extraction carries eight to twenty years plus a fine. The law separately allows
      strictly necessary quantities for authorised medical treatment, scientific research, analysis
      and medicine manufacture.
    sources:
      - law
  products:
    text: >-
      The drug law covers substances and the seeds, flowers, plants or plant parts from which drugs
      can be extracted. It provides for authorised medical and scientific handling and requires
      prescriptions for sales to private customers under its lawful-use rule.
    sources:
      - law
  medical:
    text: >-
      The general drug law permits strictly necessary quantities for medical treatment, scientific
      research, analysis and medicine manufacture by legally authorised people. A separate cannabis
      bill for medicinal, therapeutic and scientific production and supply received an adverse
      opinion from Congress’s Health Committee in 2017.
    sources:
      - law
      - rejection2017
  consequences:
    text: >-
      Personal-possession convictions carry a prison sentence and a fine under the drug law. The
      distinction from trafficking depends on a reasonable quantity for immediate consumption and
      the circumstances; trafficking carries twelve to twenty years in prison plus a fine.
    sources:
      - law
  planting:
    seeds: illegal
    seeds_trade: banned
    clones: illegal
    clones_trade: banned
    text: >-
      The drug law includes drug-producing seeds, flowers, plants and plant parts in its definition.
      Unauthorised sowing, growing or harvesting carries five to twenty years in prison plus a fine;
      unauthorised acquisition, transfer, storage, transport or supply of drug-producing seeds and
      plants falls within a trafficking offence carrying twelve to twenty years plus a fine.
    sources:
      - law
  clubs:
    status: none
    text: >-
      Recreational collective growing and supply fall within the offences against unauthorised
      cultivation and distribution. The 2016 proposal for five home plants and licensed commercial
      supply received an adverse committee opinion.
    sources:
      - law
      - rejection2016
      - adultbill2016
  visitors:
    status: none
    text: >-
      Recreational supply remains prohibited. Acquiring or possessing cannabis for personal
      consumption carries four months to two years in prison plus a Q200–Q10,000 fine; the law gives
      no fixed cannabis gram allowance.
    sources:
      - law
  black_market:
    text: >-
      Figures reported by the government to the UN drugs office record 1,097 kg of herbal
      cannabis seized in 2024, against 756 kg in 2023. The UN publishes them as kilogram
      equivalents, and countries count seizures differently, so the figures are not
      comparable across borders.
    sources:
      - unodc_szr
