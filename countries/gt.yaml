segments:
  possession:
    text: >-
      Possession for personal consumption is a crime under Article 39 of the 1992 drug law: four
      months to two years in prison and a fine of 200 to 10,000 quetzales. There is no gram
      threshold — the law speaks of a 'reasonable quantity for immediate consumption' and leaves the
      judge to decide whether it is use or trafficking.
    sources:
      - lig
      - tni
  cultivation:
    text: Cultivation is a serious crime with long sentences.
    sources:
      - law
      - tni
  enforcement:
    text: >-
      Prison for users is on the books and used; the absence of a threshold lets small-scale users
      be charged as traffickers.
    sources:
      - tni
  sharing:
    text: Trafficking under Article 38 carries twelve to twenty years.
    sources:
      - law
      - tni
  consumption:
    text: Use is prosecuted through the possession-for-consumption offence.
    sources:
      - tni
  access:
    text: None.
    sources:
      - lig
