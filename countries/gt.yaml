summary: >-
  Acquiring or possessing cannabis for personal consumption carries four months to two years in
  prison plus a fine. A reasonable amount for immediate use and the circumstances determine personal
  possession; the law gives no fixed gram allowance. Unauthorised growing and supply carry longer
  prison terms.
