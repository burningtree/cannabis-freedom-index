segments:
  possession:
    text: >-
      The 'personal dose' of up to 20 g of cannabis (5 g of hashish) cannot be punished: the
      Constitutional Court ruled in 1994 that personal use is protected by the right to free
      development of personality. Courts have also protected somewhat larger amounts when clearly
      for personal supply. Police can still confiscate in some public settings.
    sources:
      - wiki
      - cato
  cultivation:
    text: >-
      Up to 20 plants for personal use are not a crime, confirmed by the Supreme Court in 2015. No
      licence or registration is needed — one of the most generous home-grow allowances anywhere,
      though it rests on case law rather than a statute granting a right.
    sources:
      - idpc
      - cr
  enforcement:
    text: >-
      Users within the personal dose are not prosecuted, though stops, searches and confiscation are
      common. Trafficking carries long prison sentences.
    sources:
      - wiki
      - cato
  sharing:
    text: >-
      Buying and selling are illegal, and there is no rule protecting gifts. Passing cannabis to
      another person can be treated as supply.
    sources:
      - wiki
  consumption:
    text: >-
      The Constitutional Court struck down the blanket ban on public consumption in 2019. Use is
      allowed in public, but the police code and municipalities restrict it around schools, parks,
      sports venues and where children are present, with fines and confiscation.
    sources:
      - wiki
      - cato
  access:
    text: >-
      There is no legal adult-use market; bills to create one have repeatedly failed in Congress,
      most narrowly in the Senate. Medical products are available through pharmacies and clinics on
      prescription.
    sources:
      - cato
      - wiki
context:
  production:
    text: >-
      Since 2016 the state licenses cultivation, manufacture and export of medical cannabis, and
      many companies hold licences. Nothing may be produced for the adult-use market.
    sources:
      - wiki
  products:
    text: >-
      Home-grown flower for yourself; prescription oils, extracts and — more recently — dried flower
      in the medical channel. No legal recreational products.
    sources:
      - wiki
  medical:
    text: >-
      Medical cannabis has been fully legal since 2016. Any doctor can prescribe, mostly compounded
      preparations, with partial insurance coverage in some cases.
    sources:
      - wiki
  consequences:
    text: No record for personal use. Police-code fines apply for use in restricted places.
    sources:
      - wiki
  planting:
    seeds: legal
    seeds_trade: regulated
    clones: licensed
    clones_trade: regulated
    text: >-
      Seeds for planting are handled under a justice ministry licence, and licensed producers
      may hand up to twenty seeds every six months to an unlicensed person to supply home
      growing. Home growers, who may keep up to twenty plants, may not pass seeds or plants on
      to anyone else. Micropropagated plant material counts as seed for planting and stays
      within the licence system.
    sources:
      - d811
  clubs:
    status: tolerated
    text: >-
      No law provides for cannabis clubs: there is no licence or legal category for them. An
      estimated 40 to 50 clubs and associations nevertheless operate, mostly in Bogotá, Cali
      and Medellín; there is no official count. They lean on rights that belong to individuals
      — the 20 g personal dose, home growing of up to 20 plants and court rulings on
      stockpiling and non-profit shared use — which lawyers point out do not extend to
      organisations. Some grow and share among members for a monthly or yearly fee, others are
      private rooms where each member brings their own dose; selling cannabis is the line
      clubs may not cross, and the penal code's cultivation and supply offences remain a risk.
      No closures or prosecutions of clubs were known by mid-2026, and police in Cali were
      reported to send park smokers to a club. A national federation of clubs, grouping 35
      ventures in early 2026, is preparing a regulation proposal for the health ministry.
    sources:
      - planteo
      - elpais
