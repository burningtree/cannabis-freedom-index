name: Croatia
region: Europe
iso_numeric: 191
recreational: decriminalised
medical: limited
updated: '2026-10-28'
summary: >-
  Possession for personal use has been a misdemeanour since 2013. The penalty is a fine of
  €663.61 to €2,654.46, or up to 90 days' detention. Medical cannabis is prescribable since
  2015.
scores:
  possession: 3
  cultivation: 1
  enforcement: 3
  sharing: 1
  consumption: 2
  access: 1
segments:
  possession:
    text: >-
      Personal possession is handled as a misdemeanour under Article 54(3), with a fine of
      €663.61–€2,654.46 or up to 90 days’ detention.[@zszd,nn39,eurocourt] The possession
      provision sets no gram threshold.[@zszd] The [2013
      change](/history/croatia-misdemeanour-2013/) separated personal possession from the
      criminal production and supply offences.[@kz]
    sources:
      - zszd
      - nn39
      - eurocourt
      - kz
    currency: EUR
    penalties:
      - label: Small amount for personal use (misdemeanour since 2013)
        treatment: civil
        term: Possession
        fine: 2654.46
        prison: 90 days
        note: Fine or detention; no fixed gram threshold
        fine_min: 663.61
  cultivation:
    text: >-
      Growing even a few plants for yourself remains a criminal offence: Article 190 of the
      Criminal Code counts unauthorised cultivation as production, punished with six months to
      five years in prison, and three to twelve years when the drug is meant for sale.[@kz] A
      multiple sclerosis patient who grew eleven plants for oil was sentenced to two years in
      2017 and escaped prison only by a presidential pardon in 2019.[@index19,nl19] [A
      cannabis-oil patient was pardoned in 2019.](/history/croatia-luksetic-pardon-2019/)
    sources:
      - kz
      - index19
      - nl19
    penalties:
      - label: Unauthorised cultivation as production (Article 190)
        treatment: criminal
        term: Cultivation
        prison_min: 6 months
        prison: 5 years
        note: Even a few plants for personal use count as production
      - label: Cultivation where the drug is meant for sale
        treatment: criminal
        term: Cultivation
        prison_min: 3 years
        prison: 12 years
        note: Higher range where the drug is meant for sale
  enforcement:
    text: >-
      Personal possession can bring a €663.61–2,654.46 fine or up to 90 days’
      detention.[@zszd,eurocourt] Growing and dealing remain crimes, with prison terms starting
      at six months for production and three years for sale.[@kz] [Croatia makes personal
      possession a misdemeanour in 2013.](/history/croatia-misdemeanour-2013/)
    sources:
      - zszd
      - eurocourt
      - kz
  sharing:
    text: >-
      Sale, import, holding for supply and other trafficking carry three to twelve years under
      Article 190, following the [November 2025 increase in the
      minimum](/history/croatia-trafficking-minimum-raised-2025/).[@kz,amend2025] Specified
      child, school or other protected-setting cases carry three to fifteen years; organising a
      dealer network carries at least three years, and specified supply causing death or
      widespread serious injury at least five.[@kz] Giving drugs for use or providing premises
      carries six months to five years; aggravated facilitation carries one to ten years, or
      three to fifteen if it causes death.[@kz]
    penalties:
      - label: Ordinary trafficking
        treatment: criminal
        term: Supply
        prison_min: 3 years
        prison: 12 years
        note: Article 190(2)
      - label: Protected persons or settings
        treatment: criminal
        term: Aggravated supply
        prison_min: 3 years
        prison: 15 years
        note: >-
          Article 190(3): children, specified vulnerable persons, schools, prisons or abuse of
          office
      - label: Organising a dealer network
        treatment: criminal
        term: Organised supply
        prison_min: 3 years
        note: Article 190(4)
      - label: Supply causing death or widespread serious injury
        treatment: criminal
        term: Aggravated supply
        prison_min: 5 years
        note: Article 190(5)
      - label: Giving for use or providing premises
        treatment: criminal
        term: Facilitation
        prison_min: 6 months
        prison: 5 years
        note: Article 191(1)
      - label: Aggravated facilitation
        treatment: criminal
        term: Facilitation
        prison_min: 1 year
        prison: 10 years
        note: 'Article 191(2): protected persons, multiple people or specified settings/positions'
      - label: Facilitation causing death
        treatment: criminal
        term: Facilitation
        prison_min: 3 years
        prison: 15 years
        note: Article 191(3)
    sources:
      - kz
      - amend2025
  consumption:
    text: >-
      The drug-abuse Act prohibits unauthorised use, while Article 54(3) provides the
      personal-possession misdemeanour penalty of €663.61–€2,654.46 or up to 90 days’
      detention.[@zszd,eurocourt] Its possession provision does not create a separate tariff for
      the act of consuming.[@zszd] Giving drugs to another person to consume is separately
      criminal under Article 191.[@kz]
    sources:
      - zszd
      - eurocourt
      - kz
  access:
    text: >-
      No adult-use source. Legalisation bills, including one proposing nine plants per adult,
      have been tabled without success; the government rejected the latest after a debate in
      November 2022.[@wiki,pp,nl22] [Parliament debated nine plants for every adult in
      2022.](/history/croatia-hemp-bill-debate-2022/)
    sources:
      - wiki
      - pp
      - nl22
