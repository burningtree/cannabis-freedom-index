context:
  recreational:
    text: >-
      Personal possession is a misdemeanour with a €663.61–€2,654.46 fine or up to 90 days’
      detention, and Article 54 specifies no gram threshold.[@zszd,eurocourt] Unauthorised
      growing remains criminal production, carrying six months to five years.[@kz] Growing for
      supply attracts the separate three-to-twelve-year range following the [2025
      amendment](/history/croatia-trafficking-minimum-raised-2025/).[@kz,amend2025]
    sources:
      - zszd
      - eurocourt
      - kz
      - amend2025
  production:
    status: medical
    text: >-
      The [2019 amendment](/history/croatia-medical-production-2019/) permits domestic medical
      cannabis cultivation by legal entities with a medicines or active-substance manufacturing
      licence.[@nn39] Cultivation requires Health Ministry approval, and production requires
      approval from [HALMED](https://www.halmed.hr/).[@nn39] Industrial hemp follows a separate
      registration route before sowing.[@nn39]
    sources:
      - nn39
  medical:
    text: >-
      The [2015 prescription rules](/history/croatia-medical-2015/) cover THC, dronabinol and
      nabilone for multiple sclerosis, cancer, epilepsy and AIDS.[@prescription2015] A
      prescription may cover up to thirty days and at most 7.5 g of THC per 30 days, with standardised
      preparations and specified prescription details.[@prescription2015] The [2025 market
      survey](/history/croatia-medical-market-2025/) reported no cannabis medicine on sale and
      no fully authorised producer or distributor.[@pp25]
    sources:
      - prescription2015
      - pp25
  consequences:
    text: >-
      The drug-abuse Act requires confiscation of drugs, plants and manufacturing materials
      involved in its offences.[@nn39] A drug-dependent offender may also receive compulsory
      treatment for three months to one year alongside the fine or detention.[@nn39] The
      Criminal Code separately provides confiscation of drugs, plants and production or
      consumption equipment in production and facilitation cases.[@kz] Since the [April 2024
      amendment](/history/croatia-drug-assets-confiscation-2024/), drug-production and supply
      offences generating financial benefit also fall under extended asset confiscation; assets
      disproportionate to lawful income are presumed illicit unless the offender makes their
      lawful origin plausible.[@kz,assets2024]
    sources:
      - nn39
      - kz
      - assets2024
  planting:
    seeds: illegal
    seeds_trade: banned
    clones: illegal
    clones_trade: banned
    text: >-
      The Act on Combating Drug Abuse defines growing a plant to obtain drugs as including
      "acquiring and possessing seed", sowing and planting, and Article 3 bans it outside
      medical, veterinary, scientific and teaching use.[@zszd] Industrial hemp of EU-listed
      varieties with no more than 0.2% THC is exempt, and its growers must register before
      sowing.[@zszd]
    sources:
      - zszd
  hemp:
    status: strict
    text: >-
      Industrial hemp of EU-listed varieties at no more than 0.2% THC is exempt from the growing
      ban, with registration before sowing; acquiring and possessing seed counts as growing
      outside medical, veterinary, scientific and teaching use.[@zszd] Low-THC hemp products are
      sold, but prescription medical cannabis remains practically unavailable.[@mjb,pp25]
      [Parliament debated nine plants for every adult in
      2022.](/history/croatia-hemp-bill-debate-2022/)
    sources:
      - zszd
      - mjb
      - pp25
  driving:
    status: impairment
    text: >-
      Croatian law sets no THC limit. The road-safety law punishes driving under the influence
      of drugs and the criminal code covers a driver who is not capable of driving and causes
      danger, so in both cases impairment is the test.[@euda_dd] Police may stop and test at
      random, with an oral-fluid test before a physical examination and blood and urine taken at
      a hospital.[@euda_dd] Penalties under the road law are a ban of six months to two years, a
      fine of about 1,300 to 2,660 euros and up to two months in prison; the criminal offence
      carries up to three years.[@euda_dd]
    sources:
      - euda_dd
  arrests:
    text: >-
      The EU drugs agency's statistical bulletin records 6,837 cannabis-related drug law
      offences in Croatia in 2024, against 6,701 in 2023.[@euda_dlo] Of the 2024 total, 5,874
      were for use or possession for use.[@euda_dlo] The level has been fairly steady since a
      high of 8,143 in 2018.[@euda_dlo] Countries count these differently (offences or
      offenders, criminal or administrative), so the figure is not comparable across
      borders.[@euda_dlo]
    sources:
      - euda_dlo
  research:
    status: licensed
    text: >-
      Scientific institutions may cultivate drug-producing plants and manufacture drugs with
      Health Ministry approval under Article 16.[@zszd] Teaching, analytical and other specified
      activities have separate permissions for possessing samples.[@zszd] Medical commercial
      production instead follows the medicines-licence route introduced in 2019.[@nn39]
    sources:
      - zszd
      - nn39
  clubs:
    status: none
    text: >-
      No clubs are known: a Europe-wide survey of cannabis social clubs carried out in 2018 and
      2019 found, after online searches and contact with people in the field, that there did not
      seem to be any active club in Croatia, and nothing more recent than that survey was
      found.[@pardal20] No law in Croatia provides for them; Malta (since 2021) and Germany
      (since 2024) license non-profit cannabis associations, but only under their own
      laws.[@mt_cap628,de_cang] [Malta legalised non-profit cannabis associations in
      2021.](/history/malta-legalisation-2021/) [Germany licensed them in
      2024.](/history/germany-cultivation-associations-2024/)
    sources:
      - pardal20
      - de_cang
      - mt_cap628
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for visitors.[@pp] Possession is treated as for
      residents: a €663.61–2,654.46 fine or up to 90 days’ detention under the misdemeanour
      provision.[@zszd,eurocourt] [Croatia makes personal possession a misdemeanour in
      2013.](/history/croatia-misdemeanour-2013/)
    sources:
      - pp
      - zszd
      - eurocourt
  black_market:
    text: >-
      The Interior Ministry’s [2025 statistical
      review](/history/croatia-cannabis-seizures-2025/) records nationwide seizures of 1,059.54
      kg of marijuana and 19.45 kg of hashish.[@police2025] It separately lists 3,978 cannabis
      plants.[@police2025] The 11,927 seizure incidents in the report cover all drug
      types.[@police2025]
    sources:
      - police2025
