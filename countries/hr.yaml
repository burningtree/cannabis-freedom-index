name: Croatia
region: Europe
iso_numeric: 191
recreational: decriminalised
medical: limited
updated: '2026-10-26'
summary: >-
  Possession for personal use has been a misdemeanour since 2013. The penalty is a fine of
  5,000 to 20,000 kuna, or up to 90 days' detention. Medical cannabis is prescribable since 2015.
scores:
  possession: 3
  cultivation: 1
  enforcement: 3
  sharing: 1
  consumption: 2
  access: 1
segments:
  possession:
    text: >-
      Since 1 January 2013 possession of a small amount for personal use is a misdemeanour, not a
      crime. Article 54(3) of the drug-abuse act, as amended in 2019, punishes a natural person
      with a fine of 5,000 to 20,000 kuna (about €650 to €2,650) or with up to 90 days'
      detention. The consolidated text still states the fine in kuna. No fixed gram threshold;
      courts assess personal use. Possession had been a crime from April 1996 until 2013, with
      a fine or up to a year in prison.
    sources:
      - zszd
      - nn39
      - wiki
      - tripalo
  cultivation:
    text: >-
      Growing even a few plants for yourself remains a criminal offence: Article 190 of the
      Criminal Code counts unauthorised cultivation as production, punished with six months to
      five years in prison, and three to twelve years when the drug is meant for sale. A multiple
      sclerosis patient who grew eleven plants for oil was sentenced to two years in 2017 and
      escaped prison only by a presidential pardon in 2019.
    sources:
      - kz
      - index19
      - nl19
  enforcement:
    text: >-
      A user can be fined 5,000 to 20,000 kuna or detained for up to 90 days. Growing and dealing
      are crimes under Article 190 of the Criminal Code, with prison terms starting at six months
      for production and three years for sale.
    sources:
      - zszd
      - kz
      - wiki
  sharing:
    text: >-
      Selling, offering or brokering a sale carries three to twelve years in prison under Article
      190 of the Criminal Code, and three to fifteen where a child or a school is involved. Giving
      a drug to another person to use, or providing a place to use it, carries six months to five
      years under Article 191.
    sources:
      - kz
  consumption:
    text: >-
      Use is handled under the same misdemeanour as possession: a fine of 5,000 to 20,000 kuna
      or up to 90 days' detention. Tourists are regularly fined in summer.
    sources:
      - zszd
      - wiki
  access:
    text: >-
      No adult-use source. Legalisation bills, including one proposing nine plants per adult, have
      been tabled without success; the government rejected the latest after a debate in
      November 2022.
    sources:
      - wiki
      - pp
      - nl22
context:
  production:
    text: >-
      Hemp cultivation is permitted, and a 2019 change allowed domestic production of medical
      cannabis.
    sources:
      - pp
      - zszd
  products:
    text: Prescription medical preparations and low-THC hemp products.
    sources:
      - mjb
      - pp
  medical:
    text: >-
      Legal since October 2015 for conditions such as multiple sclerosis, cancer, epilepsy and AIDS,
      on prescription, capped at 7.5 g of THC per 30 days, with no home growing. In practice there
      is little to prescribe: pharmacies ran out in March 2018 and the importer did not reorder, the
      health fund does not reimburse, and a 2025 market survey found no cannabis medicine on sale
      and no company fully authorised to produce or distribute one.[@mjb,wiki,n118,pp25] The 7.5 g
      cap measures THC over thirty days, rather than the weight of cannabis
      flower.[@prescription2015]
    sources:
      - mjb
      - wiki
      - n118
      - pp25
      - prescription2015
  consequences:
    text: >-
      A misdemeanour is not a criminal record. The court can impose the fine or up to 90 days'
      detention, and an unpaid fine can be converted.
    sources:
      - zszd
      - wiki
  planting:
    seeds: illegal
    seeds_trade: banned
    clones: illegal
    clones_trade: banned
    text: >-
      The Act on Combating Drug Abuse defines growing a plant to obtain drugs as including
      "acquiring and possessing seed", sowing and planting, and Article 3 bans it outside
      medical, veterinary, scientific and teaching use. Industrial hemp of EU-listed varieties
      with no more than 0.2% THC is exempt, and its growers must register before sowing.
    sources:
      - zszd
  driving:
    status: impairment
    text: >-
      Croatian law sets no THC limit. The road-safety law punishes driving under the influence
      of drugs and the criminal code covers a driver who is not capable of driving and causes
      danger, so in both cases impairment is the test. Police may stop and test at random,
      with an oral-fluid test before a physical examination and blood and urine taken at a
      hospital. Penalties under the road law are a ban of six months to two years, a fine of
      about 1,300 to 2,660 euros and up to two months in prison; the criminal offence carries
      up to three years.
    sources:
      - euda_dd
  arrests:
    text: >-
      The EU drugs agency's statistical bulletin records 6,837 cannabis-related drug law
      offences in Croatia in 2024, against 6,701 in 2023. Of the 2024 total, 5,874 were for
      use or possession for use. The level has been fairly steady since a high of 8,143 in
      2018. Countries count these differently (offences or offenders, criminal or
      administrative), so the figure is not comparable across borders.
    sources:
      - euda_dlo
  clubs:
    status: none
    text: >-
      No clubs are known. A Europe-wide survey of cannabis social clubs carried out in 2018 and 2019
      found, after online searches and contact with people in the field, that there did not seem to
      be any active club in Croatia. No law in Croatia provides for them; Malta (since 2021) and
      Germany (since 2024) license non-profit cannabis associations, but only under their own laws.
      Nothing more recent was found.
    sources:
      - pardal20
      - de_cang
      - mt_cap628
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone, so a visitor has no lawful way to buy
      cannabis. Possessing a drug is the same misdemeanour as for a resident: a fine of 5,000
      to 20,000 kuna or up to 90 days' detention.
    sources:
      - zszd
      - wiki
      - pp
  black_market:
    text: >-
      The EU drugs agency's statistical bulletin records 2,082 kg of herbal cannabis and
      76 kg of cannabis resin seized in Croatia in 2024, against 6,030 kg and 72 kg in
      2023. Herbal cannabis was seized on 6,485 occasions and resin on 500. Plant seizures came to 14,954 plants. Countries record seizures differently, so the
      figures are not comparable across borders.
    sources:
      - euda_szr
