name: Kyrgyzstan
region: Asia
iso_numeric: 417
recreational: illegal
medical: none
updated: 2026-10-04
summary: Small-scale possession is an administrative violation with a fine.
scores:
  possession: 3
  cultivation: 1
  enforcement: 3
  sharing: 1
  consumption: 1
  access: 0
segments:
  possession:
    text: >-
      Holding a small amount without intent to sell — below the 'significant amount' threshold of
      about 5 g of cannabis — is an administrative offence under the Code of Misdemeanours, punished
      by a fine. Above that, possession is a crime with up to five years.
    sources:
      - cr
      - glepha
  cultivation:
    text: >-
      Cultivation is a criminal offence. Cannabis grows wild over hundreds of hectares around
      Issyk-Kul and in the Chuy Valley, and the state runs eradication campaigns every year.
    sources:
      - unodc
      - cr
  enforcement:
    text: >-
      A fine for very small amounts, but the criminal threshold is low and sentences above it are
      long. Fines themselves are high relative to incomes.
    sources:
      - glepha
      - cr
  sharing:
    text: Supply is punished with seven to twelve years, more for large amounts.
    sources:
      - cr
  consumption:
    text: Use is treated as an administrative matter alongside small possession.
    sources:
      - glepha
  access:
    text: No legal source.
    sources:
      - cr
context:
  production:
    text: No licensed production.
    sources:
      - cr
  products:
    text: No legal products.
    sources:
      - cr
  medical:
    text: No medical cannabis programme.
    sources:
      - cr
  consequences:
    text: Administrative fines are not criminal convictions; unpaid fines can escalate.
    sources:
      - glepha
