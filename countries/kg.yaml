name: Kyrgyzstan
region: Asia
iso_numeric: 417
recreational: decriminalised
medical: none
updated: 2026-10-13
summary: Small-scale possession is an administrative violation with a fine.
scores:
  possession: 3
  cultivation: 1
  enforcement: 3
  sharing: 1
  consumption: 1
  access: 0
segments:
  possession:
    text: >-
      Holding a small amount without intent to sell — below the 'significant amount' threshold of
      about 5 g of cannabis — is an administrative offence under the Code of Misdemeanours, punished
      by a fine. Above that, possession is a crime with up to five years.
    sources:
      - glepha
  cultivation:
    text: >-
      Cultivation is a criminal offence. Cannabis grows wild over hundreds of hectares around
      Issyk-Kul and in the Chuy Valley, and the state runs eradication campaigns every year.
    sources:
      - unodc
  enforcement:
    text: >-
      A fine for very small amounts, but the criminal threshold is low and sentences above it are
      long. Fines themselves are high relative to incomes.
    sources:
      - glepha
  sharing:
    text: >-
      Making or supplying drugs for sale is a crime under section 267 of the Criminal Code in force
      since 2019, with heavier categories of imprisonment for a group, a large scale, an especially
      large scale or sale to a minor. Prison terms under the code run from six months to fifteen
      years.
    sources:
      - glepha
  consumption:
    text: Use is treated as an administrative matter alongside small possession.
    sources:
      - glepha
  access:
    text: No legal source.
    sources:
      - glepha
context:
  production:
    text: Reliable national information about lawful cannabis production was not established by the retained sources.
    sources: []
  products:
    text: Reliable national information about legally available cannabis products was not established by the retained sources.
    sources: []
  medical:
    text: The retained sources do not establish whether a medical cannabis programme operates.
    sources: []
  consequences:
    text: Administrative fines are not criminal convictions; unpaid fines can escalate.
    sources:
      - glepha
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited.
    sources:
      - unodc
  planting:
    seeds: grey
    seeds_trade: unclear
    clones: illegal
    clones_trade: banned
    text: >-
      The 2024 law on narcotic drugs does not mention seeds at all. It controls narcotic
      substances and what it calls living organisms that contain them, meaning those entered
      on an official list, and covers their import, export, storage, sale and other handling.
      The list itself was not read. Growing cannabis is a criminal offence, so cuttings and seedlings are covered as plants; a seed is not addressed.
    sources:
      - law69
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. Holding less than the 'significant
      amount' of about 5 g of cannabis without intent to sell is an administrative offence
      punished by a fine; above that, possession is a crime with up to five years.
    sources:
      - glepha
  black_market:
    text: >-
      Figures reported by the government to the UN drugs office record 298 kg of herbal
      cannabis seized in 2024, against 265 kg in 2023, and 240 kg of cannabis resin seized
      in 2024, against 235 kg in 2023. The UN publishes them as kilogram equivalents, and
      countries count seizures differently, so the figures are not comparable across
      borders.
    sources:
      - unodc_szr
  arrests:
    text: >-
      The interior ministry's anti-drug service reported 1,163 drug crimes detected in
      2024, 154 of them committed online, and 961 people prosecuted, among them 17 minors.
      A further 89 drug-related administrative violations brought fines. More than 15
      tonnes of narcotics, psychotropic substances and precursors were seized. The report
      gives no separate figures for cannabis.
    sources:
      - kg24
