name: Kyrgyzstan
region: Asia
iso_numeric: 417
recreational: decriminalised
medical: none
updated: '2026-10-24'
summary: >-
  Small personal possession and small unauthorised cultivation are administrative offences.
  Larger amounts and supply remain criminal; the dried-marijuana table sets the small-quantity
  ceiling at 20 grams.
scores:
  possession: 3
  cultivation: 2
  enforcement: 3
  sharing: 1
  consumption: 1
  access: 0
segments:
  possession:
    text: >-
      Small possession without intent to supply carries a fine of 200 calculated units or 40
      hours of community work.[@offences] For dried marijuana, the table includes up to 20 g in
      the small band, over 20 g through 600 g in the large band, and over 600 g in the
      especially large band.[@amounts] Large personal possession carries a fine of 1,000–2,000
      units or up to five years in prison; especially large possession carries five to ten
      years.[@criminal]
    sources:
      - offences
      - amounts
      - criminal
    currency: KGS
    penalties:
      - label: Small personal possession
        treatment: civil
        term: Small possession
        fine: 20000
        note: Fine of 200 calculated units or 40 hours of community work
      - label: Large personal possession
        treatment: criminal
        term: Large amount
        prison: 5 years
        fine_min: 100000
        fine: 200000
        note: Fine of 1,000–2,000 calculated units or up to five years
      - label: Especially large personal possession
        treatment: criminal
        term: Especially large amount
        prison_min: 5 years
        prison: 10 years
  cultivation:
    text: >-
      Small unauthorised cultivation carries an administrative fine of 125 calculated units for
      an individual. The living-organism thresholds are 80 g for the small band, over 80 g up to
      2,400 g for the large band, and over 2,400 g for the especially large band; one mature plant
      can exceed 80 g.[@amounts,offences] Landholders can also be fined for failing to destroy wild
      controlled organisms.[@offences] Large-scale cultivation, or cultivation by a group acting by
      prior agreement, carries a fine of 1,000–2,000 units or up to five years in prison; especially
      large cultivation carries five to ten years and confiscation.[@criminal]
    sources:
      - offences
      - criminal
      - amounts
    currency: KGS
    penalties:
      - label: Small unauthorised cultivation
        treatment: civil
        term: Small cultivation
        fine: 12500
        note: Up to 80 g living cannabis; fine of 125 calculated units for an individual
      - label: Large-scale or group cultivation
        treatment: criminal
        term: Large-scale cultivation
        prison: 5 years
        fine_min: 100000
        fine: 200000
        note: Over 80 g up to 2,400 g living cannabis, or group cultivation; fine or up to five years
      - label: Especially large cultivation
        treatment: criminal
        term: Especially large cultivation
        prison_min: 5 years
        prison: 10 years
        note: Over 2,400 g living cannabis; confiscation also applies
  enforcement:
    text: >-
      The small-possession offence allows a fine or community work, while larger personal
      quantities can bring prison.[@offences,criminal] In July 2026 police reported three
      arrests after testing cannabis products prepared for a festival and searching homes and a
      shop; a supply investigation was continuing.[@festival]
    sources:
      - offences
      - criminal
      - festival
  sharing:
    text: >-
      The Supreme Court says supplying drugs includes gifts, swaps, loans and debt repayments as
      well as sales.[@court] Ordinary supply carries five to eight years in prison and
      confiscation; aggravated cases carry eight to twelve or twelve to fifteen
      years.[@criminal]
    sources:
      - court
      - criminal
    penalties:
      - label: Ordinary supply
        treatment: criminal
        term: Supply
        prison_min: 5 years
        prison: 8 years
        note: Confiscation also applies
      - label: Aggravated supply
        treatment: criminal
        term: Supply
        prison_min: 8 years
        prison: 12 years
      - label: Most serious supply
        treatment: criminal
        term: Supply
        prison_min: 12 years
        prison: 15 years
  consumption:
    text: >-
      Non-medical drug use in streets, parks, public transport and other public places carries a
      fine of ten calculated units or up to 20 hours of community work. Possession is covered by
      a separate offence.[@offences]
    sources:
      - offences
    currency: KGS
    penalties:
      - label: Non-medical use in a public place
        treatment: civil
        term: Use
        fine: 1000
        note: Fine of 10 calculated units or up to 20 hours of community work
  access:
    text: >-
      Buying or holding a small personal amount remains an administrative offence, and supply is
      criminal.[@offences,criminal] The lawful-circulation rules prohibit retail trade in the
      banned narcotic list, which includes marijuana and other cannabis
      preparations.[@rules,list]
    sources:
      - offences
      - criminal
      - rules
      - list
context:
  recreational:
    text: >-
      Small personal possession and use are administrative offences; supply and larger amounts are
      criminal.[@offences,criminal] There is no legal recreational supply. Wild cannabis grows
      across the Chuy valley and is subject to eradication campaigns.[@unodc] A 2022 UNODC street
      price of about $5 a gram was recorded.
    sources:
      - offences
      - criminal
      - unodc
  production:

    status: none
    text: >-
      The 2024 law includes gathering wild controlled organisms within manufacture or production
      and requires authority for controlled-drug activities.[@law69] The implementing rules
      retain narrow scientific and official-use exceptions while prohibiting ordinary trade in
      listed cannabis preparations.[@rules,list]
    sources:
      - law69
      - rules
      - list
  medical:
    text: >-
      Cannabis oil, resin, plant material, marijuana and extracts or tinctures appear in
      narcotic list IV.[@list] The drug law prohibits medical and veterinary use of substances
      on that list; scientific and specified official-use exceptions are governed
      separately.[@law69,rules]
    sources:
      - list
      - law69
      - rules
  death_penalty:
    text: >-
      The death penalty is abolished and is not available for any drug offence. The Criminal Code's
      punishment list contains no death penalty, and life imprisonment is limited to offences outside
      the drug articles.[@criminal] The Constitutional Court blocked a 2025 attempt to reintroduce
      capital punishment on 10 December 2025.[@death25]
    sources:
      - criminal
      - death25
  research:
    status: licensed
    text: >-
      The rules allow research licences for list IV substances, which include cannabis
      preparations.[@rules,list] No cannabis research programme, clinical trial or indexed
      Kyrgyz cannabis paper was found.[@rules]
    sources:
      - rules
      - list
  hemp:
    status: none
    text: >-
      No industrial-hemp exception, THC limit or licensing scheme was found. Cannabis oil, resin,
      plant material, marijuana and extracts appear in narcotic list IV, and the drug law prohibits
      medical and veterinary use of substances on that list.[@list,law69] Wild cannabis is treated
      as a controlled plant and eradicated.[@unodc]
    sources:
      - list
      - law69
      - unodc
  consequences:
    text: >-
      The Criminal Code offers an exemption from criminal liability for certain drug offences
      when a person voluntarily surrenders the drugs and actively helps expose or stop drug
      crimes. Surrender during an arrest or a search does not count as voluntary.[@criminal]
    sources:
      - criminal
  clubs:
    status: none
    text: >-
      Giving cannabis to another person counts as supply under the Supreme Court’s
      guidance.[@court] Organising or maintaining premises for drug consumption is a separate
      offence carrying up to five years in prison in the basic case.[@criminal]
    sources:
      - court
      - criminal
  planting:
    seeds: grey
    seeds_trade: unclear
    clones: illegal
    clones_trade: banned
    text: >-
      The cannabis-straw and marijuana definitions expressly exclude seeds.[@list] Small
      unauthorised growing is nevertheless an administrative offence, and larger or group
      cultivation can be criminal; rooted cuttings and seedlings therefore require attention to
      the cultivation rules.[@offences,criminal]
    sources:
      - list
      - offences
      - criminal
  visitors:
    status: none
    text: >-
      Visitors face the same possession and supply rules: the small personal-possession offence
      permits a fine or community work, while supply can bring prison.[@offences,criminal] The
      cannabis preparations in the prohibited narcotic list have no ordinary retail route under
      the lawful-circulation rules.[@rules,list] A foreigner convicted of a drug crime can be
      expelled after serving the sentence.[@criminal]
    sources:
      - offences
      - criminal
      - rules
      - list
  driving:
    status: impairment
    text: >-
      Code of Offences article 193(1) punishes driving while intoxicated by alcohol, narcotics,
      psychotropic or other intoxicating substances with a fine of 800 calculated units, or 80,000
      som, and a two-year licence ban.[@offences] Refusing a medical examination brings 1,000 units
      and a three-year ban.[@offences] Since 5 June 2026 a repeat within a year is criminal under
      Criminal Code article 312-1, with a fine of 1,000–1,500 units or up to one year in prison.[@criminal]
      There is no numeric THC limit: the medical conclusion must find acute intoxication and identify
      the substance, so a positive test alone is not the statutory trigger.[@reg50]
    sources:
      - offences
      - criminal
      - reg50
  culture:
    text: >-
      Cannabis in Kyrgyzstan is known as [anasha](/culture/language/anasha/), the Central Asian
      word for the plant and its resin. The Chuy valley's wild hemp is the classic source, and
      eradication campaigns there have targeted it for decades.[@unodc] The atlas entry traces the
      word across the Soviet south.[@unodc]
    sources:
      - unodc
  black_market:
    text: >-
      Figures reported by the government to the UN drugs office record 299 kg of herbal cannabis
      seized in 2024, against 265 kg in 2023, and 240 kg of cannabis resin seized in 2024,
      against 235 kg in 2023.[@unodc_szr] The UN publishes them as kilogram equivalents, and countries count
      seizures differently, so the figures are not comparable across borders.[@unodc_szr]
    sources:
      - unodc_szr
  arrests:
    text: >-
      The interior ministry's anti-drug service reported 1,163 drug crimes detected in 2024, 154
      of them committed online, and 961 people prosecuted, among them 17 minors. A further 89
      drug-related administrative violations brought fines.[@kg24] More than 15 tonnes of narcotics,
      psychotropic substances and precursors were seized.[@kg24] The report gives no separate figures
      for cannabis.[@kg24]
    sources:
      - kg24
