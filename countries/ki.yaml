  medical:
    text: No medical cannabis.
    sources:
      - wiki
  consequences:
    text: A conviction is a criminal record; foreigners may be deported.
    sources:
      - wiki
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited.
    sources:
      - case
  planting:
    seeds: illegal
    seeds_trade: banned
    clones: illegal
    clones_trade: banned
    text: >-
      The Dangerous Drugs Ordinance defines Indian hemp as either of the plants Cannabis
      sativa or Cannabis indica or any portion thereof, which takes in seeds and cuttings
      alike. A separate section prohibits importing or exporting any seed of Indian hemp, and
      cultivation of the plant is an offence.
    sources:
      - ddo
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. British travel advice says possession
      or trafficking of drugs is a serious offence and that prison sentences may be heavy.
    sources:
      - wiki
      - fcdo
