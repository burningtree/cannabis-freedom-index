segments:
  possession:
    text: >-
      Illegal under the Dangerous Drugs Ordinance, which makes it an offence to be found in
      possession of Indian hemp. The maximum penalty is a fine of A$2,000 and ten years in prison.
    sources:
      - case
      - wiki
  cultivation:
    text: >-
      Knowingly cultivating Indian hemp 'whether for private use or otherwise' is an offence with
      the same maximum.
    sources:
      - case
  enforcement:
    text: Few cases reach the courts; those that do are sentenced well below the maximum.
    sources:
      - case
  sharing:
    text: Giving or selling to any person is covered by the same provision as possession.
    sources:
      - case
  consumption:
    text: Use is covered by the possession offence.
    sources:
      - wiki
  access:
    text: None.
    sources:
      - wiki
