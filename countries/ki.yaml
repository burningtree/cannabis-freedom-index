summary: >-
  Possession, cultivation and gifting are criminal offences under the inherited Dangerous Drugs
  Ordinance. A separate framework covers prescription cannabis preparations; current dispensing
  availability was not established.
scores:
  possession: 1
  cultivation: 1
  enforcement: 1
  sharing: 1
  consumption: 1
  access: 0
segments:
  possession:
    text: >-
      Section 8(b) makes possession of Indian hemp an offence. In the government-hosted 1977 revised
      text, section 39(2) provides a $2,000 fine and ten years on High Court conviction, or a fine
      not exceeding $1,000 and five years on summary conviction. These are the published statutory
      penalties, not typical sentences. Later amendments reviewed here concern proceeds in 1995 and
      datura in 2001; a complete current consolidation was not established.
    sources:
      - ddo_gov
  cultivation:
    text: >-
      Section 7 prohibits cultivating Indian hemp, and section 8(a) expressly covers knowing
      cultivation for private use or otherwise. The revised text contains no personal plant-count
      exemption. Section 39 supplies the general court-dependent penalties.
    sources:
      - ddo_gov
  enforcement:
    text: >-
      The revised ordinance provides imprisonment on both High Court and summary conviction,
      alongside fines. The previously retained 2018 judgment is a case-specific lead; it does not
      establish that few cases reach court or that sentences nationwide are usually below a
      particular level. Current sentencing patterns remain unverified.
    sources:
      - ddo_gov
  sharing:
    text: >-
      Section 8(b) expressly includes giving or selling Indian hemp to another person, within the
      same offence provision as possession. It contains no exemption for an unpaid adult gift. The
      separate prescription regulations restrict supply of controlled preparations to authorised
      channels.
    sources:
      - ddo_gov
      - reg1980
  consumption:
    text: >-
      The reviewed cannabis provision criminalises possession and cultivation, without expressly
      listing consumption as a separate act. The ordinance separately creates explicit use offences
      for prepared opium, which should not be transplanted to cannabis. Possession associated with
      use remains an offence; this is not a finding that recreational consumption is permitted under
      every applicable law.
    sources:
      - ddo_gov
  access:
    text: >-
      No operating cannabis patient service or recreational retail route was established. The legal
      framework is narrower than a blanket absence of medical permission: Schedule 2 includes
      cannabis extracts and tinctures, and the 1980 regulations authorise pharmacists to prepare
      them and regulate prescription supply and patient possession. Those provisions do not
      establish access to flower or actual medicine availability.
    sources:
      - ddo_gov
      - reg1980
context:
  production:
    text: >-
      Regulation 9(1)(a)(i) expressly authorises registered pharmacists in business to manufacture
      an extract or tincture of Indian hemp at their shop in the ordinary course of retail business.
      This limited preparation authority is distinct from cultivation, which remains prohibited
      under sections 7–8 of the ordinance. No production volumes were established.
    sources:
      - reg1980
      - ddo_gov
  products:
    text: >-
      The ordinance separately controls the cannabis plant and resin under Part II and cannabis
      extracts or tinctures under Schedule 2 Part I paragraph 7. Pharmacist preparation is expressly
      contemplated by the 1980 regulations; present product listings, stock and patient dispensing
      were not verified.
    sources:
      - ddo_gov
      - reg1980
  medical:
    text: >-
      Regulations 6 and 11–12 recognise possession following lawful prescription supply and set
      dispensing requirements. Regulation 9 expressly covers pharmacist manufacture of cannabis
      extracts or tinctures. This is a limited statutory medicines framework, not evidence of an
      operating broad medical-cannabis programme.
    sources:
      - ddo_gov
      - reg1980
  consequences:
    text: >-
      The 1995 amendment adds section 8A: possessing property reasonably suspected to be
      drug-offence proceeds without a satisfactory lawful account is an offence carrying two years.
      It also permits warrantless arrest and court-ordered forfeiture in specified circumstances.
      Section 39 separately provides forfeiture of articles involved in an offence. A
      cannabis-specific deportation rule was not established.
    sources:
      - proceeds1995
      - ddo_gov
  clubs:
    status: none
    text: >-
      Sections 7–8 prohibit cultivation for private use or otherwise and giving cannabis to another
      person. The reviewed framework contains no recreational club exemption. This is a statement
      about the law, not a verified count of informal associations.
    sources:
      - ddo_gov
  planting:
    seeds: illegal
    seeds_trade: banned
    clones: illegal
    clones_trade: banned
    text: >-
      The Dangerous Drugs Ordinance defines Indian hemp as either of the plants Cannabis sativa or
      Cannabis indica or any portion thereof, which takes in seeds and cuttings alike. A separate
      section prohibits importing or exporting any seed of Indian hemp, and cultivation of the plant
      is an offence.
    sources:
      - ddo_gov
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. British travel advice says possession or
      trafficking of drugs is a serious offence and that prison sentences may be heavy.
    sources:
      - wiki
      - fcdo
  driving:
    status: zero
    text: >-
      Traffic Act section 43 prohibits driving any vehicle, including a bicycle, under drug
      influence. Section 46 deems influence established when a saliva test shows drugs in the
      person's system, without a separate impaired-control finding or a numerical THC value in that
      provision. The drug definition includes illegal and illicit drugs and, for this Act, kava.
      Section 53(3) specifies ten to twenty penalty units and six to twelve months' licence
      disqualification for a first drug-driving conviction. A further drug offence within five years
      attracts the section 53(4) range of twenty to fifty units, one to two years' imprisonment or
      both, plus one to two years' disqualification. Penalty units are not a verified current dollar
      tariff. Section 48 permits behavioural evidence and assessment when a breath, blood or saliva
      test is unavailable. Section 47 provides a refusal presumption and a defence for medically
      demonstrated inability to give the required specimen; its breath/saliva wording needs care
      when applying it to a particular refusal. Drug-driving penalties must not be replaced with the
      separate graded alcohol schedule.
    sources:
      - traffic2017
      - trafficguidance
