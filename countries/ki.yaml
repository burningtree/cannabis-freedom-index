name: Kiribati
region: Oceania
iso_numeric: 296
recreational: illegal
medical: limited
updated: '2026-10-23'
summary: >-
  Cannabis possession, growing and gifts are offences; separate rules cover prescribed extracts and
  tinctures.
scores:
  possession: 1
  cultivation: 1
  enforcement: 1
  sharing: 1
  consumption: 1
  access: 0
segments:
  possession:
    text: >-
      Possessing cannabis is an offence under the Dangerous Drugs Ordinance.[@ddo_gov] In a 2021
      one-plant case, the High Court described the maximum as ten years in prison or a A$2,000 fine
      and imposed a A$250 fine, with one month in prison for default.[@folik]
    sources:
      - ddo_gov
      - folik
  cultivation:
    text: >-
      Cultivation is prohibited for private use or otherwise, with no personal plant-count exemption
      in the revised ordinance.[@ddo_gov] A 2015 cultivation and import case brought concurrent
      nine-month prison terms, fines and yacht forfeiture.[@morlier,morlier_report]
    sources:
      - ddo_gov
      - morlier
      - morlier_report
  enforcement:
    text: >-
      The High Court imposed a fine in a 2018 cannabis-possession case and a A$250 fine for one
      plant in 2021.[@kourabi_sentence,folik] A 2015 cultivation and import case brought nine months
      in prison and confiscation of a yacht.[@morlier,morlier_report]
    sources:
      - kourabi_sentence
      - folik
      - morlier
      - morlier_report
  sharing:
    text: >-
      Giving cannabis to another person is expressly included in the same offence as possession and
      sale. The ordinance contains no exemption for an unpaid adult gift.[@ddo_gov]
    sources:
      - ddo_gov
  consumption:
    text: >-
      Keeping cannabis for personal use is criminalised as possession. The High Court convicted a
      fisheries officer in 2018 after finding that he knowingly kept and used cannabis for about a
      month.[@kourabi]
    sources:
      - kourabi
  access:
    text: >-
      Pharmacists may prepare cannabis extracts and tinctures and supply controlled preparations
      under the prescription rules.[@reg1980] Ordinary cannabis possession, cultivation and gifts
      remain offences.[@ddo_gov]
    sources:
      - reg1980
      - ddo_gov
context:
  production:
    text: >-
      Registered pharmacists in business may manufacture cannabis extracts and tinctures at their
      shops in the ordinary course of retail business. The preparations must be kept in a locked
      receptacle.[@reg1980]
    sources:
      - reg1980
  products:
    text: >-
      The ordinance controls cannabis plants and resin separately from the scheduled extracts and
      tinctures.[@ddo_gov] The prescription regulations expressly cover pharmacist preparation of
      those extracts and tinctures.[@reg1980]
    sources:
      - ddo_gov
      - reg1980
  medical:
    text: >-
      Lawful prescription supply authorises possession of controlled preparations, and registered
      pharmacists may prepare cannabis extracts and tinctures.[@reg1980] In 2016, a sailor’s
      prescribed marijuana remained a prohibited import; the court considered his health when
      choosing a fine.[@afonso]
    sources:
      - reg1980
      - afonso
  consequences:
    text: >-
      Courts may confiscate articles involved in a drug offence: a 2015 sentence forfeited a yacht,
      engines and radios.[@morlier,morlier_report] The 1995 amendment separately targets property
      suspected to be drug-offence proceeds when the holder cannot give a satisfactory lawful
      account.[@proceeds1995]
    sources:
      - morlier
      - proceeds1995
      - morlier_report
  clubs:
    status: none
    text: >-
      Cultivating cannabis for private use or otherwise, and giving it to another person, are
      prohibited. The reviewed ordinance provides no recreational club exemption.[@ddo_gov]
    sources:
      - ddo_gov
  planting:
    seeds: illegal
    seeds_trade: banned
    clones: illegal
    clones_trade: banned
    text: >-
      Indian hemp includes cannabis plants and their parts; the ordinance separately prohibits
      importing or exporting cannabis seeds and criminalises cultivation.[@ddo_gov] A man who kept a
      single small plant in his garden was convicted of possession and fined in 2021.[@folik]
    sources:
      - ddo_gov
      - folik
  visitors:
    status: none
    text: >-
      The ordinance prohibits imports of Indian hemp.[@ddo_gov] In 2016, a Portuguese sailor was
      fined A$1,600 on a marijuana charge even though the judge accepted it was prescribed
      treatment; his yacht was not confiscated.[@afonso]
    sources:
      - ddo_gov
      - afonso
  driving:
    status: zero
    text: >-
      The Traffic Act prohibits drug-influenced driving of any vehicle, including a bicycle, and
      deems influence established when a saliva test shows drugs in the driver’s system. A first
      drug-driving conviction carries ten to twenty penalty units and six to twelve months’ licence
      disqualification. A further offence within five years carries twenty to fifty units, one to
      two years in prison or both, plus one to two years’ disqualification. Behavioural evidence and
      assessments may be used when testing is unavailable.[@traffic2017]
    sources:
      - traffic2017
