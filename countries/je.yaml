name: Jersey
region: Europe
iso_numeric: 832
dependency:
  of: gb
  kind: Crown Dependency
  note: >-
    Jersey is a self-governing Crown Dependency. It is not part of the United Kingdom, and its
    States Assembly makes its own drug laws; the United Kingdom answers for it internationally,
    including under the UN drug conventions.
recreational: illegal
medical: legal
updated: '2026-10-28'
summary: >-
  Cannabis is a Class B drug, but small amounts are usually settled at a Parish Hall enquiry
  with a written caution or a fine, neither of which appears on the person's criminal record.
  Private medical prescriptions are unusually common, and the island licenses medical cannabis
  growers. A decriminalisation debate was put off until after the 2026 election.
scores:
  possession: 2
  cultivation: 1
  enforcement: 3
  sharing: 1
  consumption: 1
  access: 3
segments:
  possession:
    text: >-
      Cannabis is a Class B drug; court prosecution for possession carries up to five years or a
      fine, or both.[@mdl] The Attorney General’s directions allow a first or qualifying second
      written caution for up to 15 g of herb or resin, with the second normally requiring a year
      since the first.[@guidance] For eligible third offences, a Centenier can impose a £200
      fine when the person admits the offence and there is no evidence of dealing or onward
      distribution.[@guidance] A [Parish Hall fine](/history/jersey-centenier-drug-fines-2024/)
      stays off the criminal record but remains in police records.[@p116]
    sources:
      - mdl
      - guidance
      - p116
    penalties:
      - upto: 15 g
        treatment: criminal
        term: Parish Hall written caution
        note: Discretionary first or qualifying second offence; no dealing or onward distribution
      - label: Eligible third personal offence at Parish Hall
        treatment: criminal
        term: Article 28A; Attorney General directions
        repeat: 3
        fine: 200
        note: Admission and acceptance required; within the guidance quantity ceiling
      - label: Possession prosecuted in court
        treatment: criminal
        term: Article 8(1), Schedule 4
        prison: 5 years
        note: Prison or a fine, or both
    currency: GBP
  cultivation:
    text: >-
      Unauthorised cultivation is production of a Class B drug, with up to fourteen years in
      prison or a fine, or both.[@mdl] Personal growing has no general exemption.[@mdl]
      Ministerial cultivation licences provide a separate commercial route for medical cannabis
      and low-THC industrial hemp.[@scrutiny22]
    sources:
      - mdl
      - scrutiny22
    penalties:
      - label: Unauthorised cannabis production
        treatment: criminal
        term: Article 5, Schedule 4
        prison: 14 years
        note: Prison or a fine, or both; no general personal-plant exemption
  enforcement:
    text: >-
      The Attorney General directs eligible small personal cases toward Parish Hall cautions and
      summary fines.[@guidance] The directions retain discretion and require no evidence of
      dealing or onward distribution.[@guidance] They cover herb and resin up to 15 g; cannabis
      oil is listed with zero tolerance, while oil in confectionery requires case-by-case
      referral to the Attorney General.[@guidance]
    sources:
      - guidance
  sharing:
    text: >-
      Supplying, offering to supply or possessing cannabis with intent to supply it carries up
      to fourteen years or a fine, or both.[@mdl] The law includes unpaid supply to another
      person.[@mdl] The Parish Hall caution directions exclude evidence of dealing or onward
      distribution.[@guidance]
    sources:
      - mdl
      - guidance
    penalties:
      - label: Supply, offer to supply or possession with intent to supply
        treatment: criminal
        term: Articles 5 and 8(2), Schedule 4
        prison: 14 years
        note: Prison or a fine, or both
  consumption:
    text: >-
      Ordinary cannabis use is addressed through the possession offence in the drug law.[@mdl]
      Allowing premises to be used for prohibited cannabis smoking or supply is separately
      criminalised.[@mdl] The proposed personal-use reform remained marked withdrawn on the
      Assembly’s published record when reviewed.[@p116]
    sources:
      - mdl
      - p116
  access:
    text: >-
      Doctors can prescribe medicinal cannabis and pharmacies dispense it under controlled-drug
      rules.[@audit24] A [July 2026 disclosure](/history/jersey-medical-dispensing-total-2026/)
      records 72,065 cannabis-based medicinal products dispensed during 2025.[@dispense26] This
      is a product-item count, not a count of unique patients or consultations.[@dispense26]
    sources:
      - audit24
      - dispense26
context_not_applicable:
  death_penalty:
    text: >-
      The drug law’s Schedule 4 punishes cannabis offences with finite prison terms or fines, or
      both, without a capital penalty.[@mdl]
    sources:
      - mdl
context:
  recreational:
    text: >-
      Adults have no lawful general recreational supply or home-growing allowance.[@mdl]
      Eligible small possession and personal-import cases can end at Parish Hall with a caution
      or fine.[@guidance] The [2025 reform
      proposition](/history/jersey-reform-debate-deferred-2026/) is marked withdrawn on the
      Assembly’s record.[@p116]
    sources:
      - mdl
      - guidance
      - p116
  production:
    status: medical
    text: >-
      Businesses need separate licences for cannabis cultivation and handling controlled
      products.[@scrutiny22] The Assembly’s [2022 scrutiny
      report](/history/jersey-medical-industry-scrutiny-2022/) identifies low-THC industrial
      hemp, higher-THC cultivation, and production/supply permissions as distinct licence
      categories.[@scrutiny22] It describes security, planning and ministerial oversight of the
      medicinal industry.[@scrutiny22]
    sources:
      - scrutiny22
  medical:
    text: >-
      Patients receive medicinal cannabis as an unlicensed medicine that may lawfully be
      prescribed.[@audit24] Pharmacists must submit monthly dispensing returns to the Chief
      Pharmacist.[@audit24] The [2024 audit](/history/jersey-medical-dispensing-audit-2024/)
      examined 2022 and the first half of 2023, including prescribing volumes and overlapping
      prescribers.[@audit24] The July 2026 disclosure adds the full-year 2025 item total but no
      unique-patient count.[@dispense26]
    sources:
      - audit24
      - dispense26
  consequences:
    text: >-
      Parish Hall cautions and Centenier fines do not appear on the person’s criminal
      record.[@p116] The government’s proposal explains that they remain in police records
      indefinitely, because the rehabilitation law does not address them.[@p116] Court
      prosecution can instead result in a conviction under the drug law.[@mdl]
    sources:
      - p116
      - mdl
  clubs:
    status: none
    text: >-
      Supplying cannabis to another person requires lawful authority under the drug law.[@mdl]
      The legislation provides no general recreational collective-growing or membership-supply
      exemption.[@mdl] Medical and industrial growing are licensed activities under the separate
      routes described by the Assembly’s scrutiny report.[@scrutiny22]
    sources:
      - mdl
      - scrutiny22
  visitors:
    status: none
    text: >-
      Visitors have no general recreational retail supplier.[@mdl] The current caution guidance
      expressly allows discretion for short-stay visitors, where attending the Alcohol and Drugs
      Service would be impractical.[@guidance] Eligibility conditions still apply, including
      quantity and absence of onward supply.[@guidance]
    sources:
      - mdl
      - guidance
  hemp:
    status: strict
    text: >-
      Industrial hemp growing is licensed separately from higher-THC cannabis.[@scrutiny22] The
      2022 scrutiny report identifies the low-THC cultivation licence as covering plants with no
      more than 0.2% THC.[@scrutiny22] The drug law separately excludes mature stalk, its fibre
      and seeds once separated from the plant; flowers and leaves remain controlled
      material.[@mdl]
    sources:
      - scrutiny22
      - mdl
  planting:
    seeds: grey
    seeds_trade: open
    clones: licensed
    clones_trade: regulated
    text: >-
      Seeds separated from the plant are excluded from the drug law’s cannabis definition.[@mdl]
      Germinating them creates a plant, and unauthorised production remains criminal.[@mdl]
      Cultivation licences and controlled-product permissions supply the route for authorised
      growers and their plant material.[@scrutiny22]
    sources:
      - mdl
      - scrutiny22
