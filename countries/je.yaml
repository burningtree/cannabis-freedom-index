name: Jersey
region: Europe
iso_numeric: 832
dependency:
  of: gb
  kind: Crown Dependency
  note: >-
    Jersey is a self-governing Crown Dependency. It is not part of the United Kingdom, and its
    States Assembly makes its own drug laws; the United Kingdom answers for it internationally,
    including under the UN drug conventions.
population:
  2024: 104540
cannabis_use:
  prevalence: 5.7
  estimate: true
  users: 3900
recreational: illegal
medical: legal
updated: 2026-10-17
summary: >-
  Cannabis is a Class B drug, but small amounts are usually settled at a Parish Hall enquiry with a
  written caution or a fine and no criminal conviction. Private medical prescriptions are unusually
  common, and the island licenses medical cannabis growers. A decriminalisation debate was put off
  until after the 2026 election.
scores:
  possession: 2
  cultivation: 1
  enforcement: 3
  sharing: 1
  consumption: 1
  access: 3
segments:
  possession:
    text: >-
      Cannabis is a Class B drug under the Misuse of Drugs (Jersey) Law 1978, and possession carries
      up to five years in prison or a fine. Small amounts are dealt with at a Parish Hall enquiry:
      under Attorney General directions, up to 15 g usually brought a written caution for a first
      offence and again after a year. Since the 2024 public order law, a Centenier may instead
      impose a level 1 fine for possessing a Class B drug if the person accepts it, which does not
      lead to a conviction. Larger amounts and repeat cases go to court.
    sources:
      - mdl
      - jep22
      - hs
  cultivation:
    text: >-
      Growing cannabis is production of a Class B drug, with up to 14 years in prison or a fine.
      Personal cultivation has no exemption; one of the options put to the States Assembly in 2025
      would only have stopped prosecuting the growing of small quantities.
    sources:
      - mdl
      - hs
  enforcement:
    text: >-
      Users with small amounts are mostly handled at the Parish Hall with cautions or fines. Class B
      convictions, which include cannabis, fell from 65 in 2020 to 35 in 2021. Production and supply
      are prosecuted in the courts.
    sources:
      - jep22
      - mdl
  sharing:
    text: >-
      Supplying or offering to supply a Class B drug carries up to 14 years in prison or a fine. The
      law draws no line for giving cannabis to a friend without payment.
    sources:
      - mdl
  consumption:
    text: >-
      Use is dealt with through the possession offence. In June 2024 the States Assembly rejected
      decriminalising personal possession and recreational use by 23 votes to 22.
    sources:
      - mdl
      - be24
  access:
    text: >-
      There is no legal adult-use source. Doctors prescribe medical cannabis privately and
      pharmacies dispense it: an audit counted 23,639 private prescriptions for about 4,361 patients
      in 2022, roughly 6% of the working population.
    sources:
      - benum
context:
  production:
    text: >-
      Commercial growing is limited to licensed medical producers. Northern Leaf, the first local
      grower approved by the UK medicines regulator, can produce eight tonnes a year and made its
      first commercial shipment of high-THC flower to the United Kingdom in November 2023, after an
      earlier shipment to Australia.
    sources:
      - jepship
  products:
    text: >-
      Prescribed medical cannabis is dispensed by pharmacies. Some cannabis
      extracts, including cannabis oil, are in the same class as heroin; in 2024 the health minister
      proposed moving cannabinol and its derivatives from Class A to Class B.
    sources:
      - benum
      - be24
  medical:
    text: >-
      Medical cannabis is prescribed privately by doctors, some at cannabis clinics, and patients
      may also bring it in under a personal import licence. Eighteen prescribers were recorded in
      2022 and twenty in the first half of 2023. In October 2026 the government said it planned a
      law to regulate prescribers, to start in early 2027.
    sources:
      - benum
      - wq201
  consequences:
    text: >-
      A Parish Hall caution or a Centenier's fine does not create a criminal conviction, while a case
      that goes to court does. In June 2024 the Assembly asked ministers for proposals on
      decriminalisation, legalisation and regulation; three options were tabled in 2025, but the
      debate set for 3 February 2026 was put off until after the June 2026 election.
    sources:
      - hs
      - be24
  clubs:
    status: none
    text: >-
      No cannabis clubs are known. Supplying cannabis to another person is an offence, and none of
      the 2025 reform options would have created clubs.
    sources:
      - mdl
      - hs
  visitors:
    status: none
    text: >-
      There is no legal recreational supply, so a visitor has no lawful way to obtain cannabis.
      Medical cannabis requires a prescription or a personal import licence.
    sources:
      - mdl
      - benum
