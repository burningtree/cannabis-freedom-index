name: Maldives
region: Asia
iso_numeric: 462
recreational: death
medical: none
updated: 2026-10-24
summary: >-
  Someone who is not drug-dependent is presumed to be dealing even with 5 g or less, and dealing is
  fifteen years. Use by a dependent person is three years. Trafficking is life, and bringing in more
  than 350 g of cannabis can be death.
