segments:
  possession:
    text: >-
      Cannabis is a Schedule 1 drug under the Drugs Act (17/2011). A person assessed as
      drug-dependent who has 5 g or less of cannabis, cannabis mixture or cannabis resin is presumed
      to possess it for use, and use is an offence of three years. More than 5 g and less than 14 g
      is presumed peddling, which is five to ten years, and more than 14 g is presumed trafficking,
      which is life. A person who is not drug-dependent is presumed to be dealing even at 5 g or
      less, and dealing is fifteen years; more than 14 g is again presumed trafficking. Specified
      acts can raise a smaller amount to trafficking. The Drug Court can take a dependent person
      who pleads guilty to use or peddling and is not charged with trafficking. The presidency's
      account of the Third Amendment, ratified on 6 December 2025 and in force three months after
      ratification and gazette publication, does not describe a change to these presumptions.
    sources:
      - da
      - po
  cultivation:
    text: The retained sources identify cultivation as an offence but do not give its sentence.
    sources:
      - mi
  enforcement:
    text: >-
      The Third Amendment, ratified on 6 December 2025, adds the death penalty for bringing more
      than 350 g of cannabis into the country on entry, and raises the penalty for importing a
      Schedule 1 drug to 20 years. It takes effect three months after ratification and gazette
      publication.
    sources:
      - po
      - mi
      - at
  sharing:
    text: >-
      Trafficking carries life imprisonment, now defined as the remainder of a person's life with no
      pardon or commutation.
    sources:
      - at
      - mi
  consumption:
    text: >-
      Use of cannabis is an offence of three years. The Drug Court can take a dependent person who
      pleads guilty to use or peddling and is not charged with trafficking.
    sources:
      - da
  access:
    text: No legal source.
    sources:
      - mi
context:
  death_penalty:
    text: >-
      The Third Amendment, ratified on 6 December 2025, provides the death penalty where more than
      350 g of cannabis is brought into the country on entry, and only if the full Supreme Court
      agrees unanimously. It takes effect three months after ratification and gazette publication.
    sources:
      - po
      - mi
      - at
