segments:
  possession:
    text: >-
      Cannabis is a Schedule 1 drug under the Drugs Act 17/2011. Amounts below the user threshold
      can still bring up to five years plus court-ordered treatment; a dedicated Drug Court can
      suspend the sentence for people who complete rehabilitation. Above the threshold — reported as
      14 g — it is treated as dealing, with up to 25 years or life.
    sources:
      - cr
      - mi
  cultivation:
    text: Cultivation is a serious offence.
    sources:
      - cr
  enforcement:
    text: >-
      Recent amendments added the death penalty for bringing more than 350 g of cannabis into the
      country, and raised the penalty for importing Schedule 1 drugs to 20 years.
    sources:
      - mi
      - at
  sharing:
    text: >-
      Trafficking carries life imprisonment, now defined as the remainder of a person's life with no
      pardon or commutation.
    sources:
      - at
      - mi
  consumption:
    text: Use is an offence, routed through the Drug Court's treatment programme.
    sources:
      - mi
