segments:
  possession:
    text: >-
      Cannabis is a Schedule 1 drug under the Drugs Act (17/2011). A person assessed as
      drug-dependent who has 5 g or less of cannabis, cannabis mixture or cannabis resin is presumed
      to possess it for use, and use is an offence of three years. More than 5 g and less than 14 g
      is presumed peddling, which is five to ten years, and more than 14 g is presumed trafficking,
      which is life. A person who is not drug-dependent is presumed to be dealing even at 5 g or
      less, and dealing is fifteen years; more than 14 g is again presumed trafficking. Specified
      acts can raise a smaller amount to trafficking. The Drug Court can take a dependent person
      who pleads guilty to use or peddling and is not charged with trafficking. The presidency's
      account of the Third Amendment, ratified on 6 December 2025 and in force three months after
      ratification and gazette publication, does not describe a change to these presumptions.
    sources:
      - da
      - po
    penalties:
      - upto: 5 g
        treatment: criminal
        prison: 3 years
        note: Drug-dependent person presumed to possess for use; use is three years
      - label: Non-dependent person with 5 g or less
        treatment: criminal
        prison: 15 years
        note: Presumed dealing; dealing is fifteen years
      - over: 5 g
        upto: 14 g
        treatment: criminal
        prison_min: 5 years
        prison: 10 years
        note: Presumed peddling
      - over: 14 g
        treatment: criminal
        note: Presumed trafficking, which is life imprisonment
  cultivation:
    text: The retained sources identify cultivation as an offence but do not give its sentence.
    sources:
      - mi
  enforcement:
    text: >-
      The Third Amendment, ratified on 6 December 2025, adds the death penalty for bringing more
      than 350 g of cannabis into the country on entry, and raises the penalty for importing a
      Schedule 1 drug to 20 years. It takes effect three months after ratification and gazette
      publication.
    sources:
      - po
      - mi
      - at
  sharing:
    text: >-
      Trafficking carries life imprisonment, now defined as the remainder of a person's life with no
      pardon or commutation.[@at] Bringing more than 350 g of cannabis into the country can carry the
      death penalty, only on a unanimous full Supreme Court verdict.[@po,mi]
    sources:
      - at
      - mi
      - po
    penalties:
      - label: Trafficking
        treatment: criminal
        note: Life imprisonment, defined as the remainder of life with no pardon or commutation
      - label: Bringing more than 350 g of cannabis into the country
        treatment: criminal
        death: true
        note: Only on a unanimous full Supreme Court verdict; otherwise life
  consumption:
    text: >-
      Use of cannabis is an offence of three years. The Drug Court can take a dependent person who
      pleads guilty to use or peddling and is not charged with trafficking.
    sources:
      - da
  access:
    text: No legal source.
    sources:
      - mi
context:
  death_penalty:
    text: >-
      The Third Amendment, ratified on 6 December 2025, provides the death penalty where more than
      350 g of cannabis is brought into the country on entry, and only if the full Supreme Court
      agrees unanimously. It takes effect three months after ratification and gazette publication.
    sources:
      - po
      - mi
      - at
  recreational:
    text: >-
      There is no legal way to get cannabis. Even 5 g or less makes a non-dependent person
      presumed to be dealing, at fifteen years; a dependent person with the same amount is
      presumed to hold it for use, at three years.[@da] British travel advice warns that even
      small quantities can lead to arrest, long sentences, whipping and, for the most serious
      offences, death.[@fcdo]
    sources:
      - da
      - fcdo
  production:
    status: none
    text: No licensed production. Cultivation is an offence.
    sources:
      - mi
  medical:
    text: >-
      No patient programme is documented. Cannabis is a Schedule 1 drug and use is an offence
      of three years.[@da]
    sources:
      - da
  consequences:
    text: >-
      Beyond prison, offenders can face whipping, and trafficking means life defined as the
      remainder of life with no pardon or commutation.[@fcdo,at]
    sources:
      - fcdo
      - at
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited, and the law provides for the death
      penalty for the most serious drug offences.
    sources:
      - at
      - mi
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. British travel advice says even small
      quantities of cannabis can lead to arrest, with long prison sentences, whipping in some
      cases and the death penalty for the most serious offences. Travellers have been caught
      carrying controlled drugs in transit, and the advice is to carry none, even if legal in
      the country of departure.
    sources:
      - fcdo
  arrests:
    text: >-
      Police told a press conference in May 2024 that so far that year they had arrested
      260 Maldivians and 16 foreigners with drugs in 56 operations, investigated 257 drug
      cases and sent 95 to the prosecutor general, and seized about 19 kg of drugs. No
      breakdown by drug was given.
    sources:
      - adhadhu24
