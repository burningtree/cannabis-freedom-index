segments:
  possession:
    text: >-
      Possessing any amount of cannabis is a crime, with up to seven years in prison.[@narcotics]
      The 2024 reform moved cannabis from the Cannabis Act into the narcotics law and raised the
      maximum from five to seven years.[@giq] Possession for profit carries one to ten years and a
      fine of up to 3 million yen.[@narcotics] First offenders with small amounts often receive a
      suspended sentence, but arrest, weeks of detention and public naming are routine.[@giq]
    sources:
      - narcotics
      - giq
    currency: JPY
    penalties:
      - label: Possession of any amount
        treatment: criminal
        term: Possession
        prison: 7 years
        note: Raised from five years in December 2024; first small-amount offenders often receive a suspended sentence
      - label: Possession for profit
        treatment: criminal
        term: Possession for profit
        prison_min: 1 year
        prison: 10 years
        fine: 3000000
        note: Prison, or prison and a fine
  cultivation:
    text: >-
      Growing cannabis without a licence carries not less than one year and not more than ten years
      in prison.[@cannabis] Growing for profit carries the same range, with a fine of up to 5
      million yen.[@cannabis] Since March 2025 a Type 1 grower must use seed from plants with no more
      than 0.3% delta-9 THC; using stronger seed carries up to seven years, or not less than one year
      and not more than ten years and a 3 million yen fine for profit.[@cannabis,mhlw_licensing] The law also licenses growers producing
      pharmaceutical raw material and research cannabis, both with health-ministry
      licences.[@cannabis] Knowingly providing land, equipment or seed for unlicensed growing carries
      up to five years.[@cannabis]
    sources:
      - cannabis
      - mhlw_licensing
    currency: JPY
    penalties:
      - label: Unauthorised cultivation
        treatment: criminal
        term: Cultivation
        prison_min: 1 year
        prison: 10 years
      - label: Cultivation for profit
        treatment: criminal
        term: Cultivation for profit
        prison_min: 1 year
        prison: 10 years
        fine: 5000000
        note: Prison, or prison and a fine
      - label: Growing with seed above 0.3% THC (Type 1)
        treatment: criminal
        term: Seed-rule violation
        prison: 7 years
      - label: Growing with seed above 0.3% THC for profit
        treatment: criminal
        term: Seed-rule violation for profit
        prison_min: 1 year
        prison: 10 years
        fine: 3000000
        note: Prison, or prison and a fine
      - label: Providing land, equipment or seed for unlicensed growing
        treatment: criminal
        term: Facilitating cultivation
        prison: 5 years
  enforcement:
    text: >-
      Police investigated a record 6,832 people for cannabis offences in 2025, 754 more than the
      year before.[@kyodo_investigations,mugglehead] More than 70% were under 30, including 3,633 in
      their twenties; 1,373 were under 20, the most since 1990.[@mugglehead,mainichi] About 700 were
      pursued under the new offence of use itself.[@mugglehead] Sentences are often suspended, but
      arrest, detention and public naming are punishment in themselves.[@giq]
    sources:
      - kyodo_investigations
      - mugglehead
      - mainichi
      - giq
  sharing:
    text: >-
      Passing cannabis to another person is a crime whether or not money changes hands, with up to
      seven years in prison.[@narcotics] Transfer for profit carries one to ten years and a fine of
      up to 3 million yen.[@narcotics] Importing, exporting or manufacturing cannabis carries one to
      ten years; for profit, at least one year and a fine of up to 5 million
      yen.[@narcotics,mhlw_travel]
    sources:
      - narcotics
      - mhlw_travel
    currency: JPY
    penalties:
      - label: Transfer, with or without payment
        treatment: criminal
        term: Transfer
        prison: 7 years
      - label: Transfer for profit
        treatment: criminal
        term: Transfer for profit
        prison_min: 1 year
        prison: 10 years
        fine: 3000000
        note: Prison, or prison and a fine
      - label: Import, export or manufacture
        treatment: criminal
        term: Import, export or manufacture
        prison_min: 1 year
        prison: 10 years
      - label: Import, export or manufacture for profit
        treatment: criminal
        term: Import, export or manufacture for profit
        prison_min: 1 year
        fine: 5000000
        note: Prison, or prison and a fine; no maximum prison term
  consumption:
    text: >-
      Using cannabis is a crime with up to seven years in prison, whether or not any is found on the
      person.[@narcotics] Until December 2024 Japan punished possession but not use; the amendment
      closed that gap.[@giq] In the first year about 700 people were investigated under the new
      offence.[@mugglehead] Use for profit carries one to ten years and a fine of up to 3 million
      yen.[@narcotics]
    sources:
      - narcotics
      - giq
      - mugglehead
    currency: JPY
    penalties:
      - label: Use
        treatment: criminal
        term: Use
        prison: 7 years
      - label: Use for profit
        treatment: criminal
        term: Use for profit
        prison_min: 1 year
        prison: 10 years
        fine: 3000000
        note: Prison, or prison and a fine
  access:
    text: >-
      There is no legal source of THC cannabis for adults.[@narcotics,giq] The law now allows
      cannabis-derived medicines, but no cannabis medicine has been approved in
      Japan.[@dia,jazz_trial] CBD products are legal only if residual THC stays within strict limits:
      10 ppm in oils and powders, 0.1 ppm in aqueous products and 1 ppm in other
      products.[@mhlw_cbd] CBN, another cannabinoid sold in some CBD products, was banned from 1 June
      2026, with a narrow exception for patients who have no alternative treatment.[@mhlw_cbn]
    sources:
      - narcotics
      - giq
      - dia
      - jazz_trial
      - mhlw_cbd
      - mhlw_cbn
context:
  recreational:
    text: >-
      Adults have no legal way to buy cannabis for fun.[@narcotics] Possession and use carry up to
      seven years, and transfer does too, even without payment.[@narcotics] Police investigated a
      record 6,832 people in 2025; more than 40% of those under 30 said they had bought through apps
      such as X and Telegram.[@mugglehead] Police seized 315 kg of concentrates in 2025, more than
      three times the 2024 figure.[@mugglehead] CBD is the legal alternative, but only within the
      residue limits.[@mhlw_cbd]
    sources:
      - narcotics
      - mugglehead
      - mhlw_cbd
  medical:
    text: >-
      Japan allows cannabis-derived medicines in law, but no cannabis medicine has been
      approved.[@dia] The 2024 reform created the approval route, and in June 2024 the health
      ministry gave orphan designation to Jazz's cannabidiol for Dravet syndrome, Lennox-Gastaut
      syndrome and tuberous sclerosis complex.[@jazz_orphan] The Japanese Phase 3 trial then missed
      its primary endpoint in August 2024, and Jazz and Nippon Zoki agreed in April 2026 to prepare a
      future introduction.[@jazz_trial,nz] Medical use means a licensed pharmaceutical, not herbal
      cannabis, and CBD products are legal only within the THC residue limits.[@mhlw_cbd] CBN was
      banned from June 2026, except for patients with no alternative.[@mhlw_cbn]
    sources:
      - dia
      - jazz_orphan
      - jazz_trial
      - nz
      - mhlw_cbd
      - mhlw_cbn
  hemp:
    status: standard
    text: >-
      Hemp may be grown only under licence, and [since March 2025](/history/japan-cannabis-cultivation-licences-2025/)
      the legal line for Type 1 growers is seed from plants with no more than 0.3% delta-9
      THC.[@cannabis,mhlw_licensing] The plant's seeds and mature stalks are outside the definition of
      cannabis, which is why hemp seed can be sold for food; but a licensed grower must treat seed so
      it cannot germinate before passing it on, except to another grower.[@cannabis] Production is
      tiny: 35 growers on 9 hectares in 2019, about 90% of it in Tochigi, down from more than
      [25,000 farms before the 1948 law](/history/japan-cannabis-control-act-1948/).[@usda,stripes]
      Tottori prefecture [banned hemp growing in
      2016](/history/japan-tottori-hemp-ban-2016/) after arrests at a licensed firm.[@tottori] CBD
      products are legal only within residual-THC limits of 10 ppm in oils and powders, 0.1 ppm in
      aqueous products and 1 ppm in other products; CBN was [banned from June
      2026](/history/japan-cbn-ban-2026/).[@mhlw_cbd,mhlw_cbn]
    sources:
      - cannabis
      - mhlw_licensing
      - usda
      - stripes
      - tottori
      - mhlw_cbd
      - mhlw_cbn
  production:
    status: medical
    text: >-
      Commercial production is confined to licensed hemp and pharmaceutical raw material; there is
      no adult-use market.[@cannabis] Type 1 licences from prefectural governors cover raw material
      for manufactured products, Type 2 licences from the health ministry cover pharmaceutical
      ingredients, and a separate licence covers research.[@cannabis,mhlw_licensing] The
      pharmaceutical route is still nascent: no cannabis medicine has been approved, and Jazz's April
      2026 deal with Nippon Zoki is preparation for a future launch.[@nz] Hemp fibre and food
      production is small: 35 growers on 9 hectares in 2019, about 90% in Tochigi.[@usda]
    sources:
      - cannabis
      - mhlw_licensing
      - nz
      - usda
  consequences:
    text: >-
      An arrest typically costs a person their job or university place.[@giq] Foreigners are deported
      after a cannabis conviction, and the immigration law bars them from landing again for five
      years, or ten if they have been deported before.[@immigration] A cannabis penalty in any
      country is also a ground for refusing entry.[@immigration]
    sources:
      - giq
      - immigration
  planting:
    seeds: grey
    seeds_trade: open
    clones: illegal
    clones_trade: banned
    text: >-
      The Act defines cannabis as the plant excluding its seed and mature stalk, so an adult can buy
      and hold hemp seed without committing a cannabis offence.[@cannabis] Sowing it without a licence
      is cultivation, and a seller who knowingly provides seed for unlicensed growing can be jailed
      for up to five years.[@cannabis] Licensed growers must treat seed so it cannot germinate before
      passing it on, except to another licensed grower; untreated germinable seed needs the health
      minister's permission to import.[@cannabis] Clones are plants, so keeping or trading them
      without a licence is illegal.[@cannabis]
    sources:
      - cannabis
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing and supplying
      cannabis are both crimes.[@cannabis,giq]
    sources:
      - cannabis
      - giq
  visitors:
    status: none
    text: >-
      No visitor can buy cannabis legally in Japan.[@narcotics] Bringing it in is an import offence
      carrying one to ten years, and possession carries up to seven.[@mhlw_travel] The health ministry
      warns that cannabis cookies, chocolate and vape cartridges bought legally abroad are still
      illegal in Japan.[@mhlw_travel] A foreigner convicted of a cannabis offence is deported and
      barred from re-entry for five years, or ten after a previous deportation.[@immigration]
    sources:
      - narcotics
      - mhlw_travel
      - immigration
  driving:
    status: impairment
    text: >-
      The Road Traffic Act forbids driving when normal driving may not be possible because of drugs,
      illness, overwork or another reason.[@rta66] The law sets no THC level; the test is the driver's
      condition.[@rta66] Where the condition comes from cannabis, narcotics, opium or stimulants, the
      penalty is up to five years in prison or a fine of up to 1 million yen.[@rta66]
    sources:
      - rta66
  black_market:
    text: >-
      Police and customs count seizures separately. The government reported 452 kg of herbal cannabis
      seized in 2024, down from 850 kg in 2023, and 11.8 kg of resin, up from 1 kg.[@unodc_szr]
      Customs seized a record 1,531 kg in 2025, 3.5 times the 2024 figure, after a 1.046-tonne
      container from Vietnam was found in June.[@jt_customs,kyodo_seizure] The United States supplied
      43% of detected cannabis cases, Thailand 27% and Vietnam 8%.[@jt_customs] UN figures are
      kilogram equivalents reported by governments and are not comparable across borders.[@unodc_szr]
    sources:
      - unodc_szr
      - jt_customs
      - kyodo_seizure
  arrests:
    text: >-
      Police investigated a record 6,832 people for cannabis offences in 2025, 754 more than
      2024.[@kyodo_investigations,mugglehead] More than 70% were under 30, including 3,633 in their
      twenties.[@mugglehead,mainichi] Of the 1,373 under-20 cases, 173 were for use, and the under-20
      total was the highest since 1990.[@mainichi] About 700 people were investigated under the new
      use offence, and police seized 315 kg of concentrates, more than three times the 2024
      amount.[@mugglehead]
    sources:
      - kyodo_investigations
      - mugglehead
      - mainichi
  culture:
    text: >-
      Hemp sits deep in Japanese life: the character [*ma*](/culture/language/ma/) names the plant and
      carries the sense of numbness, and the word *taima* is still the everyday name for
      cannabis.[@li] In Shinto, hemp fibre stands for purity: priests wave an
      [ōnusa](/culture/traditions/hemp-in-shinto/) hung with hemp, shrine ropes were once made of it,
      and the Ise shrine's talisman began as a hemp wand.[@stripes] Hemp seed has been one of the
      seven spices in [shichimi](/culture/traditions/hemp-seed-in-shichimi/) since the shops of Edo
      mixed it in the seventeenth century.[@stripes,shichimi_wiki] Modern protest is small but persistent:
      [Marijuana March Tokyo](/culture/traditions/global-marijuana-march/) has been held yearly since
      2001.[@gmm_wiki] The 1948 law and the 2024 use ban did not erase these customs, but they pushed
      most hemp production and public ritual onto a narrow licensed footing.[@cannabis,dw]
    sources:
      - li
      - stripes
      - shichimi_wiki
      - gmm_wiki
      - cannabis
      - dw
  research:
    status: licensed
    text: >-
      Cannabis research needs a health-ministry licence to grow the plant, and the law sets a
      separate research-grower category.[@cannabis] Japanese authors published 87 cannabis papers in
      2025, up from 59 in 2024, and two cannabis trials were registered in the country as of October
      2026.[@openalex,ctgov] The most visible recent work is clinical: Jazz ran a 62-patient Phase 3
      trial in Japanese children with severe epilepsies, and Japanese clinicians documented the HHCH
      gummy poisonings that led to the 2023 ban.[@jazz_trial,jma_hhch] In May 2025 a national Hemp
      Cannabinoid Consortium was set up to promote domestic research on cannabis-derived
      medicines.[@pj_consortium]
    sources:
      - cannabis
      - openalex
      - ctgov
      - jazz_trial
      - jma_hhch
      - pj_consortium
context_not_applicable:
  death_penalty:
    text: >-
      Cannabis offences carry imprisonment or fines under the Cannabis Act and the Narcotics Act;
      neither provides a capital sentence. The maximum for unauthorised cultivation is ten years.
    sources:
      - cannabis
      - narcotics
