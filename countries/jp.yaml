name: Japan
region: Asia
iso_numeric: 392
recreational: illegal
medical: limited
updated: '2026-10-27'
summary: >-
  Possession carries up to seven years, and since December 2024 use itself is a crime. The same
  reform allowed cannabis-derived pharmaceuticals; THC-free CBD is legal.
scores:
  possession: 0
  cultivation: 0
  enforcement: 1
  sharing: 0
  consumption: 0
  access: 0
segments:
  possession:
    text: >-
      Possession of any amount is a crime. Amendments in force from 12 December 2024 moved cannabis
      under the narcotics law and raised the maximum for possession from five to seven years in
      prison. First offenders with small amounts commonly receive a suspended sentence, but arrest,
      weeks of detention and public naming are routine.
    sources:
      - giq
      - dia
    currency: JPY
    penalties:
      - label: Possession of any amount (since 2024)
        treatment: criminal
        prison: 7 years
        note: Maximum raised from five to seven years; first small-amount offenders commonly suspended
  cultivation:
    text: >-
      Unauthorised cultivation is imprisonment of not less than one year and not more than ten
      years. Cultivation for profit is a separate offence: imprisonment of not less than one year,
      or that imprisonment and a fine of up to 5 million yen. The Act licences cultivation for
      taking raw material and for research.
    sources:
      - ccaegov
    currency: JPY
    penalties:
      - label: Unauthorised cultivation
        treatment: criminal
        prison_min: 1 year
        prison: 10 years
      - label: Cultivation for profit
        treatment: criminal
        prison_min: 1 year
        fine: 5000000
        note: At least one year and/or up to 5 million yen
  enforcement:
    text: >-
      Strict and consistently enforced, with record arrest numbers among people in their twenties.
      Sentences are often suspended, but the process itself is punishing.
    sources:
      - giq
  sharing:
    text: Transfer to another person carries up to seven years, whether or not for payment.
    sources:
      - giq
    penalties:
      - label: Transfer, with or without payment
        treatment: criminal
        prison: 7 years
  consumption:
    text: >-
      Until 2024 Japan punished possession but not use — a quirk meant to protect hemp farmers. The
      amendment closed it: using cannabis is now itself a crime with up to seven years.
    sources:
      - giq
      - dia
    penalties:
      - label: Use (since December 2024)
        treatment: criminal
        prison: 7 years
  access:
    text: No legal source of THC cannabis.
    sources:
      - em
context:
  recreational:
    text: >-
      All recreational use is prohibited: possession of any amount brings up to seven years, use
      itself has been a crime since December 2024, and transfer brings up to seven years whether
      or not money changes hands. Record arrests skew young, with app-based buying
      common.[@giq,dia,mh26]
    sources:
      - giq
      - dia
      - mh26
  production:
    status: medical
    text: >-
      The same reform replaced the old plant-part rule with THC thresholds and created licence
      categories for hemp and for pharmaceutical raw material.
    sources:
      - dia
      - em
  medical:
    text: >-
      The 2024 law lifted the ban on cannabis-derived medicines, opening the way for an approved
      cannabidiol drug for severe epilepsy. There is no herbal medical cannabis. CBD products are
      legal and popular, subject to very strict residual-THC limits set in parts per million;
      nothing with meaningful THC is lawful.
    sources:
      - dia
      - giq
      - em
  consequences:
    text: >-
      An arrest typically costs a person their job or university place, and foreigners are deported
      and barred from re-entry.
    sources:
      - giq
  planting:
    seeds: grey
    seeds_trade: open
    clones: illegal
    clones_trade: banned
    text: >-
      The Act defines cannabis as the plant excluding its seed and mature stalk. Knowingly providing
      raw materials, including cannabis seeds, for unlicensed cultivation is up to five years. A
      licensed cultivator who transfers seeds without making them unable to germinate, except to
      another licensed cultivator or in a case the ministry sets, commits a separate offence of up
      to three years or a fine of up to 500,000 yen, or both.
    sources:
      - ccaegov
  arrests:
    text: >-
      Police investigated a record 6,832 people for cannabis offences in 2025, 754 more than
      the year before, according to the National Police Agency. About 700 of them were pursued
      under the new offence of use itself, which took effect in December 2024. Young people
      stand out: 1,373 of those investigated were under 20, up more than a fifth and the most
      since 1990, and more than 40% of those under 30 said they had bought through apps such
      as X and Telegram. Seizures of cannabis concentrates rose more than 300% to 315 kg.
    sources:
      - mh26
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited.
    sources:
      - giq
      - dia
  visitors:
    status: none
    text: >-
      Bringing cannabis into Japan is a separate import offence carrying one to ten years in prison;
      export and manufacture have the same ordinary range.[@mhlwtravel] The Health Ministry warns
      travellers about cannabis cookies, chocolate and vape cartridges bought legally
      overseas.[@mhlwtravel] Simple possession separately carries up to seven years.[@mhlwtravel]
      First offenders with small possession amounts commonly receive a suspended sentence, but arrest,
      weeks of detention and public naming are routine.[@giq]
    sources:
      - mhlwtravel
      - giq
  driving:
    status: impairment
    text: >-
      The Road Traffic Act forbids driving in a state in which normal driving may not be
      possible because of overwork, illness, drugs or other reasons. The law sets no THC
      level; the test is the driver's condition. Where that condition comes from narcotics,
      cannabis, opium or stimulants, the penalty is up to five years in prison or a fine of up
      to one million yen.
    sources:
      - rta66
  black_market:
    text: >-
      Figures reported by the government to the UN drugs office record 452 kg of herbal
      cannabis seized in 2024, against 850 kg in 2023, and 11.8 kg of cannabis resin
      seized in 2024, against 1 kg in 2023. The UN publishes them as kilogram equivalents,
      and countries count seizures differently, so the figures are not comparable across
      borders.
    sources:
      - unodc_szr
