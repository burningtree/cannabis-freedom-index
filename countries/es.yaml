summary: >-
  Private use and cultivation out of public view are not crimes; possession or use in public brings
  fines from €601. Hundreds of cannabis social clubs operate in a legal grey zone.
scores:
  possession: 3
  cultivation: 3
  enforcement: 4
  sharing: 2
  consumption: 3
  access: 3
segments:
  possession:
    text: >-
      Possession for personal use in a private place is not an offence; courts generally treat up to
      about 100 g as personal. In public it is different: carrying any amount is a serious
      administrative infraction with a fine of €601 to €30,000 and confiscation.
    sources:
      - wiki
      - boe
  cultivation:
    text: >-
      Growing for your own use in private is not a crime, and there is no fixed plant limit — courts
      look at whether the amount is consistent with personal use. Plants visible from a public place
      bring a €601–30,000 fine.
    sources:
      - wiki
      - local
  enforcement:
    text: >-
      Users face administrative fines, not criminal charges. Trafficking is punished with one to
      three years in prison for cannabis, more for large quantities.
    sources:
      - local
      - wiki
  sharing:
    text: >-
      Courts recognise 'shared consumption' among a closed group of adult users as non-criminal,
      which is the doctrine cannabis clubs rely on. Outside that narrow setting, handing over
      cannabis is trafficking.
    sources:
      - tni
      - wiki
  consumption:
    text: >-
      Legal at home and inside private clubs. Consuming in streets, parks, bars, vehicles or public
      transport is fined from €601.
    sources:
      - boe
      - local
  access:
    text: >-
      No legal shops. Hundreds of cannabis social clubs — private non-profit associations,
      concentrated in Catalonia and the Basque Country — supply members in a tolerated grey zone.
      Clubs have been raided and their organisers convicted, and membership is meant for residents.
    sources:
      - tni
      - wiki
context:
  production:
    text: >-
      No licensing for adult-use production; clubs grow collectively at their own legal risk. The
      medicines agency licenses a few companies for medical and research cultivation, mostly for
      export.
    sources:
      - tni
      - wiki
  products:
    text: >-
      Clubs offer flower, hash and extracts informally. CBD products are sold widely though not
      approved for consumption.
    sources:
      - wiki
  medical:
    text: >-
      A royal decree approved in 2025 created Spain's first formal medical route: standardised
      preparations prescribed by hospital specialists and dispensed by hospital pharmacies, for a
      narrow set of conditions.
    sources:
      - wiki
  consequences:
    text: >-
      Fines are not a criminal record. Roadside saliva tests detect any THC, with a €1,000 fine and
      six licence points regardless of impairment.
    sources:
      - local
  planting:
    seeds: grey
    seeds_trade: open
    clones: grey
    clones_trade: unclear
    text: >-
      Grow shops have sold cannabis seeds openly since about 2000, alongside soil, lamps and
      fertiliser. Shop owners interviewed in 2018 said the trade is legal because seeds
      contain no THC, and that what the buyer then grows at home is the buyer's affair. The
      sources read do not cover cuttings.
    sources:
      - grow
  clubs:
    status: tolerated
    text: >-
      Spain has the largest network of cannabis social clubs in Europe, built on court
      doctrine and not on any law: private use and growing for one's own use are not crimes,
      and 'shared consumption' among a closed group of adults has long been tolerated. The
      first club was founded in 2001. Estimates run from about 400 clubs in 2018 to a peak of
      800 to 1,000 in the late 2010s, most of them in Catalonia and the Basque Country. A club
      registers as a non-profit association, admits adults on the word of an existing member,
      grows for its expected membership and hands out about 3 g a day for use on the premises,
      charging fees to cover costs. Clubs follow their own codes or those of regional
      federations. The Supreme Court convicted the organisers of three clubs in 2015, finding that
      what they did was not genuine private consumption, and police raids and investigations
      continue. Some Barcelona clubs grew to thousands of members by admitting tourists, and
      since 2024 the city has fined clubs and ordered some to close. In July 2026 the
      government approved a draft tobacco law that would remove the exemption for private
      smokers' clubs on which the clubs also rely.
    sources:
      - tdpf18
      - boc26
      - ice24
  black_market:
    text: >-
      Spain is Europe's main entry point for Moroccan hashish and also a grower of herbal
      cannabis. State security forces seized 257 tonnes of hashish in 2025, up 29% on 2024 but
      at the low end of the series: 357 tonnes in 2023, 318 in 2022 and 672 in 2021. They also
      seized 875,000 cannabis plants. The interior ministry says police pressure on the coast
      has pushed traffickers to alternate beach landings with lorries and other vehicles;
      speedboats used for smuggling were banned in 2018, and supplying them with fuel at sea
      became a crime in 2026. The figures leave out seizures by the regional police forces.
    sources:
      - int26
  driving:
    status: zero
    text: >-
      Since the road safety law was changed in May 2014, driving with the presence of drugs in
      the body is an administrative offence in its own right, punished with a fine of 1,000
      euros and the loss of six licence points; no impairment has to be shown and no threshold
      applies. Any driver can be asked to take a drug test at any hour on any road, and in the
      first year or so after the change more than 20,000 drivers were sanctioned for it.
    sources:
      - int15
  arrests:
    text: >-
      The typical outcome for a user is a fine, not an arrest. In 2023 the state security
      forces imposed 198,570 sanctions under the article of the public-security law that
      punishes using or holding drugs in public places, which carries fines from 601 euros;
      they brought in about 130 million euros, 74% of everything collected under that law and
      21% more than in 2022. The figure covers all drugs, though cannabis is the commonest.
      Another 109 sanctions were for growing plants in public view. A reform agreed by the
      governing parties in 2024 would cut the possession fine to between 100 and 500 euros.
    sources:
      - ep24
  visitors:
    status: none
    text: >-
      There are no legal shops for anyone. What exists is the tolerated network of private
      members' clubs, which are closed associations rather than a lawful point of sale;
      nothing in the law gives a visitor a right to join or buy. Carrying or using cannabis in
      public brings the same fine for a visitor as for a resident. British travel advice goes
      further in its warning: possession of even a small quantity can lead to arrest and
      detention, and smuggling carries a long prison sentence, also in airport transit.
    sources:
      - tni
      - wiki
      - boe
      - fcdo
