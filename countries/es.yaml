name: Spain
region: Europe
iso_numeric: 724
recreational: partial
medical: limited
updated: '2026-10-27'
summary: >-
  Private use and cultivation out of public view are not crimes; possession or use in public brings
  fines from €601. Hundreds of cannabis social clubs operate in a legal grey zone.
scores:
  possession: 3
  cultivation: 3
  enforcement: 4
  sharing: 2
  consumption: 3
  access: 3
answers:
  buy:
    answer: limited
    text: No shops; private cannabis social clubs supply their members in a tolerated grey zone
segments:
  possession:
    text: >-
      Possession exclusively for personal use in private falls outside the trafficking
      offence.[@penal,tni] The law gives no general 100 g allowance.[@penal] Unlawful possession in
      public places or collective transport is a serious administrative offence, even without intent
      to supply, carrying €601–30,000.[@boe] Drugs may be confiscated.[@boe]
    sources:
      - penal
      - tni
      - boe
    currency: EUR
    penalties:
      - label: Exclusively personal possession in private
        treatment: legal
        note: No statutory gram allowance; evidence of intended supply changes the case
      - label: Unlawful possession in public or collective transport
        treatment: civil
        fine_min: 601
        fine: 30000
        term: Articles 36.16 and 39
        note: Confiscation possible; supply remains criminal
  cultivation:
    text: >-
      Private cultivation exclusively for personal use falls outside the supply offence; there is no
      statutory household plant allowance.[@penal,tni] Growing unlawfully where the plants are
      visible to the public brings €601–30,000 where it is not already a crime.[@boe] Growing for
      supply can be prosecuted under Article 368.[@penal]
    sources:
      - penal
      - tni
      - boe
    currency: EUR
    penalties:
      - label: Private cultivation exclusively for personal use
        treatment: legal
        note: No statutory plant cap; this does not authorise collective supply
      - label: Unlawful cultivation visible to the public, where not criminal
        treatment: civil
        fine_min: 601
        fine: 30000
        term: Articles 36.18 and 39
      - label: Cultivation for cannabis supply — ordinary offence
        treatment: criminal
        term: Criminal Code Article 368
        prison_min: 1 year
        prison: 3 years
        note: Plus a fine of one to twice the drug’s value; aggravated cases carry higher penalties
  enforcement:
    text: >-
      The [2015 public-security law](/history/spain-public-safety-law-2015/) treats public
      possession and use as administrative offences.[@boe] Cannabis supply ordinarily brings one to
      three years in prison and a fine of one to twice the drug’s value; aggravated circumstances
      raise the penalty.[@penal,tni]
    sources:
      - boe
      - penal
      - tni
  sharing:
    text: >-
      Courts recognise a narrow shared-consumption exception for a small, closed group of existing
      users.[@tni] Organised, continuing distribution to a large membership can fall outside it: the
      Ebers case concerned 290 members.[@ebers] Supply need not make a profit to engage Article 368;
      the ordinary cannabis penalty is one to three years plus a value-based fine.[@penal,tni]
    sources:
      - tni
      - ebers
      - penal
    penalties:
      - label: Cannabis supply outside the narrow shared-consumption exception
        treatment: criminal
        term: Criminal Code Article 368
        prison_min: 1 year
        prison: 3 years
        note: Plus a fine of one to twice the drug’s value; aggravated cases carry higher penalties
  consumption:
    text: >-
      Private personal consumption is not a criminal offence.[@tni] Public use, including in public
      establishments and collective transport, carries €601–30,000 under the [2015
      law](/history/spain-public-safety-law-2015/).[@boe] A club’s private status does not settle
      the legality of its supply.[@ebers]
    sources:
      - tni
      - boe
      - ebers
    currency: EUR
    penalties:
      - label: Private personal consumption
        treatment: legal
      - label: Public consumption or use on collective transport
        treatment: civil
        fine_min: 601
        fine: 30000
        term: Articles 36.16 and 39
  access:
    text: >-
      There are no general recreational retail licences.[@tni] Private [cannabis social
      clubs](/culture/traditions/cannabis-social-clubs/) collectively supply members, but
      registration as an association does not authorise drug distribution.[@tdpf18,ebers] Organisers
      have faced prosecution, and Barcelona clubs have faced closure action.[@ice24]
    sources:
      - tni
      - tdpf18
      - ebers
      - ice24
context:
  recreational:
    text: >-
      Personal use and exclusively personal possession in private fall outside criminal trafficking
      rules.[@penal,tni] Unlawful public possession or use still brings €601–30,000.[@boe] Clubs
      developed collective growing and distribution around the shared-consumption doctrine, but that
      doctrine does not provide a general club supply licence.[@tdpf18,ebers]
    sources:
      - penal
      - tni
      - boe
      - tdpf18
      - ebers
  production:
    status: medical
    text: >-
      The medicines agency’s July 2026 list names authorised medical and scientific growers,
      including Linneo Health, Medical Plants and Ondara.[@aempslist] Other permissions cover seeds,
      cuttings or validation batches rather than unrestricted production.[@aempslist] These
      authorisations are distinct from recreational clubs and from the agricultural exception for
      fibre, grain and seed.[@aempsgrow,tni]
    sources:
      - aempslist
      - aempsgrow
      - tni
  medical:
    text: >-
      A royal decree in force on 10 October 2025 lets hospital specialists prescribe a standardised
      cannabis solution when authorised medicines have failed, and hospital pharmacies make it up
      and hand it out.[@boe903] The national formulary lists muscle stiffness from multiple
      sclerosis, severe epilepsy, nausea and vomiting from chemotherapy and chronic pain, as an oral
      solution; other indications follow the special-access medicine rules.[@aemps043] In July 2026
      one company registered the first two extracts, and on 17 October it said about 50 hospitals
      would start receiving them, with availability possible by the end of the month.[@elmundo17]
      Ordinary pharmacies cannot dispense them.[@boe903]
    sources:
      - boe903
      - aemps043
      - elmundo17
  consequences:
    text: >-
      Fines are not a criminal record.[@local] Roadside saliva tests detect any THC, with a €1,000
      fine and six licence points regardless of impairment.[@boe_ts] A medicine used under a
      doctor's prescription for treatment is outside that presence rule when the driver can still
      drive with due care.[@boe_ts]
    sources:
      - local
      - boe_ts
  planting:
    seeds: grey
    seeds_trade: open
    clones: grey
    clones_trade: unclear
    text: >-
      Grow shops interviewed in 2018 described selling seeds alongside soil, lamps and
      fertiliser.[@grow] They said seeds contained no THC and that responsibility for subsequent
      growing lay with the buyer.[@grow] The report did not determine the position of
      cuttings.[@grow]
    sources:
      - grow
  clubs:
    status: tolerated
    text: >-
      The [social-club model](/culture/traditions/cannabis-social-clubs/) developed around private
      personal use and the narrow shared-consumption doctrine.[@tdpf18,tni] Transform estimated
      roughly 400 clubs or similar associations in 2018, concentrated in Catalonia and the Basque
      Country.[@tdpf18] Its description includes admission through existing members, projected
      member consumption, cost-covering fees and voluntary rules.[@tdpf18] These are operating
      practices rather than a national legal allowance.[@tni] In the Ebers litigation, organised
      supply to 290 members fell outside the private shared-use rationale; a later constitutional
      appeal concerned the defendants’ procedural rights.[@ebers] ICEERS reported Barcelona fines
      and closure orders in 2024.[@ice24] A July 2026 tobacco-law draft would remove the exemption
      for private smokers’ clubs on which cannabis clubs also rely.[@boc26]
    sources:
      - tdpf18
      - tni
      - ebers
      - ice24
      - boc26
  black_market:
    text: >-
      The Interior Ministry reported state-force seizures of 257 tonnes of hashish in 2025, up 29%
      on 2024.[@int26] It compared this with 357 tonnes in 2023, 318 in 2022 and 672 in 2021, and
      recorded 875,000 cannabis plants seized in 2025.[@int26] Police pressure had pushed smugglers
      to alternate beach landings with road transport, according to the ministry.[@int26] These
      figures exclude regional police seizures.[@int26]
    sources:
      - int26
  driving:
    status: zero
    text: >-
      Article 14 of the road traffic law forbids driving with drugs in the body. No impairment has
      to be shown and no threshold applies. The fine is 1,000 euros and six licence points.[@boe_ts]
      The ban leaves out a substance used under a doctor's prescription for treatment, when the
      driver can still drive with the care the law requires.[@boe_ts] In the first year or so after
      the 2014 change, more than 20,000 drivers were sanctioned.[@int15]
    sources:
      - boe_ts
      - int15
  arrests:
    text: >-
      An account of the Interior Ministry’s 2023 yearbook reported 198,570 sanctions for public drug
      possession or use, collecting about €130 million.[@ep24] This was an all-drug total, without a
      cannabis-specific count.[@ep24] It also reported 109 sanctions for cultivation visible to the
      public.[@ep24] The governing parties agreed a lower-fine proposal in 2024, but the
      consolidated statute still sets €601–30,000 for serious offences.[@ep24,boe]
    sources:
      - ep24
      - boe
  research:
    status: licensed
    text: >-
      AEMPS lists nine holders of research cultivation authorisations as of 31 July 2026, including
      the Institute of Plant Molecular and Cellular Biology, Phytoplant Research and Trichome
      Pharma.[@aempslist] Its separate medical/scientific list also authorises Oils4Cure to grow for
      a clinical trial.[@aempslist] These are cultivation permissions; the list gives no trial
      outcome.[@aempslist]
    sources:
      - aempslist
  visitors:
    status: none
    text: >-
      Club membership gives no general exemption from the criminal rules on supply.[@ebers]
      Associations are intended as closed groups rather than public shops.[@tdpf18] Visitors face
      the same public-possession and public-use provisions, with fines from €601.[@boe]
    sources:
      - ebers
      - tdpf18
      - boe
  hemp:
    status: strict
    text: >-
      Industrial cultivation for fibre, grain or seed can proceed without prior AEMPS authorisation
      when the agricultural conditions are met: certified seed from eligible varieties and THC no
      higher than 0.3%.[@hempmapa] Harvesting flowers is outside that exception; low THC alone does
      not remove the medicines agency’s cultivation controls.[@aempsgrow] Spain also has an older
      fibre-hemp history: a [1940 decree](/history/spain-hemp-production-decree-1940/) regulated
      production, movement and prices while directing support for growers.[@hemp40]
    sources:
      - hempmapa
      - aempsgrow
      - hemp40
  culture:
    text: >-
      Spain’s [cannabis social clubs](/culture/traditions/cannabis-social-clubs/) built a
      collective, non-profit supply model around membership and shared cultivation.[@tdpf18] Members
      pay production costs and associations use internal rules to limit distribution and contact
      with outsiders.[@tdpf18] The [2001 history entry](/history/spain-social-clubs-2001/) marks the
      model’s emergence, although its continuing legal exposure differs from countries that later
      wrote clubs into law.[@tdpf18,tni]
    sources:
      - tdpf18
      - tni
