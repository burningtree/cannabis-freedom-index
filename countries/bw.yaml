name: Botswana
region: Africa
iso_numeric: 72
recreational: illegal
medical: limited
updated: 2026-10-14
summary: >-
  Possession of 60 g or less remains an offence, but a December 2025 amendment excludes prison
  and caps the fine at P10,000. Licensed medical, research and industrial cannabis is permitted.
scores:
  possession: 1
  cultivation: 1
  enforcement: 2
  sharing: 1
  consumption: 1
  access: 1
segments:
  possession:
    text: >-
      Under the amended Illicit Traffic in Narcotic Drugs and Psychotropic Substances Act,
      possession of 60 g or less of cannabis (dagga, or motokwane) is a low-level offence with a
      fine up to P10,000 or prescribed alternatives; the person shall not be imprisoned.
      A notice requires payment within 21 days, with mandatory rehabilitation as prescribed.
      Above 60 g but below 1 kg, the published law provides up to P20,000, three years, or both;
      above 1 kg, up to P500,000, ten years, or both. The text does not resolve exactly 1 kg.
      Cannabis preparations have a separate provision carrying up to P20,000, three years, or both.
    sources:
      - drug_amend25
      - drug_current
      - drug_commence25
  cultivation:
    text: Unlawful cultivation carries a fine of up to 500,000 pula or up to twenty years.
    sources:
      - dn
      - law
  enforcement:
    text: >-
      Older court reporting describes fines with prison in default of payment. The amendment
      effective 22 December 2025 instead excludes imprisonment for low-level cannabis possession,
      including nonpayment, and provides prescribed alternatives and rehabilitation. Implementation
      of those programmes and post-amendment sentencing practice remain unverified.
    sources:
      - dn
      - drug_amend25
      - drug_commence25
  sharing:
    text: Trafficking carries long prison terms.
    sources:
      - law
  consumption:
    text: Use is an offence under the Act.
    sources:
      - law
  access:
    text: >-
      A narrow prescription route exists under the Cannabis Act. Licensed pharmacists and health
      professionals may provide cannabis medical products to patients holding a valid medical
      cannabis prescription within the licensed framework.
    sources:
      - ca25
context:
  production:
    text: >-
      The Cannabis Act 2025 allows cultivation, manufacture, transport, import and export under
      licence, with licensing and security requirements set by the Cannabis Regulations 2026.
    sources:
      - wiki
  products:
    text: Licensed cannabis medical products supplied on prescription.
    sources:
      - ca25
  medical:
    text: >-
      Cannabis is legal for medicinal, scientific, research and industrial purposes within the
      licensed framework of the Cannabis Act 2025. Recreational use remains illegal. The act
      received assent in October 2025; its licensing, patient-supply and possession provisions
      (Parts VI–XIII) took effect on 22 December 2025.
    sources:
      - ca25
      - ca25_commence
  consequences:
    text: A conviction is a criminal record.
    sources:
      - dn
  planting:
    seeds: licensed
    seeds_trade: regulated
    clones: licensed
    clones_trade: regulated
    text: >-
      The Cannabis Act 2025 defines cultivation to include "planting, sowing, scattering the
      seeds" and gives the National Cannabis Control Authority the power to license
      cultivation and propagation, for medicinal, scientific, research and industrial purposes
      only. Its definition of cannabis covers all parts of the plant, while the item on
      flowering tops leaves out seeds and leaves not accompanied by the tops.
    sources:
      - ca25
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited.
    sources:
      - dn
      - law
  visitors:
    status: none
    text: >-
      There is no legal recreational supply. The amended Act treats possession of 60 g or less
      as a low-level offence with a fine up to P10,000 or prescribed alternatives, mandatory
      rehabilitation as prescribed, and no imprisonment. This does not authorise purchase,
      cultivation, sale or importation, and no separate exemption for visitors was verified.
    sources:
      - drug_amend25
      - drug_current
  black_market:
    text: >-
      Figures reported by the government to the UN drugs office record 1,268 kg of herbal
      cannabis seized in 2024, against 1,325 kg in 2023. The UN publishes them as kilogram
      equivalents, and countries count seizures differently, so the figures are not
      comparable across borders.
    sources:
      - unodc_szr
  driving:
    status: impairment
    text: >-
      Road Traffic Act section 46(2) prohibits driving or attempting to drive while unfit through
      drugs. Section 46(4) provides P5,000–10,000, two–five years in prison, or both; being in charge
      without driving is a separate offence. Section 48 permits drug-analysis evidence from
      specimens taken within three hours and gives refusal evidential consequences. The published
      section 53 contains overlapping licence provisions: subsection (3) specifies two–five years
      for section 46(2), while (3A) specifies one–three years for section 46 generally. Their
      application needs judicial clarification. The February 2026 announcement of a proposed
      drug-driving ban does not establish that existing section 46 excludes drugs. No numerical
      THC cutoff or current roadside cannabis-testing practice was verified.
    sources:
      - traffic
      - driving26
