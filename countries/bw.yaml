name: Botswana
region: Africa
iso_numeric: 72
recreational: illegal
medical: limited
updated: "2026-10-28"
summary: >-
  Possession of 60 g or less remains an offence, but a December 2025 amendment excludes prison
  and caps the fine at P10,000. Licensed medical and industrial cannabis is permitted, though no
  patient-dispensing route was verified.
scores:
  possession: 1
  cultivation: 1
  enforcement: 2
  sharing: 1
  consumption: 1
  access: 1
words:
  - { word: Dagga, lang: English (Botswana), meaning: "cannabis; the southern African word used in the 2018 Act", sources: [ita18] }
  - { word: Motokwane, lang: Setswana, meaning: "cannabis; the Setswana name used alongside dagga in the 2018 Act", sources: [ita18] }
segments:
  possession:
    text: >-
      Cannabis (dagga, motokwane) is illegal to possess. Since 22 December 2025, 60 g or less is a
      low-level offence carrying a fine of up to P10,000, a 21-day notice and prescribed
      rehabilitation, and the offender "shall not be imprisoned".[@ita18,amend25,commence25] More than 60 g but
      less than 1 kg carries up to P20,000, three years, or both; more than 1 kg carries up to
      P500,000, ten years, or both.[@amend25] Exactly 1 kg falls between the two tiers because the
      amendment says "less than" and "more than".[@amend25] Cannabis preparations carry a separate
      maximum of P20,000, three years, or both.[@amend25]
    sources:
      - ita18
      - amend25
      - commence25
    currency: BWP
    penalties:
      - upto: 60 g
        treatment: criminal
        term: Low-level possession
        fine: 10000
        note: No imprisonment; 21-day notice and prescribed rehabilitation
      - over: 60 g
        upto: 1 kg
        treatment: criminal
        term: Possession
        prison: 3 years
        fine: 20000
      - over: 1 kg
        treatment: criminal
        term: Possession
        prison: 10 years
        fine: 500000
      - label: Cannabis preparations
        treatment: criminal
        term: Possession
        prison: 3 years
        fine: 20000
  cultivation:
    text: >-
      Unlawful cultivation carries up to P500,000, twenty years, or both, and cannabis found on
      cultivated land is evidence that the owner or occupier knew of it.[@ita18] Producing or
      dealing in cannabis can instead be charged under the dealing provision, which carries fifteen
      to twenty years without the option of a fine and up to P1,000,000, or under the Cannabis Act's
      licensing offences, which carry up to P1,000,000 and fifteen years.[@ita18,cannabis25] The
      overlap leaves prosecutors a wide choice of penalty.[@ita18,cannabis25]
    sources:
      - ita18
      - cannabis25
    currency: BWP
    penalties:
      - label: Unlawful cultivation
        treatment: criminal
        term: Cultivation
        prison: 20 years
        fine: 500000
        note: Cannabis on cultivated land is proof of cultivation with the owner's or occupier's knowledge
      - label: Producing or dealing
        treatment: criminal
        term: Dealing
        prison_min: 15 years
        prison: 20 years
        fine: 1000000
        note: No option of a fine for the prison term
      - label: Unlicensed cultivation under the Cannabis Act
        treatment: criminal
        term: Licensing offence
        prison: 15 years
        fine: 1000000
  enforcement:
    text: >-
      The 60 g tier removes imprisonment, but prison remains available above it, and cultivation and
      trafficking carry long terms.[@amend25,ita18] Small cases reported in 2025–2026 ranged from
      about 300 g to a 500 kg farm, and the 2024 seizure total was 1,268 kg of herbal cannabis.[@gantsi26,unodc_szr]
      No national arrest total for 2024–2026 was published.[@nra26]
    sources:
      - amend25
      - ita18
      - gantsi26
      - unodc_szr
      - nra26
  sharing:
    text: >-
      Trafficking — sale, supply, transport, import, export and manufacture — carries up to
      P500,000, twenty-five years, or both.[@ita18] Dealing is charged separately, with fifteen to
      twenty years without the option of a fine and up to P1,000,000, and unlawful supply carries up
      to P500,000 and twenty years.[@ita18] Giving cannabis to another person is not exempt.[@ita18]
    sources:
      - ita18
    currency: BWP
    penalties:
      - label: Trafficking
        treatment: criminal
        term: Trafficking
        prison: 25 years
        fine: 500000
      - label: Dealing
        treatment: criminal
        term: Dealing
        prison_min: 15 years
        prison: 20 years
        fine: 1000000
        note: No option of a fine for the prison term
      - label: Unlawful supply or procurement
        treatment: criminal
        term: Supply
        prison: 20 years
        fine: 500000
  consumption:
    text: >-
      Use is an offence under section 4 of the 2018 Act.[@ita18] The penalty provisions are written
      around possession quantities, so the sanction for use alone is unclear; possession of 60 g or
      less brings the low-level fine and rehabilitation route.[@amend25] Licensed use is confined to
      the medical and research framework, not recreation.[@cannabis25]
    sources:
      - ita18
      - amend25
      - cannabis25
  access:
    text: >-
      The Cannabis Act 2025 permits licensed medical production, and section 48(3) contemplates a
      prescription, including for an under-18 patient through a pharmacist or health professional
      with parental consent.[@cannabis25] Section 55's list of people authorised to possess cannabis
      names health professionals, veterinary surgeons, nurses and laboratory heads, not patients, and
      no dispensing route was verified.[@cannabis25] The route is therefore narrow and not yet
      operational.[@cannabis25]
    sources:
      - cannabis25
answers:
  buy:
    answer: limited
    text: A medical prescription route is contemplated, but no dispensing route was verified
context:
  recreational:
    text: >-
      Recreational use, purchase and growing remain illegal.[@ita18] Since 22 December 2025,
      possessing 60 g or less is a low-level offence with a fine of up to P10,000, no imprisonment and
      prescribed rehabilitation; larger amounts and supply remain serious crimes.[@amend25] There is
      no legal recreational seller or club.[@ita18]
      [The 2025 amendment removed prison for 60 g or less.](/history/botswana-low-level-possession-amendment-2025/)
    sources:
      - ita18
      - amend25
  production:
    status: medical
    text: >-
      The Cannabis Act 2025 licenses cultivation, manufacture, transport, import and export for
      medicinal, scientific, research and industrial purposes.[@cannabis25] The 2026 regulations set
      a 0.7% THC limit for industrial cannabis and provide three-year cultivation and five-year
      manufacturing licences.[@regs26] The first licence, for medical cannabis and industrial hemp,
      was announced on 30 March 2026.[@firstlicence26]
    sources:
      - cannabis25
      - regs26
      - firstlicence26
  medical:
    text: >-
      Licensed production for medical and scientific use is permitted, and section 48(3) contemplates
      prescriptions.[@cannabis25,ca25_commence] The Act does not clearly authorise patients to possess cannabis:
      section 55 lists health professionals and laboratory heads, not patients.[@cannabis25] No
      pharmacy or dispensary route was verified.[@cannabis25]
    sources:
      - cannabis25
      - ca25_commence
  hemp:
    status: standard
    text: >-
      Industrial cannabis is licensed under the Cannabis Act 2025 for non-drug commercial use.[@cannabis25]
      The 2026 regulations set a 0.7% THC limit, with three-year cultivation and five-year
      manufacturing licences.[@regs26] The first medical and industrial licence was announced in March
      2026, and government earmarked Dibete Farm for a commercial hemp rollout after trials.[@firstlicence26,regs26]
    sources:
      - cannabis25
      - regs26
      - firstlicence26
  consequences:
    text: >-
      A conviction is a criminal record. The low-level possession tier instead provides a notice, a
      fine of up to P10,000 and prescribed rehabilitation, with alternatives to imprisonment if the
      fine is not paid.[@amend25]
    sources:
      - amend25
  planting:
    seeds: licensed
    seeds_trade: regulated
    clones: licensed
    clones_trade: regulated
    text: >-
      The Cannabis Act 2025 defines cultivation to include "planting, sowing, scattering the seeds"
      and gives the National Cannabis Control Authority power to license cultivation and
      propagation.[@cannabis25] Its definition of cannabis covers all parts of the plant, while the
      item on flowering tops leaves out seeds and leaves not accompanied by the tops.[@cannabis25]
      Seed and clone trade is therefore lawful only within the licensed framework.[@cannabis25]
    sources:
      - cannabis25
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: unlicensed growing and
      supplying cannabis to another person are both prohibited.[@ita18,cannabis25]
    sources:
      - ita18
      - cannabis25
  culture:
    text: >-
      Cannabis is known as [dagga](/culture/language/dagga/) and motokwane in the 2018
      Act.[@ita18] Dagga still dominates the drug trade: the 2025 risk assessment put
      marijuana at P48.8 million of a P54 million illicit market.[@nra26] The 2025 Cannabis
      Act licenses medical and industrial cannabis but not recreational use, as that
      [Act](/history/botswana-cannabis-act-2025/) records.[@cannabis25]
    sources:
      - ita18
      - nra26
      - cannabis25
  visitors:
    status: none
    text: >-
      There is no legal recreational supply. The 60 g low-level tier applies to anyone in possession,
      but it does not authorise purchase, cultivation, sale or importation, and no visitor exemption
      was verified.[@amend25,cannabis25]
    sources:
      - amend25
      - cannabis25
  black_market:
    text: >-
      The government reported 1,268 kg of herbal cannabis seized in 2024, against 1,325 kg in
      2023.[@unodc_szr] A 2025 national risk assessment put marijuana's estimated value at
      P48.8 million of a P54 million illicit drug market, based on proceeds from confiscated drugs
      rather than annual turnover.[@nra26]
    sources:
      - unodc_szr
      - nra26
  arrests:
    text: >-
      No national arrest total for 2024–2026 was published.[@nra26] Reported cases include a
      500 kg farm at Gantsi in April 2026, a 5 kg arrest at a Gabane roadblock in November 2025 and
      about 300 g in 52 sachets at Metsimotlhabe in December 2025.[@gantsi26] The 2024 seizure total
      was 1,268 kg of herbal cannabis.[@unodc_szr]
    sources:
      - nra26
      - gantsi26
      - unodc_szr
  driving:
    status: impairment
    text: >-
      Road Traffic Act section 46(2) prohibits driving or attempting to drive while unfit through
      drugs.[@traffic] Section 46(4) provides P5,000–10,000, two–five years in prison, or both; being
      in charge without driving is a separate offence.[@traffic] Section 48 permits drug-analysis
      evidence from specimens taken within three hours and gives refusal evidential
      consequences.[@traffic] The published section 53 contains overlapping licence provisions, and
      no numerical THC cutoff or roadside cannabis-testing practice was verified.[@traffic,driving26]
    sources:
      - traffic
      - driving26
