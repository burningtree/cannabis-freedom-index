segments:
  possession:
    text: >-
      Cannabis (dagga, or motokwane) is prohibited by the Illicit Traffic in Narcotic Drugs and
      Psychotropic Substances Act 2018. Possession of less than 60 g carries a fine of up to 20,000
      pula or up to three years in prison, or both; more than 60 g carries a fine of up to 500,000
      pula or up to ten years.
    sources:
      - dn
      - law
  cultivation:
    text: Unlawful cultivation carries a fine of up to 500,000 pula or up to twenty years.
    sources:
      - dn
      - law
  enforcement:
    text: >-
      Magistrates' courts hear a steady stream of small dagga cases, most ending in fines with
      prison in default of payment.
    sources:
      - dn
  sharing:
    text: Trafficking carries long prison terms.
    sources:
      - law
  consumption:
    text: Use is an offence under the Act.
    sources:
      - law
  access:
    text: None.
    sources:
      - trip
context:
  production:
    text: >-
      The Cannabis Act 2025 allows cultivation, manufacture, transport, import and export under
      licence, with licensing and security requirements set by the Cannabis Regulations 2026.
    sources:
      - wiki
  products:
    text: None.
    sources:
      - trip
  medical:
    text: >-
      Cannabis is legal for medicinal, scientific, research and industrial purposes within the
      licensed framework of the Cannabis Act 2025. Recreational use remains illegal.
    sources:
      - wiki
  consequences:
    text: A conviction is a criminal record.
    sources:
      - dn
  planting:
    seeds: licensed
    seeds_trade: regulated
    clones: licensed
    clones_trade: regulated
    text: >-
      The Cannabis Act 2025 defines cultivation to include "planting, sowing, scattering the
      seeds" and gives the National Cannabis Control Authority the power to license
      cultivation and propagation, for medicinal, scientific, research and industrial purposes
      only. Its definition of cannabis covers all parts of the plant, while the item on
      flowering tops leaves out seeds and leaves not accompanied by the tops.
    sources:
      - ca25
