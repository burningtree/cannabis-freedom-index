segments:
  possession:
    text: >-
      Cannabis (dagga, or motokwane) is prohibited by the Illicit Traffic in Narcotic Drugs and
      Psychotropic Substances Act 2018. Possession of less than 60 g carries a fine of up to 20,000
      pula or up to three years in prison, or both; more than 60 g carries a fine of up to 500,000
      pula or up to ten years.
    sources:
      - dn
      - law
  cultivation:
    text: Unlawful cultivation carries a fine of up to 500,000 pula or up to twenty years.
    sources:
      - dn
      - law
  enforcement:
    text: >-
      Magistrates' courts hear a steady stream of small dagga cases, most ending in fines with
      prison in default of payment.
    sources:
      - dn
  sharing:
    text: Trafficking carries long prison terms.
    sources:
      - law
  consumption:
    text: Use is an offence under the Act.
    sources:
