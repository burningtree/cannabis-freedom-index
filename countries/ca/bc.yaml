name: British Columbia
recreational: legal
medical: legal
updated: 2026-10-24
summary: >-
  Age 19. Government shops and private licensed shops. Adults may generally smoke or vape where
  tobacco smoking is allowed, with further bans in parks, near schools and in vehicles.
scores:
  possession: 6
  cultivation: 4
  enforcement: 6
  sharing: 5
  consumption: 6
  access: 6
segments:
  possession: >-
    Adults 19 and older may possess up to 30 g of dried non-medical cannabis, or its equivalent,
    in public, and may buy that much in one transaction. At home the household may possess up
    to 1,000 g of dried non-medical cannabis, or its equivalent.
  cultivation: Four plants per residence, as federal law allows.
  enforcement: >-
    Possessing and growing inside the stated limits is not a federal offence. Selling without
    authorisation under the federal Act carries up to 14 years.
  sharing: >-
    An adult may distribute up to 30 g of dried cannabis, or its equivalent. Distribute includes
    giving.
  consumption: >-
    Adults may generally smoke or vape in a public place where tobacco smoking and vaping are
    allowed. Smoking or vaping is not allowed in municipal, regional or provincial parks, except
    some designated areas and campsites, or at playgrounds, sports fields and schools, or inside
    public buildings, or within six metres of a bus stop or similar place. Consuming cannabis
    while operating a vehicle or boat, or as a passenger, is illegal. Local rules may restrict
    use further. The province states no restriction on adults using cannabis in a privately
    owned home. A landlord or a strata corporation can restrict or ban smoking or growing.
  access: >-
    Government-operated shops, in person and online, and private licensed shops. The minimum
    age is 19.
