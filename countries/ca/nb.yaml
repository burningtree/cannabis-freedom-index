name: New Brunswick
recreational: legal
medical: legal
updated: 2026-10-24
summary: >-
  Age 19. Cannabis NB shops, approved private retailers and farmgate outlets. Adults may consume
  at a private dwelling, on its land, or at an occupied campsite.
scores:
  possession: 6
  cultivation: 4
  enforcement: 6
  sharing: 5
  consumption: 3
  access: 6
segments:
  possession: >-
    Adults 19 and older may carry 30 g of dried cannabis, or its equivalent, in public.
  cultivation: >-
    Up to four plants, as federal law allows. A person 19 or older may cultivate them only at
    their dwelling-house, from seeds or plants they lawfully possess. Outdoors the plants must
    stand inside a locked enclosure at least 1.52 metres high. Indoors they must be in a separate
    locked space.
  enforcement: >-
    Selling without authorisation under the federal Act carries up to 14 years.
  sharing: >-
    An adult may distribute up to 30 g of dried cannabis, or its equivalent. Distribute includes
    giving.
  consumption: >-
    Adults may consume at home, on the adjoining property, including a backyard, or at an occupied
    campsite. Consumption in public is prohibited. In someone else's home, the homeowner's
    permission is required.
  access: >-
    Cannabis NB shops, approved private retailers and private farmgate outlets. Cannabis NB also
    sells online.
