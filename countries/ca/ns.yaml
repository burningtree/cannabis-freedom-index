name: Nova Scotia
recreational: legal
medical: legal
updated: 2026-10-24
summary: >-
  Age 19. Sold only through the Nova Scotia Liquor Corporation. Combustible cannabis in public
  follows the Smoke-free Places Act, and a municipality may restrict it further.
scores:
  possession: 6
  cultivation: 4
  enforcement: 6
  sharing: 5
  consumption: 5
  access: 6
segments:
  possession: >-
    Adults 19 or older may have up to 30 g of dried cannabis, or its equivalent, in public. The
    province states there is no restriction on how much may be kept at home for personal use.
  cultivation: >-
    Adults of legal age may grow up to four plants per household. Each apartment in a house or
    building counts as its own household. A municipality may restrict cultivation further.
  enforcement: >-
    Buying cannabis from anywhere other than the NSLC brings a fine of at least $600. Provincial
    fine increases took effect on 25 June 2026: buying outside the NSLC brings C$600–5,000,
    illegal individual sales C$5,000–25,000 and business sales C$15,000–50,000. New offences also
    target promotion of illegal sales and landlords allowing sales on their property. Selling
    without authorisation under the federal Act carries up to 14 years.
  sharing: >-
    An adult may distribute up to 30 g of dried cannabis, or its equivalent. Distribute includes
    giving.
  consumption: >-
    The Smoke-free Places Act applies to combustible cannabis in public places, and a violation
    can bring a fine of up to $2,000. A municipality may restrict use further. Cannabis may be
    used at home. It cannot be used in a vehicle by a driver or a passenger.
  access: >-
    The NSLC is the only authorised retailer of recreational cannabis. Adults 19 or over may buy
    at designated NSLC stores or online.
