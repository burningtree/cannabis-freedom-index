name: Nova Scotia
recreational: legal
medical: legal
updated: 2026-10-17
summary: >-
  Age 19. Sold only through the government-run provincial liquor corporation; smoking follows
  tobacco rules.
scores:
  possession: 6
  cultivation: 4
  enforcement: 6
  sharing: 5
  consumption: 5
  access: 6
segments:
  possession: >-
    The federal limit applies: adults 19+ may carry 30 g of dried cannabis, or its equivalent, in
    public. There is no provincial cap at home.
  cultivation: Four plants per residence, as federal law allows.
  enforcement: >-
    Nothing within the limits. Provincial offences, such as consuming in the wrong place, are
    ticketed; unlicensed selling is a federal crime with up to 14 years. Provincial fine increases
    took effect on 25 June 2026: buying outside the NSLC brings C$600–5,000, illegal individual
    sales C$5,000–25,000 and business sales C$15,000–50,000. New offences also target promotion of
    illegal sales and landlords allowing sales on their property.
  sharing: Adults may share up to 30 g with other adults.
  consumption: "Follows tobacco rules: allowed where smoking is, with municipal restrictions."
  access: Government-operated shops run by the provincial liquor corporation, and online.
