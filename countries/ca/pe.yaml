name: Prince Edward Island
recreational: legal
medical: legal
updated: 2026-10-24
summary: >-
  Age 19. Government-run shops only. Up to four plants, with a locked outdoor enclosure and written
  landlord permission for a tenant. Consumption is limited to private residences.
scores:
  possession: 6
  cultivation: 4
  enforcement: 6
  sharing: 5
  consumption: 3
  access: 6
segments:
  possession: >-
    The federal limit applies: adults 19+ may carry 30 g of dried cannabis, or its equivalent, in
    public. There is no provincial cap at home.
  cultivation: >-
    Up to four plants, as federal law allows, and only in the person's private dwelling. Indoors
    the space must be inaccessible to anyone under 19 and to anyone who has not been invited in.
    Outdoors the plants must stand inside a locked enclosure at least 1.52 metres high and must
    not be visible from public space beyond the property. A tenant needs the landlord's written
    permission. A condominium bylaw can prohibit growing in a unit.
  enforcement: >-
    Nothing within the limits. Provincial offences, such as consuming in the wrong place, are
    ticketed; unlicensed selling is a federal crime with up to 14 years.
  sharing: Adults may share up to 30 g with other adults.
  consumption: Private residences only; consumption in public places is prohibited.
  access: Government-operated shops and online sales only.
