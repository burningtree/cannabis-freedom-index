name: Prince Edward Island
recreational: legal
medical: legal
updated: 2026-10-24
summary: >-
  Age 19. Government-run shops only. Up to four plants, with a locked outdoor enclosure and written
  landlord permission for a tenant. Consumption is limited to a private home and its yard, or
  vacant land with the owner's consent.
scores:
  possession: 6
  cultivation: 4
  enforcement: 6
  sharing: 5
  consumption: 3
  access: 6
segments:
  possession: >-
    The legal age is 19. The public possession limit is 30 g. The province states there is no
    limit on how much purchased cannabis may be kept in a private dwelling, apart from the
    four-plant household limit.
  cultivation: >-
    Up to four plants, as federal law allows, and only in the person's private dwelling. Indoors
    the space must be inaccessible to anyone under 19 and to anyone who has not been invited in.
    Outdoors the plants must stand inside a locked enclosure at least 1.52 metres high and must
    not be visible from public space beyond the property. A tenant needs the landlord's written
    permission. A condominium bylaw can prohibit growing in a unit.
  enforcement: >-
    A provincial violation can bring a fine of $200 to $400, or $400 to $700 for a second or
    later offence. An officer may give a warning instead. Selling without authorisation under
    the federal Act carries up to 14 years.
  sharing: >-
    Legally purchased cannabis may be shared with a person who is 19 or older. Under the federal
    Act an adult may not distribute more than 30 g of dried cannabis, or its equivalent.
  consumption: >-
    Cannabis may be consumed in a private home and the yard attached to it, and on vacant land
    with the owner's consent. The province says it may not be smoked at work or on public
    property.
  access: Government-operated shops and online sales only.
