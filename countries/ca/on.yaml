name: Ontario
recreational: legal
medical: legal
updated: 2026-10-24
summary: >-
  Age 19. Private licensed shops and a government online store. Smoking and vaping are allowed
  in many outdoor public places, and not in enclosed public places.
scores:
  possession: 6
  cultivation: 4
  enforcement: 6
  sharing: 5
  consumption: 6
  access: 6
segments:
  possession: >-
    A person must be 19 or older to possess recreational cannabis. The maximum in public is
    30 g of dried cannabis, or its equivalent.
  cultivation: >-
    A person 19 or older may grow up to four plants per residence, not per person, for personal
    use. The starting material has to come from the Ontario Cannabis Store or an authorised
    retail store. A lease or condominium rule can forbid it.
  enforcement: >-
    No person may sell cannabis except an authorised cannabis retailer. Selling without
    authorisation under the federal Act is an offence with up to 14 years.
  sharing: >-
    An adult may distribute up to 30 g of dried cannabis, or its equivalent. Distribute
    includes giving. No person under 19 may distribute cannabis.
  consumption: >-
    Smoking and vaping are allowed in private residences and in many outdoor public places,
    including sidewalks and parks. They are not allowed in enclosed public places or enclosed
    workplaces, at a school or playground or within 20 metres of those grounds, or in a vehicle
    or boat that is being driven or will be driven. A municipal bylaw, lease or property rule
    may add restrictions.
  access: >-
    Private licensed shops, and a government online store. The minimum age is 19.
