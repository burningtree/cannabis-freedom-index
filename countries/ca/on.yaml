name: Ontario
recreational: legal
medical: legal
updated: 2026-10-04
summary: >-
  Age 19. The largest private retail market in the country; smoking allowed almost anywhere tobacco
  is.
scores:
  possession: 6
  cultivation: 4
  enforcement: 6
  sharing: 5
  consumption: 6
  access: 6
segments:
  possession: >-
    The federal limit applies: adults 19+ may carry 30 g of dried cannabis, or its equivalent, in
    public. There is no provincial cap at home.
  cultivation: Four plants per residence, as federal law allows.
  enforcement: >-
    Nothing within the limits. Provincial offences, such as consuming in the wrong place, are
    ticketed; unlicensed selling is a federal crime with up to 14 years.
  sharing: Adults may share up to 30 g with other adults.
  consumption: >-
    Allowed in most places where tobacco smoking is, but not near children, in vehicles or where
    local by-laws forbid it.
  access: The provincial online store and the largest private retail network in the country.
sources:
