  access: 6
segments:
  possession: >-
    Adults 19 and older may carry 30 g of dried cannabis, or its equivalent, in public.
  cultivation: >-
    Since 1 May 2025 a person 19 or older may grow up to four cannabis plants in their ordinary
    residence, and the household may not exceed four. The plants must be indoors, in a securely
    locked room or container or somewhere a young person cannot reach, and must come from seed or
    plant material that is not illicit.
  enforcement: >-
    Selling without authorisation under the federal Act carries up to 14 years.
  sharing: >-
    An adult may distribute up to 30 g of dried cannabis, or its equivalent. Distribute includes
    giving.
  consumption: >-
    Smoking and vaping non-medical cannabis is prohibited in public places, including streets,
    sidewalks, parks and beaches, school grounds, restaurant patios and the grounds of
    health-care facilities, and in enclosed public places. A designated room in a hospital
    palliative-care unit or an end-of-life hospice is an exception the province describes.
  access: >-
    Private licensed shops and online sales. Bill 56, introduced in October 2026, would remove
    the provincial rule hiding store interiors and allow regulations on minimum staffing.
    The reviewed bill catalogue did not list enactment; federal product-visibility restrictions
    would remain. These proposed changes do not alter current possession or home-growing limits.
