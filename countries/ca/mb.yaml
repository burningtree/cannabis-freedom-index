name: Manitoba
recreational: legal
medical: legal
updated: 2026-10-12
summary: Age 19. Private shops. Home growing was banned until May 2025; public consumption is prohibited.
scores:
  possession: 6
  cultivation: 4
  enforcement: 6
  sharing: 5
  consumption: 3
  access: 6
segments:
  possession: >-
    The federal limit applies: adults 19+ may carry 30 g of dried cannabis, or its equivalent, in
    public. There is no provincial cap at home.
  cultivation: Four plants per residence since May 2025; before that the province banned home growing.
  enforcement: >-
    Nothing within the limits. Provincial offences, such as consuming in the wrong place, are
    ticketed; unlicensed selling is a federal crime with up to 14 years.
  sharing: Adults may share up to 30 g with other adults.
  consumption: Private residences only; consumption in public places is prohibited.
  access: >-
    Private licensed shops and online sales. Bill 56, introduced in October 2026, would remove
    the provincial rule hiding store interiors and allow regulations on minimum staffing.
    The reviewed bill catalogue did not list enactment; federal product-visibility restrictions
    would remain. These proposed changes do not alter current possession or home-growing limits.
