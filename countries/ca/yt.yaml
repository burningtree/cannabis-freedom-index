name: Yukon
recreational: legal
medical: legal
updated: 2026-10-24
summary: >-
  Age 19. Private shops supplied by the territorial corporation. Adults may consume at a private
  residence and its adjoining property, or at a registered campsite.
scores:
  possession: 6
  cultivation: 4
  enforcement: 6
  sharing: 5
  consumption: 3
  access: 6
segments:
  possession: >-
    Adults 19 and older may carry 30 g of dried cannabis, or its equivalent, in public.
  cultivation: >-
    An adult may grow up to four cannabis plants at one time in their dwelling-house. Where two
    or more adults live there, the household may not grow more than four.
  enforcement: >-
    Selling without authorisation under the federal Act carries up to 14 years.
  sharing: >-
    An adult may distribute up to 30 g of dried cannabis, or its equivalent. Distribute includes
    giving.
  consumption: >-
    Adults may consume cannabis at a private residence and the property adjoining it, or at another
    place the regulations allow. In a territorial park, consumption is allowed only within a
    registered campsite, not in a day-use area, a playground or a cook shelter. Smoking or vaping
    is also barred in a daycare, in a group-living facility, and in the presence of a health or
    social-service provider.
  access: Private licensed shops and online sales.
