name: Nunavut
recreational: legal
medical: legal
updated: 2026-10-24
summary: >-
  Age 19. A person may possess up to 150 g of dried cannabis, and 30 g in public. Private licensed
  shops and online sales. Smoking cannabis is prohibited in publicly funded housing, including
  staff housing.
scores:
  possession: 6
  cultivation: 4
  enforcement: 6
  sharing: 5
  consumption: 3
  access: 6
segments:
  possession: >-
    Adults 19 and older may carry 30 g of dried cannabis, or its equivalent, in public. A person
    shall not possess more than 150 g of dried cannabis or its equivalent. That limit is on the
    person, not the household. It does not apply to cannabis held for sale by the Commission, an
    Agent, a licensee or a registered supplier, including their authorised employees and a person
    delivering cannabis to them or a purchase for a remote sales store.
  cultivation: Four plants per residence, as federal law allows.
  enforcement: >-
    Staying within the gram limits does not make smoking lawful in publicly funded housing or
    Government of Nunavut staff housing. A first breach of that rule is a fine of up to $2,000. A
    later conviction can add up to six months. Unlicensed selling is a federal crime with up to 14
    years.
  sharing: Adults may share up to 30 g with other adults.
  consumption: >-
    A person shall not smoke in a private dwelling leased from a publicly funded housing provider.
    That includes the Nunavut Housing Corporation, housing authorities, and staff housing rented
    to public servants. Smoking means a lit or heated device, including one that heats cannabis.
    The ban binds tenants once they receive written notice, including tenancies that began earlier.
    The Department of Health describes the rule as covering cannabis use in those units, on
    balconies, and in hallways and shared spaces. Smoking is also prohibited in public places and
    in a vehicle when someone under 19 is present.
  access: Private licensed shops and online sales.
