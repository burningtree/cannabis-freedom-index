name: Nunavut
recreational: legal
medical: legal
updated: 2026-10-24
summary: >-
  Age 19. A person may possess up to 150 g of dried cannabis, and 30 g in public. Private licensed
  shops and online sales; consumption in private only.
scores:
  possession: 6
  cultivation: 4
