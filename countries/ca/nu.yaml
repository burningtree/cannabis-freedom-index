  consumption: 3
  access: 6
segments:
  possession: >-
    Adults 19 and older may carry 30 g of dried cannabis, or its equivalent, in public. A person
    shall not possess more than 150 g of dried cannabis or its equivalent. That limit is on the
    person, not the household. It does not apply to cannabis held for sale by the Commission, an
    Agent, a licensee or a registered supplier, including their authorised employees and a person
    delivering cannabis to them or a purchase for a remote sales store.
  cultivation: Four plants per residence, as federal law allows.
  enforcement: >-
    Nothing within the limits. Provincial offences, such as consuming in the wrong place, are
    ticketed; unlicensed selling is a federal crime with up to 14 years.
  sharing: Adults may share up to 30 g with other adults.
  consumption: Private residences only; consumption in public places is prohibited.
  access: Private licensed shops and online sales.
