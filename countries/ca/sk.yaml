segments:
  possession: >-
    The legal age to consume or purchase non-medicinal cannabis is 19. The maximum in a public
    place is 30 g of dried cannabis per person of legal age.
  cultivation: >-
    The province uses the federal home-production limit of four cannabis plants per household.
    A landlord may prohibit growing in a rental unit, and a condominium board may pass a bylaw
    on cultivation.
  enforcement: >-
    The government publishes set fines, including $200 for possessing more than 30 g of dried
    cannabis in a public place and $200 for consuming cannabis in a public place or anywhere
    other than a private place. Selling without authorisation under the federal Act carries
    up to 14 years.
  sharing: >-
    Under the federal Act an adult may not distribute more than 30 g of dried cannabis, or its
    equivalent. The province publishes a $200 fine for distributing more than 30 g in a public
    place.
  consumption: >-
    Consuming cannabis in a public place, or in any place other than a private place, is
    prohibited. The published fine is $200.
  access: >-
    Private licensed shops, in person and online. The Saskatchewan Liquor and Gaming Authority
    is the regulator. The legal age is 19.
