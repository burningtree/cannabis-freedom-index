name: Newfoundland and Labrador
recreational: legal
medical: legal
updated: 2026-10-24
summary: Age 19. Government and private licensed shops; consumption only in private residences.
scores:
  possession: 6
  cultivation: 4
  enforcement: 6
  sharing: 5
  consumption: 3
  access: 6
segments:
  possession: >-
    The federal limit applies: adults 19+ may carry 30 g of dried cannabis, or its equivalent, in
    public. There is no provincial cap at home.
  cultivation: >-
    Up to four non-medical plants may be grown in the grower's ordinary dwelling, or in an
    enclosed structure on the premises. The yard itself is excluded. The plants must not be
    accessible to anyone under 19, or visible from a public place.
  enforcement: >-
    Nothing within the limits. Provincial offences, such as consuming in the wrong place, are
    ticketed; unlicensed selling is a federal crime with up to 14 years.
  sharing: Adults may share up to 30 g with other adults.
  consumption: Private residences only; consumption in public places is prohibited.
  access: Government and private licensed shops, in person and online.
