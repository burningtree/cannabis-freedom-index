  enforcement: 6
  sharing: 5
  consumption: 3
  access: 6
segments:
  possession: >-
    Adults 19 and older may carry 30 g of dried cannabis, or its equivalent, in public.
  cultivation: >-
    Up to four non-medical plants may be grown in the grower's ordinary dwelling, or in an
    enclosed structure on the premises. The yard itself is excluded. The plants must not be
    accessible to anyone under 19, or visible from a public place.
  enforcement: >-
    Selling without authorisation under the federal Act carries up to 14 years.
  sharing: >-
    An adult may distribute up to 30 g of dried cannabis, or its equivalent. Distribute includes
    giving.
  consumption: >-
    Adults may consume cannabis in a private dwelling or in the yard attached to it. A hotel room,
    an apartment unit or a rented campsite may allow it, subject to the owner or operator, and not
    in the common areas of those buildings. It is not allowed in a public place, a motor vehicle or
    a boat. A vehicle used as a dwelling may be an exception while it is not in motion or on a road.
  access: Government and private licensed shops, in person and online.
