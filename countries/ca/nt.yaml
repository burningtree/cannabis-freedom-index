name: Northwest Territories
recreational: legal
medical: legal
updated: 2026-10-04
summary: Age 19. Government-run sales; communities may restrict or ban cannabis locally.
scores:
  possession: 6
  cultivation: 4
  enforcement: 6
  sharing: 5
  consumption: 4
  access: 6
segments:
  possession: >-
    The federal limit applies: adults 19+ may carry 30 g of dried cannabis, or its equivalent, in
    public. There is no provincial cap at home.
  cultivation: Four plants per residence, as federal law allows.
  enforcement: >-
    Nothing within the limits. Provincial offences, such as consuming in the wrong place, are
    ticketed; unlicensed selling is a federal crime with up to 14 years.
  sharing: Adults may share up to 30 g with other adults.
  consumption: Allowed on private property and in some public places; communities may restrict it.
  access: Government-operated shops and online sales; communities may hold votes to restrict cannabis.
sources:
