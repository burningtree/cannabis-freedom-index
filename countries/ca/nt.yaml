name: Northwest Territories
recreational: legal
medical: legal
updated: 2026-10-24
summary: >-
  Age 19. Approved vendors, including private shops, and online sales. A community may vote to
  restrict or prohibit cannabis.
scores:
  possession: 6
  cultivation: 4
  enforcement: 6
  sharing: 5
  consumption: 4
  access: 6
segments:
  possession: >-
    The minimum age to purchase, possess and consume cannabis is 19. The Liquor and Cannabis
    Commission states that the federal and territorial possession limit for adults over 19 is
    30 g.
  cultivation: >-
    Adults 19 and over may grow up to four plants per household. The plants must be grown
    indoors, and the seed must be bought from an approved vendor or the approved online store.
    A rental agreement or condominium bylaw can add rules.
  enforcement: >-
    Selling without authorisation under the federal Act carries up to 14 years.
  sharing: >-
    An adult may distribute up to 30 g of dried cannabis, or its equivalent. Distribute includes
    giving.
  consumption: >-
    Use is limited to private property where tobacco smoking is allowed, and to trails, roadways
    when the person is not operating a motor vehicle, and parks when they are not in use for a
    public event. It is prohibited in places frequented by children, including playgrounds,
    school grounds and sports fields, and at outdoor events.
  access: >-
    Cannabis is sold by vendors the Minister designates, including private shops, and through an
    approved online store. A community may vote to restrict or prohibit cannabis. Once a store is
    operating, a vote cannot restrict sales at that store.
