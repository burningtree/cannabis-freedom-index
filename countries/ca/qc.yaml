name: Quebec
recreational: legal
medical: legal
updated: 2026-10-04
summary: >-
  The strictest province: age 21, no home growing, a 150 g cap at home, no public consumption, and
  sales only through the state-run SQDC with a narrower product range.
scores:
  possession: 5
  cultivation: 1
  enforcement: 6
  sharing: 5
  consumption: 3
  access: 5
segments:
  possession: >-
    30 g in public and a provincial cap of 150 g at home. The minimum age is 21, the highest in
    Canada.
  cultivation: >-
    Prohibited by provincial law, with fines for growing even one plant. The Supreme Court of Canada
    upheld the ban in 2023.
  enforcement: >-
    Nothing within the limits. Provincial offences, such as consuming in the wrong place, are
    ticketed; unlicensed selling is a federal crime with up to 14 years.
  sharing: Adults may share up to 30 g with other adults.
  consumption: Prohibited in all public places, indoors and out.
  access: >-
    Only through the state-run SQDC, with a narrower product range: many edibles and high-THC
    products are not sold.
sources:
  - title: Wikipedia — Cannabis in Quebec
