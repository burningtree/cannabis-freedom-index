name: Quebec
recreational: legal
medical: legal
updated: 2026-10-24
summary: >-
  Age 21. Home cultivation is prohibited. A private residence is limited to 150 g of dried
  cannabis. Smoking and vaping are prohibited in places open to the public. Retail sales are
  only through the SQDC.
