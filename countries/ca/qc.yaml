    text: Only in the province's SQDC stores
segments:
  possession: >-
    A person under 21 may not possess cannabis. In a public place, a person 21 or older may
    possess 30 g of dried cannabis or its equivalent. Quebec has not made a regulation reducing
    that federal amount. Outside a public place the limit is 150 g of dried cannabis or its
    equivalent, and in a private residence that 150 g cap applies no matter how many people
    aged 21 or older live there.
  cultivation: >-
    Cultivation for personal use is prohibited, including planting seeds and harvesting. Growing
    four plants or fewer in a dwelling-house is a fine of $250 to $750. The Supreme Court of
    Canada dismissed the appeal against sections 5 and 10 of the Cannabis Regulation Act on
    14 April 2023.
  enforcement: >-
    The fine for growing four plants or fewer at home is $250 to $750. Selling cannabis, other
    than as the SQDC or a producer in the cases the Act allows, is a provincial offence.
    Selling without authorisation under the federal Act carries up to 14 years.
  sharing: >-
    An adult may distribute up to 30 g of dried cannabis, or its equivalent, under the federal
    Act. Distribute includes giving. A person under 21 may not give cannabis.
  consumption: >-
    Smoking or vaping cannabis is prohibited in indoor and outdoor spaces open to the public,
    including public roads. A local municipality may, by regulation, permit smoking in a
    municipal park, except where tobacco smoking or vaping is already prohibited.
  access: >-
    Only the SQDC may sell cannabis at retail. The SQDC states that the maximum THC content of
    the cannabis it sells is 30 percent.
