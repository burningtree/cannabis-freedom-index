summary: >-
  Fully legal since October 2018: 30 g in public, four plants per household in most provinces,
  gifting between adults, and licensed retail and delivery across the country.
scores:
  possession: 6
  cultivation: 4
  enforcement: 6
  sharing: 5
  consumption: 5
  access: 6
segments:
  possession:
    text: >-
      Adults (18+, 19 or 21 in most provinces) may carry up to 30 g of dried cannabis in public, or
      its equivalent in other forms (for example 150 g of fresh cannabis or 7.5 g of concentrate).
      Federal law sets no cap at home, though some provinces add one. It must be 'legal cannabis'
      from a licensed source. Carrying more than 30 g in public is an offence punishable by up to
      five years less a day.
    sources:
      - justice
      - bc
  cultivation:
    text: >-
      Up to four plants per residence — not per adult — grown from licensed seeds or seedlings.
      Quebec prohibits home growing entirely. Any fifth plant is an offence. A hard household cap
      and a required legal seed source keep this well short of gardening freedom.
    sources:
      - justice
      - act
  enforcement:
    text: >-
      Personal conduct inside the limits is not punished. Outside them the Act is severe: up to 14
      years for unlicensed sale, production, export or supplying a minor, with ticketing for small
      overages.
    sources:
      - justice
      - act
  sharing:
    text: >-
      Adults may give up to 30 g of legal cannabis to another adult without payment. Any payment
      turns it into unlicensed sale, and giving to anyone under 18 carries up to 14 years.
    sources:
      - justice
  consumption:
    text: >-
      Using is legal, but where is decided by provinces and cities. Some treat it like tobacco;
      others restrict it to private residences. Landlords and condo boards can ban smoking, and
      licensed consumption lounges remain rare.
    sources:
      - hc
      - bc
  access:
    text: >-
      Licensed shops and online ordering exist in every province and territory, privately run in
      some and government monopolies in others. Purchases are capped at 30 g per transaction. Only
      provincially authorised retailers may sell; everything else is a criminal market.
    sources:
      - justice
      - hc
context:
  production:
    text: >-
      Anyone can apply for a federal cultivation or processing licence, including small 'micro'
      classes, and there is no cap on licence numbers. But security clearances, site requirements,
      excise stamps and compliance costs are heavy, and unlicensed commercial production carries up
      to 14 years.
    sources:
      - act
      - hc
  products:
    text: >-
      Flower, pre-rolls, oils, edibles, drinks, vapes, concentrates and topicals are all legal.
      Limits: edibles are capped at 10 mg THC per package, extracts at 1,000 mg per container, with
      plain packaging, health warnings and a near-total ban on promotion.
    sources:
      - hc
      - justice
  medical:
    text: >-
      Any physician or nurse practitioner can authorise medical use with no list of qualifying
      conditions. Patients buy from federal licence holders by mail, or register with Health Canada
      to grow their own or designate a grower. Still a registration system, and not covered by
      public insurance.
    sources:
      - hc
  consequences:
    text: >-
      Drug-impaired driving law uses per-se THC blood limits, so a regular user can be over the
      limit without being impaired. Past simple-possession convictions can be cleared through a
      free, expedited record suspension — on application, not automatically. Admitting to cannabis
      use can still get a traveller refused at the US border.
    sources:
      - justice
      - hc
  planting:
    seeds: legal
    seeds_trade: regulated
    clones: legal
    clones_trade: regulated
    text: >-
      Seeds and plants are legal classes of cannabis that licensed sellers may sell. One seed
      counts as one gram towards the possession limit, and an adult may hold up to four plants
      that are not budding or flowering. Provinces set where starting material may be bought.
    sources:
      - act
  black_market:
    text: >-
      The legal market has taken most of the trade. In Health Canada's 2024 survey, 72% of
      people who used cannabis usually bought it from a legal shop or website, up from 37% in
      2019, and only 3% from an illegal shop, website or dealer, down from 16%. Another 15%
      got it from friends or family and 5% grew their own. Users spent about 53 dollars a
      month on legal cannabis and 8 dollars on illegal, and paid on average 8.41 dollars for a
      gram of dried flower.
    sources:
      - ccs24
  clubs:
    status: underground
    text: >-
      Legalisation built a system of licensed producers and shops and left no room for
      members' clubs: cannabis may only be sold with a federal or provincial licence. The
      medical compassion clubs that had sold openly since the 1990s were not absorbed into it,
      and those that carried on are treated as unlicensed sellers. The best-documented cases
      are in British Columbia. The B.C. Compassion Club Society in Vancouver closed in 2022
      after about 25 years of selling without a licence. The Victoria Cannabis Buyers Club has
      been raided four times by the provincial Community Safety Unit, in 2019, 2020, 2022 and
      April 2026, and the courts upheld a 3.2 million dollar penalty against it in 2024; the
      unit says it sells contrary to both the provincial licensing act and the federal
      Cannabis Act. By 2022 the province reported having shut 186 unlicensed retailers.
      Patient groups asked the federal review of the Act to allow some form of storefront
      medical sale.
    sources:
      - vn26
      - gm22
  driving:
    status: limit
    text: >-
      Federal criminal law sets fixed blood limits. Between 2 and 5 nanograms of THC per
      millilitre of blood is a summary offence with a fine of up to 1,000 dollars. At 5
      nanograms or more, a first offence carries a mandatory minimum fine of 1,000 dollars and
      up to ten years in prison. A third offence covers THC with alcohol: 2.5 nanograms or
      more together with 50 mg of alcohol per 100 ml of blood, with mandatory minimums of a
      1,000 dollar fine, then 30 days and 120 days in prison for repeat offences.
    sources:
      - jus
  visitors:
    status: open
    text: >-
      There is no residency rule: any adult of the provincial minimum age (18 in Alberta, 21
      in Quebec, 19 elsewhere) may buy from authorised retailers and carry up to 30 g in
      public, and the federal government tells people to know the law of the province they
      live in or visit. The border is the hard limit. Taking cannabis into or out of Canada in
      any form, including CBD oil and cannabis authorised for medical use, is a serious
      criminal offence whatever the amount, and failing to declare it on entry can also lead
      to arrest and prosecution.
    sources:
      - hcprov
      - cbsa
  arrests:
    text: >-
      Police recorded 8,879 cannabis offences in 2024, or 22 per 100,000 people, down 89% from
      194 per 100,000 in 2014, when nearly 70,000 cannabis offences made up two-thirds of all
      drug crime; in 2024 they were 17%. What is left is mostly border crime: of the offences
      under the Cannabis Act, 66% were importation or exportation, 13% possession, 7%
      distribution, 7% sale and 3% production. The cannabis rate rose 30% between 2023 and
      2024, by 2,272 incidents.
    sources:
      - statcan25
