  label: Province or territory
  plural: provinces and territories
  intro: >-
    The federal Cannabis Act applies everywhere in Canada. Provinces and territories set the minimum
    age, where you may consume, how shops work, and whether you may grow at home.
  sources:
    - title: Department of Justice Canada — Cannabis legalization and regulation
