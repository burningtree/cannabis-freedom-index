  cas8:
    title: Cannabis Act, section 8 (current to 30 September 2026)
    url: https://laws-lois.justice.gc.ca/eng/acts/C-24.5/section-8.html
    locator: >-
      Section 8(1)(a) forbids an adult from possessing more than 30 g of dried cannabis in public.
      Section 8(1)(b) forbids possessing any cannabis the person knows is illicit. Section 8(1)(e)
      forbids possessing more than four cannabis plants that are not budding or flowering.
  cas12:
    title: Cannabis Act, section 12 (current to 30 September 2026)
    url: https://laws-lois.justice.gc.ca/eng/acts/C-24.5/section-12.html
    locator: >-
      An adult may cultivate no more than four cannabis plants in the dwelling-house, and two or
      more adults who live there may not between them exceed four. Cultivating from seed or plant
      material the person knows is illicit is prohibited.
  ca_dist:
    title: Cannabis Act, section 9 (current to 30 September 2026)
    url: https://laws-lois.justice.gc.ca/eng/acts/C-24.5/section-9.html
    locator: >-
      An adult may not distribute more than 30 g of dried cannabis or its equivalent, and may not
      distribute a budding or flowering cannabis plant or more than four plants that are not
      budding or flowering. Distribute includes giving.
  ca_sell:
    title: Cannabis Act, section 10 (current to 30 September 2026)
    url: https://laws-lois.justice.gc.ca/eng/acts/C-24.5/section-10.html
    locator: Selling cannabis is prohibited unless authorized under the Act.
  ca_sched:
    title: Cannabis Act, Schedule 3 (current to 30 September 2026)
    url: https://laws-lois.justice.gc.ca/eng/acts/C-24.5/FullText.html
    locator: >-
      Schedule 3 item 7 treats one cannabis plant seed as equivalent to 1 g of dried cannabis.
      Subsection 2(4) applies that equivalency.
