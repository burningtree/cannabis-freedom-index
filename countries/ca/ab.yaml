name: Alberta
recreational: legal
medical: legal
updated: 2026-10-24
summary: >-
  Minimum age 18, the lowest Health Canada lists. Private licensed shops, in person and online.
  Use is allowed at a single-family home and where the municipality allows it.
scores:
  possession: 6
  cultivation: 4
  enforcement: 6
  sharing: 5
  consumption: 6
  access: 6
segments:
  possession: >-
    Adults 18 and older may possess up to 30 g of legally produced dried cannabis, or its
    equivalent, in public.
  cultivation: >-
    Up to four plants per residence, for personal use, grown from licensed seed. A rental
    agreement or condominium bylaw can restrict growing.
  enforcement: >-
    Possessing and growing inside those limits is not a federal offence. Selling cannabis
    without authorisation is a federal offence with up to 14 years.
  sharing: >-
    An adult may distribute up to 30 g of dried cannabis, or its equivalent. Distribute
    includes giving.
  consumption: >-
    Use is allowed in a single-family home and where the municipality allows it. It is banned
    in a motor vehicle, except one used as a temporary residence, such as a parked RV. Public
    smoking or vaping is prohibited where tobacco is restricted, where children might be
    present, and on hospital or school property.
  access: >-
    Private licensed shops, in person and online. The minimum age of 18 is the lowest Health
    Canada lists for a province or territory.
