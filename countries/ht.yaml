    clones: illegal
    clones_trade: banned
    text: >-
      Article 10 of the 2001 drug law bans growing the cannabis plant, apart from medical or
      scientific permits under Article 43, and obliges landholders to destroy such
      plantations. The law mentions seeds only for the opium poppy.
    sources:
      - loi2001
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited.
    sources:
      - loi2001
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. British travel advice says penalties
      for possession, use or trafficking are severe. A person caught with drugs may be jailed
      for weeks or months before appearing in court, and prison conditions are very poor.
    sources:
      - loi2001
      - fcdo
