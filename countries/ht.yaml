segments:
  possession:
    text: >-
      Article 63 of the 2001 drug law (promulgated 24 September 2001) punishes illicitly growing,
      buying or holding a quantity small enough to be for personal consumption with up to 6 months
      in prison and a fine of 5,000 to 100,000 gourdes, or either. The court decides what counts as
      small and may order a detoxification cure or other care instead of, or besides, the
      penalty. Offering or giving drugs to someone for personal consumption carries 5 years (Article
      50); offering, selling or holding for supply carries up to 30 years (Article 49).
    sources:
      - loi2001
    currency: HTG
    penalties:
      - label: Small quantity for personal consumption (Article 63)
        treatment: criminal
        fine: 100000
        prison: 6 months
        note: Fine of 5,000 to 100,000 gourdes, or either penalty; court may order detoxification or care instead or besides
      - label: Offering or giving drugs for personal consumption (Article 50)
        treatment: criminal
        prison: 5 years
        note: Five years
      - label: Offering, selling or holding for supply (Article 49)
        treatment: criminal
        prison: 30 years
        note: Up to thirty years
  cultivation:
    text: >-
      Article 10 bans growing the cannabis plant, and landowners must destroy plantations on their
      land. Growing a small amount for personal consumption falls under Article 63 (up to 6 months
      and a fine).
    sources:
      - loi2001
  enforcement:
    text: >-
      The law lets courts replace or add to the penalty for personal use with treatment (Article
      63). How it is applied is not shown by the text; the state's ability to enforce has been
      disrupted by the security crisis.
    sources:
      - loi2001
  sharing:
    text: >-
      Giving or offering drugs to a person for their own use carries 5 years and a fine of 100,000
      to 500,000 gourdes (Article 50); supplying in other ways carries up to 30 years (Article 49).
    sources:
      - loi2001
  consumption:
    text: >-
      Article 63 punishes growing, buying or holding for personal consumption; no separate offence
      for use itself was found.
    sources:
      - loi2001
  access:
    text: >-
      None for personal use. Licences are for medical or scientific purposes only.
    sources:
      - loi2001
context:
  recreational:
    text: >-
      There is no legal recreational supply. Holding a small personal quantity brings up to six
      months and a 5,000–100,000 gourde fine, though the court may order detoxification or
      care instead.[@loi2001] Offering drugs to someone for their own use carries five years;
      other supply up to thirty.[@loi2001] Enforcement has been disrupted by the security
      crisis.[@loi2001]
    sources:
      - loi2001
  production:
    text: None.
    sources:
      - wiki
  products:
    text: None.
    sources:
      - cann
  medical:
    text: No medical cannabis.
    sources:
      - cann
  consequences:
    text: The retained sources do not establish collateral consequences beyond the penalties described above.
    sources: []
  planting:
    seeds: grey
    seeds_trade: unclear
    clones: illegal
    clones_trade: banned
    text: >-
      Article 10 of the 2001 drug law bans growing the cannabis plant, apart from medical or
      scientific permits under Article 43, and obliges landholders to destroy such
      plantations. The law mentions seeds only for the opium poppy.
    sources:
      - loi2001
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited.
    sources:
      - loi2001
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. Article 63 of the 2001 drug law punishes
      growing, buying or holding a quantity small enough to be for personal consumption with up
      to six months in prison and a fine of 5,000 to 100,000 gourdes, or either.
    sources:
      - loi2001
  black_market:
    text: >-
      Figures reported by the government to the UN drugs office record 503 kg of herbal
      cannabis seized in 2024, against 131 kg in 2023. The UN publishes them as kilogram
      equivalents, and countries count seizures differently, so the figures are not
      comparable across borders.
    sources:
      - unodc_szr
