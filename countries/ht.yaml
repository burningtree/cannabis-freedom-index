segments:
  possession:
    text: >-
      Illegal under a 2001 decree on drug trafficking and illicit use. Possession is reported to
      carry 3 to 15 years depending on quantity and intent, with fines of 500,000 to 5 million
      gourdes.
    sources:
      - cr
      - wiki
  cultivation:
    text: Cultivation is a crime.
    sources:
      - cann
  enforcement:
    text: >-
      The bigger danger is the process: people arrested can spend weeks or months in very poor
      prison conditions before seeing a judge. With the state barely functioning, enforcement is
      erratic.
    sources:
      - cr
  sharing:
    text: Trafficking carries 15 years to life.
    sources:
      - cr
  consumption:
