name: Haiti
region: North America
iso_numeric: 332
recreational: illegal
medical: none
updated: 2026-10-13
summary: >-
  Holding or growing a small amount for personal use carries up to six months and a fine under the
  2001 drug law; trafficking carries up to thirty years.
scores:
