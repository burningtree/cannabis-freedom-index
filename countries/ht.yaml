segments:
  possession:
    text: >-
      Article 63 of the 2001 drug law (promulgated 24 September 2001) punishes illicitly growing,
      buying or holding a quantity small enough to be for personal consumption with up to 6 months
      in prison and a fine of 5,000 to 100,000 gourdes, or either.[@loi2001] The court decides what counts as
      small and may order a detoxification cure or other care instead of, or besides, the
      penalty.[@loi2001] Offering or giving drugs to someone for personal consumption carries 5 years (Article
      50); offering, selling or holding for supply carries up to 30 years (Article 49).[@loi2001]
      [The 2001 drug law set these terms.](/history/haiti-drug-law-2001/)
    sources:
      - loi2001
    currency: HTG
    penalties:
      - label: Small quantity for personal consumption (Article 63)
        treatment: criminal
        fine: 100000
        fine_min: 5000
        prison: 6 months
        term: Personal-use possession
        note: Fine or prison, or either; court may order detoxification or care instead or besides
      - label: Offering or giving drugs for personal consumption (Article 50)
        treatment: criminal
        prison: 5 years
        term: Supply to a consumer
        note: Five years
      - label: Offering, selling or holding for supply (Article 49)
        treatment: criminal
        prison: 30 years
        term: Possession for supply
        note: Up to thirty years
  cultivation:
    text: >-
      Article 10 bans growing the cannabis plant, and landowners must destroy plantations on their
      land.[@loi2001] Growing a small amount for personal consumption falls under Article 63 (up to 6 months
      and a fine).[@loi2001]
      [The 2001 law banned growing cannabis.](/history/haiti-drug-law-2001/)
      [A narcotics decree dates to 1975.](/history/haiti-narcotics-decree-1975/)
    sources:
      - loi2001
    currency: HTG
    penalties:
      - label: Growing a small amount for personal consumption (Article 63)
        treatment: criminal
        fine: 100000
        fine_min: 5000
        prison: 6 months
        term: Personal-use cultivation
        note: Fine or prison, or either; court may order detoxification or care instead or besides
      - label: Growing the cannabis plant (Article 10)
        treatment: criminal
        term: Unlawful cultivation
        note: Banned outright; landowners must destroy plantations on their land
  enforcement:
    text: >-
      The law lets courts replace or add to the penalty for personal use with treatment (Article
      63).[@loi2001] How it is applied is not shown by the text; the state's ability to enforce has been
      disrupted by the security crisis.[@loi2001]
      [The 2001 drug law set these terms.](/history/haiti-drug-law-2001/)
    sources:
      - loi2001
  sharing:
    text: >-
      Giving or offering drugs to a person for their own use carries 5 years and a fine of 100,000
      to 500,000 gourdes (Article 50); supplying in other ways carries up to 30 years (Article 49).[@loi2001]
      [The 2001 drug law set these terms.](/history/haiti-drug-law-2001/)
    sources:
      - loi2001
  consumption:
    text: >-
      Article 63 punishes growing, buying or holding for personal consumption; no separate offence
      for use itself was found.[@loi2001]
      [The 2001 drug law set these terms.](/history/haiti-drug-law-2001/)
    sources:
      - loi2001
  access:
    text: >-
      None for personal use. Licences are for medical or scientific purposes only.[@loi2001]
      [The 2001 drug law set these terms.](/history/haiti-drug-law-2001/)
    sources:
      - loi2001
context:
  recreational:
    text: >-
      There is no legal recreational supply. Holding a small personal quantity brings up to six
      months and a 5,000–100,000 gourde fine, though the court may order detoxification or
      care instead.[@loi2001] Offering drugs to someone for their own use carries five years;
      other supply up to thirty.[@loi2001] Enforcement has been disrupted by the security
      crisis.[@loi2001]
    sources:
      - loi2001
  production:
    status: none
    text: >-
      No licensed production operates. Growing cannabis is banned under article 10, with permits
      only for medical or scientific purposes under article 43.[@loi2001]
      [The 2001 drug law set these terms.](/history/haiti-drug-law-2001/)
    sources:
      - loi2001
  medical:
    text: >-
      No medical cannabis programme operates.[@cann] The law provides permits only for medical or
      scientific purposes, with no patient supply route.[@loi2001]
      [The 2001 drug law set these terms.](/history/haiti-drug-law-2001/)
    sources:
      - loi2001
      - cann
  consequences:
    text: >-
      Beyond the penalties themselves, the court's detoxification or care order is the main
      alternative outcome for personal-use cases.[@loi2001]
      [The 2001 drug law set these terms.](/history/haiti-drug-law-2001/)
    sources:
      - loi2001
  planting:
    seeds: grey
    seeds_trade: unclear
    clones: illegal
    clones_trade: banned
    text: >-
      Article 10 of the 2001 drug law bans growing the cannabis plant, apart from medical or
      scientific permits under Article 43, and obliges landholders to destroy such
      plantations.[@loi2001] The law mentions seeds only for the opium poppy.[@loi2001]
      [The 2001 drug law set these terms.](/history/haiti-drug-law-2001/)
    sources:
      - loi2001
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited.[@loi2001]
      [The 2001 drug law set these terms.](/history/haiti-drug-law-2001/)
    sources:
      - loi2001
  culture:
    text: >-
      The World Drug Report 2011 estimated that 1.4 percent of Haiti's population used cannabis
      at least once a
      year.[@wikiht](/history/haiti-prevalence-2011/)
    sources:
      - wikiht
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone.[@loi2001] Article 63 of the 2001 drug law punishes
      growing, buying or holding a quantity small enough to be for personal consumption with up
      to six months in prison and a fine of 5,000 to 100,000 gourdes, or either.[@loi2001]
      [The 2001 drug law set these terms.](/history/haiti-drug-law-2001/)
    sources:
      - loi2001
  black_market:
    text: >-
      Figures reported by the government to the UN drugs office record 503 kg of herbal
      cannabis seized in 2024, against 131 kg in 2023.[@unodc_szr] The UN publishes them as kilogram
      equivalents, and countries count seizures differently, so the figures are not
      comparable across borders.[@unodc_szr]
      [A boat with 1.5 tonnes was handed over in 2026.](https://tracker.cannabisfreedom.fyi/report/haiti-mole-saint-nicolas-seizure-2026/)
    sources:
      - unodc_szr
  arrests:
    text: >-
      In May 2025 counter-narcotics officers arrested two people suspected of trafficking 44 kg
      of marijuana in Saint Michel du Sud, Miragoâne.[@unodc25] In April 2026 the US Coast Guard
      handed Haitian authorities a boat carrying about 1.5 tonnes of marijuana and one detained
      person for prosecution.[@nouvelliste]
      [A boat with 1.5 tonnes was handed over in 2026.](https://tracker.cannabisfreedom.fyi/report/haiti-mole-saint-nicolas-seizure-2026/)
    sources:
      - unodc25
      - nouvelliste
  hemp:
    status: none
    text: >-
      No hemp exception operates. Growing the cannabis plant is banned outright under article 10,
      apart from medical or scientific permits, and the sources read give no low-THC carve-out.[@loi2001]
      [The 2001 drug law set these terms.](/history/haiti-drug-law-2001/)
      [Cannabis was first restricted around 1925.](/history/ht-first-restriction-estimate/)
    sources:
      - loi2001
