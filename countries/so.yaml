segments:
  possession:
    text: >-
      Illegal under the 1962 Penal Code, with sharia affirmed as the basis of legislation by the
      2012 provisional constitution. Penalties for possession range from fines to prison; drug cases
      are reported to bring lengthy sentences without bail.
    sources:
      - cr
      - wiki
  cultivation:
    text: Cultivation is a crime.
    sources:
      - wiki
  enforcement:
    text: >-
      Depends entirely on who controls the territory: state courts, regional administrations, or
      Al-Shabaab, which imposes corporal punishment for intoxicants.
    sources:
      - euaa
      - cr
  sharing:
    text: Trafficking carries prison; sharia courts in some regions add their own punishments.
    sources:
      - cr
  consumption:
    text: >-
      Use is illegal. Khat, by contrast, is legal, taxed by the government and chewed daily by many
      Somalis — except in Al-Shabaab areas, where it too is banned.
    sources:
      - cr
      - euaa
  access:
    text: None.
    sources:
      - wiki
