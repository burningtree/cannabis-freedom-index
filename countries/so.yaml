  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited.
    sources:
      - wiki
      - cr
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. British travel advice says drug use,
      possession and trafficking are treated seriously and that possible punishments include a
      lengthy prison sentence without bail.
    sources:
      - wiki
      - fcdo
