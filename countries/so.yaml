name: Somalia
region: Africa
iso_numeric: 706
recreational: illegal
medical: none
updated: "2026-10-27"
summary: >-
  Cannabis remains prohibited; surviving drug laws prescribe prison, while enforcement depends on
  territorial control. Later amendments and nationwide sentencing practice remain incompletely
  verified.
scores:
  possession: 0
  cultivation: 0
  enforcement: 1
  sharing: 0
  consumption: 1
  access: 0
segments:
  possession:
    text: >-
      Article 5 of Law 46 of 1970 prescribes two to seven years and a fine of 2,000–20,000 Somali
      shillings for unauthorised acquisition or possession of listed narcotics. Decree 227 lists
      cannabis and hashish. These are verified historical statutory provisions; a complete later
      consolidation and present sentencing practice across all administrations have not been
      established.
    sources:
      - act1970
      - schedule1970
  cultivation:
    text: >-
      Article 4 of the 1970 law requires special Health Ministry authorisation to cultivate, harvest
      or process plants yielding controlled substances; breach carries six months to two years plus
      a fine. The 1984 decree separately prescribes ten years for unlawful manufacture or
      production, without expressly resolving its relationship to cultivation under article 4. No
      lawful home-growing route was established.
    sources:
      - act1970
      - schedule1970
      - drugs1984
  enforcement:
    text: >-
      Depends entirely on who controls the territory: state courts, regional administrations, or
      Al-Shabaab, which imposes corporal punishment for intoxicants.
    sources:
      - euaa
  sharing:
    text: >-
      Article 14 of the 1970 law restricts transfers even when free to authorised recipients.
      Article 1 of Decree-Law 5 of 1984 prescribes ten years and a 50,000-shilling fine for unlawful
      manufacture, production, import, dealing or supplying another person. This is a statutory
      baseline, not a verified nationwide sentencing tariff today.
    sources:
      - act1970
      - drugs1984
  consumption:
    text: >-
      Article 2 of the 1984 decree punishes allowing a public or private place to be used for drug
      consumption with five years and a 25,000-shilling fine; entering such a place to consume
      carries three years and a 20,000-shilling fine. This is a consumption-premises offence, not
      evidence of an identical sentence for every act of private use. EUAA documents separate
      intoxicant prohibitions in Al-Shabaab-controlled areas.
    sources:
      - drugs1984
      - euaa
  access:
    text: >-
      No functioning cannabis-specific patient or recreational supply route was established. The
      1970 law does provide a general narcotics medicines framework: authorised institutions and
      pharmacies, prescriptions, medicinal doses and record keeping. Those provisions alone do not
      demonstrate that cannabis medicines are available.
    sources:
      - act1970
      - schedule1970
context:
  production:
    text: >-
      The 1970 law puts narcotic production under Health Ministry control and sets annual laboratory
      quotas. Its cannabis schedule and the 1984 production offence establish controls, but these
      texts do not establish the present scale of lawful or illicit cannabis cultivation.
    sources:
      - act1970
      - schedule1970
      - drugs1984
  products:
    text: >-
      The historical control list expressly includes Cannabis, with Hashish as a synonym, and Indian
      Hemp. The medicines provisions concern pharmaceutical preparations in medicinal doses; they do
      not establish that flower, oils or other cannabis products are currently supplied to patients.
    sources:
      - schedule1970
      - act1970
  medical:
    text: >-
      Articles 6 and 15–17 of the 1970 law regulate institutional narcotics use, dispensing on
      prescription and inappropriate prescribing. This is a general medicines framework; a working
      cannabis programme and cannabis-specific prescribing permission were not verified.
    sources:
      - act1970
  consequences:
    text: >-
      The 1984 decree assigned drug cases to the National Security Court and its regional branches,
      with transitional rules for pending cases and earlier offences. These historical procedural
      provisions should not be read as proof that those institutions operate today.
    sources:
      - drugs1984
  clubs:
    status: none
    text: >-
      The texts reviewed do not provide a recreational club exemption: the 1970 law restricts
      gratuitous transfers, and the 1984 decree punishes organising public or private
      drug-consumption premises. This establishes the statutory restriction, not a census of
      associations operating informally.
    sources:
      - act1970
      - drugs1984
  visitors:
    status: none
    text: >-
      The reviewed drug laws contain no recreational visitor exemption. The historical possession
      and supply restrictions apply generally; no verified lawful recreational purchase route for
      visitors was established. The general prescription provisions should not be treated as
      permission to carry cannabis across the border.
    sources:
      - act1970
      - drugs1984
answers:
  buy:
    answer: no
    text: No patient or adult-use purchase route verified
