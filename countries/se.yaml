name: Sweden
region: Europe
iso_numeric: 752
recreational: illegal
medical: limited
updated: 2026-10-25
summary: "Zero-tolerance model: use itself is criminal and police can compel drug tests."
scores:
  possession: 1
  cultivation: 1
  enforcement: 2
  sharing: 1
  consumption: 0
  access: 1
segments:
  possession:
    text: >-
      Possession of any amount is a crime. A 'minor drug offence' — small personal amounts — brings
      income-based day-fines or up to six months in prison; ordinary offences carry up to three
      years.
    sources:
      - nordic
  cultivation:
    text: Cultivation is a drug offence, prosecuted with prison for anything beyond a plant or two.
    sources:
      - nordic
  enforcement:
    text: >-
      Zero tolerance in practice: tens of thousands of use and possession cases a year, almost all
      ending in day-fines.
    sources:
      - nordic
      - scan
  sharing:
    text: >-
      Transferring narcotics is an offence under section 1 of the Narcotic Drugs Punishments Act,
      with up to three years in prison and at least six months where the drugs are meant for sale. A
      minor offence brings a fine or up to six months, a gross one two to seven years and an
      exceptionally gross one six to ten.
    sources:
      - nsl
  consumption:
    text: >-
      Sweden criminalised drug use itself in 1988. Police who suspect someone is under the influence
      can detain them and compel a urine or blood test; a positive result is enough for a
      conviction. This is the defining feature of the Swedish model and the reason this segment
      scores zero.
    sources:
      - scan
  access:
    text: >-
      Prescription access is narrow but lawful. Sativex and Epidyolex are approved medicines, and
      a doctor may apply for an individual licence for another medicine.
    sources:
      - lva
context:
  production:
    text: No licensed production.
    sources:
      - nordic
  products:
    text: >-
      Two approved cannabinoid medicines. Delta-9-THCA-A became a narcotic on 14 July 2026 under SFS
      2026:1109; products marketed as THCA do not escape control merely because the acid converts to
      THC when heated. This classification is distinct from the rules for CBD.
    sources:
      - lva
      - thca2026
  medical:
    text: >-
      Limited to two approved prescription medicines; anything else requires an individual licence
      application by the patient's doctor to the Medical Products Agency, rarely granted.
    sources:
      - scan
      - lva
  consequences:
    text: >-
      Fines are entered in the criminal register, visible to some employers, and police report users
      to licensing authorities, which can cost a driving licence.
    sources:
      - nordic
  planting:
    seeds: grey
    seeds_trade: open
    clones: illegal
    clones_trade: banned
    text: >-
      The narcotics control ordinance defines cannabis as the above-ground parts of any plant
      of the genus Cannabis "with the exception of seeds", so seeds are not narcotics. A
      cutting is an above-ground part of the plant and is covered, and producing narcotics is
      an offence under the Narcotic Drugs Penal Act.
    sources:
      - nk
      - nsl
  driving:
    status: zero
    text: >-
      No THC limit is set: the offence is committed if a drug is detected, though there is no
      liability where it was taken in accordance with a medical prescription. Police may stop
      at random and test on suspicion; there is no roadside oral-fluid test. Penalties are
      day-fines or up to two years in prison, a ban of one month to three years, and the
      vehicle can be forfeited.
    sources:
      - euda_dd
  clubs:
    status: none
    text: >-
      No clubs are known. A Europe-wide survey of cannabis social clubs carried out in 2018 and 2019
      found, after online searches and contact with people in the field, that there did not seem to
      be any active club in Sweden. No law in Sweden provides for them; Malta (since 2021) and
      Germany (since 2024) license non-profit cannabis associations, but only under their own laws.
      Nothing more recent was found.
    sources:
      - pardal20
      - de_cang
      - mt_cap628
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. Possession of any amount is a crime: a
      minor drug offence, covering small personal amounts, brings income-based day-fines or up
      to six months in prison, and ordinary offences up to three years.
    sources:
      - nordic
  black_market:
    text: >-
      The EU drugs agency's statistical bulletin records 2,652 kg of herbal cannabis and
      7,273 kg of cannabis resin seized in Sweden in 2024, against 2,060 kg and 8,849 kg
      in 2023. Herbal cannabis was seized on 6,071 occasions and resin on 15,973.
      Countries record seizures differently, so the figures are not comparable across
      borders.
    sources:
      - euda_szr
  arrests:
    text: >-
      The crime prevention council Brå counted 125,142 reported offences against the
      Narcotics Penal Act in 2025, 4 per cent fewer than in 2024. Possession made up 57
      per cent and personal use 36 per cent. Reported possession has almost doubled since 2016, and the
      total is 38 per cent higher than that year. Brå notes that the number of reported
      drug offences mainly reflects how much the police search and intervene. The
      statistics are not split by substance.
    sources:
      - bra26
