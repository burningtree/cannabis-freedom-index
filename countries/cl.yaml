segments:
  possession:
    text: >-
      Possession for 'exclusive personal use in the near term' in private is not punished under Law
      20.000. The law sets no gram threshold, so police and prosecutors decide whether an amount
      looks like personal use or small-scale dealing. Carrying it in public is a minor offence.
    sources:
      - tni
      - ley
  cultivation:
    text: >-
      Growing is an offence unless you can show it is for your own exclusive personal use — a
      defence accepted by the Supreme Court since 2015, and strengthened for patients by a 2023 law
      that treats a medical prescription as justification. There is no plant number, and homes are
      still raided over a handful of plants.
    sources:
      - tni
      - dc
  enforcement:
    text: >-
      Private users are not punished, but the lack of thresholds means people are still arrested and
      charged with micro-trafficking, which carries prison of 541 days to five years.
    sources:
      - tni
      - ley
  sharing:
    text: >-
      Any transfer is treated as trafficking or small-scale dealing, and even consuming together in
      private can be a minor offence if the group gathered for that purpose.
    sources:
      - ley
      - tni
  consumption:
    text: >-
      Private solo use is not an offence. Using or carrying in public places is a minor offence
      punished with a fine, community service, mandatory treatment or licence suspension.
    sources:
      - tni
      - ley
  access:
    text: >-
      No legal adult-use source. Pharmacies can sell cannabis-based medicines on prescription. A
      2025 bill proposing home and collective cultivation of up to six plants has not passed.
    sources:
      - dc
      - tni
context:
  production:
    text: >-
      Cultivation requires authorisation from the agriculture service, granted only for a few
      medical and research projects.
    sources:
      - tni
      - ley
  products:
    text: A few prescription cannabis medicines; otherwise only what a person grows for themselves.
    sources:
      - tni
  medical:
    text: >-
      Cannabis medicines can be prescribed and sold in pharmacies since 2015, and patients with a
      prescription may grow their own. Products are few and expensive, so most patients self-supply.
    sources:
      - tni
      - dc
  consequences:
    text: >-
      Public-use offences can bring suspension of a driving licence and mandatory treatment
      programmes.
    sources:
      - tni
      - ley
  planting:
    seeds: grey
    seeds_trade: unclear
    clones: grey
    clones_trade: unclear
    text: >-
      Law 20.000 punishes sowing, planting or growing cannabis without authorisation from the
      agriculture service, unless the grower shows the plants are for exclusive personal use
      or, since 2023, holds a medical prescription. It mentions seeds only where an authorised
      grower diverts them to trafficking, and does not say where a personal grower may obtain
      seeds or plants.
    sources:
      - ley
