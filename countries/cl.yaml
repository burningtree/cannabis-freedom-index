summary: >-
  Private personal use is not punishable and courts accept personal cultivation as a defence. Public
  use is a minor offence. A 2026 law could let trafficking penalties reach small amounts once its
  list of substances is written.
scores:
  possession: 3
  cultivation: 2
  enforcement: 4
  sharing: 1
  consumption: 3
  access: 1
segments:
  possession:
    text: >-
      Possession for 'exclusive personal use in the near term' in private is not punished under Law
      20.000. The law sets no gram threshold, so police and prosecutors decide whether an amount
      looks like personal use or small-scale dealing. Carrying it in public is a minor offence.
    sources:
      - tni
      - ley
  cultivation:
    text: >-
      Growing is an offence unless you can show it is for your own exclusive personal use — a
      defence accepted by the Supreme Court since 2015, and strengthened for patients by a 2023 law
      that treats a medical prescription as justification. There is no plant number, and homes are
      still raided over a handful of plants.
    sources:
      - tni
      - dc
  enforcement:
    text: >-
      Private users are not punished, but the lack of thresholds means people are still arrested and
      charged with micro-trafficking, which carries prison of 541 days to five years. In May 2026
      the Supreme Court replaced such a sentence, for 21 g, with a fine, holding that possession
      alone does not show an intention to deal. Law 21.817, published on 23 May 2026, will punish
      small amounts as trafficking for substances that a regulation lists as capable of serious
      harm. The ministry has until late November 2026 to write that list; whether cannabis will
      be on it had not been settled when this was written, and this score would fall if it is.
    sources:
      - ep26
      - bio26
      - tni
      - ley
      - ley21817
      - dcs26
  sharing:
    text: >-
      Any transfer is treated as trafficking or small-scale dealing, and even consuming together in
      private can be a minor offence if the group gathered for that purpose.
    sources:
      - ley
      - tni
  consumption:
    text: >-
      Private solo use is not an offence. Using or carrying in public places is a minor offence
      punished with a fine, community service, mandatory treatment or licence suspension.
    sources:
      - tni
      - ley
  access:
    text: >-
      No legal adult-use source. Pharmacies can sell cannabis-based medicines on prescription. A
      2025 bill proposing home and collective cultivation of up to six plants has not passed.
    sources:
      - dc
      - tni
context:
  production:
    text: >-
      Cultivation requires authorisation from the agriculture service, granted only for a few
      medical and research projects.
    sources:
      - tni
      - ley
  products:
    text: A few prescription cannabis medicines; otherwise only what a person grows for themselves.
    sources:
      - tni
  medical:
    text: >-
      Cannabis medicines can be prescribed and sold in pharmacies since 2015, and patients with a
      prescription may grow their own. Products are few and expensive, so most patients self-supply.
    sources:
      - tni
      - dc
  consequences:
    text: >-
      Public-use offences can bring suspension of a driving licence and mandatory treatment
      programmes.
    sources:
      - tni
      - ley
  planting:
    seeds: grey
    seeds_trade: unclear
    clones: grey
    clones_trade: unclear
    text: >-
      Law 20.000 punishes sowing, planting or growing cannabis without authorisation from the
      agriculture service, unless the grower shows the plants are for exclusive personal use
      or, since 2023, holds a medical prescription. It mentions seeds only where an authorised
      grower diverts them to trafficking, and does not say where a personal grower may obtain
      seeds or plants.
    sources:
      - ley
  clubs:
    status: tolerated
    text: >-
      No law licenses clubs, but small medical ones have formed on the strength of a 2015
      Supreme Court ruling that growing for private use, alone or in a group, is not a crime.
      The first reported, Botánica Orgánica Cannabis Internacional in the northern city of
      Arica, opened in September 2016 with about 20 members, supplying people with a
      prescription who could not grow for themselves; no action by the authorities against it
      was reported. The footing is narrow: under the drug law any transfer of cannabis can be
      treated as dealing. How many such clubs exist today was not found.
    sources:
      - td16
      - ley
      - tni
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. Possession for exclusive personal use in
      private is not punished under Law 20.000, which sets no gram threshold, so police and
      prosecutors decide whether an amount looks like personal use or small-scale dealing.
    sources:
      - tni
      - ley
  driving:
    status: zero
    text: >-
      The Traffic Law makes it a crime to drive under the influence of narcotic or
      psychotropic substances and, unlike for alcohol, sets no levels. In August 2025 the
      Santiago Court of Appeals held that the offence needs only the presence of the drug:
      visible effects do not have to be proved, and a positive roadside drug test confirmed by
      a blood test is enough. It overturned the acquittal of a bus driver on that ground and
      ordered a new trial.
    sources:
      - dc25
  black_market:
    text: >-
      Figures reported by the government to the UN drugs office record 31,132 kg of herbal
      cannabis seized in 2024, against 39,302 kg in 2023. The UN publishes them as
      kilogram equivalents, and countries count seizures differently, so the figures are
      not comparable across borders.
    sources:
      - unodc_szr
