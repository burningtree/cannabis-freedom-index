  planting:
    seeds: illegal
    seeds_trade: banned
    clones: illegal
    clones_trade: banned
    text: >-
      Law 50-88 defines marijuana as all parts of the plant Cannabis sativa, growing or not,
      and "its seeds"; only mature stalks, their fibre and oil or paste made from the seeds
      are left out. Production is defined to include sowing, planting and growing plants that
      contain controlled substances.
    sources:
      - l5088
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited.
    sources:
      - fc
      - wiki
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. Law 50-88 punishes possession of any
      amount: up to 20 g of marihuana brings six months to two years in prison and a fine, and
      anything above that is treated as distribution, with three to ten years.
    sources:
      - fc
