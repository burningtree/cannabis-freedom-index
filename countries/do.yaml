name: Dominican Republic
region: North America
iso_numeric: 214
recreational: illegal
medical: none
updated: '2026-10-26'
summary: >-
  Personal possession of up to 20 g of marijuana can mean six months to two years in prison. An
  intent to distribute or sell can mean three to ten years at any amount, including below 20 g.
scores:
  possession: 0
  cultivation: 1
  enforcement: 1
  sharing: 0
  consumption: 1
  access: 0
segments:
  possession:
    text: >-
      The ordinary personal-possession tier covers up to 20 g of marijuana (5 g of hashish), with
      six months to two years and a 1,500–2,500 peso fine. Above 20 g and below one pound, the
      marijuana classification is distributor/seller, with three to ten years; larger quantities
      attract the trafficker tier.[@fc] Since the 1995 amendment, an intent to distribute or sell
      removes the personal-possession classification regardless of quantity, so even less than 20 g
      can fall under the distributor/seller penalty.[@law1795]
    sources:
      - fc
      - law1795
  cultivation:
    text: >-
      Growing marihuana without authorisation is treated as trafficking. Up to 20 plants brings
      two to five years in prison and a fine of 2,000 to 10,000 pesos; more than 20 and up to 100
      plants three to ten years; larger plantations the trafficker's five to twenty years.
    sources:
      - fc
  enforcement:
    text: >-
      Mandatory prison for any amount, applied to tourists as well. Dominican commentators describe
      the 1988 law as obsolete.[@ac,wiki] Intent to distribute or sell can bring three to ten years
      even below 20 g.[@law1795,fc]
    sources:
      - ac
      - wiki
      - law1795
      - fc
  sharing:
    text: >-
      Distribution or sale intent makes the holder a distributor/seller regardless of quantity under
      the 1995 amendment, with the three-to-ten-year penalty rather than the ordinary
      personal-possession tier. Larger quantities can trigger the trafficking
      classification.[@law1795,fc]
    sources:
      - law1795
      - fc
  consumption:
    text: >-
      Use is prosecuted through possession: Law 50-88 has no separate offence for use, and up to
      20 g of marijuana is 'simple possession', with six months to two years in prison.
    sources:
      - fc
  access:
    text: >-
      None. Law 50-88 punishes even simple possession of up to 20 g with prison and treats growing
      without authorisation as trafficking.
    sources:
      - fc
context:
  production:
    text: None.
    sources:
      - wiki
  products:
    text: None; foreign medical cannabis cards are not recognised.
    sources:
      - wiki
  medical:
    text: No medical cannabis.
    sources:
      - wiki
  consequences:
    text: Long pre-trial detention is common; foreigners are deported after sentence.
    sources:
      - ac
  planting:
    seeds: illegal
    seeds_trade: banned
    clones: illegal
    clones_trade: banned
    text: >-
      Law 50-88 defines marijuana as all parts of the plant Cannabis sativa, growing or not,
      and "its seeds"; only mature stalks, their fibre and oil or paste made from the seeds
      are left out. Production is defined to include sowing, planting and growing plants that
      contain controlled substances.
    sources:
      - l5088
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited.
    sources:
      - fc
      - wiki
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. Law 50-88 punishes possession of any amount:
      up to 20 g of marihuana brings six months to two years in prison and a fine, and anything
      above that is treated as distribution, with three to ten years.[@fc] The lower small-quantity
      possession tier does not apply where distribution or sale is intended; the distributor/seller
      penalty can apply at any amount.[@law1795,fc]
    sources:
      - fc
      - law1795
      - fc
  driving:
    status: impairment
    text: >-
      Law 63-17 article 257 prohibits driving under the effects of drugs or controlled
      substances. It specifies a fine of five to ten minimum salaries for the centralised
      public sector and licence-point deductions determined by regulation, without
      excluding suspension or cancellation provisions. The salary unit must not be
      replaced with a private-sector minimum wage or a fixed peso tariff. Article 260
      provides for accredited disposable saliva drug detectors, and article 261 covers
      testing for substances diminishing driving aptitude. Preventive testing under
      article 262 concerns people intending to drive whose behaviour and evident
      symptoms suggest diminished capacity; its title must not be read as unrestricted
      random drug testing. Organic or invasive tests require consent under article 261.
      Refusal is recorded and referred to the traffic court or local justice court.
      A numerical THC cutoff, exact drug-specific point deduction and fixed ban
      duration were not established in the reviewed provisions.
    sources:
      - traffic6317
  black_market:
    text: >-
      Figures reported by the government to the UN drugs office record 6,422 kg of herbal
      cannabis seized in 2024, against 6,900 kg in 2023, and 1.7 kg of cannabis resin
      seized in 2024, against 20.5 kg in 2023. The UN publishes them as kilogram
      equivalents, and countries count seizures differently, so the figures are not
      comparable across borders.
    sources:
      - unodc_szr
  arrests:
    text: >-
      The National Directorate for Drug Control (DNCD) reported that 49,073 people were
      arrested for drug-related crimes in 2024, nine in ten of them Dominican. The
      authorities seized 44,348 kg of drugs that year, a record: 37,714 kg of cocaine and
      6,377 kg of marijuana. The directorate did not say how many of the arrests were for
      possession or for cannabis.
    sources:
      - eldinero25
