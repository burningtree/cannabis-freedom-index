segments:
  possession:
    text: >-
      Law 50-88 sorts people into three fixed categories by weight. Up to 20 g of marijuana is
      'simple possession': a minimum of six months in prison and a fine of 2,500 pesos. Between 20 g
      and one pound you are a 'distributor', with three to ten years. Over a pound you are a
      'trafficker', with five to twenty.
    sources:
      - wiki
      - fc
  cultivation:
    text: Cultivation is punished as trafficking.
    sources:
      - fc
  enforcement:
    text: >-
      Mandatory prison for any amount, applied to tourists as well. Dominican commentators describe
      the 1988 law as obsolete.
    sources:
      - ac
      - wiki
  sharing:
    text: >-
      Quantity alone makes you a distributor or trafficker, so sharing more than 20 g carries at
      least three years.
    sources:
      - wiki
      - fc
  consumption:
    text: Use is prosecuted through possession.
    sources:
      - wiki
  access:
    text: None.
    sources:
