segments:
  possession:
    text: >-
      Law 50-88 sorts people into three fixed categories by weight. Up to 20 g of marijuana is
      'simple possession': six months to two years in prison and a fine of 1,500 to 2,500 pesos
      (5 g for hashish). Between 20 g
      and one pound you are a 'distributor', with three to ten years. Over a pound you are a
      'trafficker', with five to twenty.
    sources:
      - wiki
      - fc
  cultivation:
    text: >-
      Growing marihuana without authorisation is treated as trafficking. Up to 20 plants brings
      two to five years in prison and a fine of 2,000 to 10,000 pesos; more than 20 and up to 100
      plants three to ten years; larger plantations the trafficker's five to twenty years.
    sources:
      - fc
  enforcement:
    text: >-
      Mandatory prison for any amount, applied to tourists as well. Dominican commentators describe
      the 1988 law as obsolete.
    sources:
      - ac
      - wiki
  sharing:
    text: >-
      Quantity alone makes you a distributor or trafficker, so sharing more than 20 g carries at
      least three years.
    sources:
      - wiki
      - fc
  consumption:
    text: Use is prosecuted through possession.
    sources:
      - wiki
  access:
    text: None.
    sources:
      - wiki
