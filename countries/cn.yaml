name: China
region: Asia
iso_numeric: 156
recreational: death
medical: none
updated: '2026-10-28'
summary: >-
  Use brings administrative detention and possible compulsory rehabilitation; trafficking can carry
  the death penalty. China is nonetheless a leading industrial hemp producer.
seo_description: >-
  Cannabis is illegal in China. A small amount brings 10 to 15 days of administrative detention
  and a fine; larger amounts are a crime, and trafficking can carry the death penalty. No medical
  cannabis.
scores:
  possession: 2
  cultivation: 1
  enforcement: 1
  sharing: 0
  consumption: 0
  access: 0
answers:
  carry:
    answer: 'no'
    text: >-
      Small amounts bring an administrative offence with detention or a fine; larger amounts can be
      criminal
  grow:
    answer: 'no'
    text: >-
      Small-scale drug cultivation can bring administrative penalties; larger cultivation can be a
      crime
  public:
    answer: 'no'
    text: Use can bring administrative detention and a fine, including use in private
  caught:
    answer: 'no'
    label: Administrative detention
    text: >-
      Small possession can bring 10–15 days of administrative detention and a fine; larger amounts
      can bring criminal charges
segments:
  possession:
    text: >-
      Possessing a small amount is not a crime but an administrative offence.[@psapl25] Article 84
      of the Public Security Administration Punishments Law, as revised from 1 January 2026, sets
      10 to 15 days' detention, with a fine of up to 3,000 yuan possible, or up to 5 days or a fine
      of up to 1,000 yuan in lighter cases.[@psapl25] The crime of illegal possession begins at a
      "relatively large amount", which the Supreme People's Court's 2016 interpretation puts for
      cannabis at 30 kg of leaf, 2 kg of resin or 1 kg of oil.[@spc16] A foreigner who breaks the
      law may be ordered to leave or repatriated, and the Ministry of Public Security may deport
      someone for a serious breach of the exit-and-entry law.[@nia]
    sources:
      - psapl25
      - spc16
      - nia
    currency: CNY
    penalties:
      - label: Small possession, Article 84 (from 2026)
        treatment: civil
        term: Small possession
        fine: 3000
        note: Ten to fifteen days' detention plus a fine of up to 3,000 yuan; lighter cases five days or 1,000 yuan
      - label: 30–150 kg leaf, 2–10 kg resin or 1–5 kg oil
        treatment: criminal
        term: Illegal possession
        prison: 3 years
        note: Up to three years, detention or control plus a fine; serious cases three to seven years
      - label: 150 kg or more leaf, 10 kg or more resin or 5 kg or more oil
        treatment: criminal
        term: Illegal possession
        prison_min: 7 years
        note: Seven years or more, or life imprisonment, plus a fine
  cultivation:
    text: >-
      Growing cannabis for drug use is prohibited and the plants are uprooted.[@psapl25] A small
      number of plants is an administrative offence under Article 83: 10 to 15 days' detention,
      with a fine of up to 5,000 yuan possible, or up to 5 days or 1,000 yuan in lighter cases,
      and no penalty for a grower who uproots the plants before they mature.[@psapl25] It becomes
      a crime under Article 351 of the Criminal Law at 5,000 plants.[@spc16] Only state-designated
      enterprises may cultivate cannabis for industrial or medical purposes.[@cmsg]
    sources:
      - psapl25
      - spc16
      - cmsg
    currency: CNY
    penalties:
      - label: Small growing, Article 83
        treatment: civil
        term: Cultivation
        fine: 5000
        note: Ten to fifteen days' detention plus up to 5,000 yuan; lighter cases five days or 1,000 yuan; no penalty if uprooted before maturing
      - label: 5,000–30,000 plants, Article 351
        treatment: criminal
        term: Cultivation
        prison: 5 years
        note: Up to five years, detention or control plus a fine
      - label: 30,000 or more plants, Article 351
        treatment: criminal
        term: Cultivation
        prison_min: 5 years
        note: Five years or more plus a fine or confiscation
  enforcement:
    text: >-
      Short detention for users, extreme penalties for supply.[@psapl25] Citizens have been warned
      that using cannabis abroad can be punished on return.[@lc] Police conduct urine and hair
      testing in bars and other venues, and users can be sent to compulsory rehabilitation.[@lc]
    sources:
      - psapl25
      - lc
  sharing:
    text: >-
      Supplying any amount is trafficking under Article 347 of the Criminal Law, which has no
      minimum quantity; large amounts can bring life imprisonment or death.[@lc] The 2016
      interpretation counts 150 kg of cannabis leaf, 10 kg of resin or 5 kg of cannabis oil as the
      "large amount" that opens the heaviest tier.[@spc16] The Criminal Law also punishes
      transporting, manufacturing and smuggling drugs regardless of quantity.[@lc]
    sources:
      - lc
      - spc16
    penalties:
      - label: Trafficking any amount, small or serious
        treatment: criminal
        term: Trafficking
        prison: 7 years
        note: Up to three years for a small amount, three to seven for a serious case, plus a fine
      - label: Relatively large amount
        treatment: criminal
        term: Trafficking
        prison_min: 7 years
        note: From 30 kg of leaf, 2 kg of resin or 1 kg of oil; seven years or more plus a fine
      - label: Large amount or aggravating facts
        treatment: criminal
        term: Trafficking
        death: true
        prison_min: 15 years
        note: From 150 kg of leaf, 10 kg of resin or 5 kg of oil, or a ringleader, armed cover, violence or international organised trafficking; death is discretionary
  consumption:
    text: >-
      Using a drug is an administrative offence under the same Article 84 as small possession: 10
      to 15 days' detention and a possible fine of up to 3,000 yuan.[@psapl25] Since 2026 a user can
      also be ordered, for six months to a year, not to enter entertainment venues or contact
      people involved in drug offences.[@psapl25] Use is proved by urine or hair test, and police
      conduct testing sweeps in bars.[@lc] Users are registered in a national database and can be
      sent to compulsory rehabilitation for up to two years.[@ncl08]
    sources:
      - psapl25
      - lc
      - ncl08
  access:
    text: >-
      There is no legal medical cannabis supply. No medical cannabis product and no THC product is
      approved; CBD is not permitted in food or medicines, was banned from cosmetics, and in 2024
      was placed under precursor-chemical controls.[@cms] Cannabis seed is listed in the
      Pharmacopoeia as a traditional medicine, but that is not a patient supply route.[@cmsg]
    sources:
      - cms
      - cmsg
context:
  recreational:
    text: >-
      All recreational use is prohibited.[@psapl25] Small possession and use bring administrative
      detention and fines, larger amounts are crimes from 30 kg of leaf, and trafficking any
      amount can bring life or death.[@spc16] Citizens are warned that use abroad can be punished
      on return.[@lc]
    sources:
      - psapl25
      - spc16
      - lc
  death_penalty:
    text: >-
      Trafficking in a "large amount" falls in the tier of the Criminal Law that carries fifteen
      years, life imprisonment or death.[@lc] For cannabis the Supreme People's Court's 2016
      interpretation puts that amount at 150 kg of leaf, 10 kg of resin or 5 kg of oil.[@spc16]
      The death penalty is available for the most serious trafficking cases, not for possession or
      use, and it is discretionary: the court may impose fifteen years or life instead.[@lc,spc16]
      No death sentence or execution for plant cannabis was verified in 2024–2026; the recent capital
      cannabinoid case concerned a synthetic substance.[@synthetic24]
    sources:
      - lc
      - spc16
      - synthetic24
  production:
    status: hemp
    text: >-
      China is one of the world's largest industrial-hemp producers.[@cms] Hemp is defined under
      provincial rules as cannabis with less than 0.3% THC and may be cultivated and processed only
      under licence, in practice mainly in Yunnan and Heilongjiang.[@cms] There is no medical or
      adult-use production; cannabis for medicine remains a state-controlled drug plant.[@cmsg]
    sources:
      - cms
      - cmsg
  medical:
    text: >-
      No medical cannabis of any kind and no THC products.[@cms] CBD is not permitted in food or
      medicines, was banned from cosmetics, and in 2024 was placed under precursor-chemical
      controls.[@cms] Cannabis seed appears in the Pharmacopoeia as a traditional medicine, but no
      cannabis-based medicine or patient programme was found.[@cmsg]
    sources:
      - cms
      - cmsg
  hemp:
    status: standard
    text: >-
      Industrial hemp is defined under provincial rules as cannabis with less than 0.3% THC.[@cms]
      Cultivation and processing require a licence and are concentrated in Yunnan and
      Heilongjiang; other provinces, including Gansu, grow it without a clear provincial
      regulation.[@cms] The national recommended standard for raw hemp, GB/T 16984-2023, took effect
      on 1 March 2024.[@cms] Hemp seed is listed as both food and medicine and is used for oil,
      tea and porridge.[@cmsg]
    sources:
      - cms
      - cmsg
  consequences:
    text: >-
      Registration as a drug user brings years of monitoring and random testing, and affects
      employment and travel.[@ncl08] The Narcotics Control Law has police register drug users and
      sets community rehabilitation at three years; a user who comes forward to register or seeks
      treatment is not punished for the use.[@ncl08] Since 1 January 2026 records of public-security
      penalties, drug use included, are sealed: they stay on file but may not be given out except
      to state organs handling a case or bodies entitled to check under national rules.[@yicai25]
    sources:
      - ncl08
      - yicai25
  planting:
    seeds: illegal
    seeds_trade: banned
    clones: illegal
    clones_trade: banned
    text: >-
      The Narcotics Control Law forbids illicitly growing cannabis plants and makes it illegal to
      trade in, transport, carry or possess seeds or seedlings of drug plants that have not been
      inactivated.[@cmsg] State-designated enterprises may cultivate medicinal narcotic plants;
      licensed industrial-hemp growers are a separate exception.[@cmsg] Cannabis seed itself is
      listed in the Chinese Pharmacopoeia as a traditional medicine.[@cmsg]
    sources:
      - cmsg
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited, and the law provides for the death
      penalty for the most serious drug offences.[@lc]
    sources:
      - lc
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone.[@psapl25] Possessing a small amount is an
      administrative offence under Article 84, in force from 1 January 2026: 10 to 15 days'
      detention, with a fine of up to 3,000 yuan that may be added, or up to 5 days' detention or a
      fine of up to 1,000 yuan in a lighter case.[@psapl25] A foreigner who violates the law may be
      ordered to leave within a time limit, and may be repatriated, which bars return for one to
      five years.[@nia] Where a breach of the exit-and-entry law is serious but not a crime, the
      Ministry of Public Security may deport the person, which bars return for ten years.[@nia]
    sources:
      - psapl25
      - nia
  driving:
    status: unknown
    text: >-
      The Road Traffic Safety Law prohibits driving after taking any state-controlled narcotic or
      psychotropic drug.[@rtsl22] A mandatory national standard, GB 45248-2025, took effect on
      1 September 2025 and sets concentration cutoffs for eleven drugs including delta-9 THC; the
      predecessor standard used 2 ng/mL in blood and 1 ng/mL in saliva.[@gb2025] The exact 2025
      cutoff table could not be read, so the numeric limit remains unverified.[@gb2025]
    sources:
      - rtsl22
      - gb2025
  black_market:
    text: >-
      Figures reported by the government to the UN drugs office record 328 kg of herbal cannabis
      seized in 2024, against 421 kg in 2023.[@unodc_szr] The series is volatile and incomplete, and
      China publishes no cannabis-only seizure total.[@report25] In 2025 the authorities reported
      15,000 existing cannabis users and 3,000 cannabis users punished, both down on 2024.[@report25]
      Major cases include 735 kg seized in the South China Sea in April 2026 and 70.83 kg in transit
      at Beijing airport in June 2025.[@gd26,beijing25]
    sources:
      - unodc_szr
      - report25
      - gd26
      - beijing25
  arrests:
    text: >-
      China publishes aggregate drug statistics, not a cannabis arrest count. The 2025 drug report
      recorded 27,000 drug cases and 41,000 suspects, down 27.6% and 33% on 2024, and 134,000 users
      handled; it separately counted 15,000 existing cannabis users and 3,000 punished.[@report25]
      The figures cover all drugs.[@report25]
    sources:
      - report25
  culture:
    text: >-
      Hemp runs through Chinese material and medical culture. [Ma](/culture/language/ma/) is the
      Chinese word for hemp, and [hemp seed in Chinese medicine](/culture/traditions/hemp-seed-in-chinese-medicine/)
      is listed in the Pharmacopoeia.[@cmsg] [Hmong hemp cloth](/culture/traditions/hmong-hemp-cloth/)
      records the fibre tradition of the upland south, while
      [hemp in the Taoist censer](/culture/traditions/hemp-in-the-taoist-censer/) and the
      [Scythian vapour bath](/culture/traditions/the-scythian-vapour-bath/) show ritual and
      medical uses that long predate the modern drug law.[@wiki] The
      [cannabis in the graves of Xinjiang](/culture/traditions/cannabis-in-the-graves-of-xinjiang/)
      finds preserved plant material in ancient burials, and the [CBD](/culture/language/cbd/)
      entry follows the compound from laboratory to China's 2024 precursor controls.[@cms]
    sources:
      - cmsg
      - wiki
      - cms
