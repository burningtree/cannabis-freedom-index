segments:
  possession:
    text: >-
      Possessing a small amount is not a crime but an administrative offence. Article 84 of the
      Public Security Administration Punishments Law, as revised from 1 January 2026, sets 10 to
      15 days' detention, with a fine of up to 3,000 yuan possible, or up to 5 days or a fine of
      up to 1,000 yuan in lighter cases. The crime of illegal possession begins at a 'relatively
      large amount', which the Supreme People's Court's 2016 interpretation puts for cannabis at
      30 kg of leaf, 2 kg of resin or 1 kg of oil. Foreigners are detained, deported and often
      banned from returning.
    sources:
      - psapl25
      - spc16
      - lc
  cultivation:
    text: >-
      Growing cannabis for drug use is prohibited and the plants are uprooted. A small number of
      plants is an administrative offence under Article 83 of the Public Security Administration
      Punishments Law: 10 to 15 days' detention, with a fine of up to 5,000 yuan possible, or up
      to 5 days or 1,000 yuan in lighter cases, and no penalty for a grower who uproots the
      plants before they mature. It becomes a crime under Article 351 of the Criminal Law at
      5,000 plants.
    sources:
      - psapl25
      - spc16
      - cms
  enforcement:
    text: >-
      Short detention for users, extreme penalties for supply. Citizens have been warned that using
      cannabis abroad can be punished on return.
    sources:
      - wiki
      - lc
  sharing:
    text: >-
      Supplying any amount is trafficking under Article 347 of the Criminal Law, which has no
      minimum quantity; large amounts can bring life imprisonment or death. The 2016
      interpretation counts 150 kg of cannabis leaf, 10 kg of resin or 5 kg of cannabis oil as
      the 'large amount' that opens the heaviest tier.
    sources:
      - lc
      - wiki
      - spc16
  consumption:
    text: >-
      Using a drug is an administrative offence under the same Article 84 as small possession:
      10 to 15 days' detention and a possible fine of up to 3,000 yuan. Since 2026 a user can
      also be ordered, for six months to a year, not to enter entertainment venues or contact
      people involved in drug offences. Use is proved by urine or hair test, and police conduct
      testing sweeps in bars. Users are registered in a national database and can be sent to
      compulsory rehabilitation for up to two years.
    sources:
      - psapl25
      - lc
      - wiki
  access:
    text: None.
    sources:
      - cms
context:
  death_penalty:
    text: >-
      Trafficking in a 'large amount' falls in the tier of the Criminal Law that carries fifteen
      years, life imprisonment or death. For cannabis the Supreme People's Court's 2016
      interpretation puts that amount at 150 kg of leaf, 10 kg of resin or 5 kg of oil.
    sources:
      - lc
      - wiki
      - spc16
  production:
    text: >-
      China is one of the world's largest industrial hemp producers, licensed mainly in Yunnan and
      Heilongjiang, for fibre, seed and extraction for export.
    sources:
      - wiki
      - cms
  products:
    text: >-
      No THC products. CBD is not permitted in food or medicines, was banned from cosmetics, and in
      2024 was placed under precursor-chemical controls.
    sources:
      - cms
  medical:
    text: No medical cannabis of any kind.
    sources:
      - cms
      - wiki
  consequences:
    text: >-
      Registration as a drug user brings years of monitoring and random testing, and affects
      employment and travel. The Narcotics Control Law has police register drug users and sets
      community rehabilitation at three years; a user who comes forward to register or seeks
      treatment is not punished for the use. Since 1 January 2026 records of public-security
      penalties, drug use included, are sealed: they stay on file but may not be given out
      except to state organs handling a case or bodies entitled to check under national rules.
    sources:
      - wiki
      - ncl08
      - yicai25
  planting:
    seeds: illegal
    seeds_trade: banned
    clones: illegal
    clones_trade: banned
    text: >-
      The Drugs Prohibition Law forbids illicitly growing cannabis plants and makes it illegal
      to trade in, transport, carry or possess seeds or seedlings of drug plants that have not
      been inactivated. Only enterprises designated by the state may cultivate such plants.
      Cannabis seed itself is listed in the Chinese Pharmacopoeia as a traditional medicine.
    sources:
      - cmsg
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited, and the law provides for the death
      penalty for the most serious drug offences.
    sources:
      - wiki
      - cms
      - lc
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. Possessing a small amount is an
      administrative offence under the Public Security Administration Punishments Law, with 10
      to 15 days' detention and a fine of up to 2,000 yuan; larger amounts are a crime under the
      Criminal Law. Foreigners are detained, deported and often banned from returning.
    sources:
      - lc
      - wiki
  driving:
    status: zero
    text: >-
      The Road Traffic Safety Law says a person who has taken state-controlled psychotropic or
      narcotic drugs may not drive a motor vehicle. It sets no level and does not ask whether
      the driver is impaired. The article itself carries no penalty of its own for drugs; the
      law's detailed drunk-driving penalties refer only to alcohol.
    sources:
      - rtsl22
