segments:
  possession:
    text: >-
      Possession is a crime. Amiri decree-law no. 59 of 2025 (numbered 159 in one law-firm note),
      effective 14 December 2025, replaced the 1983 narcotics law and the 1987 psychotropic law. The
      sources read do not give the penalty for personal possession. The law grants immunity from
      prosecution to addicts who seek rehabilitation before charges are filed.
    sources:
      - kwt
      - l500
  cultivation:
    text: >-
      Producing or cultivating for trafficking can carry death or life imprisonment, with fines of
      KD 100,000 to 2 million or the value of the seized substances.
    sources:
      - kwt
  enforcement:
    text: >-
      The Cabinet's version introduced random drug tests for military and civilian employees and
      mandatory tests for driving-licence and marriage applicants.
    sources:
      - gn
  sharing:
    text: >-
      Trafficking, dealing and intermediation can carry execution or life imprisonment, with fines
      of up to two million dinars.
    sources:
      - gn
      - kwt
  consumption:
    text: >-
      Use is a crime; people have been arrested simply for being found intoxicated. Use and
      addiction made up 77.2 per cent of the 2,666 narcotics cases the anti-drug prosecution
      handled in 2023.
    sources:
      - gn_kw24
      - wiki
  access:
    text: >-
      None: possession and use are crimes under the 2025 narcotics decree-law.
    sources:
      - kwt
context:
  death_penalty:
    text: >-
      The anti-drug decree-law in force since December 2025 provides death or life imprisonment,
      with a fine of 100,000 to 2 million dinars, for importing, smuggling, producing or growing
      drugs with intent to traffic (Article 42 of the text approved by the Cabinet), and death
      or life with a fine of 50,000 to 500,000 dinars for possessing, buying, selling or
      promoting them with that intent (Article 43). Founding or running an organisation for
      these crimes carries death, and aggravating factors such as a repeat offence or supplying
      a minor can make death the penalty.
    sources:
      - jarida25
      - kwt
  production:
    text: None.
    sources:
      - wiki
  products:
    text: Reliable national information about legally available cannabis products was not established by the retained sources.
    sources: []
  medical:
    text: No medical cannabis.
    sources:
      - wiki
  consequences:
    text: The retained sources do not establish collateral consequences beyond the penalties described above.
    sources: []
  planting:
    seeds: licensed
    seeds_trade: regulated
    clones: licensed
    clones_trade: regulated
    text: >-
      Under the 2025 drug law, prohibited plants may be grown only by authorised government
      bodies, universities and licensed research centres. A Health Ministry decision limits
      this to medical and scientific research: the licence names the type and quantity of
      seed, a licensed pharmacist must answer for the seeds and plants, and leftover seed is
      destroyed before a committee when the licence ends. The law's own wording on seeds was
      not read.
    sources:
      - kwt
      - jar
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited, and the law provides for the death
      penalty for the most serious drug offences.
    sources:
      - kwt
      - gn
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. Possession is a crime under the decree-
      law in force since December 2025, which grants immunity from prosecution to addicts who
      seek rehabilitation before charges are filed and provides death or life imprisonment for
      trafficking; the sources read do not give the penalty for personal possession.
    sources:
      - kwt
      - l500
  driving:
    status: impairment
    text: >-
      The 2025 amended Traffic Law article 38 prohibits driving or attempting to drive under the
      influence of narcotics, psychotropic substances and other listed substances affecting normal
      faculties. The reproduced amended statute provides one to two years in prison and
      KWD1,000–3,000, or either penalty. An accident damaging public or another person’s property
      raises this to one to three years and KWD2,000–3,000, or either; an accident causing injury or
      death brings two to five years and KWD2,000–5,000, or either. The court must withdraw the
      licence for one to three years; on repetition it may order three to five years. These are
      statutory court ranges, not routine settlement amounts, and stronger penalties under other laws
      are reserved. The Interior Ministry confirms implementation on 22 April 2025. Its older traffic-
      violation page still shows the superseded one-year/KWD500 ceiling. Numeric THC limits, drug
      specimen/confirmation rules and a medical-prescription exception were not established.
    sources:
      - traffic2025Text
      - traffic2025Start
  arrests:
    text: >-
      A report by the anti-drug prosecution counted 2,666 narcotics cases involving 3,554
      defendants in 2023, against 2,687 cases the year before. Use and addiction accounted
      for 77.2 per cent of the cases and trafficking for 22.5 per cent. Twelve death
      sentences and 59 life sentences were passed for smuggling or dealing that year. The
      figures cover all drugs.
    sources:
      - gn_kw24
