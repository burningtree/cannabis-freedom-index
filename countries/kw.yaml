segments:
  possession:
    text: >-
      Under Decree-Law No. 159 of 2025, unlawful personal consumption, possession, purchase and
      specified other personal-use conduct carry up to five years in prison and a fine up to KD5,000
      (5,000 dinars). The maximum rises to ten years and KD10,000 in specified places including
      prisons, schools and treatment centres. Separate lower-schedule rules provide different
      penalties.[@law25]
    sources:
      - law25
    currency: KWD
    penalties:
      - label: Personal consumption, possession or purchase
        treatment: criminal
        fine: 5000
        prison: 5 years
        note: Up to five years and KD5,000; rehabilitation instead of prosecution possible
        term: Possession
      - label: Personal-use offence in specified places
        treatment: criminal
        fine: 10000
        prison: 10 years
        note: >-
          Up to ten years and KD10,000 in prisons, schools, treatment centres and other specified
          places
        term: Possession
      - label: Residual possession or import without personal-use or trafficking intent (Article 48)
        treatment: criminal
        term: Possession
        prison: 10 years
        fine: 10000
        note: Up to ten years and KD10,000; fifteen years and KD5,000–10,000 in listed places
  cultivation:
    text: >-
      Cultivation for trafficking of a plant in the prohibited-plant table can bring death or life
      imprisonment and a fine of KD100,000–2 million, or the value of the seized substances if
      higher. Personal-use cultivation of a plant in that table carries up to three years and a fine
      up to KD5,000.[@law25] Institutional medical or scientific cultivation requires a
      licence.[@research26]
    sources:
      - law25
      - research26
    currency: KWD
    penalties:
      - label: Personal-use cultivation of a prohibited-plant-table plant
        treatment: criminal
        fine: 5000
        prison: 3 years
        note: Up to three years and KD5,000
        term: Cultivation
      - label: Cultivation for trafficking
        treatment: criminal
        fine: 2000000
        note: Death or life and KD100,000–2 million, or the seized substances’ value if higher
        death: true
        life: possible
        fine_min: 100000
        term: Cultivation
  enforcement:
    text: >-
      Prosecutors may order up to three months in rehabilitation instead of starting a prosecution
      for the personal-use offence. Courts have a separate treatment-instead-of-punishment
      route.[@law25] The law also permits authorities to introduce drug tests for public
      appointments and periodic or random workplace testing, and permits testing requirements for
      driving or weapons licences and marriage procedures.[@law25] A positive test in the marriage
      procedure cannot itself lead to prosecution.[@law25]
    sources:
      - law25
  sharing:
    text: >-
      Providing a controlled drug for consumption without payment carries five to ten years in
      prison and a fine of KD5,000–10,000. The same article provides death or life imprisonment for
      specified trafficking, promotion, exchange and paid-supply conduct, with higher fines.[@law25]
    sources:
      - law25
    penalties:
      - label: Providing a controlled drug for consumption without payment (Article 43)
        treatment: criminal
        term: Unpaid supply
        prison_min: 5 years
        prison: 10 years
        fine_min: 5000
        fine: 10000
      - label: Possession, purchase or sale with intent to traffic (Article 43)
        treatment: criminal
        term: Trafficking
        death: true
        life: possible
        fine_min: 50000
        fine: 500000
        note: Death or life and KD50,000–500,000, or the drugs’ value if higher
      - label: Import, export, production or cultivation for trafficking (Article 42)
        treatment: criminal
        term: Trafficking
        death: true
        life: possible
        fine_min: 100000
        fine: 2000000
        note: Death or life and KD100,000–2 million, or the drugs’ value if higher
      - label: "Aggravated trafficking: repeat, minor, listed place or office (Article 44)"
        treatment: criminal
        term: Trafficking
        death: true
        note: Death is mandatory
      - label: Organising a drug gang (Article 45)
        treatment: criminal
        term: Organised crime
        death: true
        note: Death is mandatory
      - label: Joining or assisting a drug gang (Article 45)
        treatment: criminal
        term: Organised crime
        life: mandatory
        fine_min: 20000
        fine: 50000
    currency: KWD
  consumption:
    text: >-
      Unlawful consumption is expressly included in the personal-use offence, carrying up to five
      years and a fine up to KD5,000 in the ordinary case. Prosecutors may choose rehabilitation
      instead of starting a prosecution, and courts have a separate treatment option.[@law25]
    sources:
      - law25
    penalties:
      - label: Unlawful consumption, ordinary case (Article 49)
        treatment: criminal
        term: Consumption
        prison: 5 years
        fine: 5000
      - label: Consumption in a listed place
        treatment: criminal
        term: Consumption
        prison: 10 years
        fine: 10000
        note: >-
          Prisons, police stations, rehabilitation centres, places of worship, schools and sports
          clubs
    currency: KWD
  access:
    text: >-
      No retail or patient supply of cannabis. Only licensed pharmacies may dispense registered
      controlled medicines, and institutional medical or scientific growing needs a separate
      permit.[@law25,research26]
    sources:
      - law25
      - research26
context:
  recreational:
    text: >-
      There is no legal recreational supply. Personal consumption, possession and purchase carry up
      to five years and KD5,000, rising to ten years and KD10,000 in prisons, schools and treatment
      centres.[@law25] Prosecutors may order up to three months in rehabilitation instead of
      prosecution, and courts have a treatment route.[@law25] Providing for consumption without
      payment brings five to ten years.[@law25]
    sources:
      - law25
  death_penalty:
    text: >-
      The enacted 2025 law provides death or life imprisonment for specified importing, smuggling,
      production and cultivation for trafficking, and for specified possession for trade, sale,
      promotion and exchange. Fines vary by offence and can rise to KD2 million or the seized
      substances’ value if higher. Listed aggravating factors can make death mandatory.[@law25]
    sources:
      - law25
  production:
    status: medical
    text: >-
      Manufacture of controlled drugs and preparations is reserved to licensed pharmaceutical
      factories, with use restricted to operations authorised by the health ministry.
      Prohibited-plant growing has a separate institutional licensing route.[@law25]
    sources:
      - law25
  medical:
    text: >-
      No cannabis-based medicine or patient programme was found. The general law allows licensed
      doctors to prescribe controlled medicines on special prescriptions, which pharmacists must
      fill within five days and may not reuse; that is not a cannabis programme.[@law25]
      Institutional medical or scientific cultivation needs a Health Ministry permit under Decision
      289/2026.[@research26]
    sources:
      - law25
      - research26
  consequences:
    text: >-
      For eligible personal-use cases, prosecutors may order rehabilitation for up to three months
      instead of prosecution; breaching conditions can lead to prosecution.[@law25] A foreign
      prisoner can be deported after sentence, and a drug-trade conviction bars licences under
      article 18.[@law25]
    sources:
      - law25
  planting:
    seeds: licensed
    seeds_trade: regulated
    clones: licensed
    clones_trade: regulated
    text: >-
      An adult cannot lawfully keep a cannabis seed or cutting to grow at home.[@law25] Licensed
      institutions may import seeds and grow plants for medical or scientific research, with seed
      records, a responsible pharmacist, secure storage and supervised destruction when the permit
      ends.[@research26]
    sources:
      - law25
      - research26
  hemp:
    status: none
    text: >-
      No separate low-THC hemp or CBD retail regime was found. Cannabis plants and seeds are
      controlled, and cultivation is limited to licensed government, university and research
      bodies.[@law25,research26] Article 6 exempts plant parts and seeds listed in Table 6, but the
      schedules were not readable, so a narrow fibre or seed exception cannot be ruled out.[@law25]
    sources:
      - law25
      - research26
  clubs:
    status: none
    text: >-
      No cannabis clubs are known. Unpaid supply carries five to ten years, and managing or
      preparing a place for drug use carries up to ten years, or fifteen years and KD50,000–100,000
      if paid.[@law25]
    sources:
      - law25
  visitors:
    status: none
    text: >-
      No legal supply for visitors. Personal possession and consumption carry the general
      penalties.[@law25] A narrow rule withholds prosecution on a first detection at an official
      entry point of specified food, drink or body-care products for personal use, with confiscation
      and a written undertaking; it does not legalise plain cannabis possession.[@law25]
    sources:
      - law25
  driving:
    status: impairment
    text: >-
      Traffic Law article 38 prohibits driving or attempting to drive under the influence of
      narcotics, psychotropic substances and other listed substances affecting normal faculties,
      with no numeric THC limit.[@traffic2025Text] The penalty is one to two years and
      KD1,000–3,000, or either; property damage raises this to one to three years and KD2,000–3,000,
      and injury or death to two to five years and KD2,000–5,000.[@traffic2025Text] The court
      withdraws the licence for one to three years, or three to five on repetition, and the Interior
      Ministry may add drug screening to licence medical checks.[@traffic2025Text,law25] The law
      commenced on 22 April 2025.[@traffic2025Start]
    sources:
      - traffic2025Text
      - traffic2025Start
      - law25
  arrests:
    text: >-
      A report by the anti-drug prosecution counted 2,666 narcotics cases involving 3,554 defendants
      in 2023; use and addiction accounted for 77.2% and trafficking for 22.5%. Twelve death
      sentences and 59 life sentences were passed, and 42 people died from drug use.[@gn_kw24]
      Kuwait recorded 3,251 drug cases in 2024 and 2,874 to November 2025, with a 90% conviction
      rate and $186m of drugs seized.[@mugtama25] The figures cover all drugs, not cannabis
      alone.[@gn_kw24]
    sources:
      - gn_kw24
      - mugtama25
  research:
    status: licensed
    text: >-
      Institutional research is the only lawful route to the plant: Health Ministry Decision
      289/2026 grants eligible institutions two-year permits for controlled-plant medical and
      scientific research, with seed records, a responsible pharmacist, secure growing sites and
      supervised destruction when the purpose or licence ends.[@research26] No separate research
      programme, trial or published study was established by the retained sources.
    sources:
      - research26
  black_market:
    text: >-
      Kuwait has no legal cannabis market, and seizures are dominated by hashish rather than herbal
      cannabis: 959 kg of hashish against 142 kg of marijuana in the first eight months of
      2025.[@times25mid] Resin arrives by sea from Iran — a car returning on the Shuwaikh ferry in
      November 2025 carried more than 100 kg of hashish and marijuana — and in one 2026 case by air
      cargo from London.[@times25iran,kt26air] Local indoor grows also supply the market: police
      broke up a 45-plant flat in Salwa in 2025 and a 70-seedling farm in 2026.[@gd25,kt26farm]
      Networks can be prison-linked: in September 2025 a Central Prison inmate directed a gang
      caught with 145 kg of hashish.[@kt25hash] No reliable retail price per gram was found, so no
      price is quoted.
    sources:
      - times25mid
      - times25iran
      - kt26air
      - gd25
      - kt26farm
      - kt25hash
