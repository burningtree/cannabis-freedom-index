name: Kuwait
region: Asia
iso_numeric: 414
recreational: death
medical: none
updated: 2026-10-24T00:00:00.000Z
summary: >-
  Personal consumption or possession of controlled drugs can bring prison. The 2025 law
  distinguishes unpaid sharing from trafficking, which can carry death or life imprisonment, and
  provides rehabilitation options for personal-use cases.
scores:
