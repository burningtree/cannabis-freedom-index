segments:
  possession:
    text: >-
      Possession of even a small amount is a crime with years in prison. A new anti-narcotics law in
      force from 15 December 2025 is reported to have raised the term for personal possession to
      five to ten years, with bail rarely granted.
    sources:
      - trip
      - wiki
  cultivation:
    text: >-
      Cultivation for trafficking carries life imprisonment or death, with fines of KWD 100,000 to 2
      million.
    sources:
      - kt
      - trip
  enforcement:
    text: Among the harshest in the Gulf after the 2025 law.
    sources:
