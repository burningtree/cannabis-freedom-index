segments:
  possession:
    text: >-
      Under Decree-Law No. 159 of 2025, unlawful personal consumption, possession, purchase and
      specified other personal-use conduct carry up to five years in prison and a fine up to
      KD5,000 (5,000 dinars). The maximum rises to
      ten years and KD10,000 in specified places including prisons, schools and treatment
      centres. Separate lower-schedule rules provide different penalties.[@law25]
    sources:
      - law25
  cultivation:
    text: >-
      Cultivation for trafficking of a plant in the prohibited-plant table can bring death or
      life imprisonment and a fine of KD100,000–2 million, or the value of the seized substances
      if higher. Personal-use cultivation of a plant in that table carries up to three years and
      a fine up to KD5,000.[@law25] Institutional medical or scientific cultivation requires a
      licence.[@research26]
    sources:
      - law25
      - research26
  enforcement:
    text: >-
      Prosecutors may order up to three months in rehabilitation instead of starting a
      prosecution for the personal-use offence. Courts have a separate
      treatment-instead-of-punishment route.[@law25] The law also permits authorities to
      introduce drug tests for public appointments and periodic or random workplace testing, and
      permits testing requirements for driving or weapons licences and marriage
      procedures.[@law25]
    sources:
      - law25
  sharing:
    text: >-
      Providing a controlled drug for consumption without payment carries five to ten years in
      prison and a fine of KD5,000–10,000. The same article provides death or life imprisonment
      for specified trafficking, promotion, exchange and paid-supply conduct, with higher
      fines.[@law25]
    sources:
      - law25
  consumption:
    text: >-
      Unlawful consumption is expressly included in the personal-use offence, carrying up to
      five years and a fine up to KD5,000 in the ordinary case. Prosecutors may choose
      rehabilitation instead of starting a prosecution, and courts have a separate treatment
      option.[@law25]
    sources:
      - law25
  access:
    text: >-
      Controlled-drug dealing, possession and use require the authority specified in the drug
      law. Unauthorised personal-use and supply offences can bring prison or, in specified
      trafficking cases, death or life imprisonment.[@law25]
    sources:
      - law25
context:
  death_penalty:
    text: >-
      The enacted 2025 law provides death or life imprisonment for specified importing,
      smuggling, production and cultivation for trafficking, and for specified possession for
      trade, sale, promotion and exchange. Fines vary by offence and can rise to KD2 million or
      the seized substances’ value if higher. Listed aggravating factors can make death
      mandatory.[@law25]
    sources:
      - law25
  production:
    text: >-
      Manufacture of controlled drugs and preparations is reserved to licensed pharmaceutical
      factories, with use restricted to operations authorised by the health ministry.
      Prohibited-plant growing has a separate institutional licensing route.[@law25]
    sources:
      - law25
  products:
    text: >-
      Pharmacists may dispense controlled-drug preparations only against the required
      prescription, and the law limits the time in which a prescription can be filled and
      prohibits reusing it. Specified drugs and plant materials follow separate schedules and
      licensing rules.[@law25]
    sources:
      - law25
  medical:
    text: >-
      The drug law provides controlled medical prescribing, pharmaceutical manufacture and
      institutional medical or scientific cultivation.[@law25] The 2026 cultivation rules
      require eligible institutions to obtain permits and appoint a responsible pharmacist, keep
      seed and crop records and secure the growing site.[@research26]
    sources:
      - law25
      - research26
  consequences:
    text: >-
      For eligible personal-use cases, prosecutors may order rehabilitation for up to three
      months instead of starting a prosecution. Breaching treatment conditions can lead to
      prosecution; time already spent in the centre is credited if custody or detention is later
      ordered.[@law25]
    sources:
      - law25
  planting:
    seeds: licensed
    seeds_trade: regulated
    clones: licensed
    clones_trade: regulated
    text: >-
      The drug law allows licensed import of prohibited plants and their seeds for authorised
      institutional medical or scientific purposes.[@law25] The 2026 rules require seed
      quantities and records, a responsible pharmacist, secure storage and growing sites, and
      supervised destruction of unused crops and seeds when the authorised purpose or licence
      ends.[@research26]
    sources:
      - law25
      - research26
  clubs:
    status: none
    text: >-
      Unpaid supply of a controlled drug for another person’s consumption carries five to ten
      years and a fine. Trafficking and specified paid-supply conduct have separate capital or
      life-sentence penalties.[@law25]
    sources:
      - law25
  visitors:
    status: none
    text: >-
      Personal possession and consumption can bring prison under the general offence. A separate
      rule withholds prosecution on a first detection at an official entry point of specified
      food, drink or body-care products containing controlled substances for personal use,
      subject to confiscation and a written undertaking not to repeat the conduct; repetition
      can lead to prosecution.[@law25]
    sources:
      - law25
  driving:
    status: impairment
    text: >-
      The 2025 amended Traffic Law article 38 prohibits driving or attempting to drive under the
      influence of narcotics, psychotropic substances and other listed substances affecting
      normal faculties. The reproduced amended statute provides one to two years in prison and
      KWD1,000–3,000, or either penalty. An accident damaging public or another person’s
      property raises this to one to three years and KWD2,000–3,000, or either; an accident
      causing injury or death brings two to five years and KWD2,000–5,000, or either. The court
      must withdraw the licence for one to three years; on repetition it may order three to five
      years. These are statutory court ranges, not routine settlement amounts, and stronger
      penalties under other laws are reserved. The Interior Ministry confirms implementation on
      22 April 2025. Its older traffic- violation page still shows the superseded
      one-year/KWD500 ceiling. Numeric THC limits, drug specimen/confirmation rules and a
      medical-prescription exception were not established.
    sources:
      - traffic2025Text
      - traffic2025Start
  arrests:
    text: >-
      A report by the anti-drug prosecution counted 2,666 narcotics cases involving 3,554
      defendants in 2023, against 2,687 cases the year before. Use and addiction accounted for
      77.2 per cent of the cases and trafficking for 22.5 per cent. Twelve death sentences and
      59 life sentences were passed for smuggling or dealing that year. The figures cover all
      drugs.
    sources:
      - gn_kw24
