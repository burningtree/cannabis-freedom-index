updated: "2026-10-28"
summary: >-
  Personal consumption or possession can bring up to five years, or ten in listed places. Unpaid
  sharing carries five to ten years. Trafficking, import, production or cultivation for trade can
  carry death or life; death is mandatory for listed aggravations.
