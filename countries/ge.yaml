segments:
  possession:
    text: >-
      Up to 5 g of dried cannabis is an administrative offence with a fine. Criminal Code
      amendments adopted on 2 July 2025 ended the court-made rule that 5–70 g could not bring
      prison: buying or holding more than 5 g can now be punished with up to six years, 70–250 g
      with five to eight years, and a repeat offence under 5 g with up to one year.
    sources:
      - civil
      - ocm
      - jam
  cultivation:
    text: >-
      Growing remains illegal, with no tolerated plant count. The 2025 amendments added a separate
      offence of sowing or growing, punished by a fine, community service, house arrest or two to
      six years in prison depending on quantity.
    sources:
      - ocm
      - jam
      - idpc
  enforcement:
    text: >-
      Use itself is not punished and under 5 g brings a fine, but since July 2025 prison is again
      possible above 5 g and for repeat offences. Sale and larger quantities carry long prison
      sentences.
    sources:
      - civil
      - ocm
      - idpc
  sharing:
    text: >-
      Sale and any supply remain crimes; the Court's reasoning protects only the consumer's own
      choice.
    sources:
      - idpc
      - court
  consumption:
    text: >-
      On 30 July 2018 the Constitutional Court abolished all penalties for consuming cannabis,
      calling it an act protected by the right to free development of personality. Parliament then
      restricted it: not in public places, on transport, at work in certain professions, or in the
      presence of children.
    sources:
      - court
      - idpc
  access:
    text: >-
      None. Georgia made use legal but left no lawful way to obtain cannabis: buying, selling and
      growing are all still prohibited.
    sources:
      - idpc
      - wiki
context:
  production:
    text: >-
      No licensed production. A 2018 government plan to allow cultivation for export was withdrawn
      after church opposition.
    sources:
      - wiki
  products:
    text: No legal products.
    sources:
      - wiki
  medical:
    text: No medical cannabis programme.
    sources:
      - wiki
  consequences:
    text: >-
      Administrative fines leave no criminal record. Certain professions are barred from use, and
      driving under the influence is an offence.
    sources:
      - jam
  planting:
    seeds: grey
    seeds_trade: open
    clones: illegal
    clones_trade: banned
    text: >-
      The narcotics law defines cannabis as the flowering and fruiting tops of the hemp plant,
      leaving out seeds and leaves that come without tops. It defines sowing as putting a seed
      into soil or planting a seedling, and sowing, growing and cultivating plants that
      contain controlled substances is among the acts the law forbids. The text read is
      an English consolidated version on the official gazette site, before the new law passed
      in 2025.
    sources:
      - nlaw
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and no law provides for them: the Constitutional Court's
      rulings protect only a person's own use, and sale or any other supply remains a crime.
    sources:
      - idpc
      - court
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. The Constitutional Court's rulings
      protect a person's own use, not buying or carrying across a border. British travel
      advice tells visitors to expect a prison sentence of 5 to 25 years and heavy fines for
      possessing, using or smuggling drugs, cannabis included, also in airport transit, where
      baggage is scanned.
    sources:
      - idpc
      - wiki
      - fcdo
