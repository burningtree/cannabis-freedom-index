name: Georgia
region: Asia
iso_numeric: 268
recreational: partial
medical: none
updated: 2026-10-04
summary: >-
  The Constitutional Court struck down penalties for consumption in 2018, making private use legal.
  Cultivation and sale remain crimes, so there is no lawful source.
scores:
  possession: 3
  cultivation: 1
  enforcement: 4
  sharing: 1
  consumption: 3
  access: 0
segments:
  possession:
    text: >-
      After Constitutional Court rulings in 2017–2018, small possession no longer leads to prison.
      Up to 5 g of dried cannabis carries no criminal liability, only an administrative fine;
      between 5 g and 70 g is a criminal 'small amount' but cannot be punished with imprisonment.
      Above 70 g, prison applies.
    sources:
      - jam
      - wiki
  cultivation:
    text: >-
      Growing remains illegal. Small-scale cultivation is punished less severely than before, but
      there is no tolerated plant count.
    sources:
      - jam
      - idpc
  enforcement:
    text: >-
      No prison for small possession or for use; fines apply. Sale and larger quantities carry long
      prison sentences under a drug law that is otherwise severe.
    sources:
      - jam
      - idpc
  sharing:
    text: >-
      Sale and any supply remain crimes; the Court's reasoning protects only the consumer's own
      choice.
    sources:
      - idpc
      - court
  consumption:
    text: >-
      On 30 July 2018 the Constitutional Court abolished all penalties for consuming cannabis,
      calling it an act protected by the right to free development of personality. Parliament then
      restricted it: not in public places, on transport, at work in certain professions, or in the
      presence of children.
    sources:
      - court
      - idpc
  access:
    text: >-
      None. Georgia made use legal but left no lawful way to obtain cannabis: buying, selling and
      growing are all still prohibited.
    sources:
      - idpc
      - wiki
context:
  production:
    text: >-
      No licensed production. A 2018 government plan to allow cultivation for export was withdrawn
      after church opposition.
    sources:
      - wiki
  products:
    text: No legal products.
    sources:
      - wiki
  medical:
    text: No medical cannabis programme.
    sources:
      - wiki
  consequences:
    text: >-
      Administrative fines leave no criminal record. Certain professions are barred from use, and
      driving under the influence is an offence.
    sources:
      - jam
