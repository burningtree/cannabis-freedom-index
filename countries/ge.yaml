updated: "2026-10-28"
summary: >-
  Private cannabis consumption is legal, while possession, growing and sale remain restricted.
  Parliament restored prison for possessing more than 5 g of dried cannabis in July 2025. In June
  2026 the Constitutional Court barred imprisonment in a case about 0.1315 g of personal-use resin
  under the pre-May-2025 code; criminal liability remained.
