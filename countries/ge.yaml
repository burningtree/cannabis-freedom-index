name: Georgia
region: Asia
iso_numeric: 268
recreational: partial
medical: none
updated: 2026-10-24
summary: >-
  Private cannabis consumption is legal, while possession, growing and sale remain restricted.
  Parliament restored prison for possessing more than 5 g of dried cannabis in July 2025. In June
  2026 the Constitutional Court barred imprisonment in a case about 0.1315 g of personal-use resin
  under the pre-May-2025 code; criminal liability remained.
scores:
  possession: 2
  cultivation: 1
  enforcement: 2
  sharing: 1
  consumption: 3
  access: 0
segments:
  possession:
    text: >-
      Up to 5 g of dried cannabis is an administrative offence with a fine. Amendments adopted on 2
      July 2025 restored prison for buying or holding more than 5 g, with up to six years for the
      basic offence, five to eight years for 70–250 g, and up to one year for a repeat offence under 5
      g.[@civil,ocm,jam] In its 24 June 2026 ruling on the code as it stood before May 2025, the
      Constitutional Court barred imprisonment for buying or possessing 0.1315 g of cannabis resin for
      personal use, including after a prior drug conviction. It left criminal liability in
      place.[@cc882,cc882judgment]
    sources:
      - civil
      - ocm
      - jam
      - cc882
      - cc882judgment
  cultivation:
    text: >-
      Growing remains illegal, with no tolerated plant count. The 2025 amendments added a separate
      offence of sowing or growing, punished by a fine, community service, house arrest or two to
      six years in prison depending on quantity.
    sources:
      - ocm
      - jam
      - idpc
  enforcement:
    text: >-
      Private consumption itself is not punished. Since July 2025, prison is again possible for
      possessing more than 5 g of dried cannabis and for repeat small-quantity
      possession.[@civil,ocm,idpc] In its 24 June 2026 ruling on the code as it stood before May 2025,
      the Constitutional Court barred imprisonment for buying or possessing 0.1315 g of cannabis resin
      for personal use, including after a prior drug conviction. It left criminal liability in
      place.[@cc882,cc882judgment]
    sources:
      - civil
      - ocm
      - idpc
      - cc882
      - cc882judgment
  sharing:
    text: >-
      Sale and any supply remain crimes; the Court's reasoning protects only the consumer's own
      choice.
    sources:
      - idpc
      - court
  consumption:
    text: >-
      On 30 July 2018 the Constitutional Court abolished all penalties for consuming cannabis,
      calling it an act protected by the right to free development of personality. Parliament then
      restricted it: not in public places, on transport, at work in certain professions, or in the
      presence of children.
    sources:
      - court
      - idpc
  access:
    text: >-
      None. Georgia made use legal but left no lawful way to obtain cannabis: buying, selling and
      growing are all still prohibited.
    sources:
      - idpc
      - wiki
context:
  production:
    text: >-
      No licensed production. A 2018 government plan to allow cultivation for export was withdrawn
      after church opposition.
    sources:
      - wiki
  products:
    text: No legal products.
    sources:
      - wiki
  medical:
    text: No medical cannabis programme.
    sources:
      - wiki
  consequences:
    text: >-
      Administrative fines leave no criminal record. Certain professions are barred from use, and
      driving under the influence is an offence.
    sources:
      - jam
  planting:
    seeds: grey
    seeds_trade: open
    clones: illegal
    clones_trade: banned
    text: >-
      The narcotics law defines cannabis as the flowering and fruiting tops of the hemp plant,
      leaving out seeds and leaves that come without tops. It defines sowing as putting a seed
      into soil or planting a seedling, and sowing, growing and cultivating plants that
      contain controlled substances is among the acts the law forbids. The text read is
      an English consolidated version on the official gazette site, before the new law passed
      in 2025.
    sources:
      - nlaw
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and no law provides for them: the Constitutional Court's
      rulings protect only a person's own use, and sale or any other supply remains a crime.
    sources:
      - idpc
      - court
  visitors:
    status: none
    text: >-
      There is no lawful recreational supply: buying, growing and selling remain prohibited.[@idpc] Up
      to 5 g of dried cannabis brings an administrative fine; the July 2025 amendments restored prison
      above 5 g and for repeat small-quantity possession.[@civil,ocm] In its 24 June 2026 ruling on
      the code as it stood before May 2025, the Constitutional Court barred imprisonment for buying or
      possessing 0.1315 g of cannabis resin for personal use, including after a prior drug conviction.
      It left criminal liability in place.[@cc882,cc882judgment]
    sources:
      - idpc
      - civil
      - ocm
      - cc882
      - cc882judgment
  driving:
    status: impairment
    text: >-
      Criminal Code article 276(1) criminalises driving a motor vehicle under narcotic,
      psychotropic or new psychoactive substance influence even without a crash. Its
      sanctions include a fine, house arrest for six months to two years, community
      service of 200–400 hours, and/or imprisonment up to one year, as specified in the
      Code. Note 2 requires clinical and laboratory reports to establish drug influence;
      if a laboratory test is refused, a clinical report alone can establish it. A
      positive trace must not be substituted for that stated evidential rule. The separate
      Law on Combating Drug-related Crime includes drug-influenced article 276 offenders
      in its drug-user definition and provides five years' deprivation of a driving
      licence on conviction. Plea agreements can shorten or exceptionally remove that
      restriction; early restoration is possible after one-third of the period. For a
      custodial sentence the restriction begins after imprisonment ends. More serious
      crash outcomes carry separate, higher criminal penalties.
    sources:
      - trafficcode
      - trafficrights
