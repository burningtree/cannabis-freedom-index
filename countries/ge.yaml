segments:
  possession:
    text: >-
      Up to 5 g of dried cannabis is an administrative offence with a fine of 500 lari.[@admin]
      Amendments adopted on 2 July 2025 restored prison for buying or holding more than 5 g, with up
      to six years for the basic offence, five to eight years for 70–250 g, and eight to twenty
      years or life above 250 g.[@criminal,ocm] The thresholds for fresh cannabis are 10, 140 and
      500 g; for the cannabis plant 10, 155 and 750 g; and for resin 0.05, 0.5 and 5 g.[@nlaw] A
      repeat small-quantity possession after an administrative penalty is criminal under Article
      273, with up to one year in prison.[@criminal] In its 24 June 2026 ruling on the code as it
      stood before May 2025, the Constitutional Court barred imprisonment for buying or possessing
      0.1315 g of cannabis resin for personal use, including after a prior drug conviction. It left
      criminal liability in place.[@cc882,cc882judgment]
    sources:
      - admin
      - criminal
      - nlaw
      - ocm
      - cc882
      - cc882judgment
    currency: GEL
    penalties:
      - upto: 5 g
        treatment: civil
        term: Small amount, Article 45¹(1)
        fine: 500
        note: Dried cannabis; purchase, storage, carriage or transfer
      - over: 5 g
        upto: 70 g
        treatment: criminal
        term: Article 260(1)
        prison: 6 years
      - over: 70 g
        upto: 250 g
        treatment: criminal
        term: Large amount, Article 260(2)
        prison_min: 5 years
        prison: 8 years
      - over: 250 g
        treatment: criminal
        term: Especially large amount, Article 260(3)
        prison_min: 8 years
        note: Life is an alternative to the twenty-year maximum
        prison: 20 years
        life: possible
  cultivation:
    text: >-
      Growing remains illegal, with no tolerated plant count. The 2025 amendments added a separate
      offence of sowing or growing, punished by a fine, community service of 200 to 400 hours, house
      arrest for six months to two years, or two to six years in prison. Aggravated growing brings
      four to seven years, and especially large or organised growing six to twelve.[@criminal,ocm]
    sources:
      - criminal
      - ocm
    penalties:
      - label: Ordinary growing, Article 265¹(1)
        treatment: criminal
        term: Sowing or growing
        prison_min: 2 years
        prison: 6 years
        note: Fine, community service, house arrest or prison
      - label: Aggravated, Article 265¹(2)
        treatment: criminal
        term: Sowing or growing
        prison_min: 4 years
        prison: 7 years
      - label: Especially large or organised, Article 265¹(3)
        treatment: criminal
        term: Sowing or growing
        prison_min: 6 years
        prison: 12 years
  enforcement:
    text: >-
      Private consumption itself is not punished.[@idpc] Since July 2025, prison is again possible
      for possessing more than 5 g of dried cannabis and for repeat small-quantity
      possession.[@admin,criminal] In its 24 June 2026 ruling on the code as it stood before May
      2025, the Constitutional Court barred imprisonment for buying or possessing 0.1315 g of
      cannabis resin for personal use, including after a prior drug conviction. It left criminal
      liability in place.[@cc882,cc882judgment] The UNODC series records 212 kg of herbal cannabis
      and 2,805 plants in 2022; the 3,017 kg figure in some summaries adds plants as kilograms.
      Recorded drug charges fell from 6,922 in 2019 to 2,622 in 2022.[@mgebrishvili,unodc_szr] The
      Interior Ministry registered 5,598 drug crimes in 2024, 10,475 in 2025 and 7,533 in
      January–June 2026; more than half were purchase or possession.[@meduza26]
    sources:
      - admin
      - criminal
      - idpc
      - cc882
      - cc882judgment
      - mgebrishvili
      - unodc_szr
      - meduza26
  sharing:
    text: >-
      Sale of the cannabis plant or marijuana is punished with five to ten years in prison; a large
      quantity, group, official position or repeat offence brings six to twelve, and an especially
      large quantity or organised group twelve to seventeen.[@criminal] Transfer without payment
      carries three to eight years, six to ten for aggravated cases and seven to twelve for
      especially large or organised cases; facilitating a sale carries five to ten, six to twelve or
      twelve to seventeen.[@criminal] Production or transport of drugs carries three to seven years,
      six to nine for aggravated cases and nine to twenty or life for especially large or organised
      cases.[@criminal] The Court’s reasoning protects only the consumer’s own choice; supply
      remains a crime.[@idpc]
    sources:
      - criminal
      - idpc
    penalties:
      - label: Sale of cannabis or marijuana, Article 260³(1)
        treatment: criminal
        term: Sale
        prison_min: 5 years
        prison: 10 years
      - label: Large quantity, group, official position or repeat, Article 260³(2)
        treatment: criminal
        term: Sale
        prison_min: 6 years
        prison: 12 years
      - label: Especially large quantity or organised group, Article 260³(3)
        treatment: criminal
        term: Sale
        prison_min: 12 years
        prison: 17 years
      - label: Transfer without payment, Article 260²(4)
        treatment: criminal
        term: Gift
        prison_min: 3 years
        prison: 8 years
      - label: Facilitating a sale, Article 260⁴(1)
        treatment: criminal
        term: Facilitation
        prison_min: 5 years
        prison: 10 years
  consumption:
    text: >-
      On 30 July 2018 the Constitutional Court abolished all penalties for consuming cannabis,
      calling it an act protected by the right to free development of personality.[@court]
      Parliament then restricted it: not in public places, on transport, at work in certain
      professions, or in the presence of children.[@admin,idpc] Article 45¹ now sets the fines: 500
      to 1,000 lari for use inside a building that is not a private home, 800 to 1,200 in a public
      place, and 1,000 to 1,500 near minors, at a school or at work; repeats are higher.[@admin]
    sources:
      - court
      - admin
      - idpc
    currency: GEL
    penalties:
      - label: Use inside a building that is not a private home
        treatment: civil
        term: Article 45¹(2)
        fine_min: 500
        fine: 1000
      - label: Use in a public place
        treatment: civil
        term: Article 45¹(6)
        fine_min: 800
        fine: 1200
      - label: Use near minors or at a school
        treatment: civil
        term: Article 45¹(8)
        fine_min: 1000
        fine: 1500
      - label: Use at work
        treatment: civil
        term: Article 45¹(10)
        fine_min: 1000
        fine: 1500
        note: Repeat offences carry higher fines up to GEL 2,000
  access:
    text: >-
      Georgia made use legal but left no lawful way to obtain cannabis: buying, selling and growing
      are all still prohibited.[@idpc] No medical or retail supply route was found.[@nlaw]
    sources:
      - idpc
      - nlaw
context:
  recreational:
    text: >-
      Private use is legal, but there is no legal way to buy cannabis. Up to 5 g of dried cannabis
      is an administrative fine; above that, possession is criminal again, with up to six years in
      prison and higher bands above 70 g.[@admin,criminal] Public use is fined, and use near minors
      or at school carries the highest administrative band.[@admin] Past-year use was about 5% of
      the general population, and 43% of regular users obtained cannabis by home
      cultivation.[@mgebrishvili] No price or purity data were found.
    sources:
      - admin
      - criminal
      - mgebrishvili
  medical:
    text: >-
      No approved cannabis medicine, prescription route, clinical trial or production licence was
      found.[@nlaw] Cannabis is a List I drug, and the law permits circulation only for teaching,
      scientific, expert and forensic activity.[@nlaw] Researchers describe Georgia as lacking legal
      access to regulated medical cannabis and a formal medical-cannabis industry.[@mgebrishvili]
      Medical status stays none.
    sources:
      - nlaw
      - mgebrishvili
  hemp:
    status: none
    text: >-
      No industrial-hemp licensing scheme, THC limit, planted area or harvest figure was found.
      Cannabis is a List I drug, and sowing or growing it is criminal under Article
      265¹.[@nlaw,criminal] No separate CBD exemption was found in the sources read.[@nlaw]
    sources:
      - nlaw
      - criminal
  production:
    status: none
    text: >-
      No licensed production was found. Cannabis is a List I drug, and production, transport and
      sale are criminal.[@nlaw,criminal] No medical, fibre or export production route was found in
      the sources read.[@nlaw]
    sources:
      - nlaw
      - criminal
  consequences:
    text: >-
      Administrative fines leave no criminal record.[@admin] A drug conviction costs the driving
      licence and several other rights for five years under the Law on Combating Drug-related Crime;
      an administrative cannabis offence costs the licence for three years and teaching,
      public-service and weapons rights for five.[@trafficrights] Passive suffrage is also affected,
      and a criminal record affects sentencing for later drug offences.[@criminal]
    sources:
      - admin
      - trafficrights
      - criminal
  planting:
    seeds: grey
    seeds_trade: open
    clones: illegal
    clones_trade: banned
    text: >-
      The narcotics law defines cannabis as the flowering and fruiting tops of the hemp plant,
      leaving out seeds and leaves that come without tops.[@nlaw] It defines sowing as putting a
      seed into soil or planting a seedling, and sowing, growing and cultivating plants that contain
      controlled substances is among the acts the law forbids.[@nlaw] Clones are plants, so keeping
      or trading them falls under the cultivation offence.[@criminal] No seed-sale or clone market
      was found.
    sources:
      - nlaw
      - criminal
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and no law provides for them: the Constitutional Court's rulings
      protect only a person's own use, and sale or any other supply remains a crime.[@idpc,criminal]
    sources:
      - idpc
      - criminal
  visitors:
    status: none
    text: >-
      There is no lawful recreational supply: buying, growing and selling remain prohibited.[@idpc]
      Up to 5 g of dried cannabis brings an administrative fine; the July 2025 amendments restored
      prison above 5 g and for repeat small-quantity possession.[@admin,criminal] A conviction can
      lead to deportation and an entry ban; a foreign resident received two years and a 20-year ban
      in a 2026 case reported by Meduza.[@meduza26]
    sources:
      - idpc
      - admin
      - criminal
      - meduza26
  driving:
    status: impairment
    text: >-
      Criminal Code article 276(1) criminalises driving a motor vehicle under narcotic, psychotropic
      or new psychoactive substance influence even without a crash.[@trafficcode] Its sanctions
      include a fine, house arrest for six months to two years, community service of 200 to 400
      hours, and/or imprisonment of up to one year.[@trafficcode] Note 2 requires clinical and
      laboratory reports to establish drug influence; if a laboratory test is refused, a clinical
      report alone can establish it.[@trafficcode] The Law on Combating Drug-related Crime provides
      five years' deprivation of a driving licence on conviction.[@trafficrights]
    sources:
      - trafficcode
      - trafficrights
  black_market:
    text: >-
      The illicit market is well established. The UNODC series records 212 kg of herbal cannabis and
      2,805 plants seized in 2022; summaries that call this “3,017 kg” add plants as
      kilograms.[@mgebrishvili,unodc_szr] Home growing supplies a large share of regular users: 43%
      obtained cannabis that way after liberalisation, and a survey of 218 growers found a mean of
      2.5 plants, with 89% growing for personal use and only 3% for sale.[@mgebrishvili] No price or
      purity data were found.
    sources:
      - mgebrishvili
      - unodc_szr
  arrests:
    text: >-
      Recorded drug charges fell from 6,922 in 2019 to 2,622 in 2022.[@mgebrishvili] The Interior
      Ministry registered 5,598 drug crimes in 2024, 10,475 in 2025 and 7,533 in January–June 2026;
      more than half were purchase or possession under Article 260.[@meduza26] The Prosecutor
      General’s Office opened 119 drug cases against Russian citizens in 2024, 196 in 2025 and 234
      in January–September 2026, and prisons held 12,344 people in June 2026.[@meduza26] The figures
      cover all drugs, not cannabis alone.[@meduza26]
    sources:
      - mgebrishvili
      - meduza26
