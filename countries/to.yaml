segments:
  possession:
    text: >-
      Cannabis is a Class B drug under the Illicit Drugs Control Act 2003. Possession of less than
      28 g carries a maximum of a T$5,000 fine or one year in prison, or both; 28 g or more carries
      up to T$50,000 or seven years.
    sources:
      - case
  cultivation:
    text: Cultivation is an offence under the same Act, sentenced by number of plants.
    sources:
      - case
  enforcement:
    text: >-
      Small cannabis cases generally end in fines or suspended sentences; Tonga's enforcement effort
      is focused on methamphetamine.
    sources:
      - case
      - mt
  sharing:
    text: >-
      Supply is punished more heavily. A 2020 amendment aimed at methamphetamine lowered the
      quantity at which possession is deemed to be supply.
    sources:
      - mt
      - case
  consumption:
    text: Use is an offence.
    sources:
      - case
  access:
    text: None.
    sources:
      - mt
