name: Tonga
region: Oceania
iso_numeric: 776
recreational: illegal
medical: none
updated: '2026-10-28'
summary: >-
  Cannabis is a Class B drug. Under 28 g carries up to T$5,000 or a year in prison; 28 g or more
  carries up to T$50,000 or seven years. There is no medical, hemp or CBD exemption.
scores:
  possession: 1
  cultivation: 1
  enforcement: 2
  sharing: 1
  consumption: 1
  access: 0
segments:
  possession:
    text: >-
      Cannabis is a Class B drug under the Illicit Drugs Control Act
      2003,(/history/tonga-illicit-drugs-control-act-2003/) moved from Class A in
      2012.[@idca,amend2012](/history/tonga-cannabis-reclassified-class-b-2012/) Tonga first banned
      Indian hemp in 1930.[@drugs1930](/history/tonga-drugs-poisons-act-1930/) Possession of
      less than 28 g carries a maximum of a T$5,000 fine or one year in prison, or both; 28 g or
      more carries up to T$50,000 or seven years.[@idca] The Act grades cannabis by weight, not by
      plant count, and there is no mandatory minimum for Class B.[@idca]
    sources:
      - idca
      - amend2012
      - drugs1930
    currency: TOP
    penalties:
      - label: Under 28 g
        treatment: criminal
        term: Possession
        prison: 1 year
        fine: 5000
        note: Fine, prison, or both
      - label: 28 g or more
        treatment: criminal
        term: Possession
        prison: 7 years
        fine: 50000
        note: Fine, prison, or both
  cultivation:
    text: >-
      Cultivation is an offence under section 4 of the Illicit Drugs Control Act 2003.[@idca] The
      same weight bands apply: under 28 g carries up to one year or T$5,000, and 28 g or more up to
      seven years or T$50,000; there is no plant-count tier.[@idca] In practice a single mature
      plant can exceed 28 g.[@havea25]
    sources:
      - idca
      - havea25
    currency: TOP
    penalties:
      - label: Under 28 g
        treatment: criminal
        term: Cultivation
        prison: 1 year
        fine: 5000
        note: Fine, prison, or both
      - label: 28 g or more
        treatment: criminal
        term: Cultivation
        prison: 7 years
        fine: 50000
        note: Fine, prison, or both
  enforcement:
    text: >-
      Cannabis remains the most common possession case, but enforcement is focused on
      methamphetamine.[@unodc25] Police recorded 327 drug-related arrests in FY2023–24, up from 179
      the year before, and Class A seizures rose sharply.[@police24] Cannabis cases usually end in
      fines, suspended sentences or short prison terms; a 2025 case involving 2.3 kg brought an
      aggregate two years.[@havea25]
    sources:
      - unodc25
      - police24
      - havea25
  sharing:
    text: >-
      Supply and sale carry the same Class B weight bands as possession: under 28 g up to one year
      or T$5,000, and 28 g or more up to seven years or T$50,000.[@idca] Possession of 7 g or more
      is deemed supply under section 4(2), but that presumption does not by itself add a higher
      maximum.[@idca] There is no separate sale tier above the 28 g band.[@idca]
    sources:
      - idca
    currency: TOP
    penalties:
      - label: Supply or sale under 28 g
        treatment: criminal
        term: Supply
        prison: 1 year
        fine: 5000
        note: Same band as possession
      - label: Supply or sale 28 g or more
        treatment: criminal
        term: Supply
        prison: 7 years
        fine: 50000
        note: Same band as possession; 7 g or more is deemed supply
  consumption:
    text: >-
      Use is an offence under section 4, and the same weight bands apply.[@idca] Prosecutions are
      usually framed as possession; there is no separate use tariff.[@idca]
    sources:
      - idca
    currency: TOP
    penalties:
      - label: Use under 28 g
        treatment: criminal
        term: Use
        prison: 1 year
        fine: 5000
      - label: Use 28 g or more
        treatment: criminal
        term: Use
        prison: 7 years
        fine: 50000
  access:
    text: >-
      None. The Act has no patient, hemp or CBD route; section 6 is a narrow international-traveller
      exemption for lawfully prescribed medicines, not a domestic cannabis scheme.[@idca]
    sources:
      - idca
context:
  recreational:
    text: >-
      All recreational use is prohibited. Under 28 g carries up to one year or T$5,000; 28 g or more
      up to seven years or T$50,000, whether the charge is possession, use, cultivation or
      supply.[@idca] Sentences are often below the maximum: 117.55 g brought eight months in 2026,
      and 2.3 kg brought two years in 2025.[@matangi26,havea25]
    sources:
      - idca
      - matangi26
      - havea25
  production:
    status: none
    text: >-
      No lawful cannabis production. Cultivation is an offence under section 4, with no commercial
      or hemp permission.[@idca]
    sources:
      - idca
  medical:
    text: >-
      No medical cannabis programme. Section 6 lets a traveller undergoing treatment possess a
      lawfully prescribed medicine for up to one month with written doctor authority, but cannabis is
      not a registered Tongan medicine and there is no prescribing route.[@idca]
    sources:
      - idca
  hemp:
    status: none
    text: >-
      No legal hemp or CBD category. Schedule 1 covers cannabis and cannabis resin, fruit, plant,
      seed and oil, with no THC threshold or fibre exception.[@idca] No industrial-hemp licence was
      found.[@idca]
    sources:
      - idca
  consequences:
    text: >-
      A conviction is a criminal record, which matters for seasonal-work visas abroad.[@abc26]
      Nearly 40% of prisoners were serving drug-related sentences in 2026, and the prison population
      rose from about 250 to 300 in three
      years.[@abc26](/history/tonga-prison-drug-convictions-2026/)
    sources:
      - abc26
  planting:
    seeds: illegal
    seeds_trade: banned
    clones: illegal
    clones_trade: banned
    text: >-
      The Illicit Drugs Control Act lists cannabis seed, cannabis fruit and any part of any plant of
      the genus cannabis as illicit drugs.[@idca] Possessing, growing or supplying any of them is an
      offence under section 4.[@idca]
    sources:
      - idca
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited.[@idca]
    sources:
      - idca
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. Under 28 g carries up to one year or
      T$5,000; 28 g or more up to seven years or T$50,000.[@idca] The only traveller exemption is
      for a lawfully prescribed medicine under section 6, which does not cover recreational
      cannabis.[@idca]
    sources:
      - idca
  driving:
    status: unknown
    text: >-
      The Traffic Act 2020 has an alcohol-only drug-driving regime: breath testing and offences for
      driving under the influence of drink, with no drug-specific offence, THC limit or roadside drug
      test for motor vehicles.[@traffic2020] Drug impairment can support a reckless-driving charge
      only if driving is proved reckless or dangerous.[@traffic2020] The Act's non-motor-vehicle
      provision covers riding or driving an animal or non-motor vehicle while impaired by drink or
      drugs.[@traffic2020]
    sources:
      - traffic2020
  black_market:
    text: >-
      Cannabis is locally cultivated in bush allotments and outer islands, including Vava'u, 'Eua,
      Matahau and Fua'amotu, and sold in small dealer
      packs.[@unodc25] Police seized 3,894 plants at Matahau and Fou'i in
      2017(https://tracker.cannabisfreedom.fyi/report/tonga-matahau-cannabis-plantation-2017/) and 2,665 plants at Mataika in Vava'u in
      2018.(https://tracker.cannabisfreedom.fyi/report/tonga-vavau-cannabis-bust-2018/) UNODC records 250 kg of
      herbal cannabis seized in 2023 and 316 g in January–June 2024; the police yearbook separately
      reported 3,441 g of Class B drugs in FY2023–24, a category that includes cannabis, codeine,
      ketamine and spice.[@unodc25,police24] The two series use different periods and categories and
      are not directly comparable.[@unodc25,police24]
    sources:
      - unodc25
      - police24
  arrests:
    text: >-
      Police recorded 327 drug-related arrests in FY2023–24, up 83% from 179 the year before, and
      drug operations rose 54%.[@police24] Cannabis-specific data for 2019–2023 records 557
      possession cases and 629 offenders, of whom 39 were women.[@unodc25] No current
      cannabis-only arrest series is published.[@police24]
    sources:
      - police24
      - unodc25
