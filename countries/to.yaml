  consequences:
    text: A conviction is a criminal record, which matters for seasonal-work visas abroad.
    sources:
      - case
  planting:
    seeds: illegal
    seeds_trade: banned
    clones: illegal
    clones_trade: banned
    text: >-
      The Illicit Drugs Control Act lists cannabis seed, cannabis fruit and any part of any
      plant of the genus cannabis as illicit drugs in its schedule. Possessing, growing or
      supplying any of them is an offence under section 4. The text read is the 2016 revised
      edition, before the 2020 amendments.
    sources:
      - idca
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited.
    sources:
      - case
      - mt
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. British travel advice says drug taking
      in all forms is illegal, that importing or exporting illegal drugs carries up to 30
      years' hard labour and very large fines, and that growing or distributing them is likely
      to be punished severely.
    sources:
      - mt
      - fcdo
