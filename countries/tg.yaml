  planting:
    seeds: grey
    seeds_trade: unclear
    clones: illegal
    clones_trade: banned
    text: >-
      Article 10 of Law 98-008 bans growing the cannabis plant anywhere in the country, and
      Article 11 obliges owners and occupiers of land to destroy any plants that come up. The
      law does not mention seeds.
    sources:
      - l98008
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited.
    sources:
      - leaf
      - law
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. Law 98-008 of 1998 prohibits use,
      possession, transport and sale of narcotics, cannabis included; possession of small
      quantities is reported to draw sentences in the range of months.
    sources:
      - leaf
      - law
  black_market:
    text: >-
      Cannabis is the main drug the authorities seize. Of 5,729 kg of drugs seized across
      Togo in 2024 and burned in Lomé in January 2026, more than 5,291 kg was cannabis,
      beside 51.77 kg of cocaine and 8.5 kg of methamphetamine. The authorities put
      seizures in 2025 at more than 50 tonnes, mainly cannabis.
    sources:
      - rt26a
      - rt26b
