segments:
  possession:
    text: >-
      Law 98-008 of 1998 prohibits use, possession, transport and sale of narcotics, cannabis
      included. Possession of small quantities is reported to draw lesser sentences, in the range of
      months, and treatment is sometimes offered instead of prison; the law's maximum for serious
      offences is twenty years.
    sources:
      - leaf
      - law
  cultivation:
    text: Cultivation is a crime, with lighter sentences for small quantities.
    sources:
      - leaf
  enforcement:
    text: Reported to be enforced severely, particularly against foreign nationals.
    sources:
      - leaf
  sharing:
    text: Trafficking carries up to twenty years.
    sources:
