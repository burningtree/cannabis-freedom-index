name: Togo
region: Africa
iso_numeric: 768
recreational: illegal
medical: none
updated: '2026-10-21'
summary: >-
  Cannabis remains illegal. The 2015 code sets one to three years for small personal-use amounts, a
  fine, or both; judges can substitute treatment for a person with drug dependence.
scores:
  possession: 1
  cultivation: 1
  enforcement: 1
  sharing: 1
  consumption: 1
  access: 0
segments:
  possession:
    text: >-
      The 2015 criminal code sets one to three years in prison and a fine of 500,000–3 million CFA
      francs, or either penalty alone, for a small amount held, bought or grown for personal
      consumption. It gives no numerical quantity in that clause. Judges can waive qualifying
      sentences and replace punishment with treatment for a person with drug dependence.
    sources:
      - code15
  cultivation:
    text: >-
      The 1998 drug law bans cannabis cultivation nationwide and requires landholders to destroy
      plants growing on their land. The 2015 code expressly includes small amounts grown for
      personal consumption in its one-to-three-year or fine-only rule. General high-risk drug
      cultivation carries twenty to thirty years and a fine of 50 million–100 million CFA francs, or
      either penalty alone.
    sources:
      - l98008
      - code15
  enforcement:
    text: >-
      The code permits a fine alone for small personal-use amounts and treatment instead of the
      penalty for a person with drug dependence. Authorities also report large cannabis seizures: a
      September 2020 bus operation recovered 1,541.60 kg and led to three arrests; more than 5,291
      kg seized in 2024 was destroyed in January 2026.
    sources:
      - code15
      - atop20
      - rt26a
  sharing:
    text: >-
      Giving or offering a high-risk drug for another person’s own consumption carries five to ten
      years and a fine of 500,000–25 million CFA francs, or either penalty alone. General high-risk
      drug supply carries twenty to thirty years and a fine of 50 million–100 million francs, or
      either penalty alone. Aggravated offences can have their maximum doubled, capped at fifty
      years.
    sources:
      - code15
      - atop20
  consumption:
    text: >-
      The 2015 code prohibits using controlled substances outside a medical prescription and
      requires their seizure and judicial confiscation even when the person is not prosecuted. Small
      amounts for personal consumption fall under its separate one-to-three-year, fine, or combined
      penalty.
    sources:
      - code15
  access:
    text: >-
      Adult-use cannabis supply is prohibited. The code punishes giving or offering high-risk drugs
      for personal consumption as well as sale and other forms of supply.
    sources:
      - code15
      - atop20
context:
  production:
    text: >-
      Cannabis cultivation is prohibited nationwide; landholders must destroy plants growing on
      their land.
    sources:
      - l98008
  medical:
    text: >-
      Controlled medicines are subject to health-ministry licensing under the 1998 law, while the
      2015 code prohibits use outside a medical prescription. Cannabis cultivation remains expressly
      banned by the drug law.
    sources:
      - l98008
      - code15
  consequences:
    text: >-
      Courts must confiscate substances and plants involved in small personal-use offences, together
      with equipment used for the offence, and may order their destruction. Treatment ordered in
      place of punishment can itself lead to one to five years, a fine, or both if the person evades
      it.
    sources:
      - code15
  clubs:
    status: none
    text: >-
      The cultivation ban and penalties for supplying another person also restrict collective
      growing and sharing through a club.
    sources:
      - l98008
      - code15
  visitors:
    status: none
    text: >-
      Visitors face the same cannabis cultivation, possession and supply offences. For the
      production and trafficking offences listed in the code, courts may also exclude a foreign
      national from Togo permanently or for five to ten years.
    sources:
      - l98008
      - code15
  black_market:
    text: >-
      Cannabis is the main drug the authorities seize. Of 5,729 kg of drugs seized across Togo in
      2024 and burned in Lomé in January 2026, more than 5,291 kg was cannabis, beside 51.77 kg of
      cocaine and 8.5 kg of methamphetamine. The authorities put seizures in 2025 at more than 50
      tonnes, mainly cannabis.
    sources:
      - rt26a
      - rt26b
  products:
    text: >-
      Preparations containing controlled substances follow the same controls as those substances. A
      mixture containing substances under different controls follows the strictest applicable rules.
    sources:
      - l98008
