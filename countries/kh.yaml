name: Cambodia
region: Asia
iso_numeric: 116
recreational: illegal
medical: none
updated: "2026-10-23"
summary: >-
  Cannabis is controlled under the 2012 drug law. Unlawful possession carries prison terms; the
  law retains limited discretion for customary consumption and provides both voluntary and
  compulsory treatment procedures.
scores:
  possession: 1
  cultivation: 1
  enforcement: 2
  sharing: 1
  consumption: 2
  access: 0
# What the enforcement score cannot say (src/lib/answers.js): the law's basic penalty for
# possession is prison, not a fine.
answers:
  caught:
    answer: "no"
    label: Prison
    text: Possession carries two to five years in prison, and a campaign since 2017 has brought mass arrests and detention
segments:
  possession:
    text: >-
      Unlawful possession, concealment or storage of drugs in Tables I and II carries a basic
      two-to-five-year prison term, with a possible fine of 4–10 million riel.[@law] Cannabis,
      resin and oil are listed in Table I.[@law]
    sources:
      - law
  cultivation:
    text: >-
      Unlawful cultivation of narcotic plants in Tables I and II carries six months to two years
      in prison; growing for distribution, manufacture or trade carries two to five years.[@law]
      Drug-related activity requires permission or a licence from the competent
      authorities.[@law]
    sources:
      - law
  enforcement:
    text: >-
      Cambodia's anti-drug campaign began in 2017 and led to at least 55,770 arrests on
      suspicion of using or selling drugs by March 2020.[@ai2020] Amnesty International
      documented detention and abuse affecting poor communities; its findings cover drugs
      generally, without a separate cannabis arrest count.[@ai2020]
    sources:
      - ai2020
  sharing:
    text: >-
      The drug law treats transfer from one person to another as transport of drugs, alongside
      selling and other trafficking activity.[@law] The basic unlawful keeping, transport and
      trafficking offence carries two to five years in prison, with higher penalties for
      specified circumstances and quantities.[@law]
    sources:
      - law
  consumption:
    text: >-
      The drug law provides criminal penalties for unlawful consumption and lets prosecutors
      advise medically assessed dependent users to enter treatment before prosecution.[@law] It
      also retains discretion for limited quantities consumed as a non-addictive ancestral
      practice.[@law] Compulsory treatment has separate statutory conditions.[@law]
    sources:
      - law
  access:
    text: >-
      No legal source. 'Happy pizza' restaurants and street sellers operate openly in some
      cities, tolerated rather than licensed.
    sources:
      - cann
context:
  production:
    text: >-
      Cultivation, manufacture and supply require permission or licensing; permitted purposes
      are research, clinical, scientific or industrial.[@law] The Ministry of Health oversees
      lawful activity involving drugs in Tables I–III.[@law]
    sources:
      - law
  products:
    text: No legal products.
    sources:
      - lc
  medical:
    text: No medical cannabis programme.
    sources:
      - lc
      - cann
  consequences:
    text: >-
      State-centre treatment and rehabilitation can last six months to two years.[@law] The law
      provides medical conditions, prosecutor or court decisions and appeal routes for
      compulsory treatment.[@law] Amnesty International documented detention without proper
      safeguards during the anti-drug campaign.[@ai2020]
    sources:
      - law
      - ai2020
  planting:
    seeds: grey
    seeds_trade: unclear
    clones: illegal
    clones_trade: banned
    text: >-
      The 2012 law includes cannabis among narcotic plants and makes unauthorised cultivation an
      offence.[@law] Licensed activity is limited to research, clinical, scientific or
      industrial purposes.[@law] No public seed or cutting retail permission was verified in the
      reviewed provisions.[@law]
    sources:
      - law
  clubs:
    status: none
    text: >-
      The law criminalises unauthorised cultivation and transfer of controlled drugs between
      people.[@law] Its licensing rules limit permission to research, clinical, scientific or
      industrial purposes.[@law]
    sources:
      - law
  visitors:
    status: none
    text: >-
      Unlawful possession of cannabis falls under the drug law's basic two-to-five-year prison
      penalty.[@law] The reviewed law gives visitors no separate recreational possession or
      supply permission.[@law]
    sources:
      - law
  arrests:
    text: >-
      A report by the Anti-Drug Department counted 14,977 people arrested for drug offences of
      all kinds between January and July 2025, 2.7% more than a year earlier; 537 were
      foreigners. Seizures included 505 kg of dried cannabis and 12,212 fresh cannabis plants,
      out of 1.91 tonnes of drugs.
    sources:
      - lpj25
  black_market:
    text: >-
      Figures reported by the government to the UN drugs office record 142 kg of herbal cannabis
      seized in 2024, against 45.2 kg in 2023. The UN publishes them as kilogram equivalents,
      and countries count seizures differently, so the figures are not comparable across
      borders.
    sources:
      - unodc_szr
