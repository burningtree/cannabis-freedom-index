name: Cambodia
region: Asia
iso_numeric: 116
recreational: illegal
medical: none
updated: '2026-10-28'
summary: >-
  Cannabis is controlled under the 2012 drug law. Unlawful possession carries prison terms; the
  law retains limited discretion for customary consumption and provides both voluntary and
  compulsory treatment procedures.
scores:
  possession: 1
  cultivation: 1
  enforcement: 1
  sharing: 1
  consumption: 2
  access: 0
# What the enforcement score cannot say (src/lib/answers.js): the law's basic penalty for
# possession is prison, not a fine.
answers:
  caught:
    answer: "no"
    label: Prison
    text: Possession carries two to five years in prison, and a campaign since 2017 has brought mass arrests and detention
segments:
  possession:
    text: >-
      Article 40 punishes unlawful possession, concealment or storage of Table I drugs with two to
      five years and an optional 4–10 million riel fine for any amount.[@law] Dry cannabis of 8 to
      under 20 kg brings five to ten years and 10–20 million riel; 20 to under 60 kg brings ten to
      twenty years and 20–40 million; 60 kg or more brings twenty to thirty years or life and
      40–100 million.[@law] Resin and oil have separate bands from 400 g or 200 ml to 1,600 g or
      800 ml.[@law] The published English text repeats the 20–60 kg band at the top tier; the 60 kg
      threshold is the intended reading and should be checked against the Khmer text.[@law]
    sources:
      - law
    currency: KHR
    penalties:
      - label: Any amount
        treatment: criminal
        term: Possession
        prison_min: 2 years
        prison: 5 years
        fine_min: 4000000
        fine: 10000000
      - label: Dry cannabis 8 kg to under 20 kg
        treatment: criminal
        term: Possession
        prison_min: 5 years
        prison: 10 years
        fine_min: 10000000
        fine: 20000000
      - label: Dry cannabis 20 kg to under 60 kg
        treatment: criminal
        term: Possession
        prison_min: 10 years
        prison: 20 years
        fine_min: 20000000
        fine: 40000000
      - label: Dry cannabis 60 kg or more
        treatment: criminal
        term: Possession
        prison_min: 20 years
        prison: 30 years
        fine_min: 40000000
        fine: 100000000
        note: Twenty to thirty years or life; English text repeats the 20–60 kg band
      - label: Resin 400 g to under 800 g, or oil 200 ml to under 400 ml
        treatment: criminal
        term: Possession
        prison_min: 5 years
        prison: 10 years
        fine_min: 10000000
        fine: 20000000
      - label: Resin 800 g to under 1,600 g, or oil 400 ml to under 800 ml
        treatment: criminal
        term: Possession
        prison_min: 10 years
        prison: 20 years
        fine_min: 20000000
        fine: 40000000
      - label: Resin 1,600 g or more, or oil 800 ml or more
        treatment: criminal
        term: Possession
        prison_min: 20 years
        prison: 30 years
        fine_min: 40000000
        fine: 100000000
        note: Twenty to thirty years or life
  cultivation:
    text: >-
      Unlawful cultivation of narcotic plants in Tables I and II carries six months to two years
      in prison; growing for distribution, manufacture or trade carries two to five years.[@law]
      Drug-related activity requires permission or a licence from the competent
      authorities.[@law]
    sources:
      - law
    currency: KHR
    penalties:
      - label: Unlawful cultivation
        treatment: criminal
        term: Cultivation
        prison_min: 6 months
        prison: 2 years
        fine_min: 1000000
        fine: 4000000
      - label: Growing for distribution, manufacture or trade
        treatment: criminal
        term: Cultivation
        prison_min: 2 years
        prison: 5 years
        fine_min: 4000000
        fine: 10000000
  enforcement:
    text: >-
      Unlawful possession has a basic two-to-five-year prison penalty, and article 28 bars
      substituting alternative penalties under the Criminal Code.[@law] In 2025 police recorded
      10,743 drug cases and 27,884 suspects, up from 10,630 and 27,071 in 2024; dried cannabis
      seizures rose from 142 kg to 525 kg while total drug seizures fell from 14.9 to 5.9
      tonnes.[@akp26] In January–July 2026 they recorded 16,498 suspects and 105 kg of dried
      cannabis.[@cambodianess26] Amnesty International documents mass arrests and detention during
      the campaign begun in 2017.[@ai2023] The figures cover all drugs and do not establish a
      cannabis-only sentencing rate.[@akp26]
    sources:
      - law
      - ai2023
      - akp26
      - cambodianess26
  sharing:
    text: >-
      Article 40 treats selling, buying for resale, exchanging and trading as trafficking; selling
      any amount carries two to five years and 4–10 million riel, with the same weight bands as
      possession.[@law] Arranging another person's consumption carries two to five years and
      4–10 million, with aggravated bands up to twenty to thirty years or life; facilitating
      consumption, such as providing a venue, carries one to five years and 2–10 million.[@law]
      Transfer between people is treated as transport.[@law]
    sources:
      - law
    currency: KHR
    penalties:
      - label: Sale or trafficking, any amount
        treatment: criminal
        term: Trafficking
        prison_min: 2 years
        prison: 5 years
        fine_min: 4000000
        fine: 10000000
      - label: Dry cannabis 8 kg to under 20 kg
        treatment: criminal
        term: Trafficking
        prison_min: 5 years
        prison: 10 years
        fine_min: 10000000
        fine: 20000000
      - label: Dry cannabis 20 kg to under 60 kg
        treatment: criminal
        term: Trafficking
        prison_min: 10 years
        prison: 20 years
        fine_min: 20000000
        fine: 40000000
      - label: Dry cannabis 60 kg or more
        treatment: criminal
        term: Trafficking
        prison_min: 20 years
        prison: 30 years
        fine_min: 40000000
        fine: 100000000
        note: Twenty to thirty years or life
      - label: Arranging another person's consumption
        treatment: criminal
        term: Arranging use
        prison_min: 2 years
        prison: 5 years
        fine_min: 4000000
        fine: 10000000
      - label: Facilitating consumption or providing a venue
        treatment: criminal
        term: Facilitation
        prison_min: 1 year
        prison: 5 years
        fine_min: 2000000
        fine: 10000000
  consumption:
    text: >-
      Article 45 criminalises consumption only after the person has already accepted compulsory
      treatment: one to six months and 100,000–1,000,000 riel, or six to twelve months and
      100,000–2,000,000 riel for recidivism.[@law] First-time use is not clearly criminal; article
      105 lets prosecutors divert a medically certified dependent user to treatment, and limited
      non-addictive ancestral use is discretionary.[@law]
    sources:
      - law
    currency: KHR
    penalties:
      - label: Consumption after compulsory treatment
        treatment: criminal
        term: Consumption
        prison_min: 1 month
        prison: 6 months
        fine_min: 100000
        fine: 1000000
      - label: Recidivism
        treatment: criminal
        term: Consumption
        prison_min: 6 months
        prison: 12 months
        fine_min: 100000
        fine: 2000000
  access:
    text: >-
      No legal source. 'Happy pizza' restaurants and street sellers operate openly in some cities,
      tolerated rather than licensed.[@cann] The 2012 law has no patient or consumer cannabis
      route.[@law]
    sources:
      - cann
      - law
words:
  - word: ganja
    lang: Khmer
    meaning: cannabis
    sources:
      - cann
context:
  recreational:
    text: >-
      No legal recreational supply exists, though 'happy pizza' restaurants and street sellers
      operate openly in some cities, tolerated rather than licensed. Unlawful possession carries
      two to five years in prison.[@cann,law]
    sources:
      - cann
      - law
  production:
    status: none
    text: >-
      The 2012 law allows permissions for research, clinical, scientific or industrial purposes,
      but no cannabis production permission or operational scheme exists.[@law] In October 2026 Hun Manet
      rejected foreign proposals to grow cannabis for medical export and ruled out amending the
      law.[@khmertimes26]
    sources:
      - law
      - khmertimes26
  research:
    status: licensed
    text: >-
      Research is one of the four permitted purposes for licensed cultivation, manufacture and
      supply of controlled drugs; no cannabis research programme was verified beyond the
      licensing route.[@law]
    sources:
      - law
  medical:
    text: >-
      No medical cannabis programme and no legal products; the licensing system permits clinical
      and research activity but no patient supply route exists.[@law] In October 2026 the prime
      minister rejected medical-export cultivation and any law change.[@khmertimes26]
    sources:
      - law
      - khmertimes26
  hemp:
    status: none
    text: >-
      No legal hemp category or THC threshold. Cannabis is in Table I with no medical use;
      article 14's industrial licensing is theoretical and no hemp scheme or licence exists.[@law]
      The prime minister rejected cannabis cultivation in October 2026.[@khmertimes26]
    sources:
      - law
      - khmertimes26
  driving:
    status: impairment
    text: >-
      Article 63 punishes driving a road, water or air vehicle under the influence of drugs with
      one month to one year and an optional 100,000–2,000,000 riel fine; injury disabling the
      victim for eight days or more brings one to two years and 2–4 million riel, and permanent
      disability or death two to five years and 4–10 million.[@law] The 2015 Road Traffic Law adds
      six licence points for drug driving and punishes refusal to stop for a test with six days to
      one month and 100,000–800,000 riel.[@road2015] There is no THC blood limit; the offence is
      impairment-based.[@law]
    sources:
      - law
      - road2015
  consequences:
    text: >-
      State-centre treatment and rehabilitation can last six months to two years.[@law] The law
      provides medical conditions, prosecutor or court decisions and appeal routes for
      compulsory treatment.[@law] Amnesty International documented detention without proper
      safeguards during the anti-drug campaign.[@ai2020]
    sources:
      - law
      - ai2020
  planting:
    seeds: grey
    seeds_trade: unclear
    clones: illegal
    clones_trade: banned
    text: >-
      The 2012 law includes cannabis among narcotic plants and makes unauthorised cultivation an
      offence.[@law] Licensed activity is limited to research, clinical, scientific or
      industrial purposes.[@law] No public seed or cutting retail permission was verified in the
      reviewed provisions.[@law]
    sources:
      - law
  clubs:
    status: none
    text: >-
      The law criminalises unauthorised cultivation and transfer of controlled drugs between
      people.[@law] Its licensing rules limit permission to research, clinical, scientific or
      industrial purposes.[@law]
    sources:
      - law
  visitors:
    status: none
    text: >-
      Unlawful possession of cannabis falls under the drug law's basic two-to-five-year prison
      penalty.[@law] The reviewed law gives visitors no separate recreational possession or
      supply permission.[@law]
    sources:
      - law
  arrests:
    text: >-
      Police counted 27,884 drug suspects in 2025, up from 27,071 in 2024, and 16,498 in
      January–July 2026, 10% more than a year earlier; 889 of the 2026 suspects were
      foreigners.[@akp26,cambodianess26] Dried cannabis seizures rose from 142 kg in 2024 to 525 kg
      in 2025, then 105 kg in January–July 2026.[@akp26,cambodianess26] The figures cover all
      drugs; no cannabis-only arrest count is published.[@akp26]
    sources:
      - akp26
      - cambodianess26
  culture:
    text: >-
      Cannabis is called [ganja](/culture/language/ganja/) in Khmer usage, and the country has a
      [landrace](/culture/language/landrace/) heritage; the leaf was a household seasoning and
      medicine, still visible in [South-East Asian
      cooking](/culture/traditions/south-east-asian-cooking/).[@cann,law] 'Happy pizza' and open
      market sales persist in tourist areas, but the 2012 law and the 2017 campaign made open use
      risky.[@cann,ai2020]
    sources:
      - cann
      - law
      - ai2020
  black_market:
    text: >-
      UNODC records 142 kg of herbal cannabis seized in 2024, against 45.2 kg in 2023.[@unodc_szr]
      The Anti-Drug Department reported 525 kg in 2025 and 105 kg in January–July 2026, while
      plants destroyed fell from 17,785 in 2024 to 12,212 in 2025.[@akp26] A January–June 2026
      report gave only 12.7 kg of dried cannabis, conflicting with the 105 kg figure for
      January–July; the two may count different categories.[@cambodianess26] The figures are not
      directly comparable.[@unodc_szr,akp26]
    sources:
      - unodc_szr
      - akp26
      - cambodianess26
