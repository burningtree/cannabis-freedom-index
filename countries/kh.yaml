name: Cambodia
region: Asia
iso_numeric: 116
recreational: illegal
medical: none
updated: 2026-10-04
summary: Illegal on paper but loosely enforced; 'happy' restaurants operate openly in tourist areas.
scores:
  possession: 1
  cultivation: 1
  enforcement: 2
  sharing: 1
  consumption: 2
  access: 1
segments:
  possession:
    text: >-
      The gap between law and practice is wide. On paper, 'keeping' drugs for personal use is a
      crime under the 2012 drug law carrying two to five years in prison. In practice police have
      long ignored small amounts of cannabis, focusing on methamphetamine and heroin — though
      crackdowns have intensified and foreigners get no special treatment.
    sources:
      - law
      - lc
  cultivation:
    text: Cultivation is a criminal offence with prison. Small plots persist in rural areas.
    sources:
      - law
      - cann
  enforcement:
    text: >-
      Lax day to day, harsh when applied: prison terms of years for possession, and prisons badly
      overcrowded with drug detainees.
    sources:
      - lc
      - law
  sharing:
    text: Supply is trafficking, with five to ten years or more.
    sources:
      - lc
      - law
  consumption:
    text: >-
      Consumption is an offence and can lead to compulsory treatment in a drug centre. It is
      nevertheless visible in tourist areas.
    sources:
      - law
      - cann
  access:
    text: >-
      No legal source. 'Happy pizza' restaurants and street sellers operate openly in some cities,
      tolerated rather than licensed.
    sources:
      - cann
context:
  production:
    text: No licensed production.
    sources:
      - lc
  products:
    text: No legal products.
    sources:
      - lc
  medical:
    text: No medical cannabis programme.
    sources:
      - lc
      - cann
  consequences:
    text: Compulsory detention in treatment centres is a real risk for local users.
    sources:
      - law
