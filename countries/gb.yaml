name: United Kingdom
region: Europe
iso_numeric: 826
recreational: illegal
medical: limited
updated: '2026-10-27'
summary: >-
  A Class B drug; small amounts often end in a warning or community resolution. Medical cannabis is
  legal since 2018 but almost exclusively through private clinics.
scores:
  possession: 1
  cultivation: 1
  enforcement: 3
  sharing: 1
  consumption: 1
  access: 2
segments:
  possession:
    text: >-
      Cannabis is a Class B drug: possession carries up to five years in prison and an unlimited
      fine. In practice police in England and Wales use an escalation — a cannabis warning or
      community resolution first, a £90 penalty notice next, then arrest. Of those who do reach
      court, about 60% are fined and 20% conditionally discharged; immediate custody is uncommon and
      usually a month or less.
    sources:
      - sa
  cultivation:
    text: >-
      Growing any number of plants is production of a controlled drug, with up to 14 years on
      indictment. A few plants for personal use typically bring a fine or community order.
    sources:
      - sa
      - boc
  enforcement:
    text: >-
      Mostly out-of-court disposals and fines for users, with wide variation between police forces.
      Production and supply are imprisonable and enforced.
    sources:
      - sa
  sharing:
    text: Supply, including giving cannabis to a friend, carries up to 14 years.
    sources:
      - sa
  consumption:
    text: >-
      Use is prosecuted through the possession offence. Letting your premises be used for smoking
      cannabis is a separate offence.
    sources:
      - sa
      - boc
  access:
    text: >-
      No legal adult-use source. Since November 2018 specialist doctors can prescribe cannabis;
      almost all of it — over 99% of prescriptions — comes through private clinics, which now serve
      tens of thousands of patients with flower delivered by pharmacy.
    sources:
      - pp
      - bmj
context:
  production:
    status: medical
    text: >-
      The Home Office licenses cultivation, mainly for pharmaceutical products and export, plus
      low-THC hemp. The UK is a large exporter of cannabis-based medicines.
    sources:
      - boc
      - pp
  medical:
    text: >-
      Legal since 1 November 2018, but only doctors on the specialist register may initiate it,
      and the NHS funds it for a handful of patients. In November 2019 the medicines watchdog NICE
      approved two cannabis-based medicines, for two forms of epilepsy and for multiple sclerosis,
      and declined to recommend them for other conditions such as chronic pain. The private route
      costs patients a consultation fee plus the product.[@bmj,pp,cgh] Prescription products
      include flower, oils and vape cartridges through clinics.[@pp]
    sources:
      - bmj
      - pp
      - cgh
  consequences:
    text: >-
      A caution or conviction shows on criminal-record checks and can affect work and travel; a
      cannabis warning is recorded but not shown on a standard check. Drug-driving has a very low
      THC limit.
    sources:
      - sa
      - boc
  planting:
    seeds: grey
    seeds_trade: open
    clones: illegal
    clones_trade: banned
    text: >-
      The Misuse of Drugs Act's definition of cannabis leaves out the seed, so buying and
      holding seeds is not an offence. Cultivating any plant of the genus Cannabis is unlawful
      without a licence, which covers germinating seeds and keeping cuttings, so cuttings
      cannot lawfully be sold.
    sources:
      - mda
  black_market:
    text: >-
      All recreational cannabis is supplied illegally. The most detailed estimate found is
      old: a 2018 report by the Institute of Economic Affairs, a think tank arguing for
      legalisation, put consumption in 2016/17 at 255 tonnes by just over three million users,
      worth about 2.55 billion pounds at ten pounds a gram, and described a market dominated
      by high-strength cannabis. No recent official estimate was found.
    sources:
      - iea18
  clubs:
    status: tolerated
    text: >-
      No law provides for clubs and cannabis remains a class B drug. A federation, UK Cannabis
      Social Clubs, was founded in 2011 and by 2016 counted more than 80 clubs, most with 100
      to 150 members and registered as non-profits. Most have since gone: there were still
      dozens in 2019, but the pandemic, unpaid rents, infighting and arrests broke the
      movement, and one organiser was jailed for running a cannabis café. Teesside Cannabis
      Social Club in Stockton-on-Tees is one of the few survivors and the only one that worked
      with the consent of the authorities, backed from the start by the Durham police
      commissioner; in 2024 more than 850 members paid £120 a year, and cannabis grown mostly
      by about a dozen members was sold on the premises. Newer venues are opening as lounges
      for holders of private medical prescriptions, some with the apparent blessing of local
      police. Tolerance is a matter of local police discretion, not national policy.
    sources:
      - td24
      - volteface16
      - wikitcc
  driving:
    status: limit
    text: >-
      The THC limit is 2 micrograms per litre of whole blood in England and Wales and, since 21
      October 2019, Scotland. Exceeding the limit can be an offence without proof of impaired
      driving. A roadside saliva screen for cannabis is followed by evidential testing; a positive
      screen alone is not the measured blood concentration. Patients taking a lawfully supplied
      medicine as instructed can raise a medical defence to the specified-limit offence, but not
      to driving while impaired. GOV.UK lists a minimum one-year driving ban, an unlimited fine
      and up to six months in prison, with the conviction recorded on the licence for eleven
      years. Northern Ireland instead prosecutes driving while unfit through drugs, with a
      minimum one-year ban and a fine of up to £5,000; these Great Britain blood limits do not
      apply there.
    sources:
      - govdd
      - govlim
      - scot_driving
      - drug_medical
      - ni_driving

  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone, so a visitor has no lawful way to buy
      cannabis. Whatever legal supply exists is medical, for patients with a prescription or
      registration. The sources behind this profile describe no separate rule for visitors.
    sources:
      - pp
      - bmj

  arrests:
    text: >-
      Home Office statistics for England and Wales count 269,321 drug seizures by police
      forces and Border Force in the year ending March 2025, the most since the series
      began in 1973, and cannabis was present in 72 per cent of them: 194,682 seizures, up
      28 per cent on the year before. Most police seizures are small. Of herbal cannabis
      seizures, 12 per cent weighed under one gram and 54 per cent between one gram and
      500 g, and three quarters of plant seizures involved ten plants or fewer. Police
      recorded 204,664 drug offences in the same year, up 12 per cent; the Home Office
      notes that each seizure also generates a recorded offence, so the two series move
      together. The figures do not cover Scotland or Northern Ireland.
    sources:
      - ho_seizures25
  hemp:
    status: strict
    text: >-
      CBD foods have a separate approval process. The FSA’s [board paper updated on 19 October
      2026](/history/uk-cbd-first-authorisation-recommendations-2026/) sought agreement on
      recommendations for three high-purity CBD applications, with proposed adult-only conditions
      and a 10 mg daily maximum. Final authorisation decisions belong to ministers in England and
      Wales, with Northern Ireland’s health minister informed; this paper records
      recommendations.[@cbd2026]
    sources:
      - cbd2026
