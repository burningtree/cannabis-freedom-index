name: Venezuela
region: South America
iso_numeric: 862
recreational: illegal
medical: none
updated: 2026-10-25
summary: >-
  Personal-use cases are dealt with through court-ordered rehabilitation. Separate criminal
  possession can bring one to two years even within the twenty-gram cannabis band. Growing
  no more than ten plants carries six to ten years in prison.
scores:
  possession: 2
  cultivation: 0
  enforcement: 2
  sharing: 0
  consumption: 1
  access: 0
segments:
  possession:
    text: >-
      Article 131 puts consumers holding an individually assessed personal dose under the
      rehabilitation procedure. Judges consider tolerance, dependence, consumption pattern,
      personal characteristics and forensic evidence.[@lod] Article 153 separately punishes
      possession outside lawful activities and personal use with one to two years in prison;
      its quantity band includes up to 20 g of marijuana and up to 5 g of what the statute calls
      genetically modified marijuana. The 20 g figure belongs to this separate criminal
      possession band. Article 149 sets eight to twelve years for cannabis trafficking above
      the article 153 ceiling and up to 500 g, twelve to eighteen years up to 5,000 g, and a
      general fifteen-to-twenty-five-year range.[@lod] The one-to-two-year possession term
      dates to a [2005 reform](/history/venezuela-possession-penalties-2005/) that cut it from
      four to six years; the twenty-gram cannabis ceiling stayed.[@lod]
      [Quantity limits were set in 1993.](/history/venezuela-personal-dose-1993/)
    sources:
      - lod
    penalties:
      - label: Personal dose (article 131)
        treatment: criminal
        term: Personal use
        note: Individually assessed dose; court-ordered rehabilitation, possibly residential; no prison tariff
      - label: Criminal possession in band (article 153)
        treatment: criminal
        term: Possession
        prison_min: 1 year
        prison: 2 years
        note: Up to 20 g marijuana (5 g modified); separate from personal use
  cultivation:
    text: >-
      Article 151 punishes unlawful sowing, growing and related dealings in controlled plants,
      seeds and resin with twelve to eighteen years in prison. For no more than ten plants
      or 300 g of seed or resin, the range is six to ten years. Directing or financing these
      operations carries twenty-five to thirty years.[@lod] An older range of four to eight
      years for holding and growing dated to a
      [1964 code amendment](/history/venezuela-cannabis-prison-code-1964/).[@lod]
    sources:
      - lod
    penalties:
      - label: Up to ten plants, 300 g seed or resin (article 151)
        treatment: criminal
        term: Unlicensed cultivation
        prison_min: 6 years
        prison: 10 years
      - label: Unlawful sowing, growing and related dealings (article 151)
        treatment: criminal
        term: Unlicensed cultivation
        prison_min: 12 years
        prison: 18 years
      - label: Directing or financing (article 151)
        treatment: criminal
        term: Unlicensed cultivation
        prison_min: 25 years
        prison: 30 years
  enforcement:
    text: >-
      The personal-use procedure can lead to compulsory rehabilitation, which may involve
      living in a specialised centre. Separate criminal possession and trafficking offences
      still carry prison terms.[@lod] In 2017 the Supreme Court removed an additional barrier
      to suspended sentences in drug cases; general conditions, including an actual sentence
      of no more than five years, still apply.[@court17] The 2014 binding rule opening
      sentencing alternatives for minor drug cases, the 1993 cut of the possession term, and the 2017 removal of the
      suspension bar, are traced in the
      [2014 ruling](/history/venezuela-small-drug-cases-suspended-sentences-2014/),
      [1993 reform](/history/venezuela-personal-dose-1993/) and the
      [2017 judgment](/history/venezuela-drug-suspension-bar-struck-2017/).[@court17]
    sources:
      - lod
      - court17
  sharing:
    text: >-
      Article 149 includes supplying and distributing drugs among trafficking acts without
      requiring payment. It sets a general fifteen-to-twenty-five-year prison range, with
      lower quantity bands of eight to twelve and twelve to eighteen years. There is no
      adult cannabis-gifting exemption in that rule.[@lod]
      [Supply terms rose in 2010.](/history/venezuela-drug-law-2010/)
    sources:
      - lod
  consumption:
    text: >-
      Article 130 requires court-ordered rehabilitation for people placed under the consumer
      procedure. Reintegration, follow-up and community service can be added. Article 132 says
      treatment can involve residence in a specialised centre or take place without residence.
      The personal dose is assessed individually under article 131.[@lod]
      [Treatment for users dates to 1984.](/history/venezuela-drug-law-1984/)
      [Quantity limits were set in 1993.](/history/venezuela-personal-dose-1993/)
    sources:
      - lod
  access:
    text: >-
      No lawful recreational supply route is provided. Unauthorised supply and growing remain
      criminal under articles 149 and 151.[@lod]
      [Supply terms rose in 2010.](/history/venezuela-drug-law-2010/)
    sources:
      - lod
context:
  production:
    status: none
    text: >-
      No licensed production operates: the 2010 law criminalises sowing, growing and
      supply, and no licensing regime was established in the sources read.[@lod]
      [Supply terms rose in 2010.](/history/venezuela-drug-law-2010/)
    sources:
      - lod
  medical:
    text: >-
      No medical cannabis programme operates: the law provides treatment and
      rehabilitation for consumers, not patient supply, and unauthorised supply and
      growing remain criminal.[@lod]
      [Treatment for users dates to 1984.](/history/venezuela-drug-law-1984/)
    sources:
      - lod
  recreational:
    text: >-
      Recreational cannabis is fully prohibited. Consumers holding an individually
      assessed personal dose go through the court-ordered rehabilitation procedure, but
      possession outside lawful activities and personal use is separately criminal — one
      to two years even within the 20 g band — and trafficking draws eight to
      twenty-five years by quantity.[@lod]
      [Quantity limits were set in 1993.](/history/venezuela-personal-dose-1993/)
      [Supply terms rose in 2010.](/history/venezuela-drug-law-2010/)
    sources:
      - lod
  hemp:
    status: none
    text: >-
      No hemp exception operates: seeds, resins and plants fall under the article 151
      trafficking offence, with six to ten years for ten plants or 300 g of seed.[@lod]
      [Holding and growing drew four to eight years from 1964.](/history/venezuela-cannabis-prison-code-1964/)
    sources:
      - lod
  consequences:
    text: >-
      People placed under the personal-use procedure can be required to attend rehabilitation
      and follow-up. Criminal convictions under the drug law can also bring confiscation of
      property, and article 178 provides for expulsion of foreign offenders after serving the
      sentence.[@lod] The Supreme Court's 2017 decision allows suspended sentences to be
      considered without the former six-year statutory-maximum bar, subject to the remaining
      conditions.[@court17]
    sources:
      - lod
      - court17
  planting:
    seeds: illegal
    seeds_trade: banned
    clones: illegal
    clones_trade: banned
    text: >-
      Article 151 of the 2010 Organic Drug Law is headed "illicit trafficking of seeds, resins
      and plants": sowing, growing, storing, transporting or distributing seeds or plants that
      contain or reproduce a controlled substance carries twelve to eighteen years in prison.[@lod]
      For no more than 300 grams of seed or ten plants the penalty is six to ten years.[@lod]
      [Holding and growing drew four to eight years from 1964.](/history/venezuela-cannabis-prison-code-1964/)
      [Supply terms rose in 2010.](/history/venezuela-drug-law-2010/)
    sources:
      - lod
  clubs:
    status: none
    text: >-
      No lawful recreational club route is provided. Growing cannabis and supplying it to
      others are covered by the offences in articles 151 and 149.[@lod]
      [Gathering premises drew prison from 1964.](/history/venezuela-cannabis-prison-code-1964/)
    sources:
      - lod
  visitors:
    status: none
    text: >-
      The law provides no recreational supply route or visitor exemption.[@lod] Personal-use cases
      depend on a judge's assessment and forensic evidence; article 153 separately permits
      one to two years in prison for criminal possession even within its 20 g cannabis band.[@lod]
      Article 178 provides for expulsion of foreign offenders after serving a criminal sentence.[@lod]
      [The one-to-two-year term dates to 2005.](/history/venezuela-possession-penalties-2005/)
    sources:
      - lod
  black_market:
    text: >-
      Figures reported by the government to the UN drugs office record 13,115 kg of herbal
      cannabis seized in 2024, against 8,416 kg in 2023.[@unodc_szr] The UN publishes them as kilogram
      equivalents, and countries count seizures differently, so the figures are not
      comparable across borders.[@unodc_szr] In September 2022 the armed forces announced
      their largest marijuana bust in a decade: a boat intercepted off the Caribbean coast
      with 2.8 metric tons of marijuana and 8 kg of cocaine.[@ap22]
      [Three tonnes were seized off Falcón in 2025.](/history/venezuela-falcon-seizure-2025/)
    sources:
      - unodc_szr
      - ap22
  driving:
    status: impairment
    text: >-
      Article 139 of the drug law and article 169 of the traffic law sanction driving
      under the influence of alcohol or other substances, but a study of Venezuelan
      university students found very few mechanisms for monitoring or penalising such
      drivers, and a correspondingly low expectation of being caught.[@scielo]
    sources:
      - scielo
  arrests:
    text: >-
      The September 2022 boat interception — 2.8 tons of marijuana, the decade's largest
      bust — shows enforcement at sea as well as on land.[@ap22] Government figures
      reported to the UN record 13,115 kg of herbal cannabis seized in 2024, against
      8,416 kg in 2023.[@unodc_szr]
      [Three tonnes were seized off Falcón in 2025.](/history/venezuela-falcon-seizure-2025/)
    sources:
      - ap22
      - unodc_szr
  culture:
    text: >-
      Indian labourers carried ganja culture to Venezuela's coast: by 1895 some immigrants
      had become specialised producers, growing the plant in Venezuela and smuggling it
      back to Trinidad to dodge customs — likely sowing seed from plants already growing
      in the Americas.[@duvall19] The first printed record of cannabis in Venezuela is an
      1895 travel account, with a British Guiana inquiry following in 1897.[@duvall19] The
      file's first-restriction estimate centres on
      [1925](/history/ve-first-restriction-estimate/).[@duvall19]
    sources:
      - duvall19
answers:
  buy:
    answer: no
    text: No patient or adult-use purchase route verified
