segments:
  possession:
    text: >-
      The 2010 drug law defines a personal dose of up to 20 g of cannabis. Possession within it is
      not punished with prison but with 'security measures': referral to rehabilitation or
      detoxification, which a judge can make compulsory, including internment. Foreign non-residents
      can be deported. Above 20 g, trafficking penalties of eight to twelve years apply.
    sources:
      - wiki
      - tni
  cultivation:
    text: Cultivation is a crime.
    sources:
      - wiki
  enforcement:
    text: >-
      No prison for the personal dose in law, but forced treatment is possible and police practice
      is arbitrary. The jump to eight years just above 20 g is steep.
    sources:
      - tni
      - wiki
  sharing:
    text: Supply is trafficking.
    sources:
      - tni
  consumption:
    text: Use leads to the same treatment-based security measures as possession.
    sources:
      - tni
      - wiki
  access:
    text: No legal source.
    sources:
      - cr
