name: Venezuela
region: South America
iso_numeric: 862
recreational: illegal
medical: none
updated: 2026-10-25
summary: >-
  Personal-use cases are dealt with through court-ordered rehabilitation. Separate criminal
  possession can bring one to two years even within the twenty-gram cannabis band. Growing
  no more than ten plants carries six to ten years in prison.
scores:
  possession: 2
  cultivation: 0
  enforcement: 2
  sharing: 0
  consumption: 1
  access: 0
segments:
  possession:
    text: >-
      Article 131 puts consumers holding an individually assessed personal dose under the
      rehabilitation procedure. Judges consider tolerance, dependence, consumption pattern,
      personal characteristics and forensic evidence.[@lod] Article 153 separately punishes
      possession outside lawful activities and personal use with one to two years in prison;
      its quantity band includes up to 20 g of marijuana and up to 5 g of what the statute calls
      genetically modified marijuana. The 20 g figure belongs to this separate criminal
      possession band. Article 149 sets eight to twelve years for cannabis trafficking above
      the article 153 ceiling and up to 500 g, twelve to eighteen years up to 5,000 g, and a
      general fifteen-to-twenty-five-year range.[@lod]
    sources:
      - lod
  cultivation:
    text: >-
      Article 151 punishes unlawful sowing, growing and related dealings in controlled plants,
      seeds and resin with twelve to eighteen years in prison. For no more than ten plants
      or 300 g of seed or resin, the range is six to ten years. Directing or financing these
      operations carries twenty-five to thirty years.[@lod]
    sources:
      - lod
  enforcement:
    text: >-
      The personal-use procedure can lead to compulsory rehabilitation, which may involve
      living in a specialised centre. Separate criminal possession and trafficking offences
      still carry prison terms.[@lod] In 2017 the Supreme Court removed an additional barrier
      to suspended sentences in drug cases; general conditions, including an actual sentence
      of no more than five years, still apply.[@court17]
    sources:
      - lod
      - court17
  sharing:
    text: >-
      Article 149 includes supplying and distributing drugs among trafficking acts without
      requiring payment. It sets a general fifteen-to-twenty-five-year prison range, with
      lower quantity bands of eight to twelve and twelve to eighteen years. There is no
      adult cannabis-gifting exemption in that rule.[@lod]
    sources:
      - lod
  consumption:
    text: >-
      Article 130 requires court-ordered rehabilitation for people placed under the consumer
      procedure. Reintegration, follow-up and community service can be added. Article 132 says
      treatment can involve residence in a specialised centre or take place without residence.
      The personal dose is assessed individually under article 131.[@lod]
    sources:
      - lod
  access:
    text: >-
      No lawful recreational supply route is provided. Unauthorised supply and growing remain
      criminal under articles 149 and 151.[@lod]
    sources:
      - lod
context:
  production:
    text: Reliable national information about lawful cannabis production was not established by the retained sources.
    sources: []
  products:
    text: Reliable national information about legally available cannabis products was not established by the retained sources.
    sources: []
  medical:
    text: The retained sources do not establish whether a medical cannabis programme operates.
    sources: []
  consequences:
    text: >-
      People placed under the personal-use procedure can be required to attend rehabilitation
      and follow-up. Criminal convictions under the drug law can also bring confiscation of
      property, and article 178 provides for expulsion of foreign offenders after serving the
      sentence.[@lod] The Supreme Court's 2017 decision allows suspended sentences to be
      considered without the former six-year statutory-maximum bar, subject to the remaining
      conditions.[@court17]
    sources:
      - lod
      - court17
  planting:
    seeds: illegal
    seeds_trade: banned
    clones: illegal
    clones_trade: banned
    text: >-
      Article 151 of the 2010 Organic Drug Law is headed "illicit trafficking of seeds, resins
      and plants": sowing, growing, storing, transporting or distributing seeds or plants that
      contain or reproduce a controlled substance carries twelve to eighteen years in prison.
      For no more than 300 grams of seed or ten plants the penalty is six to ten years.
    sources:
      - lod
  clubs:
    status: none
    text: >-
      No lawful recreational club route is provided. Growing cannabis and supplying it to
      others are covered by the offences in articles 151 and 149.[@lod]
    sources:
      - lod
  visitors:
    status: none
    text: >-
      The law provides no recreational supply route or visitor exemption. Personal-use cases
      depend on a judge's assessment and forensic evidence; article 153 separately permits
      one to two years in prison for criminal possession even within its 20 g cannabis band.
      Article 178 provides for expulsion of foreign offenders after serving a criminal sentence.[@lod]
    sources:
      - lod
  black_market:
    text: >-
      Figures reported by the government to the UN drugs office record 13,115 kg of herbal
      cannabis seized in 2024, against 8,416 kg in 2023. The UN publishes them as kilogram
      equivalents, and countries count seizures differently, so the figures are not
      comparable across borders.
    sources:
      - unodc_szr
