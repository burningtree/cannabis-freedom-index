    sources:
      - cr
  consequences:
    text: Security measures are recorded, and can include supervised release.
    sources:
      - tni
  planting:
    seeds: illegal
    seeds_trade: banned
    clones: illegal
    clones_trade: banned
    text: >-
      Article 151 of the 2010 Organic Drug Law is headed "illicit trafficking of seeds, resins
      and plants": sowing, growing, storing, transporting or distributing seeds or plants that
      contain or reproduce a controlled substance carries twelve to eighteen years in prison.
      For no more than 300 grams of seed or ten plants the penalty is six to ten years.
    sources:
      - lod
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited.
    sources:
      - wiki
      - tni
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone, so a visitor has no lawful way to buy
      cannabis. The sources behind this profile describe no separate rule for visitors.
    sources:
      - cr
