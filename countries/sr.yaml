name: Suriname
region: South America
iso_numeric: 740
recreational: illegal
medical: none
updated: '2026-10-28'
summary: >-
  Up to thirteen years for possession, with no Dutch-style tolerance. The 2023 industrial-hemp law
  provides licences for certified crops with no more than 1% THC.
scores:
  possession: 1
  cultivation: 1
  enforcement: 1
  sharing: 1
  consumption: 1
  access: 0
segments:
  possession:
    text: >-
      Cannabis is on List II of the 1998 Narcotics Act, and Article 4 forbids possessing, holding
      or using anything on that list. Article 11 sets up to thirteen years in prison and a fine
      for doing so intentionally, and up to seven years otherwise. The Act names no tolerated or
      decriminalised amount.
    sources:
      - wvm
  cultivation:
    text: >-
      Ordinary cannabis growing remains prohibited under the Narcotics Act.[@wvm] The [2023 hemp
      law](/history/suriname-industrial-hemp-2023/) allows licensed industrial cultivation from
      certified seed with no more than 1% THC.[@hemp23]
    sources:
      - wvm
      - hemp23
  enforcement:
    text: >-
      The Narcotics Act sets the same maximum, up to thirteen years in prison, for possessing
      cannabis as for selling or supplying it, with no tolerated amount. No figures on how small
      cases are dealt with were found.
    sources:
      - wvm
  sharing:
    text: >-
      Cannabis is on List II of the narcotics law. Selling, delivering, supplying or transporting it
      carries up to thirteen years in prison, and importing or exporting it life or up to twenty
      years, with heavy fines (Article 11).
    sources:
      - wvm
  consumption:
    text: >-
      Article 4 of the Narcotics Act forbids using a List II substance as well as possessing it,
      with the same penalties under Article 11.
    sources:
      - wvm
  access:
    text: >-
      None. The Narcotics Act lifts its bans only for pharmacists, dispensing doctors and vets
      acting for a medical purpose, for people who can show a medical need for what they hold, and
      for those with the Minister's written permission.
    sources:
      - wvm
context:
  recreational:
    text: >-
      There is no legal recreational supply. Possessing, holding or using cannabis brings up
      to thirteen years in prison and a fine — the same maximum as for selling it — with no
      tolerated amount.[@wvm] Importing or exporting brings life or up to twenty
      years.[@wvm]
    sources:
      - wvm
  production:
    status: hemp
    text: >-
      The [2023 hemp law](/history/suriname-industrial-hemp-2023/) provides licences for industrial
      cultivation, storage, processing, delivery and sale, administered by a new national hemp
      institute.[@hemp23] In November 2024 the government was still preparing the implementing
      decisions and establishment of the institute.[@hempimpl]
    sources:
      - hemp23
      - hempimpl
  hemp:
    status: high
    text: >-
      Industrial hemp must come from certified seed and contain no more than 1% THC under the [2023
      law](/history/suriname-industrial-hemp-2023/).[@hemp23] Growing and commercial handling require
      a licence from the national hemp institute.[@hemp23] The government’s November 2024 update
      described preparations for implementation, with further decisions and the institute still being
      organised.[@hempimpl]
    sources:
      - hemp23
      - hempimpl
  medical:
    text: >-
      None. A push under the previous government to legalise medical use and home growing was
      dropped after the 2020 election.
    sources:
      - wiki
  consequences:
    text: The retained sources do not establish collateral consequences beyond the penalties described above.
    sources: []
  planting:
    seeds: licensed
    seeds_trade: regulated
    clones: illegal
    clones_trade: banned
    text: >-
      The industrial-hemp law requires certified seed and licensed cultivation for industrial purposes
      at no more than 1% THC.[@hemp23] Ordinary cannabis cultivation remains prohibited under the
      Narcotics Act; its older text has no general seed exception.[@wvm]
    sources:
      - hemp23
      - wvm
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited.
    sources:
      - wvm
      - wiki
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. The Narcotics Act punishes importing or
      exporting cannabis with up to twenty years or life in prison and heavy fines, and
      possession with up to thirteen.
    sources:
      - wvm
      - wiki
sources:
