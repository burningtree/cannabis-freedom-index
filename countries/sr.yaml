segments:
  possession:
    text: >-
      Illegal under the narcotics law, with up to four years in prison for possession plus fines.
      Despite the country's Dutch ties, there is no tolerance policy or decriminalised amount.
    sources:
      - cr
      - wiki
  cultivation:
    text: Article 2 of the 1998 Narcotics Act forbids growing Cannabis sativa.
    sources:
      - wvm
      - wiki
  enforcement:
    text: Prison is available for possession; small cases often end in fines.
    sources:
      - cr
  sharing:
    text: Trafficking carries up to twelve years, twenty for organised supply.
    sources:
      - cr
  consumption:
    text: Use is prosecuted through possession.
    sources:
      - wiki
  access:
    text: None.
    sources:
      - wiki
context:
  production:
    text: >-
      In October 2022 the National Assembly passed an Industrial Hemp Cultivation Law allowing
      licensed hemp of up to 1% THC, largely for export.
    sources:
      - cr
  products:
    text: Hemp products only; CBD is classed as controlled.
    sources:
      - cr
  medical:
    text: >-
      None. A push under the previous government to legalise medical use and home growing was
      dropped after the 2020 election.
    sources:
      - wiki
      - cr
  consequences:
    text: A conviction is a criminal record.
    sources:
      - cr
  planting:
    seeds: grey
    seeds_trade: unclear
    clones: illegal
    clones_trade: banned
    text: >-
      Article 2 of the 1998 Narcotics Act bans growing Cannabis sativa. Its schedule defines
      hemp as any part of the plant of the genus Cannabis from which the resin has not been
      extracted, without the express exception for seeds found in the Dutch law it resembles.
      The text read is the version as amended in 2002.
    sources:
      - wvm
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited.
    sources:
      - wvm
      - wiki
      - cr
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. British travel advice says there are
      severe penalties for all drug offences and tells travellers to pack their own luggage
      and carry nothing through customs for anyone else.
    sources:
      - wiki
      - fcdo
