name: Suriname
region: South America
iso_numeric: 740
recreational: illegal
medical: none
updated: 2026-10-12
summary: >-
  Up to thirteen years for possession, with no Dutch-style tolerance; industrial hemp was legalised in
  2022.
scores:
  possession: 1
  cultivation: 1
  enforcement: 1
  sharing: 1
  consumption: 1
  access: 0
segments:
  possession:
    text: >-
      Cannabis is on List II of the 1998 Narcotics Act, and Article 4 forbids possessing, holding
      or using anything on that list. Article 11 sets up to thirteen years in prison and a fine
      for doing so intentionally, and up to seven years otherwise. The Act names no tolerated or
      decriminalised amount.
    sources:
      - wvm
  cultivation:
    text: Article 2 of the 1998 Narcotics Act forbids growing Cannabis sativa.
    sources:
      - wvm
      - wiki
  enforcement:
    text: >-
      The Narcotics Act sets the same maximum, up to thirteen years in prison, for possessing
      cannabis as for selling or supplying it, with no tolerated amount. No figures on how small
      cases are dealt with were found.
    sources:
      - wvm
  sharing:
    text: >-
      Cannabis is on List II of the narcotics law. Selling, delivering, supplying or transporting it
      carries up to thirteen years in prison, and importing or exporting it life or up to twenty
      years, with heavy fines (Article 11).
    sources:
      - wvm
  consumption:
    text: >-
      Article 4 of the Narcotics Act forbids using a List II substance as well as possessing it,
      with the same penalties under Article 11.
    sources:
      - wvm
  access:
    text: >-
      None. The Narcotics Act lifts its bans only for pharmacists, dispensing doctors and vets
      acting for a medical purpose, for people who can show a medical need for what they hold, and
      for those with the Minister's written permission.
    sources:
      - wvm
context:
  production:
    text: Reliable national information about lawful cannabis production was not established by the retained sources.
    sources: []
  products:
    text: Reliable national information about legally available cannabis products was not established by the retained sources.
    sources: []
  medical:
    text: >-
      None. A push under the previous government to legalise medical use and home growing was
      dropped after the 2020 election.
    sources:
      - wiki
  consequences:
    text: The retained sources do not establish collateral consequences beyond the penalties described above.
    sources: []
  planting:
    seeds: grey
    seeds_trade: unclear
    clones: illegal
    clones_trade: banned
    text: >-
      Article 2 of the 1998 Narcotics Act bans growing Cannabis sativa. Its schedule defines
      hemp as any part of the plant of the genus Cannabis from which the resin has not been
      extracted, without the express exception for seeds found in the Dutch law it resembles.
      The text read is the version as amended in 2002.
    sources:
      - wvm
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited.
    sources:
      - wvm
      - wiki
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. The Narcotics Act punishes importing or
      exporting cannabis with up to twenty years or life in prison and heavy fines, and
      possession with up to thirteen.
    sources:
      - wvm
      - wiki
