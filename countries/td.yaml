name: Chad
region: Africa
iso_numeric: 148
recreational: illegal
medical: none
updated: 2026-10-21
summary: >-
  Chad prohibits cannabis. Its 2000 pharmacy law provides prison and fine alternatives for
  narcotics offences and compulsory treatment powers. The full 1995 drug law and a current
  consolidated account of the overlapping rules remain unverified, as do the scores below.
scores:
  possession: 1
  cultivation: 1
  enforcement: 1
  sharing: 1
  consumption: 1
  access: 0
words:
  - { word: Chanvre, lang: French, meaning: "hemp; the 1966 decree's word for cannabis", sources: [decree1966] }
segments:
  possession:
    text: >-
      The 2000 pharmacy law, Articles 134–135, provides one to six years in prison,
      a fine of 300,000 to three million CFA francs, or both for possessing narcotics
      without a legitimate reason.[@pharmacy2000] Its relationship with the separate 1995 drug
      law and subsequent changes has not been verified.
    sources:
      - pharmacy2000
    currency: XAF
    penalties:
      - label: Possessing narcotics without legitimate reason (Articles 134–135)
        treatment: criminal
        term: Possession
        prison_min: 1 year
        prison: 6 years
        fine: 3000000
        note: Fine of 300,000–3,000,000 CFA francs; consolidation with the 1995 drug law unverified
  cultivation:
    text: >-
      Article 136 of the 2000 pharmacy law doubles the ordinary narcotics penalties for
      illicit cultivation: two to twelve years in prison, a doubled fine, or both.[@pharmacy2000]
      Current consolidated penalties remain unverified; see possession.
    sources:
      - pharmacy2000
    currency: XAF
    penalties:
      - label: Illicit cultivation (Article 136, doubled penalties)
        treatment: criminal
        term: Cultivation
        prison_min: 2 years
        prison: 12 years
        fine: 6000000
        note: Doubled fine of 600,000–6,000,000 CFA francs; consolidation unverified
  enforcement:
    text: >-
      Article 38 of the 2017 Penal Code allows up to two years of confinement in a special
      health institution for a person with drug dependence convicted of an offence punishable
      by at least two years in prison.[@pc2017] Under Article 41 it begins after the principal
      prison sentence ends or is suspended.[@pc2017] The court may shorten confinement after
      medical advice that release no longer threatens public order.[@pc2017] Current drug-offence
      penalties remain unverified; see possession. The 2017 confinement rule is traced in the
      [confinement entry](/history/chad-convicted-drug-users-confinement-2017/).
    sources:
      - pc2017
  sharing:
    text: >-
      The 2000 pharmacy law punishes helping someone else use narcotics, even free of
      charge, with one to six years in prison, a fine, or both.[@pharmacy2000] It also requires a
      five to twenty year residence restriction for facilitating use.[@pharmacy2000] Current
      consolidated penalties remain unverified; see possession.
    sources:
      - pharmacy2000
    currency: XAF
    penalties:
      - label: Helping someone else use narcotics, free or paid
        treatment: criminal
        term: Supply
        prison_min: 1 year
        prison: 6 years
        note: Fine and/or prison; five-to-twenty-year residence restriction; consolidation unverified
  consumption:
    text: >-
      The 1966 decree expressly prohibited cannabis use.[@decree1966] Article 134 of the 2000
      pharmacy law sets one to six years in prison, a fine, or both for using narcotics
      together.[@pharmacy2000] Current consolidated penalties remain unverified; see
      possession.
    sources:
      - decree1966
      - pharmacy2000
  access:
    text: >-
      No operating cannabis supply programme was established by the retained
      sources.[@decree1966] The 1966 decree allowed the health minister to grant exceptions for
      scientific research; the 2000 law regulated controlled medicines and adopted treaty drug
      lists.[@decree1966,pharmacy2000]
    sources:
      - decree1966
      - pharmacy2000
context_not_applicable:
  death_penalty:
    text: >-
      Chad fully abolished the death penalty in April 2020, when parliament unanimously
      removed it for terrorism offences after the 2017 code had ended it for ordinary crimes;
      no cannabis offence carries a capital sentence.[@ohchr]
    sources: [ohchr]
context:
  recreational:
    text: >-
      There is no legal way to get cannabis. Possessing narcotics without a legitimate reason
      brings one to six years in prison, a fine of 300,000 to three million CFA francs, or
      both under the 2000 pharmacy law, whose consolidation with the 1995 drug law remains
      unverified.[@pharmacy2000]
    sources:
      - pharmacy2000
  hemp:
    status: none
    text: >-
      No industrial-hemp exception was verified: the 1966 decree prohibits cannabis without
      distinction, the 2000 pharmacy law lists narcotics with no low-THC carve-out, and no hemp
      production is documented.[@decree1966,pharmacy2000]
    sources:
      - decree1966
      - pharmacy2000
  production:
    status: none
    text: >-
      No licensed production. Illicit cultivation carries two to twelve years and a doubled
      fine.[@pharmacy2000]
    sources:
      - pharmacy2000
  medical:
    text: >-
      No patient programme is documented. The 2000 law regulates controlled medicines and the
      1966 decree let the health minister grant exceptions for scientific research, but no
      route for patients to obtain cannabis is provided for.[@pharmacy2000,decree1966]
    sources:
      - pharmacy2000
      - decree1966
  consequences:
    text: >-
      The 2000 pharmacy law requires a five to twenty year residence restriction for
      facilitating narcotics use and provides confiscation and professional bans in
      specified cases.[@pharmacy2000] Its present application alongside the 1995 drug law remains
      unverified.
    sources:
      - pharmacy2000
  clubs:
    status: none
    text: >-
      The retained sources establish no authorised cannabis clubs.[@pharmacy2000] The 2000 pharmacy
      law punishes using narcotics together and helping others use them, including providing
      premises.[@pharmacy2000]
    sources:
      - pharmacy2000
  visitors:
    status: none
    text: >-
      There is no separate rule for visitors and no lawful supply: the pharmacy law's narcotics
      penalties apply to anyone, and facilitating use brings a five to twenty year residence
      restriction.[@pharmacy2000]
    sources:
      - pharmacy2000
  black_market:
    text: >-
      Figures reported by the government to the UN drugs office record 400 kg of herbal
      cannabis seized in 2024, against 125 kg in 2023.[@unodc_szr] The UN publishes them as kilogram
      equivalents, and countries count seizures differently, so the figures are not
      comparable across borders.[@unodc_szr] Police still destroy seizures publicly: in November
      2025 they burned 32 kg of herb and 34 balls of cannabis in N'Djamena under the 1995 drug
      law (see the [2025 burn](https://tracker.cannabisfreedom.fyi/report/chad-police-burn-2025/)).
    sources:
      - unodc_szr
