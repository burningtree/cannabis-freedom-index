segments:
  possession:
    text: >-
      Unverified. The Penal Code of 8 May 2017 (Law 2017-01) has no article on cannabis or on
      possessing, growing or using drugs. A separate drug law could not be found.
    sources:
      - pc2017
  cultivation:
    text: Unverified; see possession.
    sources:
      - pc2017
  enforcement:
    text: >-
      Unverified. The only drug-user provision found in the Penal Code is Article 38: a court may
      order a convicted drug addict into a special health house for up to two years.
    sources:
      - pc2017
  sharing:
    text: >-
      Unverified. Article 10 applies the Penal Code to drug trafficking even when committed abroad,
      but sets no penalty for it.
    sources:
      - pc2017
  consumption:
    text: Unverified; see possession.
    sources:
      - pc2017
