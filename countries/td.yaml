name: Chad
region: Africa
iso_numeric: 148
recreational: illegal
medical: none
updated: 2026-10-21
summary: >-
  Chad prohibits cannabis. Its 2000 pharmacy law provides prison and fine alternatives for
  narcotics offences and compulsory treatment powers. The full 1995 drug law and a current
  consolidated account of the overlapping rules remain unverified, as do the scores below.
scores:
  possession: 1
  cultivation: 1
  enforcement: 1
  sharing: 1
  consumption: 1
  access: 0
segments:
  possession:
    text: >-
      The 2000 pharmacy law, Articles 134–135, provides one to six years in prison,
      a fine of 300,000 to three million CFA francs, or both for possessing narcotics
      without a legitimate reason. Its relationship with the separate 1995 drug law
      and subsequent changes has not been verified.
    sources:
      - pharmacy2000
  cultivation:
    text: >-
      Article 136 of the 2000 pharmacy law doubles the ordinary narcotics penalties for
      illicit cultivation: two to twelve years in prison, a doubled fine, or both.
      Current consolidated penalties remain unverified; see possession.
    sources:
      - pharmacy2000
  enforcement:
    text: >-
      Article 38 of the 2017 Penal Code allows up to two years of confinement in a special
      health institution for a person with drug dependence convicted of an offence punishable
      by at least two years in prison. Under Article 41 it begins after the principal prison
      sentence ends or is suspended. The court may shorten confinement after medical advice
      that release no longer threatens public order. Current drug-offence penalties remain
      unverified; see possession.
    sources:
      - pc2017
  sharing:
    text: >-
      The 2000 pharmacy law punishes helping someone else use narcotics, even free of
      charge, with one to six years in prison, a fine, or both. It also requires a five
      to twenty year residence restriction for facilitating use. Current consolidated
      penalties remain unverified; see possession.
    sources:
      - pharmacy2000
  consumption:
    text: >-
      The 1966 decree expressly prohibited cannabis use. Article 134 of the 2000 pharmacy
      law sets one to six years in prison, a fine, or both for using narcotics together.
      Current consolidated penalties remain unverified; see possession.
    sources:
      - decree1966
      - pharmacy2000
  access:
    text: >-
      No operating cannabis supply programme was established by the retained sources.
      The 1966 decree allowed the health minister to grant exceptions for scientific
      research; the 2000 law regulated controlled medicines and adopted treaty drug lists.
    sources:
      - decree1966
      - pharmacy2000
context:
  production:
    text: Reliable national information about lawful cannabis production was not established by the retained sources.
    sources: []
  products:
    text: Reliable national information about legally available cannabis products was not established by the retained sources.
    sources: []
  medical:
    text: The retained sources do not establish whether a medical cannabis programme operates.
    sources: []
  consequences:
    text: >-
      The 2000 pharmacy law requires a five to twenty year residence restriction for
      facilitating narcotics use and provides confiscation and professional bans in
      specified cases. Its present application alongside the 1995 drug law remains unverified.
    sources:
      - pharmacy2000
  clubs:
    status: none
    text: >-
      The retained sources establish no authorised cannabis clubs. The 2000 pharmacy law
      punishes using narcotics together and helping others use them, including providing premises.
    sources:
      - pharmacy2000
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. British travel advice says penalties
      for drug use and possession are severe and usually include a prison sentence, and that
      conditions in local prisons are harsh.
    sources:
      - pc2017
      - fcdo
  black_market:
    text: >-
      Figures reported by the government to the UN drugs office record 400 kg of herbal
      cannabis seized in 2024, against 125 kg in 2023. The UN publishes them as kilogram
      equivalents, and countries count seizures differently, so the figures are not
      comparable across borders.
    sources:
      - unodc_szr
