name: Chad
region: Africa
iso_numeric: 148
recreational: illegal
medical: none
updated: 2026-10-13
summary: >-
  Chad's drug offences could not be sourced: the 2017 Penal Code has no cannabis article, and the
  separate drug law was not found. The scores below are unverified.
scores:
  possession: 1
  cultivation: 1
  enforcement: 1
  sharing: 1
  consumption: 1
  access: 0
segments:
  possession:
    text: >-
      Unverified. The Penal Code of 8 May 2017 (Law 2017-01) has no article on cannabis or on
      possessing, growing or using drugs. A separate drug law could not be found.
    sources:
      - pc2017
  cultivation:
    text: Unverified; see possession.
    sources:
      - pc2017
  enforcement:
    text: >-
      Unverified. The only drug-user provision found in the Penal Code is Article 38: a court may
      order a convicted drug addict into a special health house for up to two years.
    sources:
      - pc2017
  sharing:
    text: >-
      Unverified. Article 10 applies the Penal Code to drug trafficking even when committed abroad,
      but sets no penalty for it.
    sources:
      - pc2017
  consumption:
    text: Unverified; see possession.
    sources:
      - pc2017
  access:
    text: Unverified; no lawful source was found.
    sources:
      - pc2017
context:
  production:
    text: Reliable national information about lawful cannabis production was not established by the retained sources.
    sources: []
  products:
    text: Reliable national information about legally available cannabis products was not established by the retained sources.
    sources: []
  medical:
    text: The retained sources do not establish whether a medical cannabis programme operates.
    sources: []
  consequences:
    text: The retained sources do not establish collateral consequences beyond the penalties described above.
    sources: []
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited.
    sources:
      - pc2017
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. British travel advice says penalties
      for drug use and possession are severe and usually include a prison sentence, and that
      conditions in local prisons are harsh.
    sources:
      - pc2017
      - fcdo
  black_market:
    text: >-
      Figures reported by the government to the UN drugs office record 400 kg of herbal
      cannabis seized in 2024, against 125 kg in 2023. The UN publishes them as kilogram
      equivalents, and countries count seizures differently, so the figures are not
      comparable across borders.
    sources:
      - unodc_szr
