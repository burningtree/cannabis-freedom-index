summary: >-
  Since February 2026 adults 21 and over may possess up to 56 g. Four plants at a household are
  outside the growing offence, and the agriculture ministry says a grower registers with the
  Cannabis Secretariat before planting. The ministry said the rules for signing up would follow.
  There is no legal shop yet. Smoking on school premises, or in public/open areas within 100
  yards during school hours, can carry up to twenty years in prison.
