segments:
  possession:
    text: >-
      Possession is still a criminal offence under the Drug Abuse (Prevention and Control) Act, with
      fines and possible prison. In 2025 the government announced a bill to depenalise small
      quantities; an earlier 2021 draft used 28 g as the limit. Scored on the law in force, as
      passage could not be confirmed.
    sources:
      - ng1
      - ng2
  cultivation:
    text: Illegal. The 2021 draft would have let each adult householder grow up to five plants.
    sources:
      - ng2
      - jo
  enforcement:
    text: >-
      Arrests and prosecutions for small amounts continue pending reform — one of the last eastern
      Caribbean states without decriminalisation.
    sources:
      - jo
      - ng2
  sharing:
    text: Supply is trafficking.
    sources:
      - ng1
  consumption:
    text: >-
      Use is an offence. The planned reform would permit Rastafari sacramental use at places of
      worship.
    sources:
      - ng1
      - jo
  access:
    text: No legal source.
    sources:
      - jo
context:
  production:
    text: No licensed production; the bill envisages medicinal and scientific use.
    sources:
      - ng1
  products:
    text: No legal products.
    sources:
      - jo
  medical:
    text: No medical programme yet; the bill would decriminalise medicinal and therapeutic use.
    sources:
      - ng1
  consequences:
    text: Convictions carry a criminal record.
    sources:
      - jo
