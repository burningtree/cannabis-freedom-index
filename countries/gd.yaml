segments:
  possession:
    text: >-
      Parliament passed the Drug Abuse (Prevention and Control) (Amendment) Act in January 2026 with
      support from both sides, and the Governor-General assented to it in
      February.[@vino](/history/grenada-decriminalisation-2026/) Adults aged 21
      and over may possess up to 56 g of cannabis and 15 g of resin.[@act] Larger amounts remain an
      offence.
    sources:
      - vino
      - act
    penalties:
      - treatment: legal
        term: Adult possession (21+)
        upto: 56 g
        note: Cannabis; 15 g resin limit alongside
      - label: Over the limits
        treatment: criminal
        term: Ordinary possession offence
        note: Larger amounts remain an offence; figures not stated in the retained sources
  cultivation:
    text: >-
      Four or fewer plants at a household are outside the growing offence, and each household on a
      property counts separately.[@act] The agriculture ministry says a grower registers with the
      Cannabis Secretariat and the ministry before planting, and that the secretariat would publish
      the rules for signing up.[@moa] In parliament the government called this registered household
      cultivation of four plants.[@hor] The Cannabis Commission told people to ignore private groups
      that charge a fee to sign growers up.[@advisory] Rastafari places of worship have their own
      growing allowance.[@vino]
    sources:
      - act
      - moa
      - advisory
      - hor
      - vino
    penalties:
      - treatment: legal
        term: Registered household growing
        upto: 4 plants
        note: Per household, registered with the Cannabis Secretariat before planting; each household on a property counts separately
      - label: Sacramental growing
        treatment: legal
        term: Rastafari worship allowance
        note: Places of worship have their own growing allowance
  enforcement:
    text: >-
      Personal possession within the adult limits is exempt, and pending minor-quantity cases are
      discontinued.[@act,ng3] Location-based use offences remain: the school-area offence carries
      maximum imprisonment of seven years on summary conviction or twenty years on indictment.[@act]
    sources:
      - act
      - ng3
  sharing:
    text: >-
      The 2026 Act covers personal possession and growing; supplying others remains an offence,
      apart from sacramental use within registered Rastafari places of worship.
    sources:
      - vino
  consumption:
    text: >-
      Private use is lawful. Smoking or using cannabis in public places, workplaces or public
      conveyances, or within five metres of their entrances, exits, windows or ventilation intakes,
      can be dealt with through an optional EC$300 notice; ordinary summary conviction carries an
      EC$5,000 fine. A separate offence on school premises, or in public/open areas within 100 yards
      during school operating hours, carries up to seven years and/or EC$250,000 summarily, or twenty
      years and/or EC$500,000 on indictment. Private dwellings not operated as schools or licensed
      childcare facilities are excepted. Declared Rastafari events have separate exemptions.[@act]
    sources:
      - act
    currency: XCD
    penalties:
      - label: Public smoking (ticket)
        treatment: civil
        term: EC$300 optional notice
        fine: 300
        note: Optional notice instead of prosecution
      - label: Public smoking (court)
        treatment: criminal
        term: EC$5,000 summary fine
        fine: 5000
        note: Ordinary summary conviction
      - label: School-area smoking
        treatment: criminal
        term: Up to 20 years and/or EC$500,000
        prison: 20 years
        fine: 500000
        note: Summary 7 years and/or EC$250,000; indictment 20 years and/or EC$500,000; dwellings excepted
  access:
    text: >-
      No legal source besides home growing, and no legal products on sale. The government describes
      this as phase one; a regulatory framework for commercial cultivation and sale is being drafted
      as phase two. An earlier 2021 bill — 28 g, five plants, worship use — lapsed when Parliament
      was dissolved before the June 2022
      election.(/history/grenada-bill-2021/)
    sources:
      - vino
      - ng3
context:
  recreational:
    text: >-
      Since February 2026 adults aged 21 and over may possess up to 56 g of cannabis and 15 g of
      resin, and each household may grow four plants after registering with the Cannabis
      Secretariat.[@vino,act,moa](/history/grenada-decriminalisation-2026/) Rastafari places of
      worship have their own growing allowance,
      but there are no shops and supply stays criminal.[@vino,wiki] Smoking near schools can
      bring up to twenty years.[@act]
    sources:
      - vino
      - act
      - moa
      - wiki
  production:
    status: none
    text: >-
      No licensed production yet; a national cannabis policy and supporting legislation for a
      commercial sector are in preparation.
    sources:
      - vino
  medical:
    text: No medical programme yet; it is expected as part of the second phase.
    sources:
      - ng3
  consequences:
    text: >-
      Specified minor cannabis convictions qualify for amnesty and automatic expungement. Ordinary
      public-use convictions under section 13B do not form part of the criminal record; the separate
      school-area offence can bring up to seven years summarily or twenty years on indictment.
      Those are statutory maxima, not mandatory sentences.[@act]
    sources:
      - act
  planting:
    seeds: grey
    seeds_trade: unclear
    clones: grey
    clones_trade: unclear
    text: >-
      The 2026 amendment defines cannabis as any plant of the genus, growing or not, and
      exempts four or fewer plants found on a household's premises from the cultivation and
      possession offences. It says nothing about seeds or about where plants may be obtained.
      The agriculture ministry says a grower registers with the Cannabis Secretariat before planting,
      and that the secretariat would publish the rules for signing up.
    sources:
      - act
      - moa
  visitors:
    status: none
    text: >-
      Adults aged 21 or over may possess up to 56 g, but sale remains illegal and visitors have no
      legal shop. Household growers register before planting.[@act,moa] Ordinary public-use cases
      may receive an optional EC$300 notice or an EC$5,000 court fine. Smoking on school premises,
      or in public/open areas within 100 yards during school hours, is a separate offence carrying
      up to seven years summarily or twenty years on indictment, with substantial fines possible.
      Private dwellings not used as schools or licensed childcare facilities are excepted.[@act]
    sources:
      - act
      - moa
  black_market:
    text: >-
      With no legal sales, the market is supplied illegally, much of it with compressed
      cannabis brought in from outside. In April 2024 the police commissioner said the drug
      squad had seized about 1,000 pounds of compressed marijuana in two weeks in three
      operations: 510 pounds in one vehicle, valued at more than 1.1 million East Caribbean
      dollars, more than 400 pounds in another, and 10 pounds intercepted at a courier
      service.
    sources:
      - ng24
  culture:
    text: >-
      [Ganja](/culture/language/ganja/) came with the first Indian indentured workers on 1 May
      1857, who called it ganja and prepared bhang to relax after plantation
      work.[@bigdrum,wiki](/history/grenada-indian-ganja-introduction-1857/) A century and a
      half later the plant's law turned: adults may possess it and households may grow it under
      the 2026
      Act.(/history/grenada-decriminalisation-2026/)
    sources:
      - bigdrum
      - wiki
  clubs:
    status: none
    text: >-
      The 2026 Act has no place for clubs: it allows an adult's own possession and exempts four
      plants on a household's premises, and supplying others stays an offence. The agriculture
      ministry says a grower registers before planting. The one collective setting it
      recognises is religious. A place registered as a place of Rastafarian worship is taken
      out of the definition of a public place, and adherents may not be arrested or prosecuted
      over cannabis there; the minister is to set the criteria for registration by regulation.
    sources:
      - act
      - moa
  driving:
    status: impairment
    text: >-
      Road Traffic Act section 62 prohibits drug influence that makes a motor driver,
      would-be driver or person in charge on a road unfit or unable to control the
      vehicle. Unfitness means impaired ability to drive properly. Parliament's
      published consolidation lists EC$5,000 or twelve months' imprisonment or both
      for a first conviction, and EC$10,000 or two years or both for a repeat. It
      specifies at least one year's licence disqualification on a first conviction,
      subject to special reasons, and at least five years on a second. Police may
      arrest on reasonable suspicion without a warrant. The consolidation's amendment
      list ends in 2007; later amendments and current sanctions still require a full
      check, so these are published baseline figures rather than a certified 2026
      tariff. Older summaries listing EC$2,000/3,500 do not match this official copy.
      No numerical THC limit, current roadside drug-confirmation protocol or general
      medical-use exception was established here.
    sources:
      - roadtrafficpublished
