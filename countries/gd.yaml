segments:
  possession:
    text: >-
      Parliament passed the Drug Abuse (Prevention and Control) (Amendment) Act in January 2026 with
      support from both sides, and the Governor-General assented to it in February. Adults aged 21
      and over may possess up to 56 g of cannabis and 15 g of resin. Larger amounts remain an
      offence.
    sources:
      - vino
      - act
  cultivation:
    text: >-
      Up to four plants per household for private use. Rastafari places of worship have their own
      cultivation allowance.
    sources:
      - vino
      - ng3
  enforcement:
    text: >-
      Nothing within the limits. Pending cases over minor amounts are discontinued; larger
      quantities and dealing remain criminal.
    sources:
      - vino
      - ng3
  sharing:
    text: >-
      The 2026 Act covers personal possession and growing; supplying others remains an offence,
      apart from sacramental use within registered Rastafari places of worship.
    sources:
      - vino
  consumption:
    text: >-
      Private use is lawful. Public consumption remains prohibited and is punished with a fixed
      penalty.
    sources:
      - vino
  access:
    text: >-
      No legal source besides home growing. The government describes this as phase one; a regulatory
      framework for commercial cultivation and sale is being drafted as phase two.
    sources:
      - vino
      - ng3
context:
  production:
    text: >-
      No licensed production yet; a national cannabis policy and supporting legislation for a
      commercial sector are in preparation.
    sources:
      - vino
  products:
    text: No legal products on sale.
    sources:
      - vino
  medical:
    text: No medical programme yet; it is expected as part of the second phase.
    sources:
      - ng3
  consequences:
    text: >-
      The Act provides amnesty and automatic expungement of criminal records for specified minor
      cannabis offences. The minimum age is 21, after the prime minister had first proposed 18.
    sources:
      - vino
      - ng3
  planting:
    seeds: grey
    seeds_trade: unclear
    clones: grey
    clones_trade: unclear
    text: >-
      The 2026 amendment defines cannabis as any plant of the genus, growing or not, and
      exempts four or fewer plants found on a household's premises from the cultivation and
      possession offences. It says nothing about seeds or about where plants may be obtained.
    sources:
      - act
  visitors:
    status: none
    text: >-
      The 2026 Act draws no line between residents and visitors: it speaks of any person aged
      21 or over. But it creates no legal source, since sale remains an offence and the only
      lawful supply is four plants at a household, so a visitor has nowhere to buy. Smoking or
      using cannabis in a public place brings a fixed penalty of 300 dollars, and public
      transport operating for hire is treated as a public place.
    sources:
      - act
  black_market:
    text: >-
      With no legal sales, the market is supplied illegally, much of it with compressed
      cannabis brought in from outside. In April 2024 the police commissioner said the drug
      squad had seized about 1,000 pounds of compressed marijuana in two weeks in three
      operations: 510 pounds in one vehicle, valued at more than 1.1 million East Caribbean
      dollars, more than 400 pounds in another, and 10 pounds intercepted at a courier
      service.
    sources:
      - ng24
  clubs:
    status: none
    text: >-
      The 2026 Act has no place for clubs: it allows an adult's own possession and four plants
      per household, and supplying others stays an offence. The one collective setting it
      recognises is religious. A place registered as a place of Rastafarian worship is taken
      out of the definition of a public place, and adherents may not be arrested or prosecuted
      over cannabis there; the minister is to set the criteria for registration by regulation.
    sources:
      - act
