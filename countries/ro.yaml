name: Romania
region: Europe
iso_numeric: 642
recreational: illegal
medical: limited
updated: 2026-10-23
summary: >-
  Possession for personal use carries prison of three months to two years or a fine. Medical access
  is largely theoretical.
scores:
  possession: 1
  cultivation: 1
  enforcement: 2
  sharing: 1
  consumption: 1
  access: 0
segments:
  possession:
    text: >-
      Under Law 143/2000, possessing a 'risk drug' such as cannabis for personal use is a crime
      punished with three months to two years in prison or a fine. Since the 2014 criminal code,
      users can often end up with a fine or community service. A wrinkle: cannabis plant and resin
      are 'risk drugs', but THC as a compound is listed as 'high-risk', which can raise the penalty.
    sources:
      - dr
      - lc
  cultivation:
    text: Growing for personal use falls under the same three-months-to-two-years provision.
    sources:
      - lc
      - dr
  enforcement:
    text: >-
      Fines and suspended sentences are common for users; prison remains available and is used for
      repeat cases.
    sources:
      - dr
      - lc
  sharing:
    text: Supply is trafficking, with two to seven years for risk drugs.
    sources:
      - lc
  consumption:
    text: Use is not separately punished, but possession for use is.
    sources:
      - dr
  access:
    text: None.
    sources:
      - pp
context:
  production:
    text: >-
      Cultivation, import and sale of cannabis for medical use are allowed under Law 339/2005
      with strict government authorisation and supervision.[@cms]
    sources:
      - cms
  products:
    text: CBD products with negligible THC.
    sources:
      - cms
  medical:
    text: >-
      Cannabis may be prescribed for medical use only as a pharmaceutical product.[@cms] The
      controlled-substances law requires a prescription and permits patients to hold the
      prescribed quantity of their controlled medicine.[@medical339]
    sources:
      - cms
      - medical339
  consequences:
    text: A conviction is a criminal record.
    sources:
      - lc
  driving:
    status: capacity
    text: >-
      Driving a vehicle that needs a licence, while under the influence of a psychoactive
      substance, carries one to five years in prison and a ban on exercising rights. Public
      passenger transport, dangerous goods, a driving lesson or a driving test raises that to
      two to seven years, again with a ban on exercising rights. Law 172 of 31 May 2024 set
      those sentences. Since 28 January 2025 a binding ruling of the High Court of Cassation
      and Justice has required two things: the substance in a biological sample, and proof
      that it was capable of affecting the ability to drive. The ruling sets no THC number.
      Proof that the driver made a mistake on the road is outside what the prosecution must
      show.
    sources:
      - iccj25
      - cp336
  clubs:
    status: underground
    text: >-
      Clubs exist without any legal basis. A Europe-wide survey of cannabis social clubs carried out
      in 2018 and 2019 received answers from one club in Romania, and its authors could not say how
      many more were active. The study notes that clubs sit in a legally sensitive position and that
      many have been dissolved after court decisions or police raids. No law in Romania provides for
      them; Malta (since 2021) and Germany (since 2024) license non-profit cannabis associations,
      but only under their own laws. Nothing more recent was found.
    sources:
      - pardal20
      - de_cang
      - mt_cap628
  planting:
    seeds: grey
    seeds_trade: open
    clones: illegal
    clones_trade: banned
    text: >-
      Seeds fall outside the criminal law because they contain no THC: Law 143/2000 punishes
      growing, using and trafficking the plant, not trading its seed. Many online shops sell
      them openly with cash on delivery, some as souvenirs or collectors' items and some with
      descriptions of the effects, from about 14 lei a seed. The line is germination: an
      antidrug official put it that the moment the plant sprouts you are holding an illegal
      drug, and growing for personal use is an offence under Article 4. Growing without
      authorisation under the 2005 law on plants and substances with narcotic content is
      likewise illegal, so cuttings and seedlings are covered.
    sources:
      - adv17
      - cdep
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. Under Law 143/2000, possessing cannabis
      for personal use is a crime punished with three months to two years in prison or a fine.
    sources:
      - dr
      - lc
  black_market:
    text: >-
      The EU drugs agency's statistical bulletin records 861 kg of herbal cannabis and 43
      kg of cannabis resin seized in Romania in 2024, against 940 kg and 43 kg in 2023.
      Herbal cannabis was seized on 3,529 occasions and resin on 285. Countries record
      seizures differently, so the figures are not comparable across borders.
    sources:
      - euda_szr
