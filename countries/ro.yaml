name: Romania
region: Europe
iso_numeric: 642
recreational: illegal
medical: limited
updated: '2026-10-28'
summary: >-
  Possession for personal use carries prison of three months to two years or a fine. Medical
  access is largely theoretical.
scores:
  possession: 1
  cultivation: 1
  enforcement: 2
  sharing: 1
  consumption: 1
  access: 0
segments:
  possession:
    text: >-
      Cannabis plant or resin held for personal use falls under the risk-drug offence, carrying
      three months to two years in prison or a fine.[@law143] The provision specifies no gram
      threshold.[@law143] Personal-use offences involving substances classified as high-risk
      carry six months to three years.[@law143]
    sources:
      - law143
    penalties:
      - label: Personal-use possession of a risk drug
        treatment: criminal
        term: Possession
        prison_min: 3 months
        prison: 2 years
        note: Prison or a fine; Article 4(1)
      - label: Personal possession of a preparation classified as high-risk
        treatment: criminal
        term: Personal-use possession
        prison_min: 6 months
        prison: 3 years
        note: Article 4(2); classification depends on the scheduled substance
  cultivation:
    text: >-
      Unauthorised growing of risk-drug cannabis for personal consumption carries three months
      to two years or a fine.[@law143] Growing for supply instead falls under the
      three-to-ten-year trafficking offence.[@law143] Agricultural hemp requires county
      authorisation and approved seed, with the agricultural 0.3% checks applied under the
      support rules.[@hemp125]
    sources:
      - law143
      - hemp125
    penalties:
      - label: Unauthorised growing for personal use
        treatment: criminal
        term: Cultivation
        prison_min: 3 months
        prison: 2 years
        note: Prison or a fine; personal consumption only
      - label: Unauthorised growing for supply
        treatment: criminal
        term: Trafficking
        prison_min: 3 years
        prison: 10 years
        note: Risk-drug cannabis; Article 2(1)
      - label: Licensed fibre hemp
        treatment: legal
        term: Hemp
        note: County authorisation, approved EU seed, 0.3% THC checks
  enforcement:
    text: >-
      Personal-use possession remains criminal, with a fine available as an alternative for risk
      drugs.[@law143] A court may waive or defer punishment for an eligible person complying
      with the integrated assistance programme.[@law143] DIICOT’s 2025 drug chapter records
      3,397 defendants sent to trial, including 1,472 in pre-trial detention; those totals cover
      all drugs.[@diicot2025]
    sources:
      - law143
      - diicot2025
  sharing:
    text: >-
      Supplying risk-drug cannabis plant or resin carries three to ten years and
      disqualification of certain rights after the [2023
      amendment](/history/romania-trafficking-sentences-raised-2023/).[@trafficking2023]
      Unauthorised import or export carries five to fifteen years; the corresponding high-risk
      ranges are five to fifteen for supply and ten to twenty for import or export.[@law143]
      Providing publicly accessible premises for drug use carries two to seven years, and
      specified drug offences causing death carry fifteen to twenty-five years.[@law143]
    sources:
      - trafficking2023
      - law143
    penalties:
      - label: Supply of risk-drug cannabis
        treatment: criminal
        term: Trafficking
        prison_min: 3 years
        prison: 10 years
        note: Article 2(1); disqualification of certain rights
      - label: Import/export of risk drugs
        treatment: criminal
        term: Trafficking
        prison_min: 5 years
        prison: 15 years
        note: Article 3(1); disqualification of certain rights
      - label: Supply involving a high-risk preparation
        treatment: criminal
        term: Trafficking
        prison_min: 5 years
        prison: 15 years
        note: Article 2(2); disqualification of certain rights
      - label: Import/export involving a high-risk preparation
        treatment: criminal
        term: Trafficking
        prison_min: 10 years
        prison: 20 years
        note: Article 3(2); disqualification of certain rights
      - label: Providing publicly accessible premises for use
        treatment: criminal
        term: Facilitating use
        prison_min: 2 years
        prison: 7 years
        note: Article 5; disqualification of certain rights
      - label: Specified drug offences causing death
        treatment: criminal
        term: Aggravated drug offence
        prison_min: 15 years
        prison: 25 years
        note: >-
          Article 11; specified offences, including Article 2 supply; disqualification of
          certain rights
  consumption:
    text: Use is not separately punished, but possession for use is.[@dr]
    sources:
      - dr
  access:
    text: >-
      There is no authorised recreational retail route under the drug-control law.[@law143]
      Medical prescribing is restricted to pharmaceutical preparations under the
      controlled-medicines framework.[@medical339]
    sources:
      - law143
      - medical339
words:
  - word: Cânepă
    lang: Romanian
    meaning: the standard word; kin to hemp and hanf
    atlas: cannabis
    sources:
      - cannabiset
  - word: Iarbă
    lang: Romanian
    meaning: literally grass; slang for cannabis and marijuana
    sources:
      - dex-iarba
  - word: Marijuana
    lang: Romanian
    meaning: dried Indian-hemp leaves and flowers as a narcotic (DEX)
    sources:
      - dex-marijuana
  - word: Hașiș
    lang: Romanian
    meaning: hashish; dictionary term
    sources:
      - dex-hasis
context:
  recreational:
    text: >-
      Personal-use cannabis possession and growing carry three months to two years or a fine,
      without a statutory gram exemption.[@law143] Giving or selling cannabis to others falls
      under the separate supply offence, carrying three to ten years for risk drugs.[@law143]
      Treatment-programme compliance can permit waiver or deferral of punishment for
      personal-use offences.[@law143]
    sources:
      - law143
  production:
    status: medical
    text: >-
      Cultivation for technical, medical or scientific processing requires authorisation through
      the county agricultural directorates, within annual estimates.[@medical339] Manufacturing
      and handling controlled substances require separate authorisations and checks of premises,
      personnel and technical means.[@medical339] Health authorities approve annual quantities
      for authorised operators.[@medical339]
    sources:
      - medical339
  hemp:
    status: standard
    text: >-
      Licensed fibre-hemp farming is lawful: agricultural rules require county cultivation
      authorisation and approved EU-catalogue seed, with a 0.3% THC standard.[@hemp125,hemp2025]
      Growers must preserve the crop after flowering for THC sampling and provide cultivation
      and delivery records for support.[@hemp125]
    sources:
      - hemp125
      - hemp2025
  medical:
    text: >-
      The controlled-medicines law permits prescribing Table II and III substances only as
      pharmaceutical preparations manufactured industrially or in a pharmacy.[@medical339]
      Patients may possess the prescribed quantity on the basis of their
      prescription.[@medical339] The [February 2026 cabinet
      proposal](/history/romania-controlled-preparations-proposal-2026/) sought to clarify
      preparations and pharmacists’ responsibilities.[@proposal2026]
    sources:
      - medical339
      - proposal2026
  consequences:
    text: >-
      Drugs and items connected with the specified offences are subject to confiscation under
      Article 16.[@law143] Under Articles 19–20, complying with an integrated assistance
      programme can allow a court to waive or defer punishment for personal-use
      offences.[@law143] Failure to follow the programme during supervision can trigger the
      Penal Code’s revocation provisions.[@law143]
    sources:
      - law143
  culture:
    text: >-
      Romanian has its own form of the ancient word: cânepă, kin to hemp and hanf, traced in the
      atlas entry [cannabis](/culture/language/cannabis/).[@cannabiset] The word outlived the
      craft. In traditional households every family grew hemp and flax, working the fibres into
      clothing, bedding, floor-coverings, ropes and bags.[@mntr] In recent decades that
      home-made tradition has come close to extinction — under harsh legislation against hemp
      grown for narcotic extract, and as villages emptied and aged.[@mntr] [The 2000
      drug-control law modernised the bans.](/history/romania-drug-control-law-2000/)
    sources:
      - cannabiset
      - mntr
  driving:
    status: capacity
    text: >-
      Driving a vehicle that needs a licence, while under the influence of a psychoactive
      substance, carries one to five years in prison and a ban on exercising rights.[@cp336]
      Public passenger transport, dangerous goods, a driving lesson or a driving test raises
      that to two to seven years, again with a ban on exercising rights.[@cp336] Law 172 of 31
      May 2024 set those sentences.[@cp336] Since 28 January 2025 a binding ruling of the High
      Court of Cassation and Justice has required two things: the substance in a biological
      sample, and proof that it was capable of affecting the ability to drive.[@iccj25] The
      ruling sets no THC number. Proof that the driver made a mistake on the road is outside
      what the prosecution must show.[@iccj25] [Romania's top court raised the bar in
      2025.](/history/romania-drug-driving-capacity-2025/)
    sources:
      - iccj25
      - cp336
  clubs:
    status: underground
    text: >-
      Clubs exist without any legal basis. A Europe-wide survey of cannabis social clubs carried
      out in 2018 and 2019 received answers from one club in Romania, and its authors could not
      say how many more were active.[@pardal20] The study notes that clubs sit in a legally
      sensitive position and that many have been dissolved after court decisions or police
      raids. No law in Romania provides for them; Malta (since 2021) and Germany (since 2024)
      license non-profit cannabis associations, but only under their own
      laws.[@de_cang,mt_cap628] Nothing more recent was found.[@pardal20]
    sources:
      - pardal20
      - de_cang
      - mt_cap628
  planting:
    seeds: grey
    seeds_trade: regulated
    clones: illegal
    clones_trade: banned
    text: >-
      The controlled-medicines law excludes separated seeds from its definition of cannabis,
      while cultivation remains subject to authorisation.[@medical339] Suppliers of cannabis
      seed for cultivation must deliver it to holders of growing authorisations, and authorised
      growers must use registered varieties.[@medical339] County authorisation and the
      agricultural hemp rules govern lawful fibre crops.[@hemp125]
    sources:
      - medical339
      - hemp125
  visitors:
    status: none
    text: >-
      Unauthorised personal possession is criminal, carrying three months to two years or a fine
      for risk-drug cannabis.[@law143] Unauthorised import or export carries the separate
      five-to-fifteen-year range.[@law143] The controlled-medicines framework separately
      recognises possession of prescribed pharmaceutical quantities under its
      conditions.[@medical339]
    sources:
      - law143
      - medical339
  arrests:
    text: >-
      DIICOT’s [2025 report](/history/romania-diicot-drug-results-2025/) records 3,397
      defendants sent to trial for drug offences, including 1,472 in pre-trial
      detention.[@diicot2025] These are all-drug prosecution figures.[@diicot2025] Its cannabis
      seizures are recorded separately from the defendant counts.[@diicot2025]
    sources:
      - diicot2025
  black_market:
    text: >-
      DIICOT’s 2025 report records 1,969.9 kg of cannabis seized.[@diicot2025] It separately
      lists 2,258 cannabis crops/plants and 881.02 kg of green plant material, equivalent to
      264.31 kg dry material.[@diicot2025] The report describes supply from Western Europe,
      including apparently ordinary international parcels.[@diicot2025]
    sources:
      - diicot2025
