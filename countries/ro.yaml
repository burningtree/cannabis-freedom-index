segments:
  possession:
    text: >-
      Under Law 143/2000, possessing a 'risk drug' such as cannabis for personal use is a crime
      punished with three months to two years in prison or a fine. Since the 2014 criminal code,
      users can often end up with a fine or community service. A wrinkle: cannabis plant and resin
      are 'risk drugs', but THC as a compound is listed as 'high-risk', which can raise the penalty.
    sources:
      - dr
      - lc
  cultivation:
    text: Growing for personal use falls under the same three-months-to-two-years provision.
    sources:
      - lc
      - dr
  enforcement:
    text: >-
      Fines and suspended sentences are common for users; prison remains available and is used for
      repeat cases.
    sources:
      - dr
      - lc
  sharing:
    text: Supply is trafficking, with two to seven years for risk drugs.
    sources:
      - lc
  consumption:
    text: Use is not separately punished, but possession for use is.
    sources:
      - dr
  access:
    text: None.
    sources:
      - pp
context:
  production:
    text: >-
      A 2013 law theoretically allows licensed cultivation and manufacture for medical use, but no
      licence has ever been granted.
    sources:
      - pp
      - cms
  products:
    text: CBD products with negligible THC.
    sources:
      - cms
  medical:
    text: >-
      One of Europe's most restrictive: cannabis-derived medicines with up to 0.2% THC were
      authorised on paper in 2013, but there are no approved products, no producers and no
      prescriptions.
    sources:
      - pp
  consequences:
    text: A conviction is a criminal record.
    sources:
      - lc
  driving:
    status: zero
    text: >-
      No THC limit is set: under the criminal code the offence is committed if a controlled
      substance is detected. Police may stop and test at random, with a roadside oral-fluid
      test and blood taken at a hospital. The penalty is one to five years in prison, also for
      refusing to give a sample, or two to seven years if aggravated; the licence is suspended
      for 90 days and can be cancelled on a sentence of detention.
    sources:
      - euda_dd
  clubs:
    status: underground
    text: >-
      Clubs exist without any legal basis. A Europe-wide survey of cannabis social clubs
      carried out in 2018 and 2019 received answers from one club in Romania, and its authors
      could not say how many more were active. The study notes that the model is prohibited
      throughout the European Union, that clubs sit in a legally sensitive position, and that
      many have been dissolved after court decisions or police raids. Nothing more recent was
      found.
    sources:
      - pardal20
  planting:
    seeds: grey
    seeds_trade: open
    clones: illegal
    clones_trade: banned
    text: >-
      Seeds fall outside the criminal law because they contain no THC: Law 143/2000 punishes
      growing, using and trafficking the plant, not trading its seed. Many online shops sell
      them openly with cash on delivery, some as souvenirs or collectors' items and some with
      descriptions of the effects, from about 14 lei a seed. The line is germination: an
      antidrug official put it that the moment the plant sprouts you are holding an illegal
      drug, and growing for personal use is an offence under Article 4. Growing without
      authorisation under the 2005 law on plants and substances with narcotic content is
      likewise illegal, so cuttings and seedlings are covered.
    sources:
      - adv17
      - cdep
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. British travel advice says illegal
      drugs, including cannabis, carry severe penalties and tells travellers to expect a long
      jail sentence and heavy fines for possessing, using or smuggling them, also when only
      changing planes. It adds that increasing numbers of people, including foreign visitors,
      have been arrested and given lengthy sentences for drug offences at music festivals in
      Romania.
    sources:
      - pp
      - fcdo
