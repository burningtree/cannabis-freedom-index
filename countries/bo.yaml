name: Bolivia
region: South America
iso_numeric: 68
recreational: illegal
medical: none
updated: "2026-10-22"
summary: >-
  Recreational cannabis remains prohibited. A medically assessed personal-use quantity leads to
  compulsory treatment; possession above it falls under trafficking, with ten to twenty-five years
  in prison plus a fine. An individual compassionate medical import was reported in 2021, and a
  wider medical-access bill is pending in 2026.
scores:
  possession: 1
  cultivation: 1
  enforcement: 1
  sharing: 1
  consumption: 1
  access: 0
segments:
  possession:
    text: >-
      The drug law sends dependent and occasional users found with a minimal immediate personal-use
      quantity to compulsory treatment until considered rehabilitated. Two medical experts assess an
      amount equivalent to 48 hours of consumption. Above that amount, possession falls under
      trafficking, carrying ten to twenty-five years in prison plus a fine. The rules give no fixed
      cannabis gram allowance.
    sources:
      - l1008
      - reg22099
  cultivation:
    text: >-
      Unlawfully sowing, planting, harvesting, growing or collecting controlled plants or their
      parts carries one to two years in prison, rising to two to four for repeat offending. The
      anti-narcotics police reported about 139 tonnes of marijuana seized in plantations or ready
      for sale in the first seven months of 2024.
    sources:
      - l1008
      - lt24
  enforcement:
    text: >-
      Possession above the individually assessed personal-use amount is presumed to be trafficking.
      Two medical experts determine that amount, leaving the distinction between personal possession
      and trafficking dependent on their assessment.
    sources:
      - l1008
      - reg22099
  sharing:
    text: >-
      Unlawfully supplying controlled substances to another person carries eight to twelve years in
      prison plus a fine, regardless of quantity. The separate trafficking offence carries ten to
      twenty-five years plus a fine and has a broad definition covering acts including delivery,
      supply and donation.
    sources:
      - l1008
  consumption:
    text: >-
      Consumption of listed controlled substances is prohibited. Dependent and occasional users
      found with a minimal quantity for immediate personal use are subject to compulsory admission
      to a public or private drug-treatment institution until considered rehabilitated.
    sources:
      - l1008
  access:
    text: >-
      Recreational supply remains prohibited under the controlled-substances law. The 2026 bill
      proposing registered medical patients and licensed pharmacy supply remains listed as pending.
    sources:
      - l1008
      - medicalbill
      - pendingbill
context:
  production:
    text: >-
      The 2017 law requires registration and prior health-ministry permission for production of
      medicinal controlled substances. Unauthorised cannabis growing remains punishable under the
      1988 law. The pending 2026 medical bill proposes specific grower and manufacturer licences.
    sources:
      - law913
      - l1008
      - medicalbill
  products:
    text: >-
      Cannabis and cannabis resin are listed controlled substances. The 2017 law regulates
      authorised manufacture and prescription supply of medicines containing controlled substances.
      In 2021 the ombudsman reported a compassionate cannabis-import approval exclusively for one
      child under medical supervision.
    sources:
      - law913
      - compassionate
  medical:
    text: >-
      The ombudsman reported an individual compassionate cannabis-import approval in November 2021
      after helping a family clarify medicines-agency requirements. The 2017 law requires
      health-ministry permissions for medicinal controlled substances and provides limited
      scientific and medical research authorisations. A 2026 bill would create a patient register
      and prescribed cannabis supply through authorised pharmacies; parliament still listed it as
      pending in October.
    sources:
      - compassionate
      - law913
      - medicalbill
      - pendingbill
  consequences:
    text: >-
      A person classified as holding cannabis for immediate personal use faces compulsory treatment
      until considered rehabilitated. Possession above the medically assessed quantity falls under a
      trafficking offence carrying ten to twenty-five years in prison plus a fine.
    sources:
      - l1008
      - reg22099
  planting:
    seeds: illegal
    seeds_trade: banned
    clones: illegal
    clones_trade: banned
    text: >-
      The 1988 law prohibits production or keeping of controlled plants and their seeds. Unlawful
      sowing, planting, harvesting, growing or collecting controlled plants or their parts carries
      one to two years in prison, rising to two to four for repeat offending. The 2017 law
      separately requires prior authorisation for production of medicinal controlled substances.
    sources:
      - l1008
      - law913
  clubs:
    status: none
    text: >-
      Recreational collective growing and supply remain subject to the offences against unlawful
      cultivation and supply. The 2026 medical bill proposes licensed production and pharmacy
      dispensing.
    sources:
      - l1008
      - medicalbill
  visitors:
    status: none
    text: >-
      Recreational supply is prohibited. The personal-possession rule sends users with the medically
      assessed immediate-use quantity to compulsory treatment and treats amounts above it as
      trafficking. The law also subjects foreigners without permanent residence to residence
      legislation and an additional fine in personal-use cases.
    sources:
      - l1008
      - reg22099
  driving:
    status: impairment
    text: >-
      Traffic Code article 97 prohibits driving under the effects of drugs or other
      intoxicants, as well as when physical or mental health prevents normal and safe
      driving. The licensing authority's published code confirms this drug-influence
      rule; it does not set a numerical THC concentration. The police-hosted code and
      regulations distinguish drug-caused intoxication from alcohol provisions and
      include licence consequences in the older first-degree offence schedule. That
      publication also contains later public-transport rules, but its historical
      monetary amounts and alcohol-specific sanctions have not been verified as a
      current cannabis-driving tariff. Exact fines, current suspension periods and
      toxicological testing procedures therefore remain unresolved here. No waiting
      time after cannabis use or general medical exception is inferred from those
      source gaps.
    sources:
      - trafficcode
      - trafficregulations
  black_market:
    text: >-
      Marijuana is seized in far larger volumes than cocaine. The government reported in
      December 2024 that the anti-narcotics force had seized about 1,269 tonnes of
      marijuana and 139 tonnes of cocaine since November 2020, and that 13,359 people had
      been arrested for drug trafficking in that time.
    sources:
      - eju24
  arrests:
    text: >-
      The anti-narcotics police force FELCN reported 1,877 people arrested in 5,670
      operations between January and July 2024, when it seized about 139 tonnes of
      marijuana, counted both in plantations and ready for sale, and about 30 tonnes of
      cocaine. Over the 1,500 days from November 2020 to December 2024 the government
      counted 13,359 people arrested for drug trafficking and 1,269 tonnes of marijuana
      seized. The arrests are not split by drug.
    sources:
      - lt24
      - eju24
