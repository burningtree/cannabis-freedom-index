segments:
  possession:
    text: >-
      Law 1008 of 1988 treats cannabis like cocaine. Possession for personal use is not punished
      with prison but with compulsory internment for treatment, and only if two specialists confirm
      the amount is for immediate personal use. Anything more is charged as trafficking, with 10 to
      25 years.
    sources:
      - tni
      - wiki
  cultivation:
    text: Cultivation is a crime.
    sources:
      - wiki
  enforcement:
    text: >-
      Because the personal-use exception is narrow and discretionary, users are frequently charged
      as traffickers and held in pre-trial detention.
    sources:
      - tni
  sharing:
    text: Supply is trafficking, 10 to 25 years.
    sources:
      - wiki
      - tni
  consumption:
    text: Use is prohibited and leads to forced treatment.
    sources:
      - tni
  access:
    text: No legal source.
    sources:
      - wiki
context:
  production:
    text: No licensed production.
    sources:
      - wiki
  products:
    text: No legal products.
    sources:
      - wiki
  medical:
    text: >-
      Law 913 of 2017 contemplates medical and scientific use of controlled substances, but
      implementing rules were never issued; a few patients have won individual authorisations.
    sources:
      - lt
  consequences:
    text: Forced treatment and long pre-trial detention are the main risks for users.
    sources:
      - tni
  planting:
    seeds: illegal
    seeds_trade: banned
    clones: illegal
    clones_trade: banned
    text: >-
      Law 1008 prohibits "the production or conservation of plants and seeds" that contain
      controlled substances (Article 34), counts holding the seeds of such plants as
      possession, and defines production to include sowing, planting and collecting seeds.
      Article 46 punishes illegally sowing, planting or growing controlled plants with one to
      two years in prison, and two to four for a repeat offence.
    sources:
      - l1008
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited.
    sources:
      - wiki
      - tni
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. Under Law 1008 of 1988 possession for
      personal use is punished not with prison but with compulsory internment for treatment, and
      only if two specialists confirm the amount is for immediate personal use; anything more is
      charged as trafficking.
    sources:
      - tni
      - wiki
  driving:
    status: impairment
    text: >-
      Traffic Code article 97 prohibits driving under the effects of drugs or other
      intoxicants, as well as when physical or mental health prevents normal and safe
      driving. The licensing authority's published code confirms this drug-influence
      rule; it does not set a numerical THC concentration. The police-hosted code and
      regulations distinguish drug-caused intoxication from alcohol provisions and
      include licence consequences in the older first-degree offence schedule. That
      publication also contains later public-transport rules, but its historical
      monetary amounts and alcohol-specific sanctions have not been verified as a
      current cannabis-driving tariff. Exact fines, current suspension periods and
      toxicological testing procedures therefore remain unresolved here. No waiting
      time after cannabis use or general medical exception is inferred from those
      source gaps.
    sources:
      - trafficcode
      - trafficregulations
  black_market:
    text: >-
      Marijuana is seized in far larger volumes than cocaine. The government reported in
      December 2024 that the anti-narcotics force had seized about 1,269 tonnes of
      marijuana and 139 tonnes of cocaine since November 2020, and that 13,359 people had
      been arrested for drug trafficking in that time.
    sources:
      - eju24
