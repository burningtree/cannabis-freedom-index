segments:
  possession:
    text: >-
      Law 1008 of 1988 treats cannabis like cocaine. Possession for personal use is not punished
      with prison but with compulsory internment for treatment, and only if two specialists confirm
      the amount is for immediate personal use. Anything more is charged as trafficking, with 10 to
      25 years.
    sources:
      - tni
      - wiki
  cultivation:
    text: Cultivation is a crime.
    sources:
      - wiki
  enforcement:
    text: >-
      Because the personal-use exception is narrow and discretionary, users are frequently charged
      as traffickers and held in pre-trial detention.
    sources:
      - tni
  sharing:
    text: Supply is trafficking, 10 to 25 years.
    sources:
      - wiki
      - tni
  consumption:
    text: Use is prohibited and leads to forced treatment.
    sources:
      - tni
  access:
    text: No legal source.
    sources:
      - wiki
context:
  production:
    text: No licensed production.
    sources:
      - wiki
  products:
    text: No legal products.
    sources:
      - wiki
  medical:
    text: >-
      Law 913 of 2017 contemplates medical and scientific use of controlled substances, but
      implementing rules were never issued; a few patients have won individual authorisations.
    sources:
      - lt
  consequences:
    text: Forced treatment and long pre-trial detention are the main risks for users.
    sources:
      - tni
  planting:
    seeds: illegal
    seeds_trade: banned
    clones: illegal
    clones_trade: banned
    text: >-
      Law 1008 prohibits "the production or conservation of plants and seeds" that contain
      controlled substances (Article 34), counts holding the seeds of such plants as
      possession, and defines production to include sowing, planting and collecting seeds.
      Article 46 punishes illegally sowing, planting or growing controlled plants with one to
      two years in prison, and two to four for a repeat offence.
    sources:
      - l1008
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited.
    sources:
      - wiki
      - tni
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. British travel advice says there are
      harsh penalties for possession and trafficking, with a minimum sentence of 8 years, and
      that under Bolivian law carrying any amount of illegal drugs is treated as trafficking.
      Narcotics police search the bags and person of every passenger leaving on an
      international flight, with a sniffer dog.
    sources:
      - wiki
      - fcdo
