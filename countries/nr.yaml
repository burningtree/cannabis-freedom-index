name: Nauru
region: Oceania
iso_numeric: 520
recreational: illegal
medical: none
words:
  - word: Indian hemp
    lang: English (Nauru)
    meaning: The 1952 ordinance's legal name covering extracts, tinctures and preparations of Indian hemp, carried into the later medicinal import-licensing approach
    sources:
      - un1952
updated: '2026-10-28'
summary: >-
  Unlawful possession carries at least a year in custody; growing, supply and use face much longer
  prison terms.
scores:
  possession: 0
  cultivation: 0
  enforcement: 0
  sharing: 0
  consumption: 0
  access: 0
segments:
  possession:
    text: >-
      Since 23 December 2024, possessing cannabis without lawful authority carries twelve months to
      three years in custody. Cannabis, its resin, oil, plants, fruit and seeds appear in the
      illicit-drug schedule.[@act]
    sources:
      - act
    currency: AUD
    penalties:
      - label: Unlawful possession, any amount
        treatment: criminal
        term: Possession
        prison_min: 12 months
        prison: 3 years
        note: Custody is mandatory; no fine option
  cultivation:
    text: >-
      Growing cannabis without lawful authority falls under the offence carrying life imprisonment
      with at least ten years to be served before parole or probation. Cultivation includes
      planting, sowing, scattering seeds, tending and harvesting.[@act]
    sources:
      - act
    currency: AUD
    penalties:
      - label: Unlawful cultivation, any amount
        treatment: criminal
        term: Cultivation
        prison_min: 10 years
        note: At least ten years without parole or probation; maximum life; no fine
  enforcement:
    text: >-
      The December 2024 amendment requires custody for possession and at least ten years before
      parole or probation for offences including use, cultivation and supply.[@act] Earlier in 2024,
      a one-gram cannabis case ended with fines, community service and probation for two
      adults.[@case] Bail is barred for people charged under the drug-control law and while
      appealing a conviction — the bar took effect on certification in October
      2022.[@bail](/history/nauru-drug-bail-ban-2022/)
    sources:
      - act
      - case
      - bail
  sharing:
    text: >-
      Supply includes giving cannabis away. Unlawful supply carries life imprisonment with at least
      ten years to be served before parole or probation; the same rule covers dealings to transfer
      or transport illicit drugs.[@act]
    sources:
      - act
  consumption:
    text: >-
      Using or administering an illicit drug without lawful authority is expressly included in the
      offence carrying life imprisonment with at least ten years to be served before parole or
      probation.[@act]
    sources:
      - act
  access:
    text: >-
      Ordinary cannabis supply is criminalised. The law separately allows possession of drugs
      prescribed for medical treatment and licensed imports for medicinal purposes, subject to
      ministerial and Cabinet controls.[@act]
    sources:
      - act
context:
  recreational:
    text: >-
      All recreational use is prohibited. Since 23 December 2024 possession carries twelve months to
      three years in custody with no fine, while cultivation, supply, use and import or export carry
      a minimum of ten years without parole or probation and a maximum of life.[@act] There are no
      quantity thresholds or personal-use exemptions, and bail is barred for drug charges.[@bail]
    sources:
      - act
      - bail
  production:
    status: none
    text: >-
      Producing or manufacturing cannabis without lawful authority carries the same
      life-imprisonment penalty and ten-year custody requirement as unlawful cultivation and
      supply.[@act]
    sources:
      - act
  hemp:
    status: none
    text: >-
      No low-THC or industrial-hemp exemption. Cannabis plant, fruit, seed, oil, resin and THC are
      Schedule 1 illicit drugs.[@act] Customs tariff lines for "true hemp" do not create a lawful
      farming or seed-import pathway, and no hemp licensing scheme was found.[@act]
    sources:
      - act
  medical:
    text: >-
      Cabinet may issue renewable one-year licences for medicinal drug imports on the minister’s
      recommendation. Licensees must record imported quantities and how and to whom they are
      provided; the law also exempts lawfully prescribed or provided drugs for treating a medical
      condition.[@act] Annual Cabinet licensing dates to the 2008 revision, continuing an approach
      that had expressly covered Indian-hemp preparations in
      1952.(/history/nauru-medicinal-import-licences-2008/)
    sources:
      - act
  consequences:
    text: >-
      The possession offence requires twelve months to three years in custody. The 2024 amendment
      also excluded the general sentencing options for fines, discharge, dismissal and other
      alternative orders from drug offences.[@act] The Bail Act also bars bail for drug charges, so
      custody can begin before conviction.[@bail]
    sources:
      - act
      - bail
  clubs:
    status: none
    text: >-
      Giving cannabis away and cultivating it without lawful authority fall under the serious drug
      offence, with at least ten years to be served before parole or probation.[@act]
    sources:
      - act
  planting:
    seeds: illegal
    seeds_trade: banned
    clones: illegal
    clones_trade: banned
    text: >-
      Cannabis seeds and plants are listed as illicit drugs. Cultivation includes planting, sowing
      and scattering seeds, as well as tending and harvesting. Supplying includes giving, so the
      ordinary prohibitions cover transferring seeds and living plants.[@act]
    sources:
      - act
  visitors:
    status: none
    text: >-
      The traveller exemption covers lawfully prescribed drugs for a medical condition, sufficient
      for no more than one month, for the traveller or someone in their care. Travellers entering or
      transiting must declare them to Customs on arrival. Failure to declare carries up to five
      years in prison or a fine of A$20,000–50,000.[@act]
    sources:
      - act
  driving:
    status: impairment
    text: >-
      Driving under the influence of a drug is an offence under Motor Traffic Act section
      69(1).[@trafficServ6] The official Service 6 consolidation retains that drug limb, and section
      114 permits arrest without warrant on reasonable cause for a drug-driving
      contravention.[@trafficServ6] Section 87 allows the court to suspend or cancel a licence and
      disqualify a convicted driver for a period it considers appropriate.[@trafficServ6] No numeric
      THC threshold is established by the reviewed traffic provisions: the prescribed concentrations
      and breath-testing regime concern alcohol.[@trafficServ6] A specific cannabis fine or prison
      ceiling remains unresolved because section 69(1) refers to section 79, while section 79(1)'s
      graduated penalties expressly identify the alcohol-specific section 69(2).[@trafficServ6]
      Those alcohol tariffs should not be presented as verified cannabis penalties.[@trafficServ6]
      Current drug toxicology and refusal procedures still need confirmation.[@trafficServ6]
    sources:
      - trafficServ6
  black_market:
    text: >-
      OCIndex 2025 scores Nauru's cannabis trade 1.5 out of 10 and reports some smuggling, primarily
      from Fiji, alongside local use and cultivation.[@ocindex25] UNODC's 2024 Pacific report says
      most Nauru drug users use cannabis and inhalants, with methamphetamine still limited.[@unodc24]
      The 2024 mutual evaluation report says drug offences are increasing but mostly possession and
      personal use, with very few cases and minimal quantities.[@mer24] No price or seizure series is
      published.[@ocindex25]
    sources:
      - ocindex25
      - unodc24
      - mer24
  arrests:
    text: >-
      Police recorded 175 crime offences in the first quarter of 2024 across categories including
      illicit drug use and possession, but published no drug-specific breakdown.[@q1_24] Two 2023–24
      cases involved 1.4 g and 1.1 g, and one gram respectively; the adults received fines,
      community service and probation.[@beadan23,case] The 2024 one-gram case relied on a police
      KN-reagent field
      test.(/history/nauru-cannabis-test-certificates-2021/) No disaggregated 2025–26 drug-arrest
      data was found.[@mer24]
    sources:
      - q1_24
      - beadan23
      - case
      - mer24
