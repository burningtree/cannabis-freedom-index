segments:
  possession:
    text: >-
      Possessing any illicit drug without lawful authority is an offence under section 6 of the
      Illicit Drugs Control Act 2004. As recently amended it carries a mandatory minimum of 12
      months in prison and a maximum of three years. Courts treat cannabis, a Class B drug, as a
      'soft' drug and sentence toward the bottom of that range.
    sources:
      - case
      - act
  cultivation:
    text: Cultivation is an offence under the Act.
    sources:
      - act
  enforcement:
    text: >-
      A mandatory year in prison for simple possession makes this the harshest regime in the Pacific
      islands for users.
    sources:
      - case
  sharing:
    text: Supply carries heavier penalties.
    sources:
      - act
  consumption:
    text: Use is covered by the possession offence.
    sources:
