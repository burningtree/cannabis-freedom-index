  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited.
    sources:
      - act
  planting:
    seeds: illegal
    seeds_trade: banned
    clones: illegal
    clones_trade: banned
    text: >-
      The Illicit Drugs Control Act 2004 lists cannabis seed by name among its illicit drugs,
      next to the cannabis plant, fresh or dried, and cannabis fruit. Its definition of
      cultivating includes planting, sowing and scattering the seed as well as growing and
      tending, so both seeds and living plants are covered.
    sources:
      - act
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. British travel advice tells travellers
      not to get involved with illegal drugs of any kind and says there are severe penalties
      for drug offences, including custodial sentences.
    sources:
      - act
      - fcdo
