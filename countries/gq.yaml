      detailed interaction with the 1993 drug decree remains to be checked.
  code1966:
    title: Spain, Boletín Oficial del Estado — Decree 480/1966, published 1 March 1966
    url: https://boe.es/boe/dias/1966/03/01/pdfs/A02442-02442.pdf
    locator: >-
      Single article applies the revised 1963 Spanish Penal Code in Equatorial Guinea. This is
      statutory ancestry, not a verified first cannabis restriction.
