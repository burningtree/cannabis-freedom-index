segments:
  possession:
    text: >-
      Illegal on paper under drug laws of 1980 and 1991, with prison of one to twenty years across
      possession, cultivation and sale. In practice cannabis has long been smoked openly at all
      levels of society: a 2000 report said nobody had been arrested for smoking or dealing in
      living memory.
    sources:
      - iol
  cultivation:
    text: Cultivation is a crime on paper and common in practice.
    sources:
      - wiki
      - iol
  enforcement:
    text: >-
      British travel advice says possession of drugs is a serious offence and punishments can be
      severe, including prison sentences. No account of how the law is applied in practice was
      found.
    sources:
      - fcdo
  sharing:
    text: >-
      The law is described as carrying severe penalties for production and sale; the sources read
      give no sentences. A report in 2000 said nobody had been arrested for smoking or dealing
      cannabis in living memory, and some of what is grown is trafficked to Gabon.
    sources:
      - wiki
  consumption:
    text: Use is illegal but culturally accepted.
    sources:
      - iol
      - wiki
  access:
    text: None legally; an open informal market.
    sources:
      - iol
