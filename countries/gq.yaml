name: Equatorial Guinea
region: Africa
iso_numeric: 226
recreational: illegal
medical: none
updated: "2026-10-15"
summary: >-
  Drug possession remains a serious offence. The 1993 decree expressly covered cultivation,
  possession, use and gifts; its penalties need reconciliation with the 2022 Penal Code. A report of
  open use in 2000 does not establish current tolerance.
scores:
  possession: 1
  cultivation: 1
  enforcement: 2
  sharing: 1
  consumption: 1
  access: 0
segments:
  possession:
    text: >-
      The 1993 decree’s article 4 expressly included possession and prescribed medium-term
      imprisonment plus a CFA fine. Current British travel advice still warns of severe penalties
      including prison. The decree’s exact relationship to the Penal Code effective in December 2022
      has not been verified, so the former one-to-twenty-year claim is removed and no current
      numerical custody range is asserted. The possession rating remains provisional.
    sources:
      - decree1993
      - un2023
      - fcdo
  cultivation:
    text: >-
      Article 4 of the 1993 decree expressly criminalised unauthorised cultivation alongside
      manufacture and trafficking. No recreational home-growing exemption was established. The later
      Penal Code and representative sentencing need further review before a current tariff or
      typical outcome can be stated; the numerical rating remains provisional.
    sources:
      - decree1993
      - un2023
  enforcement:
    text: >-
      Current British travel advice describes drug possession as a serious offence punishable by
      prison. An AFP report dated 6 January 2000 described open cannabis use and quoted local claims
      of little enforcement; that is historical reporting, not a current arrest or sentencing
      survey. The enforcement rating remains provisional pending recent cannabis-specific outcomes.
    sources:
      - fcdo
      - iol
  sharing:
    text: >-
      The 1993 decree expressly included donation and facilitating illegal use within article 4,
      without a general unpaid-gift exemption. The reviewed evidence does not establish a current
      lawful recreational gifting route. Precise penalties and the numerical rating require
      reconciliation with the later Penal Code and enforcement evidence.
    sources:
      - decree1993
      - un2023
  consumption:
    text: >-
      Articles 1 and 4 of the 1993 decree expressly prohibited and punished use. The 2000 report of
      open smoking is retained as historical context, not proof of present-day tolerance. Current
      cannabis-specific prosecutions and the effect of the 2022 Penal Code remain gaps; the
      numerical rating is provisional.
    sources:
      - decree1993
      - un2023
      - iol
  access:
    text: >-
      No functioning legal recreational or cannabis patient supply route was established. Article 2
      of the 1993 decree permitted Health Ministry authorisation for medical and scientific narcotic
      imports, exports, sales and use; a general controlled-medicines power is not proof of cannabis
      prescriptions or available products.
    sources:
      - decree1993
context:
  production:
    text: >-
      The 1993 decree criminalised cultivation and manufacture, while article 2 reserved medical and
      scientific authorisations to the Health Ministry. It does not establish that a cannabis
      production licence was issued or that a lawful hemp industry operates. The later legislative
      position remains under review.
    sources:
      - decree1993
      - un2023
  products:
    text: >-
      The 1993 decree regulated narcotic drugs and psychotropic substances generally; article 3
      referred prescription and dispensing requirements to the national pharmaceutical selection
      committee under Decree 7/1991. It did not establish a cannabis flower, oil or other
      retail-product list. Current cannabis medicine availability remains unverified.
    sources:
      - decree1993
  medical:
    text: >-
      Articles 2–3 of the 1993 decree expressly contemplated authorised medical and scientific use
      of controlled drugs and rules for prescribing medicines containing them. This is a general
      medicines framework rather than evidence of a cannabis-specific patient programme. The none
      label records that no such programme or supply route has been established.
    sources:
      - decree1993
  consequences:
    text: >-
      Article 5(2) of the 1993 decree prescribed professional disqualification for a physician or
      public official abusing their position, including specified health and pharmacy personnel.
      That is not a general employment ban for every cannabis user. Its present application must be
      checked against the later Penal Code.
    sources:
      - decree1993
      - un2023
  clubs:
    status: none
    text: >-
      No recreational club authorisation was established. The 1993 decree expressly prohibited
      cultivation and donation, so its medical/scientific exception cannot be read as collective
      recreational-growing permission. Current informal club activity was not verified.
    sources:
      - decree1993
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. British travel advice says possession of
      drugs is a serious offence and that punishments can be severe, including prison sentences.
    sources:
      - fcdo
      - decree1993
