  medical:
    text: No medical cannabis.
    sources:
      - wiki
  consequences:
    text: Arbitrary detention is a wider risk in the country's justice system.
    sources:
      - cr
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited.
    sources:
      - wiki
      - iol
      - cr
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. British travel advice says possession
      of drugs is a serious offence and that punishments can be severe, including prison
      sentences.
    sources:
      - iol
      - fcdo
