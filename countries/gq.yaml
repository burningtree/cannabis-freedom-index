name: Equatorial Guinea
region: Africa
iso_numeric: 226
recreational: illegal
medical: none
updated: 2026-10-04
summary: Illegal on paper with long sentences, but smoked openly and rarely prosecuted among locals.
scores:
  possession: 1
  cultivation: 1
  enforcement: 2
  sharing: 1
  consumption: 1
  access: 0
segments:
  possession:
    text: >-
      Illegal on paper under drug laws of 1980 and 1991, with prison of one to twenty years across
      possession, cultivation and sale. In practice cannabis has long been smoked openly at all
      levels of society: a 2000 report said nobody had been arrested for smoking or dealing in
      living memory.
    sources:
      - cr
      - iol
  cultivation:
    text: Cultivation is a crime on paper and common in practice.
    sources:
      - wiki
      - iol
  enforcement:
    text: >-
      Tolerance is informal and can be withdrawn; foreign nationals in particular are reported to be
      prosecuted.
    sources:
      - cr
  sharing:
    text: Trafficking carries up to twenty years.
    sources:
      - cr
  consumption:
    text: Use is illegal but culturally accepted.
    sources:
      - iol
      - wiki
  access:
    text: None legally; an open informal market.
    sources:
      - iol
context:
