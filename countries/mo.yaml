name: Macau
region: Asia
iso_numeric: 446
dependency:
  of: cn
  kind: Special administrative region
  note: >-
    Macau is a special administrative region of China with its own legal system, rooted in
    Portuguese law. Its drug law, Law 17/2009, is separate from mainland China's.
recreational: illegal
medical: limited
updated: '2026-10-24'
summary: >-
  Cannabis use, personal possession and home growing carry three months to a year in prison or a
  fine. Larger personal stocks can trigger production or trafficking penalties, including a
  lesser one-to-five-year tier. Medicines require official authorisation and controlled
  prescribing.
scores:
  possession: 1
  cultivation: 1
  enforcement: 2
  sharing: 0
  consumption: 0
  access: 0
segments:
  possession:
    text: >-
      Personal acquisition or possession carries three months to one year in prison or a fine of
      60–240 day-rates. Above five daily reference quantities, production or trafficking rules
      apply, including a lesser one-to-five-year tier. The herbal cannabis reference is 1 g per
      day; possession below five grams is still an offence.[@law]
    sources:
      - law
    penalties:
      - label: Personal acquisition or possession
        treatment: criminal
        prison_min: 3 months
        prison: 1 year
        note: Or a fine of 60–240 day-rates (income-based)
      - over: 5 g
        treatment: criminal
        note: Above five daily reference quantities (1 g per day for herbal cannabis), production or trafficking rules apply including a lesser one-to-five-year tier
  cultivation:
    text: >-
      Growing for personal use carries three months to one year in prison or a fine, with larger
      quantities subject to production rules.[@law] In 2022 the top court applied the lesser
      production tier to two first offenders growing one plant; their combined sentences were
      one year nine months and two years.[@c22]
    sources:
      - law
      - c22
    penalties:
      - label: Growing for personal use
        treatment: criminal
        prison_min: 3 months
        prison: 1 year
        note: Or a fine; larger quantities fall under production rules
      - label: "Growing, lesser production tier (2022 case: one plant)"
        treatment: criminal
        prison_min: 1 year
        prison: 5 years
  enforcement:
    text: >-
      Personal use and possession are criminal offences with prison or a fine available.
      Ordinary production and trafficking carry five to fifteen years; lesser cases carry one to
      five years, assessed using the quantity and circumstances.[@law] In 2022 the top court
      reduced two growers’ sentences even though their plant exceeded the five-day reference
      quantity.[@c22]
    sources:
      - law
      - c22
  sharing:
    text: >-
      Giving, selling or handing cannabis to another person falls under the trafficking rules:
      ordinarily five to fifteen years, or one to five years in lesser cases.[@law] The top
      court has treated supplying cannabis to others as trafficking even when they shared its
      purchase cost.[@c04]
    sources:
      - law
      - c04
    penalties:
      - label: Giving, selling or handing to another person (trafficking)
        treatment: criminal
        prison_min: 5 years
        prison: 15 years
      - label: Trafficking, lesser cases
        treatment: criminal
        prison_min: 1 year
        prison: 5 years
        note: Cost-sharing supply counts as trafficking
  consumption:
    text: >-
      Illicit consumption itself carries three months to one year in prison or a fine of 60–240
      day-rates.[@law]
    sources:
      - law
  access:
    text: >-
      Adult-use supply is prohibited under the trafficking rules.[@law] Lawful medical supply
      depends on official authorisations, pharmacy or hospital dispensing and special
      prescriptions.[@med]
    sources:
      - law
      - med
context_not_applicable:
  death_penalty:
    text: >-
      Macau abolished the death penalty in 1976 and retains no capital punishment; no
      cannabis offence carries a capital sentence.[@wikipdp]
    sources: [wikipdp]
context:
  recreational:
    text: >-
      There is no legal way to get cannabis. Personal acquisition or possession brings three
      months to one year or a fine of 60–240 day-rates; above five daily reference quantities
      (1 g per day for herbal cannabis) production or trafficking rules apply.[@law]
    sources:
      - law
  production:
    status: medical
    text: >-
      Unauthorised production ordinarily carries five to fifteen years, with a lesser
      one-to-five-year tier.[@law] Licensed chemical and pharmaceutical businesses can seek
      authorisation to manufacture controlled medicines; the lawful-drug rules separately
      prohibit cultivating scheduled plants.[@med]
    sources:
      - law
      - med
  medical:
    text: >-
      There is a limited licensed-medicine route: the lawful-drug rules cover medical
      manufacture of scheduled substances, including the cannabis table, and supply through
      pharmacies or hospitals on special prescriptions. Cultivation of scheduled plants remains
      prohibited.[@med]
    sources:
      - med
  consequences:
    text: >-
      Since January 2017 larger personal stocks can be charged under production or trafficking
      rules.[@l16] The five-day reference quantity does not exclude the lesser tier: in 2022 the
      top court reduced two growers’ combined sentences from five years nine months each to one
      year nine months and two years.[@c22]
    sources:
      - l16
      - c22
  clubs:
    status: none
    text: >-
      Supplying other people with cannabis is punishable under the trafficking rules, including
      gifts.[@law] The top court has also treated cost-sharing supply as trafficking.[@c04]
    sources:
      - law
      - c04
  visitors:
    status: none
    text: >-
      Unauthorised cannabis imports fall under the trafficking rules.[@law] The traveller
      exception for up to thirty days of certain controlled medicines omits Table I-C, which
      contains cannabis, resin and oil.[@med]
    sources:
      - law
      - med
