  2021: 682070
cannabis_use:
  prevalence: 1.9
  estimate: true
  users: 9300
recreational: illegal
medical: none
updated: 2026-10-17
summary: >-
  Using cannabis, or holding or growing it for one's own use, is a crime punishable by three months
  to a year in prison or a fine. Above five times a daily reference quantity the same acts are
  treated as trafficking, with five to fifteen years, and handing cannabis to someone else counts as
  trafficking too.
scores:
  possession: 1
