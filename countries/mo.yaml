  possession: 1
  cultivation: 1
  enforcement: 2
  sharing: 0
  consumption: 0
  access: 0
segments:
  possession:
    text: >-
      Personal acquisition or possession carries three months to one year in prison or a fine of
      60–240 day-rates. Above five daily reference quantities, production or trafficking rules
      apply, including a lesser one-to-five-year tier. The herbal cannabis reference is 1 g per
      day; possession below five grams is still an offence.[@law]
    sources:
      - law
    penalties:
      - label: Personal acquisition or possession
        treatment: criminal
        term: Personal use
        prison_min: 3 months
        prison: 1 year
        note: Or a fine of 60–240 day-rates (income-based)
      - over: 5 g
        treatment: criminal
        term: Trafficking
        prison_min: 1 year
        prison: 5 years
        note: Above five daily reference quantities; lesser tier one to five years, ordinary five to fifteen
  cultivation:
    text: >-
      Growing for personal use carries three months to one year in prison or a fine, with larger
      quantities subject to production rules.[@law] In 2022 the top court applied the lesser
      production tier to two first offenders growing one plant; their combined sentences were
      one year nine months and two years.[@c22]
    sources:
      - law
      - c22
    penalties:
      - label: Growing for personal use
        treatment: criminal
        term: Cultivation
        prison_min: 3 months
        prison: 1 year
        note: Or a fine; larger quantities fall under production rules
      - label: "Growing, lesser production tier (2022 case: one plant)"
        treatment: criminal
        term: Cultivation
        prison_min: 1 year
        prison: 5 years
      - label: Unauthorised cultivation, ordinary tier
        treatment: criminal
        term: Cultivation
        prison_min: 5 years
        prison: 15 years
        note: Aggravating facts add one third
  enforcement:
    text: >-
      Personal use and possession are criminal offences with prison or a fine available.
      Ordinary production and trafficking carry five to fifteen years; lesser cases carry one to
      five years, assessed using the quantity and circumstances.[@law] In 2022 the top court
      reduced two growers’ sentences even though their plant exceeded the five-day reference
      quantity.[@c22]
    sources:
      - law
      - c22
  sharing:
    text: >-
      Giving, selling or handing cannabis to another person falls under the trafficking rules:
      ordinarily five to fifteen years, or one to five years in lesser cases.[@law] The top
      court has treated supplying cannabis to others as trafficking even when they shared its
      purchase cost.[@c04]
    sources:
      - law
      - c04
    penalties:
      - label: Giving, selling or handing to another person (trafficking)
        treatment: criminal
        term: Trafficking
        prison_min: 5 years
        prison: 15 years
      - label: Trafficking, lesser cases
        treatment: criminal
        term: Trafficking
        prison_min: 1 year
        prison: 5 years
  consumption:
    text: >-
      Illicit consumption itself carries three months to one year in prison or a fine of 60–240
      day-rates.[@law]
    sources:
      - law
    currency: MOP
    penalties:
      - label: Illicit consumption
        treatment: criminal
        term: Personal use
        prison_min: 3 months
        prison: 1 year
        note: Or a fine of 60–240 day-rates
  access:
    text: >-
      Adult-use supply is prohibited under the trafficking rules.[@law] Lawful medical supply
      depends on official authorisations, pharmacy or hospital dispensing and special
      prescriptions.[@med]
    sources:
      - law
      - med
context_not_applicable:
  death_penalty:
    text: >-
      Macau abolished the death penalty in 1976 under the Portuguese Constitution and retains no
      capital punishment; no cannabis offence carries a capital sentence.[@amnestyhk]
    sources: [amnestyhk]
context:
  recreational:
    text: >-
      There is no legal way to get cannabis. Personal acquisition or possession brings three
      months to one year or a fine of 60–240 day-rates; above five daily reference quantities
      (1 g per day for herbal cannabis) production or trafficking rules apply.[@law]
    sources:
      - law
  production:
    status: medical
    text: >-
      Unauthorised production ordinarily carries five to fifteen years, with a lesser
      one-to-five-year tier.[@law] Licensed chemical and pharmaceutical businesses can seek
      authorisation to manufacture controlled medicines; the lawful-drug rules separately
      prohibit cultivating scheduled plants.[@med]
    sources:
      - law
      - med
  medical:
    text: >-
      No operating patient programme or registered cannabis medicine was found. The lawful-drug
      rules allow licensed chemical and pharmaceutical firms to extract or manufacture scheduled
      substances for medical or scientific purposes, and pharmacies or hospitals may dispense them
      on special prescriptions, but cultivation of scheduled plants remains prohibited.[@med]
      Medical cannabis is therefore a licensing framework on paper, not a patient route.[@med]
    sources:
      - med
  consequences:
    text: >-
      A conviction is a criminal record. Article 21 adds two-to-ten-year bans on public office and
      professions, two-to-five-year driving bans and, for non-residents, a five-to-ten-year
      expulsion and entry ban.[@law] Since January 2017 larger personal stocks can be charged under
      production or trafficking rules, and the five-day reference does not exclude the lesser
      tier.[@l16,c22]
    sources:
      - law
      - l16
      - c22
  clubs:
    status: none
    text: >-
      Supplying other people with cannabis is punishable under the trafficking rules, including
      gifts.[@law] The top court has also treated cost-sharing supply as trafficking.[@c04]
    sources:
      - law
      - c04
  visitors:
    status: none
    text: >-
      Unauthorised cannabis imports fall under the trafficking rules.[@law] The traveller
      exception for up to thirty days of certain controlled medicines omits Table I-C, which
      contains cannabis, resin and oil.[@med]
    sources:
      - law
      - med
  hemp:
    status: none
    text: >-
      No hemp or CBD regime and no THC threshold. Table I-C lists hemp and its derivatives, and
      article 19 bans cultivation of scheduled plants.[@law,med] CBD has no separate rule and falls
      under the cannabis derivatives in Table I-C unless authorised as a medicine.[@law]
    sources:
      - law
      - med
  planting:
    seeds: grey
    seeds_trade: unclear
    clones: illegal
    clones_trade: banned
    text: >-
      The schedules list the cannabis plant rather than its seeds, so holding or selling seed is not
      expressly an offence, but sowing it is cultivation.[@law] A cutting is a living plant, and
      selling a plant is trafficking.[@law] The seed status is therefore an inference.[@law]
    sources:
      - law
  driving:
    status: impairment
    text: >-
      Road Traffic Law 3/2007, article 90(2), punishes driving under the influence of narcotics or
      psychotropics whose consumption is a crime with up to one year in prison and a one-to-three
      year driving ban.[@road90] There is no numeric THC cutoff; the test is influence.[@road90]
    sources:
      - road90
  black_market:
    text: >-
      Seizures are overwhelmingly herbal cannabis at the airport. The Judiciary Police recorded
      9.30 kg of herb and 419 g of THC in 2024, and 51.54 kg of herb and 3.34 kg of THC in 2025;
      no resin line is published.[@pj25] Major cases include more than 30 kg in September 2025 and
      about 35 kg in June 2026, both records at the time.[@macaonews25,mdt26] Police valuations imply
      about MOP1,000 a gram.[@pj25]
    sources:
      - pj25
      - macaonews25
      - mdt26
  arrests:
    text: >-
      The Judiciary Police recorded 61 trafficking cases and 29 consumption cases in 2025, against
      49 and 15 in 2024, and 30 and 10 in the first half of 2026.[@pj25,pj26] The figures cover all
      drugs, not cannabis alone.[@pj25] The Social Welfare Bureau recorded 132 registered drug users
      in 2025 and 88 dependency cases in the first half of 2026, of which cannabis was 3.1%.[@mdt26]
    sources:
      - pj25
      - pj26
      - mdt26
