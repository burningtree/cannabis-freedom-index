segments:
  possession:
    text: >-
      Under Article 14 of Law 17/2009, as amended in 2016, acquiring or holding cannabis for one's
      exclusive personal use is punished with three months to one year in prison or a fine of 60 to
      240 day-rates. If the amount exceeds five times the daily reference quantity set in the law's
      annex, the trafficking provisions apply instead.
    sources:
      - l10
  cultivation:
    text: >-
      Growing cannabis for one's own use falls under the same article, with three months to a year in
      prison or a fine. Unauthorised cultivation outside that case is production, punished with five
      to fifteen years.
    sources:
      - l10
  enforcement:
    text: >-
      Consumption and personal possession are crimes that reach the courts, with prison or a fine.
      Since 2016 personal-use amounts above five times the reference quantity are no longer treated
      as consumption but under the much heavier trafficking provisions.
    sources:
      - l10
  sharing:
    text: >-
      Offering, selling, distributing or handing over cannabis to another person (ceder), outside
      one's own consumption, is trafficking, punished with five to fifteen years in prison.
    sources:
      - l10
  consumption:
    text: >-
      Consuming cannabis is a crime in itself, punished with three months to one year in prison or a
      fine.
    sources:
      - l10
  access:
    text: >-
      No legal source. Production, trade and possession are allowed only with authorisation, and no
      medical cannabis programme exists.
    sources:
      - l10
context:
  production:
    text: >-
      None. Unauthorised production carries five to fifteen years.
    sources:
      - l10
  products:
    text: >-
      No legal cannabis products.
    sources:
      - l10
  medical:
    text: >-
      No medical cannabis programme. Controlled substances may be used only with official
      authorisation.
    sources:
      - l10
  consequences:
    text: >-
      The 2016 amendment set the current penalty for consumption and ties the line between use and
      trafficking to a table of daily reference quantities, so that larger personal stocks are judged
      as trafficking.
    sources:
      - l10
  clubs:
    status: none
    text: >-
      No cannabis clubs are known. Handing cannabis to another person is trafficking.
    sources:
      - l10
  visitors:
    status: none
    text: >-
      There is no legal supply for anyone, and importing cannabis is trafficking under Article 8.
    sources:
      - l10
sources:
