segments:
  possession:
    text: >-
      Holding a small amount without intent to sell is an administrative offence under Article
      206 of the Code of Administrative Offences: a fine of 300 to 400 manat or, where the court
      finds a fine insufficient, administrative arrest of up to two months. A small amount is
      anything below the 'substantial' amount set by law, and a person who hands the drugs in
      voluntarily is released from liability. A substantial amount without intent to sell is a
      crime under Article 234.1 of the Criminal Code, with restriction of liberty for one to
      three years or up to three years in prison, and a large amount brings three to eight
      years.
    sources:
      - admin
      - criminal
      - law2023
  cultivation:
    text: >-
      Small-scale cultivation is an administrative offence under Article 208: the penalty is a
      200–300 manat fine or, when the court considers a fine insufficient, up to two months of
      administrative detention. Article 237 of the Criminal Code applies above the statutory
      threshold, with a 3,000–6,000 manat fine, restriction of liberty for one to three years, or
      up to three years in prison; aggravated cases carry three to ten years.
    sources:
      - admin
      - criminal
  enforcement:
    text: >-
      The law offers an administrative route for small amounts and an exit for those who
      cooperate: both codes release a person who voluntarily hands in drugs, and the Criminal
      Code also releases one who actively helps uncover drug crimes. Above the small-amount
      threshold possession is a crime with up to three years in prison. No figures on how often
      users are fined, detained or prosecuted were found.
    sources:
      - admin
      - criminal
  sharing:
    text: >-
      Article 234.2 punishes possession, production, transport or sending with intent to sell, and
      sale itself, with three to seven years in prison. The narcotics law defines sale as a paid or
      barter transaction; the sources read do not identify a separate lesser rule for an unpaid
      gift.
    sources:
      - criminal
      - mia
  consumption:
    text: >-
      Using a narcotic is an administrative offence under the same Article 206 as small
      possession: a fine of 300 to 400 manat or, where that is judged insufficient,
      administrative arrest of up to two months.
    sources:
      - admin
  access:
    text: No legal source.
    sources:
      - law2023
      - osce2011
context:
  production:
    text: >-
      Cultivation and production of narcotic plants are prohibited except where needed to prepare
      experimental samples of medicines; experimental production is reserved to competent state
      authorities.
    sources:
      - mia
  products:
    text: >-
      Controlled narcotic medicines may be supplied by licensed pharmacies and medical
      institutions. The law does not establish a legal retail market for cannabis products.
    sources:
      - mia
  medical:
    text: >-
      The narcotics law permits controlled drugs for medical needs through licensed pharmacies and
      medical institutions, but the sources read do not establish a patient-access programme for
      cannabis itself.
    sources:
      - mia
  consequences:
    text: >-
      People convicted of illicit drug trafficking may not work in organisations that handle
      controlled drugs, while separate employment restrictions may be imposed on people diagnosed
      with drug dependence in specified occupations or work involving dangerous facilities.
    sources:
      - mia
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. Use or a small amount brings a fine of
      300 to 400 manat or up to two months' administrative arrest; a substantial amount is a
      crime with up to three years in prison, and holding or carrying drugs for sale three to
      seven years.
    sources:
      - admin
      - criminal
