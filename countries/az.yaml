segments:
  possession:
    text: >-
      Acquiring or storing drugs without intent to sell is a crime under Article 234.1 of the
      Criminal Code when the amount exceeds what is needed for personal use. Under Article 21 of
      the 2005 narcotics law, an amount below the "substantial" amount set by law is a small
      amount and leads to administrative liability instead.
    sources:
      - law2023
      - osce2011
  cultivation:
    text: Cultivation is a crime.
    sources:
      - cr
  enforcement:
    text: >-
      The fine for a sub-gram amount is several months' average wages, and anything more is a prison
      offence. Drug charges have also been used against government critics.
    sources:
      - cr
      - trip
  sharing:
    text: Trafficking carries five to twelve years.
    sources:
      - cr
  consumption:
    text: Use is an administrative offence, with compulsory treatment possible.
