segments:
  possession:
    text: >-
      Article 206 of the Code of Administrative Offences covers use and the small-scale making,
      buying, keeping, carrying or sending of narcotics without intent to sell: a fine of 300 to 400
      manat or, if the court considers a fine insufficient, up to two months' administrative
      arrest.[@admin] A small amount is anything below the substantial amount set by law.[@admin]
      Above that line, Article 234.1 of the Criminal Code punishes possession without intent to sell
      with restriction of liberty for one to three years or up to three years in prison; a large
      amount brings three to eight years and an especially large amount eight to fifteen.[@criminal]
      For dried cannabis the substantial amount is 5 g, large 500 g and especially large 50 kg; for
      undried cannabis the lines are 25 g, 2.5 kg and 250 kg.[@thresholds]
    sources:
      - admin
      - criminal
      - thresholds
    currency: AZN
    penalties:
      - upto: 5 g
        treatment: civil
        term: Small amount, Article 206
        fine_min: 300
        fine: 400
        prison: 2 months
        note: >-
          Dried cannabis below the substantial threshold; administrative arrest if a fine is
          insufficient
      - over: 5 g
        upto: 500 g
        treatment: criminal
        term: Substantial amount, Article 234.1
        prison: 3 years
        note: Restriction of liberty for 1–3 years or up to 3 years in prison
      - over: 500 g
        upto: 50 kg
        treatment: criminal
        term: Large amount, Article 234.1-1
        prison_min: 3 years
        prison: 8 years
      - over: 50 kg
        treatment: criminal
        term: Especially large amount, Article 234.4-1
        prison_min: 8 years
        prison: 15 years
  cultivation:
    text: >-
      Article 208 punishes small-scale sowing or growing of drug-containing plants with a 200 to 300
      manat fine or up to two months' administrative arrest.[@admin] Above the substantial
      threshold, Article 237.1 carries a 3,000 to 6,000 manat fine, restriction of liberty for one
      to three years or up to three years in prison; aggravated cultivation brings three to eight
      years and especially large cultivation six to ten.[@criminal] The thresholds count plants: 3
      to 15 plants or 6 to 30 parts is substantial, 16 to 800 plants or 31 to 1,550 parts large, and
      801 plants or 1,551 parts especially large.[@thresholds]
    sources:
      - admin
      - criminal
      - thresholds
    currency: AZN
    penalties:
      - upto: 2 plants
        treatment: civil
        term: Small-scale, Article 208
        fine_min: 200
        fine: 300
        prison: 2 months
        note: Below the substantial threshold; 3–15 plants or 6–30 parts is substantial
      - over: 2 plants
        upto: 15 plants
        treatment: criminal
        term: Substantial, Article 237.1
        fine_min: 3000
        fine: 6000
        prison: 3 years
        note: Fine, restriction of liberty for 1–3 years or up to 3 years in prison
      - over: 15 plants
        upto: 800 plants
        treatment: criminal
        term: Large, Article 237.2
        prison_min: 3 years
        prison: 8 years
      - over: 800 plants
        treatment: criminal
        term: Especially large, Article 237.3
        prison_min: 6 years
        prison: 10 years
  enforcement:
    text: >-
      The state treats drug crime as a large share of its criminal caseload: 8,863 drug offences in
      2024, 26.6% of all registered crimes, with 7,245 offenders detained and 2,420 administrative
      drug offences.[@stats2024] In January–November 2025 the authorities reported 7,441 drug crimes
      and 5,117 people prosecuted; in the first half of 2026, 4,460 drug
      crimes.[@stats2025,stats2026] Both codes release a person who voluntarily hands in drugs, and
      the Criminal Code also releases one who actively helps uncover drug offences.[@admin,criminal]
    sources:
      - stats2024
      - stats2025
      - stats2026
      - admin
      - criminal
  sharing:
    text: >-
      Article 234.2 punishes buying or keeping narcotics with intent to sell, and sale itself, with
      three to seven years in prison and possible confiscation of property.[@criminal] Sale to a
      minor, or in a school, medical or detention institution, brings four to eight
      years.[@criminal] Group, repeat, large-amount or online sale brings five to twelve years, and
      an especially large amount eight to fifteen.[@criminal] The drug law defines illicit
      trafficking as actions aimed at distributing narcotics for payment or gain, or for another
      personal interest; the code has no separate lesser offence for an unpaid gift.[@druglaw]
    sources:
      - criminal
      - druglaw
    penalties:
      - label: Sale, or possession for sale
        treatment: criminal
        term: Article 234.2
        prison_min: 3 years
        prison: 7 years
        note: Property may be confiscated
      - label: Sale to a minor, or in a school, medical or detention institution
        treatment: criminal
        term: Article 234.3-1
        prison_min: 4 years
        prison: 8 years
      - label: Group, repeat, large amount or online sale
        treatment: criminal
        term: Article 234.4
        prison_min: 5 years
        prison: 12 years
      - label: Especially large amount
        treatment: criminal
        term: Article 234.4-1
        prison_min: 8 years
        prison: 15 years
  consumption:
    text: >-
      Using a narcotic is an administrative offence under Article 206, punished with a 300 to 400
      manat fine or up to two months' administrative arrest.[@admin] The same article covers
      small-scale possession, so a person found using a small amount is dealt with outside the
      criminal code.[@admin] The sources read identify no separate offence for cannabis use as
      opposed to other narcotics.[@admin]
    sources:
      - admin
    currency: AZN
    penalties:
      - label: Use of a narcotic, Article 206
        treatment: civil
        term: Use
        fine_min: 300
        fine: 400
        prison: 2 months
        note: Administrative arrest if a fine is insufficient
  access:
    text: >-
      There is no legal source of cannabis for adults or patients.[@druglaw] The drug law allows
      narcotic drugs for medical purposes through state channels, but the sources read identify no
      cannabis medicine or patient-access programme.[@druglaw] Production and cultivation are
      prohibited except experimental samples of medicines.[@druglaw]
    sources:
      - druglaw
context:
  recreational:
    text: >-
      Adults have no legal way to buy cannabis. A small amount for personal use is an administrative
      offence carrying a fine or up to two months' arrest; above 5 g of dried cannabis it becomes a
      crime with up to three years in prison, and sale carries three to seven
      years.[@admin,criminal] The state counted 8,863 drug crimes in 2024, of which 63.2% were
      purchase or storage without intent to sell and 33.3% sale or production.[@stats2024] No price
      or purity data were found.
    sources:
      - admin
      - criminal
      - stats2024
  medical:
    text: >-
      The drug law permits narcotic drugs for medical use and allows imports by state bodies, but
      the sources read identify no cannabis-based medicine, prescription route or patient
      programme.[@druglaw] Production is limited to experimental samples of medicines.[@druglaw]
      Medical status stays none.
    sources:
      - druglaw
  hemp:
    status: none
    text: >-
      The drug law makes no exception for industrial hemp: it prohibits the cultivation of plants
      containing narcotic substances except experimental samples of medicines, and the Criminal Code
      punishes unauthorised cultivation.[@druglaw,criminal] No THC limit, licensing scheme or
      separate CBD exemption was found in the sources read.[@druglaw]
    sources:
      - druglaw
      - criminal
  production:
    status: none
    text: >-
      The drug law prohibits the production of narcotic drugs and the cultivation of drug-containing
      plants on Azerbaijani territory, except experimental samples of medicines; those are reserved
      to the competent state bodies.[@druglaw] No licensed production for medicine, fibre or food
      was found.[@druglaw] The legal production route for cannabis is therefore none.
    sources:
      - druglaw
  consequences:
    text: >-
      A drug conviction is a criminal record. Courts may confiscate property for supply
      offences.[@criminal] The drug law allows restrictions on certain professions and on work with
      high-risk facilities for people diagnosed with drug dependence.[@druglaw] A small possession
      offence can still bring up to two months' administrative arrest.[@admin]
    sources:
      - criminal
      - druglaw
      - admin
  planting:
    seeds: grey
    seeds_trade: unclear
    clones: illegal
    clones_trade: banned
    text: >-
      The drug law controls plants containing narcotic substances and their parts but names no seed
      exception, so whether cannabis seed on its own is a controlled drug is not stated.[@druglaw]
      Sowing it is cultivation: Article 208 for a small amount and Article 237 above the
      threshold.[@admin,criminal] Clones are plants, so keeping or trading them falls under the
      cultivation offence.[@criminal] No seed-sale or clone market was found.
    sources:
      - druglaw
      - admin
      - criminal
  clubs:
    status: none
    text: >-
      No cannabis clubs are known. Article 238 criminalises organising or keeping a place for drug
      use with up to four years, or three to eight for a group or repeat offence; sale and
      cultivation are separately prohibited.[@criminal]
    sources:
      - criminal
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. A visitor who uses or holds a small amount
      faces a 300 to 400 manat fine or up to two months' administrative arrest; above 5 g of dried
      cannabis the case becomes criminal, with up to three years in prison, and sale carries three
      to seven years.[@admin,criminal] The law makes no exception for visitors.[@admin,criminal] A
      foreigner can also be expelled as a punishment under Article 42.0.9.[@criminal]
    sources:
      - admin
      - criminal
  driving:
    status: consumption
    text: >-
      Driving while intoxicated by narcotics, psychotropic substances or other strong substances is
      an administrative offence under Article 333-1.1: a 600 manat fine or restriction of the right
      to drive for six to twelve months.[@admin] A repeat brings 800 manat and a two-year
      restriction, or fifteen days to one month of administrative arrest.[@admin] The article’s note
      says a driver is considered intoxicated if a special technical device shows drug intake, so
      the trigger is a positive test rather than a measured THC limit.[@admin]
    sources:
      - admin
  black_market:
    text: >-
      The state statistics committee reported 5,634.4 kg of marijuana seized in 2024, out of 9,330.9
      kg of drugs, precursors and drug-containing plants, and 7,037.4 kg of marijuana in
      January–November 2025, out of 8,334.7 kg.[@stats2024,stats2025] In 2024 it also reported
      2,688.9 kg of drug-containing plants cultivated inside the country and seized, and in the 2025
      period 18,938 hemp plants.[@stats2024,stats2025] No price or purity data were found.
    sources:
      - stats2024
      - stats2025
  arrests:
    text: >-
      In 2024 the authorities registered 8,863 drug crimes, 26.6% of all crimes, detained 7,245
      offenders and recorded 2,420 administrative drug offences.[@stats2024] In January–November
      2025 they reported 7,441 drug crimes, including 2,403 for sale, 4,850 for purchase or storage
      and 186 for cultivation, and prosecuted 5,117 people.[@stats2025] In January–June 2026 they
      registered 4,460 drug crimes, 28.9% of the total.[@stats2026] The figures cover all drugs and
      give no cannabis breakdown.
    sources:
      - stats2024
      - stats2025
      - stats2026
  research:
    status: licensed
    text: >-
      The drug law lets legal entities use narcotics for scientific and teaching purposes only with
      permission from the relevant executive authority.[@druglaw] No published Azerbaijani cannabis
      study or clinical trial was found.[@druglaw]
    sources:
      - druglaw
