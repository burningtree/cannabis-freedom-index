segments:
  possession:
    text: >-
      Acquiring or storing drugs without intent to sell is a crime under Article 234.1 of the
      Criminal Code when the amount exceeds what is needed for personal use. Under Article 21 of
      the 2005 narcotics law, an amount below the "substantial" amount set by law is a small
      amount and leads to administrative liability instead.
    sources:
      - law2023
      - osce2011
  cultivation:
    text: >-
      Small-scale cultivation is an administrative offence under Article 208: the penalty is a
      200–300 manat fine or, when the court considers a fine insufficient, up to two months of
      administrative detention. Article 237 of the Criminal Code applies above the statutory
      threshold, with a 3,000–6,000 manat fine, restriction of liberty for one to three years, or
      up to three years in prison; aggravated cases carry three to ten years.
    sources:
      - admin
      - criminal
  enforcement:
    text: >-
      British travel advice says possession or use of illegal drugs, including cannabis, carries
      severe penalties, and to expect a long jail sentence and heavy fines for possessing, using or
      smuggling them.
    sources:
      - fcdo
  sharing:
    text: >-
      Article 234.2 punishes possession, production, transport or sending with intent to sell, and
      sale itself, with three to seven years in prison. The narcotics law defines sale as a paid or
      barter transaction; the sources read do not identify a separate lesser rule for an unpaid
      gift.
    sources:
      - criminal
      - mia
  consumption:
    text: >-
      Use is an offence. British travel advice says use of illegal drugs, including cannabis,
      carries severe penalties.
    sources:
      - fcdo
  access:
    text: >-
      No legal source. British travel advice says possession or use of illegal drugs, including
      cannabis, carries severe penalties.
    sources:
      - fcdo
context:
  production:
    text: >-
      Cultivation and production of narcotic plants are prohibited except where needed to prepare
      experimental samples of medicines; experimental production is reserved to competent state
      authorities.
    sources:
      - mia
  products:
    text: >-
      Controlled narcotic medicines may be supplied by licensed pharmacies and medical
      institutions. The law does not establish a legal retail market for cannabis products.
    sources:
      - mia
  medical:
    text: >-
      The narcotics law permits controlled drugs for medical needs through licensed pharmacies and
      medical institutions, but the sources read do not establish a patient-access programme for
      cannabis itself.
    sources:
      - mia
  consequences:
    text: >-
      People convicted of illicit drug trafficking may not work in organisations that handle
      controlled drugs, while separate employment restrictions may be imposed on people diagnosed
      with drug dependence in specified occupations or work involving dangerous facilities.
    sources:
      - mia
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. British travel advice says possession
      or use of illegal drugs, including cannabis, carries severe penalties, and tells
      travellers to expect a long jail sentence and heavy fines for possessing, using or
      smuggling them, also in transit. Airport scanners are also used on the baggage of
      passengers in transit.
    sources:
      - fcdo
