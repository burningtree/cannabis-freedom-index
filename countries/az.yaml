name: Azerbaijan
region: Asia
iso_numeric: 31
recreational: illegal
medical: none
updated: "2026-10-28"
summary: >-
  Small amounts for personal use are administrative offences, but a court can order up to two
  months' arrest; possession above 5 g, sale and cultivation are crimes. There is no medical, hemp
  or legal supply route, and the authorities report thousands of drug cases a year.
