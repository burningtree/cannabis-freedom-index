segments:
  possession:
    text: >-
      The administrative threshold is tiny: under 1 g of dried cannabis or 0.1 g of resin can be
      handled with a fine of 1,500 to 3,000 manat under the Code of Administrative Offences. Above
      that, possession is a crime under Article 234 of the Criminal Code with one to three years.
    sources:
      - cr
      - trip
  cultivation:
    text: Cultivation is a crime.
    sources:
      - cr
  enforcement:
    text: >-
      The fine for a sub-gram amount is several months' average wages, and anything more is a prison
      offence. Drug charges have also been used against government critics.
    sources:
      - cr
      - trip
  sharing:
    text: Trafficking carries five to twelve years.
    sources:
      - cr
  consumption:
    text: Use is an administrative offence, with compulsory treatment possible.
