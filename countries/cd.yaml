name: DR Congo
region: Africa
iso_numeric: 180
recreational: illegal
medical: limited
updated: 2026-10-15T00:00:00.000Z
summary: >-
  Recreational cannabis is prohibited. A 2022 ministerial order specifies licensing and controls for
  medical and scientific cannabis activities; an operating patient programme was not verified.
scores:
  possession: 1
  cultivation: 1
  enforcement: 1
  sharing: 1
  consumption: 1
  access: 0
segments:
  possession:
    text: >-
      Article 2 of the 2022 order prohibits possession for purposes other than medical and
      scientific use. It does not set a small personal-use allowance.
    sources:
      - order2022
  cultivation:
    text: >-
      Article 97 requires health-ministry authorisation for medical or scientific cultivation.
      Non-industrial cultivation requires a prior derogation under article 101; recreational growing
      remains prohibited.
    sources:
      - order2022
  enforcement:
    text: >-
      Article 121 refers violations to the Penal Code and pharmacy and health legislation. Those
      cross-references do not by themselves establish a precise cannabis sentence or actual
      enforcement frequency.
    sources:
      - order2022
  sharing:
    text: >-
      Recreational commercialisation is prohibited by article 2. The licensed cannabis sector
      remains subject to authorisations and controls. No personal gifting exemption was established.
    sources:
      - order2022
  consumption:
    text: >-
      Article 72 prohibits use outside a medical prescription; article 2 reserves authorised
      activities to medical and scientific purposes.
    sources:
      - order2022
  access:
    text: >-
      There is no recreational route. Article 112 requires express authorisation for imports of
      finished medical cannabis products; an operating patient supply service was not established.
    sources:
      - order2022
context:
  production:
    text: >-
      The 2022 order regulates licensed medical and scientific cannabis cultivation and production.
      Industrial plots require at least five hectares; smaller operations need prior derogation.
    sources:
      - order2022
  products:
    text: >-
      Article 112 restricts imports of finished medical cannabis products to express authorisation.
      Article 113 permits exports of semi-finished and finished products under authorisation, while
      prohibiting raw cannabis exports.
    sources:
      - order2022
  medical:
    text: >-
      The order provides a regulated medical and scientific framework. Article 100 specifies at most
      0.2% THC for medical cultivation and no THC ceiling for scientific cultivation. This does not
      verify patient availability.
    sources:
      - order2022
  consequences:
    text: >-
      Article 119 permits withdrawal of a cannabis-sector licence for breaches, illicit trafficking,
      recreational diversion or refusal of inspection. Article 120 provides a corrective-measures
      process.
    sources:
      - order2022
  clubs:
    status: none
    text: >-
      The reviewed order establishes medical and scientific licensing, not recreational social
      clubs. Article 97 excludes non-profit associations from its ordinary agricultural-operator
      provision.
    sources:
      - order2022
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone, so a visitor has no lawful way to buy
      cannabis. The sources behind this profile describe no separate rule for visitors.
    sources:
      - wiki
  black_market:
    text: >-
      Figures reported by the government to the UN drugs office record 1,800 kg of herbal cannabis
      seized in 2024, against 1,200 kg in 2023. The UN publishes them as kilogram equivalents, and
      countries count seizures differently, so the figures are not comparable across borders.
    sources:
      - unodc_szr
sources:
