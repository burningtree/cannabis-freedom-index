segments:
  possession:
    text: >-
      Recreational possession is illegal under a 1971 narcotics ordinance and the Penal Code.
      Consumption cases can end in shorter sentences or rehabilitation orders.
    sources:
      - cr
      - wiki
  cultivation:
    text: >-
      Cultivation is a crime, though cannabis (bangi) is one of the most widely grown illicit crops
      in central Africa.
    sources:
      - cr
      - wiki
  enforcement:
    text: >-
      Uneven: weak state presence in much of the country, with arrests and informal payments common
      in the cities.
    sources:
      - cr
  sharing:
    text: Trafficking carries up to twenty years and forfeiture.
    sources:
      - cr
  consumption:
    text: Use is an offence.
    sources:
      - cr
  access:
    text: No legal source for the public.
    sources:
      - wiki
context:
  production:
    text: >-
      A February 2021 measure authorised narcotics, including cannabis, exclusively for medical,
      educational and scientific purposes under licence.
    sources:
      - wiki
  products:
    text: No legal consumer products.
    sources:
      - wiki
  medical:
    text: Authorised in principle since 2021; no accessible patient programme.
    sources:
      - wiki
  consequences:
    text: A conviction is a criminal record.
    sources:
      - cr
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited.
    sources:
      - cr
      - wiki
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone, so a visitor has no lawful way to buy
      cannabis. The sources behind this profile describe no separate rule for visitors.
    sources:
      - wiki
