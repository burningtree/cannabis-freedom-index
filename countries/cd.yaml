segments:
  possession:
    text: >-
      Recreational possession is illegal under a 1971 narcotics ordinance and the Penal Code.
      Consumption cases can end in shorter sentences or rehabilitation orders.
    sources:
      - wiki
  cultivation:
    text: >-
      Cultivation is a crime, though cannabis (bangi) is one of the most widely grown illicit crops
      in central Africa.
    sources:
      - wiki
  enforcement:
    text: >-
      No source read for this profile gives the penalties or describes how the law is applied.
      Cannabis is the one drug produced in the country, mainly for local consumption; the score
      assumes that prison is possible for users.
    sources:
      - wiki
  sharing:
    text: Supply is illegal; the retained source does not establish a precise cannabis sentence.
    sources:
      - wiki
  consumption:
    text: >-
      A law of February 2021 limits narcotics to medical, educational and scientific purposes; using
      cannabis for any other purpose stays prohibited.
    sources:
      - wiki
  access:
    text: No legal source for the public.
    sources:
      - wiki
context:
  production:
    text: >-
      A February 2021 measure authorised narcotics, including cannabis, exclusively for medical,
      educational and scientific purposes under licence.
    sources:
      - wiki
  products:
    text: No legal consumer products.
    sources:
      - wiki
  medical:
    text: Authorised in principle since 2021; no accessible patient programme.
    sources:
      - wiki
  consequences:
    text: The retained sources do not establish collateral consequences beyond the penalties described above.
    sources: []
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited.
    sources:
      - wiki
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone, so a visitor has no lawful way to buy
      cannabis. The sources behind this profile describe no separate rule for visitors.
    sources:
      - wiki
  black_market:
    text: >-
      Figures reported by the government to the UN drugs office record 1,800 kg of herbal
      cannabis seized in 2024, against 1,200 kg in 2023. The UN publishes them as kilogram
      equivalents, and countries count seizures differently, so the figures are not
      comparable across borders.
    sources:
      - unodc_szr
sources:
