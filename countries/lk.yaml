name: Sri Lanka
region: Asia
iso_numeric: 144
recreational: illegal
medical: limited
updated: '2026-10-28'
summary: >-
  Illegal, but licensed Ayurvedic practitioners may dispense cannabis preparations. A separate
  export-only cultivation scheme began licensing foreign investors in 2025.
scores:
  possession: 1
  cultivation: 1
  enforcement: 1
  sharing: 0
