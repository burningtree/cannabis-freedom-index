segments:
  possession:
    text: >-
      The Poisons, Opium and Dangerous Drugs Ordinance prohibits possessing, consuming or using any
      part or preparation of the hemp plant. Cannabis (ganja) accounts for the majority of drug
      arrests in Sri Lanka; small-quantity cases are usually dealt with in magistrates' courts by a
      fine, with prison possible.
    sources:
      - law
      - leap
  cultivation:
    text: Planting or cultivating the hemp plant is prohibited.
    sources:
      - law
  enforcement:
    text: >-
      High arrest numbers and mostly fines for small amounts; repeated amendments in 2023–2026 have
      focused on tougher enforcement against trafficking.
    sources:
      - leap
      - law
  sharing:
    text: Sale and distribution are offences with heavier penalties.
    sources:
      - law
  consumption:
    text: Consumption is prohibited by the Ordinance.
    sources:
      - law
  access:
    text: >-
      No adult-use source. The Ordinance carves out exceptions under which licensed Ayurvedic
      practitioners may obtain and dispense cannabis in traditional preparations.
    sources:
      - law
context:
  production:
    text: >-
      The state supplies cannabis to the Ayurvedic sector. In August 2025 seven foreign investors
      received six-month licences to grow cannabis on Board of Investment land, on condition that
      the whole crop is exported.
    sources:
      - leap
      - dm25
  products:
    text: Traditional Ayurvedic preparations containing cannabis.
    sources:
      - law
  medical:
    text: >-
      Available only within the Ayurvedic system, through licensed practitioners and the state
      Ayurvedic drugs corporation.
    sources:
      - law
  consequences:
    text: A conviction is a criminal record.
    sources:
      - law
  planting:
    seeds: licensed
    seeds_trade: regulated
    clones: licensed
    clones_trade: regulated
    text: >-
      Section 27 of the Poisons, Opium and Dangerous Drugs Ordinance forbids anyone, without a
      licence from the Minister, to sow, plant, grow or hold a hemp plant, or to collect or
      hold its seeds, leaves, flowers or any other part. Section 28 bans bringing the plant or
      its seeds into or out of the country. The copy read is an older consolidated text.
    sources:
      - leap
      - ord
