segments:
  possession:
    text: >-
      The Poisons, Opium and Dangerous Drugs Ordinance bans possessing cannabis resin and
      preparations known as bhang, hashish or ganja without a licence, and section 54A adds
      quantity bands for possession as well as trafficking.[@ord2024] Under those bands, less than
      1 kg brings a fine of LKR 20,000–50,000 and/or one to two years in prison; 1 kg to under 5 kg
      brings LKR 50,000–100,000 and/or two to five years; 5 kg to under 100 kg brings
      LKR 100,000–200,000 and/or five to ten years; and 100 kg or more brings LKR 200,000–500,000
      and/or ten to fifteen years.[@ord2024] Small possession can also be charged under the
      general penalty in section 78(5), which allows a magistrate's fine of LKR 1,000–10,000 and/or
      up to five years; the sources read do not settle how often each route is used.[@ord2024]
      Cannabis accounts for the largest share of drug arrests, and small-quantity cases usually end
      in a magistrate's fine.[@nddcb24]
    sources:
      - ord2024
      - nddcb24
    currency: LKR
    penalties:
      - label: Under 1 kg
        treatment: criminal
        term: Possession
        prison_min: 1 year
        prison: 2 years
        fine_min: 20000
        fine: 50000
        note: Section 54A quantity band; fine and/or prison
      - label: 1 kg to under 5 kg
        treatment: criminal
        term: Possession
        prison_min: 2 years
        prison: 5 years
        fine_min: 50000
        fine: 100000
        note: Section 54A quantity band; fine and/or prison
      - label: 5 kg to under 100 kg
        treatment: criminal
        term: Possession
        prison_min: 5 years
        prison: 10 years
        fine_min: 100000
        fine: 200000
        note: Section 54A quantity band; fine and/or prison
      - label: 100 kg or more
        treatment: criminal
        term: Possession
        prison_min: 10 years
        prison: 15 years
        fine_min: 200000
        fine: 500000
        note: Section 54A quantity band; fine and/or prison
      - label: General penalty, section 78(5)
        treatment: criminal
        term: Possession
        prison: 5 years
        fine_min: 1000
        fine: 10000
        note: >-
          Alternative charge before a magistrate; the High Court can impose six months to seven
          years and LKR 10,000–25,000
  cultivation:
    text: >-
      Section 27 forbids sowing, planting, cultivating, obtaining or possessing a hemp plant, or
      collecting or holding its seeds, pods, leaves, flowers or any other part, without the
      Minister's licence.[@ord2024] "Hemp plant" means Cannabis sativa L., with no THC threshold
      separating hemp from drug cannabis.[@ord2024] Cultivation is ordinarily punished under the
      general penalty in section 78(5): a magistrate may impose LKR 1,000–10,000 and/or up to five
      years, and the High Court LKR 10,000–25,000 and/or six months to seven years.[@ord2024] No
      quantity bands apply to cultivation itself.[@ord2024]
    sources:
      - ord2024
    currency: LKR
    penalties:
      - label: Cultivation before a magistrate
        treatment: criminal
        term: Cultivation
        prison: 5 years
        fine_min: 1000
        fine: 10000
        note: Fine and/or prison under section 78(5)
      - label: Cultivation before the High Court
        treatment: criminal
        term: Cultivation
        prison_min: 6 months
        prison: 7 years
        fine_min: 10000
        fine: 25000
        note: Fine and/or prison under section 78(5)
  enforcement:
    text: >-
      Drug enforcement is intense and built on arrest numbers rather than court outcomes. Police
      reported 228,450 drug arrests in 2024, of whom 75,602, or 33.1 per cent, were for cannabis,
      just ahead of heroin.[@nddcb24] Operation Yukthiya, launched in December 2023, had arrested
      more than 100,000 people by May 2024; Human Rights Watch reported many arrests without
      apparent evidence and hundreds of people sent to military-run rehabilitation centres.[@hrw25]
      The police narcotics bureau seized 8,359 kg of cannabis in 2024 and 17,189 kg in 2025.[@derana26]
    sources:
      - nddcb24
      - hrw25
      - derana26
  sharing:
    text: >-
      Sale, supply, transport and distribution are offences under sections 29 and 54, and section
      54A treats trafficking by quantity.[@ord2024] The same bands as possession apply: under 1 kg
      brings one to two years and/or LKR 20,000–50,000, rising to ten to fifteen years and/or
      LKR 200,000–500,000 at 100 kg or more.[@ord2024] Import and export are absolutely prohibited
      by section 28, with no licence exception.[@ord2024]
    sources:
      - ord2024
    currency: LKR
    penalties:
      - label: Under 1 kg
        treatment: criminal
        term: Trafficking
        prison_min: 1 year
        prison: 2 years
        fine_min: 20000
        fine: 50000
        note: Section 54A quantity band; fine and/or prison
      - label: 1 kg to under 5 kg
        treatment: criminal
        term: Trafficking
        prison_min: 2 years
        prison: 5 years
        fine_min: 50000
        fine: 100000
        note: Section 54A quantity band; fine and/or prison
      - label: 5 kg to under 100 kg
        treatment: criminal
        term: Trafficking
        prison_min: 5 years
        prison: 10 years
        fine_min: 100000
        fine: 200000
        note: Section 54A quantity band; fine and/or prison
      - label: 100 kg or more
        treatment: criminal
        term: Trafficking
        prison_min: 10 years
        prison: 15 years
        fine_min: 200000
        fine: 500000
        note: Section 54A quantity band; fine and/or prison
  consumption:
    text: >-
      Section 29 bans consuming or using hemp resin or preparations known as bhang, hashish or
      ganja without a licence, and section 52(2) bans knowing consumption of a dangerous drug
      outside medical supply.[@ord2024] There is no quantity threshold, and the general penalty in
      section 78(5) applies: LKR 1,000–10,000 and/or up to five years before a magistrate.[@ord2024]
    sources:
      - ord2024
    currency: LKR
    penalties:
      - label: Consumption
        treatment: criminal
        term: Consumption
        prison: 5 years
        fine_min: 1000
        fine: 10000
        note: >-
          Magistrate's court; the High Court can impose six months to seven years and
          LKR 10,000–25,000
  access:
    text: >-
      There is no adult-use source. The Ordinance bans importing the plant and requires the
      Minister's licence to possess or use its preparations; it saves only galenical preparations
      of hemp, extract and tincture, under its dangerous-drugs chapter, and hemp rope and
      fibre.[@ord2024] Registered Ayurvedic practitioners may obtain and dispense cannabis
      preparations within the Ayurvedic system, but there is no allopathic medical-cannabis
      registry or domestic CBD market.[@morning24]
    sources:
      - ord2024
      - morning24
context:
  recreational:
    text: >-
      All recreational use is prohibited: the Ordinance bans possessing, consuming or using any
      part or preparation of the hemp plant, though small-quantity cases usually end in a
      magistrate's fine.[@ord2024] Licensed Ayurvedic practitioners may dispense cannabis
      preparations within the medical system, and the 2025 export licences do not legalise domestic
      use.[@morning24,dm25]
    sources:
      - ord2024
      - morning24
      - dm25
  production:
    status: medical
    text: >-
      The state supplies cannabis to the Ayurvedic sector, largely from seized stock.[@morning24]
      A Katunayake export pilot was approved in May 2023, and in February 2024 the Cabinet approved cultivation and export for medicinal purposes. In
      August 2025 seven foreign investors received six-month licences to grow on 64 acres at
      Mirigama, with a US$2 million bond and a US$5 million minimum investment, on condition that
      the whole crop is
      [exported](/history/sri-lanka-export-cultivation-2025/).[@economynext24,dm25] The government
      said in November 2025 that the next phase would be open to local investors, with cultivation
      expected in 2026; no confirmed planting or export was found by late October 2026.[@dm25b]
    sources:
      - morning24
      - economynext24
      - dm25
      - dm25b
  medical:
    text: >-
      Treatment is available only within the Ayurvedic system, through registered practitioners and
      the state Ayurvedic Drugs Corporation; traditional Ayurvedic preparations contain
      cannabis.[@morning24] Only registered Ayurvedic institutions and pharmacies may possess these
      medicines, prescriptions are required, and police can enforce illegal possession.[@morning24]
      There is no allopathic medical-cannabis registry, no domestic pharmacy flower or oil sales,
      and the 2025 export licences are export-only.[@dm25] The legal basis dates from the
      [Ayurveda Act of 1961](/history/sri-lanka-ayurveda-act-1961/).[@morning24]
    sources:
      - morning24
      - dm25
  consequences:
    text: >-
      A conviction is a criminal record, and people arrested in the Yukthiya crackdown could be
      sent to rehabilitation centres rather than court.[@hrw25] Human Rights Watch reported
      hundreds of people held in military-run centres and allegations of torture and ill-treatment,
      while the government presented the campaign as a response to drug crime.[@hrw25]
    sources:
      - hrw25
  planting:
    seeds: licensed
    seeds_trade: regulated
    clones: licensed
    clones_trade: regulated
    text: >-
      Section 27 forbids sowing, planting, growing, obtaining or holding a hemp plant, or
      collecting or holding its seeds, pods, leaves, flowers or any other part, without the
      Minister's licence.[@ord2024] Section 28 bans bringing the plant or its seeds into or out of
      the country, with no licence exception.[@ord2024] There is no separate seed or clone
      market.[@ord2024]
    sources:
      - ord2024
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited.[@ord2024] The Ayurvedic channel is a
      practitioner-and-pharmacy route, not a members' club.[@morning24]
    sources:
      - ord2024
      - morning24
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. The Ordinance prohibits possessing,
      consuming or using any part or preparation of the hemp plant; small-quantity cases are usually
      dealt with in magistrates' courts by a fine, but a conviction can still bring
      prison.[@ord2024] The Ayurvedic route is for registered practitioners and patients, not
      visitors.[@morning24]
    sources:
      - ord2024
      - morning24
  driving:
    status: consumption
    text: >-
      Motor Traffic Act section 151 prohibits driving on a road after consuming alcohol or any
      drug.[@motortraffic] A suspected driver can be examined by a Government medical officer, and
      refusal of the examination creates a rebuttable presumption of consumption; the Act permits
      regulations on drug concentrations, but no operative THC cutoff was established in this
      review.[@motortraffic] The ordinary offence carries LKR 25,000–30,000 and/or up to three
      months, plus licence suspension up to twelve months; carrying passengers for payment brings
      up to six months and licence cancellation.[@traffic2019] Causing death carries
      LKR 100,000–150,000 and/or two to ten years, and injury or grievous injury brings lower
      bands.[@motortraffic] Consumption and demonstrated impairment are not interchangeable
      evidential standards.[@motortraffic]
    sources:
      - motortraffic
      - traffic2019
  black_market:
    text: >-
      The government reported 8,360 kg of herbal cannabis seized in 2024, against 10,220 kg in
      2023, and 292 kg of resin in 2024, against 274 kg in 2023.[@unodc_szr] The police narcotics
      bureau counted 8,359 kg in 2024 and 17,193 kg in 2025, while local reporting separates local
      cannabis from Kerala cannabis and gives a higher combined total for 2024.[@derana26,sunday24]
      The UN publishes kilogram equivalents, and countries count seizures differently, so the
      figures are not directly comparable.[@unodc_szr] Cannabis is grown illicitly in several
      provinces and smuggled from India, and the record 2026 haul at Bandaranaike airport was kush
      brought from Thailand.[@scmp26]
    sources:
      - unodc_szr
      - derana26
      - sunday24
      - scmp26
  arrests:
    text: >-
      The National Dangerous Drugs Control Board counted 228,450 drug arrests in 2024, of whom
      75,602, or 33.1 per cent, were for cannabis.[@nddcb24] It counted 262,321 drug arrests in 2025,
      of whom 76,058, or 29 per cent, were for cannabis, and 121,266 drug arrests in January–May
      2026, of whom 27,833 were for cannabis.[@nddcb25,nddcb26] The board recorded 17,193 kg of
      cannabis seized in 2025, against 8,359 kg in 2024.[@nddcb25] The figures cover all drugs unless
      stated, and the cannabis share is of arrests, not convictions.[@nddcb24]
    sources:
      - nddcb24
      - nddcb25
      - nddcb26
  death_penalty:
    text: >-
      No cannabis offence carries death. Section 54A reserves death or life for manufacturing
      heroin, cocaine, morphine or opium, and the 2026 high-seas provision repeats that limit;
      cannabis trafficking tops out at fifteen years.[@ord2024,act2026] A 2026 presidential council
      discussed the death penalty for drug offences generally but took no decision and did not
      extend it to cannabis.[@derana_death26]
    sources:
      - ord2024
      - act2026
      - derana_death26
  hemp:
    status: none
    text: >-
      There is no separate industrial-hemp regime and no THC ceiling. "Hemp plant" means Cannabis
      sativa L., and growing it requires a section 27 Minister's licence.[@ord2024] Section 30
      saves only galenical extract or tincture under the dangerous-drugs chapter, hemp rope and
      cordage, and hemp fibre; hemp flower, seed for planting, CBD extract and hemp food or
      cosmetics have no general exemption.[@ord2024] A 2023 Ayurveda amendment created
      registration for herbal cultivations and gardens but does not expressly name
      cannabis.[@ayurveda2023]
    sources:
      - ord2024
      - ayurveda2023
  culture:
    text: >-
      Cannabis sits in Sri Lanka's medicinal rather than recreational culture. It is part of the
      Ayurvedic materia medica, and registered practitioners may prescribe preparations made from
      it, with the state Ayurvedic Drugs Corporation supplying them.[@morning24] The plant also
      travelled through the island's colonial opium and ganja trade, and possession became a
      criminal matter under the [1929 ordinance](/history/sri-lanka-dangerous-drugs-enactment-1929/).[@ord2024]
      Today there is little public cannabis culture: use is hidden, and most arrests are of small
      users.[@nddcb24]
    sources:
      - morning24
      - ord2024
      - nddcb24
