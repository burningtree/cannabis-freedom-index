name: Sri Lanka
region: Asia
iso_numeric: 144
recreational: illegal
medical: limited
updated: 2026-10-13
summary: Illegal, but licensed Ayurvedic practitioners may legally dispense cannabis preparations.
scores:
  possession: 1
  cultivation: 1
  enforcement: 1
  sharing: 0
  consumption: 1
  access: 1
segments:
  possession:
    text: >-
      The Poisons, Opium and Dangerous Drugs Ordinance prohibits possessing, consuming or using any
      part or preparation of the hemp plant. Cannabis (ganja) accounts for the majority of drug
      arrests in Sri Lanka; small-quantity cases are usually dealt with in magistrates' courts by a
      fine, with prison possible.
    sources:
      - law
      - leap
  cultivation:
    text: >-
      Section 27 of the Poisons, Opium and Dangerous Drugs Ordinance forbids anyone, without a
      licence from the Minister, to sow, plant, cultivate, obtain or possess the hemp plant, or
      to collect or hold its seeds, leaves, flowers or any other part.
    sources:
      - ord
  enforcement:
    text: >-
      High arrest numbers and mostly fines for small amounts; repeated amendments in 2023–2026 have
      focused on tougher enforcement against trafficking.
    sources:
      - leap
      - law
  sharing:
    text: Sale and distribution are offences with heavier penalties.
    sources:
      - law
  consumption:
    text: >-
      Section 29 of the Ordinance forbids anyone without the Minister's licence to consume or use
      the resin of the hemp plant or its preparations known as bhang, hashish or ganja.
    sources:
      - ord
  access:
    text: >-
      No adult-use source. The Ordinance bans importing the plant and requires the Minister's
      licence to possess or use its preparations; it saves only galenical preparations of hemp
      (extract and tincture) under its dangerous-drugs chapter, and hemp rope and fibre.
    sources:
      - ord
context:
  production:
    text: >-
      The state supplies cannabis to the Ayurvedic sector. In August 2025 seven foreign investors
      received six-month licences to grow cannabis on Board of Investment land, on condition that
      the whole crop is exported.
    sources:
      - leap
      - dm25
  products:
    text: Traditional Ayurvedic preparations containing cannabis.
    sources:
      - law
  medical:
    text: >-
      Available only within the Ayurvedic system, through licensed practitioners and the state
      Ayurvedic drugs corporation.
    sources:
      - law
  consequences:
    text: A conviction is a criminal record.
    sources:
      - law
  planting:
    seeds: licensed
    seeds_trade: regulated
    clones: licensed
    clones_trade: regulated
    text: >-
      Section 27 of the Poisons, Opium and Dangerous Drugs Ordinance forbids anyone, without a
      licence from the Minister, to sow, plant, grow or hold a hemp plant, or to collect or
      hold its seeds, leaves, flowers or any other part. Section 28 bans bringing the plant or
      its seeds into or out of the country. The copy read is an older consolidated text.
    sources:
      - leap
      - ord
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited.
    sources:
      - law
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. The Poisons, Opium and Dangerous Drugs
      Ordinance prohibits possessing, consuming or using any part or preparation of the hemp
      plant; small-quantity cases are usually dealt with in magistrates' courts by a fine.
    sources:
      - law
      - leap
  driving:
    status: consumption
    text: >-
      Motor Traffic Act section 151 prohibits driving on a road after consuming alcohol
      or any drug. Suspected drug use can lead to examination by a Government medical
      officer; the officer's report or refusal of the examination creates a rebuttable
      evidential rule about consumption. The Act permits regulations on drug concentrations,
      but no operative THC cutoff was established in this review. Under the 2019 amendment,
      the ordinary section 151(1) offence carries LKR25,000–30,000 or up to three months'
      imprisonment or both, plus licence suspension up to twelve months. Driving an omnibus
      or other vehicle carrying passengers for payment after consumption carries the same
      fine range or up to six months or both, plus licence cancellation. Sri Lanka Police
      launched a mobile laboratory programme for bus drivers and conductors in January 2026.
      Consumption, positive screening and demonstrated impairment must not be treated as
      interchangeable evidential standards.
    sources:
      - motortraffic
      - traffic2019
      - mobiletesting
  black_market:
    text: >-
      Figures reported by the government to the UN drugs office record 8,360 kg of herbal
      cannabis seized in 2024, against 10,220 kg in 2023, and 292 kg of cannabis resin
      seized in 2024, against 274 kg in 2023. The UN publishes them as kilogram
      equivalents, and countries count seizures differently, so the figures are not
      comparable across borders.
    sources:
      - unodc_szr
  arrests:
    text: >-
      Cannabis accounts for the largest share of drug arrests. The National Dangerous
      Drugs Control Board counted 74,444 people arrested for drug offences in the first
      half of 2023, of whom 32,908, or 44 per cent, were arrested for cannabis and 30,804
      for heroin. The police narcotics bureau reported seizing 8,359 kg of cannabis in
      2024 and 17,189 kg in 2025.
    sources:
      - nddcb23
      - derana26
