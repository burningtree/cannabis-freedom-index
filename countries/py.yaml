segments:
  possession:
    text: >-
      Article 30 of the drug law exempts from punishment a person holding a small amount exclusively
      for personal use, with 10 g of cannabis as the guideline. It is not automatic: a judge,
      advised by a forensic doctor, decides whether it was personal use, so arrest and prosecution
      remain possible.
    sources:
      - iba
  cultivation:
    text: >-
      Illegal for personal use, and enforced — in 2024 a woman in her sixties was jailed over two
      plants. A law allows registered patients to grow for medicinal use, but advocates say it has
      barely been implemented.
    sources:
      - ln
      - uh
  enforcement:
    text: >-
      The personal-use exemption depends on a judge, and small growers are still imprisoned.
      Trafficking carries long sentences.
    sources:
      - ln
      - iba
  sharing:
    text: Supply is trafficking under the drug law.
    sources:
      - iba
  consumption:
    text: Personal use within the exemption is not punished; public use risks arrest.
    sources:
      - iba
  access:
    text: >-
      No adult-use source, despite Paraguay being South America's largest illicit producer.
      Registered patients can obtain cannabis-derived medicines on prescription.
    sources:
      - iba
      - uh
context:
  production:
    text: The state licenses a small number of companies to produce medical cannabis and hemp.
    sources:
      - iba
  products:
    text: Prescription cannabis-derived medicines, mainly oils.
    sources:
      - iba
  medical:
    text: >-
      Law 6007 of 2017 created a national programme: patients must be on a national registry to
      receive cannabis-derived products. A later law decriminalised home growing for patients, but
      access remains poor in practice.
    sources:
      - iba
      - ferrere
  consequences:
    text: No record if the exemption is applied; pre-trial detention is the real risk.
    sources:
      - ln
  planting:
    seeds: licensed
    seeds_trade: regulated
    clones: licensed
    clones_trade: regulated
    text: >-
      Decree 2725 of 2019 regulates importing propagation material for industrial hemp, along
      with its cultivation, processing and sale, all under authorisation from the agriculture
      ministry working with the anti-drug secretariat and the seed service. It covers non-
      psychoactive cannabis only.
    sources:
      - d2725
  black_market:
    text: >-
      Paraguay grows cannabis mainly for export: the anti-drug agency says most production is
      aimed at the Brazilian market and run by large criminal organisations. Between August
      2023 and April 2026 the agency reported destroying close to 21 million kilos of
      marijuana, counting both seized product and crops in the field, a loss it valued at 629
      million dollars at domestic prices. That included more than 1,913 tonnes of processed
      marijuana and 6,322 hectares of plantations, with the border department of Amambay far
      ahead (3,177 hectares), followed by Canindeyú and Caaguazú. Much of the eradication is
      done jointly with Brazil's federal police.
    sources:
      - ln26
  clubs:
    status: tolerated
    text: >-
      No law provides for clubs, but one operates in the open. In January 2023 the Cooperativa
      de Cannabis del Paraguay set up a Club de Cannabis to link its growers in San Pedro
      directly with registered users: members must be adults and sign up beforehand, on the
      health regulator's own patient form, and receive medicinal oil and ointment; the
      cooperative said it also registers people buying flower for recreational use. It signed
      up 431 people in a single morning in an Asunción square and said more than 3,000 forms
      had been filled in before. No action by the authorities against it was reported, and in
      April 2025 the Club de Cannabis del Paraguay was co-organising a public 4/20 gathering
      in Asunción ahead of a congressional hearing on a cannabis regulation bill.
    sources:
      - abc23
      - abc25
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. British travel advice says there are
      severe penalties for trafficking and possession of illegal drugs: a person caught may
      get a prison sentence, without bail, and prison standards are poor.
    sources:
      - iba
      - uh
      - fcdo
