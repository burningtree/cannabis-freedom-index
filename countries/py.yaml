segments:
  possession:
    text: >-
      Article 30 of the drug law exempts from punishment a person holding a small amount exclusively
      for personal use, with 10 g of cannabis as the guideline. It is not automatic: a judge,
      advised by a forensic doctor, decides whether it was personal use, so arrest and prosecution
      remain possible.
    sources:
      - iba
  cultivation:
    text: >-
      Illegal for personal use, and enforced — in 2024 a woman in her sixties was jailed over two
      plants. A law allows registered patients to grow for medicinal use, but advocates say it has
      barely been implemented.
    sources:
      - ln
      - uh
  enforcement:
    text: >-
      The personal-use exemption depends on a judge, and small growers are still imprisoned.
      Trafficking carries long sentences.
    sources:
      - ln
      - iba
  sharing:
    text: Supply is trafficking under the drug law.
    sources:
      - iba
  consumption:
    text: Personal use within the exemption is not punished; public use risks arrest.
    sources:
      - iba
  access:
    text: >-
      No adult-use source, despite Paraguay being South America's largest illicit producer.
      Registered patients can obtain cannabis-derived medicines on prescription.
    sources:
      - iba
      - uh
context:
  production:
    text: The state licenses a small number of companies to produce medical cannabis and hemp.
    sources:
      - iba
  products:
    text: Prescription cannabis-derived medicines, mainly oils.
    sources:
      - iba
  medical:
    text: >-
      Law 6007 of 2017 created a national programme: patients must be on a national registry to
      receive cannabis-derived products. A later law decriminalised home growing for patients, but
      access remains poor in practice.
    sources:
      - iba
      - ferrere
  consequences:
    text: No record if the exemption is applied; pre-trial detention is the real risk.
    sources:
      - ln
  planting:
    seeds: licensed
    seeds_trade: regulated
    clones: licensed
    clones_trade: regulated
    text: >-
      Decree 2725 of 2019 regulates importing propagation material for industrial hemp, along
      with its cultivation, processing and sale, all under authorisation from the agriculture
      ministry working with the anti-drug secretariat and the seed service. It covers non-
      psychoactive cannabis only.
    sources:
      - d2725
