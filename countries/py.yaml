name: Paraguay
region: South America
iso_numeric: 600
recreational: decriminalised
medical: limited
updated: '2026-10-26'
summary: >-
  Up to 10 g exclusively for personal use may be exempt from punishment, subject to judicial
  assessment. A December 2025 medical THC/CBD pilot regulates specialist prescriptions and
  authorised dispensing; patient home growing remains prohibited.
scores:
  possession: 2
  cultivation: 1
  enforcement: 3
  sharing: 1
  consumption: 2
  access: 1
segments:
  possession:
    text: >-
      Article 30 of the drug law exempts from punishment a person holding a small amount exclusively
      for personal use, with 10 g of cannabis as the guideline.[@iba] It is not automatic: a judge,
      advised by a forensic doctor, decides whether it was personal use, so arrest and prosecution
      remain possible.[@iba]
    sources:
      - iba
  cultivation:
    text: >-
      Illegal for personal use, and enforced — in 2024 a woman in her sixties was jailed over two
      plants.[@ln] A bill letting patients with a medical certificate grow at home was passed by
      Congress in August 2020[@uh] and vetoed by the president that September;[@lnveto] the Senate voted for
      it again in November 2020,[@lnsen] and in April 2022 it was still pending in the Chamber of
      Deputies. No report that it took effect was found.[@uh]
    sources:
      - ln
      - uh
      - lnveto
      - lnsen
  enforcement:
    text: >-
      The personal-use exemption depends on a judge,[@iba] and small growers are still imprisoned.[@ln]
      Trafficking carries long sentences.[@iba]
    sources:
      - ln
      - iba
  sharing:
    text: Supply is trafficking under the drug law.[@iba]
    sources:
      - iba
  consumption:
    text: Personal use within the exemption is not punished; public use risks arrest.[@iba]
    sources:
      - iba
  access:
    text: >-
      There is no adult-use retail route.[@iba] Under Resolution 488/2025, registered patients can
      receive medicinal products combining THC, CBD or other cannabinoids through an exceptional
      temporary pilot: a PROINCUMEC-registered specialist prescribes on a quadruplicate form, and
      authorised pharmacies/dispensaries supply under traceability controls. This legal route does
      not establish that particular high-THC products are registered, stocked or widely
      available.[@pilot488,pilotnews]
    sources:
      - iba
      - pilot488
      - pilotnews
words:
  - { word: Faso, lang: Paraguayan Spanish, meaning: "Lunfardo slang for a marijuana cigarette", sources: [wiktionary-faso] }
  - { word: Porro, lang: Paraguayan Spanish, meaning: "a marijuana cigarette (joint, spliff, blunt)", sources: [wiktionary-porro] }
  - { word: Hierba, lang: Paraguayan Spanish, meaning: "literally grass; slang for marijuana", sources: [wiktionary-yerba] }
context:
  recreational:
    text: >-
      There is no legal recreational supply. Up to 10 g for exclusively personal use is exempt
      from punishment, but a judge advised by a forensic doctor decides, so arrest and
      prosecution remain possible — and home growing is illegal and enforced.[@iba,ln]
      Personal use is not punished within the exemption, though public use risks arrest;
      supply is trafficking.[@iba]
    sources:
      - iba
      - ln
  culture:
    text: >-
      Paraguay is the region's growing house: an estimated 6,000 to 8,000 hectares, mostly in
      Amambay and Canindeyú, with 77% of the harvest going to Brazil.[@iba,fer22,lnsen,ln21,unav21]
      The pressed form it travels in is [brick weed](/culture/traditions/brick-weed/).
    sources:
      - iba
      - fer22
      - lnsen
      - ln21
      - unav21
  production:
    status: medical
    text: >-
      The medical pilot requires licensed production, approved industrial plans, certified seed and
      traceability from seed to final product. Participation and product information must be
      notified to DINAVISA; a production licence alone does not prove operating cultivation or
      finished output.[@pilot488] Twelve pharmaceutical firms were licensed to produce medical
      cannabis under a cap of thirteen, lifted in 2022; in 2022 patients said none was growing in
      the country.[@fer22, uh] Hemp has been authorised since October 2019, and a Paraguayan firm began
      exporting hemp foods in 2021.[@ln21] The illicit crop dwarfs both: an estimated 6,000 to 8,000
      hectares, mostly in Amambay and Canindeyú, with 77% of the harvest going to
      Brazil.[@iba,fer22,lnsen,ln21,unav21]
    sources:
      - pilot488
      - iba
      - fer22
      - uh
      - lnsen
      - ln21
      - unav21
  medical:
    text: >-
      Law 6007 created PROINCUMEC and its patient registry.[@ferrere] Resolution 488/2025, effective
      on signature on 19 December 2025 under Health Ministry Resolution 902/2025, sets up a
      two-year exceptional pilot for medicinal combinations of THC, CBD and other cannabinoids.[@pilot488]
      Prescribers must be registered specialists and patients must also register; the rules cover
      specified treatment-resistant symptoms and other justified specialist indications, with a
      quadruplicate prescription and follow-up.[@pilot488] The April 2022 count of three doctors and
      forty patients is historical.[@uh] Patient home cultivation was vetoed in 2020.[@lnveto] The pilot covers
      medicinal products with variable proportions of THC, CBD and other cannabinoids, made by
      licensed producers and supplied under specialist prescription and traceability. These pilot
      products have an exceptional registration regime; the rules do not demonstrate named
      products currently in stock.[@pilot488]
    sources:
      - ferrere
      - pilot488
      - uh
      - lnveto
  consequences:
    text: No record if the exemption is applied; pre-trial detention is the real risk.[@ln]
    sources:
      - ln
  hemp:
    status: standard
    text: >-
      Industrial hemp has been authorised since October 2019 under Decree 2725, covering import of
      propagation material, cultivation, processing and sale under agriculture-ministry
      authorisation.[@d2725, iba] A Paraguayan firm began exporting hemp foods in 2021.[@ln21]
    sources:
      - d2725
      - iba
      - ln21
  arrests:
    text: >-
      No arrest totals were found in reachable sources. Enforcement visibly reaches small growers:
      in 2024 a woman in her sixties was jailed over two plants.[@ln] The weight of enforcement
      falls on the crop in the field (see black market).[@ln26]
    sources:
      - ln
      - ln26
  planting:
    seeds: licensed
    seeds_trade: regulated
    clones: licensed
    clones_trade: regulated
    text: >-
      Decree 2725 of 2019 regulates importing propagation material for industrial hemp, along
      with its cultivation, processing and sale, all under authorisation from the agriculture
      ministry working with the anti-drug secretariat and the seed service.[@d2725] It covers non-
      psychoactive cannabis only.[@d2725]
    sources:
      - d2725
  black_market:
    text: >-
      Paraguay grows cannabis mainly for export: the anti-drug agency says most production is
      aimed at the Brazilian market and run by large criminal organisations.[@ln26] Between August
      2023 and April 2026 the agency reported destroying close to 21 million kilos of
      marijuana, counting both seized product and crops in the field, a loss it valued at 629
      million dollars at domestic prices.[@ln26] That included more than 1,913 tonnes of processed
      marijuana and 6,322 hectares of plantations, with the border department of Amambay far
      ahead (3,177 hectares), followed by Canindeyú and Caaguazú.[@ln26] Much of the eradication is
      done jointly with Brazil's federal police.[@ln26]
    sources:
      - ln26
  clubs:
    status: tolerated
    text: >-
      No law provides for clubs, but one operates in the open. In January 2023 the Cooperativa
      de Cannabis del Paraguay set up a Club de Cannabis to link its growers in San Pedro
      directly with registered users: members must be adults and sign up beforehand, on the
      health regulator's own patient form, and receive medicinal oil and ointment; the
      cooperative said it also registers people buying flower for recreational use.[@abc23] It signed
      up 431 people in a single morning in an Asunción square and said more than 3,000 forms
      had been filled in before.[@abc23] No action by the authorities against it was reported, and in
      April 2025 the Club de Cannabis del Paraguay was co-organising a public 4/20 gathering
      in Asunción ahead of a congressional hearing on a cannabis regulation bill.[@abc25]
    sources:
      - abc23
      - abc25
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. Article 30 of the drug law exempts from
      punishment a person holding a small amount exclusively for personal use, with 10 g of
      cannabis as the guideline, but a judge advised by a forensic doctor decides whether it was
      personal use.[@iba]
    sources:
      - iba
  driving:
    status: consumption
    text: >-
      National Traffic Law article 66(a), as amended by Law 6868, prohibits driving
      after consuming narcotics or medicines that diminish driving aptitude, whatever
      the concentration per litre of blood.[@traffic6868] This wording does not establish a particular
      THC detection cutoff.[@traffic6868] Article 113(g), amended by Law 6842, separately classifies
      laboratory-established intoxication from drugs altering normal driving capacity
      as a very serious administrative offence; article 113(h) covers test refusal.[@traffic6842]
      The published Law 5016 sets very serious fines at eleven to twenty legal minimum
      daily wages, with points or disqualification where applicable; this is not a fixed
      guaraní tariff.[@traffic5016] Articles 106–107 permit retention/removal of the vehicle and require
      authorised intoxication tests.[@traffic5016] Criminal unsafe-driving provisions can apply in
      addition; the 2014 amendment to Penal Code article 217 specifies up to two years'
      imprisonment or a fine.[@traffic5016] Municipal enforcement and current licence-ban periods
      remain to be checked rather than inferred from the alcohol limits.[@traffic5016]
    sources:
      - traffic5016
      - traffic6868
      - traffic6842
