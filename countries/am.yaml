segments:
  possession:
    text: >-
      Since 2008 possessing a small amount for personal use without intent to sell is an
      administrative offence, not a crime. The fine is heavy — 200 to 400 times the minimum wage
      unit, roughly US$500–1,000 — but there is no prison and the fine is waived for people who
      voluntarily seek treatment.
    sources:
      - hca
      - iwpr
  cultivation:
    text: >-
      Growing cannabis is a criminal offence. Industrial hemp cultivation is permitted under
      licence.
    sources:
      - hca
      - tb
  enforcement:
    text: >-
      Users face a large fine instead of the two months in jail that applied before 2008. Sale and
      cultivation for sale remain crimes with prison.
    sources:
      - hca
      - iwpr
  sharing:
    text: Supply is a crime with three to seven years or more.
    sources:
      - iwpr
  consumption:
    text: >-
      Use without a prescription is handled under the same administrative offence as small
      possession.
    sources:
      - hca
  access:
    text: No legal source.
    sources:
      - tb
context:
  production:
    text: Industrial hemp only.
    sources:
      - tb
  products:
    text: No legal THC products.
    sources:
      - tb
  medical:
    text: No working medical cannabis programme.
    sources:
      - tb
  consequences:
    text: >-
      An administrative offence is not a criminal record, but users may be placed on a narcological
      register.
    sources:
      - hca
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited.
    sources:
      - hca
      - tb
      - iwpr
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. British travel advice says possessing,
      using or smuggling illegal drugs, including cannabis, can bring heavy fines and a long
      jail sentence, also in transit, and that smuggling carries 4 to 10 years in prison. It
      adds that marijuana, CBD and THC products are all illegal to use, possess or trade, and
      that a person can be prosecuted for having them even when they were prescribed for
      medical purposes.
    sources:
      - tb
      - fcdo
