name: Armenia
region: Asia
iso_numeric: 51
recreational: decriminalised
medical: none
updated: '2026-10-28'
summary: >-
  Small possession and use are administrative offences with heavy fines, doubled in May 2026;
  sale and large-scale growing are criminal. Industrial hemp is licensed at 0.3% THC, while
  psychoactive cannabis has no medical route.
scores:
  possession: 3
  cultivation: 1
  enforcement: 3
  sharing: 1
  consumption: 1
  access: 0
segments:
  possession:
    text: >-
      Since 2008 possessing a small amount for personal use without intent to sell has been an
      administrative offence, not a crime.[@admin] The threshold is 2.5 g of dried herbal
      cannabis; the fine was 200,000 to 400,000 drams.[@admin,amounts] From 22 May 2026 the fine
      is 400,000 to 800,000 drams, and 800,000 to 1,100,000 for a repeat within a year.[@admin2026]
      Above 2.5 g, possession becomes criminal: up to two years for 2.5 to 12.5 g, one to four
      years for 12.5 to 62.5 g, and three to six years above 62.5 g.[@criminal] A person who
      voluntarily surrenders the drug is exempt from administrative liability.[@admin]
    sources:
      - admin
      - admin2026
      - amounts
      - criminal
    currency: AMD
    penalties:
      - upto: 2.5 g
        treatment: civil
        term: Small amount, Article 44.1
        fine_min: 400000
        fine: 800000
        note: Repeat within a year 800,000–1,100,000 drams; voluntary surrender exempts
      - over: 2.5 g
        upto: 12.5 g
        treatment: criminal
        term: Article 396(1)
        prison: 2 years
        note: Fine, community work, restriction of liberty or short-term imprisonment also available
      - over: 12.5 g
        upto: 62.5 g
        treatment: criminal
        term: Large amount, Article 396(2)
        prison_min: 1 year
        prison: 4 years
      - over: 62.5 g
        treatment: criminal
        term: Especially large amount, Article 396(3)
        prison_min: 3 years
        prison: 6 years
  cultivation:
    text: >-
      Small and significant cultivation is administrative, not criminal: up to 500 g of plant
      material brings an 80,000 to 100,000 dram fine, and 500 g to 2.5 kg a 100,000 to 120,000
      dram fine.[@admin,amounts] Above 2.5 kg the offence becomes criminal: up to two years for
      2.5 to 12.5 kg, two to five years above 12.5 kg, and four to eight years for an organised
      group or involving minors.[@criminal] Licensed companies may grow industrial hemp with no
      more than 0.3% THC and CBD greater than THC; individuals may not.[@hempact]
    sources:
      - admin
      - amounts
      - criminal
      - hempact
    currency: AMD
    penalties:
      - upto: 500 g
        treatment: civil
        term: Small amount, Article 110.2(1)
        fine_min: 80000
        fine: 100000
      - over: 500 g
        upto: 2.5 kg
        treatment: civil
        term: Significant amount, Article 110.2(2)
        fine_min: 100000
        fine: 120000
      - over: 2.5 kg
        upto: 12.5 kg
        treatment: criminal
        term: Article 404(1)
        prison: 2 years
        note: Fine, community work, restriction of liberty or short-term imprisonment also available
      - over: 12.5 kg
        treatment: criminal
        term: Especially large amount, Article 404(2)
        prison_min: 2 years
        prison: 5 years
      - label: Organised group or involving minors
        treatment: criminal
        term: Article 404(3)
        prison_min: 4 years
        prison: 8 years
  enforcement:
    text: >-
      Users face a large administrative fine instead of the two months in jail that applied before
      2008.[@hca] Sale and cultivation above the administrative thresholds remain crimes with
      prison.[@criminal] Drug offences recorded by the police rose from 2,266 in 2022 to 5,070 in
      2023, and drug-trafficking cases rose 83% in the first half of 2025.[@azat23,azat25]
    sources:
      - hca
      - criminal
      - azat23
      - azat25
  sharing:
    text: >-
      Sale or distribution is criminal: three to six years in the base case, five to ten years for
      a group, a large amount, online sale, a school or a prison, and eight to fifteen years for an
      organised group, an especially large amount or minors.[@criminal] There is no separate
      offence for an unpaid gift; a small gift may be treated as circulation without intent to
      sell, while a larger one can fall under the possession or supply provisions.[@criminal]
    sources:
      - criminal
    penalties:
      - label: Sale or distribution, Article 393(1)
        treatment: criminal
        term: Sale
        prison_min: 3 years
        prison: 6 years
      - label: Group, large amount, online, school or prison, Article 393(2)
        treatment: criminal
        term: Sale
        prison_min: 5 years
        prison: 10 years
      - label: Organised group, especially large amount or minors, Article 393(3)
        treatment: criminal
        term: Sale
        prison_min: 8 years
        prison: 15 years
  consumption:
    text: >-
      Use without a prescription is a separate administrative offence under Article 44.2, fined
      200,000 to 400,000 drams, or 400,000 to 800,000 for a repeat within a year.[@admin,admin2026]
      A person who voluntarily seeks medical help is exempt.[@admin] Use is not the same offence as
      small possession, though both sit in the administrative code.[@admin]
    sources:
      - admin
      - admin2026
    currency: AMD
    penalties:
      - label: Use without a prescription, Article 44.2
        treatment: civil
        term: Use
        fine_min: 200000
        fine: 400000
        note: Repeat 400,000–800,000 drams; voluntary treatment exempts
  access:
    text: >-
      There is no legal recreational source.[@hca] Psychoactive cannabis remains on List No. 1 of
      prohibited substances, and no medical cannabis programme or patient supply was found.[@list1129]
      Industrial hemp is on List No. 2 and is licensed only for companies.[@list1129]
    sources:
      - hca
      - list1129
context:
  recreational:
    text: >-
      Small possession and use are administrative offences with heavy fines; there is no legal way
      to buy cannabis.[@admin] Sale and larger growing are criminal.[@criminal] The fines were
      doubled in May 2026, and the government adopted a 2025–2027 drug strategy in June
      2025.[@admin2026,strategy2025] No legalisation bill was advancing in 2026.
    sources:
      - admin
      - criminal
      - admin2026
      - strategy2025
  production:
    status: hemp
    text: >-
      The verified production route is licensed industrial hemp with CBD greater than THC and no
      more than 0.3% THC.[@hempact] Only legal entities may hold a production licence, for up to ten
      years, with a minimum charter capital and nursery, greenhouse, warehouse and laboratory
      requirements; production must start within two years.[@hempact] Six companies held licences
      by January 2022.[@evn22] There is no medical or adult-use production route.[@list1129]
    sources:
      - hempact
      - evn22
      - list1129
  medical:
    text: >-
      No medical cannabis programme, registered cannabis medicine or patient supply was
      found.[@list1129] In February 2019 the health minister said there could be no initiative to
      free the use of narcotics and that he would veto one.[@arm19] No later medical-cannabis law
      was found.[@list1129] Cannabis and THC remain on List
      No. 1 of substances whose circulation is prohibited, not List No. 2 of restricted
      substances.[@list1129] Medical status stays none.[@list1129]
    sources:
      - list1129
      - arm19
  hemp:
    status: standard
    text: >-
      Licensed industrial hemp must have CBD content greater than THC and no more than 0.3% THC in
      the sampled material.[@hempact] Companies may apply for production and processing licences;
      this agricultural category is separate from psychoactive cannabis, which remains on List No.
      1.[@hempact,list1129] Hemp seed is a traditional food, and seed powder was recorded on sale
      in Yerevan markets in 2020.[@balant25]
    sources:
      - hempact
      - list1129
      - balant25
  consequences:
    text: >-
      An administrative offence is not a criminal record, but users are placed on a narcological
      register for observation, for at least a year.[@hca] The drug law lets the police order a
      drug test on suspicion of use, and a person diagnosed as dependent can be sent to compulsory
      treatment.[@upr09] A criminal conviction for sale or large-scale growing carries a record and
      prison.[@criminal]
    sources:
      - hca
      - upr09
      - criminal
  planting:
    seeds: licensed
    seeds_trade: regulated
    clones: licensed
    clones_trade: regulated
    text: >-
      Industrial-hemp seed and planting material are available only within the licensed producer
      system; the law requires approved seed and nursery facilities.[@hempact] Psychoactive cannabis
      is on List No. 1, and its seeds and clones fall under the general prohibition.[@list1129] No
      open seed or clone market was found.
    sources:
      - hempact
      - list1129
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing psychoactive
      cannabis and supplying it to another person are both prohibited.[@criminal,list1129]
    sources:
      - criminal
      - list1129
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. Since 2008 possessing a small amount for
      personal use without intent to sell is an administrative offence with a heavy fine and no
      prison.[@admin] The law makes no exception for visitors.[@admin]
    sources:
      - admin
  driving:
    status: zero
    text: >-
      Administrative Offences Code article 126(9) treats a driver as intoxicated when testing
      shows narcotic or psychotropic substance content in blood or urine.[@trafficcode] A
      separate demonstration of impaired vehicle control is not required by that definition.[@trafficcode]
      Article 126(3) provides two years' deprivation of driving rights for drug-related
      intoxication, and avoiding the prescribed examination also results in two years.[@trafficcode]
      No numerical THC allowance or prescribed-cannabis exception was found.[@trafficcode]
    sources:
      - trafficcode
  black_market:
    text: >-
      In 2024 the authorities seized about 426 kg of all drugs, roughly 200 kg more than in
      2023.[@azat25] UNODC records 327 kg of herbal cannabis seized in 2024, against 13 kg in
      2023.[@unodc_szr] Recorded drug crimes rose from 2,266 in 2022 to 5,070 in 2023, and
      drug-trafficking cases rose 83% in the first half of 2025.[@azat23,azat25] No price or purity
      data were found.
    sources:
      - azat25
      - azat23
      - unodc_szr
  arrests:
    text: >-
      No published annual arrest count by drug was found. The available figures are seizures and
      recorded offences: 5,070 drug crimes in 2023, and a 83% rise in drug-trafficking cases in
      the first half of 2025.[@azat23,azat25] In 2024 there were 252 drug-trafficking cases
      involving information or communication technology.[@azat25]
    sources:
      - azat23
      - azat25
  culture:
    text: >-
      Hemp seed has been part of Armenian fasting food since at least the nineteenth century, when
      a folklorist recorded it on the Lenten table; a 1930 Soviet survey found Armenians grew
      little hemp for fibre.[@balant25] The plant's name reached Armenian through the Greek
      [cannabis](/culture/language/cannabis/) word, and the atlas entry traces that etymology.[@balant25]
    sources:
      - balant25
