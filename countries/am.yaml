segments:
  possession:
    text: >-
      Since 2008 possessing a small amount for personal use without intent to sell is an
      administrative offence, not a crime. The fine is heavy — 200 to 400 times the minimum wage
      unit, roughly US$500–1,000 — but there is no prison and the fine is waived for people who
      voluntarily seek treatment. In drams the fine is 200,000 to 400,000; a bill before
      parliament in May 2026 would double it.
    sources:
      - hca
      - iwpr
      - upr09
      - pan26
  cultivation:
    text: >-
      Growing cannabis is a criminal offence, and people living near wild stands say the police
      destroy the plants. Industrial hemp with no more than 0.3% THC may be grown since 2021,
      but only by licensed companies and in greenhouses, not by individuals.
    sources:
      - hca
      - evn22
      - balant25
  enforcement:
    text: >-
      Users face a large fine instead of the two months in jail that applied before 2008. Sale and
      cultivation for sale remain crimes with prison.
    sources:
      - hca
      - iwpr
  sharing:
    text: Supply is a crime with three to seven years or more.
    sources:
      - iwpr
  consumption:
    text: >-
      Use without a prescription is handled under the same administrative offence as small
      possession.
    sources:
      - hca
  access:
    text: No legal recreational source.
    sources:
      - hca
      - iwpr
      - upr09
      - pan26
context:
  production:
    text: >-
      Since June 2021 industrial hemp with no more than 0.3% THC may be produced and processed.
      Licences are issued by the health ministry to companies only, for up to ten years, with
      separate licences for growing and for trade and processing, a minimum capital of 10
      million drams and growing in greenhouses. Six companies held licences in January 2022.
      No cannabis with more THC may be produced.
    sources:
      - evn22
  products:
    text: >-
      Hemp seed is a traditional food and seed powder was recorded on sale in Yerevan's markets
      in 2020. British travel advice says marijuana, CBD and THC products are all illegal to
      use, possess or trade.
    sources:
      - balant25
      - fcdo
  medical:
    text: >-
      No medical cannabis programme. In February 2019 the health minister said there could be
      no initiative to free the use of narcotics and that he would veto one. British travel
      advice warns that a person can be prosecuted for cannabis products even when they were
      prescribed abroad.
    sources:
      - arm19
      - fcdo
  consequences:
    text: >-
      An administrative offence is not a criminal record, but users are placed on a narcological
      register for observation, for at least a year. The drug law lets the police order a drug
      test on suspicion of use, and a person diagnosed as dependent can be sent to compulsory
      treatment.
    sources:
      - hca
      - upr09
  arrests:
    text: >-
      No figures by drug were found. Drug crimes recorded by the police more than doubled in the
      first nine months of 2023, a rise officials put down to synthetic drugs sold online, and
      the interior minister called for making drug addiction a crime again.
    sources:
      - azat23
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited.
    sources:
      - hca
      - iwpr
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. Since 2008 possessing a small amount for
      personal use without intent to sell is an administrative offence with a heavy fine and no
      prison.
    sources:
      - hca
      - iwpr
  driving:
    status: zero
    text: >-
      Administrative Offences Code article 126(9) treats a driver as intoxicated when
      testing establishes narcotic or psychotropic substance content in blood or urine.
      A separate demonstration of impaired vehicle control is not stated in that
      definition. Article 126(3) provides two years' deprivation of driving rights for
      drug-related intoxication; avoiding the prescribed sobriety examination also
      results in two years under paragraph 4. Drug intoxication is determined by a
      medical expert examination under paragraph 10. Paragraph 9 also covers consuming
      a substance after a police stop or relevant crash but before the sobriety test.
      The ordinary monetary fine and five-point deduction in paragraph 1 are expressly
      alcohol-only and must not be substituted for the drug sanction. The official
      English consolidation includes the March 2025 amendment. No numerical THC
      allowance or prescribed-cannabis exception was verified in article 126; the
      statute's reference to drug content should not be expanded into an assertion
      that every inactive cannabis metabolite is independently sufficient.
    sources:
      - trafficcode
  black_market:
    text: >-
      Figures reported by the government to the UN drugs office record 327 kg of herbal
      cannabis seized in 2024, against 13 kg in 2023. The UN publishes them as kilogram
      equivalents, and countries count seizures differently, so the figures are not
      comparable across borders.
    sources:
      - unodc_szr
