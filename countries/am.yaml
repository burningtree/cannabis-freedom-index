name: Armenia
region: Asia
iso_numeric: 51
recreational: decriminalised
medical: none
updated: "2026-10-28"
summary: >-
  Small possession and use are administrative offences with heavy fines, raised sharply in May 2026;
  sale and larger-scale growing are criminal. Industrial hemp is licensed at 0.3% THC, while
  psychoactive cannabis has no medical route.
