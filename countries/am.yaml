  possession: 3
  cultivation: 2
  enforcement: 3
  sharing: 1
  consumption: 1
  access: 0
segments:
  possession:
    text: >-
      Since 2008 possessing a small amount for personal use without intent to sell has been an
      administrative offence, not a crime.[@admin] The threshold is 2.5 g of dried herbal cannabis;
      the fine was 200,000 to 400,000 drams.[@admin,amounts] From 22 May 2026 the fine is 400,000 to
      800,000 drams, and 800,000 to 1,100,000 for a repeat within a year.[@admin2026] Above 2.5 g,
      possession becomes criminal: up to two years for 2.5 to 12.5 g, one to four years for 12.5 to
      62.5 g, and three to six years above 62.5 g.[@criminal] A person who voluntarily surrenders
      the drug is exempt from administrative liability.[@admin]
    sources:
      - admin
      - admin2026
      - amounts
      - criminal
    currency: AMD
    penalties:
      - upto: 2.5 g
        treatment: civil
        term: Small amount, Article 44.1
        fine_min: 400000
        fine: 800000
        note: Repeat within a year 800,000–1,100,000 drams; voluntary surrender exempts
      - over: 2.5 g
        upto: 12.5 g
        treatment: criminal
        term: Article 396(1)
        prison: 2 years
        note: Fine, community work, restriction of liberty or short-term imprisonment also available
      - over: 12.5 g
        upto: 62.5 g
        treatment: criminal
        term: Large amount, Article 396(2)
        prison_min: 1 year
        prison: 4 years
      - over: 62.5 g
        treatment: criminal
        term: Especially large amount, Article 396(3)
        prison_min: 3 years
        prison: 6 years
  cultivation:
    text: >-
      Growing one to five plants is an administrative offence with an 80,000–100,000 dram fine; six
      to nine plants bring 100,000–120,000 drams.[@admin,amounts] From ten plants the offence is
      criminal: 10–100 plants carry up to two years, more than 100 plants or a group two to five
      years, and an organised group or involving minors four to eight years.[@criminal] Licensed
      companies may grow industrial hemp with no more than 0.3% THC and CBD greater than THC;
      individuals may not.[@hempact]
    sources:
      - admin
      - amounts
      - criminal
      - hempact
    currency: AMD
    penalties:
      - treatment: civil
        term: Small cultivation, Article 110.2(1)
        fine_min: 80000
        fine: 100000
        label: One to five plants
      - treatment: civil
        term: Significant cultivation, Article 110.2(2)
        fine_min: 100000
        fine: 120000
        label: Six to nine plants
      - treatment: criminal
        term: Article 404(1)
        prison: 2 years
        label: 10–100 plants
        note: Fine, community work, restriction of liberty or short-term imprisonment also available
      - treatment: criminal
        term: Article 404(2)
        prison_min: 2 years
        prison: 5 years
        label: More than 100 plants or a group
      - treatment: criminal
        term: Article 404(3)
        prison_min: 4 years
        prison: 8 years
        label: Organised group or involving minors
  enforcement:
    text: >-
      Users face a large administrative fine instead of the two months in jail that applied before
      2008.[@hca] Sale and cultivation above the administrative thresholds remain crimes with
      prison.[@criminal] Drug offences recorded by the police rose from 2,266 in 2022 to 5,070 in
      2023, and drug-trafficking cases rose 83% in the first half of 2025.[@azat23,azat25]
    sources:
      - hca
      - criminal
      - azat23
      - azat25
  sharing:
    text: >-
      Sale or distribution is criminal: three to six years in the base case, five to ten years for a
      group, a large amount, online sale, a school or a prison, and eight to fifteen years for an
      organised group, an especially large amount or minors.[@criminal] There is no separate offence
      for an unpaid gift; a small gift may be treated as circulation without intent to sell, while a
      larger one can fall under the possession or supply provisions.[@criminal]
    sources:
      - criminal
    penalties:
      - label: Sale or distribution, Article 393(1)
        treatment: criminal
        term: Sale
        prison_min: 3 years
        prison: 6 years
      - label: Group, large amount, online, school or prison, Article 393(2)
        treatment: criminal
        term: Sale
        prison_min: 5 years
        prison: 10 years
      - label: Organised group, especially large amount or minors, Article 393(3)
        treatment: criminal
        term: Sale
        prison_min: 8 years
        prison: 15 years
  consumption:
    text: >-
      Use without a prescription is a separate administrative offence under Article 44.2, fined
      200,000 to 400,000 drams, or 400,000 to 800,000 for a repeat within a year.[@admin,admin2026]
      A person who voluntarily seeks medical help is exempt.[@admin] Use is not the same offence as
      small possession, though both sit in the administrative code.[@admin]
    sources:
      - admin
      - admin2026
    currency: AMD
    penalties:
      - label: Use without a prescription, Article 44.2
        treatment: civil
        term: Use
        fine_min: 200000
        fine: 400000
        note: Repeat 400,000–800,000 drams; voluntary treatment exempts
  access:
    text: >-
      There is no legal recreational source.[@hca] Psychoactive cannabis remains on List No. 1 of
      prohibited substances, and no medical cannabis programme or patient supply was
      found.[@list1129] Industrial hemp is on List No. 2 and is licensed only for
      companies.[@list1129]
    sources:
      - hca
      - list1129
context:
  recreational:
    text: >-
      Small possession and use are administrative offences with heavy fines; there is no legal way
      to buy cannabis.[@admin] Sale and larger growing are criminal.[@criminal] The fines were
      doubled in May 2026, and the government adopted a 2025–2027 drug strategy in June
      2025.[@admin2026,strategy2025] No legalisation bill was advancing in 2026.
    sources:
      - admin
      - criminal
      - admin2026
      - strategy2025
  production:
    status: hemp
    text: >-
      The verified production route is licensed industrial hemp with CBD greater than THC and no
      more than 0.3% THC; products are export-only.[@hempact] Only legal entities may hold a
      production licence, for up to ten years, with minimum facilities and a two-year start
      requirement.[@hempact] In January 2026 two companies held licences, one operating; no domestic
      hemp product was verified.[@sputnik26] Cannabis outside that category remains on List No. 1,
      but Article 11 permits licensed scientific use of prohibited substances under Article
      31.1.[@list1129,hempact] Article 14 separately requires a substance-specific production
      licence and state quotas; no cannabis-specific medical manufacturing licence was
      established.[@hempact]
    sources:
      - hempact
      - sputnik26
      - list1129
  medical:
    text: >-
      No medical cannabis programme, registered cannabis medicine or patient supply was
      found.[@list1129] In February 2019 the health minister said there could be no initiative to
      free the use of narcotics and that he would veto one.[@arm19] Cannabis outside the licensed
      hemp category remains on List No. 1; dronabinol is separately listed among restricted
      substances on List No. 2.[@list1129] Licensed scientific use of prohibited substances is
      permitted under Articles 11 and 31.1.[@hempact]
    sources:
      - list1129
      - arm19
      - hempact
  hemp:
    status: standard
    text: >-
      Licensed industrial hemp must have CBD content greater than THC and no more than 0.3% THC in
      the sampled material.[@hempact] Companies may apply for production and processing licences;
      this agricultural category is separate from psychoactive cannabis, which remains on List No.
      1.[@hempact,list1129] Hemp seed is a traditional food, and seed powder was recorded on sale in
      Yerevan markets in 2020.[@balant25]
    sources:
      - hempact
      - list1129
      - balant25
  consequences:
    text: >-
      An administrative offence is not a criminal record, but users are placed on a narcological
      register for observation, for at least a year.[@hca] The drug law lets the police order a drug
      test on suspicion of use, and a person diagnosed as dependent can be sent to compulsory
      treatment.[@upr09] A criminal conviction for sale or large-scale growing carries a record and
      prison.[@criminal]
    sources:
      - hca
      - upr09
      - criminal
  planting:
    seeds: grey
    seeds_trade: unclear
    clones: illegal
    clones_trade: banned
    text: >-
      Industrial-hemp seed and planting material are available only within the licensed producer
      system; the law requires approved seed and nursery facilities.[@hempact] Psychoactive cannabis
      is on List No. 1, and its seeds and clones fall under the general prohibition; no explicit
      seed rule was found, so the psychoactive-seed status is grey.[@list1129]
    sources:
      - hempact
      - list1129
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing psychoactive
      cannabis and supplying it to another person are both prohibited.[@criminal,list1129]
    sources:
      - criminal
      - list1129
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. Since 2008 possessing a small amount for
      personal use without intent to sell is an administrative offence with a heavy fine and no
      prison.[@admin] The law makes no exception for visitors.[@admin]
    sources:
      - admin
  driving:
    status: zero
    text: >-
      Administrative Offences Code article 126(9) treats a driver as intoxicated when testing shows
      narcotic or psychotropic substance content in blood or urine.[@trafficcode] A separate
      demonstration of impaired vehicle control is not required by that definition.[@trafficcode]
      Article 126(3) provides two years' deprivation of driving rights for drug-related
      intoxication, and avoiding the prescribed examination also results in two years.[@trafficcode]
      No numerical THC allowance or prescribed-cannabis exception was found.[@trafficcode]
    sources:
      - trafficcode
  black_market:
    text: >-
      In 2024 the authorities seized about 427 kg of all drugs; UNODC records 327 kg of herbal
      cannabis, against 13 kg in 2023.[@azat25,unodc_szr] In 2025 police seized 768.9 kg of all
      drugs, up 80%, and in the first half of 2026 320.6 kg.[@armenpress26] Recorded drug crimes
      were 3,639 in 2024 and 4,170 in 2025; registered drug users stood at 7,650 on 1 January 2026,
      mostly cannabis users.[@armenpress26] No price or purity data were found.
    sources:
      - azat25
      - unodc_szr
      - armenpress26
  arrests:
    text: >-
      No published annual arrest count by drug was found. Recorded drug crimes were 5,070 in 2023,
      3,639 in 2024 and 4,170 in 2025; 1,545 trafficking cases were recorded in the first half of
      2026.[@azat23,armenpress26] In 2024 there were 252 drug-trafficking cases involving
      information or communication technology.[@azat25] The figures cover all drugs, not cannabis
      alone.[@armenpress26]
    sources:
      - azat23
      - azat25
      - armenpress26
  culture:
    text: >-
      Hemp seed has been part of Armenian fasting food since at least the nineteenth century, when a
      folklorist recorded it on the Lenten table; a 1930 Soviet survey found Armenians grew little
      hemp for fibre.[@balant25] The plant's name reached Armenian through the Greek
      [cannabis](/culture/language/cannabis/) word, and the atlas entry traces that
      etymology.[@balant25]
    sources:
      - balant25
