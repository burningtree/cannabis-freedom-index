segments:
  possession:
    text: >-
      The 1999 drug code (Law 017-99/AN) makes possession for personal use punishable by two months
      to two years in prison and a fine of 50,000 to 500,000 CFA francs.
    sources:
      - cr
  cultivation:
    text: Cultivation is a crime.
    sources:
      - cr
  enforcement:
    text: Users are jailed, and people who use drugs have little access to health-based alternatives.
