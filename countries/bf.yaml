segments:
  possession:
    text: >-
      Under Article 47 of the 1999 drug code (Law 017-99/AN), using or holding high-risk drugs for
      personal consumption carries 2 to 5 years in prison and a fine of 1,000,000 to 5,000,000 CFA
      francs, or one of the two. For drugs in the lower "risk" class, Article 51 sets the same 2 to
      5 years for personal use or possession, with a fine of 500,000 to 2,000,000 CFA francs. The schedules were not read, so which class cannabis falls in is not confirmed here.
    sources:
      - code99
  cultivation:
    text: >-
      Growing high-risk drugs carries 10 to 20 years and a fine of 5,000,000 to 25,000,000 CFA
      francs (Article 44); growing drugs in the lower class carries 5 to 10 years (Article 51).
      No lighter tier for growing for personal use appears in these articles.
    sources:
      - code99
  enforcement:
    text: >-
      A 2025 Mainline country sheet reports that drug use is severely repressed by the police and
      courts, that people who use drugs are jailed, and that a judge may order treatment instead.
    sources:
      - ml
  sharing:
    text: >-
      Giving or offering a high-risk drug to a person for their own use carries 2 to 5 years and a
      fine of 500,000 to 2,000,000 CFA francs (Article 50). Selling, distributing or delivering
      carries 10 to 20 years (Article 46).
    sources:
      - code99
  consumption:
    text: >-
      Using high-risk drugs for personal consumption is punished by Article 47 (2 to 5 years); the
      lower class is punished by Article 51 (also 2 to 5 years).
    sources:
      - code99
  access:
    text: >-
      No lawful source is shown in the articles read. The sale, supply and holding of drugs is
      punished under Articles 44 to 51.
    sources:
      - code99
