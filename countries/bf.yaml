    sources: []
  medical:
    text: The retained sources do not establish whether a medical cannabis programme operates.
    sources: []
  consequences:
    text: >-
      For specified production, supply and related offences, the 2018 code allows additional
      penalties such as loss of civic rights, professional bans and restrictions on travel or
      residence. Courts may order treatment in place of or alongside punishment for a dependent
      person convicted of the offences listed in its treatment rule, including small personal
      quantities and drug-impaired driving.
      Parliament adopted a further replacement Penal Code on 20 October 2026.
    sources: [code18, parliament26]
  clubs:
    status: none
    text: >-
      No cannabis clubs are known. Growing cannabis and supplying it to another person remain
      prohibited; the small-personal-quantity tier still sets criminal penalties.
    sources: [code99, code18]
  visitors:
    status: none
    text: >-
      Visitors have no lawful recreational supply route. For specified production and supply
      offences, the 2018 code allows courts to exclude a convicted foreigner permanently or
      for ten years or more. Its additional-penalty clause covers Articles 381-1–384-5, while
      small personal quantities have a separate rule in Article 385-2.
    sources: [code18]
  black_market:
    text: >-
      Figures reported by the government to the UN drugs office record 11,734 kg of herbal
      cannabis seized in 2024, against 18,985 kg in 2023. The UN publishes them as
      kilogram equivalents, and countries count seizures differently, so the figures are
      not comparable across borders.
    sources: [unodc_szr]
