name: Iceland
region: Europe
iso_numeric: 352
recreational: illegal
medical: limited
updated: '2026-10-28'
summary: Possession of small amounts is punished with a fine.
scores:
  possession: 2
  cultivation: 1
  enforcement: 3
  sharing: 1
  consumption: 1
  access: 1
segments:
  possession:
    text: >-
      Possession of any amount is prohibited under the Addictive Drugs and Narcotics Act.[@nsfk] For small
      amounts the standard outcome is a fine — around 35,000 krónur for a first offence involving up
      to a gram.[@cann] Since 2019, minor possession is no longer entered on the offender's criminal
      record.[@nsfk]
      [Iceland wrote its cannabis ban into law in 1974.](/history/iceland-narcotics-act-1974/)
    sources:
      - nsfk
      - cann
    currency: ISK
    penalties:
      - upto: 1 g
        treatment: criminal
        term: Possession of narcotics
        fine: 35000
        note: Around this for a first offence; off the criminal record since 2019
  cultivation:
    text: >-
      Growing psychoactive cannabis is prohibited under the drug act; indoor grows are regularly
      raided.[@act65,cann] Industrial hemp has a separate lawful growing route using authorised
      seed varieties, with no more than 0.2% THC in the seed and resulting products.[@hemp804]
      [Iceland wrote its cannabis ban into law in 1974.](/history/iceland-narcotics-act-1974/)
    sources:
      - cann
      - act65
      - hemp804
    penalties:
      - label: Unlawful cultivation
        treatment: criminal
        term: Production of narcotics
        note: Criminal offence; indoor grows are regularly raided
  enforcement:
    text: >-
      Fines for users. In 2021 the health minister introduced a government bill to decriminalise
      possession of all drugs for personal use; it did not pass.[@nsfk]
    sources:
      - nsfk
  sharing:
    text: Supply is a crime with prison.[@cann]
    sources:
      - cann
  consumption:
    text: Use is covered by the possession offence and fined.[@nsfk]
    sources:
      - nsfk
  access:
    text: >-
      No recreational source. Sativex can be obtained from a pharmacy on a neurologist's
      prescription; the medicines agency also lists Epidyolex as available.[@ima]
      [Prescription access to Sativex was confirmed in 2018.](/history/iceland-sativex-access-2018/)
    sources:
      - ima
context:
  recreational:
    text: >-
      There is no legal way to get cannabis. Adults buy hashish from dealers and use in private:
      possession of any amount is prohibited, with small amounts punished by fines that have
      stayed off the criminal record since 2019.[@nsfk,cann] A 2021 government bill to
      decriminalise personal possession of all drugs did not pass.[@nsfk]
      [Iceland wrote its cannabis ban into law in 1974.](/history/iceland-narcotics-act-1974/)
    sources:
      - nsfk
      - cann
  hemp:
    status: strict
    text: >-
      Industrial hemp may be grown from eligible Cannabis sativa seed under the agricultural
      scheme overseen by the Food and Veterinary Authority, MAST.[@hemp804,hemptransfer]
      The seed and resulting products must contain no more than 0.2% THC.[@hemp804]
      Varieties must appear in the common EEA agricultural catalogue, and imported seed needs
      documents showing compliance with the catalogue and oil-and-fibre seed rules.[@hemp804]
      The [2021 framework](/history/iceland-hemp-seed-imports-2021/) replaced the temporary
      Medicines Agency exemption introduced in 2020.[@hemptransfer]
    sources:
      - hemp804
      - hemptransfer
  production:
    status: hemp
    text: >-
      Industrial hemp is a lawful crop under the MAST seed scheme, which permits imports for
      cultivation of eligible varieties at no more than 0.2% THC.[@hemp804,hemptransfer]
      Growers must use seed meeting the EEA catalogue and documentation requirements.[@hemp804]
      Psychoactive cannabis production remains prohibited under the drug act, subject to the
      Medicines Agency's power to grant revocable exceptions in special circumstances.[@act65]
    sources:
      - hemp804
      - hemptransfer
      - act65
  medical:
    text: >-
      Limited to approved cannabinoid medicines: Sativex on specialist (neurologist)
      prescription for multiple-sclerosis spasticity, and Epidyolex also listed as
      available.[@ima]
      [Prescription access to Sativex was confirmed in 2018.](/history/iceland-sativex-access-2018/)
    sources:
      - ima
  consequences:
    text: >-
      Keeping minor possession off the criminal record since 2019 removed the main lasting
      consequence for users.[@nsfk]
    sources:
      - nsfk
  planting:
    seeds: licensed
    seeds_trade: regulated
    clones: illegal
    clones_trade: banned
    text: >-
      The drug act bans importing, selling, handing over, producing and possessing cannabis.[@act65]
      Since 2021 the Food and Veterinary Authority may permit imports of eligible Cannabis sativa
      seed for industrial-hemp cultivation, with a 0.2% THC ceiling and EEA variety and seed
      documentation requirements.[@act65,hemp804] The seed-import regulation provides no equivalent
      import route for plants or cuttings.[@hemp804]
      [Hemp seed imports were licensed in 2021.](/history/iceland-hemp-seed-imports-2021/)
    sources:
      - act65
      - hemp804
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited.[@cann]
    sources:
      - cann
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone.[@tni] The drug act bans importing, selling,
      handing over, producing and possessing cannabis.[@act65] Small amounts for personal use are dealt
      with by a fine.[@nsfk]
    sources:
      - tni
      - act65
      - nsfk
  driving:
    status: zero
    text: >-
      The Traffic Act forbids driving under the influence of drugs that are banned in Iceland,
      and says that when such a drug is measured in the driver's blood the driver is deemed
      under the influence and unfit to drive safely.[@umf50] No level is set, so any measurable amount
      is enough.[@umf50] Police can require a saliva, urine or blood sample on suspicion, and refusing
      has the same consequences as drug driving: penalty points, loss of the licence for up to
      four years or more for repeat offences, and fines or prison of up to two years in
      serious cases.[@islandis]
    sources:
      - umf50
      - islandis
  black_market:
    text: >-
      Figures reported by the government to the UN drugs office record 290 kg of herbal
      cannabis seized in 2024, against 210 kg in 2023, and 22.8 kg of cannabis resin
      seized in 2024, against 175 kg in 2023.[@unodc_szr] The UN publishes them as kilogram
      equivalents, and countries count seizures differently, so the figures are not
      comparable across borders.[@unodc_szr]
    sources:
      - unodc_szr
