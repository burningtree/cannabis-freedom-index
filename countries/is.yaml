name: Iceland
region: Europe
iso_numeric: 352
recreational: illegal
medical: limited
updated: 2026-10-14
summary: Possession of small amounts is punished with a fine.
scores:
  possession: 2
  cultivation: 1
  enforcement: 3
  sharing: 1
  consumption: 1
  access: 1
segments:
  possession:
    text: >-
      Possession of any amount is prohibited under the Addictive Drugs and Narcotics Act. For small
      amounts the standard outcome is a fine — around 35,000 krónur for a first offence involving up
      to a gram. Since 2019, minor possession is no longer entered on the offender's criminal
      record.
    sources:
      - nsfk
      - cann
    currency: ISK
    penalties:
      - upto: 1 g
        treatment: criminal
        fine: 35000
        note: Around this for a first offence; off the criminal record since 2019
  cultivation:
    text: Cultivation is a criminal offence; indoor grows are regularly raided.
    sources:
      - cann
  enforcement:
    text: >-
      Fines for users. In 2021 the health minister introduced a government bill to decriminalise
      possession of all drugs for personal use; it did not pass.
    sources:
      - nsfk
  sharing:
    text: Supply is a crime with prison.
    sources:
      - cann
  consumption:
    text: Use is covered by the possession offence and fined.
    sources:
      - nsfk
  access:
    text: >-
      No recreational source. Sativex can be obtained from a pharmacy on a neurologist's
      prescription; the medicines agency also lists Epidyolex as available.
    sources:
      - ima
context:
  recreational:
    text: >-
      There is no legal way to get cannabis. Adults buy hashish from dealers and use in private:
      possession of any amount is prohibited, with small amounts punished by fines that have
      stayed off the criminal record since 2019.[@nsfk,cann] A 2021 government bill to
      decriminalise personal possession of all drugs did not pass.[@nsfk]
    sources:
      - nsfk
      - cann
  hemp:
    status: none
    text: >-
      Iceland bans cannabis cultivation outright; a 2020 regulation only opened a narrow
      exception letting the Medicines Agency license imports of hemp seed with no more than
      0.2% THC, for fibre and food rather than planting at home.[@grapevine] There is no hemp
      market and no THC threshold that makes a plant legal to grow.
    sources:
      - grapevine
  production:
    status: none
    text: No licensed production.
    sources:
      - cann
  products:
    text: Prescription Sativex and Epidyolex.
    sources:
      - ima
  medical:
    text: Limited to approved cannabinoid medicines, including Sativex on specialist prescription.
    sources:
      - ima
  consequences:
    text: >-
      Keeping minor possession off the criminal record since 2019 removed the main lasting
      consequence for users.
    sources:
      - nsfk
  planting:
    seeds: licensed
    seeds_trade: regulated
    clones: illegal
    clones_trade: banned
    text: >-
      The drug act bans importing, selling, handing over, producing and possessing cannabis.
      Since 2021 the Food and Veterinary Authority may license imports of Cannabis sativa seed
      under conditions set by regulation; there is no such exception for plants or cuttings.
    sources:
      - act65
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited.
    sources:
      - cann
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. The drug act bans importing, selling,
      handing over, producing and possessing cannabis. Small amounts for personal use are dealt
      with by a fine.
    sources:
      - tni
      - act65
      - nsfk
  driving:
    status: zero
    text: >-
      The Traffic Act forbids driving under the influence of drugs that are banned in Iceland,
      and says that when such a drug is measured in the driver's blood the driver is deemed
      under the influence and unfit to drive safely. No level is set, so any measurable amount
      is enough. Police can require a saliva, urine or blood sample on suspicion, and refusing
      has the same consequences as drug driving: penalty points, loss of the licence for up to
      four years or more for repeat offences, and fines or prison of up to two years in
      serious cases.
    sources:
      - umf50
      - islandis
  black_market:
    text: >-
      Figures reported by the government to the UN drugs office record 290 kg of herbal
      cannabis seized in 2024, against 210 kg in 2023, and 22.8 kg of cannabis resin
      seized in 2024, against 175 kg in 2023. The UN publishes them as kilogram
      equivalents, and countries count seizures differently, so the figures are not
      comparable across borders.
    sources:
      - unodc_szr
