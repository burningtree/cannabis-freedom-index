segments:
  possession:
    text: >-
      Possession of any amount is prohibited under the Addictive Drugs and Narcotics Act. For small
      amounts the standard outcome is a fine — around 35,000 krónur for a first offence involving up
      to a gram. Since 2019, minor possession is no longer entered on the offender's criminal
      record.
    sources:
      - nsfk
      - cann
  cultivation:
    text: Cultivation is a criminal offence; indoor grows are regularly raided.
    sources:
      - cann
  enforcement:
    text: >-
      Fines for users. In 2021 the health minister introduced a government bill to decriminalise
      possession of all drugs for personal use; it did not pass.
    sources:
      - nsfk
  sharing:
    text: Supply is a crime with prison.
    sources:
      - cann
  consumption:
    text: Use is covered by the possession offence and fined.
    sources:
      - nsfk
  access:
    text: >-
      No legal source. A bill to legalise and regulate sales to adults over 20 was proposed in
      parliament but went nowhere.
    sources:
      - tni
context:
  production:
    text: No licensed production.
    sources:
      - cann
  products:
    text: One prescription cannabinoid medicine.
    sources:
      - cann
  medical:
    text: Limited to a cannabinoid mouth spray on specialist prescription.
    sources:
      - cann
  consequences:
    text: >-
      Keeping minor possession off the criminal record since 2019 removed the main lasting
      consequence for users.
    sources:
      - nsfk
  planting:
    seeds: licensed
    seeds_trade: regulated
    clones: illegal
    clones_trade: banned
    text: >-
      The drug act bans importing, selling, handing over, producing and possessing cannabis.
      Since 2021 the Food and Veterinary Authority may license imports of Cannabis sativa seed
      under conditions set by regulation; there is no such exception for plants or cuttings.
    sources:
      - act65
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited.
    sources:
      - cann
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. British travel advice says illegal
      drugs, even in small amounts and including cannabis, carry severe penalties, and tells
      travellers to expect a long jail sentence and heavy fines for possessing, using or
      smuggling them, also in transit. Airport scanners are also used on the baggage of
      passengers in transit.
    sources:
      - tni
      - fcdo
