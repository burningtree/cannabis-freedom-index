segments:
  possession:
    text: >-
      Cannabis is illegal for all purposes under the 1997 drug-control Act and the 2018 Penal Code.
      Unauthorised possession of a narcotic is reported to carry two to five years in prison and a
      fine of 500,000 to 5 million CFA francs. There is some informal tolerance in parts of the
      country, but raids and arrests are active in Cotonou and at borders.
    sources:
      - tb
      - wiki
  cultivation:
    text: Cultivation is a crime with heavy sentences.
    sources:
      - tb
      - wiki
  enforcement:
    text: >-
      Prison terms of years are on the books for simple possession. The death penalty, abolished in
      2016, no longer applies to any drug offence.
    sources:
      - tb
  sharing:
    text: Trafficking can carry up to life imprisonment.
    sources:
      - tb
  consumption:
