  planting:
    seeds: grey
    seeds_trade: unclear
    clones: illegal
    clones_trade: banned
    text: >-
      Article 8 of Law 97-025 bans growing the cannabis plant anywhere in the country and
      obliges whoever owns or occupies land to destroy any plants that come up. The law does
      not mention seeds; it classifies substances by reference to the international
      conventions.
    sources:
      - l97025
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited.
    sources:
      - wiki
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. The 1997 Act prohibits drug use, and
      importing or carrying drugs across the border brings five to ten years in prison and a
      fine of three times their value.
    sources:
      - idpc17
