name: Benin
region: Africa
iso_numeric: 204
recreational: illegal
medical: none
updated: 2026-10-13
summary: >-
  Illegal for all purposes; possession is reported to carry two to five years in prison, with some
  informal tolerance outside the cities.
scores:
  possession: 1
  cultivation: 1
  enforcement: 1
  sharing: 1
  consumption: 1
  access: 0
segments:
  possession:
    text: >-
      Cannabis is illegal for all purposes under the 1997 drug-control Act and the 2018 Penal Code.
      Unauthorised possession of a narcotic is reported to carry two to five years in prison and a
      fine of 500,000 to 5 million CFA francs. There is some informal tolerance in parts of the
      country, but raids and arrests are active in Cotonou and at borders.
    sources:
      - wiki
    currency: XOF
    penalties:
      - label: Unauthorised possession of a narcotic
        treatment: criminal
        prison_min: 2 years
        prison: 5 years
        fine: 5000000
        note: Reported figures; fine of 500,000–5,000,000 CFA francs
  cultivation:
    text: Cultivation is a crime with heavy sentences.
    sources:
      - wiki
  enforcement:
    text: >-
      A 2017 review of the 1997 Act found that it fixes minimum fines and prison terms which
      judges must stay within, offers no alternatives to prison and contains no public health or
      human rights protections. The death penalty, abolished in 2016, no longer applies to any
      drug offence.
    sources:
      - idpc17
      - wiki
  sharing:
    text: >-
      The 1997 Act punishes export, import and international transport of drugs with five to ten
      years in prison and a fine of three times the value of the drugs seized (Article 96).
      Benin serves increasingly as a transit point: seizures of cannabis rose from 82 kg in 2006
      to 2,444 kg in 2021.
    sources:
      - idpc17
      - wiki
    penalties:
      - label: Export, import and international transport (Article 96)
        treatment: criminal
        prison_min: 5 years
        prison: 10 years
        note: Fine of three times the value seized
  consumption:
    text: >-
      Use is prohibited, but a 2017 review of the 1997 Act found that the law does not state a
      penalty for it; it only says that using drugs is forbidden.
    sources:
      - idpc17
  access:
    text: >-
      No legal source: the 1997 Act forbids using drugs and punishes import, export and transport.
    sources:
      - idpc17
context_not_applicable:
  death_penalty:
    text: >-
      The death penalty, abolished in 2016, no longer applies to any drug offence.[@idpc17,wiki]
    sources: [idpc17, wiki]
context:
  recreational:
    text: >-
      There is no legal way to get cannabis. Possession is reported to carry two to five years
      and a fine of 500,000 to 5 million CFA francs; there is some informal tolerance outside
      the cities, but raids and arrests are active in Cotonou and at borders.[@wiki]
    sources:
      - wiki
  production:
    status: none
    text: No licensed production. Article 8 of Law 97-025 bans growing the cannabis plant anywhere in the country.
    sources:
      - l97025
  medical:
    text: >-
      No patient programme is documented. The 1997 Act forbids using drugs and the retained
      sources set no medical route.[@idpc17]
    sources:
      - idpc17
  consequences:
    text: >-
      The retained sources describe no consequence beyond the sentence itself: the 1997 Act
      fixes minimum fines and prison terms with no alternatives to prison.[@idpc17]
    sources:
      - idpc17
  planting:
    seeds: grey
    seeds_trade: unclear
    clones: illegal
    clones_trade: banned
    text: >-
      Article 8 of Law 97-025 bans growing the cannabis plant anywhere in the country and
      obliges whoever owns or occupies land to destroy any plants that come up. The law does
      not mention seeds; it classifies substances by reference to the international
      conventions.
    sources:
      - l97025
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited.
    sources:
      - wiki
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. The 1997 Act prohibits drug use, and
      importing or carrying drugs across the border brings five to ten years in prison and a
      fine of three times their value.
    sources:
      - idpc17
  black_market:
    text: >-
      Figures reported by the government to the UN drugs office record 1,209 kg of herbal
      cannabis seized in 2024, against 13,705 kg in 2023. The UN publishes them as
      kilogram equivalents, and countries count seizures differently, so the figures are
      not comparable across borders.
    sources:
      - unodc_szr
