name: Norway
region: Europe
iso_numeric: 578
recreational: illegal
medical: limited
updated: '2026-10-28'
summary: >-
  Possession is fined. After 2022 Supreme Court rulings, people with dependency are generally not
  punished for small amounts.
scores:
  possession: 2
  cultivation: 1
  enforcement: 3
  sharing: 1
  consumption: 1
  access: 1
segments:
  possession:
    text: >-
      Possession is a criminal offence. For up to 15 g for personal use the normal outcome is a fine
      — but the kind that is entered on the criminal record.[@sn,tni] After Supreme Court rulings, the
      Attorney General instructed in May 2022 that people with drug dependency should no longer be
      punished for small amounts, with doubt resolved in their favour.[@ra22,hr22] Recreational users are still
      fined.[@sn]
      [The court ended punishment for dependent users in 2022.](/history/norway-supreme-court-2022/)
    sources:
      - sn
      - tni
      - ra22
      - hr22
    penalties:
      - upto: 15 g
        treatment: criminal
        term: Narcotics offence (section 231)
        note: Fine entered on the criminal record; people with drug dependency are no longer punished for small amounts
  cultivation:
    text: >-
      Growing cannabis is a crime, prosecuted as drug production: section 231 of the Penal Code
      punishes anyone who unlawfully manufactures a narcotic with a fine or up to two years in
      prison,[@strl] and section 232 raises the maximum to ten years for an aggravated offence.[@strl]
    sources:
      - strl
    penalties:
      - label: Drug production (Penal Code section 231)
        treatment: criminal
        term: Manufacture of a narcotic (section 231)
        prison: 2 years
        note: Fine or up to two years
      - label: Aggravated drug production (Penal Code section 232)
        treatment: criminal
        term: Aggravated narcotics offence (section 232)
        prison: 10 years
  enforcement:
    text: >-
      Fines for most users, none for dependent users with small amounts.[@sn,tni] A 2021 government bill to
      decriminalise all personal possession was voted down in parliament.[@sn]
      [Parliament rejected decriminalisation in 2021.](/history/norway-reform-rejected-2021/)
    sources:
      - sn
      - tni
  sharing:
    text: >-
      Supply is a crime.[@strl] When the Supreme Court ended punishment for dependent users in 2022,
      the Director of Public Prosecutions stressed that the judgments do not touch drugs meant
      for resale.[@ra22,hr22]
      [The 2022 judgments do not touch drugs meant for resale.](/history/norway-supreme-court-2022/)
    sources:
      - ra22
      - hr22
      - strl
  consumption:
    text: Use is itself an offence, fined in the same way as possession.[@sn]
    sources:
      - sn
  access:
    text: >-
      No legal source for adults: section 231 of the Penal Code makes it an offence to acquire,
      store, import or hand over a narcotic unlawfully.[@strl] The only lawful route is medical: two
      approved prescription medicines, plus case-by-case specialist applications for other
      products since 2018.[@dmp]
      [Norway had approved a single cannabis patient by 2016.](/history/norway-one-medical-patient-2016/)
    sources:
      - strl
      - dmp
context:
  recreational:
    text: >-
      There is no legal way to get cannabis. Adults buy hashish from dealers and use in private:
      possession of up to 15 g for personal use normally ends in a fine that goes on the criminal
      record, and use itself is an offence fined the same way.[@sn,tni] People with drug
      dependency are no longer punished for small amounts after the 2022 rulings and guidelines,
      but recreational users still are.[@ra22]
      [The court ended punishment for dependent users in 2022.](/history/norway-supreme-court-2022/)
    sources:
      - sn
      - tni
      - ra22
  hemp:
    status: none
    text: >-
      Norway has no hemp exception: cultivating cannabis is illegal for any purpose, a ban in
      place since the mid-1960s, and the country has no hemp market.[@sensi_no] CBD products
      with any detectable THC count as narcotics; only THC-free products sit outside drug
      control.[@dcbd]
    sources:
      - sensi_no
      - dcbd
  production:
    status: none
    text: >-
      No licensed cannabis production exists: growing is manufacture of a narcotic under section
      231 of the Penal Code,[@strl] and the medical route runs on approved prescription medicines
      and case-by-case specialist permits rather than domestic growing.[@dmp]
    sources:
      - strl
      - dmp
  medical:
    text: >-
      Narrow: two approved prescription medicines, plus case-by-case specialist applications for
      other products since 2018.[@dmp] As of late 2016 a single patient in the whole country had
      been approved.[@wiki]
      [Norway had approved a single cannabis patient by 2016.](/history/norway-one-medical-patient-2016/)
    sources:
      - dmp
      - wiki
  consequences:
    text: >-
      The fine appears on the criminal record, which can block jobs, visas and a driving licence —
      the main real-world penalty for Norwegian users.[@sn]
    sources:
      - sn
  planting:
    seeds: grey
    seeds_trade: open
    clones: illegal
    clones_trade: banned
    text: >-
      Norway's narcotics list defines cannabis as the above-ground parts of any plant of the
      genus, "except the seeds". Seeds are therefore not narcotics.[@nf] Growing plants to produce
      narcotics counts as manufacture under section 7 of the narcotics regulation and needs a
      permit.[@nf]
    sources:
      - nf
  driving:
    status: limit
    text: >-
      Norway sets graded limits for THC of 1.3, 3 and 9 nanograms per millilitre of blood, meant to
      match the national blood-alcohol steps, together with a general impairment offence.[@euda_dd] Police may
      stop and test at random, with oral-fluid tests and blood taken at a hospital or police
      station.[@euda_dd] The ban is at least one year, the fine about one and a half times gross monthly
      income, and prison of up to a year is possible.[@euda_dd] Fixed concentration rules do not
      apply when the excess comes from medicine taken according to a valid doctor’s or dentist’s
      prescription, documented for the relevant dose and time; actual impairment remains
      prohibited.[@rx_driving] Licence fitness is a separate test: approved cannabinoid medicines
      such as Sativex and Epidyolex may be compatible with group 1 only under specialist treatment,
      approved dosing, waiting intervals and clinical fitness conditions. Other cannabinoid
      medicines, including special-permit or foreign-prescribed products, are incompatible with
      driving under the guide unless a formal exemption is granted.[@dmp_drive] Groups 2 and 3 do not
      qualify.[@fitness]
    sources:
      - euda_dd
      - rx_driving
      - fitness
      - dmp_drive
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited under section 231 of the Penal Code.[@strl]
    sources:
      - strl
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone.[@sn] Possession is a criminal offence; for up
      to 15 g for personal use the normal outcome is a fine that is entered on the criminal
      record.[@sn,tni]
    sources:
      - sn
      - tni
  black_market:
    text: >-
      The EU drugs agency's statistical bulletin records 1,087 kg of herbal cannabis and
      2,591 kg of cannabis resin seized in Norway in 2024, against 533 kg and 3,281 kg in
      2023.[@euda_szr] Herbal cannabis was seized on 2,345 occasions and resin on 5,939.[@euda_szr] Countries
      record seizures differently, so the figures are not comparable across borders.[@euda_szr]
    sources:
      - euda_szr
  arrests:
    text: >-
      The national police statistics kept by Kripos count drug cases, not people: 18,273
      in 2024, 12 per cent more than in 2023, after a decline that ran from 2014 to 2022.[@kripos24]
      A case is counted once whatever it is charged as, so the series does not separate
      use and possession from sale.[@kripos24] Cannabis accounted for 40 per cent of drug seizures:
      7,547 seizures of hashish, marijuana and plants, 8 per cent more than the year
      before, weighing 3,678 kg in all.[@kripos24] Kripos notes that minor cases are often settled by
      a fine without the substance being analysed, which makes the seizure counts
      uncertain.[@kripos24]
    sources:
      - kripos24
  culture:
    text: >-
      Hemp sailed with the Vikings: the Oseberg ship burial of 834 held hemp remnants among its
      grave goods, and hemp fibre rigged ships and caulked planks.[@oseberg]
      Eleven centuries later the plant came back as contraband: police recorded Norway's first
      cannabis seizure in 1965, and section 162 of the Penal Code criminalised use three years
      later.[@wiki]
      [Police recorded the first cannabis seizure in 1965.](/history/norway-first-cannabis-seizure-1965/)
      [Section 162 criminalised use in 1968.](/history/norway-section-162-1968/)
    sources:
      - oseberg
      - wiki
  spotlights:
    - title: Punishment ends where dependency begins
      text: >-
        Parliament voted down decriminalisation in 2021, but the Supreme Court finished the job
        for one group a year later: in April 2022 it ruled that people dependent on drugs should
        not be punished for holding small amounts for their own use.[@hr22] The Attorney General
        turned the rulings into guidelines the next month, telling police to resolve doubt in the
        dependent user's favour — while stressing that drugs meant for resale are untouched and
        recreational users are still fined.[@ra22]
        [Parliament rejected decriminalisation in 2021.](/history/norway-reform-rejected-2021/)
        [The court ended punishment for dependent users in 2022.](/history/norway-supreme-court-2022/)
      sources:
        - hr22
        - ra22
