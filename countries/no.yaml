name: Norway
region: Europe
iso_numeric: 578
recreational: illegal
medical: limited
updated: 2026-10-13
summary: >-
  Possession is fined. After 2022 Supreme Court rulings, people with dependency are generally not
  punished for small amounts.
scores:
  possession: 2
  cultivation: 1
  enforcement: 3
  sharing: 1
  consumption: 1
  access: 1
segments:
  possession:
    text: >-
      Possession is a criminal offence. For up to 15 g for personal use the normal outcome is a fine
      — but the kind that is entered on the criminal record. After Supreme Court rulings, the
      Attorney General instructed in May 2022 that people with drug dependency should no longer be
      punished for small amounts, with doubt resolved in their favour. Recreational users are still
      fined.
    sources:
      - sn
      - tni
  cultivation:
    text: >-
      Growing cannabis is a crime, prosecuted as drug production: section 231 of the Penal Code
      punishes anyone who unlawfully manufactures a narcotic with a fine or up to two years in
      prison, and section 232 raises the maximum to ten years for an aggravated offence.
    sources:
      - strl
  enforcement:
    text: >-
      Fines for most users, none for dependent users with small amounts. A 2021 government bill to
      decriminalise all personal possession was voted down in parliament.
    sources:
      - sn
      - tni
  sharing:
    text: >-
      Supply is a crime. When the Supreme Court ended punishment for dependent users in 2022,
      the Director of Public Prosecutions stressed that the judgments do not touch drugs meant
      for resale.
    sources:
      - ra22
      - wiki
  consumption:
    text: Use is itself an offence, fined in the same way as possession.
    sources:
      - sn
      - wiki
  access:
    text: >-
      No legal source for adults: section 231 of the Penal Code makes it an offence to acquire,
      store, import or hand over a narcotic unlawfully. The only lawful route is medical: two
      approved prescription medicines, plus case-by-case specialist applications for other
      products since 2018.
    sources:
      - strl
      - wiki
context:
  production:
    text: No licensed production.
    sources:
      - wiki
  products:
    text: Two authorised cannabinoid medicines only.
    sources:
      - wiki
  medical:
    text: >-
      Narrow: two approved prescription medicines, plus case-by-case specialist applications for
      other products since 2018.
    sources:
      - wiki
  consequences:
    text: >-
      The fine appears on the criminal record, which can block jobs, visas and a driving licence —
      the main real-world penalty for Norwegian users.
    sources:
      - sn
  planting:
    seeds: grey
    seeds_trade: open
    clones: illegal
    clones_trade: banned
    text: >-
      Norway's narcotics list defines cannabis as the above-ground parts of any plant of the
      genus, "except the seeds". Seeds are therefore not narcotics. Growing plants to produce
      narcotics counts as manufacture under section 7 of the narcotics regulation and needs a
      permit.
    sources:
      - nf
  driving:
    status: limit
    text: >-
      Norway sets graded limits for THC of 1.3, 3 and 9 nanograms per millilitre of blood,
      meant to match the national blood-alcohol steps, together with a general impairment
      offence. Police may stop and test at random, with oral-fluid tests and blood taken at a
      hospital or police station. The ban is at least one year, the fine about one and a half
      times gross monthly income, and prison of up to a year is possible.
    sources:
      - euda_dd
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited.
    sources:
      - wiki
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. Possession is a criminal offence; for up
      to 15 g for personal use the normal outcome is a fine that is entered on the criminal
      record.
    sources:
      - sn
      - tni
  black_market:
    text: >-
      The EU drugs agency's statistical bulletin records 1,087 kg of herbal cannabis and
      2,591 kg of cannabis resin seized in Norway in 2024, against 533 kg and 3,281 kg in
      2023. Herbal cannabis was seized on 2,345 occasions and resin on 5,939. Countries
      record seizures differently, so the figures are not comparable across borders.
    sources:
      - euda_szr
  arrests:
    text: >-
      The national police statistics kept by Kripos count drug cases, not people: 18,273
      in 2024, 12 per cent more than in 2023, after a decline that ran from 2014 to 2022.
      A case is counted once whatever it is charged as, so the series does not separate
      use and possession from sale. Cannabis accounted for 40 per cent of drug seizures:
      7,547 seizures of hashish, marijuana and plants, 8 per cent more than the year
      before, weighing 3,678 kg in all. Kripos notes that minor cases are often settled by
      a fine without the substance being analysed, which makes the seizure counts
      uncertain.
    sources:
      - kripos24
