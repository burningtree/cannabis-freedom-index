name: Vietnam
region: Asia
iso_numeric: 704
recreational: death
medical: none
updated: 2026-10-26
summary: >-
  A first detection of use brings a fine and a year of police management; using again in that
  time is a crime. Illegal sale is three to seven years. Life or death applies from 30 kg of
  cannabis resin or 150 kg of the listed plant parts.
