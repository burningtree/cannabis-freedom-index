segments:
  possession:
    text: >-
      Cannabis is on List I, banned from all use. Criminal liability for possession under Article
      249 of the Criminal Code starts at 1 g of cannabis resin or 1 kg of plant material, with one
      to five years in prison. Below those amounts possession is handled administratively, with
      fines, unless the person has a prior record.
    sources:
      - ln1
      - ln2
  cultivation:
    text: >-
      Growing cannabis plants is prohibited: an administrative fine for small numbers, criminal
      liability for larger plots or repeat offences.
    sources:
      - ln2
  enforcement:
    text: >-
      Small-scale users get fines; the real threats are compulsory rehabilitation for locals and
      extremely harsh trafficking penalties.
    sources:
      - ln1
      - cr
  sharing:
    text: >-
      Any sale or transfer is trafficking under Article 251, with two years to life; the death
      penalty applies from 5 kg of resin or 75 kg of plant material.
    sources:
      - cr
      - ln1
  consumption:
    text: >-
      Illegal use brings a warning or a fine of 1–2 million dong. People classed as addicted can be
      sent to compulsory rehabilitation centres for up to two years.
    sources:
      - ln1
  access:
    text: None.
    sources:
      - cr
