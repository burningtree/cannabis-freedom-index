summary: >-
  A first detection of use brings administrative monitoring; repeat detection can lead to addiction
  assessment. Criminal use penalties depend on specified rehabilitation-related statuses. Illegal
  sale carries three to seven years, rising to life or death in the highest cannabis weight bands.
