segments:
  possession:
    text: >-
      Article 249 of the Criminal Code, as amended from 1 July 2025, punishes illegal possession
      that is not for sale, transport or production. The first bracket is three to five years for
      1 g to under 500 g of cannabis resin, or 1 kg to under 10 kg of the listed plant parts
      (leaves, roots, stem, branches, flowers and fruit). A prior administrative penalty or
      conviction that has not been cleared can make a smaller amount criminal. Five kilograms or
      more of resin, or 75 kg or more of those plant parts, is fifteen to twenty years or life.
    sources:
      - a249
  cultivation:
    text: >-
      Growing cannabis plants is prohibited: an administrative fine for small numbers, criminal
      liability for larger plots or repeat offences.
    sources:
      - ln2
  enforcement:
    text: >-
      Illegal cannabis sale can bring life imprisonment or death from 30 kg of resin or 150 kg
      of the listed plant parts under Article 251, as amended from 1 July 2025.[@a251] The
      preceding band, from 5 kg of resin or 75 kg of those plant parts, carries twenty years
      or life.[@a251]
    sources:
      - a251
  sharing:
    text: >-
      Illegal sale under Article 251, as amended from 1 July 2025, is three to seven years.
      From 5 kg to under 30 kg of cannabis resin, or 75 kg to under 150 kg of the listed plant
      parts, the sentence is twenty years or life. From 30 kg of resin, or 150 kg of those plant
      parts, it is life or death. The article is the sale offence.
    sources:
      - a251
  consumption:
    text: >-
      Illegal use brings a warning or a fine of 1–2 million dong, and people classed as addicted can
      be sent to compulsory rehabilitation. Since 1 July 2025, Article 256a of the Criminal Code makes
      using again a crime with two to three years in prison for people in or recently out of
      rehabilitation, and for those caught using during the one-year management period that follows
      a first detection.
    sources:
      - ln1
      - lv256
  access:
    text: >-
      None. The 2025 drug law counts the cannabis plant as a narcotic plant, prohibits growing it
      and excludes cultivation even from licensed research and production.
    sources:
      - l120
context:
  death_penalty:
    text: >-
      From 1 July 2025, illegal sale of 5 kg to under 30 kg of cannabis resin, or 75 kg to under
      150 kg of the listed plant parts, is twenty years or life. Life or death applies from 30 kg
      of resin or 150 kg of those plant parts. Death is an alternative sentence in that bracket,
      not a required one. The same law removed the death penalty for illegal transport.
    sources:
      - a251
      - mps25
  production:
    text: Reliable national information about lawful cannabis production was not established by the retained sources.
    sources: []
  products:
    text: Reliable national information about legally available cannabis products was not established by the retained sources.
    sources: []
  medical:
    text: The retained sources do not establish whether a medical cannabis programme operates.
    sources: []
  consequences:
    text: Users are registered and monitored by local police; foreigners are deported.
    sources:
      - ln1
  planting:
    seeds: grey
    seeds_trade: unclear
    clones: illegal
    clones_trade: banned
    text: >-
      The 2025 drug law, in force since 1 July 2026, names the cannabis plant as a narcotic
      plant and bans growing it or teaching others to grow it. Its list of activities that can
      be licensed leaves cultivation out. The law does not mention seeds.
    sources:
      - l120
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited, and the law provides for the death
      penalty for the most serious drug offences.
    sources:
      - ln2
      - ln1
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. Illegal possession that is not for sale,
      transport or production is three to five years from 1 g of cannabis resin or 1 kg of the
      listed plant parts. A prior penalty can make a smaller amount criminal.
    sources:
      - a249
  driving:
    status: zero
    text: >-
      Driving with narcotic drugs or other legally prohibited stimulants in the body is an
      offence, without a quantified THC allowance in the cited provisions. Under Decree 168/2024,
      effective 1 January 2025, car drivers face VND30–40 million and motorcycle or moped drivers
      VND8–10 million, plus suspension of the right to use a driving licence for 22–24 months.
      Refusing the official drug test carries the same fine and suspension for each vehicle
      category. These are administrative penalties; accidents or other offences can bring
      additional liability.
    sources:
      - traffic168

  black_market:
    text: >-
      Figures reported by the government to the UN drugs office record 2,580 kg of herbal
      cannabis seized in 2024, against 727 kg in 2023. The UN publishes them as kilogram
      equivalents, and countries count seizures differently, so the figures are not
      comparable across borders.
    sources:
      - unodc_szr
