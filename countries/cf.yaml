segments:
  possession:
    text: >-
      Illegal under Law 97.003 of 1997. Possession for personal use is punishable by one to five
      years in prison and a fine of 100,000 to 1,000,000 CFA francs.
    sources:
      - cr
  cultivation:
    text: Cultivation is a crime, though cannabis is grown widely for local use.
    sources:
      - wiki
      - cr
  enforcement:
    text: >-
      Armed conflict makes enforcement patchy outside the capital, but prosecutions continue in
      Bangui and at the airport.
    sources:
