name: Central African Republic
region: Africa
iso_numeric: 140
recreational: illegal
medical: none
updated: 2026-10-27
summary: >-
  Cannabis is prohibited. The 2001 drug law distinguishes small personal possession and
  growing from ordinary production and trafficking, with a fine alone possible for small personal quantities.
scores:
  possession: 1
  cultivation: 1
  enforcement: 1
  sharing: 1
  consumption: 1
