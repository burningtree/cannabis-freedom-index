segments:
  possession:
    text: >-
      Unverified. The 2010 Penal Code (Law 10.001), Article 246, says drug offences are dealt with
      under Law 01.011 of 18 July 2001. The text of that law was not found. A "Law 97.003 of 1997" cited elsewhere could not be traced.
    sources:
      - pc2010
  cultivation:
    text: Unverified; see possession.
    sources:
