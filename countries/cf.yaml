name: Central African Republic
region: Africa
iso_numeric: 140
recreational: illegal
medical: none
updated: 2026-10-21
summary: >-
  Cannabis is prohibited. The 2001 drug law distinguishes small personal possession and growing
  from ordinary production and trafficking, with a fine alone possible for small personal quantities.
scores:
  possession: 1
  cultivation: 1
  enforcement: 1
  sharing: 1
  consumption: 1
  access: 0
segments:
  possession:
    text: >-
      Small quantities held or bought for personal consumption have a separate penalty under the
      2001 law. High-risk plants or substances, including cannabis oil, carry two months to one year,
      a fine of 25,000–1.25 million CFA francs, or both. Cannabis derivatives other than oil carry
      one to six months, a fine of 25,000–500,000 francs, or both. No gram limit is given.
    sources: [law2001]
  cultivation:
    text: >-
      Cannabis growing is prohibited, and landowners and occupiers must destroy cannabis plants
      growing on their land. Small personal cultivation falls under the shorter penalty tiers
      described for possession, with no fixed plant limit. Ordinary high-risk cultivation and
      production carry ten to twenty years, a fine of 250,000–125 million CFA francs, or both.
    sources: [law2001]
  enforcement:
    text: >-
      British travel advice warns of severe penalties for drug use and possession, including
      prison. In November 2024, the anti-drug office destroyed cannabis and other products seized
      along the Oubangui river, in Boy-Rabe and at Combattant market in Bangui. The 2001 law allows
      courts to order care for a dependent person convicted of specified offences; evading it
      carries two to five years, a fine, or both.
    sources: [fcdo, rnl2024, law2001]
  sharing:
    text: >-
      Giving or offering a high-risk drug directly for another person's consumption carries two
      to five years, a fine of 25,000–2.5 million CFA francs, or both. General high-risk supply
      and trafficking carry ten to twenty years, a fine of 250,000–125 million francs, or both.
    sources: [law2001]
  consumption:
    text: >-
      The drug law prohibits using controlled drugs outside a medical prescription. Drugs found
      with a person using them illicitly can be confiscated even without prosecution. The separate
      small-personal-quantity penalty expressly lists possession, purchase and growing.
    sources: [law2001]
  access:
    text: >-
      Recreational supply is prohibited. Licensed operations involving controlled drugs in the
      medical schedules are limited to medical purposes. The health minister can also authorise
      strictly necessary quantities for medical or scientific research, teaching and forensic work.
    sources: [law2001]
context:
  production:
    text: >-
      The law prohibits cannabis cultivation and requires destruction of plants found on occupied
      land. It allows specific health-minister authorisations for research, teaching and forensic
      work involving controlled plants and substances.
    sources: [law2001]
  products:
    text: The retained sources do not identify cannabis products available through a lawful patient supply programme.
    sources: []
  medical:
    text: >-
      The law regulates licensed operations involving controlled medicines and permits specific
      research authorisations. The retained sources do not establish an operating medical cannabis programme.
    sources: [law2001]
  consequences:
    text: >-
      For specified production, trafficking and supply offences, courts may add restrictions on
      residence, travel, civic rights, driving or professional activity. They may exclude a foreigner
      permanently or for two to ten years, with removal after the prison term. These additional
      penalties apply to Articles 95–103; small personal quantities are dealt with separately in
      Article 110.
    sources: [law2001]
  clubs:
    status: none
    text: >-
      No cannabis clubs are known. Cannabis cultivation is prohibited, and giving drugs to another
      person is punishable even when intended for that person's own consumption.
    sources: [law2001]
  visitors:
    status: none
    text: >-
      Visitors have no lawful recreational supply route. British travel advice warns of heavy
      fines and prison for drug use and possession. The drug law also permits exclusion of a
      convicted foreigner for the production, trafficking and supply offences listed in its
      additional-penalty clause.
    sources: [law2001, fcdo]
  black_market:
    text: >-
      Figures reported by the government to the UN drugs office record 374 kg of herbal
      cannabis seized in 2024, against 242 kg in 2023. The UN publishes them as kilogram
      equivalents, and countries count seizures differently, so the figures are not
      comparable across borders.
    sources: [unodc_szr]
