context:
  production:
    text: No licensed production.
    sources:
      - wiki
  products:
    text: No legal products.
    sources:
      - wiki
  medical:
    text: The retained sources do not establish whether a medical cannabis programme operates.
    sources: []
  consequences:
    text: The retained sources do not establish collateral consequences beyond the penalties described above.
    sources: []
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited.
    sources:
      - pc2010
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. British travel advice says there are
      severe penalties for drug use and possession, with heavy fines and a long jail sentence
      on conviction.
    sources:
      - pc2010
      - fcdo
  black_market:
    text: >-
      Figures reported by the government to the UN drugs office record 374 kg of herbal
      cannabis seized in 2024, against 242 kg in 2023. The UN publishes them as kilogram
      equivalents, and countries count seizures differently, so the figures are not
      comparable across borders.
    sources:
      - unodc_szr
