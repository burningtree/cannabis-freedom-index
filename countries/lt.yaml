segments:
  possession:
    text: >-
      Since 2017 possession of any amount, however small, is a criminal offence — before that, small
      amounts were an administrative matter. Typical outcomes are a fine, restriction of liberty or
      short arrest, plus a criminal record. A bill to replace this with warnings or fines of €50–300
      has been in parliament for years; a contradictory vote added administrative liability without
      removing the criminal one, and the committee postponed it again in 2025.
    sources:
      - lrt1
      - lib
  cultivation:
    text: Cultivation is a crime.
    sources:
      - lib
  enforcement:
    text: >-
      Thousands of mostly young people acquire criminal records each year for small amounts — the
      main argument behind the stalled reform.
    sources:
      - lrt2
      - lrt1
  sharing:
    text: Supply is a crime with prison.
    sources:
      - lib
  consumption:
    text: >-
      Use without possession is an administrative offence; in practice users are charged with
      possession.
    sources:
      - lib
  access:
    text: No legal source.
    sources:
      - lrt2
context:
  production:
    text: Industrial hemp only.
    sources:
      - lib
  products:
    text: Registered cannabinoid medicines only.
    sources:
      - lib
  medical:
    text: >-
      Cannabis-based medicines have been permitted since 2019, but only registered pharmaceutical
      products, which are scarcely available.
    sources:
      - lib
  consequences:
    text: The criminal record blocks certain jobs and travel for years.
    sources:
      - lrt2
      - lib
  planting:
    seeds: licensed
    seeds_trade: regulated
    clones: grey
    clones_trade: unclear
    text: >-
      The Fibre Hemp Law covers only catalogue varieties with up to 0.2% THC, sown from seed
      that meets the ministry's quality rules. Since 1 November 2021 gardeners may grow such
      hemp among other garden plants, up to 20 plants per 100 m² on at most 0.1 ha, and must
      hand the seed-packet labels to the State Plant Service. The law speaks only of sowing
      seed and does not mention cuttings.
    sources:
      - xiv386
  driving:
    status: zero
    text: >-
      No THC limit is set; the administrative offence is committed if a drug is detected.
      Police may stop at random and test on suspicion, there is no roadside oral-fluid test,
      and blood or urine is taken at a hospital. The penalty is a fine of 300 to 860 euros and
      a ban of one to three years, with no prison sentence.
    sources:
      - euda_dd
  arrests:
    text: >-
      The EU drugs agency's statistical bulletin records 764 cannabis-related drug law
      offences in Lithuania in 2024, against 783 in 2023. Of the 2024 total, 682 were for use
      or possession for use. It was about twice as high in 2021 and 2022. Countries count
      these differently (offences or offenders, criminal or administrative), so the figure is
      not comparable across borders.
    sources:
      - euda_dlo
  clubs:
    status: none
    text: >-
      No clubs are known. A Europe-wide survey of cannabis social clubs carried out in 2018
      and 2019 found, after online searches and contact with people in the field, that there
      did not seem to be any active club in Lithuania. The model is prohibited throughout the
      European Union. Nothing more recent was found.
    sources:
      - pardal20
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. British travel advice says illegal
      drugs, including cannabis, are strictly prohibited even in very small quantities and
      warns of jail sentences of up to 10 years and heavy fines for possessing, using, buying
      or smuggling them, also in transit. Airport scanners are also used on the baggage of
      passengers in transit.
    sources:
      - lrt2
      - fcdo
