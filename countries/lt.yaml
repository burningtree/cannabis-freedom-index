segments:
  possession:
    text: >-
      Since 2017 possession of any amount, however small, is a criminal offence — before that, small
      amounts were an administrative matter. Typical outcomes are a fine, restriction of liberty or
      short arrest, plus a criminal record. A bill to replace this with warnings or fines of €50–300
      has been in parliament for years; a contradictory vote added administrative liability without
      removing the criminal one, and the committee postponed it again in 2025.
    sources:
      - lrt1
      - lib
  cultivation:
    text: Cultivation is a crime.
    sources:
      - lib
  enforcement:
    text: >-
      Thousands of mostly young people acquire criminal records each year for small amounts — the
      main argument behind the stalled reform.
    sources:
      - lrt2
      - lrt1
  sharing:
    text: Supply is a crime with prison.
    sources:
      - lib
  consumption:
    text: >-
      Use without possession is an administrative offence; in practice users are charged with
      possession.
    sources:
      - lib
  access:
    text: No legal source.
    sources:
      - lrt2
