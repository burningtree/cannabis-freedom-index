name: Lithuania
region: Europe
iso_numeric: 440
recreational: illegal
medical: limited
updated: '2026-10-27'
summary: >-
  Possession of any amount has been a criminal offence since 2017; decriminalisation has been
  repeatedly debated. Cannabinoid medicines are permitted.
scores:
  possession: 1
  cultivation: 2
  enforcement: 2
  sharing: 1
  consumption: 1
  access: 1
segments:
  possession:
    text: >-
      Since [January 2017](/history/lithuania-criminalisation-2017/), small unauthorised possession
      is handled as a criminal misdemeanour; previously administrative liability overlapped with the
      criminal provision.[@lawsummary] For no more than 5 g of cannabis, Article 259(2) permits
      community service, restriction of liberty, a fine or short custody of ten to forty-five
      days.[@analysis18,bk259,bk49] Other ordinary personal possession carries alternatives
      including up to two years in prison; very large quantities fall under Article 260(3), with ten
      to fifteen years even without intent to supply.[@bk259,bk260] The ordinary criminal fine bands
      are 15–500 penalty units for a misdemeanour and 50–2,000 for a non-serious crime, with one
      penalty unit worth EUR50.[@bk47,bk11,finebase]
    sources:
      - lawsummary
      - analysis18
      - bk259
      - bk49
      - bk260
      - bk47
      - bk11
      - finebase
    currency: EUR
    penalties:
      - upto: 5 g
        treatment: criminal
        term: Baudžiamasis nusižengimas, Article 259(2)
        prison_min: 10 days
        prison: 45 days
        fine_min: 750
        fine: 25000
        note: >-
          Short custody or a fine, community service or restriction of liberty; cannabis plant
          material
      - label: Other ordinary personal possession
        treatment: criminal
        term: Article 259(1)
        prison: 2 years
        fine_min: 2500
        fine: 100000
        note: Prison or a fine, community service, restriction of liberty or short custody
      - label: Very large quantity, including without intent to supply
        treatment: criminal
        term: Article 260(3)
        prison_min: 10 years
        prison: 15 years
  cultivation:
    text: >-
      Unauthorised growing below the criminal large-quantity classification brings an administrative
      fine of EUR30–150.[@ank340,bk265] Growing a large quantity contrary to the rules can bring a
      fine, restriction of liberty, short custody or up to five years in prison.[@bk265] The
      ordinary criminal fine band for this offence is 100–4,000 penalty units,
      EUR5,000–200,000.[@bk47,bk11,finebase] Compliant fibre hemp has a separate agricultural and
      small-garden route.[@hempguide]
    sources:
      - ank340
      - bk265
      - bk47
      - bk11
      - finebase
      - hempguide
    currency: EUR
    penalties:
      - label: Unauthorised growing below criminal large-quantity classification
        treatment: civil
        term: ANK 340
        fine_min: 30
        fine: 150
      - label: Large-quantity unlawful growing
        treatment: criminal
        term: BK 265
        prison: 5 years
        fine_min: 5000
        fine: 200000
        note: >-
          Prison or a fine, restriction of liberty or short custody; no fixed plant safe limit
          verified
  enforcement:
    text: >-
      Small possession remains within criminal law, even though the available sanctions include
      community work, fines and restriction of liberty.[@bk259] The drug-control department
      describes the January 2017 shift from overlapping administrative and criminal liability to
      criminal-misdemeanour treatment.[@lawsummary]
    sources:
      - bk259
      - lawsummary
  sharing:
    text: >-
      Selling or otherwise distributing a controlled drug carries two to eight years in
      prison.[@bk260] Large-quantity supply carries eight to ten years; very large quantities ten to
      fifteen.[@bk260] The law makes no general exception for giving cannabis to a friend.[@bk260]
    sources:
      - bk260
    penalties:
      - label: Ordinary sale or other distribution
        treatment: criminal
        term: Article 260(1)
        prison_min: 2 years
        prison: 8 years
      - label: Large-quantity distribution
        treatment: criminal
        term: Article 260(2)
        prison_min: 8 years
        prison: 10 years
      - label: Very large quantity
        treatment: criminal
        term: Article 260(3)
        prison_min: 10 years
        prison: 15 years
  consumption:
    text: >-
      Use without a doctor’s prescription is an administrative offence with a EUR30–150 fine;
      repetition brings EUR150–230 and can lead to an obligation to attend an intervention
      programme.[@ank71] Voluntarily seeking healthcare for the use can exempt the administrative
      offence.[@ank71] Possession is separately criminalised.[@bk259]
    sources:
      - ank71
      - bk259
    currency: EUR
    penalties:
      - label: Use without prescription
        treatment: civil
        term: ANK 71(1)
        fine_min: 30
        fine: 150
      - label: Repeated use offence
        repeat: 2
        treatment: civil
        term: ANK 71(2)
        fine_min: 150
        fine: 230
        note: An intervention programme may also be ordered
  access:
    text: >-
      Prescription-only cannabinoid medicine is obtainable through the medicines system.[@vapris]
      The state register lists Epidyolex (cannabidiol oral solution) as registered and a 100 ml
      package as currently supplied.[@vapris]
    sources:
      - vapris
context:
  production:
    status: medical
    text: >-
      Compliant fibre hemp has an agricultural growing and processing route.[@hempguide] Separately,
      the medicines agency provides licences to manufacture medicinal products containing Schedule I
      substances; applicants need a pharmaceutical manufacturing licence and the additional
      controlled-substance licence.[@manufacture] This medicines route is distinct from the
      fibre-hemp rules for fields and gardens.[@hempguide,manufacture]
    sources:
      - hempguide
      - manufacture
  medical:
    text: >-
      The [medical reform effective in May 2019](/history/lithuania-medical-2019/) permits
      registered cannabis-based medicines whose safety and effectiveness have been
      demonstrated.[@medicalvote] The state medicines register lists prescription Epidyolex, a
      cannabidiol oral solution, with a 100 ml package currently supplied.[@vapris] Pharmaceutical
      manufacture requires the relevant medicines and controlled-substance licences.[@manufacture]
    sources:
      - medicalvote
      - vapris
      - manufacture
  consequences:
    text: >-
      Small possession is a criminal misdemeanour, so an administrative use fine does not describe
      the whole exposure of someone also holding cannabis.[@bk259,ank71] Article 259 provides
      exemption from liability for specified personal acts when a person voluntarily seeks medical
      help or surrenders the drugs.[@bk259] Repeated unlawful use can also bring an obligation to
      attend an intervention programme.[@ank71]
    sources:
      - bk259
      - ank71
  planting:
    seeds: licensed
    seeds_trade: regulated
    clones: grey
    clones_trade: unclear
    text: >-
      The Fibre Hemp Law covers catalogue varieties with up to 0.3% THC, grown from certified seed.
      Gardening hemp may be grown among or beside other garden plants, up to 20 plants per 100 m² on
      at most 0.1 ha. Gardeners must notify the State Plant Service and submit packet labels by 15
      June and keep a growing journal; their products may not be marketed. The separate general
      ceiling for finished hemp goods is 0.2% total THC, with lower category-specific limits. These
      industrial-hemp rules do not authorise growing psychoactive cannabis.
    sources:
      - hempcurrent
      - hempguide
  driving:
    status: zero
    text: >-
      No THC limit is set; the administrative offence is committed if a drug is detected. Police may
      stop at random and test on suspicion, there is no roadside oral-fluid test, and blood or urine
      is taken at a hospital. The penalty is a fine of 300 to 860 euros and a ban of one to three
      years, with no prison sentence.
    sources:
      - euda_dd
  arrests:
    text: >-
      The EU drugs agency's statistical bulletin records 764 cannabis-related drug law offences in
      Lithuania in 2024, against 783 in 2023. Of the 2024 total, 682 were for use or possession for
      use. It was about twice as high in 2021 and 2022. Countries count these differently (offences
      or offenders, criminal or administrative), so the figure is not comparable across borders.
    sources:
      - euda_dlo
  clubs:
    status: none
    text: >-
      No clubs are known. A Europe-wide survey of cannabis social clubs carried out in 2018 and 2019
      found, after online searches and contact with people in the field, that there did not seem to
      be any active club in Lithuania. No law in Lithuania provides for them; Malta (since 2021) and
      Germany (since 2024) license non-profit cannabis associations, but only under their own laws.
      Nothing more recent was found.
    sources:
      - pardal20
      - de_cang
      - mt_cap628
  visitors:
    status: none
    text: >-
      Visitors have no lawful recreational seller.[@bk260] Small possession is a criminal
      misdemeanour and can bring short custody as well as non-custodial alternatives.[@bk259,bk49]
      Use without a prescription is separately punishable by an administrative fine.[@ank71]
    sources:
      - bk260
      - bk259
      - bk49
      - ank71
  black_market:
    text: >-
      The EU drugs agency's statistical bulletin records 230 kg of herbal cannabis and 410 kg of
      cannabis resin seized in Lithuania in 2024, against 198 kg and 3.7 kg in 2023. Herbal cannabis
      was seized on 2,067 occasions and resin on 157. Countries record seizures differently, so the
      figures are not comparable across borders.
    sources:
      - euda_szr
  hemp:
    status: standard
    text: >-
      Fibre hemp uses approved catalogue varieties at no more than 0.3% THC and certified
      seed.[@hempcurrent,hempguide] It may also be grown among or beside garden plants on up to 0.1
      ha, with at most twenty plants per 100 m², notification and seed-label requirements, and no
      marketing of garden-grown products.[@hempguide] Finished hemp goods have a separate general
      0.2% total-THC ceiling and lower category-specific limits.[@hempcurrent] Hemp products sold
      for smoking must contain zero THC under the rules effective from April 2023.[@hempfaq]
    sources:
      - hempcurrent
      - hempguide
      - hempfaq
  recreational:
    text: >-
      Adults have no lawful recreational seller; ordinary distribution remains punishable by
      imprisonment.[@bk260] A small amount for oneself still attracts criminal-misdemeanour
      proceedings.[@bk259] Parliament’s [contradictory 2022
      votes](/history/lithuania-half-step-2022/) left the reform bill unfinished, and a committee
      returned to it in [April 2025](/history/lithuania-cannabis-committee-2025/).[@lrt1,debate25]
    sources:
      - bk260
      - bk259
      - lrt1
      - debate25
  culture:
    text: >-
      [Kanapinis, the hemp man](/culture/traditions/kanapinis-the-hemp-man/), appears in Shrove
      Tuesday celebrations as the lean rival of the fat Lašininis.[@folklore] The Folk Culture
      Centre’s account links him to hemp-seed foods eaten during Lent.[@folklore] Klaipėda’s
      ethnocultural centre describes the pair organising games during the city’s present-day
      carnival.[@klaipeda] [Cannabis](/culture/language/cannabis/) also retains a lawful
      agricultural role through the separate fibre-hemp rules.[@hempguide]
    sources:
      - folklore
      - klaipeda
      - hempguide
