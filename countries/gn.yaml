name: Guinea
region: Africa
iso_numeric: 324
recreational: illegal
medical: none
updated: 2026-10-21
summary: >-
  Cannabis possession and use are offences. The 2016 Penal Code gives small personal possession,
  purchase and growing a separate one-to-three-year range, a value-based fine, or both.
scores:
  possession: 1
  cultivation: 1
  enforcement: 1
  sharing: 1
  consumption: 1
  access: 0
words:
  - { word: Diamba, lang: Manding, meaning: "tobacco for smoking; distinguished from tobacco in general in an 1891 dictionary", sources: [duvall] }
segments:
  possession:
    text: >-
      Small personal buying or possession carries one to three years, a fine equal to three times
      the value seized, or either punishment alone under Article 832 of the 2016 Penal
      Code.[@cp16] The rule expressly includes cannabis oil and other cannabis
      derivatives.[@cp16] No gram limit is given.
    sources: [cp16]
    penalties:
      - label: Small personal buying or possession (Article 832)
        term: Personal use
        treatment: criminal
        prison_min: 1 year
        prison: 3 years
        note: Fine equal to three times the value seized, or either punishment alone; no gram limit
  cultivation:
    text: >-
      Article 832 applies the same shorter tier to a small quantity grown for personal consumption,
      without a fixed plant limit.[@cp16] Ordinary high-risk cultivation and production carry ten
      to twenty years, a fine of three times the value seized, or either punishment alone under
      Article 819.[@cp16]
    sources: [cp16]
    penalties:
      - label: Small quantity grown for personal consumption (Article 832)
        term: Personal use
        treatment: criminal
        prison_min: 1 year
        prison: 3 years
        note: Fine equal to three times the value seized; no plant limit
      - label: Ordinary high-risk cultivation and production (Article 819)
        term: Cultivation
        treatment: criminal
        prison_min: 10 years
        prison: 20 years
        note: Fine of three times the value seized, or either punishment alone
  enforcement:
    text: >-
      In a 2019 Dixinn hearing, prosecutors requested prison terms for some cannabis defendants
      and acquittal for others; the report preceded judgment.[@gn1] Courts can compel convicted
      drug users to undergo treatment instead of or alongside punishment, with two to five years
      for refusing treatment under the 2016 code.[@cp16]
    sources: [gn1, cp16]
  sharing:
    text: >-
      The 2016 code has overlapping supply clauses. Article 835 sets one to three years and a fine
      of 1–5 million Guinean francs, or either punishment alone, for giving narcotics directly for
      another person's use.[@cp16] Article 821 sets five to ten years and a fine of three times the
      value seized, or either alone, for directly supplying high-risk drugs.[@cp16] Ordinary
      high-risk trafficking carries ten to twenty years, a value-based fine, or either
      alone.[@cp16]
    sources: [cp16]
    currency: GNF
    penalties:
      - label: Giving narcotics for another person's use (Article 835)
        term: Supply
        treatment: criminal
        prison_min: 1 year
        prison: 3 years
        fine: 5000000
        note: Fine of 1–5 million Guinean francs, or either punishment alone
      - label: Directly supplying high-risk drugs (Article 821)
        term: Supply
        treatment: criminal
        prison_min: 5 years
        prison: 10 years
        note: Fine of three times the value seized, or either alone
      - label: Ordinary high-risk trafficking
        term: Trafficking
        treatment: criminal
        prison_min: 10 years
        prison: 20 years
        note: Value-based fine, or either punishment alone
  consumption:
    text: >-
      Article 831 prohibits using controlled drugs outside a medical prescription and provides for
      confiscation independently of prosecution.[@cp16] The small-personal-quantity penalty in
      Article 832 expressly lists buying, possession and growing.[@cp16] Consumption was among the
      allegations in the 2019 Dixinn case.[@gn1]
    sources: [cp16, gn1]
  access:
    text: >-
      Recreational production and supply are criminal offences.[@cp16] The retained sources do not
      identify a lawful recreational source.
    sources: [cp16]
context_not_applicable:
  death_penalty:
    text: >-
      Guinea abolished the death penalty for ordinary crimes in the 2016 criminal code and
      under military law in 2017; no cannabis offence carries a capital sentence.[@hrw_gn]
    sources: [hrw_gn]
context:
  recreational:
    text: >-
      There is no legal way to get cannabis. Small personal buying or possession brings one to
      three years and a fine of three times the value seized; convicted foreigners can also be
      permanently excluded from the country.[@cp16]
    sources: [cp16]
  hemp:
    status: none
    text: >-
      No industrial-hemp exception was verified: the 2016 code lists cannabis and its derivatives
      among controlled drugs with no low-THC distinction, and no hemp production is
      documented.[@cp16]
    sources: [cp16]
  culture:
    text: >-
      An [1891 French-Mandingo
      dictionary](/history/guinea-mandingo-dictionary-diamba-1891/) translated *diamba*
      specifically as tobacco for smoking, while *sira* meant tobacco in general — one of
      many European records of the cannabis word as tobacco across Manding
      languages.[@duvall]
    sources:
      - duvall
  production:
    status: none
    text: >-
      No licensed cannabis production exists; cultivation and production are criminal offences
      under Articles 832 and 819.[@cp16]
    sources: [cp16]
  medical:
    text: >-
      No patient programme is documented. The 2016 code prohibits use outside a medical
      prescription but sets up no route for patients to obtain cannabis.[@cp16]
    sources: [cp16]
  consequences:
    text: >-
      Courts can impose additional penalties for drug offences, including restrictions on travel,
      residence, civic rights and professional activity.[@cp16] They may permanently exclude a
      convicted foreigner from Guinea.[@cp16] Compulsory treatment can replace or accompany
      punishment, and refusal carries two to five years in prison.[@cp16]
    sources: [cp16]
  planting:
    seeds: grey
    seeds_trade: unclear
    clones: illegal
    clones_trade: banned
    text: >-
      The 2016 Penal Code punishes unlawful drug-plant cultivation.[@cp16] Article 832 sets one to
      three years, a fine equal to three times the value seized, or either punishment alone, for
      small personal cultivation, with no plant limit.[@cp16] The drug clauses do not settle seed
      sale or possession separately.
    sources: [cp16]
  clubs:
    status: none
    text: >-
      No cannabis clubs are known. Growing and supplying cannabis remain criminal offences,
      including growing a small quantity for personal use.[@cp16]
    sources: [cp16]
  visitors:
    status: none
    text: >-
      Visitors have no lawful recreational supply route.[@cp16] Small personal possession is a
      criminal offence, and the code permits permanent exclusion of convicted foreigners as an
      additional penalty for drug offences.[@cp16]
    sources: [cp16]
