name: Guinea
region: Africa
iso_numeric: 324
recreational: illegal
medical: none
updated: 2026-10-21
summary: >-
  Cannabis possession and use are offences. The 2016 Penal Code gives small personal possession,
  purchase and growing a separate one-to-three-year range, a value-based fine, or both.
scores:
  possession: 1
  cultivation: 1
  enforcement: 1
  sharing: 1
  consumption: 1
  access: 0
segments:
  possession:
    text: >-
      Small personal buying or possession carries one to three years, a fine equal to three times
      the value seized, or either punishment alone under Article 832 of the 2016 Penal Code. The
      rule expressly includes cannabis oil and other cannabis derivatives. No gram limit is given.
    sources: [cp16]
  cultivation:
    text: >-
      Article 832 applies the same shorter tier to a small quantity grown for personal consumption,
      without a fixed plant limit. Ordinary high-risk cultivation and production carry ten to twenty
      years, a fine of three times the value seized, or either punishment alone under Article 819.
    sources: [cp16]
  enforcement:
    text: >-
      In a 2019 Dixinn hearing, prosecutors requested prison terms for some cannabis defendants
      and acquittal for others; the report preceded judgment. Courts can compel convicted drug
      users to undergo treatment instead of or alongside punishment, with two to five years for
      refusing treatment under the 2016 code.
    sources: [gn1, cp16]
  sharing:
    text: >-
      The 2016 code has overlapping supply clauses. Article 835 sets one to three years and a fine
      of 1–5 million Guinean francs, or either punishment alone, for giving narcotics directly for
      another person's use. Article 821 sets five to ten years and a fine of three times the value
      seized, or either alone, for directly supplying high-risk drugs. Ordinary high-risk trafficking
      carries ten to twenty years, a value-based fine, or either alone.
    sources: [cp16]
  consumption:
    text: >-
      Article 831 prohibits using controlled drugs outside a medical prescription and provides for
      confiscation independently of prosecution. The small-personal-quantity penalty in Article 832
      expressly lists buying, possession and growing. Consumption was among the allegations in the
      2019 Dixinn case.
    sources: [cp16, gn1]
  access:
    text: >-
      Recreational production and supply are criminal offences. The retained sources do not
      identify a lawful recreational source.
    sources: [cp16]
context:
  production:
    text: >-
      Ordinary high-risk drug cultivation and production are criminal offences. The retained
      sources do not identify licensed cannabis producers.
    sources: [cp16]
  products:
    text: The retained sources do not identify cannabis products available through a lawful patient supply programme.
    sources: []
  medical:
    text: The retained sources do not establish an operating medical cannabis programme.
    sources: []
  consequences:
    text: >-
      Courts can impose additional penalties for drug offences, including restrictions on travel,
      residence, civic rights and professional activity. They may permanently exclude a convicted
      foreigner from Guinea. Compulsory treatment can replace or accompany punishment, and refusal
      carries two to five years in prison.
    sources: [cp16]
  planting:
    seeds: grey
    seeds_trade: unclear
    clones: illegal
    clones_trade: banned
    text: >-
      The 2016 Penal Code punishes unlawful drug-plant cultivation. Article 832 sets one to three
      years, a fine equal to three times the value seized, or either punishment alone, for small
      personal cultivation. It gives no plant limit. The drug clauses do not settle seed sale or
      possession separately.
    sources: [cp16]
  clubs:
    status: none
    text: >-
      No cannabis clubs are known. Growing and supplying cannabis remain criminal offences,
      including growing a small quantity for personal use.
    sources: [cp16]
  visitors:
    status: none
    text: >-
      Visitors have no lawful recreational supply route. Small personal possession is a criminal
      offence, and the code permits permanent exclusion of convicted foreigners as an additional
      penalty for drug offences.
    sources: [cp16]
