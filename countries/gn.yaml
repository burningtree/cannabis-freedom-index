  planting:
    seeds: grey
    seeds_trade: unclear
    clones: illegal
    clones_trade: banned
    text: >-
      The 2016 Penal Code punishes growing drug plants unlawfully. Under Article 832, growing
      a small amount for one's own use carries one to three years in prison and a fine of
      three times the value seized. The drug articles speak of plants and substances and do
      not mention seeds.
    sources:
      - cp16
