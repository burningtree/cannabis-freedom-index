segments:
  possession:
    text: >-
      Possession and consumption of 'chanvre indien' are offences under the Penal Code. Reported
      cases show prosecutors asking for sentences in the range of six months suspended plus a fine
      of 500,000 Guinean francs, up to a year in prison for users caught in the act.
    sources:
      - gn1
  cultivation:
    text: Cultivation is a crime.
    sources:
      - gn2
  enforcement:
    text: >-
      Short or suspended sentences and fines for users in the cases reported; the statutory range
      was not available in the sources consulted.
    sources:
      - gn1
  sharing:
    text: Sale is prosecuted as trafficking; large seizures are publicised regularly.
    sources:
      - gn2
  consumption:
    text: Consumption is itself charged alongside possession.
    sources:
      - gn1
  access:
    text: None.
    sources:
      - gn2
