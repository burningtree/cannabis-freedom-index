summary: >-
  Since 2019 public possession brings a fine rather than prosecution, and private use at home is not
  enforced. Israel runs one of the world's largest medical programmes relative to population.
scores:
  possession: 3
  cultivation: 1
  enforcement: 4
  sharing: 1
  consumption: 3
