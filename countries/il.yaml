segments:
  possession:
    text: >-
      Possession of up to 15 g for personal use is an administrative offence, not a crime: a fixed
      fine and no criminal record, under rules first introduced in 2019 and made permanent and
      broader in 2022. Possession at home in small amounts is generally not enforced. Above 15 g, or
      for soldiers and minors, criminal law applies.
    sources:
      - chambers
      - wiki
  cultivation:
    text: Growing cannabis without a licence is a criminal offence, including a single plant at home.
    sources:
      - wiki
  enforcement:
    text: >-
      Personal users get a fine. Growing, dealing and larger quantities are criminal offences with
      prison.
    sources:
      - wiki
      - chambers
  sharing:
    text: Supply of any kind, including unpaid sharing, is treated as dealing.
    sources:
      - wiki
  consumption:
    text: >-
      Use in public is fined under the same administrative scheme. Use in a private home is in
      practice left alone.
    sources:
      - wiki
      - chambers
  access:
    text: >-
      No adult-use shops. But Israel has one of the world's largest medical programmes per head,
      with cannabis sold in ordinary pharmacies; since April 2024 many more doctors, including in
      the health funds, can prescribe it directly instead of applying for a licence for each
      patient.
    sources:
      - chambers
      - alm
context:
  production:
    text: >-
      Licensed medical cultivation, manufacturing and pharmacy distribution are well developed, with
      no cap on the number of growers. No production for adult use.
    sources:
      - chambers
      - alm
  products:
    text: >-
      A wide range of medical flower and oils, labelled by THC and CBD content. Nothing for general
      sale.
    sources:
      - chambers
  medical:
    text: >-
      Broad by international standards: on prescription for a list of conditions including chronic
      pain, cancer, PTSD and others, dispensed in pharmacies. The 2024 reform moved from a licence
      model to a prescription model for many indications.
    sources:
      - chambers
      - alm
  consequences:
    text: >-
      The administrative fine leaves no criminal record. The decriminalisation does not apply to
      soldiers, and drug-driving rules are strict.
    sources:
      - wiki
  planting:
    seeds: licensed
    seeds_trade: regulated
    clones: licensed
    clones_trade: regulated
    text: >-
      The Dangerous Drugs Ordinance treats the cannabis plant, all of its components and its
      derivatives as a dangerous drug. Cultivation, possession, distribution, transport and every
      other activity involving the plant require the appropriate Medical Cannabis Unit licence;
      seeds and clones are therefore available only within the licensed medical system.
    sources:
      - knesset_med
      - gov_licensing
  clubs:
    status: tolerated
    text: >-
      No law provides for cannabis clubs, and supplying cannabis, even unpaid, is treated as
      dealing. What exists is a bring-your-own lounge for patients. HaTachana 420 opened in
      Tel Aviv's Florentin neighbourhood around the start of 2023 and was described as the
      first place of its kind in the city: it grew out of a Facebook community of about 15,000
      medical cannabis patients, admits only holders of a medical prescription, and supplies
      nothing, members smoking what they bought at a pharmacy; its founder contrasted it with
      Barcelona's clubs on exactly that point. No police action against it was reported. No
      growing club, and no venue for people without a medical licence, was found, and whether
      the lounge still operates could not be confirmed.
    sources:
      - to23
      - wiki
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. British travel advice says only that a
      person caught with drugs can expect a prison sentence.
    sources:
      - chambers
      - alm
      - fcdo
  driving:
    status: zero
    text: >-
      The Traffic Ordinance makes it an offence to be 'intoxicated' while driving or in charge
      of a vehicle, and defines an intoxicated person to include anyone who has a dangerous
      drug, or the metabolic products of one, in their body. No level is set, so traces left
      by earlier use count. The definition leaves out drugs that the health minister has
      exempted on set conditions. The offence carries up to two years in prison or a fine.
    sources:
      - pkt64
