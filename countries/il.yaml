name: Israel
region: Asia
iso_numeric: 376
recreational: decriminalised
medical: legal
updated: "2026-10-28"
summary: >-
  Possession and use for personal consumption are administrative offences carrying a fixed fine, not
  a criminal record, but police issued no such fines between 2022 and 2025. Above 15 g the law
  presumes dealing unless the accused rebuts it; all growing and supply are criminal. Medical
  cannabis is legal and large: 145,758 active licences and prescriptions in June 2026.
scores:
  possession: 3
  cultivation: 1
  enforcement: 4
  sharing: 1
  consumption: 3
  access: 3
segments:
  possession:
    text: >-
      Possession and use for personal consumption are administrative offences under the 2022
      regulations, with a fine of 500 shekels for possession or private use and 1,000 shekels for
      public use, and no criminal record.[@admin_fines] The 15 g line comes from the Dangerous Drugs
      Ordinance’s Second Schedule: above it, possession is presumed not to be for personal
      consumption unless the accused proves otherwise.[@ddo] Above 15 g the offence carries up to 20
      years in prison, or up to three years where the court accepts personal use.[@ddo] Possession
      in a school by a non-student aged 16 or over carries up to five years.[@ddo] Soldiers,
      reservists in certain police or prison units, and prisoners are outside the administrative
      scheme.[@admin_fines] Minors have been covered by the fines since 16 February 2023.[@mako2023]
      In practice the fine scheme has not been used: police issued no administrative cannabis fines
      between 2022 and 2025.[@meida2026]
    sources:
      - admin_fines
      - ddo
      - mako2023
      - meida2026
    currency: ILS
    penalties:
      - upto: 15 g
        treatment: civil
        term: Administrative offence
        fine: 500
        note: Public use 1,000 shekels; no criminal record
      - over: 15 g
        treatment: criminal
        term: Section 7(c)
        prison: 20 years
        note: Above 15 g, non-personal use is presumed; own use up to 3 years
      - label: Possession in a school by a non-student aged 16 or over
        treatment: criminal
        term: Section 7(d)
        prison: 5 years
  cultivation:
    text: >-
      Growing cannabis without a licence from the health ministry's Director-General is a criminal
      offence, including a single plant at home.[@ddo] Section 6 sets a maximum of twenty years in
      prison or a fine.[@ddo] There is no personal-use exception for cultivation, and medical
      patients must obtain their cannabis through the licensed medical system rather than growing
      it.[@regs2024]
    sources:
      - ddo
      - regs2024
    penalties:
      - label: Any cultivation, including one plant
        treatment: criminal
        term: Section 6
        prison: 20 years
        note: No personal-use exception; a health ministry licence is required
  enforcement:
    text: >-
      Personal users are meant to receive a fine, while growing, dealing and larger quantities are
      criminal. The gap between the two is wide in practice: police issued no administrative
      cannabis fines in 2022–2025, after 50,335 fines in 2019–2022, and said the enforcement
      framework for the 2022 regulations was still being designed.[@meida2026] Police opened 9,164
      files for drug trafficking, possession not for personal use, cultivation or manufacture in
      2024, a category that covers all drugs.[@police2024]
    sources:
      - meida2026
      - police2024
  sharing:
    text: >-
      Supply of any kind is treated as dealing: section 13 of the Dangerous Drugs Ordinance forbids
      supplying a drug in any way, "whether for payment or not", and section 19A sets a maximum of
      twenty years in prison or a fine.[@ddo] Giving cannabis to a minor, allowing a minor to obtain
      or use it, or inducing a minor carries up to twenty-five years, with imprisonment mandatory on
      conviction.[@ddo]
    sources:
      - ddo
    penalties:
      - label: Supply, sale, trade or import/export, paid or free
        treatment: criminal
        term: Section 13
        prison: 20 years
      - label: Supply to a minor or inducing a minor
        treatment: criminal
        term: Section 21
        prison: 25 years
        note: Imprisonment mandatory
  consumption:
    text: >-
      Use is covered by the same administrative scheme as possession: 500 shekels for use not in a
      public place and 1,000 shekels for use in public, with no criminal record.[@admin_fines]
      Private use at home is therefore an administrative offence, not a legal act, even though it is
      rarely enforced.[@admin_fines] Police issued no cannabis fines at all between 2022 and
      2025.[@meida2026]
    sources:
      - admin_fines
      - meida2026
    currency: ILS
    penalties:
      - label: Use not in a public place
        treatment: civil
        term: Administrative offence
        fine: 500
      - label: Use in a public place
        treatment: civil
        term: Administrative offence
        fine: 1000
        note: No fines issued between 2022 and 2025
  access:
    text: >-
      There are no adult-use shops. Israel has one of the world's largest medical programmes
      relative to population: 145,758 active licences and prescriptions in June 2026.[@imcu2026] The
      April 2024 reform moved ten indications to health-fund prescriptions, capped at 60 g a month,
      but chronic pain and PTSD remained under Medical Cannabis Unit licences.[@regs2024]
    sources:
      - imcu2026
      - regs2024
context:
  recreational:
    text: >-
      There is no legal recreational supply. Possession and use for personal consumption are
      administrative offences with a fixed fine and no record, and public use is fined the same
      way.[@admin_fines] Above 15 g, for soldiers, prisoners and all supply, criminal law
      applies.[@ddo] The fine scheme exists but has not been used since 2022.[@meida2026] No
      adult-use bill was advancing in 2026.
    sources:
      - admin_fines
      - ddo
      - meida2026
  production:
    status: medical
    text: >-
      Licensed medical cultivation, manufacturing, import and export are well developed, with no cap
      on the number of growers.[@regs2024] There is no production for adult use. The medical sector
      is export-oriented and regulated by the Medical Cannabis Unit under the Dangerous Drugs
      Ordinance.[@regs2024]
    sources:
      - regs2024
  medical:
    text: >-
      Medical cannabis is legal on prescription for ten indications, including active oncology,
      inflammatory bowel disease, AIDS, multiple sclerosis, Parkinson's, Tourette syndrome,
      epilepsy, terminal illness, autism and dementia.[@regs2024] Prescriptions are capped at 60 g a
      month and are written by specialists or authorised health-fund and hospital physicians, not
      primary-care doctors.[@regs2024] Chronic non-cancer pain and PTSD, the two largest categories,
      remained under Medical Cannabis Unit licences rather than the prescription route.[@aviram2025]
      Active licences and prescriptions reached 145,758 in June 2026.[@imcu2026]
    sources:
      - regs2024
      - aviram2025
      - imcu2026
  hemp:
    status: none
    text: >-
      There is no separate industrial-hemp regime. The Dangerous Drugs Ordinance defines cannabis to
      include every part of the plant except oil from its seeds, so low-THC hemp still needs a
      cultivation licence.[@ddo] In February 2022 the health minister announced that CBD below a low
      THC threshold would leave the ordinance, but no enacted exemption was found and the current
      schedule still catches cannabis extracts.[@cbd2022,ddo]
    sources:
      - ddo
      - cbd2022
  consequences:
    text: >-
      The administrative fine leaves no criminal record, but a criminal conviction for possession
      above 15 g, cultivation or supply does.[@ddo] Soldiers, reservists in certain police or prison
      units, and prisoners are outside the administrative scheme.[@admin_fines] A drug conviction
      can also affect sentencing for later offences.[@ddo]
    sources:
      - ddo
      - admin_fines
  planting:
    seeds: licensed
    seeds_trade: regulated
    clones: licensed
    clones_trade: regulated
    text: >-
      The Dangerous Drugs Ordinance treats the cannabis plant, all of its components and its
      derivatives as a dangerous drug.[@ddo] Cultivation, possession, distribution, transport and
      every other activity involving the plant require the appropriate Medical Cannabis Unit
      licence; seeds and clones are therefore available only within the licensed medical
      system.[@regs2024]
    sources:
      - ddo
      - regs2024
  clubs:
    status: tolerated
    text: >-
      No law provides for cannabis clubs, and supplying cannabis, even unpaid, is treated as
      dealing.[@ddo] What exists is a bring-your-own lounge for patients. HaTachana 420 opened in
      Tel Aviv's Florentin neighbourhood around the start of 2023 and was described as the first
      place of its kind in the city: it grew out of a Facebook community of about 15,000 medical
      cannabis patients, admits only holders of a medical prescription, and supplies nothing,
      members smoking what they bought at a pharmacy.[@to23] No police action against it was
      reported, and whether the lounge still operates could not be confirmed.
    sources:
      - ddo
      - to23
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. Possession and use for personal consumption
      are administrative offences with a fixed fine and no criminal record.[@admin_fines] Above 15 g
      criminal law applies, and the law makes no exception for visitors.[@ddo]
    sources:
      - admin_fines
      - ddo
  driving:
    status: zero
    text: >-
      The Traffic Ordinance makes it an offence to be "intoxicated" while driving or in charge of a
      vehicle, and defines an intoxicated person to include anyone who has a dangerous drug, or the
      metabolic products of one, in their body.[@pkt64] No level is set, so traces left by earlier
      use count.[@pkt64] A medical cannabis licence is not a defence, and the patient-driving
      regulations never came into force.[@pkt64] The offence carries up to two years in prison or a
      fine, and a conviction brings at least two years' licence disqualification.[@pkt64]
    sources:
      - pkt64
  black_market:
    text: >-
      The illicit market remains large. Police opened 9,164 files for drug trafficking, possession
      not for personal use, cultivation or manufacture in 2024, a category covering all drugs, and
      police laboratories tested 10.45 tonnes of cannabis and 1.6 tonnes of hashish that
      year.[@police2024] No cannabis-specific arrest total was found, and the 9,164 figure should
      not be read as cannabis alone.[@police2024]
    sources:
      - police2024
  arrests:
    text: >-
      Police issued no administrative cannabis fines in 2022–2025, after 50,335 fines in
      2019–2022.[@meida2026] UNODC data record 7,497 police contacts for drug possession in 2024,
      covering all drugs.[@unodc] The two series measure different things and neither is
      cannabis-specific.
    sources:
      - meida2026
      - unodc
  culture:
    text: >-
      Israel's cannabis science began with [Raphael Mechoulam](/culture/people/raphael-mechoulam/),
      who isolated THC in 1964 with Yehiel Gaoni from hashish supplied by the police, and whose
      group later found the body's own cannabinoids.[@mechoulam2020] His laboratory also hosted
      [Lumír Hanuš](/culture/people/lumir-hanus/), the Czech chemist who co-discovered anandamide in
      Jerusalem in 1992.[@mechoulam2020] That research tradition is why Israel's medical programme
      is unusually large and why the country is a centre of cannabinoid science.
    sources:
      - mechoulam2020
