segments:
  possession:
    text: >-
      Possession of up to 15 g for personal use is an administrative offence, not a crime: a fixed
      fine and no criminal record, under rules first introduced in 2019 and made permanent and
      broader in 2022. Possession at home in small amounts is generally not enforced. Above 15 g, or
      for soldiers and minors, criminal law applies.
    sources:
      - chambers
      - wiki
  cultivation:
    text: Growing cannabis without a licence is a criminal offence, including a single plant at home.
    sources:
      - wiki
  enforcement:
    text: >-
      Personal users get a fine. Growing, dealing and larger quantities are criminal offences with
      prison.
    sources:
      - wiki
      - chambers
  sharing:
    text: Supply of any kind, including unpaid sharing, is treated as dealing.
    sources:
      - wiki
  consumption:
    text: >-
      Use in public is fined under the same administrative scheme. Use in a private home is in
      practice left alone.
    sources:
      - wiki
      - chambers
  access:
    text: >-
      No adult-use shops. But Israel has one of the world's largest medical programmes per head,
      with cannabis sold in ordinary pharmacies; since April 2024 many more doctors, including in
      the health funds, can prescribe it directly instead of applying for a licence for each
      patient.
    sources:
      - chambers
      - alm
context:
  production:
    text: >-
      Licensed medical cultivation, manufacturing and pharmacy distribution are well developed, with
      no cap on the number of growers. No production for adult use.
    sources:
      - chambers
      - alm
  products:
    text: >-
      A wide range of medical flower and oils, labelled by THC and CBD content. Nothing for general
      sale.
    sources:
      - chambers
  medical:
    text: >-
      Broad by international standards: on prescription for a list of conditions including chronic
      pain, cancer, PTSD and others, dispensed in pharmacies. The 2024 reform moved from a licence
      model to a prescription model for many indications.
    sources:
      - chambers
      - alm
  consequences:
    text: >-
      The administrative fine leaves no criminal record. The decriminalisation does not apply to
      soldiers, and drug-driving rules are strict.
    sources:
      - wiki
