      - st
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. British travel advice says possessing,
      selling and using drugs is illegal and can lead to prison sentences.
    sources:
      - fcdo
  driving:
    status: impairment
    text: >-
      Road Transport Act section 43 makes driving or attempting to drive on a road or
      public place while unfit through drugs an offence; unfitness means impaired ability
      to drive properly. In the Magistrates' Court a first offence carries up to 10,000
      penalty units or twelve months' imprisonment or both; a repeat carries up to 20,000
      units or two years or both. High Court conviction carries up to 20,000 units or two
      years or both. Penalty units must not be read as Solomon Islands dollars. Licence
      disqualification normally lasts at least twelve months, rising to at least three
      years if there was a like driving conviction within the preceding ten years, with
      a special-reasons exception. Being in charge while not driving is a separate offence
      with different penalties. The separate concentration offence concerns alcohol,
      not a numerical THC limit.
    sources:
      - roadtransport
