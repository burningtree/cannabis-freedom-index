name: Solomon Islands
region: Oceania
iso_numeric: 90
recreational: illegal
medical: limited
updated: 2026-10-27
summary: >-
  Cannabis possession, growing and gifting are offences. The published reprint gives up to six
  months on summary conviction or ten years on conviction with assessors, plus fines expressed in
  penalty units; current practice needs fuller verification.
scores:
  possession: 1
  cultivation: 1
  enforcement: 2
  sharing: 1
  consumption: 1
  access: 0
segments:
  possession:
    text: >-
      Section 8(b) makes possession of Indian hemp an offence. Section 39(2) of the authorised
      reprint gives up to 5,000 penalty units or six months or both on summary conviction, and up to
      100,000 penalty units or ten years or both on conviction by the court sitting with assessors.[@act]
      Penalty units are not a verified current dollar tariff and must not be read as dollars.[@act] The government catalogue lists this
      reprint as current; a 2025 amendment bill was under parliamentary inquiry in February 2026,
      and its later enactment or commencement was not established.[@inquiry2026] The bill is traced in the
      [2026 bill entry](/history/solomon-islands-dangerous-drugs-bill-2026/).
    sources:
      - act
      - inquiry2026
    penalties:
      - label: Summary conviction (section 39)
        treatment: criminal
        term: Possession
        prison: 6 months
        note: Up to 5,000 penalty units or six months; units are not dollars
      - label: Conviction with assessors (section 39)
        treatment: criminal
        term: Possession
        prison: 10 years
        note: Up to 100,000 penalty units or ten years; units are not dollars
  cultivation:
    text: >-
      Sections 7–8 prohibit growing Indian hemp even for private use, with no small-grow exemption
      in the reviewed text.[@act] Section 39 supplies the same general court-dependent maximum penalties
      as for possession.[@act] The statute does not itself demonstrate typical sentences or a separate
      plantation-size tariff.
    sources:
      - act
    penalties:
      - label: Summary conviction (sections 7–8, 39)
        treatment: criminal
        term: Unlicensed cultivation
        prison: 6 months
        note: Up to 5,000 penalty units or six months; units are not dollars
      - label: Conviction with assessors (sections 7–8, 39)
        treatment: criminal
        term: Unlicensed cultivation
        prison: 10 years
        note: Up to 100,000 penalty units or ten years; units are not dollars
  enforcement:
    text: >-
      The authorised statute permits fines, imprisonment or both, with distinct summary and
      assessor-court maxima.[@act] The retained 2016 case and crop-seizure report are individual
      observations, not sufficient evidence that most personal-use cases nationally end in fines or
      short sentences. A representative current sentencing account remains a research gap.
    sources:
      - act
  sharing:
    text: >-
      Section 8(b) expressly criminalises giving Indian hemp to another person as well as selling
      and possessing it. There is no exemption for an unpaid gift in that provision. The general
      penalties in section 39 depend on the mode of trial.[@act]
    sources:
      - act
  consumption:
    text: >-
      Officially published sections 7–8 expressly cover cultivation, possession, giving and sale of
      cannabis. A separate cannabis-use offence was not identified there; the explicit smoking and
      use provisions in section 12 concern prepared opium.[@act] British travel advice more broadly warns
      that drug use is illegal.[@fcdo] Possession associated with cannabis use remains criminal.[@act]
    sources:
      - act
      - fcdo
  access:
    text: >-
      No recreational supply or operating cannabis patient service was established. Sections 13–20
      do provide a controlled medicines framework that expressly includes cannabis extracts and
      tinctures, with powers over manufacture, prescriptions, import, storage and dispensing. That
      framework is not evidence that medicines are stocked or that flower can lawfully be purchased.[@act]
    sources:
      - act
context:
  production:
    status: medical
    text: >-
      The cultivation ban applies even to private use.[@act] Separately, sections 13 and 15 include
      cannabis extracts and tinctures within the controlled pharmaceutical framework and provide for
      rules authorising qualified pharmaceutical businesses to prepare controlled drugs.[@act] An
      operating cannabis production industry was not established.
    sources:
      - act
  medical:
    text: >-
      Sections 13–20 contemplate regulated cannabis extracts and tinctures within the
      controlled-medicines system, including prescription rules, storage and authorised withdrawal
      by medical and pharmacy professionals.[@act] A broad patient programme, issued cannabis licences and
      dispensing availability were not verified. The Act covers the cannabis plant and resin under
      Part I and extracts or tinctures under Part III — statutory product categories, not a verified
      list of products currently available to patients.[@act]
    sources:
      - act
  recreational:
    text: >-
      Recreational cannabis is fully prohibited: growing, possession, giving and sale are all
      offences with no personal-use allowance, and penalties run to ten years on conviction with
      assessors.[@act] The 1941 Act behind the current reprint is traced in the
      [1941 Act](/history/solomon-islands-dangerous-drugs-act-1941/).
    sources:
      - act
  hemp:
    status: none
    text: >-
      No hemp exception operates: Indian hemp means cannabis sativa or indica or any portion, and
      sections 7–8 prohibit cultivation even for private use.[@act]
    sources:
      - act
  consequences:
    text: >-
      Section 39(2) requires forfeiture of articles involved in a conviction and permits destruction
      or other court-directed disposal. Sections 6 and 10 separately address unlawfully imported
      substances and destruction of plants. These provisions do not by themselves establish
      automatic deportation or employment consequences.[@act]
    sources:
      - act
  clubs:
    status: none
    text: >-
      The published Act has no recreational collective-growing exemption: sections 7–8 prohibit
      private cultivation and giving cannabis to another person. That statutory restriction does not
      establish whether informal associations exist.[@act]
    sources:
      - act
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone: sections 7–8 prohibit cultivation,
      possession, giving and sale.[@act]
    sources:
      - act
  driving:
    status: impairment
    text: >-
      Road Transport Act section 43 makes driving or attempting to drive on a road or public place
      while unfit through drugs an offence; unfitness means impaired ability to drive properly.[@roadtransport] In
      the Magistrates' Court a first offence carries up to 10,000 penalty units or twelve months'
      imprisonment or both; a repeat carries up to 20,000 units or two years or both.[@roadtransport] High Court
      conviction carries up to 20,000 units or two years or both.[@roadtransport] Penalty units must not be read as
      Solomon Islands dollars.[@roadtransport] Licence disqualification normally lasts at least twelve months,
      rising to at least three years if there was a like driving conviction within the preceding ten
      years, with a special-reasons exception.[@roadtransport] Being in charge while not driving is a separate
      offence with different penalties.[@roadtransport] The separate concentration offence concerns alcohol, not a
      numerical THC limit.[@roadtransport]
    sources:
      - roadtransport
  black_market:
    text: >-
      Reported seizures reach commercial scale: a marijuana haul valued near SBD 1 million was
      reported by the Solomon Times.[@st]
    sources:
      - st
  arrests:
    text: >-
      The retained 2016 Magistrates' Court judgment on marijuana possession and the Solomon Times
      crop-seizure report are individual observations; a representative current sentencing account
      remains a research gap.[@case,st]
    sources:
      - case
      - st
  planting:
    seeds: illegal
    seeds_trade: banned
    clones: illegal
    clones_trade: banned
    text: >-
      Section 2 defines Indian hemp as Cannabis sativa or Cannabis indica or any portion.[@act] Section 5
      expressly prohibits importing or exporting cannabis seeds and plant portions; sections 7–8
      prohibit cultivation and giving or selling the controlled plant.[@act] No personal seed or cutting
      exemption was identified.
    sources:
      - act
