segments:
  possession:
    text: >-
      Possession is an offence under the Dangerous Drugs Act. In the magistrates' courts the
      applicable maximum for possession or growing is a fine of SI$5,000 or six months in prison;
      higher maximums are cited for more serious cases.
    sources:
      - case
  cultivation:
    text: >-
      Cultivation is an offence on the same footing as possession for small grows, with heavier
      penalties for plantations; police regularly uproot crops.
    sources:
      - case
      - st
  enforcement:
    text: >-
      Mostly fines and short sentences for small amounts. Marijuana is the country's main illicit
      drug and widely grown.
    sources:
      - case
      - st
  sharing:
    text: British travel advice says selling drugs is illegal and can lead to a prison sentence.
    sources:
      - fcdo
  consumption:
    text: >-
      British travel advice says the possession, selling and use of drugs is illegal and can lead to
      prison sentences.
    sources:
      - fcdo
  access:
