  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited.
    sources:
      - case
      - st
      - trip
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. British travel advice says possessing,
      selling and using drugs is illegal and can lead to prison sentences.
    sources:
      - trip
      - fcdo
