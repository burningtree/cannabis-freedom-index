name: Barbados
region: North America
iso_numeric: 52
recreational: decriminalised
medical: legal
updated: 2026-10-04
summary: >-
  Up to 14 g is a fixable fine; a medical industry is licensed and Rastafari sacramental use is
  permitted.
scores:
  possession: 3
  cultivation: 1
  enforcement: 4
  sharing: 1
  consumption: 2
  access: 1
segments:
  possession:
    text: >-
      Possession remains an offence, but since 2021 police may offer anyone with 14 g or less a
      fixed-penalty notice: a $200 fine payable within 30 days, with no court appearance and no
      conviction. Under-18s must also attend an assessment and counselling.
    sources:
      - bill
      - gis
  cultivation:
    text: >-
      Not permitted for personal use. Cultivation is lawful only under a medicinal cannabis licence,
      or for registered Rastafari worship.
    sources:
      - cijn
      - gis
  enforcement:
    text: >-
      A $200 ticket for small amounts. Above 14 g the ordinary penalties apply, including prison for
      trafficking.
    sources:
      - bill
      - gis
  sharing:
    text: >-
      Supply remains an offence. The Sacramental Cannabis Act allows use within registered Rastafari
      places of worship only.
    sources:
      - cijn
      - bt
  consumption:
    text: >-
      Use is still unlawful outside the sacramental exemption, which Rastafari groups criticised as
      confining their practice to temples. Public smoking is an offence.
    sources:
      - bt
      - gis
  access:
    text: No adult-use sales. The medicinal industry created in 2019 supplies patients on prescription.
    sources:
      - cijn
context:
  production:
    text: >-
      The Medicinal Cannabis Industry Act 2019 set up a licensing authority for cultivation,
      processing, retail and export.
    sources:
      - cijn
  products:
    text: Prescription medicinal products only.
    sources:
      - cijn
  medical:
    text: >-
      Legal since 2019 on prescription from a medical practitioner, dispensed through licensed
      outlets.
    sources:
      - cijn
  consequences:
    text: Paying the fixed penalty discharges liability without a criminal conviction.
    sources:
      - bill
