segments:
  possession:
    text: >-
      Possession remains an offence, but since 2021 police may offer anyone with 14 g or less a
      fixed-penalty notice: a $200 fine payable within 30 days, with no court appearance and no
      conviction. Under-18s must also attend an assessment and counselling.
    sources:
      - bill
      - gis
  cultivation:
    text: >-
      Not permitted for personal use. Cultivation is lawful only under a medicinal cannabis licence,
      or for registered Rastafari worship.
    sources:
      - mci_act
      - gis
  enforcement:
    text: >-
      A $200 ticket for small amounts. Above 14 g the ordinary penalties apply, including prison for
      trafficking.
    sources:
      - bill
      - gis
  sharing:
    text: >-
      Supply remains an offence. The Sacramental Cannabis Act allows use within registered Rastafari
      places of worship only.
    sources:
      - cijn
      - bt
  consumption:
    text: >-
      Use is still unlawful outside the sacramental exemption, which Rastafari groups criticised as
      confining their practice to temples. Public smoking is an offence.
    sources:
      - bt
      - gis
  access:
    text: No adult-use sales. The medicinal industry created in 2019 supplies patients on prescription.
    sources:
      - mci_act
context:
  planting:
    seeds: licensed
    seeds_trade: regulated
    clones: licensed
    clones_trade: regulated
    text: >-
      Cannabis seeds and immature plants are medicinal cannabis under the licensed system. Growing
      requires a cultivator licence, while importing seeds, plants or tissue culture requires an
      import licence, an approval certificate for the shipment and a plant-protection permit.
    sources:
      - bmcla
      - import_process
  production:
    text: >-
      The Medicinal Cannabis Industry Act 2019 set up a licensing authority for cultivation,
      processing, retail and export.
    sources:
      - mci_act
  products:
    text: Prescription medicinal products through licensed therapeutic dispensaries.
    sources:
      - mci_act
      - first_dispensary
  medical:
    text: >-
      Legal under the 2019 Act on prescription from a medical practitioner. The first licensed
      medicinal dispensary opened on 14 June 2025.
    sources:
      - mci_act
      - first_dispensary
  consequences:
    text: Paying the fixed penalty discharges liability without a criminal conviction.
    sources:
      - bill
  clubs:
    status: none
    text: >-
      There are no cannabis clubs as such. Supply remains an offence; the Sacramental Cannabis
      Act allows use only within registered Rastafari places of worship.
    sources:
      - cijn
      - bt
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. British travel advice says it is
      illegal to possess drugs and that there are severe penalties for all drug offences, and
      tells travellers to pack their own luggage and carry nothing through customs for anyone
      else.
    sources:
      - mci_act
      - fcdo
  driving:
    status: impairment
    text: >-
      Road Traffic Act section 85 prohibits driving, attempting to drive or being in charge
      on a road or public place when drug influence makes proper vehicle control impossible.
      The government's consolidation provides BDS$5,000 or two years' imprisonment or both
      for a first conviction, rising to BDS$10,000 or five years or both for a repeat.
      Licence disqualification is normally twelve months on the first conviction, five
      years on the second and permanent thereafter, subject to the court's special-reasons
      exception. These are court penalties, not fixed-ticket amounts. Section 69A makes
      random alcohol and drug testing by a medical practitioner a licence condition for
      drivers of articulated and public service vehicles. The numerical concentration
      branch in section 85 concerns alcohol; its drug branch requires impairment rather
      than a specified THC value.
    sources:
      - roadtraffic2022
  black_market:
    text: >-
      Figures reported by the government to the UN drugs office record 11,831 kg of herbal
      cannabis seized in 2023. The UN publishes them as kilogram equivalents, and
      countries count seizures differently, so the figures are not comparable across
      borders.
    sources:
      - unodc_szr
