name: Antigua and Barbuda
region: North America
iso_numeric: 28
recreational: legal
medical: limited
updated: 2026-10-13
summary: >-
  Adults may hold up to 15 g and a household may grow four plants; Rastafari sacramental use is
  recognised. Dispensaries serve patients only.
scores:
  possession: 4
  cultivation: 4
  enforcement: 6
  sharing: 1
  consumption: 3
  access: 1
# What the possession score cannot say precisely (src/lib/answers.js).
answers:
  carry:
    answer: "yes"
    text: Up to 15 g is not an offence; more is a crime
segments:
  possession:
    text: >-
      Since March 2018 a person holding up to 15 g of cannabis or resin 'is not guilty of an
      offence'. Above 15 g remains criminal. Registered members of religious bodies such as
      Rastafari may hold more.
    sources:
      - wiki
      - idpc1
  cultivation:
    text: >-
      Up to four plants per household for personal use. Registered religious adherents may grow more
      for sacramental purposes.
    sources:
      - wiki
      - idpc2
  enforcement:
    text: >-
      Nothing within the 15 g and four-plant limits. Larger amounts and all dealing remain criminal
      offences with prison.
    sources:
      - wiki
      - idpc1
  sharing:
    text: >-
      The amendment did not remove penalties for supply, so giving or selling cannabis remains an
      offence — except sacramental dispensing within a registered religious body.
    sources:
      - wiki
      - idpc2
  consumption:
    text: Use at home is lawful. Smoking in public places is prohibited, as with tobacco.
    sources:
      - wiki
      - idpc1
  access:
    text: >-
      No general adult-use shops. The Cannabis Act 2018 created a Medicinal Cannabis Authority that
      licenses dispensaries for patients, plus sacramental dispensaries for religious use.
    sources:
      - idpc2
      - wiki
context:
  recreational:
    text: >-
      Adults get cannabis from their own four home-grown plants: since March 2018 holding up to
      15 g is not an offence, and use at home is lawful, while public smoking is banned as with
      tobacco. Registered religious adherents may hold and grow more for sacramental
      use. There are no general adult-use shops; supply stays criminal outside registered
      religious dispensing.
    sources:
      - wiki
      - idpc1
      - idpc2
  production:
    text: >-
      Cultivation, processing and dispensary licences are issued by the Medicinal Cannabis Authority
      for medical supply only.
    sources:
      - idpc2
  products:
    text: Licensed medical products through dispensaries; otherwise only what you grow yourself.
    sources:
      - idpc2
  medical:
    text: >-
      Medical cannabis is legal under the Cannabis Act 2018, on a practitioner's recommendation,
      through licensed dispensaries.
    sources:
      - idpc2
      - wiki
  consequences:
    text: >-
      Convictions for small amounts were to be expunged as part of the reform, and the government
      formally apologised to the Rastafari community for past persecution.
    sources:
      - idpc1
      - wiki
  planting:
    seeds: grey
    seeds_trade: unclear
    clones: grey
    clones_trade: unclear
    text: >-
      The 2018 amendment makes it lawful for a household to cultivate up to four plants on its
      property. It does not mention seeds or say where plants may be obtained.
    sources:
      - act3
  clubs:
    status: none
    text: >-
      There are no cannabis clubs as such. Giving or selling cannabis remains an offence, with
      one collective exception: sacramental dispensing within a registered religious body.
    sources:
      - wiki
      - idpc2
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. British travel advice says it is
      illegal to possess drugs and that there are severe penalties for all drug offences;
      smoking in public places is also illegal and can lead to arrest.
    sources:
      - idpc2
      - wiki
      - fcdo
  driving:
    status: impairment
    text: >-
      Vehicles and Road Traffic Act section 54 prohibits driving, attempting to drive
      or being in charge on a road when a drug prevents proper vehicle control. Both
      the government's older Cap. 460 text and the published 2018 replacement retain
      that impairment limb. The replacement changes fine, prison and repeat-licence
      provisions and authorises ministerial approval of drug-detection devices, but
      Act 18/2018 requires a Gazette commencement notice. That notice and an approved
      drug-device order were not retrieved here, so neither the old nor replacement
      penalty table is presented as a verified current tariff. The 2018 prescribed
      concentration definition concerns alcohol; it establishes no numerical THC
      allowance. The 2025 amendment deals with transport administration, fees and
      the fee for applications to remove permanent disqualification, and also has
      a separate commencement clause. The statutory possibility of applying to remove
      a permanent ban means that wording should not be described as necessarily
      irreversible. Current sanctions and testing procedure remain follow-up questions.
    sources:
      - trafficcap460
      - traffic2018
      - traffic2025
  black_market:
    text: >-
      Figures reported by the government to the UN drugs office record 196 kg of herbal
      cannabis seized in 2024, against 734 kg in 2023, and 24.1 kg of cannabis resin
      seized in 2024, against 35.8 kg in 2023. The UN publishes them as kilogram
      equivalents, and countries count seizures differently, so the figures are not
      comparable across borders.
    sources:
      - unodc_szr
