name: Antigua and Barbuda
region: North America
iso_numeric: 28
recreational: legal
medical: limited
updated: 2026-10-04
summary: >-
  Up to 15 g and four plants per household are decriminalised; Rastafari sacramental use is
  recognised.
scores:
  possession: 4
  cultivation: 4
  enforcement: 5
  sharing: 2
  consumption: 3
  access: 1
segments:
  possession:
    text: >-
      Since March 2018 a person holding up to 15 g of cannabis or resin 'is not guilty of an
      offence'. Above 15 g remains criminal. Registered members of religious bodies such as
      Rastafari may hold more.
    sources:
      - wiki
      - idpc1
  cultivation:
    text: >-
      Up to four plants per household for personal use. Registered religious adherents may grow more
      for sacramental purposes.
    sources:
      - wiki
      - idpc2
  enforcement:
    text: >-
      Nothing within the 15 g and four-plant limits. Larger amounts and all dealing remain criminal
      offences with prison.
    sources:
      - wiki
      - idpc1
  sharing:
    text: >-
      The amendment did not remove penalties for supply, so giving or selling cannabis remains an
      offence — except sacramental dispensing within a registered religious body.
    sources:
      - wiki
      - idpc2
  consumption:
    text: Use at home is lawful. Smoking in public places is prohibited, as with tobacco.
    sources:
      - wiki
      - idpc1
  access:
    text: >-
      No general adult-use shops. The Cannabis Act 2018 created a Medicinal Cannabis Authority that
      licenses dispensaries for patients, plus sacramental dispensaries for religious use.
    sources:
      - idpc2
      - wiki
context:
  production:
    text: >-
      Cultivation, processing and dispensary licences are issued by the Medicinal Cannabis Authority
      for medical supply only.
    sources:
      - idpc2
  products:
    text: Licensed medical products through dispensaries; otherwise only what you grow yourself.
    sources:
      - idpc2
  medical:
    text: >-
      Medical cannabis is legal under the Cannabis Act 2018, on a practitioner's recommendation,
      through licensed dispensaries.
    sources:
      - idpc2
      - wiki
  consequences:
    text: >-
      Convictions for small amounts were to be expunged as part of the reform, and the government
      formally apologised to the Rastafari community for past persecution.
    sources:
      - idpc1
      - wiki
sources:
