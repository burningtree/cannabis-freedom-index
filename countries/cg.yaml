segments:
  possession:
    text: >-
      Law 30-2025 of 22 August 2025 bans holding the plants and substances of Table I without
      authorisation (Article 6). For a small amount bought, held or grown for personal use,
      Article 53 sets 2 months to 1 year and a fine of 100,000 to 500,000 CFA francs for a
      high-risk drug (cannabis oil included), and 1 to 6 months and 50,000 to 250,000 CFA francs
      for a cannabis derivative other than the oil. Using or holding a high-risk drug for personal
      consumption is also covered by Article 40: 1 to 12 months and a fine of 1,000,000 to
      2,000,000 CFA francs. The law text does not name cannabis in its tables, which are set
      by order.
    sources:
      - loi2025
  cultivation:
    text: >-
      Article 7 bans growing plants classed as narcotics by the international conventions, and
      landowners must destroy them. Growing high-risk drugs carries 5 to 10 years and a fine of
      5,000,000 to 20,000,000 CFA francs (Article 37); a small amount grown for personal use falls
      under Article 53.
    sources:
      - loi2025
  enforcement:
    text: >-
      The law allows prison even for a small personal amount (Article 53) and doubles the maximum
      penalties in listed aggravating cases (Article 56). How it is applied is not shown by the
      text.
    sources:
      - loi2025
  sharing:
    text: >-
      Giving or offering a high-risk drug to a person for their own use carries 1 to 2 years and a
      fine of 500,000 to 1,000,000 CFA francs (Article 43). Selling, distributing or holding
      for supply carries 2 to 10 years (Article 39).
    sources:
      - loi2025
  consumption:
    text: >-
      Article 52 forbids using controlled drugs without a medical prescription and orders any drug
      found on a user seized. Using a high-risk drug for personal consumption is punished under
      Article 40.
    sources:
      - loi2025
  access:
    text: >-
      No lawful source for personal use. Authorisations under the law are for medical use only
      (Article 8).
    sources:
      - loi2025
