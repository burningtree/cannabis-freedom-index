name: Kazakhstan
region: Asia
iso_numeric: 398
recreational: illegal
medical: none
updated: '2026-10-28'
summary: >-
  Unauthorized possession of even a small amount, without intent to sell, is a criminal offence
  under Article 296, with a fine, corrective work, community service or up to 40 days' arrest.
  An especially large amount can bring three to seven years. A proposal to take simple possession
  out of the Criminal Code has not been enacted. Wild cannabis covers the Chu valley.
