segments:
  possession:
    text: >-
      Holding a small amount without intent to sell is dealt with at the lowest level of Article 296
      of the Criminal Code: a fine, corrective or community work, or arrest of up to 40 days.
      Sources differ on whether amounts under about 5 g are handled purely administratively. Larger
      amounts bring three to ten years.
    sources:
      - cr
      - zakon
  cultivation:
    text: >-
      Cultivation is a crime. The Chuy Valley in the south holds what may be the world's largest
      stand of wild cannabis, the target of annual eradication.
    sources:
      - cr
  enforcement:
    text: >-
      Fines or short arrest for the smallest amounts, years in prison above them. The Interior
      Ministry has itself proposed not jailing people for simple possession.
    sources:
      - nt
      - cr
  sharing:
    text: Supply is punished with long prison terms.
    sources:
      - cr
  consumption:
    text: Use in public places is an offence; officials have proposed softening the treatment of users.
    sources:
      - zakon
      - nt
  access:
    text: No legal source.
    sources:
      - cr
