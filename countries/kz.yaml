segments:
  possession:
    text: >-
      Article 296 of the Criminal Code covers acquiring, keeping, making or carrying drugs
      without intent to sell. The basic offence brings a fine of up to 160 monthly calculation
      indices, corrective work, up to 160 hours of community service or arrest of up to 40 days;
      a 'large amount' raises this to 200 indices, 200 hours or 50 days; an 'especially large
      amount' brings three to seven years in prison. The amounts are set in a government table.
      A person who voluntarily hands over drugs acquired for personal use, or seeks medical
      help, is released from criminal liability.
    sources:
      - cc296
      - zakon
  cultivation:
    text: >-
      Article 300 of the Criminal Code punishes sowing or growing cannabis and other prohibited
      plants with a fine of up to 2,000 monthly calculation indices, corrective work, up to 600
      hours of community service, or restriction of liberty or prison for up to two years. A
      large amount, a group or a repeat offence brings three to eight years; an especially large
      amount or a criminal group seven to twelve. Since 2025, licensed companies may grow
      registered hemp varieties containing no more than 0.3% THC; individuals may not.
    sources:
      - cc300
      - tn25
      - l279
  enforcement:
    text: >-
      Fines or short arrest for the smallest amounts, years in prison above them. The Interior
      Ministry has itself proposed not jailing people for simple possession.
    sources:
      - nt
  sharing:
    text: >-
      Article 297 of the Criminal Code punishes acquiring, storing or transporting drugs for
      sale, and selling them, with five to eight years in prison and confiscation of property;
      six to ten years for a large amount; seven to twelve for a group, a repeat offence, an
      especially large amount or a public place; and fifteen to twenty for a criminal group, an
      official, or sale in a school or to a minor.
    sources:
      - cc297
  consumption:
    text: >-
      Using drugs for non-medical purposes in a public place is an offence under the first part
      of Article 296: a fine of up to 80 monthly calculation indices, corrective work, up to 80
      hours of community service or arrest of up to 20 days. A person who voluntarily seeks
      medical help is released from liability. Officials have proposed softening the treatment
      of users.
    sources:
      - cc296
      - zakon
      - nt
  access:
    text: No legal source.
    sources:
      - zakon
context:
  production:
    text: >-
      Since 2025 licensed companies may grow listed hemp varieties for industry. The country's
      cannabis is otherwise wild: some 140,000 hectares in the Chu valley, which the interior
      ministry once estimated could yield 140,000 tonnes of marijuana a year, policed each
      summer in an operation named Poppy.
    sources:
      - nat09
      - fp14
  products:
    text: Reliable national information about legally available cannabis products was not established by the retained sources.
    sources: []
  medical:
    text: The retained sources do not establish whether a medical cannabis programme operates.
    sources: []
  consequences:
    text: Offences under Article 296 are recorded; users may be placed on a narcological register.
    sources:
      - zakon
  planting:
    seeds: grey
    seeds_trade: open
    clones: illegal
    clones_trade: banned
    text: >-
      The 1998 narcotics law lists the cannabis plant as any plant of the genus containing
      THC, "with the exception of seeds and roots, if they are not accompanied by the plant
      itself or other parts of plant". Sowing and growing hemp counts as cultivating a
      narcotic plant and is a controlled activity. Since 2025 licensed companies may grow
      listed hemp varieties with up to 0.3% THC, and only from original or elite registered
      seed; individuals may not.
    sources:
      - tn25
      - l279
  black_market:
    text: >-
      The market is supplied from inside the country, from wild and planted cannabis in the
      south. Every summer the interior ministry runs an operation called Karasora against
      growing, harvesting and transit, with helicopter and drone reconnaissance over the
      Almaty, Zhetysu, Turkistan, Kyzylorda and Ulytau regions. In 2024 it removed more than
      15 tonnes of drugs in 70 days and recorded 450 drug crimes, 102 of them for cultivation;
      flights alone found over 9,000 cannabis plants. In the first nine months of 2025 police
      seized more than 26 tonnes of drugs, 35% more than a year earlier, including over nine
      tonnes of marijuana and more than 600 kg of hashish.
    sources:
      - mvd24
      - tca25
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. The Criminal Code's penalties run from
      fines or up to 40 days' arrest for holding drugs without intent to sell to five to eight
      years in prison, with confiscation of property, for holding or carrying them for sale.
      Advertising or promoting drugs is a separate crime under Article 299-1, added in 2019: up
      to three years in prison, or three to six when done online, through the media or in a
      place where many people gather.
    sources:
      - cc296
      - cc297
      - cc2991
  driving:
    status: impairment
    text: >-
      The Code of Administrative Offences punishes driving 'in a state of alcoholic, narcotic
      or toxic intoxication' with 15 days of administrative arrest and loss of the licence for
      seven years; where harm or damage results, 20 days. A repeat within a year brings 20
      days and eight years. The article names a state of intoxication, not a measured level,
      and the Constitutional Court upheld it in October 2023.
    sources:
      - koap608
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited.
    sources:
      - cc300
      - cc297
