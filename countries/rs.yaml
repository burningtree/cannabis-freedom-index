segments:
  possession:
    text: >-
      Possessing a small amount for personal use carries a fine or up to three years in prison, with
      possible waiver of punishment.[@code] A large quantity carries three to ten years even when intended
      for personal use.[@code] The Supreme Court upheld three years for about 372 g in January 2024 and
      said judges assess quantity case by case.[@stock24] Prosecutors may defer eligible small-possession
      cases subject to accepted obligations.[@prosecutor]
      [Serbia's new Criminal Code softened drug penalties in 2006.](/history/serbia-new-criminal-code-2006/)
      [Three years were upheld for a large personal stock in 2024.](https://tracker.cannabisfreedom.fyi/report/serbia-large-personal-stock-sentence-2024/)
    sources:
      - code
      - stock24
      - prosecutor
    penalties:
      - label: Small amount for personal use
        treatment: criminal
        term: Possession
        prison: 3 years
        note: Fine or waiver possible; prosecutors may defer with obligations
      - label: Large quantity, even for personal use
        treatment: criminal
        term: Possession
        prison_min: 3 years
        prison: 10 years
        note: Applies even to personal use; three years upheld for about 372 g in 2024
  cultivation:
    text: >-
      Unauthorised growing of psychoactive cannabis carries two to eight years in prison, raised
      from six months to five years in December 2019.[@code,amendment19] Drug production and supply have a separate
      three-to-twelve-year range.[@code] A 2019 judgment treated drying and packaging cannabis for sale as
      production.[@harvest19] Licensed low-THC hemp crops have separate agricultural rules.[@zpks]
      [Drug sentences were raised in 2019.](/history/serbia-drug-sentences-raised-2019/)
      [Drying and packaging for sale counted as production in 2019.](https://tracker.cannabisfreedom.fyi/report/serbia-cannabis-drying-sentence-2019/)
    sources:
      - code
      - amendment19
      - harvest19
      - zpks
    penalties:
      - label: Unauthorised growing of psychoactive cannabis
        treatment: criminal
        term: Cultivation
        prison_min: 2 years
        prison: 8 years
        note: Tightened by the December 2019 amendment
  enforcement:
    text: >-
      Small personal possession can receive a fine, waiver of punishment or deferred prosecution;
      the latter may require a payment for public purposes, community work or treatment.[@code,prosecutor] Growing
      cannabis carries a two-to-eight-year statutory range.[@code] Large possession can bring prison
      despite personal use, as in the three-year sentence upheld for about 372 g in 2024.[@stock24]
      [Serbia created a separate small-possession offence in 2009.](/history/serbia-personal-possession-offence-2009/)
    sources:
      - code
      - prosecutor
      - stock24
  sharing:
    text: >-
      Giving another person drugs to consume, or providing a place for their use, carries six months
      to five years under the facilitating-consumption offence.[@code] Unauthorised sale and other supply
      carry three to twelve years, with aggravated offences for minors, specified locations and
      abuse of professional roles.[@code]
      [Serbia's new Criminal Code softened drug penalties in 2006.](/history/serbia-new-criminal-code-2006/)
    penalties:
      - label: Giving drugs to consume or providing premises (facilitation)
        treatment: criminal
        term: Facilitation
        prison_min: 6 months
        prison: 5 years
        note: For enabling consumption or providing premises
      - label: Unauthorised sale and other supply
        treatment: criminal
        term: Supply
        prison_min: 3 years
        prison: 12 years
        note: Aggravated for minors, specified locations and professional roles
    sources:
      - code
  consumption:
    text: >-
      The controlled-substances law prohibits unauthorised use.[@zpks] The Criminal Code punishes
      possession for personal use and separately punishes giving drugs to another person to consume
      or providing premises for use.[@code]
      [Possession for personal use was criminalised in 2003.](/history/serbia-possession-criminalised-2003/)
    sources:
      - zpks
      - code
  access:
    text: >-
      Recreational supply remains prohibited.[@code] Goran Čabradi’s medical-cannabis bill failed to secure
      a place on parliament’s agenda in March 2018.[@assembly18]
      [Parliament refused to schedule a medical cannabis bill in 2018.](/history/serbia-medical-agenda-refused-2018/)
    sources:
      - code
      - assembly18
words:
  - { word: Vutra, lang: Serbian, meaning: "slang for marijuana", sources: [wiktionary-vutra] }
  - { word: Trava, say: trava, lang: Serbian, meaning: "literally grass; slang for weed, pot", sources: [wiktionary-trava-sh] }
  - { word: Džoint, lang: Serbian, meaning: "slang for a marijuana cigarette", sources: [wiktionary-dzoint] }
  - { word: Kanabis, lang: Serbian, meaning: "cannabis", sources: [wiktionary-kanabis] }
context:
  recreational:
    text: >-
      There is no legal recreational supply. Small-amount personal possession brings a fine or
      up to three years, with possible waiver; prosecutors may defer eligible cases with
      obligations like community work or treatment.[@code,prosecutor] A large quantity brings
      three to ten years even for personal use — three years were upheld for about 372 g in
      2024.[@code,stock24] Unauthorised growing brings two to eight years.[@code]
      [Serbia created a separate small-possession offence in 2009.](/history/serbia-personal-possession-offence-2009/)
      [Drug sentences were raised in 2019.](/history/serbia-drug-sentences-raised-2019/)
    sources:
      - code
      - stock24
      - prosecutor
  production:
    status: medical
    text: >-
      Agriculture permits cover hemp varieties below 0.3% THC for the purposes listed in Article 60;
      varieties capable of exceeding 0.3% are prohibited by Article 58.[@zpks] Cannabis and resin also
      appear on controlled-substance Lists 1 and 2, with List 2 restricted to research and exceptional
      therapy.[@schedules26,zpks] Article 25 separately permits controlled-substance manufacture under
      a ministry authorisation specifying the substance, quantity and site. This manufacturing route
      does not authorise growing high-THC cannabis.[@zpks]
    sources:
      - zpks
      - schedules26
  medical:
    text: >-
      The current schedules place cannabis and resin on both lists 1 and 2.[@schedules26] The law permits list-2
      substances for research and exceptionally for therapy under its controls.[@zpks] It also allows the
      minister to authorise imports of unregistered controlled medicines for a named patient or
      group through a licensed wholesaler.[@zpks] Patient campaigners and lawmakers have sought a wider
      medical cannabis route; a 2018 consultation rejected legalising medical cannabis oil.[@assembly18,proposal18]
      [Patients asked the health ministry to permit cannabis treatment in 2015.](/history/serbia-medical-proposal-2015/)
      [Parliament refused to schedule a medical cannabis bill in 2018.](/history/serbia-medical-agenda-refused-2018/)
    sources:
      - schedules26
      - zpks
      - assembly18
      - proposal18
  research:
    status: licensed
    text: >-
      Research institutions and specified laboratories need the minister’s consent to hold
      controlled substances for scientific and educational work.[@zpks] The consent names the
      substance and is limited to the quantity needed for a year’s ordinary activity.[@zpks]
      A clinical trial involving a controlled medicine requires separate ministerial consent for
      its use in the trial, alongside the medicines-law authorisation.[@zpks] Cannabis’s list-2
      classification restricts its permitted purposes to research and exceptional
      therapy.[@schedules26,zpks]
    sources:
      - zpks
      - schedules26
  consequences:
    text: >-
      Small personal possession remains a criminal offence, though the court may waive punishment.[@code]
      For eligible cases prosecutors can defer prosecution for up to one year while agreed
      obligations are fulfilled, then dismiss the complaint.[@prosecutor] Those obligations can include a
      public-purpose payment, community work or drug treatment.[@prosecutor]
      [Serbia's new Criminal Code softened drug penalties in 2006.](/history/serbia-new-criminal-code-2006/)
    sources:
      - code
      - prosecutor
  planting:
    seeds: licensed
    seeds_trade: regulated
    clones: illegal
    clones_trade: banned
    text: >-
      Cannabis varieties capable of containing more than 0.3% THC are prohibited.[@zpks] Licensed hemp
      growers must use registered varieties below 0.3%, with properly documented seed and an
      agriculture permit covering one production year.[@zpks,hemp13] Seed production for further propagation also
      requires registration as a seed producer.[@hemp13]
    sources:
      - zpks
      - hemp13
  hemp:
    status: standard
    text: >-
      Licensed hemp is confined to fibre, animal-feed seed, propagation and specified seed
      activities: registered varieties below 0.3% THC, documented seed and a one-year
      agriculture permit.[@zpks,hemp13] Cannabis varieties capable of more than 0.3% THC are
      prohibited, and cannabis and resin stay on controlled-drug lists 1 and 2; the 2018
      consultation rejected legalising medical cannabis oil.[@hemp13,schedules26,proposal18]
    sources:
      - zpks
      - hemp13
      - schedules26
      - proposal18
  clubs:
    status: none
    text: >-
      Collective recreational growing and supply fall under the offences against unauthorised
      cultivation, production and distribution.[@code] Giving drugs to another person for use or providing
      premises for use is separately punishable by six months to five years.[@code]
    sources:
      - code
  visitors:
    status: none
    text: >-
      Recreational supply remains prohibited.[@code] Small personal possession carries a fine or up to
      three years in prison, with possible waiver of punishment.[@code] Large possession carries three to
      ten years; the Supreme Court has upheld that offence even when cannabis was held for personal
      use.[@stock24]
      [Three years were upheld for a large personal stock in 2024.](https://tracker.cannabisfreedom.fyi/report/serbia-large-personal-stock-sentence-2024/)
    sources:
      - code
      - stock24
  driving:
    status: zero
    text: >-
      The Road Traffic Safety Law forbids driving under the effect of psychoactive substances,
      and defines that state as the presence of such substances in the body, established by a
      test.[@zobs187] For alcohol the same article sets a level of 0.20 mg/ml; for drugs it sets none.[@zobs187]
      Police exclude such a driver from traffic on the spot.[@zobs187]
    sources:
      - zobs187
  black_market:
    text: >-
      Marijuana is by far the largest drug seized. The interior ministry reported more
      than 6.1 tonnes of drugs seized in 2025, of which 5.43 tonnes were marijuana, and
      130 growing and production sites found: 37 indoor, 92 outdoor and one synthetic drug
      laboratory.[@n1_26]
      On [29 January 2026](https://tracker.cannabisfreedom.fyi/report/serbia-konjuh-five-tonne-seizure-2026/), the ministry
      announced about five tonnes of marijuana seized near Kruševac.[@konjuh26]
      [Police reported 5.43 tonnes of marijuana seized in a year.](/history/serbia-drug-seizures-2025/)
    sources:
      - n1_26
      - konjuh26
  arrests:
    text: >-
      The statistics office recorded 5,270 reported adult perpetrators of unlawful possession of
      narcotics and 1,474 for unlawful production and circulation in 2024.[@stat24] The figures
      cover all narcotics, not cannabis alone, and count crime reports rather than arrests.[@stat24]
    sources:
      - stat24
