name: Serbia
region: Europe
iso_numeric: 688
recreational: illegal
medical: none
updated: 2026-10-04
summary: >-
  Personal possession carries a fine or up to three years, usually resolved by deferred prosecution;
  growing and selling mean mandatory prison.
scores:
  possession: 1
