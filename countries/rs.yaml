segments:
  possession:
    text: >-
      Possessing a small amount for personal use is a crime under Article 246a of the Criminal Code,
      punishable by a fine or up to three years in prison. Courts may remit the punishment, and
      prosecutors commonly defer prosecution in exchange for a payment to charity or community work.
    sources:
      - trip
      - kpu
  cultivation:
    text: >-
      Growing cannabis is production under Article 246, with a minimum of several years; even a few
      plants are prosecuted.
    sources:
      - par
      - kpu
  enforcement:
    text: >-
      Fines and deferred prosecution for most users; harsh, mandatory prison for growers and
      sellers.
    sources:
      - kpu
      - par
  sharing:
    text: Sale and supply carry three to twelve years.
    sources:
      - par
  consumption:
    text: Use itself is not an offence; possession is.
    sources:
      - kpu
  access:
    text: None.
    sources:
      - trip
context:
  production:
    text: Industrial hemp under permit only.
    sources:
      - trip
  products:
    text: No legal THC products.
    sources:
      - trip
  medical:
    text: >-
      No medical cannabis programme; the Criminal Code makes no distinction between cannabis and
      other narcotics.
    sources:
      - trip
      - kpu
  consequences:
    text: A conviction is a criminal record; deferred prosecution avoids one.
    sources:
      - kpu
  planting:
    seeds: licensed
    seeds_trade: regulated
    clones: illegal
    clones_trade: banned
    text: >-
      The Act on Psychoactive Controlled Substances bans growing cannabis varieties that can
      contain more than 0.3% THC. Hemp may be grown only with a licence from the agriculture
      ministry, for fibre, for seed and for further propagation, and the seed trade is part of
      that licensed activity.
    sources:
      - zpks
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited.
    sources:
      - par
      - kpu
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. British travel advice says there are
      strict penalties for possessing and trafficking drugs, including cannabis. Airport
      scanners are also used on the baggage of passengers in transit.
    sources:
      - trip
      - fcdo
