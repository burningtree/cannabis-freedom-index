  planting:
    seeds: illegal
    seeds_trade: banned
    clones: illegal
    clones_trade: banned
    text: >-
      The 1971 Act lists as a prohibited dependence-producing drug "Cannabis (Dagga) and the
      whole plant or any portion or product thereof", which takes in seed and cuttings alike.
      The 2008 medicines regulations exempt only processed products made from cannabis seed
      that contain almost no THC and no whole seeds.
    sources:
      - act41
      - gn178
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited.
    sources:
      - wiki
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. Possession is a crime under the Abuse of
      Dependence-Producing Substances and Rehabilitation Centres Act of 1971; small amounts
      typically bring a fine or a short or suspended sentence.
    sources:
      - nam1
      - wiki
  driving:
    status: impairment
    text: >-
      The published Road Traffic and Transport Act section 82(1) prohibits driving a vehicle on a
      public road while under the influence of a drug having a narcotic effect. It also covers
      occupying the driver’s seat of a motor vehicle with its engine running. This is a drug-influence
      offence; the separate blood-alcohol and breath-alcohol provisions do not establish a cannabis
      concentration limit. The available NamibLII edition is dated 9 December 2008, so it is a
      qualified statutory baseline rather than certification of all current amendments. A current
      cannabis fine, prison ceiling, licence-ban tariff and drug-specific sampling or refusal
      procedure were not established in this review.
    sources:
      - traffic2008
