  planting:
    seeds: illegal
    seeds_trade: banned
    clones: illegal
    clones_trade: banned
    text: >-
      The 1971 Act lists as a prohibited dependence-producing drug "Cannabis (Dagga) and the
      whole plant or any portion or product thereof", which takes in seed and cuttings alike.
      The 2008 medicines regulations exempt only processed products made from cannabis seed
      that contain almost no THC and no whole seeds.
    sources:
      - act41
      - gn178
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited.
    sources:
      - wiki
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. British travel advice says penalties
      for using or smuggling illegal drugs can be severe and include large fines and
      imprisonment.
    sources:
      - wiki
      - fcdo
