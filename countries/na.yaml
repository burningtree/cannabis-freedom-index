name: Namibia
region: Africa
iso_numeric: 516
recreational: illegal
medical: none
updated: 2026-10-15T00:00:00.000Z
summary: >-
  Prohibited under a 1971 Act; over 115 g is presumed dealing. Court challenges by cannabis
  activists have failed so far.
scores:
  possession: 1
  cultivation: 1
  enforcement: 1
  sharing: 1
  consumption: 1
  access: 0
segments:
  possession:
    text: >-
      Cannabis (dagga) is prohibited by the apartheid-era Abuse of Dependence-Producing Substances
      and Rehabilitation Centres Act of 1971. Possession is a crime; small amounts typically bring a
      fine or a short or suspended sentence. Holding more than 115 g creates a legal presumption of
      dealing, which the High Court upheld in 2026.
    sources:
      - nam1
      - wiki
  cultivation:
    text: >-
      Section 1 includes cultivation within dealing; section 2(a) prohibits dealing in a prohibited
      dependence-producing drug or its plant. Cannabis is listed in Schedule Part I.
    sources:
      - act41
  enforcement:
    text: >-
      Cannabis accounts for most drug arrests. Ganja Users of Namibia and the Rastafari United Front
      have marched and sued to have the 1971 Act struck down, so far without success.
    sources:
      - nam2
      - nam1
  sharing:
    text: >-
      The Act’s definitions extend dealing to supply and sale to disposal without payment. Section
      2(a) therefore reaches unpaid transfers; the 2006 bill is not used here as an enacted penalty
      tariff.
    sources:
      - act41
  consumption:
    text: >-
      Section 2(b) expressly criminalises use as well as possession of a prohibited
      dependence-producing drug or plant.
    sources:
      - act41
  access:
    text: >-
      No recreational supply route. Sections 4–5 preserve specified medicine-related provisions but
      do not establish an ordinary cannabis supply service.
    sources:
      - act41
context:
  production:
    text: None.
    sources:
      - wiki
  products:
    text: None.
    sources:
      - wiki
  medical:
    text: No medical cannabis.
    sources:
      - wiki
  consequences:
    text: >-
      Section 8 provides forfeiture of drugs, plants and specified property connected with an
      offence, subject to the Act’s safeguards for other interests.
    sources:
      - act41
  planting:
    seeds: illegal
    seeds_trade: banned
    clones: illegal
    clones_trade: banned
    text: >-
      The 1971 Act lists as a prohibited dependence-producing drug "Cannabis (Dagga) and the whole
      plant or any portion or product thereof", which takes in seed and cuttings alike. The 2008
      medicines regulations exempt only processed products made from cannabis seed that contain
      almost no THC and no whole seeds.
    sources:
      - act41
      - gn178
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited.
    sources:
      - wiki
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. Possession is a crime under the Abuse of
      Dependence-Producing Substances and Rehabilitation Centres Act of 1971; small amounts
      typically bring a fine or a short or suspended sentence.
    sources:
      - nam1
      - wiki
  driving:
    status: impairment
    text: >-
      The published Road Traffic and Transport Act section 82(1) prohibits driving a vehicle on a
      public road while under the influence of a drug having a narcotic effect. It also covers
      occupying the driver’s seat of a motor vehicle with its engine running. This is a
      drug-influence offence; the separate blood-alcohol and breath-alcohol provisions do not
      establish a cannabis concentration limit. The available NamibLII edition is dated 9 December
      2008, so it is a qualified statutory baseline rather than certification of all current
      amendments. A current cannabis fine, prison ceiling, licence-ban tariff and drug-specific
      sampling or refusal procedure were not established in this review.
    sources:
      - traffic2008
  arrests:
    text: >-
      The Namibian Police's media statement for March 2025 counted 160 suspects arrested for drugs
      that month, 151 of them Namibian, and valued the cannabis seized at about 3.1 million Namibian
      dollars out of a total of over 3.5 million. The statement prints the cannabis weight as
      312,560 kilogrammes, which on its own valuation would price cannabis at ten Namibian dollars a
      kilogram, so the unit is probably grams.
    sources:
      - newera25
