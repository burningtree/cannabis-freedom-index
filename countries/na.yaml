segments:
  possession:
    text: >-
      Cannabis (dagga) is prohibited by the apartheid-era Abuse of Dependence-Producing Substances
      and Rehabilitation Centres Act of 1971. Possession is a crime; small amounts typically bring a
      fine or a short or suspended sentence. Holding more than 115 g creates a legal presumption of
      dealing, which the High Court upheld in 2026.
    sources:
      - nam1
      - wiki
  cultivation:
    text: Cultivation is a crime under the 1971 Act.
    sources:
      - wiki
  enforcement:
    text: >-
      Cannabis accounts for most drug arrests. Ganja Users of Namibia and the Rastafari United Front
      have marched and sued to have the 1971 Act struck down, so far without success.
    sources:
      - nam2
      - nam1
  sharing:
    text: Dealing carries heavy penalties; a 2006 bill proposed 20 to 40 years even for first offences.
    sources:
      - wiki
  consumption:
    text: Use is an offence.
    sources:
      - wiki
  access:
    text: None.
    sources:
      - wiki
