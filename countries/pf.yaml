name: French Polynesia
region: Oceania
iso_numeric: 258
dependency:
  of: fr
  kind: Overseas collectivity
  note: >-
    French Polynesia is an overseas collectivity of France with wide autonomy. Its Assembly passes
    "lois du pays" on health, including the rules on poisonous substances and medical cannabis,
    while criminal law, the police and the courts stay with the French State, which answers for it
    internationally. Any step towards recreational cannabis would need the State's agreement.
recreational: illegal
medical: limited
updated: 2026-10-17
summary: >-
  Cannabis, known locally as paka, is widely grown and banned. Cases go to the court in Papeete and
  usually end in fines. A 2023 medical cannabis law was repealed that November without ever being
  used. Its 2024 replacement allows low-THC hemp and cannabis medicines, and a pilot with nine
  growers is now under way.
scores:
  possession: 1
  cultivation: 1
  enforcement: 2
  sharing: 1
  consumption: 1
  access: 0
segments:
  possession:
    text: >-
      Possessing and using cannabis are offences. In June 2024 the court in Papeete convicted the
      Cirque du Soleil founder Guy Laliberté of possession and use and fined him 2 million francs.
      The prosecutor, who called production, consumption and use "formally prohibited", had also
      asked for a six-month suspended prison sentence. On a customs mission to Bora Bora in 2024, a
      passenger carrying 21.8 g of herb was fined 11,000 CFP francs.[@tntv24,bora24] The sources
      consulted do not show whether police there issue France's fixed fine for drug use.[@code]
    sources:
      - code
      - tntv24
      - bora24
    currency: XPF
    penalties:
      - label: Laliberté case, possession and use (June 2024)
        treatment: criminal
        term: Possession
        fine: 2000000
        note: Prosecutor had also asked for a six-month suspended sentence
      - upto: 21.8 g
        treatment: criminal
        term: Possession
        fine: 11000
        note: Bora Bora customs case, 21.8 g of herb
  cultivation:
    text: >-
      Growing cannabis is prohibited even for therapeutic use; only the low-THC hemp pilot under the
      2024 law is licensed. Small grows usually end in fines. A lawyer said in 2024 that a client
      caught with 93 plants was fined 150,000 francs after pleading guilty. The same year a father
      who had grown about a hundred plants to make oil for his epileptic son was acquitted, after the
      prosecutor asked the court to waive punishment.[@relaxe24] Only the low-THC hemp pilot is
      licensed; ordinary cultivation remains an offence under the 1978 territorial law.[@pf1978,law2024]
    sources:
      - relaxe24
      - pf1978
      - law2024
    currency: XPF
    penalties:
      - label: 93 plants, guilty plea (2024)
        treatment: criminal
        term: Cultivation
        fine: 150000
      - label: About 100 plants for a sick child's oil (2024)
        treatment: criminal
        term: Cultivation
        note: Acquitted after the prosecutor asked the court to waive punishment
  enforcement:
    text: >-
      Drug offences are a priority for the State. In 2025 drug-law offences rose by 32.9%, made up
      nearly a quarter of all recorded offences, and ran at twice the national rate per inhabitant.
      Gendarmes destroyed 25,000 cannabis plants and seized more than 1.5 tonnes of herb.[@bilan25,ops25]
      Users who reach court mostly receive fines, though prosecutors sometimes ask for suspended
      prison terms.[@tntv24]
    sources:
      - bilan25
      - ops25
      - tntv24
  sharing:
    text: >-
      Outside the activities the 2024 law licenses, cannabis remains prohibited, and passing it to
      someone else is not treated differently from supply.[@code,pf1978] Recreational use was left out
      of the reform as a matter for a later debate.[@law2024]
    sources:
      - code
      - pf1978
      - law2024
  consumption:
    text: >-
      Use itself is an offence and was part of the conviction in the Laliberté case.[@tntv24] Use is common
      among the young: in a 2009 survey of pupils, 29.3% had ever smoked paka and 20.4% had done so in
      the past year.[@spf]
    sources:
      - tntv24
      - spf
  access:
    text: >-
      There is no lawful source for adults. The 2024 law provides for doctors to prescribe and
      pharmacists to dispense cannabis-based medicines, with the products to be set by arrêté, but
      the sources consulted show no such medicine available yet.[@law2024,lnc25] In February 2025 CBD
      oil still awaited further arrêtés.[@lnc25]
    sources:
      - law2024
      - lnc25
context_not_applicable:
  death_penalty:
    text: >-
      Criminal law stays with the French State, which abolished the death penalty in 1981; no
      cannabis offence carries a capital sentence.[@wikipdp]
    sources: [wikipdp]
context:
  recreational:
    text: >-
      There is no lawful source for adults: cannabis, known locally as paka, is widely grown
      and banned. Cases go to the court in Papeete and usually end in fines; a 2025
      enforcement review found users who reach court mostly receive fines.[@bilan25,tntv24]
    sources:
      - bilan25
      - tntv24
  culture:
    text: >-
      Cannabis is known as paka and grows widely across the islands.[@spf] It was explicitly
      banned by the [1978 territorial law](/history/french-polynesia-cannabis-prohibition-adopted-1978/).
      Use is common among the young: in a 2009 pupil survey 29.3% had ever smoked paka and 20.4% had
      done so in the past year.[@spf]
    sources:
      - spf
  hemp:
    status: standard
    text: >-
      The 2025 arrêtés allow at most ten approved growers on 1.5 hectares in all, 0.15 hectares
      each, for people resident more than ten years; plants must stay at or below 0.3% THC. The
      permitted products are seeds, food, dried leaves, infusions and food supplements, while
      CBD oil still awaits further arrêtés.[@lnc25] In August 2026 nine growers were chosen for
      a one-year pilot, with first harvests expected in April 2027.[@cann26]
    sources:
      - lnc25
      - cann26
  production:
    status: medical
    text: >-
      The only licensed growing is a pilot under the law of 23 August 2024.[@law2024] Arrêtés
      published in February 2025 allow at most ten approved growers on 1.5 hectares in all: 0.15
      hectares each, two per archipelago, and only for people resident for more than ten
      years.[@lnc25] Plants must stay at or below 0.3% THC, and sites must be screened from view and
      kept away from schools and roads.[@lnc25] In August 2026 nine growers were chosen for a one-year pilot, with first harvests
      expected in April 2027.[@cann26] Illegal outdoor growing is widespread across the islands.[@ops25]
    sources:
      - law2024
      - lnc25
      - cann26
      - ops25
  medical:
    text: >-
      The Assembly first adopted a law on poisonous substances in November 2022, promulgated on 5
      January 2023.[@pa22] It would have allowed cannabis medicines and licensed growing, but needed
      about fifteen implementing decisions.[@pa22] The new government had it repealed on 20 November
      2023 as too complicated, which restored rules dating from 1978.[@lnc23a] A narrower law,
      adopted on 9 July 2024 by
      41 votes with 16 abstentions, covers non-intoxicating cannabis and medicines containing
      cannabis or cannabinoids.[@law2024] No authorised product or implementing list was
      found.[@law2024]
    sources:
      - law2024
      - pa22
      - lnc23a
  consequences:
    text: >-
      The father acquitted in June 2024 had been prosecuted for two years, and the ruling did not
      allow him to keep growing for his son. A defence lawyer in the Laliberté case called his
      client one of the last to be convicted of an offence that would soon disappear.[@relaxe24,tntv24]
    sources:
      - relaxe24
      - tntv24
  clubs:
    status: none
    text: >-
      No cannabis clubs are known. Supplying cannabis is an offence, and the 2024 reform left
      recreational use out.[@code,law2024]
    sources:
      - code
      - law2024
  visitors:
    status: none
    text: >-
      There is no legal supply for anyone. A prescription from home does not help: in the Laliberté
      case the prosecutor argued that he could not rely on Canadian law, and the court convicted
      him.[@tntv24]
    sources:
      - tntv24
  planting:
    seeds: licensed
    seeds_trade: regulated
    clones: licensed
    clones_trade: regulated
    text: >-
      The hemp pilot allows approved growers to use five listed low-THC varieties and registered
      seed, inside quota'd plots.[@law2024,cann26] Outside that pilot, planting cannabis is
      cultivation under the 1978 territorial ban, with no personal seed or clone exception.[@pf1978]
    sources:
      - law2024
      - cann26
      - pf1978
  driving:
    status: zero
    text: >-
      Driving after using narcotics is an offence under Code de la route L235-1, with up to three
      years and a €9,000 fine, six licence points, suspension for up to five years and possible
      confiscation.[@road] Gendarmes carry out about 5,000 drug tests a year, with roughly 500
      positive, and drugs or alcohol featured in 60% of 2025 fatal crashes.[@bilan25] There is no
      THC cut-off in the cited provisions; the offence follows a positive drug test.[@road]
    sources:
      - road
      - bilan25
  black_market:
    text: >-
      Cannabis is locally produced in mountain valleys and fa'aapu, with inter-island traffic such as
      the Huahine-to-Tahiti plane route.[@bilan25] In 2025 gendarmes destroyed 25,000 plants and
      seized more than 1.5 tonnes of herb, officially valued at 1.46 billion XPF.[@bilan25] In
      February 2025 Operation Matai Rorofai destroyed 7,419 plants and implicated 395 people, and in
      August 2026 customs seized 513 kg of plants and cuttings in Huahine.[@matai25,huahine26] No
      reliable retail price per gram was found.[@bilan25]
    sources:
      - bilan25
      - matai25
      - huahine26
  arrests:
    text: >-
      French Polynesia recorded 3,400 drug-law offences in 2025, up 32.9%, or 12.2 per 1,000
      inhabitants against 5.34 nationally; trafficking was nearly a quarter of all
      offences.[@bilan25] Operation Matai Rorofai in February 2025 implicated 395 people and held 45
      in custody.[@matai25] No cannabis-only arrest series is published.[@bilan25]
    sources:
      - bilan25
      - matai25
