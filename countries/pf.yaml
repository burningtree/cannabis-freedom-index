name: French Polynesia
region: Oceania
iso_numeric: 258
dependency:
  of: fr
  kind: Overseas collectivity
  note: >-
    French Polynesia is an overseas collectivity of France with wide autonomy. Its Assembly passes
    "lois du pays" on health, including the rules on poisonous substances and medical cannabis,
    while criminal law, the police and the courts stay with the French State, which answers for it
    internationally. Any step towards recreational cannabis would need the State's agreement.
population:
  2022: 278786
cannabis_use:
  prevalence: 11.6
  estimate: true
  users: 22000
recreational: illegal
medical: limited
updated: 2026-10-17
summary: >-
  Cannabis, known locally as paka, is widely grown and banned. Cases go to the court in Papeete and
  usually end in fines. A 2023 medical cannabis law was repealed that November without ever being
  used. Its 2024 replacement allows low-THC hemp and cannabis medicines, and a pilot with nine
  growers is now under way.
scores:
  possession: 1
  cultivation: 1
  enforcement: 2
  sharing: 1
  consumption: 1
  access: 0
segments:
  possession:
    text: >-
      Possessing and using cannabis are offences. In June 2024 the court in Papeete convicted the
      Cirque du Soleil founder Guy Laliberté of possession and use and fined him 2 million francs.
      The prosecutor, who called production, consumption and use "formally prohibited", had also
      asked for a six-month suspended prison sentence. On a customs mission to Bora Bora in 2024, a
      passenger carrying 21.8 g of herb was fined 11,000 CFP francs. The sources consulted do not
      show whether police there issue France's fixed fine for drug use.
    sources:
      - tntv24
      - bora24
  cultivation:
    text: >-
      Growing cannabis is prohibited even for therapeutic use; only the low-THC hemp pilot under the
      2024 law is licensed. Small grows usually end in fines. A lawyer said in 2024 that a client
      caught with 93 plants was fined 150,000 francs after pleading guilty. The same year a father
      who had grown about a hundred plants to make oil for his epileptic son was acquitted, after the
      prosecutor asked the court to waive punishment.
    sources:
      - tntv24
      - relaxe24
  enforcement:
    text: >-
      Drug offences are a priority for the State. In 2025 drug-law offences rose by 32.9%, made up
      nearly a quarter of all recorded offences, and ran at twice the national rate per inhabitant.
      Gendarmes destroyed 25,000 cannabis plants and seized more than 1.5 tonnes of herb. Users who
      reach court mostly receive fines, though prosecutors sometimes ask for suspended prison terms.
    sources:
      - bilan25
      - ops25
      - tntv24
  sharing:
    text: >-
      Outside the activities the 2024 law licenses, cannabis remains prohibited, and passing it to
      someone else is not treated differently from supply. Recreational use was left out of the
      reform as a matter for a later debate.
    sources:
      - lnc23b
  consumption:
    text: >-
      Use itself is an offence and was part of the conviction in the Laliberté case. Use is common
      among the young: in a 2009 survey of pupils, 29.3% had ever smoked paka and 20.4% had done so in
      the past year.
    sources:
      - tntv24
      - spf
  access:
    text: >-
      There is no lawful source for adults. The 2024 law provides for doctors to prescribe and
      pharmacists to dispense cannabis-based medicines, with the products to be set by arrêté, but
      the sources consulted show no such medicine available yet. In February 2025 CBD oil still
      awaited further arrêtés.
    sources:
      - lnc23b
      - lnc25
context:
  production:
    text: >-
      The only licensed growing is a pilot under the law of 23 August 2024. Arrêtés published in
      February 2025 allow at most ten approved growers on 1.5 hectares in all: 0.15 hectares each,
      two per archipelago, and only for people resident for more than ten years. Plants must stay
      at or below 0.3% THC, and sites must be screened from view and kept away from schools and
      roads. In August 2026 nine growers were chosen for a one-year pilot, with first harvests
      expected in April 2027. Illegal outdoor growing is widespread across the islands.
    sources:
      - lnc25
      - cann26
      - ops25
  products:
    text: >-
      The 2025 arrêtés list seeds, food, dried leaves, infusions and food supplements among the
      permitted hemp products; CBD oil needs further arrêtés from the health and economy ministries.
      Before the 2024 law, CBD vape liquids, oils, monoï and creams were sold in a legal grey area.
    sources:
      - lnc25
      - lnc23b
  medical:
    text: >-
      The Assembly first adopted a law on poisonous substances in November 2022, promulgated on 5
      January 2023. It would have allowed cannabis medicines and licensed growing, but needed about
      fifteen implementing decisions. The new government had it repealed on 20 November 2023 as too
      complicated, which restored rules dating from 1978. A narrower law, adopted on 9 July 2024 by
      41 votes with 16 abstentions, covers non-intoxicating cannabis and medicines containing
      cannabis or cannabinoids.
    sources:
      - pa22
      - lnc23a
      - tntv24b
  consequences:
    text: >-
      The father acquitted in June 2024 had been prosecuted for two years, and the ruling did not
      allow him to keep growing for his son. A defence lawyer in the Laliberté case called his
      client one of the last to be convicted of an offence that would soon disappear.
    sources:
      - relaxe24
      - tntv24
  clubs:
    status: none
    text: >-
      No cannabis clubs are known. Supplying cannabis is an offence, and the 2024 reform left
      recreational use out.
    sources:
      - lnc23b
  visitors:
    status: none
    text: >-
      There is no legal supply for anyone. A prescription from home does not help: in the Laliberté
      case the prosecutor argued that he could not rely on Canadian law, and the court convicted him.
    sources:
      - tntv24
