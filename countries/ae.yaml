segments:
  possession:
    text: >-
      Under Federal Decree-Law 30 of 2021, a first offence of possessing or using cannabis for
      personal use carries at least three months in prison or a fine of AED 10,000–100,000 — a
      softening from the previous mandatory four years. Repeat offences bring longer mandatory
      terms. Trace amounts, including residue or metabolites in the body, are enough.
    sources:
      - ly
      - mondaq
  cultivation:
    text: Cultivation is a serious crime with long prison terms.
    sources:
      - mondaq
  enforcement:
    text: >-
      Still one of the strictest regimes, though the 2021 law added fines and rehabilitation as
      alternatives for first offences. A 2024 rule lets non-residents caught at ports of entry with
      personal-use amounts pay a fine of AED 5,000–20,000.
    sources:
      - mondaq
      - ly
  sharing:
    text: >-
      Supply is trafficking. Article 57 provides the death penalty when prohibited drugs or plants
      are possessed or acquired with intent to traffic or promote them.
    sources:
      - dl30
  consumption:
    text: >-
      Use is an offence proved by blood or urine test, on the same terms as possession. Courts can
      order treatment for first offenders.
    sources:
      - ly
      - mondaq
  access:
    text: None.
    sources:
      - l500
context:
  death_penalty:
    text: >-
      Federal Decree-Law 30 of 2021 provides the death penalty for trafficking or promotion involving
      prohibited narcotic substances or drug-producing plants, which include cannabis.
    sources:
      - dl30
  production:
    text: None.
    sources:
      - l500
  products:
    text: >-
      None. CBD and hemp products count as cannabis. A first-time visitor found with food or
      products containing THC or CBD at the border may have them confiscated without prosecution;
      inside the country possession is a crime.
    sources:
      - ly
      - mondaq
  medical:
    text: No medical cannabis.
    sources:
      - l500
  consequences:
    text: >-
      Deportation of foreigners after a drug conviction, once mandatory, is now at the court's
      discretion for first-time personal-use offences.
    sources:
      - mondaq
      - l500
  planting:
    seeds: illegal
    seeds_trade: banned
    clones: illegal
    clones_trade: banned
    text: >-
      Article 14 of Federal Decree-Law 30 of 2021 bans growing, importing, owning or holding
      the listed plants, or any other plant that yields drugs, at any stage of growth, as well
      as their seeds. Landowners must report such plants on their land. Licences to grow go
      only to government bodies and scientific institutes.
    sources:
      - dl30
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited.
    sources:
      - mondaq
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. For a visitor the risk starts at the
      airport: British travel advice describes zero tolerance, with scanners that also check
      the bags of transit passengers and arrests over residual amounts. The presence of drugs
      in the bloodstream counts as possession, which carries a minimum of three months in
      prison or a fine of 20,000 to 100,000 dirhams, and trafficking can bring the death
      penalty. Products with CBD, including some skincare and vape refills, are illegal and
      can lead to charges.
    sources:
      - l500
      - fcdo
