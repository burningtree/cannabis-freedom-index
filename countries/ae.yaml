name: United Arab Emirates
region: Asia
iso_numeric: 784
recreational: death
medical: limited
updated: "2026-10-28"
summary: >-
  First-offence penalties were softened in 2022, but personal use remains one of the world's
  strictest regimes, with trace amounts enough and mandatory deportation for foreigners from 1
  January 2026. A separate 2026 law allows licensed industrial hemp and authorised hemp-derived
  medical products.
