segments:
  possession:
    text: >-
      Under Federal Decree-Law 30 of 2021, a first offence of possessing or using cannabis for
      personal use carries at least three months in prison or a fine of AED
      10,000–100,000.[@dl30,lexai] A second offence within three years brings at least six months or
      AED 20,000–100,000, and a third at least six months and AED 50,000–200,000.[@lexai] There is
      no minimum quantity: residue or metabolites in the body are enough, and purity is ignored when
      the weight is calculated.[@dl30,lexai] Possession outside personal use follows quantity tiers,
      with life imprisonment above 100 g and death where intent to traffic or promote is
      proved.[@dl30]
    sources:
      - dl30
      - lexai
    currency: AED
    penalties:
      - label: First personal-use offence
        treatment: criminal
        term: Personal use
        prison_min: 3 months
        fine_min: 10000
        fine: 100000
        note: Prison or fine; court may order treatment for up to a year instead
      - label: Second personal-use offence within three years
        treatment: criminal
        term: Personal use
        prison_min: 6 months
        fine_min: 20000
        fine: 100000
        note: Prison or fine
      - label: Third or later personal-use offence
        treatment: criminal
        term: Personal use
        prison_min: 6 months
        fine_min: 50000
        fine: 200000
        note: Prison and fine; the English text misprints the maximum as 200 dirhams
      - label: Non-resident at a port of entry, first offence
        treatment: criminal
        term: Personal use
        fine_min: 5000
        fine: 20000
        note: Under 100 g of cannabis; substances seized and destroyed
      - label: Non-resident at a port of entry, second offence
        treatment: criminal
        term: Personal use
        fine_min: 10000
        fine: 30000
        note: Plus deportation and a three-year entry ban
      - label: Non-resident at a port of entry, third offence
        treatment: criminal
        term: Personal use
        fine_min: 50000
        fine: 100000
        note: Plus deportation and a permanent entry ban
      - label: Possession outside personal use, under 20 g
        treatment: criminal
        term: Possession
        fine_min: 100000
        note: Imprisonment and a fine of at least AED 100,000
      - label: Possession outside personal use, 20 g to 100 g
        treatment: criminal
        term: Possession
        prison_min: 10 years
        fine_min: 100000
        note: Imprisonment and a fine of at least AED 100,000
      - label: Possession outside personal use, over 100 g
        treatment: criminal
        term: Possession
        fine_min: 500000
        note: Life imprisonment and a fine of at least AED 500,000
        life: mandatory
      - label: Possession with intent to traffic or promote
        treatment: criminal
        term: Trafficking
        death: true
        note: Article 57; no quantity threshold
  cultivation:
    text: >-
      Growing cannabis outside a licence is a serious crime with long prison terms.[@dl30] Under
      Article 14 and Schedule 10, fewer than five plants bring imprisonment and a fine of at least
      AED 100,000; five to fifteen plants bring at least ten years and AED 100,000; more than
      fifteen plants bring life imprisonment and at least AED 500,000.[@dl30,lexai] Intent to
      traffic or promote carries death under Article 57, with no plant threshold.[@dl30] Licensed
      industrial hemp at or below 0.3% THC, in approved zones, is a separate regime from 1 January
      2026.[@hemp26n]
    sources:
      - dl30
      - lexai
      - hemp26n
    currency: AED
    penalties:
      - label: Fewer than five plants
        treatment: criminal
        term: Cultivation
        fine_min: 100000
        note: >-
          Imprisonment and a fine of at least AED 100,000; personal-use intent is sentenced under
          Article 42
      - label: Five to fifteen plants
        treatment: criminal
        term: Cultivation
        prison_min: 10 years
        fine_min: 100000
        note: Imprisonment and a fine of at least AED 100,000
      - label: More than fifteen plants
        treatment: criminal
        term: Cultivation
        fine_min: 500000
        note: Life imprisonment and a fine of at least AED 500,000
        life: mandatory
      - label: Cultivation with intent to traffic or promote
        treatment: criminal
        term: Trafficking
        death: true
        note: Article 57; no plant threshold
  enforcement:
    text: >-
      Still one of the strictest regimes, though the 2021 law added fines and rehabilitation as
      alternatives for first offences.[@mondaq,ly] A 2024 rule lets non-residents caught at ports of
      entry with personal-use amounts pay a fine of AED 5,000–20,000, with higher tiers for repeat
      entries and deportation.[@res43] The National Anti-Narcotics Strategy 2024–2031 aims at a
      drug-free nation by 2031.[@gulfstats24]
    sources:
      - mondaq
      - ly
      - res43
      - gulfstats24
  sharing:
    text: >-
      Supply is trafficking. Article 57 provides the death penalty when prohibited drugs or plants
      are possessed or acquired with intent to traffic or promote them, with no quantity
      threshold.[@dl30] Without that intent, the quantity tiers apply: under 20 g brings
      imprisonment and at least AED 100,000; 20 g to 100 g at least ten years and AED 100,000; more
      than 100 g life imprisonment and at least AED 500,000.[@dl30,lexai] Facilitating another
      person's use is a separate offence carrying at least five years and AED 50,000.[@dl30]
    sources:
      - dl30
      - lexai
    currency: AED
    penalties:
      - label: Trafficking or promotion
        treatment: criminal
        term: Trafficking
        death: true
        note: Article 57; death where intent to traffic or promote is proved
      - label: Facilitating another person's use
        treatment: criminal
        term: Facilitation
        prison_min: 5 years
        fine_min: 50000
      - label: Managing or preparing a place for drug use, Article 53
        treatment: criminal
        term: Drug den
        prison_min: 10 years
        fine_min: 100000
  consumption:
    text: >-
      Use is an offence proved by blood or urine test, on the same terms as possession.[@ly,mondaq]
      Courts can order treatment for first offenders for up to a year, and prosecutors can divert
      before charge.[@dl30,mondaq]
    sources:
      - ly
      - mondaq
      - dl30
  access:
    text: >-
      No high-THC cannabis medicine is registered or available on a normal prescription. The only
      verified medical route is an authorised hemp-derived product under the 2026 law, and no
      product or pharmacy stock was verified.[@dl30,national26] CBD has no open consumer
      route.[@national26]
    sources:
      - dl30
      - national26
context:
  recreational:
    text: >-
      There is no legal recreational supply. A first personal-use offence brings at least three
      months or an AED 10,000–100,000 fine, with treatment possible instead; repeat offences bring
      longer mandatory terms, and even trace amounts count.[@ly,mondaq] Non-residents caught at
      ports of entry with personal-use amounts pay AED 5,000–20,000 under a 2024 rule.[@ly] Supply
      is trafficking, with death available for trafficking or promotion.[@dl30]
    sources:
      - ly
      - mondaq
      - dl30
  death_penalty:
    text: >-
      Federal Decree-Law 30 of 2021 provides the death penalty for trafficking or promotion
      involving prohibited narcotic substances or drug-producing plants, which include
      cannabis.[@dl30] The wording is mandatory where intent is proved, but no reliable public data
      on cannabis-specific death sentences or executions in 2024–2026 was found; the three UAE
      executions in 2025 were all for murder.[@dl30,lexai,amnesty25] Articles 49–51 also provide
      death or life for fatal administration or forcing drugs on another person.[@dl30]
    sources:
      - dl30
      - lexai
      - amnesty25
  production:
    status: hemp
    text: >-
      From 1 January 2026 licensed industrial hemp is lawful.[@hemp26] Cultivation needs a licence
      from the Ministry of Climate Change and Environment, a local permit and security clearance,
      and it is confined to zones that are secured, fenced and kept apart from homes and other
      farms.[@hemp26n] Tetrahydrocannabinol must stay at or below 0.3%.[@hemp26] An emirate may
      prohibit or restrict the activity.[@hemp26n] No list of issued cultivation licences was
      read.[@hemp26,hemp26n]
    sources:
      - hemp26
      - hemp26n
  medical:
    text: >-
      No high-THC cannabis medicine is registered or available on a normal prescription. The 2026
      hemp law permits authorised medical products containing industrial-hemp compounds or raw
      materials under the medical-products law; no authorised product or pharmacy stock was
      verified.[@hemp26n,national26] A compound that can produce a narcotic or psychoactive effect
      stays under the narcotics law.[@ly]
    sources:
      - hemp26n
      - national26
      - ly
  hemp:
    status: standard
    text: >-
      From 1 January 2026 a federal decree allows licensed industrial hemp at or below 0.3%
      tetrahydrocannabinol.[@hemp26] Cultivation needs a licence from the Ministry of Climate Change
      and Environment, a local permit and security clearance, and must take place in secured, fenced
      zones apart from homes and other farms; an emirate may prohibit or restrict it.[@hemp26n]
      Personal and recreational use of hemp remains prohibited. Hemp food is banned except roasted
      or processed non-viable seeds; dietary supplements, veterinary products and smoking products
      are banned; cosmetics may use THC-free seed or stalk oils and some THC-free plant
      preparations, but not products containing THC.[@hemp26n]
    sources:
      - hemp26
      - hemp26n
  consequences:
    text: >-
      Since 1 January 2026, courts must deport any foreign national convicted under the narcotics
      law after sentence, except the spouse or first-degree relative of a UAE citizen, or a member
      of a resident family where deportation would seriously harm family stability or care and the
      family has the financial capacity to provide treatment.[@decree14_2025,zaa] Before that,
      deportation for first-time personal use was discretionary.[@mondaq] A conviction can also
      bring a criminal record and, for repeat addiction offences, licence revocation.[@dl30]
    sources:
      - decree14_2025
      - zaa
      - mondaq
      - dl30
  planting:
    seeds: licensed
    seeds_trade: regulated
    clones: licensed
    clones_trade: regulated
    text: >-
      Article 14 of Federal Decree-Law 30 of 2021 bans growing, importing, owning or holding the
      listed plants, or any other plant that yields drugs, at any stage of growth, as well as their
      seeds.[@dl30] Landowners must report such plants on their land.[@dl30] Licences under that law
      go only to government bodies and scientific institutes.[@dl30] From 1 January 2026 a separate
      law lets a licensed agricultural company import and export approved industrial-hemp seeds, and
      lets a licensed grower cultivate and handle seedlings, only inside approved plots. Seeds and
      seedlings may be passed only to a person licensed for the activity.[@hemp26n] Personal growing
      stays prohibited.[@dl30]
    sources:
      - dl30
      - hemp26n
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing and supplying
      cannabis are prohibited, and managing or preparing a place for drug use carries at least ten
      years and AED 100,000.[@dl30]
    sources:
      - dl30
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone.[@dl30] A non-resident arriving at a port
      with under 100 g of cannabis for personal use pays AED 5,000–20,000 on a first entry, rising
      to AED 10,000–30,000 plus a three-year ban on a second and AED 50,000–100,000 plus a permanent
      ban on a third.[@res43] A visitor caught after entry faces the article 42 personal-use
      penalties and mandatory deportation on conviction.[@dl30,decree14_2025]
    sources:
      - dl30
      - res43
      - decree14_2025
  driving:
    status: impairment
    text: >-
      Federal Decree-Law No. 14 of 2024 on traffic regulation, in force from 29 March 2025, makes it
      an offence to drive or attempt to drive a vehicle while under the influence of narcotic or
      psychotropic substances.[@gn_traffic24,trafficlaw24] The penalty is imprisonment, a fine of
      AED 30,000–200,000, or either, heavier than for alcohol.[@gn_traffic24,trafficlaw24] The
      licence is suspended for six months on a first offence and a year on a second, and cancelled
      on a third.[@gn_traffic24] Causing a death while under the influence brings at least a year in
      prison, a fine of at least AED 100,000, or both.[@gn_traffic24,trafficlaw24]
    sources:
      - gn_traffic24
      - trafficlaw24
  black_market:
    text: >-
      The national police reported 12,340 kg of narcotics and psychotropics seized in 2024, 9,774
      drug-crime reports and 13,513 suspects; the figures cover all drugs, not cannabis
      alone.[@gulfstats24] UNODC records 414 kg of herbal cannabis and 3,352 kg of cannabis resin
      seized in 2022; the series has no 2023–2025 update.[@unodc_szr] The Emirates produce little
      cannabis but have long served as a transshipment point for hashish from Afghanistan and
      Pakistan, helped by free ports and a heterogeneous population.[@incsr09]
    sources:
      - gulfstats24
      - unodc_szr
      - incsr09
  arrests:
    text: >-
      Police handled 13,513 suspects in 9,774 drug-crime reports in 2024, within the 12,340 kg of
      all narcotics and psychotropics seized that year.[@gulfstats24] The figures are not broken
      down by drug, and no public cannabis-only arrest count was found.[@gulfstats24]
    sources:
      - gulfstats24
  research:
    status: licensed
    text: >-
      Articles 10(2) and 16 allow licensed government bodies and scientific institutes to use
      controlled drugs and plants for research, and the 2026 hemp law permits research use with
      approval.[@dl30,hemp26n] The OpenAlex extract has one UAE-affiliated cannabis paper from 1999
      and no clinical trials.[@openalex]
    sources:
      - dl30
      - hemp26n
      - openalex
