name: United Arab Emirates
region: Asia
iso_numeric: 784
recreational: death
medical: limited
updated: 2026-10-23
summary: >-
  A 2022 reform softened first-offence penalties (minimum three months or a fine) and made
  deportation discretionary, but personal use remains one of the strictest regimes, including
  for trace amounts. From 1 January 2026 a separate law allows licensed industrial hemp and
  authorised hemp-derived medical products.
scores:
  possession: 0
  cultivation: 0
  enforcement: 1
  sharing: 0
  consumption: 0
  access: 0
segments:
  possession:
    text: >-
      Under Federal Decree-Law 30 of 2021, a first offence of possessing or using cannabis for
      personal use carries at least three months in prison or a fine of AED 10,000–100,000 — a
      softening from the previous mandatory four years. Repeat offences bring longer mandatory
      terms. Trace amounts, including residue or metabolites in the body, are enough.
    sources:
      - ly
      - mondaq
    currency: AED
    penalties:
      - label: First personal-use offence
        treatment: criminal
        fine: 100000
        prison_min: 3 months
        note: At least three months in prison or a fine of AED 10,000–100,000; court may order treatment for up to a year instead
      - label: Personal-use amount at a port of entry (non-residents, 2024 rule)
        treatment: criminal
        fine: 20000
        note: Fine of AED 5,000–20,000
      - label: Possession with intent to traffic or promote
        treatment: criminal
        note: Death penalty available under Decree-Law 30 of 2021
  cultivation:
    text: >-
      Growing cannabis outside a licence is a serious crime with long prison terms. Licensed
      industrial hemp, at or below 0.3% tetrahydrocannabinol and only in approved zones, is a
      separate regime from 1 January 2026.
    sources:
      - mondaq
      - hemp26n
  enforcement:
    text: >-
      Still one of the strictest regimes, though the 2021 law added fines and rehabilitation as
      alternatives for first offences. A 2024 rule lets non-residents caught at ports of entry with
      personal-use amounts pay a fine of AED 5,000–20,000.
    sources:
      - mondaq
      - ly
  sharing:
    text: >-
      Supply is trafficking. Article 57 provides the death penalty when prohibited drugs or plants
      are possessed or acquired with intent to traffic or promote them.
    sources:
      - dl30
  consumption:
    text: >-
      Use is an offence proved by blood or urine test, on the same terms as possession. Courts can
      order treatment for first offenders.
    sources:
      - ly
      - mondaq
  access:
    text: None.
    sources:
      - l500
context:
  recreational:
    text: >-
      There is no legal recreational supply. A first personal-use offence brings at least three
      months or an AED 10,000–100,000 fine, with treatment possible instead; repeat offences
      bring longer mandatory terms, and even trace amounts count.[@ly,mondaq] Non-residents
      caught at ports of entry with personal-use amounts pay AED 5,000–20,000 under a 2024
      rule.[@ly] Supply is trafficking, with death available for trafficking or
      promotion.[@dl30]
    sources:
      - ly
      - mondaq
      - dl30
  death_penalty:
    text: >-
      Federal Decree-Law 30 of 2021 provides the death penalty for trafficking or promotion involving
      prohibited narcotic substances or drug-producing plants, which include cannabis.
    sources:
      - dl30
  production:
    status: medical
    text: >-
      From 1 January 2026 licensed industrial hemp is lawful. Cultivation needs a licence from
      the Ministry of Climate Change and Environment, a local permit and security clearance, and
      it is confined to zones that are secured, fenced and kept apart from homes and other
      farms. Tetrahydrocannabinol must stay at or below 0.3%. An emirate may prohibit or
      restrict the activity. No list of issued cultivation licences was read.
    sources:
      - hemp26
      - hemp26n
  products:
    text: >-
      Personal and recreational use of industrial hemp is prohibited, as are hemp foods,
      dietary supplements, veterinary products and smoking products. Cosmetics that contain
      hemp are prohibited except for oils from seeds or stalks. The 2026 law allows authorised
      medical products that contain hemp compounds, and licensed manufacture of industrial
      products kept at or below 0.3% tetrahydrocannabinol. Whether any such product is on sale
      was not verified. A compound that can produce a narcotic or psychoactive effect stays
      under the narcotics law.
    sources:
      - hemp26n
      - ly
  medical:
    text: >-
      The 2026 law permits medical products that contain industrial-hemp compounds or hemp raw
      materials, under the law on medical products. It is a route for those hemp-derived
      products. Whether a pharmacy stocks any of them was not verified.
    sources:
      - hemp26n
      - hemp26
  consequences:
    text: >-
      Deportation of foreigners after a drug conviction, once mandatory, is now at the court's
      discretion for first-time personal-use offences.
    sources:
      - mondaq
      - l500
  planting:
    seeds: licensed
    seeds_trade: regulated
    clones: licensed
    clones_trade: regulated
    text: >-
      Article 14 of Federal Decree-Law 30 of 2021 bans growing, importing, owning or holding
      the listed plants, or any other plant that yields drugs, at any stage of growth, as well
      as their seeds. Landowners must report such plants on their land. Licences under that law
      go only to government bodies and scientific institutes. From 1 January 2026 a separate
      law lets a licensed agricultural company import and export approved industrial-hemp
      seeds, and lets a licensed grower cultivate and handle seedlings, only inside approved
      plots. Seeds and seedlings may be passed only to a person licensed for the activity.
      Personal growing stays prohibited.
    sources:
      - dl30
      - hemp26n
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited.
    sources:
      - mondaq
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. Under Federal Decree-Law 30 of 2021, a
      first offence of possessing or using cannabis for personal use carries at least three
      months in prison or a fine of AED 10,000 to 100,000, with longer mandatory terms for
      repeat offences.
    sources:
      - ly
      - mondaq
  driving:
    status: impairment
    text: >-
      Federal Decree-Law No. 14 of 2024 on traffic regulation, in force from 29 March
      2025, makes it an offence to drive or attempt to drive a vehicle while under the
      influence of narcotic or psychotropic substances. The penalty is imprisonment, a
      fine of 30,000 to 200,000 dirhams, or both, heavier than for alcohol. The licence is
      suspended for six months on a first offence and a year on a second, and cancelled on
      a third. Causing a death while under the influence brings at least a year in prison
      and a fine of at least 100,000 dirhams.
    sources:
      - gn_traffic24
