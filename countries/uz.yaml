segments:
  possession:
    text: >-
      Small quantities held without intent to supply fall under administrative article 56:
      a fine of one to two basic calculation units or up to fifteen days of detention, with
      confiscation.[@admin56] The Supreme Court confirms that small personal holdings belong
      under administrative law.[@court17] Above that band, article 276 allows a fine of up to
      fifty basic calculation units, community service, corrective work, restriction of liberty
      for one to three years or imprisonment for up to three years. Large quantities or repeat
      offending can bring restriction of liberty or imprisonment for three to five years.
      Voluntary surrender can remove punishment for the basic offence. Article 273 covers
      intent to supply or actual supply, with longer sentences in its higher bands.[@cc276]
    sources:
      - admin56
      - court17
      - cc276
  cultivation:
    text: >-
      Unauthorised cannabis growing is criminal. The ordinary offence carries a fine of
      twenty-five to fifty basic calculation units, community service, corrective work,
      restriction of liberty for one to three years or imprisonment for up to three years.
      Repeat offending, acting with others by prior agreement or a medium-sized growing area
      can bring a fine of fifty to one hundred units or three to five years of restriction of
      liberty or imprisonment. Organised or large-area growing carries five to ten years.[@cc276]
      The Supreme Court puts growing areas below 250 square metres in the ordinary band and says
      sowing is a completed offence even before germination.[@court17]
    sources:
      - cc276
      - court17
  enforcement:
    text: >-
      Even small personal holdings can bring up to fifteen days of administrative detention.[@admin56]
      Above the small-quantity band, article 276 allows both non-custodial penalties and up to
      three years in prison for the basic offence; aggravated possession carries three to five
      years of restriction of liberty or imprisonment.[@cc276] The Supreme Court instructs judges
      to consider non-prison sentences for people holding drugs for themselves and for certain
      growers whose rehabilitation is possible without imprisonment.[@court17]
    sources:
      - admin56
      - cc276
      - court17
  sharing:
    text: >-
      Giving drugs away, lending them and using them to repay a debt count as supply under
      Supreme Court guidance.[@court17] Article 273 covers supply and holding with intent to
      supply. Its penalties range from a fine or up to three years in prison in the lowest
      band to fifteen to twenty years for large quantities or organised supply across borders
      or through telecommunications or the internet.[@cc276]
    sources:
      - court17
      - cc276
  consumption:
    text: >-
      Since 12 June 2026, public drug use is a separate administrative offence. Citizens face
      a fine of twenty to forty basic calculation units or up to fifteen days of detention,
      with confiscation. Prescribed medical use is excepted.[@admin56]
    sources:
      - admin56
  access:
    text: None.
    sources:
      - ecoi
