name: Uzbekistan
region: Asia
iso_numeric: 860
recreational: illegal
medical: none
updated: '2026-10-28'
summary: >-
  Small personal cannabis holdings can bring a fine or up to fifteen days of administrative
  detention; above 1 g of dried cannabis they become criminal, with up to three years in prison
  for the basic offence. Growing and supplying cannabis are criminal, and since June 2026 public
  use is an administrative offence. Industrial hemp is licensed at 0.2% THC; medical cannabis has
  no patient route.
