segments:
  possession:
    text: >-
      Thresholds are among the lowest anywhere: up to 1 g of cannabis counts as a 'small' amount
      handled without a long sentence; 1 to 10 g brings five to seven years in prison; above 10 g,
      ten to twenty years.
    sources:
      - ecoi
  cultivation:
    text: Cultivation is a crime with prison.
    sources:
      - ecoi
  enforcement:
    text: >-
      Enforcement targets people who use drugs far more than commercial traffickers, according to
      civil-society reporting to the UN.
    sources:
      - ecoi
  sharing:
    text: Sale carries long sentences, increased again in 2024 for promotion and distribution.
    sources:
      - kun
      - ecoi
  consumption:
    text: Use is an offence and leads to registration and compulsory treatment.
    sources:
      - ecoi
  access:
    text: None.
    sources:
