segments:
  possession:
    text: >-
      Holding a drug without intent to sell is a criminal offence under article 276. The basic
      offence can bring a fine of up to fifty basic calculation units, community service,
      corrective work, restriction of liberty for one to three years, or imprisonment for up to
      three years. A large quantity, or a repeat offence, can bring restriction of liberty or
      imprisonment for three to five years. A person who turns themself in and hands over the
      drugs is released from punishment for the basic offence. Five to seven years, and ten to
      twenty years, are sentences under article 273, which requires intent to sell or an actual
      sale. The official quantity table was not read, so no gram bands are stated.
    sources:
      - cc276
  cultivation:
    text: Cultivation is a crime with prison.
    sources:
      - ecoi
  enforcement:
    text: >-
      Article 276 allows a fine for possession without intent to sell, and it also allows up to
      three years in prison. Article 273, which requires intent to sell, carries the longer
      prison terms.
    sources:
      - cc276
  sharing:
    text:       Article 273 punishes handling drugs with intent to sell, and selling them. Above a small
      quantity the sentence is five to seven years. A large quantity can bring fifteen to twenty
      years, and aggravating circumstances sit between those bands.
    sources:
      - cc276
      - kun
  consumption:
    text: Use is an offence and leads to registration and compulsory treatment.
    sources:
      - ecoi
  access:
    text: None.
    sources:
      - ecoi
