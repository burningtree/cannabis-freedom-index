  planting:
    seeds: grey
    seeds_trade: unclear
    clones: licensed
    clones_trade: regulated
    text: >-
      Under the 1999 narcotics law, cultivating narcotic-containing plants is a state
      monopoly. Article 21 allows it only for state institutions for scientific purposes and,
      since a 2020 amendment, for companies holding a licence for industrial purposes. The law
      does not mention seeds.
    sources:
      - l813
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited.
    sources:
      - ecoi
      - kun
  visitors:
    status: none
    text: >-
      There is no legal recreational supply. Small personal holdings can bring a fine of one
      to two basic calculation units or up to fifteen days of administrative detention.[@admin56]
      Larger personal holdings fall under criminal article 276, with a fine or up to three years
      in prison for the basic offence. Supplying cannabis or holding it with intent to supply
      falls under article 273 and carries higher penalties in its upper bands.[@cc276]
    sources:
      - admin56
      - cc276
  driving:
    status: impairment
    text: >-
      The Code of Administrative Responsibility punishes driving in a state of alcoholic
      intoxication or under the influence of narcotic drugs, psychotropic substances or other
      substances that affect a person's mental and volitional activity. The penalty is a fine
      of forty base calculation units and loss of the licence for three years; a driver with
      no licence is fined fifty units or held for 15 days. The article sets no THC level.
    sources:
      - koao131
  black_market:
    text: >-
      Figures reported by the government to the UN drugs office record 664 kg of herbal
      cannabis seized in 2024, against 661 kg in 2023, and 579 kg of cannabis resin seized
      in 2024, against 623 kg in 2023. The UN publishes them as kilogram equivalents, and
      countries count seizures differently, so the figures are not comparable across
      borders.
    sources:
      - unodc_szr
  arrests:
    text: >-
      The Supreme Court's press service reported that courts convicted 2,889 people of
      drug offences in the first eleven months of 2025. Almost all, 2,875, were convicted
      under article 273 of the Criminal Code, which covers handling drugs with intent to supply
      or supplying them, and 2,650 of them were sent to prison; 225 received fines, corrective
      labour or other alternatives. Only 14 people were convicted under article 271, the
      offence of unlawfully taking drugs from others, 13 of whom were imprisoned. In
      2024 the courts convicted 3,020 people under article 273. The figures are not split
      by drug. Article 271 concerns taking drugs by theft, fraud and other forms of
      appropriation; personal possession without intent to supply is article 276.[@anhor25, cc276]
    sources:
      - anhor25
      - cc276
