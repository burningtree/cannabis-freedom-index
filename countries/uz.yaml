name: Uzbekistan
region: Asia
iso_numeric: 860
recreational: illegal
medical: none
updated: 2026-10-25
summary: >-
  Small personal cannabis holdings can bring a fine or up to fifteen days of administrative
  detention. Larger holdings without intent to supply remain criminal, with up to three years
  in prison for the basic offence. Growing and supplying cannabis are criminal offences.
