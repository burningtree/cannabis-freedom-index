name: Uzbekistan
region: Asia
iso_numeric: 860
recreational: illegal
medical: none
updated: 2026-10-23
summary: >-
  Possession without intent to sell is a criminal offence under article 276, with a fine or up to
  three years in prison. Intent to sell is a separate offence under article 273, with longer
  sentences.
