segments:
  possession:
    text: >-
      Small quantities held without intent to supply fall under administrative article 56: a fine
      of one to two basic calculation units or up to fifteen days of detention, with
      confiscation.[@admin56] The Supreme Court confirms that small personal holdings belong under
      administrative law.[@court17] Above that band, article 276 allows a fine of up to fifty basic
      calculation units, community service, corrective work, restriction of liberty for one to
      three years or imprisonment for up to three years. Large quantities or repeat offending can
      bring restriction of liberty or imprisonment for three to five years. Voluntary surrender can
      remove punishment for the basic offence.[@cc276] Supply itself falls under article 273, with
      longer sentences [@cc276]. The thresholds are 1 g of dried cannabis or 10 g of undried
      cannabis for the small band, and 10 g or 50 g for the large band; hashish lines are 0.2 g and
      2 g, resin 0.1 g and 0.5 g.[@quantities]
    sources:
      - admin56
      - court17
      - cc276
      - quantities
    currency: UZS
    penalties:
      - upto: 1 g
        treatment: civil
        term: Small amount, Article 56
        fine_min: 440000
        fine: 880000
        prison: 15 days
        note: Dried cannabis; confiscation; detention if a fine is insufficient
      - over: 1 g
        upto: 10 g
        treatment: criminal
        term: Above small, Article 276(1)
        fine: 22000000
        prison: 3 years
        note: Fine, community service, corrective labour or restriction of liberty for 1–3 years
      - over: 10 g
        treatment: criminal
        term: Large amount, Article 276(2)
        prison_min: 3 years
        prison: 5 years
        note: Restriction of liberty or imprisonment
  cultivation:
    text: >-
      Unauthorised cannabis growing is criminal. The ordinary offence carries a fine of twenty-five
      to fifty basic calculation units, community service, corrective work, restriction of liberty
      for one to three years or imprisonment for up to three years. Repeat offending, acting with
      others by prior agreement or a medium-sized growing area can bring a fine of fifty to one
      hundred units or three to five years of restriction of liberty or imprisonment. Organised or
      large-area growing carries five to ten years.[@cc276] The Supreme Court puts growing areas
      below 250 square metres in the ordinary band and says sowing is a completed offence even
      before germination.[@court17]
    sources:
      - cc276
      - court17
    currency: UZS
    penalties:
      - label: Ordinary growing area, Article 270(1)
        treatment: criminal
        term: Sowing or growing
        fine_min: 11000000
        fine: 22000000
        prison: 3 years
        note: Fine, community service, corrective labour or restriction of liberty for 1–3 years
      - label: Repeat, group or medium area, Article 270(2)
        treatment: criminal
        term: Sowing or growing
        fine_min: 22000000
        fine: 44000000
        prison_min: 3 years
        prison: 5 years
        note: Fine, or restriction of liberty or imprisonment for 3–5 years
      - label: Organised or large area, Article 270(3)
        treatment: criminal
        term: Sowing or growing
        prison_min: 5 years
        prison: 10 years
  enforcement:
    text: >-
      Even small personal holdings can bring up to fifteen days of administrative detention.[@admin56]
      Above the small-quantity band, article 276 allows both non-custodial penalties and up to
      three years in prison for the basic offence; aggravated possession carries three to five
      years of restriction of liberty or imprisonment.[@cc276] The Supreme Court instructs judges
      to consider non-prison sentences for people holding drugs for themselves and for certain
      growers whose rehabilitation is possible without imprisonment.[@court17]
    sources:
      - admin56
      - cc276
      - court17
  sharing:
    text: >-
      Giving drugs away, lending them and using them to repay a debt count as supply under
      Supreme Court guidance.[@court17] Article 273 covers supply and holding with intent to
      supply. Its penalties run from a fine of up to fifty basic calculation units, community
      service or up to three years in prison in the lowest band to fifteen to twenty years for
      large quantities or organised supply across borders or through telecommunications or the
      internet.[@cc276]
    sources:
      - court17
      - cc276
    currency: UZS
    penalties:
      - label: Supply, or holding with intent to supply, Article 273(1)
        treatment: criminal
        term: Supply
        fine: 22000000
        prison: 3 years
        note: Fine, community service, corrective labour or restriction of liberty for 1–3 years
      - label: Small-amount supply, Article 273(2)
        treatment: criminal
        term: Supply
        prison_min: 3 years
        prison: 5 years
      - label: Above-small amount, Article 273(3)
        treatment: criminal
        term: Supply
        prison_min: 5 years
        prison: 7 years
      - label: Aggravated supply, Article 273(4)
        treatment: criminal
        term: Supply
        prison_min: 7 years
        prison: 10 years
      - label: Organised group, Article 273(5)
        treatment: criminal
        term: Supply
        prison_min: 10 years
        prison: 15 years
      - label: Large amount, cross-border or internet-organised, Article 273(6)
        treatment: criminal
        term: Supply
        prison_min: 15 years
        prison: 20 years
  consumption:
    text: >-
      Since 12 June 2026, public drug use is a separate administrative offence. Citizens face a
      fine of twenty to forty basic calculation units or up to fifteen days of detention, with
      confiscation. Prescribed medical use is excepted.[@admin56]
    sources:
      - admin56
    currency: UZS
    penalties:
      - label: Public use, Article 187¹
        treatment: civil
        term: Use
        fine_min: 8800000
        fine: 17600000
        prison: 15 days
        note: Confiscation; detention if a fine is insufficient; prescribed medical use excepted
  access:
    text: >-
      There is no legal source of cannabis for adults or patients.[@l813] The 1999 narcotics law
      allows controlled narcotics for medicine through licensed channels, but no cannabis-based
      medicine or patient-access programme was found.[@sputnik2019] The only cannabis production
      announced has been industrial hemp and an export-oriented medical project.[@kursiv22,azattyq2020]
    sources:
      - l813
      - sputnik2019
      - kursiv22
      - azattyq2020
context:
  recreational:
    text: >-
      Adults have no legal way to buy cannabis. A small amount for personal use is an
      administrative offence carrying a fine or up to fifteen days' detention; above 1 g of dried
      cannabis it becomes a crime with up to three years in prison, and sale carries three to
      twenty years depending on the band.[@admin56,cc276] In 2025 the authorities recorded 15,400
      drug crimes: 41% for personal possession, 36% for trafficking and 13% for cultivation.[@gazeta2026]
      No price or purity data were found.
    sources:
      - admin56
      - cc276
      - gazeta2026
  medical:
    text: >-
      No approved cannabis medicine or patient-access programme was found.[@sputnik2019] Cannabis is
      in Schedule II of the narcotics law, so a registered medicine could in principle be prescribed,
      but none exists.[@l813] A 2019 report said the sale of medical cannabis was prohibited and that
      only one state-linked company held a licence for narcotic medicines.[@sputnik2019] In November 2020 the state
      signed a project with the Maltese company Melabis to grow cannabis on 3,000 hectares in
      Sirdaryo with 0.1–0.2% THC, mainly for export; no domestic medicine or patient route
      followed in the sources read.[@azattyq2020] Medical status stays none.
    sources:
      - l813
      - sputnik2019
      - azattyq2020
  death_penalty:
    text: >-
      No cannabis offence can carry death. Uzbekistan abolished the death penalty from 1 January
      2008, and the current Criminal Code's punishment list replaces it with life imprisonment only
      for aggravated murder and terrorism; the highest cannabis supply tier is twenty years.[@zru99,cc276]
    sources:
      - zru99
      - cc276
  hemp:
    status: strict
    text: >-
      Industrial hemp may be grown only under licence, with a THC ceiling of 0.2%.[@l813] The
      first large project, RS Success Agro, received 5,000 hectares in Sirdaryo and had 3,800
      hectares under hemp at the end of 2022; its first seed harvest averaged 500 kg per hectare
      and tested at 0.09% THC.[@kursiv22] The licence fee was 3,000 basic calculation units (about
      1.32bn UZS at the 2026 rate), and police escort transports across public roads.[@kursiv22] The state has published no national area or
      harvest figure in the sources read.
    sources:
      - l813
      - kursiv22
  production:
    status: hemp
    text: >-
      The commercial cannabis route is licensed industrial hemp, not medicine or adult
      supply.[@l813,kursiv22] Article 21 of the 1999 narcotics law makes cultivation a state
      monopoly, allowing it for state scientific institutions and, since 2020, for companies with
      an industrial licence.[@l813] The Melabis project is licensed to grow low-THC cannabis for
      medical export, but no domestic product or patient programme was found.[@azattyq2020]
    sources:
      - l813
      - kursiv22
      - azattyq2020
  consequences:
    text: >-
      A diagnosis of drug dependence is entered in a mandatory register shared with law
      enforcement.[@ecoi] The register can bar dozens of occupations, including work in food
      production and education and driving a vehicle, and a diagnosis of chronic drug dependence
      can be a ground for depriving a parent of parental rights under Article 79 of the Family
      Code.[@ecoi] A small possession offence can still bring up to fifteen days' administrative
      detention.[@admin56]
    sources:
      - ecoi
      - admin56
  planting:
    seeds: grey
    seeds_trade: unclear
    clones: licensed
    clones_trade: regulated
    text: >-
      Under the 1999 narcotics law, cultivating narcotic-containing plants is a state monopoly.
      Article 21 allows it only for state institutions for scientific purposes and, since a 2020
      amendment, for companies holding a licence for industrial purposes.[@l813] The law does not
      mention seeds. Clones are plants, so only licensed growers may hold or trade them.[@l813]
    sources:
      - l813
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited.[@cc276,l813] Organising or maintaining a
      drug den is a separate offence carrying three to five years, or up to twelve with aggravating
      facts.[@cc276]
    sources:
      - cc276
      - l813
  visitors:
    status: none
    text: >-
      There is no legal recreational supply. Small personal holdings can bring a fine of one to
      two basic calculation units or up to fifteen days of administrative detention.[@admin56]
      Larger personal holdings fall under criminal article 276, with a fine or up to three years
      in prison for the basic offence. Supplying cannabis or holding it with intent to supply
      falls under article 273 and carries higher penalties in its upper bands.[@cc276]
    sources:
      - admin56
      - cc276
  driving:
    status: impairment
    text: >-
      The Code of Administrative Responsibility punishes driving in a state of alcoholic
      intoxication or under the influence of narcotic drugs, psychotropic substances or other
      substances that affect a person's mental and volitional activity.[@koao131] The penalty is a
      fine of forty base calculation units and loss of the licence for three years; a driver with
      no licence is fined fifty units or held for 15 days.[@koao131] Since February 2025 a repeat
      within a year is criminal under article 261-1, with two to three years' corrective labour or
      prison and a licence ban of up to three years.[@zru1033] The article sets no THC level.[@koao131]
    sources:
      - koao131
      - zru1033
  black_market:
    text: >-
      In 2025 the authorities recorded 15,400 drug crimes and seized 3.4 tonnes of narcotic,
      psychotropic and potent substances.[@gazeta2026] Hashish made up 48% of the seized drugs and
      opium 27%; the report gives no marijuana share.[@gazeta2026] The police found 14 underground
      drug laboratories during the year, and 53% of all drug crimes were recorded in Tashkent city,
      Tashkent region and Fergana region.[@gazeta2026] No price or purity data were found.
    sources:
      - gazeta2026
  arrests:
    text: >-
      The Supreme Court's press service reported that courts convicted almost 3,000 people of drug
      offences in the first eleven months of 2025: 2,889 is the sum of 2,875 convictions under
      article 273 and 14 under article 271.[@anhor25] Almost all, 2,875, were convicted under article
      273 of the Criminal Code, which covers handling drugs with intent to supply or supplying
      them, and 2,650 of them were sent to prison; 225 received fines, corrective labour or other
      alternatives.[@anhor25] Only 14 people were convicted under article 271, the offence of unlawfully
      taking drugs from others, 13 of whom were imprisoned.[@anhor25] In 2024 the courts convicted 3,020
      people under article 273.[@anhor25] The anti-drug agency separately reported more than 11,000
      people prosecuted for drug crimes in 2025 and 1,956 administrative drug offences.[@gazeta2026]
      The figures are not split by drug.
    sources:
      - anhor25
      - gazeta2026
  culture:
    text: >-
      Cannabis and hashish are known across Central Asia by the Russian slang
      [anasha](/culture/language/anasha/), borrowed from Uzbek and Tajik, and the atlas entry traces
      the word and its association with the wild hemp of the Chu valley.[@talkingdrugs] The Soviet
      south was the drug's main domestic source, and the plant remained part of rural life even
      while the criminal code treated its growers as offenders.[@talkingdrugs]
    sources:
      - talkingdrugs
