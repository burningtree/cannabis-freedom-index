name: Jordan
region: Asia
iso_numeric: 400
recreational: death
medical: none
updated: "2026-10-22"
summary: >-
  Cannabis remains criminal: personal plant possession can bring one to six months, a JOD200–500
  fine, or both; resin carries one to three years plus a fine. First offences leave no criminal
  precedent or security record. Separate rules cover prescription CBD products and hemp seed foods.
scores:
  possession: 0
  cultivation: 1
  enforcement: 1
  sharing: 0
  consumption: 1
  access: 0
segments:
  possession:
    text: >-
      Under the current schedules, cannabis plant material is in table 3: possession for personal
      use carries one to six months in prison, a JOD200–500 fine, or both. Cannabis resin is in
      table 1: personal possession carries one to three years and a JOD1,000–3,000 fine. A first
      offence creates no criminal precedent or security record.
    sources:
      - l23
      - schedules26
    currency: JOD
    penalties:
      - label: Personal possession of cannabis plant (table 3)
        treatment: criminal
        fine: 500
        prison_min: 1 month
        prison: 6 months
        note: One to six months, JOD200–500 fine, or both; first offence leaves no record
      - label: Personal possession of cannabis resin (table 1)
        treatment: criminal
        fine: 3000
        prison_min: 1 year
        prison: 3 years
        note: One to three years and a JOD1,000–3,000 fine
  cultivation:
    text: >-
      Growing cannabis for personal use is a separate, lesser offence from growing for trafficking.
      The current table-3 plant classification gives personal-use growing the same one-to-six-month
      prison term, JOD200–500 fine, or both as personal plant possession. Growing for trade carries
      at least fifteen years of temporary hard labour plus a fine. The law separately allows plant
      and seed handling under licences governed by regulation.
    sources:
      - l23
      - schedules26
  enforcement:
    text: >-
      Personal-use offences can lead to prison. Courts may substitute inpatient or outpatient
      treatment, and a first offence leaves no criminal precedent or security record. People who
      seek treatment themselves or through family before being caught are protected from
      prosecution.
    sources:
      - l23
  sharing:
    text: >-
      The law defines drug distribution to include giving drugs without payment. The distribution
      offence carries at least five years of temporary hard labour and at least a JOD5,000 fine,
      with higher minimums where minors are involved. Trafficking carries at least fifteen years
      plus a fine; specified international-gang cases carry mandatory death.
    sources:
      - l23
  consumption:
    text: >-
      Use and acts intended for personal use are criminal offences, with the punishment depending on
      the substance’s schedule. Courts may order treatment instead of punishment. A person who seeks
      treatment before being caught, directly or through family, is protected from prosecution.
    sources:
      - l23
      - schedules26
  access:
    text: >-
      Recreational supply remains prohibited. Separate 2023 rules provide for approval of CBD
      natural medicines and preparations containing no more than 0.3% THC, dispensed on a valid
      medical prescription, with regulatory controls on imports and exports.
    sources:
      - l23
      - cbd23
context:
  recreational:
    text: >-
      There is no legal recreational supply. Plant possession for personal use brings one to six
      months and a JOD200–500 fine; resin one to three years and JOD1,000–3,000 — but a first
      offence leaves no criminal record, courts may substitute treatment, and self-seekers are
      protected.[@l23,schedules26] Growing for trade brings at least fifteen years of hard
      labour.[@l23]
    sources:
      - l23
      - schedules26
  death_penalty:
    text: >-
      Article 20 requires death for specified aggravated trafficking offences involving
      international drug gangs or links to other international crimes. Ordinary personal use is
      dealt with separately under article 9. The international-gang death clause also appeared in
      the law replaced in 2016.
    sources:
      - l23
      - oldlaw
  production:
    status: medical
    text: >-
      Medical, scientific and industrial drug manufacture requires authorisation. Controlled plants
      and seeds are prohibited except through the licensing authority provided by the amended law.
      The 2023 CBD rules set manufacturing and raw-material requirements for medicines, external-use
      cosmetics and medical devices.
    sources:
      - l23
      - cbd23
  products:
    text: >-
      The regulator’s schedules exclude CBD-dominant oils, extracts and preparations containing no
      more than 0.3% delta-9 THC from the controlled-drug tables. The 2023 instructions separately
      require product approval and prescriptions for CBD natural medicines and preparations. They
      also regulate external-use cosmetics and devices and permit specified hemp seed foods with THC
      and CBD limits.
    sources:
      - schedules26
      - cbd23
  medical:
    text: >-
      The 2023 instructions provide approval and prescription rules for CBD natural medicines and
      preparations containing no more than 0.3% THC. Imports and exports of these medical products
      require a stamped invoice from the regulator’s controlled-substances section. Product
      classification, manufacturer approval and quality testing form part of the route.
    sources:
      - cbd23
  consequences:
    text: >-
      A first personal-use offence leaves no criminal precedent or security record, while
      prosecution and a sentence remain possible. Courts may substitute treatment; the law protects
      the identity and treatment information of people receiving it and penalises disclosure.
    sources:
      - l23
  planting:
    seeds: illegal
    seeds_trade: banned
    clones: illegal
    clones_trade: banned
    text: >-
      The amended narcotics law prohibits controlled plants and their seeds throughout growth, with
      an exception for licensed handling under regulation. Personal-use cultivation has a separate
      penalty from cultivation for trade. The 2023 food rules concern hulled, nonviable hemp seeds
      and specified seed products.
    sources:
      - l23
      - cbd23
  clubs:
    status: none
    text: >-
      Collective recreational supply falls under offences against unauthorised distribution,
      including gifts. Cultivation for trade carries at least fifteen years of temporary hard labour
      and a fine; the personal-use growing offence is separate.
    sources:
      - l23
  visitors:
    status: none
    text: >-
      Recreational supply remains prohibited. Personal cannabis plant possession carries one to six
      months, a JOD200–500 fine, or both; cannabis resin carries one to three years plus a
      JOD1,000–3,000 fine. A first offence leaves no criminal precedent or security record.
    sources:
      - l23
      - schedules26
  arrests:
    text: >-
      The annual report of the National Centre for Human Rights counted 25,776 drug cases
      of all kinds in 2025, down from 38,782 in 2024. Cases of possession and use fell by
      about 39% and trafficking offences by about 22%. The figures are not broken down by
      drug.
    sources:
      - nchr26
  black_market:
    text: >-
      Figures reported by the government to the UN drugs office record 263 kg of herbal
      cannabis seized in 2024, against 70.5 kg in 2023, and 6,243 kg of cannabis resin
      seized in 2023, against 7,313 kg in 2022. The UN publishes them as kilogram
      equivalents, and countries count seizures differently, so the figures are not
      comparable across borders.
    sources:
      - unodc_szr
  driving:
    status: impairment
    text: >-
      The amended Traffic Law No. 18 of 2023, in force from 12 September 2023, punishes
      driving under the influence of alcohol or drugs with one to three months in prison,
      a fine of 250 to 500 dinars, or both, as the judge decides; the judge may also
      confiscate the licence for two months. The law gives public security officers the
      power to test a detained driver for alcohol and drugs.
    sources:
      - roya_traffic23
      - jn_traffic23
