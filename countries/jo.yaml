  medical:
    text: No medical cannabis.
    sources:
      - wiki
  consequences:
    text: >-
      The first-offence rule protects employment prospects; later offences create a full criminal
      and security record.
    sources:
      - jl
  planting:
    seeds: illegal
    seeds_trade: banned
    clones: illegal
    clones_trade: banned
    text: >-
      Article 6 of the 2016 narcotics law bans growing, importing or exporting plants that
      yield drugs, or their seeds, at any stage of growth, and bans owning, holding, buying or
      selling them whatever the purpose. The same article allows dealing in such plants or
      seeds under a licence whose terms are set by regulation.
    sources:
      - l23
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited, and the law provides for the death
      penalty for the most serious drug offences.
    sources:
      - wiki
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. Under Article 9 of Law No. 23 of 2016,
      possession for personal use carries one to three years in prison and a fine of 1,000 to
      3,000 dinars; a first offence is not counted as a criminal precedent.
    sources:
      - jl
  arrests:
    text: >-
      The annual report of the National Centre for Human Rights counted 25,776 drug cases
      of all kinds in 2025, down from 38,782 in 2024. Cases of possession and use fell by
      about 39% and trafficking offences by about 22%. The figures are not broken down by
      drug.
    sources:
      - nchr26
  black_market:
    text: >-
      Figures reported by the government to the UN drugs office record 263 kg of herbal
      cannabis seized in 2024, against 70.5 kg in 2023, and 6,243 kg of cannabis resin
      seized in 2023, against 7,313 kg in 2022. The UN publishes them as kilogram
      equivalents, and countries count seizures differently, so the figures are not
      comparable across borders.
    sources:
      - unodc_szr
  driving:
    status: impairment
    text: >-
      The amended Traffic Law No. 18 of 2023, in force from 12 September 2023, punishes
      driving under the influence of alcohol or drugs with one to three months in prison,
      a fine of 250 to 500 dinars, or both, as the judge decides; the judge may also
      confiscate the licence for two months. The law gives public security officers the
      power to test a detained driver for alcohol and drugs.
    sources:
      - roya_traffic23
      - jn_traffic23
