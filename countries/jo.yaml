updated: '2026-10-28'
summary: >-
  Cannabis remains criminal: personal plant possession can bring one to six months, a JOD200–500
  fine, or both; resin carries one to three years plus a fine. First offences leave no criminal
  precedent or security record. Separate rules cover prescription CBD products and hemp seed foods.
