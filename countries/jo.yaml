segments:
  possession:
    text: >-
      Under Article 9 of the Narcotic Drugs and Psychotropic Substances Law No. 23 of 2016,
      possession for personal use carries one to three years in prison and a fine of 1,000 to 3,000
      dinars. A first offence is not counted as a criminal precedent or security record — a
      distinction introduced in the 2010s.
    sources:
      - cr
      - jl
  cultivation:
    text: Cultivation is a serious crime.
    sources:
      - cr
  enforcement:
    text: Prison even for first-time users, though without a lasting record.
    sources:
      - cr
      - jl
  sharing:
    text: Trafficking carries long sentences with hard labour, up to life or death in aggravated cases.
    sources:
      - wiki
      - cr
  consumption:
    text: >-
      Use is punished on the same terms as possession. People who seek treatment voluntarily before
      arrest are not prosecuted.
