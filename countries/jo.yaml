  consequences:
    text: >-
      The first-offence rule protects employment prospects; later offences create a full criminal
      and security record.
    sources:
      - jl
  planting:
    seeds: illegal
    seeds_trade: banned
    clones: illegal
    clones_trade: banned
    text: >-
      Article 6 of the 2016 narcotics law bans growing, importing or exporting plants that
      yield drugs, or their seeds, at any stage of growth, and bans owning, holding, buying or
      selling them whatever the purpose. The same article allows dealing in such plants or
      seeds under a licence whose terms are set by regulation.
    sources:
      - l23
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited, and the law provides for the death
      penalty for the most serious drug offences.
    sources:
      - cr
      - wiki
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. British travel advice says it is
      illegal to possess, use or traffic drugs, and that a conviction can bring a lengthy
      prison sentence and a heavy fine.
    sources:
      - wiki
      - fcdo
