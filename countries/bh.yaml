segments:
  possession:
    text: >-
      Law 15 of 2007 treats cannabis as a Schedule I narcotic. Possession and use are criminal
      offences carrying imprisonment and fines.
    sources:
      - cr
      - wiki
  cultivation:
    text: >-
      Cultivation is a crime; in one reported case a citizen growing plants at home and holding 767
      g of hashish received twelve months and a BD 1,000 fine.
    sources:
      - wiki
      - dt
  enforcement:
    text: Prison for possession, extreme penalties for trafficking.
    sources:
      - cr
      - dt
  sharing:
    text: >-
      Trafficking, organised smuggling or supplying minors can bring life imprisonment or the death
      penalty.
    sources:
      - cr
  consumption:
    text: Use is an offence.
    sources:
      - cr
  access:
    text: None.
    sources:
      - wiki
