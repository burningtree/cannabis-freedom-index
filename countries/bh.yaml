  consequences:
    text: Foreign nationals are deported after serving their sentence.
    sources:
      - cr
  planting:
    seeds: illegal
    seeds_trade: banned
    clones: illegal
    clones_trade: banned
    text: >-
      Law 15 of 2007 prohibits cultivating, possessing, buying or selling any listed plant, or
      dealing "with its seeds or any part of it at any stage of its growth", and defines
      cultivation to include handling seeds. Only the seeds and plant parts named in a
      separate table are exempt; that table was not in the text read.
    sources:
      - l15
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited, and the law provides for the death
      penalty for the most serious drug offences.
    sources:
      - wiki
      - dt
      - cr
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. British travel advice says illegal
      drugs are strictly forbidden, even in residual amounts, also for passengers travelling
      through the airport: using or carrying them can lead to prison and deportation, and
      buying or selling can lead to a life sentence. Skincare products and vape refills
      containing CBD oil are also banned.
    sources:
      - wiki
      - fcdo
