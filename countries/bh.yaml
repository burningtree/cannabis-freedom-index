name: Bahrain
region: Asia
iso_numeric: 48
recreational: death
medical: none
updated: '2026-10-24'
summary: Personal possession and growing are crimes; trafficking can bring death or life imprisonment.
scores:
  possession: 0
  cultivation: 0
  enforcement: 0
  sharing: 0
  consumption: 0
  access: 0
segments:
  possession:
    text: >-
      Possessing cannabis, listed plants or their seeds for personal use carries imprisonment
      and a fine up to BHD3,000.[@l15] The Penal Code’s ordinary imprisonment range is ten days
      to three years unless another range is specified.[@penal] Courts may replace punishment
      with treatment for proven addiction; the law separately protects eligible people seeking
      treatment before being caught using or prosecuted.[@l15]
    sources:
      - l15
      - penal
    currency: BHD
    penalties:
      - label: Personal-use possession of listed plants or seeds
        treatment: criminal
        term: Personal use
        prison_min: 10 days
        prison: 3 years
        fine: 3000
        note: Treatment substitution available
      - label: Possession without intent to use, consume or traffic
        treatment: criminal
        term: Other possession
        prison: 7 years
        fine: 5000
  cultivation:
    text: >-
      Growing listed plants for personal use falls under the personal-use offence: imprisonment
      and a fine up to BHD3,000. Growing for trafficking carries death or life imprisonment,
      with death mandatory in specified aggravated cases.[@l15]
    sources:
      - l15
    currency: BHD
    penalties:
      - label: Growing for personal use (article 32)
        treatment: criminal
        term: Personal growing
        prison_min: 10 days
        prison: 3 years
        fine: 3000
      - label: Growing for trade (article 30)
        treatment: criminal
        term: Trafficking
        death: true
        fine_min: 5000
        fine: 50000
        note: Death or life; death mandatory with the five aggravating facts
  enforcement:
    text: >-
      Trafficking carries death or life imprisonment, plus a BHD5,000–50,000 fine, with death
      required in specified aggravated cases.[@l15] Personal possession and growing carry
      imprisonment and a fine, with treatment alternatives for proven addiction.[@l15] The Public
      Prosecution recorded 1,629 drug-crime cases in its published statistics, and an interior
      ministry official said more than 2,000 drug-related cases were handled in the year to June
      2026; both figures cover all drugs.[@ppstats,gdn26]
    sources:
      - l15
      - ppstats
      - gdn26
  sharing:
    text: >-
      Providing cannabis for use without payment has a separate offence carrying up to seven
      years in prison and a BHD1,000–10,000 fine, with a harsher tier in specified aggravated
      cases. Providing it for payment under the corresponding offence carries at least ten
      years; trafficking under article 30 carries death or life imprisonment.[@l15]
    sources:
      - l15
    currency: BHD
    penalties:
      - label: Providing cannabis for use without payment
        treatment: criminal
        term: Supply
        prison: 7 years
        fine_min: 1000
        fine: 10000
        note: Harsher in specified aggravated cases
      - label: Paid supply, transport or managing a drug place (article 31)
        treatment: criminal
        term: Trafficking
        prison_min: 10 years
        fine_min: 3000
        fine: 30000
        note: Life with the article 31(b) aggravating facts
      - label: Trafficking (article 30)
        treatment: criminal
        term: Trafficking
        death: true
        fine_min: 5000
        fine: 50000
        note: Death or life; death mandatory with the five aggravating facts
  consumption:
    text: >-
      There is no standalone use penalty: a user is charged with possession for personal use under
      article 32(1), which carries ten days to three years and a fine of up to BHD3,000.[@l15]
      Being found in a place prepared for drug use is a separate offence under article 44.[@l15]
      Courts can substitute treatment for proven addiction. Eligible people approaching
      for treatment voluntarily, or through a spouse or relative up to the fourth degree, are
      protected from prosecution unless caught using or already prosecuted for that
      offence.[@l15]
    sources:
      - l15
  access:
    text: >-
      Recreational cannabis transactions and use are prohibited. The law provides a general
      prescription route for controlled medicines through licensed pharmacies; it separately
      prohibits prescribing or dispensing listed plants except as the law permits.[@l15]
    sources:
      - l15
context:
  recreational:
    text: >-
      There is no legal recreational supply. Possessing listed plants or seeds for personal
      use brings imprisonment and a fine of up to BHD3,000; courts may substitute treatment
      for proven addiction, and eligible voluntary treatment-seekers are protected.[@l15,penal]
      Providing cannabis without payment carries up to seven years and BHD1,000–10,000;
      trafficking brings death or life.[@l15]
    sources:
      - l15
      - penal
  death_penalty:
    text: >-
      Article 30(a) applies to trafficking in any quantity of cannabis — the plant, any part or its
      seeds — with death or life imprisonment and a BHD5,000–50,000 fine, and no quantity
      threshold.[@l15] Death is mandatory where the offender is a repeat drug offender, a drug-control
      official, uses a minor under 21, belongs to an international smuggling syndicate, or abuses
      authority or immunity.[@l15] Death sentences for hashish have been imposed since 2018, but no
      drug offender has been executed; the last execution of any kind was in 2019, and there were none
      in 2023–2025.[@wcadp,amnesty25]
    sources:
      - l15
      - wcadp
      - amnesty25
  production:
    status: none
    text: >-
      Cultivating listed cannabis plants is prohibited outside the law’s exceptions, with
      distinct penalties for personal-use growing and growing for trafficking.[@l15] Cannabis
      fibre and seeds treated so they cannot germinate are excluded from the plant
      controls.[@tables]
    sources:
      - l15
      - tables
  medical:
    text: >-
      No medical cannabis programme. The general controlled-medicine route requires medical
      prescriptions and licensed pharmacy supply, but cannabis is a listed plant and the law
      restricts prescribing or dispensing it.[@l15,tables] Article 11 allows institutional
      cultivation for medical or scientific research, not patient access.[@l15] No registered
      cannabis medicine was found.[@l15]
    sources:
      - l15
      - tables
  consequences:
    text: >-
      Courts must order confiscation of seized drugs and equipment used for the offence, subject
      to protections for innocent third parties. For a person previously convicted under the
      drug law, a court can add measures including permanent deportation of a foreign national,
      occupational restrictions or residence restrictions.[@l15]
    sources:
      - l15
  planting:
    seeds: illegal
    seeds_trade: banned
    clones: illegal
    clones_trade: banned
    text: >-
      The law restricts dealing in listed cannabis plants, their parts and seeds, and defines
      cultivation to include handling seeds.[@l15] Table 6 exempts cannabis fibre and seeds
      treated so they cannot germinate; viable cannabis seeds remain within the
      controls.[@tables]
    sources:
      - l15
      - tables
  clubs:
    status: none
    text: >-
      The law criminalises unauthorised growing, cannabis provision for use and premises
      prepared for drug consumption, leaving no lawful recreational growing-and-sharing club
      route.[@l15]
    sources:
      - l15
  visitors:
    status: none
    text: >-
      Recreational supply and personal possession remain prohibited, with imprisonment and a
      fine up to BHD3,000 for the personal-use offence. For a person previously convicted under
      the drug law, a court may add permanent deportation of a foreign national.[@l15]
    sources:
      - l15
  driving:
    status: impairment
    text: >-
      Traffic Law article 35 prohibits driving when alcohol or a drug causes loss of control or
      impaired driving ability, and separately prohibits taking these substances while driving.[@traffic2014]
      It provides six-month administrative licence withdrawal; refusal of an authorised
      examination or attempted escape brings the same withdrawal.[@traffic2014] Repetition has longer
      administrative periods.[@traffic2014] Decree-Law 30/2025 replaced article 51: ordinary drug-influence
      driving now carries two months to one year in prison and BHD1,000–2,000, or either
      penalty.[@traffic2025] Committing a further crime or traffic-rule violation through that driving
      raises this to four months to two years and BHD2,000–4,000, or either penalty; repetition within
      a year of judgment doubles the article 51 penalties.[@traffic2025] The court may additionally
      suspend the licence for up to a year under amended article 54, and new article 51 bis has
      separate fatal-collision tiers.[@traffic2025] Current specimen-specific testing standards and a numeric THC
      cutoff were not established; the older official English law should not be used for the
      2025 penalty figures.[@trafficAmendments]
    sources:
      - traffic2014
      - traffic2025
      - trafficAmendments
  hemp:
    status: none
    text: >-
      No hemp or CBD regime and no THC threshold. Schedule 6 excludes cannabis fibre and seeds
      treated so they cannot germinate from the plant controls, but growing any cannabis plant still
      needs an article 11 institutional licence.[@tables,l15] No commercial hemp sector or CBD route
      was found.[@l15]
    sources:
      - tables
      - l15
  black_market:
    text: >-
      Figures reported by the government to the UN drugs office record 91 kg of herbal cannabis
      and 106 kg of cannabis resin seized in 2024.[@unodc_szr] The large cases are resin: 350 kg in a
      sea network whose life sentence was upheld in November 2025, and more than 100 kg of marijuana
      and hashish from Iran seized in April 2026.[@nob25,gdn26b] The UN figures are kilogram
      equivalents, and countries count seizures differently, so they are not comparable across
      borders.[@unodc_szr]
    sources:
      - unodc_szr
      - nob25
      - gdn26b
  arrests:
    text: >-
      No cannabis-only arrest total is published.[@ppstats] The Public Prosecution recorded 1,629
      drug-crime cases in its statistics page, and an interior ministry official said more than
      2,000 drug-related cases were handled in the year to June 2026.[@ppstats,gdn26] Both figures
      cover all drugs. Reported cannabis cases include an Adliya indoor farm with five arrests in
      2025 and three arrests over more than 100 kg from Iran in April 2026.[@nob25,gdn26b]
    sources:
      - ppstats
      - gdn26
      - nob25
      - gdn26b
