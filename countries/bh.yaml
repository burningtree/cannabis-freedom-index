segments:
  possession:
    text: >-
      Article 32 of Law No. 15 of 2007 punishes anyone who buys, possesses or obtains a
      narcotic, or a listed plant or its seeds, for consumption or personal use with
      imprisonment and a fine of up to 3,000 dinars; no minimum or maximum term is stated in the
      article. Holding it with no intent to traffic or to use personally brings up to seven
      years and a fine of up to 5,000 dinars. Instead of the penalty for personal use a court
      may order a person proven to be addicted into a treatment facility.
    sources:
      - l15
  cultivation:
    text: >-
      Growing a listed plant for one's own consumption falls under the same Article 32 as
      possession for personal use: imprisonment and a fine of up to 3,000 dinars. Growing with
      the intention of trafficking is punished under Article 30 with death or life imprisonment.
      In one reported case a citizen growing plants at home and holding 767 g of hashish
      received twelve months and a BD 1,000 fine.
    sources:
      - l15
      - dt
  enforcement:
    text: Prison for possession, extreme penalties for trafficking.
    sources:
      - dt
  sharing:
    text: >-
      Article 30 of Law No. 15 of 2007 punishes anyone who, with the intention of trafficking,
      sells, delivers, buys or possesses a listed drug or plant, or grows, imports or exports it,
      with death or life imprisonment and a fine of 5,000 to 50,000 dinars. In listed aggravated
      circumstances the penalty is death.
    sources:
      - l15
  consumption:
    text: >-
      The law prohibits consuming a listed plant, and treats use through the personal-use
      offence of Article 32: imprisonment and a fine of up to 3,000 dinars, which the court may
      replace with treatment for a person proven to be addicted. No case is brought against
      someone who comes forward for treatment voluntarily, or whose spouse or relative asks for
      it, unless they were caught consuming. Being found in a place set up for drug use, knowing
      what it is, carries up to a year in prison.
    sources:
      - l15
  access:
    text: None.
    sources:
      - wiki
context:
  death_penalty:
    text: >-
      Article 30 of Law No. 15 of 2007 sets death or life imprisonment for producing, importing,
      growing, selling or possessing listed drugs and plants with the intention of trafficking, and
      death alone in listed aggravated circumstances.
    sources:
      - l15
  production:
