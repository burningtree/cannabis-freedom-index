segments:
  possession:
    text: >-
      Article 32 of Law No. 15 of 2007 punishes anyone who buys, possesses or obtains a
      narcotic, or a listed plant or its seeds, for consumption or personal use with
      imprisonment and a fine of up to 3,000 dinars; no minimum or maximum term is stated in the
      article. Holding it with no intent to traffic or to use personally brings up to seven
      years and a fine of up to 5,000 dinars. Instead of the penalty for personal use a court
      may order a person proven to be addicted into a treatment facility.
    sources:
      - l15
  cultivation:
    text: >-
      Growing a listed plant for one's own consumption falls under the same Article 32 as
      possession for personal use: imprisonment and a fine of up to 3,000 dinars. Growing with
      the intention of trafficking is punished under Article 30 with death or life imprisonment.
      In one reported case a citizen growing plants at home and holding 767 g of hashish
      received twelve months and a BD 1,000 fine.
    sources:
      - l15
      - dt
  enforcement:
    text: Prison for possession, extreme penalties for trafficking.
    sources:
      - dt
  sharing:
    text: >-
      Article 30 of Law No. 15 of 2007 punishes anyone who, with the intention of trafficking,
      sells, delivers, buys or possesses a listed drug or plant, or grows, imports or exports it,
      with death or life imprisonment and a fine of 5,000 to 50,000 dinars. In listed aggravated
      circumstances the penalty is death.
    sources:
      - l15
  consumption:
    text: >-
      The law prohibits consuming a listed plant, and treats use through the personal-use
      offence of Article 32: imprisonment and a fine of up to 3,000 dinars, which the court may
      replace with treatment for a person proven to be addicted. No case is brought against
      someone who comes forward for treatment voluntarily, or whose spouse or relative asks for
      it, unless they were caught consuming. Being found in a place set up for drug use, knowing
      what it is, carries up to a year in prison.
    sources:
      - l15
  access:
    text: None.
    sources:
      - wiki
context:
  death_penalty:
    text: >-
      Article 30 of Law No. 15 of 2007 sets death or life imprisonment for producing, importing,
      growing, selling or possessing listed drugs and plants with the intention of trafficking, and
      death alone in listed aggravated circumstances.
    sources:
      - l15
  production:
    text: None.
    sources:
      - wiki
  products:
    text: Reliable national information about legally available cannabis products was not established by the retained sources.
    sources: []
  medical:
    text: No medical cannabis.
    sources:
      - wiki
  consequences:
    text: The retained sources do not establish collateral consequences beyond the penalties described above.
    sources: []
  planting:
    seeds: illegal
    seeds_trade: banned
    clones: illegal
    clones_trade: banned
    text: >-
      Law 15 of 2007 prohibits cultivating, possessing, buying or selling any listed plant, or
      dealing "with its seeds or any part of it at any stage of its growth", and defines
      cultivation to include handling seeds. Only the seeds and plant parts named in a
      separate table are exempt; that table was not in the text read.
    sources:
      - l15
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited, and the law provides for the death
      penalty for the most serious drug offences.
    sources:
      - wiki
      - dt
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. Possession for personal use brings
      imprisonment and a fine of up to 3,000 dinars under Article 32, and a court may add
      permanent deportation of a foreigner as a measure on top of the penalty where the person
      has a previous conviction under the law.
    sources:
      - l15
  driving:
    status: impairment
    text: >-
      Traffic Law article 35 prohibits driving when alcohol or a drug causes loss of control or
      impaired driving ability, and separately prohibits taking these substances while driving. It
      provides six-month administrative licence withdrawal; refusal of an authorised examination or
      attempted escape brings the same withdrawal. Repetition has longer administrative periods.
      Decree-Law 30/2025 replaced article 51: ordinary drug-influence driving now carries two months
      to one year in prison and BHD1,000–2,000, or either penalty. Committing a further crime or
      traffic-rule violation through that driving raises this to four months to two years and
      BHD2,000–4,000, or either penalty; repetition within a year of judgment doubles the article 51
      penalties. The court may additionally suspend the licence for up to a year under amended article
      54. New article 51 bis has separate fatal-collision tiers. Current specimen-specific testing
      standards and a numeric THC cutoff were not established; the older official English law should
      not be used for the 2025 penalty figures.
    sources:
      - traffic2014
      - traffic2025
      - trafficAmendments
  black_market:
    text: >-
      Figures reported by the government to the UN drugs office record 90.8 kg of herbal
      cannabis seized in 2024, and 106 kg of cannabis resin seized in 2024. The UN
      publishes them as kilogram equivalents, and countries count seizures differently, so
      the figures are not comparable across borders.
    sources:
      - unodc_szr
