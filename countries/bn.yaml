name: Brunei
region: Asia
iso_numeric: 96
recreational: death
medical: none
updated: "2026-10-29"
summary: >-
  Severe penalties include prison and, for specified trafficking offences, caning or a mandatory
  death sentence. Death sentences are imposed but no execution is known since 1957. Simple
  possession and consumption carry up to ten years; cultivation three to twenty years.
