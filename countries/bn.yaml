  medical:
    text: No medical cannabis.
    sources:
      - wiki
  consequences:
    text: Foreigners are deported after sentence; users face supervision orders.
    sources:
      - trip
  planting:
    seeds: illegal
    seeds_trade: banned
    clones: illegal
    clones_trade: banned
    text: >-
      The Misuse of Drugs Act defines cannabis as any plant of the genus "or any part of such
      plant, by whatever name it is called", with no exception for seed, and section 8 makes
      it an offence to cultivate any plant of the genus cannabis.
    sources:
      - mda
