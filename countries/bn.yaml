segments:
  possession:
    text: >-
      Section 6(a) prohibits unauthorised possession of cannabis, a Class A controlled drug, with up
      to ten years in prison and a B$20,000 fine on a first conviction and a minimum of two years on
      a second or later conviction; the row does not provide caning.[@mda] Section 15 presumes
      trafficking above 15 g of cannabis or 10 g of resin unless the contrary is proved.[@mda] The
      separate death-penalty quantity is above 500 g for trafficking, not the presumption
      threshold.[@mda]
    sources:
      - mda
    currency: BND
    penalties:
      - label: Any amount, first conviction
        treatment: criminal
        term: Possession
        prison: 10 years
        fine: 20000
        note: No caning; above 15 g cannabis or 10 g resin trafficking is presumed
      - label: Second or later conviction
        treatment: criminal
        term: Possession
        prison_min: 2 years
        prison: 10 years
        fine: 20000
        note: Minimum two years under section 6; no caning
  cultivation:
    text: >-
      Section 8 prohibits cultivating any plant of the genus Cannabis.[@mda] The Second Schedule
      provides three to twenty years and a B$5,000–40,000 fine, or both, and does not prescribe
      caning.[@mda]
    sources:
      - mda
    currency: BND
    penalties:
      - label: Cultivation, Section 8
        treatment: criminal
        term: Cultivation
        prison_min: 3 years
        prison: 20 years
        fine_min: 5000
        fine: 40000
        note: No caning in this row
  enforcement:
    text: >-
      Severe statutory penalties apply, including caning for trafficking, import and export and
      manufacture, but not for simple possession, consumption or cultivation.[@mda] Police recorded
      777 drug arrests in 2024, up from 711 in 2023, while methamphetamine seizures rose above 40 kg
      and cannabis seizures fell to 2.6 kg from 6.3 kg.[@xinhua24,unodc_szr] Death sentences are
      still imposed: the last known one was in 2017, and no execution is known since
      1957.[@hoc,oxford26]
    sources:
      - mda
      - xinhua24
      - unodc_szr
      - hoc
      - oxford26
  sharing:
    text: >-
      Giving or distributing cannabis is trafficking under the Act.[@mda] For plant material, less
      than 330 g brings five to twenty years and five to fifteen strokes; 330–500 g brings twenty to
      thirty years and fifteen strokes; more than 500 g carries mandatory death.[@mda] Resin uses
      130 g and 200 g for those bands.[@mda] Import and export use the same product thresholds, with
      five to thirty years in the lowest band.[@mda] Possession for trafficking is a separate
      offence: its intermediate band is 400–600 g of plant material or 200–300 g of resin, with
      death above those upper limits.[@mda]
    sources:
      - mda
    currency: BND
    penalties:
      - label: "Trafficking, plant material: less than 330 g"
        treatment: criminal
        term: Trafficking
        prison_min: 5 years
        prison: 20 years
        caning:
          - 5
          - 15
      - label: "Trafficking, plant material: 330–500 g"
        treatment: criminal
        term: Trafficking
        prison_min: 20 years
        prison: 30 years
        caning:
          - 15
          - 15
      - label: "Trafficking, plant material: more than 500 g"
        treatment: criminal
        term: Trafficking
        death: true
        note: Mandatory death sentence
      - label: "Trafficking, resin: less than 130 g"
        treatment: criminal
        term: Trafficking
        prison_min: 5 years
        prison: 20 years
        caning:
          - 5
          - 15
      - label: "Trafficking, resin: 130–200 g"
        treatment: criminal
        term: Trafficking
        prison_min: 20 years
        prison: 30 years
        caning:
          - 15
          - 15
      - label: "Trafficking, resin: more than 200 g"
        treatment: criminal
        term: Trafficking
        death: true
        note: Mandatory death sentence
      - label: "Import or export, plant material: less than 330 g"
        treatment: criminal
        term: Import or export
        prison_min: 5 years
        prison: 30 years
        caning:
          - 5
          - 15
      - label: "Import or export, plant material: 330–500 g"
        treatment: criminal
        term: Import or export
        prison_min: 20 years
        prison: 30 years
        caning:
          - 15
          - 15
      - label: "Import or export, plant material: more than 500 g"
        treatment: criminal
        term: Import or export
        death: true
        note: Mandatory death sentence
      - label: "Import or export, resin: less than 130 g"
        treatment: criminal
        term: Import or export
