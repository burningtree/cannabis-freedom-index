  consumption:
    text: >-
      Consumption is itself an offence under section 6(b), proved by urine test, with up to ten
      years and a B$20,000 fine on a first conviction and a minimum of three years on a second or
      later conviction; the row does not provide caning.[@mda]
    sources:
      - mda
    currency: BND
    penalties:
      - label: Consumption, first conviction
        treatment: criminal
        term: Consumption
        prison: 10 years
        fine: 20000
        note: No caning
      - label: Second or later conviction
        treatment: criminal
        term: Consumption
        prison_min: 3 years
        prison: 10 years
        fine: 20000
        note: Minimum three years under section 6; no caning
  access:
    text: >-
      None. Possession and consumption are offences, and no patient, CBD or hemp consumer route was
      verified.[@mda] The Misuse of Drugs Regulations let medical and dental officers prescribe
      controlled drugs in the course of duty, but no approved cannabis medicine or patient programme
      exists.[@regs]
    sources:
      - mda
      - regs
context:
  recreational:
    text: >-
      All recreational use is prohibited: consumption itself is an offence proved by urine test,
      cultivation starts at three years, and trafficking over 500 g carries a mandatory death
      sentence that is imposed but not carried out.[@mda,hoc]
    sources:
      - mda
      - hoc
  death_penalty:
    text: >-
      Trafficking more than 500 g of cannabis or 200 g of resin carries a mandatory death sentence,
      as does possession for trafficking above 600 g or 300 g of resin.[@mda] Death sentences are
      still imposed but not carried out: the last known execution was in 1957 and the last known
      death sentence in 2017.[@hoc,oxford26]
    sources:
      - mda
      - hoc
      - oxford26
  production:
    status: none
    text: >-
      No lawful cannabis production. Section 8 prohibits cultivating any plant of the genus
      Cannabis, starting at three years and B$5,000.[@mda]
    sources:
      - mda
  medical:
    text: >-
      No medical cannabis programme. Cannabis is Class A; the regulations allow medical and dental
      officers to prescribe controlled drugs in the course of duty, but no approved cannabis
      medicine or patient route was found.[@mda,regs]
    sources:
      - mda
      - regs
  hemp:
    status: none
    text: >-
      No legal hemp category or THC threshold. The Misuse of Drugs Act defines cannabis as any plant
      of the genus or any part of it, with no exception for fibre, seed or low-THC varieties, and
      section 8 bans cultivation.[@mda] Cannabidiol is not named in the schedules, but
      cannabis-derived products are likely caught; no legal retail CBD market was found.[@mda]
    sources:
      - mda
  consequences:
    text: >-
      Section 24 allows forfeiture of drugs and articles connected with an offence, including where
      nobody has been convicted, subject to its notice and claim procedures.[@mda]
    sources:
      - mda
  planting:
    seeds: illegal
    seeds_trade: banned
    clones: illegal
    clones_trade: banned
    text: >-
      The Misuse of Drugs Act defines cannabis as any plant of the genus "or any part of such plant,
      by whatever name it is called", with no exception for seed, and section 8 makes it an offence
      to cultivate any plant of the genus cannabis.[@mda]
    sources:
      - mda
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited, and the law provides for the death penalty
      for the most serious trafficking offences.[@mda,hoc]
    sources:
      - mda
      - hoc
  visitors:
    status: none
    text: >-
      There is no legal recreational supply.[@mda] Importing or exporting more than 500 g of
      cannabis plant material or more than 200 g of resin carries mandatory death; 330–500 g of
      plant material or 130–200 g of resin carries twenty to thirty years and fifteen strokes.[@mda]
      Smaller imports carry five to thirty years and five to fifteen strokes.[@mda]
    sources:
      - mda
  driving:
    status: impairment
    text: >-
      Road Traffic Act section 26 covers driving, attempting to drive or being in charge on a road
      or public place while drug influence makes proper vehicle control impossible; a first
      conviction brings a B$10,000 fine and two years in prison, and a repeat B$20,000 and four
      years.[@traffic2026] The court normally orders at least three years' licence disqualification,
      starting on conviction or release, and may depart for stated special reasons.[@traffic2026]
      Where the offence causes death or serious injury, section 26A allows suspension on charge, and
      section 26G allows a blood specimen after specified crashes.[@traffic2026] There is no
      numerical THC limit; the concentration limit in section 26 concerns alcohol.[@traffic2026]
    sources:
      - traffic2026
  black_market:
    text: >-
      UNODC records 2.6 kg of herbal cannabis seized in 2024, against 6.3 kg in 2023.[@unodc_szr] In
      June 2025 five Bruneian men were arrested for carrying 68 kg of cannabis to Europe via third
      countries; in January 2026 a court kept a man charged with importing 499.89 g in custody
      because the amount fell just below the 500 g death threshold but still carried twenty to
      thirty years and fifteen strokes.[@star25,judiciary26] No cannabis-specific arrest series is
      published.[@xinhua24]
    sources:
      - unodc_szr
      - star25
      - judiciary26
      - xinhua24
  arrests:
    text: >-
      Police recorded 777 drug arrests in 2024, up from 711 in 2023; 641 were men, 136 women, and
      645 were locals.[@xinhua24] The figures cover all drugs, and no cannabis-specific arrest count
      was published.[@xinhua24] Methamphetamine dominated seizures, with over 40 kg against just 2.6
      kg of herbal cannabis.[@bruneitribune24]
    sources:
      - xinhua24
      - bruneitribune24
