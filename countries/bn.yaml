name: Brunei
region: Asia
iso_numeric: 96
recreational: death
medical: none
updated: 2026-10-15T00:00:00.000Z
summary: >-
  Severe penalties include prison and, for specified trafficking offences, caning or a mandatory
  death sentence. Death sentences are imposed but have not been carried out in decades.
scores:
  possession: 0
  cultivation: 0
  enforcement: 0
  sharing: 0
  consumption: 0
  access: 0
segments:
  possession:
    text: >-
      Section 6(a) prohibits unauthorised possession. In the reviewed 2013 consolidation, section 15
      presumes trafficking above 15 g of cannabis unless rebutted. The separate death-penalty
      quantity is above 500 g for specified trafficking offences; it is not the presumption
      threshold.
    sources:
      - mda
  cultivation:
    text: >-
      Section 8 prohibits cannabis cultivation. The reviewed Second Schedule provides up to 20
      years, B$40,000, or both, with stated minimums of three years, B$5,000, or both. That row does
      not prescribe caning.
    sources:
      - mda
    currency: BND
    penalties:
      - label: Cultivation, Section 8
        treatment: criminal
        prison_min: 3 years
        prison: 20 years
        fine: 40000
        note: Three years to twenty years and B$5,000–40,000; no caning in this row
  enforcement:
    text: >-
      Severe statutory penalties apply, including caning for specified trafficking offences. Death
      sentences are reported as imposed but not carried out. The possession and cultivation rows
      reviewed do not support a blanket claim of mandatory caning for any quantity.
    sources:
      - hoc
      - mda
  sharing:
    text: >-
      Giving or distributing cannabis falls within trafficking. Specified quantities attract the
      mandatory death penalty; the reviewed statutory threshold for cannabis is more than 500 g.
      Brunei has not carried out executions in decades.
    sources:
      - hoc
      - mda
    penalties:
      - label: Trafficking over 500 g
        treatment: criminal
        death: true
        note: Mandatory death sentence on the statute book; imposed but not carried out in decades
  consumption:
    text: Consumption is itself an offence, proved by urine test.
    sources:
      - mda
  access:
    text: 'None: the Misuse of Drugs Act makes consumption itself an offence, proved by urine test.'
    sources:
      - mda
context:
  recreational:
    text: >-
      All recreational use is prohibited: consumption itself is an offence proved by urine test,
      cultivation starts at three years, and trafficking over 500 g carries a mandatory death
      sentence that is imposed but not carried out.[@mda,hoc,wiki]
    sources:
      - mda
      - hoc
      - wiki
  death_penalty:
    text: >-
      Trafficking carries a mandatory death sentence on the statute book. Death sentences are
      imposed but not carried out: Brunei has not executed anyone in decades.
    sources:
      - hoc
      - wiki
  production:
    status: none
    text: >-
      No lawful cannabis production. Section 8 prohibits cultivating any plant of the genus
      cannabis, starting at three years and B$5,000.[@mda]
    sources:
      - mda
  medical:
    text: No medical cannabis.
    sources:
      - wiki
  consequences:
    text: >-
      Section 24 allows forfeiture of drugs and articles connected with an offence, including where
      nobody has been convicted, subject to its notice and claim procedures.
    sources:
      - mda
  planting:
    seeds: illegal
    seeds_trade: banned
    clones: illegal
    clones_trade: banned
    text: >-
      The Misuse of Drugs Act defines cannabis as any plant of the genus "or any part of such plant,
      by whatever name it is called", with no exception for seed, and section 8 makes it an offence
      to cultivate any plant of the genus cannabis.
    sources:
      - mda
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited, and the law provides for the death penalty
      for the most serious drug offences.
    sources:
      - wiki
      - hoc
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. British travel advice warns of severe
      penalties for drug offences including, in some cases, the death penalty, with caning and long
      prison sentences for other crimes.
    sources:
      - wiki
      - fcdo
  driving:
    status: impairment
    text: >-
      Road Traffic Act section 26 covers driving, attempting to drive or being in charge on a road
      or public place while drug influence makes proper vehicle control impossible. The 2026 revised
      text provides a B$10,000 fine and two years' imprisonment for a first conviction, and B$20,000
      and four years for a repeat conviction. The court normally orders at least three years'
      licence disqualification, starting on conviction or, if imprisoned, on release; it can depart
      for stated special reasons. Where the offence causes death or serious injury, section 26A
      allows licence suspension on charge until the court decides the case. Section 26G permits
      analysis of blood taken for treatment after specified crashes when the person cannot provide
      breath or consent to blood sampling, on the Police Commissioner's direction. The concentration
      limit in section 26 concerns alcohol; no numerical THC limit is given there.
    sources:
      - traffic2026
  black_market:
    text: >-
      Figures reported by the government to the UN drugs office record 2.6 kg of herbal cannabis
      seized in 2024, against 6.3 kg in 2023. The UN publishes them as kilogram equivalents, and
      countries count seizures differently, so the figures are not comparable across borders.
    sources:
      - unodc_szr
