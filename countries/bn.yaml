segments:
  possession:
    text: >-
      Illegal under the Misuse of Drugs Act with no exemptions. Possession of any amount means a
      long prison sentence plus caning; possessing more than 500 g is treated as trafficking.
    sources:
      - wiki
      - trip
  cultivation:
    text: Cultivation is a serious offence with prison and caning.
    sources:
      - wiki
  enforcement:
    text: >-
      Prison and caning for any quantity; death sentences for trafficking are imposed but not
      carried out.
    sources:
      - hoc
      - trip
  sharing:
    text: >-
      Trafficking carries the mandatory death penalty on the statute book. Brunei has not carried
      out an execution in decades.
    sources:
      - hoc
      - wiki
  consumption:
    text: Consumption is itself an offence, proved by urine test.
    sources:
      - trip
  access:
    text: None.
    sources:
      - wiki
context:
  death_penalty:
    text: >-
      Trafficking carries a mandatory death sentence on the statute book. Death sentences are
      imposed but not carried out: Brunei has not executed anyone in decades.
    sources:
      - hoc
      - wiki
      - trip
  production:
    text: None.
