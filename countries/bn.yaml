segments:
  possession:
    text: >-
      Illegal under the Misuse of Drugs Act with no exemptions. Possession of any amount means a
      long prison sentence plus caning; possessing more than 500 g is treated as trafficking.
    sources:
      - wiki
  cultivation:
    text: Cultivation is a serious offence with prison and caning.
    sources:
      - wiki
  enforcement:
    text: >-
      Prison and caning for any quantity; death sentences for trafficking are imposed but not
      carried out.
    sources:
      - hoc
  sharing:
    text: >-
      Trafficking carries the mandatory death penalty on the statute book. Brunei has not carried
      out an execution in decades.
    sources:
      - hoc
      - wiki
  consumption:
    text: Consumption is itself an offence, proved by urine test.
    sources:
      - mda
  access:
    text: >-
      None: the Misuse of Drugs Act makes consumption itself an offence, proved by urine test.
    sources:
      - mda
context:
  death_penalty:
    text: >-
      Trafficking carries a mandatory death sentence on the statute book. Death sentences are
      imposed but not carried out: Brunei has not executed anyone in decades.
    sources:
      - hoc
      - wiki
  production:
    text: None.
    sources:
      - wiki
  products:
    text: None.
    sources:
      - wiki
  medical:
    text: No medical cannabis.
    sources:
      - wiki
  consequences:
    text: The retained sources do not establish collateral consequences beyond the penalties described above.
    sources: []
  planting:
    seeds: illegal
    seeds_trade: banned
    clones: illegal
    clones_trade: banned
    text: >-
      The Misuse of Drugs Act defines cannabis as any plant of the genus "or any part of such
      plant, by whatever name it is called", with no exception for seed, and section 8 makes
      it an offence to cultivate any plant of the genus cannabis.
    sources:
      - mda
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited, and the law provides for the death
      penalty for the most serious drug offences.
    sources:
      - wiki
      - hoc
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. British travel advice warns of severe
      penalties for drug offences including, in some cases, the death penalty, with caning and
      long prison sentences for other crimes.
    sources:
      - wiki
      - fcdo
  driving:
    status: impairment
    text: >-
      Road Traffic Act section 26 covers driving, attempting to drive or being in charge
      on a road or public place while drug influence makes proper vehicle control impossible.
      The 2026 revised text provides a B$10,000 fine and two years' imprisonment for a first
      conviction, and B$20,000 and four years for a repeat conviction. The court normally
      orders at least three years' licence disqualification, starting on conviction or,
      if imprisoned, on release; it can depart for stated special reasons. Where the
      offence causes death or serious injury, section 26A allows licence suspension on
      charge until the court decides the case. Section 26G permits analysis of blood taken
      for treatment after specified crashes when the person cannot provide breath or consent
      to blood sampling, on the Police Commissioner's direction. The concentration limit
      in section 26 concerns alcohol; no numerical THC limit is given there.
    sources:
      - traffic2026
  black_market:
    text: >-
      Figures reported by the government to the UN drugs office record 2.6 kg of herbal
      cannabis seized in 2024, against 6.3 kg in 2023. The UN publishes them as kilogram
      equivalents, and countries count seizures differently, so the figures are not
      comparable across borders.
    sources:
      - unodc_szr
