    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited.
    sources:
      - gi
  black_market:
    text: >-
      Cannabis, called rongony, is grown on a large scale for the home market and for
      neighbouring islands. A 2021 study estimated that the commune of Antsahabe alone produces
      at least 200 tonnes a year, and surveys in mid-2020 found a gram costing about three US
      cents, the lowest price in the Indian Ocean islands. A farmer was paid about 20,000 ariary
      for a kilogram, close to the price of cocoa, while a dealer selling to consumers earned
      100,000 to 150,000. The gendarmerie seized close to 53 tonnes in 2020. Officers describe
      armed traffickers in the growing areas, and policing is thin: about one gendarme for 4,000
      rural residents.
    sources:
      - gitoc
