segments:
  possession:
    text: >-
      Cannabis (rongony) is controlled by Law 97-039 of 1997. Possession of a small quantity for
      personal consumption carries two to six months in prison for plant material, three months to a
      year for stronger preparations; larger amounts fall under a general provision with two to ten
      years.
    sources:
      - law
  cultivation:
    text: >-
      Cultivation is punished under the production provisions with five to twenty years, yet rongony
      is grown on a large scale in the north and south and is one of the island's biggest illicit
      crops.
    sources:
      - gi
  enforcement:
    text: >-
      Short prison terms for users; a large domestic market persists, sustained by corruption and
      weak enforcement in growing regions.
    sources:
      - gi
  sharing:
    text: Trafficking carries five to twenty years.
    sources:
      - law
  consumption:
    text: Use is punished alongside possession.
    sources:
      - law
  access:
    text: None.
    sources:
      - law
