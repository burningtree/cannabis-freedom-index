name: Madagascar
region: Africa
iso_numeric: 450
recreational: illegal
medical: none
updated: 2026-10-21
summary: >-
  Small personal quantities of cannabis preparations other than oil can bring two to six months,
  a fine, or both; rongony is nonetheless grown on a large scale.
scores:
  possession: 1
  cultivation: 1
  enforcement: 1
  sharing: 1
  consumption: 1
  access: 0
segments:
  possession:
    text: >-
      Article 141 of Law 97-039 sets two to six months in prison, a fine, or both for small personal
      quantities of cannabis derivatives other than oil. Cannabis oil falls under a three-month
      to one-year range, also with a fine alternative. The general trafficking provisions can
      apply to holdings outside the small-personal-quantity rule and allow forced labour or a fine.
    sources:
      - law
  cultivation:
    text: >-
      Cultivation is prohibited and landholders must destroy cannabis crops. The general production
      offence allows forced labour, a fine, or both; Article 141 separately covers growing a small
      quantity for personal consumption. Rongony is grown on a large scale in the north and south.
    sources:
      - law
      - gi
  enforcement:
    text: >-
      Small-personal-quantity offences allow a fine instead of imprisonment. GI-TOC fieldwork
      describes a large domestic market and difficulties policing remote growing regions.
    sources:
      - law
      - gi
  sharing:
    text: >-
      General trafficking offences allow forced labour, a fine, or both. Offering or giving
      high-risk drugs directly for another person's consumption has a separate one-to-five-year
      prison range, a fine, or both under Article 99.
    sources:
      - law
  consumption:
    text: Use is punished alongside possession.
    sources:
      - law
  access:
    text: None.
    sources:
      - law
context:
  recreational:
    text: >-
      There is no legal recreational market. Rongony is grown on a large scale in the north and
      south and sold in a large domestic market that is hard to police in remote growing
      regions.[@gi] Holding a small personal quantity can end in a fine instead of
      prison.[@law]
    sources:
      - gi
      - law
  production:
    text: Reliable national information about lawful cannabis production was not established by the retained sources.
    sources: []
  products:
    text: Reliable national information about legally available cannabis products was not established by the retained sources.
    sources: []
  medical:
    text: The retained sources do not establish whether a medical cannabis programme operates.
    sources: []
  consequences:
    text: The retained sources do not establish collateral consequences beyond the penalties described above.
    sources: []
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited.
    sources:
      - gi
  black_market:
    text: >-
      Cannabis, called rongony, is grown on a large scale for the home market and for
      neighbouring islands. A 2021 study estimated that the commune of Antsahabe alone produces
      at least 200 tonnes a year, and surveys in mid-2020 found a gram costing about three US
      cents, the lowest price in the Indian Ocean islands. A farmer was paid about 20,000 ariary
      for a kilogram, close to the price of cocoa, while a dealer selling to consumers earned
      100,000 to 150,000. The gendarmerie seized close to 53 tonnes in 2020. Officers describe
      armed traffickers in the growing areas, and policing is thin: about one gendarme for 4,000
      rural residents.
    sources:
      - gitoc
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. Small personal quantities of non-oil
      cannabis derivatives can bring two to six months in prison, a fine, or both; cannabis oil
      has a three-month to one-year range with the same alternatives.
    sources:
      - law
