name: Madagascar
region: Africa
iso_numeric: 450
recreational: illegal
medical: none
updated: 2026-10-21
summary: >-
  Small personal quantities of cannabis preparations other than oil can bring two to six months,
  a fine, or both; rongony is nonetheless grown on a large scale.
scores:
  possession: 1
  cultivation: 1
  enforcement: 1
  sharing: 1
  consumption: 1
  access: 0
segments:
  possession:
    text: >-
      Article 141 of Law 97-039 sets two to six months in prison, a fine of FMG 10,000 to
      250,000, or both for small personal quantities of cannabis derivatives other than oil.
      Cannabis oil falls under a three-month to one-year range, with the same fine alternative.
      The general trafficking provisions can apply to holdings outside the small-personal-quantity
      rule and allow forced labour or a fine.
    sources:
      - law
    currency: MGA
    penalties:
      - label: Small personal quantity, non-oil derivatives
        treatment: criminal
        prison_min: 2 months
        prison: 6 months
        fine: 50000
        note: Up to 50,000 ariary; the law states FMG 10,000–250,000 (5 FMG = 1 ariary); prison, fine, or both
      - label: Small personal quantity, cannabis oil
        treatment: criminal
        prison_min: 3 months
        prison: 1 year
        fine: 50000
        note: Law states FMG 10,000–250,000; prison, fine, or both
  cultivation:
    text: >-
      Cultivation is prohibited and landholders must destroy cannabis crops. The general production
      offence allows forced labour, a fine, or both; Article 141 separately covers growing a small
      quantity for personal consumption. Rongony is grown on a large scale in the north and south.
    sources:
      - law
      - gi
    currency: MGA
    penalties:
      - label: Culture or production of high-risk drugs (Article 95)
        treatment: criminal
        fine: 1000000
        note: Forced labour and/or a fine; the law states FMG 50,000–5,000,000; small personal growing falls under Article 141
  enforcement:
    text: >-
      Small-personal-quantity offences allow a fine instead of imprisonment. GI-TOC fieldwork
      describes a large domestic market and difficulties policing remote growing regions.
    sources:
      - law
      - gi
  sharing:
    text: >-
      General trafficking offences allow forced labour, a fine, or both. Offering or giving
      high-risk drugs directly for another person's consumption has a separate one-to-five-year
      prison range and a fine of FMG 10,000 to 1,000,000, or both, under Article 99, doubled in
      Article 108 cases such as organised gangs or supply to minors.
    sources:
      - law
    currency: MGA
    penalties:
      - label: Offering or giving drugs for another person's consumption (Article 99)
        treatment: criminal
        prison_min: 1 year
        prison: 5 years
        fine: 200000
        note: Up to 200,000 ariary; the law states FMG 10,000–1,000,000; doubled in Article 108 cases
  consumption:
    text: Use is punished alongside possession.
    sources:
      - law
  access:
    text: None.
    sources:
      - law
context_not_applicable:
  death_penalty:
    text: >-
      Madagascar abolished the death penalty, voted by the National Assembly in December 2014
      and promulgated in January 2015; no cannabis offence carries a capital sentence.[@amn15]
    sources: [amn15]
context:
  recreational:
    text: >-
      There is no legal recreational market. Rongony is grown on a large scale in the north and
      south and sold in a large domestic market that is hard to police in remote growing
      regions.[@gi] Holding a small personal quantity can end in a fine instead of
      prison.[@law]
    sources:
      - gi
      - law
  production:
    status: none
    text: No licensed production. The law punishes growing or producing high-risk drugs with forced labour, a fine, or both.
    sources:
      - law
  medical:
    text: >-
      No patient programme is documented. The law bans drug use outside medical prescription
      but sets up no route for patients to obtain cannabis.[@law]
    sources:
      - law
  consequences:
    text: >-
      Conviction brings mandatory confiscation of seized plants and substances, equipment used
      for the offence and its proceeds; drugs found on an illicit user are seized and confiscated
      even without prosecution.[@law]
    sources:
      - law
  culture:
    text: >-
      Cannabis has been grown and used long enough to carry its own Malagasy name, rongony:
      the 1997 law still repeals the 1960 ordinance on the consumption of *chanvre indien dit
      rongony*.[@law] It was already prohibited under the Merina kingdom in
      [1787](/history/madagascar-merina-ban-1787/).[@molet]
    sources:
      - law
      - molet
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited.
    sources:
      - gi
  black_market:
    text: >-
      Cannabis, called rongony, is grown on a large scale for the home market and for
      neighbouring islands. A 2021 study estimated that the commune of Antsahabe alone produces
      at least 200 tonnes a year, and surveys in mid-2020 found a gram costing about three US
      cents, the lowest price in the Indian Ocean islands. A farmer was paid about 20,000 ariary
      for a kilogram, close to the price of cocoa, while a dealer selling to consumers earned
      100,000 to 150,000. The gendarmerie seized close to 53 tonnes in 2020. Officers describe
      armed traffickers in the growing areas, and policing is thin: about one gendarme for 4,000
      rural residents.
    sources:
      - gitoc
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. Small personal quantities of non-oil
      cannabis derivatives can bring two to six months in prison, a fine, or both; cannabis oil
      has a three-month to one-year range with the same alternatives.
    sources:
      - law
