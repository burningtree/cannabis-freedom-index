name: Albania
region: Europe
iso_numeric: 8
recreational: illegal
medical: none
updated: "2026-10-27"
summary: >-
  A 2023 law legalised licensed cultivation for medical and industrial purposes, largely for export.
  Personal use remains illegal.
scores:
  possession: 2
  cultivation: 1
  enforcement: 2
  sharing: 1
  consumption: 1
  access: 0
segments:
  possession:
    text: >-
      Possession is an offence under the Criminal Code, but the Code has long exempted a small
      single dose held for personal use, assessed case by case rather than by a fixed gram limit.
      Anything more is prosecuted, with prison terms of several years.
    sources:
      - shteg
  cultivation:
    text: >-
      Unlicensed cultivation is a serious crime — Albania spent years eradicating large illegal
      plantations. Since July 2023 companies can be licensed to grow for medical and industrial
      purposes.
    sources:
      - kp
      - shteg
  enforcement:
    text: >-
      The personal-dose exemption protects users in principle; growers and dealers face long
      sentences, and policing remains heavy after years of anti-cultivation campaigns.
    sources:
      - shteg
  sharing:
    text: Supply is trafficking.
    sources:
      - shteg
  consumption:
    text: Use is not separately punished where only a personal dose is involved.
    sources:
      - shteg
  access:
    text: No legal source for consumers; the 2023 law is aimed at export.
    sources:
      - kp
      - mjb
context:
  production:
    text: >-
      The law passed on 21 July 2023 creates a national cannabis agency that grants 15-year
      renewable licences to cultivate and process cannabis for medical and industrial use, with
      products destined for export.
    sources:
      - kp
      - mjb
  products:
    text: No legal consumer products.
    sources:
      - kp
  medical:
    text: >-
      The 2023 law concerns production for export. A domestic patient treatment route was not
      verified in the reviewed sources.[@mjb,shteg]
    sources:
      - mjb
      - shteg
  consequences:
    text: A conviction carries a criminal record.
    sources:
      - shteg
  planting:
    seeds: illegal
    seeds_trade: banned
    clones: illegal
    clones_trade: banned
    text: >-
      Article 283 of the criminal code punishes selling, offering, giving, receiving,
      transporting or keeping narcotic substances "and seeds of narcotic plants" with five to
      ten years in prison, apart from small doses for personal use. The 2023 law on medical
      and industrial cannabis allows cultivation only by licensed companies.
    sources:
      - cmsg
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited.
    sources:
      - kp
      - shteg
  black_market:
    text: >-
      Policing of the illegal market is aimed at the crop in the field. Each summer the State Police search all twelve regions together with Italy's
      Guardia di Finanza, flying more than 50 high-resolution drones and using helicopters
      where the terrain is too rough, with most attention on the highlands of Shkodra,
      Dukagjini, Kruja and Dibra and on areas around Tepelena, Skrapar and Vlora. The joint
      monitoring destroyed 191,000 plants in 2024. Growers have been moving indoors, into so-
      called weed houses, and in 2025 a laboratory was set up in Tirana to process the survey
      data.
    sources:
      - a2n25
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. Possession is an offence under the
      Criminal Code, which exempts a small single dose held for personal use, assessed case by
      case rather than by a fixed gram limit.
    sources:
      - shteg
  driving:
    status: consumption
    text: >-
      Road Code article 185 prohibits a drug or psychotropic-substance user from
      driving. Its influence heading does not supply a numerical THC cutoff or a
      presence-based laboratory rule. After an accident, or where drug-related
      abnormality is suspected, traffic police may take the driver to the competent
      public health service for checks under jointly prescribed procedures. The
      licensing authority can order a medical fitness review and suspend the licence
      pending satisfactory checks. Article 185(4) incorporates article 184(3), (5)
      and (10), concerning accident-related vehicle detention, towing and refusal.
      It does not incorporate the whole alcohol concentration and penalty table.
      Consequently, no alcohol-limit fine, fixed drug-driving ban, THC allowance or
      medical-use exemption is inferred here. The transport authority's published
      consolidation includes Law 58/2026 of 18 June 2026; the precise current drug
      fine and operational toxicology protocol remain follow-up questions.
    sources:
      - roadcode2026
answers:
  buy:
    answer: no
    text: No patient or adult-use purchase route verified
