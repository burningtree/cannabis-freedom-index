summary: >-
  Licensed medical production is for export, with a separate industrial permit scheme. A small
  personal dose is exempt from the possession offence; unlicensed growing and supply carry
  prison terms.
scores:
  possession: 2
  cultivation: 1
  enforcement: 2
  sharing: 1
