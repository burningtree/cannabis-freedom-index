context:
  recreational:
    text: >-
      A small personal dose is excluded from Article 283, with the single-use interpretation
      assessed case by case.[@code2026,nikolli2015] Outside that exception, possession and
      giving or selling drugs carry five to ten years.[@code2026] Home growing has no
      personal-dose exception under Article 284.[@code2026] The cannabis agency says the [2023
      production law](/history/albania-medical-2023/) has not legalised general use.[@faq2026]
    sources:
      - code2026
      - nikolli2015
      - faq2026
  production:
    status: medical
    text: >-
      Medical production uses renewable fifteen-year licences, with production units of five to
      ten hectares and a national cultivation ceiling of 200 hectares.[@licensing] The health
      minister approves the licence after the agency procedure; licence conditions are reviewed
      every three years.[@law2023,licensing] Industrial production instead uses renewable
      five-year permits for at least one hectare.[@permits] Products are intended exclusively
      for export.[@faq2026] A [national register
      decision](/history/albania-cannabis-register-2026/) in July 2026 and [inspection
      rules](/history/albania-cannabis-inspections-2026/) in October added implementation
      measures.[@registry2026,inspection2026]
    sources:
      - licensing
      - law2023
      - permits
      - faq2026
      - registry2026
      - inspection2026
  medical:
    text: >-
      The medical production licence covers cultivation, transport and export.[@licensing] The
      agency says products and by-products are exclusively for export, so this framework does
      not provide a domestic patient purchase route.[@faq2026] The licence conditions include
      controlled premises and qualified staff, rather than a personal home-growing
      permission.[@law2023]
    sources:
      - licensing
      - faq2026
      - law2023
  consequences:
    text: >-
      A conviction need not remain permanent for criminal-record purposes: Article 69 provides
      rehabilitation after a period without another criminal offence following completion of the
      sentence.[@code2026] The periods are two years for imprisonment up to six months or a
      lighter punishment, five years for the six-month-to-five-year sentence bracket, seven
      years for the five-to-ten-year bracket and ten years for the ten-to-twenty-five-year
      bracket.[@code2026] These are the code’s general rehabilitation rules, rather than a
      cannabis-specific pardon.[@code2026]
    sources:
      - code2026
  hemp:
    status: high
    text: >-
      Industrial cannabis is defined as varieties containing no more than 0.8% THC.[@law2023] It
      requires a separate renewable five-year permit, covering at least one hectare, with
      registered varieties, security and traceability conditions.[@law2023,permits] Permitted
      activities can include seed or seedling import, propagation, cultivation, processing,
      transport and export.[@permits] The industrial route is therefore distinct from the
      fifteen-year medical licence, while its products remain export-oriented.[@law2023,faq2026]
    sources:
      - law2023
      - permits
      - faq2026
  culture:
    text: >-
      Albanian has its own form of the ancient word: kanëp, kin to hemp, hanf and konoplja,
      traced in the atlas entry [cannabis](/culture/language/cannabis/).[@cannabislg] The
      plant's modern history here is the illicit crop eradicated summer after summer, from
      [Lazarat in 2014](/history/albania-lazarat-operation-2014/) to the joint drone surveys of
      2024–2025.[@shteg,a2n25]
    sources:
      - cannabislg
      - shteg
      - a2n25
  arrests:
    text: >-
      Police reported two arrests at Rinas airport in [Operation Quality in October
      2025](/history/albania-rinas-cannabis-import-2025/).[@quality2025] They said 61 kg of
      suspected cannabis had arrived from Bangkok for sale in Albania.[@quality2025] This is one
      trafficking operation, rather than a national total or a count of arrests for personal
      use.[@quality2025]
    sources:
      - quality2025
  planting:
    seeds: illegal
    seeds_trade: regulated
    clones: illegal
    clones_trade: regulated
    text: >-
      Ordinary cannabis seed supply falls within Article 283, while growing requires permission
      under Article 284.[@code2026] The authorised medical and industrial schemes allow seed or
      seedling imports after approval by the state seed authority.[@law2023] Only registered
      planting material may be used, and operators must notify the authorities before
      sowing.[@law2023] Industrial permits can also cover propagation of seeds and
      seedlings.[@permits]
    sources:
      - code2026
      - law2023
      - permits
  clubs:
    status: none
    text: >-
      There is no licensed recreational club route in the export-only production
      framework.[@faq2026] Growing without permission is punishable under Article 284, and
      giving cannabis to another person is covered by Article 283.[@code2026] The small
      personal-dose possession exception does not provide a collective growing or distribution
      permission.[@code2026]
    sources:
      - faq2026
      - code2026
  black_market:
    text: >-
      Policing of the illegal market is aimed at the crop in the field.[@a2n25] Each summer the
      State Police search all twelve regions together with Italy's Guardia di Finanza, flying
      more than 50 high-resolution drones and using helicopters where the terrain is too
      rough.[@a2n25] Most attention goes to the highlands of Shkodra, Dukagjini, Kruja and Dibra
      and to areas around Tepelena, Skrapar and Vlora. The joint monitoring destroyed 191,000
      plants in 2024.[@a2n25] Growers have been moving indoors, into so- called weed houses, and
      in 2025 a laboratory was set up in Tirana to process the survey data.[@a2n25] In October
      2025, police reported 61 kg of suspected high-THC cannabis arriving from Bangkok for sale
      in Albania, illustrating an import case alongside the domestic crop.[@quality2025]
    sources:
      - a2n25
      - quality2025
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for visitors under the export-only production
      scheme.[@faq2026] The personal-dose exception is assessed case by case and provides no
      fixed gram allowance.[@code2026,nikolli2015] Unlawful import, export or transit carries a
      separate seven-to-fifteen-year range before aggravations.[@code2026]
    sources:
      - faq2026
      - code2026
      - nikolli2015
  driving:
    status: consumption
    text: >-
      Road Code article 185 prohibits a drug or psychotropic-substance user from
      driving.[@roadcode2026] Its influence heading does not supply a numerical THC cutoff or a
      presence-based laboratory rule.[@roadcode2026] After an accident, or where drug-related
      abnormality is suspected, traffic police may take the driver to the competent public
      health service for checks under jointly prescribed procedures.[@roadcode2026] The
      licensing authority can order a medical fitness review and suspend the licence pending
      satisfactory checks.[@roadcode2026] Article 185(4) incorporates article 184(3), (5) and
      (10), concerning accident-related vehicle detention, towing and refusal.[@roadcode2026] It
      does not incorporate the whole alcohol concentration and penalty table.[@roadcode2026]
      Consequently, no alcohol-limit fine, fixed drug-driving ban, THC allowance or medical-use
      exemption is inferred here.[@roadcode2026] The transport authority's published
      consolidation includes Law 58/2026 of 18 June 2026; the precise current drug fine and
      operational toxicology protocol remain follow-up questions.[@roadcode2026]
    sources:
      - roadcode2026
answers:
  buy:
    answer: 'no'
    text: No patient or adult-use purchase route verified
  carry:
    answer: limited
    text: Only a small single-use personal dose is excluded; no fixed gram allowance
  caught:
    answer: limited
    label: Dose assessment or prison
    text: >-
      The personal-dose exception is assessed case by case; possession outside it carries five
      to ten years before aggravations
