segments:
  possession:
    text: >-
      Possession is an offence under the Criminal Code, but the Code has long exempted a small
      single dose held for personal use, assessed case by case rather than by a fixed gram limit.
      Anything more is prosecuted, with prison terms of several years.
    sources:
      - shteg
  cultivation:
    text: >-
      Unlicensed cultivation is a serious crime — Albania spent years eradicating large illegal
      plantations. Since July 2023 companies can be licensed to grow for medical and industrial
      purposes.
    sources:
      - kp
      - shteg
  enforcement:
    text: >-
      The personal-dose exemption protects users in principle; growers and dealers face long
      sentences, and policing remains heavy after years of anti-cultivation campaigns.
    sources:
      - shteg
  sharing:
    text: Supply is trafficking.
    sources:
      - shteg
  consumption:
    text: Use is not separately punished where only a personal dose is involved.
    sources:
      - shteg
  access:
    text: No legal source for consumers; the 2023 law is aimed at export.
    sources:
      - kp
      - mjb
context:
  production:
    text: >-
      The law passed on 21 July 2023 creates a national cannabis agency that grants 15-year
      renewable licences to cultivate and process cannabis for medical and industrial use, with
      products destined for export.
    sources:
      - kp
      - mjb
  products:
    text: No legal consumer products.
    sources:
      - kp
  medical:
    text: The 2023 law concerns production; domestic patient access is not yet established.
    sources:
      - mjb
      - shteg
  consequences:
    text: A conviction carries a criminal record.
    sources:
      - shteg
  planting:
    seeds: illegal
    seeds_trade: banned
    clones: illegal
    clones_trade: banned
    text: >-
      Article 283 of the criminal code punishes selling, offering, giving, receiving,
      transporting or keeping narcotic substances "and seeds of narcotic plants" with five to
      ten years in prison, apart from small doses for personal use. The 2023 law on medical
      and industrial cannabis allows cultivation only by licensed companies.
    sources:
      - cmsg
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited.
    sources:
      - kp
      - shteg
  black_market:
    text: >-
      Policing of the illegal market is aimed at the crop in the field. Each summer the State Police search all twelve regions together with Italy's
      Guardia di Finanza, flying more than 50 high-resolution drones and using helicopters
      where the terrain is too rough, with most attention on the highlands of Shkodra,
      Dukagjini, Kruja and Dibra and on areas around Tepelena, Skrapar and Vlora. The joint
      monitoring destroyed 191,000 plants in 2024. Growers have been moving indoors, into so-
      called weed houses, and in 2025 a laboratory was set up in Tirana to process the survey
      data.
    sources:
      - a2n25
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. British travel advice says possessing
      illegal drugs could bring a prison sentence of 5 to 10 years and supplying them up to 15
      years, also for passengers in transit; it adds that airport scanners detect cannabis and
      are used on transit baggage too.
    sources:
      - kp
      - mjb
      - fcdo
