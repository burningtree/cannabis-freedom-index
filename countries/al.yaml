name: Albania
region: Europe
iso_numeric: 8
recreational: illegal
medical: none
updated: "2026-10-27"
summary: >-
  A 2023 law legalised licensed cultivation for medical and industrial purposes, largely for export.
  Personal use remains illegal.
scores:
  possession: 2
  cultivation: 1
  enforcement: 2
  sharing: 1
  consumption: 1
  access: 0
segments:
  possession:
    text: >-
      Possession is an offence under the Criminal Code, but the Code has long exempted a small
      single dose held for personal use, assessed case by case rather than by a fixed gram limit.[@shteg]
      Anything more is prosecuted, with prison terms of several years.[@shteg]
    sources:
      - shteg
    penalties:
      - label: Small single dose for personal use
        treatment: tolerated
        term: Personal dose
        note: Statutory exemption, assessed case by case; no gram limit
      - label: More than a small dose
        treatment: criminal
        term: Possession
        note: Prosecuted; prison terms of several years in practice
  cultivation:
    text: >-
      Unlicensed cultivation is a serious crime — Albania spent years eradicating large illegal
      plantations, notably the [2014 Lazarat operation](/history/albania-lazarat-operation-2014/).[@shteg] Since July 2023 companies can be licensed to grow for medical and industrial
      purposes, but by April 2026 no licence had been issued.[@kp,gitoc26]
    sources:
      - kp
      - shteg
      - gitoc26
    penalties:
      - label: Unlicensed cultivation
        treatment: criminal
        term: Cultivation
        note: Serious crime; eradication campaigns ongoing; tariff not stated in retained sources
      - label: Licensed medical or industrial growing
        treatment: legal
        term: Licensed cultivation
        note: Fifteen-year renewable licences; export-oriented; none issued as of April 2026
  enforcement:
    text: >-
      The personal-dose exemption protects users in principle; growers and dealers face long
      sentences, and policing remains heavy after years of anti-cultivation campaigns.[@shteg]
    sources:
      - shteg
  sharing:
    text: Supply is trafficking.[@shteg]
    sources:
      - shteg
  consumption:
    text: Use is not separately punished where only a personal dose is involved.[@shteg]
    sources:
      - shteg
  access:
    text: No legal source for consumers; the 2023 law is aimed at export.[@kp,mjb]
    sources:
      - kp
      - mjb
context:
  recreational:
    text: >-
      There is no legal recreational supply. A small single dose for personal use is exempt,
      assessed case by case with no fixed gram limit; anything more brings prison terms of
      several years.[@shteg] Use alone is not punished within the dose, but growing and supply
      are serious crimes, and the [2023 licensing law](/history/albania-medical-2023/) aims at export — with no
      consumer products and, as of April 2026, no licence issued.[@shteg,kp,mjb,gitoc26]
    sources:
      - shteg
      - kp
      - mjb
      - gitoc26
  production:
    status: medical
    text: >-
      The law passed on 21 July 2023 creates a national cannabis agency that grants 15-year
      renewable licences to cultivate and process cannabis for medical and industrial use, with
      products destined for export.[@kp,mjb] Nearly three years later no licence had been issued,
      despite the framework and cultivation zones being in place.[@gitoc26]
    sources:
      - kp
      - mjb
      - gitoc26
  medical:
    text: >-
      The 2023 law concerns production for export. A domestic patient treatment route was not
      verified in the reviewed sources.[@mjb,shteg]
    sources:
      - mjb
      - shteg
  consequences:
    text: >-
      A conviction carries a criminal record.[@shteg] No spent-conviction or expungement route for
      cannabis offences was found in the retained sources.
    sources:
      - shteg
  hemp:
    status: standard
    text: >-
      No blanket hemp regime was found: industrial growing exists only inside the licensed
      medical-and-industrial scheme, which is export-oriented and had issued no licence as of
      April 2026.[@kp,gitoc26]
    sources:
      - kp
      - gitoc26
  culture:
    text: >-
      Albanian has its own form of the ancient word: kanëp, kin to hemp, hanf and konoplja,
      traced in the atlas entry [cannabis](/culture/language/cannabis/).[@cannabislg] The plant's
      modern history here is the illicit crop eradicated summer after summer, from [Lazarat in
      2014](/history/albania-lazarat-operation-2014/) to the joint drone surveys of 2024–2025.[@shteg,a2n25]
    sources:
      - cannabislg
      - shteg
      - a2n25
  arrests:
    text: >-
      Enforcement is aimed at the crop in the field: the 2024 joint surveys destroyed 191,000
      plants, and a year later a Tirana laboratory was set up to process the survey data.[@a2n25]
      No account of routine user-level arrests was found.
    sources:
      - a2n25
  planting:
    seeds: illegal
    seeds_trade: banned
    clones: illegal
    clones_trade: banned
    text: >-
      Article 283 of the criminal code punishes selling, offering, giving, receiving,
      transporting or keeping narcotic substances "and seeds of narcotic plants" with five to
      ten years in prison, apart from small doses for personal use.[@cmsg] The 2023 law on medical
      and industrial cannabis allows cultivation only by licensed companies.[@kp]
    sources:
      - cmsg
      - kp
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited.[@kp,shteg]
    sources:
      - kp
      - shteg
  black_market:
    text: >-
      Policing of the illegal market is aimed at the crop in the field.[@a2n25] Each summer the State Police search all twelve regions together with Italy's
      Guardia di Finanza, flying more than 50 high-resolution drones and using helicopters
      where the terrain is too rough.[@a2n25] Most attention goes to the highlands of Shkodra,
      Dukagjini, Kruja and Dibra and to areas around Tepelena, Skrapar and Vlora. The joint
      monitoring destroyed 191,000 plants in 2024.[@a2n25] Growers have been moving indoors, into so-
      called weed houses, and in 2025 a laboratory was set up in Tirana to process the survey
      data.[@a2n25]
    sources:
      - a2n25
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. Possession is an offence under the
      Criminal Code, which exempts a small single dose held for personal use, assessed case by
      case rather than by a fixed gram limit.[@shteg]
    sources:
      - shteg
  driving:
    status: consumption
    text: >-
      Road Code article 185 prohibits a drug or psychotropic-substance user from
      driving. Its influence heading does not supply a numerical THC cutoff or a
      presence-based laboratory rule. After an accident, or where drug-related
      abnormality is suspected, traffic police may take the driver to the competent
      public health service for checks under jointly prescribed procedures. The
      licensing authority can order a medical fitness review and suspend the licence
      pending satisfactory checks. Article 185(4) incorporates article 184(3), (5)
      and (10), concerning accident-related vehicle detention, towing and refusal.
      It does not incorporate the whole alcohol concentration and penalty table.
      Consequently, no alcohol-limit fine, fixed drug-driving ban, THC allowance or
      medical-use exemption is inferred here. The transport authority's published
      consolidation includes Law 58/2026 of 18 June 2026; the precise current drug
      fine and operational toxicology protocol remain follow-up questions.
    sources:
      - roadcode2026
answers:
  buy:
    answer: no
    text: No patient or adult-use purchase route verified
