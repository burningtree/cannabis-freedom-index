segments:
  possession:
    text: >-
      Possession is an offence under the Criminal Code, but the Code has long exempted a small
      single dose held for personal use, assessed case by case rather than by a fixed gram limit.
      Anything more is prosecuted, with prison terms of several years.
    sources:
      - shteg
  cultivation:
    text: >-
      Unlicensed cultivation is a serious crime — Albania spent years eradicating large illegal
      plantations. Since July 2023 companies can be licensed to grow for medical and industrial
      purposes.
    sources:
      - kp
      - shteg
  enforcement:
    text: >-
      The personal-dose exemption protects users in principle; growers and dealers face long
      sentences, and policing remains heavy after years of anti-cultivation campaigns.
    sources:
      - shteg
  sharing:
    text: Supply is trafficking.
    sources:
      - shteg
  consumption:
    text: Use is not separately punished where only a personal dose is involved.
    sources:
      - shteg
  access:
    text: No legal source for consumers; the 2023 law is aimed at export.
    sources:
      - kp
      - mjb
context:
  production:
    text: >-
      The law passed on 21 July 2023 creates a national cannabis agency that grants 15-year
      renewable licences to cultivate and process cannabis for medical and industrial use, with
      products destined for export.
    sources:
      - kp
      - mjb
  products:
    text: No legal consumer products.
    sources:
      - kp
  medical:
    text: The 2023 law concerns production; domestic patient access is not yet established.
    sources:
      - mjb
      - shteg
  consequences:
    text: A conviction carries a criminal record.
    sources:
      - shteg
