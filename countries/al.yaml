segments:
  possession:
    text: >-
      Article 283 excludes personal use in small doses from its possession offence.[@code2026]
      The Supreme Court interpreted that as a single-use quantity, assessed through evidence
      rather than a fixed gram limit.[@nikolli2015] Possession outside the exemption carries
      five to ten years; complicity, repetition, large quantities or specified serious-harm
      circumstances bring seven to fifteen, while organising, directing or financing the
      activity carries ten to twenty.[@code2026]
    sources:
      - code2026
      - nikolli2015
    penalties:
      - label: Small single dose for personal use
        treatment: legal
        term: Personal dose
        note: Excluded from Article 283; case-specific single-use assessment, no fixed gram limit
      - label: Possession outside the personal-dose exemption
        treatment: criminal
        term: Possession
        prison_min: 5 years
        prison: 10 years
        note: Article 283(1)
      - label: Aggravated possession
        treatment: criminal
        term: Possession
        prison_min: 7 years
        prison: 15 years
        note: >-
          Article 283(2): complicity, repetition, large quantities or specified serious-harm
          circumstances
  cultivation:
    text: >-
      Unlicensed growing carries three to seven years under Article 284.[@code2026] Complicity,
      repetition, large quantities or specified serious-harm circumstances bring five to ten
      years; organising, directing or financing the activity carries seven to
      fifteen.[@code2026] The [2023 law](/history/albania-medical-2023/) provides separate
      medical licences and industrial permits for authorised production.[@law2023]
    sources:
      - code2026
      - law2023
    penalties:
      - label: Unlicensed cultivation
        treatment: criminal
        term: Cultivation
        prison_min: 3 years
        prison: 7 years
        note: Article 284(1)
      - label: Aggravated cultivation
        treatment: criminal
        term: Cultivation
        prison_min: 5 years
        prison: 10 years
        note: >-
          Article 284(2): complicity, repetition, large quantities or specified serious-harm
          circumstances
      - label: Organising, directing or financing cultivation
        treatment: criminal
        term: Cultivation
        prison_min: 7 years
        prison: 15 years
        note: Article 284(3)
      - label: Authorised medical or industrial cultivation
        treatment: legal
        term: Licensed/permitted cultivation
        note: >-
          Medical licence: fifteen years; industrial permit: five years; renewable,
          export-oriented
  enforcement:
    text: >-
      The small-dose exclusion is statutory, while possession beyond it and unlicensed growing
      carry prison terms.[@code2026] The single-use interpretation makes the quantity and expert
      assessment important.[@nikolli2015] Crop eradication continues nationally, and police also
      target imports: in October 2025 they reported two arrests and 61 kg seized at Rinas
      airport.[@a2n25,quality2025]
    sources:
      - code2026
      - nikolli2015
      - a2n25
      - quality2025
  sharing:
    text: >-
      Giving or selling drugs falls under Article 283, carrying five to ten years; the
      aggravated range is seven to fifteen and organising, directing or financing carries ten to
      twenty.[@code2026] Unlawful import, export or transit carries seven to fifteen years,
      rising to ten to twenty in aggravated cases and at least fifteen for organisers, directors
      or financiers.[@code2026] A professional entrusted with drugs who illegally facilitates
      their intake or use faces three to seven years; organising a drug criminal organisation
      carries ten to twenty and state officials facilitating it face five to fifteen.[@code2026]
    sources:
      - code2026
    penalties:
      - label: Giving or selling
        treatment: criminal
        term: Supply
        prison_min: 5 years
        prison: 10 years
        note: Article 283(1)
      - label: Aggravated supply
        treatment: criminal
        term: Supply
        prison_min: 7 years
        prison: 15 years
        note: >-
          Article 283(2): complicity, repetition, large quantities or specified serious-harm
          circumstances
      - label: Organising, directing or financing supply
        treatment: criminal
        term: Supply
        prison_min: 10 years
        prison: 20 years
        note: Article 283(3)
      - label: Unlawful import, export or transit
        treatment: criminal
        term: Trafficking
        prison_min: 7 years
        prison: 15 years
        note: Article 283/a(1)
      - label: Aggravated import, export or transit
        treatment: criminal
        term: Trafficking
        prison_min: 10 years
        prison: 20 years
        note: >-
          Article 283/a(2): complicity, repetition, large quantities or specified serious-harm
          circumstances
      - label: Organising, directing or financing trafficking
        treatment: criminal
        term: Trafficking
        prison_min: 15 years
        note: Article 283/a(3); statutory minimum, no specific maximum in this paragraph
      - label: Professional facilitation of intake or use
        treatment: criminal
        term: Facilitating use
        prison_min: 3 years
        prison: 7 years
        note: Article 283/b; persons entrusted with administering controlled drugs
      - label: Organising, directing or financing a drug criminal organisation
        treatment: criminal
        term: Criminal organisation
        prison_min: 10 years
        prison: 20 years
        note: Article 284/a(1)
      - label: State official facilitating such organisation activity
        treatment: criminal
        term: Facilitation
        prison_min: 5 years
        prison: 15 years
        note: Article 284/a(2)
  consumption:
    text: >-
      The possession offence excludes personal use in small doses; this does not authorise
      growing or supplying cannabis.[@code2026] The cannabis agency confirms that general use
      has not been legalised and that the production framework serves export.[@faq2026]
    sources:
      - code2026
      - faq2026
  access:
    text: >-
      There is no legal recreational retail route; the agency describes authorised medical and
      industrial products as exclusively for export.[@faq2026]
    sources:
      - faq2026
