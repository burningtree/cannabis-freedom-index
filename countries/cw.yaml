  prevalence: 4.98
  estimate: true
  users: 5000
recreational: illegal
medical: limited
updated: 2026-10-17
summary: >-
  On paper cannabis is treated like cocaine, with maximum penalties up to life imprisonment, under an
  Opium Ordinance renewed in 2024. In practice the prosecution guideline is mild: up to 25 g is
  confiscated and the case dropped, and up to 50 g ends in a fine. Medical cannabis was proposed in
  2019 and the ordinance lets doctors and pharmacists supply hemp for medical purposes, but no working
  programme has been confirmed.
scores:
  possession: 4
  cultivation: 1
  enforcement: 4
  sharing: 1
  consumption: 2
  access: 1
segments:
  possession:
    text: >-
      The Opium Ordinance 2024 bans importing, possessing and dealing in hemp and cannabis resin,
      punishable, if intentional, by up to 24 years or life in prison or a fine of up to NAf 6.25
      million. The prosecution guideline in force since December 2018 is far milder: up to 25 g is
      confiscated and the case dismissed, conditionally or not, and 25 to 50 g brings a fine of up to
      NAf 500. Exceptions are possession together with another offence, repeat offences, signs of
      dealing, minors, and places such as carnival parades, workplaces or government buildings.
    sources:
      - opl24
      - om18
  cultivation:
    text: >-
      Growing plants of the genus Cannabis is banned outright. The guideline leaves sentencing for
      grows to case-by-case assessment, given the range of plant numbers and professionalism.
    sources:
      - opl24
      - om18
  enforcement:
    text: >-
      Small amounts are confiscated without prosecution, and only larger quantities lead to prison
      demands, set at half those for cocaine. First offenders who are residents are usually given
      partly suspended sentences with three years' probation.
    sources:
      - om18
  sharing:
    text: >-
      Supplying cannabis is dealing under the ordinance, with no exception for sharing without
      payment; signs of dealing remove the leniency for small amounts.
    sources:
      - opl24
      - om18
  consumption:
    text: >-
      The ordinance bans using (aanwenden) cannabis as well as possessing it, but small personal
      amounts are not prosecuted. There is no legal place to use cannabis, and possession at carnival
      parades or in public buildings is excluded from the leniency.
    sources:
      - om18
  access:
    text: >-
      No legal adult-use source. The ordinance exempts pharmacists and doctors who supply hemp for
      medical purposes, and patients who need it for their own medical use and obtained it lawfully.
      A 2019 bill to set up a medical cannabis system with a Medicinal Cannabis Curaçao Office went to
      parliament, but a working programme has not been confirmed.
    sources:
      - opl24
      - cc19
context:
  production:
    text: >-
      No licensed cannabis production is known. The minister may grant licences for scientific
      purposes, to wholesale medicine traders and to manufacturers of medicines.
    sources:
      - opl24
  products:
    text: >-
      No legal cannabis products. Extracts and tinctures of hemp are banned under a separate article
      of the ordinance.
    sources:
      - opl24
  medical:
    text: >-
      Under the 2024 ordinance, pharmacists and doctors may prepare, hold and dispense hemp for
      medical purposes, and patients may hold what they need for their own medical use if obtained
      lawfully. In September 2019 a bill went to parliament to build a medical cannabis system, with
      a Medicinal Cannabis Curaçao Office to deal with growers and sellers; whether patients can
      actually obtain cannabis could not be confirmed.
    sources:
      - opl24
      - cc19
  consequences:
    text: >-
      The 2024 ordinance replaced the 1960 Opium Ordinance to implement the UN conventions and to ban
      recreational use of nitrous oxide. Minors found with a user amount of cannabis are prosecuted,
      so that treatment can be imposed.
    sources:
      - opl24
      - om18
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and there is no coffeeshop tolerance.
    sources:
      - om18
  visitors:
    status: none
    text: >-
      There is no legal supply for anyone. Importing cannabis is an offence under the ordinance, and
      the guideline treats non-residents differently when it comes to suspended sentences.
    sources:
      - opl24
      - om18
