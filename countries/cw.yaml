name: Curaçao
region: North America
iso_numeric: 531
dependency:
  of: nl
  kind: Country within the Kingdom of the Netherlands
  note: >-
    Curaçao is a self-governing country within the Kingdom of the Netherlands, with its own
    parliament and criminal law. The Dutch coffeeshop policy does not apply there; the public
    prosecution service is shared with Sint Maarten and the Caribbean Netherlands.
recreational: illegal
medical: limited
updated: '2026-10-23'
summary: >-
  Cannabis possession, use, growing and supply remain prohibited. Prosecutors’ guidance calls for
  confiscation and dismissal in the 0–25 g band, subject to exceptions, and a fine request in the
  25–50 g band. The law provides medical exemptions for authorised professionals and lawfully
  obtained treatment supplies. A proposed medical-cannabis industry was still awaiting parliamentary
  approval in April 2023.
scores:
  possession: 4
  cultivation: 1
  enforcement: 4
  sharing: 1
  consumption: 2
  access: 1
segments:
  possession:
    text: >-
      Possession of cannabis or resin is prohibited. For intentional offences the statute permits
      life imprisonment, a fixed term up to 24 years, a fine up to NAf 6.25 million, or the fixed
      term and fine together.[@law] Prosecutors’ guidance is much milder: confiscation and a
      potentially conditional dismissal in the 0–25 g band, and a fine request up to NAf 500 in the
      25–50 g band. Exceptions include minors, repeat offending, dealing indications, another
      offence and specified settings such as carnival parades or workplaces.[@guide]
    sources:
      - law
      - guide
    currency: ANG
    penalties:
      - upto: 25 g
        treatment: criminal
        note: Prosecution guidance — confiscation and a potentially conditional dismissal, subject to exceptions
      - label: 25 to 50 g
        treatment: criminal
        fine: 500
        note: Prosecutors request a fine of up to NAf 500, subject to exceptions
      - label: Intentional possession (statutory maximum)
        treatment: criminal
        fine: 6250000
        prison: 24 years
        note: Life imprisonment, a fixed term of up to 24 years, a fine of up to NAf 6.25 million, or term and fine together; statute retains far higher maxima than the guidance
  cultivation:
    text: >-
      Growing any plant of the genus Cannabis is prohibited.[@law] Prosecutors assess grow cases
      individually, considering plant numbers, location, professionalism and involvement.[@guide]
      The government may create exemptions through a separate decree, subject to prior parliamentary
      approval; the ordinance itself sets no personal plant allowance.[@law]
    sources:
      - law
      - guide
  enforcement:
    text: >-
      The prosecution guideline calls for confiscation and dismissal in the 0–25 g band, subject to
      exceptions; from 50 g upwards it uses half the cocaine/heroin sentencing request.[@guide] Its
      general instructions favour partly suspended requests for first offenders who are residents,
      with a three-year probation period.[@guide] These are prosecutors’ instructions; the statute
      retains much higher maximum penalties.[@law]
    sources:
      - guide
      - law
  sharing:
    text: >-
      The law prohibits supplying cannabis extracts and tinctures without the relevant
      authorisation, and prohibits possessing or using herbal cannabis and resin outside its
      exceptions.[@law] The prosecution guideline removes its small-quantity dismissal approach
      where there are indications of dealing.[@guide]
    sources:
      - law
      - guide
  consumption:
    text: >-
      The ordinance expressly prohibits using cannabis, resin and extracts outside its
      exceptions.[@law] Prosecutors’ cannabis table provides a small-quantity dismissal approach,
      but excludes minors and circumstances including carnival parades, workplaces, government
      buildings and detention facilities.[@guide]
    sources:
      - law
      - guide
  access:
    text: >-
      The law exempts authorised pharmacists and dispensing doctors handling extracts and tinctures
      for medical purposes, subject to the applicable medicines rules. It also exempts people who
      can show that lawfully obtained amounts are needed for their own medical use.[@law]
      Recreational possession and use remain prohibited; the prosecution guideline’s small-quantity
      dismissal policy does not provide a licensed retail route.[@law,guide]
    sources:
      - law
      - guide
context:
  recreational:
    text: >-
      There is no legal recreational supply. Prosecutors confiscate and may conditionally dismiss
      the 0–25 g band, and request a fine of up to NAf 500 in the 25–50 g band — but the statute
      still permits life imprisonment, 24 years or a NAf 6.25 million fine, and the guidance
      does not apply to minors, repeat or dealing-indicated cases, or settings like carnival
      parades.[@guide,law]
    sources:
      - guide
      - law
  production:
    status: medical
    text: >-
      Cannabis cultivation is prohibited. The law provides permissions for specified scientific or
      medicines-related activities and a separate route for exemptions by decree, requiring prior
      parliamentary approval.[@law] The 2019 bill proposed a dedicated medical-cannabis bureau and
      grower system; opposition lawmakers were still seeking approval in April
      2023.[@bill19,opposition]
    sources:
      - law
      - bill19
      - opposition
  products:
    text: >-
      The ordinance controls herbal cannabis and resin separately from extracts and tinctures.
      Medical professionals’ handling of extracts and tinctures, and lawfully obtained amounts
      needed for personal treatment, fall within specified exemptions.[@law] Public messages
      promoting controlled-drug sales or supply are prohibited, with an exception for purely medical
      or scientific information.[@law]
    sources:
      - law
  medical:
    text: >-
      Authorised pharmacists and dispensing doctors have medical-purpose exemptions for handling
      extracts and tinctures, subject to medicines rules. People who establish their need for
      lawfully obtained personal treatment supplies also have an exemption.[@law] The 2019 industry
      proposal concerned a bureau working with growers and sellers; it remained a bill awaiting
      approval in the April 2023 reporting.[@bill19,opposition]
    sources:
      - law
      - bill19
      - opposition
  consequences:
    text: >-
      The 2024 replacement law retained the cannabis prohibitions and medical exceptions, added a
      sales-advertising restriction and provided a route for future exemptions requiring
      parliamentary approval.[@law] The earlier medical-production bill had stalled after two
      parliamentary discussions, prompting opposition calls for answers in April 2023.[@opposition]
    sources:
      - law
      - opposition
  clubs:
    status: none
    text: >-
      The ordinance provides no recreational club exemption from the cannabis possession and use
      bans.[@law] Prosecutors’ small-quantity dismissal policy excludes cases with signs of
      dealing.[@guide]
    sources:
      - law
      - guide
  visitors:
    status: none
    text: >-
      Unauthorised importation, possession and use remain prohibited.[@law] The prosecution
      guideline’s preference for partly suspended requests concerns resident first offenders; it
      generally does not seek a probation report for non-residents.[@guide]
    sources:
      - law
      - guide
