name: Northern Mariana Islands
region: Oceania
iso_numeric: 580
dependency:
  of: us
  kind: Unincorporated territory
  note: >-
    The Commonwealth of the Northern Mariana Islands is a US territory in political union with the
    United States, with its own legislature and laws. Federal drug law applies there, and carrying
    cannabis between islands is barred while it does.
recreational: legal
medical: legal
updated: 2026-10-17
summary: >-
  The Northern Mariana Islands legalised adult and medical use by an act of the legislature in
  September 2018. Adults 21 and over may carry an ounce, keep eight
  at home and grow their own, and licensed shops, lounges and delivery have operated since 2021.
scores:
  possession: 6
  cultivation: 5
  enforcement: 6
  sharing: 3
  consumption: 4
  access: 6
segments:
  possession:
    text: >-
      Adults 21 and over may possess up to 1 oz in a public place and up to 8 oz of usable cannabis at
      home, plus up to 16 oz of solid and 72 oz of liquid cannabis products and 5 g of extracts.
      Possession is barred in cannabis-free zones such as government buildings, schools, federal
      buildings and businesses licensed to serve alcohol.
    sources:
      - pit20
  cultivation:
    text: >-
      Adults may grow up to six mature or twelve immature plants at home or at a cultivation site
      they lawfully use, out of public view and secured from anyone under 21. Growers are asked to
      join a homegrown registry; homegrown cannabis may not be sold.
    sources:
      - pit20
  enforcement:
    text: >-
      Inside the limits nothing is punished. Using cannabis while driving brings fines of up to $500
      and suspension of the licence for up to six months for a first offence, and up to $1,000 and a
      year for a repeat.
    sources:
      - pit20
  sharing:
    text: >-
      Homegrown cannabis may not be sold. The commission's public guidance does not set out a rule on
      gifts between adults.
    sources:
      - pit20
  consumption:
    text: >-
      Use is legal in private, but using or displaying cannabis in a public place, on public property
      or in front of anyone under 21 is unlawful. Licensed lounges allow on-site consumption.
    sources:
      - pit20
      - ccr25
  access:
    text: >-
      The CNMI Cannabis Commission licenses producers, processors, retailers, wholesalers, lounges
      and testing. The first dispensary opened to the public on 16 July 2021; seven retailers renewed
      their licences in 2025, and retailers may deliver from their licensed premises.
    sources:
      - ccr25
      - wiki
context:
  production:
    text: >-
      Licensed producers grow under canopy classes; the commission counted eight producer licensees
      in 2025, and licensees employed about sixty people. There is no certified testing laboratory in
      the Commonwealth.
    sources:
      - ccr25
  products:
    text: >-
      Flower, extracts, edibles and other products from licensed processors. In 2025 the commission
      was working on potency limits for concentrates, edibles, tinctures and topicals.
    sources:
      - ccr25
  medical:
    text: >-
      The 2018 Act covers medical as well as adult use. Medical patients may also grow their own.
    sources:
      - pit20
      - wiki
  consequences:
    text: >-
      Cannabis excise and surtax brought in $686,979 in fiscal 2024 but only $113,880 by July 2025.
      In 2025 the commission cut licence fees by 25% and adopted rules for a seed-to-sale tracking
      system.
    sources:
      - ccr25
  clubs:
    status: none
    text: >-
      No cannabis clubs are known. Licensed lounges, where adults consume on site, take the place
      clubs fill elsewhere.
    sources:
      - ccr25
