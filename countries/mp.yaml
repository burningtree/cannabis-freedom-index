name: Northern Mariana Islands
region: Oceania
iso_numeric: 580
dependency:
  of: us
  kind: Unincorporated territory
  note: >-
    The Commonwealth of the Northern Mariana Islands is a US territory in political union with the
    United States, with its own legislature and laws. Federal drug law applies there, and carrying
    cannabis between islands is barred while it does.
recreational: legal
medical: legal
updated: "2026-10-21"
summary: >-
  The Northern Mariana Islands legalised adult and medical use in September 2018. Adults 21 and
  over may carry an ounce, keep eight at home and grow their own. Licensed shops and lounges
  opened in 2021; the commission reported retailer-delivery rules in 2025.
scores:
  possession: 6
  cultivation: 5
  enforcement: 6
  sharing: 5
  consumption: 4
  access: 6
segments:
  possession:
    text: >-
      Adults 21 and over may possess up to 1 oz in a public place and up to 8 oz of usable
      cannabis at home, plus up to 16 oz of solid and 72 oz of liquid cannabis products and 5 g of
      extracts. Possession is barred in cannabis-free zones such as government buildings, schools,
      federal buildings and businesses licensed to serve alcohol.
    sources:
      - pit20
  cultivation:
    text: >-
      Adults may grow up to six mature and twelve immature plants per household or cultivation
      site, out of public view and secured against unauthorised access and access by people under
      21. A homegrown-registry card is required, with a statutory annual fee of $75. The 2019
      amendment protected compliant growing while registry rules were unfinished, subject to
      obtaining a card when available. Homegrown cannabis may not be sold.
    sources:
      - codeHome
      - codeRegistry
  enforcement:
    text: >-
      Inside the limits nothing is punished. Using cannabis while driving brings fines of up to
      $500 and suspension of the licence for up to six months for a first offence, and up to
      $1,000 and a year for a repeat.
    sources:
      - pit20
  sharing:
    text: >-
      Adults 21 and over may give another adult up to one ounce of usable cannabis, 16 ounces of
      solid products, 72 ounces of liquid products, five grams of extracts or six immature plants
      for noncommercial purposes. The recipient must accept the gift. Homegrown cannabis and
      plants may not be sold for consideration.
    sources:
      - codeHome
  consumption:
    text: >-
      Use is legal in private, but using or displaying cannabis in a public place, on public
      property or in front of anyone under 21 is unlawful. Licensed lounges allow on-site
      consumption.
    sources:
      - pit20
      - ccr25
  access:
    text: >-
      The commission licenses producers, processors, retailers, wholesalers, lounges and testing.
      Saipan Select held a soft opening on 14 July 2021 and its grand opening on 16 July. Seven
      retailers renewed licences in 2025; the commission’s 2025 report also records amended
      retailer-delivery rules and a compliance advisory for delivery from licensed premises.
    sources:
      - firstShop
      - ccr25
context:
  production:
    status: open
    text: >-
      Licensed producers grow under canopy classes; the commission counted eight producer
      licensees in 2025, and licensees employed about sixty people. There is no certified testing
      laboratory in the Commonwealth.
    sources:
      - ccr25
  products:
    text: >-
      Flower, extracts, edibles and other products from licensed processors. In 2025 the
      commission was working on potency limits for concentrates, edibles, tinctures and topicals.
    sources:
      - ccr25
  medical:
    text: >-
      The 2018 law covers medical as well as adult use. A patient or caregiver may grow up to
      twelve mature and twenty-four immature plants when a physician considers it necessary and
      practical for treatment, with a registry card and physician statement. The 2019 law allows
      licensed sales to patients aged eighteen to twenty-one with a valid doctor’s recommendation,
      including qualifying recommendations from a nonresident patient’s country of origin.
    sources:
      - codeHome
      - law19
  consequences:
    text: >-
      Cannabis excise and surtax brought in $686,979 in fiscal 2024 but only $113,880 by July
      2025. In 2025 the commission cut licence fees by 25% and adopted rules for a seed-to-sale
      tracking system.
    sources:
      - ccr25
  clubs:
    status: none
    text: >-
      No cannabis clubs are known. Licensed lounges, where adults consume on site, take the place
      clubs fill elsewhere.
    sources:
      - ccr25
