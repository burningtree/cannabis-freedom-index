segments:
  possession:
    text: >-
      Law 78/IV/93 of 1993 punishes consumption (Article 20) and a lesser form of trafficking
      (Article 6). In the case behind Constitutional Court ruling 18/2023, a man found with 15 g
      of cannabis was convicted of lesser trafficking and sentenced to 1 year and 6 months, which
      two appeal courts upheld; he argued it was for personal use. The scores are kept as before
      because the statute's own text was not available.
    sources:
      - tc2023
  cultivation:
    text: >-
      Not confirmed. The statute text was not available, so nothing is stated here about
      cultivation.
    sources:
      - tc2023
  enforcement:
    text: >-
      The 2023 ruling shows a prison sentence of 1 year and 6 months for 15 g of cannabis, upheld on
      appeal. A 2020 reform to add suspended sentences with compulsory treatment was vetoed.
    sources:
      - tc2023
      - obs2020
  sharing:
    text: >-
      Not confirmed. The 2020 news reports say the 1993 law punishes leading a trafficking group of
      two or more people with 10 to 20 years; the penalty for passing cannabis to another person
      was not found.
    sources:
      - obs2020
  consumption:
    text: >-
      Consumption is a crime under Article 20 of Law 78/IV/93, as cited in the 2023 ruling.
    sources:
      - tc2023
  access:
    text: >-
      Not confirmed. No lawful source was found in the sources read.
    sources:
      - tc2023
