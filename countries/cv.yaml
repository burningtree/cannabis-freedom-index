segments:
  possession:
    text: >-
      Law 78/IV/93 prohibits possession and use. The one source found says small personal amounts
      are referred to a treatment-oriented commission rather than prosecuted, on the Portuguese
      model, but also that no formal decriminalisation law has passed. Scored cautiously as a minor
      offence that seldom leads to prison; this entry needs checking against the statute.
    sources:
      - cr
  cultivation:
    text: Cultivation is prohibited by the 1993 law.
    sources:
      - cr
  enforcement:
    text: >-
      Lenient towards small-scale users by regional standards, severe on trafficking — the islands
      are a transit point for Atlantic cocaine routes, which drives enforcement.
    sources:
      - cr
  sharing:
    text: Trafficking is punished with roughly 4 to 12 years, up to 15 in serious cases.
    sources:
      - cr
  consumption:
    text: Use is prohibited under the same law.
    sources:
