name: Cabo Verde
region: Africa
iso_numeric: 132
recreational: illegal
medical: limited
updated: "2026-10-15"
summary: >-
  Small personal-use possession, cultivation and consumption are criminal but have a separate
  three-month-or-fine provision. Trafficking has heavier penalties. Scientific growing and
  controlled-medicine authorisations exist in law; a functioning cannabis patient service remains
  unverified.
scores:
  possession: 1
  cultivation: 1
  enforcement: 2
  sharing: 0
  consumption: 0
  access: 0
segments:
  possession:
    text: >-
      Article 20 of Law 78/IV/93 covers small quantities held or acquired for personal use, with up
      to three months in prison or a fine of up to 30 days. It gives no fixed gram threshold. Lesser
      trafficking under article 6 instead carries one to five years for Table I/II substances. The
      case described in Constitutional Court ruling 18/2023 involved 15 g and an eighteen-month
      lesser-trafficking sentence; the defendant disputed that classification. That case does not
      make every 15 g possession offence trafficking or establish typical sentencing.
    sources:
      - law1993
      - correction1993
      - tc2023
  cultivation:
    text: >-
      Small cultivation intended for the grower’s own consumption falls under article 20, with up to
      three months or a fine of up to 30 days; it is not legal home-growing. Other unauthorised
      cultivation falls under article 3, ordinarily four to twelve years, subject to
      lesser-trafficking provisions where applicable. Article 6 of Decree-Law 92/92 separately
      permits Health Ministry licences for scientific or teaching cultivation. No recreational plant
      allowance was established.
    sources:
      - law1993
      - correction1993
      - licensing1992
  enforcement:
    text: >-
      The statute provides both fines and custody for personal consumption offences. A discretionary
      article 20 waiver requires minority, no repeat offence and a solemn undertaking before a
      magistrate, cumulatively. Article 22 already allowed conditional sentence suspension for a
      dependent offender voluntarily undertaking treatment; the vetoed 2020 compulsory-treatment
      proposal should not be mistaken for the first treatment provision. One reported eighteen-month
      lesser-trafficking sentence for 15 g is not a representative sentencing survey; the
      enforcement rating remains provisional.
    sources:
      - law1993
      - correction1993
      - tc2023
      - obs2020
  sharing:
    text: >-
      Article 3 covers offering, distributing, transferring or providing controlled drugs to another
      person, ordinarily four to twelve years for Table I/II substances. It provides no general
      unpaid-gift exception. Article 6 permits a lesser-trafficking band where unlawfulness is
      considerably reduced, but does not legalise sharing. Article 12 separately addresses inciting
      or facilitating illicit use.
    sources:
      - law1993
      - correction1993
  consumption:
    text: >-
      Use itself is an article 20 offence, punishable by up to three months in prison or a fine of
      up to 30 days. The waiver is discretionary and restricted to a minor meeting all listed
      conditions, not every first offender. Article 21 protects anonymity and professional
      confidentiality for people who voluntarily seek health assistance.
    sources:
      - law1993
      - correction1993
  access:
    text: >-
      No lawful recreational supply route or operating cannabis patient service was established.
      Decree-Law 92/92 provides scientific/teaching cultivation licences and a controlled medicines
      system; Table II substances require special prescriptions under article 22. ERIS identifies
      cannabis and resin as controlled under Table II-A. These statutory powers do not establish
      stocked cannabis medicines or permission for ordinary retail sales.
    sources:
      - licensing1992
      - cosmetics2024
context:
  production:
    status: medical
    text: >-
      Decree-Law 92/92 article 6 expressly prohibits cannabis cultivation but permits Health
      Ministry licences for scientific or teaching purposes. Its authorisation and manufacturing
      provisions impose controls on licensed entities; they are not a recreational or general
      industrial-hemp exemption. Issued cannabis-growing licences and lawful output volumes were not
      established.
    sources:
      - licensing1992
  products:
    text: >-
      ERIS’s 6 May 2024 circular reiterates a prohibition on cannabis-related preparations and CBD
      or other cannabinoid ingredients in cosmetics under the framework it describes. It warns that
      a blank CBD entry in an ingredient inventory is not permission. This cosmetics guidance should
      not be extrapolated into an unsourced rule for every food, medicine or seed product.
    sources:
      - cosmetics2024
  medical:
    text: >-
      The limited label reflects a statutory framework, not a verified patient programme. Decree-Law
      92/92 permits scientific or teaching cultivation licences and provides controlled medicines
      authorisations, special prescriptions for Table II substances and pharmacist dispensing. ERIS
      places cannabis and resin in Table II-A. Current cannabis prescribing practice, issued product
      authorisations and availability remain unverified.
    sources:
      - licensing1992
      - cosmetics2024
  consequences:
    text: >-
      Articles 16–17 provide forfeiture of controlled substances, relevant equipment and crime
      proceeds, subject to stated protections for good-faith third parties. Article 19 permits the
      court to expel a foreign national convicted under the law for no more than fifteen years;
      expulsion is discretionary, not an automatic outcome in every possession case.
    sources:
      - law1993
      - correction1993
  clubs:
    status: none
    text: >-
      The reviewed framework establishes no recreational collective-growing or distribution
      permission. Personal cultivation remains criminal and article 3 includes transfers to others.
      Article 13 separately penalises operators who allow premises to be used for illicit
      trafficking or consumption. No claim is made about the prevalence of informal associations.
    sources:
      - law1993
      - correction1993
  visitors:
    status: none
    text: >-
      No recreational visitor purchase route was established. Personal-use custody or fines remain
      possible under article 20, and foreign offenders can face discretionary expulsion under
      article 19. Decree-Law 92/92 article 30 contains a medical-document rule for travellers
      carrying Table II/III substances; it does not by itself validate a foreign cannabis
      recommendation or every cannabis product at the border.
    sources:
      - law1993
      - correction1993
      - licensing1992
  planting:
    seeds: grey
    seeds_trade: unclear
    clones: illegal
    clones_trade: banned
    text: >-
      Personal-use cultivation remains criminal under article 20, while Decree-Law 92/92 reserves
      authorised cultivation to scientific or teaching purposes. Growing cuttings has no
      recreational exemption. The reviewed provisions do not expressly resolve isolated seed
      possession or seed commerce; grey records that uncertainty rather than a verified permission.
    sources:
      - law1993
      - licensing1992
