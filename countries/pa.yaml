name: Panama
region: North America
iso_numeric: 591
recreational: illegal
medical: limited
updated: 2026-10-04
summary: Medical cannabis was legalised in 2021; recreational use is illegal.
scores:
  possession: 1
  cultivation: 1
  enforcement: 2
  sharing: 1
  consumption: 1
  access: 1
segments:
  possession:
    text: >-
      Recreational possession is illegal. Small amounts for personal use are often dealt with by a
      fine, a security measure or referral to treatment, but imprisonment remains possible and
      foreigners can be deported.
    sources:
      - cl
  cultivation:
    text: Cultivation is a crime; only licensed medical producers may grow.
    sources:
      - hs
      - cl
  enforcement:
    text: Fines or treatment for small amounts in many cases, prison for larger amounts and trafficking.
    sources:
      - cl
  sharing:
    text: Supply is trafficking.
    sources:
      - cl
  consumption:
    text: Recreational use is prohibited.
    sources:
      - cl
  access:
    text: >-
      No adult-use source. Registered patients can obtain medical cannabis products through licensed
      pharmacies.
    sources:
      - hs
      - ed
context:
  production:
    text: >-
      Law 242 of October 2021 — the first medical cannabis law in Central America — and its
      regulations created a national directorate that issues a limited number of production
      licences.
    sources:
      - hs
      - ed
  products:
    text: Prescription medical products only.
    sources:
      - hs
  medical:
    text: >-
      Any licensed doctor who has completed health-ministry training may prescribe, for qualifying
      conditions such as chronic pain, epilepsy and multiple sclerosis. Patients are entered in a
      national registry.
    sources:
      - hs
      - cl
  consequences:
    text: A drug conviction is a criminal record; foreigners risk deportation.
    sources:
      - cl
sources:
