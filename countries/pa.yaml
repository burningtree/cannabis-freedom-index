name: Panama
region: North America
iso_numeric: 591
recreational: illegal
medical: limited
updated: 2026-10-25
summary: Medical cannabis has a legal framework dating from 2021; licensed CBD sales began in 2026. Recreational cannabis remains illegal.
scores:
  possession: 1
  cultivation: 1
  enforcement: 2
  sharing: 1
  consumption: 1
  access: 0
segments:
  possession:
    text: >-
      Recreational possession is illegal. Small amounts for personal use are often dealt with by a
      fine, a security measure or referral to treatment, but imprisonment remains possible and
      foreigners can be deported.[@cl]
      [A separate small-possession penalty began in 2008.](/history/panama-personal-possession-code-2008/)
      [Penalties were recast in 1986.](/history/panama-drug-law-penal-revision-1986/)
    sources:
      - cl
    penalties:
      - label: Small amounts for personal use
        treatment: criminal
        term: Personal possession
        note: Often a fine, a security measure or referral to treatment; imprisonment remains possible
  cultivation:
    text: >-
      Cultivation is a crime; only licensed medical producers may grow.[@hs,cl]
      [A man got 80 months for 12 plants in 2023.](/history/panama-los-santos-cultivation-2023/)
      [The 1986 revision recast penalties.](/history/panama-drug-law-penal-revision-1986/)
    sources:
      - hs
      - cl
    penalties:
      - label: Unauthorised cultivation (article 314)
        treatment: criminal
        term: Unlawful cultivation
        note: 80 months' imprisonment in the reported 2023 Los Santos case (12 plants, 279 seeds)
  enforcement:
    text: >-
      Fines or treatment for small amounts in many cases, prison for larger amounts and trafficking.[@cl]
      [A separate small-possession penalty began in 2008.](/history/panama-personal-possession-code-2008/)
    sources:
      - cl
  sharing:
    text: >-
      Supply is trafficking.[@cl]
      [Penalties were recast in 1986.](/history/panama-drug-law-penal-revision-1986/)
    sources:
      - cl
  consumption:
    text: >-
      Recreational use is prohibited.[@cl]
      [A Canal Zone committee found little harm in 1926.](/history/panama-canal-zone-committee-1926/)
    sources:
      - cl
  access:
    text: >-
      No adult-use source. Law 242 created a medical framework in 2021, but the ministry still
      prohibited cannabis-product sales in July 2023.[@sales2023,register2026] A specialist pharmacy opened in January 2026;
      the current drug-directorate register lists CBD products, without establishing an available THC
      medicine route.[@pharmacy2026,register2026]
      [Sales stayed prohibited in 2023.](/history/panama-sales-still-prohibited-2023/)
      [The first pharmacy opened in 2026.](/history/panama-first-cannabis-pharmacy-2026/)
      [Patient registration was set out in 2026.](/history/panama-patient-registration-2026/)
    sources:
      - sales2023
      - register2026
      - pharmacy2026
words:
  - { word: Canyac, lang: Panamanian Spanish, meaning: "local name recorded in the 1935 Judicial Register", atlas: canyac, sources: [wikipa] }
context:
  recreational:
    text: >-
      There is no legal recreational supply. Small personal amounts are often met with a fine,
      a security measure or treatment referral, but prison remains possible and foreigners can
      be deported.[@cl] Growing and supply stay criminal outside licensed medical
      production.[@hs,cl]
      [A separate small-possession penalty began in 2008.](/history/panama-personal-possession-code-2008)
      [A Canal Zone committee found little harm in 1926.](/history/panama-canal-zone-committee-1926/)
    sources:
      - cl
      - hs
  production:
    status: medical
    text: >-
      Law 242 of October 2021 — the first medical cannabis law in Central America — and its
      regulations created a national directorate that issues a limited number of production
      licences.[@hs,ed]
      [Medical cannabis became law in 2021.](/history/panama-medical-2021/)
      [Regulations followed in 2022.](/history/panama-medical-regulations-2022/)
    sources:
      - hs
      - ed
  medical:
    text: >-
      Executive Decree 6 of April 2025 revised the 2021 framework.[@decree2025] In June 2026 the ministry approved
      patient and companion forms: a qualified doctor certifies treatment, the ministry verifies
      registration, and an approved patient receives a card for authorised pharmacies.[@registration2026] The
      announcement said the forms would be available shortly.[@registration2026] The drug directorate lists Cannapharma CBD products dated 22 January 2026; that listing does not
      establish retail availability of controlled THC medicines.[@register2026]
      [Medical cannabis became law in 2021.](/history/panama-medical-2021/)
      [The first pharmacy opened in 2026.](/history/panama-first-cannabis-pharmacy-2026/)
      [Patient registration was set out in 2026.](/history/panama-patient-registration-2026/)
    sources:
      - decree2025
      - registration2026
      - register2026
  consequences:
    text: >-
      A drug conviction is a criminal record; foreigners risk deportation.[@cl]
      [Penalties were recast in 1986.](/history/panama-drug-law-penal-revision-1986/)
    sources:
      - cl
  planting:
    seeds: illegal
    seeds_trade: banned
    clones: illegal
    clones_trade: banned
    text: >-
      The Penal Code punishes sowing, growing or keeping the seeds of plants from which drugs
      are made.[@mp23] In July 2023 a man in Los Santos was sentenced to 80 months for "cultivation
      and custody of seeds and plants of marijuana" under Article 314, after police found 12
      plants and 279 seeds.[@mp23] Licensed medical cannabis producers work under a separate law.[@hs]
      [A man got 80 months for 12 plants in 2023.](/history/panama-los-santos-cultivation-2023/)
    sources:
      - mp23
      - hs
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited.[@hs,cl]
      [Penalties were recast in 1986.](/history/panama-drug-law-penal-revision-1986/)
    sources:
      - hs
      - cl
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for residents or visitors.[@registration2026,register2026] The medical framework requires
      certification and approved registration for controlled medicines; a pharmacy selling CBD does
      not establish access to THC products.[@registration2026,register2026]
      [Patient registration was set out in 2026.](/history/panama-patient-registration-2026/)
    sources:
      - registration2026
      - register2026
  driving:
    status: impairment
    text: >-
      Traffic Regulation articles 142–143 prohibit driving under the effects of
      narcotics and provide for licence retention and removal of the vehicle when
      intoxication is established.[@traffic640] The transport authority's published offence table
      still directs drug-influenced driving to articles 251–252, rather than the
      ordinary fixed-fine rows.[@trafficlookup] Article 251's published schedule provides B/.150
      and three months' licence suspension for the first offence, with higher fines
      and longer suspensions for repetition.[@traffic640] Where intoxication is aggravated by a
      crash, damage to another person's property or injury, article 252's first-offence
      schedule provides B/.1,000 and a one-year suspension; the third such offence
      brings definitive cancellation.[@traffic640] Seminars or talks are also specified.[@traffic640] The
      2025 amendment is recorded as changing articles 241 and 243, rather than these
      intoxication schedules.[@trafficamendments] No numerical THC cutoff or prescribed-cannabis
      exception was established in the reviewed provisions; alcohol concentration
      limits must not be substituted for a cannabis allowance.
    sources:
      - traffic640
      - trafficlookup
      - trafficamendments
  black_market:
    text: >-
      Figures reported by the government to the UN drugs office record 24,290 kg of herbal
      cannabis seized in 2024, against 33,610 kg in 2023.[@unodc_szr] The UN publishes them as
      kilogram equivalents, and countries count seizures differently, so the figures are
      not comparable across borders.[@unodc_szr]
    sources:
      - unodc_szr
  arrests:
    text: >-
      The Ministry of Public Security reported that in the first six months of 2024 it
      carried out 80 operations against drug trafficking, seizing 58.5 tonnes of drugs,
      and arrested 181 people for trafficking and 1,730 for micro-trafficking, meaning
      small-scale selling.[@pamerica24] The figures are not split by drug.[@pamerica24]
    sources:
      - pamerica24
  hemp:
    status: none
    text: >-
      No hemp exception operates. Growing, even of seeds, is punishable under the Penal Code
      outside licensed medical production, and the sources read establish no low-THC
      carve-out.[@mp23,hs]
      [A man got 80 months for 12 plants in 2023.](/history/panama-los-santos-cultivation-2023/)
    sources:
      - mp23
      - hs
  culture:
    text: >-
      Panama argued about cannabis early. After an American seaman was jailed for a year in
      1926 for smoking cannabis cigarettes, an official Canal Zone committee studied 17
      subjects and found only minor effects, recommending against special legislation —
      advice the US Army revisited in 1933.[@wikipa] A decade later the courts had their own
      word for it: the 1935 Judicial Register calls cannabis "commonly known locally as
      Canyac or Kan Jac", and the name is kept in the atlas as [Canyac](/culture/language/canyac/).[@wikipa]
      [A Canal Zone committee found little harm in 1926.](/history/panama-canal-zone-committee-1926/)
      [Panama called cannabis Canyac in 1935.](/history/panama-local-name-1935/)
    sources:
      - wikipa
