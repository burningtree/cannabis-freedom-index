name: Panama
region: North America
iso_numeric: 591
recreational: illegal
medical: limited
updated: 2026-10-25
summary: Medical cannabis has a legal framework dating from 2021; licensed CBD sales began in 2026. Recreational cannabis remains illegal.
scores:
  possession: 1
  cultivation: 1
  enforcement: 2
  sharing: 1
  consumption: 1
  access: 0
segments:
  possession:
    text: >-
      Recreational possession is illegal. Small amounts for personal use are often dealt with by a
      fine, a security measure or referral to treatment, but imprisonment remains possible and
      foreigners can be deported.
    sources:
      - cl
  cultivation:
    text: Cultivation is a crime; only licensed medical producers may grow.
    sources:
      - hs
      - cl
  enforcement:
    text: Fines or treatment for small amounts in many cases, prison for larger amounts and trafficking.
    sources:
      - cl
  sharing:
    text: Supply is trafficking.
    sources:
      - cl
  consumption:
    text: Recreational use is prohibited.
    sources:
      - cl
  access:
    text: >-
      No adult-use source. Law 242 created a medical framework in 2021, but the ministry still
      prohibited cannabis-product sales in July 2023. A specialist pharmacy opened in January 2026;
      the current drug-directorate register lists CBD products, without establishing an available THC
      medicine route.
    sources:
      - sales2023
      - register2026
      - pharmacy2026
context:
  recreational:
    text: >-
      There is no legal recreational supply. Small personal amounts are often met with a fine,
      a security measure or treatment referral, but prison remains possible and foreigners can
      be deported.[@cl] Growing and supply stay criminal outside licensed medical
      production.[@hs,cl]
    sources:
      - cl
      - hs
  production:
    status: medical
    text: >-
      Law 242 of October 2021 — the first medical cannabis law in Central America — and its
      regulations created a national directorate that issues a limited number of production
      licences.
    sources:
      - hs
      - ed
  products:
    text: >-
      The drug directorate lists Cannapharma CBD products dated 22 January 2026. That listing does not
      establish retail availability of controlled THC medicines.
    sources:
      - register2026
  medical:
    text: >-
      Executive Decree 6 of April 2025 revised the 2021 framework. In June 2026 the ministry approved
      patient and companion forms: a qualified doctor certifies treatment, the ministry verifies
      registration, and an approved patient receives a card for authorised pharmacies. The
      announcement said the forms would be available shortly.
    sources:
      - decree2025
      - registration2026
  consequences:
    text: A drug conviction is a criminal record; foreigners risk deportation.
    sources:
      - cl
  planting:
    seeds: illegal
    seeds_trade: banned
    clones: illegal
    clones_trade: banned
    text: >-
      The Penal Code punishes sowing, growing or keeping the seeds of plants from which drugs
      are made. In July 2023 a man in Los Santos was sentenced to 80 months for "cultivation
      and custody of seeds and plants of marijuana" under Article 314, after police found 12
      plants and 279 seeds. Licensed medical cannabis producers work under a separate law.
    sources:
      - mp23
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited.
    sources:
      - hs
      - cl
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for residents or visitors. The medical framework requires
      certification and approved registration for controlled medicines; a pharmacy selling CBD does
      not establish access to THC products.
    sources:
      - registration2026
      - register2026
  driving:
    status: impairment
    text: >-
      Traffic Regulation articles 142–143 prohibit driving under the effects of
      narcotics and provide for licence retention and removal of the vehicle when
      intoxication is established. The transport authority's published offence table
      still directs drug-influenced driving to articles 251–252, rather than the
      ordinary fixed-fine rows. Article 251's published schedule provides B/.150
      and three months' licence suspension for the first offence, with higher fines
      and longer suspensions for repetition. Where intoxication is aggravated by a
      crash, damage to another person's property or injury, article 252's first-offence
      schedule provides B/.1,000 and a one-year suspension; the third such offence
      brings definitive cancellation. Seminars or talks are also specified. The
      2025 amendment is recorded as changing articles 241 and 243, rather than these
      intoxication schedules. No numerical THC cutoff or prescribed-cannabis
      exception was established in the reviewed provisions; alcohol concentration
      limits must not be substituted for a cannabis allowance.
    sources:
      - traffic640
      - trafficlookup
      - trafficamendments
  black_market:
    text: >-
      Figures reported by the government to the UN drugs office record 24,290 kg of herbal
      cannabis seized in 2024, against 33,610 kg in 2023. The UN publishes them as
      kilogram equivalents, and countries count seizures differently, so the figures are
      not comparable across borders.
    sources:
      - unodc_szr
  arrests:
    text: >-
      The Ministry of Public Security reported that in the first six months of 2024 it
      carried out 80 operations against drug trafficking, seizing 58.5 tonnes of drugs,
      and arrested 181 people for trafficking and 1,730 for micro-trafficking, meaning
      small-scale selling. The figures are not split by drug.
    sources:
      - pamerica24
