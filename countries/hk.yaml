name: Hong Kong
region: Asia
iso_numeric: 344
dependency:
  of: cn
  kind: Special administrative region
  note: >-
    Hong Kong is a special administrative region of China with its own legal system and laws. Its
    drug law, the Dangerous Drugs Ordinance, is separate from mainland China's.
recreational: illegal
medical: none
updated: '2026-10-27'
summary: >-
  Possession and use carry up to seven years in prison; very small first-offence personal-use cases
  may receive a fine, probation or community service. Growing cannabis carries up to fifteen years.
  CBD has also been controlled since February 2023.
scores:
  possession: 1
  cultivation: 0
  enforcement: 2
  sharing: 0
  consumption: 0
  access: 0
segments:
  possession:
    text: >-
      Possession carries up to seven years and HK$1 million on indictment, or three years and
      HK$100,000 on summary conviction. For very small quantities clearly for personal use, courts
      often consider fines, probation or community service, especially for first offenders.[@clic]
    sources:
      - clic
    currency: HKD
    penalties:
      - label: Possession (indictment)
        treatment: criminal
        term: Possession
        prison: 7 years
        fine: 1000000
      - label: Possession (summary conviction)
        treatment: criminal
        term: Possession
        prison: 3 years
        fine: 100000
        note: No amount threshold; first offenders with very small quantities often get fines, probation or community service
  cultivation:
    text: >-
      Growing any cannabis plant carries up to fifteen years and HK$100,000.[@hkpf] It is a
      separate offence from manufacturing a dangerous drug, which carries up to life.[@hkpf] The
      2023 court
      guidelines use estimated annual yield, with the grower’s role, scale of operation and other
      circumstances affecting sentence; under 5 kg falls below two years, while above 150 kg falls
      above ten years.[@guidelines]
    sources:
      - hkpf
      - guidelines
    currency: HKD
    penalties:
      - label: Cultivating a cannabis plant
        treatment: criminal
        term: Cultivation
        prison: 15 years
        fine: 100000
      - upto: 5 kg
        treatment: criminal
        term: Cultivation
        prison: 2 years
        note: Estimated annual yield; 2023 guideline band
      - over: 5 kg
        upto: 50 kg
        treatment: criminal
        term: Cultivation
        prison: 7 years
      - over: 50 kg
        upto: 150 kg
        treatment: criminal
        term: Cultivation
        prison: 10 years
      - over: 150 kg
        treatment: criminal
        term: Cultivation
        prison_min: 10 years
  enforcement:
    text: >-
      Courts generally consider a treatment-suitability report before custody; for very small
      personal-use amounts, first offenders may receive non-custodial sentences, while repeat
      offenders may be sent to a Drug Addiction Treatment Centre.[@clic] In 2000, an appeal reduced
      a repeat offender’s sentence for 1.18 g of cannabis from six months to two.[@phung] Drug
      arrests across all substances reached 4,108 in 2025; the reported conviction rate for drug
      prosecutions was 86%.[@nd25]
    sources:
      - clic
      - phung
      - nd25
  sharing:
    text: >-
      Trafficking includes giving away any amount and carries up to life imprisonment and HK$5
      million.[@hkpf] Since January 2023, herbal cannabis and resin follow the same trafficking
      sentencing scale, beginning with a band of up to sixteen months for under 2 kg, with
      individual circumstances affecting the result.[@guidelines]
    sources:
      - hkpf
      - guidelines
    currency: HKD
    penalties:
      - label: Trafficking (including giving away any amount)
        treatment: criminal
        term: Trafficking
        fine: 5000000
        note: Life imprisonment and HK$5 million maximum
      - label: Trafficking, summary conviction
        treatment: criminal
        term: Trafficking
        prison: 3 years
        fine: 500000
      - upto: 2 kg
        treatment: criminal
        term: Trafficking
        prison_min: 1 year
        prison: 2 years
        note: Herbal cannabis and resin starting band; 2023 guideline range up to sixteen months
  consumption:
    text: >-
      Smoking, inhaling, ingesting or injecting a dangerous drug is an offence carrying up to seven
      years and HK$1 million.[@hkpf] CBD came under those controls on 1 February 2023.[@cbdcontrol]
    sources:
      - hkpf
      - cbdcontrol
    currency: HKD
    penalties:
      - label: Consuming a dangerous drug (indictment)
        treatment: criminal
        term: Consumption
        prison: 7 years
        fine: 1000000
      - label: Consuming a dangerous drug (summary)
        treatment: criminal
        term: Consumption
        prison: 3 years
        fine: 100000
  access:
    text: >-
      Possession and use must comply with the ordinance or a licence granted by the Director of
      Health. Cannabis and cannabis resin are excluded from the ordinary professional and pharmacy
      authorities in sections 22 and 24.[@law]
    sources:
      - law
context_not_applicable:
  death_penalty:
    text: >-
      Hong Kong's Legislative Council passed the bill abolishing the death penalty on 21 April
      1993, replacing it with life imprisonment; no cannabis offence carries a capital sentence.[@wikipdp]
    sources: [wikipdp]
context:
  recreational:
    text: >-
      There is no legal way to get cannabis. Possession and use carry up to seven years;
      first offenders with very small quantities often get fines, probation or community
      service instead.[@clic] CBD has been a controlled dangerous drug since 1 February
      2023.[@cbdcontrol]
    sources:
      - clic
      - cbdcontrol
  production:
    status: none
    text: >-
      No licensed cannabis production is documented. Manufacturing a dangerous drug carries up to
      life imprisonment and HK$5 million; cultivating a cannabis plant is a separate offence
      carrying up to fifteen years and HK$100,000.[@hkpf]
    sources:
      - hkpf
  medical:
    text: >-
      Cannabis and cannabis resin are excluded from the ordinary professional and pharmacy
      authorities in the ordinance, so a doctor cannot supply THC cannabis merely as a doctor.[@law]
      CBD is a listed dangerous drug but not excluded in the same way; CBD pharmaceutical products
      have been prescription-only since December 2019, and the government reported no registered
      CBD medicine in October 2022.[@cbdbrief,law]
    sources:
      - law
      - cbdbrief
  consequences:
    text: >-
      Among people under 21 reported to the Central Registry of Drug Abuse in 2025, cannabis was the
      second most commonly reported drug after etomidate. The registry recorded 5,077 people across
      all ages and drugs.[@nd25]
    sources:
      - nd25
  clubs:
    status: none
    text: >-
      Giving away cannabis falls within trafficking, which carries up to life imprisonment and HK$5
      million. Growing cannabis is also prohibited.[@hkpf]
    sources:
      - hkpf
  visitors:
    status: none
    text: >-
      Unauthorised import or export of controlled cannabis products can bring trafficking charges,
      with a maximum of life imprisonment and HK$5 million.[@ndlaw] Travellers must also leave CBD and
      CBD products behind: CBD has been controlled as a dangerous drug since February
      2023.[@cbdcontrol] Simple possession is a separate offence carrying up to seven years and HK$1
      million on indictment.[@hkpf] A passenger arriving from the United States in March 2023 was
      later jailed on CBD and ketamine possession and injection-equipment counts.[@cbdcase]
    sources:
      - ndlaw
      - cbdcontrol
      - hkpf
      - cbdcase
  hemp:
    status: none
    text: >-
      No hemp exception and no THC threshold. "Cannabis" covers any plant or part containing THC and
      its viable seeds, and cultivation is prohibited except for the Government Chemist.[@law]
      Industrial hemp therefore cannot lawfully be grown.[@law]
    sources:
      - law
  planting:
    seeds: illegal
    seeds_trade: banned
    clones: illegal
    clones_trade: banned
    text: >-
      Viable cannabis seeds are expressly part of the legal definition of cannabis, so possessing,
      supplying or importing them is illegal, and germinating them is cultivation.[@law] Clones are
      living plants and fall under the cultivation offence.[@law] The status of non-viable seeds is
      unclear.[@law]
    sources:
      - law
  driving:
    status: zero
    text: >-
      Road Traffic Ordinance section 39K makes it an offence to drive, attempt to drive or be in
      charge of a vehicle with any concentration of cannabis in blood or urine.[@road39k] Indictment
      carries three years and HK$25,000, summary conviction six months and HK$10,000 for a first
      offence, and disqualification for at least two years, or five on a repeat.[@road39k] The
      medical defence covers a drug prescribed or supplied by a healthcare professional; cannabis is
      not prescribable, so it does not help a recreational user.[@road39k]
    sources:
      - road39k
  black_market:
    text: >-
      UNODC records 4,086 kg of herbal cannabis and 296 kg of resin seized in 2024, against
      3,069 kg of herb and 296 kg of resin in 2023; the government-reported herb figure is much
      higher than the "about 2,800 kg" Customs figure quoted by RTHK, so the two are not one
      series.[@unodc_szr,rthk24] Major cases include 500 kg of buds in a Canadian soybean shipment
      in September 2024, 138 kg in a frozen-pork container in March 2025, and a record 535 kg from
      Thailand in September 2026.[@customs24b,customs25, customs26]
    sources:
      - unodc_szr
      - rthk24
      - customs24b
      - customs25
      - customs26
  arrests:
    text: >-
      All-drug arrests were 3,243 in 2024, 4,108 in 2025 and 1,749 in the first half of 2026; the
      conviction rate for drug prosecutions was 86% in 2025 and 87% in the first half of 2026.[@nd24,nd25,nd26h1]
      Reported cannabis users were 678 in 2024, 705 in 2025 and 364 in the first half of 2026.[@nd24,nd25,nd26h1]
      No cannabis-only arrest count is published.[@nd25]
    sources:
      - nd24
      - nd25
      - nd26h1
