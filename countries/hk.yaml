name: Hong Kong
region: Asia
iso_numeric: 344
dependency:
  of: cn
  kind: Special administrative region
  note: >-
    Hong Kong is a special administrative region of China with its own legal system and laws. Its
    drug law, the Dangerous Drugs Ordinance, is separate from mainland China's.
recreational: illegal
medical: none
updated: 2026-10-23
summary: >-
  Possessing or consuming cannabis carries up to seven years in prison, and trafficking up to life.
  First offenders with very small amounts are usually fined, put on probation or given community
  service, while repeat offenders are sent to drug treatment centres. Since February 2023 even CBD
  has been a dangerous drug.
