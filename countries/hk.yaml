segments:
  possession:
    text: >-
      Possession of a dangerous drug, cannabis included, carries up to seven years in prison and a
      HK$1 million fine on indictment, or three years and HK$100,000 on summary conviction. For very
      small amounts clearly for personal use, courts often consider fines, probation or community
      service, especially for first offenders.
    sources:
      - clic
  cultivation:
    text: >-
      Cultivating any cannabis plant carries up to 15 years in prison and a HK$100,000
      fine.[@hkpf] Manufacturing a dangerous drug is a separate offence, with up to life
      imprisonment and a HK$5 million fine.[@hkpf] There is no lawful home growing.
    sources:
      - hkpf
  enforcement:
    text: >-
      Repeat offenders are often sent to a Drug Addiction Treatment Centre, and before any custodial
      sentence the court must consider a report on suitability for treatment. Arrests for drug
      offences rose 27% in 2025, to 4,108; among those under 21 they rose 90%, with etomidate,
      cannabis and cocaine the main drugs. The conviction rate was 86%.
    sources:
      - clic
      - nd25
  sharing:
    text: >-
      Supplying drugs is trafficking, with up to life imprisonment and a HK$5 million fine. More than
      half of young offenders jailed for trafficking in 2025 received over five years, and the
      government says youth is not a mitigating factor.
    sources:
      - hl
      - nd25
  consumption:
    text: >-
      Consuming a dangerous drug is an offence in itself, with the same maximum of seven years as
      possession. In July 2023 a woman found with two bottles of CBD care products, along with
      ketamine and syringes, was jailed for two months, the first prison sentence under the CBD ban.
    sources:
      - hl
      - voa
  access:
    text: >-
      No legal source. Exemptions exist only under licences from the Director of Health and for
      authorised persons such as registered medical practitioners; there is no medical cannabis
      programme.
    sources:
      - hl
context:
  production:
    text: >-
      There is no licensed production. Manufacturing a dangerous drug carries up to life
      imprisonment and a HK$5 million fine.[@hkpf] Growing a cannabis plant is not that
      offence: the police list it separately, at up to 15 years and a HK$100,000 fine.[@hkpf]
    sources:
      - hkpf
  products:
    text: >-
      None. From 1 February 2023 CBD became a dangerous drug, and products containing it, from food
      and supplements to cosmetics, became illegal to sell, possess or import. Customs made its first
      arrest a week later, over two bottles of CBD oil from Denmark.
    sources:
      - hl
  medical:
    text: >-
      No medical cannabis programme. Use of controlled substances is limited to authorised persons
      and licences granted by the Director of Health.
    sources:
      - hl
  consequences:
    text: >-
      Cannabis is the second most common drug among reported abusers under 21, after etomidate.
      Reported drug abusers of all ages numbered 5,077 in 2025.
    sources:
      - nd25
  clubs:
    status: none
    text: >-
      No cannabis clubs are known. Any supply is prosecuted as trafficking.
    sources:
      - hl
  visitors:
    status: none
    text: >-
      There is no legal supply for anyone. Customs screens passengers, cargo and post for CBD, and
      the first person jailed under the CBD ban was a traveller arriving from the United States.
    sources:
      - hl
      - voa
