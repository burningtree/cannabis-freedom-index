name: Tanzania
region: Africa
iso_numeric: 834
recreational: illegal
medical: none
updated: "2026-10-23"
summary: >-
  Mainland Tanzania provides at least thirty years for unlawful cannabis cultivation. A separate
  small-personal-use tier allows a fine, prison or both; trafficking penalties can reach life
  imprisonment.
scores:
  possession: 1
  cultivation: 0
  enforcement: 2
  sharing: 0
  consumption: 1
  access: 0
segments:
  possession:
    text: >-
      The Act provides a separate penalty tier for small quantities proved to be for personal
      consumption, with the burden on the holder.[@act2023] For the residual drug group, it
      allows a fine of at least 500,000 shillings, a three-year prison term, or both.[@act2023]
      A 2022 appeal concerned a thirty-year cannabis-possession sentence, which was reversed
      because the evidence's chain of custody was not established.[@agn2022]
    sources:
      - act2023
      - agn2022
  cultivation:
    text: >-
      Unlawful cultivation of prohibited plants carries at least thirty years in prison on the
      mainland.[@act2023] In March 2022 the Court of Appeal upheld that sentence for a man
      linked to a field of 535 cannabis plants.[@ham2022]
    sources:
      - act2023
      - ham2022
  enforcement:
    text: >-
      Long sentences have been imposed for cannabis: the Court of Appeal upheld thirty years for
      cultivation in one 2022 case.[@ham2022] In another it overturned a thirty-year possession
      sentence because the prosecution had not established the chain of custody of the cannabis
      evidence.[@agn2022] The small-personal-use tier in the Act allows a fine, prison or
      both.[@act2023]
    sources:
      - ham2022
      - agn2022
      - act2023
  sharing:
    text: >-
      Trafficking is defined to include giving, supplying, storing, possessing and distributing
      controlled drugs.[@act2023] The revised Act sets at least thirty years for trafficking not
      more than 100 kg of cannabis, with larger amounts in the life-imprisonment tier.[@act2023]
      These trafficking quantities are separate from the small-personal-use tier.[@act2023]
    sources:
      - act2023
  consumption:
    text: >-
      The Act's small-quantity and consumption rule allows a fine of at least 500,000 shillings,
      three years in prison, or both for drugs outside its specially listed group.[@act2023] It
      also contains a separate offence concerning smoking, inhaling and other drug
      use.[@act2023]
    sources:
      - act2023
  access:
    text: None.
    sources:
      - uk
context:
  production:
    text: >-
      None. An MP's call to legalise bhang for export has not been taken up, though amendments
      to the drug law were proposed in 2026.
    sources:
      - aa
  products:
    text: None; CBD is treated as cannabis.
    sources:
      - uk
  medical:
    text: No medical cannabis.
    sources:
      - wiki
      - uk
  consequences:
    text: A conviction is a criminal record.
    sources:
      - wiki
  planting:
    seeds: grey
    seeds_trade: open
    clones: illegal
    clones_trade: banned
    text: >-
      The Drug Control and Enforcement Act defines cannabis as any part of the plant "excluding
      the seeds", so seed on its own is not a narcotic drug. Cultivating is defined to include
      planting and scattering the seed, and growing the plant is an offence. A bill presented to
      Parliament on 1 September 2026 would make holding or distributing seeds of prohibited
      plants an offence whatever their intended use; it had not been reported as passed.
    sources:
      - dcea
      - dn26
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited.
    sources:
      - wiki
      - uk
  visitors:
    status: none
    text: >-
      Mainland law provides no recreational retail permission for visitors.[@act2023] Cannabis
      possession and supply fall within the drug-control offences, and the separate personal-use
      tier requires proof of personal consumption rather than sale or distribution.[@act2023]
    sources:
      - act2023
  black_market:
    text: >-
      Figures reported by the government to the UN drugs office record 2,303,200 kg of herbal
      cannabis seized in 2024, against 1,757,560 kg in 2023. The UN publishes them as kilogram
      equivalents, and countries count seizures differently, so the figures are not comparable
      across borders.
    sources:
      - unodc_szr
  driving:
    status: impairment
    text: >-
      On the mainland, the Road Traffic Act's 2023 revised edition section 53 prohibits driving,
      attempting to drive or being in charge on a road or public place while drugs make proper
      control impossible. Section 75(2)(b) provides TSh15,000–50,000 or two–five years in
      prison; section 33(1)(a) requires licence cancellation and disqualification for at least
      three years on a first section 53 conviction. These are the published 2023 provisions, not
      a verified 2026 ticket tariff. Zanzibar has a separate Road Transport Act: section
      123(1)(a) also uses impaired control, and its published 2003 text provides a first-offence
      minimum fine equivalent to US$75 in shillings or at least six months in prison, or both.
      Repeat convictions normally entail at least fifteen months' disqualification, subject to
      the court's special-reasons exception. Later Zanzibar amendments, current testing
      procedures and a numeric THC cutoff were not verified; alcohol thresholds must not be
      applied to cannabis.
    sources:
      - traffic2023
      - zanzibar_traffic
