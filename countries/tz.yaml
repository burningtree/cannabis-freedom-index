segments:
  possession:
    text: >-
      Cannabis (bangi) is banned for all purposes under the Drug Control and Enforcement Act.
      Possession or use of a small quantity — under 50 g of plant or 5 g of resin — is punished with
      a large fine; larger quantities bring one to five years in prison.
    sources:
      - wiki
      - uk
  cultivation:
    text: >-
      Cultivation is a crime; police regularly destroy fields, especially in the north and the
      southern highlands.
    sources:
      - wiki
  enforcement:
    text: >-
      Fines for small amounts, prison above the threshold, and very long sentences for dealing.
      The Drug Control and Enforcement Authority reported seizing a record 2.3 million kg of
      drugs in 2024, with marijuana at the top of the list.
    sources:
      - citizen25
      - wiki
  sharing:
    text: >-
      Sale and trafficking carry ten years to life. The government's amendment bill of October
      2017 defines trafficking to include giving, supplying, storing and possessing, and sets
      life imprisonment for more than 50 kg of cannabis and thirty years for 50 kg or less; the
      consolidated Act as now in force could not be opened to confirm the final wording.
    sources:
      - wiki
      - uk
      - bill17
  consumption:
    text: >-
      Use is an offence: possession or use of a small quantity, under 50 g of plant, is punished
      with a large fine.
    sources:
      - uk
  access:
    text: None.
    sources:
      - uk
context:
  production:
    text: >-
      None. An MP's call to legalise bhang for export has not been taken up, though amendments to
      the drug law were proposed in 2026.
    sources:
      - aa
  products:
    text: None; CBD is treated as cannabis.
    sources:
      - uk
  medical:
    text: No medical cannabis.
    sources:
      - wiki
      - uk
  consequences:
    text: A conviction is a criminal record.
    sources:
      - wiki
  planting:
    seeds: grey
    seeds_trade: open
    clones: illegal
    clones_trade: banned
    text: >-
      The Drug Control and Enforcement Act defines cannabis as any part of the plant
      "excluding the seeds", so seed on its own is not a narcotic drug. Cultivating is defined
      to include planting and scattering the seed, and growing the plant is an offence. A bill
      presented to Parliament on 1 September 2026 would make holding or distributing seeds of
      prohibited plants an offence whatever their intended use; it had not been reported as passed.
    sources:
      - dcea
      - dn26
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited.
    sources:
      - wiki
      - uk
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. The 2017 amendment bill defines
      trafficking to include possessing, storing and giving, with thirty years for 50 kg of
      cannabis or less.
    sources:
      - bill17
      - uk
  black_market:
    text: >-
      Figures reported by the government to the UN drugs office record 2,303,200 kg of
      herbal cannabis seized in 2024, against 1,757,560 kg in 2023. The UN publishes them
      as kilogram equivalents, and countries count seizures differently, so the figures
      are not comparable across borders.
    sources:
      - unodc_szr
  driving:
    status: impairment
    text: >-
      On the mainland, the Road Traffic Act's 2023 revised edition section 53 prohibits driving,
      attempting to drive or being in charge on a road or public place while drugs make proper
      control impossible. Section 75(2)(b) provides TSh15,000–50,000 or two–five years in prison;
      section 33(1)(a) requires licence cancellation and disqualification for at least three years
      on a first section 53 conviction. These are the published 2023 provisions, not a verified
      2026 ticket tariff. Zanzibar has a separate Road Transport Act: section 123(1)(a) also uses
      impaired control, and its published 2003 text provides a first-offence minimum fine equivalent
      to US$75 in shillings or at least six months in prison, or both. Repeat convictions normally
      entail at least fifteen months' disqualification, subject to the court's special-reasons
      exception. Later Zanzibar amendments, current testing procedures and a numeric THC cutoff
      were not verified; alcohol thresholds must not be applied to cannabis.
    sources:
      - traffic2023
      - zanzibar_traffic
