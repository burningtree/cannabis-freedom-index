name: Tanzania
region: Africa
iso_numeric: 834
recreational: illegal
medical: none
updated: 2026-10-27
summary: >-
  Mainland Tanzania provides at least thirty years for unlawful cannabis cultivation. A separate
  small-personal-use tier allows a fine, prison or both; trafficking penalties can reach life
  imprisonment.
scores:
  possession: 1
  cultivation: 0
  enforcement: 2
  sharing: 0
  consumption: 1
  access: 0
words:
  - { word: Bangi, lang: Swahili, meaning: "cannabis; the Swahili word, linked to bhang and Indian Ocean exchange", sources: [wiki] }
segments:
  possession:
    text: >-
      The Act provides a separate penalty tier for small quantities proved to be for personal
      consumption, with the burden on the holder.[@act2023] For the residual drug group, it
      allows a fine of at least 500,000 shillings, a three-year prison term, or both.[@act2023]
      A 2022 appeal concerned a thirty-year cannabis-possession sentence, which was reversed
      because the evidence's chain of custody was not established.[@agn2022]
    sources:
      - act2023
      - agn2022
    currency: TZS
    penalties:
      - label: Small quantity proved for personal consumption
        treatment: criminal
        term: Possession
        fine_min: 500000
        prison: 3 years
        note: Fine of at least 500,000 shillings, a three-year prison term, or both
  cultivation:
    text: >-
      Unlawful cultivation of prohibited plants carries at least thirty years in prison on the
      mainland.[@act2023] In March 2022 the Court of Appeal upheld that sentence for a man
      linked to a field of 535 cannabis plants.[@ham2022]
    sources:
      - act2023
      - ham2022
    currency: TZS
    penalties:
      - label: Unlawful cultivation of prohibited plants (mainland)
        treatment: criminal
        term: Cultivation
        prison_min: 30 years
        note: At least thirty years in prison; no fine tier stated
  enforcement:
    text: >-
      Long sentences have been imposed for cannabis: the Court of Appeal upheld thirty years for
      cultivation in one 2022 case.[@ham2022] In another it overturned a thirty-year possession
      sentence because the prosecution had not established the chain of custody of the cannabis
      evidence.[@agn2022] The small-personal-use tier in the Act allows a fine, prison or
      both.[@act2023]
    sources:
      - ham2022
      - agn2022
      - act2023
  sharing:
    text: >-
      Trafficking is defined to include giving, supplying, storing, possessing and distributing
      controlled drugs.[@act2023] The revised Act sets at least thirty years for trafficking not
      more than 100 kg of cannabis, with larger amounts in the life-imprisonment tier.[@act2023]
      These trafficking quantities are separate from the small-personal-use tier.[@act2023]
    sources:
      - act2023
    currency: TZS
    penalties:
      - label: Trafficking not more than 100 kg of cannabis
        treatment: criminal
        term: Trafficking
        prison_min: 30 years
        note: At least thirty years; larger amounts fall in the life-imprisonment tier
  consumption:
    text: >-
      The Act's small-quantity and consumption rule allows a fine of at least 500,000 shillings,
      three years in prison, or both for drugs outside its specially listed group.[@act2023] It
      also contains a separate offence concerning smoking, inhaling and other drug
      use.[@act2023]
    sources:
      - act2023
    currency: TZS
    penalties:
      - label: Small-quantity consumption outside the listed group
        treatment: criminal
        term: Consumption
        fine_min: 500000
        prison: 3 years
        note: Fine of at least 500,000 shillings, three years in prison, or both
  access:
    text: >-
      No lawful access: cannabis and CBD are prohibited, with no medical programme or licensing
      route.[@uk]
    sources:
      - uk
context:
  recreational:
    text: >-
      There is no legal recreational supply, and CBD is treated as cannabis — nothing is lawfully
      produced or sold.[@act2023,uk] Mainland law has a small-personal-use tier — a fine
      of at least 500,000 shillings, three years, or both — but the burden is on the holder to
      prove personal consumption, and trafficking penalties start at thirty
      years.[@act2023] Long sentences have been imposed for cannabis, including thirty years for
      cultivation in a 2022 case.[@ham2022] The 2012 amendments made life imprisonment the
      penalty for possession and trafficking ([2012
      amendment](/history/tanzania-drug-law-amendment-2012/)).
    sources:
      - act2023
      - ham2022
      - uk
  hemp:
    status: none
    text: >-
      No industrial-hemp exception exists: the October 2026 amendments bring mature stalk and
      fibre into the cannabis definition, and CBD is treated as cannabis.[@act2026,uk]
    sources:
      - act2026
      - uk
  production:
    status: none
    text: >-
      Mainland law prohibits unauthorised cannabis cultivation.[@act2023] The drug-law amendments
      effective 2 October 2026 also broaden seed controls; the existing minimum cultivation sentence
      is thirty years.[@act2026,registry2026]
    sources:
      - act2023
      - act2026
      - registry2026
  medical:
    text: >-
      No medical cannabis programme exists: the drug law punishes possession, cultivation and
      trafficking with no medical channel, and CBD is treated as cannabis.[@wiki,uk,act2023]
    sources:
      - wiki
      - uk
      - act2023
  consequences:
    text: >-
      A conviction is a criminal record.[@wiki] Owners or occupiers who let premises be used for
      drugs face life imprisonment under the provisions the 2012 amendments introduced.[@act2023]
    sources:
      - wiki
      - act2023
  planting:
    seeds: illegal
    seeds_trade: banned
    clones: illegal
    clones_trade: banned
    text: >-
      On Mainland Tanzania, the amendment effective 2 October 2026 brings seeds, mature stalk and
      fibre into the cannabis definition. It also removes the drug-production-purpose limitation
      from the offence of possessing or supplying prohibited-plant seeds. Unauthorised seed
      possession and supply therefore fall under section 11, whose existing minimum sentence is
      thirty years. Cultivation remains prohibited. Zanzibar has a separate legal framework.
    sources:
      - act2026
      - act2023
      - registry2026
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited.[@wiki,uk]
    sources:
      - wiki
      - uk
  visitors:
    status: none
    text: >-
      Mainland law provides no recreational retail permission for visitors.[@act2023] Cannabis
      possession and supply fall within the drug-control offences, and the separate personal-use
      tier requires proof of personal consumption rather than sale or distribution.[@act2023]
    sources:
      - act2023
  black_market:
    text: >-
      Figures reported by the government to the UN drugs office record 2,303,200 kg of herbal
      cannabis seized in 2024, against 1,757,560 kg in 2023.[@unodc_szr] The UN publishes them as
      kilogram equivalents, and countries count seizures differently, so the figures are not
      comparable across borders.[@unodc_szr] At home the drug authority reported a record 2,300
      tonnes of all drugs seized in 2024, and keeps destroying farms: 3,007.5 hectares in a
      September–October 2024 crackdown alone.[@citizen25,xinhua24]
    sources:
      - unodc_szr
      - citizen25
      - xinhua24
  arrests:
    text: >-
      Between June and September 2023 the drug authority arrested at least 69 suspects for
      trafficking cannabis across seven regions.[@legitimate23] A September–October 2024 crackdown
      detained 17 suspects connected with cannabis cultivation and trafficking.[@xinhua24]
    sources:
      - legitimate23
      - xinhua24
  driving:
    status: impairment
    text: >-
      On the mainland, the Road Traffic Act's 2023 revised edition section 53 prohibits driving,
      attempting to drive or being in charge on a road or public place while drugs make proper
      control impossible.[@traffic2023] Section 75(2)(b) provides TSh15,000–50,000 or two–five
      years in prison; section 33(1)(a) requires licence cancellation and disqualification for at
      least three years on a first section 53 conviction.[@traffic2023] These are the published 2023
      provisions, not a verified 2026 ticket tariff.[@traffic2023] Zanzibar has a separate Road
      Transport Act: section 123(1)(a) also uses impaired control, and its published 2003 text
      provides a first-offence minimum fine equivalent to US$75 in shillings or at least six months
      in prison, or both.[@zanzibar_traffic] Repeat convictions normally entail at least fifteen
      months' disqualification, subject to the court's special-reasons exception.[@zanzibar_traffic]
      Later Zanzibar amendments, current testing procedures and a numeric THC cutoff were not
      verified; alcohol thresholds must not be applied to cannabis.[@zanzibar_traffic]
    sources:
      - traffic2023
      - zanzibar_traffic
  culture:
    text: >-
      The Swahili word for the plant is [bangi](/culture/language/bangi/), tied to bhang and the
      Indian Ocean exchange rather than any single voyage.[@wiki] Smoking was already established
      on the coast by the 19th century, carried inland by Nyamwezi traders, before colonial
      Tanganyika consolidated its drug law in the [Dangerous Drugs Ordinance of
      1935](/history/tanganyika-dangerous-drugs-ordinance-1935/).[@wiki] The 2012 amendments then
      made life imprisonment the penalty for possession and trafficking ([2012
      amendment](/history/tanzania-drug-law-amendment-2012/)),[@act2023] and the [2026 seed
      controls](/history/tanzania-seed-possession-law-2026/) closed the last definitional
      gap.[@act2026] Nineteenth-century travellers already suspected the loud coughing after a
      pipe was put on — the atlas keeps those accounts in [the smoker's
      cough](/culture/traditions/the-smokers-cough/).[@wiki]
    sources:
      - wiki
      - act2023
      - act2026
