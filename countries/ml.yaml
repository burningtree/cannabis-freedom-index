name: Mali
region: Africa
iso_numeric: 466
recreational: illegal
medical: none
updated: 2026-10-21
summary: >-
  Cannabis is illegal. The 2001 law gives small personal supplies, including cultivation,
  a lighter penalty with a fine-only option. Ordinary high-risk drug cultivation carries
  five to ten years and a fine. A limited industrial-hemp authorisation was withdrawn in 2020.
scores:
  possession: 1
  cultivation: 1
  enforcement: 1
  sharing: 1
  consumption: 1
  access: 0
segments:
  possession:
    text: >-
      Article 138 of the 2001 drug law covers small quantities possessed, bought or grown
      for personal use. A high-risk plant or substance, including cannabis oil, carries
      three months to one year, a fine of 25,000–100,000 CFA francs, or both. A cannabis
      derivative other than oil carries two to six months, a fine of 15,000–75,000 francs,
      or both. The law gives no numeric quantity threshold.
    sources:
      - law
  cultivation:
    text: >-
      Article 9 prohibits cannabis cultivation and requires landholders to destroy plants
      growing on their land. Article 94 sets five to ten years and a fine of 200,000–2
      million CFA francs for ordinary high-risk drug cultivation. Article 138 gives a
      lighter tier, including a fine-only option, for small personal quantities.
    sources:
      - law
  enforcement:
    text: >-
      Small personal quantities can attract imprisonment, a fine alone, or both under
      Article 138. Ordinary high-risk drug cultivation and international trafficking
      require prison and a fine under Articles 94–95. The retained sources do not establish
      how consistently these rules are enforced across the country.
    sources:
      - law
  sharing:
    text: >-
      Article 98 sets six months to three years, a fine of 20,000–200,000 CFA francs, or
      both for giving or offering a high-risk drug directly for another person's consumption.
      General local trafficking carries five to ten years, a fine, or both under Article 96.
    sources:
      - law
  consumption:
    text: >-
      Article 137 prohibits using controlled drugs outside a medical prescription and
      provides for seizure and confiscation. Article 138 sets the personal-possession
      penalties described above.
    sources:
      - law
  access:
    text: >-
      The retained sources establish no operating cannabis supply programme for patients
      or recreational users. The authorities granted a limited industrial-hemp production
      authorisation in 2017 and withdrew it in February 2020.
    sources:
      - law
      - hemp2020
context:
  production:
    text: >-
      African Seeds received permission in 2017 for a supervised industrial-hemp project
      intended for medical exports. In May 2020, the central drug office's director
      confirmed that the authorisation had been withdrawn on 25 February after the
      producers sought changes to the agreed terms.
    sources:
      - hemp2020
      - hemp2019
  products:
    text: >-
      The reported industrial-hemp authorisation initially covered seed exports, with a
      2018 amendment adding oil. The authorisation was withdrawn in 2020; the retained
      sources establish no current consumer product supply.
    sources:
      - hemp2019
      - hemp2020
  medical:
    text: The retained sources do not establish whether a medical cannabis programme operates.
    sources: []
  consequences:
    text: >-
      For the offences listed in Articles 94–102, Article 112 allows courts to ban a
      foreigner from the territory for ten to twenty years and restrict civic rights or
      driving for one to five years. A professional ban can last five to ten years or
      permanently. The personal-use offence in Article 138 is outside that stated list.
    sources:
      - law
  planting:
    seeds: grey
    seeds_trade: unclear
    clones: illegal
    clones_trade: banned
    text: >-
      Article 9 of Law 01-078 bans growing the cannabis plant anywhere in the country and
      obliges whoever owns or occupies land to destroy any plants that come up. The law
      defines a narcotic by reference to the schedules of the 1961 convention. A limited
      authorisation for industrial-hemp seed production and export was granted in 2017
      and withdrawn in 2020; the retained sources do not settle general seed sales.
    sources:
      - l01078
      - hemp2019
      - hemp2020
  clubs:
    status: none
    text: >-
      The retained sources establish no authorised cannabis clubs. The law prohibits
      cannabis cultivation and punishes giving or offering high-risk drugs for another
      person's consumption.
    sources:
      - law
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone, so a visitor has no lawful way to buy
      cannabis. Article 112 permits a ten-to-twenty-year territorial ban on foreigners
      convicted of the specified offences in Articles 94–102.
    sources:
      - law
  black_market:
    text: >-
      Figures reported by the government to the UN drugs office record 32,000 kg of herbal
      cannabis seized in 2023, against 22,217 kg in 2022, and 440 kg of cannabis resin
      seized in 2023, against 1,874 kg in 2022. The UN publishes them as kilogram
      equivalents, and countries count seizures differently, so the figures are not
      comparable across borders.
    sources:
      - unodc_szr
