segments:
  possession:
    text: >-
      Illegal under Law 01-078 of 2001 on drug control. Possession for personal use is a crime; the
      penalty for small amounts is not clearly stated in accessible sources, and travel advisories
      warn of long sentences and heavy fines.
    sources:
      - trip
      - law
  cultivation:
    text: Cultivation is prohibited.
    sources:
      - wiki
  enforcement:
    text: >-
      With much of the country outside state control, enforcement is confined largely to Bamako and
      the south.
    sources:
      - trip
  sharing:
    text: Production, sale and trafficking carry heavy prison terms.
    sources:
      - trip
  consumption:
    text: Use is an offence.
    sources:
