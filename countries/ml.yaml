name: Mali
region: Africa
iso_numeric: 466
recreational: illegal
medical: none
updated: '2026-10-27'
summary: >-
  Cannabis is illegal. The 2001 law gives small personal supplies, including cultivation,
  a lighter penalty with a fine-only option. Ordinary high-risk drug cultivation carries
  five to ten years and a fine. A limited industrial-hemp authorisation was withdrawn in 2020.
