  planting:
    seeds: grey
    seeds_trade: unclear
    clones: illegal
    clones_trade: banned
    text: >-
      Article 9 of Law 01-078 bans growing the cannabis plant anywhere in the country and
      obliges whoever owns or occupies land to destroy any plants that come up. The law
      defines a narcotic as a drug listed in the schedules of the 1961 convention and does not
      mention seeds.
    sources:
      - l01078
