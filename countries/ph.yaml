segments:
  possession:
    text: >-
      Under Section 11 of Republic Act 9165, possession of even the smallest amount of marijuana
      carries 12 years and one day to 20 years in prison and a fine of ₱300,000–400,000. Possessing
      500 g or more of marijuana, or 10 g or more of resin, carries life imprisonment and a fine of
      up to ₱10 million. There is no lesser tier for personal use.
    sources:
      - ra
  cultivation:
    text: Cultivating marijuana plants carries life imprisonment.
    sources:
      - ra
  enforcement:
    text: >-
      Decades-long sentences for possession, in a country where the 2016–2022 'war on drugs' killed
      thousands of suspected users and dealers.
    sources:
      - ra
      - ss
  sharing:
    text: Sale or giving away carries life imprisonment regardless of quantity.
    sources:
      - ra
  consumption:
    text: >-
      Use is a separate offence: a first positive test means at least six months in a government
      rehabilitation centre; a second brings six to twelve years in prison.
    sources:
      - ra
      - ss
  access:
    text: None.
    sources:
      - malaya
context:
  production:
