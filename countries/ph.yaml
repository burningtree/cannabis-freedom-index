segments:
  possession:
    text: >-
      Under Section 11 of Republic Act 9165, possession of even the smallest amount of marijuana
      carries 12 years and one day to 20 years in prison and a fine of ₱300,000–400,000. Possessing
      500 g or more of marijuana, or 10 g or more of resin, carries life imprisonment and a fine of
      ₱500,000–10 million. There is no lesser tier for personal use.
    sources:
      - ra
      - death
  cultivation:
    text: >-
      Cultivating any marijuana plant carries life imprisonment and a fine of
      ₱500,000–10 million. The land or greenhouse can also be confiscated.
    sources: [ra, death]
  enforcement:
    text: >-
      A small personal amount exposes its possessor to a sentence of more than 12 years. The
      nationwide anti-drug campaign launched in 2016 also killed thousands of alleged drug suspects;
      the UN found serious rights violations and near impunity.
    sources:
      - ra
      - ohchr
  sharing:
    text: >-
      Selling, delivering or giving away cannabis carries life imprisonment and a
      ₱500,000–10 million fine, with no lower quantity tier.
    sources:
      - ra
      - death
  consumption:
    text: >-
      Use is a separate offence. After a confirmatory positive test, a first offence means at least
      six months in a government rehabilitation centre; a second brings six years and one day to 12
      years in prison and a ₱50,000–200,000 fine.
    sources: [ra]
  access:
    text: >-
      No dispensary or ordinary pharmacy route exists. For a seriously ill patient, a treating
      physician or health institution may seek an FDA compassionate special permit to import an
      unregistered cannabis-based medicine for restricted use.
    sources: [pna, fda]
context:
  production:
    text: None. Republic Act 9165 prohibits every form of unauthorised cannabis cultivation.
    sources: [ra]
  products:
    text: >-
      No cannabis or CBD consumer products are lawful. The statutory definition covers every part
      of the plant and its seeds, resin, extract and tincture.
    sources: [ra, ddb]
  medical:
    text: >-
      There is no medical-cannabis programme. The health department says marijuana remains illegal
      unless an FDA compassionate special permit covers its use and importation. On 24 February
      2026, two House committees approved a consolidated medical-cannabis bill subject to style and
      amendments, but it has not become law.
    sources: [pna, fda, house]
  consequences:
    text: >-
      Foreign nationals are deported after serving their sentence. Qualifying defendants may seek
      a plea bargain under the Supreme Court's drug-case framework, but acceptance is discretionary
      rather than a right.
    sources: [ra, sc]
  planting:
    seeds: illegal
    seeds_trade: banned
    clones: illegal
    clones_trade: banned
    text: >-
      Republic Act 9165 defines cannabis as any part of the plant "and seeds thereof", so
      seeds fall under the same possession and sale offences as the drug. Section 16 punishes
      planting or cultivating marijuana "regardless of quantity" with life imprisonment.
    sources:
      - ra
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited.
    sources:
      - ra
      - death
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. British travel advice says penalties
      for importing and using drugs are particularly severe, and that possessing any illicit
      drug, even a small amount, carries a mandatory prison sentence.
    sources:
      - pna
      - fda
      - fcdo
  driving:
    status: zero
    text: >-
      The Anti-Drunk and Drugged Driving Act of 2013 defines driving under the influence of
      dangerous drugs as driving by a person who, after a confirmatory test, is found positive
      for use of any dangerous drug: no level is set and impairment need not be shown. An
      officer who sees signs of drug use runs field sobriety tests and then a drug test, and
      every driver in a crash that causes death or injury is tested. Without injury the
      penalty is three months in prison and a fine of 20,000 to 80,000 pesos.
    sources:
      - ra10586
