segments:
  possession:
    text: >-
      Under Section 11 of Republic Act 9165, possession of less than 300 g of marijuana, or less
      than 5 g of resin or resin oil, carries 12 years and one day to 20 years and a fine of
      ₱300,000 to ₱400,000. From 300 g up to but not including 500 g of marijuana, or from 5 g up to
      but not including 10 g of resin or resin oil, the sentence is 20 years and one day to life
      imprisonment and a fine of ₱400,000 to ₱500,000. At least 500 g of marijuana, or at least 10 g
      of resin or resin oil, carries life imprisonment and a fine of ₱500,000 to ₱10 million. There
      is no lesser tier for personal use.[@ra,death] Section 13 requires the maximum Section 11
      penalties for possession at a party, social gathering or meeting, or in the proximate company
      of at least two other people, regardless of amount. The others need not hold
      drugs.[@ra_primary,irr]
    sources:
      - ra
      - death
      - ra_primary
      - irr
    currency: PHP
    penalties:
      - label: Under 300 g marijuana or 5 g resin
        treatment: criminal
        term: Possession
        prison_min: 12 years
        prison: 20 years
        fine: 400000
        note: Twelve years and one day to twenty years and ₱300,000–400,000
      - label: 300 g to under 500 g, or 5 g to under 10 g resin
        treatment: criminal
        term: Possession
        prison_min: 20 years
        fine: 500000
        note: Twenty years and one day to life and ₱400,000–500,000
      - label: 500 g or more, or 10 g or more resin
        treatment: criminal
        term: Possession
        fine: 10000000
        note: Life imprisonment and ₱500,000–10 million; maximum at gatherings regardless of amount
  cultivation:
    text: >-
      Cultivating any marijuana plant carries life imprisonment and a fine of
      ₱500,000–10 million.[@ra] The land or greenhouse can also be confiscated.[@ra]
    sources: [ra]
    currency: PHP
    penalties:
      - label: Cultivating any plant
        treatment: criminal
        term: Cultivation
        fine: 10000000
        note: Life imprisonment and ₱500,000–10 million; land or greenhouse confiscated
  enforcement:
    text: >-
      Ordinary small possession carries more than twelve years, while Section 13 requires maximum
      Section 11 penalties in the specified gathering/group circumstances regardless of
      weight.[@ra_primary,irr] Unauthorised importation carries life imprisonment even for a small
      amount, following abolition of the death penalty.[@ra_primary,death] The UN also documented
      thousands of killings and near impunity in the nationwide anti-drug campaign launched in
      2016.[@ohchr]
    sources:
      - ra_primary
      - irr
      - death
      - ohchr
  sharing:
    text: >-
      Selling, delivering or giving away cannabis carries life imprisonment and a
      ₱500,000–10 million fine, with no lower quantity tier.[@ra]
    sources:
      - ra
    currency: PHP
    penalties:
      - label: Sale, delivery or gift
        treatment: criminal
        term: Sale
        fine: 10000000
        note: Life imprisonment and ₱500,000–10 million, no lower tier
  consumption:
    text: >-
      Use is a separate offence. After a confirmatory positive test, a first offence means at least
      six months in a government rehabilitation centre; a second brings six years and one day to 12
      years in prison and a ₱50,000–200,000 fine.[@ra]
    sources: [ra]
    currency: PHP
    penalties:
      - label: First use offence
        treatment: criminal
        term: Use
        note: Six months in a government rehabilitation centre
      - label: Second use offence
        treatment: criminal
        term: Use
        prison_min: 6 years
        prison: 12 years
        fine: 200000
        note: Six years and one day to twelve years and ₱50,000–200,000
  access:
    text: >-
      No dispensary or ordinary pharmacy route exists.[@pna] For a seriously ill patient, a
      treating physician or health institution may seek an FDA compassionate special permit to
      import an unregistered cannabis-based medicine for restricted use.[@fda] Separately, a patient
      or relative may obtain a PDEA personal-use licence under DDB Regulation 8 of 2019 to acquire,
      possess and use an unregistered dangerous-drug product for a rare or debilitating disease,
      with a prescription capped at a one-year supply.[@ddb_personal] CBD products with no more than
      0.1% THC are in Schedule 4; a registered product can be prescribed, while an unregistered one
      still needs the permit.[@ddb_cbd]
    sources: [pna, fda, ddb_cbd, ddb_personal]
context_not_applicable:
  death_penalty:
    text: >-
      Republic Act 9346 prohibited the death penalty in 2006, so trafficking now draws life
      imprisonment instead; unauthorised importation carries life regardless of quantity.[@death,ra_primary]
      Bills to restore death for large-scale drug trafficking were filed in 2025 and 2026, but none
      passed; the Palace said on 20 October 2026 that the proposal needed study.[@pna_death]
    sources: [death, ra_primary, pna_death]
context:
  recreational:
    text: >-
      All recreational use is prohibited at any amount: possession starts at over twelve years,
      selling or giving away brings life imprisonment, and use brings rehabilitation or prison.
      A 2026 medical bill has not become law.[@ra,death,house]
    sources:
      - ra
      - death
      - house
  production:
    status: none
    text: None. Republic Act 9165 prohibits every form of unauthorised cannabis cultivation.[@ra]
    sources: [ra]
  medical:
    text: >-
      There is no medical-cannabis programme and no lawful cannabis or CBD consumer products; the
      definition covers every part of the plant, its seeds, resin, extract and tincture.[@ra]
      The health department says marijuana remains illegal unless an FDA compassionate special
      permit covers its use and importation.[@pna,fda] A 2020 DDB regulation places CBD products
      with no more than 0.1% THC in Schedule 4; a registered product can be prescribed, while an
      unregistered one needs the FDA permit. It is not a consumer route.[@ddb_cbd,fda] On 24 February
      2026, two House committees approved a consolidated medical-cannabis bill subject to style and
      amendments, but it has not become law.[@house,ddb]
    sources: [pna, fda, ddb_cbd, house, ddb, ra]
  hemp:
    status: none
    text: >-
      No industrial-hemp category or low-THC threshold. Republic Act 9165 defines cannabis as any
      part of the plant and its seeds, resin, extract and tincture, and bans cultivation, with no
      fibre, food or cosmetics exception.[@ra] Hemp food, fibre and cosmetics have no general
      exemption.[@ra]
    sources:
      - ra
  consequences:
    text: >-
      Foreign nationals are deported after serving their sentence.[@ra] Qualifying defendants may
      seek a plea bargain under the Supreme Court's drug-case framework, but acceptance is
      discretionary rather than a right.[@sc]
    sources: [ra, sc]
  planting:
    seeds: illegal
    seeds_trade: banned
    clones: illegal
    clones_trade: banned
    text: >-
      Republic Act 9165 defines cannabis as any part of the plant "and seeds thereof", so seeds
      fall under the same possession and sale offences as the drug.[@ra] Section 16 punishes
      planting or cultivating marijuana "regardless of quantity" with life imprisonment.[@ra]
    sources:
      - ra
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited.[@ra]
    sources:
      - ra
  visitors:
    status: none
    text: >-
      There is no legal recreational supply. Bringing cannabis into the Philippines without legal
      authorisation is a separate importation offence carrying life imprisonment and a ₱500,000–₱10
      million fine regardless of quantity.[@ra_primary,death] Ordinary domestic possession below 300
      g of plant marijuana or 5 g of resin/resin oil carries twelve years and one day to twenty
      years, with higher weight bands; possession at a qualifying gathering or with at least two
      other people has enhanced maximum penalties regardless of weight.[@ra_primary,irr] A physician
      or health institution must obtain the applicable FDA compassionate permit for restricted
      imports of unregistered medicines.[@fda]
    sources:
      - ra_primary
      - death
      - irr
      - fda
  driving:
    status: zero
    text: >-
      The Anti-Drunk and Drugged Driving Act defines drugged driving by a positive
      confirmatory test for dangerous-drug use, without a numerical THC allowance, a separate
      requirement to prove impairment, or a medical exception.[@ra10586] With probable cause, police bring the
      driver for drug screening and, if necessary, confirmation; a crash causing injury
      or death also requires testing.[@ra10586] The Act provides three months in prison and a
      PHP20,000–80,000 fine without injury or homicide.[@ra10586] Injury raises the fine to
      PHP100,000–200,000 and homicide to PHP300,000–500,000, alongside the respective
      statutory prison penalties.[@ra10586] A nonprofessional licence is suspended for twelve
      months on the first conviction and permanently revoked on the second.[@ra10586] A
      professional licence is permanently revoked on the first conviction, barring
      any future licence.[@ra10586] Refusal of mandatory field sobriety and drug tests brings
      confiscation and automatic licence revocation, in addition to other applicable
      penalties.[@ra10586]
    sources:
      - ra10586
  black_market:
    text: >-
      Figures reported by the government to the UN drugs office record 5,920 kg of herbal cannabis
      seized in 2024, against 2,124 kg in 2023; resin was 1 kg in 2023 and blank in 2024, which may
      mean non-reporting rather than zero.[@unodc_szr] The PDEA reported 3,090 kg of dried leaves and
      bricks and 939.73 kg of kush in 2024, and 1,850.6 kg of dried leaves and bricks, 546.1 kg of
      kush and 147.9 kg of fruiting tops in 2025.[@pdea24,pdea25] A Manila port raid in March 2024
      found 278.32 kg of kush, 2.36 litres of liquid marijuana and 880.25 g of hash.[@asean24]
    sources:
      - unodc_szr
      - pdea24
      - pdea25
      - asean24
  arrests:
    text: >-
      The PDEA reported 38,545 operations and 51,264 arrests in 2024, and 39,491 operations and
      51,614 arrests in 2025.[@pdea24,pdea25] The figures cover all drugs; methamphetamine dominates
      the seizures by value, and the reports do not say how many arrests were for cannabis.[@pdea25]
      Over the five years from 2020 the agency counted 183,149 operations and 253,776 arrests, with
      14.54 tonnes of dried marijuana leaves and 1,033 kg of marijuana kush.[@journal25]
    sources:
      - journal25
      - pdea24
      - pdea25
