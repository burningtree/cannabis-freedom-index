name: Philippines
region: Asia
iso_numeric: 608
recreational: illegal
medical: limited
updated: '2026-10-28'
summary: >-
  Possession carries prison at any amount. Life imprisonment can apply from 300 g of marijuana or 5 g of resin, and applies from 500 g or 10 g respectively.
  Unauthorised importation carries life regardless of quantity; possession at gatherings or with at
  least two others has enhanced penalties. Medical access requires an individual compassionate
  permit.
