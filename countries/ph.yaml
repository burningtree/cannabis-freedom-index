segments:
  possession:
    text: >-
      Under Section 11 of Republic Act 9165, possession of even the smallest amount of marijuana
      carries 12 years and one day to 20 years in prison and a fine of ₱300,000–400,000. Possessing
      500 g or more of marijuana, or 10 g or more of resin, carries life imprisonment and a fine of
      ₱500,000–10 million. There is no lesser tier for personal use.
    sources:
      - ra
      - death
  cultivation:
    text: >-
      Cultivating any marijuana plant carries life imprisonment and a fine of
      ₱500,000–10 million. The land or greenhouse can also be confiscated.
    sources: [ra, death]
  enforcement:
    text: >-
      A small personal amount exposes its possessor to a sentence of more than 12 years. The
      nationwide anti-drug campaign launched in 2016 also killed thousands of alleged drug suspects;
      the UN found serious rights violations and near impunity.
    sources:
      - ra
      - ohchr
  sharing:
    text: >-
      Selling, delivering or giving away cannabis carries life imprisonment and a
      ₱500,000–10 million fine, with no lower quantity tier.
    sources:
      - ra
      - death
  consumption:
    text: >-
      Use is a separate offence. After a confirmatory positive test, a first offence means at least
      six months in a government rehabilitation centre; a second brings six years and one day to 12
      years in prison and a ₱50,000–200,000 fine.
    sources: [ra]
  access:
    text: >-
      No dispensary or ordinary pharmacy route exists. For a seriously ill patient, a treating
      physician or health institution may seek an FDA compassionate special permit to import an
      unregistered cannabis-based medicine for restricted use.
    sources: [pna, fda]
context:
  production:
    text: None. Republic Act 9165 prohibits every form of unauthorised cannabis cultivation.
    sources: [ra]
  products:
    text: >-
      No cannabis or CBD consumer products are lawful. The statutory definition covers every part
      of the plant and its seeds, resin, extract and tincture.
    sources: [ra, ddb]
  medical:
    text: >-
      There is no medical-cannabis programme. The health department says marijuana remains illegal
      unless an FDA compassionate special permit covers its use and importation. On 24 February
      2026, two House committees approved a consolidated medical-cannabis bill subject to style and
      amendments, but it has not become law.
    sources: [pna, fda, house]
  consequences:
    text: >-
      Foreign nationals are deported after serving their sentence. Qualifying defendants may seek
      a plea bargain under the Supreme Court's drug-case framework, but acceptance is discretionary
      rather than a right.
    sources: [ra, sc]
  planting:
    seeds: illegal
    seeds_trade: banned
    clones: illegal
    clones_trade: banned
    text: >-
      Republic Act 9165 defines cannabis as any part of the plant "and seeds thereof", so
      seeds fall under the same possession and sale offences as the drug. Section 16 punishes
      planting or cultivating marijuana "regardless of quantity" with life imprisonment.
    sources:
      - ra
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited.
    sources:
      - ra
      - death
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. Under Section 11 of Republic Act 9165
      possession of even the smallest amount of marijuana carries 12 years and one day to 20
      years in prison and a fine of ₱300,000 to 400,000, with no lesser tier for personal use.
    sources:
      - ra
      - pna
      - fda
  driving:
    status: zero
    text: >-
      The Anti-Drunk and Drugged Driving Act defines drugged driving by a positive
      confirmatory test for dangerous-drug use, without a numerical THC allowance or
      separate requirement to prove impairment. With probable cause, police bring the
      driver for drug screening and, if necessary, confirmation; a crash causing injury
      or death also requires testing. The Act provides three months in prison and a
      PHP20,000–80,000 fine without injury or homicide. Injury raises the fine to
      PHP100,000–200,000 and homicide to PHP300,000–500,000, alongside the respective
      statutory prison penalties. A nonprofessional licence is suspended for twelve
      months on the first conviction and permanently revoked on the second. A
      professional licence is permanently revoked on the first conviction, barring
      any future licence. Refusal of mandatory field sobriety and drug tests brings
      confiscation and automatic licence revocation, in addition to other applicable
      penalties.
    sources:
      - ra10586
  black_market:
    text: >-
      Figures reported by the government to the UN drugs office record 5,920 kg of herbal
      cannabis seized in 2024, against 2,124 kg in 2023. The UN publishes them as kilogram
      equivalents, and countries count seizures differently, so the figures are not
      comparable across borders.
    sources:
      - unodc_szr
  arrests:
    text: >-
      The Philippine Drug Enforcement Agency reported that it and its partner agencies
      carried out 10,161 anti-drug operations and arrested 13,497 people in the first
      three months of 2025. Over the five years from 2020 the agency counted 183,149
      operations and 253,776 arrests, with seizures of 13.5 tonnes of shabu, 14.54 tonnes
      of dried marijuana leaves and 1,033 kg of marijuana kush. The figures cover all
      drugs; methamphetamine dominates the seizures by value, and the report does not say how many of the arrests were for cannabis.
    sources:
      - journal25
