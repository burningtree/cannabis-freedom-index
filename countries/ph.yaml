  products:
    text: None.
    sources:
      - malaya
  medical:
    text: >-
      The only route is a 'compassionate special permit' from the health department to import an
      unregistered medicine for a named patient. In September 2025 House committees approved a bill
      to allow cannabis in pharmaceutical form on prescription from accredited doctors; it is not
      yet law.
    sources:
      - malaya
  consequences:
    text: >-
      Plea bargaining is restricted, bail is hard to obtain in drug cases, and compulsory
      rehabilitation is common.
    sources:
      - ra
