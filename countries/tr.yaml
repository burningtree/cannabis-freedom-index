name: Türkiye
region: Asia
iso_numeric: 792
recreational: illegal
medical: limited
updated: 2026-10-26
summary: >-
  Possession carries two to five years, often converted to probation and treatment. Hemp is licensed
  in selected provinces; cannabinoid medicines have a tightly controlled individual import route.
answers:
  buy:
    answer: limited
    text: >-
      A special import route lists cannabinoid medicines on red prescription; routine domestic
      pharmacy stock has not been verified
scores:
  possession: 1
  cultivation: 1
  enforcement: 2
  sharing: 1
  consumption: 1
  access: 0
segments:
  possession:
    text: >-
      Buying, receiving or possessing cannabis for personal use is a crime under Article 191 of the
      Penal Code, with two to five years in prison. For a first offence, however, prosecutors must
      normally defer prosecution for five years and impose at least a year of supervised probation,
      with treatment where needed. Breach the conditions or reoffend and the prison sentence
      applies.
    sources:
      - bh
      - mondaq
    penalties:
      - label: Personal-use possession, purchase or receipt (Article 191)
        treatment: criminal
        prison_min: 2 years
        prison: 5 years
        note: Two to five years; first offences normally deferred for five years with supervised probation and treatment
  cultivation:
    text: >-
      Article 23 of the 1933 narcotics law prohibits growing hemp without a permit for any
      purpose, and unlicensed plants are destroyed. Sowing hemp to obtain cannabis carries four
      to twelve years in prison and a heavy fine; a person who grows only the cannabis they need
      for their own use faces one to three years. Sowing without a permit where no drug purpose
      is shown brings a fine.
    sources:
      - law2313
      - bh
    penalties:
      - label: Sowing hemp to obtain cannabis
        treatment: criminal
        prison_min: 4 years
        prison: 12 years
        note: Four to twelve years and a heavy fine
      - label: Growing only the cannabis needed for own use
        treatment: criminal
        prison_min: 1 year
        prison: 3 years
        note: One to three years
  enforcement:
    text: >-
      Probation rather than prison for first-time users, but under a criminal framework with a
      multi-year sentence hanging over them. Dealing is punished severely.
    sources:
      - bh
      - mondaq
  sharing:
    text: Supplying drugs to others is punished under Article 188 with at least ten years.
    sources:
      - bh
      - mondaq
    penalties:
      - label: Supplying drugs to others (Article 188)
        treatment: criminal
        prison_min: 10 years
        note: At least ten years
  consumption:
    text: >-
      Use is covered by Article 191 on the same terms as possession, and probation involves regular
      drug tests.
    sources:
      - mondaq
      - bh
  access:
    text: >-
      Adult-use supply is illegal. TİTCK’s September 2026 overseas active-substance list includes
      cannabidiol oral solution and THC/CBD mouth spray on red prescription, through the special
      import process. Domestic cannabis-derived products require product-specific authorisation
      under the January 2026 rules; a permission to market does not establish pharmacy stock.
    sources:
      - imports2026
      - products2026
      - bh

context:
  recreational:
    text: >-
      There is no legal recreational supply. Buying, receiving or possessing for personal use
      brings two to five years, but first offences normally get five years' deferred
      prosecution with at least a year of supervised probation and treatment; breach or
      reoffending brings the prison term.[@bh,mondaq] Supplying others brings at least ten
      years.[@bh,mondaq]
    sources:
      - bh
      - mondaq
  production:
    status: medical
    text: >-
      Hemp may be grown under permit in a list of designated provinces; the state has promoted it
      for fibre and, more recently, for low-THC medicinal products.
    sources:
      - wiki
  products:
    text: >-
      The 31 January 2026 regulation creates product-specific licensing and pharmacy-sale rules.
      Medicinal products need TİTCK authorisation before marketing; health, support and cosmetic
      products have their own requirements. Its 0.3% provisions concern particular product
      categories. Specially imported cannabinoid medicines use a separate route.
    sources:
      - products2026
      - imports2026
  medical:
    text: >-
      Very limited. The special import list includes cannabidiol oral solution and THC/CBD mouth
      spray on red prescription. For domestic cannabis-derived products, the 2025 enabling law was
      followed by implementing rules on 31 January 2026. Routine domestic pharmacy availability has
      not been verified.
    sources:
      - imports2026
      - products2026
  consequences:
    text: >-
      A year or more of supervision and testing; if probation is completed the case is dropped
      without a conviction.
    sources:
      - bh
  planting:
    seeds: licensed
    seeds_trade: regulated
    clones: licensed
    clones_trade: regulated
    text: >-
      Hemp may be grown for fibre, seed and stalk only with a permit from the local
      administrative authority, in 21 named provinces, applied for between 1 January and 1
      April each year; growing for medicines goes through the state grain board. The 2026
      regulation as reported does not set out how seed is supplied or sold.
    sources:
      - evr26
  hemp:
    status: strict
    text: >-
      Hemp for fibre, seed and stalk needs a local permit in 21 named provinces, applied for
      between 1 January and 1 April each year; growing for medicines goes through the state
      grain board.[@evr26] The 2026 product rules set 0.3% provisions for particular product
      categories, not a general cultivation line.[@products2026]
    sources:
      - evr26
      - products2026
  arrests:
    text: >-
      The EU drugs agency's statistical bulletin records 103,992 cannabis-related drug law
      offences in Türkiye in 2024, against 87,268 in 2023. Of the 2024 total, 83,744 were for
      use or possession for use. The number has risen by about three-quarters since 2020 and is the highest in the series. Countries count these differently (offences or offenders, criminal or
      administrative), so the figure is not comparable across borders.
    sources:
      - euda_dlo
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited.
    sources:
      - bh
      - mondaq
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. Buying, receiving or possessing cannabis
      for personal use is a crime with two to five years in prison under Article 191 of the
      Penal Code.
    sources:
      - bh
      - mondaq
  driving:
    status: zero
    text: >-
      The Highway Traffic Law forbids anyone who has taken narcotic or stimulant substances
      from driving, with no level set; police use roadside test kits, and a driver who objects
      is taken for a blood, saliva or urine sample. Under the paragraph as amended in February
      2026, a driver found to have taken such a substance is fined 150,000 lira and the
      licence is cancelled; a new one requires a driving course and exams, which cannot begin
      until at least five years have passed. The Penal Code applies as well.
    sources:
      - ktk48
  black_market:
    text: >-
      The EU drugs agency's statistical bulletin records 47,710 kg of herbal cannabis and
      13,751 kg of cannabis resin seized in Turkey in 2024, against 71,429 kg and 27,836
      kg in 2023. Herbal cannabis was seized on 80,420 occasions and resin on 17,405.
      Plant seizures came to 108,378,999 plants. Countries record seizures differently,
      so the figures are not comparable across borders.
    sources:
      - euda_szr
