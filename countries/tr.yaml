segments:
  possession:
    text: >-
      Buying, receiving or possessing cannabis for personal use is a crime under Article 191 of the
      Penal Code, with two to five years in prison. For a first offence, however, prosecutors must
      normally defer prosecution for five years and impose at least a year of supervised probation,
      with treatment where needed. Breach the conditions or reoffend and the prison sentence
      applies.
    sources:
      - bh
      - mondaq
  cultivation:
    text: >-
      Growing for personal use falls under the same Article 191 regime; anything larger is
      production under Article 188, with far heavier sentences.
    sources:
      - bh
  enforcement:
    text: >-
      Probation rather than prison for first-time users, but under a criminal framework with a
      multi-year sentence hanging over them. Dealing is punished severely.
    sources:
      - bh
      - mondaq
  sharing:
    text: Supplying drugs to others is punished under Article 188 with at least ten years.
    sources:
      - bh
      - mondaq
  consumption:
    text: >-
      Use is covered by Article 191 on the same terms as possession, and probation involves regular
      drug tests.
    sources:
      - mondaq
      - bh
  access:
    text: No legal source for THC cannabis.
    sources:
      - wiki
context:
  production:
    text: >-
      Hemp may be grown under permit in a list of designated provinces; the state has promoted it
      for fibre and, more recently, for low-THC medicinal products.
    sources:
      - wiki
  products:
    text: >-
      Low-THC cannabis-derived products through pharmacies under a 2025 measure; a prescription
      mouth spray since 2016.
    sources:
      - wiki
  medical:
    text: >-
      Very limited: a cannabinoid mouth spray on special prescription since 2016, and pharmacy
      distribution of products under 0.3% THC from 2025.
    sources:
      - wiki
  consequences:
    text: >-
      A year or more of supervision and testing; if probation is completed the case is dropped
      without a conviction.
    sources:
      - bh
  planting:
    seeds: licensed
    seeds_trade: regulated
    clones: licensed
    clones_trade: regulated
    text: >-
      Hemp may be grown for fibre, seed and stalk only with a permit from the local
      administrative authority, in 21 named provinces, applied for between 1 January and 1
      April each year; growing for medicines goes through the state grain board. The 2026
      regulation as reported does not set out how seed is supplied or sold.
    sources:
      - evr26
