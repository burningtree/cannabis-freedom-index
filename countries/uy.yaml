name: Uruguay
region: South America
iso_numeric: 858
recreational: legal
medical: legal
updated: 2026-10-23
summary: >-
  First country to legalise (2013). Registered residents choose between growing six plants, joining
  a club, or buying up to 40 g a month in pharmacies at state-set prices.
scores:
  possession: 6
  cultivation: 4
  enforcement: 6
  sharing: 4
  consumption: 7
  access: 4
segments:
  possession:
    text: >-
      The drug law exempts a person who carries or keeps a quantity meant for their own use. The
      judge decides that question, and the law treats up to 40 g of marijuana as a personal amount.
      That exemption stands whether or not the cannabis came from a pharmacy, a club or a
      registered home grow. A harvest from up to six plants at home, or a club's harvest, is
      covered when it was grown as the law allows. The regulating decree authorises possession for
      personal use on the same 40 g measure.
    sources:
      - art7
      - d39
  cultivation:
    text: >-
      Registered residents may grow up to six flowering plants per household with an annual harvest
      of at most 480 g. Registration with the state regulator IRCCA is mandatory, and choosing home
      growing excludes you from pharmacies and clubs. Unregistered growing is an offence.
    sources:
      - law
      - ircca
  enforcement:
    text: >-
      Personal possession is exempt when the cannabis is for the person's own use, whether or not
      that person is on a register. Growing, selling and other supply without authorisation remain
      criminal offences.
    sources:
      - art7
  sharing:
    text: >-
      Sharing or giving cannabis that was obtained legally, from a pharmacy, a registered club or a
      registered home grow, is not penalised. The 2026 national evaluation counts that sharing as
      legal access: 20.9% of people who had used cannabis in the past year most often got it that
      way. Buying cannabis for someone else, and sharing cannabis from an unregistered grow or from
      a dealer, sit outside that rule. Sale without a licence remains a criminal offence.
    sources:
      - sndmar
      - uyxxi
  consumption:
    text: >-
      Smoking is allowed wherever tobacco is: not in enclosed public spaces, workplaces, schools or
      health facilities. Using in the street or a park is lawful, one of the most permissive rules
      anywhere. Working or driving under the influence is prohibited.
    sources:
      - law
      - wiki
  access:
    text: >-
      Only registered Uruguayan citizens and permanent residents aged 18+ can buy, at participating
      pharmacies, verified by fingerprint, up to 10 g a week (40 g a month) at a state-set price.
      Tourists are excluded. Each person must pick one route: pharmacy, club or home grow.
    sources:
      - ircca
      - wiki
context:
  production:
    text: >-
      Cannabis for pharmacies is grown by a handful of companies chosen by state tender, on
      state-controlled land, with the state setting price and genetics. Membership clubs (15–45
      members, up to 99 plants) are the only other producers. There is no open commercial licensing.
    sources:
      - law
      - wiki
  products:
    text: >-
      Pharmacies sell only a few state-specified flower varieties with capped THC — launched at very
      low potency and since raised, with the newest variety at up to about 20%. No edibles,
      concentrates or vapes in the legal market.
    sources:
      - wiki
      - ircca
  medical:
    text: >-
      Medical cannabis is legal and a 2019 law aimed to widen access, but few registered products
      exist, they are expensive, and most patients rely on the adult-use channels or home-made
      preparations instead.
    sources:
      - ircca
      - wiki
  consequences:
    text: >-
      Three state registries hold the identity of every legal buyer, grower and club member. Driving
      has a zero-tolerance THC rule, and employers may test for use at work. No criminal record
      arises from personal use.
    sources:
      - law
      - ircca
  planting:
    seeds: licensed
    seeds_trade: regulated
    clones: licensed
    clones_trade: regulated
    text: >-
      Seeds and cuttings move only inside the regulated system. The regulator IRCCA alone
      imports them, for licensed producers, registered home growers and membership clubs.
      Licensed producers may produce and dispense them, and home growers and clubs may produce
      seeds or cuttings only for their own crop, after registering with the national seed
      institute.
    sources:
      - d120
  clubs:
    status: regulated
    text: >-
      Membership clubs are one of three legal routes, alongside pharmacies and home growing,
      and a resident may register for only one. A club is a non-profit association of at most
      45 members growing up to 99 flowering plants. At the end of 2025 there were 557 clubs,
      in every department. By March 2026 some 575 clubs had about 20,200 members; with under a
      quarter of registered users they say they supply more than half of the legal cannabis,
      about 4.75 tonnes against 4.25 tonnes sold by pharmacies. The clubs are pressing to be
      allowed to serve tourists.
    sources:
      - ircca25
      - inf26
  black_market:
    text: >-
      Eleven years after legalisation, the government's second evaluation of the law found
      that 46% of current users were registered for one of the legal routes. Classic
      trafficking of pressed cannabis, the main source in 2014, supplied only 6.7% of users in
      2024. What remains is mostly a grey market of about 30%: cannabis from unregistered home
      growers and informal swaps, which the report calls distinct from traditional trafficking
      and less criminal, and one of the main unsolved problems. Pharmacies had 74,583
      registered buyers at the end of 2024, but only 20 to 40% of them bought in any month,
      and the report says supply and distribution problems keep the legal market at about half
      its potential.
    sources:
      - snd26
  driving:
    status: zero
    text: >-
      The regulating decree treats a driver's capacity as impaired whenever THC is detected in
      the body; it sets no numerical threshold. Traffic police, municipal inspectors and the
      coast guard may test, with devices chosen by the cannabis institute, and a driver who
      tests positive may ask for a confirming test at their own cost. The licence is withheld
      and the penalties of the road traffic law apply. The government's 2026 evaluation notes
      that roadside testing has so far been unsystematic and experimental, with regular
      monitoring planned from 2026.
    sources:
      - d120
      - snd26
  visitors:
    status: residents
    text: >-
      The legal market is closed to visitors. To buy in a pharmacy, join a club or register as
      a home grower, a person must be an adult with Uruguayan citizenship, natural or legal,
      or with proven permanent residence, and must be entered in the register with a Uruguayan
      identity card and proof of address; each person may use only one of the three routes. A
      tourist has no legal source.
    sources:
      - d120
  arrests:
    text: >-
      Uruguay publishes prosecutions for all drug offences together, not for cannabis alone.
      People charged with drug offences numbered 1,187 in 2013, the year the law passed, fell
      to 935 in 2018, and then rose to 2,085 in 2024, the highest in the series; throughout
      they were between 9 and 14% of everyone charged with any crime. The government's
      evaluation says the law reduced police and court action over minor cannabis conduct.
    sources:
      - snd26
