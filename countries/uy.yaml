name: Uruguay
region: South America
iso_numeric: 858
recreational: legal
medical: legal
updated: 2026-10-27
summary: >-
  First country to legalise (2013). Registered residents choose between growing six plants, joining
  a club, or buying up to 40 g a month in pharmacies at state-set prices.
scores:
  possession: 6
  cultivation: 4
  enforcement: 6
  sharing: 4
  consumption: 7
  access: 4
# The channel the access score cannot name (src/lib/answers.js).
answers:
  buy:
    answer: limited
    text: Only registered citizens and residents, at pharmacies or clubs; tourists are excluded
segments:
  possession:
    text: >-
      The drug law exempts a person who carries or keeps a quantity meant for their own use.[@art7] The
      judge decides that question, and the law treats up to 40 g of marijuana as a personal amount.[@art7, uy1494]
      That exemption stands whether or not the cannabis came from a pharmacy, a club or a
      registered home grow.[@d39] A harvest from up to six plants at home, or a club's harvest, is
      covered when it was grown as the law allows.[@d39] The regulating decree authorises possession for
      personal use on the same 40 g measure.[@d39] Possession that a judge finds is not for personal use
      carries two to twelve years.[@uy1494]
    sources:
      - art7
      - d39
      - uy1494
    penalties:
      - upto: 40 g
        treatment: legal
        note: Presumed to be for personal use, wherever it came from
      - over: 40 g
        treatment: criminal
        term: Delito, if a judge finds it is not for personal use
        prison_min: 2 years
        prison: 12 years
        note: A larger amount can still be judged personal
  cultivation:
    text: >-
      Registered residents may grow up to six flowering plants per household with an annual harvest
      of at most 480 g.[@law] Registration with the state regulator IRCCA is mandatory, and choosing home
      growing excludes you from pharmacies and clubs.[@ircca] Unregistered growing is an offence, with
      twenty months to ten years in prison, though a judge weighs whether it was for personal use.[@uy1494]
    sources:
      - law
      - ircca
      - uy1494
    penalties:
      - upto: 6 plants
        treatment: legal
        note: Registered home growers, up to 480 g a year
      - over: 6 plants
        treatment: criminal
        term: Delito
        prison_min: 20 months
        prison: 10 years
        note: A judge weighs whether it was for personal use. Growing without registration is also an offence
  enforcement:
    text: >-
      Personal possession is exempt when the cannabis is for the person's own use, whether or not
      that person is on a register.[@art7] Growing, selling and other supply without authorisation remain
      criminal offences.[@art7]
    sources:
      - art7
  sharing:
    text: >-
      Sharing or giving cannabis that was obtained legally, from a pharmacy, a registered club or a
      registered home grow, is not penalised.[@sndmar] The 2026 national evaluation counts that sharing as
      legal access: 20.9% of people who had used cannabis in the past year most often got it that
      way.[@sndmar] Buying cannabis for someone else, and sharing cannabis from an unregistered grow or from
      a dealer, sit outside that rule.[@sndmar] Sale without a licence remains a criminal offence.[@sndmar]
    sources:
      - sndmar
  consumption:
    text: >-
      Smoking is allowed wherever tobacco is: not in enclosed public spaces, workplaces, schools or
      health facilities.[@law] Using in the street or a park is lawful, one of the most permissive rules
      anywhere.[@wiki] Working or driving under the influence is prohibited.[@law]
    sources:
      - law
      - wiki
  access:
    text: >-
      Only registered Uruguayan citizens and permanent residents aged 18+ can buy, at participating
      pharmacies, verified by fingerprint, up to 10 g a week (40 g a month) at a state-set price.[@ircca]
      Tourists are excluded.[@ircca] Each person must pick one route: pharmacy, club or home grow.[@wiki]
    sources:
      - ircca
      - wiki
words:
  - { word: Faso, lang: Uruguayan Spanish, meaning: "Lunfardo slang for a marijuana cigarette", sources: [wiktionary-faso] }
  - { word: Porro, lang: Uruguayan Spanish, meaning: "a marijuana cigarette (joint, spliff, blunt)", sources: [wiktionary-porro] }
  - { word: Hierba, lang: Uruguayan Spanish, meaning: "literally grass; slang for marijuana", sources: [wiktionary-yerba] }
context:
  recreational:
    text: >-
      Uruguay is the only country where the state runs the whole market. A resident who wants
      cannabis legally signs up with the regulator [IRCCA](https://www.ircca.gub.uy/) for one of
      three routes: buying in a pharmacy, joining a club, or growing at home.[@law,ircca25] In a
      pharmacy, a fingerprint check allows up to 10 g a week at a price the state sets.[@law] Only a
      few state-chosen flower varieties are on sale, launched at very low strength and since raised
      to about 20% THC, and there are no edibles, concentrates or vapes.[@wiki,ircca] Banks,
      fearing trouble with the United States, refused to serve the legal trade, so pharmacies
      cannot take cards; only 40 were selling cannabis in December 2024, too few to cover the
      country.[@snd26] In 2024 about 46% of people who used cannabis were registered for a legal
      route; many others get it from friends or unregistered growers.[@sndmar]
    sources:
      - law
      - ircca25
      - wiki
      - ircca
      - snd26
      - sndmar
  medical:
    text: >-
      Medical cannabis is legal and a 2019 law aimed to widen access,[@ircca] but few registered products
      exist, they are expensive, and most patients rely on the adult-use channels or home-made
      preparations instead.[@wiki]
    sources:
      - ircca
      - wiki
  hemp:
    status: high
    text: >-
      Cannabis with no more than 1% THC counts as non-psychoactive hemp, licensed by the
      agriculture ministry rather than the cannabis regulator.[@uyxxi] In 2024, 31 companies were
      authorised to grow it, on about 100 hectares in the open and almost 23,000 m² under cover,
      half of the outdoor area in Canelones.[@uyxxi] Low-THC flowers are Uruguay's most valuable
      cannabis export, sold mainly to Switzerland and Czechia, and low-THC seed its largest by
      weight, sent mostly to Argentina.[@uyxxi]
    sources:
      - uyxxi
  production:
    status: state
    text: >-
      Cannabis for pharmacies is grown by a handful of companies chosen by state tender, on
      state-controlled land, with the state setting price and genetics.[@law,wiki] Membership clubs
      (15–45 members, up to 99 plants) are the only other producers of recreational
      cannabis.[@law] A separate medical and industrial sector, promoted by the state agency
      [Uruguay XXI](https://www.uruguayxxi.gub.uy/) and open to foreign investors, employs about
      700 people. In 2025 it produced 28.2 tonnes of medical cannabis, mostly non-psychoactive, and
      exported 45 tonnes of cannabis products worth about US$2.6 million: high-THC flower mainly
      to Germany and Portugal, medicines mainly to Brazil.[@uyxxi]
    sources:
      - law
      - wiki
      - uyxxi
  consequences:
    text: >-
      Three state registries hold the identity of every legal buyer, grower and club member.[@law, ircca] Driving
      has a zero-tolerance THC rule, and employers may test for use at work.[@law] No criminal record
      arises from personal use.[@law]
    sources:
      - law
      - ircca
  planting:
    seeds: licensed
    seeds_trade: regulated
    clones: licensed
    clones_trade: regulated
    text: >-
      Seeds and cuttings move only inside the regulated system.[@d120] The regulator IRCCA alone
      imports them, for licensed producers, registered home growers and membership clubs.[@d120]
      Licensed producers may produce and dispense them, and home growers and clubs may produce
      seeds or cuttings only for their own crop, after registering with the national seed
      institute.[@d120]
    sources:
      - d120
  clubs:
    status: regulated
    text: >-
      Membership clubs are one of three legal routes, alongside pharmacies and home growing,
      and a resident may register for only one.[@ircca25] A club is a non-profit association of at most
      45 members growing up to 99 flowering plants.[@ircca25] At the end of 2025 there were 557 clubs,
      in every department.[@ircca25] By March 2026 some 575 clubs had about 20,200 members; with under a
      quarter of registered users they say they supply more than half of the legal cannabis,
      about 4.75 tonnes against 4.25 tonnes sold by pharmacies.[@inf26] The clubs are pressing to be
      allowed to serve tourists.[@inf26]
    sources:
      - ircca25
      - inf26
  black_market:
    text: >-
      Eleven years after legalisation, the government's second evaluation of the law found
      that 46% of current users were registered for one of the legal routes.[@snd26] Classic
      trafficking of pressed cannabis, the main source in 2014, supplied only 6.7% of users in
      2024.[@snd26] What remains is mostly a grey market of about 30%: cannabis from unregistered home
      growers and informal swaps, which the report calls distinct from traditional trafficking
      and less criminal, and one of the main unsolved problems.[@snd26] Pharmacies had 74,583
      registered buyers at the end of 2024, but only 20 to 40% of them bought in any month,
      and the report says supply and distribution problems keep the legal market at about half
      its potential.[@snd26]
    sources:
      - snd26
  driving:
    status: zero
    text: >-
      The regulating decree treats a driver's capacity as impaired whenever THC is detected in
      the body; it sets no numerical threshold.[@d120] Traffic police, municipal inspectors and the
      coast guard may test, with devices chosen by the cannabis institute, and a driver who
      tests positive may ask for a confirming test at their own cost.[@d120] The licence is withheld
      and the penalties of the road traffic law apply.[@d120] The government's 2026 evaluation notes
      that roadside testing has so far been unsystematic and experimental, with regular
      monitoring planned from 2026.[@snd26]
    sources:
      - d120
      - snd26
  visitors:
    status: residents
    text: >-
      The legal market is closed to visitors.[@d120] To buy in a pharmacy, join a club or register as
      a home grower, a person must be an adult with Uruguayan citizenship, natural or legal,
      or with proven permanent residence, and must be entered in the register with a Uruguayan
      identity card and proof of address; each person may use only one of the three routes.[@d120] A
      tourist has no legal source.[@d120]
    sources:
      - d120
  arrests:
    text: >-
      Uruguay publishes prosecutions for all drug offences together, not for cannabis alone.[@snd26]
      People charged with drug offences numbered 1,187 in 2013, the year the law passed, fell
      to 935 in 2018, and then rose to 2,085 in 2024, the highest in the series; throughout
      they were between 9 and 14% of everyone charged with any crime.[@snd26] The government's
      evaluation says the law reduced police and court action over minor cannabis conduct.[@snd26]
    sources:
      - snd26
  culture:
    text: >-
      Uruguay legalised cannabis against the opinion of most Uruguayans. The idea entered public
      debate with the first Global Marijuana March in Montevideo in 2005, and was carried through by
      President [José Mujica](/culture/people/jose-mujica/), a former guerrilla, in
      [2013](/history/uruguay-legalisation-2013/).[@snd26,mujica] At the end of 2013, 66% opposed
      the law, and in 2014 60%.[@snd26] Ten years later opinion had shifted: in 2024 28% were neutral,
      and among those with a view, supporters slightly outnumbered opponents; people who use
      cannabis back it overwhelmingly.[@snd26] The [cannabis
      club](/culture/traditions/cannabis-social-clubs/), borrowed from Spain, became part of the
      law itself.[@law]
    sources:
      - snd26
      - mujica
      - law
  genetics:
    text: >-
      Uruguay has no old cannabis tradition of its own; its genetics are new.[@uyxxi] Licensed growers
      have been breeding national varieties, and the seed institute
      [INASE](https://www.inase.uy/) had more than 40 Uruguayan cultivars on its register in 2025,
      up from 11 a year earlier.[@uyxxi] About 88% are psychoactive, bred by at least ten companies,
      licensed producers and membership clubs.[@uyxxi] Seeds and cuttings may only move inside the
      regulated system.[@d120]
    sources:
      - uyxxi
      - d120
  research:
    status: licensed
    text: >-
      The cannabis regulator had granted 14 research licences by 2026, eight to private companies
      and six to public institutions such as the University of the Republic and the Clemente
      Estable Institute; they work on new varieties, extraction and medical extracts.[@uyxxi] In
      February 2025 the national research agency, the university, the drugs board and IRCCA set up a
      cannabis research fund.[@uyxxi] The law itself is studied closely: the government's
      [second evaluation](/history/uruguay-second-evaluation-2026/), in 2026, measured who uses the
      legal routes, what remains of the black market and how opinion has changed.[@snd26]
    sources:
      - uyxxi
      - snd26
  spotlights:
    - title: A registered user, by fingerprint
      text: >-
        Legal cannabis in Uruguay comes with registration. Every buyer, home grower and club member
        is on a state register, a person may use only one route, and pharmacies check a fingerprint
        before selling.[@law,ircca25] The registers are what let the state set prices, limit
        amounts and keep the market for residents, but they also mean that most people who use
        cannabis prefer not to sign up: in 2024 only about 46% were registered.[@sndmar]
      sources:
        - law
        - ircca25
        - sndmar
    - title: The clubs overtook the pharmacies
      text: >-
        The pharmacy route was meant to be the heart of the system, but it never grew enough: banks
        would not serve it and only a few dozen pharmacies took part.[@snd26] By March 2026 about
        575 clubs with some 20,200 members said they supplied more than half of all legal cannabis,
        about 4.75 tonnes against 4.25 tonnes sold in pharmacies, and they were pressing to be
        allowed to serve tourists.[@inf26]
      sources:
        - snd26
        - inf26

