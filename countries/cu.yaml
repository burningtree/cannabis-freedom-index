region: North America
iso_numeric: 192
recreational: death
medical: none
updated: 2026-10-14
summary: Simple cannabis possession can bring six months to two years, a fine or both. Cultivation carries four to ten years; aggravated drug offences can carry life imprisonment or death.
scores:
  possession: 0
  cultivation: 0
  enforcement: 1
  sharing: 0
  consumption: 1
  access: 0
segments:
  possession:
    text: >-
      Article 236(b) of the 2022 Penal Code punishes simple possession of cannabis or its
      derivatives without the required authorisation or prescription with six months to two
      years in prison, a fine of 200–500 quotas, or both. This is separate from the higher
      trafficking ranges. The provision establishes no lawful personal-use quantity.
    sources:
      - ley151
  cultivation:
    text: >-
      Article 235(1)(d) punishes unauthorised cannabis cultivation and knowing possession of
      its seeds or plant parts with four to ten years. Land can be confiscated or usufruct and
      occupancy rights withdrawn. Aggravating circumstances can bring a higher range.
    sources:
      - ley151
  enforcement:
    text: >-
      Officials describe a policy of zero tolerance and severe punishment. In November 2023
      the Supreme Court reported 689 people sanctioned for offences linked to drug trafficking
      that year to date, 92% with prison sentences. Those figures cover drugs generally and
      do not establish a cannabis-only imprisonment rate.
    sources:
      - oncuba
  sharing:
    text: >-
      Article 235(1)(a) includes providing illicit drugs to another person, without requiring
      payment in every case, within the four-to-ten-year range. Article 235(2) provides ten to
      thirty years, life imprisonment or death for specified aggravated circumstances,
      including international trafficking.
    sources:
      - ley151
  consumption:
    text: >-
      The government describes its drug policy as zero tolerance. Cannabis possession can
      bring prison under article 236; that provision punishes possession rather than defining
      a separate act of consumption. Article 235 also punishes operating premises intended
      for gatherings to consume illicit drugs. Officials report free detoxification treatment.
    sources:
      - ley151
      - oncuba
  access:
    text: No legal source.
    sources:
      - oncuba
context:
  death_penalty:
    text: >-
      Law 87 of 1999 provided fifteen to thirty years or death for specified aggravated drug
      offences. The replacement 2022 Code's article 235(2) provides ten to thirty years, life
      imprisonment or death and lists broader aggravating circumstances. Simple possession
      has a separate lower range in article 236. No execution for a cannabis offence was found
      in the sources read.
    sources:
      - ley87
      - ley151
  recreational:
    text: >-
      There is no legal recreational supply. Simple possession without authorisation or
      prescription brings six months to two years and a 200–500 quota fine, with no lawful
      personal-use quantity.[@ley151] Officials describe zero tolerance with severe
      punishment, and running premises for group consumption is separately
      punished.[@oncuba,ley151]
    sources:
      - ley151
      - oncuba
  planting:
    seeds: illegal
    seeds_trade: banned
    clones: illegal
    clones_trade: banned
    text: >-
      Article 235(1)(d) of the 2022 Penal Code punishes unauthorised cultivation of Cannabis,
      known as marihuana, and knowing possession of its seeds or plant parts with four to ten
      years. This is distinct from article 236's simple-possession provision. No lawful
      personal cultivation or seed-supply route was established.
    sources:
      - ley151
  production:
    text: Reliable national information about lawful cannabis production was not established by the retained sources.
    sources: []
  products:
    text: Reliable national information about legally available cannabis products was not established by the retained sources.
    sources: []
  medical:
    text: The retained sources do not establish whether a medical cannabis programme operates.
    sources: []
  consequences:
    text: A conviction is a criminal record with lasting effects on work and travel.
    sources:
      - cn1
  clubs:
    status: none
    text: >-
      No lawful cannabis-club route was established. Article 235 prohibits unauthorised
      cultivation and supply and also punishes operating premises intended for people to
      gather and consume illicit drugs.
    sources:
      - ley151
  visitors:
    status: none
    text: >-
      No lawful recreational supply for visitors was established. Article 236 applies a
      separate simple-cannabis-possession range of six months to two years, a fine or both;
      introduction and supply fall under article 235's higher ranges. The code does not
      establish a visitor exemption.
    sources:
      - ley151
  arrests:
    text: >-
      Official figures released in November 2023 counted 689 people sanctioned for drug-
      trafficking offences that year to date, 92 per cent of them with prison, and 1,213
      Cubans and 13 foreigners prosecuted between January and September. The interior
      ministry reported 2,290 kg of drugs seized in those nine months and 77 cases of
      marijuana growing, concentrated in the eastern provinces; its anti-drug chief called
      marijuana the most consumed drug. In three weeks of October and November 193 people
      were detained for trafficking and possession. The totals cover drugs generally, except
      for the separately identified cannabis-growing cases; they are not national counts of
      cannabis arrests or convictions alone.
    sources:
      - oncuba23
