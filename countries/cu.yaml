segments:
  possession:
    text: >-
      Illegal with no personal-use threshold. Under the 2022 Penal Code simple possession typically
      carries six months to two years in prison plus fines.
    sources:
      - cr
  cultivation:
    text: Cultivation or production of significant quantities carries four to twenty years.
    sources:
      - cr
      - cn1
  enforcement:
    text: >-
      One of the Caribbean's strictest regimes. A 2025 Supreme Court ruling hardened prosecution
      standards for cannabinoid offences, and courts have staged public 'exemplary' trials.
    sources:
      - cn1
      - cr
  sharing:
    text: >-
      Trafficking brings long sentences — recent exemplary trials have handed down around nine years
      for selling marijuana — and fifteen to thirty for cross-border cases.
    sources:
      - cn2
      - cn1
  consumption:
    text: Use is treated through the possession offence.
    sources:
      - cr
  access:
    text: None.
    sources:
      - cr
context:
  death_penalty:
    text: >-
      Since Law 87 of 1999 the Penal Code has allowed fifteen to thirty years or death for drug
      trafficking by officials, international trafficking and cases that use children. In 2023 the
      head of the Supreme Court's criminal chamber said the code punishes drug offences with up to
      death. No execution for a cannabis offence was found in the sources read.
    sources:
      - ley87
      - oncuba
  planting:
    seeds: illegal
    seeds_trade: banned
    clones: illegal
    clones_trade: banned
    text: >-
      Article 190 of the Penal Code, as rewritten in 1999, punished growing the plant known as
      marihuana and knowingly possessing its seeds or parts of the plant with four to ten years in
      prison. The 2022 Penal Code was not read, so the current wording is not confirmed.
    sources:
      - ley87
  production:
