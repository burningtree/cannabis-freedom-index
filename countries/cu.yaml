segments:
  possession:
    text: >-
      Illegal with no personal-use threshold; the government describes its policy as zero tolerance.
      The president of the Supreme Court's criminal chamber said in November 2023 that possession
      and trafficking carry four to thirty years in prison, and that 92% of the 689 people
      sanctioned for drug offences that year were sent to prison.
    sources:
      - oncuba
  cultivation:
    text: Cultivation or production of significant quantities carries four to twenty years.
    sources:
      - cn1
  enforcement:
    text: >-
      One of the Caribbean's strictest regimes. A 2025 Supreme Court ruling hardened prosecution
      standards for cannabinoid offences, and courts have staged public 'exemplary' trials.
    sources:
      - cn1
  sharing:
    text: >-
      Trafficking brings long sentences — recent exemplary trials have handed down around nine years
      for selling marijuana — and fifteen to thirty for cross-border cases.
    sources:
      - cn2
      - cn1
  consumption:
    text: >-
      The government describes its drug policy as zero tolerance, and a person found with a drug
      is prosecuted for possession, which carries prison. The state offers free detoxification
      treatment.
    sources:
      - oncuba
  access:
    text: No legal source.
    sources:
      - oncuba
context:
  death_penalty:
    text: >-
      Since Law 87 of 1999 the Penal Code has allowed fifteen to thirty years or death for drug
      trafficking by officials, international trafficking and cases that use children. In 2023 the
      head of the Supreme Court's criminal chamber said the code punishes drug offences with up to
      death. No execution for a cannabis offence was found in the sources read.
    sources:
      - ley87
      - oncuba
  planting:
    seeds: illegal
    seeds_trade: banned
    clones: illegal
    clones_trade: banned
    text: >-
      Article 190 of the Penal Code, as rewritten in 1999, punished growing the plant known as
      marihuana and knowingly possessing its seeds or parts of the plant with four to ten years in
      prison. The 2022 Penal Code was not read, so the current wording is not confirmed.
    sources:
      - ley87
  production:
    text: Reliable national information about lawful cannabis production was not established by the retained sources.
    sources: []
  products:
    text: Reliable national information about legally available cannabis products was not established by the retained sources.
    sources: []
  medical:
    text: The retained sources do not establish whether a medical cannabis programme operates.
    sources: []
  consequences:
    text: A conviction is a criminal record with lasting effects on work and travel.
    sources:
      - cn1
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited, and the law provides for the death
      penalty for the most serious drug offences.
    sources:
      - cn1
      - cn2
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. The government describes its policy as
      zero tolerance; the president of the Supreme Court's criminal chamber said in November
      2023 that possession and trafficking carry four to thirty years in prison, and that 92% of
      those sanctioned for drug offences that year were sent to prison.
    sources:
      - oncuba
