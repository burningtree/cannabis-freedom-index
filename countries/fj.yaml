segments:
  possession:
    text: >-
      Possession is a crime under the Illicit Drugs Control Act 2004, which sets a single maximum of
      life imprisonment for all drug offences. In practice sentencing follows the Court of Appeal's
      2012 Sulua guideline: for up to 100 g of cannabis a non-custodial sentence — a fine, community
      service, counselling or a discharge with a warning — with a short or suspended prison term
      only in the worst cases. 100 g to 1 kg brings one to three years; 1–4 kg three to seven; above
      4 kg seven to fourteen.
    sources:
      - sulua
  cultivation:
    text: >-
      Cultivation is an offence under the same Act; the courts apply a separate tariff scaled to the
      number of plants, with non-custodial outcomes for a few plants.
    sources:
      - sulua
      - wiki
  enforcement:
    text: >-
      Courts are directed to keep small-scale users out of prison, though a conviction is still
      entered. Cannabis is widely grown in the interior and on outer islands, where police run
      regular uprooting operations.
    sources:
      - sulua
      - wiki
  sharing:
    text: Supply is sentenced on the same weight bands as possession, treated more seriously.
    sources:
      - sulua
  consumption:
    text: Use is covered by the possession offence.
    sources:
      - wiki
  access:
    text: >-
      None: possession, cultivation and supply are all offences under the Illicit Drugs Control
      Act 2004.
    sources:
      - sulua
context:
  production:
    text: >-
      Industrial hemp at up to 1% THC was removed from the drugs law in 2022; no other licensed
      production.
    sources:
      - wiki
  products:
    text: No legal THC products.
    sources:
      - wiki
  medical:
    text: No medical cannabis programme.
    sources:
      - wiki
  consequences:
    text: A conviction is a criminal record, which can affect overseas work and travel.
    sources:
      - sulua
  planting:
    seeds: illegal
    seeds_trade: banned
    clones: illegal
    clones_trade: banned
    text: >-
      Schedule 1 of the Illicit Drugs Control Act lists cannabis seed by name as an illicit
      drug, alongside the plant, its fruit, resin and oil, and the Act bans importing,
      cultivating, selling, supplying and possessing them. Since the 2022 amendment hemp with
      no more than 1% THC is excluded, but a person who claims a plant is hemp must prove it.
    sources:
      - bill41
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited.
    sources:
      - sulua
      - wiki
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. British travel advice says possession
      of even small quantities of illegal drugs can lead to imprisonment and a large fine, and
      that possession of any amount of marijuana carries a 3-month prison sentence.
    sources:
      - wiki
      - fcdo
  driving:
    status: impairment
    text: >-
      Land Transport Act section 102 makes driving or being in charge while drug influence
      prevents proper vehicle control an offence. Police can forbid driving, take the keys
      and immobilise or remove the vehicle until the person can control it, with a right to
      request review by a more senior officer in the circumstances specified by the Act.
      The government's published statutory penalty schedule lists a maximum FJ$5,000 fine
      or five years' imprisonment or both, plus five years' disqualification, subject to
      the court's statutory powers concerning disqualification. These are court penalties,
      not a roadside ticket tariff. Section 103's numerical concentration offence concerns
      alcohol; no quantified THC threshold appears in section 102. The Trade Portal's
      February 2025 upload reproduces a text incorporating 1999 and 2000 amendments; later
      changes to the penalty schedule remain a verification target.
    sources:
      - landtraffic
  arrests:
    text: >-
      Fiji recorded 6,659 drug cases between 2019 and 2023, and marijuana accounted for 94
      per cent of them, with methamphetamine and cocaine making up the rest, according to
      figures reported by the Pacific Islands News Association.
    sources:
      - pina24
