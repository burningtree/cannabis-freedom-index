name: Fiji
region: Oceania
iso_numeric: 242
recreational: illegal
medical: none
updated: 2026-10-26
summary: >-
  Cannabis possession remains criminalised, with court guidelines favouring non-custodial sentences for
  up to 100 g. A separate hemp exemption was approved in 2022. A drug-law rewrite signed in October 2026
  provides for commencement by ministerial notice.
answers:
  caught:
    answer: limited
    label: Guideline sentences
    text: >-
      For up to 100 g, guidelines favour non-custodial sentences; short or suspended custody remains
      possible in the worst cases
scores:
  possession: 1
  cultivation: 1
  enforcement: 3
  sharing: 1
  consumption: 1
  access: 0
segments:
  possession:
    text: >-
      The 2004 drug law makes unauthorised possession an offence carrying a maximum FJ$1 million fine,
      life imprisonment, or both.[@act2004] The 2012 Sulua court guidelines favour fines, community service,
      counselling or discharge with a warning for up to 100 g, reserving suspended or short prison terms
      for the worst cases. Higher weight bands run from one to three years, three to seven years and
      seven to fourteen years.[@seru] The law signed on 2 October 2026 sets a separate personal-use offence for
      cannabis plant material, with a maximum FJ$500 fine or three months in prison, or both, and
      restricts custody to prior-conviction or exceptional cases; at 28 g a rebuttable presumption
      of supply begins.[@act2026] It provides for commencement by ministerial Gazette
      notice.[@act2026]
    sources:
      - act2004
      - seru
      - act2026
    currency: FJD
    penalties:
      - upto: 28 g
        treatment: criminal
        prison: 3 months
        fine: 500
        note: Diversion into support programmes; custody only with prior convictions or in exceptional cases; 2026 Act commences by Gazette notice
      - over: 28 g
        treatment: criminal
        term: Presumed supply
        note: Rebuttable presumption; penalty then depends on the supply provisions
      - label: Unauthorised possession under the 2004 Act
        treatment: criminal
        fine: 1000000
        note: Maximum FJ$1 million fine, life imprisonment, or both, until the 2026 Act replaces the 2004 Act
  cultivation:
    text: >-
      Unauthorised cannabis cultivation is an offence. The 2023 Seru guidelines combine plant count with
      the grower’s role: fewer than ten plants for personal use and a lesser role fall in a non-custodial
      to suspended-sentence range. Leading-role cultivation of 100 or more plants has an eighteen-year
      starting point and a sixteen-to-twenty-year range, before the remaining sentencing adjustments.
    sources:
      - act2004
      - seru
  enforcement:
    text: >-
      The Sulua guidelines favour outcomes outside prison for possession of up to 100 g, with custody
      available in the worst cases. Cultivation sentences can be lengthy: in May 2024 the appeal court
      applied the newer guidelines to two growers and reduced their prison terms from nineteen and
      eighteen years to fifteen and fourteen.
    sources:
      - seru
      - appeal2024
  sharing:
    text: >-
      The 2004 law defines supply to include giving cannabis to another person. The same statutory
      maximum applies to possession and supply, and Sulua’s weight-based guidelines were applied across
      the listed drug offences. The 2026 law signed in October separates personal use from supply, with
      commencement to be set by ministerial notice.
    sources:
      - act2004
      - seru
      - act2026
  consumption:
    text: >-
      The 2004 law expressly prohibits unauthorised use or administration of an illicit drug, including
      cannabis. Its medical-treatment and lawful-profession exceptions are set out separately in section
      11.
    sources:
      - act2004
  access:
    text: >-
      Recreational possession, cultivation and supply are criminal offences. Lawfully prescribed or
      supplied treatment and authorised professional activity are covered by statutory exceptions.
    sources:
      - act2004
context:
  recreational:
    text: >-
      Recreational possession, cultivation and supply are criminal offences with no legal
      market.[@act2004] The October 2026 law creates a separate personal-use offence for cannabis
      plant material — at most a FJ$500 fine or three months in prison — with diversion into
      support programmes, but it commences only by ministerial Gazette notice.[@act2026]
    sources:
      - act2004
      - act2026
  hemp:
    text: >-
      Hemp and plant parts derived from it at no more than 1% THC are excluded from the schedule’s
      references to the cannabis plant; a person claiming the exemption in a prosecution bears
      the burden of proving it.[@hemp2022]
    sources:
      - hemp2022
  production:
    text: >-
      The 2022 amendment excludes hemp and hemp-derived plant parts at no more than 1% THC from the
      schedule’s references to the cannabis plant. The budget proposal envisaged an export industry,
      laboratory-tested imports, Fiji National University growing trials and seed distribution to
      farmers.
    sources:
      - hemp2022
      - budget2022
  products:
    text: >-
      The 2004 drug schedule lists cannabis, resin, oil, seed and plant material. The 2022 hemp exemption
      concerns hemp and plant parts derived from it at no more than 1% THC; a person claiming the
      exemption in a prosecution bears the burden of proving it.
    sources:
      - act2004
      - hemp2022
  medical:
    text: >-
      Fiji has been developing a medicinal cannabis industry proposal. Separately, section 11 of the 2004
      drug law exempts lawfully prescribed or supplied treatment and permits health-authority licensing
      of drug imports, exports or manufacture.
    sources:
      - act2004
      - medical2024
  consequences:
    text: >-
      Cannabis offences can lead to conviction, fines and imprisonment. The guidelines for possession of
      up to 100 g also allow counselling, community service or discharge with a strong warning.
    sources:
      - act2004
      - seru
  planting:
    seeds: illegal
    seeds_trade: banned
    clones: illegal
    clones_trade: banned
    text: >-
      Schedule 1 of the Illicit Drugs Control Act lists cannabis seed by name as an illicit drug,
      alongside the plant, its fruit, resin and oil, and the Act bans importing, cultivating, selling,
      supplying and possessing them. Since the 2022 amendment hemp with no more than 1% THC is excluded,
      but a person who claims a plant is hemp must prove it.
    sources:
      - act2004
      - hemp2022
  clubs:
    status: none
    text: >-
      Unauthorised cannabis cultivation and supply, including giving it to another person, are prohibited
      under the drug law.
    sources:
      - act2004
  visitors:
    status: none
    text: >-
      Recreational cannabis possession and supply are criminal offences. For possession up to 100 g,
      sentencing guidelines favour fines, community service, counselling or a warning, with short or
      suspended custody reserved for the worst cases. Section 11 of the 2004 law separately exempts
      people entering, leaving or transiting Fiji with up to one month of an illicit drug lawfully
      prescribed or supplied for treatment of themselves or someone in their care.
    sources:
      - act2004
      - seru
  driving:
    status: impairment
    text: >-
      Land Transport Act section 102 makes driving or being in charge while drug influence prevents
      proper vehicle control an offence. Police can forbid driving, take the keys and immobilise or
      remove the vehicle until the person can control it, with a right to request review by a more senior
      officer in the circumstances specified by the Act. The government's published statutory penalty
      schedule lists a maximum FJ$5,000 fine or five years' imprisonment or both, plus five years'
      disqualification, subject to the court's statutory powers concerning disqualification. These are
      court penalties, not a roadside ticket tariff. Section 103's numerical concentration offence
      concerns alcohol; no quantified THC threshold appears in section 102. The Trade Portal's February
      2025 upload reproduces a text incorporating 1999 and 2000 amendments; later changes to the penalty
      schedule remain a verification target.
    sources:
      - landtraffic
  arrests:
    text: >-
      Fiji recorded 6,659 drug cases between 2019 and 2023, and marijuana accounted for 94 per cent of
      them, with methamphetamine and cocaine making up the rest, according to figures reported by the
      Pacific Islands News Association.
    sources:
      - pina24
