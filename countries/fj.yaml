segments:
  possession:
    text: >-
      The 2004 drug law makes unauthorised possession an offence carrying a maximum FJ$1 million fine,
      life imprisonment, or both.[@act2004] The 2012 Sulua court guidelines favour fines, community
      service, counselling or discharge with a warning for up to 100 g, reserving suspended or short
      prison terms for the worst cases. Higher weight bands run from one to three years, three to
      seven years and seven to fourteen years.[@seru] The law signed on 2 October 2026, awaiting
      verified commencement, sets a separate personal-use offence for cannabis plant material, with a
      maximum FJ$500 fine or three months in prison, or both, and restricts custody to
      prior-conviction or exceptional cases; at 28 g a rebuttable presumption of supply
      begins.[@act2026] Commencement requires a ministerial Gazette notice; no notice activating this
      personal-use tier was verified through 27 October 2026.[@act2026]
    sources:
      - act2004
      - seru
      - act2026
    currency: FJD
    penalties:
      - label: Unauthorised possession under the 2004 Act
        treatment: criminal
        term: Possession
        fine: 1000000
        note: >-
          Statutory maximum: life imprisonment, a fine, or both; court guidelines favour non-custodial
          outcomes for up to 100 g
  cultivation:
    text: >-
      Unauthorised cannabis cultivation is an offence.[@act2004] The 2023 Seru guidelines combine
      plant count with the grower’s role: fewer than ten plants for personal use and a lesser role fall
      in a non-custodial to suspended-sentence range.[@seru] Leading-role cultivation of 100 or more
      plants has an eighteen-year starting point and a sixteen-to-twenty-year range, before the
      remaining sentencing adjustments.[@seru]
    sources:
      - act2004
      - seru
    currency: FJD
    penalties:
      - label: Fewer than ten plants, personal use, lesser role
        treatment: criminal
        term: Cultivation
        note: Non-custodial to suspended-sentence range under the 2023 Seru guidelines
      - label: Leading role, 100 or more plants
        treatment: criminal
        term: Cultivation
        prison_min: 16 years
        prison: 20 years
        note: Eighteen-year starting point with a sixteen-to-twenty-year range, before remaining sentencing adjustments
      - label: Unauthorised cultivation under the 2004 Act (statutory maximum)
        treatment: criminal
        term: Cultivation
        fine: 1000000
        note: Maximum FJ$1 million fine, life imprisonment, or both
  enforcement:
    text: >-
      The Sulua guidelines favour outcomes outside prison for possession of up to 100 g, with custody
      available in the worst cases. Cultivation sentences can be lengthy: in May 2024 the appeal court
      applied the newer guidelines to two growers and reduced their prison terms from nineteen and
      eighteen years to fifteen and fourteen.[@appeal2024]
    sources:
      - appeal2024
  sharing:
    text: >-
      The 2004 law defines supply to include giving cannabis to another person. The same statutory
      maximum applies to possession and supply, and Sulua’s weight-based guidelines were applied across
      the listed drug offences.[@act2004,seru] The 2026 law signed in October separates personal use
      from supply, with commencement to be set by ministerial notice.[@act2026]
    sources:
      - act2004
      - seru
      - act2026
    currency: FJD
    penalties:
      - label: Supply under the 2004 Act (statutory maximum)
        treatment: criminal
        term: Supply
        fine: 1000000
        note: Maximum FJ$1 million fine, life imprisonment, or both; weight-based guidelines applied across the listed drug offences
  consumption:
    text: >-
      The 2004 law expressly prohibits unauthorised use or administration of an illicit drug, including
      cannabis.[@act2004] Its medical-treatment and lawful-profession exceptions are set out separately
      in section 11.[@act2004]
    sources:
      - act2004
  access:
    text: >-
      Recreational possession, cultivation and supply are criminal offences. Lawfully prescribed or
      supplied treatment and authorised professional activity are covered by statutory
      exceptions.[@act2004]
    sources:
      - act2004
context:
  recreational:
    text: >-
      Recreational possession, cultivation and supply are criminal offences with no legal
      market.[@act2004] The October 2026 law creates a separate personal-use offence for cannabis
      plant material — at most a FJ$500 fine or three months in prison — with diversion into
      support programmes, but it commences only by ministerial Gazette notice.[@act2026]
    sources:
      - act2004
      - act2026
  hemp:
    status: high
    text: >-
      Hemp and plant parts derived from it at no more than 1% THC are excluded from the schedule’s
      references to the cannabis plant; a person claiming the exemption in a prosecution bears
      the burden of proving it.[@hemp2022]
    sources:
      - hemp2022
  production:
    status: none
    text: >-
      Cabinet approved a policy to develop a medicinal cannabis industry in February 2024, with
      company approval dependent on the industry being established by law.[@cabinet2024] The separate
      2022 amendment concerns a low-THC hemp exemption.[@hemp2022] The October 2026 drug-law rewrite
      requires ministerial Gazette notices to commence.[@act2026]
    sources:
      - cabinet2024
      - hemp2022
      - act2026
  medical:
    text: >-
      Fiji has been developing a medicinal cannabis industry proposal. Separately, section 11 of the 2004
      drug law exempts lawfully prescribed or supplied treatment and permits health-authority licensing
      of drug imports, exports or manufacture.[@act2004,medical2024]
    sources:
      - act2004
      - medical2024
  consequences:
    text: >-
      Cannabis offences can lead to conviction, fines and imprisonment. The guidelines for possession of
      up to 100 g also allow counselling, community service or discharge with a strong
      warning.[@act2004,seru]
    sources:
      - act2004
      - seru
  planting:
    seeds: illegal
    seeds_trade: banned
    clones: illegal
    clones_trade: banned
    text: >-
      Schedule 1 of the Illicit Drugs Control Act lists cannabis seed by name as an illicit drug,
      alongside the plant, its fruit, resin and oil, and the Act bans importing, cultivating, selling,
      supplying and possessing them. Since the 2022 amendment hemp with no more than 1% THC is excluded,
      but a person who claims a plant is hemp must prove it.[@act2004,hemp2022]
    sources:
      - act2004
      - hemp2022
  clubs:
    status: none
    text: >-
      Unauthorised cannabis cultivation and supply, including giving it to another person, are
      prohibited under the drug law.[@act2004]
    sources:
      - act2004
  visitors:
    status: none
    text: >-
      Recreational cannabis possession and supply are criminal offences.[@act2004] For possession up
      to 100 g, sentencing guidelines favour fines, community service, counselling or a warning, with
      short or suspended custody reserved for the worst cases.[@seru] Section 11 of the 2004 law
      separately exempts
      people entering, leaving or transiting Fiji with up to one month of an illicit drug lawfully
      prescribed or supplied for treatment of themselves or someone in their care.[@act2004]
    sources:
      - act2004
      - seru
  driving:
    status: impairment
    text: >-
      Land Transport Act section 102 makes driving or being in charge while drug influence prevents
      proper vehicle control an offence.[@landtraffic] Police can forbid driving, take the keys and
      immobilise or remove the vehicle until the person can control it, with a right to request review
      by a more senior officer in the circumstances specified by the Act.[@landtraffic] The
      government's published statutory penalty schedule lists a maximum FJ$5,000 fine or five years'
      imprisonment or both, plus five years' disqualification, subject to the court's statutory powers
      concerning disqualification.[@landtraffic] These are court penalties, not a roadside ticket
      tariff.[@landtraffic] Section 103's numerical concentration offence concerns alcohol; no
      quantified THC threshold appears in section 102.[@landtraffic] The Trade Portal's February 2025
      upload reproduces a text incorporating 1999 and 2000 amendments; later changes to the penalty
      schedule remain a verification target.[@landtraffic]
    sources:
      - landtraffic
  arrests:
    text: >-
      Fiji recorded 6,659 drug cases between 2019 and 2023, and marijuana accounted for 94 per cent of
      them, with methamphetamine and cocaine making up the rest, according to figures reported by the
      Pacific Islands News Association.[@pina24]
    sources:
      - pina24
  culture:
    text: >-
      Cannabis in Fiji is known as [Indian hemp](/culture/language/indian-hemp/), the colonial name
      used in the 1938 Dangerous Drugs Ordinance.[@act2004] It is grown locally, especially on Kadavu,
      and traditional use includes boiling leaves in coconut oil as a skin treatment.[@fijiTimes25]
      The modern law treats it as an illicit drug, with no cultural exemption.[@act2004]
    sources:
      - act2004
      - fijiTimes25
  black_market:
    text: >-
      Fiji recorded 2,446 drug cases from May 2024 to May 2025, of which 2,098, or 85.7 per cent, were
      marijuana; 50 involved juveniles and 1,506 were aged 18–35.[@fijivillage25] Operation Sasamaki,
      launched on 1 March 2025, destroyed 18.2 tonnes of marijuana across nine phases, valued at
      FJ$241 million, and arrested 1,239 people, mostly for possession and cultivation.[@fijisun26]
      Kadavu is the best-known growing area, with more than 10,000 plants uprooted in 2023, while
      methamphetamine and cocaine transshipment has surged.[@fijiTimes25] No reliable per-gram retail
      price was found.[@fijisun26]
    sources:
      - fijivillage25
      - fijisun26
      - fijiTimes25
