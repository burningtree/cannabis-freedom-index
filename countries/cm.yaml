name: Cameroon
region: Africa
iso_numeric: 120
recreational: illegal
medical: none
updated: 2026-10-21
summary: >-
  Growing cannabis is banned. The main offences allow 10 to 20 years in prison, a fine,
  or both; a small amount possessed, bought or grown for personal use falls under a
  lighter tier, and a court can waive punishment after a promise not to reoffend.
scores:
  possession: 1
  cultivation: 1
  enforcement: 1
  sharing: 1
  consumption: 1
  access: 0
segments:
  possession:
    text: >-
      Article 102 of Law 97/019 sets a lighter tier for holding, buying or growing a small amount
      meant for personal use: 2 months to 1 year, a fine of 25,000 to 1,250,000 CFA francs,
      or both for a high-risk plant or substance, including cannabis oil. A cannabis derivative
      other than oil carries 1 to 6 months, a fine of 25,000 to 500,000 CFA francs, or both.
      The court may waive the penalty if the person solemnly promises
      not to reoffend. Larger amounts fall under Article 93 (10 to 20 years).
    sources:
      - loi97
  cultivation:
    text: >-
      Article 8 bans growing the cannabis plant, and landowners must destroy plantations that
      appear on their land. Article 91 punishes cultivation of high-risk drugs with 10 to 20 years,
      a fine of 250,000 to 1,250,000 CFA francs, or both; Article 102 gives the lighter personal-use
      tier for a small amount.
    sources:
      - loi97
  enforcement:
    text: >-
      The statute allows prison, a fine, or both for personal-use offences and the main
      cultivation and trafficking offences. Courts can waive personal-use punishment after
      a solemn promise not to reoffend. How often these options are used is not shown by the statute.
    sources:
      - loi97
  sharing:
    text: >-
      Article 95 punishes giving or offering a high-risk drug to a person for their own use with 2
      to 5 years, a fine of 50,000 to 2,500,000 CFA francs, or both. General selling and distributing
      offences allow 10 to 20 years, a fine, or both (Article 93).
    sources:
      - loi97
  consumption:
    text: >-
      Article 101 forbids using controlled drugs without a medical prescription and orders any
      drug found on a user seized. The penalty set for the user in the text is the
      possession tier of Article 102.
    sources:
      - loi97
  access:
    text: >-
      Cannabis and its resin are placed in Table I, according to the justice ministry's
      2017 presentation. Article 9 prohibits ordinary handling of Table I drugs, subject
      to Article 77, which allows ministerial authorisation for medical or scientific
      research, training and forensic work in strictly necessary quantities. The retained
      sources establish no operating cannabis treatment supply programme.
    sources:
      - loi97
      - spm17
context:
  production:
    status: none
    text: Reliable national information about lawful cannabis production was not established by the retained sources.
    sources: []
  products:
    text: Reliable national information about legally available cannabis products was not established by the retained sources.
    sources: []
  medical:
    text: The retained sources do not establish whether a medical cannabis programme operates.
    sources: []
  consequences:
    text: >-
      For offences listed in Articles 91–99, courts may impose a country ban on foreigners
      lasting two to ten years or permanently, and restrictions on civic rights, travel,
      driving or professional work; the professional ban can also be permanent. Article 113
      permits treatment instead of or alongside punishment for convicted people with drug
      dependence in the specified cases. Evading treatment carries two to five years,
      a fine, or both.
    sources:
      - loi97
  planting:
    seeds: grey
    seeds_trade: unclear
    clones: illegal
    clones_trade: banned
    text: >-
      Article 8 of Law 97/019 bans growing the cannabis plant anywhere in the country and
      obliges landholders to destroy plantations that appear on their land. The law speaks of
      plants and substances and does not mention seeds.
    sources:
      - loi97
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited.
    sources:
      - loi97
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. For convictions under Articles
      91–99 of the drug law, Article 111 allows courts to bar a foreigner from Cameroon for
      two to ten years or permanently. The personal-use offence in Article 102 is outside
      that stated list.
    sources:
      - spm17
      - loi97
  driving:
    status: impairment
    text: >-
      Article 103 of the drug law punishes driving under the influence of cannabis with the
      penalties the Penal Code sets for driving while drunk or intoxicated, given by the justice
      ministry as six months to ten years in prison and a fine of 20,000 to 1,000,000 CFA
      francs, or one of the two. Where someone is killed or injured the penalties for that
      offence are doubled. No measured limit is mentioned.
    sources:
      - spm17
  black_market:
    text: >-
      Figures reported by the government to the UN drugs office record 6,861 kg of herbal
      cannabis seized in 2024, against 6,639 kg in 2023. The UN publishes them as kilogram
      equivalents, and countries count seizures differently, so the figures are not
      comparable across borders.
    sources:
      - unodc_szr
