segments:
  possession:
    text: >-
      Cannabis is a 'high-risk drug' under Law 97/019 of 1997. Possession of even a small amount for
      personal use is a criminal offence with prison and a fine reported at 25,000 to 1,250,000 CFA
      francs.
    sources:
      - cr
      - tb
  cultivation:
    text: >-
      Cultivation, production and marketing carry 10 to 20 years. Cannabis — banga or kaya — is
      nonetheless widely grown in the Northwest and Southwest regions.
    sources:
      - cr
  enforcement:
    text: Enforcement is active despite widespread cultivation, and sentences are long.
    sources:
      - cr
  sharing:
    text: Supply falls under the 10-to-20-year trafficking provisions.
