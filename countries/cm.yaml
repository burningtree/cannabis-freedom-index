name: Cameroon
region: Africa
iso_numeric: 120
recreational: illegal
medical: none
updated: 2026-10-13
summary: >-
  Growing cannabis is banned and the main offences carry 10 to 20 years, but a small amount held
  or grown for personal use falls under a lighter tier with months, not years.
scores:
  possession: 1
  cultivation: 1
  enforcement: 1
  sharing: 1
  consumption: 1
  access: 0
segments:
  possession:
    text: >-
      Article 102 of Law 97/019 sets a lighter tier for holding, buying or growing a small amount
      meant for personal use: 2 months to 1 year and a fine of 25,000 to 1,250,000 CFA francs for
      a high-risk drug, and 1 to 6 months and 25,000 to 500,000 CFA francs for a cannabis
      derivative other than oil. The court may waive the penalty if the person solemnly promises
      not to reoffend. Larger amounts fall under Article 93 (10 to 20 years).
    sources:
      - loi97
  cultivation:
    text: >-
      Article 8 bans growing the cannabis plant, and landowners must destroy plantations that
      appear on their land. Article 91 punishes cultivation of high-risk drugs with 10 to 20 years
      and a fine of 250,000 to 1,250,000 CFA francs; Article 102 gives the lighter personal-use
      tier for a small amount.
    sources:
      - loi97
  enforcement:
    text: >-
      The statute allows prison for personal-use offences (Article 102) and sets 10 to 20 years for
      the main offences. How often users are jailed is not shown by the statute.
    sources:
      - loi97
  sharing:
    text: >-
      Article 95 punishes giving or offering a high-risk drug to a person for their own use with 2
      to 5 years and a fine of 50,000 to 2,500,000 CFA francs. Selling and distributing carry 10 to
      20 years (Article 93).
    sources:
      - loi97
  consumption:
    text: >-
      Article 101 forbids using controlled drugs without a medical prescription and orders any
      drug found on a user seized. The penalty set for the user in the text is the
      possession tier of Article 102.
    sources:
      - loi97
  access:
    text: >-
      Growing and holding drugs of Table I is banned outright (Article 9). Medical-use licences
      go to pharmacists and similar holders (Article 13). A justice ministry magistrate told the
      government's cannabis committee in 2017 that the law places cannabis and cannabis resin in
      Table I, the high-risk drugs.
    sources:
      - loi97
      - spm17
context:
  production:
    text: Reliable national information about lawful cannabis production was not established by the retained sources.
    sources: []
  products:
    text: Reliable national information about legally available cannabis products was not established by the retained sources.
    sources: []
  medical:
    text: The retained sources do not establish whether a medical cannabis programme operates.
    sources: []
  consequences:
    text: >-
      Besides prison and fines the court may add optional penalties under Article 111 of the
      drug law: a foreigner can be banned from the country for two to ten years or for good, and
      anyone convicted can lose civic rights, their passport, their driving licence or the right
      to practise a profession for six months to three years. A court can order treatment in
      place of or on top of the penalty (Article 113), and evading it carries two to five years.
    sources:
      - spm17
  planting:
    seeds: grey
    seeds_trade: unclear
    clones: illegal
    clones_trade: banned
    text: >-
      Article 8 of Law 97/019 bans growing the cannabis plant anywhere in the country and
      obliges landholders to destroy plantations that appear on their land. The law speaks of
      plants and substances and does not mention seeds.
    sources:
      - loi97
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited.
    sources:
      - loi97
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. Under Article 111 of the drug law a
      court may bar a convicted foreigner from Cameroon for two to ten years or permanently, on
      top of the prison term and fine.
    sources:
      - spm17
      - loi97
  driving:
    status: impairment
    text: >-
      Article 103 of the drug law punishes driving under the influence of cannabis with the
      penalties the Penal Code sets for driving while drunk or intoxicated, given by the justice
      ministry as six months to ten years in prison and a fine of 20,000 to 1,000,000 CFA
      francs, or one of the two. Where someone is killed or injured the penalties for that
      offence are doubled. No measured limit is mentioned.
    sources:
      - spm17
  black_market:
    text: >-
      Figures reported by the government to the UN drugs office record 6,861 kg of herbal
      cannabis seized in 2024, against 6,639 kg in 2023. The UN publishes them as kilogram
      equivalents, and countries count seizures differently, so the figures are not
      comparable across borders.
    sources:
      - unodc_szr
