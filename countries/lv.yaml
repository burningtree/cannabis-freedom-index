segments:
  possession:
    text: >-
      Possession of up to 1 g of dried cannabis (5 g undried, 0.1 g of hashish) is an administrative
      offence with a fine of up to €280. A second offence within twelve months is a crime,
      punishable by short imprisonment of 15 days to three months, community service or a fine.
      Anything above 1 g is criminal from the start.
    sources:
      - wiki
      - euda
  cultivation:
    text: Growing any number of plants is a criminal offence.
    sources:
      - wiki
  enforcement:
    text: >-
      One of the EU's lowest thresholds: a single gram separates a fine from a criminal case, and
      repeat users are prosecuted. Parliament has discussed decriminalisation without acting.
    sources:
      - euda
      - bt
  sharing:
    text: Supply is a crime with prison of up to fifteen years in serious cases.
    sources:
      - wiki
  consumption:
    text: Use is an administrative offence the first time and a crime if repeated within a year.
    sources:
      - euda
      - wiki
  access:
    text: No legal source.
    sources:
      - wiki
context:
  production:
    text: Industrial hemp only.
    sources:
      - wiki
  products:
    text: No legal THC products.
    sources:
      - wiki
  medical:
    text: No medical cannabis programme.
    sources:
      - wiki
  consequences:
    text: A repeat offence brings a criminal record.
    sources:
      - euda
  planting:
    seeds: grey
    seeds_trade: open
    clones: illegal
    clones_trade: banned
    text: >-
      The agriculture ministry stated in 2017 that the narcotics law does not apply to seeds,
      so trade in Indian hemp seed is not prohibited in Latvia, while sowing and growing those
      plants is banned and punished under section 256 of the Criminal Law. The same answer
      also cites the Criminal Law's section on trade, so the position on selling is less clear
      than its headline, and it is given as informative, not binding.
    sources:
      - zm17
  driving:
    status: zero
    text: >-
      No THC limit is set: detection of any drug is enough both for the administrative offence
      and for the criminal one, while for medicinal products impairment must be shown. Police
      may stop at random and test on suspicion; there is no roadside oral-fluid test, and
      blood is taken at a hospital. The administrative penalty is a fine of 1,200 to 1,400
      euros, 10 to 15 days of administrative arrest and a ban of up to four years; the
      criminal offence carries up to two years in prison and a ban of up to five.
    sources:
      - euda_dd
  clubs:
    status: none
    text: >-
      No clubs are known. A Europe-wide survey of cannabis social clubs carried out in 2018
      and 2019 found, after online searches and contact with people in the field, that there
      did not seem to be any active club in Latvia. The model is prohibited throughout the
      European Union. Nothing more recent was found.
    sources:
      - pardal20
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. British travel advice says illegal
      drugs, including cannabis, are strictly prohibited even in very small quantities and
      warns of jail sentences of up to 10 years and heavy fines for possessing, using, buying
      or smuggling them, also in transit. Airport scanners are also used on the baggage of
      passengers in transit.
    sources:
      - wiki
      - fcdo
