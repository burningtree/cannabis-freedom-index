segments:
  possession:
    text: >-
      Possession of up to 1 g of dried cannabis (5 g undried, 0.1 g of hashish) is an administrative
      offence with a fine of up to €280. A second offence within twelve months is a crime,
      punishable by short imprisonment of 15 days to three months, community service or a fine.
      Anything above 1 g is criminal from the start.
    sources:
      - wiki
      - euda
  cultivation:
    text: Growing any number of plants is a criminal offence.
    sources:
      - wiki
  enforcement:
    text: >-
      One of the EU's lowest thresholds: a single gram separates a fine from a criminal case, and
      repeat users are prosecuted. Parliament has discussed decriminalisation without acting.
    sources:
      - euda
      - bt
  sharing:
    text: Supply is a crime with prison of up to fifteen years in serious cases.
    sources:
      - wiki
  consumption:
    text: Use is an administrative offence the first time and a crime if repeated within a year.
    sources:
      - euda
      - wiki
  access:
    text: No legal source.
    sources:
      - wiki
