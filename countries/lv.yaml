updated: '2026-10-27'
summary: >-
  The first-offence small-quantity tier depends on the product: up to 1 g dried cannabis, 5 g
  undried, 0.1 g hashish or 0.05 g resin/oil/extract. Above the relevant ceiling, or after a repeat
  warning, criminal penalties can apply.
