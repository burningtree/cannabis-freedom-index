answers:
  carry:
    answer: 'no'
    text: >-
      Unlawful; the small-quantity ceiling is 1 g dried flower but only 0.05 g for resin, oil or
      extracts
  caught:
    answer: limited
    label: Fine or criminal charge
    text: >-
      First small possession can bring a fine; exceeding the product-specific ceiling or repeating
      after warning can be criminal
