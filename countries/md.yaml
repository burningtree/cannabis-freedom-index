        fine_min: 5000
        fine: 7000
        note: Fine or community work
      - label: Public use or use at specified places
        treatment: criminal
        term: Article 217-5(1)
        fine_min: 37500
        fine: 52500
        note: Fine or community work
  access:
    text: >-
      There is no lawful recreational supplier; unauthorised distribution is
      criminal.[@reform26] The general controlled-substance law provides medical and scientific
      channels but prohibits growing cannabis to obtain drugs.[@l201]
    sources:
      - reform26
      - l201
context:
  production:
    status: hemp
    text: >-
      Authorised industrial hemp is the lawful commercial crop, with uses expanded from fibre,
      seed and oil to stalks, biomass and other permitted derivatives.[@hemp26] Farmers may
      market the crop domestically or export it under their authorisation, and must report
      production annually to ANSA.[@hemp26] Growing cannabis to obtain narcotic substances
      remains prohibited.[@l201]
    sources:
      - hemp26
      - l201
  medical:
    text: >-
      The general controlled-substance law provides medical uses for authorised substances,
      while prohibiting cannabis cultivation to produce narcotics.[@l201] The reviewed sources
      establish no operating patient cannabis programme or dispensing route.[@cann]
      Industrial-hemp authorisations concern non-medical products.[@l201]
    sources:
      - l201
      - cann
  consequences:
    text: >-
      The 2026 small-possession provision permits a temporary ban on the relevant activity
      alongside fines.[@reform26] Criminal convictions create a criminal-record status until it
      is extinguished or rehabilitation occurs.[@units] The reform retains exemptions for
      voluntary surrender or seeking treatment in contraventional cases, and conditional
      cooperation-based release for first criminal personal-handling offences.[@reform26] The
      [October 2026 strategy](/history/moldova-drug-addictions-strategy-2026/) calls for
      community treatment, continuity of recovery and reduced stigma for people with
      addictions.[@strategy26]
    sources:
      - reform26
      - units
      - strategy26
  planting:
    seeds: licensed
    seeds_trade: regulated
    clones: licensed
    clones_trade: regulated
    text: >-
      Law 201/2025 leaves seeds, and leaves without flowering tops, out of its definition of
      cannabis.[@l201] Article 14 bans growing cannabis for drugs and allows hemp with up to
      0.3% THC only under an authorisation from the food safety agency, using registered
      varieties.[@l201] Distributors of seed for sowing may supply it only to authorisation
      holders.[@l201]
    sources:
      - l201
  clubs:
    status: none
    text: >-
      Distributing cannabis to other people falls under the criminal supply offence.[@reform26]
      Providing premises for illegal drug consumption is itself punishable under Article
      219.[@reform26] The premises offence carries five to seven years or a MDL75,000–100,000
      fine, with higher prison ranges for group or organised conduct.[@reform26,units]
    sources:
      - reform26
      - units
  visitors:
    text: >-
      Visitors have no legal recreational supplier.[@reform26] Small personal possession can
      bring a MDL10,000–15,000 administrative fine; criminal handling rules apply at higher
      quantity classifications or with statutory aggravation.[@reform26,units] Public use is a
      separate criminal offence.[@reform26]
    sources:
      - reform26
      - units
    status: none
  black_market:
    text: >-
      The Interior Ministry’s [February 2026
      assessment](/history/moldova-drug-market-hearing-2026/) described marijuana and hashish
      alongside a growing synthetic-drug market.[@hearing26] Investigations identified encrypted
      apps, prearranged hiding places, cryptocurrency payments and passenger transport or
      parcels as distribution methods.[@hearing26] A [June 2026
      investigation](/history/moldova-vadul-cannabis-laboratory-2026/) at Vadul lui Vodă
      reported a growing site and approximately 2.5 kg of cannabis, with one suspect detained
      and another investigated at liberty.[@lab26]
    sources:
      - hearing26
      - lab26
  recreational:
    text: >-
      Adults have no legal recreational supply, and passing cannabis to another person is a
      criminal offence.[@reform26] Small personal possession remains outside criminal law but
      can carry a substantial fine under the [2026
      reform](/history/moldova-drug-penalties-2026/).[@reform26] Public use is separately
      criminalised even when the ordinary use offence is a contravention.[@reform26] Quantity
      classifications separate the tiers; the [2015 court
      ruling](/history/moldova-quantity-tables-upheld-2015/) upheld the government’s role in
      setting them.[@court15]
    sources:
      - reform26
      - court15
  hemp:
    status: standard
    text: >-
      Industrial and horticultural hemp is defined with a THC ceiling of 0.3%.[@l201] Growers
      need authorisation from the food-safety agency and must use registered varieties.[@l201]
      The [April 2026 rules](/history/moldova-hemp-processing-rules-2026/) provide
      flowering-time laboratory sampling, farm records and inspections.[@hemp26]
    sources:
      - l201
      - hemp26
  arrests:
    text: >-
      The Interior Ministry reported 3,575 drug-related crimes and 16,642 contraventions
      nationwide from 2023 through January 2026.[@hearing26] For 2025 it reported 775 people
      documented in drug crimes, including 36 minors, and 737 people sent to trial.[@hearing26]
      These totals cover all controlled drugs and count different stages of
      proceedings.[@hearing26]
    sources:
      - hearing26
  driving:
    status: impairment
    text: >-
      Driving in a state of intoxication produced by narcotic or similar substances is criminal
      under Article 264-1.[@road26] Since [7 September
      2024](/history/moldova-drug-driving-penalties-2024/), the ordinary offence carries a fine
      of 1,500–2,500 conventional units, MDL75,000–125,000, or one to three years in prison,
      with cancellation of the right to drive in either case.[@road24,units] Consuming drugs
      after an accident before testing or biological sampling is a separate offence, carrying
      2,000–3,000 units or one to four years, again with cancellation.[@road26] The reproduced
      provisions do not state a numerical THC allowance.[@road26]
    sources:
      - road26
      - road24
      - units
