name: Moldova
region: Europe
iso_numeric: 498
recreational: decriminalised
medical: none
updated: 2026-10-13
summary: Possession of small amounts is an administrative offence.
scores:
  possession: 3
  cultivation: 1
  enforcement: 3
  sharing: 1
  consumption: 2
  access: 0
segments:
  possession:
    text: >-
      Buying or possessing a small amount without intent to distribute — up to about 2 g of dried
      cannabis — is an administrative offence under Article 85 of the Contravention Code, punished
      with a fine or community service. The government has moved to raise these fines sharply. Above
      the threshold it is a crime.
    sources:
      - wiki
      - logos
  cultivation:
    text: >-
      Cultivation is a criminal offence under Article 217 of the Criminal Code, with prison terms.
      Article 14 of Law 201/2025 forbids growing controlled plants, cannabis included, to obtain
      narcotic substances; industrial hemp may be grown with an authorisation from the food
      safety agency.
    sources:
      - cann
      - l201
  enforcement:
    text: >-
      Users face fines or community service. Anything above the small threshold, and all cultivation
      and dealing, carries two to seven years or more.
    sources:
      - wiki
      - logos
  sharing:
    text: >-
      Supply is a crime. Law 201/2025 lets controlled substances and plants circulate only for
      scientific, forensic or medical purposes.
    sources:
      - wiki
      - l201
  consumption:
    text: >-
      Using without a prescription is an administrative offence with the same fine or community
      service.
    sources:
      - wiki
      - cann
  access:
    text: No legal source.
    sources:
      - cann
context:
  production:
    status: none
    text: No licensed production for consumption; hemp is restricted.
    sources:
      - cann
  products:
    text: No legal products.
    sources:
      - cann
  medical:
    text: No medical cannabis programme.
    sources:
      - cann
      - wiki
  consequences:
    text: Administrative offences are not criminal convictions.
    sources:
      - wiki
  planting:
    seeds: licensed
    seeds_trade: regulated
    clones: licensed
    clones_trade: regulated
    text: >-
      Law 201/2025 leaves seeds, and leaves without flowering tops, out of its definition of
      cannabis. Article 14 bans growing cannabis for drugs and allows hemp with up to 0.3% THC
      only under an authorisation from the food safety agency, using registered varieties.
      Distributors of seed for sowing may supply it only to authorisation holders.
    sources:
      - l201
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and no law provides for them: supplying cannabis is a
      crime.
    sources:
      - wiki
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. Buying or possessing a small amount
      without intent to distribute, up to about 2 g of dried cannabis, is an administrative
      offence under Article 85 of the Contravention Code, punished with a fine or community
      service.
    sources:
      - wiki
      - logos
  black_market:
    text: >-
      Figures reported by the government to the UN drugs office record 34.9 kg of herbal
      cannabis seized in 2024, against 66.4 kg in 2023, and 20.6 kg of cannabis resin
      seized in 2024, against 26.1 kg in 2023. The UN publishes them as kilogram
      equivalents, and countries count seizures differently, so the figures are not
      comparable across borders.
    sources:
      - unodc_szr
