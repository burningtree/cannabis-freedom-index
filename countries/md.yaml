segments:
  possession:
    text: >-
      Buying or possessing a small amount without intent to distribute — up to about 2 g of dried
      cannabis — is an administrative offence under Article 85 of the Contravention Code, punished
      with a fine or community service. The government has moved to raise these fines sharply. Above
      the threshold it is a crime.
    sources:
      - wiki
      - logos
  cultivation:
    text: Cultivation is a criminal offence under Article 217 of the Criminal Code, with prison terms.
    sources:
      - cann
      - wiki
  enforcement:
    text: >-
      Users face fines or community service. Anything above the small threshold, and all cultivation
      and dealing, carries two to seven years or more.
    sources:
      - wiki
      - logos
  sharing:
    text: Supply is a crime.
    sources:
      - wiki
  consumption:
    text: >-
      Using without a prescription is an administrative offence with the same fine or community
      service.
    sources:
      - wiki
      - cann
  access:
    text: No legal source.
    sources:
      - cann
