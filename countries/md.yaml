name: Moldova
region: Europe
iso_numeric: 498
recreational: decriminalised
medical: none
updated: '2026-10-28'
summary: >-
  Small personal possession remains an administrative offence, with higher fines from August
  2026. Supplying drugs carries prison terms; authorised industrial hemp has a separate route.
scores:
  possession: 3
  cultivation: 2
  enforcement: 3
  sharing: 0
