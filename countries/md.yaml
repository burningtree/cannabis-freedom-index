segments:
  possession:
    text: >-
      Small personal possession without intent to supply is a contravention; since 28 August
      2026 an individual faces a fine of 200–300 conventional units,
      MDL10,000–15,000.[@reform26,units] For a large amount, criminal Article 217(2) allows a
      fine of 400–700 units, MDL20,000–35,000, community work or up to one year in
      prison.[@reform26,units] Statutory aggravation raises the maximum to four years;
      especially large amounts carry one to six years.[@reform26] Replacement quantity tables
      reached the [government-promotion stage in September
      2026](/history/moldova-quantity-tables-draft-2026/), so the old reported 2 g figure is not
      used here as a verified current ceiling.[@transition26]
    sources:
      - reform26
      - units
      - transition26
    currency: MDL
    penalties:
      - label: Small amount without intent to supply
        treatment: civil
        term: Contravention, Article 85(2)
        fine_min: 10000
        fine: 15000
      - label: Large amount without intent to supply
        treatment: criminal
        term: Article 217(2)
        prison: 1 year
        fine_min: 20000
        fine: 35000
        note: Prison or a fine, or community work
      - label: Aggravated personal handling
        treatment: criminal
        term: Article 217(3)
        prison: 4 years
        note: Occupational disqualification also applies
      - label: Especially large amount
        treatment: criminal
        term: Article 217(4)
        prison_min: 1 year
        prison: 6 years
        note: Occupational disqualification also applies
  cultivation:
    text: >-
      Unauthorised cultivation without intent to supply, where it falls below the criminal
      offence, attracts a 200–400-unit fine, MDL10,000–20,000.[@reform26,units] Large-quantity
      personal cultivation is criminal but the ordinary penalty is a 200–400-unit fine or up to
      100 hours of community work.[@reform26] Statutory aggravation permits up to four years in
      prison, and especially large quantities one to six years.[@reform26] Cannabis cultivation
      for drugs is prohibited; authorised industrial hemp follows a separate route.[@l201] Group
      or repeat contraventional cultivation within the same calendar year carries a
      MDL15,000–25,000 fine, community work or ten–fifteen days of administrative
      arrest.[@reform26,units]
    sources:
      - reform26
      - units
      - l201
    currency: MDL
    penalties:
      - label: Personal cultivation below the criminal classification
        treatment: civil
        term: Contravention, Article 87(1)
        fine_min: 10000
        fine: 20000
      - label: Group or repeat cultivation remaining a contravention
        treatment: civil
        term: Contravention, Article 87(2)
        fine_min: 15000
        fine: 25000
        prison_min: 10 days
        prison: 15 days
        note: Fine, community work or administrative arrest; repeat within same calendar year
      - label: Large personal cultivation
        treatment: criminal
        term: Article 217(1)
        fine_min: 10000
        fine: 20000
        note: Fine or community work
      - label: Aggravated personal cultivation
        treatment: criminal
        term: Article 217(3)
        prison: 4 years
      - label: Especially large personal cultivation
        treatment: criminal
        term: Article 217(4)
        prison_min: 1 year
        prison: 6 years
      - label: Cultivation with intent to supply
        treatment: criminal
        term: Article 217-1(1)
        prison_min: 2 years
        prison: 6 years
        note: Community work is an alternative
  enforcement:
    text: >-
      The [August 2026 reform](/history/moldova-drug-penalties-2026/) raised small-possession
      fines while retaining their contraventional classification.[@reform26] Larger personal
      quantities can lead to prison, and the new supply tiers reach seventeen years.[@reform26]
    sources:
      - reform26
  sharing:
    text: >-
      Giving or otherwise transferring drugs falls under unlawful supply, whose ordinary penalty
      is six to ten years in prison.[@reform26] Production for supply carries ten to twelve
      years; large quantities and other aggravating circumstances twelve to fifteen; especially
      large quantities or organised crime fifteen to seventeen.[@reform26] Organising illegal
      use carries two to five years or a MDL37,500–52,500 fine; maintaining or providing
      drug-use premises carries five to seven years or MDL75,000–100,000.[@reform26,units] The
      premises range rises to eight–twelve years for group or official-position aggravation, and
      twelve–fifteen for organised crime.[@reform26] Drug smuggling carries eight–ten years,
      rising to ten–twelve under specified aggravations and twelve–twenty for organised crime or
      especially large quantities.[@reform26]
    sources:
      - reform26
      - units
