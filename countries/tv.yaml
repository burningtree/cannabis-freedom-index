segments:
  possession:
    text: >-
      Schedule 3 of the 2025 amendment sets two to five years for possession of no more than 5 g,
      and three to seven years for no more than 10 g. Its overlapping bands and omitted intermediate
      quantities require interpretation.
    sources:
      - dda2025
  cultivation:
    text: >-
      Unlicensed cultivation is prohibited. Schedule 3 sets one to five years for up to one plant
      and two to seven years for up to three. The printed bands leave gaps; do not interpolate a
      tariff.
    sources:
      - dda2022
      - dda2025
  enforcement:
    text: >-
      The 2025 statute prescribes minimum imprisonment, including two years for the smallest
      possession band. Actual post-amendment prosecutions and sentencing practice were not
      established.
    sources:
      - dda2025
  sharing:
    text: >-
      The amended section 8 covers sale and trafficking. Schedule 3 gives selling or trafficking no
      more than 5 g the same two-to-five-year band as possession. No verified case interpretation of
      an unpaid gift was found.
    sources:
      - dda2025
  consumption:
    text: >-
      The amended section 5 prohibits unlicensed use; Schedule 3 expressly includes smoking Indian
      hemp alongside possession.
    sources:
      - dda2025
  access:
    text: >-
      No recreational supply route. New section 14A permits ministerial licences for medical and
      scientific activities; it does not establish an operating patient supply service.
    sources:
      - dda2025
context:
  production:
    text: >-
      The 2025 amendment permits licensed medical or scientific cultivation and manufacture. The
      reviewed sources do not establish actual licensed production.
    sources:
      - dda2025
  products:
    text: >-
      The licensed framework covers dangerous drugs for medical and scientific purposes. It is not
      evidence of cannabis products being available to consumers.
    sources:
      - dda2025
  medical:
    text: >-
      Section 14A now permits medical and scientific licences, with conditions on records, security
      and reporting. No issued cannabis licence or patient service was verified.
    sources:
      - dda2025
  consequences:
    text: >-
      Sections 6 and 39 provide for forfeiture of drugs and specified articles; section 10 permits
      seizure and destruction of cannabis plants.
    sources:
      - dda2022
  clubs:
    status: none
    text: >-
      No recreational club exemption is established by the reviewed law. The 2025 licensing power is
      confined to medical and scientific purposes.
    sources:
      - dda2025
  planting:
    seeds: licensed
    seeds_trade: regulated
    clones: licensed
    clones_trade: regulated
    text: >-
      The 2025 Act replaces the former seed-import prohibition with a general licensing rule.
      Cannabis still includes any portion of the plant; cultivation and sale require a medical or
      scientific licence. No personal growing exemption was established.
    sources:
      - dda2022
      - dda2025
  visitors:
    status: none
    text: >-
      No recreational supply route is established for visitors or residents. The 2025 licence power
      is for medical and scientific purposes; unlicensed cannabis offences have minimum prison
      terms.
    sources:
      - dda2025
  driving:
    status: impairment
    text: >-
      Drug-impaired driving is prohibited. Section 23 of the Traffic Act covers driving, attempting
      to drive, or being in charge of a motor vehicle while efficiency as a driver is impaired by a
      drug. The government’s current 2022 Revised Edition provides a $200 fine and one year’s
      imprisonment; section 25 permits the court to disqualify the driver or impose licence
      restrictions for a specified period. Police may arrest without warrant on reasonable suspicion
      of the offence. Section 23’s 0.08% blood-alcohol provision and alcohol-related presumptions do
      not establish a THC threshold. The reviewed Act does not set a numeric cannabis limit; current
      drug-screening, confirmation and specimen-refusal procedures were not established.
    sources:
      - traffic2022
