segments:
  possession:
    text: >-
      Illegal under the Dangerous Drugs Act, a colonial-era law dating from 1948 that prohibits
      importing, growing, selling or possessing Indian hemp. Possession of any amount is a criminal
      offence that can bring a fine or imprisonment; no reliable figure for small amounts was found.
    sources:
      - wiki
      - trip
  cultivation:
    text: Cultivation is prohibited by the same Act.
    sources:
      - wiki
  enforcement:
    text: >-
      With about 11,000 people and very few recorded drug cases, there is little evidence of how the
      law is applied.
    sources:
      - wiki
  sharing:
    text: Sale is prohibited, with heavier penalties.
    sources:
      - wiki
  consumption:
    text: Use is covered by the possession offence.
    sources:
      - trip
  access:
    text: None.
    sources:
      - wiki
context:
  production:
    text: None.
    sources:
      - wiki
  products:
    text: None.
    sources:
      - wiki
  medical:
    text: No medical cannabis; a foreign prescription is not recognised.
    sources:
      - trip
  consequences:
    text: A conviction is a criminal record; foreigners face deportation.
    sources:
      - trip
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited.
    sources:
      - wiki
  planting:
    seeds: illegal
    seeds_trade: banned
    clones: illegal
    clones_trade: banned
    text: >-
      The Dangerous Drugs Act defines Indian hemp as either of the plants Cannabis sativa or
      Cannabis indica or any portion thereof, which takes in seeds and cuttings alike. Section
      5 prohibits importing or exporting any seed of Indian hemp, and section 7 prohibits
      cultivating the plant.
    sources:
      - dda
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. British travel advice says it is
      illegal to import, export, cultivate or distribute drugs, with fines and imprisonment as
      penalties.
    sources:
      - wiki
      - fcdo
