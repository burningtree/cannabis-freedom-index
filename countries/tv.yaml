name: Tuvalu
region: Oceania
iso_numeric: 798
recreational: illegal
medical: limited
updated: "2026-10-27"
summary: >-
  A 2025 amendment sets minimum prison terms for small cannabis offences and permits medical or
  scientific licences; ordinary recreational supply remains prohibited.
scores:
  possession: 0
  cultivation: 1
  enforcement: 1
  sharing: 1
  consumption: 0
  access: 0
segments:
  possession:
    text: >-
      The 2025 penalty table gives smoking or possessing no more than 5 g of cannabis two to
      five years in prison.[@amendment] It separately lists no more than 10 g at three to seven
      years, and more than 50 g at five to twenty years.[@amendment] The bands overlap, and the
      table gives no separate entry for amounts over 10 g through 50 g.[@amendment]
    sources:
      - amendment
  cultivation:
    text: >-
      Unlicensed cannabis cultivation is prohibited.[@law, amendment] The 2025 table gives up to
      one plant one to five years in prison, up to three plants two to seven years, and more
      than five plants four to ten years.[@amendment] It gives no separate band for four or five
      plants.[@amendment]
    sources:
      - law
      - amendment
  enforcement:
    text: >-
      The 2025 Act prescribes minimum imprisonment, including two years for the smallest smoking
      or possession band.[@amendment] The older general penalty clause provided a fine and
      imprisonment where no specific penalty applied.[@law]
    sources:
      - amendment
      - law
  sharing:
    text: >-
      The amended possession, selling and trafficking offence is subject to the 2025 penalty
      table.[@amendment] Selling or trafficking no more than 5 g carries two to five years in
      prison; no more than 20 g is listed at five to twelve years.[@amendment]
    sources:
      - amendment
  consumption:
    text: >-
      The 2025 Act prohibits unlicensed use and expressly includes smoking cannabis in its
      penalty table.[@amendment] The smallest smoking or possession band carries a minimum of
      two years in prison.[@amendment]
    sources:
      - amendment
  access:
    text: >-
      The minister may license import, export, manufacture, cultivation, sale or use of
      dangerous drugs for medical and scientific purposes.[@amendment] The Act provides an
      application form and permits conditions covering records, security and
      reporting.[@amendment] No issued patient licence or functioning patient supply service
      was verified.
    sources:
      - amendment
context:
  production:
    text: >-
      The 2025 licensing power covers medical and scientific cultivation and
      manufacture.[@amendment] Applications must describe the drugs involved, the purpose and
      the proposed period of the licence.[@amendment]
    sources:
      - amendment
  products:
    text: >-
      The Act defines Indian hemp as Cannabis sativa or Cannabis indica, or any portion of
      either plant.[@law] Cannabis extracts and tinctures also appear in the schedule of
      controlled drugs.[@law] The 2025 medical and scientific licensing power covers dangerous
      drugs across import, production, sale and use.[@amendment]
    sources:
      - law
      - amendment
  medical:
    text: >-
      The minister can issue medical and scientific licences under the 2025 Act, subject to
      conditions on records, security and reporting.[@amendment] The application form asks
      applicants to explain their purpose and why permission should be granted.[@amendment]
      Section 14A expressly covers medical use and import, allowing an individual authorisation
      route; an ordinary prescription alone does not establish that a licence has been granted.[@amendment]
    sources:
      - amendment
  consequences:
    text: >-
      Unlawfully imported or exported cannabis can be seized and forfeited, and the Act permits
      seizure and destruction of cannabis plants.[@law] Its general penalty clause also provides
      forfeiture of articles involved in an offence.[@law]
    sources:
      - law
  clubs:
    status: none
    text: >-
      The 2025 licensing power is confined to medical and scientific purposes, while unlicensed
      cultivation, sale and use remain offences.[@amendment]
    sources:
      - amendment
  planting:
    seeds: licensed
    seeds_trade: regulated
    clones: licensed
    clones_trade: regulated
    text: >-
      The Act’s definition of cannabis includes any portion of the plant.[@law] The 2025 Act
      replaces the former seed-import section with a licensing rule covering import,
      cultivation, sale and use for medical and scientific purposes.[@law, amendment]
    sources:
      - law
      - amendment
  visitors:
    status: none
    text: >-
      The 2025 Act provides licences for medical and scientific purposes and prohibits
      unlicensed import, cultivation, sale and use.[@amendment] Its application form asks for
      nationality, country and principal residence or place of business.[@amendment]
    sources:
      - amendment
  driving:
    status: impairment
    text: >-
      Driving, attempting to drive or being in charge of a vehicle while a drug impairs driving
      efficiency carries a $200 fine and one year’s imprisonment.[@traffic] Police can arrest
      without warrant on reasonable suspicion, and a court may disqualify the driver or impose
      licence restrictions.[@traffic]
    sources:
      - traffic
answers:
  buy:
    answer: limited
    text: Medical use and import require a ministerial licence; patient supply is not verified
