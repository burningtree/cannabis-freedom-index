name: Mauritius
region: Africa
iso_numeric: 480
recreational: illegal
medical: limited
updated: 2026-10-04
summary: >-
  Strict prohibition, but since 2022 medical cannabis can be approved by specialist committees in
  public hospitals.
scores:
  possession: 1
  cultivation: 0
  enforcement: 2
  sharing: 0
  consumption: 1
  access: 1
segments:
  possession:
    text: >-
      Cannabis ('gandia') is prohibited by the Dangerous Drugs Act 2000; simple possession or use
      carries up to two years in prison and/or a fine of up to 50,000 rupees. Amendments in November
      2022 allow people caught with small amounts to be referred to rehabilitation instead of being
      prosecuted.
    sources:
      - tb
      - leaf
  cultivation:
    text: Cultivation is a serious offence with long prison terms; seeds are also banned.
    sources:
      - tb
  enforcement:
    text: >-
      Still strict: prisons hold many drug offenders, which is why a 2025 proposal to depenalise
      cannabis was framed as a way to relieve overcrowding.
    sources:
      - aa
      - tb
  sharing:
    text: Dealing carries heavy sentences, up to decades for trafficking.
    sources:
      - tb
  consumption:
    text: Use is an offence, with the rehabilitation route available since 2022.
    sources:
      - leaf
  access:
    text: >-
      No adult-use source. Authorised patients can receive medical cannabis through public
      hospitals.
    sources:
      - mondaq
context:
  production:
    text: No domestic production; medical products are imported with health-ministry authorisation.
    sources:
      - mondaq
  products:
    text: >-
      Medical cannabis is narrowly defined: capsules, oil solutions or mouth sprays with no more
      than 30 mg of THC per millilitre. No flower.
    sources:
      - mondaq
  medical:
    text: >-
      Legal since the 2022 amendment, but only with individual authorisation from the Ministry of
      Health, for a short list of conditions.
    sources:
      - mondaq
  consequences:
    text: >-
      A conviction is a criminal record affecting employment; a certificate of character is required
      for many jobs.
    sources:
      - aa
