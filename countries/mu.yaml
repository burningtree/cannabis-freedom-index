name: Mauritius
region: Africa
iso_numeric: 480
recreational: illegal
medical: limited
updated: 2026-10-14
summary: >-
  Strict prohibition, but since 2022 medical cannabis can be approved by specialist committees in
  public hospitals.
scores:
  possession: 1
  cultivation: 0
  enforcement: 2
  sharing: 0
  consumption: 1
  access: 1
segments:
  possession:
    text: >-
      Cannabis ('gandia') is prohibited by the Dangerous Drugs Act 2000; simple possession or use
      carries a fine of up to 50,000 rupees and up to two years in prison under section 34.
      Amendments in November 2022 allow people caught with small amounts to be referred to
      rehabilitation instead of being prosecuted.
    sources:
      - dda
      - leaf
  cultivation:
    text: Cultivation is a serious offence with long prison terms; seeds are also banned.
    sources:
      - dda
  enforcement:
    text: >-
      Still strict: prisons hold many drug offenders, which is why a 2025 proposal to depenalise
      cannabis was framed as a way to relieve overcrowding.
    sources:
      - aa
  sharing:
    text: Dealing carries heavy sentences, up to decades for trafficking.
    sources:
      - dda
  consumption:
    text: Use is an offence, with the rehabilitation route available since 2022.
    sources:
      - leaf
  access:
    text: >-
      No adult-use source. Authorised patients can receive medical cannabis through public
      hospitals.
    sources:
      - mondaq
context:
  production:
    text: No domestic production; medical products are imported with health-ministry authorisation.
    sources:
      - mondaq
  products:
    text: >-
      Medical cannabis is narrowly defined: capsules, oil solutions or mouth sprays with no more
      than 30 mg of THC per millilitre. No flower.
    sources:
      - mondaq
  medical:
    text: >-
      Legal since the 2022 amendment, but only with individual authorisation from the Ministry of
      Health, for a short list of conditions.
    sources:
      - mondaq
  consequences:
    text: >-
      A conviction is a criminal record affecting employment; a certificate of character is required
      for many jobs.
    sources:
      - aa
  planting:
    seeds: illegal
    seeds_trade: banned
    clones: illegal
    clones_trade: banned
    text: >-
      The Dangerous Drugs Act defines gandia as "all the parts of the plant" Cannabis sativa
      or indica, with no exception for seed, and section 5 says no person shall cultivate the
      cannabis plant. Police may uproot any plant found growing.
    sources:
      - dda
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. Under section 34 of the
      Dangerous Drugs Act, using or possessing any dangerous drug carries a fine of up to 50,000
      rupees and up to two years in prison, although the court may order treatment instead of
      prison for a person who undertakes to be cured of addiction.
    sources:
      - dda
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited.
    sources:
      - dda
  driving:
    status: zero
    text: >-
      The Road Traffic Act's drug schedule lists delta-9-THC (cannabis) among drugs with zero
      tolerance, separately from medicines with specified blood limits. Section 123E covers
      driving, attempting to drive, being in charge and supervising a learner while under the
      influence of a listed drug. Section 123G distinguishes a saliva or urine preliminary drug
      test from laboratory blood or urine testing; refusal without reasonable excuse after the
      required warning can be prima facie evidence, rather than an automatically confirmed THC
      result. The 2022 amendment corrected the drug list to the Thirteenth Schedule and the field
      assessment to the Fourteenth. The government's 2024–25 performance report confirms that its
      forensic laboratory began reporting drug-driving cases in July 2022. The 2026 Act changes
      interim licence orders and creates vehicle
      seizure provisions, but different sections require proclamation on different dates. The
      complete current penalty and licence regime, commencement of the seizure provisions and a
      medical-prescription defence remain unverified here; the older ministry reprint must not be
      used as a complete current consolidation.
    sources:
      - traffic19
      - traffic22
      - traffic26
      - traffic_performance
