name: Faroe Islands
region: Europe
iso_numeric: 234
dependency:
  of: dk
  kind: Self-governing territory
  note: >-
    The Faroe Islands are a self-governing part of the Kingdom of Denmark with their own
    parliament, the Løgting. Narcotics are covered by the law on euphoriant substances as it
    applies in the islands, and Denmark answers for them internationally.
recreational: illegal
medical: limited
updated: '2026-10-28'
summary: >-
  Recreational possession and growing remain offences, including small personal quantities.
  Doctors have been able to prescribe medical cannabis through a trial scheme since April 2019.
  Patients receiving it are told not to drive.
scores:
  possession: 1
  cultivation: 1
  enforcement: 2
  sharing: 1
  consumption: 1
  access: 1
segments:
  possession:
    text: >-
      Possessing cannabis outside the authorised medical or scientific routes is
      prohibited.[@current] Faroese police say even small quantities for personal use are
      prosecuted when discovered.[@police] The basic drug-law penalty is a fine or up to two
      years in prison.[@law]
    sources:
      - current
      - police
      - law
    penalties:
      - label: Unauthorised possession
        treatment: criminal
        term: Overtrædelse — Euphoriant Substances Order § 3
        prison: 2 years
        note: Prison or a fine; the statute does not set a fixed monetary ceiling here
  cultivation:
    text: >-
      Growing cannabis needs permission from the medicines authority; recreational home growing
      has no authorised plant allowance.[@current] A separate permit route covers commercial
      crops with no more than 0.2% THC on plots of at least 0.3 hectares.[@current] The basic
      drug-law penalty is a fine or up to two years in prison.[@law]
    sources:
      - current
      - law
    penalties:
      - label: Unauthorised cannabis cultivation
        treatment: criminal
        term: Overtrædelse — Euphoriant Substances Order § 3
        prison: 2 years
        note: Prison or a fine; the statute does not set a fixed monetary ceiling here
  enforcement:
    text: >-
      The basic drug-law offence carries a fine or up to two years in prison — a regime Denmark
      extended to the islands in
      1956.(/history/faroes-euphoriant-substances-order-1956/)[@law] Police say
      small personal-use cases are prosecuted, while their strategic focus is on organisers and
      larger middlemen.[@police]
    sources:
      - law
      - police
  sharing:
    text: >-
      Unauthorised sale, supply and receipt of controlled drugs are prohibited, with no
      recreational gift exception.[@current] The underlying law separately permits receipt and
      possession through a lawful prescription.[@law] The basic drug-law penalty is a fine or up
      to two years in prison.[@law] Serious cannabis smuggling can be prosecuted under Penal
      Code § 191, which police describe as carrying up to ten years.[@smuggle24]
    sources:
      - current
      - law
      - smuggle24
    penalties:
      - label: Ordinary unauthorised supply
        treatment: criminal
        term: Overtrædelse — Euphoriant Substances Order § 3
        prison: 2 years
        note: Prison or a fine; the statute does not set a fixed monetary ceiling here
      - label: Serious cannabis smuggling under Penal Code § 191
        treatment: criminal
        term: Straffeloven § 191
        prison: 10 years
  consumption:
    text: >-
      Controlled drugs may be used only for medical or scientific purposes under the
      regulations.[@current] Police prosecute small personal-possession cases when
      discovered.[@police] The basic drug-law penalty is a fine or up to two years in
      prison.[@law]
    sources:
      - current
      - police
      - law
    penalties:
      - label: Use outside permitted medical or scientific purposes
        treatment: criminal
        term: Overtrædelse — Euphoriant Substances Order § 3
        prison: 2 years
        note: Prison or a fine; the statute does not set a fixed monetary ceiling here
  access:
    text: >-
      Doctors have been able to prescribe medical cannabis through a trial scheme since April
      2019.[@chief] Pharmacies may dispense controlled medicines, and patients may receive them
      through a lawful prescription.[@current] Recreational supply remains prohibited.[@current]
    sources:
      - chief
      - current
context_not_applicable:
  death_penalty:
    text: >-
      The euphoriant-substances law sets fines or imprisonment for its offences, with an
      ordinary maximum of two years.[@law] Police describe serious cannabis smuggling under
      Penal Code § 191 as carrying up to ten years.[@smuggle24]
    sources:
      - law
      - smuggle24
context:
  recreational:
    text: >-
      Recreational possession and growing remain offences, including small personal quantities,
      which police prosecute when discovered.[@current,police] The basic drug-law offence
      carries a fine or up to two years in prison.[@law] The [June 2026
      regulations](/history/faroes-controlled-drug-regulations-2026/) preserve medical and
      scientific routes and a separate permitted commercial hemp crop.[@current]
    sources:
      - current
      - police
      - law
  production:
    status: medical
    text: >-
      The regulations permit licensed cannabis cultivation for medical manufacturing, raw
      pharmaceutical materials and supplying other authorised growers.[@current] Commercial
      low-THC crops need a separate annual permit, with a 0.2% THC ceiling and plots of at least
      0.3 hectares.[@current] The [2026
      regulations](/history/faroes-controlled-drug-regulations-2026/) require specified
      premises, an approved security manager and controlled access for medical
      growers.[@current]
    sources:
      - current
  medical:
    text: >-
      The Chief Medical Officer confirms a medical-cannabis trial has operated since [April
      2019](/history/faroes-medical-cannabis-trial-2019/), after MPs reopened the access debate that
      spring.(/history/faroes-medical-cannabis-bill-2019/)[@chief] Joint prescribing guidance
      identifies pain, multiple sclerosis, spinal-cord injury and chemotherapy-related nausea
      among treatment areas, with conventional medicines tried first and the decision
      documented.[@guidance] It recommends specialist prescribing for neurological conditions
      and chemotherapy-related symptoms.[@guidance] Official guidance describes dronabinol and
      cannabidiol preparations as oils and capsules, and in July 2019 the Pharmacy Service also
      ordered cannabis flower from the Netherlands at a doctor's
      request.[@guidance,flower](/history/faroes-cannabis-flower-order-2019/)
    sources:
      - chief
      - guidance
      - flower
  consequences:
    text: >-
      Drug judgments recorded in the decisions section of the criminal register can appear on a
      private criminal-record certificate under the [2021
      rules](/history/faroes-drug-record-certificates-2021/).[@records] For fines included
      there, the ordinary private-certificate limit is two years from the final decision; other
      decisions usually have three- or five-year limits depending on imprisonment and
      release.[@records] Those certificate limits concern disclosure and differ from deletion of
      the underlying police data.[@records]
    sources:
      - records
  clubs:
    status: none
    text: >-
      The reviewed regulations authorise medical and scientific handling of controlled drugs;
      they provide no recreational growing-and-supply route for clubs.[@current] Distribution is
      reserved for authorised medical or scientific recipients, with licensed growing routes for
      medical production.[@current]
    sources:
      - current
  visitors:
    status: none
    text: >-
      Visitors have no authorised recreational supply: cannabis may be handled only through the
      permitted medical and scientific routes.[@current] Small personal quantities are
      prosecuted when discovered, according to Faroese police.[@police]
    sources:
      - current
      - police
  planting:
    seeds: grey
    seeds_trade: unclear
    clones: licensed
    clones_trade: regulated
    text: >-
      The cannabis definition excludes hemp seeds and isolated hemp fibre.[@current] Growing
      plants is separately regulated and requires permission, including the specified commercial
      low-THC route.[@current] Possessing an excluded seed therefore does not provide permission
      to germinate a recreational crop.[@current]
    sources:
      - current
  driving:
    status: limit
    text: >-
      Driving with THC above 0.001 mg per kg of blood is prohibited when it was not taken under
      a lawful prescription.[@road] Prescribed THC also falls under the prohibition if taken
      contrary to the prescription, and the law separately prohibits driving when unable to do
      so safely.[@road] The Pharmacy Service advises patients not to drive while receiving
      medical cannabis.[@pharmacy]
    sources:
      - road
      - pharmacy
  arrests:
    text: >-
      The [2025 police statistics](/history/faroes-police-cannabis-statistics-2025/) recorded 62
      drug-law reports in 2025, down from 107 in 2024 and 142 in 2021.[@police] These are
      reports covering controlled drugs generally, rather than a count of cannabis users
      arrested.[@police]
    sources:
      - police
  black_market:
    text: >-
      Police seized 29.58 kg of hashish in 2025, compared with 69.69 kg in 2024 and 16.25 kg in
      2021.[@police] Their strategic drug-enforcement focus is on organisers and larger
      middlemen.[@police] In [January 2024](/history/faroes-norrona-hash-seizure-2024/), customs
      found 24 kg of hashish in a car arriving on Norrøna; two suspects were charged under the
      serious drug-offence provision.[@smuggle24]
    sources:
      - police
      - smuggle24
  hemp:
    status: strict
    text: >-
      A commercial hemp crop needs an annual medicines-authority permit, with no more than 0.2%
      THC and each continuous plot at least 0.3 hectares.[@current] Applications go through
      [Búnaðarstovan](https://www.bst.fo/), with a police opinion and consultation with the
      Chief Pharmacist.[@current] Buying, holding and processing an authorised crop is allowed,
      but processing must not create preparations exceeding 0.2% THC.[@current]
    sources:
      - current
