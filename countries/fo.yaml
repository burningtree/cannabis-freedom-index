name: Faroe Islands
region: Europe
iso_numeric: 234
dependency:
  of: dk
  kind: Self-governing territory
  note: >-
    The Faroe Islands are a self-governing part of the Kingdom of Denmark with their own parliament,
    the Løgting. Narcotics are covered by the law on euphoriant substances as it applies in the
    islands, and Denmark answers for them internationally.
population:
  2025: 54684
cannabis_use:
  prevalence: 5.7
  estimate: true
  users: 2000
recreational: illegal
medical: limited
updated: 2026-10-17
summary: >-
  Possession of cannabis is an offence and, the police say, is prosecuted even in small amounts for
  personal use, though their focus is on dealers. The courts set drug sentences higher than in
  Denmark. Doctors may prescribe a set of cannabis-based medicines; whether the islands have joined
  Denmark's trial scheme for cannabis flower could not be confirmed.
scores:
  possession: 1
  cultivation: 1
  enforcement: 2
  sharing: 1
  consumption: 1
  access: 1
segments:
  possession:
    text: >-
      Possession is an offence under the law on euphoriant substances. The Faroese police write that
      breaking it, even with small quantities for personal use, is not exempt from punishment and is
      prosecuted when the police learn of it.
    sources:
      - pol25
  cultivation:
    text: >-
      Growing cannabis is an offence under the same law, with no tolerated number of plants.
    sources:
      - pol25
  enforcement:
    text: >-
      Users are prosecuted, but the police put their strategic focus on organisers and larger
      middlemen. Reported narcotics offences fell from 142 in 2021 to 62 in 2025, while seizures of
      hash rose to 69.7 kg in 2024. In 2021 the Supreme Court of Denmark upheld the Faroese practice
      of punishing drug importation more severely than in Denmark.
    sources:
      - pol25
      - lg21
  sharing:
    text: >-
      Passing cannabis on to others is an offence under the euphoriant substances law, with no
      exception for sharing without payment.
    sources:
      - pol25
  consumption:
    text: >-
      Use is dealt with through the possession offence. There are no places where it is tolerated.
    sources:
      - pol25
  access:
    text: >-
      No legal adult-use source. In 2018 Faroese GPs could prescribe eleven cannabis-containing
      medicines under the same guidance as in Denmark, but cannabis flower, allowed in the Danish
      trial scheme, was not approved. In 2019 the pharmacy service ordered cannabis buds from the
      Netherlands at a doctor's request; 61 patients were then on prescribed cannabis drops.
    sources:
      - kvf18
      - kvf19
context:
  production:
    text: >-
      No licensed production. Hash reaches the islands by smuggling, and seizures have grown even as
      the number of reported offences fell.
    sources:
      - pol25
  products:
    text: >-
      Prescribed cannabis-containing medicines, mostly drops. Patients were advised to take the
      preparations as tea or to inhale them with a vaporiser.
    sources:
      - kvf18
      - kvf19
  medical:
    text: >-
      A bill to let Faroese patients join Denmark's trial scheme for medical cannabis was voted down
      in 2018. When it returned in 2019, the health minister offered instead to add cannabis
      products to the national list of medicines, which would let patients start treatment without
      a new law. In July 2019 MPs were expected to vote on adopting the trial scheme; the outcome
      could not be confirmed.
    sources:
      - kvf19a
      - kvf18
  consequences:
    text: >-
      A party formed in 2018 to campaign for legal cannabis handed in the 800 signatures needed to
      stand for election in February 2019; it wants everyone to have the right to grow and use the
      plant, and free access for those who need it medically. The police say rising seizures may point to growing drug use in
      the islands.
    sources:
      - kvf18p
      - kvf19e
      - pol25
  clubs:
    status: none
    text: >-
      No cannabis clubs are known. Passing cannabis to others is an offence.
    sources:
      - pol25
  visitors:
    status: none
    text: >-
      There is no legal supply for anyone, and importing drugs is punished more severely than in
      Denmark.
    sources:
      - lg21
