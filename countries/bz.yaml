segments:
  possession:
    text: >-
      Since November 2017, holding up to 10 g of cannabis or cannabis resin is not unlawful and not
      an offence (section 7(7) of the Misuse of Drugs Act). The exception is the premises of a
      school or other educational institution: there it brings a police warning the first time
      and a ticket of 100 Belize dollars after that, with no arrest and no criminal record. A
      person under 18 found with cannabis must attend a treatment or counselling programme. More
      than 10 g is a criminal offence.
    sources:
      - act
  cultivation:
    text: Not allowed. Growing any amount of cannabis remains a criminal offence.
    sources:
      - wiki
      - tni
  enforcement:
    text: >-
      Small private possession is unpunished and minor violations are fines. Cultivation, larger
      quantities and sale carry fines and prison.
    sources:
      - act
      - tni
  sharing:
    text: Supply of any kind remains a crime; the 2017 amendment covers possession and use only.
    sources:
      - wiki
      - act
  consumption:
    text: >-
      Smoking is lawful on private premises with the owner's permission. Use in public places is an
      offence punished by a fine.
    sources:
      - act
      - wiki
  access:
    text: >-
      No lawful source at all: cannabis may be possessed but neither grown nor bought. A 2022 law to
      license a commercial industry was passed by parliament but put on hold after church groups
      demanded a referendum.
    sources:
      - wiki
context:
  planting:
    seeds: licensed
    seeds_trade: regulated
    clones: licensed
    clones_trade: unclear
    text: >-
      The Act treats every part of a cannabis plant as cannabis, so drug-type seeds and cuttings
      remain controlled. Industrial-hemp seed and plants at no more than 0.3% THC are available
      through the registered commercial-hemp system: cultivation fields and seed import or export
      require registration, and moving hemp seed requires a permit. The regulations do not set a
      distinct rule for trading hemp cuttings.
    sources:
      - act
      - hemp_regs
  production:
    text: >-
      There is no licensed production of higher-THC cannabis. Industrial hemp may be grown in
      registered commercial fields; the shelved 2022 cannabis bill would have created a broader
      licensing commission.
    sources:
      - wiki
      - hemp_regs
  products:
    text: No legal products.
    sources:
      - wiki
  medical:
    text: There is no medical cannabis programme.
    sources:
      - wiki
  consequences:
    text: Violations under 10 g are handled by ticket without a criminal conviction.
    sources:
      - act
      - tni
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and no law provides for them: the 2017 amendment covers
      possession and use only, and supply of any kind remains a crime.
    sources:
      - wiki
      - act
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. British travel advice says only that
      possession of illegal drugs can lead to a fine and a prison sentence.
    sources:
      - wiki
      - fcdo
  driving:
    status: impairment
    text: >-
      Motor Vehicles and Road Traffic Act section 74 defines drug-related unfitness as
      impaired ability to drive properly. Driving or attempting to drive on a road or public
      place while unfit carries a fine of at least BZ$500 or one year's imprisonment or both
      for a first conviction; a repeat carries BZ$1,000–5,000 or two years or both. Being in
      charge while unfit has a separate BZ$500 or six-month penalty or both, with a defence
      where there was no likelihood of driving while unfit. Section 91 permits the court
      to disqualify an offender for a stated period or permanently, generally or for certain
      vehicle classes, and normally requires licence endorsement. These are the court
      provisions of the 2020 revised edition; no numeric THC threshold or automatic fixed
      ban is stated in section 74.
    sources:
      - motortraffic2020
  black_market:
    text: >-
      Figures reported by the government to the UN drugs office record 733 kg of herbal
      cannabis seized in 2024, against 338 kg in 2023. The UN publishes them as kilogram
      equivalents, and countries count seizures differently, so the figures are not
      comparable across borders.
    sources:
      - unodc_szr
