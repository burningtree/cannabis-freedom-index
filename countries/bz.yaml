name: Belize
region: North America
iso_numeric: 84
recreational: decriminalised
medical: none
updated: '2026-10-29'
summary: >-
  Since 2017 adults may possess up to 10 g and use it on private premises. A regulated market law
  was shelved.
# the search-result description, where the generated one runs long (src/lib/seo.js)
seo_description: >-
  In Belize adults may hold up to 10 g and use it on private premises; more, or cannabis at a
  school, is an offence. There is no legal market and no medical cannabis.
scores:
  possession: 4
  cultivation: 1
  enforcement: 4
  sharing: 1
  consumption: 3
  access: 0
# What the possession score cannot say precisely (src/lib/answers.js).
answers:
  carry:
    answer: limited
    text: Up to 10 g is not an offence, except at a school; more is a crime
segments:
  possession:
    text: >-
      Since November 2017, holding up to 10 g of cannabis or cannabis resin is not unlawful and not
      an offence (section 7(7) of the Misuse of Drugs Act).[@act] The exception is the premises of a
      school or other educational institution: there it brings a police warning the first time
      and a ticket of 100 Belize dollars after that, with no arrest and no criminal record.[@act] A
      person under 18 found with cannabis must attend a treatment or counselling programme.[@act] More
      than 10 g is a criminal offence, punishable as a Class B drug with up to three years or a
      $50,000 fine.[@act2000] Decriminalisation had been under discussion since
      2012.(/history/belize-decriminalisation-considered-2012/)
    sources:
      - act
      - act2000
    currency: BZD
    penalties:
      - upto: 10 g
        treatment: tolerated
        note: Not an offence; school premises bring a warning first, then a BZ$100 ticket; under-18s face treatment or counselling
      - over: 10 g
        treatment: criminal
        term: Possession of a controlled drug
        prison: 3 years
        fine: 50000
        note: Class B maximum under section 7
  cultivation:
    text: >-
      Cultivating any cannabis plant without lawful authority is an offence punishable under the
      trafficking penalties of section 18: on summary conviction three to ten years plus a
      $10,000–$100,000 fine, on indictment five to fourteen years plus a $50,000–$250,000 fine,
      with a fine-only option under 5 kg of cannabis for special reasons recorded in
      writing.[@act2000] Industrial hemp is
      a separate registered commercial crop under the hemp regulations, with a 0.3% THC ceiling in the
      2020 consolidation.[@hemp_regs]
    sources:
      - act2000
      - hemp_regs
    currency: BZD
    penalties:
      - label: Cannabis cultivation, summary conviction
        treatment: criminal
        term: Cultivation punishable under section 18
        prison: 10 years
        prison_min: 3 years
        fine: 100000
        fine_min: 10000
        note: Under 5 kg cannabis, fine may replace custody for recorded special reasons
      - label: Cannabis cultivation, conviction on indictment
        treatment: criminal
        term: Cultivation punishable under section 18
        prison: 14 years
        prison_min: 5 years
        fine: 250000
        fine_min: 50000
        note: Under 5 kg cannabis, fine may replace custody for recorded special reasons
  enforcement:
    text: >-
      Small private possession is unpunished and minor violations are fines.[@act,tni] Cultivation, larger
      quantities and sale carry fines and prison under section 18.[@act2000]
    sources:
      - act
      - tni
      - act2000
  sharing:
    text: Supply of any kind remains a crime; the 2017 amendment covers possession and use only.[@act,act2000]
    sources:
      - act
      - act2000
  consumption:
    text: >-
      Smoking is lawful on private premises with the owner's permission.[@act] Use in public places is an
      offence punished by a fine.[@act]
    sources:
      - act
  access:
    text: >-
      No lawful source at all: cannabis may be possessed but neither grown nor bought, since the
      2017 amendment covers possession and use only and supply of any kind remains a crime.[@act,tni] A 2022
      law to license a commercial industry was passed by parliament but put on hold after church
      groups demanded a
      referendum.[@sps22](/history/belize-legalisation-bill-shelved-2022/) A 2025 Caye Caulker referendum on a
      regulated industry voted no.[@gbm25ref](/history/belize-caye-caulker-referendum-2025/)
    sources:
      - act
      - tni
      - sps22
      - gbm25ref
context:
  recreational:
    text: >-
      There is no legal recreational supply: up to 10 g may be possessed and used on private
      premises, but nothing may be grown or bought since supply of any kind stays a
      crime.[@act,act2000] Smoking is lawful on private premises with the owner's permission and
      an offence in public places.[@act] The 2022 commercial-licensing law was shelved after
      church groups demanded a
      referendum.[@tni,sps22](/history/belize-legalisation-bill-shelved-2022/)
    sources:
      - act
      - act2000
      - tni
      - sps22
  planting:
    seeds: licensed
    seeds_trade: regulated
    clones: licensed
    clones_trade: unclear
    text: >-
      The Act treats every part of a cannabis plant as cannabis, so drug-type seeds and cuttings
      remain controlled.[@act] Industrial-hemp seed and plants at no more than 0.3% THC are available
      through the registered commercial-hemp system: cultivation fields and seed import or export
      require registration, and moving hemp seed requires a permit.[@hemp_regs] The regulations do not set a
      distinct rule for trading hemp cuttings.[@hemp_regs]
    sources:
      - act
      - hemp_regs
  production:
    status: hemp
    text: >-
      There is no licensed production of higher-THC cannabis: supply of any kind remains a
      crime.[@act,act2000] Industrial hemp may be grown in
      registered commercial fields; the shelved 2022 cannabis bill would have created a broader
      licensing commission.[@hemp_regs,sps22](/history/belize-legalisation-bill-shelved-2022/) Until the 1980s
      Belize was a major export-crop producer before US-backed eradication cut production
      sharply.(/history/belize-eradication-1985/)
    sources:
      - act
      - act2000
      - hemp_regs
      - sps22
  medical:
    text: The reviewed law provides possession and use allowances but no medical programme or licensing route.[@act]
    sources:
      - act
  consequences:
    text: Violations under 10 g are handled by ticket without a criminal conviction.[@act,tni]
    sources:
      - act
      - tni
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and no law provides for them: the 2017 amendment covers
      possession and use only, and supply of any kind remains a crime.[@act]
    sources:
      - act
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone.[@act] Holding up to 10 g is not an
      offence except on school premises, while smoking in a public place is punished with a
      fine; more than 10 g, and any supply, remain crimes.[@act]
    sources:
      - act
  driving:
    status: impairment
    text: >-
      Motor Vehicles and Road Traffic Act section 74 defines drug-related unfitness as
      impaired ability to drive properly. Driving or attempting to drive on a road or public
      place while unfit carries a fine of at least BZ$500 or one year's imprisonment or both
      for a first conviction; a repeat carries BZ$1,000–5,000 or two years or both. Being in
      charge while unfit has a separate BZ$500 or six-month penalty or both, with a defence
      where there was no likelihood of driving while unfit. Section 91 permits the court
      to disqualify an offender for a stated period or permanently, generally or for certain
      vehicle classes, and normally requires licence endorsement. These are the court
      provisions of the 2020 revised edition; no numeric THC threshold or automatic fixed
      ban is stated in section 74.
    sources:
      - motortraffic2020
  black_market:
    text: >-
      Figures reported by the government to the UN drugs office record 733 kg of herbal
      cannabis seized in 2024, against 338 kg in 2023. The UN publishes them as kilogram
      equivalents, and countries count seizures differently, so the figures are not
      comparable across borders.
    sources:
      - unodc_szr
  arrests:
    text: >-
      The police reported that 1,562 people were charged with drug offences in 2025, which
      they described as a record year, and that they seized 705,638 grams of cannabis,
      about 706 kg, along with 41,784 grams of cocaine. The figures are not split between
      possession and trafficking.
    sources:
      - gb25
  hemp:
    status: standard
    text: >-
      Industrial hemp may contain no more than 0.3% THC under the 2020 amended
      regulations.[@hemp_regs] Commercial growers and processors must register their activities and
      fields or facilities with the agricultural authorities; a growing field must be at least one
      acre.[@hemp_original] Movement requires a permit, and research on industrial hemp has a separate
      licence.[@hemp_original]
    sources:
      - hemp_regs
      - hemp_original
