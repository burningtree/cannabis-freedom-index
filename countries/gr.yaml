segments:
  possession:
    text: >-
      Under Law 4139/2013, obtaining or possessing cannabis in a quantity that indicates personal
      use is a misdemeanour punishable by up to five months in prison. In practice sentences are
      usually suspended or replaced by treatment, and the conviction is not entered on the ordinary
      criminal record.
    sources:
      - nk
  cultivation:
    text: >-
      Growing a number of plants consistent with personal use falls under the same misdemeanour, up
      to five months. Anything more is treated as production for trafficking.
    sources:
      - nk
  enforcement:
    text: >-
      Prison is legally possible for users but rare in practice. Trafficking carries at least eight
      years.
    sources:
      - nk
  sharing:
    text: Supply is a felony, with a reduced sentence where the supplier is a dependent user.
    sources:
      - nk
  consumption:
    text: Use is covered by the same personal-use misdemeanour.
    sources:
      - nk
  access:
    text: >-
      No adult-use source. Medical cannabis became legal in 2017, but finished products reached
      patients only years later.
    sources:
      - boc
      - mondaq
context:
  production:
    text: >-
      Greece issues licences for cultivation and processing of pharmaceutical cannabis, simplified
      by a 2021 law, aimed largely at export.
    sources:
      - mondaq
      - boc
  products:
    text: >-
      Prescription pharmaceutical cannabis products. Hemp foods, cosmetics and supplements within
      set THC limits are legal, and the hemp limit rose from 0.2% to 0.3% THC in May 2026. The same
      law banned selling dried hemp flower to consumers, and a July 2026 law banned smokable or
      vapable plant products with added cannabinoids.
    sources:
      - l5302
      - l5322
      - eof26
      - mondaq
      - boc
  medical:
    text: >-
      Legal on prescription since 2017 after cannabis was moved to a less restrictive schedule.
      Availability has been slow to follow.
    sources:
      - boc
      - nk
  consequences:
    text: Personal-use convictions are kept off the standard criminal record.
    sources:
      - nk
  arrests:
    text: >-
      The EU drugs agency's statistical bulletin records 12,399 cannabis-related drug law
      offences in Greece in 2024, against 10,124 in 2023. Of the 2024 total, 8,359 were for
      use or possession for use. Since 2018 the figure is the sum of offences for all cannabis
      products. Countries count these differently (offences or offenders, criminal or
      administrative), so the figure is not comparable across borders.
    sources:
      - euda_dlo
  clubs:
    status: none
    text: >-
      No club is confirmed. A Europe-wide survey of cannabis social clubs carried out in 2018
      and 2019 received no answer from Greece but, because of contradictory sources, could not
      rule out that clubs were active there. The model is prohibited throughout the European
      Union. Nothing more recent was found.
    sources:
      - pardal20
  planting:
    seeds: licensed
    seeds_trade: banned
    clones: licensed
    clones_trade: banned
    text: >-
      The drug law deals with seeds only inside its licensing regime for medical cannabis.
      Under Article 2A a producer holding a state approval may import seed for sowing and
      propagating material of varieties with more than 0.2% THC, while making such seed or
      propagating material available to others, or exporting it, is prohibited. For everyone
      else, growing plants in a number that fits personal use is the same misdemeanour as
      possession. No provision or court ruling on unsown seeds kept by an individual was
      found. Hemp varieties under the THC limit follow separate rules with certified seed.
    sources:
      - n4139
      - nk
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone; legal supply is medical, for patients.
      British travel advice tells visitors to expect a long prison sentence and heavy fines
      for possessing, using or smuggling drugs, cannabis included, also in airport transit.
    sources:
      - boc
      - mondaq
      - fcdo
