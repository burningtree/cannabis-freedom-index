name: Greece
region: Europe
iso_numeric: 300
recreational: illegal
medical: limited
updated: 2026-10-04
summary: >-
  Personal use is a misdemeanour that is rarely jailed. Medical cannabis was legalised in 2017 and
  production licences are issued.
scores:
  possession: 1
  cultivation: 1
  enforcement: 3
  sharing: 1
  consumption: 1
  access: 1
segments:
  possession:
    text: >-
      Under Law 4139/2013, obtaining or possessing cannabis in a quantity that indicates personal
      use is a misdemeanour punishable by up to five months in prison. In practice sentences are
      usually suspended or replaced by treatment, and the conviction is not entered on the ordinary
      criminal record.
    sources:
      - nk
  cultivation:
    text: >-
      Growing a number of plants consistent with personal use falls under the same misdemeanour, up
      to five months. Anything more is treated as production for trafficking.
    sources:
      - nk
  enforcement:
    text: >-
      Prison is legally possible for users but rare in practice. Trafficking carries at least eight
      years.
    sources:
      - nk
  sharing:
    text: Supply is a felony, with a reduced sentence where the supplier is a dependent user.
    sources:
      - nk
  consumption:
    text: Use is covered by the same personal-use misdemeanour.
    sources:
      - nk
  access:
    text: >-
      No adult-use source. Medical cannabis became legal in 2017, but finished products reached
      patients only years later.
    sources:
      - boc
      - mondaq
context:
  production:
    text: >-
      Greece issues licences for cultivation and processing of pharmaceutical cannabis, simplified
      by a 2021 law, aimed largely at export.
    sources:
      - mondaq
      - boc
  products:
    text: Prescription pharmaceutical cannabis products; hemp and CBD under 0.2% THC.
    sources:
      - mondaq
      - boc
  medical:
    text: >-
      Legal on prescription since 2017 after cannabis was moved to a less restrictive schedule.
      Availability has been slow to follow.
    sources:
      - boc
      - nk
  consequences:
    text: Personal-use convictions are kept off the standard criminal record.
    sources:
      - nk
