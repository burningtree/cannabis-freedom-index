name: Saint Vincent and the Grenadines
region: North America
iso_numeric: 670
recreational: decriminalised
medical: legal
words:
  - word: sacrament
    lang: Rastafari
    meaning: Cannabis as the inalienable holy sacrament; Rastafari representatives told the 2018 select committee the state cannot grant what is already theirs
    sources:
      - iwnsvg
updated: 2026-10-10
summary: >-
  Up to 2 oz is decriminalised and a licensed medical industry, including traditional growers,
  operates since 2018.
scores:
  possession: 3
  cultivation: 1
  enforcement: 4
  sharing: 1
  consumption: 3
  access: 2
segments:
  possession:
    text: >-
      Since 3 March 2020, when the 2019 amendment was proclaimed into force, a person found with
      56 g (two ounces) or less is not arrested or detained.[@drugs_proclamation]
      It remains an offence carrying a fine of up to EC$500, but accepting the prescribed police
      measures discharges liability without proceedings or a criminal record.[@drugs_amend]
    sources:
      - drugs_amend
      - drugs_proclamation
    currency: XCD
    penalties:
      - treatment: civil
        term: Fine up to EC$500, no arrest or record
        upto: 56 g
        fine: 500
        note: Accepting the prescribed police measures discharges liability without proceedings
      - treatment: criminal
        term: Ordinary criminal penalties
        over: 56 g
        note: Larger quantities, unlicensed growing and trafficking remain criminal
  cultivation:
    text: >-
      Growing for personal use was not legalised. Cultivation is lawful only under a licence from
      the Medicinal Cannabis Authority, including a special category for traditional growers who
      came forward under an amnesty.
    sources:
      - mci_act
  enforcement:
    text: >-
      No prison for two ounces or less; a modest fine instead. Larger quantities, unlicensed growing
      and trafficking remain criminal. Hillside eradication runs deep here: the 2009 Operation
      Vincy Pac burned fields and shanties, and three men were shot dead at
      Vermont.(/history/saint-vincent-vincy-pac-2009/)
    sources:
      - drugs_amend
  sharing:
    text: Supply remains an offence outside the licensed medical system and Rastafari sacramental use.
    sources:
      - mci_act
      - wiki
  consumption:
    text: >-
      The amendment lets people smoke in the privacy of their homes and in Rastafari places of
      worship without punishment. Public smoking remains an offence.
    sources:
      - drugs_amend
  access:
    text: >-
      No adult-use shops. Licensed medicinal dispensaries serve patients with a practitioner's
      recommendation, including visitors. A lounge opened in May 2022 has a doctor on site:
      a prescription and a one-year cannabis card from the Medicinal Cannabis Authority let the
      holder buy and consume there.
    sources:
      - mci_act
      - jo22
      - wiki
context:
  recreational:
    text: >-
      There is no legal recreational market. Since March 2020 two ounces or less brings at most
      an EC$500 fine with no arrest, and accepting the police measures discharges liability
      without a record.[@drugs_amend] People may smoke at home and in Rastafari places of
      worship; public smoking stays an offence.[@drugs_amend] Growing for personal use was not
      legalised — cultivation needs a Medicinal Cannabis Authority licence — and supply
      remains criminal outside the licensed system.[@mci_act,wiki]
    sources:
      - drugs_amend
      - mci_act
      - wiki
  planting:
    seeds: licensed
    seeds_trade: regulated
    clones: licensed
    clones_trade: regulated
    text: >-
      Sowing cannabis seed is legally part of cultivation, and growing remains confined to medicinal
      cultivation or traditional-cultivator licences. The same licensed system covers plant nurseries
      and allows planting material to be imported only under an import licence; the Medicinal
      Cannabis Authority publishes a separate seed import and export protocol.
    sources:
      - mci_act
      - mca_seed
  production:
    status: medical
    text: >-
      The country built one of the Caribbean's first licensed medical cannabis industries in 2018,
      deliberately bringing in traditional hillside growers through an amnesty law and dedicated
      licence class. The first licences, more than 30, went out in July 2019, and the first export
      certificate, for a shipment to Germany, was approved in January 2022.
    sources:
      - mci_act
      - agriculture
      - tni19
      - voice22
  medical:
    text: >-
      Legal since December 2018 on a medical recommendation, supplied as flower and preparations
      by licensed local producers through dispensaries and a pharmacy. Green Lava Labs Pharmacy
      opened at Bentick Square in Kingstown, opposite the main
      hospital.(/history/saint-vincent-first-pharmacy-2020/)
    sources:
      - mci_act
      - agriculture
  culture:
    text: >-
      For [Rastafari](/culture/traditions/rastafari-sacrament/) cannabis is a sacrament
      the state cannot grant: representatives told the 2018 select committee the right was already
      theirs, and the government withdrew its religious-use
      bill.[@iwnsvg](/history/saint-vincent-religious-bill-dropped-2018/) The standing prohibition
      descends from the 1937 Dangerous Drugs
      Ordinance.(/history/saint-vincent-dangerous-drugs-1937/)
    sources:
      - iwnsvg
  consequences:
    text: The small-quantity fine does not lead to arrest or a custodial record.
    sources:
      - drugs_amend
  clubs:
    status: none
    text: >-
      There are no cannabis clubs as such. Supply remains an offence outside the licensed
      medical system and Rastafari sacramental use.
    sources:
      - mci_act
      - wiki
  visitors:
    status: open
    text: >-
      Visitors can buy on the same terms as residents, which means through the medicinal
      system: licensed dispensaries serve patients with a practitioner's recommendation,
      visitors included, and a lounge with a doctor on site can issue the prescription and
      patient card. There are no general adult-use shops, and supply outside that system
      remains an offence.
    sources:
      - mci_act
      - jo22
      - wiki
