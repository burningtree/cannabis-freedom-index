name: Germany
region: Europe
iso_numeric: 276
recreational: legal
medical: legal
updated: 2026-10-27
summary: >-
  Since April 2024 any adult may carry 25 g. People who have lived in Germany for six months may keep
  50 g at home, grow three plants and join a non-profit growing association. There are no shops, but
  medical cannabis is easy to obtain through pharmacies.
scores:
  possession: 5
  cultivation: 4
  enforcement: 6
  sharing: 1
  consumption: 5
  access: 3
# The channel the access score cannot name (src/lib/answers.js).
answers:
  buy:
    answer: limited
    text: Only as a resident member of a non-profit cultivation association, or on prescription
segments:
  possession:
    text: >-
      Any adult may carry up to 25 g of dried cannabis.[@kcang3, bmg] Someone who has lived in Germany
      for six months may keep up to 50 g at home, and the amount they hold in total stops at
      50 g.[@kcang3, kcang1] More than 25 g and up to 30 g away from home, or more than 50 g and up to
      60 g at home, is an administrative offence with a fine of up to €30,000; above that it is a
      crime with up to three years in prison or a fine.[@kcang36, kcang34, bmg] Bringing cannabis
      into the country, or taking it out, is a crime.[@kcang2]
    sources:
      - bmg
      - kcang1
      - kcang2
      - kcang3
      - kcang34
      - kcang36
    currency: EUR
    penalties:
      - upto: 25 g
        treatment: legal
        note: Away from home; at home a resident may keep up to 50 g in total
      - over: 25 g
        upto: 30 g
        treatment: civil
        term: Administrative offence (Ordnungswidrigkeit)
        fine: 30000
        note: At home, over 50 g and up to 60 g
      - over: 30 g
        treatment: criminal
        term: Crime (Straftat)
        prison: 3 years
        note: At home, over 60 g; a criminal fine instead of prison is possible
      - label: A 'not small amount' (nicht geringe Menge), as set by the courts
        treatment: criminal
        term: Crime, especially serious case
        prison_min: 3 months
        prison: 5 years
  cultivation:
    text: >-
      Someone who has lived in Germany for six months may grow up to three plants at that home, out of
      the reach of children.[@kcang9, kcang1, bmg] Cannabis above the 50 g home limit must be
      destroyed.[@bmg] A fourth plant is a crime with up to three years in prison or a fine, and
      growing to make a living from it up to five years.[@kcang34]
    sources:
      - bmg
      - kcang1
      - kcang9
      - kcang34
    currency: EUR
    penalties:
      - upto: 3 plants
        treatment: legal
        note: Residents of six months, at their home
      - over: 3 plants
        treatment: criminal
        term: Crime (Straftat)
        prison: 3 years
        note: A criminal fine instead of prison is possible
      - label: Growing commercially (gewerbsmäßig)
        treatment: criminal
        term: Crime, especially serious case
        prison_min: 3 months
        prison: 5 years
  enforcement:
    text: >-
      Within the limits nothing is punished; small overages are fines. Selling, giving away, or
      growing beyond three plants are crimes with prison of up to three years, more in aggravated
      cases.
    sources:
      - kcang
      - bmg
  sharing:
    text: >-
      Not allowed. Home-grown cannabis may not be passed on to anyone, even for free, and club
      cannabis is for the member's own use only. Giving cannabis to another adult remains punishable
      — the main reason this segment scores so low.
    sources:
      - bmg
  consumption:
    text: >-
      Public consumption is legal, with exceptions: not near minors, not in or within sight of
      schools, playgrounds, youth facilities and sports grounds, not in pedestrian zones between
      7:00 and 20:00, and not inside or near cultivation associations.
    sources:
      - bmg
      - kcang
  access:
    text: >-
      There are no shops. The only non-medical source besides home growing is a non-profit
      cultivation association: up to 500 members, minimum three-month membership, at most 25 g a day
      and 50 g a month (30 g and max 10% THC for ages 18–21).[@bmg, kcang] A member must have lived in Germany for
      six months.[@bmg, kcang1, kcang16] Many regions
      still have few licensed associations.
    sources:
      - bmg
      - kcang
      - kcang1
      - kcang16
context:
  recreational:
    text: >-
      Adults may [carry and use cannabis](/history/germany-cannabis-act-2024/), but there is still no shop to buy it in. The legal routes
      are growing three plants at home or joining a non-profit [growing
      association](/history/germany-cultivation-associations-2024/), and both are
      open only to people who have lived in Germany for six months.[@bmg,kcang1] Associations may
      hand out only flower and hashish; edibles such as THC gummies, and extracts, stay
      banned.[@bmg] The government's evaluation found that in 2024 associations supplied less than
      0.1% of the cannabis adults used and pharmacies 12 to 14%, much of it on private
      prescriptions. Most still came from the illegal market, typically through friends and
      acquaintances rather than street dealers.[@dhv25,abda26] Researchers at the economic institute
      DIW found no structural change in how much people use in the short term.[@diw26]
    sources:
      - bmg
      - kcang1
      - dhv25
      - abda26
      - diw26
  hemp:
    status: standard
    text: >-
      Only farms may grow hemp, from certified EU varieties with at most 0.3% THC. Sowing must be
      reported to the [Federal Office for Agriculture and Food](https://www.ble.de/) by 1 July, which also tests plants
      during flowering.[@nh24] After a record in 2024, the area fell in 2025 to 5,274 hectares on
      496 farms, with Lower Saxony growing the most.[@nh25] HHC, a semi-synthetic cannabinoid that
      had been sold as a legal alternative, has been [banned under the law on new psychoactive
      substances](/history/germany-hhc-banned-2024/) since 21 June 2024, including its possession. The Federal Institute for Risk
      Assessment still found HHC gummies on sale in 2025, and makers switching to untested
      relatives of it.[@bfr25]
    sources:
      - nh24
      - nh25
      - bfr25
  production:
    status: medical
    text: >-
      Commercial recreational production is not permitted at all; associations must grow for their
      own members with member labour.[@kcang] The [second step the government promised in
      2023](/history/germany-two-pillar-plan-2023/),
      regional pilot projects with licensed shops, never became law, and the federal agriculture
      office refused applications for such pilots on that ground.[@tsp25] The legal cannabis
      business is medical. Growing and importing medical cannabis need a licence from the federal
      medicines agency, [BfArM](https://www.bfarm.de/).[@medcang] Imports of medical flower almost tripled, from about 73 tonnes in
      2024 to 201 tonnes in 2025, mostly from Canada and Portugal; the pharmacists' association
      [ABDA](https://www.abda.de/)
      puts the jump down to the growing number of private prescriptions.[@abda26]
    sources:
      - kcang
      - tsp25
      - medcang
      - abda26
  medical:
    text: >-
      Cannabis is no longer a narcotic in law: any doctor can prescribe it on an ordinary
      prescription, dispensed by pharmacies.[@medcang] Statutory insurance covers extracts in
      standardised quality, and medicines containing dronabinol or nabilone, for a serious illness
      when a standard treatment is unavailable or unsuitable and there is a realistic chance of a
      noticeable benefit.[@sgb31] [From 30 July 2026](/history/germany-flower-reimbursement-ended-2026/), the date the insurers' doctors' association
      gives for the change, that cover no longer includes dried flower.[@kbv] A first insured
      prescription starts with a six-month trial of an authorised cannabis finished medicine.[@sgb31]
      A patient already on an extract or a compounded preparation before that date can continue
      without the trial.[@kbv] Switching off flower needs a fresh insurer approval, unless the
      doctor is in a group excused from approval.[@kbv] A private prescription is separate from
      this insured cover.[@bmg] A [government bill](/history/germany-medical-restrictions-bill-2025/) to require an in-person consultation before prescribing,
      aimed at telemedicine platforms, went through parliamentary hearings in January 2026. The
      bill, which would also ban mail-order dispensing of flower, was not put to a final vote before
      the summer recess and had not been passed as of September 2026.[@juravendis, boc]
    sources:
      - medcang
      - sgb31
      - kbv
      - bmg
      - juravendis
      - boc
  consequences:
    text: >-
      Old convictions for conduct that is now legal can be deleted from the federal register on
      application. The driving limit is 3.5 ng/ml THC in blood serum, with zero tolerance for novice
      drivers and under-21s.
    sources:
      - bmg
  planting:
    seeds: legal
    seeds_trade: open
    clones: legal
    clones_trade: regulated
    text: >-
      Handling cannabis seeds is allowed unless they are meant for unlawful growing, and seeds
      for home growing may be imported only from other EU member states. Cuttings without
      flowers count as propagation material: cultivation associations may hand out up to seven
      seeds or five cuttings a month per person, in person, to members and to other adults
      living in Germany. Cuttings may not be shipped or delivered.
    sources:
      - kcang
  clubs:
    status: regulated
    text: >-
      Non-commercial cultivation associations have been [legal since 1 July
      2024](/history/germany-cultivation-associations-2024/), each needing
      a permit from its state. A member must have lived in Germany for six months.[@bmg, kcang1] By
      August 2026 a nationwide count found 455 approved out of 896
      applications, with North Rhine-Westphalia and Lower Saxony ahead and Bavaria far behind.[@hj26]
      Clubs complain of building rules, security requirements and paperwork that differ from
      state to state. Even at full production they would cover only about 3.5 to 4.3% of
      estimated demand.
    sources:
      - hj26
      - bmg
      - kcang1
  black_market:
    text: >-
      The government's evaluation put adult demand at about 743 tonnes a year. In 2024 the
      cultivation associations supplied less than 0.1% of it and medical cannabis from
      pharmacies roughly 12 to 14%; home growing could not be measured. The evaluators
      concluded that illegal production was probably still the main origin of the cannabis
      consumed, reaching users mostly through friends and acquaintances, with street dealing
      playing a minor part, and that the illegal share appeared to have shrunk in the first
      year.
    sources:
      - dhv25
  driving:
    status: limit
    text: >-
      Driving with at least [3.5 ng of THC per millilitre of blood
      serum](/history/germany-driving-limit-2024/) is an administrative
      offence under section 24a, with a statutory fine ceiling of €3,000; combining that level
      with alcohol has a €5,000 ceiling. Drivers under 21 or in their probationary period face a
      separate cannabis prohibition under section 24c, rather than permission up to 3.5 ng/ml.
      Both provisions exempt THC from a medicine taken as prescribed for a specific illness. That
      exemption does not permit unsafe driving: section 316 criminalises inability to drive safely
      due to intoxicants, with up to one year in prison or a fine, even without reaching the
      administrative threshold.
    sources:
      - stvg24a
      - stvg24c
      - stgb316
  visitors:
    status: residents
    text: >-
      Germany has no shops, and its growing associations are closed to visitors. A member must be
      at least 18 and have lived in Germany for six months, shown with an official photo
      document.[@kcang16, kcang1, bmg] A person may belong to only one association, and associations
      set a minimum membership of three months. A tourist has no legal way to buy cannabis, and
      carrying it across the border is a crime.[@kcang2]
    sources:
      - kcang16
      - kcang1
      - kcang2
      - bmg
  arrests:
    text: >-
      Police crime statistics show how much of drug policing had been cannabis. Recorded
      cannabis offences fell from about 174,000 in 2023 to about 62,000 in 2024, the year
      possession and home growing became legal on 1 April, close to a third of the earlier
      figure. Researchers at the economic institute DIW put most of the fall down to conduct
      that is simply no longer a crime.
    sources:
      - diw26

  culture:
    text: >-
      Hemp was once a farm crop with customs of its own. In Swabia and Baden young couples jumped
      the Midsummer fire hand in hand so that the hemp would grow 'three ells high', one of the
      rites James Frazer collected in The Golden Bough; it is described in [the hemp
      dance](/culture/traditions/the-hemp-dance/).[@frazer] The modern story begins with
      [Hasch](/culture/traditions/hasch-in-the-gdr/), the word and the drug of West Germany's
      student movement of the late 1960s.[@duden] Across the border, East German state security
      reported hashish smuggled along the transit routes to West Berlin in 1970, and the GDR wrote
      its own narcotics law in 1973.[@ddr70,ddr73] Campaigners have marched in the [Hanfparade
      in Berlin](/history/germany-hanfparade-1997/) every August since 1997.[@hanfp] The 2024 law
      is closely tied to [Karl Lauterbach](/culture/people/karl-lauterbach/), a doctor who opposed
      legalisation for years, changed his mind in 2021 and steered it through as health
      minister.[@dw21] Germans remain divided: in a 2025 Pew survey 31% called using marijuana
      morally acceptable, 25% unacceptable and 42% not a moral question.[@pew26]
    sources:
      - frazer
      - duden
      - ddr70
      - ddr73
      - hanfp
      - dw21
      - pew26
  research:
    status: licensed
    text: >-
      German researchers published 260 papers on cannabis in 2025, and 41
      clinical trials with a cannabis treatment had been registered in Germany by October
      2026.[@openalex,ctgov] The Cannabis Act itself is being studied: the law requires an
      evaluation, run by the [EKOCAN project](https://www.uke.de/ekocan) at the universities of
      Hamburg, Düsseldorf and Tübingen. Its first interim report, in October 2025, estimated adult
      demand at about 743 tonnes a year and traced where the cannabis came from.[@dhv25] The
      [second, in April 2026](/history/germany-second-evaluation-2026/), found a growing share
      coming from home growing and pharmacies, no rise in use that could be put down to the reform,
      and fewer young people sent to early-intervention programmes; it also said routine
      prescribing of high-THC medical cannabis was not justified by studies.[@eko26]
      Researchers may hold, grow or import cannabis for science only with a permit, and doing so
      without one is a crime.[@kcang34]
    sources:
      - openalex
      - ctgov
      - dhv25
      - eko26
      - kcang34
  spotlights:
    - title: Legal to have, almost nowhere to get
      text: >-
        [Since April 2024](/history/germany-cannabis-act-2024/) an adult may carry 25 g, but the
        law created no shops. The [promised second step](/history/germany-two-pillar-plan-2023/),
        licensed sales in pilot regions, never came.[@bmg,tsp25] Growing associations
        are the only legal supply apart from a home grow: by August 2026, 455 had been approved out
        of 896 applications.[@hj26] In 2024 they covered less than 0.1% of what adults used.[@dhv25]
      sources:
        - bmg
        - tsp25
        - hj26
        - dhv25
    - title: The prescription boom
      text: >-
        When cannabis stopped being a narcotic in April 2024, any doctor could prescribe it on an
        ordinary prescription, and online clinics began issuing private prescriptions in large
        numbers.[@medcang,abda26,juravendis] Imports of medical flower nearly tripled in 2025, and
        pharmacies now supply a far larger share of German cannabis than the
        associations.[@abda26,dhv25] The government has [proposed](/history/germany-medical-restrictions-bill-2025/) requiring an in-person consultation
        and banning mail-order flower; as of September 2026 the bill had not passed.[@juravendis,boc]
      sources:
        - medcang
        - abda26
        - dhv25
        - juravendis
        - boc
    - title: Bavaria's own rules
      text: >-
        Bavaria went further than the federal law. Its 2024
        Cannabisfolgenbegrenzungsgesetz bans smoking and vaping cannabis at folk festivals such as
        the Oktoberfest, in beer gardens and in Munich's English Garden, and lets towns ban it in
        places such as outdoor pools.[@by24] It has also approved far fewer growing associations
        than North Rhine-Westphalia or Lower Saxony.[@hj26]
      sources:
        - by24
        - hj26

