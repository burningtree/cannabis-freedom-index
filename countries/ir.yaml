  consumption:
    text: >-
      Using cannabis is a crime for anyone who is not an addict: Article 19 imposes 20 to 74 lashes
      and a fine of 50 to 230 million rials for the drugs on the Article 4 list, which includes
      bhang and hashish.[@anl] Addicts also commit an offence, but Article 15 protects them from
      prosecution while they are in treatment, and Article 16 provides compulsory treatment for one
      to three months, extendable by three months, rather than a fine.[@anl] In private, use is
      often overlooked; Ghiabi's fieldwork describes toleration in the circles he studied, including
      the village of Qalat near Shiraz, where cannabis is smoked in cafes.[@cgh] A systematic review
      put past-year use at 1.3% among men and 0.2% among women, rising to 4.9% among young men in
      2016–2020.[@plos]
    sources:
      - anl
      - cgh
      - plos
    currency: IRR
    penalties:
      - label: Use by a non-addict
        treatment: criminal
        term: Use
        fine_min: 50000000
        fine: 230000000
        caning:
          - 20
          - 74
  access:
    text: >-
      There is no legal source of cannabis for adults or patients.[@anl] The Anti-Narcotics Law
      allows prohibited substances only exceptionally, for medical and industrial purposes with the
      permission of the Ministry of Health.[@anl] A 2021 systematic review found no licit or medical
      production of cannabis in Iran.[@plos] The October 2026 hemp directive allows industrial hemp
      with no more than 0.3% THC and leaves a licensed route for cannabis above that level for
      medicine under the poppy rules, but no medicine or patient programme has been approved.[@hemp]
    sources:
      - anl
      - plos
      - hemp
context:
  death_penalty:
    text: >-
      The older drug law prescribed death above 5 kg for Article 4 cannabis offences and for
      specified repeat possession offences.[@anl] Since 2017, a former death or life offence
      requires an Article 45 condition before death can be imposed: weapons, leadership or
      financing, use of children or mentally incompetent people, specified prior convictions, or
      more than 50 kg for Article 4 cannabis offences.[@reform2017] Without a qualifying condition,
      former death becomes prison up to thirty years and former life becomes second-degree
      imprisonment.[@reform2017] In practice the courts have moved the other way: 795 people were
      executed for drug offences in 2025, 48.5% of all executions, up from 503 in 2024 and an
      average of 26 a year in 2018–2020.[@ecpm] Only three of the 795 were announced by the
      authorities.[@ecpm] In October 2025 a parliamentary commission spokesperson proposed removing
      death from eight drug offences, but no text or timetable was published.[@ecpm]
            The threshold is contested: article 4 says more than 5 kg, the note to article 4 says more than 20 kg applies “under any circumstances”, and article 45 uses 50 kg. A 2019 judicial meeting in Golestan treated quantity alone as sufficient; no binding national ruling resolves the conflict.[@anl,reform2017,meeting19]
    sources:
      - anl
      - reform2017
      - meeting19
      - ecpm
  recreational:
    text: >-
      Adults have no legal way to buy cannabis.[@anl] Possession up to 50 g is punished with a fine
      and lashes rather than prison, but the amount, the lashes and the risk of a custodial sentence
      rise steeply with weight.[@anl] The market is illegal and easy to reach: Ghiabi's fieldwork
      found that the time needed to obtain hashish or cannabis anywhere in Tehran had fallen from
      fifteen minutes to seven, and that dealers advertised through Instagram stories and delivered
      to the door.[@cgh] Herbal cannabis is sold as gol ('flower'), a product marketed as stronger
      and more modern than hashish, which took over from resin around 2000.[@cgh] Dealers and users
      in Tehran put gol at about 50,000 tuman a gram at the time of the fieldwork, roughly 0.80 US
      dollars; the figure is dated and not a current price.[@cgh] The state counts 2.8 to 4.4
      million regular users of illicit drugs, with opiates still the main drug.[@incsr]
    sources:
      - anl
      - cgh
      - incsr
  medical:
    text: >-
      There is no approved medical cannabis programme.[@plos] A 2021 systematic review found no
      licit or medical production of cannabis, and the law treats cannabis as a prohibited
      drug.[@plos] Researchers argued in 2024 that medical cannabis production and legalisation
      should be on the agenda, because the objections to recreational legalisation do not apply to
      medicine; the article is a proposal, not a change in the law.[@ajp] The October 2026 hemp
      directive says cannabis above 0.3% THC for medicine would follow the rules for Iranian poppy,
      but no patient route or approved medicine has been announced.[@hemp]
    sources:
      - plos
      - ajp
      - hemp
  hemp:
    status: standard
    text: >-
      Hemp may be grown only under a permit, under a directive communicated in October 2026.[@hemp]
      The rule allows farmers to grow certified seed with less than 0.3% THC and a CBD-dominant
      profile, with a licence from the provincial Jihad Agriculture organisation.[@hemp] The legal
      basis is Article 28 of the 1961 Single Convention and Article 2 of the Anti-Narcotics Law,
      which makes cultivation a crime only when it is done to produce narcotics.[@single,anl]
      Cannabis above 0.3% THC for medicine falls under the rules for Iranian poppy.[@hemp] In June
      2026 the drug control headquarters said no permits had been issued for narcotic-plant
      cultivation; the October directive covers industrial hemp, not narcotic plants.[@tasnim,hemp]
    sources:
      - hemp
      - anl
      - single
      - tasnim
  production:
    status: hemp
    text: >-
      The legal commercial route that has been announced is industrial hemp.[@hemp] The October 2026
      directive allows fibre, seed, oil and CBD production under permit, and leaves a licensed route
      for cannabis above 0.3% THC for medicine under the poppy rules.[@hemp] There is no adult-use
      market and no approved medical product.[@anl,plos] In June 2026 the drug control headquarters
      said no permits had been issued for narcotic-plant cultivation.[@tasnim]
    sources:
      - hemp
      - anl
      - plos
      - tasnim
  consequences:
    text: >-
      A drug conviction is a criminal record, and flogging sentences are carried out.[@anl] The law
      also provides for confiscation of property in the most serious trafficking cases.[@anl] A
      government employee convicted under Articles 4 or 5 is dismissed for six months on a first
      offence, a year on a second, and permanently on a third.[@anl] A drug offence can also lead to
      the death penalty, which the authorities carry out.[@ecpm]
    sources:
      - anl
      - ecpm
  planting:
    seeds: grey
    seeds_trade: open
    clones: grey
    clones_trade: unclear
    text: >-
      The Anti-Narcotics Law punishes growing cannabis only when it is done "for the purpose of
      producing narcotic drugs" (Article 2).[@anl] Article 3 punishes storing or carrying the seeds
      of the poppy and the flowering or fruiting tops of cannabis, and for cannabis requires proof
      of intent to produce narcotics; cannabis seed is not named.[@anl] The 1961 Single Convention
      leaves seeds out of its definition of cannabis.[@single] Seeds are sold openly online, and
      growers buy them; clones are plants, so keeping or trading them falls under the cultivation
      offence.[@cgh,anl]
    sources:
      - anl
      - single
      - cgh
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited.[@anl] The most serious drug offences carry
      death.[@ecpm]
    sources:
      - anl
      - ecpm
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone.[@anl] A visitor who carries a small amount
      of cannabis or hashish, roughly under 50 g, faces a fine and up to 50 lashes rather than
      prison; the penalty rises steeply with quantity, to long imprisonment and death.[@anl] The law
      makes no exception for visitors.[@anl]
    sources:
      - anl
  driving:
    status: impairment
    text: >-
      Driving after using cannabis is an offence when the police can show intoxication or incapacity
      from narcotics.[@traffic] Article 10(b) of the 2011 Traffic Violations Law requires officers
      to use equipment to establish the condition; if it is proved, they stop the driver, issue a
      fine of 2 million rials, seize the licence for six months and refer the case to
      court.[@traffic] The law sets no THC limit; the test is the driver's condition.[@traffic]
    sources:
      - traffic
  black_market:
    text: >-
      The whole market is illegal and, by Ghiabi's fieldwork, easy to reach: officials said the time
      needed to obtain hashish or cannabis anywhere in Tehran had fallen from fifteen minutes to
      seven.[@cgh] Hashish is mass-produced in Afghanistan and Pakistan and comes in along the
      opiate routes; cannabis is grown indoors and outdoors across Iran, though there are no precise
      figures on how much.[@cgh,plos] Dealers advertise through Instagram stories and deliver to the
      door.[@cgh] The United States government estimates that about 9,000 tonnes of drugs transit
      Iran each year and that Iran seizes about 1,000 tonnes, mostly on the eastern borders; opiates
      make up 80% of seizures.[@incsr]
    sources:
      - cgh
      - plos
      - incsr
  arrests:
    text: >-
      In the Iranian year 1403 (March 2024–March 2025), the anti-narcotics police reported 570,232
      people arrested: 375,438 addicts and 194,794 traffickers or distributors.[@irna] They also
      reported 372 tonnes of drugs seized.[@irna] The figures cover all drugs and give no breakdown
      for cannabis.[@irna] A separate US report estimates 2.8 to 4.4 million regular users and 1.3
      to 1.6 million treatment seekers a year.[@incsr]
    sources:
      - irna
      - incsr
  culture:
    text: >-
      Cannabis has been part of Persian life for centuries: hashish was used by Sufi orders and
      prescribed by physicians, and jurists argued for centuries over whether it was
      forbidden.[@ghiabi2018] In the twentieth century, [bang](/culture/language/bhang/) and
      [charas](/culture/language/charas/) were the older names; from about 2000, herbal cannabis
      sold as [gol](/culture/language/gol/) ('flower') spread in Tehran's universities and arts
      circles, presented as cleaner and more modern than
      [hashish](/culture/language/hashish/).[@cgh] Ghiabi's fieldwork describes a vocabulary that
      separates gol from hashish and the social identities attached to each.[@cgh] The 2018 survey
      of senior Shia clerics found that six of the eight who replied treated cannabis as lawful only
      under conditions, and most favoured supervised medical use.[@ghiabi2018]
    sources:
      - cgh
      - ghiabi2018
