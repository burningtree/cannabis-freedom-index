segments:
  possession:
    text: >-
      Under the Anti-Narcotics Law, possessing a small quantity of cannabis or hashish — roughly
      under 50 g — is punished with a fine and up to 50 lashes rather than prison. Penalties climb
      steeply with quantity, to long imprisonment.
    sources:
      - lc
      - wiki
  cultivation:
    text: >-
      Cultivating cannabis for drug production is prohibited, with fines and flogging that escalate
      on repeat offences.
    sources:
      - wiki
      - lc
  enforcement:
    text: >-
      Corporal punishment for small amounts and the death penalty for large ones. A 2017 amendment
      raised the capital threshold for hashish and opium from 5 kg to 50 kg and limited it mainly to
      armed or organised trafficking, though drug executions have since risen again.
    sources:
      - ihr
      - lc
  sharing:
    text: Supply is trafficking, with flogging, prison and at the top end execution.
    sources:
      - lc
      - ihr
  consumption:
    text: >-
      Use is an offence, but dependent users who enter treatment are exempt from punishment. Hashish
      use is common and, in private, often overlooked.
    sources:
      - wiki
  access:
    text: None.
    sources:
      - wiki
