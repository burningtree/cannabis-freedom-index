  cultivation:
    text: >-
      Article 2 punishes growing poppy, coca or cannabis only when it is done to produce
      narcotics.[@anl] The crop is destroyed and the fine rises with each conviction: 330 to 825
      million rials the first time, 330 million to 3.5 billion and 30 to 70 lashes the second, 330
      million to 3.3 billion, 1 to 70 lashes and two to five years the third, and death the
      fourth.[@anl] A landowner or tenant who orders the crop gets the same punishment as the
      grower.[@anl] The 2017 amendment requires an aggravating factor before a death
      sentence.[@ecpm] Growing cannabis without intent to produce drugs is not a crime, and since
      October 2026 industrial hemp may be grown under permit.[@hemp]
    sources:
      - anl
      - ecpm
      - hemp
    currency: IRR
    penalties:
