  enforcement:
    text: >-
      The law is enforced most heavily at the borders and against traffickers. In the Iranian year
      1403, which ended in March 2025, the anti-narcotics police reported 570,232 people arrested,
      including 375,438 addicts and 194,794 traffickers or distributors, and 372 tonnes of drugs
      seized; the figures cover all drugs and give no cannabis breakdown.[@irna] Fieldwork in Tehran
      found cannabis use itself rarely prosecuted, with police attention concentrated on heroin,
      methamphetamine and alcohol.[@cgh] Drug executions rose from 503 in 2024 to 795 in 2025, 48.5%
      of all executions recorded that year.[@ecpm] The law still provides for flogging and death, so
      the score stays at the floor.[@anl]
    sources:
      - irna
      - cgh
      - ecpm
      - anl
  sharing:
    text: >-
      Article 4 covers importing, exporting, producing, distributing, dealing in or selling bhang,
      hashish and the other drugs on its list.[@anl] Up to 50 g brings a fine of up to 200 million
      rials and up to 50 lashes; 50 to 500 g a fine of 200 to 500 million rials, 20 to 74 lashes and
      up to three years if the court thinks prison necessary; 500 g to 5 kg a fine of 500 million to
      2 billion rials, 50 to 74 lashes and three to fifteen years.[@anl] The older text prescribed
      death above 5 kg, or life for a qualifying first offence involving no distribution and at most
      20 kg.[@anl] Since 2017, death requires an Article 45 condition, including more than 50 kg for
      these Article 4 offences; without one, former death becomes prison up to thirty years and
      former life becomes fifteen to twenty-five years.[@reform2017,penal19] The law has no separate
      offence for giving cannabis away; distribution falls under the same Article 4 ladder.[@anl]
    sources:
      - anl
      - reform2017
      - penal19
