summary: >-
  Possession is punished with fines and lashes, and trafficking more than 5 kg of cannabis can carry
  death; 795 people were executed for drug offences in 2025. A 2017 amendment narrowed the capital
  threshold but did not stop the rise. Since October 2026 industrial hemp may be grown under permit,
  while medical cannabis still has no patient route.
