segments:
  possession:
    text: >-
      Article 5 of the Anti-Narcotics Law grades keeping, hiding or carrying bhang, hashish and the
      other drugs on its lighter list by weight.[@anl] Up to 50 g brings a fine of up to 165 million
      rials and up to 50 lashes, with no prison; 50 to 500 g a fine of 100 to 300 million rials and
      10 to 74 lashes; 500 g to 5 kg two to five years, a fine of 264 million to 1 billion rials and
      40 to 74 lashes; and 5 to 20 kg five to ten years, a fine of 330 million to 1 billion rials
      and 50 to 74 lashes.[@anl] The older text adds confiscation on a second conviction at 5 kg or
      more and a capital penalty on a third, now subject to the 2017 conditions.[@anl,reform2017]
      Above 20 kg the older law refers to Article 4 penalties and adds a per-kilogram fine; above
      100 kg it formerly imposed life imprisonment.[@anl] The June 2024 cabinet decree raised these
      cash fines roughly fiftyfold; the figures here are the current amounts.[@fines24] Since 2017,
      a former death sentence becomes first-degree prison up to thirty years without a qualifying
      condition, and former life becomes second-degree prison, fifteen to twenty-five
      years.[@reform2017,penal19] Article 45(A–C) covers weapons, leadership or financing, using
      children or mentally incompetent people, and specified prior convictions; its separate
      over-50-kg cannabis condition expressly concerns Article 4 offences.[@reform2017]
    sources:
      - anl
      - reform2017
      - penal19
      - fines24
