name: Iran
region: Asia
iso_numeric: 364
recreational: death
medical: none
updated: 2026-10-13
summary: Possession is punished with fines and lashes; large-scale trafficking can carry the death penalty.
scores:
  possession: 1
  cultivation: 1
  enforcement: 0
  sharing: 0
  consumption: 1
  access: 0
segments:
  possession:
    text: >-
      Article 5 of the Anti-Narcotics Law grades buying, keeping, hiding or carrying bhang,
      hashish and the other drugs of its lighter list by weight. Up to 50 g brings a fine and up
      to 50 lashes, with no prison; 50 to 500 g a larger fine and 10 to 74 lashes; prison begins
      above 500 g, with two to five years for 500 g to 5 kg and five to ten years for 5 to 20
      kg. The tiers are those of the text as amended in the early 1990s; the fine amounts have
      since been raised and are not given here.
    sources:
      - anlfa
      - anl
      - lc
      - wiki
  cultivation:
    text: >-
      The law punishes growing cannabis only when it is done to produce narcotics, with fines and
      flogging that escalate on repeat offences; growing the plant as such is not an offence. A
      2021 study found cannabis grown across the countryside, mostly on a small scale for local
      demand, and websites selling seeds and growing equipment openly.
    sources:
      - anl
      - cgh
      - lc
  enforcement:
    text: >-
      Corporal punishment for small amounts and the death penalty for large ones. A 2017 amendment
      raised the capital threshold for hashish and opium from 5 kg to 50 kg and limited it mainly to
      armed or organised trafficking, though drug executions have since risen again. Practice
      towards users is far milder than the text: fieldwork published in 2021 found few police
      interventions over cannabis use, with arrests concentrated on heroin, methamphetamine and
      alcohol, and described the laxity as deliberate policy. The score follows the law, which
      still provides for flogging.
    sources:
      - ihr
      - lc
      - cgh
  sharing:
    text: >-
      Supply is trafficking under Article 4 of the Anti-Narcotics Law, which covers importing,
      producing, distributing and selling: up to 50 g brings a fine and up to 50 lashes, 50 to
      500 g a fine, 20 to 74 lashes and up to three years in prison where the court sees fit,
      and 500 g to 5 kg three to fifteen years; at the top end the penalty is execution.
    sources:
      - anlfa
      - anl
      - lc
      - ihr
  consumption:
    text: >-
      Use is an offence, but dependent users who enter treatment are exempt from punishment. Hashish
      use is common and, in private, often overlooked. A 2021 study calls toleration of cannabis
      use the norm, including in a few places known for it, such as the village of Qalat near
      Shiraz, where it is smoked in cafes.
    sources:
      - wiki
      - cgh
  access:
    text: >-
      None. The Anti-Narcotics Law authorises prohibited substances only exceptionally, for
      medical and industrial purposes with the permission of the Ministry of Health.
    sources:
      - anl
      - wiki
context:
  death_penalty:
    text: >-
      The death penalty applies to large quantities. A 2017 amendment raised the capital threshold
      for hashish and opium from 5 kg to 50 kg and limited it mainly to armed or organised
      trafficking, though drug executions have since risen again.
    sources:
      - ihr
      - lc
  production:
    text: None.
    sources:
      - wiki
  products:
    text: None.
    sources:
      - wiki
  medical:
    text: No medical cannabis programme.
    sources:
      - wiki
  consequences:
    text: A drug conviction is a criminal record, and flogging sentences are carried out.
    sources:
      - lc
  planting:
    seeds: grey
    seeds_trade: open
    clones: grey
    clones_trade: unclear
    text: >-
      The Anti-Narcotics Law punishes growing cannabis only when it is done "for the purpose
      of producing narcotic drugs" (Article 2). Article 3 punishes storing or carrying the
      seeds of the poppy and the flowering or fruiting tops of cannabis, and for cannabis
      requires proof of intent to produce narcotics; cannabis seed is not named. This is the
      text as amended in 1997; the 2010 and 2017 amendments were not read.
    sources:
      - anl
  black_market:
    text: >-
      The whole market is illegal and, by a 2021 study based on fieldwork, easy to reach: officials
      said the time needed to obtain hashish or cannabis anywhere in Tehran had fallen from
      fifteen minutes to seven. Hashish is mass-produced in Afghanistan and Pakistan and comes
      in along the opiate routes. Herbal cannabis is widely grown in Iran, mostly on a small
      scale, and sold as gol ("flower"), a high-THC product that took over the market from about
      2000. Dealers advertise through Instagram stories and deliver to the door. Dealers and
      users in Tehran put gol at about 50,000 tuman a gram, roughly 0.80 US dollars, with
      imported hashish cheaper.
    sources:
      - cgh
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited, and the law provides for the death
      penalty for the most serious drug offences.
    sources:
      - wiki
      - lc
      - ihr
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. Under the Anti-Narcotics Law, possessing
      a small quantity of cannabis or hashish, roughly under 50 g, is punished with a fine and
      up to 50 lashes rather than prison; penalties climb steeply with quantity, to long
      imprisonment.
    sources:
      - lc
      - wiki
