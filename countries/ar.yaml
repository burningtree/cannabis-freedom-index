segments:
  possession:
    text: >-
      Possession is still a crime in the drug law, but the Supreme Court's 2009 Arriola ruling made
      it unconstitutional to punish an adult for a small amount for personal use in private. No gram
      threshold was ever set, so judges decide case by case. People registered in the medical
      registry REPROCANN may carry up to 40 g of flower.
    sources:
      - lc
      - res
  cultivation:
    text: >-
      Legal only through REPROCANN: with a doctor's indication, a registered person may grow up to
      nine flowering plants, or have a designated grower or association do it. 2025 rules tightened
      registration and oversight. Unregistered growing is a crime, though courts sometimes apply
      Arriola to a few plants.
    sources:
      - res
      - sechat
  enforcement:
    text: >-
      Small private possession is usually dismissed, but arrests still occur and outcomes depend on
      the judge. Trafficking and unregistered cultivation carry four to fifteen years on paper.
    sources:
      - lc
  sharing:
    text: >-
      No protection. Supplying cannabis free of charge is a specific offence under the drug law,
      with a lighter sentence when occasional and clearly for personal use.
    sources:
      - lc
  consumption:
    text: >-
      Private use by adults is constitutionally protected. Use in public is not, and can lead to
      arrest and a court-ordered treatment or education measure.
    sources:
      - lc
  access:
    text: >-
      No legal adult-use sales. Registered patients can obtain cannabis from authorised associations
      or growers; pharmacies sell a small number of approved products.
    sources:
      - res
      - sechat
context:
  production:
    text: >-
      A 2022 law created a framework and agency for medical cannabis and industrial hemp production,
      with licences issued slowly. No adult-use production.
    sources:
      - sechat
  products:
    text: >-
      Home-grown flower and oils for registered patients; a few pharmacy products. Nothing for
      general sale.
    sources:
      - sechat
      - res
  medical:
    text: >-
      The medical route is the main legal path: any doctor can issue the indication needed for
      REPROCANN, with no closed list of conditions, though the 2025 rules added requirements for
      prescribers and periodic renewal.
    sources:
      - res
      - sechat
  consequences:
    text: >-
      Cases dismissed under Arriola leave no conviction. Registration in REPROCANN places patients
      in a government database.
    sources:
      - lc
      - res
  planting:
    seeds: licensed
    seeds_trade: regulated
    clones: licensed
    clones_trade: regulated
    text: >-
      Law 23.737 punishes anyone who, without authorisation, sows or grows plants or keeps
      seeds to produce narcotics, or trades in such plants or their seeds, with four to
      fifteen years in prison. Where the small amount sown shows it is for personal use, the
      penalty falls to one month to two years. Seeds and plants are therefore lawful only for
      people and bodies holding an authorisation, such as those in the medical registry.
    sources:
      - ley23737
