name: Argentina
region: South America
iso_numeric: 32
recreational: decriminalised
medical: legal
updated: '2026-10-27'
summary: >-
  The Supreme Court's Arriola ruling (2009) protects private personal use. The REPROCANN registry
  lets patients grow their own or use a designated grower.
scores:
  possession: 3
  cultivation: 3
  enforcement: 3
  sharing: 1
  consumption: 3
  access: 1
segments:
  possession:
    text: >-
      Possession is still a crime in the drug law, but the Supreme Court's 2009 Arriola ruling made
      it unconstitutional to punish an adult for a small amount for personal use in private. No gram
      threshold was ever set, so judges decide case by case. People registered in the medical
      registry REPROCANN may carry up to 40 g of flower.
    sources:
      - lc
      - res
  cultivation:
    text: >-
      Legal only through REPROCANN: with a doctor's indication, a registered person may grow up to
      nine flowering plants, or have a designated grower or association do it. 2025 rules tightened
      registration and oversight. Unregistered growing is a crime, though courts sometimes apply
      Arriola to a few plants.
    sources:
      - res
      - sechat
  enforcement:
    text: >-
      Small private possession is usually dismissed, but arrests still occur and outcomes depend on
      the judge. Trafficking and unregistered cultivation carry four to fifteen years on paper.
    sources:
      - lc
  sharing:
    text: >-
      No protection. Supplying cannabis free of charge is a specific offence under the drug law,
      with a lighter sentence when occasional and clearly for personal use.
    sources:
      - lc
  consumption:
    text: >-
      Private use by adults is constitutionally protected. Use in public is not, and can lead to
      arrest and a court-ordered treatment or education measure.
    sources:
      - lc
  access:
    text: >-
      No legal adult-use sales. Registered patients can obtain cannabis from authorised associations
      or growers; pharmacies sell a small number of approved products.
    sources:
      - res
      - sechat
context:
  production:
    status: medical
    text: >-
      A 2022 law created a framework and agency for medical cannabis and industrial hemp production,
      with licences issued slowly.[@sechat] In 2026 the agency published a licence for medicinal seeds,
      seedlings and cuttings, and a separate set of horticultural-hemp licences at up to 1% total
      THC.[@res41, res69] The hemp licences take effect 30 administrative working days after their
      3 September publication.[@res69] No adult-use production.[@sechat]
    sources:
      - sechat
      - res41
      - res69
  products:
    text: >-
      Home-grown flower and oils for registered patients; a few pharmacy products. Nothing for
      general sale.
    sources:
      - sechat
      - res
  medical:
    text: >-
      The medical route is the main legal path. A REPROCANN physician must be registered with REFEPS,
      have accredited academic training in medical cannabis, register a digital signature with the
      health ministry and submit bilateral informed consent. These prescriber requirements were
      tightened in May 2025; the programme sets no closed diagnosis list.[@reprocann_current,reprocann_faq]
    sources:
      - reprocann_current
      - reprocann_faq
  consequences:
    text: >-
      Cases dismissed under Arriola leave no conviction. Registration in REPROCANN places patients
      in a government database.
    sources:
      - lc
      - res
  planting:
    seeds: licensed
    seeds_trade: regulated
    clones: licensed
    clones_trade: regulated
    text: >-
      Law 23.737 punishes anyone who, without authorisation, sows or grows plants or keeps
      seeds to produce narcotics, or trades in such plants or their seeds, with four to
      fifteen years in prison.[@ley23737] Where the small amount sown shows it is for personal use, the
      penalty falls to one month to two years.[@ley23737] Seeds and plants are therefore lawful only for
      people and bodies holding an authorisation, such as those in the medical registry.[@ley23737] Resolution
      41 of 2026 adds a licence for medicinal seeds, seedlings and cuttings, open to applicants
      until 1 March 2027.[@res41] Selling flowers stays outside that licence.[@res41]
    sources:
      - ley23737
      - res41
  clubs:
    status: regulated
    text: >-
      Clubs work under the medical cannabis register REPROCANN, as civil associations or
      foundations growing for registered patients; there is no recreational club model.
      Resolution 1780/2025 of the health ministry tightened the rules: an association must be
      legally constituted with the programme's aims in its statutes, file a list of its users
      with their consent, appoint a medical director and a technical officer, report lab tests
      for each batch and declare its plants and patients every six months, and may grow at no
      more than three addresses. Its certificate lasts one year, against three for individual
      growers. The ministry justified the change by abuse of the earlier rules, mostly by
      people using the solidarity-grower permit to sell.
    sources:
      - res1780
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. Possession is still a crime in the drug
      law, though the Supreme Court ruled in 2009 that an adult cannot be punished for a small
      amount for personal use in private; no gram threshold was set, so judges decide case by
      case.
    sources:
      - lc
      - res
      - sechat
  driving:
    status: consumption
    text: >-
      National traffic law prohibits driving after consuming narcotics or medicines that reduce
      driving ability. Article 48(a) specifies no numerical THC cutoff; its separate zero-blood-alcohol
      rule does not establish an offence based on any detectable residual THC.[@ley24449,ley27714]
      Article 73 requires authorised intoxication tests, with refusal itself an offence and a
      presumption of breaching article 48(a). Testing can provide evidence of consumption; it is
      not itself a separate THC concentration limit.[@ley24449]
      The implementing rules also address drug effects on safe driving and testing methods.[@trafficregs]
      This is a national baseline: the law applies in federal jurisdiction, with provincial and
      municipal adoption and local procedures requiring separate checks.[@ley24449]
    sources:
      - ley24449
      - ley27714
      - trafficregs
  black_market:
    text: >-
      Figures reported by the government to the UN drugs office record 122,964 kg of
      herbal cannabis seized in 2024, against 149,434 kg in 2023, and 1.3 kg of cannabis
      resin seized in 2024, against 18.5 kg in 2023. The UN publishes them as kilogram
      equivalents, and countries count seizures differently, so the figures are not
      comparable across borders.
    sources:
      - unodc_szr
  arrests:
    text: >-
      The last national breakdown found dates from 2015: the federal prosecutors'
      narcotics unit Procunar counted 22,020 cases opened in the federal courts under the
      drug law that year, of which 8,125, or 36.9 per cent, were for possession for
      personal use, the single most common offence; with simple possession the share
      reached about half.
    sources:
      - chequeado16
