name: Netherlands
region: Europe
iso_numeric: 528
recreational: partial
medical: legal
updated: '2026-10-27'
summary: >-
  Formally illegal but tolerated: coffeeshops sell up to 5 g per person and five plants are usually
  only confiscated. A regulated supply-chain experiment now covers ten municipalities.
# the search-result description, where the generated one runs long (src/lib/seo.js)
seo_description: >-
  Cannabis is illegal in the Netherlands but tolerated: up to 5 g is not prosecuted, and
  coffeeshops sell up to 5 g, in some towns only to residents. Medical cannabis is legal.
scores:
  possession: 3
  cultivation: 2
  enforcement: 6
  sharing: 2
  consumption: 5
  access: 5
# The quick answers the scores would get wrong (src/lib/answers.js): possession and sale are
# crimes that are tolerated, and the shops are coffeeshops, not clubs or state outlets.
answers:
  carry:
    answer: limited
    text: Illegal, but up to 5 g is not prosecuted; police may still seize it
  buy:
    answer: limited
    text: In tolerated coffeeshops, up to 5 g; some towns sell to residents only, and many have no coffeeshop
segments:
  possession:
    text: >-
      Cannabis is formally illegal under the Opium Act. Under the toleration policy the Public
      Prosecution Service does not prosecute possession of up to 5 g of marijuana or hash, though
      police may still confiscate it.[@gov] Larger amounts can be prosecuted: up to 30 g is a minor
      offence with at most a month's detention or a €5,500 fine, and more than 30 g is a crime
      with up to two years in prison or a €110,000 fine.[@ow11,sr23]
    sources:
      - gov
      - ow11
      - sr23
    currency: EUR
    penalties:
      - upto: 5 g
        treatment: tolerated
        note: Not prosecuted; police may seize it
      - over: 5 g
        upto: 30 g
        treatment: criminal
        term: Minor offence (overtreding)
        prison: 1 month
        fine: 5500
      - over: 30 g
        treatment: criminal
        term: Crime (misdrijf)
        prison: 2 years
        fine: 110000
  cultivation:
    text: >-
      Not legal. Up to five plants for personal use are normally not prosecuted, but police will
      seize them. More than five plants is prosecuted, growers face back-charges for electricity,
      and tenants risk eviction.[@gov] Growing is a crime with up to two years in prison, or six
      years when done as a business.[@ow11,sr23]
    sources:
      - gov
      - ow11
      - sr23
    currency: EUR
    penalties:
      - upto: 5 plants
        treatment: tolerated
        note: Not prosecuted; police seize the plants
      - over: 5 plants
        treatment: criminal
        term: Crime (misdrijf)
        prison: 2 years
        fine: 110000
      - label: Growing as a business
        treatment: criminal
        term: Crime (misdrijf)
        prison: 6 years
        fine: 110000
  enforcement:
    text: >-
      Users are effectively left alone, with confiscation the worst outcome for small amounts.
      Commercial growing and dealing outside coffeeshops are prosecuted and carry prison.
    sources:
      - gov
      - exp
  sharing:
    text: >-
      Supplying cannabis outside a coffeeshop is an offence. Passing a joint is not pursued in
      practice, but there is no legal protection for giving cannabis to another adult.
    sources:
      - gov
  consumption:
    text: >-
      Consumption is permitted inside coffeeshops and in private. Many municipalities ban cannabis
      use in streets, around schools or in city centres through local by-laws, so public use depends
      on where you are.
    sources:
      - gov
  access:
    text: >-
      Coffeeshops sell openly to adults 18+, up to 5 g per person per transaction, under strict
      criteria: no advertising, no hard drugs, no nuisance, no minors. A residents-only rule exists
      in law and is enforced by some municipalities, mainly in the south. Many towns have no
      coffeeshop.
    sources:
      - gov
context:
  recreational:
    text: >-
      Most adults who buy cannabis legally do so in a coffeeshop. At the end of 2024 there were
      563, in 103 municipalities; most towns have none.[@kb24] About two-thirds are places where
      customers may also smoke; a quarter only sell to take away, a share that grew after smoking
      rooms were banned in July 2022.[@kb24] Shops sell weed and hashish, and many sell space cake
      and other edibles.[@gov,exp] In early 2025 a gram of the most popular Dutch-grown weed
      cost about €11 and held about 16% THC on average; imported hashish cost about €10.[@thc25]
      Many people also buy outside the shops, mostly from delivery services and dealers they reach
      by phone, because it is cheaper and they can buy more at once.[@tri26]
    sources:
      - kb24
      - gov
      - exp
      - thc25
      - tri26
  medical:
    text: >-
      Doctors have been able to prescribe medicinal cannabis since 2003. Pharmacies dispense it as
      dried flower from the government's [Office of Medicinal Cannabis](https://www.cannabisbureau.nl/), which holds a legal
      monopoly on buying and selling it.[@bmc,mc26] Health insurers usually do not pay for
      it.[@bmc] The office's [contract with its only Dutch grower ended on 1 January
      2026](/history/netherlands-medical-grower-contract-ends-2026/). It is
      supplying pharmacies from stock for now, will switch to imported cannabis in the course of
      2027, and will stop exporting to patients abroad at the end of 2026. The government plans a
      law ending the monopoly, so that companies can supply pharmacies directly, in mid-2028.[@mc26]
    sources:
      - bmc
      - mc26
  hemp:
    status: standard
    text: >-
      Farmers may grow hemp from certified seed of approved EU varieties with no more than 0.3%
      THC; inspectors sample the field shortly before harvest, and harvesting needs written
      permission.[@rvo26] Seeds are outside the Opium Act, so they are sold openly.[@opiumwet]
      CBD itself is not a listed drug, but a law firm's guide reads the Act's definitions of hemp
      and hemp oil as covering CBD extracted from the plant.[@blen23] HHC, a
      semi-synthetic cannabinoid sold in the gaps of the law, was put on List I, the hard-drugs
      list, by a [decree published in January 2026](/history/netherlands-hhc-banned-2026/).[@stb26]
    sources:
      - rvo26
      - opiumwet
      - blen23
      - stb26
  production:
    status: pilot
    text: >-
      For decades coffeeshops could sell cannabis but nobody could legally grow it for them: the
      'back door' problem.[@gov] An experiment changes this in ten municipalities: Almere, Arnhem,
      Breda, Groningen, Heerlen, Maastricht, Nijmegen, Tilburg, Voorne aan Zee and Zaanstad. Up to
      ten licensed growers supply them, tracked from plant to sale; [since 7 April
      2025](/history/netherlands-regulated-supply-only-2025/) the shops there are intended to sell
      only regulated supply.[@tri26,exp] The growers report heavy start-up costs, and hashish was
      short at first.[@tri26] Medicinal cannabis was grown by one company under contract to the
      state until 2026.[@mc26] Everywhere else, growing for sale is a crime.[@gov]
    sources:
      - gov
      - exp
      - tri26
      - mc26
  culture:
    text: >-
      For many people abroad the Netherlands means the [coffeeshop](/culture/traditions/the-coffeeshop/),
      a café that sells cannabis over the counter.[@wcs] It grew out of an idea of the early 1970s:
      a commission chaired by the criminal lawyer [Louk Hulsman](/culture/people/louk-hulsman/)
      argued that pushing cannabis users into the same criminal world as heroin users exposed them
      to harder drugs, and recommended taking cannabis use out of criminal law.[@cedro] Amsterdam
      became a meeting place for growers and breeders: the [Hash, Marihuana & Hemp
      Museum](/history/netherlands-hemp-museum-1985/) opened in 1985, and the [Cannabis
      Cup](/culture/traditions/the-cannabis-cup/), a contest where judges smoke and score the
      year's cannabis, began there in 1988.[@whm,cupsite] Near the harbour, the artists' village of
      [Ruigoord](/culture/traditions/ruigoord/) has kept a festival culture with its own
      cannabis rules since the 1970s.[@onh] The everyday word is [wiet](/culture/language/wiet/),
      borrowed from English weed.[@wikt] Tolerance is not the same as approval: in a 2025 Pew
      survey 45% of Dutch adults called using marijuana morally acceptable, 32% unacceptable and
      20% not a moral question at all.[@pew26]
    sources:
      - wcs
      - cedro
      - whm
      - cupsite
      - onh
      - wikt
      - pew26
  research:
    status: licensed
    text: >-
      Dutch researchers publish over a hundred papers on cannabis a year, 140 in 2025, and 21
      clinical trials with a cannabis or cannabinoid treatment had been registered in the country
      by October 2026.[@openalex,ctgov] [Maastricht
      University](https://www.maastrichtuniversity.nl/) has studied cannabis and driving on real
      roads since the 1990s. Its 2020 trial, published in JAMA, had 26 users drive about 100 km at
      a time in a test car after inhaling THC, CBD or a placebo: THC made drivers weave in their
      lane about as much as a blood alcohol level above 0.05%, for up to about four hours, while
      CBD alone had little or no effect.[@um20] Since the late 1990s the [Trimbos
      Institute](https://www.trimbos.nl/) has tested the strength of cannabis bought anonymously
      in coffeeshops every year.[@thc25] Researchers get their cannabis through the Office of
      Medicinal Cannabis, which is also the only legal supplier to pharmacies.[@mc26] The [first
      supply-trial follow-up, released in September
      2026](/history/netherlands-coffeeshop-trial-follow-up-2026/), found more product choice and
      mostly positive early experiences, but no clear differences from comparison municipalities
      in use, health, safety or public order. Further measurements are needed to identify
      effects.[@followup2026]
    sources:
      - openalex
      - ctgov
      - um20
      - thc25
      - mc26
      - followup2026
  spotlights:
    - title: The back door
      text: >-
        A coffeeshop may sell cannabis and keep up to 500 grams in stock, but for decades nobody
        could legally grow it or deliver it to the shop.[@gov,tri26] Owners had to buy from criminal
        growers, which is why the shop front is tolerated while the 'back door' stays a crime. The
        government's answer is an experiment: in ten towns, licensed growers deliver tested
        cannabis tracked from plant to sale, and the shops may hold a week's stock instead of 500
        grams.[@tri26] The first evaluation, in 2026, found more choice and cheaper weed, and no
        clear change in how much people use.[@tri26]
      sources:
        - gov
        - tri26
    - title: A different rule in every town
      text: >-
        Toleration is national, but the details are local. Only 103 municipalities have a
        coffeeshop, and 102 of them cap how many there may be.[@kb24] 81 write the residents-only
        rule into their policy; how strictly it is enforced varies, mostly in the south and along
        the borders.[@kb24,gov] Some border towns are watching for fewer German customers since
        Germany legalised possession and home growing in April 2024.[@kb24] Prices differ too: in
        2025 a gram of the most popular weed cost about €13 in Amsterdam and under €11
        elsewhere.[@thc25]
      sources:
        - kb24
        - gov
        - thc25
    - title: The end of the smoking room
      text: >-
        Since July 2022 coffeeshops may no longer have a separate smoking room. Officials in
        municipalities say the shops have become more like take-away counters, and that the
        coffeeshop's social role, a safe and supervised place to use cannabis, is under pressure.
        Some fear people now smoke in the street instead.[@kb24] At the end of 2024 a quarter of
        all coffeeshops sold only to take away.[@kb24]
      sources:
        - kb24
  consequences:
    text: >-
      Tolerated possession leaves no criminal record. Drivers are subject to a per-se THC blood
      limit, and home growers can lose their tenancy even when not prosecuted.
    sources:
      - gov
  planting:
    seeds: legal
    seeds_trade: open
    clones: grey
    clones_trade: banned
    text: >-
      The Opium Act's list of drugs covers every part of the hemp plant except the seeds, so
      seeds are sold openly. Cuttings are plants and fall under the growing ban, with the same
      practice of not prosecuting up to five plants. Supplying goods one knows are meant for
      professional cultivation is a separate offence under article 11a.
    sources:
      - opiumwet
  clubs:
    status: underground
    text: >-
      The toleration policy covers coffeeshops only; growing remains illegal, so a members'
      growing club has no footing. A handful were founded from 2014. The prosecution service
      told Amsterdam's Tree of Life in 2015 that its growing and sharing among members was
      punishable, though it chose not to prosecute actively. Utrecht backed two clubs and
      asked for an Opium Act exemption, which the health ministry refused in 2014 because the
      clubs served no scientific or medical purpose; by 2016 nothing had been planted there.
      The largest, the Frisian foundation Suver Nuver, posted home-made cannabis oil to
      thousands of members; in November 2021 the Overijssel court found it and its director
      guilty under the Opium Act and the Medicines Act but imposed no penalty, saying the
      choice was for lawmakers. No later national picture of clubs was found.
    sources:
      - coov
      - cnn16
      - cnn14
      - rb21
  black_market:
    text: >-
      Coffeeshop sales are tolerated but, outside the supply experiment, the cannabis they
      sell is grown illegally. Police dismantled 895 growing sites in 2024, the first year
      below a thousand in a long time; in 2017 it was more than 4,600. The National Police put
      the fall down mainly to lack of capacity and lower priority rather than less growing,
      and note that drug networks increasingly bring plants in from abroad, for instance from
      Spain.
    sources:
      - ob25
  visitors:
    status: residents
    text: >-
      On paper coffeeshops are for [residents only](/history/netherlands-residents-only-2012/): since 1 January 2013 the national rules say
      only people aged 18 or over who are registered in a Dutch municipality may enter and
      buy, and owners are meant to check an identity document or residence permit. Whether the
      rule is enforced differs from one municipality to the next, which is why visitors can
      still buy in some cities and not in others.
    sources:
      - gov
  driving:
    status: limit
    text: >-
      The Netherlands has had fixed limits since a 2016 decree: 3 nanograms of THC per
      millilitre of blood, falling to 1 when cannabis is combined with alcohol, alongside the
      older offence of impaired driving. Police may stop and test at random; blood is taken at
      a hospital or police station. The maximum penalties are a fine of 6,700 euros, three
      months in prison and a ban of up to five years, rising steeply where there is injury or
      death.
    sources:
      - euda_dd
  arrests:
    text: >-
      The EU drugs agency's statistical bulletin records 5,315 cannabis-related drug law
      offences in the Netherlands in 2024, against 5,210 in 2023. The number has halved from
      11,658 in 2016; no separate count for use is reported.
      Countries count these differently (offences or offenders, criminal or administrative),
      so the figure is not comparable across borders.
    sources:
      - euda_dlo
