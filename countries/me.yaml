name: Montenegro
region: Europe
iso_numeric: 499
recreational: decriminalised
medical: none
updated: 2026-10-12
summary: >-
  Holding a drug for personal use is a misdemeanour with a fine of 100 to 2,000 euros; selling,
  producing and giving drugs to others are crimes with prison.
scores:
  possession: 3
  cultivation: 1
  enforcement: 3
  sharing: 1
  consumption: 1
  access: 0
segments:
  possession:
    text: >-
      Article 45 of the Law on Prevention of Drug Abuse (Official Gazette 28/11 and 35/13) bans
      using, producing, trading and holding drugs for personal use. Article 52 makes holding a drug
      for personal use contrary to the law a misdemeanour for an individual, with a fine of 100 to
      2,000 euros. The Criminal Code (Article 300) makes it a crime, with 2 to 10 years, to sell,
      offer for sale, or buy or possess for the purpose of selling; simple possession for own use
      is not listed there.
    sources:
      - law
      - cc
  cultivation:
    text: >-
      Growing hemp or poppy without a permit is a misdemeanour with a fine of 100 to 2,000 euros
      for an individual (Article 52), and permits are given only for food and industrial purposes
      (Article 18). Unlawfully producing narcotic drugs or plants containing them is a crime with 2
      to 10 years (Criminal Code Article 300). The sources read do not say which applies to a few
      plants grown for personal use.
    sources:
      - law
      - cc
  enforcement:
    text: >-
      For personal use the statute sets a fine only. No source was found on how often it is applied or
      whether an unpaid fine becomes custody.
    sources:
      - law
  sharing:
    text: >-
      Article 301 of the Criminal Code makes it a crime, with 6 months to 5 years, to give narcotic
      drugs to another person for their use or otherwise facilitate their use; 2 to 10 years in
      aggravated cases such as against a minor. Selling or giving for further sale is 2 to 10
      years (Article 300).
    sources:
      - cc
  consumption:
    text: >-
      Article 45 prohibits using drugs. The only sanction found for a user is the Article 52 fine
      for holding a drug for personal use.
    sources:
      - law
  access:
    text: >-
      None for personal use. Hemp and poppy may be grown only under permit for food and industrial
      purposes (Article 18); the law allows drugs for medical use only under its conditions.
    sources:
      - law
context:
  production:
    text: None.
    sources:
