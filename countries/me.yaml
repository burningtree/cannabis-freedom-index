  consequences:
    text: A conviction is a criminal record; foreigners can be expelled.
    sources:
      - cr
  planting:
    seeds: licensed
    seeds_trade: regulated
    clones: licensed
    clones_trade: regulated
    text: >-
      The Law on Prevention of Drug Abuse counts acquiring and possessing seed, sowing and
      planting as part of growing plants for drugs. Hemp may be grown only for food and
      industrial purposes, by people or firms holding a growing permit and a contract to sell
      the whole crop to a registered buyer. The text read is the 2011 law as amended in 2013.
    sources:
      - zszd
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited.
    sources:
      - law
      - cc
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. British travel advice says illegal
      drugs, including cannabis, carry severe penalties and tells travellers to expect a long
      jail sentence and heavy fines for possessing, using or smuggling them, also when only
      changing planes. Airport scanners are also used on the baggage of passengers in transit.
    sources:
      - law
      - fcdo
