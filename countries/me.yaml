  consequences:
    text: The retained sources do not establish collateral consequences beyond the penalties described above.
    sources: []
  planting:
    seeds: licensed
    seeds_trade: regulated
    clones: licensed
    clones_trade: regulated
    text: >-
      The Law on Prevention of Drug Abuse counts acquiring and possessing seed, sowing and
      planting as part of growing plants for drugs. Hemp may be grown only for food and
      industrial purposes, by people or firms holding a growing permit and a contract to sell
      the whole crop to a registered buyer. The text read is the 2011 law as amended in 2013.
    sources:
      - zszd
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited.
    sources:
      - law
      - cc
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. British travel advice says illegal
      drugs, including cannabis, carry severe penalties and tells travellers to expect a long
      jail sentence and heavy fines for possessing, using or smuggling them, also when only
      changing planes. Airport scanners are also used on the baggage of passengers in transit.
    sources:
      - law
      - fcdo
  driving:
    status: zero
    text: >-
      Road Safety Law article 182 prohibits driving under narcotic or other
      psychoactive influence and deems that influence established by a test detecting
      the substance in the body. It does not require a separate impaired-control
      finding or give a numerical THC allowance. The consolidation includes Gazette
      111/2026, effective 7 August 2026. Article 317a now sets 15–60 days' imprisonment
      for drug driving and specified testing refusals, plus three penalty points and
      an ordinary four-to-six-month driving ban. Immediate danger or an accident
      adds two points and fixes the ban at six months. Article 296 provides for arrest
      for drug influence or refusal. Articles 291–292 authorise drug testing and
      medical examination; disputed positive results lead to blood and urine analysis,
      subject to health safeguards. A medically harmful examination or sample has a
      statutory exception in the refusal provision. This does not establish a general
      prescription defence. Current drug penalties must not be replaced with the
      separate alcohol fine ranges.
    sources:
      - traffic2026
      - trafficcommencement
