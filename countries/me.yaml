name: Montenegro
region: Europe
iso_numeric: 499
recreational: decriminalised
medical: none
updated: '2026-10-29'
summary: >-
  Personal drug possession carries a €100–€2,000 misdemeanour fine. Unlawful cannabis
  production, sale and giving cannabis to another person can bring prison; low-THC food and
  industrial hemp has a permit route.
scores:
  possession: 3
  cultivation: 1
  enforcement: 3
  sharing: 1
  consumption: 1
  access: 0
segments:
  possession:
    text: >-
      Holding drugs for personal use contrary to the drug law carries a €100–€2,000 misdemeanour
      fine.[@law] The Criminal Code sets two to ten years in prison for selling, offering for
      sale, or buying, holding or transporting drugs for sale.[@cc] [Yugoslavia's code covered
      Montenegro from 1930.](/history/montenegro-yugoslav-code-1930/) [The current drug law
      dates to 2011.](/history/montenegro-drug-abuse-law-2011/)
    sources:
      - law
      - cc
    currency: EUR
    penalties:
      - label: Personal possession (misdemeanour)
        treatment: civil
        term: Holding drugs for personal use
        fine: 2000
        note: Misdemeanour
        fine_min: 100
  cultivation:
    text: >-
      Food and industrial hemp requires a cultivation permit and a contract for the whole crop;
      a scientific legal entity can grow under a separate land-registration exception.[@law] The
      permit rules cover hemp with at most 0.2% THC in dry plant material.[@hemp] Breaching the
      permit-and-contract requirement carries a €100–€2,000 fine, while unlawful drug production
      carries two to ten years in prison.[@law,cc] [Hemp permits were introduced in
      2014.](/history/montenegro-hemp-permits-2014/)
    sources:
      - law
      - hemp
      - cc
    currency: EUR
    penalties:
      - label: Breach of hemp permit-and-contract rules
        treatment: civil
        term: Unlicensed hemp cultivation
        fine: 2000
        note: Misdemeanour
        fine_min: 100
      - label: Unlawful drug production
        treatment: criminal
        term: Unlawful production of drugs
        prison_min: 2 years
        prison: 10 years
        note: Two to ten years in prison
  enforcement:
    text: >-
      Personal possession carries a misdemeanour fine under the drug law.[@law] Police reported
      about 13,100 cannabis plants and two arrests at Trnovo in August 2025, followed by a third
      arrest in October and complaints against two further suspects in March
      2026.[@raid,follow25,follow26] [Police found 13,100 plants at Trnovo in
      2025.](/history/montenegro-operation-trnovo-2025/)
    sources:
      - law
      - raid
      - follow25
      - follow26
  sharing:
    text: >-
      Giving drugs to another person for consumption, encouraging use or providing premises for
      it carries six months to five years in prison; aggravated cases carry two to ten
      years.[@cc] Selling cannabis or holding it for sale carries two to ten years; organising a
      network of dealers or intermediaries carries three to fifteen years.[@cc] [Yugoslavia's
      code covered Montenegro from 1930.](/history/montenegro-yugoslav-code-1930/)
    sources:
      - cc
    penalties:
      - label: Giving for consumption or providing premises
        treatment: criminal
        term: Facilitating drug use
        prison_min: 6 months
        prison: 5 years
        note: Article 301(1)
      - label: Aggravated facilitation
        treatment: criminal
        term: Facilitating drug use
        prison_min: 2 years
        prison: 10 years
        note: >-
          Article 301(2): protected persons, multiple people, specified premises or abuse of
          professional position
      - label: Sale, holding or transport for sale
        treatment: criminal
        term: Unauthorised production, possession and supply
        prison_min: 2 years
        prison: 10 years
        note: Article 300(1)
      - label: Bringing into Montenegro for supply
        treatment: criminal
        term: Unauthorised import for supply
        prison_min: 2 years
        prison: 12 years
        note: 'Article 300(2): intent to commit the supply offence'
      - label: Organising a dealer network
        treatment: criminal
        term: Organised supply
        prison_min: 3 years
        prison: 15 years
        note: Article 300(3)
  consumption:
    text: >-
      The drug law prohibits unauthorised drug use and holding drugs for personal use. Its
      individual-penalty article expressly fines personal possession €100–€2,000.[@law] Giving
      drugs to another person or providing premises for consumption can bring prison under the
      Criminal Code.[@cc] [The current drug law dates to
      2011.](/history/montenegro-drug-abuse-law-2011/)
    sources:
      - law
      - cc
  access:
    text: >-
      Personal possession remains punishable, and selling cannabis carries a prison
      sentence.[@law,cc] Food and industrial hemp follows a separate cultivation-permit and
      whole-crop purchasing route; controlled medical and pharmaceutical production and trade
      require licences.[@law] [The current drug law dates to
      2011.](/history/montenegro-drug-abuse-law-2011/)
    sources:
      - law
      - cc
context:
  recreational:
    text: >-
      There is no legal recreational supply. Holding drugs for personal use brings a €100–
      €2,000 misdemeanour fine; selling, holding for sale, buying or transporting for sale
      brings two to ten years.[@law,cc] Giving drugs for consumption or providing premises
      brings six months to five years, or two to ten aggravated.[@cc]
    sources:
      - law
      - cc
  production:
    status: medical
    text: >-
      The drug law allows controlled medical and pharmaceutical production and trade by licensed
      legal entities. It also provides a permit route for food and industrial hemp and a
      registered-land exception for scientific institutions.[@law] [The current drug law dates
      to 2011.](/history/montenegro-drug-abuse-law-2011/) Unlawful drug production carries two
      to ten years in prison.[@cc]
    sources:
      - law
      - cc
  medical:
    text: >-
      The drug law provides licences for controlled medical and pharmaceutical activities and
      permits possession of a drug-containing medicine within the quantity prescribed by a
      doctor.[@law] Hemp preparations for medical or pharmaceutical purposes run through
      licensed legal entities and purchase contracts with growers.[@law] Liberal Party MP
      Andrija Popović proposed medical cannabis for serious illness in 2014.[@medical14] In
      2022, Legalizuj.me and patients renewed the campaign for medical access and broader
      reform.[@patient] [Medical cannabis was proposed in
      2014.](/history/montenegro-medical-proposal-2014/) [Patients renewed the campaign in
      2022.](/history/montenegro-cannabis-petition-2022/)
    sources:
      - law
      - medical14
      - patient
  consequences:
    text: >-
      Drugs found in unlawful possession are confiscated under the drug law, including in
      personal-possession cases.[@law] The Criminal Code requires confiscation and destruction
      of drugs and equipment under its production-and-supply offence.[@cc] A person convicted
      under that offence who reveals their supplier may be excused punishment.[@cc]
    sources:
      - law
      - cc
  planting:
    seeds: licensed
    seeds_trade: regulated
    clones: licensed
    clones_trade: regulated
    text: >-
      The drug law includes acquiring or holding seed, sowing, planting and growing within
      cultivation of plants for drugs.[@law] Hemp-permit applicants must give their variety,
      quantity of certified seed, growing area and planned sowing and harvest. Hemp-growing land
      must be reported by 1 May each year.[@hemp]
    sources:
      - law
      - hemp
  hemp:
    status: strict
    text: >-
      Food and industrial hemp needs a cultivation permit plus a contract for the whole crop,
      covering hemp at or below 0.2% THC in dry plant material; applicants declare variety,
      certified-seed quantity, area and sowing plans, and report land by 1 May.[@law,hemp] A
      scientific legal entity may grow under a separate land-registration exception.[@law] The
      [August 2026 law](/history/montenegro-drug-warning-amendment-2026/) expressly defines
      industrial hemp at no more than 0.2% THC and outside the drug list.[@law] [Hemp
      permits were introduced in 2014.](/history/montenegro-hemp-permits-2014/)
    sources:
      - law
      - hemp
  clubs:
    status: none
    text: >-
      Giving cannabis to another person for consumption and making premises available for drug
      use are criminal offences carrying six months to five years in the basic case.[@cc] Food
      and industrial hemp cultivation follows the separate permit and contracted-buyer
      system.[@law]
    sources:
      - cc
      - law
  visitors:
    status: none
    text: >-
      Personal drug possession is punishable by a €100–€2,000 misdemeanour fine, and selling
      cannabis carries two to ten years in prison.[@law,cc] Bringing drugs into Montenegro for
      the supply offence carries two to twelve years.[@cc] Drug-containing medicines have a separate
      border rule: up to thirty days of personal treatment, with a doctor’s certificate no more
      than ninety days old.[@law]
    sources:
      - law
      - cc
  driving:
    status: zero
    text: >-
      Road Safety Law article 182 prohibits driving under narcotic or other psychoactive
      influence and deems that influence established by a test detecting the substance in the
      body.[@traffic2026] It does not require a separate impaired-control finding or give a
      numerical THC allowance.[@traffic2026] The consolidation includes Gazette 111/2026,
      effective 7 August 2026.[@trafficcommencement] Article 317a now sets 15–60 days'
      imprisonment for drug driving and specified testing refusals, plus three penalty points
      and an ordinary four-to-six-month driving ban.[@traffic2026] Immediate danger or an
      accident adds two points and fixes the ban at six months.[@traffic2026] Article 296
      provides for arrest for drug influence or refusal. Articles 291–292 authorise drug testing
      and medical examination; disputed positive results lead to blood and urine analysis,
      subject to health safeguards.[@traffic2026] A medically harmful examination or sample has
      a statutory exception in the refusal provision. This does not establish a general
      prescription defence. Current drug penalties must not be replaced with the separate
      alcohol fine ranges.[@traffic2026]
    sources:
      - traffic2026
      - trafficcommencement
  spotlights:
    - title: The Trnovo plantation
      text: >-
        In August 2025 police reported about 13,100 cannabis plants across eight connected plots
        at Trnovo — the country's biggest recorded grow — with two arrests on the spot.[@raid] A
        third suspect was arrested in October, and forensic work led to criminal complaints
        against two more suspects the following March.[@follow25,follow26] [Police found 13,100
        plants at Trnovo in 2025.](/history/montenegro-operation-trnovo-2025/)
      sources:
        - raid
        - follow25
        - follow26
  research:
    status: licensed
    text: >-
      Scientific legal entities can cultivate hemp after registering the land with the
      phytosanitary authority, using the drug law’s exception to the ordinary cultivation permit
      and purchase-contract requirements.[@law] The ordinary food and industrial growing route
      uses the 2014 permit rules, including certified-seed and land details.[@hemp] Separately,
      article 25 allows scientific, research and educational legal entities and specialist
      laboratories to cultivate, produce, obtain and use controlled drugs under a Health Ministry
      authorisation lasting one year, limited to quantities needed for their work.[@law]
    sources:
      - law
      - hemp
  arrests:
    text: >-
      The Interior Ministry’s [report for 2025](/history/montenegro-police-drug-results-2025/)
      records 247 criminal complaints covering 308 people for drug offences across all
      substances.[@annual2025] It separately records 955 misdemeanour complaints against 957
      people.[@annual2025] These are complaint and suspect counts, rather than cannabis-only
      arrests or convictions.[@annual2025]
    sources:
      - annual2025
  black_market:
    text: >-
      The Interior Ministry’s 2025 seizure table records 400.35285 kg of marijuana and 0.39 kg
      of hashish.[@annual2025] Its narrative reports 13,191 cannabis plants, including the
      [Trnovo plantation](/history/montenegro-operation-trnovo-2025/) with about 13,100
      plants.[@annual2025] The report describes plantations and indoor growing laboratories
      alongside border seizures.[@annual2025]
    sources:
      - annual2025
