segments:
  possession:
    text: >-
      Cannabis offences fall under Articles 300 and 301 of the Criminal Code. The source consulted
      says possession for personal use is punishable by a fine or up to three years; other accounts
      hold that Montenegro's code targets production, sale and 'enabling' use rather than simple
      possession. This entry is scored cautiously and needs checking against the code.
    sources:
      - cr
  cultivation:
    text: Unauthorised production carries two to ten years.
    sources:
      - cr
  enforcement:
    text: >-
      Fines are typical for small amounts; prison for dealing. Policing is heaviest on the coast in
      summer.
    sources:
      - cr
  sharing:
    text: Sale or supply carries two to ten years, up to twelve for organised trafficking.
    sources:
      - cr
  consumption:
    text: Enabling another person's drug use is an offence under Article 301.
    sources:
      - cr
  access:
    text: None.
    sources:
      - cann
context:
