segments:
  possession:
    text: >-
      Possessing up to 7.5 g is treated as a small quantity for personal use: a misdemeanour
      punished with a fine, which can reach €800–1,200, or in some cases short administrative
      detention. Above that it is a crime with up to five years.
    sources:
      - wiki
      - cann
  cultivation:
    text: >-
      Growing even one plant is a criminal offence, regardless of purpose. Section 188 of the
      Penal Code punishes illegal growing of cannabis with a fine or up to five years in prison.
    sources:
      - narko
      - cann
  enforcement:
    text: Fines for users; prison for cultivation, larger amounts and dealing.
    sources:
      - wiki
      - cann
  sharing:
    text: >-
      Supply is a crime. Passing on or brokering even a small amount carries a fine or up to
      three years in prison under section 183 of the Penal Code, handling a large quantity one
      to ten years, and passing drugs to a minor up to five years.
    sources:
      - narko
      - wiki
  consumption:
    text: Use without a prescription is a misdemeanour, fined like possession.
    sources:
      - cann
      - wiki
  access:
    text: >-
      A narrow medical route is lawful. Epidyolex is authorised, and a doctor may seek permission
      for an unauthorised cannabinoid medicine or standardised cannabis for an individual patient.
    sources:
      - ravim
context:
  production:
    text: >-
      No licensed cannabis production; cultivation for narcotic purposes, including medical, is
      prohibited.
    sources:
      - wiki
  products:
    text: Cannabinoid-based medicines on special application only.
    sources:
      - ravim
  medical:
    text: >-
      Access is narrow: Epidyolex is authorised, while a doctor may apply case by case for an
      unauthorised cannabinoid medicine or standardised cannabis. Domestic cultivation for medical
      use remains prohibited.
    sources:
      - ravim
  consequences:
    text: Misdemeanours are recorded in the penal register for a period.
    sources:
      - wiki
  driving:
    status: zero
    text: >-
      There is no THC limit: a driver in whom a drug is detected is removed from the road and
      dealt with for the drug-use offence, with a fine of up to 1,200 euros or administrative
      arrest of up to 30 days. The criminal code separately punishes impaired driving with up
      to three years in prison, four for a repeat offence, and a ban of up to three years.
      Police need suspicion to stop a driver but may test at random; the evidential test is
      blood taken at a hospital.
    sources:
      - euda_dd
  clubs:
    status: none
    text: >-
      No club is confirmed. A Europe-wide survey of cannabis social clubs carried out in 2018
      and 2019 received no answer from Estonia but, because of contradictory sources, could
      not rule out that clubs were active there. The model is prohibited throughout the
      European Union. Nothing more recent was found.
    sources:
      - pardal20
  planting:
    seeds: grey
    seeds_trade: unclear
    clones: illegal
    clones_trade: banned
    text: >-
      Section 188 of the Penal Code makes the illegal growing of cannabis a crime, punished
      with a fine or up to five years in prison, and one to ten years for a group or a repeat
      offender, so a cutting or seedling is covered as a growing plant. The national drug
      information centre's summary of Estonian drug law says nothing about seeds, and no
      provision banning them was found.
    sources:
      - narko
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. Possessing up to 7.5 g is a
      misdemeanour punished with a fine; more is a crime with up to five years. Passing on
      even a small amount can bring up to three years under section 183 of the Penal Code,
      and handling a large quantity one to ten years.
    sources:
      - wiki
      - narko
  black_market:
    text: >-
      The EU drugs agency's statistical bulletin records 102 kg of herbal cannabis and 1.7
      kg of cannabis resin seized in Estonia in 2024, against 70 kg and 68 kg in 2023.
      Herbal cannabis was seized on 660 occasions and resin on 43. Countries record
      seizures differently, so the figures are not comparable across borders.
    sources:
      - euda_szr
