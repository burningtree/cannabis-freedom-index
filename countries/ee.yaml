segments:
  possession:
    text: >-
      Possessing up to 7.5 g is treated as a small quantity for personal use: a misdemeanour
      punished with a fine, which can reach €800–1,200, or in some cases short administrative
      detention. Above that it is a crime with up to five years.
    sources:
      - wiki
      - cann
  cultivation:
    text: Growing even one plant is a criminal offence, regardless of purpose.
    sources:
      - wiki
      - cann
  enforcement:
    text: Fines for users; prison for cultivation, larger amounts and dealing.
    sources:
      - wiki
      - cann
  sharing:
    text: Supply is a crime.
    sources:
      - wiki
  consumption:
    text: Use without a prescription is a misdemeanour, fined like possession.
    sources:
      - cann
      - wiki
  access:
    text: No legal source.
    sources:
      - wiki
context:
  production:
    text: >-
      No licensed cannabis production; cultivation for narcotic purposes, including medical, is
      prohibited.
    sources:
      - wiki
  products:
    text: Cannabinoid-based medicines on special application only.
    sources:
      - leaf
      - cann
  medical:
    text: >-
      Legal in theory but with no real programme: a doctor must apply for permission case by case,
      and only cannabinoid medicines, not the plant, are available. Very few patients have received
      it.
    sources:
      - leaf
      - wiki
  consequences:
    text: Misdemeanours are recorded in the penal register for a period.
    sources:
      - wiki
