name: Estonia
region: Europe
iso_numeric: 233
recreational: decriminalised
medical: limited
updated: '2026-10-27'
summary: >-
  A small quantity for personal use is a misdemeanour, punished by a fine or detention. A large
  quantity, enough to intoxicate at least ten people, carries one to ten years. Medical access
  exists but is rarely used.
scores:
  possession: 3
  cultivation: 1
  enforcement: 3
  sharing: 1
  consumption: 2
  access: 1
segments:
  possession:
    text: >-
      Keeping a small quantity for personal use is a misdemeanour: a fine of up to 300 fine
      units, 8 euros each, or detention.[@ndps, karist] The statute does not fix that quantity
      in grams. A large quantity is enough to cause drug intoxication to at least ten people,
      and handling it carries one to ten years in prison.[@ndps, karist] A group, a repeat, or
      handling for significant gain can bring a longer sentence.[@karist] Courts have treated
      7.5 grams of marijuana at 7 to 10 per cent THC as already enough for ten people, and a
      higher THC content can meet the test at a lower weight.[@riiko] Keeping a small quantity
      in order to supply it is a separate crime, with up to three years.[@karist]
    sources:
      - ndps
      - karist
      - riiko
    currency: EUR
    penalties:
      - label: Small quantity for personal use
        treatment: civil
        term: Misdemeanour
        fine: 2400
        note: Fine up to 300 fine units (at 8 euros each) or detention; no gram figure in statute
      - label: Small quantity to supply
        treatment: criminal
        term: Supply
        prison: 3 years
        note: Systematic trafficking or mediation, holding to supply, or taking across the border
      - label: Large quantity
        treatment: criminal
        term: Handling
        prison_min: 1 year
        prison: 10 years
        note: Enough to intoxicate at least ten people; group, repeat or gain extends it
  cultivation:
    text: >-
      Growing narcotic cannabis illegally is a criminal offence; section 188 of the Penal Code
      provides a fine or up to five years in prison, and one to ten years for a group or a repeat
      offender.[@narko,cann] EU-listed industrial hemp varieties
      with no more than 0.3% THC may be grown for agriculture. Growing cannabis to manufacture a
      narcotic substance, including for medical use, remains prohibited.[@ravim]
    sources:
      - narko
      - cann
      - ravim
    penalties:
      - label: Unlicensed growing
        treatment: criminal
        term: Cultivation
        prison: 5 years
        note: Fine or up to five years; group or repeat one to ten years
      - label: Licensed EU hemp varieties
        treatment: legal
        term: Hemp
        note: EU-listed varieties up to 0.3% THC for agriculture
  enforcement:
    text: >-
      A small quantity for personal use, or use without a prescription, is a fine of up to 300
      fine units or detention.[@ndps] Handling a large quantity, enough to intoxicate at least ten
      people, carries one to ten years. Supplying a small quantity can bring up to three years.[@karist]
      In January 2026 the justice minister proposed raising the large-quantity threshold from 10
      to 30 doses and easing dealer convictions.[@err26]
    sources:
      - ndps
      - karist
      - err26
  sharing:
    text: >-
      Supply is a crime. Systematic trafficking or mediation of a small quantity, possessing a
      small quantity in order to supply it, or taking a small quantity across the border carries
      a fine or up to three years.[@karist] Handling a large quantity, enough to intoxicate at
      least ten people, carries one to ten years.[@karist, ndps] Giving a small quantity to a
      minor carries up to five years.[@karist]
    sources:
      - karist
      - ndps
  consumption:
    text: >-
      Use without a prescription is a misdemeanour, with the same fine of up to 300 fine units
      or detention as small-quantity possession.[@ndps]
    sources:
      - ndps
  access:
    text: >-
      A narrow medical route is lawful. [Epidyolex was authorised in 2019](/history/estonia-epidyolex-2019/),
      and a doctor may seek permission for an unauthorised cannabinoid medicine or standardised
      cannabis for an individual patient.[@ravim]
    sources:
      - ravim
words:
  - { word: Kanep, lang: Estonian, meaning: "cannabis, hemp (Cannabis sativa)", sources: [wiktionary-kanep] }
  - { word: Marihuaana, lang: Estonian, meaning: "marijuana", sources: [wiktionary-marihuaana] }
context:
  recreational:
    text: >-
      There is no legal recreational supply. A small quantity for personal use is a misdemeanour
      with a fine of up to 300 fine units or detention, with no gram figure in the
      statute.[@ndps] Handling a large quantity, enough to intoxicate at least ten people,
      carries one to ten years.[@karist] Courts have treated 7.5 grams at 7 to 10 per cent THC as
      already enough for ten people, with less needed at higher potency.[@riiko] In January 2026 the
      justice minister proposed raising the large-quantity threshold from 10 to 30
      doses.[@err26]
    sources:
      - ndps
      - karist
      - riiko
      - err26
  production:
    status: medical
    text: >-
      Agricultural hemp of EU-listed varieties at no more than 0.3% THC is permitted, but growing
      cannabis to manufacture a narcotic, including for medical use, is prohibited.[@ravim] Extracting
      CBD also produces controlled THC, so extraction is limited to legally authorised purposes;
      medicinal production requires a medicines-manufacturing licence.[@ravim]
    sources:
      - ravim
  medical:
    text: >-
      Access is narrow: [Epidyolex was authorised in 2019](/history/estonia-epidyolex-2019/), while a doctor may apply case by case for an
      unauthorised cannabinoid medicine or standardised cannabis; those medicines are available
      on special application only.[@ravim] Domestic cultivation for medical
      use remains prohibited.[@ravim]
    sources:
      - ravim
  consequences:
    text: >-
      A final decision imposing a penalty for a misdemeanour is entered in the penal register,
      except a decision in a warning procedure.[@karreg] Data on a fine or detention for a misdemeanour
      are deleted and archived one year after the fine is paid or the detention is served.[@karreg]
    sources:
      - karreg
  driving:
    status: zero
    text: >-
      There is no THC limit: a driver in whom a drug is detected is removed from the road and
      dealt with for the drug-use offence, with a fine of up to 1,200 euros or administrative
      arrest of up to 30 days.[@euda_dd] The criminal code separately punishes impaired driving with up
      to three years in prison, four for a repeat offence, and a ban of up to three years.[@euda_dd]
      Police need suspicion to stop a driver but may test at random; the evidential test is
      blood taken at a hospital.[@euda_dd]
    sources:
      - euda_dd
  culture:
    text: >-
      Estonia has a place in [the hemp dance](/culture/traditions/the-hemp-dance/): the atlas records
      an Estonian wedding custom of showering a new bride with hemp collected from
      neighbours.[@benet75] The wider European custom behind it — dancing and leaping high to make
      crops, including hemp, grow high — was collected by James Frazer as imitative
      magic.[@frazer11]
    sources:
      - benet75
      - frazer11
  clubs:
    status: none
    text: >-
      No club is confirmed. A Europe-wide survey of cannabis social clubs carried out in 2018 and
      2019 received no answer from Estonia but, because of contradictory sources, could not rule out
      that clubs were active there.[@pardal20] No law in Estonia provides for them; Malta (since 2021) and
      Germany (since 2024) license non-profit cannabis associations, but only under their own laws.[@de_cang,mt_cap628]
      Nothing more recent was found.[@pardal20]
    sources:
      - pardal20
      - de_cang
      - mt_cap628
  planting:
    seeds: grey
    seeds_trade: unclear
    clones: illegal
    clones_trade: banned
    text: >-
      Section 188 of the Penal Code makes the illegal growing of cannabis a crime, punished
      with a fine or up to five years in prison, and one to ten years for a group or a repeat
      offender, so a cutting or seedling is covered as a growing plant.[@narko] The national drug
      information centre's summary of Estonian drug law says nothing about seeds, and no
      provision banning them was found.[@narko]
    sources:
      - narko
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. A small quantity for personal use is a
      misdemeanour, with a fine of up to 300 fine units or detention.[@ndps] A large quantity,
      enough to intoxicate at least ten people, carries one to ten years.[@ndps, karist] About
      7.5 grams is not a statutory safe limit: courts have treated that weight of marijuana at
      7 to 10 per cent THC as already enough for ten people.[@riiko] Possessing a small quantity
      in order to supply it can bring up to three years.[@karist]
    sources:
      - ndps
      - karist
      - riiko
  black_market:
    text: >-
      The EU drugs agency's statistical bulletin records 102 kg of herbal cannabis and 1.7
      kg of cannabis resin seized in Estonia in 2024, against 70 kg and 68 kg in 2023.[@euda_szr]
      Herbal cannabis was seized on 660 occasions and resin on 43. Countries record
      seizures differently, so the figures are not comparable across borders.[@euda_szr]
    sources:
      - euda_szr
  hemp:
    status: standard
    text: >-
      EU-listed hemp varieties with no more than 0.3% THC may be grown for agriculture.[@ravim] CBD
      extraction is limited to legally authorised purposes because it produces controlled THC as a
      by-product.[@ravim]
    sources:
      - ravim
  arrests:
    text: >-
      No recent cannabis-split arrest totals were found in reachable sources. A 2021
      Swansea University and Eurasian Harm Reduction Association review counted 1,536 new
      drug-related criminal offences in 2019, with a rising trend in unlawful handling of
      small quantities.[@ehra21]
    sources:
      - ehra21
