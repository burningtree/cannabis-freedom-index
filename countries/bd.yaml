segments:
  possession:
    text: >-
      The Narcotics Control Act 2018 classes raw cannabis (ganja) as a Class B narcotic and hashish
      as Class A. Possession penalties scale by weight, and courts have discretion to impose the
      death sentence for more than two kilograms of cannabis.
    sources:
      - netra
      - wiki
  cultivation:
    text: >-
      Growing cannabis is a crime under the Narcotics Control Act 2018: one to five years in prison
      for up to 50 plants, five to seven years for up to 500, and seven to ten years above that.
      Bangladesh had a legal, state-licensed ganja trade until 1989.
    sources:
      - nca18
      - wiki
  enforcement:
    text: >-
      Heavily and visibly policed. A 2018 anti-drug drive was accompanied by hundreds of alleged
      extrajudicial killings.
    sources:
      - netra
      - dt
  sharing:
    text: Trafficking carries long terms, life imprisonment or death.
    sources:
      - dt
      - netra
  consumption:
    text: >-
      Consumption carries three months to two years; the law does not say what quantity establishes
      the charge.
    sources:
      - netra
  access:
    text: None.
    sources:
      - wiki
