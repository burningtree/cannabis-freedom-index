segments:
  possession:
    text: >-
      The Narcotics Control Act 2018 classes raw cannabis (ganja) as a Class B narcotic and
      hashish as Class A. As reported when parliament passed it, for herbal cannabis (ganja or
      bhang) the act sets six months to five years in prison for up to 5 kg, five to seven years
      for 5 to 15 kg and seven to ten years above 15 kg, with a fine in each case. Hashish, as a
      Class A drug, falls under heavier tiers, which for that class can reach life imprisonment
      or death above set quantities. An earlier version of this profile said death was possible
      for more than two kilograms of cannabis; no source read supports that for herbal cannabis.
    sources:
      - palo18
      - netra
  cultivation:
    text: >-
      Growing cannabis is a crime under the Narcotics Control Act 2018: one to five years in prison
      for up to 50 plants, five to seven years for up to 500, and seven to ten years above that.
      Bangladesh had a legal, state-licensed ganja trade until 1989.
    sources:
      - nca18
      - wiki
  enforcement:
    text: >-
      Heavily and visibly policed. A 2018 anti-drug drive was accompanied by hundreds of alleged
      extrajudicial killings.
    sources:
      - netra
      - dt
  sharing:
    text: Trafficking carries long terms, life imprisonment or death.
    sources:
      - dt
      - netra
  consumption:
    text: >-
      Consumption carries three months to two years; the law does not say what quantity establishes
      the charge.
    sources:
      - netra
  access:
    text: None.
    sources:
      - wiki
context:
  death_penalty:
    text: >-
      The 2018 act provides for death or life imprisonment for the largest quantities of Class A
      drugs: 25 g or more of heroin or cocaine, and 200 g or more of yaba when produced or
      transported. Herbal cannabis is Class B and its top tier is seven to ten years. Hashish is
      classed with the Class A drugs, so a death sentence for a cannabis product is possible in
      law, but no quantity for it was found in the sources read.
    sources:
      - palo18
      - netra
  production:
    text: None.
    sources:
      - wiki
  products:
    text: None.
    sources:
      - wiki
  medical:
    text: No medical cannabis.
    sources:
      - wiki
  consequences:
    text: A conviction is a criminal record.
    sources:
      - netra
  planting:
    seeds: grey
    seeds_trade: unclear
    clones: illegal
    clones_trade: banned
    text: >-
      The Narcotics Control Act 2018 defines cultivation as sowing seed, planting or raising
      seedlings, or grafting any plant that can be a source of a drug, and section 9 bans it
      along with sale and possession. Its penalty schedule names germinable opium poppy seed
      but, for cannabis, only the plant and drugs made from its branches, leaves and flowers.
    sources:
      - nca18
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited, and the law provides for the death
      penalty for the most serious drug offences.
    sources:
      - nca18
      - wiki
      - dt
      - netra
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. Under the Narcotics Control Act 2018 for
      herbal cannabis (ganja or bhang) the act sets six months to five years in prison for up to
      5 kg, five to seven years for 5 to 15 kg and seven to ten years above 15 kg; consuming a
      drug carries three months to two years.
    sources:
      - palo18
  black_market:
    text: >-
      Bangladesh's narcotics department says the country does not produce drugs but lies on a
      trafficking route, and that cannabis is smuggled in mostly from India, across the
      western and northern borders. A July 2026 report counted at least 105 border points in
      18 districts used for narcotics of all kinds. Authorities seized 96,358 kg of cannabis
      in 2025, down from 114,345 kg in 2024. The department also reports shortages of staff,
      equipment and vehicles, and drug cases that stay pending for years.
    sources:
      - ds26
  driving:
    status: consumption
    text: >-
      Road Transport Act section 49(1), first part (a), prohibits a driver from driving
      after drinking alcohol or consuming intoxicants. This is a consumption-based rule;
      the provision does not establish a numerical THC allowance or a laboratory
      detectable-THC standard. Section 92(1) provides up to three months' imprisonment,
      up to Tk10,000, or both, plus deduction of one driver point for violating that first
      part. The separate Tk25,000 ceiling in section 89 concerns vehicle/environmental
      requirements and is not the intoxication penalty. Section 12 gives the licensing
      authority powers to suspend, withdraw or cancel licences on specified grounds,
      including habitual drunkenness and contravening the law or licence conditions;
      no fixed cannabis-specific ban duration or medical-use exception was established
      in the provisions reviewed.
    sources:
      - traffic2018
