name: Dominica
region: North America
iso_numeric: 212
recreational: legal
medical: none
updated: 2026-10-04
summary: Since 2020 up to 28 g and a few plants at home are decriminalised.
scores:
  possession: 5
  cultivation: 4
  enforcement: 5
  sharing: 1
  consumption: 3
  access: 0
segments:
  possession:
    text: >-
      Since October 2020 adults 18+ may possess up to 28 g (one ounce) of cannabis without criminal
      liability. Possession above 28 g remains an offence with the old penalties.
    sources:
      - wiki
      - caricom
  cultivation:
    text: >-
      The head of a household may grow up to three plants at the place of residence. The limit is
      per household, not per adult.
    sources:
      - wiki
      - tni
  enforcement:
    text: Nothing within the 28 g and three-plant limits. Larger amounts and dealing remain criminal.
    sources:
      - caricom
      - tni
  sharing:
    text: >-
      The amendment covers possession and home growing only. Supplying cannabis to another person
      remains an offence.
    sources:
      - tni
      - wiki
  consumption:
    text: Use at a private residence is lawful. Smoking in public places remains prohibited.
    sources:
      - tni
      - caricom
  access:
    text: >-
      No lawful place to buy. The government has spoken of building a cannabis industry, but no
      licensing regime for sales is in force.
    sources:
      - wiki
context:
  production:
    text: No commercial licensing is in operation.
    sources:
      - wiki
  products:
    text: Only what a household grows for itself.
    sources:
      - wiki
  medical:
    text: No functioning medical cannabis programme.
    sources:
      - wiki
  consequences:
    text: The 2020 reform provided for existing convictions for small amounts to be expunged.
    sources:
      - tni
      - caricom
sources:
