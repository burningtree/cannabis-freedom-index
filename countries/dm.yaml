name: Dominica
region: North America
iso_numeric: 212
recreational: legal
medical: none
updated: 2026-10-12
summary: Since 2020 adults may hold up to 28 g and a household may grow three plants.
scores:
  possession: 5
  cultivation: 4
  enforcement: 6
  sharing: 1
  consumption: 3
  access: 0
segments:
  possession:
    text: >-
      Since the Drugs (Prevention of Misuse) (Amendment) Act of 2020, a person holding 28
      g or less of cannabis or cannabis resin is not guilty of an offence (section 7A).
      Holding more than 28 g remains unlawful. Earlier convictions for 28 g or less are
      treated as spent, except for people under 18.
    sources:
      - act2020
  cultivation:
    text: >-
      A person aged 18 or older may grow up to three cannabis plants at the place where
      they permanently live (section 8(1A)). Any other growing remains unlawful unless
      regulations allow it.
    sources:
      - act2020
  enforcement:
    text: Nothing within the 28 g and three-plant limits. Larger amounts and dealing remain criminal.
    sources:
      - act2020
      - act1988
  sharing:
    text: >-
      The amendment covers possession and home growing only. Supplying cannabis to another person
      remains an offence.
    sources:
      - act1988
  consumption:
    text: >-
      Use at a private home is lawful. Smoking or using cannabis in a public place, vaping
      included, is an offence with a fine of 1,500 East Caribbean dollars, which does not
      go on the person's criminal record (section 7B). A private residence not used for
      business and a usual place of worship of the Rastafarian or another faith do not
      count as public places.
    sources:
      - act2020
  access:
    text: >-
      No lawful place to buy: the 2020 amendment covers possession and home growing only, and
      supplying cannabis to another person remains an offence. The government has spoken of
      building a cannabis industry, but no licensing regime for sales is in force.
    sources:
      - act2020
      - act1988
context:
  production:
    text: No commercial licensing is in operation.
    sources:
      - wiki
  products:
    text: Only what a household grows for itself.
    sources:
      - wiki
  medical:
    text: No functioning medical cannabis programme.
    sources:
      - wiki
  consequences:
    text: The 2020 reform provided for existing convictions for small amounts to be expunged.
    sources:
      - act2020
  planting:
    seeds: legal
    seeds_trade: banned
    clones: legal
    clones_trade: banned
    text: >-
      Cannabis is defined as the plant and every part of it, so seeds and cuttings fall within the
      28 g possession exception. An adult may cultivate up to three cannabis plants at their
      permanent residence, but the reform did not create an exception for supplying seeds, clones
      or other cannabis to somebody else.
    sources:
      - act1988
      - act2020
  visitors:
    status: none
    text: >-
      There is no lawful place to buy cannabis for anyone. The 2020 amendment removed
      penalties for adults aged 18 and over holding 28 g or less, and the minister presented
      it as applying to Dominicans and as recognising personal religious use; holding more
      than 28 g remains unlawful. No licensing regime for sales exists.
    sources:
      - caricom20
      - wiki
  black_market:
    text: >-
      All sales are illegal. Police figures suggest cannabis is a small part of the drugs
      moving through the island next to cocaine: of drugs worth about 53 million East
      Caribbean dollars burned by police in November 2025, cannabis accounted for about 1.2
      million and cocaine for about 52 million.
    sources:
      - dno25
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and no law provides for them: the 2020 amendment covers
      possession and home growing only, and supplying cannabis to another person remains an
      offence.
    sources:
      - act1988
  driving:
    status: impairment
    text: >-
      Vehicles and Road Traffic Act section 55 covers driving, attempting to drive
      or being in charge of a motor vehicle on a road when drugs prevent proper
      control. Unfitness is defined as impaired ability to drive properly. The
      published 1995 consolidation lists EC$2,000 and twelve months' imprisonment
      for a first conviction, and EC$3,500 and two years for a repeat. It specifies
      a one-to-five-year disqualification unless the court finds special reasons.
      Those published penalty levels require verification against later amendments;
      they are not a certified 2026 tariff. Section 57 allows blood/urine evidence
      and adverse use of an unjustified refusal, but requires a blood request,
      a request for two urine specimens within an hour, and another blood request
      before treating the sequence as refusal; the first urine specimen is disregarded.
      The numerical concentration offence in section 56 concerns alcohol. No THC
      allowance, deployed saliva-screening procedure or medical-cannabis defence was
      established from the reviewed text.
    sources:
      - trafficpublished
