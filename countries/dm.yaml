name: Dominica
region: North America
iso_numeric: 212
recreational: legal
medical: none
updated: '2026-10-29'
summary: >-
  The 2020 reform exempts up to 28 g from ordinary possession penalties and permits three plants
  at a permanent home. School-premises possession can trigger a rebuttable trafficking
  presumption.
scores:
  possession: 5
  cultivation: 4
  enforcement: 6
  sharing: 1
  consumption: 3
  access: 0
segments:
  possession:
    penalties:
      - upto: 28 g
        treatment: legal
        note: >-
          Ordinary possession exemption only; school-premises trafficking presumption and separate
          offences remain
      - label: School-premises trafficking conviction
        treatment: criminal
        term: Trafficking
        prison_min: 7 years
        prison: 15 years
        note: >-
          Summary conviction; indictment can bring life. Possession on school premises raises a
          rebuttable presumption, not an automatic trafficking conviction
    text: >-
      The 2020 reform exempts up to 28 g cannabis or resin from the ordinary section 7(2)
      possession offence; earlier adult small-possession convictions are spent.[@act2020] Section
      16(3) separately presumes school-premises possession is for trafficking unless the accused
      proves otherwise, including school playing fields and off-site facilities.[@act1988]
    sources:
      - act2020
      - act1988
  cultivation:
    text: >-
      A person aged 18 or older may grow up to three cannabis plants at the place where
      they permanently live (section 8(1A)).[@act2020] Any other growing remains unlawful unless
      regulations allow it, punishable on summary conviction with three years and $100,000 or
      on indictment with fourteen years and $200,000.[@act1988](/history/dominica-drugs-prevention-act-1988/)
    sources:
      - act2020
      - act1988
    currency: XCD
    penalties:
      - upto: 3 plants
        treatment: legal
        note: Adults 18+ at permanent residence; no supply of seeds, clones or cannabis to others
      - label: Unlawful cannabis cultivation, summary conviction
        treatment: criminal
        term: Cultivation of cannabis
        prison: 3 years
        fine: 100000
      - label: Unlawful cannabis cultivation, conviction on indictment
        treatment: criminal
        term: Cultivation of cannabis
        prison: 14 years
        fine: 200000
  enforcement:
    text: >-
      The ordinary 28 g exemption leaves separate trafficking offences in place.[@act2020] A
      school-premises trafficking conviction brings 7–15 years summarily with a substantial fine,
      or life on indictment. The possession presumption can be rebutted; these are not automatic
      sentences for small possession.[@act1988]
    sources:
      - act2020
      - act1988
  sharing:
    text: >-
      The amendment covers possession and home growing only.[@act2020] Supplying cannabis to another person
      remains an offence.[@act1988]
    sources:
      - act2020
      - act1988
  consumption:
    text: >-
      Use at a private home is lawful.[@act2020] Smoking or using cannabis in a public place, vaping
      included, is an offence with a fine of 1,500 East Caribbean dollars, which does not
      go on the person's criminal record (section 7B).[@act2020] A private residence not used for
      business and a usual place of worship of the Rastafarian or another faith do not
      count as public places.[@act2020]
    sources:
      - act2020
  access:
    text: >-
      No lawful place to buy: the 2020 amendment covers possession and home growing only, and
      supplying cannabis to another person remains an offence.[@act2020,act1988] The government has spoken of
      building a cannabis industry, but no licensing regime for sales is in force.[@caricom,caricom20]
    sources:
      - act2020
      - act1988
      - caricom
      - caricom20
context:
  recreational:
    text: >-
      Adults get cannabis from their own three home-grown plants: up to 28 g of cannabis or
      resin is exempt from ordinary possession penalties, and earlier small-possession
      convictions are spent.[@act2020] Supply to another person stays criminal, and possession
      on school premises raises a rebuttable trafficking presumption.[@act1988]
    sources:
      - act2020
      - act1988
  production:
    status: none
    text: No commercial production operates; the 2020 change covers personal possession and home growing only.[@act2020]
    sources:
      - act2020
  hemp:
    status: none
    text: >-
      No hemp exception was established in the reviewed laws, which define cannabis as the
      plant and every part of it.[@act1988]
    sources:
      - act1988
  medical:
    text: The reviewed laws establish no medical programme or medical-use route.[@act2020,act1988]
    sources:
      - act2020
      - act1988
  consequences:
    text: The 2020 reform provided for existing convictions for small amounts to be expunged.
    sources:
      - act2020
  planting:
    seeds: legal
    seeds_trade: banned
    clones: legal
    clones_trade: banned
    text: >-
      Cannabis is defined as the plant and every part of it, so seeds and cuttings fall within the
      28 g possession exception.[@act1988] An adult may cultivate up to three cannabis plants at their
      permanent residence, but the reform did not create an exception for supplying seeds, clones
      or other cannabis to somebody else.[@act2020]
    sources:
      - act1988
      - act2020
  visitors:
    status: none
    text: >-
      There is no lawful recreational supply. The 28 g ordinary-possession exemption leaves
      school-premises trafficking rules in place; possession there raises a rebuttable presumption
      with the burden on the accused.[@act2020,act1988]
    sources:
      - act2020
      - act1988
  black_market:
    text: >-
      All sales are illegal.[@act1988] Police figures suggest cannabis is a small part of the drugs
      moving through the island next to cocaine: of drugs worth about 53 million East
      Caribbean dollars burned by police in November 2025, cannabis accounted for about 1.2
      million and cocaine for about 52
      million.[@dno25](/history/dominica-drug-burn-2025/)
    sources:
      - act1988
      - dno25
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and no law provides for them: the 2020 amendment covers
      possession and home growing only, and supplying cannabis to another person remains an
      offence.[@act2020,act1988]
    sources:
      - act2020
      - act1988
  driving:
    status: impairment
    text: >-
      Vehicles and Road Traffic Act section 55 covers driving, attempting to drive
      or being in charge of a motor vehicle on a road when drugs prevent proper
      control.[@trafficpublished] Unfitness is defined as impaired ability to drive properly. The
      published 1995 consolidation lists EC$2,000 and twelve months' imprisonment
      for a first conviction, and EC$3,500 and two years for a repeat.[@trafficpublished] It specifies
      a one-to-five-year disqualification unless the court finds special reasons.[@trafficpublished]
      Those published penalty levels require verification against later amendments;
      they are not a certified 2026 tariff.[@trafficpublished] Section 57 allows blood/urine evidence
      and adverse use of an unjustified refusal, but requires a blood request,
      a request for two urine specimens within an hour, and another blood request
      before treating the sequence as refusal; the first urine specimen is disregarded.[@trafficpublished]
      The numerical concentration offence in section 56 concerns alcohol. No THC
      allowance, deployed saliva-screening procedure or medical-cannabis defence was
      established from the reviewed text.[@trafficpublished]
    sources:
      - trafficpublished
