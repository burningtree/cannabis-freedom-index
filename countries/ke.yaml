name: Kenya
region: Africa
iso_numeric: 404
recreational: illegal
medical: none
updated: '2026-10-27'
summary: >-
  Cannabis held solely for personal use carries up to five years or a fine of up to 100,000
  shillings. Where that is not shown, 1 to 100 grams carries a fine of at least 30 million
  shillings, thirty years in prison, or both.
scores:
  possession: 1
  cultivation: 0
  enforcement: 1
  sharing: 0
  consumption: 1
  access: 0
segments:
  possession:
    text: >-
      Section 3 of the Narcotic Drugs and Psychotropic Substances (Control) Act, as amended in
      March 2022, gives cannabis (bhang) its own tier: a person who satisfies the court that the
      cannabis was solely for their own consumption faces up to five years in prison or a fine
      of up to 100,000 shillings, and the court may add a treatment or rehabilitation programme
      of at least six months. Where that is not shown the trafficking section applies, which
      also covers possession: a fine of at least 30 million shillings or thirty years for 1 to
      100 g, and at least 50 million shillings or fifty years above 100 g.
    sources:
      - act
      - sn
    currency: KES
    penalties:
      - label: Personal consumption (proved to court)
        treatment: criminal
        fine: 100000
        prison: 5 years
        note: Fine up to 100,000 shillings or up to five years; court may add at least six months of treatment or rehabilitation
      - label: Possession treated as trafficking, 1 to 100 g
        treatment: criminal
        fine: 30000000
        prison: 30 years
        note: Fine of at least 30 million shillings or thirty years, or both
      - label: Possession treated as trafficking, above 100 g
        treatment: criminal
        fine: 50000000
        prison: 50 years
        note: Fine of at least 50 million shillings or fifty years, or both
  cultivation:
    text: >-
      Section 6 punishes cultivating a prohibited plant, or letting premises be used for it, with a
      fine of 250,000 shillings or three times the plants’ market value, whichever is greater, up to
      twenty years in prison, or both. Section 7 requires forfeiture of non-government land when the
      convicted person owns it, or a lessee grew with the owner’s consent, cooperation or assistance.
      If the lessee acted without that involvement, the offender’s lease or right ends and possession
      returns to the owner.
    sources:
      - act
    currency: KES
    penalties:
      - label: Cultivating a prohibited plant or letting premises be used for it
        treatment: criminal
        fine: 250000
        prison: 20 years
        note: Fine of 250,000 shillings or three times the plants' market value, whichever is greater, up to twenty years, or both; land or lease consequences under section 7
  enforcement:
    text: >-
      One of Africa's harshest laws on paper since 2022. Courts in practice impose much shorter
      terms and fines for small amounts, but arrests are frequent.
    sources:
      - sn
      - cfm
  sharing:
    text: >-
      Section 4 punishes trafficking, and possession it treats as trafficking, with a fine of at
      least 30 million shillings or thirty years in prison for 1 to 100 g, and at least 50
      million shillings or three times the market value, or fifty years, above 100 g.
    sources:
      - act
    currency: KES
    penalties:
      - label: Trafficking, 1 to 100 g
        treatment: criminal
        fine: 30000000
        prison: 30 years
        note: Fine of at least 30 million shillings or thirty years, or both
      - label: Trafficking, above 100 g
        treatment: criminal
        fine: 50000000
        prison: 50 years
        note: Fine of at least 50 million shillings or three times the market value, or fifty years
  consumption:
    text: >-
      Smoking, inhaling, sniffing or otherwise using a narcotic drug, or being found without
      excuse in a place people use for it, is an offence under Section 5 with a fine of not less
      than 250,000 shillings, at least five years in prison, or both.
    sources:
      - act
    currency: KES
    penalties:
      - label: Using a narcotic drug or frequenting a place used for it
        treatment: criminal
        fine: 250000
        prison_min: 5 years
        note: Fine of not less than 250,000 shillings, at least five years in prison, or both
  access:
    text: >-
      None. The national drug agency has repeatedly insisted cannabis remains prohibited despite
      legalisation petitions.
    sources:
      - cfm
context:
  recreational:
    text: >-
      There is no legal recreational supply. A person who satisfies the court the cannabis was
      solely for their own consumption faces up to five years or a fine of up to 100,000
      shillings; otherwise possession is treated as trafficking, with at least 30 million
      shillings or thirty years for 1 to 100 g.[@act,sn] Courts in practice impose much
      shorter terms and fines for small amounts, but arrests are frequent.[@sn,cfm]
    sources:
      - act
      - sn
      - cfm
  production:
    text: None.
    sources:
      - cfm
  products:
    text: None.
    sources:
      - cfm
  medical:
    text: No medical cannabis; a bill has been proposed in the Senate.
    sources:
      - cfm
  consequences:
    text: >-
      A conviction creates a criminal record. Cultivation can also cost land or a lease under section
      7: owner involvement determines whether non-government land is forfeited or an innocent owner
      recovers it. Rights over government land revert to government. Sections 7(4) and 9–10 protect
      qualifying security and intermediate interests and require notice and an opportunity to be
      heard.
    sources:
      - act
  planting:
    seeds: grey
    seeds_trade: unclear
    clones: illegal
    clones_trade: banned
    text: >-
      The Narcotic Drugs and Psychotropic Substances (Control) Act defines cannabis as the
      flowering or fruiting tops, excluding the seeds and leaves when not accompanied by the
      tops. Cultivating any cannabis plant counts as illicit traffic, so cuttings fall under
      the ban; the Act does not say whether seeds may be sold.
    sources:
      - ndpsa
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited.
    sources:
      - act
      - sn
  arrests:
    text: >-
      Cannabis accounts for most drug arrests. Police statistics for 2016 show 776 people
      arrested in relation to cannabis, against 92 for heroin and 11 for cocaine. Sentences can
      be heavy for very little: in one case reported in a 2021 study a man received two years
      in prison for a single "stick" worth twenty shillings. No more recent national breakdown
      was found.
    sources:
      - cgh
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. Cannabis held solely for one's own
      consumption carries up to five years in prison or a fine of up to 100,000 shillings; using
      it carries a fine of not less than 250,000 shillings or at least five years; and
      possession treated as trafficking carries, from one gram up to 100 grams, a fine of at
      least 30 million shillings, thirty years in prison, or both.
    sources:
      - act
      - cfm
  driving:
    status: unknown
    text: >-
      The Traffic Act makes it an offence to drive, attempt to drive or be in charge of a
      vehicle while under the influence of an alcoholic drink or a drug 'beyond the prescribed
      limits'. The penalty is a fine of up to 100,000 shillings, up to two years in prison, or
      both, with disqualification for twelve months. The section itself gives no figure for
      cannabis, and no numerical THC cutoff has been verified. The reviewed 2026 Drink-Driving
      Rules prescribe blood-alcohol concentrations, not THC; the cannabis-specific conviction
      trigger remains unverified.[@ta44,drink2026]
    sources:
      - ta44
      - drink2026
  black_market:
    text: >-
      Figures reported by the government to the UN drugs office record 28,153 kg of herbal
      cannabis seized in 2024, against 25,840 kg in 2023. The UN publishes them as
      kilogram equivalents, and countries count seizures differently, so the figures are
      not comparable across borders.
    sources:
      - unodc_szr
