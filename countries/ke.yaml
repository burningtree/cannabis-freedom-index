segments:
  possession:
    text: >-
      Cannabis (bhang) is prohibited under the Narcotic Drugs and Psychotropic Substances (Control)
      Act, amended in March 2022. The amendment introduced a lesser penalty for a very small amount
      of cannabis held for personal use, and extremely heavy ones above it: reports cite a fine of
      at least 30 million shillings or 30 years in prison for 1–100 g of narcotics, and life for
      more than 100 g.
    sources:
      - sn
      - act
  cultivation:
    text: Cultivation carries a heavy fine and long imprisonment, plus forfeiture of the land.
    sources:
      - act
  enforcement:
    text: >-
      One of Africa's harshest laws on paper since 2022. Courts in practice impose much shorter
      terms and fines for small amounts, but arrests are frequent.
    sources:
      - sn
      - cfm
  sharing:
    text: Trafficking carries life imprisonment and fines of at least 50 million shillings.
    sources:
      - sn
      - act
  consumption:
    text: Smoking or otherwise using cannabis is an offence.
    sources:
      - act
  access:
    text: >-
      None. The national drug agency has repeatedly insisted cannabis remains prohibited despite
      legalisation petitions.
    sources:
      - cfm
