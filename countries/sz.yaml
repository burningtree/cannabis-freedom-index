segments:
  possession:
    text: >-
      Possession of cannabis (insangu, or dagga) is an offence under the colonial-era Opium and
      Habit-Forming Drugs Act of 1922, punishable by a fine or up to five years in prison. Small
      amounts usually end in a fine.
    sources:
      - law
      - cr
  cultivation:
    text: >-
      Cultivation is illegal, yet 'Swazi Gold' is a major cash crop for smallholders in the northern
      hills, and Eswatini is among the world's largest illicit producers per head. Police
      periodically burn fields.
    sources:
      - cr
      - ht
  enforcement:
    text: >-
      Fines for small amounts, prison possible; enforcement falls mainly on rural growers and
      couriers.
    sources:
      - cr
      - law
  sharing:
    text: Dealing carries up to fifteen years.
    sources:
      - cr
  consumption:
    text: Use is an offence under the same Act.
    sources:
      - law
  access:
    text: No legal source.
    sources:
      - cr
context:
  production:
    text: >-
      None yet. A government bill to license cannabis for medical and research purposes has been
      before parliament in various forms since 2020; small farmers fear it would hand the trade to
      large investors.
    sources:
      - ht
      - cr
  products:
    text: No legal products.
    sources:
      - cr
  medical:
    text: No medical programme; the pending bill would create one.
    sources:
      - ht
  consequences:
    text: A conviction is a criminal record.
    sources:
      - law
