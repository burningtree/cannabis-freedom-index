name: Eswatini
region: Africa
iso_numeric: 748
recreational: illegal
medical: none
updated: '2026-10-28'
summary: >-
  Illegal, though "Swazi Gold" is a major smallholder cash crop. A 1922 Act and the 1929 Pharmacy
  Act both apply; the Pharmacy Act allows up to fifteen years for possession. Bills to license
  medical and hemp production have been debated for years but not enacted.
words:
  - word: insangu
    lang: siSwati
    meaning: cannabis
    sources:
      - ohda
scores:
  possession: 1
  cultivation: 1
  enforcement: 2
  sharing: 1
  consumption: 1
  access: 0
segments:
  possession:
    text: >-
      Possession of cannabis (insangu, or dagga) is an offence under the colonial-era Opium and
      Habit-Forming Drugs Act 1922, punishable by a fine of up to E2,000 or five years, or both.[@ohda]
      The Pharmacy Act 1929 also lists cannabis as a poison: unlawful possession carries E15,000 or
      fifteen years on a first conviction, and E20,000 or twenty years subsequently.[@pharmacy]
      Modern possession and transport cases are often charged under the Pharmacy Act, so the lower
      1922 maximum is not a reliable ceiling.[@pharmacy]
    sources:
      - ohda
      - pharmacy
    currency: SZL
    penalties:
      - label: Possession under the 1922 Act
        treatment: criminal
        term: Possession
        prison: 5 years
        fine: 2000
      - label: Possession under the Pharmacy Act, first offence
        treatment: criminal
        term: Possession
        prison: 15 years
        fine: 15000
      - label: Possession under the Pharmacy Act, subsequent offence
        treatment: criminal
        term: Possession
        prison: 20 years
        fine: 20000
  cultivation:
    text: >-
      Cultivation without authorisation is an offence under the 1922 Act, with up to E2,000 or five
      years.[@ohda] The Act allows ministerial licences only for reasonable medical, surgical, dental
      or veterinary demand.[@ohda] A "manufacture" charge under the Pharmacy Act could reach E15,000
      or fifteen years, though the reported large cultivation cases have been sentenced under the
      1922 Act.[@pharmacy]
    sources:
      - ohda
      - pharmacy
    currency: SZL
    penalties:
      - label: Cultivation under the 1922 Act
        treatment: criminal
        term: Cultivation
        prison: 5 years
        fine: 2000
      - label: Manufacture under the Pharmacy Act, first offence
        treatment: criminal
        term: Manufacture
        prison: 15 years
        fine: 15000
  enforcement:
    text: >-
      Fines are common for small amounts, with prison possible; enforcement falls mainly on rural
      growers and couriers.[@phiri] Police destroyed fields and seized hundreds of kilograms in
      Operation Thunder in 2025, and the Eswatini Cannabis Association accused the government of
      spraying fields with herbicides without assessment.[@spraying25] No cannabis-only arrest series
      is published.[@unodc_crimes]
    sources:
      - phiri
      - spraying25
      - unodc_crimes
  sharing:
    text: >-
      Sale, supply and giving are offences under the 1922 Act, with up to E2,000 or five years.[@ohda]
      The Pharmacy Act sets a higher sale penalty: E10,000 or ten years on a first conviction, and
      E15,000 or fifteen years subsequently.[@pharmacy] There is no statutory quantity threshold in
      either Act.[@ohda,pharmacy]
    sources:
      - ohda
      - pharmacy
    currency: SZL
    penalties:
      - label: Sale or supply under the 1922 Act
        treatment: criminal
        term: Supply
        prison: 5 years
        fine: 2000
      - label: Sale under the Pharmacy Act, first offence
        treatment: criminal
        term: Sale
        prison: 10 years
        fine: 10000
      - label: Sale under the Pharmacy Act, subsequent offence
        treatment: criminal
        term: Sale
        prison: 15 years
        fine: 15000
  consumption:
    text: >-
      Use is an offence under section 7 of the 1922 Act, with up to E2,000 or five years.[@ohda] The
      Pharmacy Act has no separate consumption offence; possession is the usual charge.[@pharmacy]
    sources:
      - ohda
      - pharmacy
    currency: SZL
    penalties:
      - label: Use
        treatment: criminal
        term: Use
        prison: 5 years
        fine: 2000
  access:
    text: >-
      No legal source for adult use, and no patient access programme. A medical and industrial
      cannabis bill has been before Parliament in various forms since 2020 but has not been
      enacted.[@ht,bill26]
    sources:
      - ht
      - bill26
context:
  recreational:
    text: >-
      All recreational use is prohibited. The 1922 Act covers possession, cultivation, sale and use
      with up to E2,000 or five years, while the Pharmacy Act allows up to E15,000 or fifteen years
      for possession and E10,000 or ten years for a first sale.[@ohda,pharmacy] There are no
      statutory quantity thresholds; sentencing bands come from the 1986 Phiri judgment.[@phiri]
    sources:
      - ohda
      - pharmacy
      - phiri
  production:
    status: medical
    text: >-
      The only commercial route reported is a disputed licence for medical and industrial cannabis
      said to have been granted to US-based Profile Solutions/StemPro in 2019; VOA described it in
      2024 as the only authorised grower.[@voa24] No patient-access scheme or domestic medical supply
      followed, and the government denied knowledge of the deal in 2020.[@voa24] A bill to replace
      both drug Acts with medical and industrial cannabis legislation was still pending in 2026.[@bill26]
    sources:
      - voa24
      - bill26
  medical:
    text: >-
      No medical programme and no patient access. The pending bill would allow medical and industrial
      cannabis only, not adult use, and would repeal both the 1922 and 1929 Acts.[@bill26] No
      registered cannabis medicine or domestic pharmacy route was found.[@pharmacy]
    sources:
      - bill26
      - pharmacy
  hemp:
    status: none
    text: >-
      No low-THC or industrial-hemp exemption. "Cannabis", "dagga" and "Indian hemp" cover the whole
      plant and all extracts, and the Pharmacy Act lists cannabis as a poison.[@ohda,pharmacy]
      Ministry of Agriculture hemp trials were research-only; commercial cultivation awaited the
      bill.[@bill26]
    sources:
      - ohda
      - pharmacy
      - bill26
  consequences:
    text: >-
      A conviction is a criminal record. The 1922 Act allows a court to suspend a driver's licence
      for up to five years where a vehicle was used to convey drugs.[@ohda] The Pharmacy Act provides
      for forfeiture of the drug and any vehicle or receptacle used.[@pharmacy]
    sources:
      - ohda
      - pharmacy
  planting:
    seeds: illegal
    seeds_trade: banned
    clones: illegal
    clones_trade: banned
    text: >-
      The 1922 Act defines cannabis, dagga, intsangu or Indian hemp as "the whole or any portion of
      the plant" and all its extracts and preparations, under whatever name.[@ohda] Seed and cuttings
      are portions of the plant, and the Act has no exception for them.[@ohda]
    sources:
      - ohda
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited.[@ohda]
    sources:
      - ohda
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. The 1922 Act and the Pharmacy Act apply to
      visitors as to residents, with possession exposed to up to fifteen years under the Pharmacy
      Act.[@ohda,pharmacy]
    sources:
      - ohda
      - pharmacy
  driving:
    status: impairment
    text: >-
      Road Traffic Act section 91(1) prohibits driving on a public road, or occupying the driver's
      seat, while under the influence of a drug having a narcotic effect.[@traffic2007] Section
      122(2) sets a maximum E5,000 fine or four years, or both.[@traffic2007] There is no numeric THC
      limit or confirmed cannabis testing protocol.[@traffic2007]
    sources:
      - traffic2007
  culture:
    text: >-
      Cannabis is known as insangu or dagga in siSwati, and smoking traditions include the
      [earth pipe](/culture/traditions/the-earth-pipe/) and the
      [spit-bubble game](/culture/traditions/the-spit-bubble-game/).[@ohda] "Swazi Gold" from the
      northern hills is the country's best-known variety, grown by smallholders for decades.[@sem23]
      Prohibition and eradication have pushed the trade underground.[@spraying25]
    sources:
      - ohda
      - sem23
      - spraying25
  black_market:
    text: >-
      Cannabis is an export crop for smallholders, especially "Swazi Gold" from the northern Hhohho
      hills, sold at a premium to dealers and buyers in South Africa.[@sem23] UNODC records 24,708 kg
      of cannabis herb and resin seized in 2024, against 13,170 kg in 2023; the figure may include
      plants destroyed in the field.[@unodc_szr] Police reported 2,550 people in formal contact for
      all drug use or possession in 2024, not cannabis alone.[@unodc_crimes]
    sources:
      - sem23
      - unodc_szr
      - unodc_crimes
  arrests:
    text: >-
      UNODC records 2,550 people in formal contact with the police for drug use or possession in
      2024; the figure covers all drugs and is not a cannabis arrest count.[@unodc_crimes] Reported
      cannabis cases include 8.4 kg sentenced to 24 months in March 2024, a 15-year transport
      sentence in April 2024, 2,169 kg seized at Nyonyane in September 2025 and 445.6 kg recovered in
      October 2026.[@unodc_crimes,spraying25] No annual cannabis arrest series is published.[@unodc_crimes]
    sources:
      - unodc_crimes
      - spraying25
