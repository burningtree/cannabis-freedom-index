segments:
  possession:
    text: >-
      Possession of cannabis (insangu, or dagga) is an offence under the colonial-era Opium and
      Habit-Forming Drugs Act of 1922, punishable by a fine or up to five years in prison. Small
      amounts usually end in a fine.
    sources:
      - law
  cultivation:
    text: >-
      Cultivation is illegal, yet 'Swazi Gold' is a major cash crop for smallholders in the northern
      hills, and Eswatini is among the world's largest illicit producers per head. Police
      periodically burn fields.
    sources:
      - ht
  enforcement:
    text: >-
      Fines for small amounts, prison possible; enforcement falls mainly on rural growers and
      couriers.
    sources:
      - law
  sharing:
    text: Dealing carries up to fifteen years.
    sources:
      - law
  consumption:
    text: Use is an offence under the same Act.
    sources:
      - law
  access:
    text: No legal source for adult use.
    sources:
      - law
context:
  production:
    text: >-
      None yet. A government bill to license cannabis for medical and research purposes has been
      before parliament in various forms since 2020; small farmers fear it would hand the trade to
      large investors.
    sources:
      - ht
  products:
    text: Reliable national information about legally available cannabis products was not established by the retained sources.
    sources: []
  medical:
    text: No medical programme; the pending bill would create one.
    sources:
      - ht
  consequences:
    text: A conviction is a criminal record.
    sources:
      - law
  planting:
    seeds: illegal
    seeds_trade: banned
    clones: illegal
    clones_trade: banned
    text: >-
      The Opium and Habit-forming Drugs Act 1922 defines cannabis, dagga, intsangu or Indian
      hemp as "the whole or any portion of the plant" and all its extracts and preparations,
      under whatever name. Seed and cuttings are portions of the plant, and the Act has no
      exception for them.
    sources:
      - ohda
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited.
    sources:
      - ht
  black_market:
    text: >-
      Cannabis is an export crop for smallholders. Farmers in the northern Hhohho region grow
      the variety known as Swazi Gold and sell it at a premium to dealers and buyers in
      neighbouring South Africa; in a country of about 1.2 million people with 24%
      unemployment, the trade has given many households a meaningful income for decades. A
      bill to replace the colonial-era drug law and license cannabis for medical and research
      use is opposed by growers and activists, who fear it will hand the trade to companies
      and undermine theirs.
    sources:
      - sem23
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. British travel advice says punishments
      for possessing or smuggling narcotic drugs can be severe and that drug offences can lead
      to prison.
    sources:
      - fcdo
  driving:
    status: impairment
    text: >-
      Road Traffic Act section 91(1) prohibits driving on a public road under the influence of a drug
      having a narcotic effect. The published 2007 text also covers occupying a motor vehicle’s
      driver’s seat whether its engine is running or not. That drug-influence limb is distinct from
      the Act’s alcohol concentration offences. Section 122(2) in this edition lists a maximum E5,000
      fine, four years’ imprisonment or both for the section 91(1) offence, but later amendments and
      the current tariff were not certified. Current licence-disqualification rules, cannabis sampling
      and confirmation procedures, refusal sanctions and any numeric THC cutoff remain follow-ups.
    sources:
      - traffic2007
