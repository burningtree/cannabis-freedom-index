name: Sint Maarten
region: North America
iso_numeric: 534
dependency:
  of: nl
  kind: Country within the Kingdom of the Netherlands
  note: >-
    Sint Maarten, the southern part of the island of Saint Martin, is a self-governing country within
    the Kingdom of the Netherlands with its own parliament and laws. Its prosecution service is shared
    with Curaçao and the Caribbean Netherlands; the French northern half, Saint-Martin, follows French
    law.
recreational: illegal
medical: none
updated: 2026-10-17
summary: >-
  Cannabis is illegal under the Opium Ordinance, but the prosecution guideline shared with Curaçao
  drops cases of up to 25 g once the cannabis is confiscated and fines amounts up to 50 g. The
  government invited proposals for a regulated cannabis industry in 2022, but no legal market or
  confirmed medical programme exists.
scores:
  possession: 4
  cultivation: 1
  enforcement: 4
  sharing: 1
  consumption: 2
  access: 0
segments:
  possession:
    text: >-
      Under the prosecution guideline for Curaçao, Sint Maarten and the Caribbean Netherlands, in
      force since December 2018, up to 25 g of cannabis is confiscated and the case dismissed,
      conditionally or not, and 25 to 50 g brings a fine of up to NAf 500. Exceptions are possession
      together with another offence, repeat offences, signs of dealing, minors, and places such as
      carnival parades, workplaces or government buildings.
    sources:
      - om18
  cultivation:
    text: >-
      Growing plants of the genus Cannabis is banned, and the guideline leaves sentencing for grows to
      case-by-case assessment.
    sources:
      - om18
  enforcement:
    text: >-
      Small amounts are confiscated without prosecution; larger quantities bring demands set at half
      those for cocaine. Resident first offenders are usually given partly suspended sentences.
    sources:
      - om18
  sharing:
    text: >-
      Supplying cannabis is dealing, and signs of dealing remove the leniency for small amounts.
    sources:
      - om18
  consumption:
    text: >-
      Small personal amounts are not prosecuted for adults, but possession at carnival parades,
      workplaces or government buildings is excluded from the leniency, and minors are prosecuted so
      that treatment can be imposed.
    sources:
      - om18
  access:
    text: >-
      No legal source. In September 2022 the health minister launched a 90-day request for proposals
      for a regulated and legal cannabis industry, stressing studies before any decision on how to
      legalise; no concrete decision followed in the sources reviewed. Travel guides report a
      prescription route through pharmacies since 2019, which could not be confirmed from a government
      source.
    sources:
      - dh22
context:
  production:
    text: >-
      None licensed. The 2022 request for proposals sought partners for a future regulated industry.
    sources:
      - dh22
  products:
    text: >-
      No legal cannabis products are confirmed.
    sources:
      - om18
  medical:
    text: >-
      No medical cannabis programme could be confirmed from official sources. The 2022 government
      plan named medical benefits among the aims of a regulated industry.
    sources:
      - dh22
  consequences:
    text: >-
      The Dutch tolerance policy does not apply, and the prosecution guideline treats residents and
      non-residents differently when it comes to suspended sentences.
    sources:
      - om18
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and there is no coffeeshop tolerance.
    sources:
      - om18
  visitors:
    status: none
    text: >-
      There is no legal supply for anyone.
    sources:
      - om18
