segments:
  possession:
    text: >-
      Possessing cannabis is prohibited under the Opium Ordinance.[@law] The prosecution guideline
      provides for confiscation and dismissal, potentially conditional, in the 0–25 g
      band.[@guideline] Exceptions include minors, repeat offending, indications of dealing, another
      offence and specified settings such as carnival parades, workplaces or government
      buildings.[@guideline] The next 25–50 g band has a proposed fine of up to Cg 500.[@guideline]
      The older law and prosecution guidance state amounts in Netherlands Antillean guilders; the
      Caribbean guilder replaced that currency one for one in 2025.[@currency2025]
    sources:
      - law
      - guideline
      - currency2025
    currency: XCG
    penalties:
      - treatment: tolerated
        term: Confiscation and (conditional) dismissal
        upto: 25 g
        note: Prosecution guideline, subject to exceptions for minors, repeat offending, dealing, another offence and specified settings
      - treatment: criminal
        term: Fine of up to Cg 500
        over: 25 g
        upto: 50 g
        fine: 500
        note: Prosecutors' request, subject to exceptions
  cultivation:
    text: >-
      Growing plants of the genus Cannabis is prohibited under article 2a.[@law] Article 11(2)
      punishes intentional violations with life imprisonment, up to 24 years, or a fine of up to
      NAf 6,250,000; non-intentional violations carry up to 12 years or up to NAf
      3,000,000.[@law] The prosecution guideline
      requires an individual sentencing assessment for grows, considering matters such as plant
      numbers, location, professional equipment and the person’s involvement.[@guideline]
    sources:
      - law
      - guideline
    currency: XCG
    penalties:
      - label: Cannabis cultivation, intentional
        treatment: criminal
        term: Teeltverbod — Opium Ordinance art. 2a, 11(2)
        life: possible
        prison: 24 years
        fine: 6250000
        note: Or life imprisonment; statute states guilders, converted 1:1 to XCG; guideline requires individual assessment
      - label: Cannabis cultivation, non-intentional
        treatment: criminal
        term: Teeltverbod — Opium Ordinance art. 2a, 11(2)
        prison: 12 years
        fine: 3000000
        note: Statute states guilders, converted 1:1 to XCG; guideline requires individual assessment
  enforcement:
    text: >-
      The small-quantity policy governs prosecutors’ decisions and sentencing
      requests.[@guideline] Above the 25–50 g band, its cannabis requests are half those in the
      cocaine/heroin table.[@guideline] For qualifying resident defendants, prosecutors
      generally seek a wholly or partly suspended sentence with three years’
      probation.[@guideline](/history/sint-maarten-prosecution-guideline-2018/)
    sources:
      - guideline
  sharing:
    text: >-
      The ordinance controls cannabis possession and supply-related activities, while
      indications of dealing remove the small-quantity dismissal policy.[@law, guideline]
    sources:
      - law
      - guideline
  consumption:
    text: >-
      The ordinance prohibits possessing or using cannabis outside its exemptions.[@law] The
      prosecution policy has exceptions to small-quantity dismissal for minors and specified
      settings, including carnival parades, workplaces and government buildings.[@guideline]
    sources:
      - law
      - guideline
  access:
    text: >-
      The ordinance prohibits recreational growing and unauthorised possession, while providing
      specified medical exemptions.[@law] The government formed a committee to prepare a
      regulated industry in
      2024.[@committee](/history/sint-maarten-cannabis-committee-2024/) In March 2026 a
      parliamentary committee heard a proposed framework with an oversight commission and
      licensing; the hearing was
      adjourned.(/history/sint-maarten-cannabis-framework-hearing-2026/) In August the prime
      minister warned against rushing sales
      legislation,(/history/sint-maarten-pm-cannabis-caution-2026/) and in October the health
      minister was still seeking regional advice before decisions on
      reform.[@health](/history/sint-maarten-health-review-cannabis-2026/)
    sources:
      - law
      - committee
      - health
context:
  recreational:
    text: >-
      There is no legal recreational market. Prosecutors confiscate and may conditionally dismiss
      the 0–25 g band, and request a fine of up to Cg 500 in the 25–50 g band — but the guidance
      does not apply to minors, repeat or dealing-indicated cases, or settings like carnival
      parades.[@guideline] The lineage runs back to the Netherlands Antilles' ordinance of 30
      July 1929, shared with Curaçao and
      Aruba.(/history/curacao-first-drug-ordinance-1929/)
    sources:
      - guideline
  production:
    status: none
    text: >-
      Growing cannabis is prohibited by the ordinance.[@law] The 2024 committee was tasked with
      preparing conditions for cultivation, processing, testing and distribution within a
      proposed regulated system.[@committee]
    sources:
      - law
      - committee
  medical:
    text: >-
      The ordinance contains an exemption for people who can show that they need the cannabis
      quantity for their own medical use and obtained it lawfully; it controls flower, resin and
      resin preparations separately from extracts and tinctures, which fall under the medical
      provisions for authorised pharmacists and medical practitioners.[@law] A broader
      medical-cannabis framework is among the reform committee’s objectives; health minister
      Claret Connor sought PAHO assistance for the policy review in October 2026.[@committee,
      health]
    sources:
      - law
      - committee
      - health
  hemp:
    status: none
    text: >-
      No hemp programme operates. The 2024 committee's work covers cultivation, processing,
      testing and distribution within a proposed regulated cannabis system, not an operating hemp
      market.[@committee]
    sources:
      - committee
  consequences:
    text: >-
      The guideline generally reserves requests for a suspended sentence to qualifying resident
      defendants and specifies three years’ probation.[@guideline] It normally does not seek a
      probation-service report for non-residents, while allowing the defence to present relevant
      personal circumstances at the hearing.[@guideline]
    sources:
      - guideline
  clubs:
    status: none
    text: >-
      Cannabis growing remains prohibited, and the small-quantity prosecution policy excludes
      indications of dealing.[@law, guideline] The 2024 committee was charged with developing
      future rules for production, distribution and consumption.[@committee]
    sources:
      - law
      - guideline
      - committee
  visitors:
    status: none
    text: >-
      The small-quantity prosecution table is expressed in quantities and circumstances, while
      its suspended-sentence guidance separately distinguishes resident defendants.[@guideline]
      The ordinance continues to control possession and cross-border movement of cannabis.[@law]
    sources:
      - guideline
      - law
  planting:
    seeds: legal
    seeds_trade: open
    clones: illegal
    clones_trade: banned
    text: >-
      The ordinance defines hemp as flowering or fruit-bearing tops or parts of any cannabis
      plant, expressly excluding seeds and leaves unless they accompany the tops; loose seeds
      are therefore outside the hemp definition.[@law] Germinating them is a different matter:
      growing cannabis plants is prohibited under article 2a, which covers cuttings and young
      plants alike.[@law]
    sources:
      - law
