segments:
  possession:
    text: >-
      Possessing cannabis is prohibited under the Opium Ordinance.[@law] The prosecution
      guideline provides for confiscation and dismissal, potentially conditional, in the 0–25 g
      band.[@guideline] Exceptions include minors, repeat offending, indications of dealing,
      another offence and specified settings such as carnival parades, workplaces or government
      buildings.[@guideline] The next 25–50 g band has a proposed fine of up to NAf
      500.[@guideline]
    sources:
      - law
      - guideline
  cultivation:
    text: >-
      Growing plants of the genus Cannabis is prohibited.[@law] The prosecution guideline
      requires an individual sentencing assessment for grows, considering matters such as plant
      numbers, location, professional equipment and the person’s involvement.[@guideline]
    sources:
      - law
      - guideline
  enforcement:
    text: >-
      The small-quantity policy governs prosecutors’ decisions and sentencing
      requests.[@guideline] Above the 25–50 g band, its cannabis requests are half those in the
      cocaine/heroin table.[@guideline] For qualifying resident defendants, prosecutors
      generally seek a wholly or partly suspended sentence with three years’
      probation.[@guideline]
    sources:
      - guideline
  sharing:
    text: >-
      The ordinance controls cannabis possession and supply-related activities, while
      indications of dealing remove the small-quantity dismissal policy.[@law, guideline]
    sources:
      - law
      - guideline
  consumption:
    text: >-
      The ordinance prohibits possessing or using cannabis outside its exemptions.[@law] The
      prosecution policy has exceptions to small-quantity dismissal for minors and specified
      settings, including carnival parades, workplaces and government buildings.[@guideline]
    sources:
      - law
      - guideline
  access:
    text: >-
      The ordinance prohibits recreational growing and unauthorised possession, while providing
      specified medical exemptions.[@law] The government formed a committee to prepare a
      regulated industry in 2024.[@committee] In October 2026 the health minister was still
      seeking regional advice before decisions on reform.[@health]
    sources:
      - law
      - committee
      - health
context:
  production:
    status: none
    text: >-
      Growing cannabis is prohibited by the ordinance.[@law] The 2024 committee was tasked with
      preparing conditions for cultivation, processing, testing and distribution within a
      proposed regulated system.[@committee]
    sources:
      - law
      - committee
  products:
    text: >-
      The ordinance controls cannabis flower, resin and preparations based on resin, and
      separately regulates cannabis extracts and tinctures.[@law] Product testing and rules for
      cannabis concentrates form part of the 2024 committee’s proposed work.[@committee]
    sources:
      - law
      - committee
  medical:
    text: >-
      The ordinance contains an exemption for people who can show that they need the cannabis
      quantity for their own medical use and obtained it lawfully.[@law] Its statutory medical
      provisions also cover authorised pharmacists and medical practitioners.[@law] A broader
      medical-cannabis framework is among the reform committee’s objectives; health minister
      Claret Connor sought PAHO assistance for the policy review in October 2026.[@committee,
      health]
    sources:
      - law
      - committee
      - health
  consequences:
    text: >-
      The guideline generally reserves requests for a suspended sentence to qualifying resident
      defendants and specifies three years’ probation.[@guideline] It normally does not seek a
      probation-service report for non-residents, while allowing the defence to present relevant
      personal circumstances at the hearing.[@guideline]
    sources:
      - guideline
  clubs:
    status: none
    text: >-
      Cannabis growing remains prohibited, and the small-quantity prosecution policy excludes
      indications of dealing.[@law, guideline] The 2024 committee was charged with developing
      future rules for production, distribution and consumption.[@committee]
    sources:
      - law
      - guideline
      - committee
  visitors:
    status: none
    text: >-
      The small-quantity prosecution table is expressed in quantities and circumstances, while
      its suspended-sentence guidance separately distinguishes resident defendants.[@guideline]
      The ordinance continues to control possession and cross-border movement of cannabis.[@law]
    sources:
      - guideline
      - law
