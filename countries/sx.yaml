dependency:
  of: nl
  kind: Country within the Kingdom of the Netherlands
  note: >-
    Sint Maarten, the southern part of the island of Saint Martin, is a self-governing country
    within the Kingdom of the Netherlands with its own parliament and laws. Its prosecution
    service is shared with Curaçao and the Caribbean Netherlands; the French northern half,
    Saint-Martin, follows French law.
recreational: illegal
medical: limited
updated: '2026-10-28'
summary: >-
  Cannabis possession remains an offence. Prosecutors can dismiss cases in the 0–25 g band after
  confiscation, subject to exceptions. The ordinance includes medical exemptions, while
  proposals for a regulated cannabis industry remain under debate.
# the search-result description, where the generated one runs long (src/lib/seo.js)
seo_description: >-
  Cannabis is illegal in Sint Maarten, but prosecutors can dismiss cases of up to 25 g after
  confiscation, with exceptions. Medical exemptions exist; a regulated market is still debated.
