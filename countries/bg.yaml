segments:
  possession:
    text: >-
      Cannabis is a class A 'high-risk' drug, grouped with heroin and cocaine. Possession carries
      one to six years in prison and a fine of up to 10,000 leva under Article 354a of the Penal
      Code. For 'minor cases' a separate provision allows a fine of up to 1,000 leva instead — still
      a criminal conviction, not an administrative penalty.
    sources:
      - cr
      - wiki
  cultivation:
    text: Cultivation is a crime with prison terms.
    sources:
      - wiki
  enforcement:
    text: >-
      Most small cases end in the minor-case fine, but prison sentences for possession do occur, and
      reform is described as a political taboo.
    sources:
      - dr
      - cr
  sharing:
    text: Distribution carries two to eight years or more.
    sources:
      - wiki
  consumption:
    text: Use is not separately punished, but possession is.
    sources:
      - dr
  access:
    text: None.
    sources:
      - wiki
context:
  production:
    text: Industrial hemp under licence only.
    sources:
      - wiki
  products:
    text: CBD products with minimal THC.
    sources:
      - cr
  medical:
    text: >-
      No medical cannabis programme — unlike neighbouring Greece and Romania, there is not even a
      law on paper.
    sources:
      - cr
      - wiki
  consequences:
    text: Even the minor-case fine leaves a criminal record.
    sources:
      - cr
