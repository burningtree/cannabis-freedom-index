name: Bulgaria
region: Europe
iso_numeric: 100
recreational: illegal
medical: none
updated: 2026-10-23
summary: >-
  A 'high-risk' drug: one to six years for possession, with a fine of up to 1,000 leva for minor
  cases that still counts as a conviction.
scores:
  possession: 1
  cultivation: 0
  enforcement: 2
  sharing: 0
  consumption: 1
  access: 0
segments:
  possession:
    text: >-
      Cannabis is a class A 'high-risk' drug, grouped with heroin and cocaine. Possession carries
      one to six years in prison and a fine of up to 10,000 leva under Article 354a of the Penal
      Code. For 'minor cases' a separate provision allows a fine of up to 1,000 leva instead — still
      a criminal conviction, not an administrative penalty.
    sources:
      - wiki
      - dr
      - nr2007
    currency: BGN
    penalties:
      - label: Possession of a high-risk drug
        treatment: criminal
        fine: 10000
        prison_min: 1 year
        prison: 6 years
        note: One to six years and a fine of 2,000 to 10,000 leva (Penal Code article 354a)
      - label: Minor possession case
        treatment: criminal
        fine: 1000
        note: A fine of up to 1,000 leva instead — still a criminal conviction
  cultivation:
    text: >-
      Cultivation is a crime with prison terms; the penal code has a separate offence for growing
      hemp-type plants. In 2014 a multiple sclerosis patient with two plants was fined 1,000 leva
      on appeal after a first acquittal.
    sources:
      - wiki
      - nr2007
      - dr
  enforcement:
    text: >-
      Most small cases end in the minor-case fine, but prison sentences for possession do occur, and
      reform is described as a political taboo.
    sources:
      - dr
  sharing:
    text: Distribution carries two to eight years or more.
    sources:
      - wiki
      - dr14
    penalties:
      - label: Distribution
        treatment: criminal
        prison_min: 2 years
        prison: 8 years
        note: Two to eight years or more
  consumption:
    text: Use is not separately punished, but possession is.
    sources:
      - dr
  access:
    text: None. Production, import and sale are prohibited, and nothing containing THC is legally sold.
    sources:
      - wiki
      - cmsg
context:
  recreational:
    text: >-
      There is no legal recreational supply. Cannabis is a class A high-risk drug with heroin
      and cocaine: possession brings one to six years and up to 10,000 leva, or up to 1,000
      leva in minor cases — still a criminal conviction.[@wiki,dr,nr2007] Most small cases end
      in the minor-case fine, but prison happens, and reform is a political taboo.[@dr]
      Distribution brings two to eight years or more.[@wiki,dr14]
    sources:
      - wiki
      - dr
      - nr2007
      - dr14
  production:
    status: medical
    text: >-
      A registered farmer who declares no conviction for a customs offence under articles 242 to
      242a, or a drug offence under articles 354a to 354c, of the Penal Code may grow hemp under
      a free three-year permit from the agriculture minister.[@mzh, ord1] The permit is for plants
      below 0.3% THC in the leaves and the flowering and fruiting tops, grown for fibre, for seed
      for feed or food, or for sowing seed.[@ord1] The grower declares that those leaves and tops
      will not be taken, used or processed, and a crop over 0.3% is destroyed.[@ord1] Article 29(1)
      of the narcotics act, in the consolidation that was read, still says below 0.2%.[@zknvp] That
      conflict is not treated here as a ruling on criminal liability for a crop between the two
      figures. Parliament rejected a bill to allow hemp processing in April 2024.[@bta24] No other
      production.
    sources:
      - mzh
      - ord1
      - zknvp
      - bta24
  products:
    text: >-
      CBD is not regulated as a drug: it cannot be produced in Bulgaria but may be imported and
      sold, and in May 2019 the food authorities certified one firm's CBD supplements for open
      sale. The risk lies in THC, for which the law sets no permitted trace amount, so a product
      containing any counts as a controlled preparation. Nothing with THC is legally sold.
    sources:
      - mondaq
      - nutra
  medical:
    text: >-
      No medical cannabis programme — unlike neighbouring Greece and Romania, there is not even a
      law on paper. A doctor who prescribes cannabis faces up to five years in prison and a fine of
      up to 3,000 leva. In October 2015 the national drugs council declared that Bulgaria had no
      need for medical marijuana, and since June 2016 licences for cannabis may be issued only for
      medical research.
    sources:
      - wiki
      - cmsg
      - dr16
  consequences:
    text: The retained sources do not establish collateral consequences beyond the penalties described above.
    sources: []
  driving:
    status: zero
    text: >-
      Driving after using drugs is an offence in itself, with no level set: police use a roadside
      test for seven drugs, marijuana among them, and a positive result opens criminal
      proceedings. Since July 2023 the fine is 1,000 to 5,000 leva, 2,000 to 10,000 for a repeat,
      and refusing a test after an accident brings up to a year in prison. The car is confiscated
      if the driver owns it, a rule the Constitutional Court upheld in July 2025.
    sources:
      - ccee22
      - sg23
      - bnr25
  arrests:
    text: >-
      The only yearly series found ends in 2006. Convictions for drug crimes of all kinds rose
      from 232 people in 2000 to 525 in 2003, 921 in 2005 and 1,587 in 2006, the year the
      penal code was amended. In 2006 prosecutors monitored 4,223 proceedings
      for acquiring or keeping drugs against 204 for dealing, and the sentence most often imposed
      by the courts was prison of up to three years. Figures by drug were not published, but
      cannabis was the most widely used. No recent national figures were found.
    sources:
      - nr2007
  planting:
    seeds: licensed
    seeds_trade: regulated
    clones: illegal
    clones_trade: banned
    text: >-
      Cannabis plants may be grown only by a registered farmer, for fibre, for seed for feed or
      food, or for sowing, under a permit from the agriculture minister.[@ord1] The ministry's
      permit is for plants below 0.3% THC in the leaves and flowering tops.[@mzh] Article 29 of
      the narcotics act, in the consolidation that was read, still says below 0.2%.[@zknvp] Seed
      not intended for sowing may be imported only by a licensed importer.[@zknvp] It may not be
      released for free circulation if more than 10% of it can germinate.[@cmsg]
    sources:
      - ord1
      - mzh
      - zknvp
      - cmsg
  hemp:
    status: standard
    text: >-
      Only registered farmers may grow hemp, for fibre, feed/food seed or sowing seed, under a
      free three-year agriculture-ministry permit for plants below 0.3% THC — though the
      narcotics act consolidation read still says 0.2%, a conflict not treated here as a
      liability ruling.[@ord1,mzh,zknvp] CBD cannot be produced domestically but may be
      imported and sold; any THC trace makes a product controlled.[@mondaq,nutra]
    sources:
      - ord1
      - mzh
      - zknvp
      - mondaq
      - nutra
  clubs:
    status: none
    text: >-
      No clubs are known. A Europe-wide survey of cannabis social clubs carried out in 2018 and 2019
      found, after online searches and contact with people in the field, that there did not seem to
      be any active club in Bulgaria. No law in Bulgaria provides for them; Malta (since 2021) and
      Germany (since 2024) license non-profit cannabis associations, but only under their own laws.
      Nothing more recent was found.
    sources:
      - pardal20
      - de_cang
      - mt_cap628
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. Possession carries one to six years in
      prison and a fine of up to 10,000 leva under Article 354a of the Penal Code, with a fine
      alone possible in minor cases.
    sources:
      - dr
      - nr2007
      - wiki
  black_market:
    text: >-
      The EU drugs agency's statistical bulletin records 10,759 kg of herbal cannabis and
      5.4 kg of cannabis resin seized in Bulgaria in 2024, against 9,721 kg and 19 kg in
      2023. Herbal cannabis was seized on 3,332 occasions and resin on 56. Plant seizures came to 34,558 plants. Countries record seizures differently, so the figures are
      not comparable across borders.
    sources:
      - euda_szr
