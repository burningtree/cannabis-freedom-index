name: Bulgaria
region: Europe
iso_numeric: 100
recreational: illegal
medical: none
updated: '2026-10-28'
summary: >-
  A 'high-risk' drug: one to six years for possession, with a fine of up to €511.29 for minor cases
  that still counts as a conviction.
scores:
  possession: 1
  cultivation: 0
  enforcement: 2
  sharing: 0
  consumption: 1
  access: 0
segments:
  possession:
    text: >-
      Cannabis is a high-risk drug.[@wiki] Ordinary possession carries one to six years and a fine of
      €1,022.58–5,112.92; a minor case carries a fine up to €511.29, still a criminal
      conviction.[@code,eurolaw,euro2026] These are the legacy BGN2,000–10,000 and BGN1,000 tariffs,
      converted at BGN1.95583 per euro and rounded to cents.[@code,eurolaw,euro2026] There has been no
      personal dose since the [2004 single-dose repeal](/history/bulgaria-personal-dose-abolished-2004/).
    sources:
      - wiki
      - code
      - eurolaw
      - euro2026
    currency: EUR
    penalties:
      - label: Possession of a high-risk drug
        treatment: criminal
        term: Possession
        fine: 5112.92
        prison_min: 1 year
        prison: 6 years
        note: Prison and a fine; legacy BGN tariff converted at the official rate
        fine_min: 1022.58
      - label: Minor possession case
        treatment: criminal
        term: Possession
        fine: 511.29
        note: Fine instead of prison; still a criminal conviction
  cultivation:
    text: >-
      Cultivation is a crime with prison terms; the penal code has a separate offence for growing
      hemp-type plants.[@wiki] In 2014 a multiple sclerosis patient with two plants was fined 1,000 leva
      on appeal after a first acquittal.[@nr2007,dr]
    sources:
      - wiki
      - nr2007
      - dr
    penalties:
      - label: Unlicensed growing
        treatment: criminal
        term: Cultivation
        note: Crime with prison terms; tariff not stated in retained sources
      - label: Hemp-type plants
        treatment: criminal
        term: Cultivation
        note: Separate penal-code offence
      - label: Licensed hemp
        treatment: legal
        term: Hemp
        note: Free three-year permit, below 0.3% THC
  enforcement:
    text: >-
      Most small cases end in the minor-case fine, but prison sentences for possession do occur, and
      reform is described as a political taboo.[@dr]
    sources:
      - dr
  sharing:
    text: Distribution carries two to eight years or more.[@wiki,dr14]
    sources:
      - wiki
      - dr14
    penalties:
      - label: Distribution
        treatment: criminal
        term: Distribution
        prison_min: 2 years
        prison: 8 years
        note: Two to eight years or more
  consumption:
    text: Use is not separately punished, but possession is.[@dr]
    sources:
      - dr
  access:
    text: None. Production, import and sale are prohibited, and nothing containing THC is legally sold.[@wiki,cmsg]
    sources:
      - wiki
      - cmsg
words:
  - { word: Трева, lang: Bulgarian, meaning: "literally grass; colloquial for weed (marijuana)", sources: [wiktionary-treva] }
  - { word: Марихуана, lang: Bulgarian, meaning: "synonym of the colloquial sense", sources: [wiktionary-treva] }
  - { word: Коноп, lang: Bulgarian, meaning: "hemp; the standard fibre word", sources: [wiktionary-konop] }
context:
  recreational:
    text: >-
      There is no legal recreational supply. Cannabis is a class A high-risk drug with heroin and
      cocaine: possession brings one to six years and up to €5,112.92, or up to €511.29 in minor cases
      — still a criminal conviction.[@wiki,dr,nr2007] Most small cases end in the minor-case fine, but
      prison happens, and reform is a political taboo.[@dr] Distribution brings two to eight years or
      more.[@wiki,dr14] Euro amounts apply the 2026 conversion at BGN1.95583 per euro and statutory
      cent rounding.[@euro2026,eurolaw] Nothing with THC is legally sold: CBD may be imported
      and sold, but a product with any THC trace counts as a controlled preparation.[@mondaq,nutra]
    sources:
      - wiki
      - dr
      - nr2007
      - dr14
      - mondaq
      - nutra
      - euro2026
      - eurolaw
  production:
    status: hemp
    text: >-
      A registered farmer who declares no conviction for a customs offence under articles 242 to
      242a, or a drug offence under articles 354a to 354c, of the Penal Code may grow hemp under
      a free three-year permit from the agriculture minister.[@mzh, ord1] The permit is for plants
      below 0.3% THC in the leaves and the flowering and fruiting tops, grown for fibre, for seed
      for feed or food, or for sowing seed.[@ord1] The grower declares that those leaves and tops
      will not be taken, used or processed, and a crop over 0.3% is destroyed.[@ord1] Article 29(1)
      of the narcotics act, in the consolidation that was read, still says below 0.2%.[@zknvp] That
      conflict is not treated here as a ruling on criminal liability for a crop between the two
      figures. Parliament rejected a bill to allow hemp processing in [April 2024](/history/bulgaria-hemp-processing-bill-rejected-2024/).[@bta24] No other
      production.
    sources:
      - mzh
      - ord1
      - zknvp
      - bta24
  medical:
    text: >-
      No medical cannabis programme — unlike neighbouring Greece and Romania, there is not even a law
      on paper. A doctor who prescribes cannabis faces up to five years in prison and a fine of up to
      €1,533.88. In October 2015 the national drugs council declared that Bulgaria had no need for
      medical marijuana, and since June 2016 licences for cannabis may be issued only for medical
      research.[@wiki,cmsg,dr16] Euro amounts apply the 2026 conversion at BGN1.95583 per euro and
      statutory cent rounding.[@euro2026,eurolaw]
    sources:
      - wiki
      - cmsg
      - dr16
      - euro2026
      - eurolaw
  consequences:
    text: The retained sources do not establish collateral consequences beyond the penalties described above.[@dr,code]
    sources:
      - dr
      - code
  driving:
    status: zero
    text: >-
      Driving after using drugs is an offence in itself, with no level set: police use a roadside test
      for seven drugs, marijuana among them, and a positive result opens criminal proceedings.[@ccee22] Since
      July 2023 the fine is €511.29–2,556.46, €1,022.58–5,112.92 for a repeat, and refusing a test
      after an accident brings up to a year in prison.[@sg23] The car is confiscated if the driver owns it, a
      rule the Constitutional Court upheld in July 2025.[@bnr25] Euro amounts apply the
      2026 conversion at BGN1.95583 per euro and statutory cent rounding.[@euro2026,eurolaw]
    sources:
      - ccee22
      - sg23
      - bnr25
      - euro2026
      - eurolaw
  arrests:
    text: >-
      The only yearly series found ends in 2006. Convictions for drug crimes of all kinds rose
      from 232 people in 2000 to 525 in 2003, 921 in 2005 and 1,587 in 2006, the year the
      penal code was amended.[@nr2007] In 2006 prosecutors monitored 4,223 proceedings
      for acquiring or keeping drugs against 204 for dealing, and the sentence most often imposed
      by the courts was prison of up to three years. Figures by drug were not published, but
      cannabis was the most widely used. No recent national figures were found.[@nr2007]
    sources:
      - nr2007
  planting:
    seeds: licensed
    seeds_trade: regulated
    clones: illegal
    clones_trade: banned
    text: >-
      Cannabis plants may be grown only by a registered farmer, for fibre, for seed for feed or
      food, or for sowing, under a permit from the agriculture minister.[@ord1] The ministry's
      permit is for plants below 0.3% THC in the leaves and flowering tops.[@mzh] Article 29 of
      the narcotics act, in the consolidation that was read, still says below 0.2%.[@zknvp] Seed
      not intended for sowing may be imported only by a licensed importer.[@zknvp] It may not be
      released for free circulation if more than 10% of it can germinate.[@cmsg]
    sources:
      - ord1
      - mzh
      - zknvp
      - cmsg
  hemp:
    status: standard
    text: >-
      Only registered farmers may grow hemp, for fibre, feed/food seed or sowing seed, under a
      free three-year agriculture-ministry permit for plants below 0.3% THC — though the
      narcotics act consolidation read still says 0.2%, a conflict not treated here as a
      liability ruling.[@ord1,mzh,zknvp] CBD cannot be produced domestically but may be
      imported and sold; any THC trace makes a product controlled.[@mondaq,nutra]
    sources:
      - ord1
      - mzh
      - zknvp
      - mondaq
      - nutra
  clubs:
    status: none
    text: >-
      No clubs are known. A Europe-wide survey of cannabis social clubs carried out in 2018 and 2019
      found, after online searches and contact with people in the field, that there did not seem to
      be any active club in Bulgaria.[@pardal20] No law in Bulgaria provides for them; Malta (since 2021) and
      Germany (since 2024) license non-profit cannabis associations, but only under their own laws.[@de_cang,mt_cap628]
      Nothing more recent was found.[@pardal20]
    sources:
      - pardal20
      - de_cang
      - mt_cap628
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. Possession carries one to six years in prison
      and a fine of up to €5,112.92 under Article 354a of the Penal Code, with a fine alone possible
      in minor cases.[@dr,nr2007,wiki] Euro amounts apply the 2026 conversion at BGN1.95583 per euro
      and statutory cent rounding.[@euro2026,eurolaw]
    sources:
      - dr
      - nr2007
      - wiki
      - euro2026
      - eurolaw
  black_market:
    text: >-
      The EU drugs agency's statistical bulletin records 10,759 kg of herbal cannabis and
      5.4 kg of cannabis resin seized in Bulgaria in 2024, against 9,721 kg and 19 kg in
      2023.[@euda_szr] Herbal cannabis was seized on 3,332 occasions and resin on 56. Plant seizures came to 34,558 plants. Countries record seizures differently, so the figures are
      not comparable across borders.[@euda_szr]
    sources:
      - euda_szr
  culture:
    text: >-
      Bulgaria's CBD market belongs to the [CBD](/culture/language/cbd/) atlas entry: CBD cannot
      be produced domestically but certified supplements have been openly sold since May
      2019.[@mondaq,nutra]
    sources:
      - mondaq
      - nutra
