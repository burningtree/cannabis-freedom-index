segments:
  possession:
    text: >-
      Cannabis is a class A 'high-risk' drug, grouped with heroin and cocaine. Possession carries
      one to six years in prison and a fine of up to 10,000 leva under Article 354a of the Penal
      Code. For 'minor cases' a separate provision allows a fine of up to 1,000 leva instead — still
      a criminal conviction, not an administrative penalty.
    sources:
      - wiki
      - dr
      - nr2007
  cultivation:
    text: >-
      Cultivation is a crime with prison terms; the penal code has a separate offence for growing
      hemp-type plants. In 2014 a multiple sclerosis patient with two plants was fined 1,000 leva
      on appeal after a first acquittal.
    sources:
      - wiki
      - nr2007
      - dr
  enforcement:
    text: >-
      Most small cases end in the minor-case fine, but prison sentences for possession do occur, and
      reform is described as a political taboo.
    sources:
      - dr
  sharing:
    text: Distribution carries two to eight years or more.
    sources:
      - wiki
      - dr14
  consumption:
    text: Use is not separately punished, but possession is.
    sources:
      - dr
  access:
    text: None. Production, import and sale are prohibited, and nothing containing THC is legally sold.
    sources:
      - wiki
      - cmsg
context:
  production:
    text: >-
      Registered farmers with no drug or customs convictions may grow hemp with less than 0.2% THC
      under a free three-year licence from the agriculture minister, after declaring that no part
      of the plant will be separated or processed. Only the stems and seeds may be processed, for
      fibre, feed or sowing seed; leaves and flowers are still treated as a source of marijuana.
      Parliament rejected a bill to allow hemp processing in April 2024. No other production.
    sources:
      - mondaq
      - bta24
  products:
    text: >-
      CBD is not regulated as a drug: it cannot be produced in Bulgaria but may be imported and
      sold, and in May 2019 the food authorities certified one firm's CBD supplements for open
      sale. The risk lies in THC, for which the law sets no permitted trace amount, so a product
      containing any counts as a controlled preparation. Nothing with THC is legally sold.
    sources:
      - mondaq
      - nutra
  medical:
    text: >-
      No medical cannabis programme — unlike neighbouring Greece and Romania, there is not even a
      law on paper. A doctor who prescribes cannabis faces up to five years in prison and a fine of
      up to 3,000 leva. In October 2015 the national drugs council declared that Bulgaria had no
      need for medical marijuana, and since June 2016 licences for cannabis may be issued only for
      medical research.
    sources:
      - wiki
      - cmsg
      - dr16
  consequences:
    text: The retained sources do not establish collateral consequences beyond the penalties described above.
    sources: []
  driving:
    status: zero
    text: >-
      Driving after using drugs is an offence in itself, with no level set: police use a roadside
      test for seven drugs, marijuana among them, and a positive result opens criminal
      proceedings. Since July 2023 the fine is 1,000 to 5,000 leva, 2,000 to 10,000 for a repeat,
      and refusing a test after an accident brings up to a year in prison. The car is confiscated
      if the driver owns it, a rule the Constitutional Court upheld in July 2025.
    sources:
      - ccee22
      - sg23
      - bnr25
  arrests:
    text: >-
      The only yearly series found ends in 2006. Convictions for drug crimes of all kinds rose
      from 232 people in 2000 to 525 in 2003, 921 in 2005 and 1,587 in 2006, the year the
      penal code was amended. In 2006 prosecutors monitored 4,223 proceedings
      for acquiring or keeping drugs against 204 for dealing, and the sentence most often imposed
      by the courts was prison of up to three years. Figures by drug were not published, but
      cannabis was the most widely used. No recent national figures were found.
    sources:
      - nr2007
  planting:
    seeds: licensed
    seeds_trade: regulated
    clones: illegal
    clones_trade: banned
    text: >-
      Cannabis plants may be grown only for fibre, for seed for animal feed or sowing, with
      less than 0.2% THC and a licence from the agriculture minister. Seed not intended for
      sowing may be imported only by licensed importers and may not be released for free
      circulation if more than 10% of it can germinate.
    sources:
      - cmsg
  clubs:
    status: none
    text: >-
      No clubs are known. A Europe-wide survey of cannabis social clubs carried out in 2018
      and 2019 found, after online searches and contact with people in the field, that there
      did not seem to be any active club in Bulgaria. The model is prohibited throughout the
      European Union. Nothing more recent was found.
    sources:
      - pardal20
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. British travel advice says the
      authorities treat all drug offences very seriously and that any foreign national
      convicted can expect a prison sentence; illegal drugs, including cannabis, carry severe
      penalties, also for passengers in transit. Airport scanners are also used on the baggage
      of passengers in transit.
    sources:
      - wiki
      - fcdo
