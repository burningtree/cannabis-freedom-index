name: Guernsey
region: Europe
iso_numeric: 831
dependency:
  of: gb
  kind: Crown Dependency
  note: >-
    The Bailiwick of Guernsey, which includes Alderney and Sark, is a self-governing Crown
    Dependency. It is not part of the United Kingdom and makes its own drug laws; the United Kingdom
    answers for it internationally, including under the UN drug conventions.
recreational: illegal
medical: legal
updated: '2026-10-28'
summary: >-
  Recreational possession remains criminal, with fines common in small cases and much harsher
  treatment for imports. Medical cannabis is available privately. Certain CBD preparations have a
  retail exemption, with an age restriction applying from October 2026.
scores:
  possession: 1
  cultivation: 1
  enforcement: 2
  sharing: 1
  consumption: 1
  access: 2
segments:
  possession:
    text: >-
      Unauthorised Class B possession carries up to ten years in prison on indictment, a fine, or
      both under the Misuse of Drugs Law.[@law] Small court cases commonly bring fines; a 2019 case
      involving 2.44 g resulted in £650.[@be19] Home Affairs said in 2023 that people whose only
      offence was small-quantity possession were not receiving custodial sentences.[@be23]
    sources:
      - law
      - be19
      - be23
    penalties:
      - label: Unauthorised Class B possession; indictment
        treatment: criminal
        term: Possession of a controlled drug
        prison: 10 years
        note: Prison or an uncapped criminal fine, or both; summary proceedings have lower limits
  cultivation:
    text: >-
      Unlicensed cannabis cultivation carries up to fourteen years on indictment, a fine, or
      both.[@law] In a 2024 four-plant case, the court imposed 240 hours of community service in
      place of two years in prison and a £5,000 fine.[@gp24]
    sources:
      - law
      - gp24
    penalties:
      - label: Unlicensed cannabis cultivation; indictment
        treatment: criminal
        term: Cultivation of cannabis plant
        prison: 14 years
        note: Prison or an uncapped criminal fine, or both; summary proceedings have lower limits
  enforcement:
    text: >-
      In 2023 Home Affairs said small-quantity possession cases, where no other offence was
      involved, were not receiving custodial outcomes, while acknowledging inconsistent use of
      alternatives.[@be23] Imports remain treated much more harshly than small domestic possession
      cases.[@be26]
    sources:
      - be23
      - be26
  sharing:
    text: >-
      Supplying a Class B drug or possessing it with intent to supply carries up to twenty-one years
      on indictment, a fine, or both.[@law] Supply is an offence without a separate exemption for
      unpaid gifts.[@law]
    sources:
      - law
    penalties:
      - label: Supply or possession with intent to supply; indictment
        treatment: criminal
        term: Supply of a controlled drug
        prison: 21 years
        note: Prison or an uncapped criminal fine, or both; summary proceedings have lower limits
  consumption:
    text: >-
      Unauthorised personal use is dealt with through possession rules.[@law] Patients can use
      prescribed cannabis, and a patient-only social lounge was operating by January
      2025.[@mhc,lounge2025]
    sources:
      - law
      - mhc
      - lounge2025
  access:
    text: >-
      Local doctors may prescribe cannabis products privately, and islanders may arrange imports
      against UK or Jersey prescriptions through the [licensing route introduced in
      2020](/history/guernsey-medical-access-2020/).[@mhc] Individual import licences cost £30 per
      shipment, and the patient handles communication with the prescribing clinic and
      pharmacy.[@mhc]
    sources:
      - mhc
context_not_applicable:
  death_penalty:
    text: >-
      Guernsey abolished the death penalty for murder in 1964 and for all offences in 2003; no
      cannabis offence carries a capital sentence.[@wikipdp]
    sources:
      - wikipdp
context:
  recreational:
    text: >-
      Recreational possession and growing remain criminal offences, with fines common for small
      possession cases.[@law,be19] Importing cannabis is treated separately and much more
      severely.[@be26] A [2026 proposal to examine a regulated access
      pilot](/history/guernsey-cannabis-working-group-withdrawn-2026/) was withdrawn, leaving the
      existing recreational rules in place.[@pilot2026]
    sources:
      - law
      - be19
      - be26
      - pilot2026
  production:
    status: medical
    text: >-
      Guernsey has a medicinal cannabis cultivation licensing route overseen through its Cannabis
      Agency.[@industry2026] In March 2026 the economic-development committee described its work on
      revised cultivation licensing with Health & Social Care. It reported limited business interest
      and a costly process requiring sustained investment to meet regulatory
      requirements.[@industry2026]
    sources:
      - industry2026
  medical:
    text: >-
      Islanders can obtain pharmaceutical-standard cannabis medicines through private prescriptions
      from local doctors, or arrange licensed imports using UK or Jersey prescriptions.[@mhc]
      Individual imports require a prescription sent directly by the clinic, an online application
      and a £30 licence for each shipment.[@mhc] The destination must be the patient’s residence,
      and the patient forwards the issued licence to the dispensing pharmacy.[@mhc]
    sources:
      - mhc
  consequences:
    text: >-
      An individual medical import requires a licence matching the prescription and shipment, so a
      prescription alone does not complete the import process.[@mhc] Small recreational possession
      can still produce a court fine and conviction.[@be19] In
      [2023](/history/guernsey-non-punitive-review-stalls-2023/), Home Affairs acknowledged that
      available alternatives might not be used consistently by the courts.[@be23]
    sources:
      - mhc
      - be19
      - be23
  clubs:
    text: >-
      The Green Retreat operates a patient social lounge where entry requires proof of a cannabis
      prescription and identification showing the visitor is at least eighteen.[@lounge2025] ITV
      described it in January 2025 as a self-regulating venue rather than a government-licensed
      recreational supply association.[@lounge2025] The service provides a shared setting for
      patients to use their own medication.[@lounge2025]
    sources:
      - lounge2025
    status: tolerated
  visitors:
    text: >-
      There is no recreational purchasing route for visitors.[@law] A December 2025 visitor case
      involving 16.15 g imported from Poole resulted in a twelve-month sentence suspended for two
      years and a £1,000 fine.[@be26] The personal medical import process requires a matching
      licence and a Guernsey residential delivery address.[@mhc]
    sources:
      - law
      - be26
      - mhc
    status: none
  hemp:
    text: >-
      Hemp flower is outside the retail CBD exemption because exempt products must contain no plant
      material visible to the naked eye.[@cbd] The official guidance describes labelled preparations
      containing at most 2.5% CBD and 0.1% CBN and its derivatives, including THC, relative to total
      weight, or an aggregate CBN-and-derivatives limit of 3% relative to CBD content.[@cbd] The
      required cannabinoid percentage must be confirmed by the States Analyst or an accredited
      laboratory; other controlled drugs are excluded.[@cbd] From [1 October
      2026](/history/guernsey-cbd-products-age-limit-2026/), specified THC-containing CBD
      preparations cannot be supplied or offered to under-18s.[@age2026] Cannabis cultivation itself
      still needs permission.[@law]
    sources:
      - cbd
      - age2026
      - law
    status: none
  culture:
    text: >-
      The [Green Retreat patient lounge](/history/guernsey-patient-lounge-operating-2025/) gives
      medical users somewhere to meet and use their prescriptions socially.[@lounge2025] Founder
      Bruce Caruso described a place where patients could feel safe using medication
      responsibly.[@lounge2025] Its admission requirements distinguish that patient community from
      the recreational market.[@lounge2025]
    sources:
      - lounge2025
  planting:
    text: >-
      Seeds separated from the rest of the plant are excluded from the law’s cannabis
      definition.[@law] Cultivating any cannabis plant still needs permission, so seed possession
      and germination have different legal consequences.[@law] A clone is a living plant and falls
      under the cultivation controls.[@law]
    sources:
      - law
    seeds: grey
    seeds_trade: open
    clones: licensed
    clones_trade: regulated
  black_market:
    text: >-
      The authorities have identified diversion of prescribed cannabis as a concern alongside the
      illegal market.[@diversionreport] A 2025 parliamentary response described a joint review of
      private prescribing practices, statistical evidence and intelligence, and gaps in data and
      oversight.[@diversionreport] It said most medicinal cannabis was prescribed privately and that
      prescribing clinics were not regulated like other controlled-drug
      prescribers.[@diversionreport]
    sources:
      - diversionreport
