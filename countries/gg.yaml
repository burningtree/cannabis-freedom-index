name: Guernsey
region: Europe
iso_numeric: 831
dependency:
  of: gb
  kind: Crown Dependency
  note: >-
    The Bailiwick of Guernsey, which includes Alderney and Sark, is a self-governing Crown
    Dependency. It is not part of the United Kingdom and makes its own drug laws; the United Kingdom
    answers for it internationally, including under the UN drug conventions.
recreational: illegal
medical: legal
updated: 2026-10-17
summary: >-
  Cannabis is a Class B drug and possession leads to a criminal conviction, usually with a fine of a
  few hundred pounds. Importing even a small amount is treated severely. Doctors may prescribe
  medical cannabis privately, and a review of non-punitive approaches to drug possession stalled in
  2023.
scores:
  possession: 1
  cultivation: 1
  enforcement: 2
  sharing: 1
  consumption: 1
  access: 2
segments:
  possession:
    text: >-
      Possession is a criminal offence that ends in a conviction. In 2019 the Magistrate's Court
      fined a man £650 for 2.44 g, with 32 days in prison if he did not pay, and his friend £400 for
      the 0.67 g found in the car.
    sources:
      - be19
  cultivation:
    text: >-
      Growing cannabis is prosecuted as production of a Class B drug, even for a few plants. In 2024
      the Royal Court gave a man who grew four plants in two tents 240 hours of community service in
      place of two years in prison, plus a £5,000 fine. In 2022 it jailed the organiser of a
      141-plant basement grow for four years.
    sources:
      - gp24
      - be22
  enforcement:
    text: >-
      Users found with small amounts are fined and convicted. In 2023 the Committee for Home Affairs
      said people whose only offence was possessing a small amount of drugs were not receiving
      custodial sentences, while admitting that the courts may not use non-punitive options
      consistently. Importation is treated much more harshly.
    sources:
      - be23
      - be26
  sharing:
    text: >-
      Supply is prosecuted as such and punished with prison: a 2022 case brought sentences of up to
      four years for supplying cannabis. No distinction is made for sharing without payment.
    sources:
      - be22
  consumption:
    text: >-
      Use is dealt with through the possession offence. There are no places where it is tolerated.
    sources:
      - be19
  access:
    text: >-
      No legal adult-use source. Local doctors may prescribe cannabis-based medicines privately and
      islanders can obtain them through an on-island clinic and pharmacy, or import a UK or Jersey
      prescription under licence; the patient bears the cost.
    sources:
      - mhc
context:
  production:
    text: >-
      No commercial cannabis production for adult use. Licensed routes exist only for importing and
      dispensing prescribed medicines.
    sources:
      - mhc
  products:
    text: >-
      Prescribed cannabis-based medicines that meet pharmaceutical standards. The health service
      funds only Epidyolex for two rare epilepsies, Sativex for some multiple sclerosis symptoms and
      nabilone for chemotherapy nausea.
    sources:
      - mhc
  medical:
    text: >-
      Guernsey doctors may prescribe privately, and residents can use an on-island clinic and
      pharmacy. Prescriptions from the UK or Jersey can be imported with an import licence for each
      prescription, at £30 per licence; importing without one is a criminal offence. The health
      committee will not fund cannabis medicines for chronic pain.
    sources:
      - mhc
  consequences:
    text: >-
      In July 2020 the States voted to draw up non-punitive options for possessing small amounts of
      drugs. In 2023 Home Affairs concluded that such approaches already existed and said the work
      had all but paused; a separate review of a legal framework for cannabis was shelved.
    sources:
      - gp20
      - be23
  clubs:
    status: none
    text: >-
      No cannabis clubs are known. Supply is prosecuted with prison sentences.
    sources:
      - be22
  visitors:
    status: none
    text: >-
      There is no legal supply for anyone. In December 2025 the Royal Court gave a visitor who
      brought 16.15 g from Poole a 12-month prison sentence, suspended for two years, and a £1,000
      fine. The court said importation carries up to 21 years and the guideline starting point for
      importing up to 2 kg is three years in prison.
    sources:
      - be26
