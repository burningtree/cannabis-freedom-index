segments:
  possession:
    text: >-
      Without paperwork, the only protection is the long-standing rule that up to 5 g is not
      prosecuted. In June 2021 the Supreme Court struck down the ban on adult personal use, but the
      right is exercised through an individual permit from the health regulator COFEPRIS, which
      allows possession of up to 28 g. Without a permit, anything over 5 g can still be prosecuted.
      The Supreme Court has twice protected individuals held with more, in May 2022 and February
      2026, telling judges to weigh whether the cannabis was for personal use, but in 2026 it fell
      one vote short of removing the limit for everyone.
    sources:
      - cms
      - tms
      - zeta22
      - imp26
  cultivation:
    text: >-
      Legal only with a COFEPRIS permit, which authorises growing for your own use — in practice up
      to six plants, eight for households with two or more adults. The permit requires a formal
      application, and obtaining legal seeds is itself a problem. Growing without one is a crime.
    sources:
      - rmn
      - giq
  enforcement:
    text: >-
      Small-scale users are often released, but extortion and arbitrary detention over possession
      are widely reported. Possession above the thresholds and any supply are federal crimes with
      prison.
    sources:
      - tms
      - cms
  sharing:
    text: >-
      Permits are strictly personal and do not allow supplying anyone else. Any transfer remains an
      offence.
    sources:
      - rmn
      - cms
  consumption:
    text: >-
      Permit holders may consume in private, not in front of minors or non-consenting people, and
      not in public. Police treatment of public use varies widely by city.
    sources:
      - rmn
      - tms
  access:
    text: >-
      There are no legal recreational sales or licensed dispensaries. A narrow medical route permits
      prescribed cannabis medicines, including personal imports with prior COFEPRIS approval.
      Unlicensed members-only shops and clubs operate through local tolerance, injunctions or
      purported gifts, but they are not a lawful retail market.
    sources:
      - dof
      - cms
      - yuc
context:
  production:
    text: >-
      Medical and industrial licences exist on paper since 2021 regulations; adult-use commercial
      production is not permitted.
    sources:
      - dof
      - cms
      - giq
  products:
    text: >-
      Low-THC and CBD products are sold; a handful of medical products are registered. No legal THC
      retail products. The health regulator has contested the CBD trade: in July 2023 it seized
      1,811 products from a national shop chain and said such sales fell outside health rules.
    sources:
      - cms
      - zeta23
  medical:
    text: >-
      Medical cannabis was legalised in 2017 and regulations were issued in 2021, allowing
      prescription and import of approved products. Availability is limited.
    sources:
      - cms
  consequences:
    text: >-
      The permit creates a record of your use with a federal agency. Cases under 5 g are closed
      without a conviction.
    sources:
      - rmn
      - cms
  planting:
    seeds: licensed
    seeds_trade: banned
    clones: licensed
    clones_trade: banned
    text: >-
      After the Supreme Court's 2021 ruling an adult can apply to the health regulator
      COFEPRIS for a personal-use permit, which covers acquiring seed, sowing, growing and
      harvesting. The regulator was left to define how seed may be acquired, and the permit
      does not allow importing, selling or distributing, so there is no legal seed trade.
      The health regulator still treats cannabis seeds as narcotics under the health law. In
      practice, street stands on some major avenues sell plants and seeds openly.
    sources:
      - tele
      - zeta23
      - yuc
  clubs:
    status: tolerated
    text: >-
      No law provides for cannabis clubs, and Congress has never passed the regulation the
      Supreme Court called for, so clubs work in a grey zone across the country. They lean on
      the constitutional freedom of association and on members' personal permits or court
      injunctions, which one drug-policy researcher calls a semi-legal backing that does not
      cover any sale. The first, Club Xochipilli, opened in Mexico City in December 2015 after
      the court's first ruling. Because clubs are private, barely advertise and are
      unregistered, nobody can count them, but specialists describe a boom, with
      chains now present in Mexico City, the State of Mexico, Baja California and Quintana
      Roo, and clubs in Guadalajara. Typically a member registers with official ID and pays a
      daily, monthly or yearly fee; cannabis is handed over as a gift or against a 'donation'
      converted into points, and some clubs ask for an injunction or a prescription.
      Authorities mostly tolerate them, which researchers call selective inaction; clubs are
      short-lived, supply often comes from the illegal market, and raids, though reported as
      rare, still happen.
    sources:
      - mil25
      - ceo19
      - yuc
  arrests:
    text: >-
      Mexico's statistics office does not separate cannabis from other drugs. At the end of
      2023, 9.4% of the 232,003 people in prison, more than 21,000, were held for drug
      offences: 14,867 for street-level dealing, a category that takes in many cases of simple possession, and 7,021 for trafficking. Rates in state
      prisons were highest in Durango, Sonora and Chihuahua.
    sources:
      - uno25
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. British travel advice says penalties
      for drug offences are severe, with sentences of up to 25 years, and advises visitors not
      to become involved with drugs of any kind.
    sources:
      - cms
      - giq
      - yuc
      - fcdo
