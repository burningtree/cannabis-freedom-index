segments:
  possession:
    text: >-
      Cannabis is a Class B narcotic under the Narcotics Act 1967. Possession carries a maximum of
      14 years in prison. Courts sentence well below that for small amounts, but custodial sentences
      for a few joints or seeds are not unusual.
    sources:
      - wiki
  cultivation:
    text: Cultivating cannabis, or even possessing a seed, carries a maximum of 14 years.
    sources:
      - wiki
  enforcement:
    text: One of the Pacific's stricter approaches, with prison used for small amounts.
    sources:
      - wiki
      - so2
  sharing:
    text: Supply carries heavier penalties.
    sources:
      - wiki
  consumption:
    text: Use is an offence under the Narcotics Act.
    sources:
      - wiki
  access:
    text: None.
    sources:
      - wiki
context:
  production:
    text: None; a proposal to allow cultivation was rejected by the prime minister.
    sources:
      - so2
  products:
    text: None.
    sources:
      - wiki
  medical:
    text: >-
      None. The Samoa Law Reform Commission recommended a regulated medicinal cannabis regime in its
      2017 final report on the Narcotics Act; the government did not adopt it.
    sources:
      - so1
      - wiki
  consequences:
    text: A conviction is a criminal record.
    sources:
      - wiki
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited.
    sources:
      - wiki
  planting:
    seeds: illegal
    seeds_trade: banned
    clones: illegal
    clones_trade: banned
    text: >-
      The Narcotics Act 1967 makes it an offence both to cultivate a prohibited plant and to
      have in one's possession the seed of a prohibited plant, each with a maximum of 14 years
      in prison. Cannabis is among the prohibited plants, so seeds and living plants are
      equally banned.
    sources:
      - na67
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. British travel advice says possession
      of illegal drugs carries a possible 14-year prison sentence.
    sources:
      - wiki
      - fcdo
  driving:
    status: impairment
    text: >-
      The Road Traffic Ordinance's section 40(3) prohibits driving or attempting to drive
      when alcohol, one or more drugs, or their combination makes proper vehicle control
      impossible. A charge involving drugs must identify at least one relevant drug.
      The definition includes narcotics and any other substance that can impair driving,
      so it is not limited to illegal cannabis. The 2023 consolidation provides a fine up
      to 50 penalty units, up to five years' imprisonment, or both. Conviction normally
      brings twelve months' licence disqualification, subject to special reasons and the
      court's power to impose a longer period. The numerical limits in section 40(1)–(2)
      are for alcohol; no quantified THC allowance is given for the drug-impairment offence.
    sources:
      - traffic2023
