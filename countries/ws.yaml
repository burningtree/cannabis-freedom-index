segments:
  possession:
    text: >-
      Cannabis is a Class B narcotic under the Narcotics Act 1967. Possession carries a maximum of
      14 years in prison. Courts sentence well below that for small amounts, but custodial sentences
      for a few joints or seeds are not unusual.
    sources:
      - wiki
  cultivation:
    text: Cultivating cannabis, or even possessing a seed, carries a maximum of 14 years.
    sources:
      - wiki
  enforcement:
    text: One of the Pacific's stricter approaches, with prison used for small amounts.
    sources:
      - wiki
      - so2
  sharing:
    text: Supply carries heavier penalties.
    sources:
      - wiki
  consumption:
    text: Use is an offence under the Narcotics Act.
    sources:
      - wiki
  access:
    text: None.
    sources:
      - wiki
context:
  production:
    text: None; a proposal to allow cultivation was rejected by the prime minister.
    sources:
      - so2
  products:
    text: None.
    sources:
      - wiki
  medical:
    text: >-
      None. The Samoa Law Reform Commission recommended a regulated medicinal cannabis regime in its
      2017 final report on the Narcotics Act; the government did not adopt it.
    sources:
      - so1
      - wiki
  consequences:
    text: A conviction is a criminal record.
    sources:
      - wiki
