name: Samoa
region: Oceania
iso_numeric: 882
recreational: illegal
medical: none
updated: '2026-10-26'
summary: >-
  Possession carries up to 14 years; a 2017 recommendation to allow medicinal cannabis was not
  adopted.
scores:
  possession: 1
  cultivation: 1
  enforcement: 1
  sharing: 1
  consumption: 1
  access: 0
segments:
  possession:
    text: >-
      Cannabis plant material is listed in the Second Schedule (Class B), item 40; processed
      cannabis preparations and cannabis resin are also listed there. Knowing unauthorised
      possession under section 7 carries up to fourteen years under section 18. The lower
      non-wilful/procedural alternative is subject to the statutory conditions.[@ag2023] The Law
      Reform Commission reported that sentences imposed were lower than the maximum.[@lrc17]
    sources:
      - ag2023
      - lrc17
  cultivation:
    text: >-
      Section 6 of the Narcotics Act prohibits cultivating a prohibited plant or possessing any of
      its seed; the Law Reform Commission gives the maximum as 14 years in prison.
    sources:
      - lrc17
  enforcement:
    text: One of the Pacific's stricter approaches, with prison used for small amounts.
    sources:
      - wiki
      - so2
  sharing:
    text: >-
      Supplying or administering an illegal drug to another person is an offence under section 7
      of the Narcotics Act, as is attempting to.
    sources:
      - lrc17
  consumption:
    text: >-
      Use is an offence under section 7 of the Narcotics Act, which covers procuring, consuming
      and smoking as well as possession.
    sources:
      - lrc17
  access:
    text: >-
      None: the Narcotics Act makes possessing, using, supplying and growing cannabis offences,
      apart from the exemptions the Act itself provides.
    sources:
      - lrc17
context:
  production:
    text: None; a proposal to allow cultivation was rejected by the prime minister.
    sources:
      - so2
  products:
    text: None.
    sources:
      - wiki
  medical:
    text: >-
      None. The Samoa Law Reform Commission recommended a regulated medicinal cannabis regime in its
      2017 final report on the Narcotics Act; the government did not adopt it.
    sources:
      - so1
      - wiki
  consequences:
    text: A conviction is a criminal record.
    sources:
      - wiki
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited.
    sources:
      - wiki
  planting:
    seeds: illegal
    seeds_trade: banned
    clones: illegal
    clones_trade: banned
    text: >-
      The Narcotics Act 1967 makes it an offence both to cultivate a prohibited plant and to
      have in one's possession the seed of a prohibited plant, each with a maximum of 14 years
      in prison. Cannabis is among the prohibited plants, so seeds and living plants are
      equally banned.
    sources:
      - na67
  visitors:
    status: none
    text: >-
      There is no legal recreational supply. Unauthorised cannabis possession, use or supply falls
      under the Class B maximum of fourteen years. Section 6 separately punishes prohibited-plant
      cultivation and seed possession with up to fourteen years, subject to its non-wilful
      alternative.[@ag2023]
    sources:
      - ag2023
  driving:
    status: impairment
    text: >-
      The Road Traffic Ordinance's section 40(3) prohibits driving or attempting to drive
      when alcohol, one or more drugs, or their combination makes proper vehicle control
      impossible. A charge involving drugs must identify at least one relevant drug.
      The definition includes narcotics and any other substance that can impair driving,
      so it is not limited to illegal cannabis. The 2023 consolidation provides a fine up
      to 50 penalty units, up to five years' imprisonment, or both. Conviction normally
      brings twelve months' licence disqualification, subject to special reasons and the
      court's power to impose a longer period. The numerical limits in section 40(1)–(2)
      are for alcohol; no quantified THC allowance is given for the drug-impairment offence.
    sources:
      - traffic2023
  arrests:
    text: >-
      The Law Reform Commission's 2017 review gives no national arrest total but reports
      police figures on which offences are charged. The most common drug offence is
      possession of marijuana, and police told the Commission that most of those cases
      involve small quantities. Possession of seeds comes second and cultivation third;
      methamphetamine possession is less common. Reported cases peaked in 2012, 2014 and
      2015.
    sources:
      - lrc17
