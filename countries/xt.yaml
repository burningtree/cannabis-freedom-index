name: Transnistria
region: Europe
disputed:
  part_of: md
  note: >-
    Transnistria broke away from Moldova in 1990 and runs its own courts, police and criminal code.
    No UN member state recognises it; it is regarded internationally as part of Moldova, whose more
    lenient drug law is not applied there.
flag: "🏳️"
recreational: illegal
medical: none
updated: 2026-10-25
summary: >-
  Possession without intent to sell is a crime with up to three years in prison under Transnistria's
  own criminal code, and supply carries three to seven. Little else about its drug law could be
  confirmed.
scores:
  possession: 1
  cultivation: 1
  enforcement: 2
  sharing: 1
  consumption: 1
  access: 0
segments:
  possession:
    text: >-
      Article 226 of the Transnistrian criminal code punishes acquiring or keeping drugs without
      intent to sell, in a large amount, with up to three years in prison. The Russian code it is
      modelled on has no such standalone offence. How smaller amounts are handled could not be
      confirmed.
    sources:
      - mj
      - sc
  cultivation:
    text: >-
      Growing cannabis is a crime under the same chapter of the criminal code. No tolerated number
      of plants is known.
    sources:
      - mj
  enforcement:
    text: >-
      Prison is available even for possession for personal use. How often it is imposed for small
      amounts could not be confirmed.
    sources:
      - mj
      - sc
  sharing:
    text: >-
      Acquiring or keeping drugs in order to sell them, and making, transporting or selling them,
      carries three to seven years in prison, with or without confiscation of property.
    sources:
      - mj
  consumption:
    text: >-
      No information on a separate offence of use was found. Possession is prosecuted.
    sources:
      - mj
  access:
    text: >-
      No legal source.
    sources:
      - mj
context:
  production:
    text: >-
      None known.
    sources:
      - mj
  products:
    text: >-
      No legal cannabis products are known.
    sources:
      - mj
  medical:
    text: >-
      No medical cannabis programme is known.
    sources:
      - mj
  consequences:
    text: >-
      The 2023 reform added a one-year restriction on driving rights to the ordinary offence of
      drug use without a prescription, alongside its fine or administrative arrest. Specified
      public-use offences also carry the one-year restriction.[@admin,uselaw] A person without a
      licence cannot take a driving test during the restriction.[@vote]
    sources:
      - admin
      - uselaw
      - vote
  planting:
    seeds: grey
    seeds_trade: unclear
    clones: illegal
    clones_trade: banned
    text: >-
      The Supreme Court's guidance on drug cases says the local narcotics law bans cultivating
      hemp for illegal use, and that sowing means sowing seed or planting seedlings without
      permission on any land. The offence is complete at the moment of sowing, whether or not
      anything comes up. The guidance does not treat holding seeds as an offence in itself.
    sources:
      - sc
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited.
    sources:
      - mj
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone, so a visitor has no lawful way to buy
      cannabis. The sources behind this profile describe no separate rule for visitors.
    sources:
      - mj

