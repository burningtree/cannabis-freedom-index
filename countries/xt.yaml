  medical:
    text: No medical cannabis programme is known.
    sources:
      - mj
  consequences:
    text: >-
      The 2023 reform added a one-year restriction on driving rights to the ordinary offence of drug
      use without a prescription, alongside its fine or administrative arrest. Specified public-use
      offences also carry the one-year restriction.[@admin,uselaw] A person without a licence cannot
      take a driving test during the restriction.[@vote]
    sources:
      - admin
      - uselaw
      - vote
  planting:
    seeds: grey
    seeds_trade: unclear
    clones: illegal
    clones_trade: banned
    text: >-
      The Supreme Court’s 2004 guidance describes sowing as planting seeds or seedlings without
      permission on any land, with completion at the time of sowing. It also includes tending plants
      and improving varieties within cultivation.[@sc] Today the criminal offence requires a legally
      defined large scale; cultivation below that threshold is administrative.[@mj,admin]
    sources:
      - sc
      - mj
      - admin
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited.
    sources:
      - mj
  visitors:
    status: none
    text: >-
      The administrative code separately punishes foreign nationals and stateless people. Possession
      falling below the criminal offence carries a fine or up to thirty days’ arrest, with
      expulsion; use without a prescription carries a fine or up to fifteen days’ arrest, also with
      expulsion.[@admin]
    sources:
      - admin
