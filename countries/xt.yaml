name: Transnistria
region: Europe
disputed:
  part_of: md
  note: >-
    Transnistria broke away from Moldova in 1990 and runs its own courts, police and criminal code.
    No UN member state recognises it; it is regarded internationally as part of Moldova, whose more
    lenient drug law is not applied there.
flag: 🏳️
recreational: illegal
medical: none
updated: 2026-10-25
summary: >-
  Small possession can bring a fine or up to thirty days’ administrative arrest. Large personal
  possession can carry up to three years in prison. Growing below the criminal threshold brings a
  warning or fine; large-scale growing and supplying cannabis remain crimes.
scores:
  possession: 1
  cultivation: 2
  enforcement: 2
  sharing: 0
  consumption: 1
  access: 0
segments:
  possession:
    text: >-
      Possession without intent to supply is administrative when it falls below the criminal
      offence: a fine of 50–300 statutory calculation units or up to thirty days’ administrative
      arrest.[@admin] A legally defined large amount can bring a fine, work penalties or up to three
      years in prison; an especially large amount carries three to ten years.[@mj]
    sources:
      - admin
      - mj
  cultivation:
    text: >-
      Growing below the criminal threshold can bring a warning or a fine of up to fifty statutory
      calculation units.[@admin] Large-scale cultivation carries a fine, compulsory work or up to
      two years in prison; group cultivation or an especially large grow carries three to eight
      years. The president’s quantity rules determine the criminal threshold.[@mj]
    sources:
      - admin
      - mj
  enforcement:
    text: >-
      Personal possession can lead to custody through either administrative arrest, for up to thirty
      days, or a criminal prison sentence for a large amount.[@admin,mj] The criminal code also
      permits fines and work penalties for its ordinary personal-possession offence. The 2012 reform
      introduced those alternatives to a prison-only penalty.[@mj,reform]
    sources:
      - admin
      - mj
      - reform
  sharing:
    text: >-
      The Supreme Court’s drug-case guidance treats unpaid transfers, including gifts and loans, as
      supply alongside sales and exchanges.[@sc] The ordinary unlawful supply offence carries four
      to eight years in prison; aggravated tiers carry five to twelve or ten to twenty years.[@mj]
    sources:
      - sc
      - mj
  consumption:
    text: >-
      Using drugs without a doctor’s prescription is a separate administrative offence. Its ordinary
      penalty is a fine of 50–150 statutory calculation units or up to fifteen days’ arrest, with a
      one-year restriction on driving rights. The code exempts someone who voluntarily seeks medical
      treatment for that use from liability for the use offence.[@admin]
    sources:
      - admin
  access:
    text: No legal source.
    sources:
      - mj
context:
  production:
