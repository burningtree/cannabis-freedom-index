name: Ecuador
region: South America
iso_numeric: 218
recreational: decriminalised
medical: limited
updated: 2026-10-13
summary: >-
  The constitution treats use as a health issue, though the possession threshold table was repealed
  in 2023. Medical cannabis and hemp are legal.
scores:
  possession: 2
  cultivation: 1
  enforcement: 3
  sharing: 1
  consumption: 2
  access: 1
segments:
  possession:
    text: >-
      Article 364 of the constitution treats drug use as a health matter and forbids criminalising
      users. Until November 2023 a threshold table treated up to 10 g of cannabis as personal use;
      President Noboa repealed it, so there is now no safe amount. A person caught with any quantity
      must convince police and a judge that it is for their own use.
    sources:
      - wiki
      - lc
  cultivation:
    text: >-
      Growing cannabis with THC for personal use is not authorised. Only non-psychoactive cannabis
      under 1% THC may be cultivated, under licence.
    sources:
      - giq
      - wiki
  enforcement:
    text: >-
      The constitution protects users in principle, but since 2023 enforcement has hardened under an
      anti-micro-trafficking drive, and small-scale possession cases can lead to pre-trial
      detention.
    sources:
      - lc
      - eu
  sharing:
    text: Any supply is trafficking, graded by quantity.
    sources:
      - lc
  consumption:
    text: >-
      Use itself is not a crime under the constitution, but with the thresholds gone, anyone using
      in public risks being processed as a small-scale dealer.
    sources:
      - lc
      - eu
  access:
    text: No adult-use source. Low-THC medical and wellness products are sold legally.
    sources:
      - wiki
      - giq
context:
  production:
    status: medical
    text: >-
      The agriculture ministry issues several classes of licence for non-psychoactive cannabis and
      hemp (under 1% THC), which has attracted commercial growers.
    sources:
      - giq
  products:
    text: Hemp and low-THC products; prescription preparations with tight THC limits.
    sources:
      - wiki
      - giq
  medical:
    text: >-
      Medical cannabis was legalised in 2019, on prescription, limited largely to low-THC
      preparations.
    sources:
      - wiki
  consequences:
    text: >-
      No record if a case is closed as personal use; the risk lies in being charged as a dealer in
      the first place.
    sources:
      - lc
  planting:
    seeds: licensed
    seeds_trade: regulated
    clones: licensed
    clones_trade: regulated
    text: >-
      The agriculture ministry's Agreement 109 sets up seven licences for cannabis with less
      than 1% THC. Licence 1 covers importing and selling seeds or cuttings, and Licence 2
      sowing and producing them; only registered companies, cooperatives, associations and
      universities may apply. Nothing in the scheme covers seed or cuttings of psychoactive
      varieties.
    sources:
      - mag109
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and no law provides for them: any supply counts as
      trafficking, graded by quantity.
    sources:
      - lc
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone, so a visitor has no lawful way to buy
      cannabis. Whatever legal supply exists is medical, for patients with a prescription or
      registration. The sources behind this profile describe no separate rule for visitors.
    sources:
      - wiki
      - giq
  driving:
    status: impairment
    text: >-
      COIP article 384 penalises driving under the effects of narcotic or psychotropic
      substances with thirty days' deprivation of liberty and deduction of fifteen
      licence points; the vehicle is seized preventively for twenty-four hours. This
      is distinct from article 385's graded alcohol limits. Its special rule for
      public passenger, commercial and freight drivers states zero tolerance for
      consumption of narcotic or psychotropic substances and specifies ninety days'
      deprivation of liberty and loss of thirty points on exceeding the stated
      limit. That wording does not establish a numerical laboratory THC cutoff.
      Under article 376, a drug-influenced driver causing a crash that kills one or
      more people faces ten to twelve years and definitive licence revocation.
      These are the provisions in the government-hosted consolidation updated to
      24 October 2025; implementing drug-testing procedures and later amendments
      remain verification targets. No fixed waiting time after cannabis use is inferred.
    sources:
      - trafficcoip
  black_market:
    text: >-
      Figures reported by the government to the UN drugs office record 28,591 kg of herbal
      cannabis seized in 2024, against 19,514 kg in 2023. The UN publishes them as
      kilogram equivalents, and countries count seizures differently, so the figures are
      not comparable across borders.
    sources:
      - unodc_szr
