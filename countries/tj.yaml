name: Tajikistan
region: Asia
iso_numeric: 762
recreational: illegal
medical: none
updated: 2026-10-13
summary: Up to five years for personal-use quantities; long sentences for cultivation and trafficking.
scores:
  possession: 0
  cultivation: 0
  enforcement: 1
  sharing: 0
  consumption: 1
  access: 0
segments:
  possession:
    text: >-
      Illegal. In the English translation of the Criminal Code read for this profile, Article 201
      punishes illegally buying or keeping narcotics, without the aim of selling, with up to five
      years in prison, and five to ten years for a large amount. The translation is an older text;
      later amendments were not checked.
    sources:
      - cc
  cultivation:
    text: >-
      Article 204 of the Criminal Code, in the translation read, punishes illegally planting or
      growing plants that contain narcotics with five to ten years in prison, and ten to fifteen
      for a field of more than 0.10 hectares. A UN report for 2006 counted about 31 hectares of
      wild cannabis and just over one hectare of illicit cultivation, most of it for personal use.
    sources:
      - cc
      - wiki
  enforcement:
    text: >-
      Tajikistan sits on the main trafficking route from Afghanistan, and its drug laws are applied
      harshly, including against small-scale users.
    sources:
      - osf
  sharing:
    text: >-
      Article 200 of the Criminal Code, in the translation read, punishes selling narcotics, or
      making, buying or keeping them in order to sell, with five to ten years in prison for small
      amounts and twelve to fifteen for large amounts. Its heaviest tier names fifteen to twenty
      years or death; that wording comes from an older text and was not checked against the code
      in force.
    sources:
      - cc
  consumption:
    text: Use leads to registration and compulsory treatment.
    sources:
      - osf
  access:
    text: >-
      None: the Criminal Code punishes buying and keeping narcotics as well as selling them.
    sources:
      - cc
context:
  production:
    text: None.
    sources:
      - wiki
  products:
    text: None.
    sources:
      - wiki
  medical:
    text: The retained sources do not establish whether a medical cannabis programme operates.
    sources: []
  consequences:
    text: Registered users face restrictions and police attention.
    sources:
      - osf
  planting:
    seeds: grey
    seeds_trade: unclear
    clones: illegal
    clones_trade: banned
    text: >-
      Under the 1999 narcotics law, cultivating narcotic-containing plants is a state
      monopoly. Article 9 allows it only for scientific purposes, by licensed research
      institutions. The law defines cultivation as sowing and growing and does not mention
      seeds.
    sources:
      - l873
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. Acquiring or storing drugs in personal-
      use quantities carries up to five years in prison under Articles 200 to 204 of the
      Criminal Code.
    sources:
      - wiki
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited.
    sources:
      - wiki
  black_market:
    text: >-
      Figures reported by the government to the UN drugs office record 63.7 kg of herbal
      cannabis seized in 2024, against 90.3 kg in 2023, and 3,947 kg of cannabis resin
      seized in 2024, against 4,294 kg in 2023. The UN publishes them as kilogram
      equivalents, and countries count seizures differently, so the figures are not
      comparable across borders.
    sources:
      - unodc_szr
