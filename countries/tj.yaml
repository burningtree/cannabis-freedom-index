segments:
  possession:
    text: >-
      Illegal under Articles 200–204 of the Criminal Code. Acquiring or storing drugs in
      personal-use quantities carries up to five years in prison.
    sources:
      - wiki
  cultivation:
    text: >-
      Illegal. No reliable figure for the penalty was found. A UN report for 2006 counted about 31
      hectares of wild cannabis and just over one hectare of illicit cultivation, most of it for
      personal use.
    sources:
      - wiki
  enforcement:
    text: >-
      Tajikistan sits on the main trafficking route from Afghanistan, and its drug laws are applied
      harshly, including against small-scale users.
    sources:
      - osf
  sharing:
    text: >-
      A summary of Tajik law gives twenty-five years, or death, for selling; the death penalty
      figure could not be checked against the Criminal Code.
    sources:
      - wiki
  consumption:
    text: Use leads to registration and compulsory treatment.
    sources:
      - osf
  access:
    text: None.
    sources:
      - wiki
context:
  production:
    text: None.
    sources:
      - wiki
  products:
    text: None.
    sources:
      - wiki
  medical:
    text: The retained sources do not establish whether a medical cannabis programme operates.
    sources: []
  consequences:
    text: Registered users face restrictions and police attention.
    sources:
      - osf
  planting:
    seeds: grey
    seeds_trade: unclear
    clones: illegal
    clones_trade: banned
    text: >-
      Under the 1999 narcotics law, cultivating narcotic-containing plants is a state
      monopoly. Article 9 allows it only for scientific purposes, by licensed research
      institutions. The law defines cultivation as sowing and growing and does not mention
      seeds.
    sources:
      - l873
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. Acquiring or storing drugs in personal-
      use quantities carries up to five years in prison under Articles 200 to 204 of the
      Criminal Code.
    sources:
      - wiki
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited.
    sources:
      - wiki
  black_market:
    text: >-
      Figures reported by the government to the UN drugs office record 63.7 kg of herbal
      cannabis seized in 2024, against 90.3 kg in 2023, and 3,947 kg of cannabis resin
      seized in 2024, against 4,294 kg in 2023. The UN publishes them as kilogram
      equivalents, and countries count seizures differently, so the figures are not
      comparable across borders.
    sources:
      - unodc_szr
