name: Tajikistan
region: Asia
iso_numeric: 762
recreational: illegal
medical: none
updated: '2026-10-24'
summary: >-
  Personal possession and unauthorised growing remain criminal. The code’s lowest quantity bands
  allow a fine or up to two years in prison, with longer terms for larger amounts and aggravated
  cases.
scores:
  possession: 0
  cultivation: 0
  enforcement: 1
  sharing: 0
  consumption: 1
  access: 0
segments:
  possession:
    text: >-
      In the code’s lowest quantity band, unlawful possession without intent to supply carries a
      fine of 100–500 calculation units or up to two years in prison. The next band carries two
      to five years; aggravated or larger cases carry five to eight or eight to twelve
      years.[@code]
    sources:
      - code
  cultivation:
    text: >-
      Unauthorised cultivation in the lowest plant-count band carries a fine of 200–500
      calculation units or up to two years in prison. The next band carries two to five years;
      aggravated or larger grows carry five to eight or eight to twelve years. The code refers
      to a separate plant-count list.[@code]
    sources:
      - code
  enforcement:
    text: >-
      The Criminal Code permits prison for personal possession even in its lowest quantity
      band.[@code] A 2010 review involving officials and civil society criticised enforcement
      driven by arrest and conviction targets and called for greater focus on dealers and larger
      supply networks.[@reform]
    sources:
      - code
      - reform
  sharing:
    text: >-
      The drug law defines supply to another person to include gifts, exchanges, debt payments
      and loans as well as sales.[@law] The Criminal Code’s supply tiers run from up to five
      years in the lowest quantity band to five–eight, eight–twelve and twelve–twenty years in
      larger or aggravated cases.[@code]
    sources:
      - law
      - code
  consumption:
    text: >-
      The drug law prohibits use without a doctor’s prescription and provides for medical
      examination where there are sufficient grounds to suspect unlawful use. It requires
      registration of people diagnosed with dependence and people found to have used drugs
      unlawfully. Voluntary treatment and compulsory treatment are governed separately.[@law]
    sources:
      - law
  access:
    text: >-
      Unlawful buying and holding for personal use are criminal offences, and supply is punished
      separately.[@code] Lawful controlled-drug activities are licensed; scientific cultivation
      is reserved for licensed research institutions.[@law]
    sources:
      - code
      - law
context:
  production:
    text: >-
      Scientific cultivation of drug-containing plants is reserved for licensed research
      institutions. Manufacture and production of controlled drugs are subject to licensing and
      state quotas.[@law] Unauthorised production is covered by the Criminal Code’s personal-use
      or supply offences, depending on intent.[@code]
    sources:
      - law
      - code
  products:
    text: >-
      The Criminal Code separates personal possession from possession intended for supply and
      refers to a quantity annex for the different controlled substances. Its cultivation
      offence refers to a separate plant-count list.[@code] The drug law governs licensed
      controlled-drug production and distribution.[@law]
    sources:
      - code
      - law
  medical:
    text: >-
      The drug law provides licensed medical handling of controlled drugs and reserves
      scientific growing for licensed research institutions. It also prohibits non-prescribed
      use and regulates prescribing through the health ministry.[@law]
    sources:
      - law
  consequences:
    text: >-
      The drug law requires registration after a finding of unlawful drug use and provides
      follow-up observation after treatment for dependence.[@law] A 2010 review criticised
      discrimination in employment and family rights and weaknesses in patient confidentiality,
      recommending reforms to protect people who use drugs.[@reform]
    sources:
      - law
      - reform
  planting:
    seeds: grey
    seeds_trade: unclear
    clones: illegal
    clones_trade: banned
    text: >-
      The drug law defines cultivation as sowing and growing controlled plants and reserves
      scientific cultivation for licensed research institutions.[@law] The Criminal Code
      penalises unauthorised growing in plant-count bands, including a fine or up to two years
      in prison in the lowest band.[@code]
    sources:
      - law
      - code
  visitors:
    status: none
    text: >-
      Unlawful acquisition and possession for personal use can bring a fine or prison, and
      supply carries separate prison penalties.[@code] Lawful controlled-drug trade is licensed;
      the February 2026 amendment requires authorising documents for imports and
      exports.[@law,amend26]
    sources:
      - code
      - law
      - amend26
  clubs:
    status: none
    text: >-
      Giving drugs to another person falls within the drug law’s definition of supply.[@law]
      Organising or maintaining premises for drug consumption carries three to five years in
      prison, rising to five to ten in aggravated cases.[@code]
    sources:
      - law
      - code
  black_market:
    text: >-
      Figures reported by the government to the UN drugs office record 63.7 kg of herbal
      cannabis seized in 2024, against 90.3 kg in 2023, and 3,947 kg of cannabis resin seized in
      2024, against 4,294 kg in 2023. The UN publishes them as kilogram equivalents, and
      countries count seizures differently, so the figures are not comparable across borders.
    sources:
      - unodc_szr
