segments:
  possession:
    text: >-
      Cannabis ('bango') is banned by the 1994 narcotics Act and the 1991 Criminal Act. Possession
      and use carry prison and fines; published sources do not give a reliable figure for small
      amounts.
    sources:
      - wiki
      - cr
  cultivation:
    text: Cultivation is a crime, though bango is grown extensively in the south-west.
    sources:
      - cr
  enforcement:
    text: >-
      Severe on paper. The war that began in April 2023 has disrupted ordinary law enforcement
      across much of the country.
    sources:
      - cr
  sharing:
    text: >-
      Trafficking carries long sentences and, in aggravated cases, the death penalty under
      sharia-influenced provisions.
    sources:
      - cr
      - wiki
  consumption:
    text: Use is an offence.
    sources:
      - cr
