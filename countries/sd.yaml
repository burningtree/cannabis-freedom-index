segments:
  possession:
    text: >-
      Article 20(1) of the published 1994 Act text punishes use, acquisition, import, production or
      possession for personal consumption with up to five years and a court-set fine. Article 20(2)
      bars prosecution of a dependent user who voluntarily seeks treatment or requests it before
      trial. Trafficking intent brings the separate, much harsher article 15 regime. The available
      text includes later references; a complete amendment chronology was not established.
    sources:
      - act1994
      - actfull
  cultivation:
    text: >-
      Article 20(1) expressly includes cultivation to extract drugs for personal consumption in the
      up-to-five-year offence, with a fine. Cultivation with trafficking intent falls under article
      15: life imprisonment and a fine, with death in specified aggravated cases. Personal
      cultivation therefore has a distinct lesser penalty, although it remains imprisonable.
    sources:
      - act1994
  enforcement:
    text: >-
      A National Supreme Court ruling, finalised on 16 November 2018 and published in its 2019
      collection, upheld life imprisonment for possession of 657.3 grams of hashish with trafficking
      intent; it reduced the fine to 10,000 pounds. The court inferred intent from quantity in that
      case, without stating a universal threshold. This does not establish how small personal-use
      cases are handled, especially during the current conflict.
    sources:
      - hashishcase
  sharing:
    text: >-
      Article 16 covers providing narcotics or facilitating access whether paid or unpaid: at least
      ten years and a court-set fine outside authorised cases. Specified aggravations, including
      repeat offences and supply to minors or at schools, allow death or life imprisonment. A gift
      is not exempt.
    sources:
      - act1994
  consumption:
    text: >-
      Use itself is prohibited by article 12(2) and punishable under article 20(1) by up to five
      years and a fine. Article 20(2) provides a treatment-related bar to prosecution for dependent
      users who seek help voluntarily or before trial; it is not general decriminalisation of
      consumption.
    sources:
      - act1994
      - actfull
  access:
    text: >-
      Articles 12 and 14 allow ministerially licensed medical or scientific activities, including
      research institutions holding controlled plants or seeds. A cannabis patient programme,
      dispensing service or recreational supply route was not established by the reviewed material,
      so the general licensing power is not counted as observed access.
    sources:
      - actfull
context:
  death_penalty:
    text: >-
      The published 1994 Act text distinguishes ordinary and aggravated offences. Article 15 starts
      trafficking at life imprisonment plus a fine, with death in specified aggravated cases.
      Article 16 permits death or life for aggravated supply; article 17 prescribes death for
      specified international organised-crime connections. These are distinct from the personal-use
      offence in article 20.
    sources:
      - act1994
  production:
    text: >-
      No lawful production was found. The illicit crop is large: Sudanese police rank the El Radoom
      district of South Darfur first in Africa for cannabis, called bango, much of it made into
      hashish. Campaigns there destroyed 6,500 acres of farms in 2016 and about 500 farms in 2017.
    sources:
      - dab16
      - dab17
  products:
    text: >-
      Reliable national information about legally available cannabis products was not established by
      the retained sources.
    sources: []
  medical:
    text: >-
      Article 12 permits medical and scientific activities under ministerial licence, and article 14
      allows recognised universities and research institutions to hold controlled drugs, plants and
      seeds for scientific purposes. These powers do not prove that a cannabis treatment programme
      or accessible cannabis medicines operate.
    sources:
      - actfull
  consequences:
    text: >-
      Article 22(2) requires deportation of a foreign national for article 15 or 16 offences and
      permits it for personal-use offences under article 20(1), in addition to the sentence. Article
      21 provides confiscation and destruction rules for drugs, plants, seeds and property involved
      in specified supply offences.
    sources:
      - actfull
  clubs:
    status: none
    text: >-
      Article 16(1)(c) criminalises preparing or managing a home or other place for drug use or
      dealing outside authorised cases, within the minimum-ten-year supply provision. The reviewed
      statute provides no recreational social-club exemption; this does not establish whether
      informal associations exist.
    sources:
      - act1994
  visitors:
    status: none
    text: >-
      There is no visitor exemption from the reviewed personal-use or supply offences. Article 22(2)
      makes deportation compulsory for foreign nationals convicted under articles 15 or 16 and
      discretionary for article 20(1) personal-use offences. No lawful recreational supply route for
      visitors was established.
    sources:
      - actfull
  planting:
    seeds: illegal
    seeds_trade: banned
    clones: illegal
    clones_trade: banned
    text: >-
      Article 13 prohibits importing or dealing in controlled plants and seeds, including
      cultivation, ownership, sale, transfer and transport, at any stage of growth. Article 14
      allows licensed scientific possession by recognised research institutions. That exception is
      not a general home-growing or seed-import permission.
    sources:
      - actfull
