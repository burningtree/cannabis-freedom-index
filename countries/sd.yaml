segments:
  possession:
    text: >-
      Unverified. Sudan passed a Narcotic Drugs and Psychotropic Substances Act in 1994, and
      Amnesty International reports an earlier narcotics act of July 1989. The text of neither could
      be found. The Criminal Act 1991 was read in full and has no narcotics offence.
    sources:
      - wiki
      - amnesty
  cultivation:
    text: >-
      Unverified. Amnesty reports that the 1989 act provides for the death penalty for the illegal
      production of hashish and opium.
    sources:
      - amnesty
  enforcement:
    text: >-
      The narcotics act introduced in July 1989 provides for the death penalty for producing and
      trading in hashish. Amnesty International recorded death sentences passed by special
      courts for dealing in hashish in 1990, and Reuters reported nine women sentenced to death
      for trafficking in hashish in 1995. How possession for personal use is handled in practice
      could not be verified.
    sources:
      - amnesty95
      - wiki
  sharing:
    text: >-
      Amnesty reports that the 1989 act provides for the death penalty for trading in hashish and
      opium, and that nine women were reported sentenced to death for trafficking in hashish in
      June 1995. The text of the current act was not found.
    sources:
      - amnesty
  consumption:
    text: Unverified; see possession.
    sources:
      - wiki
  access:
    text: Unverified; no lawful source was found.
    sources:
      - wiki
context:
  death_penalty:
    text: >-
      Amnesty International reports that a narcotics act of July 1989 provides for the death penalty
      for illegal production of and trading in hashish and opium.
    sources:
      - amnesty
  production:
    text: >-
      No lawful production was found. The illicit crop is large: Sudanese police rank the El
      Radoom district of South Darfur first in Africa for cannabis, called bango, much of it made
      into hashish. Campaigns there destroyed 6,500 acres of farms in 2016 and about 500 farms
      in 2017.
    sources:
      - dab16
      - dab17
  products:
    text: Reliable national information about legally available cannabis products was not established by the retained sources.
    sources: []
  medical:
    text: The retained sources do not establish whether a medical cannabis programme operates.
    sources: []
  consequences:
    text: The retained sources do not establish collateral consequences beyond the penalties described above.
    sources: []
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited, and the law provides for the death
      penalty for the most serious drug offences.
    sources:
      - amnesty
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone, so a visitor has no lawful way to buy
      cannabis. The sources behind this profile describe no separate rule for visitors.
    sources:
      - wiki
