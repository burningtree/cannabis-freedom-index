segments:
  possession:
    text: >-
      Unverified. Sudan passed a Narcotic Drugs and Psychotropic Substances Act in 1994, and
      Amnesty International reports an earlier narcotics act of July 1989. The text of neither could
      be found. The Criminal Act 1991 was read in full and has no narcotics offence.
    sources:
      - wiki
      - amnesty
  cultivation:
    text: >-
      Unverified. Amnesty reports that the 1989 act provides for the death penalty for the illegal
      production of hashish and opium.
    sources:
      - amnesty
  enforcement:
    text: Unverified; see possession.
    sources:
      - wiki
  sharing:
    text: >-
      Amnesty reports that the 1989 act provides for the death penalty for trading in hashish and
      opium, and that nine women were reported sentenced to death for trafficking in hashish in
      June 1995. The text of the current act was not found.
