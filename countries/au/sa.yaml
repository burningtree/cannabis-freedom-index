name: South Australia
recreational: decriminalised
medical: legal
updated: 2026-10-04
summary: >-
  The first Australian state to decriminalise, in 1987: small amounts and one non-hydroponic plant
  are an expiation notice with a fine.
scores:
  possession: 3
  cultivation: 2
  enforcement: 4
  sharing: 1
  consumption: 2
  access: 3
segments:
  possession: >-
    Illegal, but up to 100 g is dealt with by an expiation notice — a fine of around $150 — rather
    than a charge. More than 100 g carries up to $2,000 and two years.
  cultivation: One non-hydroponic plant is an expiation fine.
  enforcement: >-
    Fines rather than charges for small amounts, under Australia's oldest decriminalisation scheme
    (1987).
  sharing: Supply is an offence.
  consumption: A fine in private; public use is treated more seriously.
  access: No shops. Medical cannabis is available on prescription, mostly through telehealth clinics.
