name: South Australia
recreational: decriminalised
medical: legal
updated: 2026-10-24
summary: >-
  Small amounts are an expiation notice: $250 for less than 25 g of cannabis and $400 for 25 g to
  100 g. One non-hydroponic plant is $400.
scores:
  possession: 3
  cultivation: 2
  enforcement: 4
  sharing: 1
  consumption: 2
  access: 3
segments:
  possession: >-
    A simple cannabis offence covers up to 100 g of cannabis or 20 g of resin. The expiation fee is
    $250 for less than 25 g of cannabis and $400 for 25 g to 100 g. For resin it is $250 under 5 g
    and $400 from 5 g to 20 g. Paying the fee within 28 days stops a prosecution for that offence.
  cultivation: >-
    One non-hydroponic plant is an expiation fee of $400. A hydroponic plant is outside that notice.
  enforcement: >-
    An expiation notice for a simple cannabis offence. Payment within 28 days stops a prosecution.
    If it is not paid, the notice can be enforced or withdrawn and the person summoned to court.
  sharing: Supply is an offence.
  consumption: >-
    Smoking or consuming cannabis in private is an expiation fee of $250. Use in a public place is
    not dealt with by that notice.
  access: Cannabis for medical use is legal under federal law. A patient needs a prescription from an authorised doctor.
