name: Tasmania
recreational: illegal
medical: legal
updated: 2026-10-24
summary: >-
  Police may caution for up to 50 g, up to three times in ten years; otherwise it is a criminal
  offence.
scores:
  possession: 2
  cultivation: 1
  enforcement: 3
  sharing: 1
  consumption: 1
  access: 3
segments:
  possession: >-
    Illegal. Police may divert a person for up to 50 g, for their first three offences. Otherwise
    possession or use of a controlled plant or its product is up to 50 penalty units or two years.
    From 1 July 2026 to 30 June 2027 a penalty unit is $213, so the fine is $10,650.
  cultivation: Illegal.
  enforcement: Cautions and diversion at police discretion.
  sharing: Supply is an offence.
  consumption: Illegal; covered by the diversion scheme.
  access: Cannabis for medical use is legal under federal law. A patient needs a prescription from an authorised doctor.
sources:
