summary: >-
  Legal to possess and grow in the Australian Capital Territory; elsewhere cautions and fines are
  typical. Medical cannabis is very accessible via telehealth. Presence-based drug-driving laws are
  strict.
scores:
  possession: 2
  cultivation: 2
  enforcement: 3
  sharing: 1
  consumption: 2
  access: 3
segments:
  possession:
    text: >-
      It depends on the state. In the Australian Capital Territory adults may possess up to 50 g of
      dried cannabis since 31 January 2020. Elsewhere possession is an offence: South Australia and
      the Northern Territory issue on-the-spot fines for small amounts, and the other states run
      police caution or diversion schemes for first-time small quantities, with criminal charges
      otherwise. Federal law still prohibits possession everywhere.
    sources:
      - conv
      - wiki
  cultivation:
    text: >-
      In the ACT, two plants per adult and four per household, grown at your own home and not with
      hydroponics. In South Australia and the Northern Territory one or two plants bring a fine
      rather than a charge. In the remaining states growing any plant is a criminal offence.
    sources:
      - ct
      - wiki
  enforcement:
    text: >-
      Mostly cautions and fines for users, but criminal convictions and occasional prison remain
      possible outside the ACT. Cultivation and supply carry heavy sentences.
    sources:
      - wiki
      - conv
  sharing:
    text: >-
      Even in the ACT it is an offence to give or sell cannabis to another person; plants and
      harvest are for the grower only.
    sources:
      - conv
      - ct
  consumption:
    text: >-
      In the ACT, use is legal at home but not in public or near children. In other states use
      itself is an offence, generally handled by caution.
    sources:
      - conv
      - wiki
  access:
    text: >-
      No adult-use sales anywhere, including the ACT, where even seeds cannot be legally bought. In
      practice the main lawful route is medical: telehealth clinics prescribe flower and oils to
      very large numbers of patients, delivered by pharmacies.
    sources:
      - tga
      - wiki
context:
  production:
    text: >-
      Federal licences cover cultivation and manufacture of medicinal cannabis and exports; hemp is
      licensed by the states. No adult-use production.
    sources:
      - tga
      - wiki
  products:
    text: >-
      A wide range of prescription flower, oils, vapes and edibles in the medical channel, almost
      all 'unapproved' products supplied under special-access rules. Nothing for general sale.
    sources:
      - tga
  medical:
    text: >-
      Among the easiest medical systems to use: any doctor can prescribe through the special-access
      or authorised-prescriber pathways with no fixed list of conditions. Not subsidised, and
      regulators have been tightening telehealth prescribing.
    sources:
      - tga
      - wiki
  consequences:
    text: >-
      Roadside saliva tests in most states penalise any detectable THC, with licence loss regardless
      of impairment — a major problem for medical patients, with a few states now introducing a
      medical defence.
    sources:
      - wiki
  planting:
    seeds: illegal
    seeds_trade: banned
    clones: grey
    clones_trade: banned
    text: >-
      Even in the Australian Capital Territory, where adults may grow two plants, selling or
      supplying cannabis seeds is illegal and there is no legal way to obtain them; the only
      lawful cannabis is what a resident grows. Commonwealth law is unchanged, and elsewhere
      in Australia growing is an offence or a fine.
    sources:
      - adf
