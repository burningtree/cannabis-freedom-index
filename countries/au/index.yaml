name: Australia
region: Oceania
iso_numeric: 36
recreational: partial
medical: legal
updated: 2026-10-27
summary: >-
  In the ACT an adult is outside the local small-possession and one-or-two-plant offences, within
  the limits ACT Policing states. Elsewhere, infringement notices, expiation fees, cautions and
  diversion are used for small amounts, and charges remain available. Medical cannabis is available
  on prescription. Presence-based drug-driving laws are strict.
scores:
  possession: 2
  cultivation: 2
  enforcement: 3
  sharing: 1
  consumption: 2
  access: 3
answers:
  carry:
    answer: limited
    label: Depends on jurisdiction
    text: >-
      ACT adults have a local small-possession exemption; elsewhere charges remain possible, and
      Commonwealth law also applies
segments:
  possession:
    text: >-
      It depends on the state. ACT Policing states that an adult may possess up to 50 g of dried
      cannabis or 150 g of fresh cannabis, and that the January 2020 rules still apply.[@actpolice]
      The amending Act's remaining provisions commenced on 31 January 2020.[@actamend] The Drugs of
      Dependence Act makes possession of not more than a small quantity an offence, and then
      disapplies that offence for a person 18 or older who possesses the cannabis in the ACT.
      Harvested cannabis that is not stored out of children's reach can bring 50 penalty units, two
      years, or both.[@actgrow] In Western Australia police may issue one Cannabis Intervention
      Requirement to an adult for not more than 10 g; possession remains a criminal offence.[@wacir]
      In South Australia a simple cannabis offence covers up to 100 g of cannabis, with an expiation
      fee of $250 under 25 g and $400 from 25 g to 100 g.[@sareg] In the Northern Territory an adult
      may be given an infringement notice for cannabis plant material of less than the 50 g
      traffickable quantity, and only if the quantity does not exceed the 50 g listed for that
      notice. The prescribed amount is 2 penalty units. The same notice is available when that
      quantity is possessed in a public place.[@ntact] Queensland must offer an eligible person
      diversion for not more than 50 g, and diversion does not decriminalise possession.[@qldpol]
      New South Wales police may caution an adult for not more than 30 g of dried cannabis, at most
      twice. Living plants are outside that scheme.[@nswguide] Victoria Legal Aid describes a small
      quantity on a first offence as usually drawing a caution if the person agrees to
      counselling.[@viclegalaid] In Tasmania, possessing or using a controlled plant is an offence
      of 50 penalty units or two years.[@tasact] ACT Policing states that Commonwealth law is
      applicable across Australia, including in the ACT, and that police may use it.[@actpolice]
      The 2020 Territory reform is traced in the
      [ACT legalisation](/history/australia-act-legalises-2020/).
    sources:
      - actpolice
      - actamend
      - actgrow
      - wacir
      - sareg
      - ntact
      - qldpol
      - nswguide
      - viclegalaid
      - tasact
    currency: AUD
    penalties:
      - label: ACT adult exemption (50 g dried or 150 g fresh)
        treatment: legal
        term: Personal use
        note: 18 and over, in the ACT; no sharing or sale; Commonwealth law still applies
      - label: Simple cannabis offence (South Australia, expiation)
        treatment: civil
        term: Personal use
        fine: 400
        note: From $250 under 25 g to $400 for 25–100 g
      - label: Cannabis Intervention Requirement (Western Australia)
        treatment: civil
        term: Personal use
        note: One-off requirement for use or up to 10 g; the offence stays criminal
      - label: Criminal possession elsewhere
        treatment: criminal
        term: Possession
        note: Charges remain available in every state; amounts and tariffs vary
  cultivation:
    text: >-
      In the ACT, section 162 does not apply to a person 18 or older who cultivates one or two
      plants in the ACT, and artificial cultivation is outside that exception. More than four plants
      at premises, growing other than where the person lives, or growing where the public can
      lawfully go, are separate offences. The away-from-home and public-access offences can bring
      50 penalty units, two years, or both.[@actgrow] ACT Policing states the household maximum as
      four plants and says hydroponic or artificial cultivation, and growing where the public can
      access the plants, are offences.[@actpolice] In South Australia one non-hydroponic plant is an
      expiation fee of $400.[@sareg] In the Northern Territory, cultivating fewer than a traffickable
      quantity of a prohibited plant carries 200 penalty units or two years. Schedule 2 states the
      traffickable quantity of a cannabis plant as not less than five and not more than 19 plants.
      An adult may be given an infringement notice, at 2 penalty units, when the number of cannabis
      plants does not exceed two.[@ntact] In New South Wales, cultivating a cannabis plant is an
      offence. A cannabis plant cultivated by any means is a prohibited plant.[@nswdmt] In Western
      Australia a Cannabis Intervention Requirement does not cover cannabis plants.[@wacir]
    sources:
      - actgrow
      - actpolice
      - sareg
      - ntact
      - nswdmt
      - wacir
    currency: AUD
    penalties:
      - label: ACT home grow (one or two plants, household maximum four)
        treatment: legal
        term: Personal use
        note: 18 and over, at home, no public access, no artificial cultivation; plants and harvest for the grower only
      - label: One non-hydroponic plant (South Australia, expiation)
        treatment: civil
        term: Personal use
        fine: 400
      - label: General cultivation (Northern Territory example)
        treatment: criminal
        term: Unlicensed cultivation
        prison: 2 years
        note: "Under traffickable quantity: 200 penalty units or two years; five or more plants is traffickable"
  enforcement:
    text: >-
      In the ACT, growing other than where the person lives, or where the public can lawfully go,
      and failing to store harvested cannabis out of children's reach, can each bring 50 penalty
      units, two years, or both.[@actgrow] ACT Policing states that selling, sharing or giving
      cannabis is an offence, and that Commonwealth law applies in the ACT and may be used.[@actpolice]
      South Australia deals with a simple cannabis offence by an expiation notice.[@sareg] In the
      Northern Territory a police officer may give an adult an infringement notice, and paying the
      prescribed amount within 28 days expiates the offence. The notice is not required, and a
      prosecution remains available if none is given.[@ntact]
    sources:
      - actgrow
      - actpolice
      - sareg
      - ntact
  sharing:
    text: >-
      Even in the ACT it is an offence to give or sell cannabis to another person; plants and
      harvest are for the grower only.[@conv,ct]
    sources:
      - conv
      - ct
  consumption:
    text: >-
      In the ACT, smoking cannabis in a public place, or exposing a child to the smoke or vapour,
      is an offence of 30 penalty units. For this offence, smoke includes vapour and an activated
      personal vaporiser.[@actgrow] ACT Policing states that smoking or using cannabis in public,
      and exposing a child to cannabis smoke, are offences.[@actpolice] In South Australia, smoking
      or consuming cannabis in private is an expiation fee of $250, and use in a public place is
      outside that notice.[@sareg] In the Northern Territory an infringement notice is available for
      less than 50 g of cannabis plant material possessed in a public place. If that public-place
      offence is prosecuted, the maximum for this Schedule 2 drug is 200 penalty units or two
      years.[@ntact]
    sources:
      - actgrow
      - actpolice
      - sareg
      - ntact
  access:
    text: >-
      In the ACT, selling, sharing or giving cannabis is an offence.[@actpolice]
    sources:
      - actpolice
context:
  production:
    status: medical
    text: >-
      Federal licences cover cultivation and manufacture of medicinal cannabis and exports; hemp is
      licensed by the states.[@tga] No adult-use production.
    sources:
      - tga
  medical:
    text: >-
      Among the easiest medical systems to use: any doctor can prescribe through the special-access
      or authorised-prescriber pathways with no fixed list of conditions.[@tga] A wide range of
      prescription flower, oils, vapes and edibles moves through the medical channel, almost all
      'unapproved' products under special-access rules, with nothing for general sale.[@tga] Not
      subsidised, and regulators have been tightening telehealth prescribing.[@tga]
    sources:
      - tga
  recreational:
    text: >-
      Adult use is partly decriminalised, not legal: the ACT exempts possession and home growing,
      other states and territories answer small amounts with expiation fees, cautions or diversion,
      and no jurisdiction has lawful sales.[@actpolice,conv] A federal Greens bill to legalise and
      regulate recreational cannabis was voted down 13–24 in the Senate in November
      2024.[@stratcann24] The federal vote is traced in the
      [Senate rejection](/history/australia-senate-rejects-legalisation-2024/).
    sources:
      - actpolice
      - conv
      - stratcann24
  hemp:
    status: high
    text: >-
      Hemp is a state-licensed crop, not a Commonwealth one: growers hold state licences for
      cultivation and processing, with crops capped at about 1% THC — Queensland, Western Australia
      and South Australia each run their own licensing Acts and approved-seed rules.[@qldhemp]
    sources:
      - qldhemp
  consequences:
    text: >-
      Victoria removed automatic licence bans for eligible unimpaired medicinal-cannabis drivers in
      March 2025.[@aap26] NSW Act 33 of 2026 received assent on 23 September 2026, but commencement of its
      patient scheme was not established in this review.[@nswReform26,nswParliament26] The announced scheme requires a
      prescription, registration and education, excludes learner, provisional and commercial
      drivers, and retains a 24-hour ban after a positive roadside test.[@nswReform26] Queensland Act 23 of 2026
      received assent on 21 September 2026, with new presence-offence fine provisions commencing on
      1 December 2026.[@qldAct26,qldCommence26]
    sources:
      - aap26
      - nswReform26
      - nswParliament26
      - qldAct26
      - qldCommence26
  planting:
    seeds: illegal
    seeds_trade: banned
    clones: grey
    clones_trade: banned
    text: >-
      Even in the Australian Capital Territory, where adults may grow two plants, selling or
      supplying cannabis seeds is illegal and there is no legal way to obtain them; the only
      lawful cannabis is what a resident grows.[@adf] Commonwealth law is unchanged, and elsewhere
      in Australia growing is an offence or a fine.[@adf]
    sources:
      - adf
  culture:
    text: >-
      A foil-wrapped deal is a tinny in New Zealand and a foilie in Australia, sold from
      ordinary-looking tinny houses to anyone with cash — a trade researchers found drew younger
      and more Maori buyers without spreading harder drugs, deflating a 2000s panic that the houses
      pushed methamphetamine.[@nzdf07] Its vocabulary is traced in
      [tinny](/culture/language/tinny/). Nimbin in New South Wales calls itself the cannabis capital:
      its MardiGrass protest-carnival has run every May since 1993 — the sixteenth was in 2008 —
      vowing to repeat until prohibition ends.[@mardi08] Its story is traced in
      [Nimbin MardiGrass](/culture/traditions/nimbin-mardigrass/) and the federal
      [2023 bill](/history/australia-legalising-cannabis-bill-2023/) and
      [2024 rejection](/history/australia-senate-rejects-legalisation-2024/).
    sources:
      - nzdf07
      - mardi08
  driving:
    status: zero
    text: >-
      Road law belongs to the states, and the general model is a presence offence: detected THC
      can be enough without proof of impairment.[@aap26] Victoria removed automatic licence bans for
      eligible unimpaired medicinal-cannabis drivers in March 2025.[@aap26] NSW Act 33 of 2026 received
      assent on 23 September, but commencement of its patient scheme was not established in this
      review; the government expected rollout in late 2026 or early 2027.[@nswReform26,nswParliament26] Its announced scheme
      requires a prescription, registration and education, excludes learner, provisional and
      commercial drivers, and retains a 24-hour ban after a positive roadside test.[@nswReform26] Laboratory
      THC below 50 ng/ml would bring no further action; the first two detections at or above that
      level within two years would bring warnings, and the third a $722 fine and a minimum
      three-month suspension.[@nswReform26] Impaired driving and mixed-drug offences remain punishable.[@aap26]
      Queensland Act 23/2026 received assent on 21 September, with new presence-offence
      fine provisions commencing on 1 December 2026.[@qldAct26,qldCommence26] Its further testing and suspension
      amendments still awaited proclamation in the reviewed legislative history.[@qldCommence26]
    sources:
      - aap26
      - nswReform26
      - nswParliament26
      - qldAct26
      - qldCommence26
  clubs:
    status: none
    text: >-
      No cannabis clubs operate legally anywhere in Australia. When the Australian Capital
      Territory was debating its home-grow law in 2019, the head of the National Drug Research
      Institute proposed allowing not-for-profit clubs that would grow for adult members, for
      the large majority of users who would not grow their own; the bill's wording, which made
      it a crime to cultivate more than a few plants, made the model unworkable, and the law
      as passed lets a person grow only for themselves.[@ct19,conv] Giving cannabis to another person
      remains an offence even there.[@ct]
    sources:
      - ct19
      - conv
      - ct
  visitors:
    status: none
    text: >-
      In the ACT, selling, sharing or giving cannabis is an offence, so a visitor has no lawful
      adult-use purchase there.[@actpolice] The sources behind this profile describe no separate rule for
      visitors.
    sources:
      - actpolice
  arrests:
    text: >-
      The national Illicit Drug Data Report counted 66,285 cannabis arrests in Australia in
      2020-21, 14% fewer than the year before.[@nceta] Nine in ten were consumer arrests, for
      possession or use, and one in ten were provider arrests, for supply.[@nceta]
    sources:
      - nceta
  black_market:
    text: >-
      Figures reported by the government to the UN drugs office record 5,312 kg of herbal
      cannabis seized in 2024, against 6,372 kg in 2023, and 55.2 kg of cannabis resin
      seized in 2024, against 53.9 kg in 2023.[@unodc_szr] The UN publishes them as kilogram
      equivalents, and countries count seizures differently, so the figures are not
      comparable across borders.[@unodc_szr]
    sources:
      - unodc_szr
