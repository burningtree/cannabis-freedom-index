name: Australia
region: Oceania
iso_numeric: 36
recreational: partial
medical: legal
updated: 2026-10-24
summary: >-
  Legal to possess and grow in the Australian Capital Territory; elsewhere cautions and fines are
  typical. Medical cannabis is very accessible via telehealth. Presence-based drug-driving laws are
  strict.
scores:
  possession: 2
  cultivation: 2
  enforcement: 3
  sharing: 1
  consumption: 2
  access: 3
segments:
  possession:
    text: >-
      It depends on the state. In the Australian Capital Territory adults may possess up to 50 g of
      dried cannabis since 31 January 2020. Elsewhere possession is an offence: South Australia and
      the Northern Territory issue on-the-spot fines for small amounts, and the other states run
      police caution or diversion schemes for first-time small quantities, with criminal charges
      otherwise. Federal law still prohibits possession everywhere.
    sources:
      - conv
      - wiki
  cultivation:
    text: >-
      In the ACT, two plants per adult and four per household, grown at your own home and not with
      hydroponics.[@ct] In South Australia one non-hydroponic plant is an expiation fee of
      $400.[@sareg] In the Northern Territory one or two plants bring a fine rather than a
      charge. In the remaining states growing any plant is a criminal offence.[@wiki]
    sources:
      - ct
      - wiki
      - sareg
  enforcement:
    text: >-
      Mostly cautions and fines for users, but criminal convictions and occasional prison remain
      possible outside the ACT. Cultivation and supply carry heavy sentences.
    sources:
      - wiki
      - conv
  sharing:
    text: >-
      Even in the ACT it is an offence to give or sell cannabis to another person; plants and
      harvest are for the grower only.
    sources:
      - conv
      - ct
  consumption:
    text: >-
      In the ACT, use is legal at home but not in public or near children. In other states use
      itself is an offence, generally handled by caution.
    sources:
      - conv
      - wiki
  access:
    text: >-
      No adult-use sales anywhere, including the ACT, where even seeds cannot be legally bought. In
      practice the main lawful route is medical: telehealth clinics prescribe flower and oils to
      very large numbers of patients, delivered by pharmacies.
    sources:
      - tga
      - wiki
context:
  production:
    text: >-
      Federal licences cover cultivation and manufacture of medicinal cannabis and exports; hemp is
      licensed by the states. No adult-use production.
    sources:
      - tga
      - wiki
  products:
    text: >-
      A wide range of prescription flower, oils, vapes and edibles in the medical channel, almost
      all 'unapproved' products supplied under special-access rules. Nothing for general sale.
    sources:
      - tga
  medical:
    text: >-
      Among the easiest medical systems to use: any doctor can prescribe through the special-access
      or authorised-prescriber pathways with no fixed list of conditions. Not subsidised, and
      regulators have been tightening telehealth prescribing.
    sources:
      - tga
      - wiki
  consequences:
    text: >-
      Roadside saliva tests in most states penalise any detectable THC, with licence loss regardless
      of impairment — a major problem for medical patients, with a few states now introducing a
      medical defence.
    sources:
      - wiki
  planting:
    seeds: illegal
    seeds_trade: banned
    clones: grey
    clones_trade: banned
    text: >-
      Even in the Australian Capital Territory, where adults may grow two plants, selling or
      supplying cannabis seeds is illegal and there is no legal way to obtain them; the only
      lawful cannabis is what a resident grows. Commonwealth law is unchanged, and elsewhere
      in Australia growing is an offence or a fine.
    sources:
      - adf
  driving:
    status: zero
    text: >-
      Road law belongs to the states, and the general model is a presence offence: detected THC
      can be enough without proof of impairment. Victoria removed automatic licence bans for
      eligible unimpaired medicinal-cannabis drivers in March 2025. NSW Act 33 of 2026 received
      assent on 23 September, but commencement of its patient scheme was not established in this
      review; the government expected rollout in late 2026 or early 2027. Its announced scheme
      requires a prescription, registration and education, excludes learner, provisional and
      commercial drivers, and retains a 24-hour ban after a positive roadside test. Laboratory
      THC below 50 ng/ml would bring no further action; the first two detections at or above that
      level within two years would bring warnings, and the third a $722 fine and a minimum
      three-month suspension. Impaired driving and mixed-drug offences remain punishable.
      Queensland Act 23/2026 received assent on 21 September, with new presence-offence
      fine provisions commencing on 1 December 2026. Its further testing and suspension
      amendments still awaited proclamation in the reviewed legislative history.
    sources:
      - aap26
      - nswReform26
      - nswParliament26
      - qldAct26
      - qldCommence26
  clubs:
    status: none
    text: >-
      No cannabis clubs operate legally anywhere in Australia. When the Australian Capital
      Territory was debating its home-grow law in 2019, the head of the National Drug Research
      Institute proposed allowing not-for-profit clubs that would grow for adult members, for
      the large majority of users who would not grow their own; the bill's wording, which made
      it a crime to cultivate more than a few plants, made the model unworkable, and the law
      as passed lets a person grow only for themselves. Giving cannabis to another person
      remains an offence even there.
    sources:
      - ct19
      - conv
      - ct
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone, so a visitor has no lawful way to buy
      cannabis. Whatever legal supply exists is medical, for patients with a prescription or
      registration. The sources behind this profile describe no separate rule for visitors.
    sources:
      - tga
      - wiki
  arrests:
    text: >-
      The national Illicit Drug Data Report counted 66,285 cannabis arrests in Australia in
      2020-21, 14% fewer than the year before. Nine in ten were consumer arrests, for
      possession or use, and one in ten were provider arrests, for supply.
    sources:
      - nceta
  black_market:
    text: >-
      Figures reported by the government to the UN drugs office record 5,312 kg of herbal
      cannabis seized in 2024, against 6,372 kg in 2023, and 55.2 kg of cannabis resin
      seized in 2024, against 53.9 kg in 2023. The UN publishes them as kilogram
      equivalents, and countries count seizures differently, so the figures are not
      comparable across borders.
    sources:
      - unodc_szr
