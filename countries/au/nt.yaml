name: Northern Territory
recreational: decriminalised
medical: legal
updated: 2026-10-24
summary: >-
  An adult may be given an infringement notice for less than 50 g of cannabis plant material, or
  for not more than two cannabis plants. The prescribed amount is 2 penalty units. A prosecution
  remains available if no notice is given.
scores:
  possession: 3
  cultivation: 2
  enforcement: 4
  sharing: 1
  consumption: 2
  access: 3
segments:
  possession: >-
    An adult may be given an infringement notice for cannabis plant material of less than the 50 g
    traffickable quantity, if the quantity also does not exceed the 50 g listed in Schedule 3. The
    prescribed amount is 2 penalty units. The notice covers both the general possession offence and
    possession in a public place. If the public-place offence is prosecuted, the maximum for this
    Schedule 2 drug is 200 penalty units or two years. The general possession offence, if
    prosecuted, is 50 penalty units.
  cultivation: >-
    Cultivating fewer than a traffickable quantity of a prohibited plant carries 200 penalty units
    or two years. Schedule 2 states the traffickable quantity of a cannabis plant as not less than
    five and not more than 19 plants. An adult may be given an infringement notice, at 2 penalty
    units, when the number of cannabis plants does not exceed two.
  enforcement: >-
    A police officer may give the notice to an adult. Paying the prescribed amount within 28 days
    expiates the offence. The officer is not required to give a notice, and a prosecution remains
    available if none is given.
  sharing: Supply of a dangerous drug is an offence.
  consumption: >-
    An infringement notice is available for less than 50 g of cannabis plant material possessed in
    a public place. If that offence is prosecuted, the maximum is 200 penalty units or two years.
  access: >-
    Cannabis for medical use is legal under federal law. A patient needs a prescription from an
    authorised doctor.
