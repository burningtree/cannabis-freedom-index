segments:
  possession: >-
    Decriminalised: up to 50 g is an infringement with a fine of up to $200. More than 50 g, or
    possession in a public place, carries up to two years.
  cultivation: Two non-hydroponic plants bring a $200 fine rather than a charge.
  enforcement: A fine for small amounts kept at home.
  sharing: Supply is an offence.
  consumption: A fine at home; an offence in public.
  access: No shops. Medical cannabis is available on prescription, mostly through telehealth clinics.
