name: New South Wales
recreational: illegal
medical: legal
updated: 2026-10-24
summary: >-
  Police may caution an eligible adult for up to 30 g of dried cannabis, at most twice. Possession
  remains an offence, with up to 20 penalty units or two years.
scores:
  possession: 2
  cultivation: 1
  enforcement: 3
  sharing: 1
  consumption: 1
  access: 3
segments:
  possession: >-
    Illegal. Police may, at their discretion, caution an adult for personal use or possession of not
    more than 30 g of dried cannabis, or for equipment used with it. An adult can receive only two
    cautions. A person with an unspent conviction for a serious drug offence is not eligible. Fresh
    cannabis, living plants, hash, hash oil and a quantity that is mostly seeds are outside the
    scheme. Otherwise possession can bring 20 penalty units, two years, or both.
  cultivation: "Illegal: up to $11,000 and two years even for small numbers of plants."
  enforcement: A caution is discretionary and limited to two. Otherwise the person is charged.
  sharing: Supply is an offence.
  consumption: Illegal; covered by the same cautioning scheme.
  access: No shops. Medical cannabis is available on prescription, mostly through telehealth clinics.
