  possession: >-
    Illegal. Police may issue a caution for up to 15 g, for a first or second offence; otherwise the
    maximum is a $2,200 fine and two years in prison.
  cultivation: "Illegal: up to $11,000 and two years even for small numbers of plants."
  enforcement: Cautions at police discretion, criminal charges otherwise.
  sharing: Supply is an offence.
  consumption: Illegal; covered by the same cautioning scheme.
  access: No shops. Medical cannabis is available on prescription, mostly through telehealth clinics.
