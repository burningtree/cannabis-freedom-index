segments:
  possession: >-
    Illegal. Police may issue a Cannabis Intervention Requirement to an eligible person aged 14 or
    older who is found using cannabis, or possessing not more than 10 g, or a smoking implement
    with traces of it. An adult can receive only one. A person aged 14 to 17 can receive two.
    Completing the session within 28 days means no court and no conviction for that allegation. A
    later offence is prosecuted. The scheme does not cover plants, resin, hash oil or other
    derivatives. Possession can bring up to $2,000, two years, or both.
  cultivation: Illegal. A Cannabis Intervention Requirement does not cover cannabis plants.
  enforcement: >-
    A Cannabis Intervention Requirement is discretionary and, for an adult, once only. Otherwise
    the charge is prosecuted.
  sharing: Supply is an offence.
  consumption: Illegal.
  access: No shops. Medical cannabis is available on prescription, mostly through telehealth clinics.
