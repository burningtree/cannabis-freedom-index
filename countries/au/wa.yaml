segments:
  possession: >-
    Illegal. Up to 10 g leads to a Cannabis Intervention Requirement — a one-off counselling session
    — instead of a charge. From 10 to 100 g carries up to $2,000 and two years. An earlier
    infringement-notice scheme was repealed in 2011.
  cultivation: Illegal.
  enforcement: One chance at counselling for tiny amounts; criminal charges otherwise.
  sharing: Supply is an offence.
  consumption: Illegal.
  access: No shops. Medical cannabis is available on prescription, mostly through telehealth clinics.
