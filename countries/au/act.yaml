segments:
  possession: >-
    Since 31 January 2020 adults may possess up to 50 g of dried cannabis, or 150 g fresh.
    Harvested cannabis must be stored out of children's reach. Failing to do so can bring 50
    penalty units, two years, or both, unless the person proves they took all reasonable steps to
    keep a child from it.
  cultivation: >-
    Two plants per adult, at most four per household, at the place where the person lives.
    Hydroponic growing is not allowed. Growing away from home, or in an area the public can
    lawfully enter, can bring 50 penalty units, two years, or both.
  enforcement: >-
    Growing away from home or where the public can lawfully go, and storing the harvest where
    children can reach it, can bring two years even when the gram and plant allowances are met.
    Commonwealth law still applies, and ACT Policing may use it.
  sharing: "Not allowed: giving cannabis to anyone else remains an offence."
  consumption: At home only; not in public or near children.
  access: No legal way to buy cannabis or even seeds. Medical cannabis is available on prescription.
