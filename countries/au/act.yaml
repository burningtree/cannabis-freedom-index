name: Australian Capital Territory
recreational: legal
medical: legal
updated: 2026-10-04
summary: >-
  Since 2020 adults may hold 50 g of dried cannabis and grow two plants each, four per household.
  Selling, gifting and even buying seeds remain illegal.
