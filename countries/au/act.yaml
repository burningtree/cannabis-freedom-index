name: Australian Capital Territory
recreational: legal
medical: legal
updated: 2026-10-24
summary: >-
  Since 31 January 2020 an adult in the ACT is outside the local offence for a small quantity and
  for one or two plants. ACT Policing states the amounts as 50 g dried or 150 g fresh, and two
  plants per person, four per household. Selling and gifting remain offences.
scores:
  possession: 5
  cultivation: 3
  enforcement: 6
  sharing: 1
  consumption: 3
  access: 3
segments:
  possession: >-
    Since 31 January 2020, the small-quantity possession offence does not apply to a person 18 or
    older who possesses the cannabis in the ACT. ACT Policing states that quantity as up to 50 g
    dried or 150 g fresh. The Act itself leaves the small quantity to the regulations. Harvested
    cannabis must be stored out of children's reach. Failing to do so can bring 50 penalty units,
    two years, or both, unless the person proves they took all reasonable steps to keep a child
    from it.
  cultivation: >-
    Section 162 does not apply to a person 18 or older who cultivates one or two plants in the ACT.
    Artificial cultivation, including hydroponics or an artificial source of light or heat, is
    outside that exception. ACT Policing states a maximum of four plants per household. More than
    four plants at premises, growing other than where the person lives, or growing where the public
    can lawfully go, can bring 50 penalty units, two years, or both.
  enforcement: >-
    Growing other than at home, or where the public can lawfully go, and storing the harvest where
    children can reach it, can bring two years even when the gram and plant allowances are met.
    ACT Policing states that Commonwealth law applies in the ACT and that police may use it.
  sharing: "Not allowed: selling, sharing or giving cannabis remains an offence."
  consumption: >-
    Smoking cannabis in a public place, or exposing a child to the smoke or vapour, is an offence.
    The maximum is 30 penalty units. Smoke includes vapour and an activated personal vaporiser.
  access: >-
    Selling, sharing or giving cannabis is an offence. Cannabis for medical use is legal under federal
    law, and a patient needs a prescription from an authorised doctor.
