segments:
  possession: Since 31 January 2020 adults may possess up to 50 g of dried cannabis, or 150 g fresh.
  cultivation: Two plants per adult, at most four per household. Hydroponic growing is not allowed.
  enforcement: >-
    Nothing within the limits. Federal law technically still applies, though it has not been
    enforced against personal use.
  sharing: "Not allowed: giving cannabis to anyone else remains an offence."
  consumption: At home only; not in public or near children.
  access: No legal way to buy cannabis or even seeds. Medical cannabis is available on prescription.
