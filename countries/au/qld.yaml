segments:
  possession: >-
    Illegal. From 3 May 2024 an eligible person must be offered diversion for a minor drugs offence.
    For cannabis that is not more than 50 g. The offer depends on personal use, no related
    indictable offence, and no previous prison sentence for supply, trafficking or production.
    There are three lifetime opportunities: a warning, then two assessment appointments. An offer
    is used even if the person declines it. A cannabis diversion offered before 3 May 2024 counts
    as the first assessment. Diversion does not decriminalise possession. A later offence can be
    prosecuted.
  cultivation: Illegal.
  enforcement: >-
    An eligible person must be offered diversion, at most three times. Otherwise the person can be
    prosecuted. Diversion does not legalise possession.
  sharing: Supply is an offence.
  consumption: Illegal. An eligible person may be diverted under the same scheme.
  access: No shops. Medical cannabis is available on prescription, mostly through telehealth clinics.
