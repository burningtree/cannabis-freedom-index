segments:
  possession: >-
    Illegal. Police offer diversion instead of a charge for small amounts — under 50 g — and the
    scheme was widened in 2024. Outside it, maximum penalties are very high.
  cultivation: Illegal, with the same heavy maximums as possession.
  enforcement: Diversion for small amounts; severe penalties on paper beyond that.
  sharing: Supply is an offence.
  consumption: Illegal; covered by the diversion scheme.
  access: No shops. Medical cannabis is available on prescription, mostly through telehealth clinics.
