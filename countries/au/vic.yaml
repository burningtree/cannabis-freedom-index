segments:
  possession: >-
    Illegal. A small quantity on a first offence usually draws a caution, if the person agrees to
    counselling. For up to 50 g the court maximum is five penalty units. For more than 50 g and
    under 250 g it is 30 penalty units or one year. From 1 July 2026 a penalty unit is $209.10.
  cultivation: Illegal.
  enforcement: Cautions at police discretion, criminal charges otherwise.
  sharing: Supply is an offence.
  consumption: Illegal; covered by the cautioning scheme.
  access: No shops. Medical cannabis is available on prescription, mostly through telehealth clinics.
