    clones: illegal
    clones_trade: banned
    text: >-
      The drug law counts as drugs "the seeds, flowers, plants or parts of them" used as raw
      material for drugs. Sowing or growing them without authorisation carries five to fifteen
      years in prison (Article 31), and buying, selling, storing or transporting seeds or
      plants ten to fifteen years.
    sources:
      - lrard
