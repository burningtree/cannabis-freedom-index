    clones: illegal
    clones_trade: banned
    text: >-
      The drug law counts as drugs "the seeds, flowers, plants or parts of them" used as raw
      material for drugs. Sowing or growing them without authorisation carries five to fifteen
      years in prison (Article 31), and buying, selling, storing or transporting seeds or
      plants ten to fifteen years.
    sources:
      - lrard
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited.
    sources:
      - edh
      - em
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. Possession for one's own use is outside
      criminal punishment under the 2012 ruling. Weight alone does not decide, and a proved
      trafficking purpose still brings prison.
    sources:
      - inc2012
  black_market:
    text: >-
      Marijuana is a small part of what the authorities seize. Of 25,011 kg of drugs
      seized in 2025, according to the security cabinet, 24,612 kg was cocaine and 394.52
      kg marijuana, valued at about 1.39 million US dollars.
    sources:
      - edh26
