segments:
  possession:
    text: >-
      Under the Law Regulating Drug-Related Activities, possessing less than 2 g of an illicit drug
      carries one to three years in prison; 2 g or more carries a heavier sentence. There is no
      fine-only option.
    sources:
      - edh
  cultivation:
    text: Cultivation is a serious crime.
    sources:
      - edh
  enforcement:
    text: >-
      Prison for any amount, enforced under a state of exception since 2022 that has suspended
      ordinary due-process guarantees and filled the prisons.
    sources:
      - em
      - edh
  sharing:
    text: >-
      Carrying or selling brings multi-year sentences — six years in one reported case of a man
      transporting marijuana on a motorbike.
    sources:
      - em
  consumption:
    text: Use is prosecuted through possession.
    sources:
      - edh
  access:
    text: None.
    sources:
