segments:
  possession:
    text: >-
      Article 34 sets one to three years and a fine for possessing less than 2 g, and three to
      six years and a fine for 2 g or more. On 16 November 2012 the
      Constitutional Chamber held that possession for one's own use is outside criminal
      punishment, and that those two bands must be read that way. The weight is one factor
      among others, not a rule by itself. Prison remains when the court finds the drugs were
      meant for trafficking, cultivation, processing or promoting use. Holding less than 2 g
      is still a crime when that purpose is proved.
    sources:
      - justia
      - inc2012
  cultivation:
    text: >-
      Sowing or growing without authorisation carries five to fifteen years.
    sources:
      - justia
  enforcement:
    text: >-
      The written prison bands are not applied to genuine own-use possession. When a
      trafficking or promotion purpose is proved, less than 2 g is still one to three years.
      No source read here describes how often courts jail users.
    sources:
      - inc2012
  sharing:
    text: >-
      Carrying or selling brings multi-year sentences — six years in one reported case of a man
      transporting marijuana on a motorbike.
    sources:
      - em
  consumption:
    text: >-
      The Constitutional Chamber held that an adult's decision to affect their own health by
      using drugs is not a penally relevant fact, and that possession for that use is outside
      criminal punishment. Supply and cultivation remain crimes.
    sources:
      - inc2012
  access:
    text: None.
    sources:
      - edh
