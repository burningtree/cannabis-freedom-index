segments:
  possession: 2 oz in public and 8 oz at home.
  cultivation: Four plants per household. From four to eight is a misdemeanour.
  enforcement: Nothing within the limits.
  sharing: Adults may give each other cannabis within the possession limits without payment.
  consumption: Private only.
  access: Licensed shops since 2015, with some of the lowest prices in the country.
