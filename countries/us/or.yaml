segments:
  possession: 2 oz of usable marijuana in public and 8 oz at home.
  cultivation: Four plants per household. From four to eight is a misdemeanour.
  enforcement: Nothing within the limits.
  sharing: >-
    A person 21 or older may give another person 21 or older, without payment, up to 1 ounce of
    usable marijuana at a time, or up to 16 ounces of a solid cannabinoid product, 72 ounces of a
    liquid product, or 16 ounces of concentrate. Giving more than 1 ounce of usable marijuana, and
    not more than 2 ounces, without payment to another adult is a Class B misdemeanour.
  consumption: Private only.
  access: Licensed shops since 2015, with some of the lowest prices in the country.
