name: Oregon
recreational: legal
medical: legal
updated: "2026-10-27"
summary: >-
  Usable marijuana is limited to 2 oz in public and 8 oz per household; extracts have a separate
  1 oz limit and licensed-source requirement. Four plants per household. Adult gifts of usable
  marijuana are limited to 1 oz at a time. Licensed shops since 2015.
scores:
  possession: 6
  cultivation: 4
  enforcement: 6
  sharing: 5
  consumption: 3
  access: 6
segments:
  possession: >-
    Adults 21+ may possess up to 2 oz of usable marijuana in public; the home exemption covers
    8 oz per household. Other household allowances are 16 oz of solid cannabinoid products,
    72 oz of liquid products and 16 oz of cannabinoid concentrates. Cannabinoid extracts have
    a separate 1 oz household allowance and must come from a licensed retailer or an authorised
    medical-dispensary transfer; medical exceptions have separate conditions.[@2,4]
    The legal category depends on production method: mechanical and specified non-hydrocarbon
    processes generally produce concentrates; hydrocarbons or high-heat/high-pressure carbon
    dioxide produce extracts. A product nickname alone does not establish its category.[@5]
  cultivation: Four plants per household. From four to eight is a misdemeanour.
  enforcement: >-
    Product, quantity and source determine the offence outside the exemptions. Section 475C.337
    provides a Class B violation through twice the specified quantity limits and a Class B
    misdemeanour above twice through four times those limits, with separate felony clauses.
    Possessing an extract not bought from a licensed retailer is independently restricted;
    subsection (3)(c)(C) expressly lists more than one-quarter ounce of such extract as a Class C
    felony. Applicable medical authorisation and the other statutory exceptions matter.[@4]
  sharing: >-
    A person 21 or older may give another person 21 or older, without payment, up to 1 ounce of
    usable marijuana at a time, or up to 16 ounces of a solid cannabinoid product, 72 ounces of a
    liquid product, or 16 ounces of concentrate.[@2] That concentrate permission does not include
    cannabinoid extracts; section 475C.305 gives no matching ordinary adult extract-gift exemption.
    Giving more than 1 ounce of usable marijuana, and not more than 2 ounces, without payment to
    another adult is a Class B misdemeanour.[@2,3]
  consumption: Private only.
  access: Licensed shops since 2015, with some of the lowest prices in the country.
answers:
  carry:
    answer: yes
    text: Adults 21+ may carry 2 oz usable marijuana; extracts have a separate 1 oz cap and licensed-source rule
  caught:
    answer: limited
    label: Product and source matter
    text: Extract possession can be criminal even below the flower allowance; quantity and licensed origin determine exposure
