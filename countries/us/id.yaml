segments:
  possession: >-
    3 oz or less is a misdemeanour with up to a year in jail and a $1,000 fine. More is a felony
    with up to five years.
  cultivation: A felony with up to five years, for any number of plants.
  enforcement: No decriminalisation, diversion or medical exception in state law.
  sharing: A felony with up to five years.
  consumption: Illegal.
  access: None. Even CBD products must contain no THC at all.
sources:
  - title: NORML — Idaho laws and penalties
