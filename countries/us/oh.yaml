name: Ohio
recreational: legal
medical: legal
updated: 2026-10-23
summary: >-
  2.5 oz from a licensed dispensary or home growing, and six plants per adult, twelve per household.
  A gift of up to 2.5 oz, or 15 g of extract, is lawful only at a private home or farm. Licensed
  shops since August 2024.
scores:
  possession: 5
  cultivation: 4
  enforcement: 6
  sharing: 5
  consumption: 3
  access: 6
segments:
  possession:
    text: >-
      An adult may possess up to 2.5 ounces of plant material, or 15 grams of extract, when it was
      bought at a licensed Ohio dispensary or grown at that adult's primary residence. Marijuana from
      anywhere else is outside that permission. Seeds, live plants and clones grown under the home-grow
      rule sit outside the 2.5-ounce cap.[@1,2]
    currency: USD
    penalties:
      - upto: 2.5 oz
        treatment: legal
        note: From a licensed dispensary or the adult's own home grow
  cultivation:
    text: >-
      Six plants per adult, twelve per household, at the adult's primary residence.[@1,2]
    currency: USD
    penalties:
      - upto: 6 plants
        treatment: legal
        note: Per adult; twelve per household
  enforcement: Nothing within the limits.[@1]
  sharing: >-
    An adult may give another adult up to 2.5 ounces of plant material, or 15 grams of extract,
    to the same person on the same day, with no payment. The transfer has to be on privately owned
    land used mainly as a home or a farm, including the buildings on it. A transfer anywhere else,
    or for payment, is trafficking. Medical marijuana is outside this gift.[@1,2]
    [Ohio limited cannabis gifts to a private home or farm in 2026.](/history/ohio-gift-limits-2026/)
  consumption: >-
    Smoking, combustion and vaporising are limited to privately owned land used mainly as a home
    or a farm. A breach is a minor misdemeanour.[@1]
  access: Licensed shops since August 2024.[@4]
context:
  recreational:
    text: >-
      Voters approved Issue 2 in November 2023; licensed shops opened on 6 August 2024. Senate
      Bill 56, effective March 2026, tightened the gift rules to private homes and farms.[@4]
      [Ohio limited cannabis gifts to a private home or farm in 2026.](/history/ohio-gift-limits-2026/)
    sources: [4]
