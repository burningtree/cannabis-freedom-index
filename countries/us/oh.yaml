segments:
  possession: Up to 2.5 oz (70 g) is legal. From 70 to 100 g is a minor misdemeanour with a $150 fine.
  cultivation: Six plants per adult, twelve per household.
  enforcement: Nothing within the limits.
  sharing: Adults may transfer up to 2.5 oz to other adults without payment.
  consumption: Private only; lawmakers tightened the rules on public use in 2025.
  access: Licensed shops since August 2024.
