name: Nebraska
recreational: decriminalised
medical: limited
updated: 2026-10-20
summary: >-
  A first offence with up to 1 oz is a $300 infraction. Voters approved medical cannabis in 2024;
  the regulated supply chain remains unfinished as of October 2026.
scores:
  possession: 3
  cultivation: 1
  enforcement: 4
  sharing: 1
  consumption: 2
  access: 1
segments:
  possession: >-
    A first offence with 1 oz or less is a $300 infraction. A second brings up to five days in jail,
    a third up to seven.
  cultivation: Illegal; charged as manufacturing.
  enforcement: A fine for a first offence, short jail terms after that.
  sharing: Any sale is a felony with up to twenty years.
  consumption: Illegal.
  access: >-
    Voters approved medical cannabis in November 2024; the regulated programme is still being set
    up. Reporting on the 19 October 2026 commission meeting confirms that manufacturers and
    dispensaries remained unlicensed. The commission anticipates revised rules and a new
    manufacturer application period in early 2027; this is not a confirmed patient-sales date.
