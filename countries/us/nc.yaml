segments:
  possession: >-
    ½ oz or less is a misdemeanour punished by a fine of up to $200 with no jail. From ½ to 1.5 oz
    brings up to 120 days; more is a felony.
  cultivation: A felony.
  enforcement: A fine only for the smallest amounts.
  sharing: Any sale is a felony.
  consumption: Illegal.
  access: >-
    None under state law. A dispensary on Eastern Band of Cherokee land sells to adults under tribal
    law.
