name: North Carolina
recreational: decriminalised
medical: none
updated: '2026-10-26'
summary: >-
  The ordinary no-active-jail tier covers up to ½ oz of marijuana plant material or 1/20 oz of
  hashish. Larger resin quantities and isolated THC can be felonies. No state medical programme;
  Cherokee tribal law is separate.
scores:
  possession: 2
  cultivation: 1
  enforcement: 3
  sharing: 1
  consumption: 1
  access: 0
segments:
  possession: >-
    Ordinary first-offence possession of up to ½ oz of marijuana plant material or 1/20 oz of
    hashish (about 1.42 g) is a Class 3 misdemeanour with any imprisonment suspended. Above those
    amounts, up to 1½ oz of plant material or 3/20 oz of hashish (about 4.25 g), it is a Class 1
    misdemeanour. More than 1½ oz of plant material, more than 3/20 oz of hashish, or any quantity
    of prohibited synthetic THC or THC isolated from marijuana resin is a Class I felony. Repeat
    offences and possession in prison can bring higher classifications. Lawful hemp and exempt
    FDA-approved medicines are separate.[@2,3]
  cultivation:
    text: >-
      Growing is a felony, charged by weight: under 10 lb brings 3–8 months and a $1,000 fine,
      with longer terms above.[@1,2]
    currency: USD
    penalties:
      - label: Growing under 10 lb
        treatment: criminal
        term: Felony
        prison_min: 3 months
        prison: 8 months
        fine: 1000
        note: Higher weights bring longer terms
  enforcement: >-
    The ordinary lowest plant/hashish tier has no active jail sentence; larger resin amounts and
    isolated THC can be felonies even below the familiar half-ounce plant threshold. Prior
    convictions and prison possession can increase the offence classification. Sentencing depends on
    the applicable class and criminal record.[@2,3]
  sharing: Any sale is a felony.[@1]
  consumption: Illegal.[@1]
  access: >-
    None under state law. A dispensary on Eastern Band of Cherokee land sells to adults under
    tribal law — medical sales from April 2024, all adults 21 and over from September
    2024.[@1,4]
