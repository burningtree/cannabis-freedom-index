name: Maryland
recreational: legal
medical: legal
updated: 2026-10-27
summary: >-
  Adults 21+ may hold 1.5 oz flower, 12 g concentrate or products with 750 mg delta-9-THC.
  An ordinary household may grow two plants; qualifying medical patients 21+ may grow four.
  Licensed shops since July 2023.
scores:
  possession: 5
  cultivation: 3
  enforcement: 6
  sharing: 5
  consumption: 3
  access: 6
segments:
  possession: >-
    Adults 21+ may possess the personal-use amount: up to 1.5 oz usable flower, 12 g concentrate
    or products containing up to 750 mg delta-9-THC.[@4,5] The civil bands are above 1.5 through
    2.5 oz flower, above 12 through 20 g concentrate, or above 750 through 1,250 mg delta-9-THC
    in products; these carry a fine of up to $250. Unauthorised possession beyond those bands
    is a misdemeanour with up to six months or $1,000 or both.[@4,5]
    The regulator treats purchases across product types as a combined allowance: buying the
    maximum of one category leaves no allowance for another. Medical patients may possess
    the amount authorised in their written certification.[@6,2]
  cultivation: >-
    A person 21 or older may grow up to two plants, and a residence may not have more than two. A
    qualifying medical patient who is at least 21 may grow up to four, and a residence shared by
    qualifying patients may not have more than four. The Cannabis Administration describes that
    allowance as two additional plants, for a total of four. Plants may not be in public view. The
    grower has to keep them secure from anyone under 21 and from anyone without permission, on
    property the grower lawfully possesses or with the possessor's consent. Breaking those rules is
    a misdemeanour with up to three years, or a fine of up to $5,000, or both.[@2,3]
  enforcement: >-
    No state penalty for adult possession within the personal-use amount. The separate flower,
    concentrate and product-THC civil bands carry up to $250; unauthorised possession beyond
    them can bring up to six months in jail or $1,000 or both.[@4,5]
  sharing: >-
    Adults 21+ may share the personal-use amount without payment: up to 1.5 oz usable flower,
    12 g concentrate or products with up to 750 mg delta-9-THC. The exemption excludes gifts
    tied to another purchase or reciprocal transaction, including advertised purchase-linked
    gifts.[@4,7]
  consumption: Private only; public smoking is a $50 civil fine for a first offence ($150 after).[@8]
  access: Licensed shops since July 2023, though towns can ban them; Question 8 on the 3 November 2026 ballot would end recreational sales.[@3,9]
context:
  recreational:
    text: >-
      Question 4 (November 2022) legalised adult use; licensed shops opened on 1 July 2023. The
      personal-use limit doubled in April 2026, but Question 8 on the November 2026 ballot would
      end recreational sales while keeping up to 1 oz legal.[@2,3,9]
    sources: [2, 3, 9]
answers:
  carry:
    answer: yes
    text: Adults 21+ have product-specific limits of 1.5 oz flower, 12 g concentrate or 750 mg delta-9-THC in products
  caught:
    answer: limited
    label: Civil fine or jail
    text: Above the legal limits through 2.5 oz flower, 20 g concentrate or 1,250 mg product THC is civil; beyond can mean jail
