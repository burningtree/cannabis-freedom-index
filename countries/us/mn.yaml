  sharing: 5
  consumption: 5
  access: 6
segments:
  possession: >-
    Adults 21+ may hold 2 oz flower in public or 2 lb at their residence, 8 g concentrate and a
    combined 800 mg THC in edible cannabis and lower-potency hemp edibles. Registered patients
    have a separate labelled-medical-supply exception.[@3] Over 2–4 oz public flower, over 8–16 g
    concentrate, or over 800–1,600 mg edible THC is a petty misdemeanour. Over 16–80 g concentrate
    or over 1,600–8,000 mg edible THC can bring 90 days and/or $1,000; higher bands carry longer
    terms.[@4]
  cultivation: Eight plants per residence, four of them mature. Up to sixteen is a civil penalty.
  enforcement: >-
    No ordinary adult possession penalty within the separate flower, concentrate and edible-THC
    caps. Small overages are petty misdemeanours; higher product-specific bands are
    criminal.[@3,4]
  sharing: Gifts of up to 2 oz, 8 g of concentrate or 800 mg of edibles are legal.
  consumption: >-
    Adults may use cannabis privately and at licensed venues or events; some outdoor public use
    is allowed, subject to local ordinances. Smoking bans, vehicles, schools, federal property,
    and places where minors could inhale smoke or vapour are excluded.[@2]
  access: Tribal dispensaries from 2023 and state-licensed shops from 2025.
answers:
  public:
    answer: limited
    text: Allowed in some outdoor public places; tobacco restrictions and local rules apply
