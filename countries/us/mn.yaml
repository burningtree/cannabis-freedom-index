name: Minnesota
recreational: legal
medical: legal
updated: '2026-10-27'
summary: >-
  Adults 21+ may hold 2 oz of flower in public or 2 lb at home, 8 g concentrate, and a combined
  800 mg THC in edibles. Eight plants (four mature); licensed shops operate.
