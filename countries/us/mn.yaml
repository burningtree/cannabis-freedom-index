segments:
  possession: 2 oz in public and 2 lb at home. From 2 to 4 oz in public is a $300 petty misdemeanour.
  cultivation: Eight plants per residence, four of them mature. Up to sixteen is a civil penalty.
  enforcement: Nothing within the limits; small overages are petty offences.
  sharing: Gifts of up to 2 oz, 8 g of concentrate or 800 mg of edibles are legal.
  consumption: >-
    Adults may use cannabis privately and at licensed venues or events; some outdoor public use
    is allowed, subject to local ordinances. Smoking bans, vehicles, schools, federal property,
    and places where minors could inhale smoke or vapour are excluded.[@2]
  access: Tribal dispensaries from 2023 and state-licensed shops from 2025.
answers:
  public:
    answer: limited
    text: Allowed in some outdoor public places; tobacco restrictions and local rules apply
