segments:
  possession: >-
    Ordinary first possession of 30 g or less brings a $100–250 fine. A second conviction within
    two years can bring up to 60 days in jail.[@2] A driver possessing more than 1 g but no more
    than 30 g on their person, or knowingly keeping or allowing it in the passenger area, faces
    up to 90 days and/or a $1,000 fine. This includes the glove compartment; the trunk and
    non-passenger areas of a vehicle without a trunk are excluded from this extra offence.[@2]
    Above 30 g but below 250 g, the law permits up to one year in county jail and/or $1,000, or
    up to three years in state custody and/or $3,000.[@2]
  cultivation:
    text: >-
      A felony.[@1]
    currency: USD
    penalties:
      - label: Growing
        treatment: criminal
        term: Felony
        note: Punished by weight — see the possession bands
  enforcement: >-
    Ordinary first possession of up to 30 g is fine-only. The separate driver offence for more
    than 1 g to 30 g can bring jail on a first conviction, and repeat possession can also bring
    jail.[@2]
  sharing: Selling up to 30 g is a felony with up to three years.
  consumption: Illegal.[@1]
  access: Medical dispensaries for card holders.[@1]
context:
  medical:
    text: >-
      Voters passed Initiative 65 in November 2020 with 74%; the state supreme court threw it out
      in May 2021, and the legislature's Medical Cannabis Act was signed on 2 February 2022.[@3]
