segments:
  possession: >-
    A first offence with 30 g or less is a fine of up to $250 with no jail. A second brings 5 to 60
    days. More than 30 g is a felony.
  cultivation: A felony.
  enforcement: A fine only for a first small offence, but jail from the second.
  sharing: Selling up to 30 g is a felony with up to three years.
  consumption: Illegal.
  access: Medical dispensaries for card holders.
