segments:
  possession: Any amount is a misdemeanour with up to six months and a $1,000 fine.
  cultivation: More than four plants is a felony with several years.
  enforcement: Jail is possible for a first offence; penalties rise for repeat offences.
  sharing: Selling under 25 g is a felony.
  consumption: Illegal.
  access: None. Only CBD with 0% THC is legal.
