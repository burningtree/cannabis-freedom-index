segments:
  possession: >-
    Unauthorised marijuana or THC possession is a Class B nonperson misdemeanour on a first
    conviction, with up to six months in jail. One qualifying prior conviction makes it a
    Class A nonperson misdemeanour, with up to one year. Two or more qualifying priors make it
    a drug severity level 5 felony, sentenced under the drug grid and criminal history.[@5,6]
    Qualifying priors include convictions under the repealed Kansas possession section,
    substantially similar out-of-state laws, and qualifying city ordinances or county
    resolutions.[@5]
  cultivation:
    text: >-
      More than four plants is a felony with several years.[@1]
    currency: USD
    penalties:
      - label: More than four plants
        treatment: criminal
        term: Felony
        prison_min: 46 months
        prison: 83 months
        fine: 300000
        note: Fifty or more plants bring longer terms
  enforcement: >-
    Jail is possible on a first possession conviction. A second qualifying conviction remains a
    misdemeanour; a third or later is a drug severity level 5 felony.[@5,6]
  sharing: Selling under 25 g is a felony.[@1]
  consumption: Illegal.[@1]
  access: >-
    There is no medical or adult-use dispensary programme.[@1] Compliant final hemp products
    may contain up to 0.3% THC by weight, but hemp cigarettes, cigars, smokeless hemp, teas and
    vaping products are prohibited, alongside products barred by food and drug rules.[@2,3]
    A patient with a debilitating condition, or the parent or guardian of a qualifying minor,
    has a defence to possession charges for independently tested treatment oil with THC no
    more than 5% of its CBD concentration. They must carry a qualifying Kansas physician’s
    letter dated within the previous 15 months and show it to an officer on request. This is a
    defence to prosecution; Kansas has no licensed medical dispensaries.[@4,5]
