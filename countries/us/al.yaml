segments:
  possession: >-
    Possession of any amount for personal use is a misdemeanour with up to a year in jail and a
    $6,000 fine. With a prior conviction it becomes a felony.
  cultivation: Growing is charged as manufacturing, a felony with 2 to 20 years.
  enforcement: Jail is a real possibility for a first offence, and a repeat offence is a felony.
  sharing: Any sale or transfer is a felony with a two-year mandatory minimum.
  consumption: >-
    Use without a medical card is illegal. A registered patient may use the approved products.
    Raw plant material and products that could be smoked or vaped are prohibited.
  access: >-
    Registered Alabama patients and caregivers may buy at licensed dispensaries. Callie's
    Apothecary in Montgomery opened on 4 June 2026, Callie's Apothecary in Talladega on 28 August
    2026, and Bama Bloom in Athens on 14 September 2026. A card requires Alabama residency, a
    qualifying condition and a recommendation from a physician certified by the Board of Medical
    Examiners. Allowed products include lozenges, tablets, capsules, tinctures, topicals, patches
    and oils for an inhaler. Raw plant material and products that could be smoked or vaped are
    prohibited.
