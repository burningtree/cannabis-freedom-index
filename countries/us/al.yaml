segments:
  possession:
    text: >-
      Possession of any amount for personal use is a misdemeanour with up to a year in jail and a
      $6,000 fine. With a prior conviction it becomes a felony.[@1]
    currency: USD
    penalties:
      - label: Any amount for personal use
        treatment: criminal
        term: Misdemeanor
        prison: 1 year
        fine: 6000
        note: Prior convictions make it a felony
  cultivation:
    text: >-
      Growing is charged as manufacturing, a felony with 2 to 20 years.[@1]
    currency: USD
    penalties:
      - label: Growing (manufacture)
        treatment: criminal
        term: Felony
        prison_min: 2 years
        prison: 20 years
        fine: 30000
        note: First-degree manufacture brings longer terms
  enforcement: Jail is a real possibility for a first offence, and a repeat offence is a felony.[@1]
  sharing:
    text: >-
      Any sale or transfer is a felony with a two-year mandatory minimum.[@1]
    currency: USD
    penalties:
      - label: Any sale or transfer
        treatment: criminal
        term: Felony
        prison_min: 2 years
        prison: 20 years
        fine: 30000
  consumption: >-
    Registered patients may use approved medical products. Raw plant material and products
    that could be smoked or vaped are prohibited.[@2] Recreational use is illegal.[@1]
  access: >-
    Registered Alabama patients and caregivers may buy at licensed dispensaries. Callie’s
    Apothecary in Montgomery opened on 4 June 2026, followed by Talladega on 28 August and
    Bama Bloom in Athens on 14 September. A card requires Alabama residency, a qualifying
    condition and a certified physician’s recommendation. Approved products include tablets,
    capsules, tinctures, topicals, patches and oils for an inhaler. Raw plant material and
    products that could be smoked or vaped are prohibited.[@2]
    [Alabama opened its first medical dispensary in 2026.](/history/us-alabama-medical-sales-open-2026/)
