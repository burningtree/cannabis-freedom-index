name: Alabama
recreational: illegal
medical: limited
updated: 2026-10-24
summary: >-
  Possession for personal use is a misdemeanour with up to a year in jail; a second offence is a
  felony. Licensed medical sales to registered Alabama patients began on 4 June 2026. Raw flower
  and products that could be smoked or vaped are prohibited.
