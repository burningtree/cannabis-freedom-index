name: Florida
recreational: illegal
medical: legal
updated: 2026-10-04
summary: >-
  20 g or less is a misdemeanour with up to a year in jail. A large medical programme operates; a
  2024 legalisation measure won 56% but needed 60%, and a 2026 attempt did not reach the ballot.
scores:
  possession: 1
  cultivation: 1
  enforcement: 2
  sharing: 1
  consumption: 1
  access: 3
segments:
  possession: >-
    20 g or less is a misdemeanour with up to a year in jail and a $1,000 fine. More than 20 g is a
    felony with up to five years.
  cultivation: A felony.
  enforcement: Jail is possible for small amounts; several counties and cities issue civil citations instead.
  sharing: Giving 20 g or less without payment is a misdemeanour; any sale is a felony.
  consumption: Illegal without a medical card; patients may not smoke in public.
  access: >-
    A large medical programme with dispensaries statewide. A 2024 ballot measure to legalise won 56%
    but needed 60%. A second initiative for November 2026 was ruled short of valid signatures and
    will not be on the ballot.
sources:
