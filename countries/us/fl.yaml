name: Florida
recreational: illegal
medical: legal
updated: 2026-10-26
summary: >-
  Up to 20 g of flower is a misdemeanour; unauthorised resin or concentrates can be a felony at any
  weight. A large medical programme operates; a 2024 legalisation measure won 56% but needed 60%,
  and a 2026 attempt did not reach the ballot.
answers:
  caught:
    answer: limited
    label: Misdemeanour or felony
    text: >-
      Up to 20 g of qualifying plant material is a misdemeanour; unauthorised resin or concentrate
      possession can be a felony at any weight
scores:
  possession: 1
  cultivation: 1
  enforcement: 2
  sharing: 1
  consumption: 1
  access: 3
segments:
  possession:
    text: >-
      Unauthorised possession of 20 g or less of qualifying cannabis plant material is a first-degree
      misdemeanour, with up to one year in jail and a $1,000 fine. The exception expressly excludes
      extracted resin and its derivatives: unauthorised possession of concentrates can be a
      third-degree felony at any weight, with up to five years and a $5,000 fine. Authorised medical
      products and lawful hemp have separate rules.[@3,4]
    currency: USD
    penalties:
      - upto: 20 g
        treatment: criminal
        term: First-degree misdemeanor
        prison: 1 year
        fine: 1000
      - over: 20 g
        upto: 25 lb
        treatment: criminal
        term: Third-degree felony
        prison: 5 years
        fine: 5000
      - over: 25 lb
        treatment: criminal
        term: Trafficking felony
        prison_min: 3 years
        fine: 25000
        note: Higher weights carry longer minimums and larger fines
  cultivation:
    text: >-
      Growing is a felony, punished by plant count: fewer than 25 plants brings up to five years,
      and the terms climb from there.[@4]
    currency: USD
    penalties:
      - label: Fewer than 25 plants
        treatment: criminal
        term: Felony
        prison: 5 years
        fine: 5000
      - label: 25 plants or more
        treatment: criminal
        term: Felony
        fine: 10000
        note: Terms rise with plant count, up to 30 years for the largest grows
  enforcement: >-
    Jail is possible for small amounts of flower; resin and concentrates fall outside the 20 g
    misdemeanour exception and can bring felony penalties. Several localities offer civil citations
    for qualifying possession cases.[@3,4]
  sharing: >-
    An unpaid transfer of 20 g or less of qualifying plant material is a misdemeanour. Resin and its
    derivatives are expressly excluded from that exception, so gifting a concentrate can be a
    felony; unauthorised sales are felonies.[@3,4]
  consumption: Illegal without a medical card; patients may not smoke in public.[@4]
  access: >-
    A large medical programme with dispensaries statewide. A 2024 ballot measure to legalise won 56%
    but needed 60%. A second initiative for November 2026 was ruled short of valid signatures and
    will not be on the ballot.[@4,5,8]
context:
  medical:
    text: >-
      Florida voters wrote medical cannabis into the constitution with Amendment 2 in 2016, and the
      Medical Marijuana Use statute licenses treatment centers serving qualified patients.[@6,7]
    sources: [7, 6]
