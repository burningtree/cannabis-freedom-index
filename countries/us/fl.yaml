name: Florida
recreational: illegal
medical: legal
updated: 2026-10-26
summary: >-
  Up to 20 g of flower is a misdemeanour; unauthorised resin or concentrates can be a felony at any
  weight. A large medical programme operates; a 2024 legalisation measure won 56% but needed 60%,
  and a 2026 attempt did not reach the ballot.
