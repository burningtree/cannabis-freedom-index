segments:
  possession: >-
    Unauthorised possession of 20 g or less of qualifying cannabis plant material is a first-degree
    misdemeanour, with up to one year in jail and a $1,000 fine. The exception expressly excludes
    extracted resin and its derivatives: unauthorised possession of concentrates can be a
    third-degree felony at any weight, with up to five years and a $5,000 fine. Authorised medical
    products and lawful hemp have separate rules.
  cultivation: A felony.
  enforcement: >-
    Jail is possible for small amounts of flower; resin and concentrates fall outside the 20 g
    misdemeanour exception and can bring felony penalties. Several localities offer civil citations
    for qualifying possession cases.
  sharing: >-
    An unpaid transfer of 20 g or less of qualifying plant material is a misdemeanour. Resin and its
    derivatives are expressly excluded from that exception, so gifting a concentrate can be a
    felony; unauthorised sales are felonies.
  consumption: Illegal without a medical card; patients may not smoke in public.
  access: >-
    A large medical programme with dispensaries statewide. A 2024 ballot measure to legalise won 56%
    but needed 60%. A second initiative for November 2026 was ruled short of valid signatures and
    will not be on the ballot.
