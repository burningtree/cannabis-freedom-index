segments:
  possession:
    text: >-
      3 oz is legal.[@2,3]
    currency: USD
    penalties:
      - upto: 3 oz
        treatment: legal
  cultivation: >-
    Adults 21+ with a state cultivation registration card may grow six flowering plants, six
    non-flowering plants 14 inches tall or more and six clones under 14 inches tall: 18 plants in
    all. They must be at one private residence, locked away and outside unaided public view. Two
    registered consumers sharing a grow may keep up to 12 of each stage, 36 in all, subject to
    registration and shared-cultivation rules.[@1,2]
  enforcement: Nothing within the limits.[@2,3]
  sharing: Adults may give each other up to 3 oz without payment.[@2]
  consumption: Private only.[@2]
  access: Licensed shops since February 2023.[@4]
context:
  recreational:
    text: >-
      Amendment 3 (November 2022) legalised adult use with 53% of the vote; possession became
      legal that December and the first licensed shops opened on 3 February 2023.[@4]
    sources: [4]
