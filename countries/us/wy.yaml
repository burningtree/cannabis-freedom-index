segments:
  possession: >-
    Unauthorised possession on a first offence is a misdemeanour with up to twelve months and $1,000
    for no more than 3 oz in plant form, 0.3 g in liquid form, or 3 g in powder, crystalline, pill
    or capsule form. Above the applicable limit, marijuana/THC possession can be a felony with up to
    five years and $10,000. The third or subsequent otherwise-misdemeanour offence can bring five
    years and $5,000. Statutory weights include carriers and diluents, excluding packaging; lawful
    statutory exceptions and FDA-approved medicines are separate.[@2]
  cultivation: A misdemeanour with up to six months.
  enforcement: >-
    Prison is possible on a first offence. The 3 oz misdemeanour ceiling is for plant form only;
    liquids have a 0.3 g ceiling and powder/crystalline or pill/capsule forms 3 g, above which
    felony penalties can apply.[@2]
  sharing: Any sale is a felony with up to ten years.
  consumption: Being under the influence is itself a misdemeanour with up to six months.
  access: None.
