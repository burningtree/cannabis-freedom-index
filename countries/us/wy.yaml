name: Wyoming
recreational: illegal
medical: none
updated: '2026-10-26'
summary: >-
  Unauthorised possession is criminal: the first-offence misdemeanour ceilings are 3 oz of plant
  material, 0.3 g of liquid, or 3 g of powder or pills. Larger amounts can bring a felony. No
  medical programme.
