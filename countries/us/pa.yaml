name: Pennsylvania
recreational: illegal
medical: legal
updated: 2026-10-24
summary: >-
  30 g or less is a misdemeanour with up to 30 days in jail, cut to a small fine in Philadelphia,
  Pittsburgh and other cities. A large medical programme operates.
