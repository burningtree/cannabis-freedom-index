segments:
  possession: >-
    30 g or less is a misdemeanour with up to 30 days and a $500 fine; a first conviction is
    eligible for conditional release. More is a misdemeanour with up to a year.
  cultivation: Any number of plants is a felony with 2.5 to 5 years.
  enforcement: >-
    Short jail terms are possible; Philadelphia, Pittsburgh and other cities issue small fines
    instead.
  sharing: Giving 30 g or less without payment is a misdemeanour with up to 30 days.
  consumption: Illegal without a medical card.
  access: A large medical programme with dispensaries statewide.
sources:
  - title: NORML — Pennsylvania laws and penalties
