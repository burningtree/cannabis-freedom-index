segments:
  possession: >-
    1 oz is legal. From 1 to 2 oz is a $200 civil infraction; more than 2 oz is a felony with up to
    five years.
  cultivation: >-
    The Department of Revenue says home growing is for Montana residents 21+; visitors may not grow.
    The ordinary adult allowance is two mature plants and two seedlings per person, four of each per
    private residence. Plants must be locked away and outside unaided public view. Growers must own
    the home or obtain its owner’s written permission; the grow area may not be shared with, rented
    or leased to a cannabis business. Registered medical cardholders have a separate, higher
    allowance.
  enforcement: Nothing within the limits, but a steep jump to a felony above 2 oz.
  sharing: Transfers of up to 1 oz without compensation are legal.
  consumption: Private only.
  access: Licensed shops in counties that voted for legalisation.
