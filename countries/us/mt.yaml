segments:
  possession: >-
    1 oz is legal. From 1 to 2 oz is a $200 civil infraction; more than 2 oz is a felony with up to
    five years.
  cultivation: Two mature plants and two seedlings per adult.
  enforcement: Nothing within the limits, but a steep jump to a felony above 2 oz.
  sharing: Transfers of up to 1 oz without compensation are legal.
  consumption: Private only.
  access: Licensed shops in counties that voted for legalisation.
sources:
  - title: NORML — Montana laws and penalties
