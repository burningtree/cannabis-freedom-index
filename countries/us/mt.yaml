segments:
  possession: >-
    Adults 21+ may ordinarily possess one ounce equivalent: 1 oz flower, 8 g concentrate or
    800 mg THC in marijuana products. Combinations count together toward that single equivalent
    allowance.[@2,4,5] Lawful home-grown harvest above 1 oz may be stored in a locked space at
    the private residence under the cultivation rules. Medical cardholders have separate
    programme allowances.[@2]
    The civil bands are more than 1 oz but less than 2 oz flower, or more than 8 g but less than
    16 g concentrate. A first violation brings forfeiture and a choice of a fine up to $200 or
    up to four hours' community service; repeat maxima rise to $300/six hours and $500/eight
    hours.[@2] Other unauthorised possession can bring a felony with up to five years or $5,000
    or both; those concentrate and edible cases cannot be classified by physical flower weight
    alone.[@6]
  cultivation: >-
    The Department of Revenue says home growing is for Montana residents 21+; visitors may not grow.
    The ordinary adult allowance is two mature plants and two seedlings per person, four of each per
    private residence. Plants must be locked away and outside unaided public view. Growers must own
    the home or obtain its owner’s written permission; the grow area may not be shared with, rented
    or leased to a cannabis business. Registered medical cardholders have a separate, higher
    allowance.
  enforcement: >-
    No state penalty inside the adult-use permission. Flower over 1 oz but under 2 oz and
    concentrate over 8 g but under 16 g have civil penalties and forfeiture; other unauthorised
    amounts can bring a felony. The first criminal-possession violation carries a presumption
    of a deferred prison sentence.[@2,6]
  sharing: >-
    Adults 21+ may give another adult 21+ up to one ounce equivalent without compensation:
    1 oz flower, 8 g concentrate or 800 mg THC in products, counting combinations together.
    The statute also covers transfers to registered cardholders.[@2,5]
  consumption: Private only.[@1]
  access: Licensed shops in counties that voted for legalisation.[@1,7]
context:
  recreational:
    text: >-
      Initiatives 190 and 118 (November 2020) legalised adult use with about 57% of the vote;
      licensed shops opened on 1 January 2022 in counties that voted for legalisation.[@7]
    sources: [7]
