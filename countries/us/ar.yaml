name: Arkansas
recreational: illegal
medical: legal
updated: 2026-10-04
summary: >-
  Under 4 oz is a misdemeanour with up to a year in jail. Medical cannabis is sold in dispensaries
  to card holders.
scores:
  possession: 1
  cultivation: 1
  enforcement: 2
  sharing: 1
  consumption: 1
  access: 3
segments:
  possession: >-
    Under 4 oz is a misdemeanour with up to a year in jail and a $2,500 fine for a first offence; a
    repeat offence with over 1 oz is a felony.
  cultivation: Illegal, and medical patients may not grow either.
  enforcement: Jail is possible; fines and probation are typical for a first offence.
  sharing: Any delivery is a crime, graded by weight.
  consumption: Illegal without a medical card.
  access: Medical dispensaries for registered patients only.
sources:
  - title: NORML — Arkansas laws and penalties
    url: https://norml.org/laws/arkansas-penalties/
