name: Arkansas
recreational: illegal
medical: legal
updated: '2026-10-27'
summary: >-
  Under 4 oz is ordinarily a misdemeanour. With four qualifying prior possession convictions,
  1–4 oz is a felony. Medical dispensaries serve card holders.
scores:
  possession: 1
  cultivation: 1
  enforcement: 2
  sharing: 1
  consumption: 1
  access: 3
segments:
  possession: >-
    Under 4 oz is ordinarily a Class A misdemeanour, with up to one year and $2,500.[@1] At least
    1 oz but less than 4 oz becomes a Class D felony with four previous convictions under
    §5-64-419 or former §5-64-401(c). At least 4 oz but less than 10 lb is Class D regardless of
    priors; larger quantities have higher felony grades.[@2]
  cultivation:
    text: >-
      Illegal, and medical patients may not grow either; grows are punished as possession or
      possession with intent, depending on amount.[@1]
    currency: USD
    penalties:
      - label: Manufacture of 14 g or less
        treatment: criminal
        term: Misdemeanor
        prison: 1 year
        fine: 2500
        note: Larger grows punished as possession with intent by weight
  enforcement: Jail is possible; fines and probation are typical for a first offence.[@1]
  sharing: Any delivery is a crime, graded by weight.[@1]
  consumption: Illegal without a medical card.[@1]
  access: Medical dispensaries for registered patients only.[@1]
sources:
