segments:
  possession: >-
    A person 21 or older may possess 1.5 ounces of cannabis plant material, and 5 ounces in a locked
    container at home or in a locked glove box or trunk. From 1 July 2023, a live plant and the
    cannabis grown from a plant that person cultivated lawfully at their own primary residence do
    not count toward that limit. Going over the limit while staying under 5 ounces, and under 8
    ounces in that locked container, is a $100 fine the first time and $250 after that. Five ounces
    or more, or 8 ounces or more in the locked container, is a $500 fine the first time and a class
    C misdemeanour after that.
  cultivation: >-
    Six plants per adult (three mature), twelve per household. Going over brings a written warning
    first.
  enforcement: Nothing within the limits; small overages are warnings or civil fines.
  sharing: Adults may give cannabis to other adults within the possession limit.
  consumption: Private use; towns may restrict or designate public areas.
  access: >-
    Licensed shops since 2023. From 1 October 2026 the 70% THC cap on concentrates is gone and the
    potency-based tax is replaced by a flat rate.
