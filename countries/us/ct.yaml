name: Connecticut
recreational: legal
medical: legal
updated: '2026-10-27'
summary: >-
  1.5 oz on you and 5 oz locked at home. Cannabis grown lawfully at the grower's own home does not
  count toward those limits. Six plants (three mature), twelve per household. Licensed shops since
  2023.
scores:
  possession: 6
  cultivation: 4
  enforcement: 6
  sharing: 5
  consumption: 5
  access: 6
segments:
  possession: >-
    A person 21 or older may possess 1.5 ounces of cannabis plant material, and 5 ounces in a locked
    container at home or in a locked glove box or trunk. From 1 July 2023, a live plant and the
    cannabis grown from a plant that person cultivated lawfully at their own primary residence do
    not count toward that limit. Going over the limit while staying under 5 ounces, and under 8
    ounces in that locked container, is a $100 fine the first time and $250 after that. Five ounces
    or more, or 8 ounces or more in the locked container, is a $500 fine the first time and a class
    C misdemeanour after that.
  cultivation:
    text: >-
      Six plants per adult (three mature), twelve per household. Going over brings a written warning
      first.[@5]
    currency: USD
    penalties:
      - upto: 6 plants
        treatment: legal
        note: Three mature; twelve per household
      - label: Over the plant count
        treatment: tolerated
        note: Written warning for a first offence; later offences bring fines and then jail
  enforcement: Nothing within the limits; small overages are warnings or civil fines.[@1,2]
  sharing: Adults may give cannabis to other adults within the possession limit.[@1]
  consumption: >-
    Private use and some outdoor public smoking or vaping are allowed. Tobacco-free places, state
    parks, beaches and waters are excluded; towns may impose additional public-use restrictions.[@4]
  access: >-
    Licensed shops since January 2023. From 1 October 2026 the 70% THC cap on concentrates is gone
    and the potency-based tax is replaced by a flat rate.[@3,6]
context:
  recreational:
    text: >-
      Senate Bill 1201 (June 2021) legalised adult use; the first licensed shops opened on
      10 January 2023.[@6]
    sources: [6]
answers:
  public:
    answer: limited
    text: Allowed in some outdoor public places; tobacco restrictions and local rules apply
