name: New Jersey
recreational: legal
medical: legal
updated: '2026-10-27'
summary: >-
  Adults 21+ have full possession protection for up to 1 oz of licensed cannabis, subject to
  lawful-source conditions. Over 1–6 oz is decriminalised but excess can be seized. Shops
  operate; home growing remains criminal.
scores:
  possession: 5
  cultivation: 1
  enforcement: 6
  sharing: 5
  consumption: 3
  access: 6
segments:
  possession: >-
    Adults 21+ are protected from criminal penalty and seizure for up to 1 oz of licensed
    cannabis, applicable product equivalents or 5 g resin, subject to statutory lawful-source and
    proof-of-purchase conditions.[@3] Over 1 oz through 6 oz is not a criminal possession offence,
    but excess over 1 oz may be confiscated even if bought legally. Over 6 oz can be a
    fourth-degree crime with up to 18 months.[@2]
  cultivation: Not allowed. Growing even a few plants is a crime with three to five years.
  enforcement: >-
    The 1 oz statutory safe harbour protects qualifying licensed cannabis. Above that, through 6
    oz, excess may be seized without a criminal possession charge. Home growing remains
    criminal.[@2,3]
  sharing: Giving less than 1 oz without payment is legal.
  consumption: Private only; licensed consumption areas are authorised.
  access: Licensed shops since April 2022.
