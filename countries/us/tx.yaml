segments:
  possession: >-
    2 oz or less is a misdemeanour with up to 180 days and a $2,000 fine. Any amount of concentrate
    is a felony.
  cultivation: Charged by weight, like possession.
  enforcement: Jail is possible; Austin, Dallas and several other places no longer arrest for small amounts.
  sharing: Giving 7 g or less without payment is a misdemeanour with up to 180 days.
  consumption: Illegal.
  access: >-
    A restricted low-THC medical programme, widened in 2025. Hemp-derived THC products are sold
    widely in a legal grey zone.
sources:
