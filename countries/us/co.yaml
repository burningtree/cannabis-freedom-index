segments:
  possession: 2 oz is legal. Slightly more is a petty offence; over 3 oz is a misdemeanour.
  cultivation: Six plants per adult, three of them flowering. More than six is a felony.
  enforcement: Nothing within the limits; open public use is a $100 petty offence.
  sharing: Transfers of up to 2 oz without payment are legal.
  consumption: Private use, plus licensed hospitality venues in some cities.
  access: Licensed shops since 2014, the first in the country.
sources:
  - title: NORML — Colorado laws and penalties
