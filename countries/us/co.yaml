name: Colorado
recreational: legal
medical: legal
updated: 2026-10-23
summary: >-
  Up to 2 oz may be possessed. A person 21 or older may give up to 1 oz, with no payment, to
  another person 21 or older. Six plants per adult, three flowering, in an enclosed locked space,
  and no more than 12 at a residence. Licensed shops since 2014; hospitality venues in some cities.
scores:
  possession: 5
  cultivation: 4
  enforcement: 6
  sharing: 5
  consumption: 4
  access: 6
segments:
  possession:
    text: >-
      Possessing up to 2 ounces is not an offence under the possession paragraphs. More than 2
      ounces, up to 6 ounces, is a level 2 drug misdemeanour. More than 6 ounces is a level 1
      drug misdemeanour.[@1,2,6]
    currency: USD
    penalties:
      - upto: 2 oz
        treatment: legal
      - over: 2 oz
        upto: 6 oz
        treatment: criminal
        term: Level 2 drug misdemeanor
        prison_min: 3 months
        prison: 364 days
        fine: 1000
      - over: 6 oz
        treatment: criminal
        term: Level 1 drug misdemeanor
        prison_min: 6 months
        prison: 18 months
        fine: 5000
  cultivation: >-
    A person 21 or older may grow up to six plants, no more than three of them flowering, in an
    enclosed and locked space. Two adults can therefore keep twelve at one residence, and a
    seventh plant in that household is not by itself a felony. A first offence of more than
    twelve plants at a residence is a petty offence with a fine of up to $1,000. Growing outside
    that personal permission is a separate offence: six plants or fewer is a level 1 drug
    misdemeanour, and more than six, up to thirty, is a level 4 drug felony. A medical patient
    or caregiver with the 24-plant exception, or a local law that expressly allows more plants
    in an enclosed locked space, sits outside the twelve-plant residential offence.[@1,2]
  enforcement: Nothing within the limits; open public use is a $100 petty offence.[@1,2]
  sharing: >-
    A person 21 or older may give up to 1 ounce, with no payment, to another person 21 or older.
    Giving more than that, up to 2 ounces, with no payment is a drug petty offence and is not
    treated as a sale. A free transfer tied to payment for something else is a level 1 drug
    misdemeanour.[@1]
  consumption: Private use, plus licensed hospitality venues in some cities.[@3,4]
  access: >-
    Licensed shops since 2014, the first in the country.[@2]
    [The first licensed shops opened in 2014.](/history/us-colorado-first-shops-2014/)
context:
  recreational:
    text: >-
      Amendment 64 (November 2012) legalised adult use; the first licensed shops opened on
      1 January 2014.[@2,5]
      [Colorado and Washington legalised in 2012.](/history/us-colorado-washington-2012/)
      [The first licensed shops opened in 2014.](/history/us-colorado-first-shops-2014/)
    sources: [2, 5]
