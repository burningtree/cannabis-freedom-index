summary: >-
  Up to 2 oz may be possessed. A person 21 or older may give up to 1 oz, with no payment, to
  another person 21 or older. Six plants per adult, three flowering, in an enclosed locked space,
  and no more than 12 at a residence. Licensed shops since 2014; hospitality venues in some cities.
