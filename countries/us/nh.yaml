segments:
  possession: >-
    For adults, up to ¾ oz of marijuana or 5 g of hashish ordinarily brings a $100 civil fine for
    the first or second offence, and up to $300 for a subsequent offence within three years. A
    fourth offence is a class B misdemeanour if the complaint alleges three qualifying prior
    convictions within three years, including reasonably equivalent out-of-state offences. That
    crime is fine-only, with no jail. Larger quantities have separate criminal penalties.
  cultivation: Illegal.
  enforcement: >-
    Small-amount cases ordinarily carry civil fines, but a fourth qualifying offence within three
    years can be a criminal class B misdemeanour, without jail. A court must waive one fine in a
    three-year period on timely proof of a completed substance-abuse assessment. The statute
    protects personally identifying records from public and out-of-state access.
  sharing: Selling under 1 oz is a felony with up to three years.
  consumption: Illegal.
  access: >-
    Therapeutic cannabis centres for registered patients. The only New England state without legal
    sales.
