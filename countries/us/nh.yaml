segments:
  possession: >-
    Up to ¾ oz is a $100 civil violation for a first or second offence. More is a misdemeanour with
    up to a year.
  cultivation: Illegal.
  enforcement: A fine only for small amounts.
  sharing: Selling under 1 oz is a felony with up to three years.
  consumption: Illegal.
