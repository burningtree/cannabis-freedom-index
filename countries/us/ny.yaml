segments:
  possession: 3 oz on your person and 5 lb at home. From 3 to 16 oz is a $150 violation.
  cultivation: Six plants per adult, three of them mature.
  enforcement: "Mild: overages are violations before they become misdemeanours."
  sharing: Up to 3 oz, or 24 g of concentrate, may be given away without compensation.
  consumption: Allowed almost anywhere tobacco smoking is.
  access: Licensed shops since December 2022, after a slow rollout.
