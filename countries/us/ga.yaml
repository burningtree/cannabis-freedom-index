name: Georgia
recreational: illegal
medical: legal
updated: 2026-10-24
summary: >-
  1 oz or less is a misdemeanour with up to a year in jail, though Atlanta and several cities have
  cut it to a small fine. From 1 July 2026 a registered patient may buy medical cannabis products,
  including flower for vaporization. Smoking it remains illegal.
scores:
  possession: 1
  cultivation: 1
  enforcement: 2
  sharing: 1
  consumption: 1
  access: 1
segments:
  possession:
    text: >-
      1 oz or less is a misdemeanour with up to a year and a $1,000 fine. More than 1 oz is a felony
      with one to ten years.[@1]
    currency: USD
    penalties:
      - upto: 1 oz
        treatment: criminal
        term: Misdemeanor
        prison: 1 year
        fine: 1000
      - over: 1 oz
        treatment: criminal
        term: Felony
        prison_min: 1 year
        prison: 10 years
        fine: 5000
  cultivation:
    text: >-
      A felony with one to ten years; grows are charged by weight in the lowest trafficking
      band.[@1]
    currency: USD
    penalties:
      - label: Growing (charged by weight)
        treatment: criminal
        term: Felony
        prison_min: 1 year
        prison: 10 years
        fine: 5000
  enforcement: >-
    Jail is possible, but Atlanta cut under-1-oz possession to a $75 fine in 2017 and Savannah
    to $150 in 2018, with more cities following.[@1,5]
  sharing: Any sale is a felony with a one-year minimum.[@1]
  consumption: >-
    Recreational use is illegal. Registered patients may use approved medical products.[@2]
    Smoking and medical use in public are prohibited. Vaporization is prohibited for patients
    aged 21 or younger.[@4]
  access: >-
    Since 1 July 2026, registered patients and caregivers may buy oils, tinctures, patches,
    lotions, capsules, ingestibles and vaporizer products, including medical cannabis flower
    for vaporization, from licensed dispensaries or independent pharmacies. Smoking, candies,
    cookies and patient home growing remain prohibited. A cardholder may possess up to
    12,000 mg THC in labelled pharmaceutical packaging, with no more than 1,200 mg in each
    package.[@2,3]
    [Georgia let patients buy flower for vaporization in 2026.](/history/us-georgia-medical-flower-2026/)
