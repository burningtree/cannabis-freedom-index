segments:
  possession: >-
    1 oz or less is a misdemeanour with up to a year and a $1,000 fine. More than 1 oz is a felony
    with one to ten years.
  cultivation: A felony with one to ten years.
  enforcement: Jail is possible; Atlanta, Savannah and other cities fine small possession instead.
  sharing: Any sale is a felony with a one-year minimum.
  consumption: >-
    Recreational use is illegal. A registered patient may use the approved medical products.
    Smoking is prohibited. Vaporization is for a registered patient over 21.
  access: >-
    From 1 July 2026 a registered patient or caregiver may buy oils, tinctures, patches, lotions,
    capsules, ingestibles and vaporizer products, including medical cannabis flower for
    vaporization, at a licensed dispensary or an independent pharmacy. Smoking, candies, cookies
    and home growing are prohibited. A cardholder may possess up to 12,000 mg of THC in a labelled
    pharmaceutical container, with up to 1,200 mg in a package.
