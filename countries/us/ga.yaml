segments:
  possession: >-
    1 oz or less is a misdemeanour with up to a year and a $1,000 fine. More than 1 oz is a felony
    with one to ten years.
  cultivation: A felony with one to ten years.
  enforcement: Jail is possible; Atlanta, Savannah and other cities fine small possession instead.
  sharing: Any sale is a felony with a one-year minimum.
  consumption: >-
    Recreational use is illegal. Registered patients may use approved medical products.[@2]
    Smoking and medical use in public are prohibited. Vaporization is prohibited for patients
    aged 21 or younger.[@4]
  access: >-
    Since 1 July 2026, registered patients and caregivers may buy oils, tinctures, patches,
    lotions, capsules, ingestibles and vaporizer products, including medical cannabis flower
    for vaporization, from licensed dispensaries or independent pharmacies. Smoking, candies,
    cookies and patient home growing remain prohibited. A cardholder may possess up to
    12,000 mg THC in labelled pharmaceutical packaging, with no more than 1,200 mg in each
    package.[@2,3]
