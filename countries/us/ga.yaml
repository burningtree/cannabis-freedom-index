updated: 2026-10-24
summary: >-
  1 oz or less is a misdemeanour with up to a year in jail, though Atlanta and several cities have
  cut it to a small fine. From 1 July 2026 a registered patient may buy medical cannabis products,
  including flower for vaporization. Smoking it remains illegal.
