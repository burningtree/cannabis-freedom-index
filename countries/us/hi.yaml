name: Hawaii
recreational: decriminalised
medical: legal
updated: 2026-10-04
summary: >-
  Up to 3 g is a $130 violation; more is a misdemeanour. Medical cannabis is dispensed to card
  holders, who may also grow.
scores:
  possession: 2
  cultivation: 1
  enforcement: 3
  sharing: 1
  consumption: 1
  access: 3
segments:
  possession: >-
    Up to 3 g is a $130 violation. From 3 g to 1 oz is a petty misdemeanour with up to 30 days; 1 oz
    or more is a misdemeanour with up to a year.
  cultivation: Illegal outside the medical programme; registered patients may grow a limited number of plants.
  enforcement: A fine for tiny amounts, jail possible above 3 g.
  sharing: Selling under 1 oz is a misdemeanour with up to a year.
  consumption: Illegal without a medical card.
  access: Medical dispensaries for card holders, including visiting patients.
sources:
  - title: NORML — Hawaii laws and penalties
    url: https://norml.org/laws/hawaii-penalties/
