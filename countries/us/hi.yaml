name: Hawaii
recreational: decriminalised
medical: legal
updated: '2026-10-26'
summary: >-
  Up to 3 g of marijuana plant material is a $130 violation. Concentrates have separate criminal
  penalties, including felonies from ⅛ oz. Card holders have a medical programme.
scores:
  possession: 2
  cultivation: 1
  enforcement: 3
  sharing: 1
  consumption: 1
  access: 3
segments:
  possession: >-
    For marijuana plant material, up to 3 g is a $130 violation; over 3 g but under 1 oz is a petty
    misdemeanour, and 1 oz or more can be a misdemeanour.[@1] Marijuana concentrates are classified
    separately as harmful drugs: small possession is a misdemeanour, while ⅛ oz or more of a
    concentrate-containing preparation is a class B felony and 1 oz or more a class A felony.
    Separate dosage-unit thresholds also apply. Authorised medical use and the statutory hemp
    exceptions have separate protections.[@2,3,4,5]
  cultivation: Illegal outside the medical programme; registered patients may grow a limited number of plants.
  enforcement: >-
    The $130 small-quantity violation concerns marijuana plant material. Unauthorised concentrate
    possession can bring a misdemeanour or, from ⅛ oz, a class B felony carrying up to ten years;
    from 1 oz, a class A felony carrying up to twenty years.[@1,3,4,5]
  sharing: >-
    Small plant-material transfers have different penalties from concentrates.[@1] Distributing any
    amount of marijuana concentrate is at least a class B felony; ⅛ oz or more, 25 dosage units or
    supply to a minor falls under the class A offence.[@2,3,4]
  consumption: Illegal without a medical card.
  access: Medical dispensaries for card holders, including visiting patients.
