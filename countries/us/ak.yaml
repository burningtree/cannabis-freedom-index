name: Alaska
recreational: legal
medical: legal
updated: 2026-10-27
summary: >-
  Adults 21+ may carry 1 oz and grow six plants (three mature), keeping their full lawful harvest
  where it was grown. Licensed shops since 2016; some offer on-site consumption.
scores:
  possession: 5
  cultivation: 4
  enforcement: 6
  sharing: 5
  consumption: 4
  access: 6
segments:
  possession: >-
    Adults 21+ may generally possess and carry up to 1 oz. They may keep all the marijuana from
    their lawful personal plants on the premises where it was grown, with no additional weight
    cap. This harvest exception does not authorise carrying the whole crop off-site or pooling
    other people's crops in an unlicensed cooperative.[@2,3]
    Separately, the Noy privacy ruling protects adults' possession of less than 4 oz at home for
    personal use.[@4] Outside the applicable protections, more than 1 oz but less than 4 oz can
    be a misdemeanour and 4 oz or more a felony; the felony threshold does not override the
    lawful on-site harvest exception.[@1,2]
  cultivation: >-
    Adults 21+ may grow six plants each, no more than three mature; a dwelling is limited to twelve
    plants, six mature, regardless of how many adults live there. Plants must be out of public
    view and secured against unauthorised access, on lawfully held land with the owner's consent.
    The grower may keep the full lawful harvest on the premises where the plants were grown.[@2,3]
  enforcement: >-
    Nothing within the limits. Selling under 1 oz without a licence is a misdemeanour with up to a
    year. The lawful personal harvest kept where grown is protected even above 4 oz.[@2,3]
  sharing: Adults may give each other up to 1 oz; any unlicensed sale is a crime.
  consumption: Private use, plus on-site consumption at shops holding a special endorsement.
  access: Licensed shops since 2016.
answers:
  carry:
    answer: yes
    text: Adults 21+ may generally carry 1 oz; their full lawful personal harvest may be kept where grown
