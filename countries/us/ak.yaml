name: Alaska
recreational: legal
medical: legal
updated: 2026-10-04
summary: >-
  Adults 21+ may hold 1 oz and grow six plants (three mature). Licensed shops since 2016, and some
  may offer on-site consumption.
scores:
  possession: 5
  cultivation: 4
  enforcement: 6
  sharing: 5
  consumption: 4
  access: 6
segments:
  possession: >-
    Adults 21+ may hold 1 oz with no penalty, and up to 4 oz inside their own home. Between 1 and 4
    oz outside the home is a misdemeanour; 4 oz or more is a felony.
  cultivation: Six plants per adult, no more than three mature, and up to twelve per dwelling.
  enforcement: >-
    Nothing within the limits. Selling under 1 oz without a licence is a misdemeanour with up to a
    year.
  sharing: Adults may give each other up to 1 oz; any unlicensed sale is a crime.
  consumption: Private use, plus on-site consumption at shops holding a special endorsement.
  access: Licensed shops since 2016.
sources:
  - title: NORML — Alaska laws and penalties
    url: https://norml.org/laws/alaska-penalties/
