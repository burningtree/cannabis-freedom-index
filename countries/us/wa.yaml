name: Washington
recreational: legal
medical: legal
updated: 2026-10-23
summary: >-
  1 ounce of useable cannabis is legal for a person 21 or older, and shops have operated since
  2014. A qualifying patient may grow at home, including four plants with a valid authorization and
  no entry in the medical database. Growing outside that permission is a class C felony.
