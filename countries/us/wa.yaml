segments:
  possession: >-
    1 oz is legal. From 1 oz to 40 g is a misdemeanour with a 24-hour mandatory minimum; more than
    40 g is a felony.
  cultivation: Any amount is a felony unless you are a registered medical patient.
  enforcement: Nothing within the limit, but small overages mean jail time.
  sharing: Adults may share small amounts without payment; any sale outside a licensed shop is a felony.
  consumption: Private only; public consumption is a $50 civil penalty.
  access: Licensed shops since 2014.
sources:
