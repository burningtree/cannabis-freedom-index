  consumption: 3
  access: 6
segments:
  possession: >-
    A person 21 or older may possess up to 1 ounce of useable cannabis, 16 ounces of a solid
    infused product, 72 ounces of a liquid infused product, or 7 grams of concentrate. A liquid
    product packed in units of no more than four milligrams of THC is limited to 200 milligrams of
    THC. Knowing possession of 40 grams or less of cannabis, outside that allowance, is a
    misdemeanour, and that section sets no mandatory jail term. Knowing possession of more than 40
    grams is a gross misdemeanour.
  cultivation: >-
    A qualifying patient or designated provider with a valid authorization who is not in the
    medical cannabis database may grow up to four plants in their domicile and possess up to six
    ounces there. Someone entered in the database may grow six plants and possess eight ounces from
    them, or up to fifteen plants and sixteen ounces when the authorization says the medical need
    is greater. A person who is both a patient and a designated provider may hold twice those
    amounts, and no more than fifteen plants in one housing unit. The protection depends on staying
    within those amounts, showing the authorization or recognition card to an officer who asks, and
    posting a copy next to the plants. Cannabis is a Schedule I substance, and manufacture outside
    that permission is a class C felony.
  enforcement: >-
    Nothing within the adult allowance. Knowing possession of 40 grams or less outside it is a
    misdemeanour, and the prosecutor is encouraged to divert the case.
  sharing: >-
    A person 21 or older may, during a single 24-hour period and without payment, give one or more
    people 21 or older up to one-half ounce of useable cannabis, eight ounces of a solid infused
    product, 36 ounces of a liquid infused product, or three and one-half grams of concentrate. A
    liquid product packed in units of no more than four milligrams of THC is limited to 100
    milligrams of THC instead. The gift has to be out of general public view in a nonpublic place,
    or stay in its original retailer packaging. A sale outside a licensed shop is a class C felony.
  consumption: Private only; public consumption is a $50 civil penalty.
  access: Licensed shops since 2014.
