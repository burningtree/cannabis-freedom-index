name: Indiana
recreational: illegal
medical: none
updated: '2026-10-27'
summary: >-
  Possession ordinarily carries up to 180 days. Prior drug convictions and separate
  marijuana/hash thresholds can make it a felony. No medical programme.
scores:
  possession: 1
  cultivation: 0
  enforcement: 2
  sharing: 0
  consumption: 1
  access: 0
segments:
  possession: >-
    Possession is ordinarily a Class B misdemeanour, with up to 180 days and $1,000.[@1] A prior
    drug conviction makes it Class A, or Level 6 felony at at least 30 g marijuana or at least 5 g
    hash oil/hashish. Deceptive low-THC-hemp-extract packaging is a separate Class A trigger.
    Statutory product definitions determine which weight applies.[@2]
  cultivation:
    text: >-
      Illegal; charged like possession for small grows and as a felony for larger ones.[@1]
    currency: USD
    penalties:
      - label: Growing under 30 g
        treatment: criminal
        term: Misdemeanor
        prison: 1 year
        fine: 5000
      - label: Growing 30 g or more
        treatment: criminal
        term: Felony
        prison_min: 6 months
        prison: 2.5 years
        fine: 10000
        note: Higher weights bring longer terms
  enforcement: Jail is possible for a first offence.[@1]
  sharing: >-
    Unauthorised delivery is ordinarily a Class A misdemeanour. It becomes Level 6 at at least 30
    g marijuana or 5 g hash oil/hashish, or below those amounts with a prior drug conviction;
    larger quantities and other aggravating factors increase the grade.[@3]
  consumption: Illegal.[@1]
  access: None. Only CBD with under 0.3% THC is legal.[@1]
