segments:
  possession: >-
    Any amount is a misdemeanour with up to 180 days and a $1,000 fine. With a prior drug offence it
    rises to a year, or a felony for 30 g or more.
  cultivation: Illegal; charged like possession for small grows and as a felony for larger ones.
  enforcement: Jail is possible for a first offence.
  sharing: Selling under 30 g is a misdemeanour with up to a year.
  consumption: Illegal.
  access: None. Only CBD with under 0.3% THC is legal.
sources:
  - title: NORML — Indiana laws and penalties
