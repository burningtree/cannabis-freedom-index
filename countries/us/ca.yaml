segments:
  possession: Adults 21+ may hold 28.5 g of flower and 8 g of concentrate.
  cultivation: Six plants per household. More than six is a misdemeanour with up to six months.
  enforcement: >-
    Among the mildest in the country: most personal offences beyond the limits are infractions or
    misdemeanours.
  sharing: Gifts of up to 28.5 g between adults are legal.
  consumption: Private use and licensed consumption lounges; smoking in public is a $100 infraction.
  access: Licensed shops and delivery, although many cities and counties ban sales.
sources:
  - title: NORML — California laws and penalties
