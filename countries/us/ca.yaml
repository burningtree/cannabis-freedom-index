name: California
recreational: legal
medical: legal
updated: "2026-10-27"
summary: >-
  28.5 g of flower (8 g of concentrate) and six plants per household. Shops, delivery and licensed
  consumption lounges; many cities still ban sales.
scores:
  possession: 5
  cultivation: 4
  enforcement: 6
  sharing: 5
  consumption: 4
  access: 6
segments:
  possession:
    text: >-
      Adults 21+ may hold 28.5 g of flower and 8 g of concentrate. More is a misdemeanour with up
      to six months in jail and a $500 fine.[@1]
    currency: USD
    penalties:
      - upto: 28.5 g
        treatment: legal
        note: Adults 21 and over; up to 8 g of concentrate besides
      - over: 28.5 g
        treatment: criminal
        term: Misdemeanor
        prison: 6 months
        fine: 500
  cultivation:
    text: >-
      Six plants per household. More than six is a misdemeanour with up to six months and a $500
      fine.[@1]
    currency: USD
    penalties:
      - upto: 6 plants
        treatment: legal
        note: Per household, adults 21 and over
      - over: 6 plants
        treatment: criminal
        term: Misdemeanor
        prison: 6 months
        fine: 500
  enforcement: >-
    Among the mildest in the country: most personal offences beyond the limits are infractions or
    misdemeanours.
  sharing: >-
    An adult 21+ may give another adult 21+ up to 28.5 g of non-concentrated cannabis or up to
    8 g of concentrated cannabis, including concentrate contained in cannabis products, without
    any compensation. These are the ordinary adult-use gift permissions.[@2]
  consumption: Private use and licensed consumption lounges; smoking in public is a $100 infraction.
  access: Licensed shops and delivery, although many cities and counties ban sales.
context:
  recreational:
    text: >-
      Since Proposition 64 in 2016, adults 21 and over may grow six plants and keep up to an ounce
      of flower and 8 g of concentrate; the same law licenses commercial growing and retail
      sales.[@1] Under-18s caught with any amount get an infraction
      with drug counselling and community service, not a criminal record.[@1]
      [Four states legalised in 2016, including California.](/history/us-legalisation-wave-2016/)
      [California voters rejected legalisation in 1972.](/history/us-california-legalisation-vote-1972/)
      [A 2010 legalisation measure failed.](/history/us-california-proposition-19-2010/)
    sources: [1]
  medical:
    text: >-
      California wrote the first medical law: Proposition 215 (1996), now Health and Safety Code
      section 11362.5, lets patients with a doctor's recommendation possess and grow.[@5]
      [California allowed medical use in 1996.](/history/us-california-medical-1996/)
    sources: [5]
  culture:
    text: >-
      The world's cannabis code was born here: in 1971 five San Rafael High School pupils, the
      Waldos, met at 4:20 in the afternoon to hunt an abandoned crop, and "420" spread from their
      circle to the calendar.[@3]
      [420 began in San Rafael.](/culture/language/420/)
      San Francisco wrote the medical movement: Brownie Mary handed out brownies on AIDS wards
      alongside activist Dennis Peron, carrying the state to Proposition 215 in 1996.[@4]
      [Brownie Mary and Dennis Peron drove Proposition 215.](/culture/people/dennis-peron/)
    sources: [3, 4]
