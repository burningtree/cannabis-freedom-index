name: Massachusetts
recreational: legal
medical: legal
updated: "2026-10-27"
summary: >-
  Since April 2026, adults may hold 2 oz of flower or the Commission-defined product equivalent
  (10 oz plus lawful homegrown harvest at home); six plants per
  adult, twelve per household. Licensed shops since 2018, but a November 2026 ballot question would
  end recreational sales.
scores:
  possession: 6
  cultivation: 4
  enforcement: 6
  sharing: 5
  consumption: 3
  access: 6
segments:
  possession: >-
    Since 19 April 2026, adults 21+ may hold 2 oz of flower or the equivalent amount of products
    as determined by the Cannabis Control Commission. At home, 10 oz plus cannabis from lawful
    homegrown plants is protected.[@4] For retail sales, 2 oz flower equals 10 g of active THC in
    concentrates, including tinctures, or 1,000 mg of active THC in edibles. Mixed purchases share
    one combined equivalent allowance; these figures measure THC content, not concentrate or
    edible gross weight. The September 2026 regulations retain this retail calculation.[@5,6]
  cultivation: >-
    Six plants per adult, twelve per household. Plants visible from a public place bring a $300
    civil penalty.
  enforcement: Nothing within the limits.
  sharing: >-
    An adult 21+ may give another adult 21+ up to 2 oz of flower or the Commission-defined
    equivalent amount of marijuana products, without payment and without publicly advertising
    or promoting the gift. The former 1 oz rule changed on 19 April 2026.[@4] Products require
    equivalence calculation; 2 oz is not a blanket concentrate-weight allowance. The numerical
    THC conversion in the Commission’s rules directly governs retail sales.[@5,6]
  consumption: Private only; social consumption sites have been approved in principle.
  access: >-
    Licensed shops since 2018; towns can ban them. Question 8 on the 3 November 2026 ballot would
    prohibit recreational sales while keeping possession of up to 1 oz legal.
answers:
  carry:
    answer: yes
    text: Adults 21+ may carry 2 oz flower or the Commission-defined product equivalent
