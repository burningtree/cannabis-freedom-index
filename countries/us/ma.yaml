name: Massachusetts
recreational: legal
medical: legal
updated: 2026-10-04
summary: >-
  A law signed in April 2026 doubled the public limit to 2 oz (10 oz at home); six plants per
  adult, twelve per household. Licensed shops since 2018, but a November 2026 ballot question would
  end recreational sales.
scores:
  possession: 6
  cultivation: 4
  enforcement: 6
  sharing: 5
  consumption: 3
  access: 6
segments:
  possession: >-
    A law signed in April 2026 doubled the public limit from 1 oz to 2 oz; 10 oz is allowed at
    home.
  cultivation: >-
    Six plants per adult, twelve per household. Plants visible from a public place bring a $300
    civil penalty.
  enforcement: Nothing within the limits.
  sharing: Gifts of up to 2 oz between adults are legal (1 oz before the April 2026 law).
  consumption: Private only; social consumption sites have been approved in principle.
  access: >-
    Licensed shops since 2018; towns can ban them. Question 8 on the 3 November 2026 ballot would
    prohibit recreational sales while keeping possession of up to 1 oz legal.
