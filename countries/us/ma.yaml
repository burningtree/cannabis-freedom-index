segments:
  possession: 1 oz in public and 10 oz at home. More than 1 oz in public is a misdemeanour.
  cultivation: >-
    Six plants per adult, twelve per household. Plants visible from a public place bring a $300
    civil penalty.
  enforcement: Nothing within the limits.
  sharing: Gifts of up to 1 oz between adults are legal.
  consumption: Private only; social consumption sites have been approved in principle.
  access: Licensed shops since 2018; towns can ban them.
sources:
