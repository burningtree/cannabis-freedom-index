segments:
  possession: >-
    Residents may hold 30 g of flower, visitors half that. From 30 to 100 g is a misdemeanour on a
    first offence.
  cultivation: >-
    Only registered medical patients may grow, up to five plants. For anyone else five plants or
    fewer is a $200 civil violation; more is a felony.
  enforcement: Nothing within the limits.
  sharing: >-
    The law has no clear allowance for gifts: delivering even 2.5 g outside the licensed system is a
    misdemeanour.
  consumption: Private only, with licensed consumption lounges in a few towns.
  access: Licensed shops since 2020, with some of the highest taxes in the country.
sources:
  - title: NORML — Illinois laws and penalties
    url: https://norml.org/laws/illinois-penalties/
