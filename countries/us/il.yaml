segments:
  possession: >-
    Adults 21+ may hold 60 g of flower, 10 g of concentrate and infused products containing 1,000 mg
    THC if resident in Illinois; non-residents have half those limits. The three product limits are
    cumulative. These limits took effect on 12 June 2026.
  cultivation: >-
    Only registered medical patients may grow, up to five plants. For anyone else five plants or
    fewer is a $200 civil violation; more is a felony.
  enforcement: Nothing within the limits.
  sharing: >-
    Genuine non-commercial gifts between adults 21+ are allowed within the recipient’s possession
    limits. Sales are reserved for licensed businesses and promotional giveaways are prohibited;
    medical patients may not give away their homegrown cannabis.
  consumption: Private only, with licensed consumption lounges in a few towns.
  access: Licensed shops since 2020, with some of the highest taxes in the country.
