name: Illinois
recreational: legal
medical: legal
updated: 2026-10-04
summary: >-
  Residents may hold 30 g. Only medical patients may grow (five plants); for others a few plants is
  a $200 civil fine. Licensed shops since 2020.
scores:
  possession: 5
  cultivation: 2
  enforcement: 6
