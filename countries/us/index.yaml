summary: >-
  Adult-use cannabis is still federally illegal, yet about half the states run licensed markets and
  40 allow medical use; in April 2026 state-licensed medical cannabis was moved to Schedule III.
  Scores are a national estimate — reality ranges from retail shops to prison depending on the
  state.
scores:
  possession: 4
  cultivation: 3
  enforcement: 2
  sharing: 4
  consumption: 3
  access: 5
segments:
  possession:
    text: >-
      It depends entirely on the state. In roughly half the states adults 21+ may carry a capped
      amount, typically 1 to 2.5 oz (28–70 g). In prohibition states the same amount can mean arrest
      and jail. Under federal law, non-medical possession is still a Schedule I offence everywhere.
    sources:
      - norml
      - ncsl
  cultivation:
    text: >-
      Most legal states allow home growing, usually six plants per adult with a household cap, but
      several — including Washington, New Jersey and Illinois for non-patients — ban it. In
      prohibition states growing a single plant can be a felony.
    sources:
      - norml
  enforcement:
    text: >-
      Hundreds of thousands of cannabis arrests still happen every year, concentrated in prohibition
      states where possession can bring jail and sale or cultivation long felony sentences. Federal
      trafficking penalties include mandatory minimums.
    sources:
      - norml
  sharing:
    text: >-
      Legal states generally allow adults to give up to the possession limit (commonly one ounce) to
      another adult 21+ with no payment. Elsewhere any transfer counts as distribution.
    sources:
      - norml
  consumption:
    text: >-
      Even in legal states use is almost always confined to private property; public consumption is
      a ticketable offence, landlords and hotels can ban it, and it is prohibited on all federal
      land. Only a few states license consumption lounges.
    sources:
      - norml
      - ncsl
  access:
    text: >-
      Legal states have licensed dispensaries, many with delivery, open to any adult 21+ including
      visitors, with per-transaction limits. Licence caps and local opt-outs leave large areas
      without shops, and nothing can cross state lines. About half the population has no legal
      adult-use store.
    sources:
      - ncsl
      - mm
context:
  production:
    text: >-
      States issue commercial licences, some uncapped (Oklahoma, Oregon), many tightly capped and
      very expensive. On 28 April 2026 a DEA rule moved FDA-approved and state-licensed medical
      cannabis to federal Schedule III. Adult-use cannabis remains Schedule I, with punitive federal
      tax treatment and limited banking; a hearing on moving all cannabis to Schedule III ran from
      29 June to 15 July 2026 and a decision is pending.
    sources:
      - ml
      - hh
      - ncsl
  products:
    text: >-
      The widest product range in the world in legal states: flower, edibles (typically capped at
      100 mg THC per package), vapes, concentrates and beverages. Hemp-derived products are sold in
      most states, though federal and state rules on intoxicating hemp have been tightening: a
      federal ban on most hemp-derived THC products, due on 12 November 2026, was pushed back to 11
      December 2026 by a funding bill signed on 2 September.
    sources:
      - norml
      - foley
      - hh
  medical:
    text: >-
      40 states have medical programmes. Most require a doctor's certification for a listed
      condition, a state patient card and an annual fee. Federal rescheduling of state-licensed
      medical cannabis in 2026 acknowledged medical use, but it is still not prescribed or insured
      like ordinary medicine.
    sources:
      - ncsl
      - hh
  consequences:
    text: >-
      The heaviest collateral consequences of any country with legal markets: cannabis users are
      barred from buying firearms under federal law, non-citizens can be deported or refused entry,
      federally assisted housing can evict, and most employers may still test and fire. Expungement
      exists in some states only.
    sources:
      - norml
      - ncsl
  planting:
    seeds: grey
    seeds_trade: open
    clones: grey
    clones_trade: regulated
    text: >-
      The DEA said in letters of January and December 2022 that any seed, tissue culture or
      other genetic material with no more than 0.3% delta-9 THC meets the definition of hemp
      and is not federally controlled; once a seed grows into material above 0.3% it is
      marijuana under federal law. The letters do not mention clones, and a lawyer writing on
      the first letter warns that keeping a clone counts as growing, which federally needs a
      hemp licence. Whether a person may sow seeds or buy plants depends on state law.
    sources:
      - dea
      - kight
  black_market:
    text: >-
      Legal states have not ended the illegal trade, and no national figure for its share was
      found. The federal drug agency's 2025 threat assessment says Chinese criminal
      organisations dominate domestic growing and distribution, with most grow sites in states
      where cannabis is legal, producing flower averaging 25 to 30% THC. State studies give a
      sense of scale: one commissioned by Nevada in 2024 put unlicensed sales at 21 to 30% of
      that state's market, some 242 to 370 million dollars a year, and ranked Nevada second to
      California per head among four western states. A Nevada policy report describes
      unlicensed delivery, pop-up sales parties and large outdoor farms on remote land.
    sources:
      - dea25
      - unlv25
  arrests:
    text: >-
      Police made at least 204,036 marijuana arrests in 2024 according to FBI data, 187,792 of
      them (92%) for possession and 16,244 for sale or manufacture. Possession of marijuana
      alone was more than 22% of the 831,446 drug arrests nationwide. The peak was 2007, with
      over 870,000 marijuana arrests, 48% of all drug arrests. The 2024 total is an
      undercount: some agencies do not report to the FBI, and tens of thousands of arrests are
      logged as unspecified drug violations.
    sources:
      - norml24
  driving:
    status: impairment
    text: >-
      Driving law is set by each state, and most have no THC-specific rule, so a conviction
      needs evidence of impairment. The governors' highway safety association counts 18 states
      with stricter marijuana rules: ten with zero tolerance for THC or a metabolite, four
      with zero tolerance for THC alone and four with a fixed THC limit. Colorado instead lets
      a jury infer impairment from 5 nanograms of THC. The status shown is the majority rule,
      not the law everywhere.
    sources:
      - ghsa
  visitors:
    status: open
    text: >-
      In states with legal sales, dispensaries serve any adult aged 21 or over, visitors
      included; nothing may be carried across a state line. For foreign visitors the danger is
      federal: marijuana remains a federal controlled substance, and immigration lawyers warn
      that conduct legal under state law can still bring severe immigration penalties.
      Admitting to possession can get any non-citizen, even a permanent resident, refused at
      the border, and admitted use or work in the legal industry can block naturalisation.
    sources:
      - ncsl
      - ilrc
  clubs:
    status: regulated
    text: >-
      Non-profit growing clubs of the Spanish kind are not part of American law; what some
      states license instead are places to consume, usually run for profit. Colorado allows
      consumption clubs but no sales on site, with rules that vary by county. Oregon permits
      cannabis social clubs and some operate. Nevada has let businesses apply for social-club
      licences since a 2017 law, and Massachusetts approved three types of social-consumption
      licence in December 2025. The District of Columbia went the other way and banned
      consumption clubs in 2016. In most states there is no provision at all.
    sources:
      - wikicsc
