subunits:
  label: State
  plural: states
  intro: >-
    Federal law still prohibits non-medical cannabis everywhere in the United States; these scores
    describe state law. Counties and cities can add their own rules, and state law does not apply on
    federal land.
  sources:
    - title: NORML — State-by-state laws
      url: https://norml.org/laws/
    - title: National Conference of State Legislatures — State cannabis laws
      url: https://www.ncsl.org/health/state-medical-cannabis-laws
