segments:
  possession: 2 oz or less is a misdemeanour with up to a year and a $2,000 fine. More is a felony.
  cultivation: Illegal; registered patients may grow a small number of plants.
  enforcement: Jail is possible.
  sharing: Giving under ½ oz without payment is a misdemeanour with a 15-day minimum.
  consumption: Ingesting cannabis is itself an offence.
  access: Medical dispensaries for card holders.
