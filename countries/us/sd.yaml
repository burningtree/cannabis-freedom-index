segments:
  possession: 2 oz or less is a misdemeanour with up to a year and a $2,000 fine. More is a felony.
  cultivation: Illegal; registered patients may grow a small number of plants.
  enforcement: >-
    Possession of 2 oz or less can bring up to a year in jail. Unauthorised ingestion has its own
    mandatory evaluation/probation rules and felony escalation, even without a seized quantity.[@1,2]
  sharing: Giving under ½ oz without payment is a misdemeanour with a 15-day minimum.
  consumption: >-
    Unauthorised ingestion or an altered-state drug in the body is a separate offence. A first
    conviction is a Class 1 misdemeanour with mandatory evaluation and supervised probation,
    alongside any other sentence. A second remains a Class 1 misdemeanour, with up to a year
    in jail, mandatory supervised probation, evaluation and recommended treatment. A third or
    later violation within ten years of the first conviction is a Class 6 felony. Inmates in
    state correctional facilities and people on parole face a Class 5 felony. Valid prescribed
    or otherwise authorised use is excepted.[@2]
  access: Medical dispensaries for card holders.
answers:
  caught:
    answer: no
    label: Jail and probation
    text: Possession can bring jail; unauthorised ingestion adds mandatory probation and repeat-offence felonies
