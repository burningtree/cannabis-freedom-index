segments:
  possession: >-
    Without a qualifying prior drug conviction, THC possession is a misdemeanour with up to six
    months and $1,000. Any earlier felony or misdemeanour conviction under Chapter 961 or covered
    federal or state drug laws can trigger Class I felony treatment, with up to 3.5 years. The
    prior need not involve cannabis or Wisconsin.[@2,3]
  cultivation: Four plants or fewer is a felony with up to 3.5 years.
  enforcement: >-
    Jail is possible; a qualifying earlier drug conviction can make a first cannabis case a
    felony.[@3] Madison and Milwaukee impose small local fines.[@1]
  sharing: Selling 200 g or less is a felony.
  consumption: Illegal.
  access: None, while three neighbouring states have legal shops.
