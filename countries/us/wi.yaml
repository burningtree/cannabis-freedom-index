segments:
  possession: >-
    A first offence is a misdemeanour with up to six months and a $1,000 fine. A second is a felony
    with up to 3.5 years.
  cultivation: Four plants or fewer is a felony with up to 3.5 years.
  enforcement: Jail is possible; Madison and Milwaukee impose only small fines.
  sharing: Selling 200 g or less is a felony.
  consumption: Illegal.
  access: None, while three neighbouring states have legal shops.
