name: Wisconsin
recreational: illegal
medical: none
updated: '2026-10-27'
summary: >-
  Without a qualifying prior drug conviction, THC possession carries up to six months. An
  earlier drug conviction can make even a first cannabis case a felony. No medical programme;
  local penalties vary.
scores:
  possession: 1
  cultivation: 0
  enforcement: 2
  sharing: 0
  consumption: 1
  access: 0
segments:
  possession: >-
    Without a qualifying prior drug conviction, THC possession is a misdemeanour with up to six
    months and $1,000. Any earlier felony or misdemeanour conviction under Chapter 961 or covered
    federal or state drug laws can trigger Class I felony treatment, with up to 3.5 years. The
    prior need not involve cannabis or Wisconsin.[@2,3]
  cultivation:
    text: >-
      Four plants or fewer is a felony with up to 3.5 years.[@1]
    currency: USD
    penalties:
      - label: Four plants or fewer
        treatment: criminal
        term: Felony
        prison: 3.5 years
        fine: 10000
      - label: More than four plants
        treatment: criminal
        term: Felony
        note: Longer terms and larger fines by weight, up to 15 years
  enforcement: >-
    Jail is possible; a qualifying earlier drug conviction can make a first cannabis case a
    felony.[@3] Madison, Milwaukee and other cities impose small local fines instead.[@1,4]
  sharing:
    text: >-
      Selling 200 g or less is a felony.[@1]
    currency: USD
    penalties:
      - label: Sale of 200 g or less
        treatment: criminal
        term: Felony
        prison: 3.5 years
        fine: 10000
  consumption: Illegal.[@1]
  access: None, while three neighbouring states have legal shops.[@1]
