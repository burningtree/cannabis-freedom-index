name: Wisconsin
recreational: illegal
medical: none
updated: '2026-10-27'
summary: >-
  Without a qualifying prior drug conviction, THC possession carries up to six months. An
  earlier drug conviction can make even a first cannabis case a felony. No medical programme;
  local penalties vary.
