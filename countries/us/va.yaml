name: Virginia
recreational: legal
medical: legal
updated: 2026-10-04
summary: >-
  1 oz and four plants per household have been legal since 2021, but adult-use shops were repeatedly
  vetoed. Medical dispensaries are the only legal place to buy.
scores:
  possession: 5
  cultivation: 4
  enforcement: 6
  sharing: 5
  consumption: 3
  access: 3
segments:
  possession: >-
    Legal at home and in small amounts in public; slightly larger amounts bring only a $25 civil
    penalty, and over 4 oz in public is a misdemeanour.
  cultivation: Four plants per household, tagged and out of public view.
  enforcement: Among the mildest penalties for small overages anywhere in the country.
  sharing: Adults may share up to 1 oz without payment.
  consumption: Private only.
  access: >-
    No adult-use shops: bills to license them were vetoed. Medical dispensaries are the only legal
    place to buy.
sources:
  - title: NORML — Virginia laws and penalties
    url: https://norml.org/laws/virginia-penalties-2/
