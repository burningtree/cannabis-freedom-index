name: Virginia
recreational: legal
medical: legal
updated: 2026-10-17
summary: >-
  Possession and four plants per household have been legal since 2021. After years of vetoes, a
  retail law was enacted in 2026; adult-use sales are scheduled for 1 July 2027. Until then medical
  dispensaries are the only legal place to buy.
scores:
  possession: 5
  cultivation: 4
  enforcement: 6
  sharing: 5
  consumption: 3
  access: 3
segments:
  possession: >-
    Legal at home and in small amounts in public; slightly larger amounts bring only a $25 civil
    penalty, and over 4 oz in public is a misdemeanour.
  cultivation: Four plants per household, tagged and out of public view.
  enforcement: Among the mildest penalties for small overages anywhere in the country.
  sharing: Adults may share up to 1 oz without payment.
  consumption: Private only.
  access: >-
    No adult-use shops yet. The Cannabis Control Authority schedules retail sales for 1 July 2027;
    its timeline records an initial regulation draft in September 2026 and schedules effective
    rules for January 2027. Medical dispensaries remain the legal route to buy cannabis.
    Separately, from 15 August 2026 hemp products may contain no more than 2 mg total THC per
    package; the former 25-to-1 CBD-to-THC exception was removed.
