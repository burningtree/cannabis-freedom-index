  sharing: 5
  consumption: 4
  access: 6
segments:
  possession: >-
    Adults 21+ may possess 2.5 oz, including no more than 15 g of concentrate. At their residence
    they may keep 10 oz plus cannabis harvested from plants lawfully cultivated there, with no
    separate weight cap on that harvest. Anything above 2.5 oz at home must be in a container or
    area secured with locks or other functioning security devices.[@2]
  cultivation: >-
    Adults 21+ may grow up to twelve plants per residence for personal use, out of public view
    and in an enclosed, secured area. The cannabis harvested there is allowed at that residence
    in addition to the ordinary 10 oz home allowance.[@2]
  enforcement: Overages are civil infractions at first, not crimes.
  sharing: >-
    Adults 21+ may give another adult 21+ up to 2.5 oz without payment, including at most 15 g of
    concentrate, provided the gift is not advertised or promoted to the public.[@2]
  consumption: Private use, plus licensed consumption lounges.
  access: Licensed shops since December 2019, with some of the lowest prices in the country.
