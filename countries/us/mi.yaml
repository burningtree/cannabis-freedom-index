name: Michigan
recreational: legal
medical: legal
updated: '2026-10-27'
summary: >-
  Adults 21+ may carry 2.5 oz, keep 10 oz at home plus the harvest of up to twelve plants
  lawfully grown there, and buy from licensed shops. Cannabis above 2.5 oz at home must be
  secured with locks or other functioning security devices.
