name: Maine
recreational: legal
medical: legal
updated: 2026-10-27
summary: >-
  Adults 21+ may carry 2.5 oz total, including at most 10 g of concentrate, and grow six mature
  plants, twelve immature plants and unlimited seedlings. Licensed shops since 2020.
scores:
  possession: 5
  cultivation: 4
  enforcement: 6
  sharing: 5
  consumption: 3
  access: 6
segments:
  possession: >-
    Adults 21+ may possess and transport up to 2.5 oz total cannabis, including at most 10 g of
    concentrate. The same combined limit applies to purchases.[@1,3] They may also keep the
    entire harvest of their lawful personal grow at their residence or grow location.[@1]
    Possession outside the authorised exceptions can be prosecuted under the drug laws;
    concentrate overages are not covered by the ordinary flower-weight penalty bands.[@4,5,6]
  cultivation: >-
    A person 21 or older may grow six mature plants, twelve immature plants and any number of
    seedlings, on land where they live, on land they own, or on someone else's land with the
    owner's written permission. The plants may not be visible from a public way, and each mature
    and immature plant needs a tag with the grower's name and identification number. A town may
    limit the plants on a parcel so long as each adult who lives there may still grow six mature,
    twelve immature and unlimited seedlings.
  enforcement: Nothing within the limits.
  sharing: >-
    Adults 21+ may give another adult 21+ up to 2.5 oz total cannabis without payment, including
    at most 10 g of concentrate.[@1]
  consumption: Private only.
  access: >-
    Licensed shops since 2020, in towns that have opted in, alongside a long-standing medical
    caregiver market. Adult-use purchases are limited to 2.5 oz total, including at most 10 g
    of concentrate.[@1,3]
answers:
  carry:
    answer: yes
    text: Adults 21+ may carry 2.5 oz total, including at most 10 g of concentrate
