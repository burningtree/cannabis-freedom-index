segments:
  possession: 2.5 oz is legal. From 2.5 to 8 oz is a crime with up to six months.
  cultivation: >-
    A person 21 or older may grow six mature plants, twelve immature plants and any number of
    seedlings, on land where they live, on land they own, or on someone else's land with the
    owner's written permission. The plants may not be visible from a public way, and each mature
    and immature plant needs a tag with the grower's name and identification number. A town may
    limit the plants on a parcel so long as each adult who lives there may still grow six mature,
    twelve immature and unlimited seedlings.
  enforcement: Nothing within the limits.
  sharing: Adults may share up to 2.5 oz without payment.
  consumption: Private only.
  access: >-
    Licensed shops since 2020, in towns that have opted in, alongside a long-standing medical
    caregiver market.
