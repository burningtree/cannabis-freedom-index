name: North Dakota
recreational: decriminalised
medical: legal
updated: '2026-10-27'
summary: >-
  Under ½ oz marijuana is a criminal infraction; THC uses separate 2 g and 6 g thresholds. Adult
  21+ ingestion is not itself an offence under the ingestion statute. Medical cannabis is
  available.
scores:
  possession: 2
  cultivation: 1
  enforcement: 3
  sharing: 1
  consumption: 3
  access: 3
segments:
  possession: >-
    Marijuana under ½ oz (14.175 g) is an infraction; at least ½ oz through 500 g is a Class B
    misdemeanour; over 500 g is a Class A misdemeanour. Separately scheduled THC uses under 2 g,
    2–6 g and over 6 g for those respective tiers. Product classification controls which schedule
    applies.[@2] Maxima are $1,000 for an infraction, 30 days and/or $1,500 for Class B, and 360
    days and/or $3,000 for Class A. Two same-infraction convictions within the preceding year can
    trigger Class B sentencing.[@3]
  cultivation:
    text: >-
      Illegal; charged as manufacturing.[@1] The 2019 reclassification that made adult ingestion
      outside the ingestion offence did not change the growing ban.[Learn more](/history/us-north-dakota-possession-ingestion-2019/)
    currency: USD
    penalties:
      - label: Manufacture or delivery
        treatment: criminal
        term: Felony
        prison: 10 years
        fine: 20000
  enforcement: >-
    Small possession is a criminal infraction; larger marijuana or THC amounts can bring 30 or 360
    days.[@2,3]
  sharing: Any sale is a felony with up to five years.[@1]
  consumption: >-
    Cannabis/THC ingestion by adults 21+ is not itself an offence under §19-03.1-22.3.
    Unauthorised under-21 ingestion is a Class B misdemeanour with up to 30 days. Non-medical
    possession remains unlawful.[@2,3]
  access: Medical dispensaries for card holders. Voters rejected legalisation in 2018, 2022 and 2024.
sources:
