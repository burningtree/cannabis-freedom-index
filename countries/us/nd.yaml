name: North Dakota
recreational: decriminalised
medical: legal
updated: 2026-10-04
summary: >-
  Up to ½ oz is an infraction with a fine. Medical cannabis is available; voters rejected
  legalisation in 2018, 2022 and 2024.
scores:
