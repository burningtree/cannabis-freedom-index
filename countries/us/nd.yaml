name: North Dakota
recreational: decriminalised
medical: legal
updated: 2026-10-04
summary: >-
  Up to ½ oz is an infraction with a fine. Medical cannabis is available; voters rejected
  legalisation in 2018, 2022 and 2024.
scores:
  possession: 2
  cultivation: 1
  enforcement: 3
  sharing: 1
  consumption: 0
  access: 3
segments:
  possession: >-
    Less than ½ oz is a criminal infraction with a fine of up to $1,000 and no jail. More is a
    misdemeanour with up to 30 days.
  cultivation: Illegal; charged as manufacturing.
  enforcement: A fine for small amounts.
  sharing: Any sale is a felony with up to five years.
  consumption: Ingesting cannabis is itself a misdemeanour with up to 30 days.
  access: Medical dispensaries for card holders. Voters rejected legalisation in 2018, 2022 and 2024.
sources:
  - title: NORML — North Dakota laws and penalties
    url: https://norml.org/laws/north-dakota-penalties-2/
