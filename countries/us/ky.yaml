name: Kentucky
recreational: illegal
medical: legal
updated: 2026-10-04
summary: >-
  Up to 8 oz is a misdemeanour capped at 45 days in jail. A medical programme began in 2025; smoking
  flower is not allowed under it.
scores:
  possession: 1
  cultivation: 1
  enforcement: 2
  sharing: 1
  consumption: 1
  access: 2
segments:
  possession: Less than 8 oz is a misdemeanour capped at 45 days in jail and a $250 fine.
  cultivation: >-
    Fewer than five plants is a misdemeanour with up to a year on a first offence; five or more is a
    felony.
  enforcement: Short jail terms are possible; many counties cite and release.
  sharing: Selling under 8 oz is a misdemeanour with up to a year on a first offence.
  consumption: Illegal.
  access: A medical programme since January 2025, limited to non-smokable products.
sources:
  - title: NORML — Kentucky laws and penalties
