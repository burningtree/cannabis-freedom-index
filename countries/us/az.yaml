segments:
  possession: >-
    Adults 21+ may ordinarily carry up to 1 oz total marijuana, including at most 5 g of concentrate.
    Lawful personal-grow harvest may also be kept on the premises where grown.[@2]
    Above the ordinary allowance, possession remains a petty offence only through 2.5 oz total
    with at most 12.5 g of concentrate. Either ceiling can be exceeded even when the other is not.[@3]
    Outside these protections, possession can be prosecuted as a felony; ordinary unauthorised
    possession below two pounds is a class 6 felony under §13-3405. Registered medical patients
    have separate statutory protections.[@4,5]
  cultivation: Six plants per adult, twelve per household.
  enforcement: >-
    No state penalty within the adult-use permission. The petty-offence band ends above 2.5 oz
    total or 12.5 g concentrate, where felony prosecution becomes possible unless another
    protection applies.[@2,3,4,5]
  sharing: >-
    Adults 21+ may give another adult 21+ up to 1 oz total, including at most 5 g of concentrate,
    without payment, provided the gift is not advertised or promoted to the public.[@2]
  consumption: Private only; smoking in public is a petty offence.
  access: Licensed shops since 2021.
