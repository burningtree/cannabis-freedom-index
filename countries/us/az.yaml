name: Arizona
recreational: legal
medical: legal
updated: 2026-10-04
summary: >-
  1 oz (5 g of concentrate) and six plants per adult, twelve per household. Licensed shops since
  2021.
scores:
  possession: 5
  cultivation: 4
  enforcement: 6
  sharing: 5
  consumption: 3
  access: 6
segments:
  possession: >-
    1 oz is legal. Between 1 and 2.5 oz is a petty offence with a $300 fine; more than 2.5 oz is a
    felony.
  cultivation: Six plants per adult, twelve per household.
  enforcement: "Nothing within the limits, but the jump above 2.5 oz is steep: a felony with months in prison."
  sharing: Transfers of up to 1 oz between adults without payment are legal.
  consumption: Private only; smoking in public is a petty offence.
  access: Licensed shops since 2021.
sources:
  - title: NORML — Arizona laws and penalties
    url: https://norml.org/laws/arizona-penalties/
