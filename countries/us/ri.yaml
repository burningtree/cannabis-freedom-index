segments:
  possession: 1 oz in public and 10 oz at home. More than 1 oz is a misdemeanour with up to a year.
  cultivation: Three mature and three immature plants.
  enforcement: Nothing within the limits.
  sharing: Adults may give each other up to 1 oz.
  consumption: Generally treated like tobacco smoking, subject to local restrictions.
  access: Licensed shops since December 2022.
