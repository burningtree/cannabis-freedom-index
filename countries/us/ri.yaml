segments:
  possession: >-
    A person 21 or older may possess up to 1 ounce, and up to 10 ounces at their primary residence
    if the commission's security requirements are met. More than 1 ounce and not more than 2 ounces
    is a $150 civil penalty and forfeiture for a first or second violation within 18 months, and
    that penalty is not a criminal punishment. More than 2 ounces is a misdemeanour with up to a
    year, as is more than 10 ounces inside the residence.
  cultivation: >-
    A dwelling may have up to three mature and three immature plants, however many adults live
    there, if the commission's security requirements are met.
  enforcement: Nothing within the limits.
  sharing: >-
    A person 21 or older may give up to 1 ounce, without payment, to another person 21 or older, if
    the gift is not advertised or promoted to the public.
  consumption: Generally treated like tobacco smoking, subject to local restrictions.
  access: Licensed shops since December 2022.
