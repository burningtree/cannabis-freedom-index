segments:
  possession: >-
    First possession of 1 oz or less of marijuana (or 10 g or less of hashish) is a misdemeanour:
    up to 30 days or a $100–$200 fine. A repeat brings up to a year or $200–$1,000 or both.[@2]
    Simple possession above 1 oz is also a misdemeanour where that is the offence proved:
    up to six months or $1,000 or both for a first conviction, and a year or $2,000 or both
    for a repeat. Above 1 oz is prima facie evidence of intent to distribute, meaning it can
    support a felony charge; it does not automatically make simple possession a felony.[@2,3]
  cultivation:
    text: >-
      A felony with up to five years.[@1]
    currency: USD
    penalties:
      - label: Fewer than 100 plants
        treatment: criminal
        term: Felony
        prison: 5 years
        fine: 5000
        note: Higher plant counts bring longer terms
  enforcement: >-
    Jail is possible for a first possession offence. Above 1 oz can support an intent-to-distribute
    felony charge, carrying up to five years on a first conviction. The separate weight-based
    trafficking offence starts at 10 pounds.[@2,3]
  sharing: Sale is a felony with up to five years.[@1]
  consumption: Illegal.[@1]
  access: None.[@1]
