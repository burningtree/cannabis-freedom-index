name: Oklahoma
recreational: illegal
medical: legal
updated: 2026-10-04
summary: >-
  Without a card, possession is a misdemeanour. But the medical programme has no list of qualifying
  conditions and is among the easiest to join; patients may grow six mature plants.
scores:
  possession: 1
