name: Oklahoma
recreational: illegal
medical: legal
updated: 2026-10-04
summary: >-
  Without a card, possession is a misdemeanour. But the medical programme has no list of qualifying
  conditions and is among the easiest to join; patients may grow six mature plants.
scores:
  possession: 1
  cultivation: 1
  enforcement: 2
  sharing: 1
  consumption: 1
  access: 3
segments:
  possession: Without a medical card, any amount is a misdemeanour with up to a year and a $1,000 fine.
  cultivation: Registered patients may grow six mature plants and six seedlings. For others it is a felony.
  enforcement: Jail is possible for non-patients, though uncommon for small amounts.
  sharing: Sale carries two years to life.
  consumption: Illegal without a card.
  access: >-
    Medical only, but the programme has no list of qualifying conditions and dispensaries are
    everywhere.
sources:
  - title: NORML — Oklahoma laws and penalties
    url: https://norml.org/laws/oklahoma-penalties-2/
