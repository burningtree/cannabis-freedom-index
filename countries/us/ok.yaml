name: Oklahoma
recreational: illegal
medical: legal
updated: 2026-10-23
summary: >-
  Without a card, possession is a misdemeanour. The medical programme has no list of qualifying
  conditions. Sharing less than 3 grams of medical marijuana without payment is a $400
  administrative fine and is not a criminal prosecution.
scores:
  possession: 1
  cultivation: 1
  enforcement: 2
  sharing: 1
  consumption: 1
  access: 3
segments:
  possession:
    text: >-
      Without a medical card, any amount is a misdemeanour with up to a year and a $1,000 fine.[@1]
    currency: USD
    penalties:
      - label: Any amount without a card
        treatment: criminal
        term: Misdemeanor
        prison: 1 year
        fine: 1000
  cultivation:
    text: >-
      Registered patients may grow six mature plants and six seedlings. For others it is a felony.[@4]
    currency: USD
    penalties:
      - upto: 6 plants
        treatment: legal
        note: Six mature and six seedlings per registered patient
  enforcement: Jail is possible for non-patients, though uncommon for small amounts.[@1]
  sharing: >-
    A person who shares less than 3 grams of medical marijuana with someone who is not authorized to
    have it, without payment or other consideration, is not subject to criminal prosecution and is
    subject to an administrative fine of $400. The Court of Criminal Appeals' 2026 jury-instruction
    commentary says that transfer cannot be criminal distribution. Unlawful distribution of
    marijuana is otherwise a Class D1 felony. Distributing to a person under 18, or using a person
    under 18 to distribute, is a Class C1 felony of two to ten years on a first offence, four to
    twenty years on a second, and ten years to life on a third.
  consumption: Illegal without a card.[@1]
  access: >-
    Medical only, but the programme has no list of qualifying conditions and dispensaries are
    everywhere.[@1,5]
context:
  medical:
    text: >-
      State Question 788 (June 2018) created one of the most open medical programmes in the
      country: no list of qualifying conditions, and registered patients may grow six mature
      plants and six seedlings.[@5]
    sources: [5]
