name: Vermont
recreational: legal
medical: legal
updated: 2026-10-04
summary: >-
  Small amounts and two mature plus four immature plants per household are legal. The first state to
  legalise through its legislature; shops since 2022.
scores:
  possession: 5
  cultivation: 4
  enforcement: 6
  sharing: 5
  consumption: 3
  access: 6
segments:
  possession: >-
    Small amounts are legal — NORML lists up to 2 oz with no penalty. Larger amounts are a felony
    with up to three years.
  cultivation: Two mature and four immature plants per household.
  enforcement: Nothing within the limits, but a steep jump above them.
  sharing: >-
    Selling under ½ oz without a licence is a misdemeanour; small gifts between adults are
    tolerated.
  consumption: Private only.
  access: Licensed shops since October 2022.
sources:
  - title: NORML — Vermont laws and penalties
    url: https://norml.org/laws/vermont-penalties-2/
