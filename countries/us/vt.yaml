segments:
  possession: >-
    A person 21 or older may possess up to 2 ounces of cannabis, or 10 grams of hashish, and two
    mature plants or fewer and four immature plants or fewer, without a penalty. Those amounts do
    not include cannabis cultivated, harvested and stored under section 4230e. Possessing more than
    2 ounces is named in both the civil-penalty subsection, at $100, $200 or $500 by offence count,
    and the next subsection, which offers diversion on a first offence and up to six months or a
    $500 fine on conviction. Possessing 8 ounces, or cultivating more than four mature or eight
    immature plants, can bring up to three years. More than 1 pound can bring up to five years, and
    more than 10 pounds up to fifteen years.
  cultivation: >-
    A person 21 or older may possess two mature cannabis plants or fewer and four immature plants
    or fewer without a penalty.
  enforcement: >-
    Nothing within the 2-ounce and plant limits. The statute then sets a civil penalty and a
    six-month offence that both describe possession of more than 2 ounces, and longer terms at 8
    ounces, 1 pound and 10 pounds.
  sharing: >-
    A person 21 or older may give up to 1 ounce of cannabis, or 5 grams of hashish, to another
    person 21 or older, if the gift is not advertised or promoted to the public. Selling cannabis
    unlawfully can bring up to two years. Selling or dispensing more than 1 ounce, or 5 grams or
    more of hashish, can bring up to five years.
  consumption: Private only.
  access: Licensed shops since October 2022.
