segments:
  possession: >-
    A person 21 or older may possess up to 2 ounces of cannabis, or 10 grams of hashish, and two
    mature plants or fewer and four immature plants or fewer, without a penalty. Those amounts do
    not include cannabis cultivated, harvested and stored under section 4230e. Possessing more
    than 2 ounces is named in both the civil-penalty subsection, at $100, $200 or $500 by offence
    count, and the next subsection, which offers diversion on a first offence and up to six months
    or a $500 fine on conviction. Possessing 8 ounces, or cultivating more than four mature or
    eight immature plants, can bring up to three years. More than 1 pound can bring up to five
    years, and more than 10 pounds up to fifteen years. Under §4230i, a felony conviction for
    selling cannabis (§4230) or selling regulated drugs to minors or on school grounds (§4237),
    for an offence on or after 1 July 2018, changes these rules: up to 1 oz or 5 g hashish brings
    civil fines of up to $200, $300 or $500 by offence count; over 1–2 oz or over 5–10 g hashish
    is a misdemeanour with up to one year and/or $1,000.[@3]
  cultivation: >-
    A person 21 or older may possess two mature cannabis plants or fewer and four immature plants
    or fewer without a penalty. Section 4230i sets special criminal plant rules for the defined
    class of convicted drug sellers.[@3]
  enforcement: >-
    Ordinarily no penalty within adult possession and plant limits. The specified
    seller-conviction exception in §4230i retains civil fines, criminal possession and special
    plant rules.[@3] The statute then sets a civil penalty and a six-month offence that both
    describe possession of more than 2 ounces, and longer terms at 8 ounces, 1 pound and 10
    pounds.
  sharing: >-
    A person 21 or older may give up to 1 ounce of cannabis, or 5 grams of hashish, to another
    person 21 or older, if the gift is not advertised or promoted to the public. Selling cannabis
    unlawfully can bring up to two years. Selling or dispensing more than 1 ounce, or 5 grams or
    more of hashish, can bring up to five years.
  consumption: >-
    Private use only. The temporary sales-event law expressly prohibits cannabis consumption at
    permitted events.[@4]
  access: >-
    Licensed shops have sold cannabis since October 2022. A pilot effective 1 July 2026 allows the
    Board to grant up to ten public sales-event permits a year to licensed retailers, subject to
    municipal approval and implementing procedures. Each event is limited to twenty-four hours;
    operating permits were not verified in this review.[@4]
