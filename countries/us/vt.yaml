summary: >-
  A person 21 or older may possess up to 2 oz, or 10 g of hashish, and two mature plus four immature
  plants. A gift of up to 1 oz, or 5 g of hashish, between adults is legal if it is not advertised.
  The first state to legalise through its legislature; shops since 2022.
