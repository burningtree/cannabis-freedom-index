segments:
  possession: 2.5 oz is legal. More is a misdemeanour with a $600 fine.
  cultivation: >-
    Allowed only if you live more than 25 miles from a licensed shop. Twelve plants or more is a
    felony.
  enforcement: Nothing within the limits.
  sharing: Gifts of up to 1 oz of flower or 1/8 oz of concentrate are legal.
  consumption: Private use and licensed lounges; public use is a misdemeanour with a $600 fine.
  access: Licensed shops since 2017.
sources:
