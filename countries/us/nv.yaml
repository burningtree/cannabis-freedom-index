name: Nevada
recreational: legal
medical: legal
updated: 2026-10-23
summary: >-
  2.5 ounces of usable cannabis may be possessed. A person 21 or older may give that amount, or
  one-fourth of an ounce of concentrate, without payment, if the gift is not advertised or promoted
  to the public. Home growing is six plants per adult and twelve at a residence, and only more than
  25 miles from a licensed adult-use shop unless a medical exception applies. Licensed consumption
  lounges operate in Las Vegas.
scores:
  possession: 5
  cultivation: 2
  enforcement: 6
  sharing: 5
  consumption: 4
  access: 6
segments:
  possession:
    text: >-
      A person 21 or older may possess up to 2.5 ounces of usable cannabis or one-fourth of an ounce
      of concentrated cannabis.[@1,3]
    currency: USD
    penalties:
      - upto: 2.5 oz
        treatment: legal
        note: Usable cannabis; one-fourth of an ounce of concentrate
      - label: More than 2.5 oz
        treatment: criminal
        term: Misdemeanor
        fine: 600
  cultivation: >-
    A person 21 or older may grow up to six plants, in a locked enclosure out of public view, at a
    residence where no more than twelve plants are grown. Growing within 25 miles of a licensed
    adult-use shop, where the plants are visible from a public place, or without the consent of the
    person in possession of the property, is forbidden unless chapter 678C provides otherwise. A
    first violation is a misdemeanour with a fine of up to $600, a second a fine of up to $1,000, a
    third a gross misdemeanour, and a fourth a category E felony. The state health department says
    a medical cardholder may grow when no dispensary is within 25 miles, when that was true at the
    first application and registration has not lapsed, when illness or lack of transport prevents a
    trip to a dispensary, or when local dispensaries cannot supply the needed strain.
  enforcement: Nothing within the limits.
  sharing: >-
    A person 21 or older may give up to 2.5 ounces of usable cannabis, or up to one-fourth of an
    ounce of concentrated cannabis, without payment to another person 21 or older, so long as the
    gift is not advertised or promoted to the public.
  consumption: >-
    Private use and licensed lounges; public use is a misdemeanour with a $600 fine.[@1,3]
    [Nevada approved consumption-lounge regulations in 2022.](/history/nevada-consumption-lounge-regulations-2022/)
  access: Licensed shops since 2017.[@1,4]
context:
  recreational:
    text: >-
      Question 2 (November 2016) legalised adult use with 54% of the vote; shops opened on
      1 July 2017. The possession and gift limits rose to 2.5 oz of usable cannabis in January
      2024, and consumption lounges were licensed from 2022.[@4]
      [Nevada raised the adult limits in 2024.](/history/nevada-adult-limits-raised-2024/)
      [Nevada approved consumption-lounge regulations in 2022.](/history/nevada-consumption-lounge-regulations-2022/)
    sources: [4]
