name: District of Columbia
recreational: legal
medical: legal
updated: 2026-10-23
summary: >-
  2 oz may be possessed, and a person 21 or older may give up to 1 oz, with no payment, to
  another person 21 or older. Growing is up to six plants, three mature, inside the principal
  residence, and the household may not exceed 12 plants, six of them mature. Congress blocks
  licensed adult-use sales, so access runs through self-certified medical dispensaries.
