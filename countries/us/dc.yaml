segments:
  possession: 2 oz is legal. More is a misdemeanour with up to six months.
  cultivation: >-
    A person 21 or older may grow up to six cannabis plants, no more than three of them mature,
    within the interior of the house or rental unit that is that person's principal residence.
    Everyone living there together may not grow more than 12 plants, and no more than six of
    those may be mature. Growing outside that interior is outside this permission. On federal
    property, federal officers can arrest for any amount.
  enforcement: Nothing within the limits; public use is handled by citation.
  sharing: >-
    A person 21 or older may give up to 1 ounce, with no payment, to another person 21 or older.
  consumption: Private only, and federal land — a large part of the city — is off-limits entirely.
  access: >-
    No licensed adult-use shops, because Congress blocks them. Adults can self-certify as medical
    patients and buy from dispensaries.
