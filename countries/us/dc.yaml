name: District of Columbia
recreational: legal
medical: legal
updated: 2026-10-04
summary: >-
  2 oz, six plants (three mature) and gifts of up to 1 oz are legal. Congress blocks licensed
  adult-use sales, so access runs through self-certified medical dispensaries.
scores:
  possession: 5
  cultivation: 4
  enforcement: 6
  sharing: 5
  consumption: 3
  access: 4
segments:
  possession: 2 oz is legal. More is a misdemeanour with up to six months.
  cultivation: Six plants per adult, three mature.
  enforcement: Nothing within the limits; public use is handled by citation.
  sharing: Gifts of up to 1 oz between adults are legal.
  consumption: Private only, and federal land — a large part of the city — is off-limits entirely.
  access: >-
    No licensed adult-use shops, because Congress blocks them. Adults can self-certify as medical
    patients and buy from dispensaries.
sources:
  - title: NORML — District of Columbia laws and penalties
    url: https://norml.org/laws/district-of-columbia-penalties/
