segments:
  possession: 1 oz is legal. From 1 oz to 175 g is a misdemeanour with up to three months; more is a felony.
  cultivation: "Not allowed: home growing remains a crime."
  enforcement: Nothing within the limit, but amounts above it escalate quickly to felonies.
  sharing: Adults may give each other up to 1 oz without payment.
  consumption: Private only.
  access: Licensed shops opened in August 2025.
