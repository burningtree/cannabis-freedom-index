segments:
  possession: >-
    Adults 21+ may possess a personal-use quantity: up to 1 oz leaf marijuana, 12 g concentrated
    cannabis or cannabis products containing up to 750 mg delta-9-THC. The ounce allowance
    describes dried leaves and flowering tops; other forms have their own ceilings.[@2,3]
    Unauthorised leaf possession above 1 oz but below 175 g can bring up to three months or
    $575 or both; at 175 g, felony quantity provisions begin. Concentrate and product overages
    require the applicable drug classification and quantity rules, rather than treating 1 oz
    as their legal ceiling. Medical-programme permissions are separate.[@3]
  cultivation: "Not allowed: home growing remains a crime."
  enforcement: >-
    No state penalty within the adult personal-use quantity for the relevant product form.
    Outside that permission, criminal possession provisions apply, including felony quantity
    tiers; the leaf-weight brackets do not supply a universal allowance for concentrates or
    infused products.[@2,3]
  sharing: >-
    Adults 21+ may give another adult 21+ a personal-use quantity without payment: up to 1 oz
    leaf marijuana, 12 g concentrate or products with up to 750 mg delta-9-THC. Gifts tied to
    another transaction, purchase or advertised sale fall outside adult sharing.[@2,3]
  consumption: Private only.
  access: Licensed shops opened in August 2025.
answers:
  carry:
    answer: yes
    text: Adults 21+ may hold 1 oz leaf marijuana, 12 g concentrate or products with up to 750 mg delta-9-THC
