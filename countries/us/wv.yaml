segments:
  possession: >-
    Any amount is a misdemeanour with 90 days to six months and a $1,000 fine. A first offence under
    15 g gets a conditional discharge.
  cultivation: A felony.
  enforcement: Jail is on the books, with a way out for first offences.
  sharing: Any sale is a felony with one to five years.
  consumption: Illegal without a medical card.
  access: Medical dispensaries for card holders; no smoking of flower.
sources:
  - title: NORML — West Virginia laws and penalties
