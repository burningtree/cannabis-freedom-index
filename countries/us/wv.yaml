name: West Virginia
recreational: illegal
medical: legal
updated: '2026-10-27'
summary: >-
  Possession carries 90 days to six months and/or a fine. First possession under 15 g must
  follow the conditional-discharge procedure; dismissal requires successful probation. Medical
  dispensaries serve card holders.
scores:
  possession: 1
  cultivation: 1
  enforcement: 2
  sharing: 1
  consumption: 1
  access: 3
segments:
  possession: >-
    Unauthorised possession is a misdemeanour with 90 days to six months and/or up to $1,000.
    Section 401(c) requires a first possession offence involving less than 15 g to be disposed of
    under §407.[@4] Otherwise, for someone without a qualifying prior drug conviction, a court may
    defer proceedings with consent. Dismissal follows successful probation; violating its
    conditions can lead to conviction.[@2]
  cultivation:
    text: >-
      A felony; growing is charged as manufacture.[@1]
    currency: USD
    penalties:
      - label: Growing
        treatment: criminal
        term: Felony
        note: Punished by weight — see the possession and sale bands
  enforcement: >-
    First possession below 15 g must follow §407; other eligible possession deferrals are
    discretionary. Dismissal requires successful probation.[@4,2]
  sharing: >-
    Sale is a felony with one to five years.[@1] A first offence of unpaid distribution of less
    than 15 g must be handled under §407 by virtue of §402(c); the gift remains unlawful and
    dismissal requires successful compliance.[@3,2]
  consumption: Illegal without a medical card.[@1]
  access: Medical dispensaries for card holders; no smoking of flower.[@1]
