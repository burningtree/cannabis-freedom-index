name: West Virginia
recreational: illegal
medical: legal
updated: 2026-10-04
summary: >-
  Possession carries 90 days to six months in jail, with conditional discharge for a first offence.
  Medical dispensaries serve card holders; no flower smoking.
scores:
  possession: 1
  cultivation: 1
  enforcement: 2
