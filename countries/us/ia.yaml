name: Iowa
recreational: illegal
medical: limited
updated: 2026-10-04
summary: A first offence carries up to six months in jail. A narrow medical programme caps THC per patient.
scores:
  possession: 1
  cultivation: 0
  enforcement: 2
  sharing: 0
