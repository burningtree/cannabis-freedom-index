segments:
  possession: >-
    A first offence is a misdemeanour with up to six months and a $1,000 fine; a second, up to a
    year; a third, up to two years.
  cultivation: A felony with up to five years.
  enforcement: Jail is possible; chronic users may be sent to treatment instead.
  sharing: Sale is a felony.
  consumption: Illegal.
  access: A narrow medical cannabidiol programme with a cap on THC per patient; no flower.
sources:
  - title: NORML — Iowa laws and penalties
