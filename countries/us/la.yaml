segments:
  possession: >-
    Outside enhanced school zones, 14 g or less carries at most a $100 fine and no jail. Since 1
    August 2026, marijuana possession violating the school-zone law can bring up to one year in
    prison, with or without hard labour, and an additional fine up to $1,000. The zone covers school
    property, 2,000 feet around it and school buses, including colleges and vocational schools. Lack
    of knowledge of the zone is no defence. Ordinary possession above 14 g has separate penalties.[@1,2,3]
  cultivation:
    text: >-
      Illegal; charged as production.[@3]
    currency: USD
    penalties:
      - label: Growing under 2.5 lb
        treatment: criminal
        term: Felony
        prison_min: 1 year
        prison: 10 years
        fine: 50000
        note: First offence; larger grows bring longer terms
  enforcement: >-
    Small amounts ordinarily bring a fine only. School-zone marijuana offences can bring up to one
    year in prison and an additional $1,000 fine, including for 14 g or less.[@1,2,3]
    [Louisiana restored prison exposure in school zones in 2026.](/history/louisiana-school-zone-marijuana-2026/)
  sharing: Distribution carries one to ten years.[@3]
  consumption: Illegal.[@3]
  access: Medical cannabis, including flower, through licensed pharmacies on a doctor's recommendation.[@3]
