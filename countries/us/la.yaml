segments:
  possession: >-
    14 g or less is a $100 fine with no possibility of jail. More than 14 g is a misdemeanour with
    up to six months.
  cultivation: Illegal; charged as production.
  enforcement: A fine only for small amounts.
  sharing: Distribution carries one to ten years.
  consumption: Illegal.
  access: Medical cannabis, including flower, through licensed pharmacies on a doctor's recommendation.
