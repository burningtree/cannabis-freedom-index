segments:
  possession: 2 oz in public and no limit at home. From 2 to 8 oz in public is a misdemeanour.
  cultivation: >-
    A person 21 or older may grow up to six mature and six immature plants. A household may not
    have more than twelve mature plants, however many adults live there. Cannabis from plants
    inside that limit may be kept despite the weight limits. Intentionally producing more than six
    and up to twelve mature or immature plants draws a $50 penalty assessment. More than twelve
    mature or immature plants is a fourth-degree felony.
  enforcement: Nothing within the limits.
  sharing: Adults may give each other up to 2 oz.
  consumption: Private use and licensed consumption areas.
  access: Licensed shops since April 2022.
