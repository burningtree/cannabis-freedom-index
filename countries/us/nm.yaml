name: New Mexico
recreational: legal
medical: legal
updated: "2026-10-27"
summary: >-
  Public limits are 2 oz of flower, 16 g of extract or 800 mg of edible cannabis. Excess may be
  stored at home out of public view. Six mature and six immature plants per adult, with twelve
  mature plants per household. Shops and licensed consumption areas.
scores:
  possession: 6
  cultivation: 4
  enforcement: 6
  sharing: 5
  consumption: 4
  access: 6
segments:
  possession: >-
    Adults 21+ have ordinary public allowances of 2 oz of flower, 16 g of extract or 800 mg of
    edible cannabis. Excess may be kept in a private residence out of public view.[@1,4,5]
    Registered medical patients have separate allowances. Lawful homegrown harvest may be held
    despite the weight limits, and the Act permits transporting it when moving residence.[@1,5]
  cultivation: >-
    A person 21 or older may grow up to six mature and six immature plants. A household may not
    have more than twelve mature plants, however many adults live there. Cannabis from plants
    inside that limit may be kept despite the weight limits. Intentionally producing more than six
    and up to twelve mature or immature plants draws a $50 penalty assessment. More than twelve
    mature or immature plants is a fourth-degree felony.
  enforcement: >-
    Public possession above the ordinary allowance can be a misdemeanour: the flower band is
    more than 2 oz through 8 oz. The fourth-degree felony clause lists more than 8 oz of flower,
    64 g of extract or 3,200 mg of edible cannabis. Its wording leaves the exact extract and
    edible boundary unclear; amounts beyond those figures expose a person to felony prosecution.
    Medical, private-storage and lawful-harvest exceptions matter.[@1,4]
  sharing: >-
    Adults 21+ may give lawfully obtained cannabis to another adult 21+ without financial
    consideration. The regulator applies the possession limits to gifts: 2 oz of flower,
    16 g of extract or 800 mg of edible cannabis. These are product-specific limits; this
    does not establish permission to combine every maximum in one gift.[@1,5]
  consumption: Private use and licensed consumption areas.[@3]
  access: Licensed shops since April 2022.[@3,6]
context:
  recreational:
    text: >-
      House Bill 2, the Cannabis Regulation Act, was signed on 12 April 2021; the first licensed
      recreational sales began on 1 April 2022.[@6]
    sources: [6]
answers:
  carry:
    answer: yes
    text: Adults 21+ may carry 2 oz flower, 16 g extract or 800 mg edible cannabis, subject to product limits
  caught:
    answer: limited
    label: Misdemeanour or felony
    text: Public overages can be misdemeanours or felonies; extract and edible limits differ from flower
