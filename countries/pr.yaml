segments:
  possession:
    text: >-
      Under Article 404 of the Controlled Substances Act (Law 4 of 1971), possessing a controlled
      substance without a prescription is a felony with a fixed prison term of three years (two to
      five with mitigating or aggravating circumstances) and a fine of up to $5,000; a repeat
      conviction brings six years. A first offender may instead be put on probation without a
      finding of guilt and, if it is completed, have the case dismissed once in a lifetime. After a
      treatment assessment, a court may also impose a fine of $1,000 to $10,000 and up to six months
      of community service instead of prison.
    sources:
      - ley4
  cultivation:
    text: >-
      Growing cannabis outside the licensed medical industry is production of a controlled
      substance. The medical system is built on licensed cultivators supplying dispensaries.
    sources:
      - ley4
      - platea
  enforcement:
    text: >-
      Possession is still prosecuted as a felony in the Court of First Instance; one 2025 case
      reached the Court of Appeals over a challenge to the search. About 222 people were convicted
      under Article 404 in 2022, and a San Juan politician asked the governor in 2024 to pardon those
      convicted of cannabis possession.
    sources:
      - ta26
      - metro24
  sharing:
    text: >-
      Distributing a controlled substance is a separate offence under the same law, with no
      exception for sharing without payment.
    sources:
      - ley4
  consumption:
    text: >-
      Use is dealt with through the possession offence. Even medical patients may not smoke
      cannabis.
    sources:
      - ley4
      - wiki
  access:
    text: >-
      No legal adult-use source. Medical cannabis, legal since a 2015 executive order and Law 42 of
      2017, is easy to obtain on a doctor's certification: in January 2024 the Department of Health
      counted 114,818 patients, and the number of dispensaries rose from 277 to 342 during 2023. The
      most certified conditions were insomnia, anxiety and chronic pain.
    sources:
      - platea
      - wiki
context:
  production:
    text: >-
      The Medical Cannabis Regulatory Board had issued 498 licences for cultivation, transport,
      research and sale by 2024. All production serves the medical market.
    sources:
      - platea
  products:
    text: >-
      Medical cannabis products sold in licensed dispensaries; smoking is not an approved form of
      use. Industrial hemp-derived products such as CBD are covered by a 2020 circular letter.
    sources:
      - platea
      - wiki
  medical:
    text: >-
      A May 2015 executive order first allowed medical use, and Law 42 of 9 July 2017 set up the
      regulated system of cultivators and dispensaries under the Department of Health. Patients
      certified for insomnia (57%), anxiety (53%) and chronic pain (43%) make up most of the
      programme, which shrank slightly after mid-2023.
    sources:
      - wiki
      - platea
  consequences:
    text: >-
      Bills to decriminalise possession for personal use, including one in 2013 and another in 2022,
      did not pass. Federal law still treats all cannabis as illegal, as in the states.
    sources:
      - platea
      - metro13
  clubs:
    status: none
    text: >-
      No cannabis clubs are known. Outside licensed medical dispensaries, distribution is an offence.
    sources:
      - ley4
  visitors:
    status: none
    text: >-
      There is no adult-use supply for anyone. Medical cannabis requires a certification under the
      Puerto Rico programme.
    sources:
      - platea
