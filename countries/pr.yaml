name: Puerto Rico
region: North America
iso_numeric: 630
dependency:
  of: us
  kind: Unincorporated territory
  note: >-
    Puerto Rico is an unincorporated territory of the United States, a commonwealth with its own
    constitution, legislature and criminal law. Federal drug law applies there as in the states.
recreational: illegal
medical: legal
updated: "2026-10-21"
summary: >-
  Unauthorised cannabis possession remains a felony, with probation and other alternatives
  available in qualifying cases. Medical dispensaries began serving patients in December 2016. The
  health department counted 110,736 active patients in August 2026.
scores:
  possession: 1
