name: Puerto Rico
region: North America
iso_numeric: 630
dependency:
  of: us
  kind: Unincorporated territory
  note: >-
    Puerto Rico is an unincorporated territory of the United States, a commonwealth with its own
    constitution, legislature and criminal law. Federal drug law applies there as in the states.
recreational: illegal
medical: legal
updated: "2026-10-21"
summary: >-
  Unauthorised cannabis possession remains a felony, with probation and other alternatives
  available in qualifying cases. Medical dispensaries began serving patients in December 2016. The
  health department counted 110,736 active patients in August 2026.
scores:
  possession: 1
  cultivation: 1
  enforcement: 2
  sharing: 1
  consumption: 1
  access: 3
segments:
  possession:
    text: >-
      Under Article 404 of the Controlled Substances Act (Law 4 of 1971), possessing a controlled
      substance without a prescription is a felony with a fixed prison term of three years (two to
      five with mitigating or aggravating circumstances) and a fine of up to $5,000; a repeat
      conviction brings six years. A first offender may instead be put on probation without a
      finding of guilt and, if it is completed, have the case dismissed once in a lifetime. After
      a qualifying treatment assessment and with prosecution consent, a court may also impose a
      fine of $1,000 to $10,000 and up to six months of community service instead of prison.
    sources:
      - ley4
  cultivation:
    text: >-
      Growing cannabis outside the licensed medical industry is production of a controlled
      substance. The medical system is built on licensed cultivators supplying dispensaries.
    sources:
      - ley4
      - medicalLaw
  enforcement:
    text: >-
      Possession is still prosecuted as a felony in the Court of First Instance; one 2025 case
      reached the Court of Appeals over a challenge to the search. About 222 people were convicted
      under Article 404 in 2022, and a San Juan politician asked the governor in 2024 to pardon
      those convicted of cannabis possession.
    sources:
      - ta26
      - metro24
  sharing:
    text: >-
      Distributing a controlled substance is a separate offence under the same law, with no
      exception for sharing without payment.
    sources:
      - ley4
  consumption:
    text: >-
      Use is dealt with through the possession offence. Even medical patients may not smoke
      cannabis.
    sources:
      - ley4
      - medicalLaw
  access:
    text: >-
      There is no legal adult-use supply. The medical route requires a recommendation from an
      authorised doctor and patient identification under the regulated programme. The health
      department’s August 2026 report counted 110,736 active patients and 59 registered certifying
      doctors. Dispensaries began serving patients in December 2016; the 2017 law supplied the
      statutory structure.
    sources:
      - medicalLaw
      - stats26
      - retailStart
context:
  production:
    text: >-
      The Medical Cannabis Regulatory Board had issued 498 licences for cultivation, transport,
      research and sale by 2024. All production serves the medical market.
    sources:
      - platea
  products:
    text: >-
      Medical cannabis products sold in licensed dispensaries; smoking is not an approved form of
      use. Industrial hemp-derived products such as CBD are covered by a 2020 circular letter.
    sources:
      - medicalLaw
      - platea
  medical:
    text: >-
      The May 2015 executive order directed the health secretary to authorise medical cannabis
      through the drug law’s procedures. Dispensary sales began in December 2016, followed by the
      2017 Medical Cannabis Act. In August 2026, anxiety was certified for 59.34% of active
      patients, insomnia for 55.14% and chronic pain for 34.81%; patients may be certified for
      more than one condition.
    sources:
      - order15
      - medicalLaw
      - stats26
      - retailStart
  consequences:
    text: >-
      Registered medical patients who identify themselves to an employer have statutory protection
      against discrimination, subject to exceptions involving safety, essential duties, federal
      permissions or funding, and unauthorised workplace use or possession. A 2022 amendment also
      prevents registered medical use from triggering the disability law’s exclusion for
      illegal-drug users.
    sources:
      - medicalLaw
      - civil22
  clubs:
    status: none
    text: >-
      No cannabis clubs are known. Outside licensed medical dispensaries, distribution is an
      offence.
    sources:
      - ley4
  visitors:
    status: none
    text: >-
      There is no adult-use supply. For medical access, article 12 of the 2017 law recognises a
      nonresident patient’s identification from the relevant jurisdiction for entering a
      dispensary and possessing cannabis; the programme’s applicable conditions still govern. The
      law also provides for board rules recognising resident-jurisdiction patient cards.
    sources:
      - medicalLaw
