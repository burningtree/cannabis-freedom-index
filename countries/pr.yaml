summary: >-
  Possessing cannabis without a prescription is a felony carrying a fixed three-year prison term,
  though first offenders can have the case dismissed after probation. Alongside, Puerto Rico runs one
  of the largest medical programmes anywhere: about 115,000 patients, 3.6% of the population, and
  more than 300 dispensaries in 2023.
