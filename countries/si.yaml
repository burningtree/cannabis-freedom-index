segments:
  possession:
    text: >-
      Possessing a small quantity for personal use is not a crime but a misdemeanour, punished with
      a fine of roughly €36 to €179, which can be reduced if the person enters a treatment or social
      programme. The cannabis is confiscated. There is no fixed gram threshold in the law.
    sources:
      - wiki
  cultivation:
    text: >-
      Not legal. Growing cannabis with THC is prohibited and can be prosecuted as production. A
      government-backed draft notified to the EU in July 2025 would allow four plants per adult (six
      per household), but it has not been enacted.
    sources:
      - tris
      - boc
  enforcement:
    text: >-
      Users get a small fine. Production and dealing are crimes punishable by one to ten years in
      prison.
    sources:
      - wiki
  sharing:
    text: >-
      Supplying cannabis to another person is a criminal offence. The 2025 draft would permit
      limited unpaid sharing between adults, but it is not law.
    sources:
      - tris
      - wiki
  consumption:
    text: >-
      Use is covered by the same misdemeanour rules as possession; in practice private use is rarely
      pursued.
    sources:
      - wiki
  access:
    text: >-
      No adult-use source. In a June 2024 consultative referendum 51.6% of voters backed cannabis
      for limited personal use, and a bill followed, but there are still no clubs or shops. The
      medical route opened in August 2025.
    sources:
      - boc
      - medical_act
context:
  production:
    text: >-
      The 2025 Medical and Scientific Cannabis Act allows licensed cultivation and processing for
      medical and research purposes. Nothing for adult use.
    sources:
      - medical_act
  products:
    text: Medical flower and preparations on prescription; low-THC hemp products.
    sources:
      - medical_act
  medical:
    text: >-
      Since 20 August 2025 any physician may prescribe cannabis for any condition on their
      professional judgment, for up to a month at a time, either reimbursed by health insurance or
      self-paid. This is one of Europe's most open medical laws on paper; supply is still being
      built up.
    sources:
      - medical_act
  consequences:
    text: A misdemeanour fine is not a criminal conviction. Drug-driving is tested and penalised.
    sources:
      - wiki
  planting:
    seeds: grey
    seeds_trade: regulated
    clones: licensed
    clones_trade: regulated
    text: >-
      The controlled-cannabis definition excludes seeds, so possessing seed is not itself a drug
      offence, but germinating a high-THC variety remains unlawful outside licensed medical or
      scientific production. Seed intended for lawful hemp planting must meet agricultural seed
      and variety rules. Living propagation material and seedlings are regulated, and may be
      produced or marketed only through authorised hemp, medical or scientific channels.
    sources:
      - definition
      - hemp_rule
      - medical_act
  driving:
    status: zero
    text: >-
      No THC limit is set: the offence is committed if a drug is detected. Police may stop at
      random and test on suspicion, with a roadside oral-fluid test and blood or urine taken
      at a hospital. The fine starts at 1,200 euros and the driver receives 18 penalty points,
      which means losing the licence and re-taking the test after six months to a year; there
      is no prison sentence.
    sources:
      - euda_dd
  arrests:
    text: >-
      The EU drugs agency's statistical bulletin records 2,981 cannabis-related drug law
      offences in Slovenia in 2024, against 2,782 in 2023. Of the 2024 total, 2,733 were for
      use or possession for use. Countries count these differently (offences or offenders,
      criminal or administrative), so the figure is not comparable across borders.
    sources:
      - euda_dlo
  clubs:
    status: underground
    text: >-
      Clubs exist without any legal basis. A Europe-wide survey of cannabis social clubs
      carried out in 2018 and 2019 received answers from two clubs in Slovenia, and its
      authors could not say how many more were active. The study notes that the model is
      prohibited throughout the European Union, that clubs sit in a legally sensitive
      position, and that many have been dissolved after court decisions or police raids.
      Nothing more recent was found.
    sources:
      - pardal20
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. British travel advice says illegal
      drugs, including cannabis, carry severe penalties and tells travellers to expect a long
      jail sentence and heavy fines for possessing, using or smuggling them, also when only
      changing planes. Airport scanners are also used on the baggage of passengers in transit.
    sources:
      - boc
      - medical_act
      - fcdo
