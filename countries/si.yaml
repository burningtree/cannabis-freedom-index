name: Slovenia
region: Europe
iso_numeric: 705
recreational: decriminalised
medical: legal
updated: '2026-10-28'
summary: >-
  Possession for personal use is a minor offence punished by a fine. Voters backed medical and
  personal use in 2024 referendums, and a 2025 law set up a full medical cannabis system.
answers:
  caught:
    answer: limited
    label: Misdemeanour fine
    text: >-
      Small one-time personal possession brings a non-criminal fine and confiscation;
      imprisonment as a sentence for this misdemeanour was removed in 2005
scores:
  possession: 3
  cultivation: 1
  enforcement: 4
  sharing: 1
  consumption: 2
  access: 2
segments:
  possession:
    text: >-
      A smaller quantity for one-time personal use is a non-criminal misdemeanour with a
      fine.[@zpppd,zp1] The Celje appeal court stated the euro range as €41.73–208.65 in 2023;
      the Act sets no gram threshold.[@fine2023] NIJZ’s 2025 report confirms that the general
      Minor Offences Act removed imprisonment as a sentence for these possession misdemeanours
      in 2005.[@nijz2025] Voluntary treatment or an approved social-care programme can support a
      milder penalty; the drugs are confiscated.[@zpppd]
    sources:
      - zpppd
      - zp1
      - fine2023
      - nijz2025
    currency: EUR
    penalties:
      - label: Smaller quantity for one-time personal use
        treatment: civil
        term: Minor offence
        fine_min: 41.73
        fine: 208.65
        note: Non-criminal misdemeanour; no prison since 2005; drugs confiscated
  cultivation:
    text: >-
      Not legal. Growing cannabis with THC is prohibited and can be prosecuted as production,
      which carries one to ten years under Article 186 of the Criminal Code.[@kz1bwc] A draft
      notified to the EU in July 2025 would allow four plants per adult (six per household), but
      it has not been enacted.[@tris,boc] Licensed cultivation for medical and scientific
      purposes is separately lawful under the 2025 Act.[@medical_act]
    sources:
      - tris
      - boc
      - kz1bwc
      - medical_act
    penalties:
      - label: Unlicensed growing
        treatment: criminal
        term: Production
        prison_min: 1 year
        prison: 10 years
        note: Prosecuted as production under Article 186
      - label: Licensed medical or scientific growing
        treatment: legal
        term: Licensed cultivation
        note: Only under the 2025 Medical and Scientific Cannabis Act
  enforcement:
    text: >-
      Minor personal possession is handled by a fine and confiscation. Since 2005, imprisonment
      cannot be imposed as the sentence for that misdemeanour.[@nijz2025] Production and dealing
      remain separate criminal offences under Article 186, with prison terms of one to ten
      years.[@kz1bwc]
    sources:
      - nijz2025
      - kz1bwc
  sharing:
    text: >-
      Unauthorised production, sale or holding drugs for resale carries one to ten years under
      Article 186.[@criminal_current] Giving drugs to another person for use or providing
      premises carries six months to eight years under Article 187; specified aggravated cases
      carry one to twelve years.[@criminal_current] The [2025 personal-use
      draft](/history/slovenia-personal-use-bill-2025/) proposed limited unpaid sharing between
      adults.[@tris] Specified aggravated supply carries three to fifteen years; organised
      groups or dealer networks carry five to fifteen years.[@criminal_current] Passing cannabis
      prescribed in one’s own name to someone else carries a separate €200–€1,000 misdemeanour
      fine.[@medical_act]
    sources:
      - criminal_current
      - tris
      - medical_act
    penalties:
      - label: Production or supply
        treatment: criminal
        term: Unauthorised manufacture and trade
        prison_min: 1 year
        prison: 10 years
        note: Article 186(1)
      - label: Giving for use or providing premises
        treatment: criminal
        term: Facilitating use
        prison_min: 6 months
        prison: 8 years
        note: Article 187(1)
      - label: Aggravated facilitation
        treatment: criminal
        term: Facilitating use
        prison_min: 1 year
        prison: 12 years
        note: >-
          Article 187(2): protected persons, multiple people, specified premises or abuse of
          professional position
      - label: Aggravated supply
        treatment: criminal
        term: Unauthorised manufacture and trade
        prison_min: 3 years
        prison: 15 years
        note: 'Article 186(2): protected persons, specified premises or abuse of position'
      - label: Organised group or dealer network
        treatment: criminal
        term: Unauthorised manufacture and trade
        prison_min: 5 years
        prison: 15 years
        note: Article 186(3)
      - label: Passing personally prescribed cannabis to another person
        treatment: civil
        term: Medical cannabis transfer misdemeanour
        fine_min: 200
        fine: 1000
        note: ZKMZN Article 50(3)
    currency: EUR
  consumption:
    text: >-
      Article 33 punishes possession, including a smaller quantity kept for one-time personal
      use. It does not create a separate offence of use.[@zpppd]
    sources:
      - zpppd
  access:
    text: >-
      No adult-use source. In a June 2024 consultative referendum 51.6% of voters backed
      cannabis for limited personal use, and a bill followed, but there are still no clubs or
      shops.[@boc] The medical production framework changed in August 2025.[@medical_act]
    sources:
      - boc
      - medical_act
