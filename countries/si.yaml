name: Slovenia
region: Europe
iso_numeric: 705
recreational: decriminalised
medical: legal
updated: 2026-10-26
summary: >-
  Possession for personal use is a minor offence punished by a fine. Voters backed medical and
  personal use in 2024 referendums, and a 2025 law set up a full medical cannabis system.
answers:
  caught:
    answer: limited
    label: Misdemeanour fine
    text: >-
      Small one-time personal possession brings a non-criminal fine and confiscation; imprisonment
      as a sentence for this misdemeanour was removed in 2005
scores:
  possession: 3
  cultivation: 1
  enforcement: 4
  sharing: 1
  consumption: 2
  access: 2
segments:
  possession:
    text: >-
      A smaller quantity for one-time personal use is a non-criminal misdemeanour with a fine. The
      Celje appeal court stated the euro range as €41.73–208.65 in 2023; the Act sets no gram
      threshold. NIJZ’s 2025 report confirms that the general Minor Offences Act removed
      imprisonment as a sentence for these possession misdemeanours in 2005. Voluntary treatment or
      an approved social-care programme can support a milder penalty; the drugs are confiscated.
    sources:
      - zpppd
      - zp1
      - fine2023
      - nijz2025
  cultivation:
    text: >-
      Not legal. Growing cannabis with THC is prohibited and can be prosecuted as production. A
      government-backed draft notified to the EU in July 2025 would allow four plants per adult (six
      per household), but it has not been enacted.
    sources:
      - tris
      - boc
  enforcement:
    text: >-
      Minor personal possession is handled by a fine and confiscation. Since 2005, imprisonment
      cannot be imposed as the sentence for that misdemeanour. Production and dealing remain
      separate criminal offences under Article 186, with prison terms.
    sources:
      - nijz2025
      - kz1
  sharing:
    text: >-
      Unlawfully manufacturing or selling a narcotic, or buying or keeping it in order to resell
      it, is a criminal offence. The 2025 draft would permit limited unpaid sharing between
      adults, but it is not law.
    sources:
      - kz1
      - tris
  consumption:
    text: >-
      Article 33 punishes possession, including a smaller quantity kept for one-time personal use.
      It does not create a separate offence of use.
    sources:
      - zpppd
  access:
    text: >-
      No adult-use source. In a June 2024 consultative referendum 51.6% of voters backed cannabis
      for limited personal use, and a bill followed, but there are still no clubs or shops. The
      medical route opened in August 2025.
    sources:
      - boc
      - medical_act
context:
  production:
    text: >-
      The 2025 Medical and Scientific Cannabis Act allows licensed cultivation and processing for
      medical and research purposes. Nothing for adult use.
    sources:
      - medical_act
  products:
    text: Medical flower and preparations on prescription; low-THC hemp products.
    sources:
      - medical_act
  medical:
    text: >-
      Since 20 August 2025 any physician may prescribe cannabis for any condition on their
      professional judgment, for up to a month at a time, either reimbursed by health insurance or
      self-paid. This is one of Europe's most open medical laws on paper; supply is still being
      built up.
    sources:
      - medical_act
  consequences:
    text: >-
      Possession of a smaller quantity for one-time personal use is a misdemeanour under the
      drugs Act. Unlawfully manufacturing or selling a narcotic is a separate criminal offence.
    sources:
      - zpppd
      - kz1
  planting:
    seeds: grey
    seeds_trade: regulated
    clones: licensed
    clones_trade: regulated
    text: >-
      The controlled-cannabis definition excludes seeds, so possessing seed is not itself a drug
      offence, but germinating a high-THC variety remains unlawful outside licensed medical or
      scientific production. Seed intended for lawful hemp planting must meet agricultural seed
      and variety rules. Living propagation material and seedlings are regulated, and may be
      produced or marketed only through authorised hemp, medical or scientific channels.
    sources:
      - definition
      - hemp_rule
      - medical_act
  driving:
    status: zero
    text: >-
      No THC limit is set: the offence is committed if a drug is detected. Police may stop at
      random and test on suspicion, with a roadside oral-fluid test and blood or urine taken
      at a hospital. The fine starts at 1,200 euros and the driver receives 18 penalty points,
      which means losing the licence and re-taking the test after six months to a year; there
      is no prison sentence.
    sources:
      - euda_dd
  arrests:
    text: >-
      The EU drugs agency's statistical bulletin records 2,981 cannabis-related drug law
      offences in Slovenia in 2024, against 2,782 in 2023. Of the 2024 total, 2,733 were for
      use or possession for use. Countries count these differently (offences or offenders,
      criminal or administrative), so the figure is not comparable across borders.
    sources:
      - euda_dlo
  clubs:
    status: underground
    text: >-
      Clubs exist without any legal basis. A Europe-wide survey of cannabis social clubs carried out
      in 2018 and 2019 received answers from two clubs in Slovenia, and its authors could not say
      how many more were active. The study notes that clubs sit in a legally sensitive position and
      that many have been dissolved after court decisions or police raids. No law in Slovenia
      provides for them; Malta (since 2021) and Germany (since 2024) license non-profit cannabis
      associations, but only under their own laws. Nothing more recent was found.
    sources:
      - pardal20
      - de_cang
      - mt_cap628
  visitors:
    status: none
    text: >-
      There is no legal recreational supply. A smaller quantity for one-time personal use is a
      non-criminal misdemeanour with a fine and confiscation; the Celje appeal court gave the range
      as €41.73–208.65 in 2023. Imprisonment as a sentence for this misdemeanour was removed in
      2005.
    sources:
      - fine2023
      - nijz2025
  black_market:
    text: >-
      The EU drugs agency's statistical bulletin records 564 kg of herbal cannabis and 1.3
      kg of cannabis resin seized in Slovenia in 2024, against 794 kg and 11 kg in 2023.
      Herbal cannabis was seized on 2,714 occasions and resin on 64. Plant seizures came to 14,563 plants. Countries record seizures differently, so the figures are
      not comparable across borders.
    sources:
      - euda_szr
