context:
  recreational:
    text: >-
      There is no legal recreational supply. A smaller quantity for one-time personal use is a
      non-criminal misdemeanour with a fine of €41.73–208.65 and confiscation; no gram threshold
      defines it, and voluntary treatment can soften the penalty.[@zpppd,zp1,fine2023,nijz2025]
      Growing cannabis with THC stays prohibited and can be prosecuted as production.[@tris] A
      [2025 draft for four plants per adult](/history/slovenia-personal-use-bill-2025/) has not
      been enacted.[@boc] The personal-use vote itself came from the [June 2024
      referendum](/history/slovenia-referendum-2024/).[@boc]
    sources:
      - zpppd
      - zp1
      - fine2023
      - nijz2025
      - tris
      - boc
  production:
    status: medical
    text: >-
      The [2025 Act](/history/slovenia-medical-law-2025/) creates a licensing route through
      [JAZMP](https://www.jazmp.si/) for medical cannabis production and wholesale
      supply.[@medical_act] Patients receive prescribed products through
      pharmacies.[@medical_act] Separate [research-permit rules effective in March
      2026](/history/slovenia-research-permit-rules-2026/) require scientific plans,
      traceability, security and waste-destruction arrangements.[@research2026]
    sources:
      - medical_act
      - research2026
  medical:
    text: >-
      The [2025 Act](/history/slovenia-medical-law-2025/) permits prescribing for any indication
      on a doctor’s professional judgment, at most one month’s treatment per
      month.[@medical_act] A first prescription requires an examination, repeated after twelve
      months for continuing treatment, and dispensing is through pharmacies.[@medical_act]
      NIJZ’s report on 2024 prescribing records 1,666 prescriptions and 2,091 compounded
      preparations from reporting pharmacies; reporting was incomplete.[@prescribing2024] That
      report describes flower and standardised extracts as permitted but not yet in routine use,
      alongside cannabinoid preparations.[@prescribing2024]
    sources:
      - medical_act
      - prescribing2024
  consequences:
    text: >-
      Personal-possession misdemeanours involve confiscation of the drugs.[@zpppd] A pharmacy
      certificate under the 2025 medical Act documents authorised possession and use for one
      month after dispensing.[@medical_act] Passing prescribed cannabis to another person
      carries a €200–€1,000 fine under that Act.[@medical_act]
    sources:
      - zpppd
      - medical_act
  planting:
    seeds: grey
    seeds_trade: regulated
    clones: licensed
    clones_trade: regulated
    text: >-
      The controlled-cannabis definition excludes seeds, so possessing seed is not itself a drug
      offence, but germinating a high-THC variety remains unlawful outside licensed medical or
      scientific production.[@definition,medical_act] Seed intended for lawful hemp planting
      must meet agricultural seed and variety rules. Living propagation material and seedlings
      are regulated, and may be produced or marketed only through authorised hemp, medical or
      scientific channels.[@hemp_rule]
    sources:
      - definition
      - hemp_rule
      - medical_act
  hemp:
    status: standard
    text: >-
      Industrial hemp cultivation requires a permit for agricultural land registered to the
      farm, using varieties on the EU common catalogue with at most 0.3% THC.[@hemp2024]
      Permitted purposes include food, seed, fibre, animal feed, cosmetics and other industrial
      uses.[@hemp2024] In [2025 inspections](/history/slovenia-hemp-inspections-2025/), one of
      fifty samples exceeded the THC limit and was referred to police; inspectors also checked
      seed invoices and quality declarations.[@hempinspection2025]
    sources:
      - hemp2024
      - hempinspection2025
  culture:
    text: >-
      Ljubljana's [Metelkova](/culture/traditions/metelkova/) autonomous zone grew out of the
      [1993 barracks occupation](/history/slovenia-metelkova-occupation-1993/); cannabis appears
      in accounts of its nightlife, though autonomy never meant a separate drug law.[@metelkova]
      The zone's personal-use politics belong to the national story, including the [2024
      referendum](/history/slovenia-referendum-2024/).[@metelkova]
    sources:
      - metelkova
  driving:
    status: zero
    text: >-
      Article 106 treats drugs detected in blood or saliva as evidence of prohibited influence,
      with no numerical THC allowance.[@traffic] The offence carries a fine of at least €1,200
      and eighteen penalty points for motor drivers.[@traffic] A urine-only finding instead
      leads to a medical fitness examination.[@traffic] For prescribed psychoactive medicines,
      the law provides an examination-based exception where use followed the prescribed therapy
      and doctor’s instructions.[@traffic]
    sources:
      - traffic
  arrests:
    text: >-
      The EU drugs agency's statistical bulletin records 2,981 cannabis-related drug law
      offences in Slovenia in 2024, against 2,782 in 2023.[@euda_dlo] Of the 2024 total, 2,733
      were for use or possession for use. Countries count these differently (offences or
      offenders, criminal or administrative), so the figure is not comparable across
      borders.[@euda_dlo]
    sources:
      - euda_dlo
  research:
    status: licensed
    text: >-
      Researchers can seek permission under the 2025 Act and [2026 implementing
      rules](/history/slovenia-research-permit-rules-2026/), with a research plan, equipment,
      traceability and security arrangements.[@research2026] Slovenian forensic scientists Rajko
      Koren and Katja Benčina presented analyses of seized self-medication products at Bled in
      May 2016.[@forensic2016] They measured cannabinoids in extracts, oils, suppositories,
      creams and honey and detected solvents including isopropyl alcohol in some
      samples.[@forensic2016]
    sources:
      - research2026
      - forensic2016
  clubs:
    status: underground
    text: >-
      A European cannabis-club survey conducted in 2018–2019 received responses from two
      Slovenian clubs, without establishing a national total.[@pardal20] Their collective supply
      has no statutory recreational exemption: giving drugs for use and providing premises
      remain offences under Article 187.[@criminal_current] Licensed medical production and
      pharmacy dispensing follow the separate 2025 Act.[@medical_act]
    sources:
      - pardal20
      - criminal_current
      - medical_act
  visitors:
    status: none
    text: >-
      There is no legal recreational supply. A smaller quantity for one-time personal use is a
      non-criminal misdemeanour with a fine and confiscation; the Celje appeal court gave the
      range as €41.73–208.65 in 2023.[@fine2023] Imprisonment as a sentence for this
      misdemeanour was removed in 2005.[@nijz2025]
    sources:
      - fine2023
      - nijz2025
  black_market:
    text: >-
      The EU drugs agency's statistical bulletin records 564 kg of herbal cannabis and 1.3 kg of
      cannabis resin seized in Slovenia in 2024, against 794 kg and 11 kg in 2023.[@euda_szr]
      Herbal cannabis was seized on 2,714 occasions and resin on 64. Plant seizures came to
      14,563 plants. Countries record seizures differently, so the figures are not comparable
      across borders.[@euda_szr]
    sources:
      - euda_szr
