name: Slovenia
region: Europe
iso_numeric: 705
recreational: decriminalised
medical: legal
updated: 2026-10-27
summary: >-
  Possession for personal use is a minor offence punished by a fine. Voters backed medical and
  personal use in 2024 referendums, and a 2025 law set up a full medical cannabis system.
answers:
  caught:
    answer: limited
    label: Misdemeanour fine
    text: >-
      Small one-time personal possession brings a non-criminal fine and confiscation; imprisonment
      as a sentence for this misdemeanour was removed in 2005
scores:
  possession: 3
  cultivation: 1
  enforcement: 4
  sharing: 1
  consumption: 2
  access: 2
segments:
  possession:
    text: >-
      A smaller quantity for one-time personal use is a non-criminal misdemeanour with a fine.[@zpppd,zp1] The
      Celje appeal court stated the euro range as €41.73–208.65 in 2023; the Act sets no gram
      threshold.[@fine2023] NIJZ’s 2025 report confirms that the general Minor Offences Act removed
      imprisonment as a sentence for these possession misdemeanours in 2005.[@nijz2025] Voluntary treatment or
      an approved social-care programme can support a milder penalty; the drugs are confiscated.[@zpppd]
    sources:
      - zpppd
      - zp1
      - fine2023
      - nijz2025
    currency: EUR
    penalties:
      - label: Smaller quantity for one-time personal use
        treatment: civil
        term: Minor offence
        fine_min: 41.73
        fine: 208.65
        note: Non-criminal misdemeanour; no prison since 2005; drugs confiscated
  cultivation:
    text: >-
      Not legal. Growing cannabis with THC is prohibited and can be prosecuted as production,
      which carries one to ten years under Article 186 of the Criminal Code.[@kz1bwc] A
      government-backed draft notified to the EU in July 2025 would allow four plants per adult (six
      per household), but it has not been enacted.[@tris,boc] Licensed cultivation for medical and
      scientific purposes is separately lawful under the 2025 Act.[@medical_act]
    sources:
      - tris
      - boc
      - kz1bwc
      - medical_act
    penalties:
      - label: Unlicensed growing
        treatment: criminal
        term: Production
        prison_min: 1 year
        prison: 10 years
        note: Prosecuted as production under Article 186
      - label: Licensed medical or scientific growing
        treatment: legal
        term: Licensed cultivation
        note: Only under the 2025 Medical and Scientific Cannabis Act
  enforcement:
    text: >-
      Minor personal possession is handled by a fine and confiscation. Since 2005, imprisonment
      cannot be imposed as the sentence for that misdemeanour.[@nijz2025] Production and dealing remain
      separate criminal offences under Article 186, with prison terms of one to ten years.[@kz1bwc]
    sources:
      - nijz2025
      - kz1bwc
  sharing:
    text: >-
      Unlawfully manufacturing or selling a narcotic, or buying or keeping it in order to resell
      it, is a criminal offence carrying one to ten years under Article 186.[@kz1bwc] The 2025 draft would permit limited unpaid sharing between
      adults, but it is not law.[@tris]
    sources:
      - kz1bwc
      - tris
  consumption:
    text: >-
      Article 33 punishes possession, including a smaller quantity kept for one-time personal use.
      It does not create a separate offence of use.[@zpppd]
    sources:
      - zpppd
  access:
    text: >-
      No adult-use source. In a June 2024 consultative referendum 51.6% of voters backed cannabis
      for limited personal use, and a bill followed, but there are still no clubs or shops.[@boc] The
      medical route opened in August 2025.[@medical_act]
    sources:
      - boc
      - medical_act
words:
  - { word: Hašiš, lang: Slovenian, meaning: "hashish; dried leaves of the Indian hemp plant", sources: [wiktionary-hasis-sl] }
context:
  recreational:
    text: >-
      There is no legal recreational supply. A smaller quantity for one-time personal use is a
      non-criminal misdemeanour with a fine of €41.73–208.65 and confiscation; no gram
      threshold defines it, and voluntary treatment can soften the penalty.[@zpppd,zp1,fine2023,nijz2025]
      Growing cannabis with THC stays prohibited and can be prosecuted as
      production.[@tris] A [2025 draft for four plants per adult](/history/slovenia-personal-use-bill-2025/) has not been
      enacted.[@boc] The personal-use vote itself came from the [June 2024
      referendum](/history/slovenia-referendum-2024/).[@boc]
    sources:
      - zpppd
      - zp1
      - fine2023
      - nijz2025
      - tris
      - boc
  production:
    status: medical
    text: >-
      The [2025 Medical and Scientific Cannabis Act](/history/slovenia-medical-law-2025/) allows licensed cultivation and processing for
      medical and research purposes. Nothing for adult use.[@medical_act]
    sources:
      - medical_act
  medical:
    text: >-
      Since 20 August 2025 any physician may prescribe cannabis for any condition on their
      professional judgment, for up to a month at a time, either reimbursed by health insurance or
      self-paid.[@medical_act] Medical flower and preparations are available on prescription. This is one of Europe's most open medical laws on paper; supply is still being
      built up.[@medical_act] The programme follows the 2024 referendum, in which 66.7% backed
      growing and processing cannabis for medical purposes.[@boc]
    sources:
      - medical_act
      - boc
  consequences:
    text: >-
      Possession of a smaller quantity for one-time personal use is a misdemeanour under the
      drugs Act.[@zpppd] Unlawfully manufacturing or selling a narcotic is a separate criminal offence
      carrying one to ten years.[@kz1bwc]
    sources:
      - zpppd
      - kz1bwc
  planting:
    seeds: grey
    seeds_trade: regulated
    clones: licensed
    clones_trade: regulated
    text: >-
      The controlled-cannabis definition excludes seeds, so possessing seed is not itself a drug
      offence, but germinating a high-THC variety remains unlawful outside licensed medical or
      scientific production.[@definition,medical_act] Seed intended for lawful hemp planting must meet agricultural seed
      and variety rules. Living propagation material and seedlings are regulated, and may be
      produced or marketed only through authorised hemp, medical or scientific channels.[@hemp_rule]
    sources:
      - definition
      - hemp_rule
      - medical_act
  hemp:
    status: standard
    text: >-
      Hemp sits inside agricultural rules rather than drug law: seed and seedlings may move only
      through authorised channels under the 2022 propagation-material rules, and low-THC hemp
      products are sold.[@hemp_rule] Growing high-THC cannabis outside licensed medical or
      scientific production stays prohibited and can be prosecuted as production.[@medical_act]
    sources:
      - hemp_rule
      - medical_act
  culture:
    text: >-
      Ljubljana's [Metelkova](/culture/traditions/metelkova/) autonomous zone grew out of the
      [1993 barracks occupation](/history/slovenia-metelkova-occupation-1993/); cannabis appears in
      accounts of its nightlife, though autonomy never meant a separate drug law.[@metelkova] The
      zone's personal-use politics belong to the national story, including the [2024
      referendum](/history/slovenia-referendum-2024/).[@metelkova]
    sources:
      - metelkova
  driving:
    status: zero
    text: >-
      No THC limit is set: the offence is committed if a drug is detected.[@euda_dd] Police may stop at
      random and test on suspicion, with a roadside oral-fluid test and blood or urine taken
      at a hospital. The fine starts at 1,200 euros and the driver receives 18 penalty points,
      which means losing the licence and re-taking the test after six months to a year; there
      is no prison sentence.[@euda_dd]
    sources:
      - euda_dd
  arrests:
    text: >-
      The EU drugs agency's statistical bulletin records 2,981 cannabis-related drug law
      offences in Slovenia in 2024, against 2,782 in 2023.[@euda_dlo] Of the 2024 total, 2,733 were for
      use or possession for use. Countries count these differently (offences or offenders,
      criminal or administrative), so the figure is not comparable across borders.[@euda_dlo]
    sources:
      - euda_dlo
  research:
    status: licensed
    text: >-
      The 2025 Medical and Scientific Cannabis Act opens licensed cultivation and processing
      for medical and research purposes; nothing for adult use was enacted.[@tris] No separate
      research programme, trial or published study was established by the retained sources.[@tris]
    sources:
      - tris
  clubs:
    status: underground
    text: >-
      Clubs exist without any legal basis. A Europe-wide survey of cannabis social clubs carried out
      in 2018 and 2019 received answers from two clubs in Slovenia, and its authors could not say
      how many more were active.[@pardal20] The study notes that clubs sit in a legally sensitive position and
      that many have been dissolved after court decisions or police raids. No law in Slovenia
      provides for them; Malta (since 2021) and Germany (since 2024) license non-profit cannabis
      associations, but only under their own laws.[@de_cang,mt_cap628] Nothing more recent was found.[@pardal20]
    sources:
      - pardal20
      - de_cang
      - mt_cap628
  visitors:
    status: none
    text: >-
      There is no legal recreational supply. A smaller quantity for one-time personal use is a
      non-criminal misdemeanour with a fine and confiscation; the Celje appeal court gave the range
      as €41.73–208.65 in 2023.[@fine2023] Imprisonment as a sentence for this misdemeanour was removed in
      2005.[@nijz2025]
    sources:
      - fine2023
      - nijz2025
  black_market:
    text: >-
      The EU drugs agency's statistical bulletin records 564 kg of herbal cannabis and 1.3
      kg of cannabis resin seized in Slovenia in 2024, against 794 kg and 11 kg in 2023.[@euda_szr]
      Herbal cannabis was seized on 2,714 occasions and resin on 64. Plant seizures came to 14,563 plants. Countries record seizures differently, so the figures are
      not comparable across borders.[@euda_szr]
    sources:
      - euda_szr
