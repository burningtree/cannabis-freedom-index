segments:
  possession:
    text: >-
      Cannabis is a Class I narcotic under Law 35 of 2009, the same class as heroin. Possession
      carries a minimum of four and up to twelve years in prison plus a very large fine. A person
      who can prove they are a user rather than a possessor may instead get up to four years or
      court-ordered rehabilitation — an outcome that often depends on money and lawyers.
    sources:
      - gp
      - tempo
  cultivation:
    text: >-
      Cultivation is punished on the same scale as possession, with longer terms for more than a few
      plants.
    sources:
      - gp
  enforcement:
    text: >-
      Among the harshest in the world. Tourists in Bali are regularly jailed for years over a few
      grams, and Indonesia retains and uses the death penalty for drug trafficking.
    sources:
      - sun
      - gp
  sharing:
    text: >-
      Supply carries five to twenty years; large-scale trafficking can bring life imprisonment or
      death.
    sources:
      - sun
      - gp
  consumption:
    text: Using a Class I narcotic for oneself is a crime with up to four years, or rehabilitation.
    sources:
      - gp
  access:
    text: None.
    sources:
      - tempo
context:
  death_penalty:
    text: >-
      Large-scale trafficking can bring life imprisonment or death, and Indonesia retains and uses
      the death penalty for drug trafficking.
    sources:
      - sun
      - gp
  production:
    text: None. Cannabis has long been grown illicitly in Aceh, where the army burns fields each year.
    sources:
