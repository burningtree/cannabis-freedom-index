segments:
  possession:
    text: >-
      Cannabis is a Class I narcotic. Since 2 January 2026, planting or possessing it in plant form
      carries up to twelve years in prison and/or a category VI fine. More than 1 kg or at least six
      plants raises the penalty to life imprisonment or up to twenty years, and/or a higher fine.
      Possession under Article 111 has no death penalty or special minimum prison term.[@uu35,uu2026]
      Personal use under Article 127 carries up to four years; a person proved to be a victim of drug
      abuse must receive rehabilitation.[@uu35]
    sources:
      - uu35
      - uu2026
    currency: IDR
    penalties:
      - label: Planting or possessing plant form
        treatment: criminal
        prison: 12 years
        fine: 2000000000
        note: Up to twelve years and/or a category VI fine (Rp2 billion); no death penalty or minimum
      - label: Over 1 kg or at least six plants
        treatment: criminal
        note: Life imprisonment or up to twenty years and/or a higher fine
      - label: Personal use, Article 127
        treatment: criminal
        prison: 4 years
        note: Up to four years; proven abuse victims must receive rehabilitation
  cultivation:
    text: >-
      Planting cannabis is punished under Article 111. Since 2 January 2026, the basic penalty is up
      to twelve years and/or a category VI fine. More than 1 kg or at least six plants carries life
      imprisonment or up to twenty years and/or a higher fine. The special minimum prison terms have
      been removed; Article 111 does not provide a death sentence.[@uu2026,uu35]
    sources:
      - uu2026
      - uu35
  enforcement:
    text: >-
      Among the harshest in the world. Tourists in Bali are regularly jailed for years over a few
      grams, and Indonesia retains and uses the death penalty for drug trafficking.
    sources:
      - sun
      - gp
  sharing:
    text: >-
      Selling, buying, brokering or delivering a Class I narcotic carries life imprisonment or up to
      twenty years and/or a category VI fine. For plant-form cannabis, more than 1 kg or at least six
      plants can bring death, life imprisonment or up to twenty years and/or a higher fine under
      Article 114.[@uu2026,uu35] Giving a Class I narcotic to another person to use carries up to
      fifteen years and/or a category VI fine under Article 116(1). If it causes death or permanent
      disability, Article 116(2) allows death, life imprisonment or up to twenty years and/or a higher
      fine. The 2026 law removed the special minimum prison terms.[@uu2026,uu35]
    sources:
      - uu2026
      - uu35
    currency: IDR
    penalties:
      - label: Sale, purchase, brokerage or delivery
        treatment: criminal
        prison: 20 years
        fine: 2000000000
        note: Life imprisonment or up to twenty years and/or a category VI fine
      - label: Over 1 kg or at least six plants for sale
        treatment: criminal
        death: true
        prison: 20 years
        note: Death, life or up to twenty years and/or a higher fine
      - label: Giving to another to use, Article 116(1)
        treatment: criminal
        prison: 15 years
        fine: 2000000000
        note: Up to fifteen years and/or a category VI fine
      - label: Giving causing death or disability, Article 116(2)
        treatment: criminal
        death: true
        prison: 20 years
        note: Death, life or up to twenty years and/or a higher fine
  consumption:
    text: >-
      Using a Class I narcotic for oneself is a crime with up to four years in prison under
      Article 127; a judge may order treatment and rehabilitation, which counts towards the
      sentence. An adult addict who does not report for treatment faces up to six months'
      custody or a fine, and so does a parent who does not report an addicted child.
    sources:
      - uu35
      - gp
  access:
    text: None.
    sources:
      - tempo
context:
  death_penalty:
    text: >-
      Since 2 January 2026, aggravated sale or delivery under Article 114 can bring death, life
      imprisonment or up to twenty years and/or a higher fine. For cannabis in plant form, the
      threshold is more than 1 kg or at least six plants. Possession and planting under Article 111
      carry prison penalties only.[@uu2026,uu35] The new Criminal Code’s Article 610 replaces the
      former production, import, export and distribution offence in Article 113: the same plant-weight
      or plant-count threshold can bring death, life imprisonment or up to twenty years and/or a
      category VI fine. For non-plant Class I narcotics the threshold is more than 5 g. Giving a Class
      I narcotic to another person to use can also bring death under Article 116(2) if it causes death
      or permanent disability.[@uu2026,uu35]
    sources:
      - uu2026
      - uu35
  recreational:
    text: >-
      All recreational use is prohibited. Planting or possessing plant-form cannabis carries up
      to twelve years, personal use up to four years with rehabilitation, and aggravated sale
      can bring death; tourists in Bali are regularly jailed for years over a few
      grams.[@uu35,uu2026,sun,gp]
    sources:
      - uu35
      - uu2026
      - sun
      - gp
  research:
    status: restricted
    text: >-
      No licensed cannabis research route operates. The Constitutional Court rejected a medical
      challenge but urged the government to research therapeutic use; medical use stays
      prohibited.[@tempo,sun]
    sources:
      - tempo
      - sun
  production:
    status: none
    text: None. Cannabis has long been grown illicitly in Aceh, where the army burns fields each year.
    sources:
      - gp
  medical:
    text: >-
      Prohibited absolutely: Class I narcotics may not be used for health services, and CBD is
      treated as cannabis. The Constitutional Court rejected a challenge brought by mothers of
      children with cerebral palsy, while urging the government to research therapeutic use.
    sources:
      - tempo
      - sun
      - gp
  consequences:
    text: Long pre-trial detention, deportation and blacklisting for foreigners.
    sources:
      - gp
  planting:
    seeds: illegal
    seeds_trade: banned
    clones: illegal
    clones_trade: banned
    text: >-
      The Class I list covers the cannabis plant and all its parts, including seeds, fruit and straw,
      and its products.[@uu35] Since 2 January 2026, unauthorised planting, keeping or possessing a
      Class I narcotic in plant form carries up to twelve years and/or a category VI fine under
      Article 111(1), without a special minimum prison term.[@uu2026]
    sources:
      - uu35
      - uu2026
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited, and the law provides for the death
      penalty for the most serious drug offences.
    sources:
      - gp
      - sun
  visitors:
    status: none
    text: >-
      There is no legal recreational supply. Cannabis is a Class I narcotic and is prohibited for
      health services, including for foreign medical patients.[@uu35] Since 2 January 2026, possessing
      the plant carries up to twelve years and/or a category VI fine, without a special minimum prison
      term.[@uu2026] Personal use under Article 127 carries up to four years; a person proved to be a
      victim of abuse must receive rehabilitation.[@uu35]
    sources:
      - uu35
      - uu2026
  black_market:
    text: >-
      The illegal supply is domestic and centred on Aceh, in northern Sumatra, where the
      narcotics agency speaks of illicit cannabis production and destroys hill plantations
      every year. In one operation in November 2025 it burned about 97,000 plants, some 69
      tonnes wet weight, on six plots covering 6.5 hectares in North Aceh, with 151 officers
      from the agency, army, police and other bodies. The village is one of four pilot sites
      of an alternative-development programme, with Aceh Besar, Bireuen and Gayo Lues, that
      trains growers to switch to legal crops.
    sources:
      - mtv25
  arrests:
    text: >-
      Indonesia's prison figures cover all narcotics, not cannabis alone. On 30 April 2026
      prisons and detention centres held 271,602 people, 85% over capacity, and 146,376 of
      them, 53%, were there for narcotics offences. In October 2026 the law minister said the
      government was preparing rehabilitation and re-education centres, mainly for drug users
      of working age, on the president's instruction.
    sources:
      - rri26
  driving:
    status: impairment
    text: >-
      Article 106(1) of Law 22/2009 requires proper driving with full concentration. Its official
      explanation expressly includes alcohol or drugs affecting driving ability. Article 283
      punishes abnormal driving or a condition that disrupts concentration with up to three
      months' detention or a fine of up to Rp750,000. This is a driving-ability rule, not a
      specified THC concentration in the provisions reviewed. Article 314 also permits licence
      revocation or compensation as an additional penalty for traffic offences; licence loss is
      not automatic under article 283.
    sources:
      - traffic22
