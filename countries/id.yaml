name: Indonesia
region: Asia
iso_numeric: 360
recreational: death
medical: none
updated: 2026-10-24
summary: >-
  Class I narcotic. Since 2 January 2026, possessing the plant is up to twelve years, with no
  statutory minimum. Aggravated sale can still be death. Medical use is prohibited.
scores:
  possession: 0
  cultivation: 0
  enforcement: 0
  sharing: 0
  consumption: 0
  access: 0
segments:
  possession:
    text: >-
      Cannabis is a Class I narcotic under Law 35 of 2009. From 2 January 2026, Article 111(1)
      punishes planting or possessing it in plant form with up to twelve years and/or a category
      VI fine. There is no four-year minimum. More than 1 kg or more than five plants is life
      imprisonment or up to twenty years, and/or a higher fine. That paragraph does not provide
      death. A person treated as an abuser under Article 127 instead faces up to four years, and
      one proven to be a victim of abuse must be sent to rehabilitation, an outcome that often
      depends on money and lawyers.
    sources:
      - uu126
      - uu35
      - gp
      - tempo
  cultivation:
    text: >-
      Planting is the same Article 111 offence. From 2 January 2026 the basic penalty is up to
      twelve years and/or a category VI fine, with no four-year minimum. More than 1 kg or more
      than five plants is life imprisonment or up to twenty years. That paragraph does not
      provide death.
    sources:
      - uu126
      - uu35
  enforcement:
    text: >-
      Among the harshest in the world. Tourists in Bali are regularly jailed for years over a few
      grams, and Indonesia retains and uses the death penalty for drug trafficking.
    sources:
      - sun
      - gp
  sharing:
    text: >-
      From 2 January 2026, selling, buying, brokering or delivering a Class I narcotic is life
      imprisonment or up to twenty years, and/or a category VI fine (Article 114(1)). More than
      1 kg or more than five plants is death, life, or up to twenty years (Article 114(2)).
      Giving a Class I narcotic to another person to use remains an offence under Article 116,
      which stays in force. The 2026 adjustment removed the special prison minimums from the
      narcotics articles that had them.
    sources:
      - uu126
      - uu35
  consumption:
    text: >-
      Using a Class I narcotic for oneself is a crime with up to four years in prison under
      Article 127; a judge may order treatment and rehabilitation, which counts towards the
      sentence. An adult addict who does not report for treatment faces up to six months'
      custody or a fine, and so does a parent who does not report an addicted child.
    sources:
      - uu35
      - gp
  access:
    text: None.
    sources:
      - tempo
context:
  death_penalty:
    text: >-
      Law 1 of 2026, issued on 2 January 2026, repealed Article 113. Article 114 stays. Sale or
      delivery of more than 1 kg, or more than five plants, can be death, life, or up to twenty
      years. Possessing or planting that quantity is life or up to twenty years under Article
      111(2). Article 116, giving a Class I narcotic to another person, stays in force. Indonesia
      retains the death penalty for drug trafficking.
    sources:
      - uu126
      - uu35
      - sun
  production:
    text: None. Cannabis has long been grown illicitly in Aceh, where the army burns fields each year.
    sources:
      - gp
  products:
    text: None; CBD is treated as cannabis.
    sources:
      - gp
  medical:
    text: >-
      Prohibited absolutely: Class I narcotics may not be used for health services. The
      Constitutional Court rejected a challenge brought by mothers of children with cerebral palsy,
      while urging the government to research therapeutic use.
    sources:
      - tempo
      - sun
  consequences:
    text: Long pre-trial detention, deportation and blacklisting for foreigners.
    sources:
      - gp
  planting:
    seeds: illegal
    seeds_trade: banned
    clones: illegal
    clones_trade: banned
    text: >-
      Law 35 of 2009 lists as a Class I narcotic the cannabis plant and "all parts of the
      plant including seeds, fruit, straw" and its products. Planting, keeping or possessing a
      Class I narcotic in plant form without right is, from 2 January 2026, up to twelve years
      under Article 111, with no statutory minimum.
    sources:
      - hol
      - uu126
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited, and the law provides for the death
      penalty for the most serious drug offences.
    sources:
      - gp
      - sun
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. Every cannabis product is illegal,
      including medicinal cannabis, CBD, hemp products, oils, creams and edibles. Cannabis is a
      Class I narcotic under Law 35 of 2009. From 2 January 2026, possessing the plant is up to
      twelve years and/or a category VI fine, with no four-year minimum. A person who can prove
      they are a user may instead get up to four years or court-ordered rehabilitation.
    sources:
      - uu126
      - tempo
      - gp
  black_market:
    text: >-
      The illegal supply is domestic and centred on Aceh, in northern Sumatra, where the
      narcotics agency speaks of illicit cannabis production and destroys hill plantations
      every year. In one operation in November 2025 it burned about 97,000 plants, some 69
      tonnes wet weight, on six plots covering 6.5 hectares in North Aceh, with 151 officers
      from the agency, army, police and other bodies. The village is one of four pilot sites
      of an alternative-development programme, with Aceh Besar, Bireuen and Gayo Lues, that
      trains growers to switch to legal crops.
    sources:
      - mtv25
  arrests:
    text: >-
      Indonesia's prison figures cover all narcotics, not cannabis alone. On 30 April 2026
      prisons and detention centres held 271,602 people, 85% over capacity, and 146,376 of
      them, 53%, were there for narcotics offences. In October 2026 the law minister said the
      government was preparing rehabilitation and re-education centres, mainly for drug users
      of working age, on the president's instruction.
    sources:
      - rri26
  driving:
    status: impairment
    text: >-
      Article 106(1) of Law 22/2009 requires proper driving with full concentration. Its official
      explanation expressly includes alcohol or drugs affecting driving ability. Article 283
      punishes abnormal driving or a condition that disrupts concentration with up to three
      months' detention or a fine of up to Rp750,000. This is a driving-ability rule, not a
      specified THC concentration in the provisions reviewed. Article 314 also permits licence
      revocation or compensation as an additional penalty for traffic offences; licence loss is
      not automatic under article 283.
    sources:
      - traffic22

