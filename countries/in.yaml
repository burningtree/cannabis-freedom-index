name: India
region: Asia
iso_numeric: 356
recreational: death
medical: limited
updated: '2026-10-26'
summary: >-
  The NDPS Act bans flower and resin. Leaf-only bhang falls outside its cannabis definition, but
  state law differs: some states license shops, while Maharashtra restricts unauthorised possession
  and use. Some states license hemp and medical cultivation.
scores:
  possession: 1
  cultivation: 1
  enforcement: 2
  sharing: 1
  consumption: 1
  access: 2
# The quick answer the score would get wrong (src/lib/answers.js): the legal source is bhang in
# licensed shops, not a prescription.
answers:
  buy:
    answer: limited
    text: >-
      Bhang only through lawful outlets in states that permit it; state restrictions also govern
      possession and use
  carry:
    answer: 'no'
    text: >-
      Flower and resin are criminal; leaf-only bhang depends on state law and any required
      authorisation
segments:
  possession:
    text: >-
      The NDPS Act of 1985 bans ganja (flowering tops) and charas (resin). Possessing a 'small
      quantity' — under 1 kg of ganja or 100 g of charas — is punishable by up to one year in
      prison, a fine of ₹10,000, or both; consumption alone by up to six months.[@ipl,boom] Section 2(iii)(b)
      excludes seeds and leaves only when not accompanied by flowering or fruiting tops.[@ndps]
      State laws still apply: Maharashtra includes bhang leaves and preparations in its
      intoxicating-drug definition and prohibits unauthorised possession, purchase and use under
      section 14.[@maharashtra2025]
    sources:
      - ipl
      - boom
      - ndps
      - maharashtra2025
    currency: INR
    penalties:
      - label: Small quantity, NDPS
        treatment: criminal
        term: Possession
        prison: 1 year
        fine: 10000
        note: Under 1 kg of ganja or 100 g of charas; consumption alone up to six months
      - label: Intermediate quantity
        treatment: criminal
        term: Possession
        prison: 10 years
        fine: 100000
        note: 1–20 kg ganja or 100 g–1 kg charas; exactly 1 kg and 20 kg fall here
      - label: Commercial quantity
        treatment: criminal
        term: Possession
        prison_min: 10 years
        prison: 20 years
        fine_min: 100000
        fine: 200000
        note: Over 20 kg ganja or over 1 kg charas
  cultivation:
    text: >-
      Cultivating the cannabis plant is an offence with up to ten years. States may permit and
      regulate cultivation for industrial or horticultural purposes: Uttarakhand licensed hemp from
      2018, followed by others.[@ndps]
    sources:
      - ndps
    currency: INR
    penalties:
      - label: Cultivation
        treatment: criminal
        term: Cultivation
        prison: 10 years
        fine: 100000
        note: Up to ten years unless a state government permits it
  enforcement:
    text: >-
      Arrests for small quantities are common and bail can be difficult under the NDPS Act;
      enforcement is uneven and occasionally high-profile.[@ndps]
    sources:
      - ndps
  sharing:
    text: >-
      Supply is trafficking, with the same three quantity bands as possession: up to one year for a
      small quantity, up to ten years for an intermediate one, and ten to twenty years for a
      commercial one.[@ndps] Section 31A allows death only for a second qualifying conviction
      involving at least 20 kg of hashish or 500 g of THC, and the court may impose the section 31
      sentence instead; there is no ganja entry in the section 31A table.[@ndps31a]
    sources:
      - ndps31a
      - ndps
    currency: INR
    penalties:
      - label: Small quantity
        treatment: criminal
        term: Trafficking
        prison: 1 year
        fine: 10000
      - label: Intermediate quantity
        treatment: criminal
        term: Trafficking
        prison: 10 years
        fine: 100000
      - label: Commercial quantity
        treatment: criminal
        term: Trafficking
        prison_min: 10 years
        prison: 20 years
        fine_min: 100000
        fine: 200000
      - label: Repeat qualifying trafficking, Section 31A
        treatment: criminal
        term: Repeat trafficking
        death: true
        note: Second qualifying conviction with at least 20 kg of hashish or 500 g of THC; death or the section 31 sentence
  consumption:
    text: >-
      Consuming ganja or charas is an offence; addicts who volunteer for treatment can be exempted
      from prosecution. Bhang is consumed openly, especially at Holi and Shivaratri.[@ipl,hg] State
      restrictions also govern bhang: Maharashtra section 66(1)(b) permits up to six months and a
      ₹10,000 fine for a first unauthorised-use offence; permits and the statutory sentencing
      proviso must be considered.[@maharashtra2025]
    sources:
      - ipl
      - hg
      - maharashtra2025
  access:
    text: >-
      Bhang — a preparation of leaves — is sold in government-licensed shops in states such as Uttar
      Pradesh and Rajasthan, a legal cannabis product with real psychoactive effect. Flower and
      resin have no legal source.[@hg,boom] A shop licence in one state gives no general right to possess, use
      or transport bhang elsewhere. Maharashtra’s prohibitions remain subject to its own
      authorisations.[@maharashtra2025]
    sources:
      - hg
      - boom
      - maharashtra2025
context:
  recreational:
    text: >-
      Flower and resin are criminal nationwide, with small quantities up to one year and repeat
      trafficking open to discretionary death. Leaf-only bhang falls outside the NDPS cannabis
      definition and is sold in licensed shops in states such as Uttar Pradesh and Rajasthan,
      but state law differs and Maharashtra restricts it.[@ndps,hg,boom,maharashtra2025,cbn]
    sources:
      - ndps
      - hg
      - boom
      - maharashtra2025
      - cbn
  death_penalty:
    text: >-
      Section 31A of the NDPS Act makes death a discretionary sentence only for a second qualifying
      conviction involving at least 20 kg of hashish or 500 g of THC.[@ndps31a] Ganja is not in the
      table, and simple possession or use cannot bring death. The recreational status reflects this
      maximum-penalty route, not the penalty for users; bhang made from leaves remains lawfully sold
      in several states.[@ndps]
    sources:
      - ndps31a
      - ndps
  production:
    status: hemp
    text: >-
      State-licensed hemp cultivation in a growing number of states; Ayurvedic manufacturers use
      cannabis leaf under licence.[@hg]
    sources:
      - hg
  medical:
    text: >-
      No national medical programme, but cannabis-leaf preparations are sold as Ayurvedic medicines,
      some on prescription; bhang and hemp-seed foods are the lawful consumer products.[@hg]
    sources:
      - hg
  consequences:
    text: An NDPS conviction is a serious criminal record.[@ndps]
    sources:
      - ndps
  planting:
    seeds: grey
    seeds_trade: open
    clones: illegal
    clones_trade: banned
    text: >-
      The 1985 Act defines ganja as the flowering or fruiting tops of the plant, "excluding
      the seeds and leaves when not accompanied by the tops", so loose seeds are not a
      narcotic drug. Cultivating any cannabis plant is an offence under section 20 unless a
      state government permits it under section 10.[@ndps]
    sources:
      - ndps
  hemp:
    status: standard
    text: >-
      Hemp is state-licensed, not a national regime: Himachal's December 2025 policy sets a THC
      limit below 0.3%, and Uttarakhand, Madhya Pradesh and other states license fibre or seed
      growing.[@hemp26] The NDPS Act itself sets no national THC threshold, so the 0.3% figure is a
      state condition.[@ndps,hemp26]
    sources:
      - ndps
      - hemp26
  arrests:
    text: >-
      The NCB counted 148,063 drug cases and 183,675 arrests in 2025, including 747 foreigners,
      against 96,930 cases and 122,224 arrests in 2024; the figures cover all drugs.[@dh26] No
      cannabis-only arrest count is published.[@dh26] Kerala alone recorded 36,314 police NDPS cases
      and 12,568 excise cases in 2025, again all drugs.[@kerala26]
    sources:
      - dh26
      - kerala26
  black_market:
    text: >-
      Cannabis is by far the most seized drug in India. The Narcotics Control Bureau's annual
      report for 2025 counted 633.59 tonnes of cannabis seized, about half of all drugs by
      weight, up from 540.8 tonnes in 2024 but below the 816.9 tonnes of 2021. Almost all of
      it was ganja (628.19 tonnes); hashish fell from 6.48 to 5.11 tonnes. The bureau points
      to a new trend of potent hydroponic ganja reaching the big cities from abroad: cases
      rose from 102 in 2021 to 687 in 2025 and seizures from 303 kg to 4,862 kg, nearly all of
      it caught at airports.[@dh26]
    sources:
      - dh26
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and no law provides for them: supply of ganja or charas is
      trafficking, with sentences scaled to quantity. India's legal outlet for cannabis is of
      another kind. Bhang, made from the leaves and seeds, falls outside the national
      narcotics law and is left to the states: Uttar Pradesh licenses bhang shops, Bihar and
      West Bengal allow its production, and Rajasthan allows it to be bought in and sold. It
      is traditionally handed out at the festivals of Holi and Maha Shivaratri, and Varanasi
      is known as the centre of its use. These are shops and festival customs, not members'
      clubs.[@ipl]
    sources:
      - ipl
  visitors:
    status: open
    text: >-
      Licensed bhang shops operate in states such as Uttar Pradesh and Rajasthan, with no residency
      condition described in the retained sources.[@hg,boom] This is not nationwide permission:
      Maharashtra restricts unauthorised bhang possession, purchase, transport and consumption.
      Buying in a state that licenses shops does not authorise carrying it into another state;
      destination and transit rules must be checked.[@maharashtra2025] Flower and resin have no
      legal adult-use source for residents or visitors. The NDPS small-quantity penalties remain
      separate from state bhang rules.[@ipl,ndps]
    sources:
      - hg
      - boom
      - maharashtra2025
      - ipl
      - ndps
  driving:
    status: impairment
    text: >-
      Section 185 of the Motor Vehicles Act covers driving or attempting to drive while under the
      influence of a drug to the extent of being incapable of proper vehicle control; it is not a
      fixed THC blood-limit offence. The transport department explicitly includes ganja and
      charas. A first offence can bring up to six months in prison, a ₹10,000 fine, or both; a
      repeat offence up to two years, a ₹15,000 fine, or both. Section 20 provides
      disqualification for at least six months on a section 185 conviction.[@mva_driving]
    sources:
      - mva_driving

