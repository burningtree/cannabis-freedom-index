segments:
  possession:
    text: >-
      The NDPS Act of 1985 bans ganja (flowering tops) and charas (resin). Possessing a 'small
      quantity' — up to 1 kg of ganja or 100 g of charas — is punishable by up to one year in
      prison, a fine of ₹10,000, or both; consumption alone by up to six months. The law does not
      cover leaves and seeds, which is why bhang is legal.
    sources:
      - ipl
      - boom
  cultivation:
    text: >-
      Cultivating the cannabis plant is an offence with up to ten years. States may permit and
      regulate cultivation for industrial or horticultural purposes: Uttarakhand licensed hemp from
      2018, followed by others.
    sources:
      - ipl
      - hg
  enforcement:
    text: >-
      Arrests for small quantities are common and bail can be difficult under the NDPS Act;
      enforcement is uneven and occasionally high-profile.
    sources:
      - boom
      - ipl
  sharing:
    text: >-
      Supply is trafficking, with sentences scaled to quantity. Section 31A also allows death for a
      repeat qualifying offence involving at least 20 kg of hashish or 500 g of THC.
    sources:
      - cbn
  consumption:
    text: >-
      Consuming ganja or charas is an offence; addicts who volunteer for treatment can be exempted
      from prosecution. Bhang is consumed openly, especially at Holi and Shivaratri.
    sources:
      - ipl
      - hg
  access:
    text: >-
      Bhang — a preparation of leaves — is sold in government-licensed shops in states such as Uttar
      Pradesh and Rajasthan, a legal cannabis product with real psychoactive effect. Flower and
      resin have no legal source. Rules vary by state; some ban bhang too.
    sources:
      - hg
      - boom
context:
  death_penalty:
    text: >-
      Section 31A of the NDPS Act makes death a discretionary sentence for certain repeat offences.
      The cannabis thresholds in its table are 20 kg of hashish or 500 g of THC. The headline status
      remains partial because bhang made from leaves is lawfully sold in several states.
    sources:
      - cbn
  production:
    text: >-
      State-licensed hemp cultivation in a growing number of states; Ayurvedic manufacturers use
      cannabis leaf under licence.
    sources:
      - ipl
      - hg
  products:
    text: Bhang, hemp-seed foods, and Ayurvedic cannabis-leaf medicines.
    sources:
      - hg
  medical:
    text: >-
      No national medical programme, but cannabis-leaf preparations are sold as Ayurvedic medicines,
      some on prescription.
    sources:
      - hg
      - ipl
  consequences:
    text: An NDPS conviction is a serious criminal record.
    sources:
      - ipl
  planting:
    seeds: grey
    seeds_trade: open
    clones: illegal
    clones_trade: banned
    text: >-
      The 1985 Act defines ganja as the flowering or fruiting tops of the plant, "excluding
      the seeds and leaves when not accompanied by the tops", so loose seeds are not a
      narcotic drug. Cultivating any cannabis plant is an offence under section 20 unless a
      state government permits it under section 10.
    sources:
      - ndps
  black_market:
    text: >-
      Cannabis is by far the most seized drug in India. The Narcotics Control Bureau's annual
      report for 2025 counted 633.59 tonnes of cannabis seized, about half of all drugs by
      weight, up from 540.8 tonnes in 2024 but below the 816.9 tonnes of 2021. Almost all of
      it was ganja (628.19 tonnes); hashish fell from 6.48 to 5.11 tonnes. The bureau points
      to a new trend of potent hydroponic ganja reaching the big cities from abroad: cases
      rose from 102 in 2021 to 687 in 2025 and seizures from 303 kg to 4,862 kg, nearly all of
      it caught at airports.
    sources:
      - dh26
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and no law provides for them: supply of ganja or charas is
      trafficking, with sentences scaled to quantity. India's legal outlet for cannabis is of
      another kind. Bhang, made from the leaves and seeds, falls outside the national
      narcotics law and is left to the states: Uttar Pradesh licenses bhang shops, Bihar and
      West Bengal allow its production, and Rajasthan allows it to be bought in and sold. It
      is traditionally handed out at the festivals of Holi and Maha Shivaratri, and Varanasi
      is known as the centre of its use. These are shops and festival customs, not members'
      clubs.
    sources:
      - ipl
      - hg
      - wikibhang
  visitors:
    status: open
    text: >-
      The one legal cannabis product is open to anyone: bhang, made from the leaves, is sold
      over the counter in government-licensed shops in states such as Uttar Pradesh and
      Rajasthan, with no residency condition described. Flower and resin have no legal source
      for residents or visitors. British travel advice warns of a minimum sentence of six
      months for possessing a small amount for personal use and up to ten years for other
      amounts, and that the slow courts can mean several years in detention while a case is
      heard.
    sources:
      - hg
      - boom
      - fcdo
