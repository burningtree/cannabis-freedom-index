name: Algeria
region: Africa
iso_numeric: 12
recreational: death
medical: none
updated: "2026-10-28"
summary: >-
  Personal use or possession carries two months to two years and a fine; personal growing two to
  five years. Supply and production carry ten years to life, and the 2025 law allows death for
  aggravated supply, never for simple use.
