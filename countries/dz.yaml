name: Algeria
region: Africa
iso_numeric: 12
recreational: illegal
medical: none
updated: 2026-10-04
summary: >-
  Prison and a fine for personal use, with court-ordered treatment as an alternative; penalties for
  trafficking were raised in 2023.
scores:
  possession: 0
