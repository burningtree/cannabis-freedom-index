name: Algeria
region: Africa
iso_numeric: 12
recreational: death
medical: none
updated: 2026-10-14
summary: >-
  Prison and a fine for personal use, with court-ordered treatment as an alternative. Since 2025
  aggravated drug production and trafficking offences can carry the death penalty.
scores:
  possession: 0
  cultivation: 0
  enforcement: 1
  sharing: 0
  consumption: 1
  access: 0
segments:
  possession:
    text: >-
      Law 04-18 of December 2004 prohibits possession, with prison and a fine for personal use;
      courts can order detoxification treatment in place of the sentence for users who comply.
      Since the May 2023 amendment the range for buying, using or holding for personal use is two
      months to two years and a fine of 20,000 to 50,000 dinars.
    sources:
      - tsa23
      - wiki
  cultivation:
    text: >-
      Growing cannabis knowingly carries life imprisonment under the 2023 amendment; when it is for
      personal use, two to five years and a fine of 200,000 to 500,000 dinars.
    sources:
      - tsa23
      - wiki
  enforcement:
    text: >-
      Recent amendments pair 'therapeutic justice' for users with tougher deterrence against
      trafficking. Algeria is a major transit route for Moroccan resin.
    sources:
      - mb
  sharing:
    text: >-
      Trafficking carries ten to twenty years and up to life; a May 2023 amendment sharply increased
      penalties across production and sale.
    sources:
      - mb
      - wiki
  consumption:
    text: >-
      Use is a crime: the May 2023 amendment to Law 04-18 sets a penalty range for buying, using
      or holding for personal use, and courts can order detoxification treatment in place of the
      sentence for users who comply.
    sources:
      - tsa23
  access:
    text: >-
      None: Law 04-18, as amended in May 2023, punishes buying or holding for personal use and
      growing cannabis.
    sources:
      - tsa23
context:
  death_penalty:
    text: >-
      Law 25-03 of 1 July 2025 allows a death sentence for drug production and trafficking offences
      in aggravated circumstances, including conduct by a transnational organised group, use of a
      firearm, or conduct that causes death or is liable to cause serious harm to public health.
      The provisions are not limited to a particular drug and therefore cover serious cannabis
      offences. Algeria had observed a moratorium on executions since 1993, but courts imposed the
      first death sentences under the new drug law in October 2026, in cocaine and pregabalin cases.
    sources:
      - law25
      - matin26
  production:
    text: None; the law allows medical or scientific exceptions only with ministerial authorisation.
    sources:
      - wiki
  products:
    text: Reliable national information about legally available cannabis products was not established by the retained sources.
    sources: []
  medical:
    text: No programme; the statutory exception for authorised medical use is not used in practice.
    sources:
      - wiki
  consequences:
    text: The retained sources do not establish collateral consequences beyond the penalties described above.
    sources: []
  planting:
    seeds: grey
    seeds_trade: open
    clones: illegal
    clones_trade: banned
    text: >-
      Law 04-18 defines cannabis as the flowering or fruiting tops of the plant, "excluding
      the seeds and the leaves that are not accompanied by the tops", so seed on its own is
      not a controlled drug. The cannabis plant is defined as any plant of the genus, and
      growing it is one of the acts the law controls.
    sources:
      - l0418
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited.
    sources:
      - tsa23
      - wiki
      - mb
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. Since the May 2023 amendment of Law
      04-18, buying, using or holding drugs for personal use carries two months to two years in
      prison and a fine of 20,000 to 50,000 dinars; Law 25-03 of July 2025 allows a death
      sentence for production and trafficking in aggravated circumstances.
    sources:
      - tsa23
      - law25
  black_market:
    text: >-
      Figures reported by the government to the UN drugs office record 6.2 kg of herbal
      cannabis seized in 2024, against 25.9 kg in 2023, and 37,781 kg of cannabis resin
      seized in 2024, against 44,536 kg in 2023. The UN publishes them as kilogram
      equivalents, and countries count seizures differently, so the figures are not
      comparable across borders.
    sources:
      - unodc_szr
  arrests:
    text: >-
      The national police directorate (DGSN) reported handling at least 175,920 drug cases
      in 2025, in which 192,252 people were implicated. Its seizures that year included
      just over 7 tonnes of cannabis, more than 665 kg of cocaine and over 20 million
      psychotropic pills. The figures are those of the national police and are not split by drug.
    sources:
      - radioalg26
  driving:
    status: impairment
    text: >-
      Road Code 26-09, promulgated on 12 May 2026 and published on 17 May, replaces Law 01-14.
      Article 137 provides one–two years in prison and DZD100,000–200,000 for driving, or
      accompanying a learner, under the influence of narcotics or psychotropic substances.
      Article 143 applies the relevant intoxication penalties to refusal of the prescribed
      breath, medical, clinical or biological examinations. Under article 160 a court may
      additionally withdraw or suspend the licence for up to five years; this is discretionary,
      not an automatic five-year ban. Suspected drug influence also permits vehicle immobilisation
      under article 173. Article 80 separately requires professional transport recruits to provide
      medical analyses showing no drug consumption, with periodic and unannounced examinations
      during employment. No numerical THC cutoff or full operational testing regulations were
      verified. Article 188 retains earlier implementing texts until replacement regulations;
      older offence numbers and penalties should not be substituted for the new code.
    sources:
      - road_code26
