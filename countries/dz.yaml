name: Algeria
region: Africa
iso_numeric: 12
recreational: death
medical: none
updated: 2026-10-23
summary: >-
  Personal cannabis growing carries two to five years in prison and a fine. Use and personal
  possession can bring prison, a fine or either alone, with treatment routes for qualifying users.
  Specified aggravated drug offences can carry death sentences.
scores:
  possession: 0
  cultivation: 1
  enforcement: 1
  sharing: 0
  consumption: 1
  access: 0
segments:
  possession:
    text: >-
      Illicit use, buying or possession for personal consumption carries two months to two years in
      prison and a DZD20,000–50,000 fine, or either penalty alone.[@law23] Qualifying users who
      undergo detoxification or medical supervision can avoid prosecution under the treatment
      provisions.[@law23]
    sources:
      - law23
  cultivation:
    text: >-
      Growing cannabis for personal consumption carries two to five years in prison and a
      DZD200,000–500,000 fine.[@law23] The general offence of knowingly growing cannabis unlawfully
      carries life imprisonment; the personal-use penalty is a separate exception added in
      2023.[@law23, l0418]
    sources:
      - law23
      - l0418
  enforcement:
    text: >-
      The law provides treatment-linked non-prosecution and permits courts to withhold the ordinary
      use penalty when the treatment conditions are met.[@law23] Since 2025, the maximum legal
      penalty must be imposed when the prescribed examinations establish that an offender was under
      drug influence during the offence.[@law25]
    sources:
      - law23
      - law25
  sharing:
    text: >-
      Giving or offering drugs to another person for their personal consumption is an offence
      carrying two to ten years in prison, with higher penalties in specified cases.[@l0418] Wider
      production and supply offences carry ten to twenty years, twenty to thirty years for specified
      professional or official offenders, and life when committed by an organised criminal
      group.[@law23]
    sources:
      - l0418
      - law23
  consumption:
    text: >-
      Illicit use is a crime carrying two months to two years in prison and a DZD20,000–50,000 fine,
      or either penalty alone.[@law23] Treatment or medical supervision can lead to non-prosecution
      under the law’s conditions.[@law23]
    sources:
      - law23
  access:
    text: >-
      Recreational supply is prohibited.[@l0418] Medical and scientific controlled-drug work
      requires health-ministry authorisation, with an application and supervision procedure set out
      in the 2007 regulations.[@care07]
    sources:
      - l0418
      - care07
context:
  death_penalty:
    text: >-
      The 2025 law permits death sentences for specified aggravated supply offences, including
      transnational organised crime and use or threatened use of a firearm.[@law25] It also provides
      capital punishment for specified recruitment offences near educational establishments and for
      repetition of an offence already carrying life imprisonment.[@law25] These provisions apply to
      listed drug offences and include serious cannabis cases.[@law25]
    sources:
      - law25
  production:
    status: medical
    text: >-
      Controlled-drug production, handling, import, export and cannabis cultivation require
      authorisation from the health minister for medical or scientific purposes.[@care07] Applicants
      must identify the operation, product, quantity and use; permits are subject to checks, stock
      records and secure storage requirements.[@care07]
    sources:
      - care07
  products:
    text: >-
      Reliable national information about legally available cannabis products was not established by
      the retained sources.
    sources: []
  medical:
    text: >-
      The statutory medical and scientific exception is implemented through health-ministry
      authorisation.[@l0418, care07] The 2007 procedure requires details of the proposed work, a
      criminal-record extract and an official inquiry into the applicant; import and export permits
      last three months per operation.[@care07]
    sources:
      - l0418
      - care07
  consequences:
    text: >-
      The 2025 amendment allows removal of acquired Algerian nationality for crimes under the drug
      law, following the nationality code’s procedures.[@law25] Foreigners convicted of drug-law
      offences can face exclusion from Algeria; permanent exclusion is mandatory for the crimes
      specified by the law.[@law25] The law also requires negative drug-screening results in
      recruitment files for the listed public and private-sector bodies, with implementing details
      set by regulation where needed.[@law25]
    sources:
      - law25
  planting:
    seeds: grey
    seeds_trade: open
    clones: illegal
    clones_trade: banned
    text: >-
      Law 04-18 defines cannabis as the flowering or fruiting tops of the plant, "excluding the
      seeds and the leaves that are not accompanied by the tops", so seed on its own is not a
      controlled drug. The cannabis plant is defined as any plant of the genus, and growing it is
      one of the acts the law controls.
    sources:
      - l0418
  clubs:
    status: none
    text: >-
      The law criminalises growing and supplying cannabis, including giving or offering it to
      another person for personal consumption.[@l0418, law23] It provides no authorised recreational
      club supply route.[@l0418]
    sources:
      - l0418
      - law23
  visitors:
    status: none
    text: >-
      Visitors have no authorised recreational supply.[@l0418] Personal use, buying or possession
      can bring two months to two years in prison, a DZD20,000–50,000 fine, or either alone.[@law23]
      Drug-law convictions can also bring exclusion from Algeria, with permanent exclusion required
      for the specified crimes.[@law25]
    sources:
      - l0418
      - law23
      - law25
  black_market:
    text: >-
      Figures reported by the government to the UN drugs office record 6.2 kg of herbal cannabis
      seized in 2024, against 25.9 kg in 2023, and 37,781 kg of cannabis resin seized in 2024,
      against 44,536 kg in 2023. The UN publishes them as kilogram equivalents, and countries count
      seizures differently, so the figures are not comparable across borders.
    sources:
      - unodc_szr
  arrests:
    text: >-
      The national police directorate (DGSN) reported handling at least 175,920 drug cases in 2025,
      in which 192,252 people were implicated. Its seizures that year included just over 7 tonnes of
      cannabis, more than 665 kg of cocaine and over 20 million psychotropic pills. The figures are
      those of the national police and are not split by drug.
    sources:
      - radioalg26
  driving:
    status: impairment
    text: >-
      Road Code 26-09, promulgated on 12 May 2026 and published on 17 May, replaces Law 01-14.
      Article 137 provides one–two years in prison and DZD100,000–200,000 for driving, or
      accompanying a learner, under the influence of narcotics or psychotropic substances. Article
      143 applies the relevant intoxication penalties to refusal of the prescribed breath, medical,
      clinical or biological examinations. Under article 160 a court may additionally withdraw or
      suspend the licence for up to five years; this is discretionary, not an automatic five-year
      ban. Suspected drug influence also permits vehicle immobilisation under article 173. Article
      80 separately requires professional transport recruits to provide medical analyses showing no
      drug consumption, with periodic and unannounced examinations during employment. No numerical
      THC cutoff or full operational testing regulations were verified. Article 188 retains earlier
      implementing texts until replacement regulations; older offence numbers and penalties should
      not be substituted for the new code.
    sources:
      - road_code26
