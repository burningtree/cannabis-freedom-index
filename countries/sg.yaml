name: Singapore
region: Asia
iso_numeric: 702
recreational: death
medical: limited
updated: 2026-10-23
summary: >-
  Death for trafficking more than 500 g of cannabis, more than 200 g of cannabis resin, or more
  than 1,000 g of cannabis mixture, with narrow exceptions. Larger possession amounts bring a
  mandatory prison term and caning. Consumption brings at least one year. Citizens can be
  prosecuted for use abroad. Cannabinoid pharmaceuticals are approved case by case.
scores:
  possession: 0
  cultivation: 0
  enforcement: 0
  sharing: 0
  consumption: 0
  access: 0
segments:
  possession:
    text: >-
      Cannabis is a Class A controlled drug. Possessing less than 330 g of cannabis, less than
      130 g of resin, or less than 660 g of mixture carries up to 10 years, a fine of up to
      S$20,000, or both.[@mda_sch] From 330 g to 500 g of cannabis the sentence is at least 10 years
      and 5 strokes of the cane, and at most 20 years and 10 strokes. More than 500 g is at least
      20 years and 10 strokes, and at most 30 years and 15 strokes.[@mda_sch] Resin uses 130 g and
      200 g for those same steps, and mixture uses 660 g and 1,000 g.[@cnb_can]
    sources:
      - mda_sch
      - cnb_can
  cultivation:
    text: >-
      Cultivating cannabis brings at least three years or a fine of at least S$5,000, and up to
      20 years or a fine of S$40,000, or both.[@mda_sch]
    sources:
      - mda_sch
  enforcement:
    text: >-
      Trafficking, importing or exporting more than 500 g of cannabis, more than 200 g of cannabis
      resin, or more than 1,000 g of cannabis mixture is a capital offence, with narrow exceptions
      for qualifying couriers.[@mda_sch, cnb_can] From 330 g to 500 g of cannabis the trafficking
      sentence is at least 20 years and 15 strokes of the cane, and up to 30 years or life and 15
      strokes.[@cnb_can] Cannabis executions have been carried out as recently as April 2026.[@cnb_execution]
    sources:
      - cnb_can
      - mda_sch
      - cnb_execution
  sharing:
    text: >-
      Giving cannabis to another person is trafficking, whether or not money changes hands. For
      under 330 g of cannabis the sentence is at least 5 years and 5 strokes of the cane, and at
      most 20 years and 15 strokes. The same first band runs to under 130 g of resin and under
      660 g of mixture.[@cnb_can]
    sources:
      - cnb_can
  consumption:
    text: >-
      Consumption is itself a crime, proved by a urine test, with at least one year and up to 10
      years in prison, and a fine of up to S$20,000.[@cnb_can] Police can require a test. Citizens
      and permanent residents who use cannabis abroad, even where it is legal, are liable as if
      they had used it in Singapore, and can be tested on return.[@mh]
    sources:
      - cnb_can
      - mh
  access:
    text: None. There is no legal source of any kind.
    sources:
      - cnb
context:
  death_penalty:
    text: >-
      Trafficking, importing or exporting more than 500 g of cannabis, more than 200 g of cannabis
      resin, or more than 1,000 g of cannabis mixture is a capital offence, with narrow exceptions
      for qualifying couriers.[@mda_sch, cnb_can] Cannabis executions have been carried out as
      recently as April 2026.[@cnb_execution]
    sources:
      - cnb_can
      - mda_sch
      - cnb_execution
  production:
    text: None. No licensed production exists.
    sources:
      - wiki
  products:
    text: >-
      None. CBD products are also prohibited; a pharmaceutical cannabinoid can be approved for an
      individual patient.
    sources:
      - wiki
  medical:
    text: >-
      No medical cannabis programme. In rare cases the health regulator has approved a cannabidiol
      medicine for a named patient, such as a child with drug-resistant epilepsy.
    sources:
      - wiki
  consequences:
    text: >-
      Users can be committed to a Drug Rehabilitation Centre and then placed under supervision with
      regular urine tests. Foreigners are deported after sentence, and a drug record affects
      employment for life.
    sources:
      - wiki
      - mh
  planting:
    seeds: illegal
    seeds_trade: banned
    clones: illegal
    clones_trade: banned
    text: >-
      The Misuse of Drugs Act defines cannabis as any part of a plant of the genus Cannabis,
      with no exception for seeds, so seeds and cuttings are controlled drugs like the rest of
      the plant.
    sources:
      - mda1973
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited, and the law provides for the death
      penalty for the most serious drug offences.
    sources:
      - wiki
      - cnb
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. Possessing less than 330 g of cannabis can
      bring up to ten years, a fine of up to S$20,000, or both. From 330 g the prison term is
      mandatory and includes caning. Trafficking more than 200 g of cannabis resin can bring
      death.[@cnb_can, mda_sch]
    sources:
      - cnb_can
      - mda_sch
  driving:
    status: impairment
    text: >-
      The Road Traffic Act makes it an offence to drive while unfit, meaning under the
      influence of drink, a drug or a psychoactive substance to such an extent as to be
      incapable of having proper control of the vehicle. Unlike for alcohol, no limit is
      prescribed for drugs. A first offence brings a fine of 2,000 to 10,000 dollars or up to
      12 months in prison and at least two years' disqualification; a repeat offence, a fine
      of 5,000 to 20,000 dollars and up to two years in prison, with at least five years'
      disqualification.
    sources:
      - rta67
