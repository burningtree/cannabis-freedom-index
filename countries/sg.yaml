summary: >-
  Death for trafficking more than 500 g of cannabis, more than 200 g of cannabis resin, or more than
  1,000 g of cannabis mixture, with narrow exceptions. Larger possession amounts bring mandatory
  prison and caning. Ordinary consumption brings at least one year; qualifying repeat use can bring
  13 years and caning. Registered cannabinoid medicines may be prescribed, and HSA may approve an
  unregistered one for a named patient.
