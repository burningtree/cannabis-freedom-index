  access: 0
segments:
  possession:
    text: >-
      Cannabis is a Class A controlled drug under the Misuse of Drugs Act. Possessing any amount
      carries up to 10 years in prison, a fine of up to S$20,000, or both. Holding more than 15 g
      triggers a legal presumption that you are trafficking, which you must disprove. There is no
      tolerated amount of any kind.
    sources:
      - cnb
      - wiki
  cultivation:
    text: >-
      Cultivating any cannabis plant is a serious offence with a mandatory minimum prison term and
      up to 20 years.
    sources:
      - wiki
      - cnb
  enforcement:
    text: >-
      The harshest regime in the index. Trafficking, importing or exporting more than 500 g of
      cannabis is a capital offence, with narrow exceptions for qualifying couriers. Cannabis
      executions have been carried out as recently as April 2026. Between 330 g and 500 g: 20 to 30
      years or life, plus 15 strokes of the cane.
    sources:
      - cnb
      - cnb_execution
      - mh
  sharing:
    text: >-
      Giving cannabis to another person is trafficking, whether or not money changes hands: for
      under 330 g, a minimum of 5 years and 5 strokes of the cane, up to 20 years and 15 strokes.
    sources:
      - cnb
  consumption:
    text: >-
      Consumption is itself a crime, proved by urine test, with up to 10 years in prison. Police can
      require a test without a warrant. Uniquely, citizens and permanent residents who use cannabis
      abroad — even where it is legal — are liable as if they had used it in Singapore, and can be
      tested on return.
    sources:
      - cnb
      - mh
  access:
    text: None. There is no legal source of any kind.
    sources:
      - cnb
context:
  production:
    text: None. No licensed production exists.
    sources:
      - wiki
  products:
    text: >-
      None. CBD products are also prohibited; a pharmaceutical cannabinoid can be approved for an
      individual patient.
    sources:
      - wiki
  medical:
    text: >-
      No medical cannabis programme. In rare cases the health regulator has approved a cannabidiol
      medicine for a named patient, such as a child with drug-resistant epilepsy.
    sources:
      - wiki
  consequences:
    text: >-
      Users can be committed to a Drug Rehabilitation Centre and then placed under supervision with
      regular urine tests. Foreigners are deported after sentence, and a drug record affects
      employment for life.
    sources:
      - wiki
      - mh
