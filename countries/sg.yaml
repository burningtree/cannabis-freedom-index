  enforcement:
    text: >-
      Trafficking, importing or exporting more than 500 g of cannabis, more than 200 g of cannabis
      resin, or more than 1,000 g of cannabis mixture is a capital offence, with narrow exceptions
      for qualifying couriers.[@mda_sch, cnb_can] From 330 g to 500 g of cannabis the trafficking
      sentence is at least 20 years and 15 strokes of the cane, and up to 30 years or life and 15
      strokes.[@cnb_can] Cannabis executions have been carried out as recently as April
      2026.[@cnb_execution] Qualifying repeat consumption can also bring up to 13 years and 12
      strokes, subject to caning exemptions.[@judiciary2026]
    sources:
      - cnb_can
      - mda_sch
      - cnb_execution
      - judiciary2026
  sharing:
    text: >-
      Giving cannabis to another person is trafficking, whether or not money changes hands. For under
      330 g of cannabis the sentence is at least 5 years and 5 strokes of the cane, and at most 20
      years and 15 strokes. The same first band runs to under 130 g of resin and under 660 g of
      mixture.[@cnb_can] The higher trafficking bands use 330–500 g of plant material, 130–200 g of
      resin or 660–1,000 g of mixture; above those upper limits the offence is capital, subject to
      section 33B exceptions.[@cnb_can,mda_sch]
    sources:
      - cnb_can
      - mda_sch
    penalties:
