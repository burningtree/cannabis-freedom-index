name: Singapore
region: Asia
iso_numeric: 702
recreational: death
medical: limited
updated: '2026-10-27'
summary: >-
  Death for trafficking more than 500 g of cannabis, more than 200 g of cannabis resin, or more
  than 1,000 g of cannabis mixture, with narrow exceptions. Larger possession amounts bring a
  mandatory prison term and caning. Ordinary consumption brings at least one year; qualifying
  repeat use can bring 13 years and caning. Citizens can be prosecuted for use abroad.
  Cannabinoid pharmaceuticals are approved case by case.
