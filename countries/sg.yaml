segments:
  possession:
    text: >-
      Cannabis is a Class A controlled drug. Possessing less than 330 g of cannabis, less than 130 g
      of resin, or less than 660 g of mixture carries up to 10 years, a fine of up to S$20,000, or
      both.[@mda_sch] Section 17 presumes possession for trafficking above 15 g of cannabis plant
      material, 10 g of resin or 30 g of mixture unless the holder proves otherwise.[@mda17]
      Trafficking can also be proved below those amounts.[@mda1973] From 330 g to 500 g of cannabis
      the sentence is at least 10 years and 5 strokes of the cane, and at most 20 years and 10
      strokes. More than 500 g is at least 20 years and 10 strokes, and at most 30 years and 15
      strokes.[@mda_sch] Resin uses 130 g and 200 g for those same steps, and mixture uses 660 g and
      1,000 g.[@cnb_can]
    sources:
      - mda17
      - mda1973
      - mda_sch
      - cnb_can
    currency: SGD
    penalties:
      - label: "Cannabis plant material: less than 330 g"
        treatment: criminal
        term: Possession
        prison: 10 years
        fine: 20000
        note: >-
          Above 15 g, possession for trafficking is presumed unless rebutted; these are
          possession-only penalties; prison or a fine, or both
      - label: "Cannabis plant material: 330–500 g"
        treatment: criminal
        term: Possession
        prison_min: 10 years
