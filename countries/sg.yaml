name: Singapore
region: Asia
iso_numeric: 702
recreational: illegal
medical: limited
updated: 2026-10-04
summary: >-
  Death penalty for trafficking over 500 g, subject to narrow exceptions; caning and prison for
  possession. Citizens can be prosecuted for use abroad. Cannabinoid pharmaceuticals are approved
  case by case.
scores:
  possession: 0
  cultivation: 0
