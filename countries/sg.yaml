segments:
  possession:
    text: >-
      Cannabis is a Class A controlled drug. Possessing less than 330 g of cannabis, less than
      130 g of resin, or less than 660 g of mixture carries up to 10 years, a fine of up to
      S$20,000, or both.[@mda_sch] Anyone holding more than 15 g is presumed to hold it for
      trafficking unless they prove otherwise.[@wmda] From 330 g to 500 g of cannabis the sentence is at least 10 years
      and 5 strokes of the cane, and at most 20 years and 10 strokes. More than 500 g is at least
      20 years and 10 strokes, and at most 30 years and 15 strokes.[@mda_sch] Resin uses 130 g and
      200 g for those same steps, and mixture uses 660 g and 1,000 g.[@cnb_can]
    sources:
      - wmda
      - mda_sch
      - cnb_can
    currency: SGD
    penalties:
      - upto: 15 g
        treatment: criminal
        term: Offence under the Misuse of Drugs Act
        prison: 10 years
        fine: 20000
        note: Using it is a separate offence, proved by a urine test, with at least a year in prison
      - over: 15 g
        upto: 330 g
        treatment: criminal
        term: Presumed trafficking
        prison_min: 5 years
        prison: 20 years
        caning: [5, 15]
        note: Unless the holder proves it was not for trafficking; possession alone carries up to 10 years or S$20,000
      - over: 330 g
        upto: 500 g
        treatment: criminal
        term: Presumed trafficking
        prison_min: 20 years
        prison: 30 years
        caning: [15, 15]
        note: Or life imprisonment. If the presumption is rebutted, possession carries 10–20 years and 5–10 strokes
      - over: 500 g
        treatment: criminal
        term: Presumed trafficking, a capital offence
        death: true
        note: If the presumption is rebutted, possession carries 20–30 years and 10–15 strokes
  cultivation:
    text: >-
      Cultivating cannabis brings at least three years or a fine of at least S$5,000, and up to
      20 years or a fine of S$40,000, or both.[@mda_sch]
    sources:
      - mda_sch
    currency: SGD
    penalties:
      - over: 0 plants
        treatment: criminal
        term: Cultivation
        prison: 20 years
        fine: 40000
        note: At least three years or a fine of at least S$5,000
  enforcement:
    text: >-
      Trafficking, importing or exporting more than 500 g of cannabis, more than 200 g of cannabis
      resin, or more than 1,000 g of cannabis mixture is a capital offence, with narrow exceptions
      for qualifying couriers.[@mda_sch, cnb_can] From 330 g to 500 g of cannabis the trafficking
      sentence is at least 20 years and 15 strokes of the cane, and up to 30 years or life and 15
      strokes.[@cnb_can] Cannabis executions have been carried out as recently as April
      2026.[@cnb_execution] Qualifying repeat consumption can also bring up to 13 years and 12
      strokes, subject to caning exemptions.[@judiciary2026]
    sources:
      - cnb_can
      - mda_sch
      - cnb_execution
      - judiciary2026
  sharing:
    text: >-
      Giving cannabis to another person is trafficking, whether or not money changes hands. For
      under 330 g of cannabis the sentence is at least 5 years and 5 strokes of the cane, and at
      most 20 years and 15 strokes. The same first band runs to under 130 g of resin and under
      660 g of mixture.[@cnb_can]
    sources:
      - cnb_can
  consumption:
    text: >-
      Ordinary cannabis consumption convictions carry at least one year and up to 10 years, with a possible S$20,000 fine.
      Qualifying repeat cases under section 33A carry LT1 terms of 5–7 years and 3–6 strokes, or
      LT2 terms of 7–13 years and 6–12 strokes after qualifying LT1 history. Eligibility depends
      on the statutory combination of prior convictions or admissions; caning exemptions apply,
      including for women and men over 50.[@judiciary2026] Cannabis is a specified drug covered by
      these enhancements.[@cnbtoolkit] Police can require testing; citizens and permanent
      residents can be prosecuted for use abroad.[@mh]
    sources:
      - judiciary2026
      - cnbtoolkit
      - mh
  access:
    text: None. There is no legal source of any kind.
    sources:
      - cnb
context:
  death_penalty:
    text: >-
      Trafficking, importing or exporting more than 500 g of cannabis, more than 200 g of cannabis
      resin, or more than 1,000 g of cannabis mixture is a capital offence, with narrow exceptions
      for qualifying couriers.[@mda_sch, cnb_can] Cannabis executions have been carried out as
      recently as April 2026.[@cnb_execution]
    sources:
      - cnb_can
      - mda_sch
      - cnb_execution
  recreational:
    text: >-
      There is no legal way to get or use cannabis in Singapore, and using it is itself a crime,
      proved by a urine test the police can require.[@cnb_can] Citizens and permanent residents who
      use drugs abroad, even where cannabis is legal, face the same penalties as if they had used them
      at home.[@cnb] Cannabis is the third most common drug among people arrested, after
      methamphetamine and heroin: in 2025 the [Central Narcotics Bureau](https://www.cnb.gov.sg/)
      arrested 250 people for using it, 8% of all drug users arrested, and seven in ten of them were
      caught for the first time.[@cnb25] The bureau says permissive attitudes among young people are
      its main worry; six in ten new cannabis users arrested were under 30.[@cnb25]
    sources:
      - cnb_can
      - cnb
      - cnb25
  hemp:
    status: none
    text: >-
      Singapore makes no exception for hemp. The law defines cannabis as any part of a plant of the
      genus Cannabis, so seeds, low-THC hemp and CBD products are all controlled drugs.[@mda1973]
      A pharmaceutical cannabinoid can be approved for an individual
      patient.[@wiki]
    sources:
      - mda1973
      - wiki
  production:
    status: none
    text: >-
      None. No licensed production exists, and growing a single plant is a crime with at least
      three years in prison or a S$5,000 fine.[@mda_sch]
    sources:
      - mda_sch
  medical:
    text: >-
      No medical cannabis programme. In rare cases the health regulator has approved a cannabidiol
      medicine for a named patient, such as a child with drug-resistant epilepsy.
    sources:
      - wiki
  consequences:
    text: >-
      Users can be committed to a Drug Rehabilitation Centre and then placed under supervision with
      regular urine tests. Foreigners are deported after sentence, and a drug record affects
      employment for life.
    sources:
      - wiki
      - mh
  planting:
    seeds: illegal
    seeds_trade: banned
    clones: illegal
    clones_trade: banned
    text: >-
      The Misuse of Drugs Act defines cannabis as any part of a plant of the genus Cannabis,
      with no exception for seeds, so seeds and cuttings are controlled drugs like the rest of
      the plant.
    sources:
      - mda1973
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited, and the law provides for the death
      penalty for the most serious drug offences.
    sources:
      - wiki
      - cnb
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. Possessing less than 330 g of cannabis can
      bring up to ten years, a fine of up to S$20,000, or both. From 330 g the prison term is
      mandatory and includes caning. Trafficking more than 200 g of cannabis resin can bring
      death.[@cnb_can, mda_sch]
    sources:
      - cnb_can
      - mda_sch
  driving:
    status: impairment
    text: >-
      The Road Traffic Act makes it an offence to drive while unfit, meaning under the
      influence of drink, a drug or a psychoactive substance to such an extent as to be
      incapable of having proper control of the vehicle. Unlike for alcohol, no limit is
      prescribed for drugs. A first offence brings a fine of 2,000 to 10,000 dollars or up to
      12 months in prison and at least two years' disqualification; a repeat offence, a fine
      of 5,000 to 20,000 dollars and up to two years in prison, with at least five years'
      disqualification.
    sources:
      - rta67
  arrests:
    text: >-
      The Central Narcotics Bureau arrested 250 people for using cannabis in 2025, 8% of all drug
      users arrested; 70% of them were new users, and 52% were under 30.[@cnb25] Cannabis seizures
      rose by 21.7%, from 101 kg in 2024 to 123 kg in 2025.[@cnb25]
    sources:
      - cnb25
  culture:
    text: >-
      Singapore's stance took shape around 1970, when the government saw the hippie culture
      spreading along the jet routes as a gateway to drugs and escapism. Long-haired foreigners were
      turned away, and in 1972 Operation Snip Snip made long-haired men cut their hair before they
      could enter; civil servants who refused were dismissed.[@nlb24] The idea of a drug-free
      society has stayed at the centre of policy: the narcotics bureau runs prevention campaigns in
      schools, and describes legalisation abroad as a cautionary tale.[@cnb25,cnb]
    sources:
      - nlb24
      - cnb25
      - cnb
  research:
    status: restricted
    text: >-
      Singapore studies cannabis without growing it. In 2018 the [National Research
      Foundation](https://www.nrf.gov.sg/) put S$25 million into a five-year synthetic biology
      programme, one strand of which aimed to make cannabis-derived medicines, mostly CBD, from
      engineered microbes rather than plants.[@idpc18] The plant itself stays illegal for any
      purpose.[@idpc18]
    sources:
      - idpc18
  spotlights:
    - title: Fifteen grams makes a trafficker
      text: >-
        Above 15 g of cannabis, the law presumes that the holder is a trafficker, and it is for the
        accused to prove otherwise.[@wmda] Trafficking brings at least five years and five strokes of
        the cane, and above 500 g the death penalty; Singapore carried out a cannabis execution as
        recently as April 2026.[@cnb_can,cnb_execution]
      sources:
        - wmda
        - cnb_can
        - cnb_execution
    - title: The law travels with you
      text: >-
        A Singaporean or permanent resident who smokes a joint in Bangkok or Amsterdam, where it may
        be legal, commits the same offence as at home, and can be tested on return.[@cnb,mh] Using
        cannabis carries at least a year in prison, so a holiday habit can end in a cell.[@cnb_can]
      sources:
        - cnb
        - mh
        - cnb_can

