  consumption:
    text: >-
      A first cannabis consumption conviction carries at least one year and up to 10 years, with a
      possible S$20,000 fine; a second conviction carries three to 10 years, with the same possible
      fine.[@judiciary2026] Qualifying repeat cases under section 33A carry LT1 terms of 5–7 years
      and 3–6 strokes, or LT2 terms of 7–13 years and 6–12 strokes after qualifying LT1 history.
      Eligibility depends on the statutory combination of prior convictions or admissions; caning
      exemptions apply, including for women and men over 50.[@judiciary2026] Cannabis is a specified
      drug covered by these enhancements.[@cnbtoolkit] Police can require testing; citizens and
      permanent residents can be prosecuted for use abroad.[@mh]
    sources:
      - judiciary2026
      - cnbtoolkit
      - mh
    currency: SGD
    penalties:
      - label: Using cannabis, a first conviction
        treatment: criminal
        term: Consumption, proved by a urine test
        prison_min: 1 year
        prison: 10 years
        fine: 20000
      - label: Using cannabis, a second conviction
        treatment: criminal
        term: Consumption, proved by a urine test
        prison_min: 3 years
        prison: 10 years
        fine: 20000
      - label: Repeat use after qualifying earlier convictions (LT1, section 33A)
        treatment: criminal
        term: Long-term imprisonment 1
        prison_min: 5 years
        prison: 7 years
        caning:
          - 3
          - 6
        note: Women and men over 50 are not caned
      - label: Repeat use after an LT1 term (LT2, section 33A)
        treatment: criminal
        term: Long-term imprisonment 2
        prison_min: 7 years
        prison: 13 years
        caning:
          - 6
          - 12
  access:
    text: >-
      No legal source for adults. The only lawful supply is a cannabinoid pharmaceutical prescribed
      by a Singapore doctor, or an unregistered cannabinoid that HSA approves for a named patient
      through the import route.[@mha2019,st2019] There is no general medical-cannabis programme or
      pharmacy supply.
    sources:
      - mha2019
      - st2019
context:
  death_penalty:
    text: >-
      Trafficking, importing or exporting more than 500 g of cannabis, more than 200 g of cannabis
      resin, or more than 1,000 g of cannabis mixture is a capital offence, with narrow exceptions
      for qualifying couriers.[@mda_sch,cnb_can] Singapore executed a cannabis importer on 16 April
      2026; he was a courier, no certificate of substantive assistance was issued, and the court had
      no discretion under section 33B.[@cnb_execution] The previous documented cannabis execution
      was Tangaraju Suppiah in April 2023.[@tangaraju]
    sources:
      - cnb_can
      - mda_sch
      - cnb_execution
      - tangaraju
  recreational:
    text: >-
      There is no legal way to get or use cannabis in Singapore, and using it is itself a crime,
      proved by a urine test the police can require.[@cnb_can] Citizens and permanent residents who
      use drugs abroad, even where cannabis is legal, face the same penalties as if they had used
      them at home.[@cnb] Cannabis is the third most common drug among people arrested, after
      methamphetamine and heroin: in 2025 the Central Narcotics Bureau arrested 250 people for using
      it, 8% of all drug users arrested, and 70% of them were caught for the first time.[@cnb25] The
      bureau says permissive attitudes among young people are its main worry; 63% of new cannabis
      users arrested were under 30.[@cnb25]
    sources:
      - cnb_can
      - cnb
      - cnb25
  hemp:
    status: none
    text: >-
      Singapore makes no exception for hemp. The law defines cannabis as any part of a plant of the
      genus Cannabis, so seeds, low-THC hemp and CBD products are all controlled
      drugs.[@mda1973,cnb_hemp] There is no THC limit because there is no lawful hemp category. A
      pharmaceutical cannabinoid can be approved for an individual patient.[@mha2019]
    sources:
      - mda1973
      - cnb_hemp
      - mha2019
  production:
    status: none
    text: >-
      None. No licensed production exists, and growing a single plant is a crime with at least three
      years in prison or a S$5,000 fine.[@mda_sch]
    sources:
      - mda_sch
  medical:
    text: >-
      No medical cannabis programme. In 2019 the health ministry and CNB set out a route for
      registered cannabinoid pharmaceuticals, prescribed by a Singapore doctor for the registered
      condition; HSA can also approve a doctor’s application to import an unregistered cannabinoid
      for a named patient.[@mha2019] In December 2019 a girl with drug-resistant epilepsy became the
      first patient approved this way.[@st2019] There is no general programme, pharmacy supply or
      insurance route.
    sources:
      - mha2019
      - st2019
  consequences:
    text: >-
      Users can be committed to a Drug Rehabilitation Centre or placed under supervision with
      regular urine tests.[@mha2023] A foreigner’s pass may be cancelled and re-entry prohibited,
      and a permanent resident’s status can be reviewed; this is not automatic after every
      sentence.[@askmha] A conviction also creates a criminal record.
    sources:
      - mha2023
      - askmha
  planting:
    seeds: illegal
    seeds_trade: banned
    clones: illegal
    clones_trade: banned
    text: >-
      The Misuse of Drugs Act defines cannabis as any part of a plant of the genus Cannabis, with no
      exception for seeds, and CNB treats hemp seed products as controlled.[@mda1973,cnb_hemp]
      Sowing a seed or keeping a cutting is cultivation; selling or giving them is
      trafficking.[@mda1973] No published Singapore case turns specifically on viable seed, so the
      seed status is an inference from the definition and enforcement guidance.[@cnb_hemp]
    sources:
      - mda1973
      - cnb_hemp
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: supplying cannabis is
      trafficking even without payment, cultivation is an offence, and section 11A makes arranging a
      gathering of two or more people where cannabis is consumed or trafficked an
      offence.[@mda1973,cnb]
    sources:
      - mda1973
      - cnb
  visitors:
    status: none
    text: >-
      There is no legal recreational supply.[@mda_sch] Ordinary possession below 330 g of plant
      material, 130 g of resin or 660 g of mixture carries up to ten years or a S$20,000 fine, or
      both; larger possession sentences include caning.[@cnb_can] Above 15 g of plant material, 10 g
      of resin or 30 g of mixture, possession for trafficking is presumed unless rebutted.[@mda17]
      Trafficking more than 500 g of plant material, 200 g of cannabis resin or 1,000 g of cannabis
      mixture is capital, subject to section 33B exceptions.[@cnb_can,mda_sch]
    sources:
      - mda_sch
      - cnb_can
      - mda17
  driving:
    status: impairment
    text: >-
      The Road Traffic Act makes it an offence to drive while unfit, meaning under the influence of
      drink, a drug or a psychoactive substance to such an extent as to be incapable of having
      proper control of the vehicle.[@rta67] Unlike for alcohol, no limit is prescribed for drugs,
      and prescribed cannabinoids are covered. A first offence brings a fine of S$2,000–10,000 or up
      to 12 months in prison, with at least two years’ disqualification; a repeat offence brings
      S$5,000–20,000 and up to two years, with at least five years’ disqualification; a third
      conviction can bring a lifetime ban.[@rta67]
    sources:
      - rta67
  arrests:
    text: >-
      The Central Narcotics Bureau arrested 250 people for using cannabis in 2025, 8% of all drug
      users arrested; 70% were new users, and 63% of new users were under 30.[@cnb25] Cannabis
      seizures rose by 21.7%, from 101 kg in 2024 to 123 kg in 2025.[@cnb25] No cannabis-specific
      prosecution or conviction count is published.[@cnb25]
    sources:
      - cnb25
  culture:
    text: >-
      Singapore's stance took shape around 1970, when the government saw the hippie culture
      spreading along the jet routes as a gateway to drugs and escapism. Long-haired foreigners were
      turned away, and in 1972 Operation Snip Snip made long-haired men cut their hair before they
      could enter; civil servants who refused were dismissed.[@nlb24] The idea of a drug-free
      society has stayed at the centre of policy: the [narcotics
      bureau](/history/singapore-cnb-established-1971/) runs prevention campaigns in schools, and
      describes legalisation abroad as a cautionary tale.[@cnb25,cnb]
    sources:
      - nlb24
      - cnb25
      - cnb
  research:
    status: restricted
    text: >-
      Singapore studies cannabis without growing it. In 2018 the National Research Foundation put
      S$25 million into a five-year synthetic-biology programme, one strand of which aimed to make
      cannabis-derived medicines, mostly CBD, from engineered microbes rather than plants.[@idpc18]
      No licence to grow the plant for research has been reported.[@idpc18]
    sources:
      - idpc18
  spotlights:
    - title: Fifteen grams makes a trafficker
      text: >-
        Above 15 g of cannabis plant material, 10 g of resin or 30 g of mixture, the law presumes
        possession for trafficking unless the accused proves otherwise.[@mda17] Trafficking brings
        at least five years and five strokes of the cane, and above 500 g the death penalty;
        Singapore executed a cannabis importer in April 2026.[@cnb_can,cnb_execution]
      sources:
        - mda17
        - cnb_can
        - cnb_execution
    - title: The law travels with you
      text: >-
        A Singaporean or permanent resident who smokes a joint in Bangkok or Amsterdam, where it may
        be legal, commits the same offence as at home, and can be tested on return.[@cnb,mh] Using
        cannabis carries at least a year in prison, so a holiday habit can end in a cell.[@cnb_can]
      sources:
        - cnb
        - mh
        - cnb_can
  black_market:
    text: >-
      ICA and CNB [reported a seizure of about 391 kg of
      cannabis](/history/singapore-pasir-panjang-transit-seizure-2026/) from a container at Pasir
      Panjang on 24 September 2026. Preliminary investigations indicated it was transiting Singapore
      for another country. The 2 October release reported an ongoing investigation, with no
      conviction or sentence arising from the seizure.[@transit2026]
    sources:
      - transit2026
