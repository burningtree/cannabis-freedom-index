  cultivation:
    text: >-
      Cultivating cannabis brings at least three years or a fine of at least S$5,000, and up to 20
      years or a fine of S$40,000, or both.[@mda_sch]
    sources:
      - mda_sch
    currency: SGD
    penalties:
      - over: 0 plants
        treatment: criminal
        term: Cultivation
        prison_min: 3 years
        prison: 20 years
        fine_min: 5000
        fine: 40000
        note: Prison or a fine, or both
  enforcement:
    text: >-
      Trafficking, importing or exporting more than 500 g of cannabis, more than 200 g of cannabis
      resin, or more than 1,000 g of cannabis mixture is a capital offence, with narrow exceptions
      for qualifying couriers.[@mda_sch,cnb_can] From 330 g to 500 g of cannabis the trafficking
      sentence is at least 20 years and 15 strokes, and up to 30 years or life and 15
      strokes.[@cnb_can] Singapore executed a cannabis importer on 16 April 2026; the previous
      documented cannabis execution was in April 2023.[@cnb_execution,tangaraju] Qualifying repeat
      consumption can bring up to 13 years and 12 strokes, subject to caning
      exemptions.[@judiciary2026]
    sources:
      - cnb_can
      - mda_sch
      - cnb_execution
      - tangaraju
      - judiciary2026
  sharing:
    text: >-
      Giving cannabis to another person is trafficking, whether or not money changes hands. For
      under 330 g of cannabis the sentence is at least 5 years and 5 strokes of the cane, and at
      most 20 years and 15 strokes. The same first band runs to under 130 g of resin and under 660 g
      of mixture.[@cnb_can] The higher trafficking bands use 330–500 g of plant material, 130–200 g
      of resin or 660–1,000 g of cannabis mixture; above those upper limits the offence is capital,
      subject to section 33B exceptions.[@cnb_can,mda_sch]
    sources:
      - cnb_can
      - mda_sch
    penalties:
