segments:
  possession:
    text: >-
      Cannabis is a Class A controlled drug under the Misuse of Drugs Act. Possessing any amount
      carries up to 10 years in prison, a fine of up to S$20,000, or both. Holding more than 15 g
      triggers a legal presumption that you are trafficking, which you must disprove. There is no
      tolerated amount of any kind.
    sources:
      - cnb
      - wiki
  cultivation:
    text: >-
      Cultivating any cannabis plant is a serious offence with a mandatory minimum prison term and
      up to 20 years.
    sources:
      - wiki
      - cnb
  enforcement:
    text: >-
      The harshest regime in the index. Trafficking, importing or exporting more than 500 g of
      cannabis is a capital offence, with narrow exceptions for qualifying couriers. Cannabis
      executions have been carried out as recently as April 2026. Between 330 g and 500 g: 20 to 30
      years or life, plus 15 strokes of the cane.
    sources:
      - cnb
      - cnb_execution
      - mh
  sharing:
    text: >-
      Giving cannabis to another person is trafficking, whether or not money changes hands: for
      under 330 g, a minimum of 5 years and 5 strokes of the cane, up to 20 years and 15 strokes.
    sources:
      - cnb
  consumption:
    text: >-
      Consumption is itself a crime, proved by urine test, with up to 10 years in prison. Police can
      require a test without a warrant. Uniquely, citizens and permanent residents who use cannabis
      abroad — even where it is legal — are liable as if they had used it in Singapore, and can be
      tested on return.
    sources:
      - cnb
      - mh
  access:
    text: None. There is no legal source of any kind.
    sources:
      - cnb
context:
  death_penalty:
    text: >-
      Trafficking, importing or exporting more than 500 g of cannabis is a capital offence, with
      narrow exceptions for qualifying couriers. Cannabis executions have been carried out as
      recently as April 2026.
    sources:
      - cnb
      - cnb_execution
      - mh
  production:
    text: None. No licensed production exists.
    sources:
      - wiki
  products:
    text: >-
      None. CBD products are also prohibited; a pharmaceutical cannabinoid can be approved for an
      individual patient.
    sources:
      - wiki
  medical:
    text: >-
      No medical cannabis programme. In rare cases the health regulator has approved a cannabidiol
      medicine for a named patient, such as a child with drug-resistant epilepsy.
    sources:
      - wiki
  consequences:
    text: >-
      Users can be committed to a Drug Rehabilitation Centre and then placed under supervision with
      regular urine tests. Foreigners are deported after sentence, and a drug record affects
      employment for life.
    sources:
      - wiki
      - mh
  planting:
    seeds: illegal
    seeds_trade: banned
    clones: illegal
    clones_trade: banned
    text: >-
      The Misuse of Drugs Act defines cannabis as any part of a plant of the genus Cannabis,
      with no exception for seeds, so seeds and cuttings are controlled drugs like the rest of
      the plant.
    sources:
      - mda1973
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited, and the law provides for the death
      penalty for the most serious drug offences.
    sources:
      - wiki
      - cnb
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. British travel advice warns that
      penalties are severe for all drug offences, including possession, and apply to
      passengers in transit, whose baggage is scanned. A person can be detained without trial,
      holding more than a set amount is treated as trafficking, and sentences include prison,
      caning and the death penalty.
    sources:
      - cnb
      - fcdo
  driving:
    status: impairment
    text: >-
      The Road Traffic Act makes it an offence to drive while unfit, meaning under the
      influence of drink, a drug or a psychoactive substance to such an extent as to be
      incapable of having proper control of the vehicle. Unlike for alcohol, no limit is
      prescribed for drugs. A first offence brings a fine of 2,000 to 10,000 dollars or up to
      12 months in prison and at least two years' disqualification; a repeat offence, a fine
      of 5,000 to 20,000 dollars and up to two years in prison, with at least five years'
      disqualification.
    sources:
      - rta67
