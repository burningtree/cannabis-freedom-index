segments:
  possession:
    text: >-
      Possessing a small personal amount is a criminal offence under the 1983 Narcotics Act, with a
      statutory maximum of one year in prison. In practice it usually ends in a fine or a diverted
      case.
    sources:
      - wiki
      - law
  cultivation:
    text: Cultivation of cannabis above 1% THC is prohibited, with up to three years in prison.
    sources:
      - wiki
      - law
  enforcement:
    text: Fines are the norm for users; prison is possible in law.
    sources:
      - wiki
  sharing:
    text: Supply carries up to three years.
    sources:
      - wiki
  consumption:
    text: Use is an offence under the same provisions.
    sources:
      - law
      - cann
  access:
    text: >-
      There is no general medical-cannabis programme, but authorised cannabinoid medicines can be
      prescribed. The government specifically identifies Sativex as authorised for medical use in
      Liechtenstein. Residents are not covered by neighbouring Switzerland's cannabis pilot trials.
    sources:
      - cann
      - govt_drug_policy
context:
  production:
    text: No licensed production; industrial hemp has been restricted since 2005.
    sources:
      - cann
  products:
    text: Products under 1% THC occupy a grey area.
    sources:
      - cann
  medical:
    text: No medical cannabis programme, though two cannabinoid medicines can be prescribed.
    sources:
      - cann
      - wiki
      - govt_drug_policy
  consequences:
    text: A conviction is a criminal record.
    sources:
      - wiki
  planting:
    seeds: grey
    seeds_trade: unclear
    clones: illegal
    clones_trade: banned
    text: >-
      The Narcotics Act treats cannabis-type material with an average total THC content of at
      least 1% as a banned narcotic. Growing narcotics needs a permit from the Office of
      Public Health, and growing without one carries up to three years in prison. The act
      counts plants and parts of plants as substances but does not mention seeds.
    sources:
      - betmg
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited.
    sources:
      - wiki
      - law
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. British travel advice says illegal
      drugs, including cannabis, carry severe penalties and tells travellers to expect a long
      jail sentence and heavy fines for possessing, using or smuggling them, also when only
      passing through the country.
    sources:
      - cann
      - fcdo
