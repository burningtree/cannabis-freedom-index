name: Liechtenstein
region: Europe
iso_numeric: 438
recreational: illegal
medical: limited
updated: 2026-10-13
summary: Illegal, with small-quantity cases usually diverted; authorised cannabinoid medicines are prescribable.
scores:
  possession: 1
  cultivation: 1
  enforcement: 3
  sharing: 1
  consumption: 1
  access: 1
segments:
  possession:
    text: >-
      Possessing a small personal amount is a criminal offence under the 1983 Narcotics Act, with a
      statutory maximum of one year in prison. In practice it usually ends in a fine or a diverted
      case.
    sources:
      - wiki
      - law
  cultivation:
    text: Cultivation of cannabis above 1% THC is prohibited, with up to three years in prison.
    sources:
      - wiki
      - law
  enforcement:
    text: >-
      Fines are the norm for users. Under article 21 of the Narcotics Act, consumption and
      offences committed for one's own use carry a fine of up to 50,000 francs, with up to six
      months in prison only if the fine cannot be collected, and the court may waive punishment
      in minor cases. Other offences under article 20 carry up to three years.
    sources:
      - betmg
      - wiki
  sharing:
    text: >-
      Selling, supplying to others or putting on the market carries up to three years in prison
      or a fine under article 20 of the Narcotics Act, and one to twenty years in serious cases
      such as commercial dealing.
    sources:
      - betmg
      - wiki
  consumption:
    text: Use is an offence under the same provisions.
    sources:
      - law
      - cann
  access:
    text: >-
      There is no general medical-cannabis programme, but authorised cannabinoid medicines can be
      prescribed. The government specifically identifies Sativex as authorised for medical use in
      Liechtenstein. Residents are not covered by neighbouring Switzerland's cannabis pilot trials.
    sources:
      - cann
      - govt_drug_policy
context:
  production:
    text: No licensed production; industrial hemp has been restricted since 2005.
    sources:
      - cann
  products:
    text: Products under 1% THC occupy a grey area.
    sources:
      - cann
  medical:
    text: No medical cannabis programme, though two cannabinoid medicines can be prescribed.
    sources:
      - cann
      - wiki
      - govt_drug_policy
  consequences:
    text: A conviction is a criminal record.
    sources:
      - wiki
  planting:
    seeds: grey
    seeds_trade: unclear
    clones: illegal
    clones_trade: banned
    text: >-
      The Narcotics Act treats cannabis-type material with an average total THC content of at
      least 1% as a banned narcotic. Growing narcotics needs a permit from the Office of
      Public Health, and growing without one carries up to three years in prison. The act
      counts plants and parts of plants as substances but does not mention seeds.
    sources:
      - betmg
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited.
    sources:
      - wiki
      - law
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. British travel advice says illegal
      drugs, including cannabis, carry severe penalties and tells travellers to expect a long
      jail sentence and heavy fines for possessing, using or smuggling them, also when only
      passing through the country.
    sources:
      - cann
      - fcdo
  driving:
    status: limit
    text: >-
      Traffic Regulations article 2(2a) treats inability to drive as established when
      blood THC is at least 1.5 micrograms per litre (1.5 ng/mL). A driver who proves
      use under a medical prescription is excepted from that automatic evidential
      rule, but the general prohibition on driving while unfit still applies. Police
      can order a blood test on suspicion of drug influence and take the licence
      immediately; the road office and prosecution receive the report, and a medical
      fitness assessment may follow. Road Traffic Act article 86(1) sets a fine up to
      CHF50,000, with imprisonment up to six months if the fine is uncollectible,
      rather than an automatic six-month custodial sentence. Article 16 specifies at
      least three months' licence withdrawal for driving while unfit or intentionally
      obstructing the required test, with longer periods for specified repeats.
      Administrative withdrawal and court punishment are separate proceedings.
    sources:
      - trafficvrv
      - trafficsvg
      - trafficpractice
