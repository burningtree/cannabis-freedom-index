summary: >-
  Possession of up to 10 g is not punishable and use is a CHF 100 fine. Cannabis under 1% THC is
  legal, and city pilot trials sell regulated cannabis to registered adults.
scores:
  possession: 4
  cultivation: 1
  enforcement: 5
  sharing: 3
  consumption: 2
  access: 2
segments:
  possession:
    text: >-
      Possessing up to 10 g for your own use is not punishable under the Narcotics Act. Above 10 g
      it is a criminal offence. Cannabis containing less than 1% THC is not a controlled drug at all
      and can be carried freely.
    sources:
      - chch
      - pp
  cultivation:
    text: >-
      Growing cannabis with 1% THC or more is illegal, with no tolerated plant count. Low-THC (under
      1%) plants can be grown legally. A legalisation bill drafted by a parliamentary committee
      would allow home growing but has not been enacted.
    sources:
      - chch
      - pp
  enforcement:
    text: >-
      Users face at most a CHF 100 fine. Growing, selling or holding more than 10 g are criminal,
      with prison for commercial dealing.
    sources:
      - chch
  sharing:
    text: >-
      An unusual exemption: supplying up to 10 g free of charge to an adult so that you can consume
      it together at the same time is not punishable. Any other transfer is an offence.
    sources:
      - chch
  consumption:
    text: >-
      Consuming is still an offence, punished with a CHF 100 fixed fine for adults and no criminal
      record. Low-THC cannabis may be smoked wherever tobacco is.
    sources:
      - chch
      - swi
  access:
    text: >-
      Low-THC 'CBD' cannabis is sold openly in shops and kiosks. For THC cannabis, the only legal
      source is one of the scientific pilot trials running in several cities since 2023: registered
      local residents can buy a limited monthly amount from pharmacies, clubs or dedicated shops.
    sources:
      - pp
      - chch
context:
  production:
    text: >-
      Production is legal for low-THC hemp, for licensed medical use, and for the limited volumes
      supplying the pilot trials. No general commercial licensing exists.
    sources:
      - pp
  products:
    text: >-
      Anything under 1% THC is freely sold. Pilot-trial participants get tested flower, hash and
      some extracts with THC caps. Otherwise THC products are illegal.
    sources:
      - pp
      - chch
  medical:
    text: >-
      Since August 2022 doctors can prescribe cannabis medicines on their own responsibility without
      a special federal permit. Costs are usually not reimbursed.
    sources:
      - chch
      - pp
  consequences:
    text: >-
      The fixed fine is not entered in the criminal record. Road-traffic law applies near-zero
      tolerance for THC, so a driver can lose their licence without being impaired.
    sources:
      - chch
      - swi
  planting:
    seeds: illegal
    seeds_trade: banned
    clones: illegal
    clones_trade: banned
    text: >-
      Swiss law draws the line at 1% THC for seeds as it does for plants. In 2020 the Federal
      Supreme Court upheld the confiscation of hemp seed taken from plants measured at 1.8%
      THC, because the seed could again produce plants above 1% and so fell under the list of
      prohibited narcotics. Seed and plants of certified low-THC varieties are legal.
    sources:
      - bger
  clubs:
    status: regulated
    text: >-
      Clubs exist legally only inside the scientific pilot trials allowed since 2021. Seven
      trials were running in 2025, in Basel, Zurich, Lausanne, Geneva (Vernier), Bern, Biel
      and Lucerne, with about 10,000 active buyers; each may enrol up to 5,000 participants,
      who may buy up to 10 g of THC a month. Cannabis social clubs are one of the permitted
      sales points, next to pharmacies, specialist shops and a non-profit shop in Lausanne.
      The trials are run by universities, cities and foundations and end between 2026 and
      2028. Outside them a club has no legal footing. A parliamentary committee backed a draft
      legalisation law in February 2025 built on a limited number of licensed outlets and home
      growing, not clubs.
    sources:
      - pp25
  driving:
    status: zero
    text: >-
      The limit of 1.5 microgrammes of THC per litre of blood is not an impairment threshold
      but the level at which the substance can be reliably measured: once it is reached the
      driver is deemed unfit to drive. The Federal Supreme Court upheld this zero-tolerance
      rule in 2021, in the case of a driver with 4.4 µg/l who had been given a suspended fine
      of 30 daily units and a 300 franc fine, while calling the limit open to debate because
      science cannot reliably link a blood level to actual effect.
    sources:
      - srf21
  black_market:
    text: >-
      Outside the pilot trials all cannabis is bought illegally. A study led by Addiction
      Switzerland, based on the canton of Vaud and scaled up to the country, estimated in 2020
      that 40 to 60 tonnes are consumed a year, more by volume than any other drug, in a
      market worth up to 500 million francs. In Vaud that was only about half the value of the
      cocaine market, which surprised the researchers. Imported hashish, almost all from
      Morocco, has returned after decades in which locally grown marijuana dominated, and
      cheap legal CBD cannabis is increasingly mixed with the illegal product.
    sources:
      - swi20
  visitors:
    status: residents
    text: >-
      Legal THC cannabis exists only inside the scientific pilot trials, and those are for
      registered local residents of the city or canton running them, so a visitor cannot take
      part. Low-THC cannabis sold as CBD is on open sale to anyone. Otherwise a visitor is in
      the same position as a resident outside the trials: no legal source.
    sources:
      - pp
      - chch
