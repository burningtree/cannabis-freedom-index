name: Switzerland
region: Europe
iso_numeric: 756
recreational: decriminalised
medical: legal
updated: '2026-10-27'
summary: >-
  Possessing up to 10 g for personal use is not punishable. Adult consumption can bring a CHF
  100 fixed fine. Registered residents can buy regulated cannabis through scientific trials, and
  doctors can prescribe medical cannabis without a special federal permit.
scores:
  possession: 4
  cultivation: 1
  enforcement: 5
  sharing: 3
  consumption: 2
  access: 2
# What the possession score cannot say precisely (src/lib/answers.js).
answers:
  carry:
    answer: limited
    text: Up to 10 g is not punishable and cannot be confiscated
segments:
  possession:
    penalties:
      - upto: 10 g
        treatment: legal
        note: >-
          Personal-use possession is not punishable and cannot be confiscated for destruction;
          consuming it remains separately punishable
      - over: 10 g
        treatment: criminal
        term: Personal-use offence
        note: >-
          A fine under article 19a; minor cases may be discontinued. Supply offences have
          different penalties
    text: >-
      Possessing up to 10 g of cannabis for personal use is not punishable.[@bag] The Federal
      Supreme Court also ruled that cannabis held under that exemption cannot be confiscated for
      destruction.[@court23] Cannabis with less than 1% total THC falls outside narcotics
      control.[@law] Outside the small-quantity exemption, unauthorised personal-use possession is
      punishable by a fine under article 19a; minor cases may be discontinued.[@court23]
    sources:
      - bag
      - court23
      - law
  cultivation:
    text: >-
      Growing cannabis containing at least 1% THC for recreational use is generally
      prohibited.[@law] Low-THC hemp falls outside narcotics control, while medical cultivation
      needs Swissmedic licences and growing for pilot trials needs a federal exceptional
      licence.[@law, swissmedic, faq]
    sources:
      - law
      - swissmedic
      - faq
  enforcement:
    text: >-
      Adult cannabis consumption can be punished with a CHF 100 fixed fine, with enforcement
      still varying between cantons.[@bag] Personal-use offences outside the small-quantity
      exemption are punishable by a fine; in minor cases proceedings can be dropped or a warning
      given.[@court23] Unauthorised supply falls under the general drug offence, carrying up to
      three years in prison or a monetary penalty in the basic case.[@court23]
    sources:
      - bag
      - court23
  sharing:
    text: >-
      An adult may give another adult up to 10 g free of charge for their simultaneous, shared
      consumption without punishment.[@court23] Unauthorised supply outside that narrow
      exemption is an offence.[@court23] Cannabis obtained through a pilot trial is for the
      participant’s own use and cannot be passed to others.[@participation]
    sources:
      - court23
      - participation
  consumption:
    text: >-
      Consuming cannabis containing at least 1% THC is generally prohibited; adults can receive
      a CHF 100 fixed fine.[@bag] Trial participants must use their purchased cannabis privately
      and may not consume it in publicly accessible places.[@participation]
    sources:
      - bag
      - participation
  access:
    text: >-
      Scientific pilot trials let registered participants buy cannabis through pharmacies,
      specialist outlets or cannabis social clubs.[@faq] Participation requires adulthood,
      existing cannabis use and residence in the canton hosting the trial.[@participation]
      Doctors can separately prescribe medical cannabis, including pharmacy-made
      preparations.[@medical] Low-THC smoking flower can be sold legally.[@bag]
    sources:
      - faq
      - participation
      - medical
      - bag
context:
  production:
    status: pilot
    text: >-
      Medical growers need a Swissmedic establishment licence and a separate cultivation licence
      for each crop, with traceability and a written agreement for the harvest.[@swissmedic]
      Producers supplying scientific trials need an exceptional licence from the Federal Office of
      Public Health.[@faq] Hemp below 1% THC falls outside narcotics control.[@law]
    sources:
      - swissmedic
      - faq
      - law
  medical:
    text: >-
      Since 1 August 2022 doctors can prescribe cannabis medicines, including flower and
      pharmacy-made preparations, without a special federal health-office permit.[@medical]
      Prescribers must report treatment data during the first two years.[@medical] Compulsory
      health insurance reimburses cannabis medicines only in exceptional cases.[@medical]
    sources:
      - medical
  consequences:
    text: >-
      Personal possession up to 10 g is unpunished and protected against confiscation for
      destruction; consuming cannabis can still bring a fine.[@court23,bag] The driving section
      explains a separate whole-blood THC threshold and its measurement-confidence
      deduction.[@drive,drive_tolerance] Prescribed use has a distinct exception to the automatic
      finding of unfitness.[@vrv]
    sources:
      - court23
      - bag
      - drive
      - drive_tolerance
      - vrv
  planting:
    seeds: illegal
    seeds_trade: banned
    clones: illegal
    clones_trade: banned
    text: >-
      Seeds intended to produce cannabis plants with at least 1% total THC are controlled under
      the narcotics list.[@bger] In 2020 the Federal Supreme Court upheld confiscation of seeds
      from plants measured at 1.8% THC, rejecting the argument that seeds are exempt because
      they contain no THC themselves.[@bger] Low-THC hemp is outside narcotics control.[@law]
    sources:
      - bger
      - law
  clubs:
    status: regulated
    text: >-
      Cannabis social clubs are among the sales models authorised within scientific pilot
      trials, alongside pharmacies and other outlets.[@results] The federal overview of results
      through July 2025 covered seven trials and about 10,500 participants.[@results] Trial
      participants must already use cannabis, live in the host canton and consent to the
      study.[@participation] Outside the trials, recreational supply remains prohibited.[@law]
    sources:
      - results
      - participation
      - law
  driving:
    status: zero
    text: >-
      The analytical legal THC threshold is 1.5 ng/mL (1.5 micrograms per litre) in whole blood;
      it is not a scientific impairment threshold.[@drive] The prescribed 30%
      measurement-confidence deduction normally requires an observed result of about 2.2 ng/mL to
      establish that threshold reliably.[@drive_tolerance] A driver who proves the substance was
      taken according to a physician’s prescription is exempt from the automatic finding based on
      detection alone. Actual unfitness still prohibits driving and requires assessment in the
      individual case.[@vrv]
    sources:
      - drive
      - drive_tolerance
      - vrv
  black_market:
    text: >-
      A 2020 study led by Addiction Switzerland, based on research in Vaud and extrapolated
      nationally, estimated annual cannabis consumption at 40–60 tonnes and market value at up to
      CHF500 million.[@swi20] It described imported hashish coming almost entirely from Morocco
      and illegal cannabis being mixed with cheaper legal CBD products.[@swi20] In the later
      trials, the university evaluation found legal outlets had become the main source for most
      participants.[@evaluation2025]
    sources:
      - swi20
      - evaluation2025
  visitors:
    status: residents
    text: >-
      Visitors cannot join the scientific trials: participants must live in the canton where
      their trial takes place and already use cannabis.[@participation] The trials provide
      access through approved outlets to enrolled participants.[@faq] Low-THC smoking flower can
      be bought legally under the separate product rules.[@bag, law]
    sources:
      - participation
      - faq
      - bag
      - law
  arrests:
    text: >-
      Police recorded 48,208 Narcotics Act offences in 2024, down 11.5% on the year before,
      continuing a decline since 2015.[@bfs_pks24] This headline count covers all
      drugs.[@bfs_pks24]
    sources:
      - bfs_pks24
  recreational:
    text: >-
      Registered trial participants can buy controlled cannabis products through approved outlets,
      including pharmacies and social clubs.[@faq] The studies accept adults who already use
      cannabis and live in the participating canton.[@participation] Outside those routes, the
      general supply ban remains, while products below 1% THC follow separate product rules.[@law]
    sources:
      - faq
      - participation
      - law
  hemp:
    status: high
    text: >-
      Hemp below 1% total THC falls outside narcotics control, with separate rules depending on
      whether it is sold as a medicine, food or smoking product.[@law] Low THC alone does not make
      CBD foods marketable: cannabinoid-rich extracts generally require novel-food
      authorisation.[@food] Ordinary hemp seeds and seed oil have a different food history from
      cannabinoid extracts.[@food]
    sources:
      - law
      - food
  research:
    status: licensed
    text: >-
      Researchers can seek federal permission for controlled adult-use supply trials, with defined
      populations, products and evaluation plans.[@pilotbasis,faq] Lausanne and Northwestern
      Switzerland universities evaluated seven trials containing about 10,400 adults in June
      2025.[@evaluation2025] Their report combines trial data, case studies and expert interviews;
      early movement towards legal supply describes enrolled participants, not the whole
      country.[@evaluation2025]
    sources:
      - pilotbasis
      - faq
      - evaluation2025
