name: Guyana
region: South America
iso_numeric: 328
recreational: death
medical: none
updated: '2026-10-28'
summary: >-
  Since 2022 possession of up to 30 g no longer carries prison, but counselling or community
  service. Section 6 provides death if unlawfully supplied narcotics cause the death of someone
  under eighteen.
scores:
  possession: 2
  cultivation: 1
  enforcement: 3
  sharing: 1
  consumption: 2
  access: 0
segments:
  possession:
    text: >-
      Possession remains an offence, but since November 2022 there is no prison for 30 g or less: up
      to 15 g leads to mandatory counselling, and 15–30 g to community service of up to six months.
      Before the change, 15 g could bring a trafficking charge and three to five years. More than 30
      g is now presumed to be trafficking.
    sources:
      - dpi
      - act
  cultivation:
    text: >-
      Section 8 of the Narcotic Drugs and Psychotropic Substances (Control) Act punishes cultivating a
      prohibited plant, or letting land be used for it, with a fine and three to five years in prison
      on summary conviction, or five to ten years on indictment.[@cap1010] Licensed industrial hemp
      with no more than 0.3% delta-9 THC on a dry-weight basis follows the separate [2022 hemp
      law](/history/guyana-industrial-hemp-2022/).[@hemp22]
    sources:
      - cap1010
      - hemp22
  enforcement:
    text: >-
      Counselling or community service for 30 g or less; prison for anything above. Rastafari groups
      criticised the reform for stopping short of decriminalisation.
    sources:
      - dpi
      - pi
  sharing:
    text: >-
      Supply is trafficking. Section 5 of the Act sets a fine and three to five years in prison on
      summary conviction, and a fine with imprisonment for life on indictment.[@cap1010] Section 6
      separately provides death where unlawful supply or administration to a person under eighteen
      causes their death.[@cap1010,canu]
    sources:
      - cap1010
      - canu
    penalties:
      - label: Ordinary trafficking on indictment, section 5
        treatment: criminal
        term: Trafficking
        life: mandatory
        note: Also a statutory fine; summary conviction has a separate three-to-five-year term
      - label: Unlawful supply/administration to a person under eighteen causing their death, section 6
        treatment: criminal
        term: Fatal supply to a minor
        death: true
        note: >-
          Requires the statutory age and causation conditions; ordinary adult supply is a separate
          offence
  consumption:
    text: The 2022 amendment removed the fine and prison term for smoking or otherwise using cannabis.
    sources:
      - dpi
  access:
    text: No legal source.
    sources:
      - pi
context:
  death_penalty:
    text: >-
      Section 6 provides death on indictment for unlawfully supplying or administering a narcotic to
      someone under eighteen when the narcotic causes their death.[@cap1010,canu] Cannabis and
      cannabis resin are listed narcotics, so the offence’s wording includes them when those age and
      causation conditions are proved.[@cap1010] Ordinary trafficking under section 5 carries prison
      up to life.[@cap1010] Guyana’s last known execution was in 1997.[@wcadp]
    sources:
      - cap1010
      - canu
      - wcadp
  hemp:
    status: standard
    text: >-
      Industrial hemp is cannabis and its parts, including seeds, with no more than 0.3% delta-9 THC
      on a dry-weight basis.[@hemp22] Cultivation, manufacturing and research require a licence under
      the [2022 law](/history/guyana-industrial-hemp-2022/).[@hemp22] In May 2026 the government was
      still pursuing a processing plant before large-scale cultivation could start in Regions Six and
      Ten.[@hemp26]
    sources:
      - hemp22
      - hemp26
  recreational:
    text: >-
      There is no legal recreational market. Since November 2022 there is no prison for 30 g
      or less: up to 15 g means mandatory counselling, 15–30 g community service — but more
      than 30 g is presumed trafficking.[@dpi,act] Rastafari groups criticised the reform for
      stopping short of decriminalisation.[@dpi,pi]
    sources:
      - dpi
      - act
      - pi
  production:
    status: hemp
    text: >-
      The [2022 Industrial Hemp Act](/history/guyana-industrial-hemp-2022/) licenses cultivation,
      manufacturing and research involving hemp at no more than 0.3% delta-9 THC.[@hemp22] In May 2026
      the agriculture minister said the authority and its chief executive were in place, but
      large-scale planting awaited a processing facility.[@hemp26]
    sources:
      - hemp22
      - hemp26
  medical:
    text: No medical cannabis programme.
    sources:
      - pi
  consequences:
    text: The small-quantity orders are still recorded as an offence.
    sources:
      - act
  planting:
    seeds: grey
    seeds_trade: unclear
    clones: illegal
    clones_trade: banned
    text: >-
      Cultivating a prohibited plant includes sowing its seed and planting any part of it.[@cap1010]
      Licensed industrial hemp, including its seed, is separately permitted at no more than 0.3%
      delta-9 THC by the 2022 Act.[@hemp22]
    sources:
      - cap1010
      - hemp22
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited.
    sources:
      - act
  visitors:
    status: none
    text: >-
      There is no legal recreational supply. Personal possession of up to 30 g remains an offence
      but cannot bring imprisonment: up to 15 g leads to mandatory counselling, and more than 15 g
      through 30 g to community service. The Attorney General says police should not detain people
      for these small amounts. Larger possession, supply and importation remain serious offences;
      the small-possession exception does not authorise bringing cannabis across the border.[@reform2022,ag2024]
    sources:
      - reform2022
      - ag2024
  driving:
    status: impairment
    text: >-
      Drug-influenced driving is an offence under Motor Vehicles and Road Traffic Act
      section 39. The 2022 amendment increases the first-offence fine minimum to G$200,000
      and the repeat minimum to G$300,000; the government's explanation describes a
      twelve-month imprisonment alternative for a first offence and imprisonment with
      the repeat fine. Ordinary conviction brings twelve months' licence disqualification,
      two consecutive offences twenty-four months, and a third conviction permanent
      disqualification; the first two periods have a court special-reasons exception
      and can be extended. Drug-impaired driving that causes death or grievous bodily
      harm attracts separate minimum prison terms of ten and five years respectively.
      Those convictions normally bring a three-year driving ban starting after release,
      with a special-reasons exception; a repeat like conviction brings a permanent ban.
      A second relevant charge permits suspension pending trial; a third requires it.
      The 2024 camera-enforcement amendment does not replace these provisions. No numeric
      THC allowance was verified.
    sources:
      - traffic2022
      - trafficexplain
      - traffic2024
  black_market:
    text: >-
      Figures reported by the government to the UN drugs office record 1,000 kg of herbal
      cannabis seized in 2023, against 1,545 kg in 2021. The UN publishes them as kilogram
      equivalents, and countries count seizures differently, so the figures are not
      comparable across borders.
    sources:
      - unodc_szr
  arrests:
    text: >-
      The Customs Anti-Narcotic Unit reported 82 people arrested in its operations in
      2024, 54 charged with drug trafficking offences and 68 convicted. It seized 1,643 kg
      of cannabis that year, alongside 5,095 kg of cocaine. The figures are those of the anti-narcotic unit.
    sources:
      - dpi25
