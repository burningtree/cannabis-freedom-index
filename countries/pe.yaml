name: Peru
region: South America
iso_numeric: 604
recreational: decriminalised
medical: legal
updated: 2026-10-04
summary: >-
  Possession of up to 8 g is not punishable. Medical cannabis is legal since 2017, with
  patient-association cultivation added in 2021.
scores:
  possession: 3
  cultivation: 1
  enforcement: 3
  sharing: 1
  consumption: 3
  access: 1
segments:
  possession:
    text: >-
      Article 299 of the Penal Code makes possession for one's own immediate use not punishable up
      to 8 g of marijuana or 2 g of its derivatives. The exemption is lost if you carry two or more
      different drugs. In practice police often detain people while they verify the amount.
    sources:
      - np
      - cr
  cultivation:
    text: >-
      Growing for personal use is a crime. The only lawful cultivation is licensed medical
      production and, since 2021–2023 rules, registered patient associations growing for their
      members.
    sources:
      - giq
      - cr
  enforcement:
    text: >-
      Small possession is not punished by law, but unlicensed cultivation and sale carry eight to
      fifteen years.
    sources:
      - cr
      - np
  sharing:
    text: Any supply is trafficking.
    sources:
      - cr
  consumption:
    text: >-
      Use is not an offence, and the possession exemption covers immediate personal consumption.
      Public use attracts police attention.
    sources:
      - np
  access:
    text: >-
      No adult-use sales. Licensed pharmacies sell medical cannabis products on prescription to
      registered patients.
    sources:
      - giq
      - np
context:
  production:
    text: >-
      Licences exist for medical production, import and sale; patient associations can be authorised
      to cultivate.
    sources:
      - giq
      - cr
  products:
    text: Prescription oils and other medical preparations.
    sources:
      - giq
  medical:
    text: >-
      Legal since Law 30681 of 2017, on prescription with patients listed in a national registry;
      association growing was added to improve access and affordability.
    sources:
      - giq
      - cr
  consequences:
    text: No conviction for possession within the limit.
    sources:
      - np
