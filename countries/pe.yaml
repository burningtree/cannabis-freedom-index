segments:
  possession:
    text: >-
      Article 299 of the Penal Code makes possession for one's own immediate use not punishable up
      to 8 g of marijuana or 2 g of its derivatives. The exemption is lost if the person possesses
      two or more types of controlled drug.
    sources:
      - penal
  cultivation:
    text: >-
      Growing for personal use is a crime: the Penal Code provides two to six years even where the
      crop does not exceed 100 plants. The exceptions are licensed medical or scientific production
      and registered patient associations growing for their members.
    sources:
      - penal
      - law31312
  enforcement:
    text: >-
      Small possession is not punished by law. Unlicensed cultivation carries two to six years for
      up to 100 plants and eight to fifteen years otherwise; trafficking also carries prison.
    sources:
      - penal
  sharing:
    text: Any supply is trafficking.
    sources:
      - penal
  consumption:
    text: >-
      Use is not a separate offence, and Article 299 protects possession within the limits for one's
      own immediate consumption.
    sources:
      - penal
  access:
    text: >-
      No adult-use sales. Licensed pharmacies sell medical cannabis products on prescription to
      registered patients.
    sources:
      - digemid
context:
  production:
    text: >-
      Licences exist for medical production, import and sale; patient associations can be authorised
      to cultivate. Law 32195 created a separate framework for industrial hemp below 1% THC, but its
      implementing regulation remained at draft stage after public consultation.
    sources:
      - reg2023
      - law31312
      - hemp_law
      - hemp_draft
  products:
    text: Registered medicines, exceptional patient imports and pharmacy-compounded preparations.
    sources:
      - digemid
  medical:
    text: >-
      Legal since Law 30681 of 2017, on prescription with patients listed in a national registry;
      association growing was added to improve access and affordability.
    sources:
      - law30681
      - law31312
      - digemid
  consequences:
    text: No conviction for possession within the limit.
    sources:
      - penal
  planting:
    seeds: licensed
    seeds_trade: regulated
    clones: licensed
    clones_trade: regulated
    text: >-
      Unlicensed transfer of cannabis seed is a crime, while the medical regulation defines seed to
      include any botanical structure intended for sexual or asexual propagation. Licensed medical
      producers may acquire, propagate, store and transport seeds and seedlings. Commercial seed
      sales are restricted to licensed cultivators and regulated under the General Seed Law;
      licensed patient associations must obtain seed from an authorised producer. Seeds and clones
      are therefore confined to licensed or authorised medical and industrial-hemp cultivation and
      regulated supply channels; the detailed hemp rules remain pending.
    sources:
      - penal
      - reg2023
      - hemp_law
      - hemp_draft
