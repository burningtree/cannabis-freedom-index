name: Lesotho
region: Africa
iso_numeric: 426
recreational: illegal
medical: none
updated: "2026-10-27"
summary: >-
  First African country to license medical cannabis cultivation (2017), mostly for export. Personal
  use remains illegal although matekoane is widely grown.
scores:
  possession: 1
  cultivation: 1
  enforcement: 2
  sharing: 1
  consumption: 1
  access: 0
segments:
  possession:
    text: >-
      Cannabis (matekoane) is illegal to possess under the Drugs of Abuse Act 2008. Small amounts
      usually bring a fine, though prison is available.
    sources:
      - wiki
      - td
  cultivation:
    text: >-
      Growing without a licence is a crime: a conviction for harvesting cannabis carries a minimum
      of five years in prison or a fine of at least M20,000. Yet matekoane has been a staple cash
      crop for highland farmers for generations, mostly sold into South Africa.
    sources:
      - td
      - wiki
  enforcement:
    text: Fines for small amounts; the mandatory minimum for cultivation falls on small farmers.
    sources:
      - td
  sharing:
    text: Dealing is a crime with prison.
    sources:
      - td
  consumption:
    text: Use is an offence, widely ignored in rural areas.
    sources:
      - wiki
  access:
    text: No legal source for local consumers.
    sources:
      - td
context:
  production:
    text: >-
      In 2017 Lesotho became the first African country to license cannabis cultivation for medical
      and scientific purposes. Licences are expensive and went mainly to foreign-backed companies:
      one went to a South African firm, the Toronto-based Supreme Cannabis Company invested in the
      industry, and a 2021 study put the licence at 10,000 US dollars, more than smallholders can
      afford. The sector has been dogged by allegations over how licences were awarded, and
      traditional growers remain outside it.
    sources:
      - wiki
      - pe
      - cgh
  products:
    text: Licensed medical products are made for export.
    sources:
      - wiki
  medical:
    text: >-
      The reviewed export-production licensing does not establish a domestic patient treatment
      route. No such route was verified.[@td]
    sources:
      - td
  consequences:
    text: A conviction is a criminal record.
    sources:
      - td
  planting:
    seeds: licensed
    seeds_trade: regulated
    clones: licensed
    clones_trade: regulated
    text: >-
      The Drugs of Abuse Act 2008 defines cannabis as any part of the plant "including the
      seeds", and cultivating as including planting, sowing and scattering the seed. Seed is
      therefore a controlled drug, lawful only for holders of a licence under the Act, such as
      the medical cannabis producers licensed since 2018.
    sources:
      - doa08
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited.
    sources:
      - td
      - wiki
  black_market:
    text: >-
      Unlicensed cannabis is one of Lesotho's most significant cash crops, though it appears in no
      official economic statistics. Farmers treat it as a crop to fall back on when other income
      declines, and for some it is the centre of their livelihood. A 2021 study of the region
      describes the trade as quasi-legal: growing and selling remain crimes, enforcement does not
      match the scale of production, and the law is applied only now and then. No figures for
      Lesotho's output were found.
    sources:
      - cgh
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. Cannabis is illegal to possess under the
      Drugs of Abuse Act 2008; small amounts usually bring a fine, though prison is available.
    sources:
      - wiki
      - td
  driving:
    status: impairment
    text: >-
      The published Road Traffic Act section 92 makes it an offence to drive or attempt to drive a
      motor vehicle on a public road while drink or a drug makes the driver incapable of proper
      control. Its specimen-evidence provisions permit consideration of drug analysis from blood taken
      with consent by a medical practitioner, or urine or breath supplied by the accused. Refusal
      without reasonable cause supports prosecution evidence about the accused’s condition; it is not
      worded as an automatic finding of drug impairment. The available LesLII text is the 1981
      edition, not a verified current penalty consolidation. Current fines, licence consequences,
      drug-testing practice and a numeric THC cutoff remain unverified.
    sources:
      - traffic1981
answers:
  buy:
    answer: no
    text: No patient or adult-use purchase route verified
