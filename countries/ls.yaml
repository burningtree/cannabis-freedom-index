name: Lesotho
region: Africa
iso_numeric: 426
recreational: illegal
medical: none
updated: '2026-10-28'
summary: >-
  First African country to license medical cannabis cultivation (2017), mostly for export. Personal
  use remains illegal although matekoane is widely grown. The 2008 Act has no standalone possession
  offence; prosecutors use its licensing and trafficking provisions.
scores:
  possession: 1
  cultivation: 1
  enforcement: 2
  sharing: 1
  consumption: 1
  access: 0
segments:
  possession:
    text: >-
      The Drugs of Abuse Act 2008 has no standalone offence of simple possession or consumption.[@doa08]
      Prosecutors use section 9, which punishes unlicensed manufacture, acquisition or administration
      of a drug of abuse with a minimum of five years or M20,000, or both.[@doa08] Possession with
      intent to supply falls under trafficking in section 43, with a minimum of twenty years or
      M1,000,000.[@doa08] There is no statutory quantity threshold.[@doa08]
    sources:
      - doa08
    currency: LSL
    penalties:
      - label: Unlicensed acquisition or administration
        treatment: criminal
        term: Acquisition
        prison_min: 5 years
        fine_min: 20000
        note: Minimum five years or M20,000, or both
      - label: Possession for supply or trafficking
        treatment: criminal
        term: Trafficking
        prison_min: 20 years
        fine_min: 1000000
        note: Minimum twenty years or M1,000,000, or both
  cultivation:
    text: >-
      Cultivating cannabis without an operator licence is an offence under section 9, with a minimum
      of five years or M20,000, or both.[@doa08] The definition covers planting, sowing, scattering
      seed, growing, tending and harvesting.[@doa08] Producing or preparing cannabis for supply can
      also fall under the twenty-year trafficking offence, an overlap the Act does not resolve.[@doa08]
    sources:
      - doa08
    currency: LSL
    penalties:
      - label: Unlicensed cultivation
        treatment: criminal
        term: Cultivation
        prison_min: 5 years
        fine_min: 20000
        note: Minimum five years or M20,000, or both
      - label: Producing for supply
        treatment: criminal
        term: Trafficking
        prison_min: 20 years
        fine_min: 1000000
  enforcement:
    text: >-
      Small cases usually bring a fine, but the statutory minima are severe: five years or M20,000
      for unlicensed acquisition or cultivation, and twenty years or M1,000,000 for supply.[@doa08]
      Enforcement falls mainly on small farmers and couriers, while licensed export companies operate
      under the 2018 and 2025 regulations.[@cgh] No cannabis-only arrest series is published.[@unodc_crimes]
    sources:
      - doa08
      - cgh
      - unodc_crimes
  sharing:
    text: >-
      Trafficking includes offering, distributing, selling, delivering "on any terms whatsoever",
      transporting, importing and exporting.[@doa08] The minimum is twenty years or M1,000,000, or
      both, and there is no small-quantity or gift exception.[@doa08] Possessing chemicals or
      equipment for illicit cultivation carries ten years or M50,000.[@doa08]
    sources:
      - doa08
    currency: LSL
    penalties:
      - label: Supply or delivery, including gifts
        treatment: criminal
        term: Trafficking
        prison_min: 20 years
        fine_min: 1000000
        note: Minimum twenty years or M1,000,000, or both
      - label: Chemicals or equipment for illicit cultivation
        treatment: criminal
        term: Trafficking
        prison_min: 10 years
        fine_min: 50000
  consumption:
    text: >-
      There is no standalone consumption offence in the 2008 Act.[@doa08] A user may be charged as an
      unlicensed acquirer or administrator under section 9, with a minimum of five years or M20,000,
      or the premises owner may be charged under section 44.[@doa08] In practice use is widely
      tolerated in rural areas.[@cgh]
    sources:
      - doa08
      - cgh
  access:
    text: >-
      No legal source for local consumers. Licensed cultivation is for medical and scientific use,
      mostly export, and there is no domestic patient or dispensary route.[@doa08,thetsane24]
    sources:
      - doa08
      - thetsane24
answers:
  buy:
    answer: no
    text: No patient or adult-use purchase route verified
context:
  recreational:
    text: >-
      All recreational use is prohibited. The 2008 Act has no simple-possession offence; prosecutors
      use section 9 for unlicensed acquisition or administration (minimum five years or M20,000) and
      section 43 for supply (minimum twenty years or M1,000,000).[@doa08] There are no quantity
      thresholds, and giving cannabis away can be charged as trafficking.[@doa08]
    sources:
      - doa08
  production:
    status: medical
    text: >-
      Lesotho began licensing cannabis cultivation for medical and scientific use in 2017 and
      published detailed licensing regulations in 2018.[@reg2018] A 2024 study counted 33 licences,
      eight registered companies and one GMP-certified exporter to the EU; the sector is
      export-oriented and foreign-investor-heavy.[@thetsane24] The 2025 amendment raised fees to
      M400,000 for an operator and M100,000 for cultivation, manufacturing or testing.[@reg2025]
    sources:
      - reg2018
      - thetsane24
      - reg2025
  medical:
    text: >-
      No domestic patient-access scheme. Licensed production is for medical and scientific use, but
      the 2024 research found no legal route for local patients to obtain medical cannabis.[@thetsane24]
      No registered cannabis medicine or dispensary was verified.[@doa08]
    sources:
      - thetsane24
      - doa08
  hemp:
    status: none
    text: >-
      No separate hemp or CBD regime and no THC threshold. "Cannabis" covers any part of the plant,
      including seeds and leaves, and cannabis is a Schedule 1 drug.[@doa08] Industrial hemp would
      need the same cannabis licence, and no consumer CBD market was found.[@doa08]
    sources:
      - doa08
  consequences:
    text: >-
      A conviction is a criminal record. The 2008 Act provides for forfeiture of drugs and property
      connected with an offence, and the 2018 regulations add licence conditions and seed-to-sale
      controls for lawful operators.[@doa08,reg2018]
    sources:
      - doa08
      - reg2018
  planting:
    seeds: licensed
    seeds_trade: regulated
    clones: licensed
    clones_trade: regulated
    text: >-
      The 2008 Act defines cannabis as any part of the plant "including the seeds", and cultivation
      as including planting, sowing and scattering the seed.[@doa08] Seed is therefore a controlled
      drug, lawful only for holders of a licence under the Act, such as the medical cannabis
      producers licensed since 2017.[@doa08]
    sources:
      - doa08
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited.[@doa08]
    sources:
      - doa08
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. The 2008 Act's licensing and trafficking
      provisions apply to visitors as to residents, with supply carrying a minimum of twenty years or
      M1,000,000.[@doa08]
    sources:
      - doa08
  driving:
    status: impairment
    text: >-
      Road Traffic Act section 92 makes it an offence to drive or attempt to drive on a public road
      while drink or a drug makes the driver incapable of proper control.[@traffic1981] The 1981
      edition sets a M1,000 fine and one year in prison, and permits blood, urine or breath evidence;
      refusal without reasonable cause supports the prosecution's evidence of condition.[@traffic1981]
      There is no numeric THC cutoff.[@traffic1981]
    sources:
      - traffic1981
  black_market:
    text: >-
      Unlicensed cannabis is one of Lesotho's most significant cash crops, though it appears in no
      official economic statistics.[@cgh] Farmers treat it as a fallback when other income declines,
      and enforcement does not match the scale of production.[@cgh] UNODC records 6,670 kg of cannabis
      herb seized in 2024, against 2,175 kg in 2023.[@unodc_szr] No reliable output estimate was found.[@cgh]
    sources:
      - cgh
      - unodc_szr
  arrests:
    text: >-
      In 2024, 105 people were brought into formal contact with the police for drug offences and 88
      were prosecuted; the figures cover all drugs and are not cannabis-specific.[@unodc_crimes]
      UNODC records 6,670 kg of cannabis herb seized in 2024, against 2,175 kg in 2023.[@unodc_szr]
      No 2025 or 2026 aggregate was published; recent cases concern licensed-import disputes and the
      Srugo plants case.[@srugo26]
    sources:
      - unodc_crimes
      - unodc_szr
      - srugo26
