segments:
  possession:
    text: >-
      Illegal under a zero-tolerance policy. The Criminal Code punishes even the use of narcotics
      with up to five years in prison; someone who voluntarily surrenders a small personal amount
      may be spared.
    sources:
      - cr
      - wiki
  cultivation:
    text: Cultivation is punished with correctional labour or up to three years, more if for sale.
    sources:
      - cr
  enforcement:
    text: >-
      Among the most closed and punitive systems in the region, with little independent information
      on how cases are handled.
    sources:
      - en
      - cr
  sharing:
    text: >-
      Manufacture, storage or transport for distribution carries three to ten years, rising to
      twelve to twenty with confiscation of property.
    sources:
      - cr
  consumption:
    text: Use is itself a crime with up to five years.
    sources:
      - cr
  access:
    text: None.
    sources:
      - wiki
context:
  production:
    text: None.
    sources:
      - wiki
  products:
    text: None. Even nasvay, a chewing tobacco common across Central Asia, is banned.
    sources:
      - en
      - wiki
  medical:
    text: No medical cannabis.
    sources:
      - cr
  consequences:
    text: Users are registered and can be sent to compulsory treatment.
    sources:
      - en
  planting:
    seeds: grey
    seeds_trade: unclear
    clones: illegal
    clones_trade: banned
    text: >-
      Article 19 of the 2017 narcotics law bans cultivation of listed plants, defined as
      sowing and growing, and allows it only to enterprises holding a permit, within state
      quotas. The law names hemp among narcotic-containing plants and does not mention seeds.
    sources:
      - law17
