name: Turkmenistan
region: Asia
iso_numeric: 795
recreational: illegal
medical: none
updated: '2026-10-24'
summary: >-
  Cannabis remains illegal. Small-amount possession and use can bring a fine or administrative
  detention; criminal possession carries up to five years.
scores:
  possession: 0
  cultivation: 0
  enforcement: 1
  sharing: 0
  consumption: 0
  access: 0
segments:
  possession:
    text: >-
      The Administrative Offences Code covers acquiring or holding a minor quantity without
      intent to supply, and use, with a fine of one to three base units and confiscation or up
      to 15 days’ administrative detention; quantities are set in separate regulations.[@admin]
      The Criminal Code’s ordinary non-supply offence allows a fine of 40–100 base units or up
      to five years in prison; repeated or group offending carries three to ten years. Criminal
      exemption requires voluntary surrender and active help against drug offences.[@code]
    sources:
      - admin
      - code
    currency: TMT
    penalties:
      - label: Small amount, administrative
        treatment: civil
        term: Small possession
        fine_min: 100
        fine: 300
        note: Plus confiscation, or up to 15 days' detention
      - label: Above the small threshold, no supply intent
        treatment: criminal
        term: Possession
        prison: 5 years
        fine_min: 4000
        fine: 10000
      - label: Repeated or group possession
        treatment: criminal
        term: Possession
        prison_min: 3 years
        prison: 10 years
  cultivation:
    text: >-
      Sowing or growing prohibited drug-containing plants, expressly including cannabis, allows
      up to two years’ corrective labour or two to five years in prison, with possible
      additional residence restrictions. Repeated, group or large-scale offending carries five
      to ten years.[@code] Controlled cultivation is reserved to permitted enterprises and
      institutions within state quotas.[@law17]
    sources:
      - code
      - law17
    currency: TMT
    penalties:
      - label: Ordinary cultivation
        treatment: criminal
        term: Cultivation
        prison_min: 2 years
        prison: 5 years
        note: Corrective labour up to two years is an alternative
      - label: Repeated, group or large-scale
        treatment: criminal
        term: Cultivation
        prison_min: 5 years
        prison: 10 years
      - label: Especially large-scale
        treatment: criminal
        term: Cultivation
        prison_min: 10 years
        prison: 15 years
  enforcement:
    text: >-
      The administrative small-amount offence allows a fine or up to 15 days’ detention.[@admin]
      Criminal drug offences carry longer terms, including five to twelve years for supply and
      fifteen to twenty-five years in the most serious supply tier.[@code]
    sources:
      - admin
      - code
  sharing:
    text: >-
      Unauthorised supply and holding drugs with intent to supply carry five to twelve years,
      rising to eight to twenty years for repeated, group or large-quantity offending and
      fifteen to twenty-five years in the highest tier.[@code] The drug law defines acquisition
      to include receiving drugs as a gift or in exchange.[@law17]
    sources:
      - code
      - law17
    currency: TMT
    penalties:
      - label: Supply or possession with intent
        treatment: criminal
        term: Trafficking
        prison_min: 5 years
        prison: 12 years
      - label: Repeated, group or large amount
        treatment: criminal
        term: Trafficking
        prison_min: 8 years
        prison: 20 years
      - label: Organised or especially large
        treatment: criminal
        term: Trafficking
        prison_min: 15 years
        prison: 25 years
  consumption:
    text: >-
      Consuming narcotic drugs without a doctor’s order is prohibited.[@law17] The
      Administrative Offences Code includes use in its small-amount drug offence, punishable by
      a fine of one to three base units and confiscation or up to 15 days’ detention.[@admin]
    sources:
      - law17
      - admin
  access:
    text: >-
      Recreational supply remains prohibited under the criminal drug-supply rules.[@code] The
      general controlled-medicine route requires special prescriptions and licensed pharmacies
      in the state healthcare system.[@law17]
    sources:
      - code
      - law17
context:
  production:
    status: medical
    text: >-
      The drug law allows controlled plants to be grown only by permitted enterprises and
      institutions, within state quotas and for industrial, medical or scientific purposes.
      Scientific and educational drug handling is reserved to specially licensed state
      institutions.[@law17]
    sources:
      - law17
  medical:
    text: >-
      No medical cannabis programme or registered cannabis medicine was found. The general
      controlled-medicine rules require special prescriptions and supply through licensed state
      pharmacies, but cannabis is treated as a controlled plant rather than a medicine.[@law17]
    sources:
      - law17
  consequences:
    text: >-
      The drug law provides for registration and medical monitoring of people diagnosed with
      drug dependence. A court can order compulsory treatment where a diagnosed person avoids
      observation and treatment and continues using; specified occupations can be restricted
      after medical assessment, with a right to challenge the decision.[@law17]
    sources:
      - law17
  planting:
    seeds: grey
    seeds_trade: unclear
    clones: illegal
    clones_trade: banned
    text: >-
      The cultivation rule covers sowing and growing controlled plants and reserves permission
      to enterprises and institutions within state quotas.[@law17] The Criminal Code expressly
      names cannabis among the plants covered by the unauthorised cultivation offence.[@code]
    sources:
      - law17
      - code
  visitors:
    status: none
    text: >-
      Recreational drug supply remains prohibited.[@code] The administrative code permits a fine
      or detention for small-amount possession and use, and the criminal code applies to visitors
      as to residents.[@admin,code] No visitor exemption was found.[@law17]
    sources:
      - code
      - admin
      - law17
  clubs:
    status: none
    text: >-
      Controlled cultivation is limited to permitted enterprises and institutions, within state
      quotas; drug consumption requires a doctor’s order.[@law17] Unauthorised supply is a
      criminal offence, leaving no lawful recreational growing-and-sharing club route.[@code]
    sources:
      - law17
      - code
  recreational:
    text: >-
      There is no legal recreational supply. Small-amount possession or use brings a fine of
      100–300 TMT and confiscation, or up to 15 days' detention; above the small threshold
      possession is criminal.[@admin,code] No adult-use outlet or tolerance policy was found.[@code]
    sources:
      - admin
      - code
  hemp:
    status: none
    text: >-
      No hemp or CBD regime and no THC threshold. The drug law allows controlled plants to be
      grown only by permitted enterprises and institutions for industrial, medical or scientific
      purposes, within state quotas; no commercial hemp licence or CBD route was found.[@law17]
    sources:
      - law17
  driving:
    status: impairment
    text: >-
      The Administrative Code punishes driving in a state of intoxication with a licence
      restriction of six to twelve months; a repeat brings 15 days' arrest and a one-to-two-year
      restriction, and handing the wheel to an intoxicated person brings a fine.[@admin] The
      Criminal Code covers intoxicated driving causing harm, with up to two years.[@code] There is
      no numeric THC limit.[@admin]
    sources:
      - admin
      - code
  black_market:
    text: >-
      No official cannabis seizure series has been published since 2016. The last detailed figures
      are 19.9 kg of herbal cannabis and 5.38 kg of resin in 2016, and 9.1 kg of herb in the first
      nine months of 2020.[@cadap] Two 2023 border cases involved 159 kg and 60 kg of marijuana;
      no later cannabis total was found.[@hronika23]
    sources:
      - cadap
      - hronika23
  arrests:
    text: >-
      No national cannabis arrest count is published. The authorities recorded 425 drug offences in
      the first nine months of 2021 and 347 in 2020, all drugs.[@cadap] In 2026 Russia extradited a
      Turkmen citizen charged under article 327(2) over more than 100 g of opium, showing the supply
      tier in use but not a cannabis case.[@hronika26]
    sources:
      - cadap
      - hronika26
  death_penalty:
    text: >-
      No cannabis offence can carry death. Turkmenistan abolished the death penalty in 1999, the
      Criminal Code's list of punishments contains no death penalty, and imprisonment is capped at
      25 years; the highest cannabis supply tier is 15–25 years.[@code]
    sources:
      - code
