name: Niger
region: Africa
iso_numeric: 562
recreational: illegal
medical: none
updated: 2026-10-13
summary: >-
  Cannabis is a high-risk drug under the 1999 ordinance; a small amount for personal use carries
  one to six months in prison and a fine, trafficking ten to twenty years.
scores:
  possession: 1
  cultivation: 1
  enforcement: 1
  sharing: 1
  consumption: 1
  access: 0
segments:
  possession:
    text: >-
      Cannabis and cannabis resin are in Table I (high-risk drugs) of Ordinance 99-42 of 23
      September 1999. For a small amount held, bought or grown for personal use, Article 145 sets
      two months to one year and a fine of 500,000 to 1,000,000 CFA francs for a high-risk drug
      (cannabis oil included), and one to six months and 250,000 to 500,000 CFA francs for a
      cannabis derivative other than the oil. The court may waive the penalty for a first offender
      who solemnly promises not to reoffend. Larger amounts fall under Article 96 (10 to 20 years).
    sources:
      - law
  cultivation:
    text: >-
      Article 8 bans growing the cannabis plant, and landowners must destroy plantations on their
      land. Growing high-risk drugs falls under the 10-to-20-year trafficking tier; a small amount
      grown for personal use gets the lighter Article 145 tier.
    sources:
      - law
  enforcement:
    text: >-
      The ordinance allows prison even for a small personal amount (Article 145) and sets 10 to 20
      years for the main offences. How often users are jailed is not shown by the text.
    sources:
      - law
  sharing:
    text: >-
      Giving or offering a high-risk drug to a person for their own use carries one to five years
      and a fine of 100,000 to 500,000 CFA francs (Article 98). Selling, distributing or delivering
      carries 10 to 20 years (Article 96).
    sources:
      - law
  consumption:
    text: >-
      Article 144 forbids using controlled drugs without a medical prescription and orders any drug
      found on a user seized. The penalty set for users in the text is the possession tier of
      Article 145.
    sources:
      - law
  access:
    text: >-
      None found. Growing, selling and holding high-risk drugs are banned (Articles 8, 96).
    sources:
      - law
context:
  production:
    text: Reliable national information about lawful cannabis production was not established by the retained sources.
    sources: []
  products:
    text: Reliable national information about legally available cannabis products was not established by the retained sources.
    sources: []
  medical:
    text: The retained sources do not establish whether a medical cannabis programme operates.
    sources: []
  consequences:
    text: The retained sources do not establish collateral consequences beyond the penalties described above.
    sources: []
  planting:
    seeds: grey
    seeds_trade: unclear
    clones: illegal
    clones_trade: banned
    text: >-
      Article 8 of Ordinance 99-42 bans growing the cannabis plant anywhere in the country and
      obliges whoever owns or occupies land to destroy any plants that come up. The ordinance
      does not mention seeds.
    sources:
      - o9942
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited.
    sources:
      - law
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone, so a visitor has no lawful way to buy
      cannabis. The sources behind this profile describe no separate rule for visitors.
    sources:
      - law
  black_market:
    text: >-
      Figures reported by the government to the UN drugs office record 10,762 kg of herbal
      cannabis seized in 2023, against 4,272 kg in 2022, and 77.5 kg of cannabis resin
      seized in 2023, against 10.5 kg in 2022. The UN publishes them as kilogram
      equivalents, and countries count seizures differently, so the figures are not
      comparable across borders.
    sources:
      - unodc_szr
