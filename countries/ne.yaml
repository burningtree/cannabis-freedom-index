name: Niger
region: Africa
iso_numeric: 562
recreational: illegal
medical: none
updated: 2026-10-21
summary: >-
  Cannabis is a high-risk drug under the 1999 ordinance. Small personal possession and growing
  have shorter prison ranges, a fine, or both; a fine alone is expressly possible.
scores:
  possession: 1
  cultivation: 1
  enforcement: 1
  sharing: 1
  consumption: 1
  access: 0
segments:
  possession:
    text: >-
      Cannabis and cannabis resin appear in Table I, the high-risk category. Article 145 gives
      a separate tier for small quantities held, bought or grown for personal consumption: high-risk
      plants or substances, including cannabis oil, carry two months to one year, a fine of
      500,000–1 million CFA francs, or both. Non-oil cannabis derivatives carry one to six months,
      a fine of 250,000–500,000 francs, or both. No gram limit is given.
    sources: [law, compilation]
  cultivation:
    text: >-
      Article 8 prohibits growing cannabis and requires landowners, operators and occupiers to
      destroy plants growing on their land. Article 145 expressly includes a small personal crop
      in the shorter penalty tiers described for possession, without a fixed plant limit.
    sources: [law]
  enforcement:
    text: >-
      The law allows prison or a fine alone for small personal quantities. Courts may invite a
      dependent person convicted of specified offences to undergo treatment instead of or alongside
      punishment; evading those measures carries one to five years, a fine, or both. The retained
      sources do not establish typical sentencing for cannabis users.
    sources: [law]
  sharing:
    text: >-
      Giving or offering a high-risk drug directly for another person's consumption carries one
      to five years, a fine of 100,000–500,000 CFA francs, or both. General high-risk trafficking
      under Article 96 carries ten to twenty years, a fine of 1–20 million francs, or both.
    sources: [law]
  consumption:
    text: >-
      Article 144 prohibits using controlled drugs outside a medical prescription and permits
      confiscation even without prosecution. The separate penalty in Article 145 expressly covers
      possession, purchase and growing for personal consumption.
    sources: [law]
  access:
    text: >-
      None found. Growing, selling and holding high-risk drugs are banned (Articles 8, 96).
    sources:
      - law
context:
  production:
    text: Reliable national information about lawful cannabis production was not established by the retained sources.
    sources: []
  products:
    text: Reliable national information about legally available cannabis products was not established by the retained sources.
    sources: []
  medical:
    text: The retained sources do not establish whether a medical cannabis programme operates.
    sources: []
  consequences:
    text: >-
      For the production, trafficking and related offences listed in Articles 94–102, courts may
      add restrictions on residence, civic rights, travel, driving or professional activity. They may
      exclude a convicted foreigner permanently or for ten to twenty years. Small personal quantities
      are dealt with separately in Article 145.
    sources: [law]
  planting:
    seeds: grey
    seeds_trade: unclear
    clones: illegal
    clones_trade: banned
    text: >-
      Article 8 prohibits growing cannabis and requires destruction of plants on occupied land.
      Small personal cultivation still carries criminal penalties under Article 145. The retained
      clauses do not settle ungerminated seed possession or trade separately.
    sources:
      - law
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited.
    sources:
      - law
  visitors:
    status: none
    text: >-
      Visitors have no lawful recreational supply route. For specified production and trafficking
      offences, Article 113 permits permanent exclusion or exclusion for ten to twenty years of a
      convicted foreigner. That clause covers Articles 94–102; small personal quantities are
      addressed separately in Article 145.
    sources:
      - law
  black_market:
    text: >-
      Figures reported by the government to the UN drugs office record 10,762 kg of herbal
      cannabis seized in 2023, against 4,272 kg in 2022, and 77.5 kg of cannabis resin
      seized in 2023, against 10.5 kg in 2022. The UN publishes them as kilogram
      equivalents, and countries count seizures differently, so the figures are not
      comparable across borders.
    sources:
      - unodc_szr
