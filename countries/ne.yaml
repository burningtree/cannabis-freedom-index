segments:
  possession:
    text: >-
      Cannabis and cannabis resin are in Table I (high-risk drugs) of Ordinance 99-42 of 23
      September 1999. For a small amount held, bought or grown for personal use, Article 145 sets
      two months to one year and a fine of 500,000 to 1,000,000 CFA francs for a high-risk drug
      (cannabis oil included), and one to six months and 250,000 to 500,000 CFA francs for a
      cannabis derivative other than the oil. The court may waive the penalty for a first offender
      who solemnly promises not to reoffend. Larger amounts fall under Article 96 (10 to 20 years).
    sources:
      - law
  cultivation:
    text: >-
      Article 8 bans growing the cannabis plant, and landowners must destroy plantations on their
      land. Growing high-risk drugs falls under the 10-to-20-year trafficking tier; a small amount
      grown for personal use gets the lighter Article 145 tier.
    sources:
      - law
  enforcement:
    text: >-
      The ordinance allows prison even for a small personal amount (Article 145) and sets 10 to 20
      years for the main offences. How often users are jailed is not shown by the text.
    sources:
      - law
  sharing:
    text: >-
      Giving or offering a high-risk drug to a person for their own use carries one to five years
      and a fine of 100,000 to 500,000 CFA francs (Article 98). Selling, distributing or delivering
      carries 10 to 20 years (Article 96).
    sources:
      - law
  consumption:
    text: >-
      Article 144 forbids using controlled drugs without a medical prescription and orders any drug
      found on a user seized. The penalty set for users in the text is the possession tier of
      Article 145.
    sources:
      - law
  access:
    text: >-
      None found. Growing, selling and holding high-risk drugs are banned (Articles 8, 96).
    sources:
      - law
