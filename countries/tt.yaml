name: Trinidad and Tobago
region: North America
iso_numeric: 780
recreational: legal
medical: limited
updated: 2026-10-25
summary: Adults may ordinarily hold up to 30 g and grow four plants, but possession around children at specified premises or on school buses can bring five years in prison. There is no legal market.
scores:
  possession: 5
  cultivation: 4
  enforcement: 6
  sharing: 1
  consumption: 3
  access: 0
answers:
  carry:
    answer: limited
    text: Up to 30 g ordinarily; school buses and specified premises with children remain criminal
  caught:
    answer: limited
    label: Depends on the setting
    text: Even within the quantity allowance, possession on a school bus or at specified premises with children can bring five years
segments:
  possession:
    text: >-
      The ordinary exemption is 30 g of cannabis or 5 g of resin. It does not override section 5C(b):
      possession on a school bus, or at premises where children are present for education, sport or
      cultural activities, carries TT$250,000 and five years on summary conviction. The separate
      school-vicinity trafficking presumption in section 5(7) expressly excludes people covered by
      section 5(2). Moderate overages have a ticket scheme; larger amounts remain criminal.
    sources:
      - act24
  cultivation:
    text: Each adult may grow up to four plants at home. More than four is an offence.
    sources:
      - wiki
      - tni
  enforcement:
    text: >-
      The quantity exemption applies in permitted settings. Section 5C(b) carries five years even for
      small amounts in its school-bus and children’s-activity settings. Public use has a separate
      TT$2,000 ticket scheme. Trafficking and larger quantities bring criminal penalties.
    sources:
      - act24
  sharing:
    text: >-
      The 2019 amendment removed penalties for possession and growing, not for supply. Giving
      cannabis to another person stays under the supply offences, and selling remains a crime.
    sources:
      - wiki
      - tni
  consumption:
    text: >-
      Private use is generally lawful. Public smoking or use falls under section 5A: a TT$50,000 court
      fine, with a separate TT$2,000 fixed-penalty route. The five-year sentence for possession at
      specified children’s premises is a different offence.
    sources:
      - act24
      - legalaid
  access:
    text: >-
      None in operation. The Cannabis Control Act, Act No. 10 of 2022, was assented to on 17 June
      2022 and published in the Gazette on 23 June 2022. Section 2 brings it into operation only on
      a date the President fixes by proclamation. Parliament's record of the 2020 bill, which
      became that Act, still says assent is awaiting proclamation. The only lawful source today is
      an adult's own four plants.
    sources:
      - cca22
      - cca22page
      - ccb20
context:
  production:
    text: >-
      The 2022 Act would create a Cannabis Licensing Authority and licences for cultivation,
      processing and sale, once the President proclaims a commencement date. No proclamation is
      recorded, so commercial cultivation is not licensed.
    sources:
      - cca22
      - ccb20
  products:
    text: Home-grown flower and up to 5 g of resin. Nothing is lawfully sold.
    sources:
      - wiki
  medical:
    text: >-
      The 2022 Act provides for medicinal-cannabis licences, including a dispensary licence, but
      those licences do not operate until the President proclaims a commencement date. There is no
      working medical programme.
    sources:
      - cca22
      - ccb20
  consequences:
    text: >-
      Section 5D provides discharge and expungement routes for earlier small-possession cases; a
      pardon may follow expungement. New offences can still create a criminal record, including
      section 5C(b) possession in specified settings involving children.
    sources:
      - act24
      - legalaid
  planting:
    seeds: legal
    seeds_trade: banned
    clones: legal
    clones_trade: banned
    text: >-
      The 2019 amendment defines cannabis to include the plant's seeds, other than sterilised
      seed that cannot germinate. Seeds therefore count towards the thirty grammes an adult
      may hold, and a person may grow or have up to four growing plants. Because seeds and
      plants are cannabis in law, supplying them falls under the trafficking offences.
    sources:
      - act24
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and no law provides for them: the 2019 amendment removed
      penalties for possession and home growing but not for supply, and selling remains a
      crime.
    sources:
      - wiki
      - tni
  visitors:
    status: none
    text: >-
      There is no legal recreational market for visitors or residents. The ordinary personal quantity
      allowance does not permit possession on school buses or at premises where children attend
      education, sport or cultural activities; section 5C(b) carries TT$250,000 and five years on
      summary conviction.
    sources:
      - act24
  driving:
    status: impairment
    text: >-
      Motor Vehicles and Road Traffic Act section 70 prohibits driving, attempting to
      drive or being in charge on a road while drug influence prevents proper vehicle
      control. The Transport Ministry's published text gives a first-conviction penalty
      of TT$12,000 and three years' imprisonment, rising to TT$22,500 and five years on
      a subsequent conviction. Two consecutive offences normally bring three years'
      disqualification, subject to special reasons and the court's power to impose a
      longer ban; a third conviction brings permanent disqualification. Police may arrest
      without a warrant. Section 70A separately concerns alcohol concentrations: the
      Finance Act 2025 doubled its fines, without amending section 70's drug-impairment
      penalty. Separately, Dangerous Drugs Act section 5C(c) covers control of a motor vehicle,
      aircraft or ship while under cannabis influence, carrying TT$250,000 and five years on
      summary conviction. No numeric THC allowance was established in the sources reviewed.
    sources:
      - mowtdui
      - finance2025
      - act24
