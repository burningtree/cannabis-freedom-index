name: Trinidad and Tobago
region: North America
iso_numeric: 780
recreational: legal
medical: limited
updated: 2026-10-23
summary: Since 2019 adults may possess up to 30 g and grow four plants. There is no legal market yet.
scores:
  possession: 5
  cultivation: 4
  enforcement: 6
  sharing: 1
  consumption: 3
  access: 0
segments:
  possession:
    text: >-
      Since 23 December 2019 an adult may possess up to 30 g of cannabis or 5 g of resin with no
      penalty. Between 30 and 60 g (5–10 g of resin) is a fixed-penalty ticket rather than a
      prosecution. Above 60 g is a criminal offence.
    sources:
      - wiki
      - tni
  cultivation:
    text: Each adult may grow up to four plants at home. More than four is an offence.
    sources:
      - wiki
      - tni
  enforcement:
    text: >-
      Nothing within the limits, a ticket for moderate overages, and criminal penalties including
      prison for larger amounts, trafficking and supplying minors.
    sources:
      - tni
      - wiki
  sharing:
    text: >-
      The 2019 amendment removed penalties for possession and growing, not for supply. Giving
      cannabis to another person stays under the supply offences, and selling remains a crime.
    sources:
      - wiki
      - tni
  consumption:
    text: >-
      Use in private is lawful. Smoking in a public place, at a workplace, or near schools remains
      an offence, as does using while driving or operating machinery.
    sources:
      - tni
      - wiki
  access:
    text: >-
      None in operation. The Cannabis Control Act, Act No. 10 of 2022, was assented to on 17 June
      2022 and published in the Gazette on 23 June 2022. Section 2 brings it into operation only on
      a date the President fixes by proclamation. Parliament's record of the 2020 bill, which
      became that Act, still says assent is awaiting proclamation. The only lawful source today is
      an adult's own four plants.
    sources:
      - cca22
      - cca22page
      - ccb20
context:
  production:
    text: >-
      The 2022 Act would create a Cannabis Licensing Authority and licences for cultivation,
      processing and sale, once the President proclaims a commencement date. No proclamation is
      recorded, so commercial cultivation is not licensed.
    sources:
      - cca22
      - ccb20
  products:
    text: Home-grown flower and up to 5 g of resin. Nothing is lawfully sold.
    sources:
      - wiki
  medical:
    text: >-
      The 2022 Act provides for medicinal-cannabis licences, including a dispensary licence, but
      those licences do not operate until the President proclaims a commencement date. There is no
      working medical programme.
    sources:
      - cca22
      - ccb20
  consequences:
    text: >-
      The 2019 reform allowed people with past convictions for small amounts to apply for a pardon
      and have records cleared.
    sources:
      - tni
  planting:
    seeds: legal
    seeds_trade: banned
    clones: legal
    clones_trade: banned
    text: >-
      The 2019 amendment defines cannabis to include the plant's seeds, other than sterilised
      seed that cannot germinate. Seeds therefore count towards the thirty grammes an adult
      may hold, and a person may grow or have up to four growing plants. Because seeds and
      plants are cannabis in law, supplying them falls under the trafficking offences.
    sources:
      - act24
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and no law provides for them: the 2019 amendment removed
      penalties for possession and home growing but not for supply, and selling remains a
      crime.
    sources:
      - wiki
      - tni
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone, so a visitor has no lawful way to buy
      cannabis. The sources behind this profile describe no separate rule for visitors.
    sources:
      - econ
      - wiki
  driving:
    status: impairment
    text: >-
      Motor Vehicles and Road Traffic Act section 70 prohibits driving, attempting to
      drive or being in charge on a road while drug influence prevents proper vehicle
      control. The Transport Ministry's published text gives a first-conviction penalty
      of TT$12,000 and three years' imprisonment, rising to TT$22,500 and five years on
      a subsequent conviction. Two consecutive offences normally bring three years'
      disqualification, subject to special reasons and the court's power to impose a
      longer ban; a third conviction brings permanent disqualification. Police may arrest
      without a warrant. Section 70A separately concerns alcohol concentrations: the
      Finance Act 2025 doubled its fines, without amending section 70's drug-impairment
      penalty. No numeric THC allowance was established in the sources reviewed.
    sources:
      - mowtdui
      - finance2025
