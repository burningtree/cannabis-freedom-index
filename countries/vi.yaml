name: US Virgin Islands
region: North America
iso_numeric: 850
dependency:
  of: us
  kind: Unincorporated territory
  note: >-
    The United States Virgin Islands are an unincorporated territory of the United States with
    their own legislature and laws. Federal drug law applies there as in the states.
recreational: legal
medical: limited
updated: '2026-10-24'
summary: >-
  The Cannabis Use Act sets adult possession limits at two ounces. Qualified resident patients
  may grow six flowering and six immature plants. By September 2026 the first commercial grow
  had approval to operate and the testing lab was operational; an October update still reported
  no dispensary sales.
scores:
  possession: 5
  cultivation: 1
  enforcement: 6
  sharing: 3
  consumption: 3
  access: 0
segments:
  possession:
    text: >-
      The Cannabis Use Act sets adult limits at two ounces of cannabis, 14 grams of concentrate
      and one ounce of cannabis products. Qualified patients may possess four ounces of
      cannabis, one ounce of concentrate and two ounces of products.[@act]
    sources:
      - act
  cultivation:
    text: >-
      Qualified resident patients may grow six flowering and six immature plants for personal
      medical use on private property with the landowner’s consent; the ordinary per-address
      ceiling is twelve of each.[@act] Sacramental organisations can register to grow on
      members’ behalf subject to consent and other requirements.[@sacramental] Commercial and
      micro-cultivation use separate licences and permits.[@act]
    sources:
      - act
      - sacramental
  enforcement:
    text: >-
      Conduct compliant with the Cannabis Use Act is exempted from the older controlled-drug
      chapter.[@act] Governor Bryan announced simple-possession pardons in 2023 and asked
      eligible people to apply. Later that year, Government House sought people eligible for
      expungement because gaps in judicial data complicated automatic record
      clearance.[@signing,expunge]
    sources:
      - act
      - signing
      - expunge
  sharing:
    text: >-
      Transfers for payment require the relevant licence or permit. The law expressly protects
      qualified patients’ compliant transfers and creates separate licensed distribution and
      consumption-permit routes.[@act]
    sources:
      - act
  consumption:
    text: >-
      Public consumption requires an authorised lounge, cannabis-use or temporary-use permit.
      The law also restricts consumption on public transport and operating vehicles or vessels
      under the influence.[@act] Government House reiterated that public consumption and
      possession or use at federal facilities remained prohibited.[@clarification]
    sources:
      - act
      - clarification
  access:
    text: >-
      Conditional dispensary approvals were published in January 2026.[@conditional] In
      September, regulators reported the first commercial cultivation certificate on St. Croix
      and an operational laboratory awaiting plants for testing.[@grow] An October update still
      reported no dispensary open for sales.[@retailstatus]
    sources:
      - conditional
      - grow
      - retailstatus
context:
  production:
    status: open
    text: >-
      Commercial cultivation requires a licence, and micro-cultivation has a separate permit
      route.[@act] Regulator Joanne Moorehead reported the first commercial cultivation
      certificate to operate for a Tier 1 St. Croix grower in September 2026.[@grow]
    sources:
      - act
      - grow
  products:
    text: >-
      The 2026 hemp law requires cannabis-regulator licences or permits for intoxicating hemp
      and artificially derived cannabinoids, including specified THCA products. Licensed
      retailers must verify buyers are at least 21, use independent testing and comply with
      child-resistant, tamper-evident packaging requirements.[@hemp] A March amendment replaced
      the original inventory freeze with reporting and sell-or-dispose deadlines.[@hempamend]
    sources:
      - hemp
      - hempamend
  medical:
    text: >-
      The territory approved its medical cannabis programme in January 2019, sponsored by
      Positive T.A. Nelson.[@medicalsign] The 2023 law replaced it with a combined medical,
      adult-use and sacramental system; qualified resident patients have a personal-growing
      route and higher possession limits.[@act] Retail opening still awaited an operating supply
      chain in the October 2026 market update.[@retailstatus]
    sources:
      - medicalsign
      - act
      - retailstatus
  consequences:
    text: >-
      Government House distinguishes a pardon, which forgives the offence, from expungement,
      which clears the record. Its 2023 announcement described automatic relief for eligible
      simple-possession convictions involving up to two ounces, followed by a call for
      applicants to help resolve gaps in court data.[@signing,expunge]
    sources:
      - signing
      - expunge
  clubs:
    status: none
    text: >-
      The law provides licensed adult-use lounges and separate consumption permits.[@act]
      Faith-based organisations have a sacramental registration route requiring incorporation,
      at least ten members and permission to grow on members’ behalf.[@sacramental]
    sources:
      - act
      - sacramental
  visitors:
    status: none
    text: >-
      An October 2026 market update still reported no open dispensaries.[@retailstatus]
      Government House says personal transport of cannabis between the islands remains
      prohibited.[@clarification]
    sources:
      - retailstatus
      - clarification
