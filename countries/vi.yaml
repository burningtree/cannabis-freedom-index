name: US Virgin Islands
region: North America
iso_numeric: 850
dependency:
  of: us
  kind: Unincorporated territory
  note: >-
    The United States Virgin Islands are an unincorporated territory of the United States with
    their own legislature and laws. Federal drug law applies there as in the states.
population:
  2020: 87146
cannabis_use:
  prevalence: 4.98
  estimate: true
  users: 2700
recreational: legal
medical: limited
updated: 2026-10-17
summary: >-
  The Cannabis Use Act of January 2023 legalised adult use, with a limit of 2 oz, after possession
  of an ounce had been reduced to a civil fine in 2014. Public use and carrying cannabis between the
  islands stay illegal. Licensed growers and dispensaries have been approved, but sales could not
  begin until a testing laboratory opened, expected in autumn 2026.
scores:
  possession: 5
  cultivation: 1
  enforcement: 6
  sharing: 3
  consumption: 3
  access: 0
segments:
  possession:
    text: >-
      The Cannabis Use Act (Act 8680), signed on 18 January 2023, lets adults 21 and over possess up
      to 2 oz of cannabis, half an ounce of concentrate and 1 oz of products such as edibles; medical
      patients may hold twice as much. Since a 2014 law passed over the governor's veto, possessing an
      ounce or less had been a civil offence with a $100 to $200 fine instead of up to a year in jail.
    sources:
      - grsm
      - wiki
  cultivation:
    text: >-
      There is no general right to grow at home: medical patients may not grow their own, and only
      members of established Rastafari nonprofits may grow on private property under cultivation
      permits. Commercial cultivation and micro-cultivation are licensed.
    sources:
      - grsm
      - via26
  enforcement:
    text: >-
      Simple possession has been decriminalised throughout the territory, and within the legal
      limits nothing is punished. The government offered pardons for past simple possession
      convictions, about 300 over twenty years, and convictions for up to 2 oz are to be expunged
      automatically.
    sources:
      - vic23
      - vino23
  sharing:
    text: >-
      The Act legalised distribution through licensed businesses. The sources reviewed do not set out
      a rule on gifts between adults.
    sources:
      - vino23
  consumption:
    text: >-
      The Act legalises use by adults; in 2023 the government stressed that this would take effect
      only with the regulations, and that public consumption, consumption at federal facilities and
      carrying cannabis from one island to another would stay prohibited even then.
    sources:
      - vic23
  access:
    text: >-
      No legal sales yet. The Office of Cannabis Regulation has conditionally approved 15 cultivation
      licences, about nine micro-cultivation permits and 10 dispensary licences, but said in August
      2026 that it could not authorise commercial sales until a testing laboratory was working,
      possibly from October.
    sources:
      - via26
      - sts26
context:
  production:
    text: >-
      Licensed cultivation was expected to start within weeks of August 2026. Business owners must
      have lived in the territory for at least ten of the last fifteen years.
    sources:
      - via26
      - grsm
  products:
    text: >-
      Hemp products and hemp-derived cannabinoids with very low THC may be sold legally by licensed
      hemp businesses.
    sources:
      - vic23
  medical:
    text: >-
      Medical cannabis was legalised by the Medical Cannabis Patient Care Act, signed on 19 January
      2019, which provided for licensed cultivators and dispensaries. Medical patients are exempt from the
      dispensary sales tax, but like everyone else they wait for licensed dispensaries to open.
    sources:
      - wiki
      - grsm
  consequences:
    text: >-
      Dispensary sales will be taxed at no less than 18%. A task force was set up with $250,000 to work through the expungement of past convictions.
    sources:
      - grsm
  clubs:
    status: none
    text: >-
      No cannabis clubs are known. Legal distribution is reserved for licensed businesses.
    sources:
      - vino23
  visitors:
    status: none
    text: >-
      No legal sales have begun, so a visitor has no lawful way to buy cannabis yet. Taking cannabis
      between islands is prohibited.
    sources:
      - via26
      - vic23
