name: Seychelles
region: Africa
iso_numeric: 690
recreational: illegal
medical: limited
updated: '2026-10-21'
summary: >-
  CBD medicine rules introduced in 2020 require specialist assessment and public-health approval;
  recreational cannabis remains illegal.
scores:
  possession: 1
  cultivation: 1
  enforcement: 2
  sharing: 1
  consumption: 1
  access: 1
segments:
  possession:
    text: >-
      Cannabis is a Class B controlled drug and unauthorised possession remains a criminal offence.
      The 2016 law removed the old mandatory minimum for the cannabis trafficking offence considered
      in R v Ah Kong; the judge gave that first offender a suspended sentence and a fine.
    sources:
      - ahkong
  cultivation:
    text: >-
      Cultivation carries a maximum of twenty years. The 2020 medical regulations restate the ban:
      regulation 19 says no person shall cultivate cannabis of any form or type, and lets police
      arrest without a warrant.
    sources:
      - reg
      - wiki
  enforcement:
    text: >-
      Sentences depend on the offence and circumstances. In October 2016 Paul Ah Kong received a
      suspended two-year term and a 15,000-rupee fine for trafficking 115 grams of cannabis. In
      January 2023 the Seychelles Kanabis Association protested custodial cannabis sentences given
      to two other men.
    sources:
      - ahkong
      - nation23
  sharing:
    text: Possession with intent to traffic carries up to fifty years.
    sources:
      - wiki
  consumption:
    text: >-
      Use is an offence; the 2016 Act allows treatment-oriented outcomes for dependent users.
      Regulation 19 of the 2020 medical regulations forbids smoking cannabis of any form, and using
      even the permitted cannabidiol products without authorisation is an offence.
    sources:
      - reg
      - wiki
  access:
    text: >-
      There is no adult-use supply. Rules effective from 1 July 2020 allow an application for
      prescribed CBD medicines after specialist assessment, Public Health Authority approval and
      issuance of a permit. Authorised pharmacies may dispense a maximum 30-day supply.
    sources:
      - reg
context:
  production:
    text: No domestic licensed production; medical products are imported.
    sources:
      - reg
  products:
    text: Approved cannabidiol-based medical products only.
    sources:
      - reg
  medical:
    text: >-
      The 2020 rules cover defined CBD medicines, with THC and specified related substances limited
      to 2% of the CBD content. A specialist must assess the failure of earlier treatments and
      likely benefits and risks before submitting an application. Public-health approval, a permit
      and a prescription are required. The rules followed Ralph Volcere’s case seeking access for
      his mother, who had Alzheimer’s disease.
    sources:
      - reg
      - volcere
  consequences:
    text: A conviction is a criminal record.
    sources:
      - wiki
  planting:
    seeds: grey
    seeds_trade: unclear
    clones: illegal
    clones_trade: banned
    text: >-
      The 2020 medicinal cannabis regulations define cultivating to include "sowing or scattering
      the seed" and planting the cannabis plant "or any part thereof", and state that a person shall
      not cultivate cannabis of any form or type. Patients may receive only imported
      cannabidiol-based products. The regulations do not say whether seed on its own may be held or
      sold; the definition of cannabis in the 2016 Act was not read.
    sources:
      - si25
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited.
    sources:
      - wiki
  visitors:
    status: none
    text: >-
      There is no legal recreational supply. The CBD medicine rules recognise a visiting qualifying
      patient with an equivalent foreign medical document, but require prior written Public Health
      Authority authorisation to enter or leave Seychelles carrying the medicine.
    sources:
      - reg
  driving:
    status: impairment
    text: >-
      Road Transport Act section 24(1)(c) makes it an offence to drive or be in charge of a vehicle
      on a road or public place when drugs cause unfitness to drive. Section 24(5) defines unfitness
      as impaired ability to drive properly; it is not simply a positive-THC rule. The Attorney
      General's publicly linked 2010 edition also contains an in-charge defence where driving while
      unfit was not likely, subject to its further conditions. Section 24(4) requires material
      corroboration when that offence is alleged on a single witness's evidence. Section 27 provides
      licensing consequences and a twelve-month minimum for a section 24(1)(c) conviction unless the
      court finds special reasons. These are findings from that older published edition: subsequent
      amendments, current fine and prison maxima, specimen procedures and the current application of
      the minimum ban still require verification. No 2026 penalty tariff, numerical THC allowance,
      safe waiting period or medical-use exception is inferred from this source. The review date
      records when the source was checked, not a new legal commencement.
    sources:
      - roadtransportpublished
  black_market:
    text: >-
      Figures reported by the government to the UN drugs office record 42.1 kg of herbal cannabis
      seized in 2024, against 31 kg in 2023, and 1,055 kg of cannabis resin seized in 2024, against
      200 kg in 2023. The UN publishes them as kilogram equivalents, and countries count seizures
      differently, so the figures are not comparable across borders.
    sources:
      - unodc_szr
