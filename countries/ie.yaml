segments:
  possession:
    text: >-
      Possession is a criminal offence. Since December 2020 police may give an adult caution instead
      of prosecuting a first cannabis possession, at their discretion and only for people without
      relevant convictions. Otherwise the first two offences are fine-only; a third can bring
      prison. Between late 2020 and early 2024 about 5,100 people were cautioned and over 17,000
      charged.
    sources:
      - ll
      - oe
  cultivation:
    text: Cultivation is a criminal offence, with prison possible even for a few plants.
    sources:
      - gov
  enforcement:
    text: >-
      Cautions and fines for early offences, prison possible from the third. Most people caught are
      still brought to court.
    sources:
      - ll
      - oe
  sharing:
    text: Supply, including unpaid sharing, is an offence.
    sources:
      - gov
  consumption:
    text: Use is prosecuted through the possession offence.
    sources:
      - gov
      - ll
  access:
    text: >-
      No legal adult-use source. A Citizens' Assembly recommended a health-led approach to
      possession in 2023, which has not yet become law.
    sources:
      - ca
      - gov
context:
  production:
    text: No licensed cannabis production.
    sources:
      - gov
  products:
    text: A few specified medical products; CBD products in a grey zone.
    sources:
      - gov
  medical:
    text: >-
      The Medical Cannabis Access Programme covers only three conditions where standard treatment
      has failed, prescribed by consultants; other patients need an individual ministerial licence.
    sources:
      - gov
  consequences:
    text: >-
      A conviction creates a criminal record that affects travel and employment; an adult caution
      does not.
    sources:
      - ll
      - gov
  planting:
    seeds: grey
    seeds_trade: open
    clones: illegal
    clones_trade: banned
    text: >-
      Since 1984 the Misuse of Drugs Act has defined cannabis as any plant of the genus
      Cannabis or any part of it, but not seed separated from the plant. Seeds are therefore
      not a controlled drug. Growing any cannabis plant without a ministerial licence is an
      offence under section 17, and a cutting is itself a plant.
    sources:
      - mda84
      - mda77
  driving:
    status: limit
    text: >-
      Ireland has a fixed limit of 1 nanogram of THC per millilitre of whole blood, at which a
      driver is treated as impaired; for a medicinal product, and under the general offence,
      impairment must be shown. Police may stop at random at designated checkpoints and test
      on suspicion, with roadside oral-fluid tests since April 2017 and blood taken at a
      police station. Exceeding the limit brings a one-year ban; the general impairment
      offence brings at least four years for a first offence and six for later ones. The fine
      is up to 5,000 euros and prison up to six months.
    sources:
      - euda_dd
  clubs:
    status: underground
    text: >-
      Clubs exist without any legal basis. A Europe-wide survey of cannabis social clubs
      carried out in 2018 and 2019 received answers from one club in Ireland, and its authors
      could not say how many more were active. The study notes that the model is prohibited
      throughout the European Union, that clubs sit in a legally sensitive position, and that
      many have been dissolved after court decisions or police raids. Nothing more recent was
      found.
    sources:
      - pardal20
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. British travel advice says possession
      of even small quantities of drugs, including cannabis, carries severe penalties, and
      tells travellers to expect a long jail sentence and heavy fines for possessing, using or
      smuggling them, also in transit. Airport scanners are also used on the baggage of
      passengers in transit.
    sources:
      - ca
      - gov
      - fcdo
