recreational: illegal
medical: limited
updated: '2026-10-28'
summary: >-
  Since September 2026, eligible first-time possession cases can receive a health referral. The
  Medical Cannabis Access Programme covers only a few conditions.
answers:
  caught:
    answer: limited
    label: Referral, fine or prison
    text: >-
      Eligible first-time offences from 1 September 2026 may receive a discretionary health
      referral; possession remains criminal and later offences can bring prison
