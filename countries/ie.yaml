name: Ireland
region: Europe
iso_numeric: 372
recreational: illegal
medical: limited
updated: 2026-10-23
summary: >-
  First-time possession can be handled by an adult caution. The Medical Cannabis Access Programme
  covers only a few conditions.
scores:
  possession: 1
  cultivation: 1
  enforcement: 3
  sharing: 1
  consumption: 1
  access: 1
segments:
  possession:
    text: >-
      Possession is a criminal offence. Since December 2020 police may give an adult caution instead
      of prosecuting a first cannabis possession, at their discretion and only for people without
      relevant convictions. Otherwise the first two offences are fine-only; a third can bring
      prison. Between late 2020 and early 2024 about 5,100 people were cautioned and over 17,000
      charged.
    sources:
      - ll
      - oe
  cultivation:
    text: Cultivation is a criminal offence, with prison possible even for a few plants.
    sources:
      - gov
  enforcement:
    text: >-
      Cautions and fines for early offences, prison possible from the third. Most people caught are
      still brought to court.
    sources:
      - ll
      - oe
  sharing:
    text: Supply, including unpaid sharing, is an offence.
    sources:
      - gov
  consumption:
    text: Use is prosecuted through the possession offence.
    sources:
      - gov
      - ll
  access:
    text: >-
      No legal adult-use source. A Citizens' Assembly recommended a health-led approach to
      possession in 2023, which has not yet become law.
    sources:
      - ca
      - gov
context:
  production:
    text: No licensed cannabis production.
    sources:
      - gov
  products:
    text: A few specified medical products; CBD products in a grey zone.
    sources:
      - gov
  medical:
    text: >-
      The Medical Cannabis Access Programme covers only three conditions where standard treatment
      has failed, prescribed by consultants; other patients need an individual ministerial licence.
      In an October 2026 parliamentary answer, the minister said a review of access, possible
      additional conditions and individual licences was expected to take about twelve months
      from its first meeting on 27 May 2026. This review has not itself expanded eligibility.
    sources:
      - gov
      - review2026
  consequences:
    text: >-
      A conviction creates a criminal record that affects travel and employment; an adult caution
      does not.
    sources:
      - ll
      - gov
  planting:
    seeds: grey
    seeds_trade: open
    clones: illegal
    clones_trade: banned
    text: >-
      Since 1984 the Misuse of Drugs Act has defined cannabis as any plant of the genus
      Cannabis or any part of it, but not seed separated from the plant. Seeds are therefore
      not a controlled drug. Growing any cannabis plant without a ministerial licence is an
      offence under section 17, and a cutting is itself a plant.
    sources:
      - mda84
      - mda77
  driving:
    status: limit
    text: >-
      Ireland sets two limits in whole blood, measured within three hours of driving: 1
      nanogram of THC per millilitre, and 5 nanograms per millilitre of the metabolite
      11-nor-9-carboxy-THC. Reaching either level is an offence without proof of impairment.
      A medical exemption certificate in the prescribed form, signed by the prescribing doctor
      and stating that THC was lawfully prescribed at that time, takes the driver outside
      those two limits. Driving while impaired remains a separate offence. Police may stop at
      random at designated checkpoints and test on suspicion, with roadside oral-fluid tests
      since April 2017 and blood taken at a police station. The threshold offence brings a ban
      of at least one year, or two years for a later offence. The impairment offence brings at
      least four years for a first offence and six for later ones. The fine is up to 5,000
      euros and prison up to six months.
    sources:
      - rta2016
      - rta2010
      - si158
      - rsa
      - euda_dd
  clubs:
    status: underground
    text: >-
      Clubs exist without any legal basis. A Europe-wide survey of cannabis social clubs carried out
      in 2018 and 2019 received answers from one club in Ireland, and its authors could not say how
      many more were active. The study notes that clubs sit in a legally sensitive position and that
      many have been dissolved after court decisions or police raids. No law in Ireland provides for
      them; Malta (since 2021) and Germany (since 2024) license non-profit cannabis associations,
      but only under their own laws. Nothing more recent was found.
    sources:
      - pardal20
      - de_cang
      - mt_cap628
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. Possession is a criminal offence; since
      December 2020 police may give an adult caution instead of prosecuting a first cannabis
      possession, at their discretion and only for people without relevant convictions.
    sources:
      - ll
      - oe
  black_market:
    text: >-
      The EU drugs agency's statistical bulletin records 2,916 kg of herbal cannabis and
      171 kg of cannabis resin seized in Ireland in 2024. Herbal cannabis was seized on
      6,118 occasions and resin on 374. Countries record seizures differently, so the
      figures are not comparable across borders.
    sources:
      - euda_szr
  arrests:
    text: >-
      The Central Statistics Office recorded 16,119 controlled drug incidents in 2024, 7
      per cent fewer than in 2023, a fall it put largely down to fewer incidents of
      possession for sale or supply and for personal use. A breakdown of the same series
      published by the community drugs network Citywide gives 10,701 incidents of
      possession for personal use in 2024, about two thirds of the total, against 4,551
      for sale or supply and 85 for cultivation or manufacture. The figures cover all
      drugs and are not split by substance.
    sources:
      - cso_rc24
      - citywide_le
