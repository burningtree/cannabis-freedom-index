  planting:
    seeds: grey
    seeds_trade: unclear
    clones: illegal
    clones_trade: banned
    text: >-
      The 2002 narcotics control law counts planting, collecting and harvesting plants with
      narcotic effect as manufacture, which needs a licence from the pharmaceuticals authority
      and is otherwise prohibited. It defines narcotic drugs by reference to the 1961
      convention and does not mention seeds.
    sources:
      - l2002
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited.
    sources:
      - cc
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. British travel advice says it is
      illegal to possess or use any type of drug, including cannabis, that trafficking can
      bring a life sentence, and that prisons have very basic facilities.
    sources:
      - cc
      - fcdo
