name: Mongolia
region: Asia
iso_numeric: 496
recreational: illegal
medical: none
updated: 2026-10-14
summary: >-
  Unauthorised acquisition or storage without a selling purpose can bring one to five years of
  travel restriction or imprisonment. Sale-related conduct carries two to eight years; organised
  criminal groups face a separate, higher range.
scores:
  possession: 1
  cultivation: 0
  enforcement: 2
  sharing: 0
  consumption: 1
  access: 0
segments:
  possession:
    text: >-
      Article 20.7(1), as amended in 2020, punishes unlawful preparation, storage, giving to another
      person or acquisition of prohibited narcotic drugs without a selling purpose with one to five
      years of travel restriction or imprisonment. It supplies no small-quantity exemption. A
      separate administrative penalty for consumption alone was not verified.
    sources:
      - cc_mn
  cultivation:
    text: >-
      Article 20.10 punishes unauthorised growing of plants supplying narcotic raw materials with
      one to five years of travel restriction or imprisonment; five to twelve years for an organised
      criminal group. The provision establishes no personal home-growing allowance.
    sources:
      - cc_mn
  enforcement:
    text: >-
      The Criminal Code permits travel restriction instead of imprisonment for Article 20.7(1)
      conduct without a selling purpose. The statute alone does not establish how often courts
      choose that alternative.
    sources:
      - cc_mn
  sharing:
    text: >-
      Giving drugs to another person without a selling purpose falls within Article 20.7(1),
      carrying one to five years of travel restriction or imprisonment. Article 20.7(2) provides two
      to eight years for sale-related conduct; persistent or cross-border conduct carries five to
      twelve years, and an organised criminal group twelve to twenty years or life imprisonment.
      Article 20.8 separately punishes providing premises for drug use with a fine, one to five
      years of travel restriction, or imprisonment in the ordinary case.
    sources:
      - cc_mn
  consumption:
    text: >-
      Article 8 of the narcotics control law prohibits use outside authorised purposes. Criminal
      Code Article 20.7 lists acts including preparation, storage, giving and acquisition; its title
      alone does not establish that consumption itself carries the possession sentence. The separate
      administrative treatment of use was not verified.
    sources:
      - l2002
      - cc_mn
  access:
    text: None found. Narcotic drugs are restricted by the narcotics control law and Criminal Code.
    sources:
      - cc_mn
context:
  production:
    status: none
    text: >-
      Reliable national information about lawful cannabis production was not established by the
      retained sources.
    sources: []
  products:
    text: >-
      Reliable national information about legally available cannabis products was not established by
      the retained sources.
    sources: []
  medical:
    text: The retained sources do not establish whether a medical cannabis programme operates.
    sources: []
  consequences:
    text: A criminal case brings a record and social stigma.
    sources:
      - vice
  planting:
    seeds: grey
    seeds_trade: unclear
    clones: illegal
    clones_trade: banned
    text: >-
      The 2002 narcotics control law counts planting, collecting and harvesting plants with narcotic
      effect as manufacture, which needs a licence from the pharmaceuticals authority and is
      otherwise prohibited. It defines narcotic drugs by reference to the 1961 convention and does
      not mention seeds.
    sources:
      - l2002
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited.
    sources:
      - cc_mn
  visitors:
    status: none
    text: >-
      No lawful recreational supply route was established. Article 20.7(1) criminalises unauthorised
      preparation, storage, giving or acquisition of prohibited narcotic drugs without a selling
      purpose.
    sources:
      - cc_mn
  black_market:
    text: >-
      Figures reported by the government to the UN drugs office record 117 kg of herbal cannabis
      seized in 2024, against 122 kg in 2023. The UN publishes them as kilogram equivalents, and
      countries count seizures differently, so the figures are not comparable across borders.
    sources:
      - unodc_szr
