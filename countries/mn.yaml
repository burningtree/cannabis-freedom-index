segments:
  possession:
    text: >-
      Illegal under the narcotics law and the Criminal Code. Small quantities can be dealt with by
      an administrative fine of 150,000–450,000 tögrög (roughly US$45–130); larger amounts or any
      sign of dealing bring two to eight years.
    sources:
      - cr
      - trip
  cultivation:
    text: >-
      Cultivation is a crime. Wild cannabis grows in 18 of Mongolia's 21 provinces, and picking it
      carries the same penalties as growing it.
    sources:
      - cr
  enforcement:
    text: >-
      Fines for the smallest cases, prison above them; enforcement falls mainly on young urban
      users.
    sources:
      - vice
      - cr
  sharing:
    text: Trafficking carries eight to fifteen years.
    sources:
      - cr
  consumption:
    text: >-
      Use is an offence; young people arrested for smoking have faced criminal cases and public
      shaming.
    sources:
