name: Mongolia
region: Asia
iso_numeric: 496
recreational: illegal
medical: none
updated: "2026-10-28"
summary: >-
  Unauthorised acquisition or storage without a selling purpose can bring one to five years of
  travel restriction or imprisonment. Sale-related conduct carries two to eight years; organised
  criminal groups face twelve to twenty years or life.
scores:
  possession: 1
  cultivation: 0
  enforcement: 2
  sharing: 0
  consumption: 1
  access: 0
segments:
  possession:
    text: >-
      Article 20.7(1), as amended in 2020, punishes unlawful preparation, storage, giving to another
      person or acquisition of prohibited narcotic drugs without a selling purpose with one to five
      years of travel restriction or imprisonment. It supplies no small-quantity exemption. A
      separate administrative penalty for consumption alone was not verified.[@cc_mn]
    sources:
      - cc_mn
    penalties:
      - label: >-
          Unlawful preparation, storage, giving or acquisition without selling purpose (Article
          20.7(1))
        treatment: criminal
        term: Illegal use
        prison_min: 1 year
        prison: 5 years
        note: Travel restriction or imprisonment; no small-quantity exemption
  cultivation:
    text: >-
      Article 20.10 punishes unauthorised growing of plants supplying narcotic raw materials with
      one to five years of travel restriction or imprisonment; five to twelve years for an organised
      criminal group. The provision establishes no personal home-growing allowance.[@cc_mn]
    sources:
      - cc_mn
    penalties:
      - label: Unauthorised growing of narcotic-raw-material plants (Article 20.10)
        treatment: criminal
        term: Cultivation
        prison_min: 1 year
        prison: 5 years
        note: Travel restriction or imprisonment; no personal home-growing allowance
      - label: Growing by an organised criminal group
        treatment: criminal
        term: Cultivation
        prison_min: 5 years
        prison: 12 years
  enforcement:
    text: >-
      Article 20.7(1) allows travel restriction instead of imprisonment for conduct without a
      selling purpose; the statute alone does not establish how often courts choose that
      alternative.[@cc_mn] Police recorded 405 drug crimes and 228 suspects in 2024, and 551 crimes
      and 417 suspects in 2025, with most cases in Ulaanbaatar.[@xinhua24,xinhua26] A nightclub
      campaign in July 2025 tested 1,043 people positive for an illicit drug.[@diplomat25]
    sources:
      - cc_mn
      - xinhua24
      - xinhua26
      - diplomat25
  sharing:
    text: >-
      Giving drugs to another person without a selling purpose falls within Article 20.7(1),
      carrying one to five years of travel restriction or imprisonment. Article 20.7(2) provides two
      to eight years for sale-related conduct; persistent or cross-border conduct carries five to
      twelve years, and an organised criminal group twelve to twenty years or life imprisonment.
      Article 20.8 separately punishes providing premises for drug use with a fine, one to five
      years of travel restriction, or imprisonment in the ordinary case.[@cc_mn]
    sources:
      - cc_mn
    penalties:
      - label: Giving to another person without selling purpose (Article 20.7(1))
        treatment: criminal
        term: Giving
        prison_min: 1 year
        prison: 5 years
        note: Travel restriction or imprisonment
      - label: Sale-related conduct (Article 20.7(2))
        treatment: criminal
        term: Sale
        prison_min: 2 years
        prison: 8 years
      - label: Persistent or cross-border conduct
        treatment: criminal
        term: Sale
        prison_min: 5 years
        prison: 12 years
      - label: Organised criminal group
        treatment: criminal
        term: Sale
        prison_min: 12 years
        prison: 20 years
        life: possible
      - label: Providing premises for drug use (Article 20.8)
        treatment: criminal
        term: Providing premises
        prison_min: 1 year
        prison: 5 years
        note: Fine and/or travel restriction or imprisonment in the ordinary case
        fine_min: 5400000
        fine: 27000000
    currency: MNT
  consumption:
    text: >-
      Article 8 of the narcotics control law prohibits use outside authorised purposes.[@l2002]
      Criminal Code Article 20.7 lists acts including preparation, storage, giving and acquisition;
      its title mentions illegal use, but the operative list does not make consumption itself a
      separate crime.[@cc_mn] The Law on Infringement punishes public intoxication with a MNT
      100,000 fine or compulsory training and 7–30 days' detention; a person found with drugs can
      also face Article 20.7(1).[@infringement]
    sources:
      - l2002
      - cc_mn
      - infringement
  access:
    text: >-
      No legal source for adults. Narcotic drugs are restricted by the 2002 narcotics law and the
      Criminal Code; the law allows licensed medical and academic use but no cannabis medicine,
      patient programme or hemp licence was found.[@l2002,cc_mn]
    sources:
      - cc_mn
      - l2002
context_not_applicable:
  death_penalty:
    text: >-
      Mongolia abolished the death penalty for all crimes, voted in 2015 and in force with the new
      Criminal Code; no cannabis offence carries a capital sentence.[@amnesty]
    sources:
      - amnesty
context:
  recreational:
    text: >-
      There is no legal way to get cannabis. Unlawful preparation, storage, giving or acquisition
      without a selling purpose brings one to five years of travel restriction or imprisonment, with
      no small-quantity exemption.[@cc_mn]
    sources:
      - cc_mn
  production:
    status: medical
    text: >-
      The 2002 law provides licences for the manufacture and sale of narcotic drugs and raw
      materials for medical and research use, but no cannabis production licence or product was
      found.[@l2002]
    sources:
      - l2002
  medical:
    text: >-
      No cannabis-based medicine is registered and no patient programme was found. The 2002 law
      allows licensed medical and academic institutions to use controlled drugs for treatment,
      analysis or research, so a medical route exists on paper but no cannabis product has been
      approved.[@l2002]
    sources:
      - l2002
  consequences:
    text: A criminal case brings a record and social stigma.[@vice]
    sources:
      - vice
  planting:
    seeds: grey
    seeds_trade: unclear
    clones: illegal
    clones_trade: banned
    text: >-
      The 2002 narcotics control law counts planting, collecting and harvesting plants with narcotic
      effect as manufacture, which needs a licence from the pharmaceuticals authority and is
      otherwise prohibited.[@l2002] It defines narcotic drugs by reference to the 1961 convention
      and does not mention seeds.[@l2002] A revised narcotics law submitted to parliament in March
      2026 would expressly include seeds in the definition of a narcotic plant; it was still pending
      on 28 October 2026.[@draft2026]
    sources:
      - l2002
      - draft2026
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited.[@cc_mn]
    sources:
      - cc_mn
  visitors:
    status: none
    text: >-
      No lawful recreational supply route was established. Article 20.7(1) criminalises unauthorised
      preparation, storage, giving or acquisition of prohibited narcotic drugs without a selling
      purpose.[@cc_mn]
    sources:
      - cc_mn
  black_market:
    text: >-
      Figures reported by the government to the UN drugs office record 117 kg of herbal cannabis
      seized in 2024, against 122 kg in 2023; no 2025 kilogram figure has been
      published.[@unodc_szr] In September 2024 police stopped two men in Ulaanbaatar with about 17
      kg of cannabis plants.[@forgotten24] No cannabis-specific arrest series is published; the
      national figures cover all drugs.[@xinhua24] The UN publishes kilogram equivalents, and
      countries count seizures differently, so the figures are not directly comparable.[@unodc_szr]
    sources:
      - unodc_szr
      - forgotten24
      - xinhua24
  hemp:
    status: none
    text: >-
      No legal hemp category or THC ceiling. The 2002 law counts planting, harvesting and
      cultivating plants with narcotic effect as manufacture, and prohibits production outside
      licensed medical or research purposes; no hemp licensing route was found.[@l2002] Hemp was
      traditionally grown for rope and cloth, but the modern law makes no fibre
      exception.[@ols_dict,l2002]
    sources:
      - l2002
      - ols_dict
  driving:
    status: impairment
    text: >-
      The Law on Infringement punishes driving while intoxicated with a one-year licence suspension
      and a MNT 400,000 fine, or 7–30 days’ detention; the consolidated text states that sanction
      expressly for refusing the test, and the drug-specific first-offence line is not clearly
      stated.[@infringement] The Criminal Code adds heavier penalties where drug driving causes
      serious harm or death, up to two to eight years for two or more deaths or death while
      intoxicated.[@cc_mn] There is no THC blood limit.[@infringement]
    sources:
      - infringement
      - cc_mn
  arrests:
    text: >-
      Police recorded 405 drug crimes and 228 suspects in 2024, up 13 per cent on 2023.[@xinhua24]
      In 2025 they recorded 551 crimes and 417 arrests, up 21.6 per cent.[@xinhua26] A July 2025
      nightclub campaign tested 1,043 people positive for an illicit drug.[@diplomat25] The figures
      cover all drugs, not cannabis alone.[@xinhua24]
    sources:
      - xinhua24
      - xinhua26
      - diplomat25
  culture:
    text: >-
      Cannabis is called [ols](/culture/language/ols/), the same word as rope or cordage, reflecting
      the plant's traditional use for fibre.[@ols_dict] Hemp was grown for rope and cloth and the
      plant grows wild, but the modern law treats it as a narcotic with no hemp
      exception.[@l2002,ols_dict] There is no public cannabis culture; enforcement focuses on users
      and small seizures.[@xinhua24]
    sources:
      - ols_dict
      - l2002
      - xinhua24
