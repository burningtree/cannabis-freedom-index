segments:
  possession:
    text: >-
      Article 20.7(1) of the Criminal Code of Mongolia (adopted 3 December 2015, as amended)
      punishes illegal preparation, storage or delivery of prohibited narcotic drugs without intent
      to distribute with a restriction of free travel for one to five years, or imprisonment for one
      to five years. The article sets no small-quantity threshold. Whether a separate administrative
      fine applies to very small amounts is not stated here, because the Law on Violations was not
      read.
    sources:
      - cc
  cultivation:
    text: >-
      Article 20.10 punishes illegal growing or cultivation of plants that are raw material for
      narcotic drugs with a restriction of free travel for one to five years, or imprisonment for one
      to five years; five to twelve years for an organised group. Wild cannabis grows in 18 of
      Mongolia's 21 provinces.
    sources:
      - cc
  enforcement:
    text: >-
      The Criminal Code lets a court choose a travel restriction instead of prison for holding
      without intent to distribute. How courts apply it is not shown by the text.
    sources:
      - cc
  sharing:
    text: >-
      Article 20.7(2) punishes acquisition, storage, transport, delivery or distribution with intent
      to distribute with two to eight years in prison; five to twelve years when repeated or by an
      organised group. Providing a place for drug use (Article 20.8) is one to five years.
    sources:
      - cc
  consumption:
    text: >-
      Article 20.7 is titled "illegal use of narcotic drugs", but the acts it lists are preparation,
      storage and delivery; no separate penalty for use itself was found.
    sources:
      - cc
  access:
    text: None found. Narcotic drugs are restricted by the narcotics control law and Criminal Code.
    sources:
      - cc
