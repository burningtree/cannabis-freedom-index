segments:
  possession:
    text: >-
      In May 2019 the High Court ruled that adults may possess and use cannabis in private.
      Parliament then made possession of small amounts a ticketable infraction instead of a crime —
      a small fixed fine — first up to 15 g, raised in February 2020 to 56 g. Above that it is a
      criminal offence.
    sources:
      - wiki
      - norml
  cultivation:
    text: >-
      The same court ruling protects growing in private for personal use, and the 2019 amendments
      treat five plants or fewer as a ticketable matter rather than a crime. It is tolerated rather
      than positively licensed. Since April 2026 adults can also apply, under the 2023 Freedom of
      Conscience (Cannabis) Act, for a licence to grow up to five plants in a secured part of a
      private home.
    sources:
      - norml
      - wiki
      - gov26
  enforcement:
    text: >-
      Small amounts and a few plants mean a ticket. Public smoking is fined more heavily, and larger
      quantities and dealing remain criminal.
    sources:
      - wiki
      - sknis19
  sharing:
    text: >-
      Supply to another person remains an offence. Rastafari sacramental use in registered places of
      worship is recognised.
    sources:
      - sknis19
      - wiki
  consumption:
    text: >-
      Private use by adults is protected. Smoking in public is an offence with a substantially
      higher fine than simple possession.
    sources:
      - wiki
      - sknis19
  access:
    text: >-
      No adult-use shops. The Cannabis Act, fully brought into force in April 2023, sets up a
      Medicinal Cannabis Authority to license supply to patients with qualifying conditions; the
      authority was only launched in 2025.
    sources:
      - sknis23
      - wiki
context:
  production:
    text: >-
      The Cannabis Act provides licences for cultivation, production and supply of medicinal
      cannabis only.
    sources:
      - sknis23
  products:
    text: Medicinal products through the licensed system as it rolls out; otherwise home-grown only.
    sources:
      - sknis23
  medical:
    text: >-
      Legal under the Cannabis Act for people with a qualifying medical condition, through the
      Medicinal Cannabis Authority. The system is new and access is still limited.
    sources:
      - sknis23
  consequences:
    text: The 2019 reforms included expungement of past convictions for small amounts.
    sources:
      - sknis19
      - wiki
  planting:
    seeds: grey
    seeds_trade: open
    clones: licensed
    clones_trade: regulated
    text: >-
      The Drugs Act excludes separated cannabis seed from its definition of cannabis, so seed may
      be held and traded even though germinating it is lawful only within the personal, religious
      or medicinal cultivation rules. Immature plants and clones are covered by the licensed
      medicinal system, while adults may hold a licence to grow up to five plants at home.
    sources:
      - ncc
      - cannabis_bill
      - gov26
  clubs:
    status: none
    text: >-
      No law provides for cannabis clubs. The nearest thing is religious: the Rastafari Rights
      Recognition Bill of 2023 lets a Rastafari group register with the ministry, free of
      charge and renewable every two years, and register its place of assembly, where adult
      members may grow, harvest, dry, cure and possess cannabis as a sacrament. A registered
      group may also apply for a licence under the Cannabis Act. The bill says nothing about
      selling.
    sources:
      - rrr23
  black_market:
    text: >-
      Sales outside a licence are illegal, and in practice that has meant all sales: the
      Medicinal Cannabis Authority that is to license a regulated medicinal trade was launched
      only on 25 April 2025. At the launch the attorney general said unauthorised sales remain
      illegal and that police would act against them, adding that the days of buying a bag of
      weed without knowing what is in it were over.
    sources:
      - mca25
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. British travel advice says cannabis
      for personal use has been decriminalised but that a licence is needed to use it, with
      fines for smoking in some public places or without a licence. Other drug offences carry
      severe penalties: up to 10 years in prison and a fine of up to 400,000 East Caribbean
      dollars or three times the street value in the Magistrates Court, and at least 15 years
      in the High Court.
    sources:
      - sknis23
      - wiki
      - fcdo
