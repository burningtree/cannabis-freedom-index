name: Abkhazia
region: Asia
disputed:
  part_of: ge
  note: >-
    Abkhazia has governed itself since the 1990s and is recognised by Russia and a handful of other
    states. Most countries regard it as part of Georgia. Georgian law is not applied there.
flag: "🏳️"
population:
  2025: 245000
cannabis_use:
  prevalence: 1.9
  estimate: true
  users: 3000
recreational: death
medical: none
updated: 2026-10-10
summary: >-
  Using cannabis means administrative arrest, and since 2020 the law allows life imprisonment or
  death for large-scale dealing. Sources on Abkhaz law are few; several details could not be
  confirmed.
scores:
  possession: 1
  cultivation: 1
  enforcement: 1
  sharing: 0
  consumption: 1
  access: 0
segments:
  possession:
    text: >-
      Possession is dealt with under Abkhazia's own criminal code, which follows the Russian model.
      The amounts that separate an administrative case from a criminal one could not be confirmed.
    sources:
      - ek
      - voa
  cultivation:
    text: >-
      Growing is a criminal offence under the drug articles of the criminal code. No tolerated
      number of plants is known.
    sources:
      - voa
  enforcement:
    text: >-
      Strict. A law in force from 1 January 2020 introduced life imprisonment or the death penalty
      for distributing drugs in especially large quantities, ruled out any reduction of sentence for
      trafficking and barred pardons for traffickers.
    sources:
      - voa
      - cp
  sharing:
    text: >-
      Any supply is treated as distribution, with long prison terms.
    sources:
      - voa
  consumption:
    text: >-
      Using a drug is an administrative offence under Article 45 of the code of administrative
      violations, punished by 15 days of arrest whatever the drug. In December 2022 parliament
      passed at first reading a bill to cut this to three days for cannabis, with 30 days for a
      repeat within a year. Whether it became law could not be confirmed.
    sources:
      - ek
  access:
    text: >-
      No legal source.
    sources:
      - ek
context:
  death_penalty:
    text: >-
      Since 1 January 2020 the law provides for life imprisonment or death, with confiscation of
      property, for distributing drugs in especially large quantities. Abkhazia had observed a
      moratorium on executions since 1993, and no execution for a drug offence has been reported.
    sources:
      - voa
      - cp
  production:
    text: >-
      None. No licensed cultivation is known.
    sources:
      - voa
  products:
    text: >-
      No legal cannabis products are known.
    sources:
      - ek
  medical:
    text: >-
      No medical cannabis programme is known.
    sources:
      - ek
  consequences:
    text: >-
      Abkhaz officials have blamed drug couriers from Russia for a rise in overdose deaths, and
      foreigners convicted of drug offences cannot be pardoned.
    sources:
      - voa
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited, and the law provides for the death
      penalty for the most serious drug offences.
    sources:
      - voa
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone, so a visitor has no lawful way to buy
      cannabis. The sources behind this profile describe no separate rule for visitors.
    sources:
      - ek
