name: Abkhazia
region: Asia
disputed:
  part_of: ge
  note: >-
    Abkhazia has governed itself since the 1990s and is recognised by Russia and a handful of
    other states. Most countries regard it as part of Georgia. Georgian law is not applied
    there.
flag: 🏳️
recreational: death
medical: none
updated: '2026-10-24'
summary: >-
  Cannabis use brings three days’ administrative arrest; possession and growing carry prison
  terms. The most serious supply cases can bring life or death.
scores:
  possession: 0
  cultivation: 0
  enforcement: 0
  sharing: 0
  consumption: 1
  access: 0
segments:
  possession:
    text: >-
      Ordinary possession without intent to supply carries one to three years in prison. Large
      quantities carry three to five years and a fine, and especially large quantities five to
      seven years and a fine. Exemption requires voluntary surrender and active assistance
      against drug offences.[@code] The Supreme Court confirms that the ordinary offence applies
      regardless of quantity below those higher tiers.[@court]
    sources:
      - code
      - court
  cultivation:
    text: >-
      Sowing or growing prohibited drug plants, expressly including cannabis, carries six to
      eight years in prison and a fine of 100,000–150,000 rubles. Group, organised-group or
      large-scale growing carries ten to twelve years.[@code] An August 2026 cabinet
      announcement set ten Cannabis plants as the large-scale threshold, with commencement tied
      to official publication.[@plants]
    sources:
      - code
      - plants
  enforcement:
    text: >-
      Personal possession carries one to three years and ordinary cannabis cultivation six to
      eight years in prison.[@code] Cannabis or hashish use without a doctor’s order carries
      three days’ administrative arrest and ten days for repetition within a year.[@admin] Life
      or death remains available in the highest supply/import tiers without mitigating
      circumstances; the Supreme Court bars those penalties when mitigation exists.[@code,court]
    sources:
      - code
      - admin
      - court
  sharing:
    text: >-
      The ordinary drug-supply offence carries five to eight years in prison and a fine, with
      higher tiers for aggravated cases.[@code] The Supreme Court defines supply to include
      gifts, exchanges, loans and payment of debts, and says ordinary supply liability applies
      regardless of amount below the larger tiers.[@court]
    sources:
      - code
      - court
  consumption:
    text: >-
      Cannabis or hashish use without a doctor’s order carries three days’ administrative
      arrest, rising to ten days for repetition within a year. Repeat liability for the
      first-use offence cannot be imposed within fifteen days of the earlier liability decision.
      A person voluntarily seeking medical help for illegal drug use is exempt from
      administrative liability under this article.[@admin]
    sources:
      - admin
  access:
    text: >-
      Recreational supply is criminal, and the Supreme Court includes both paid and unpaid
      transfers in its definition.[@code,court] The use offence expressly covers cannabis and
      hashish taken without a doctor’s order.[@admin]
    sources:
      - code
      - court
      - admin
context:
  death_penalty:
    text: >-
      The highest supply/import tiers allow life or death where mitigating circumstances are
      absent; the Supreme Court expressly bars those penalties where mitigation
      exists.[@code,court] The code excludes women, people who offended under eighteen and men
      aged sixty-five by sentencing from the death penalty, and allows presidential commutation
      of death.[@code]
    sources:
      - code
      - court
  production:
    status: none
    text: >-
      Unlawful cannabis cultivation carries six to eight years in the ordinary tier.[@code] The
      Supreme Court includes creating special conditions for sowing and growing, improving
      cultivation methods and breeding higher-yield varieties within cultivation.[@court]
    sources:
      - code
      - court
  products:
    text: >-
      Cannabis and hashish are expressly named in the administrative use offence.[@admin]
      Passing controlled drugs to another person, including as a gift, falls under the criminal
      supply rules.[@court]
    sources:
      - admin
      - court
  medical:
    text: >-
      The cannabis/hashish use offence applies to use without a doctor’s order. It also exempts
      a person who voluntarily seeks medical help for illegal drug use from administrative
      liability under that article.[@admin]
    sources:
      - admin
  consequences:
    text: >-
      A criminal conviction creates a criminal record until it is extinguished or removed under
      the code’s rules.[@code] The Supreme Court requires access to legal assistance and
      protection against self-incrimination when questioning of a detained person turns to
      incriminating facts.[@court]
    sources:
      - code
      - court
  clubs:
    status: none
    text: >-
      Cannabis cultivation and running premises for drug consumption are criminal
      offences.[@code] The Supreme Court treats gifts and other unpaid transfers as supply,
      leaving no lawful recreational growing-and-sharing club route.[@court]
    sources:
      - code
      - court
  visitors:
    status: none
    text: >-
      Cannabis use without a doctor’s order carries three days’ arrest, with ten for repetition
      within a year.[@admin] Possession without supply intent and unauthorised drug import have
      separate prison offences; giving drugs away is included in supply.[@code,court]
    sources:
      - admin
      - code
      - court
