name: Abkhazia
region: Asia
disputed:
  part_of: ge
  note: >-
    Abkhazia has governed itself since the 1990s and is recognised by Russia and a handful of other
    states. Most countries regard it as part of Georgia. Georgian law is not applied there.
flag: 🏳️
recreational: death
medical: none
updated: "2026-10-28"
summary: >-
  Cannabis use brings three days’ administrative arrest; possession and growing carry prison terms.
  The highest supply tiers allow life or death on paper, but the death penalty has been under a
  moratorium since 1993 and was barred in peacetime by the 2007 law; no cannabis execution or
  cannabis-specific death sentence was found.
