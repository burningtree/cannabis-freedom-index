segments:
  possession:
    text: >-
      Ordinary possession without intent to supply carries one to three years in prison.[@code] From
      more than 4 g to 50 g is “large” and carries three to five years plus a 50,000–100,000 rouble
      fine; more than 50 g is “especially large” and carries five to seven years plus a
      100,000–150,000 rouble fine.[@code,thresholds2013] Exemption requires voluntary surrender and
      active assistance against drug offences.[@code] The Supreme Court confirms that the ordinary
      offence applies regardless of quantity below those higher tiers.[@court]
    sources:
      - code
      - thresholds2013
      - court
    currency: RUB
    penalties:
      - label: Up to 4 g
        treatment: criminal
        term: Possession
        prison_min: 1 year
        prison: 3 years
      - label: Over 4 g to 50 g
        treatment: criminal
        term: Possession
        prison_min: 3 years
        prison: 5 years
        fine_min: 50000
        fine: 100000
      - label: Over 50 g
        treatment: criminal
        term: Possession
        prison_min: 5 years
        prison: 7 years
        fine_min: 100000
        fine: 150000
  cultivation:
    text: >-
      Sowing or growing prohibited drug plants, expressly including cannabis, carries six to eight
      years in prison and a fine of 100,000–150,000 roubles.[@code] From 1 September 2026, ten or
      more plants, or growing by a group or organised group, carries ten to twelve years; the
      previous large-scale threshold was five plants.[@plants] An August 2026 cabinet decision set
      the ten-plant line.[@plants]
    sources:
      - code
      - plants
    currency: RUB
    penalties:
      - label: 1–9 plants
        treatment: criminal
        term: Cultivation
        prison_min: 6 years
        prison: 8 years
        fine_min: 100000
        fine: 150000
      - label: 10 or more plants
        treatment: criminal
        term: Cultivation
        prison_min: 10 years
        prison: 12 years
      - label: Group or organised group
        treatment: criminal
        term: Cultivation
        prison_min: 10 years
        prison: 12 years
  enforcement:
    text: >-
      Personal possession carries one to three years and ordinary cannabis cultivation six to eight
      years in prison.[@code] Cannabis or hashish use without a doctor’s order carries three days’
      administrative arrest and ten days for repetition within a year.[@admin] Life or death remains
      in the highest supply/import tiers without mitigating circumstances, but the death penalty has
      been under a moratorium since 1993 and is barred in peacetime by the 2007
      law.[@code,court,moratorium]
    sources:
      - code
      - admin
      - court
      - moratorium
  sharing:
    text: >-
      The ordinary drug-supply offence carries five to eight years in prison and a 150,000–200,000
      rouble fine, with higher tiers for aggravated cases.[@code] The Supreme Court defines supply
      to include gifts, exchanges, loans and payment of debts, and says ordinary supply liability
      applies regardless of amount below the larger tiers.[@court]
    sources:
      - code
      - court
    currency: RUB
    penalties:
      - label: Ordinary supply
        treatment: criminal
        term: Trafficking
        prison_min: 5 years
        prison: 8 years
        fine_min: 150000
        fine: 200000
      - label: Group, large amount or adult to minor
        treatment: criminal
        term: Trafficking
        prison_min: 8 years
        prison: 12 years
        fine_min: 300000
        fine: 600000
      - label: Organised group, especially large or child under 14
        treatment: criminal
        term: Trafficking
        prison_min: 15 years
        death: true
        life: possible
        fine_min: 600000
        fine: 1200000
        note: Death is not carried out under the moratorium
  consumption:
    text: >-
      Cannabis or hashish use without a doctor’s order carries three days’ administrative arrest,
      rising to ten days for repetition within a year. Repeat liability for the first-use offence
      cannot be imposed within fifteen days of the earlier liability decision. A person voluntarily
      seeking medical help for illegal drug use is exempt from administrative liability under this
      article.[@admin]
    sources:
      - admin
  access:
    text: >-
      Recreational supply is criminal, and the Supreme Court includes both paid and unpaid transfers
      in its definition.[@code,court] The use offence expressly covers cannabis and hashish taken
      without a doctor’s order.[@admin]
    sources:
      - code
      - court
      - admin
context:
  death_penalty:
    text: >-
      The highest supply/import tiers allow life or death where mitigating circumstances are absent;
      the Supreme Court bars those penalties where mitigation exists.[@code,court] Abkhazia has not
      executed anyone since 1993, and the 12 January 2007 law bars executions in peacetime while
      leaving death sentences in the code; the few known death sentences were commuted to
      life.[@moratorium] No cannabis-specific death or life sentence was found.
    sources:
      - code
      - court
      - moratorium
  production:
    status: none
    text: >-
      Unlawful cannabis cultivation carries six to eight years in the ordinary tier.[@code] The
      state may grow controlled plants only within quotas, and research institutions may use
      controlled drugs for study; no commercial cannabis production exists.[@law2001]
    sources:
      - code
      - law2001
  medical:
    text: >-
      No medical cannabis programme. Cannabis and hashish are in Schedule I, whose circulation is
      banned; the narcotics law allows medical use only of less restricted schedules, so a doctor
      cannot prescribe cannabis.[@law2001,schedule2011] The “without a doctor’s order” wording in
      the use offence is not a medical route.[@admin]
    sources:
      - law2001
      - schedule2011
      - admin
  consequences:
    text: >-
      A criminal conviction creates a criminal record until it is extinguished or removed under the
      code’s rules.[@code] The Supreme Court requires access to legal assistance and protection
      against self-incrimination when questioning of a detained person turns to incriminating
      facts.[@court]
    sources:
      - code
      - court
  clubs:
    status: none
    text: >-
      No cannabis clubs are known. Cultivation and running premises for drug consumption are
      criminal offences, and the Supreme Court treats gifts and other unpaid transfers as supply,
      leaving no lawful club route.[@code,court]
    sources:
      - code
      - court
  visitors:
    status: none
    text: >-
      There is no legal supply for anyone. A visitor faces the same three-day arrest for cannabis
      use and the same possession and supply penalties.[@admin,code] A October 2026 proposal for an
      “undesirable foreign citizen” status and entry ban was not law.[@migration26]
    sources:
      - admin
      - code
      - migration26
  recreational:
    text: >-
      Cannabis is illegal for every purpose. Possession without intent to supply carries one to
      three years, and the highest supply tiers allow life or death on paper.[@code] Cannabis and
      hashish use without a doctor’s order is an administrative offence carrying three days’ arrest,
      or ten for repetition within a year.[@admin] Gifts and other unpaid transfers count as
      supply.[@court]
    sources:
      - code
      - admin
      - court
  hemp:
    status: none
    text: >-
      No hemp or CBD exception operates. Cannabis is in Schedule I, whose circulation is banned, and
      the law permits cultivation of controlled plants only through state enterprises within
      quotas.[@law2001,schedule2011] The administrative code fines illegal sowing of listed
      drug-hemp varieties, which implies non-drug hemp is not a criminal offence, but no THC limit,
      hemp licensing scheme or CBD market was found.[@admin]
    sources:
      - law2001
      - schedule2011
      - admin
  planting:
    seeds: grey
    seeds_trade: unclear
    clones: illegal
    clones_trade: banned
    text: >-
      The Supreme Court treats acquiring seeds and germinating them outside soil, or in too little
      soil for the plant to mature, as preparation for cultivation; sowing is criminal before the
      plants sprout.[@court] A cutting is a plant and falls under the cultivation offence.[@code] No
      separate seed-sale rule was found.[@court]
    sources:
      - court
      - code
  driving:
    status: zero
    text: >-
      The Administrative Code makes it an offence to drive with narcotic or psychotropic substances
      in the body, with no THC threshold.[@admin] The penalty is 500 minimum wage units (30,000
      roubles) and six months’ licence loss; a repeat brings 15 days’ arrest and a one-year loss,
      and refusing a test brings 15 days and six months.[@admin] Alcohol has a separate blood and
      breath limit; the 2026 proposal for mobile testing was not in force.[@admin]
    sources:
      - admin
  black_market:
    text: >-
      No national price or seizure series is published. A 1999 cabinet review described organised
      marijuana cultivation in Gudauta for export and the Psou crossing as the main
      route.[@enforcement1999] Prosecutors reported 598 cannabis roots seized in 2024–2025, mostly
      South Krasnodar, and several small outdoor plots in
      2025–2026.[@prosecutor26,ochamchira25,seizure26]
    sources:
      - enforcement1999
      - prosecutor26
      - ochamchira25
      - seizure26
  arrests:
    text: >-
      Abkhazia publishes prosecution and court figures, not arrest counts. The prosecutor general’s
      office reported 33 cultivation cases and 29 convictions in 2024–2025: 12 real prison terms,
      nine suspended, four compulsory treatment and 2.45 million roubles in fines.[@prosecutor26] A
      1999 cabinet review recorded more than 500 drug users, only 188 registered as chronic
      addicts.[@enforcement1999]
    sources:
      - prosecutor26
      - enforcement1999
