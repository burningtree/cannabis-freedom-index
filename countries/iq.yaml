segments:
  possession:
    text: >-
      Article 32 of the 2017 law punishes importing, producing, manufacturing, possessing,
      acquiring, buying or cultivating drugs for personal use with one to three years in prison and
      a fine of 5 to 10 million dinars.[@law2017] The law sets no quantity threshold; courts infer
      intent from the circumstances, and Article 33(2)(a)'s percentage bands are a weighing
      tolerance, not a small-amount tier.[@law2017] The discrepancy offence carries a criminal fine
      of 2–5 million dinars; repeating it brings imprisonment and/or a 5–10 million dinar
      fine.[@art33] Allowing another person to use drugs on one's premises, or being found in a
      place prepared for use, carries six months to two years and a 3 to 5 million dinar
      fine.[@law2017] A court may order treatment instead of the Article 32 penalty, and a person
      who voluntarily enters treatment is protected from prosecution.[@law2017]
    sources:
      - law2017
      - art33
    currency: IQD
    penalties:
      - label: "Personal use: import, production, possession, purchase or cultivation"
        treatment: criminal
        term: Article 32
        prison_min: 1 year
        prison: 3 years
        fine_min: 5000000
        fine: 10000000
        note: Treatment may replace the penalty; voluntary treatment protects from prosecution
      - label: Criminal weighing-discrepancy offence, Article 33(2)(a)
        treatment: criminal
        term: Weighing discrepancy
        fine_min: 2000000
        fine: 5000000
        note: Specific weighing differences; repeat offences carry imprisonment and/or a higher fine
      - label: Allowing use on premises or being in a place prepared for use, Article 33(1)
        treatment: criminal
        term: Premises offence
        prison_min: 6 months
        prison: 2 years
        fine_min: 3000000
        fine: 5000000
  cultivation:
    text: >-
      Cultivating a drug-producing plant with intent to traffic carries death or life imprisonment
      under Article 27(3).[@law2017] Growing for personal use falls under Article 32, with one to
      three years and a fine.[@law2017] Article 23 bans the cannabis plant at every stage, including
      seeds, except for medical or scientific purposes under the law.[@law2017]
    sources:
      - law2017
    currency: IQD
    penalties:
      - label: Cultivation with intent to traffic, Article 27(3)
        treatment: criminal
        term: Cultivation
        death: true
        note: Death or
        life: possible
      - label: Cultivation for personal use, Article 32
        treatment: criminal
        term: Personal use
        prison_min: 1 year
        prison: 3 years
        fine_min: 5000000
        fine: 10000000
  enforcement:
    text: >-
      The law sets prison terms for personal-use offences and severe penalties for
      trafficking.[@law2017] A judicial review recorded three Badra cases where general mitigation
      led to fines alone, but challenged the amounts as below the statutory
      minimum.[@judicial_fines] In 2024 the interior ministry reported 14,438 drug arrests and 8,930
      convictions, with more than six tonnes of narcotics seized; the figures cover all
      drugs.[@shafaq24]
    sources:
      - law2017
      - judicial_fines
      - shafaq24
  sharing:
    text: >-
      Importing, exporting, producing or manufacturing with intent to traffic carries death or life
      imprisonment under Article 27.[@law2017] Possession, sale, transport, delivery or mediation
      with intent to traffic carries life or temporary imprisonment and a 10 to 30 million dinar
      fine under Article 28.[@law2017] Providing drugs for use, encouraging use, managing a place
      for use or inducing a minor to use carries the same Article 28 penalties.[@law2017] Aggravated
      cases, including recidivism, an official role, an international gang, weapons or a school or
      place of worship, can attract the higher Article 29 penalties, including life or temporary
      imprisonment.[@law2017]
    sources:
      - law2017
    currency: IQD
    penalties:
      - label: Import, export, production or manufacture with intent to traffic, Article 27
        treatment: criminal
        term: Trafficking
        death: true
        note: Death or
        life: possible
      - label: Possession, sale, transport or delivery with intent to traffic, Article 28
        treatment: criminal
        term: Trafficking
        fine_min: 10000000
        fine: 30000000
        note: Life or temporary imprisonment plus the fine
      - label: Providing drugs for use, encouraging use or managing a drug premises, Article 28
        treatment: criminal
        term: Trafficking
        fine_min: 10000000
        fine: 30000000
        note: Life or temporary imprisonment plus the fine
      - label: Aggravated trafficking, Article 29
        treatment: criminal
        term: Aggravated trafficking
        life: possible
        note: Enhanced penalties; life or temporary imprisonment available
  consumption:
    text: >-
      There is no standalone use offence. Use is prosecuted as possession or purchase for personal
      use under Article 32, or as providing or encouraging use under Article 28(2).[@law2017] A
      court may order inpatient or outpatient treatment instead of the Article 32 penalty, and a
      person who voluntarily presents for treatment is not prosecuted if they follow the
      programme.[@law2017]
    sources:
      - law2017
    currency: IQD
    penalties:
      - label: Use prosecuted as personal possession, Article 32
        treatment: criminal
        term: Personal use
        prison_min: 1 year
        prison: 3 years
        fine_min: 5000000
        fine: 10000000
        note: Treatment may replace the penalty
      - label: Voluntary treatment
        treatment: tolerated
        term: Treatment
        note: Protection from prosecution while the programme is followed
  access:
    text: >-
      There is no legal cannabis supply for adults or patients. Article 18 allows individuals to
      possess their own prescribed controlled medicine for genuine health reasons, but no
      cannabis-based product is registered under that route.[@law2017] The Etihad Pharma Legal
      Handbook states that medicinal cannabis is not authorised in Iraq and that no cannabinoid drug
      has market approval.[@pharma]
    sources:
      - law2017
      - pharma
context:
  death_penalty:
    text: >-
      The 2017 law makes death or life the penalty for importing, exporting, producing or
      cultivating with intent to traffic, and for aggravated trafficking.[@law2017] In 2024 courts
      passed 144 death sentences for drug trafficking; in 2025 Harm Reduction International recorded
      40 or more new drug death sentences, about a fifth of them cannabis-related.[@hri2025] The
      interior ministry said 300 death sentences were imposed in the three years to November
      2025.[@hri2025] Iraq carried out executions in 2025, but none for drug offences.[@hri2025]
    sources:
      - law2017
      - hri2025
  recreational:
    text: >-
      There is no legal way to buy cannabis. Personal use carries one to three years and a fine,
      trafficking can bring death or life, and the law has no quantity threshold.[@law2017] The
      interior ministry reported 14,438 drug arrests in 2024 and more than six tonnes seized, all
      drugs combined.[@shafaq24] No price or purity data were found.
    sources:
      - law2017
      - shafaq24
  production:
    status: none
    text: >-
      No licensed cannabis production exists. Article 23 bans cultivating, importing, exporting,
      possessing or selling the cannabis plant at every stage, including seeds, except for medical
      or scientific purposes under the law.[@law2017] The 1979 amendment removed the earlier
      fibre-and-seed exception, and no industrial-hemp licensing regime replaced it.[@law2017]
    sources:
      - law2017
  medical:
    text: >-
      No medical cannabis programme or registered cannabis medicine was found.[@pharma] Article 18
      permits individuals to possess their own prescribed controlled medicine, but no cannabis-based
      product has been registered under it.[@law2017] Cannabis remains on the controlled lists, and
      medical status stays none.[@law2017]
    sources:
      - pharma
      - law2017
  hemp:
    status: none
    text: >-
      No industrial-hemp exception, THC limit or licensing scheme was found. Article 23 bans the
      cannabis plant at every stage, including seeds.[@law2017] CBD has no separate exemption; it is
      treated as a cannabis derivative unless the health ministry authorises it, and no such
      authorisation was found.[@law2017]
    sources:
      - law2017
  consequences:
    text: >-
      A drug conviction carries a criminal record and a prison term or fine; trafficking can bring
      life imprisonment or death.[@law2017] Courts can order treatment for dependence, and voluntary
      treatment can prevent prosecution if the programme is followed.[@law2017] Death sentences were
      imposed in 2024 and 2025, but no drug executions were recorded in 2025.[@hri2025]
    sources:
      - law2017
      - hri2025
  planting:
    seeds: illegal
    seeds_trade: banned
    clones: illegal
    clones_trade: banned
    text: >-
      Article 23 expressly bans the cannabis plant at every growth stage, including seeds, except
      for medical or scientific purposes under the law.[@law2017] Clones are plants, so keeping,
      trading or planting them falls under the same prohibition.[@law2017] No seed or clone market
      was found.
    sources:
      - law2017
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited, and the most serious drug offences carry
      death or life imprisonment.[@law2017]
    sources:
      - law2017
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. Personal use carries one to three years and
      a fine, and the law makes no exception for visitors.[@law2017]
    sources:
      - law2017
  driving:
    status: impairment
    text: >-
      Traffic Law No. 8 of 2019 punishes driving under the influence of alcohol or drugs with three
      months to one year in prison, a fine of 200,000 to 500,000 dinars, or both.[@traffic2019] A
      repeat within a year brings six months to one year, or a fine up to 1 million dinars, or
      both.[@traffic2019] No THC limit is set; the offence uses an "under the influence"
      standard.[@traffic2019]
    sources:
      - traffic2019
  black_market:
    text: >-
      The market is illegal and the authorities report large seizures. In 2024 the interior ministry
      reported more than six tonnes of narcotics seized and 14,438 arrests, all drugs
      combined.[@shafaq24] In 2025 the ministry said 300 death sentences and 1,147 life sentences
      had been imposed for drug crimes in three years, against seven death sentences in the three
      years before that.[@hri2025] No cannabis-specific price or purity data were found.
    sources:
      - shafaq24
      - hri2025
  arrests:
    text: >-
      In 2024 the interior ministry reported 14,438 drug arrests, 8,930 convictions, more than six
      tonnes seized, 144 death sentences and 454 life sentences; Shafaq reported 434 life sentences,
      a discrepancy that remains unresolved.[@shafaq24] In the first half of 2026 the ministry
      reported 3,553 arrests and 1,977 kg seized, with 58 death sentences and 236 life
      sentences.[@tnr26] The figures cover all drugs and give no cannabis breakdown.
    sources:
      - shafaq24
      - tnr26
