segments:
  possession:
    text: >-
      The Narcotics and Psychotropic Substances Law No. 50 of 2017 punishes anyone who uses drugs or
      possesses them for personal use with imprisonment and a fine. Courts may order treatment
      instead for users who come forward.
    sources:
      - um
      - tnr
  cultivation:
    text: Cultivating narcotic plants for trade carries death or life imprisonment.
    sources:
      - um
  enforcement:
    text: >-
      Prison for users and the death penalty for dealers, in the context of a fast-growing drug
      trade and overcrowded prisons.
    sources:
      - tnr
      - hoc
  sharing:
    text: >-
      Importing, exporting or producing with intent to trade carries death or life. In one case
      three men were sentenced to death over 18 kg of hashish.
    sources:
      - hoc
      - um
  consumption:
    text: Use is a crime on the same footing as personal possession.
    sources:
      - um
