updated: "2026-10-29"
summary: >-
  Personal use carries one to three years and a fine; trafficking can bring life imprisonment or
  death. The 2017 law has no quantity thresholds and divides use from dealing by intent. A first
  amendment was read in parliament in August 2026 but is not law.
