name: Iraq
region: Asia
iso_numeric: 368
recreational: death
medical: none
updated: "2026-10-23"
summary: Long prison sentences for possession; trafficking can carry life imprisonment or death.
scores:
  possession: 0
  cultivation: 0
  enforcement: 1
  sharing: 0
  consumption: 0
  access: 0
segments:
  possession:
    text: >-
      The 2017 law sets one to three years in prison and a fine of 5–10 million dinars for drug
      possession and other activities intended for personal use.[@law2017] Courts can order
      treatment under a rule corrected in 2018, and people who voluntarily enter a specialist
      hospital for treatment have conditional protection from prosecution.[@law2017,corr2018]
    sources:
      - law2017
      - corr2018
  cultivation:
    text: >-
      Growing drug-producing plants for trade carries death or life imprisonment.[@law2017]
      Growing for personal use falls under the separate one-to-three-year offence and its
      fine.[@law2017]
    sources:
      - law2017
  enforcement:
    text: >-
      The law sets prison terms for personal-use offences and severe penalties for
      trafficking.[@law2017] A judicial review recorded three Badra cases where general
      mitigation led to fines alone, but challenged the amounts as below the statutory
      minimum.[@judicial_fines]
    sources:
      - law2017
      - judicial_fines
  sharing:
    text: >-
      Importing, exporting or producing with intent to trade carries death or life. In one case
      three men were sentenced to death over 18 kg of hashish.
    sources:
      - hoc
      - um
  consumption:
    text: Use is a crime on the same footing as personal possession.
    sources:
      - um
  access:
    text: None.
    sources:
      - um
context:
  death_penalty:
    text: >-
      Importing, exporting or producing with intent to trade, and cultivating narcotic plants
      for trade, carry death or life imprisonment. In one case three men were sentenced to death
      over 18 kg of hashish.
    sources:
      - hoc
      - um
  production:
    text: None.
    sources:
      - um
  products:
    text: None.
    sources:
      - um
  medical:
    text: No medical cannabis.
    sources:
      - um
  consequences:
    text: >-
      Courts can order hospital treatment for proven dependence or outpatient visits under the
      corrected treatment rule, with further decisions based on medical
      reports.[@law2017,corr2018] Voluntary hospital presentation can prevent prosecution, but
      failure to follow the treatment programme can lead to legal action.[@law2017]
    sources:
      - law2017
      - corr2018
  arrests:
    text: >-
      The interior ministry reported 14,438 arrests for trafficking, dealing and personal use in
      2024, with 8,930 convictions and more than six tonnes of drugs seized; the figures cover
      all drugs. In the Kurdistan Region, which has its own law since 2020, arrests rose from
      142 in 2014 to 2,017 in 2022, and in October 2023 a fifth of all prisoners, 1,097 people,
      were held for narcotics, 617 of them for use.
    sources:
      - shafaq24
      - pere23
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited, and the law provides for the death
      penalty for the most serious drug offences.
    sources:
      - um
      - hoc
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone, so a visitor has no lawful way to buy
      cannabis. The sources behind this profile describe no separate rule for visitors.
    sources:
      - um
