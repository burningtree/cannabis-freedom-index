segments:
  possession:
    text: >-
      The Narcotics and Psychotropic Substances Law No. 50 of 2017 punishes anyone who uses drugs or
      possesses them for personal use with imprisonment and a fine. Courts may order treatment
      instead for users who come forward.
    sources:
      - um
      - tnr
  cultivation:
    text: Cultivating narcotic plants for trade carries death or life imprisonment.
    sources:
      - um
  enforcement:
    text: >-
      Prison for users and the death penalty for dealers, in the context of a fast-growing drug
      trade and overcrowded prisons.
    sources:
      - tnr
      - hoc
  sharing:
    text: >-
      Importing, exporting or producing with intent to trade carries death or life. In one case
      three men were sentenced to death over 18 kg of hashish.
    sources:
      - hoc
      - um
  consumption:
    text: Use is a crime on the same footing as personal possession.
    sources:
      - um
  access:
    text: None.
    sources:
      - um
context:
  death_penalty:
    text: >-
      Importing, exporting or producing with intent to trade, and cultivating narcotic plants for
      trade, carry death or life imprisonment. In one case three men were sentenced to death over 18
      kg of hashish.
    sources:
      - hoc
      - um
  production:
    text: None.
    sources:
      - um
  products:
    text: None.
    sources:
      - um
  medical:
    text: No medical cannabis.
    sources:
      - um
  consequences:
    text: A conviction is a criminal record.
    sources:
      - um
  arrests:
    text: >-
      The interior ministry reported 14,438 arrests for trafficking, dealing and personal use in
      2024, with 8,930 convictions and more than six tonnes of drugs seized; the figures cover
      all drugs. In the Kurdistan Region, which has its own law since 2020, arrests rose from
      142 in 2014 to 2,017 in 2022, and in October 2023 a fifth of all prisoners, 1,097 people,
      were held for narcotics, 617 of them for use.
    sources:
      - shafaq24
      - pere23
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited, and the law provides for the death
      penalty for the most serious drug offences.
    sources:
      - um
      - hoc
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone, so a visitor has no lawful way to buy
      cannabis. The sources behind this profile describe no separate rule for visitors.
    sources:
      - um
