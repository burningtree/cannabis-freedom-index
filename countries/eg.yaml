segments:
  possession:
    text: >-
      Anti-Narcotics Law 182 of 1960, as amended, covers cannabis in every form — hashish, the local
      herbal 'bango', and extracts. Possession for personal use carries a minimum of one year in
      prison plus a fine. Courts may send dependent users to treatment instead.
    sources:
      - cr
      - law
  cultivation:
    text: >-
      Cultivation is punished with life imprisonment, or death where trafficking intent is
      established.
    sources:
      - cr
      - law
  enforcement:
    text: >-
      Severe law, uneven enforcement: widespread use is tolerated in some settings while others are
      jailed, and high-profile arrests at the airport over small amounts are common.
    sources:
      - es
      - cr
  sharing:
    text: Supply is trafficking, with life imprisonment or the death penalty for importing.
    sources:
      - law
      - es
  consumption:
    text: Use is a crime. Hashish is nonetheless one of the most widely used drugs in the country.
    sources:
      - cr
  access:
    text: None.
    sources:
      - cr
context:
  death_penalty:
    text: >-
      Cultivation is punished with life imprisonment, or death where an intent to traffic is
      established. Importing for supply carries life imprisonment or the death penalty.
