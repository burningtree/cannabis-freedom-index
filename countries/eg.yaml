name: Egypt
region: Africa
iso_numeric: 818
recreational: death
medical: none
updated: '2026-10-29'
summary: >-
  Hashish and bango are widely used, but the law is harsh: prison for possession, and large-scale
  trafficking can carry the death penalty.
scores:
  possession: 0
  cultivation: 0
  enforcement: 1
  sharing: 0
  consumption: 1
  access: 0
segments:
  possession:
    text: >-
      Anti-Narcotics Law 182 of 1960, as amended, covers cannabis in every form — hashish, the local
      herbal 'bango', and extracts.[@law] Possession for personal use carries a minimum of one year in
      prison plus a fine; a newspaper summary of the law gives one to three years at the judge's
      discretion.[@law,watan19] Courts may send dependent users to treatment instead — a 1960 provision
      letting habitual users enter a sanatorium voluntarily, in place of the sentence.[@law] The 1960
      law is traced in the [1960 entry](/history/egypt-law-182-1960/).
    sources:
      - law
      - watan19
    penalties:
      - label: Possession for personal use
        treatment: criminal
        term: Possession
        prison_min: 1 year
        prison: 3 years
        note: Plus a fine; sanatorium treatment possible for dependent users
  cultivation:
    text: >-
      Cultivation is punished with life imprisonment, or death where trafficking intent is
      established.[@law] Growing bans date to an [1884 prohibition](/history/egypt-cultivation-ban-1884/).
    sources:
      - law
    penalties:
      - label: Unlawful cultivation
        treatment: criminal
        term: Unlicensed cultivation
        life: possible
        death: true
        note: Life imprisonment; death where trafficking intent is established
  enforcement:
    text: >-
      Severe law, uneven enforcement: widespread use is tolerated in some settings while others are
      jailed, and high-profile arrests at the airport over small amounts are common.[@es] The
      [hashish in Egypt](/culture/traditions/hashish-in-egypt/) account traces both the custom and
      the six-century campaign against it.
    sources:
      - es
  sharing:
    text: >-
      Supply is trafficking. Under the narcotics law as amended in 1989,(/history/egypt-law-122-1989/) holding, buying or
      selling a drug with intent to trade carries death or life at hard labour and a fine of
      100,000 to 500,000 pounds (Article 34), and importing carries death (Article 33).[@parl24,law] Even
      offering a drug to another person without payment brings life at hard labour and a fine of
      50,000 to 200,000 pounds (Article 35).[@parl24]
    sources:
      - parl24
      - law
    currency: EGP
    penalties:
      - label: Importing for supply (article 33)
        treatment: criminal
        term: Trafficking
        death: true
        fine_min: 100000
        fine: 500000
        note: Death or life at hard labour; 100,000–500,000 pounds
      - label: Dealing with intent to trade (article 34)
        treatment: criminal
        term: Trafficking
        death: true
        fine_min: 100000
        fine: 500000
        note: Death or life at hard labour; 100,000–500,000 pounds
      - label: Offering without payment (article 35)
        treatment: criminal
        term: Trafficking
        fine_min: 50000
        fine: 200000
        note: Life at hard labour; 50,000–200,000 pounds
  consumption:
    text: >-
      Use is a crime, punished through possession for personal use. An Egyptian newspaper's
      summary of Law 182 of 1960 gives one to three years in prison and a fine for a person
      caught with narcotics for their own use, with the exact sentence left to the judge.[@watan19,law]
    sources:
      - watan19
      - law
  access:
    text: No legal source.[@law]
    sources:
      - law
context:
  death_penalty:
    text: >-
      Cultivation is punished with life imprisonment, or death where an intent to traffic is
      established. Importing for supply carries life imprisonment or the death penalty.[@law,es]
    sources:
      - law
      - es
  recreational:
    text: >-
      There is no legal recreational supply. Hashish in every form is covered by the 1960
      narcotics law as amended, but enforcement is uneven: widespread use is tolerated in some
      settings while others are jailed, and high-profile airport arrests over small amounts are
      common.[@law,es]
    sources:
      - law
      - es
  production:
    status: none
    text: >-
      No licensed production operates: cultivation is punished with life imprisonment, or death
      where trafficking intent is established.[@law]
    sources:
      - law
  medical:
    text: >-
      No medical cannabis programme operates: use is a crime punished through possession, and the
      1960 law's only medical route is sanatorium treatment for dependent users, not patient
      supply.[@law]
    sources:
      - law
  hemp:
    status: none
    text: >-
      No hemp exception operates: Law 182 bans growing the Table V plants and bars handing over
      those plants or their seeds at any stage of growth.[@l182]
    sources:
      - l182
  consequences:
    text: >-
      A conviction brings a criminal record and, beyond the prison terms and fines above, the
      severest trafficking sentences in the region's law.[@law]
    sources:
      - law
  planting:
    seeds: illegal
    seeds_trade: banned
    clones: illegal
    clones_trade: banned
    text: >-
      Law 182 of 1960 bans growing the plants on its Table V and says no one may import,
      possess, buy, sell or hand over those plants at any stage of growth "or their seeds",
      apart from plant parts exempted in a separate table. The copy read did not reproduce the
      tables, so the entry assumes cannabis is on Table V, as the rest of this profile
      describes.[@l182]
    sources:
      - l182
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited, and the law provides for the death
      penalty for the most serious drug offences.[@law]
    sources:
      - law
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. Under the narcotics law a person caught
      with a drug for their own use faces one to three years in prison and a fine.[@watan19,law] Bringing
      narcotics into or out of the country falls under Article 33, which allows the death
      sentence and a fine of 100,000 to 500,000 pounds, and dealing inside the country under
      Article 34, with life imprisonment or death.[@parl24,law]
    sources:
      - watan19
      - law
      - parl24
  black_market:
    text: >-
      Figures reported by the government to the UN drugs office record 39,411 kg of herbal
      cannabis seized in 2024, against 239,528 kg in 2023, and 124,382 kg of cannabis
      resin seized in 2024, against 191,046 kg in 2023. The UN publishes them as kilogram
      equivalents, and countries count seizures differently, so the figures are not
      comparable across borders.[@unodc_szr]
    sources:
      - unodc_szr
  arrests:
    text: >-
      High-profile cases make the news rather than statistics: an actress was released on bail in
      2022 over suspected drug use, and airport arrests over small amounts are reported as
      routine.[@es]
    sources:
      - es
  driving:
    status: impairment
    text: >-
      Amendments to the traffic law published in November 2014 made driving under the
      influence punishable by at least one year in prison.[@es_traffic14] If the driver injures someone
      the minimum is two years and a fine of 10,000 pounds; if someone is killed or
      permanently disabled, three to seven years and 20,000 pounds, with the licence
      revoked.[@es_traffic14] The report of the amendments does not distinguish drugs from alcohol.[@es_traffic14]
    sources:
      - es_traffic14
  culture:
    text: >-
      Hashish use was associated with the Sufis, and after Napoleon's 1798 invasion the Emperor
      banned his soldiers from smoking or drinking cannabis extracts in 1800 — perhaps the first
      penal cannabis law.[@tni16] Egypt then banned and re-banned it for a century: cultivation, use
      and import first forbidden in 1868, taxed in 1874, confiscated in
      1877,(/history/egypt-destruction-order-1877/) criminal to grow in
      1884,(/history/egypt-cultivation-ban-1884/) yet hashish stayed cheap, homegrown or smuggled from Greece, and the laws largely
      ineffectual.[@tni16] The bans are traced in [hashish in Egypt](/culture/traditions/hashish-in-egypt/)
      and the [1868 ban](/history/egypt-first-ban-1868/). A 1971 UN study of 850 imprisoned users
      and 839 controls documented the café pattern: heavy users took coffee alongside, and most
      stuck to smoking.[@soueif71]
    sources:
      - tni16
      - soueif71
  research:
    status: licensed
    text: >-
      Egypt has studied hashish since 1957 under the National Center for Social and
      Criminological Research. Its programme produced the 850-taker prison study: smoking
      prevalent in 89.4 percent, use social in 82.5 percent, first-time motives led by
      conformity and euphoria — see [the traditional-patterns
      findings](/history/egypt-mufti-fetwa-1940/).[@khalifa75]
    sources:
      - khalifa75
