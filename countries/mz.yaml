segments:
  possession:
    text: >-
      Law 3/97 punishes use and personal possession with up to two years in prison plus a fine.
      Above three days' average personal supply, the law sets a one-year minimum. Courts may
      waive punishment for occasional users under Article 55(4). A separate exemption for
      minors requires no repeat offence, a promise to stop and acceptance of treatment if dependent.
    sources:
      - law97
  cultivation:
    text: >-
      Unauthorised cannabis cultivation carries three days to one year in prison under Article 34.
      Growing for personal use carries up to one year or a fine under Article 55(3), with possible
      waivers for occasional users.
    sources:
      - law97
  enforcement:
    text: >-
      Legal researchers argue criminalising use is counter-productive; in practice arrests are
      selective — a well-known rapper critical of the government was detained over a small amount of
      suruma in 2011.
    sources:
      - ref
      - gv
  sharing:
    text: >-
      Giving or selling cannabis without authority falls within trafficking, ordinarily punished
      with sixteen to twenty years. Small-scale or substantially less serious cases can receive
      two to eight years plus a fine. In May 2024 the Supreme Court applied that lesser offence
      to a seller with 590 grams, reducing his sentence from seventeen years to six.
    sources:
      - law97
      - court24
  consumption:
    text: Consumption is itself criminalised under Article 55.
    sources:
      - law97
  access:
    text: >-
      None: Law 3/97 punishes use and possession of drugs with prison.
    sources:
      - ref
