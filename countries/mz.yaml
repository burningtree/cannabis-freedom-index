  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited.
    sources:
      - wiki
      - ref
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. Use and personal possession carry up to
      two years plus a fine, with a one-year minimum above three days' personal supply. Courts
      may waive punishment for occasional users.
    sources:
      - law97
  black_market:
    text: >-
      Figures reported by the government to the UN drugs office record 1,856 kg of herbal
      cannabis seized in 2024, against 1,853 kg in 2023. The UN publishes them as kilogram
      equivalents, and countries count seizures differently, so the figures are not
      comparable across borders.
    sources:
      - unodc_szr
  arrests:
    text: >-
      The annual report of the Central Office for Drug Prevention and Combat, presented by
      the public prosecutor's office in Maputo, counted at least 732 people detained for
      drug use and trafficking in 2024, 229 fewer than in 2023; Sofala province had the
      most, 199. Seizures of cannabis were almost unchanged at 1,856 kg, against 1,853 kg
      the year before, with 44 kg of hashish.
    sources:
      - rtp25
