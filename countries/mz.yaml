  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited.
    sources:
      - wiki
      - ref
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. British travel advice says a
      conviction for drug use, possession or trafficking brings a long prison sentence and a
      fine.
    sources:
      - wiki
      - fcdo
