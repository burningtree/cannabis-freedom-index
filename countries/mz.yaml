segments:
  possession:
    text: >-
      Law 3/97 punishes use and possession of drugs with up to two years in prison, graded by
      quantity: holding more than about three days' personal supply brings up to a year. A judge can
      waive prison for an occasional, non-recidivist user who agrees to treatment.
    sources:
      - ref
      - wiki
  cultivation:
    text: Cultivation is a crime; cannabis (suruma) is widely grown in the centre and north.
    sources:
      - wiki
  enforcement:
    text: >-
      Legal researchers argue criminalising use is counter-productive; in practice arrests are
      selective — a well-known rapper critical of the government was detained over a small amount of
      suruma in 2011.
    sources:
      - ref
      - gv
  sharing:
    text: Supply is trafficking, with long sentences.
    sources:
      - ref
  consumption:
    text: Consumption is itself criminalised under Article 55.
    sources:
      - ref
  access:
    text: None.
    sources:
      - wiki
