  consequences:
    text: >-
      Convicts serve sentences in separate colonies with marked uniforms, and a record follows them
      afterwards.
    sources:
      - kp
  planting:
    seeds: grey
    seeds_trade: unclear
    clones: illegal
    clones_trade: banned
    text: >-
      Article 11 of the 2012 narcotics law bans cultivation, defined as sowing or growing, of
      plants containing narcotic substances, except where other legislation allows it. The law
      does not mention seeds.
    sources:
      - z408
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited.
    sources:
      - lb
      - kp
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. British travel advice says possession
      of illegal drugs, including small amounts of cannabis, can bring a prison sentence of up
      to 5 years, and smuggling or trafficking up to 25 years; the rules also apply to
      passengers only transiting through the airport, and it tells travellers to expect strict
      enforcement.
    sources:
      - lb
      - fcdo
