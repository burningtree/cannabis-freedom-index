name: Belarus
region: Europe
iso_numeric: 112
recreational: illegal
medical: none
updated: "2026-10-22"
summary: >-
  Personal possession can bring short custody, restriction of liberty or two to five years in
  prison. A 2025 reform widened sentencing options; growing for drugs and recreational supply remain
  crimes.
scores:
  possession: 0
  cultivation: 1
  enforcement: 1
  sharing: 0
  consumption: 0
  access: 0
segments:
  possession:
    text: >-
      Acquiring or possessing drugs without intent to supply can bring short custody, restriction of
      liberty for up to five years, or two to five years in prison. The short-custody option was
      added in March 2025; the code defines that sentence as one to three months in strict
      isolation. The offence gives no small-personal-amount exemption.
    sources:
      - code25
      - code19
      - explanation25
  cultivation:
    text: >-
      Sowing or growing drug-containing plants for sale or to obtain drugs is a separate offence.
      The basic penalty is a fine, short custody, restriction of liberty for up to three years or
      prison for up to three years. Repeat and group cases carry heavier penalties. There is no
      personal home-growing allowance.
    sources:
      - code19
      - law12
  enforcement:
    text: >-
      The 2025 reform added short custody for personal offences and restriction of liberty for basic
      supply. In June 2026 prosecutors reported restriction of liberty made up 48% of drug sentences
      in the previous year, most often in personal-use cases. This means supervised obligations and
      can involve an open correctional institution or supervision outside one.
    sources:
      - prosecutor26
      - explanation25
      - code19
  sharing:
    text: >-
      Unlawful supply is criminalised. The basic supply offence
      now carries restriction of liberty for three to five years or prison for three to eight years,
      with an optional fine on the prison sentence. Aggravated supply carries longer terms.
    sources:
      - code25
  consumption:
    text: >-
      Public drug use and specified drug-related public or workplace intoxication can lead to
      criminal punishment when repeated within a year after an administrative penalty for the same
      conduct: a fine, short custody or restriction of liberty for up to two years. Possession is a
      separate criminal offence.
    sources:
      - code19
  access:
    text: >-
      Recreational acquisition and supply remain criminal offences. The Health Ministry’s list
      places marijuana, hashish and cannabis oil among dangerous narcotic drugs not used for medical
      purposes.
    sources:
      - code25
      - list25
context:
  production:
    status: none
    text: >-
      Unauthorised drug manufacture and processing are criminalised, with heavier penalties where
      supply is intended. Growing drug-containing plants has a separate criminal offence; the
      environmental list also names Cannabis sativa among plants barred from introduction and
      establishment.
    sources:
      - code25
      - code19
      - hemp16
  products:
    text: >-
      Marijuana, hashish and cannabis oil appear in list 5 of the Health Ministry’s controlled-drug
      list, headed dangerous narcotic drugs not used for medical purposes. The marijuana definition
      covers THC-containing cannabis plant parts, with specific exclusions for whole seeds
      unaccompanied by other plant parts and for root systems.
    sources:
      - list25
  medical:
    text: >-
      Marijuana, hashish and cannabis oil are classified as dangerous narcotic drugs not used for
      medical purposes in the reviewed Health Ministry list, consolidated through February 2025.
    sources:
      - list25
  consequences:
    text: >-
      Personal possession remains a criminal offence even when the court chooses short custody or
      restriction of liberty. Restriction of liberty imposes supervised obligations and can be
      served in an open correctional institution or without placement there. The May 2025 amnesty
      widened eligibility for people with no previous convictions, subject to individual conditions.
    sources:
      - code19
      - code25
      - amnestyGuide
  planting:
    seeds: grey
    seeds_trade: unclear
    clones: illegal
    clones_trade: banned
    text: >-
      The narcotics law prohibits sowing or growing drug-containing plants, subject to exceptions in
      legislation. Growing to obtain drugs is punishable under a separate cultivation offence. The
      marijuana definition excludes whole seeds when unaccompanied by other plant parts; that
      exclusion gives no permission to germinate them.
    sources:
      - law12
      - code19
      - list25
  clubs:
    status: none
    text: >-
      Collective drug cultivation and recreational supply fall under the criminal prohibitions on
      growing drug-containing plants and supplying drugs. The basic supply offence includes
      restriction of liberty or prison.
    sources:
      - law12
      - code25
  visitors:
    status: none
    text: >-
      There is no legal recreational supply. Personal possession is criminalised and can bring short
      custody or two to five years in prison. The criminal code excludes foreign citizens and
      stateless people without permanent residence from the restriction-of-liberty sentence
      available to eligible residents.
    sources:
      - code25
      - code19
  black_market:
    text: >-
      Figures reported by the government to the UN drugs office record 69.3 kg of herbal
      cannabis seized in 2024, against 88.1 kg in 2023, and 485 kg of cannabis resin
      seized in 2024, against 671 kg in 2023. The UN publishes them as kilogram
      equivalents, and countries count seizures differently, so the figures are not
      comparable across borders.
    sources:
      - unodc_szr
