segments:
  possession:
    text: >-
      Under Article 328 of the Criminal Code, acquiring or possessing drugs without intent to
      distribute is punished with restriction of liberty for up to five years or imprisonment for
      two to five years. There is no small-amount exception: one documented case brought five years
      in a maximum-security colony for 0.164 g of marijuana.
    sources:
      - lb
  cultivation:
    text: Cultivation falls under the same article, with the same or heavier terms.
    sources:
      - lb
  enforcement:
    text: >-
      Several thousand people a year are imprisoned under Article 328, with average sentences of
      around eight years according to the 'Mothers 328' movement of prisoners' families. Bills to
      ease penalties have been introduced following their campaign.
    sources:
      - kp
      - pz
  sharing:
    text: >-
      Passing a joint to a friend counts as distribution. Young people caught with a gram or two
      while smoking together have received five to eight years.
    sources:
      - lb
      - kp
  consumption:
    text: >-
      Use in public or appearing in public under the influence is an administrative offence; in
      practice users are charged with possession.
    sources:
      - lb
  access:
    text: None.
    sources:
      - lb
