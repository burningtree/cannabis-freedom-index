  planting:
    seeds: grey
    seeds_trade: banned
    clones: grey
    clones_trade: banned
    text: >-
      Article 349 of the Penal Code punishes anyone who, "for the purpose of exploitation or
      trade", illicitly sows, grows or harvests plants or seeds from which controlled
      substances can be obtained, with five to ten years in prison. Financing the growing or
      sale of such seeds or plants carries ten to twenty-five years under Article 348. The
      code does not make growing for one's own use a separate offence.
    sources:
      - cp641
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. The Penal Code treats possession of less
      than 5 g of marijuana as a minor offence, with 70 to 100 day-fines and 30 to 60 days of
      community service and no prison; larger amounts are crimes.
    sources:
      - clr
      - cp641
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited.
    sources:
      - cp641
  black_market:
    text: >-
      Figures reported by the government to the UN drugs office record 1,980 kg of herbal
      cannabis seized in 2024, against 2,640 kg in 2022. The UN publishes them as kilogram
      equivalents, and countries count seizures differently, so the figures are not
      comparable across borders.
    sources:
      - unodc_szr
