segments:
  possession:
    text: >-
      Law 735 of 2010 criminalises cannabis, but the Penal Code treats possession of less than 5 g
      of marijuana as a minor offence: 70 to 100 day-fines and 30 to 60 days of community service at
      two hours a day, with no prison. Above that, possession is charged under the trafficking
      provisions with five to fifteen years.
    sources:
      - cr
      - clr
  cultivation:
    text: Cultivation is a crime under Law 735.
    sources:
      - cr
  enforcement:
    text: >-
      A fine and community service under 5 g — described by one analysis as de facto
      decriminalisation — and a very steep jump above it.
    sources:
      - clr
      - cr
  sharing:
    text: Sale and transport carry five to fifteen years.
    sources:
      - cr
  consumption:
    text: Use is not separately punished beyond the minor-possession offence.
