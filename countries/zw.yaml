segments:
  possession:
    text: >-
      Possession of mbanje other than for licensed medicinal or scientific purposes is a crime under
      the Dangerous Drugs Act and the criminal code, with a maximum reported at up to twelve years.
      Small amounts usually bring a fine or community service.
    sources:
      - cr
      - lp
  cultivation:
    text: Unlicensed cultivation is a crime.
    sources:
      - nr
      - cr
  enforcement:
    text: >-
      Fines for small amounts, prison for dealing; lawyers have argued the continued criminalisation
      of personal use is unconstitutional.
    sources:
      - lex
      - lp
  sharing:
    text: Unlawful dealing carries up to fifteen years.
    sources:
      - lp
  consumption:
    text: >-
      The government stressed when it licensed production in 2018 that smoking mbanje remains
      illegal.
    sources:
      - nr
  access:
    text: None for the public.
    sources:
      - nr
context:
  production:
    text: >-
      Statutory Instrument 62 of 2018 allows licensed production of cannabis for medicinal and
      scientific use, administered by the medicines regulator; hemp was later added as an
      alternative to tobacco. Licences are costly and mainly export-oriented.
    sources:
      - cr
      - lex
  products:
    text: Licensed medicinal products, largely for export.
    sources:
      - cr
  medical:
    text: Permitted under licence in principle; little real patient access.
    sources:
      - cr
      - lex
  consequences:
    text: A conviction is a criminal record.
    sources:
      - lp
  planting:
    seeds: licensed
    seeds_trade: regulated
    clones: licensed
    clones_trade: regulated
    text: >-
      The criminal code's definition of the cannabis plant leaves out only seed that has been
      crushed or processed so it cannot germinate, so viable seed is controlled. Under the
      2018 medicinal cannabis regulations a licensed producer may sell or provide cannabis
      seeds, in labelled containers that keep them dry.
    sources:
      - code
      - si62
