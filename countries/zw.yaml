segments:
  possession:
    text: >-
      Possession of mbanje other than for licensed medicinal or scientific purposes is a crime under
      the Dangerous Drugs Act and the criminal code, with a maximum reported at up to twelve years.
      Small amounts usually bring a fine or community service.
    sources:
      - lp
  cultivation:
    text: Unlicensed cultivation is a crime.
    sources:
      - nr
  enforcement:
    text: >-
      Fines for small amounts, prison for dealing; lawyers have argued the continued criminalisation
      of personal use is unconstitutional.
    sources:
      - lex
      - lp
  sharing:
    text: Unlawful dealing carries up to fifteen years.
    sources:
      - lp
  consumption:
    text: >-
      The government stressed when it licensed production in 2018 that smoking mbanje remains
      illegal.
    sources:
      - nr
  access:
    text: None for the public.
    sources:
      - nr
context:
  production:
    text: >-
      Statutory Instrument 62 of 2018 allows licensed production of cannabis for medicinal and
      scientific use, administered by the medicines regulator; hemp was later added as an
      alternative to tobacco. The government presented the law as making Zimbabwe a hub for cannabis
      research, and its first licence went to a Harare company for a cannabis farm. Licences are
      costly and mainly export-oriented.
    sources:
      - lex
      - cgh
  products:
    text: Reliable national information about legally available cannabis products was not established by the retained sources.
    sources: []
  medical:
    text: Permitted under licence in principle; little real patient access.
    sources:
      - lex
  consequences:
    text: A conviction is a criminal record.
    sources:
      - lp
  planting:
    seeds: licensed
    seeds_trade: regulated
    clones: licensed
    clones_trade: regulated
    text: >-
      The criminal code's definition of the cannabis plant leaves out only seed that has been
      crushed or processed so it cannot germinate, so viable seed is controlled. Under the
      2018 medicinal cannabis regulations a licensed producer may sell or provide cannabis
      seeds, in labelled containers that keep them dry.
    sources:
      - code
      - si62
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited.
    sources:
      - nr
      - lp
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. British travel advice says illegal
      drugs, including cannabis, carry severe penalties and tells travellers to expect a long
      jail sentence and heavy fines for possessing, using or smuggling them, also when only
      changing planes. Airport scanners are also used on the baggage of passengers in transit.
    sources:
      - nr
      - fcdo
  driving:
    status: impairment
    text: >-
      Road Traffic Act section 55(2) prohibits driving or attempting to drive on a road
      when drugs, alcohol or their combination prevent proper vehicle control. The
      Ministry's published text provides a fine up to level twelve or up to ten years'
      imprisonment or both for ordinary vehicles. For a commuter omnibus or heavy
      vehicle it specifies two to fifteen years, subject to section 88A's exception
      to mandatory penalties. The published disqualification provisions normally
      require at least six months for an ordinary first conviction, twelve months for
      a second similar conviction within the stated ten-year period, and a lifetime
      ban for a third or later conviction. Commuter-omnibus and heavy-vehicle convictions
      carry additional lifetime restrictions on those vehicle classes. Courts can
      decline the ban for recorded special circumstances surrounding the offence;
      personal circumstances of the offender do not qualify. Licence cancellation
      follows for the affected vehicle classes. No monetary conversion of the fine
      level, current roadside tariff or numerical THC limit is asserted here.
    sources:
      - trafficact
