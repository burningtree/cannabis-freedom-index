name: Zimbabwe
region: Africa
iso_numeric: 716
recreational: illegal
medical: limited
updated: '2026-10-22'
summary: >-
  Recreational cannabis remains criminalised. The criminal code provides a fine, up to five years in
  prison, or both for unlawful possession, use or personal cultivation. Medical production and industrial
  hemp have separate licensing routes.
scores:
  possession: 1
  cultivation: 1
  enforcement: 1
  sharing: 1
  consumption: 1
  access: 0
segments:
  possession:
    text: >-
      Section 157 of the criminal code punishes unlawful acquisition or possession with a fine up to
      level ten, up to five years in prison, or both. Where addiction is established, a court may order
      treatment in addition to or instead of another sentence. In July 2026 prosecutors reported an
      effective four-year term for possession of 19.49 kg.
    sources:
      - code
      - npa2026
  cultivation:
    text: >-
      Unlawful growing for personal consumption falls under section 157, with a fine up to level ten, up
      to five years in prison, or both. Growing for dealing falls under section 156, whose ordinary
      maximum is fifteen years, with a fine alone or alongside imprisonment also available. Medicinal
      production and industrial hemp have separate licence and permit routes.
    sources:
      - code
      - si62
      - hemp19
      - hemp20
  enforcement:
    text: >-
      A National Prosecuting Authority bulletin dated 17 July 2026 reported that Clever Makwarimba
      received an effective four-year sentence for unlawful possession of 19.49 kg of cannabis after a
      roadside bag search. It is a dated example of custody under the cannabis prohibition.
    sources:
      - npa2026
  sharing:
    text: >-
      Unlawful supply, delivery or distribution falls under the criminal code’s dealing offence, with a
      fine, up to fifteen years in prison, or both. The special aggravated-dealing tier expressly
      excludes cannabis plant, prepared cannabis and cannabis resin.
    sources:
      - code
  consumption:
    text: >-
      Section 157 expressly criminalises unlawfully ingesting, smoking or otherwise consuming a dangerous
      drug, including cannabis. It provides a fine up to level ten, up to five years in prison, or both,
      with a possible treatment order where addiction is established.
    sources:
      - code
  access:
    text: >-
      Recreational retail supply is prohibited. Medicinal and scientific production is licensed
      separately; the medicines regulator also opened applications for hemp-based CBD complementary
      medicines in 2022.
    sources:
      - code
      - si62
      - mcaz2022
context:
  production:
    text: >-
      The 2018 regulations introduced five-year medicinal and scientific production licences. The
      regulator’s 2022 review recorded fifty-nine licences issued and cannabis growing witnessed at five
      inspected sites, alongside eighteen visited sites with no development. Industrial hemp has a
      separate authorisation and permit system under the 2019 and 2020 rules.
    sources:
      - si62
      - mcaz2022
      - hemp19
      - hemp20
  products:
    text: >-
      The 2023 criminal-code amendment defines industrial hemp at no more than 1% delta-9 THC by dry
      weight, including seeds and derivatives, and excludes it from the cannabis-plant branch of the
      dangerous-drug definition. The original 2020 hemp permit rules use 0.3%. Hemp-based CBD medicines
      enter a separate product-registration route opened by the medicines regulator in 2022.
    sources:
      - hemp23
      - hemp20
      - mcaz2022
  medical:
    text: >-
      Production for medicinal and scientific purposes is licensed. In its 2022 report, the medicines
      regulator described production as export-oriented, with local use limited to research and
      development, and separately recorded acceptance of hemp-based CBD complementary-medicine
      applications.
    sources:
      - si62
      - mcaz2022
  consequences:
    text: >-
      Unlawful possession, use and personal cultivation can bring a fine, imprisonment or both. Where
      addiction is established, the court may impose treatment in addition to or instead of another
      sentence. Prosecutors reported a four-year custodial sentence in a 19.49 kg possession case in July
      2026.
    sources:
      - code
      - npa2026
  planting:
    seeds: licensed
    seeds_trade: regulated
    clones: licensed
    clones_trade: regulated
    text: >-
      The criminal code excludes seeds processed so that they cannot germinate from its cannabis-plant
      definition; viable cannabis seed is otherwise covered. The medicinal-production regulations provide
      for licensed seed and plant supply with specified labels. Industrial-hemp seeds and propagation are
      separately subject to the hemp definitions and permit rules.
    sources:
      - code
      - si62
      - hemp20
      - hemp23
  clubs:
    status: none
    text: >-
      Unlawful recreational cultivation and supply are criminal offences under the code.
      Medical-production licences and industrial-hemp permits authorise specified activities.
    sources:
      - code
      - si62
      - hemp20
  visitors:
    status: none
    text: >-
      Recreational supply is prohibited. The criminal code makes unlawful possession and consumption
      punishable by a fine up to level ten, up to five years in prison, or both.
    sources:
      - code
  driving:
    status: impairment
    text: >-
      Road Traffic Act section 55(2) prohibits driving or attempting to drive on a road when drugs,
      alcohol or their combination prevent proper vehicle control. The Ministry's published text provides
      a fine up to level twelve or up to ten years' imprisonment or both for ordinary vehicles. For a
      commuter omnibus or heavy vehicle it specifies two to fifteen years, subject to section 88A's
      exception to mandatory penalties. The published disqualification provisions normally require at
      least six months for an ordinary first conviction, twelve months for a second similar conviction
      within the stated ten-year period, and a lifetime ban for a third or later conviction.
      Commuter-omnibus and heavy-vehicle convictions carry additional lifetime restrictions on those
      vehicle classes. Courts can decline the ban for recorded special circumstances surrounding the
      offence; personal circumstances of the offender do not qualify. Licence cancellation follows for
      the affected vehicle classes. No monetary conversion of the fine level, current roadside tariff or
      numerical THC limit is asserted here.
    sources:
      - trafficact
  black_market:
    text: >-
      Figures reported by the government to the UN drugs office record 627 kg of herbal cannabis seized
      in 2023. The UN publishes them as kilogram equivalents, and countries count seizures differently,
      so the figures are not comparable across borders.
    sources:
      - unodc_szr
