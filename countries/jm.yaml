name: Jamaica
region: North America
iso_numeric: 388
recreational: decriminalised
medical: legal
updated: 2026-10-23
summary: >-
  Since 2015 up to 2 oz is a petty offence with no record, five plants per household are allowed,
  and Rastafari sacramental use is legal. Licensed herb houses serve patients and visitors.
scores:
  possession: 3
  cultivation: 4
  enforcement: 4
  sharing: 2
  consumption: 3
  access: 4
segments:
  possession:
    text: >-
      Not actually legal: possessing up to 2 oz (56 g) is a ticketable infraction with a fixed J$500
      penalty — no arrest, no court, no criminal record. Above 2 oz it is still a criminal offence.
      Rastafari adherents and holders of a medical permit may possess lawfully.
    sources:
      - fact
  cultivation:
    text: >-
      Each household may legally grow up to five ganja plants on its premises; where several
      households share a property, each gets five. More than that is an offence unless licensed.
    sources:
      - fact
  enforcement:
    text: >-
      Small-scale possession and public smoking mean a ticket. Possession over 2 oz, unlicensed
      cultivation beyond five plants, dealing and export remain criminal with fines and prison.
      Under-18s found with ganja are referred to counselling.
    sources:
      - fact
  sharing:
    text: >-
      There is no provision for gifting. Supplying ganja to another person outside the licensed
      medical system or sacramental use remains dealing.
    sources:
      - fact
      - facts2
  consumption:
    text: >-
      Smoking in public places is prohibited on the same terms as tobacco, with a J$500 ticket. It
      is lawful at a private residence that is not a workplace, in licensed premises, and at places
      registered for Rastafari worship or exempt events.
    sources:
      - fact
  access:
    text: >-
      A recommendation or prescription from a registered medical doctor takes medical or
      therapeutic possession outside the ticket rules. The Cannabis Licensing Authority licences
      sale for those purposes. A visitor who does not ordinarily live in Jamaica may apply to the
      Ministry of Health for a permit to buy and possess up to 2 ounces at a time for medical or
      therapeutic purposes. The applicant produces evidence that a licensed doctor in their home
      country recommended or prescribed ganja, or signs a voluntary declaration confirming that,
      and pays a fee.
    sources:
      - moj15
context:
  production:
    text: >-
      The Cannabis Licensing Authority issues cultivator, processor, transporter, retail and
      research licences in tiers by size. Fees, security rules and banking problems kept many
      traditional small growers outside the legal industry; in 2026 the authority widened fee-free
      routes in for them, with two-year transition periods and collective cultivation of up to ten
      acres for community groups.
    sources:
      - cla
      - mh
  products:
    text: >-
      Licensed retailers offer flower, oils, edibles and other preparations for medical or
      therapeutic purposes. Hemp is licensed separately.
    sources:
      - cla
      - fact
  medical:
    text: >-
      Any registered medical practitioner can recommend ganja for medical or therapeutic purposes,
      with no fixed list of conditions. Patients buy from licensed herb houses.
    sources:
      - fact
      - cla
  consequences:
    text: >-
      Tickets leave no criminal record, and earlier convictions for small quantities can be
      expunged. Unpaid tickets can lead to a court order for community service.
    sources:
      - fact
      - facts2
  planting:
    seeds: grey
    seeds_trade: unclear
    clones: grey
    clones_trade: unclear
    text: >-
      The justice ministry's fact sheet on the 2015 amendment says each household may legally
      grow up to five ganja plants. It does not mention seeds or say where a household may
      obtain plants.
    sources:
      - fact
  black_market:
    text: >-
      Most ganja in Jamaica is still grown and sold outside the licensed system: enforcement
      is patchy and tourists and locals buy on the street. The licensed sector is small, with
      15.4 hectares under legal cultivation and about 13 tonnes produced in 2025, valued by
      the regulator at 63.5 million US dollars, a figure that leaves out illegal cannabis and
      home growing. Police tie the export trade to guns: by July 2025 they had seized more
      than 40,000 pounds of ganja that year, and described the seizures as part of a clampdown
      on a guns-for-drugs trade in which ganja is the currency, with Haitians among those
      arrested.
    sources:
      - gl26
      - gl25
      - ap21
  visitors:
    status: open
    text: >-
      A visitor who does not ordinarily live in Jamaica, including a tourist or a Jamaican who
      lives abroad, may apply to the Ministry of Health for a permit to buy and possess up to 2
      ounces of ganja at a time for medical or therapeutic purposes. The applicant produces
      evidence that a licensed doctor in the country where they live recommended or prescribed it,
      or signs a voluntary declaration confirming that, and pays a fee. Without that permit, up to
      2 ounces brings a J$500 ticket, with no arrest and no criminal record. More than 2 ounces
      remains a criminal offence. Smoking in a public place brings the same J$500 ticket.
    sources:
      - moj15
  clubs:
    status: none
    text: >-
      There are no members' growing clubs. Supplying ganja to another person outside the
      licensed medical system or sacramental use remains dealing; the collective settings the
      law does allow are licensed dispensaries, where smoking on the premises is permitted,
      and Rastafari sacramental use.
    sources:
      - fact
      - facts2
      - lp26
  driving:
    status: impairment
    text: >-
      The Road Traffic Act 2018 makes drug influence that prevents proper vehicle control
      an offence when driving, attempting to drive or being in charge on a road or public
      place. Its court penalty table lists a maximum J$50,000 fine, with fourteen days'
      imprisonment in default of payment, and fourteen demerit points. Conviction normally
      brings twelve months' licence disqualification; the court can depart for special
      reasons or impose a longer ban. Separately, section 123(j) prohibits smoking ganja
      while driving, attempting to drive or being in charge on a road, without requiring
      proof of impairment. Police list a J$10,000 fixed penalty and two points for that
      offence; the Act's court maximum is J$20,000, with seven days in default of payment.
      These are distinct penalties. No quantified THC limit was verified in the Act and
      2022 Regulations reviewed.
    sources:
      - rta2018
      - jcftraffic
      - rtaregs2022
  arrests:
    text: >-
      Before the reform of April 2015, Jamaican police arrested about 15,000 people a year
      for possessing cannabis, a quarter of all court cases concerned cannabis, and
      arrests and prosecutions were estimated to cost 64 million US dollars a year,
      according to a case study by Harm Reduction International. After possession of small
      amounts became a ticketable matter, court cases for possessing or smoking cannabis
      fell by more than 90 per cent, and criminal cases referred to the courts in 2016
      were 25 per cent fewer than in 2014.
    sources:
      - hri25
