segments:
  possession:
    text: >-
      Not actually legal: possessing up to 2 oz (56 g) is a ticketable infraction with a fixed J$500
      penalty — no arrest, no court, no criminal record. Above 2 oz it is still a criminal offence.
      Rastafari adherents and holders of a medical permit may possess lawfully.
    sources:
      - fact
  cultivation:
    text: >-
      Each household may legally grow up to five ganja plants on its premises; where several
      households share a property, each gets five. More than that is an offence unless licensed.
    sources:
      - fact
  enforcement:
    text: >-
      Small-scale possession and public smoking mean a ticket. Possession over 2 oz, unlicensed
      cultivation beyond five plants, dealing and export remain criminal with fines and prison.
      Under-18s found with ganja are referred to counselling.
    sources:
      - fact
  sharing:
    text: >-
      There is no provision for gifting. Supplying ganja to another person outside the licensed
      medical system or sacramental use remains dealing.
    sources:
      - fact
      - facts2
  consumption:
    text: >-
      Smoking in public places is prohibited on the same terms as tobacco, with a J$500 ticket. It
      is lawful at a private residence that is not a workplace, in licensed premises, and at places
      registered for Rastafari worship or exempt events.
    sources:
      - fact
  access:
    text: >-
      Licensed 'herb houses' sell to people with a medical recommendation — obtainable from a local
      practitioner. Visitors with a prescription from home can buy a permit to purchase up to 2 oz
      at a time. Formally a medical market, in practice accessible; the informal market remains far
      larger.
    sources:
      - fact
      - cla
context:
  production:
    text: >-
      The Cannabis Licensing Authority issues cultivator, processor, transporter, retail and
      research licences in tiers by size. Fees, security rules and banking problems kept many
      traditional small growers outside the legal industry; in 2026 the authority widened fee-free
      routes in for them, with two-year transition periods and collective cultivation of up to ten
      acres for community groups.
    sources:
      - cla
      - mh
  products:
    text: >-
      Licensed retailers offer flower, oils, edibles and other preparations for medical or
      therapeutic purposes. Hemp is licensed separately.
    sources:
      - cla
      - fact
  medical:
    text: >-
      Any registered medical practitioner can recommend ganja for medical or therapeutic purposes,
      with no fixed list of conditions. Patients buy from licensed herb houses.
    sources:
      - fact
      - cla
  consequences:
    text: >-
      Tickets leave no criminal record, and earlier convictions for small quantities can be
      expunged. Unpaid tickets can lead to a court order for community service.
    sources:
      - fact
      - facts2
  planting:
    seeds: grey
    seeds_trade: unclear
    clones: grey
    clones_trade: unclear
    text: >-
      The justice ministry's fact sheet on the 2015 amendment says each household may legally
      grow up to five ganja plants. It does not mention seeds or say where a household may
      obtain plants.
    sources:
      - fact
