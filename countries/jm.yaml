name: Jamaica
region: North America
iso_numeric: 388
recreational: decriminalised
medical: legal
updated: 2026-10-27
summary: >-
  Since 2015 up to 2 oz is a petty offence with no record, five plants per household are allowed,
  and Rastafari sacramental use is legal. Licensed herb houses serve patients and visitors.
# the search-result description, where the generated one runs long (src/lib/seo.js)
seo_description: >-
  Jamaica has decriminalised cannabis: up to 2 oz (56 g) brings a J$500 ticket, with no arrest and
  no criminal record. Licensed sellers supply patients, and visitors can apply for a medical
  permit.
scores:
  possession: 3
  cultivation: 4
  enforcement: 4
  sharing: 2
  consumption: 3
  access: 4
# The channel the access score cannot name (src/lib/answers.js).
answers:
  buy:
    answer: limited
    text: From licensed sellers, with a doctor's recommendation; visitors can apply for a permit
words:
  - word: Ganja
    lang: Jamaican English
    meaning: The standard Jamaican word for cannabis, brought by indentured labourers from India in the 19th century
    sources:
      - cjm
  - word: Spliff
    lang: Jamaican English
    meaning: A cannabis cigarette; the standard Jamaican term for a joint
    sources:
      - wiktionary-spliff
  - word: Herb
    lang: Jamaican English
    meaning: Cannabis, especially in Rastafari and reggae usage — "the herb" as sacrament and medicine
    sources:
      - wiktionary-herb
segments:
  possession:
    text: >-
      Not actually legal: possessing up to 2 oz (56 g) is a ticketable infraction with a fixed J$500
      penalty — no arrest, no court, no criminal record.[@moj15,fact] Above 2 oz it is still a
      criminal offence.[@moj15] Rastafari adherents and holders of a medical permit may possess
      lawfully.[@moj15]
    sources:
      - moj15
      - fact
    currency: JMD
    penalties:
      - upto: 2 oz
        treatment: civil
        term: Ticket (fixed penalty notice)
        fine: 500
        note: No arrest, court or criminal record; under-18s and dependent users are also sent for counselling. Rastafari and medical patients are exempt
      - over: 2 oz
        treatment: criminal
        term: Criminal offence
        note: A fine, prison or both, and a criminal record
  cultivation:
    text: >-
      Each household may legally grow up to five ganja plants on its premises; where several
      households share a property, each gets five.[@moj15,fact] More than that is an offence unless
      licensed.[@moj15]
    sources:
      - moj15
      - fact
    penalties:
      - upto: 5 plants
        treatment: legal
        note: Per household, on its own premises
      - over: 5 plants
        treatment: criminal
        term: Criminal offence
        note: Unless licensed, or authorised for Rastafari sacramental or research purposes
  enforcement:
    text: >-
      Small-scale possession and public smoking mean a ticket.[@fact] Possession over 2 oz, unlicensed
      cultivation beyond five plants, dealing and export remain criminal with fines and
      prison.[@fact] Under-18s found with ganja are referred to counselling.[@fact]
    sources:
      - fact
  sharing:
    text: >-
      There is no provision for gifting.[@fact] Supplying ganja to another person outside the licensed
      medical system or sacramental use remains dealing.[@facts2]
    sources:
      - fact
      - facts2
  consumption:
    text: >-
      Smoking in public places is prohibited on the same terms as tobacco, with a J$500
      ticket.[@fact] It is lawful at a private residence that is not a workplace, in licensed
      premises, and at places registered for Rastafari worship or exempt events.[@fact]
    sources:
      - fact
  access:
    text: >-
      A recommendation or prescription from a registered medical doctor takes medical or
      therapeutic possession outside the ticket rules.[@moj15] The Cannabis Licensing Authority
      licences sale for those purposes.[@moj15] A visitor who does not ordinarily live in Jamaica may
      apply to the Ministry of Health for a permit to buy and possess up to 2 ounces at a time for
      medical or therapeutic purposes.[@moj15] The applicant produces evidence that a licensed doctor
      in their home country recommended or prescribed ganja, or signs a voluntary declaration
      confirming that, and pays a fee.[@moj15]
    sources:
      - moj15
context:
  recreational:
    text: >-
      Ganja is part of everyday Jamaican life, but there is still no legal recreational market.
      Since 2015 an adult with up to 2 ounces gets a J$500 ticket instead of an arrest, and a
      household may grow five plants.[@moj15] Licensed herb houses sell flower, oils and edibles,
      but only for medical or therapeutic use, on a doctor's recommendation or, for visitors, a
      permit; the first, Kaya Herbhouse, [opened in March
      2018](/history/jamaica-first-herb-house-2018/).[@cla,fact] Most ganja is still grown and sold
      outside the licensed system, and tourists and locals alike buy it on the street.[@ap21,gl26]
    sources:
      - moj15
      - cla
      - fact
      - ap21
      - gl26
  medical:
    text: >-
      Any registered medical practitioner can recommend ganja for medical or therapeutic purposes,
      with no fixed list of conditions.[@fact] Patients buy from licensed herb houses.[@cla]
    sources:
      - fact
      - cla
  hemp:
    status: high
    text: >-
      The law defines hemp as a ganja plant with less than 1% THC and takes it out of the ganja
      rules; growing, processing and trading it need a licence from the [Cannabis Licensing
      Authority](https://www.cla.org.jm/).[@moj15] Hemp can be made into cloth, paper and rope,
      and into medicines, drinks and cosmetics.[@moj15]
    sources:
      - moj15
  production:
    status: medical
    text: >-
      The Cannabis Licensing Authority issues cultivator, processor, transporter, retail and
      research licences in tiers by size.[@cla] The legal industry is small but growing: the
      regulator put its value at US$63.5 million in 2025, up from US$38.9 million in 2024, on
      15.4 hectares of licensed land, and the first four exports of ganja products, oils, balms
      and lotions, left the island that year.[@gl26] Fees, security rules and banking problems kept
      many traditional small growers outside the legal industry; in 2026 the authority [widened
      fee-free routes in for them](/history/jamaica-small-grower-routes-2026/), with two-year
      transition periods and collective cultivation of up to ten acres for community
      groups.[@cla,mh]
    sources:
      - cla
      - gl26
      - mh
  consequences:
    text: >-
      Tickets leave no criminal record, and earlier convictions for small quantities can be
      expunged.[@fact] Unpaid tickets can lead to a court order for community service.[@facts2]
    sources:
      - fact
      - facts2
  planting:
    seeds: grey
    seeds_trade: unclear
    clones: grey
    clones_trade: unclear
    text: >-
      The justice ministry's fact sheet on the 2015 amendment says each household may legally
      grow up to five ganja plants.[@fact] It does not mention seeds or say where a household may
      obtain plants.
    sources:
      - fact
  black_market:
    text: >-
      Most ganja in Jamaica is still grown and sold outside the licensed system: enforcement
      is patchy and tourists and locals buy on the street.[@ap21,gl26] The licensed sector is small,
      with 15.4 hectares under legal cultivation and about 13 tonnes produced in 2025, valued by
      the regulator at 63.5 million US dollars, a figure that leaves out illegal cannabis and
      home growing.[@gl26] Police tie the export trade to guns: by July 2025 they had seized more
      than 40,000 pounds of ganja that year, and described the seizures as part of a clampdown
      on a guns-for-drugs trade in which ganja is the currency, with Haitians among those
      arrested.[@gl25]
    sources:
      - gl26
      - gl25
      - ap21
  visitors:
    status: open
    text: >-
      A visitor who does not ordinarily live in Jamaica, including a tourist or a Jamaican who
      lives abroad, may apply to the Ministry of Health for a permit to buy and possess up to 2
      ounces of ganja at a time for medical or therapeutic purposes.[@moj15] The applicant produces
      evidence that a licensed doctor in the country where they live recommended or prescribed it,
      or signs a voluntary declaration confirming that, and pays a fee.[@moj15] Without that permit,
      up to 2 ounces brings a J$500 ticket, with no arrest and no criminal record.[@moj15] More than
      2 ounces remains a criminal offence.[@moj15] Smoking in a public place brings the same J$500
      ticket.[@moj15]
    sources:
      - moj15
  clubs:
    status: none
    text: >-
      There are no members' growing clubs.[@lp26] Supplying ganja to another person outside the
      licensed medical system or sacramental use remains dealing;[@facts2] the collective settings
      the law does allow are licensed dispensaries, where smoking on the premises is permitted,
      and Rastafari sacramental use.[@fact,lp26]
    sources:
      - fact
      - facts2
      - lp26
  driving:
    status: impairment
    text: >-
      The Road Traffic Act 2018 makes drug influence that prevents proper vehicle control
      an offence when driving, attempting to drive or being in charge on a road or public
      place.[@rta2018] Its court penalty table lists a maximum J$50,000 fine, with fourteen days'
      imprisonment in default of payment, and fourteen demerit points.[@rta2018] Conviction normally
      brings twelve months' licence disqualification; the court can depart for special
      reasons or impose a longer ban.[@rta2018] Separately, section 123(j) prohibits smoking ganja
      while driving, attempting to drive or being in charge on a road, without requiring
      proof of impairment.[@rta2018] Police list a J$10,000 fixed penalty and two points for that
      offence; the Act's court maximum is J$20,000, with seven days in default of payment.[@jcftraffic,rta2018]
      These are distinct penalties. No quantified THC limit was verified in the Act and
      2022 Regulations reviewed.[@rta2018,rtaregs2022]
    sources:
      - rta2018
      - jcftraffic
      - rtaregs2022
  arrests:
    text: >-
      Before the reform of April 2015, Jamaican police arrested about 15,000 people a year
      for possessing cannabis, a quarter of all court cases concerned cannabis, and
      arrests and prosecutions were estimated to cost 64 million US dollars a year,
      according to a case study by Harm Reduction International.[@hri25] After possession of small
      amounts became a ticketable matter, court cases for possessing or smoking cannabis
      fell by more than 90 per cent, and criminal cases referred to the courts in 2016
      were 25 per cent fewer than in 2014.[@hri25]
    sources:
      - hri25
  culture:
    text: >-
      Ganja came to Jamaica with indentured labourers from India in the mid-19th century, and the Hindi word
      [ganja](/culture/language/ganja/) came with it.[@cjm] By the early 1970s it was drunk as
      [tea](/culture/traditions/ganja-tea-in-jamaica/) and tonic in rural households far more than
      it was smoked, as the anthropologists Vera Rubin and Lambros Comitas found in the national
      study they [published in 1972](/history/jamaica-ganja-study-published-1972/).[@rubin] For
      [Rastafari](/culture/traditions/rastafari-sacrament/) it became a sacrament, smoked in shared
      reasoning; the early preacher [Leonard Howell](/culture/people/leonard-howell/) founded
      Pinnacle, a community that grew it with its food until colonial police broke it up.[@rasta,howell]
      Reggae carried the herb to the world through singers such as [Bob
      Marley](/culture/people/bob-marley/) and [Peter Tosh](/culture/people/peter-tosh/), whose 1976
      album Legalize It made legalisation a song.[@tosh]
    sources:
      - cjm
      - rubin
      - rasta
      - howell
      - tosh
  research:
    status: licensed
    text: >-
      Jamaican doctors turned folk knowledge into medicine. The pharmacologist Manley West and the
      eye surgeon Albert Lockhart of the University of the West Indies noticed that fishermen who
      drank ganja tea saw better at night, and after years of work produced Canasol, an eye drop
      for glaucoma, and later Asmasol for asthma; both men received the Order of Merit.[@west]
      Today accredited universities and bodies approved by the Scientific Research Council may grow
      ganja for research under a licence.[@moj15] Earlier, the 1969–1972 Research Institute for
      the Study of Man project with the University of the West Indies produced the island’s
      landmark cannabis ethnography, recording ganja as a work stimulant in adult work circles
      and a class marker shed by the upwardly mobile — see [the work-enhancement
      findings](/history/jamaica-ganja-work-enhancement-1970/).[@comitas75]
    sources:
      - west
      - moj15
      - comitas75
  spotlights:
    - title: A sacrament in law
      text: >-
        Jamaica's 2015 reform wrote the Rastafari sacrament into law. Adherents aged 18 and over may
        possess ganja for religious purposes, smoke it at registered places of worship, and apply
        to grow it, and Rastafari organisations may hold events where it is used.[@moj15]
      sources:
        - moj15
    - title: Ganja's farmers, outside the ganja industry
      text: >-
        The growers who supplied Jamaica for generations mostly stayed outside the licensed
        industry, kept out by fees, security rules and banks; in 2021 the island even ran short of
        ganja after drought and lockdowns.[@ap21,cla] The legal sector covers just 15.4 hectares,
        and the regulator's figures leave out the far larger illegal crop.[@gl26] The 2026 fee-free
        routes are meant to bring the traditional growers in.[@mh]
      sources:
        - ap21
        - cla
        - gl26
        - mh

