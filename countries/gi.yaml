name: Gibraltar
region: Europe
iso_numeric: 292
dependency:
  of: gb
  kind: British Overseas Territory
  note: >-
    Gibraltar is a British Overseas Territory with its own parliament and drug laws. The United
    Kingdom answers for it internationally, including under the UN drug conventions.
recreational: illegal
medical: limited
updated: '2026-10-28'
summary: >-
  Cannabis possession and home growing are crimes, with fines or imprisonment available. Medical
  access is limited to controlled medicines: trained public-health doctors may authorise
  approved cannabis-based products for specified conditions, with smoking prohibited.
scores:
  possession: 1
  cultivation: 1
  enforcement: 2
  sharing: 1
  consumption: 1
  access: 1
segments:
  possession:
    text: >-
      Cannabis and resin are Class B drugs.[@law] Possession carries up to twelve months or a
      £10,000 fine, or both, in summary proceedings; on indictment, up to five years or a fine,
      or both.[@law,procedure] A [December 2025 case](/history/gibraltar-possession-fine-2025/)
      involving about 127 g of resin ended in an £800 fine.[@police]
    sources:
      - law
      - procedure
      - police
    currency: GBP
    penalties:
      - label: Summary, lower court
        treatment: criminal
        prison: 12 months
        note: Prison or a fine, or both; section 506(2), Schedule 8
        fine: 10000
        term: Possession
      - label: Indictment, higher court
        treatment: criminal
        prison: 5 years
        note: Prison or a fine, or both; no fixed fine ceiling stated in this row
        term: Possession
  cultivation:
    text: >-
      Growing any cannabis plant requires lawful authority under section 508.[@law] Cultivation
      carries up to nine months or a £4,000 fine, or both, in summary proceedings; on
      indictment, up to fourteen years or a fine, or both.[@law,procedure] The [2021 medicinal
      industry Act](/history/gibraltar-medicinal-cannabis-act-2021/) is still marked Not In
      Force.[@m21]
    sources:
      - law
      - procedure
      - m21
    currency: GBP
    penalties:
      - label: Summary, lower court
        treatment: criminal
        prison: 9 months
        note: Prison or a fine, or both
        fine: 4000
        term: Cultivation
      - label: Indictment, higher court
        treatment: criminal
        prison: 14 years
        term: Cultivation
        note: Prison or a fine, or both
  enforcement:
    text: >-
      Courts can impose fines or prison for possession; the statutory maxima depend on how the
      case is tried.[@law] One December 2025 possession case involving about 127 g of resin
      ended in an £800 fine.[@police] A separate reported possession-with-intent-to-supply case
      ended in 200 hours of community work.[@supply]
    sources:
      - law
      - police
      - supply
  sharing:
    text: >-
      Giving, selling or offering cannabis to another person is covered by the supply
      offence.[@law] Summary supply or possession with intent to supply carries up to twelve
      months or a £10,000 fine, or both; on indictment the maximum is life imprisonment or a
      fine, or both.[@law,procedure] Knowingly permitting cannabis smoking or prohibited drug
      activity on premises carries up to twelve months or a £10,000 fine, or both, summarily; up
      to fourteen years or a fine, or both, on indictment.[@law,procedure]
    sources:
      - law
      - procedure
    penalties:
      - label: Supply / possession with intent — summary
        treatment: criminal
        term: Supply
        prison: 12 months
        fine: 10000
        note: Prison or a fine, or both; sections 504(3), 506(3)
      - label: Supply / possession with intent — indictment
        treatment: criminal
        term: Supply
        life: possible
        note: Life imprisonment or a fine, or both; Schedule 8
      - label: Knowingly permitting cannabis smoking or prohibited drug activity — summary
        treatment: criminal
        term: Premises offence
        prison: 12 months
        fine: 10000
        note: Prison or a fine, or both; section 518
      - label: Such premises offence — indictment
        treatment: criminal
        term: Premises offence
        prison: 14 years
        note: Prison or a fine, or both; Schedule 8
    currency: GBP
  consumption:
    text: >-
      Unauthorised possession associated with cannabis use is criminal. Occupiers who knowingly
      permit cannabis smoking on their premises can also commit an offence.[@law] Patients using
      approved GHA cannabis products may not administer them by smoking.[@reg]
    sources:
      - law
      - reg
  access:
    text: >-
      Adult-use supply is prohibited.[@law] The medical route requires trained GHA doctors and
      approved products for specified conditions; the government designated St Bernard’s
      Hospital pharmacy for public dispensing.[@gov19] In September 2023 it announced completed
      training and a Cantourage UK supply agreement, subject to final detail.[@gov23]
    sources:
      - law
      - gov19
      - gov23
context_not_applicable:
  death_penalty:
    text: >-
      Gibraltar abolished capital punishment on 8 November 1965, in line with British practice;
      its last hanging for murder was in 1931. No cannabis offence carries a capital
      sentence.[@cpu]
    sources:
      - cpu
context:
  recreational:
    text: >-
      Adult-use supply is prohibited: possession can bring up to twelve months in prison or a
      fine in lower-court proceedings, or five years or a fine in a higher-court trial, and
      supply can carry up to life imprisonment.[@law] A 2025 case with about 127 g of resin
      ended in an £800 fine.[@police]
    sources:
      - law
      - police
  production:
    status: none
    text: >-
      Unauthorised production is criminal, and cultivating cannabis has its own offence.[@law]
      The [2021 medicinal-cannabis Act](/history/gibraltar-medicinal-cannabis-act-2021/) is
      still marked Not In Force; commencement requires a ministerial notice.[@m21]
    sources:
      - law
      - m21
  medical:
    text: >-
      GHA doctors must complete training before authorising cannabis medicines.[@reg] Eligible
      conditions are treatment-resistant multiple-sclerosis spasticity, severe refractory
      epilepsy, severe life-altering pain, and intractable chemotherapy-related nausea and
      vomiting.[@reg] Products require GHA approval, and smoking is prohibited.[@reg] The rules
      distinguish the defined cannabis-extract mouth spray from GHA-approved cannabis-based
      medicines, and public dispensing runs through St Bernard's Hospital pharmacy.[@reg,gov19]
      The government reported completed doctor training and a supply agreement in September
      2023.[@gov23]
    sources:
      - reg
      - gov19
      - gov23
  consequences:
    text: >-
      Possession can lead to a fine, imprisonment or both, depending on the proceedings and
      sentence.[@law] Courts can order forfeiture and destruction or disposal of items connected
      with drug offences.[@law] For an adult, a fine normally has a twelve-month rehabilitation
      period from conviction; custody of six months or less normally requires two years after
      the sentence, including any licence period, is completed.[@procedure] Longer custodial
      terms have longer periods, with statutory exclusions and exceptions.[@procedure]
    sources:
      - law
      - procedure
  clubs:
    status: none
    text: >-
      Supplying cannabis to another person and cultivating it are offences, subject to
      authorised exceptions. The criminal code provides no personal-use club exemption.[@law]
    sources:
      - law
  visitors:
    status: none
    text: >-
      Adult-use cannabis imports are prohibited; authorised imports depend on a licence or a
      regulatory exception.[@law] The medicines regulations allow personal prescribed controlled
      drugs to be carried to or from a Schengen state with a valid Article 75 certificate,
      limited to thirty days’ supply.[@reg]
    sources:
      - law
      - reg
  hemp:
    status: strict
    text: >-
      Hemp products derived or extracted from cannabis, including CBD products, are exempted
      from the import/export, production/supply and possession restrictions when they contain
      less than 0.3% THC.[@reg] The Office of Fair Trading includes them in its goods categories
      and says Customs may require an acceptable laboratory certificate.[@oft] Growing any
      cannabis plant remains subject to the separate cultivation restriction.[@law]
    sources:
      - reg
      - oft
      - law
  driving:
    status: limit
    text: >-
      Driving, attempting to drive or being in charge on a road or other public place with blood
      THC above 2 micrograms per litre is an offence.[@road,limits] Driving or attempting to
      drive carries up to six months or a £10,000 fine, or both; being in charge carries up to
      three months or £4,000, or both.[@road,procedure] There is a conditional defence for
      lawfully prescribed or supplied medicine taken according to directions, including advice
      about driving intervals.[@road] Unfitness through drugs is separately prohibited.[@road]
      In May 2024 a driver with at least 3.8 micrograms/litre THC was fined £250 and
      disqualified for eight months.[@annual]
    sources:
      - road
      - limits
      - procedure
      - annual
  arrests:
    text: >-
      The police authority’s 2024/25 offence table records 169 drug-possession offences and 22
      drug-supply offences, covering all drugs.[@annual] A separate section explicitly labelled
      April 2023–March 2024 reports 212 drug-misuse offences and 181 arrests.[@annual] Its
      examples range from a £140 fine for 5.67 g of cannabis resin to imprisonment for cocaine
      supply.[@annual]
    sources:
      - annual
  black_market:
    text: >-
      Police describe targeting drug suppliers, their proceeds and money laundering as linked
      priorities.[@annual] The section for April 2023–March 2024 reports over 2.7 kg of Class B
      drugs seized, alongside smaller Class A and C totals.[@annual] The report also describes
      monitoring cannabis-resin transportation and sales at the land frontier.[@annual]
    sources:
      - annual
