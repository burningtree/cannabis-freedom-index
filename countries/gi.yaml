name: Gibraltar
region: Europe
iso_numeric: 292
dependency:
  of: gb
  kind: British Overseas Territory
  note: >-
    Gibraltar is a British Overseas Territory with its own parliament and drug laws. The United
    Kingdom answers for it internationally, including under the UN drug conventions.
recreational: illegal
medical: limited
updated: 2026-10-17
summary: >-
  Cannabis is a Class B drug and possession is prosecuted in the Magistrates' Court, where it ends
  in a fine. Smuggling cannabis resin by sea is punished with years in prison. Since 2019 doctors at the public health authority may supply
  approved cannabis-based medicines that are not smoked.
scores:
  possession: 1
  cultivation: 1
  enforcement: 2
  sharing: 1
  consumption: 1
  access: 1
segments:
  possession:
    text: >-
      Possession of cannabis, a Class B drug, is a criminal offence tried in the Magistrates' Court.
      In December 2025 a man stopped on a foot patrol with about 127 g of cannabis resin was charged
      with possession and fined £800 there the day after his arrest.
    sources:
      - rgp25
  cultivation:
    text: >-
      Growing cannabis is production of a controlled drug under the Drugs (Misuse) Act, with no
      exception for personal use. No licensed cultivation exists.
    sources:
      - gov19
  enforcement:
    text: >-
      Possession cases end in fines in the Magistrates' Court. Smuggling is punished with prison: in
      July 2026 the Supreme Court jailed two men caught on a boat from Ceuta with 284.5 kg of
      cannabis resin for four years and for three years and five months.
    sources:
      - rgp25
      - chr26
  sharing:
    text: >-
      Possession with intent to supply is prosecuted as a separate offence: a 19-year-old with
      cannabis resin worth £1,180 hidden in a sofa was given 200 hours of unpaid community work. No
      distinction is made for sharing without payment.
    sources:
      - rgp652
  consumption:
    text: >-
      Use is dealt with through the possession offence. Even patients on approved cannabis medicines
      may not take them by smoking.
    sources:
      - gov19
  access:
    text: >-
      No legal adult-use source. Since 2019 doctors working for the Gibraltar Health Authority, after
      training, may supply approved cannabis-based products for four conditions: spasticity in
      multiple sclerosis, severe refractory epilepsy, severe pain that has not responded to standard
      treatment, and nausea from chemotherapy. They are dispensed only by the hospital pharmacy.
    sources:
      - gov19
context:
  production:
    text: >-
      No licensed cannabis production. Cannabis resin arrives by sea, and the courts treat large
      importations severely.
    sources:
      - chr26
  products:
    text: >-
      Only cannabis-based medicines approved by the Gibraltar Health Authority as safe and effective,
      supplied through the pharmacy at St Bernard's Hospital. Products already sold in local
      pharmacies were not affected by the 2019 rules.
    sources:
      - gov19
  medical:
    text: >-
      The Drugs (Misuse) (Amendment) Regulations 2019 let trained doctors of the public health
      authority supply cannabis-based products for medicinal use in limited circumstances. Each
      product needs the authority's approval, and patients may not smoke them.
    sources:
      - gov19
  consequences:
    text: >-
      A possession case leaves a criminal conviction. Seized drugs are forfeited and, in importation
      cases, the vessel too, and confiscation proceedings may follow.
    sources:
      - rgp25
      - chr26
  clubs:
    status: none
    text: >-
      No cannabis clubs are known. Supply is prosecuted.
    sources:
      - rgp652
  visitors:
    status: none
    text: >-
      There is no legal supply for anyone, and importing cannabis is prosecuted in the Supreme Court
      with prison sentences.
    sources:
      - rgp25
