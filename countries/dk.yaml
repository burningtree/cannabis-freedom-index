segments:
  possession:
    text: >-
      Possession of any amount is an offence. For small amounts for personal use the standard
      outcome is a fine that rises with repeat offences; larger amounts or signs of dealing can
      bring prison. The guideline fine for up to 9.9 g of hash is DKK 2,000 for a first offence,
      DKK 3,000 for a second and DKK 4,000 thereafter.
    sources:
      - prosecutor
  cultivation:
    text: >-
      Growing cannabis for its THC is illegal and prosecuted; penalties scale with the number of
      plants. Licensed medical production and permitted industrial-hemp growing are exceptions.
    sources:
      - order2026
      - prosecutor
  enforcement:
    text: Fines for users; prison for cultivation and dealing, with long sentences for organised trade.
    sources:
      - prosecutor
  sharing:
    text: Supply is a crime, with prison for anything beyond trivial amounts.
    sources:
      - order2026
      - prosecutor
  consumption:
    text: Use is not itself named as an offence, but possession is, so users are fined when caught.
    sources:
      - order2026
      - prosecutor
  access:
    text: >-
      No legal adult-use source. Copenhagen's open hash market on Christiania's Pusher Street was
      dug up and closed in 2024. Medical cannabis is dispensed by pharmacies on prescription.
    sources:
      - pusher
      - medical
context:
  production:
    text: >-
      Denmark licenses cultivation and manufacture of medical cannabis and hosts several
      export-oriented producers.
    sources:
      - bulk
      - law439
  products:
    text: Prescription flower and oils under the medical scheme; low-THC products up to 0.2%.
    sources:
      - medical
      - seed_answer
  medical:
    text: >-
      A pilot programme that began in 2018 let any doctor prescribe cannabis products not otherwise
      approved as medicines. Parliament made it permanent from 1 January 2026, with partial
      reimbursement.
    sources:
      - medical
      - law439
  consequences:
    text: >-
      A fine solely under the controlled-substances law does not appear on either the private or
      public criminal-record certificate, although a prison sentence does. Driving is illegal above
      0.001 mg THC per kg of blood; higher levels can bring conditional or unconditional licence
      disqualification.
    sources:
      - record
      - traffic
  planting:
    seeds: grey
    seeds_trade: open
    clones: licensed
    clones_trade: regulated
    text: >-
      Cannabis seeds are excluded from the controlled-substances order, so possession and sale are
      lawful; germinating them is not, unless the resulting cultivation is licensed or permitted.
      Cuttings are cannabis plant material and therefore controlled. Licensed medical businesses
      may propagate and distribute plants or plant parts to licensed growers, while low-THC
      industrial hemp may be grown under permit. Clones are consequently confined to regulated
      licensed channels.
    sources:
      - order2026
      - seed_answer
      - seed_trade
