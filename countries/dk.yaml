name: Denmark
region: Europe
iso_numeric: 208
recreational: illegal
medical: legal
updated: '2026-10-28'
summary: >-
  Possession is punished with fines. The medical cannabis programme became permanent in 2026, and
  Denmark hosts licensed producers. Christiania's open market was shut down in 2024.
scores:
  possession: 2
  cultivation: 1
  enforcement: 4
  sharing: 1
  consumption: 1
  access: 2
segments:
  possession:
    text: >-
      Possession of any amount is an offence. For small amounts for personal use the standard
      outcome is a fine that rises with repeat offences;[@prosecutor] larger amounts or signs of dealing can
      bring prison.[@prosecutor] The guideline fine for up to 9.9 g of hash is DKK 2,000 for a first offence,
      DKK 3,000 for a second and DKK 4,000 thereafter.[@prosecutor]
      [Fines replaced warnings in 2004.](/history/denmark-fines-2004/)
    sources:
      - prosecutor
    currency: DKK
    penalties:
      - upto: 9.9 g
        treatment: criminal
        term: Possession of euphoriant substances
        fine: 2000
        note: First offence; guideline fine for up to 9.9 g of hash
      - upto: 9.9 g
        repeat: 2
        treatment: criminal
        term: Possession of euphoriant substances
        fine: 3000
        note: Second offence
      - upto: 9.9 g
        repeat: 3
        treatment: criminal
        term: Possession of euphoriant substances
        fine: 4000
        note: Third and later offences
  cultivation:
    text: >-
      Growing cannabis for its THC is illegal and prosecuted; penalties scale with the number of
      plants.[@prosecutor] Larger grows face up to two years under the Euphoriants Act,[@esarep]
      and trafficking-scale cases go under Penal Code section 191.[@dkcode] Licensed medical
      production and permitted industrial-hemp growing are exceptions.[@order2026]
    sources:
      - order2026
      - prosecutor
      - esarep
      - dkcode
    penalties:
      - label: Growing for personal use
        treatment: criminal
        term: Cultivation of euphoriant substances
        note: Fine under the charging guidance, scaling with plant numbers
      - label: Larger or commercial growing
        treatment: criminal
        term: Cultivation of euphoriant substances
        prison: 2 years
        note: Fine or up to two years under the Euphoriants Act; trafficking-scale cases go under Penal Code section 191 (up to ten years)
  enforcement:
    text: >-
      Fines for users; prison for cultivation and dealing, with long sentences for organised trade.[@prosecutor]
      [Fines replaced warnings in 2004.](/history/denmark-fines-2004/)
    sources:
      - prosecutor
  sharing:
    text: >-
      Supply is a crime.[@order2026,prosecutor] Ordinary supply is punished under the
      Euphoriants Act with a fine or up to two years in prison; aggravated supply under Penal Code section 191 — to a
      considerable number of people, for a large payment or in otherwise aggravating
      circumstances — carries up to ten years.[@esarep,dkcode]
      [The six-year maximum for serious supply dates to 1969.](/history/denmark-serious-drug-supply-1969/)
    sources:
      - order2026
      - prosecutor
      - esarep
      - dkcode
    penalties:
      - label: Ordinary supply (Euphoriants Act)
        treatment: criminal
        term: Unlawful supply of euphoriant substances
        prison: 2 years
        note: Fine or up to two years
      - label: Aggravated supply (Penal Code section 191)
        treatment: criminal
        term: Aggravated supply (Penal Code section 191)
        prison: 10 years
        note: Considerable number of buyers, large payment or other aggravating circumstances
  consumption:
    text: Use is not itself named as an offence, but possession is, so users are fined when caught.[@order2026,prosecutor]
    sources:
      - order2026
      - prosecutor
  access:
    text: >-
      No legal adult-use source. Copenhagen's open hash market on Christiania's Pusher Street was
      dug up and closed in 2024.[@pusher] Medical cannabis is dispensed by pharmacies on prescription.[@medical]
      [Pusher Street was dug up and closed in 2024.](/history/denmark-pusher-street-closed-2024/)
      [The medical scheme became permanent in 2026.](/history/denmark-medical-permanent-2026/)
    sources:
      - pusher
      - medical
context:
  recreational:
    text: >-
      There is no legal way to buy cannabis. Most adults buy hashish from dealers and smoke at
      home: possession of any amount is an offence, punished with fines that rise with repeat
      offences.[@prosecutor] Copenhagen's open hash market on Pusher Street was dug up and
      closed in 2024, scattering the trade.[@pusher] Use itself is not a separate offence, but
      users are fined through possession.[@order2026]
      [Pusher Street was dug up and closed in 2024.](/history/denmark-pusher-street-closed-2024/)
    sources:
      - prosecutor
      - pusher
      - order2026
  hemp:
    status: strict
    text: >-
      Industrial hemp has been legal since 1998: growers register the crop with the Agricultural
      Agency and use approved varieties with no more than 0.2% THC.[@dma,groweriq] CBD sits in a
      grey zone, sold as prescription products or unauthorised food rather than on an open
      consumer market.[@groweriq]
    sources:
      - dma
      - groweriq
  spotlights:
    - title: The street that sold hash openly
      text: >-
        Christiania's Pusher Street sold cannabis openly for decades until it was dug up and
        closed in 2024, ending the country's most famous open market.[@pusher]
      sources:
        - pusher
  production:
    status: medical
    text: >-
      Denmark licenses cultivation and manufacture of medical cannabis and hosts several
      export-oriented producers.[@bulk,law439]
      [The medical scheme became permanent in 2026.](/history/denmark-medical-permanent-2026/)
    sources:
      - bulk
      - law439
  medical:
    text: >-
      A pilot programme that began in 2018 let any doctor prescribe cannabis products not otherwise
      approved as medicines, as flower and oils.[@medical] Parliament made it permanent from 1 January 2026, with partial
      reimbursement.[@law439] Low-THC products up to 0.2% sit outside the prescription route.[@seed_answer]
      [The pilot began in 2018.](/history/denmark-medical-pilot-2018/)
      [The medical scheme became permanent in 2026.](/history/denmark-medical-permanent-2026/)
    sources:
      - medical
      - law439
      - seed_answer
  consequences:
    text: >-
      A fine solely under the controlled-substances law does not appear on either the private or
      public criminal-record certificate, although a prison sentence does.[@record] Driving is illegal above
      0.001 mg THC per kg of blood; higher levels can bring conditional or unconditional licence
      disqualification.[@traffic]
    sources:
      - record
      - traffic
  planting:
    seeds: grey
    seeds_trade: open
    clones: licensed
    clones_trade: regulated
    text: >-
      Cannabis seeds are excluded from the controlled-substances order, so possession and sale are
      lawful;[@order2026] germinating them is not, unless the resulting cultivation is licensed or permitted.[@order2026]
      Cuttings are cannabis plant material and therefore controlled.[@order2026] Licensed medical businesses
      may propagate and distribute plants or plant parts to licensed growers,[@order2026] while low-THC
      industrial hemp may be grown under permit.[@seed_answer] Clones are consequently confined to regulated
      licensed channels.[@order2026,seed_trade]
    sources:
      - order2026
      - seed_answer
      - seed_trade
  driving:
    status: limit
    text: >-
      Denmark has a fixed limit of 1 nanogram of THC per millilitre of blood, alongside an
      offence of impaired driving; the rule does not apply to a substance taken in accordance
      with a medical prescription.[@euda_dd] Police may stop and test at random, using an oral-fluid
      test after a physical test and blood taken at a hospital.[@euda_dd] The driving ban runs from six
      months to ten years or for life, and prison of up to a year and a half is possible.[@euda_dd]
    sources:
      - euda_dd
  clubs:
    status: none
    text: >-
      No club is confirmed. A Europe-wide survey of cannabis social clubs carried out in 2018 and
      2019 received no answer from Denmark but, because of contradictory sources, could not rule out
      that clubs were active there.[@pardal20] No law in Denmark provides for them; Malta (since 2021) and
      Germany (since 2024) license non-profit cannabis associations, but only under their own laws.[@mt_cap628,de_cang]
      Nothing more recent was found.[@pardal20]
    sources:
      - pardal20
      - de_cang
      - mt_cap628
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone.[@prosecutor] Possession of any amount is an offence;
      for small amounts for personal use the standard outcome is a fine that rises with repeat
      offences.[@prosecutor]
    sources:
      - prosecutor
  black_market:
    text: >-
      The EU drugs agency's statistical bulletin records 522 kg of herbal cannabis and
      3,315 kg of cannabis resin seized in Denmark in 2024, against 384 kg and 3,965 kg in
      2023.[@euda_szr] Herbal cannabis was seized on 1,395 occasions and resin on 14,751.[@euda_szr] Countries
      record seizures differently, so the figures are not comparable across borders.[@euda_szr]
    sources:
      - euda_szr
  culture:
    text: >-
      For half a century hashish was sold openly from stalls on [Pusher Street](/culture/traditions/pusher-street/),
      the main street of Copenhagen's freetown Christiania, until the residents dug the street up
      themselves in 2024.[@pusher] The freetown began in 1971, when squatters took over an abandoned
      barracks; its defenders argued that concentrating the trade kept it out of the rest of
      society, the same reasoning as the Dutch coffeeshop.[@pusherstreet] Every May, Copenhagen's
      [Global Marijuana March](/culture/traditions/global-marijuana-march/) sets out from Christiania
      for the city hall square — smoking is illegal, but during the march the police look the other
      way.[@mmm]
      [Pusher Street was dug up and closed in 2024.](/history/denmark-pusher-street-closed-2024/)
      [The six-year maximum for serious supply dates to 1969.](/history/denmark-serious-drug-supply-1969/)
    sources:
      - pusher
      - pusherstreet
      - mmm
