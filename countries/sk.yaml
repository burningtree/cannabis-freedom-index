name: Slovakia
region: Europe
iso_numeric: 703
recreational: illegal
medical: none
updated: 2026-10-13
summary: >-
  Historically among the EU's harshest laws; a 2024 penal-code reform cut sentences for small
  amounts, but possession and growing remain crimes. CBD is legal.
scores:
  possession: 1
  cultivation: 1
  enforcement: 2
  sharing: 1
  consumption: 1
  access: 0
segments:
  possession:
    text: >-
      Possession is a crime under section 171 of the Criminal Code as rewritten by Act 40/2024,
      in force from 6 August 2024. Holding cannabis in a "negligible amount", which the Act's
      annex sets at up to 2 g of material or 200 mg of THC, carries up to one year in prison; a
      "small amount", up to five times that, six months to three years; and a larger amount or
      a repeat offence within 24 months, one to six years. For other drugs the lowest tier
      carries up to two years.
    sources:
      - tz40
      - gp24
  cultivation:
    text: >-
      Growing is a separate offence under section 172 since August 2024. Cannabis grown only
      for one's own use in a negligible amount, at most two plants, carries up to six months in
      prison; a small amount, up to two and a half times that, up to two years; a larger
      amount, six months to three years, and the ranges rise to five to fifteen years for the
      largest. Production and trafficking under section 173 start at one to five years.
    sources:
      - tz40
  enforcement:
    text: >-
      Sentences were reduced, but prison remains a realistic outcome, and cases of people facing a
      decade over home-grown cannabis still make headlines.
    sources:
      - rsi
      - sp
  sharing:
    text: >-
      Production and trafficking fall under section 173 of the Criminal Code: one to five years
      in prison for the smallest amounts, rising in steps to ten to twenty-five years or life
      for the largest.
    sources:
      - tz40
      - wiki
  consumption:
    text: >-
      Use is not itself an offence, but possession is, and the Criminal Code counts acquiring a
      drug for one's own use as possession.
    sources:
      - tz40
      - wiki
  access:
    text: No legal source.
    sources:
      - cms
context:
  production:
    text: >-
      No licensed production for consumption; cultivation for research needs health-ministry
      approval.
    sources:
      - cms
  products:
    text: CBD products; no legal THC products.
    sources:
      - cms
      - wiki
  medical:
    text: It is not permitted to grow, import or sell cannabis for medical use.
    sources:
      - cms
  consequences:
    text: A conviction is a criminal record.
    sources:
      - wiki
  planting:
    seeds: grey
    seeds_trade: unclear
    clones: illegal
    clones_trade: banned
    text: >-
      Act 139/1998 allows hemp to be grown in Slovakia only for industrial or research
      purposes, with a ministry permit valid for one year; industrial growing means growing
      for fibre and seed. The Act treats obtaining seed as a form of processing hemp and says
      nothing separate about holding or selling seed of other varieties.
    sources:
      - z139
  driving:
    status: zero
    text: >-
      No THC limit is set. The administrative offence is committed if a drug is detected, with
      a fine of 200 to 1,000 euros and a ban of up to a year; the criminal code separately
      punishes impaired driving with up to one year in prison for a repeat offender, or five
      for a driver of public transport, and a ban of one to ten years. Police may stop and
      test at random; there is no roadside oral-fluid test, and blood is taken at a hospital.
    sources:
      - euda_dd
  arrests:
    text: >-
      The EU drugs agency's statistical bulletin records 414 cannabis-related drug law
      offences in Slovakia in 2024, against 482 in 2023. Of the 2024 total, 235 were for use
      or possession for use. Countries count these differently (offences or offenders,
      criminal or administrative), so the figure is not comparable across borders.
    sources:
      - euda_dlo
  clubs:
    status: none
    text: >-
      No clubs are known. A Europe-wide survey of cannabis social clubs carried out in 2018
      and 2019 found, after online searches and contact with people in the field, that there
      did not seem to be any active club in Slovakia. The model is prohibited throughout the
      European Union. Nothing more recent was found.
    sources:
      - pardal20
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. Possession is a crime measured in usual
      single doses: up to three doses carries a maximum of one year in prison and up to ten
      doses a maximum of two years.
    sources:
      - sp
      - wiki
  black_market:
    text: >-
      The EU drugs agency's statistical bulletin records 123 kg of herbal cannabis and
      less than 1 kg of cannabis resin seized in Slovakia in 2024, against 112 kg and 9.5
      kg in 2023. Herbal cannabis was seized on 733 occasions and resin on 26. Plant seizures came to 210 plants. Countries record seizures differently, so the
      figures are not comparable across borders.
    sources:
      - euda_szr
