name: Slovakia
region: Europe
iso_numeric: 703
recreational: illegal
medical: limited
updated: 2026-10-04
summary: >-
  Historically among the EU's harshest laws; penal-code reform has reduced sentences for small
  amounts. CBD is legal.
scores:
  possession: 1
  cultivation: 1
  enforcement: 2
  sharing: 1
  consumption: 1
  access: 0
segments:
  possession:
    text: >-
      Possession is a crime, measured in 'usual single doses'. After a reform softening what had
      been central Europe's toughest drug law, up to three doses carries a maximum of one year in
      prison and up to ten doses a maximum of two years. Above ten doses the range is three to seven
      years.
    sources:
      - sp
      - wiki
  cultivation:
    text: >-
      Growing cannabis is treated as drug production, with multi-year sentences even for a few
      plants.
    sources:
      - rsi
      - wiki
  enforcement:
    text: >-
      Sentences were reduced, but prison remains a realistic outcome, and cases of people facing a
      decade over home-grown cannabis still make headlines.
    sources:
      - rsi
      - sp
  sharing:
    text: Supply is a serious crime.
    sources:
      - wiki
  consumption:
    text: Use is not itself an offence, but possession is.
    sources:
      - wiki
  access:
    text: No legal source.
    sources:
      - cms
context:
  production:
    text: >-
      No licensed production for consumption; cultivation for research needs health-ministry
      approval.
    sources:
      - cms
  products:
    text: CBD products; no legal THC products.
    sources:
      - cms
      - wiki
  medical:
    text: It is not permitted to grow, import or sell cannabis for medical use.
    sources:
      - cms
  consequences:
    text: A conviction is a criminal record.
    sources:
      - wiki
