name: Slovakia
region: Europe
iso_numeric: 703
recreational: illegal
medical: none
updated: 2026-10-28
summary: >-
  Possession and personal growing remain crimes: even the lowest cannabis quantity band carries up
  to one year in prison, and up to two plants carries up to six months. Medical cannabis has no
  lawful access programme.
scores:
  possession: 1
  cultivation: 1
  enforcement: 2
  sharing: 1
  consumption: 1
  access: 0
segments:
  possession:
    text: >-
      Possessing even a "negligible amount" of cannabis is a crime carrying up to one year in
      prison.[@code] The code sets that band at up to 2 g of material; above 2 g, up to 200 mg of
      THC can still place it in the lowest band.[@code] A small amount carries six months to three
      years; a greater amount or a repeat conviction within 24 months carries one to six
      years.[@code]
      [Slovakia set dose categories for personal possession in 2006.](/history/slovakia-criminal-code-dose-categories-2006/)
      [Slovakia cut sentences for small amounts in 2024.](/history/slovakia-penal-reform-2024/)
    sources:
      - code
    penalties:
      - label: Negligible amount (up to 2 g or 200 mg THC)
        treatment: criminal
        term: Possession
        prison: 1 year
        note: Even the lowest band stays a crime; courts can withhold punishment with treatment and probation
      - label: Small amount
        treatment: criminal
        term: Possession
        prison_min: 6 months
        prison: 3 years
        note: Higher than the negligible band
      - label: Greater amount or repeat within 24 months
        treatment: criminal
        term: Possession
        prison_min: 1 year
        prison: 6 years
        note: Repeat conviction within 24 months raises the band
  cultivation:
    text: >-
      Growing up to two cannabis plants solely for personal consumption, without distribution or
      profit, carries up to six months in prison.[@code] Three to five plants carries up to two
      years, and the next quantity band six months to three years.[@code] Sentences reach five to
      fifteen years for the largest quantities or other aggravated cases.[@code]
      [Slovakia set dose categories for personal possession in 2006.](/history/slovakia-criminal-code-dose-categories-2006/)
      [Slovakia cut sentences for small amounts in 2024.](/history/slovakia-penal-reform-2024/)
    sources:
      - code
    penalties:
      - label: Up to two plants for personal consumption
        treatment: criminal
        term: Cultivation
        prison: 6 months
        note: No distribution or profit; courts can withhold punishment with treatment and probation
      - label: Three to five plants
        treatment: criminal
        term: Cultivation
        prison: 2 years
        note: Above the two-plant personal band
      - label: Next quantity band
        treatment: criminal
        term: Cultivation
        prison_min: 6 months
        prison: 3 years
        note: Larger-scale growing
      - label: Largest quantities or aggravated cases
        treatment: criminal
        term: Cultivation
        prison_min: 5 years
        prison: 15 years
        note: Highest growing band
  enforcement:
    text: >-
      Personal possession and growing remain criminal offences.[@code] Courts can withhold
      punishment for the lower possession and growing offences while ordering treatment and up to
      two years of probation under the code's conditions.[@code]
      [Slovakia cut sentences for small amounts in 2024.](/history/slovakia-penal-reform-2024/)
    sources:
      - code
  sharing:
    text: >-
      Manufacturing or trafficking in the lowest quantity band carries one to five years in prison,
      rising to ten to twenty-five years or life in the most serious cases.[@code] The code
      separately includes obtaining cannabis for another person's personal consumption within its
      possession rules when the quantity and no-distribution, no-profit conditions are met.[@code]
      [Slovakia set dose categories for personal possession in 2006.](/history/slovakia-criminal-code-dose-categories-2006/)
    sources:
      - code
    penalties:
      - label: Manufacturing or trafficking, lowest band
        treatment: criminal
        term: Supply
        prison_min: 1 year
        prison: 5 years
        note: Lowest trafficking band
      - label: Most serious cases
        treatment: criminal
        term: Supply
        prison_min: 10 years
        prison: 25 years
        note: Or life imprisonment in the most serious cases
  consumption:
    text: >-
      The code punishes possession and growing for personal consumption.[@code] Its definition of
      possession includes buying, importing or otherwise obtaining a drug for personal use, so
      acquiring cannabis to consume remains a criminal offence.[@code]
      [Slovakia cut sentences for small amounts in 2024.](/history/slovakia-penal-reform-2024/)
    sources:
      - code
  access:
    text: >-
      There is no lawful recreational cannabis supply or medical cannabis programme.[@cms] The legal
      guide describes medical cultivation, import and sales as prohibited.[@cms]
      [Slovakia set dose categories for personal possession in 2006.](/history/slovakia-criminal-code-dose-categories-2006/)
    sources:
      - cms
words:
  - { word: Tráva, lang: Slovak, meaning: "literally grass; slang for weed (marijuana)", sources: [wiktionary-trava-sk] }
  - { word: Hašiš, lang: Slovak, meaning: "hashish", sources: [wiktionary-hasis-sk] }
context:
  culture:
    text: >-
      Slovakia's brush with a legal market is CBD: the country took CBD off its
      controlled-substance list in May 2021, and CBD from industrial hemp is lawful at up
      to 0.3% THC since 2022.[@cms, wiki]
      [Slovakia took CBD off its drug list in 2021.](/history/slovakia-cbd-delisted-2021/)
      See [CBD](/culture/language/cbd/).
    sources:
      - cms
      - wiki
  recreational:
    text: >-
      There is no legal recreational supply. Even a negligible amount — up to 2 g — is a crime
      with up to one year, and small amounts bring six months to three years.[@code] Courts
      can withhold punishment for the lower offences while ordering treatment and up to two
      years of probation.[@code] Growing up to two plants for personal use brings up to six
      months.[@code]
      [Slovakia cut sentences for small amounts in 2024.](/history/slovakia-penal-reform-2024/)
    sources:
      - code
  production:
    status: medical
    text: >-
      Hemp cultivation is allowed for industrial fibre and seed, or for research.[@z139] Research
      growers need a health-ministry permit.[@z139] Varieties in the EU common catalogue, including
      those listed when they were sown, are exempt from the cultivation permit requirement.[@z139]
      Medical cannabis production remains prohibited.[@cms]
    sources:
      - z139
      - cms
  medical:
    text: >-
      Growing, importing and selling cannabis for medical use remain prohibited; the country has no
      medical cannabis access programme.[@cms]
    sources:
      - cms
  consequences:
    text: >-
      For eligible lower-level possession and growing offences, a court can withhold punishment
      while ordering treatment.[@code] If the person completes the conditions successfully, the code
      treats them as having no conviction for the offence; otherwise the court can impose a
      sentence.[@code]
      [Slovakia set dose categories for personal possession in 2006.](/history/slovakia-criminal-code-dose-categories-2006/)
    sources:
      - code
  planting:
    seeds: grey
    seeds_trade: unclear
    clones: illegal
    clones_trade: banned
    text: >-
      Hemp may be grown for industrial fibre and seed or for research.[@z139] A ministry permit
      normally lasts one year, but varieties in the EU common catalogue, including those listed when
      sown, are exempt from that permit requirement.[@z139] Growing other cannabis for personal
      consumption remains a crime, including up to two plants.[@code]
    sources:
      - z139
      - code
  hemp:
    status: standard
    text: >-
      Hemp may be grown for industrial fibre and seed or for research; EU-catalogue varieties
      are exempt from the one-year ministry permit requirement.[@z139] CBD from industrial
      hemp is lawful at up to 0.3% THC since 2022.[@wiki] CBD was removed from the controlled-substance
      list in May 2021, though products for internal use stay prohibited.[@cms] Growing other cannabis for personal
      consumption stays criminal, including up to two plants.[@code]
      [Slovakia took CBD off its drug list in 2021.](/history/slovakia-cbd-delisted-2021/)
    sources:
      - z139
      - code
      - wiki
      - cms
  driving:
    status: zero
    text: >-
      The road law prohibits driving while a drug can still be present in the body, with no
      numerical THC allowance.[@road] Driving while impaired to the point of being unfit carries up
      to one year in prison under the Criminal Code; the same basic maximum applies to refusing the
      prescribed drug examination.[@code] Aggravated cases carry higher sentences.[@code]
    sources:
      - road
      - code
  arrests:
    text: >-
      The EU drugs agency records 414 cannabis-related drug law offences in Slovakia in 2024,
      against 482 in 2023.[@euda_dlo] Of the 2024 total, 235 were for use or possession for
      use.[@euda_dlo]
    sources:
      - euda_dlo
  clubs:
    status: none
    text: >-
      A European survey conducted in 2018–19 found no active cannabis social club in Slovakia after
      searches and contact with people in the field.[@pardal20] Current law criminalises personal
      growing as well as trafficking, leaving clubs without an authorised route to grow and
      distribute cannabis.[@code]
      [Slovakia set dose categories for personal possession in 2006.](/history/slovakia-criminal-code-dose-categories-2006/)
    sources:
      - pardal20
      - code
  visitors:
    status: none
    text: >-
      Visitors have no lawful recreational supply, and personal possession remains a crime.[@cms,
      code] The lowest cannabis quantity band carries up to one year in prison; larger quantities
      bring higher sentences under the current weight and THC rules.[@code]
      [Slovakia cut sentences for small amounts in 2024.](/history/slovakia-penal-reform-2024/)
    sources:
      - cms
      - code
  research:
    status: licensed
    text: >-
      Research growing needs a health-ministry permit: hemp may be grown for research, and EU
      varieties aside, permits normally last one year.[@z139] No separate research programme,
      trial or published study was established by the retained sources.
    sources:
      - z139
  black_market:
    text: >-
      The EU drugs agency records 123 kg of herbal cannabis and less than 1 kg of resin seized in
      Slovakia in 2024, against 112 kg and 9.5 kg in 2023.[@euda_szr] Herbal cannabis was seized on
      733 occasions and resin on 26.[@euda_szr] Plant seizures totalled 210 plants.[@euda_szr]
    sources:
      - euda_szr
