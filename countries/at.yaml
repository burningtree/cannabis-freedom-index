name: Austria
region: Europe
iso_numeric: 40
recreational: decriminalised
medical: limited
updated: 2026-10-23
summary: >-
  People caught with cannabis for personal use can have their case dropped after probation and any
  required health measures. Growing to obtain the drug is a crime. Patients can receive cannabinoid
  medicines, including dronabinol.
scores:
  possession: 2
  cultivation: 2
  enforcement: 4
  sharing: 1
  consumption: 2
  access: 1
segments:
  possession:
    text: >-
      Possessing cannabis for personal use remains a crime, with a basic maximum of six months in
      prison or 360 day-fines.[@ris] For cases that meet the law's conditions, prosecutors must put
      the case on hold for one to two years, with health measures such as treatment where
      needed.[@ris]
    sources:
      - ris
  cultivation:
    text: >-
      Growing cannabis with the purpose of obtaining the controlled drug is a crime.[@ris] The
      personal-use form carries up to six months in prison or 360 day-fines; the offence depends on
      that purpose, so plants can fall under it before flowering.[@ris]
    sources:
      - ris
  enforcement:
    text: >-
      Police report personal-use cases to the prosecutor and notify the health authority.[@ris]
      Prosecutors must put qualifying cases on hold under the law's conditions; this also covers
      unpaid supply for another person's personal use.[@ris]
    sources:
      - ris
  sharing:
    text: >-
      Giving cannabis to another person is an offence.[@ris] Cases involving unpaid supply for that
      person's personal use can be put on hold and later dropped under the same conditions as one's
      own personal use.[@ris]
    sources:
      - ris
  consumption:
    text: >-
      The law punishes acquiring and possessing cannabis, including for personal consumption.[@ris]
      People caught with cannabis for personal use can have their case put on hold and later
      dropped, with health assessment or treatment where the legal conditions require it.[@ris]
    sources:
      - ris
  access:
    text: >-
      Recreational supply remains prohibited.[@ris] Patients can receive prescription cannabinoid
      medicines: a parliamentary report names Sativex, Canemes and pharmacy-compounded
      dronabinol.[@parl] Current prescribing rules allow approved cannabis-extract medicines and
      highly purified THC for pharmacy preparations, while cannabis flower remains excluded.[@svg]
    sources:
      - ris
      - parl
      - svg
context:
  production:
    text: >-
      Growing cannabis to obtain the drug for manufacturing medicines is reserved to AGES, the
      Austrian health and food-safety agency, or a subsidiary at least 75% owned by it.[@ris] The
      harvest may be supplied only to businesses authorised to manufacture and wholesale medicines
      and poisons.[@ris]
    sources:
      - ris
  products:
    text: >-
      Prescription options include approved medicines made from cannabis extracts and pharmacy
      preparations using isolated delta-9-THC of more than 95% purity.[@svg] Cannabis flower cannot
      be prescribed under these rules.[@svg] A parliamentary report identifies dronabinol drops or
      capsules among the available preparations, alongside Sativex and Canemes.[@parl]
    sources:
      - svg
      - parl
  medical:
    text: >-
      Patients can obtain cannabinoid medicines on prescription, including pharmacy-compounded
      dronabinol.[@parl] A parliamentary report describes reimbursement where medically justified
      and approved by the insurer's reviewing doctor.[@parl] The prescribing rules permit approved
      cannabis-extract medicines and highly purified THC preparations, while excluding flower.[@svg]
    sources:
      - parl
      - svg
  consequences:
    text: >-
      A case put on hold comes with a probation period and any required health measures.[@ris]
      Prosecution can resume if the conditions are breached.[@ris] Once probation ends successfully
      and the required measures are completed, the prosecutor finally drops the case.[@ris]
    sources:
      - ris
  planting:
    seeds: grey
    seeds_trade: open
    clones: grey
    clones_trade: open
    text: >-
      Seeds unmixed with flowering or fruiting tops are excluded from the controlled-drug definition
      of cannabis.[@svg] Growing plants or cuttings becomes a criminal offence when the purpose is
      to obtain the controlled drug; flowering is not the only test.[@ris] The basic personal-use
      offence carries up to six months in prison or 360 day-fines.[@ris]
    sources:
      - svg
      - ris
  driving:
    status: impairment
    text: >-
      Driving while impaired by drugs is an offence; there is no numerical THC limit.[@euda_dd] The
      government's penalty table lists an €800–3,700 fine, a one-month licence withdrawal and
      traffic coaching for a first offence.[@driving]
    sources:
      - euda_dd
      - driving
  arrests:
    text: >-
      The EU drugs agency records 27,355 cannabis-related drug law offences in Austria in 2024,
      against 25,322 in 2023.[@euda_dlo] Of the 2023 total, 19,672 were for use or possession for
      use.[@euda_dlo] The total peaked at 37,751 in 2017.[@euda_dlo]
    sources:
      - euda_dlo
  clubs:
    status: underground
    text: >-
      A European survey conducted in 2018–19 received responses from four Austrian cannabis social
      clubs; its authors could not establish the full number operating in the country.[@pardal20]
      Supplying cannabis remains an offence, including through a club; qualifying unpaid
      personal-use cases can be put on hold and later dropped.[@ris]
    sources:
      - pardal20
      - ris
  visitors:
    status: none
    text: >-
      Visitors have no lawful recreational supply.[@ris] Possession remains a crime, while
      qualifying personal-use cases can be put on hold and later dropped, with health measures where
      needed.[@ris]
    sources:
      - ris
  black_market:
    text: >-
      The EU drugs agency records 2,370 kg of herbal cannabis and 1,745 kg of resin seized in
      Austria in 2024, against 2,470 kg and 183 kg in 2023.[@euda_szr] Herbal cannabis was seized on
      13,587 occasions and resin on 2,030.[@euda_szr] Plant seizures totalled 40,101
      plants.[@euda_szr]
    sources:
      - euda_szr
