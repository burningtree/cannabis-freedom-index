segments:
  possession:
    text: >-
      Possession is still a criminal offence under the Narcotic Substances Act, but for small
      amounts for personal use prosecutors must normally step back: since 2016 the case goes to the
      health authority instead ('therapy instead of punishment'), and proceedings are dropped if the
      person cooperates with any health measure ordered. No fixed gram limit is written into the
      law.
    sources:
      - cr
      - ris
  cultivation:
    text: >-
      Growing cannabis to obtain THC is an offence. Seeds and non-flowering plants and cuttings are
      sold openly in shops as ornamental plants; the offence begins when plants are grown to produce
      the drug.
    sources:
      - cr
      - tb
  enforcement:
    text: >-
      First-time users are diverted rather than convicted. Dealing and larger quantities are
      punished with prison.
    sources:
      - cr
      - ris
  sharing:
    text: >-
      Passing cannabis to another person is an offence, treated more leniently when unpaid and for
      personal use.
    sources:
      - ris
      - cr
  consumption:
    text: >-
      Consumption itself is not an offence, but it implies possession and so triggers the same
      diversion procedure.
    sources:
      - cr
      - tb
  access:
    text: >-
      No legal source. CBD and low-THC products are sold in shops under restrictions; no clubs or
      dispensaries.
    sources:
      - cr
      - tb
context:
  production:
    text: Cannabis for medicines is grown only by the state health agency. No private licensing.
    sources:
      - cr
  products:
    text: Low-THC hemp and CBD products; plants and seeds as ornamentals.
    sources:
      - tb
      - cr
  medical:
    text: >-
      Limited to pharmaceutical cannabinoids such as dronabinol on prescription. Herbal cannabis
      flower cannot generally be prescribed.
    sources:
      - cr
  consequences:
    text: >-
      Diversion avoids a conviction but involves the health authority, and can affect a driving
      licence through fitness-to-drive checks.
    sources:
      - cr
      - tb
  planting:
    seeds: grey
    seeds_trade: open
    clones: grey
    clones_trade: open
    text: >-
      The Narcotic Substances Act punishes growing the cannabis plant only when it is done in
      order to obtain the drug. Seeds, and plants and cuttings that are not being grown for
      that purpose, are therefore not banned as such; the offence starts once they are grown
      to produce cannabis.
    sources:
      - ris
