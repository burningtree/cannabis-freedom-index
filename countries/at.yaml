segments:
  possession:
    text: >-
      Possession is still a criminal offence under the Narcotic Substances Act, but for small
      amounts for personal use prosecutors must normally step back: since 2016 the case goes to the
      health authority instead ('therapy instead of punishment'), and proceedings are dropped if the
      person cooperates with any health measure ordered. No fixed gram limit is written into the
      law.
    sources:
      - cr
      - ris
  cultivation:
    text: >-
      Growing cannabis to obtain THC is an offence. Seeds and non-flowering plants and cuttings are
      sold openly in shops as ornamental plants; the offence begins when plants are grown to produce
      the drug.
    sources:
      - cr
      - tb
  enforcement:
    text: >-
      First-time users are diverted rather than convicted. Dealing and larger quantities are
      punished with prison.
    sources:
      - cr
      - ris
  sharing:
    text: >-
      Passing cannabis to another person is an offence, treated more leniently when unpaid and for
      personal use.
    sources:
      - ris
      - cr
  consumption:
    text: >-
      Consumption itself is not an offence, but it implies possession and so triggers the same
      diversion procedure.
    sources:
      - cr
      - tb
  access:
    text: >-
      There is no recreational source, club or dispensary. Patients can obtain a narrow range of
      prescription cannabinoid medicines, including Sativex, Canemes and pharmacy-compounded
      dronabinol; cannabis flower cannot generally be prescribed.
    sources:
      - parl
context:
  production:
    text: Cannabis for medicines is grown only by the state health agency. No private licensing.
    sources:
      - cr
  products:
    text: Low-THC hemp and CBD products; plants and seeds as ornamentals.
    sources:
      - tb
      - cr
  medical:
    text: >-
      Limited to pharmaceutical cannabinoids such as dronabinol on prescription. Herbal cannabis
      flower cannot generally be prescribed.
    sources:
      - parl
  consequences:
    text: >-
      Diversion avoids a conviction but involves the health authority, and can affect a driving
      licence through fitness-to-drive checks.
    sources:
      - cr
      - tb
  planting:
    seeds: grey
    seeds_trade: open
    clones: grey
    clones_trade: open
    text: >-
      The Narcotic Substances Act punishes growing the cannabis plant only when it is done in
      order to obtain the drug. Seeds, and plants and cuttings that are not being grown for
      that purpose, are therefore not banned as such; the offence starts once they are grown
      to produce cannabis.
    sources:
      - ris
  driving:
    status: impairment
    text: >-
      Austria's road law punishes driving while impaired by drugs and sets no blood limit for
      THC, so impairment has to be established. Police may stop drivers at random but need
      suspicion to test; an oral-fluid test can be used at the roadside and the evidential
      test is blood taken at a hospital. The licence is withdrawn for at least four weeks and
      the fine runs from 800 to 3,700 euros; there is no prison sentence for the offence.
    sources:
      - euda_dd
  arrests:
    text: >-
      The EU drugs agency's statistical bulletin records 27,355 cannabis-related drug law
      offences in Austria in 2024, against 25,322 in 2023. Of the 2023 total, 19,672 were for
      use or possession for use. The number has come down from a peak of 37,751 in 2017.
      Countries count these differently (offences or offenders, criminal or administrative),
      so the figure is not comparable across borders.
    sources:
      - euda_dlo
  clubs:
    status: underground
    text: >-
      Clubs exist without any legal basis. A Europe-wide survey of cannabis social clubs
      carried out in 2018 and 2019 received answers from four clubs in Austria, and its
      authors could not say how many more were active. The study notes that the model is
      prohibited throughout the European Union, that clubs sit in a legally sensitive
      position, and that many have been dissolved after court decisions or police raids.
      Nothing more recent was found.
    sources:
      - pardal20
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. British travel advice says illegal
      drugs, including cannabis, carry severe penalties and tells travellers to expect a long
      jail sentence and heavy fines for possessing, using or smuggling them, also when only
      changing planes. Airport scanners are also used on the baggage of passengers in transit.
    sources:
      - cr
      - tb
      - fcdo
