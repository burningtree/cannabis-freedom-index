  planting:
    seeds: grey
    seeds_trade: unclear
    clones: illegal
    clones_trade: banned
    text: >-
      Article 3 of Law 2022-407 punishes growing a listed drug without authorisation with five
      to ten years in prison and a fine of 500,000 to 50 million francs. The offence articles
      do not mention seeds. The text read is a chapter-by-chapter copy on a legal information
      site.
    sources:
      - l407
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited.
    sources:
      - l407
      - koaci
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. Possession is a crime. The law of June
      2022 treats use as a public-health matter and lets courts order treatment instead of
      prison for users; the 1988 law it replaced set one to five years for personal use.
    sources:
      - leaf
  black_market:
    text: >-
      Figures reported by the government to the UN drugs office record 10,760 kg of herbal
      cannabis seized in 2024, against 13,267 kg in 2023. The UN publishes them as
      kilogram equivalents, and countries count seizures differently, so the figures are
      not comparable across borders.
    sources:
      - unodc_szr
