segments:
  possession:
    text: >-
      Possession is a crime. The 1988 drug law set one to five years in prison for personal use; a
      new law of June 2022 replaced it and reframed use as a public-health matter, letting courts
      order treatment instead of prison for users. Possession is still an offence, and how often the
      alternative is applied is unclear.
    sources:
      - cr
      - leaf
  cultivation:
    text: Cultivation remains a criminal offence.
    sources:
      - cr
  enforcement:
    text: >-
      The 2022 law softened the approach to users on paper; courts still hand down prison sentences
      for small-scale sellers.
    sources:
      - cr
      - koaci
  sharing:
    text: >-
      Supply and trafficking carry five to ten years or more, with fines of up to 50 million CFA
      francs.
    sources:
      - koaci
      - cr
  consumption:
    text: Use is an offence, now with therapeutic injunctions as an alternative to prison.
    sources:
      - cr
  access:
    text: No legal source.
    sources:
      - leaf
