segments:
  possession:
    text: >-
      Possession is a crime. Under Law 2022-407 of 13 June 2022, holding a drug for one's own use
      carries one to three months in prison and a fine of 50,000 to 500,000 CFA francs, and a court
      can order treatment in place of the sentence. The law it replaced, of 1988, set one to five
      years. How often the alternative is applied is unclear.
    sources:
      - l407
      - issup
  cultivation:
    text: >-
      Growing without authorisation carries five to ten years in prison and a fine of 500,000 to
      50 million francs under Article 3 of Law 2022-407.
    sources:
      - l407
  enforcement:
    text: >-
      The 2022 law softened the approach to users on paper; courts still hand down prison sentences
      for small-scale sellers.
    sources:
      - koaci
  sharing:
    text: >-
      Supply and trafficking carry five to ten years or more, with fines of up to 50 million CFA
      francs.
    sources:
      - koaci
  consumption:
    text: >-
      Using is punished through possession: holding a drug for one's own use carries one to three
      months in prison and a fine of 50,000 to 500,000 CFA francs. The law exempts people taking
      part in a harm-reduction programme, on conditions set by decree. Driving after using a drug is
      a separate offence with one to five years.
    sources:
      - l407
  access:
    text: No legal source.
    sources:
      - leaf
