name: North Korea
region: Asia
iso_numeric: 408
recreational: death
medical: none
updated: 2026-10-10
summary: >-
  Legal status is opaque. Officially a controlled substance; hemp is widely grown. Scored with low
  confidence.
scores:
  possession: 0
  cultivation: 0
  enforcement: 1
  sharing: 0
  consumption: 1
  access: 0
segments:
  possession:
    text: >-
      Contrary to a persistent internet myth, cannabis is not legal in North Korea. The penal code
      lists it as a controlled substance alongside cocaine and heroin, and a 2005 narcotics-control
      law classifies cannabis and hemp resin as narcotics. What penalties are applied in practice is
      unknown; this entry is scored with low confidence.
    sources:
      - ap
      - lc
  cultivation:
    text: >-
      Drug cultivation is prohibited. Industrial hemp with low THC is legal and widely grown for
      cloth, oil and other consumer goods — one source of the myth.
    sources:
      - wiki
      - lc
  enforcement:
    text: >-
      Unknown. Drug offences in general can bring labour-camp sentences, and executions for drug
      trafficking have been reported.
    sources:
      - lc
  sharing:
    text: Distribution is prohibited by the narcotics law.
    sources:
      - lc
  consumption:
    text: >-
      Use is prohibited. Reports of people openly smoking 'weed' probably refer to ipdambae, a rough
      blend of herbs and tobacco leaf.
    sources:
      - wiki
      - ap
  access:
    text: >-
      None. A Western diplomat based in Pyongyang said there should be no doubt that drugs,
      including marijuana, are illegal.
    sources:
      - ap
context:
  death_penalty:
    text: >-
      Drug offences can bring labour-camp sentences, and executions for drug trafficking have been
      reported.
    sources:
      - lc
  recreational:
    text: >-
      There is no lawful recreational supply: marijuana is illegal, a criminal offence to smoke
      with no leniency promised, even though personal cultivation may often go
      unpunished.[@ap,wiki]
    sources:
      - ap
      - wiki
  production:
    status: none
    text: >-
      No lawful production of psychoactive cannabis. Low-THC industrial hemp is legally grown
      at scale for cloth, oil and other goods.[@wiki,lc]
    sources:
      - wiki
      - lc
  hemp:
    status: standard
    text: >-
      Low-THC hemp is legal and widely grown for cloth, oil and other consumer goods, which
      feeds the myth that marijuana is legal; the narcotics law still lists cannabis and hemp
      resin as narcotics.[@wiki,lc]
    sources:
      - wiki
      - lc
  medical:
    text: No medical cannabis.
    sources:
      - lc
  consequences:
    text: Unknown.
    sources:
      - lc
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited, and the law provides for the death
      penalty for the most serious drug offences.
    sources:
      - wiki
      - lc
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone, so a visitor has no lawful way to buy
      cannabis. The sources behind this profile describe no separate rule for visitors.
    sources:
      - ap
