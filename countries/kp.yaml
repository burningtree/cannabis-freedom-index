name: North Korea
region: Asia
iso_numeric: 408
recreational: illegal
medical: none
updated: "2026-10-28"
summary: >-
  Legal status is opaque. Cannabis is listed as a narcotic and unauthorised storage or use is
  prohibited; hemp is widely grown. Scored with low confidence because no cannabis-specific penalty,
  prosecution or execution is published.
scores:
  possession: 0
  cultivation: 0
  enforcement: 1
  sharing: 0
  consumption: 1
  access: 0
segments:
  possession:
    text: >-
      Contrary to a persistent internet myth, cannabis is not legal in North Korea. The 2003
      Narcotics Control Law lists cannabis (대마) and cannabis resin (대마수지) as narcotics, and
      unauthorised storage is prohibited.[@law2003] The 2022 Criminal Law provides five to ten
      years' labour reform for grave drug-storage cases, but sets no cannabis gram threshold or base
      term.[@cc2022] This segment is scored with low confidence.
    sources:
      - law2003
      - cc2022
    penalties:
      - label: Unauthorised storage (Criminal Law article 236)
        treatment: criminal
        term: Possession
        prison_min: 5 years
        prison: 10 years
        note: Grave cases; no cannabis threshold or fine published
  cultivation:
    text: >-
      Growing narcotic raw plants requires a state plan, a production licence and a land-use
      licence, and unauthorised cultivation is prohibited.[@law2003] The Criminal Law's express
      cultivation offence covers opium poppy, not cannabis, so the cannabis term is not
      published.[@cc2022] Low-THC hemp is grown under official sanction for cloth, oil and food, but
      no published THC threshold or general hemp exception was found.[@piie,ap]
    sources:
      - law2003
      - cc2022
      - piie
      - ap
    penalties:
      - label: Unauthorised cultivation of a narcotic raw plant
        treatment: criminal
        term: Cultivation
        note: Licensing offence; no cannabis-specific term published
  enforcement:
    text: >-
      Drug offences in general can bring labour-camp sentences, and executions for large-scale
      narcotics manufacture or trafficking are reported; no cannabis execution is
      verified.[@kinu2017,cc2022] A widely cited 2010 “firing squad” report concerned
      methamphetamine, not marijuana, and said the authorities did not treat opium or marijuana as
      drugs.[@guardian14]
    sources:
      - kinu2017
      - cc2022
      - guardian14
  sharing:
    text: >-
      The 2003 law prohibits unapproved transfer or sale of narcotics.[@law2003] The 2022 Criminal
      Law's trafficking ladder runs from up to five years to life or death for “extremely large”
      amounts; no cannabis quantity is published.[@cc2022]
    sources:
      - law2003
      - cc2022
    penalties:
      - label: Narcotics trafficking, base
        treatment: criminal
        term: Trafficking
        prison: 5 years
        note: General narcotics ladder; no cannabis threshold published
      - label: Large amount
        treatment: criminal
        term: Trafficking
        prison_min: 5 years
        prison: 10 years
      - label: Extremely large amount
        treatment: criminal
        term: Trafficking
        death: true
        life: possible
        note: Confiscation also applies
  consumption:
    text: >-
      Use is prohibited, and the 2022 Criminal Law's use article provides up to five years' labour
      reform in grave cases.[@law2003,cc2022] Reports of people openly smoking “weed” probably refer
      to ipdambae, a rough blend of herbs and tobacco leaf.[@ap]
    sources:
      - law2003
      - cc2022
      - ap
  access:
    text: >-
      None. The Swedish ambassador based in Pyongyang said there should be no doubt that drugs,
      including marijuana, are illegal.[@ap] No medical or adult-use supply route was
      found.[@law2003]
    sources:
      - ap
      - law2003
context:
  death_penalty:
    text: >-
      The 2022 Criminal Law provides life or death for “extremely large” narcotics manufacture or
      trafficking, and the 2003 law lists cannabis as a narcotic.[@cc2022,law2003] No cannabis
      quantity, prosecution or execution is documented, and the reported 2010 firing-squad threat
      concerned methamphetamine, not marijuana.[@guardian14]
    sources:
      - cc2022
      - law2003
      - guardian14
  recreational:
    text: >-
      There is no lawful recreational supply. Cannabis is a narcotic, and unauthorised storage or
      use is prohibited.[@law2003] A diplomat said there should be no doubt that marijuana is
      illegal, while reports of open smoking probably refer to ipdambae.[@ap] No cannabis execution
      is verified.[@cc2022]
    sources:
      - law2003
      - ap
      - cc2022
  production:
    status: none
    text: >-
      No lawful production of psychoactive cannabis. Low-THC hemp is grown under official sanction
      for cloth, oil and food, but no licensed adult-use or medical cannabis production route was
      found.[@piie,law2003]
    sources:
      - piie
      - law2003
  hemp:
    status: none
    text: >-
      Low-THC hemp is grown under official sanction for cloth, oil and food, which feeds the myth
      that marijuana is legal; no published THC threshold or general low-THC exception was found,
      and the narcotics law still lists cannabis and hemp resin as narcotics.[@piie,ap,law2003]
    sources:
      - piie
      - ap
      - law2003
  medical:
    text: >-
      No medical cannabis programme or cannabis-based medicine was found. The 2003 law allows
      approved narcotics for treatment, education and research, but that is a general
      state-controlled route, not patient access.[@law2003]
    sources:
      - law2003
  consequences:
    text: >-
      No reliable account of the ordinary sentence for cannabis possession was found. Drug offences
      can bring labour-camp sentences, and a 2024 provincial campaign reportedly sought death even
      for small smuggled amounts, but the reporting concerns methamphetamine and opium, not
      cannabis.[@kinu2017,dailynk24]
    sources:
      - kinu2017
      - dailynk24
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: unauthorised growing and
      supply are prohibited, and the general narcotics law provides life or death for the most
      serious trafficking cases.[@law2003,cc2022]
    sources:
      - law2003
      - cc2022
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone, so a visitor has no lawful way to buy
      cannabis. The 2021 Drug Crime Prevention Act applies to foreigners in North Korea and to
      cross-border smuggling or incitement; no separate visitor rule or deportation detail was
      verified.[@law2021,law2003]
    sources:
      - law2021
      - law2003
  planting:
    seeds: grey
    seeds_trade: unclear
    clones: illegal
    clones_trade: banned
    text: >-
      No cannabis-specific seed rule was found.[@law2003] The 2003 law controls narcotic raw plants
      through state plans and licences, and clones are plants under the cultivation regime.[@law2003] These statuses
      are inferred from the licensing rules, not from a published seed provision.[@law2003]
    sources:
      - law2003
  driving:
    status: unknown
    text: >-
      No drug-driving provision or THC limit was found. The general narcotics ban applies, but a
      road-traffic trigger could not be verified.[@law2003,law2021]
    sources:
      - law2003
      - law2021
  black_market:
    text: >-
      No cannabis seizure or price series is published. UNODC has no North Korea cannabis
      rows.[@unodc_szr] The 2024 Hamgyong reporting concerns methamphetamine and opium, not
      cannabis.[@dailynk24]
    sources:
      - unodc_szr
      - dailynk24
  arrests:
    text: >-
      No cannabis arrest or prosecution count is published. A July 2024 provincial report said drug
      offences rose 40% year on year, with more than 900 cases in Chongjin; the reporting concerns
      methamphetamine and opium.[@dailynk24] No cannabis execution is verified.[@kinu2017]
    sources:
      - dailynk24
      - kinu2017
