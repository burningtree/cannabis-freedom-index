name: Saudi Arabia
region: Asia
iso_numeric: 682
recreational: illegal
medical: none
updated: 2026-10-04
summary: >-
  Prison for possession and use; long terms or death for trafficking. Discretionary flogging ended
  in 2020, but drug executions resumed in 2022 and continued in hashish cases through 2026.
scores:
  possession: 0
  cultivation: 0
  enforcement: 0
  sharing: 0
  consumption: 0
  access: 0
segments:
  possession:
    text: >-
      Article 41 punishes possessing, buying, receiving or otherwise obtaining cannabis for
      personal use with six months to two years in prison. There is no exempt personal amount.
    sources:
      - law
  cultivation:
    text: >-
      Cannabis and its seeds are listed as prohibited plants. Unauthorised cultivation is a crime
      and cultivation connected with supply is treated under the law's trafficking provisions.
    sources:
      - law
      - schedule
  enforcement:
    text: >-
      Personal users face prison. Article 37 permits death sentences for importing, exporting,
      manufacturing or receiving drugs for distribution, although a court may reduce the sentence
      to at least 15 years in prison. Discretionary flogging was abolished in 2020, but executions
      resumed in 2022 and people were executed for hashish smuggling as recently as July 2026.
    sources:
      - law
      - un
      - amnesty
      - hrw
  sharing:
    text: >-
      Giving cannabis to another person for promotion, even without payment, is treated as dealing.
      Article 38 provides five to 15 years in prison and a fine; aggravated or repeat trafficking
      can bring longer imprisonment or death.
    sources:
      - law
  consumption:
    text: >-
      Use is a crime within Article 41's six-month-to-two-year prison range. A dependent user may be
      sent to treatment instead, and someone who voluntarily seeks treatment can avoid prosecution
      if the law's conditions are met.
    sources:
      - law
  access:
    text: None. Cannabis is a prohibited plant and there is no medical or adult-use supply route.
    sources:
      - schedule
context:
  production:
    text: >-
      None. The official schedules prohibit cannabis plants, their fibre and their seeds; there is
      no licensed cannabis-production programme.
    sources:
      - schedule
  products:
    text: >-
      Cannabis is controlled under names including hashish and marijuana, and the prohibition
      extends to every part of the plant. No general hemp or CBD exemption is provided.
    sources:
      - schedule
  medical:
    text: >-
      No medical cannabis programme. The law licenses some medicines containing controlled drugs,
      but cannabis itself remains on the prohibited-plant schedule rather than a patient-access
      pathway.
    sources:
      - law
      - schedule
  consequences:
    text: Foreigners are deported and banned from returning after serving their sentence.
    sources:
      - law
