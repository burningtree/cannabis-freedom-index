segments:
  possession:
    text: >-
      Possession for personal use is punished with prison — sources give one to six months for
      first-time users and six months to two years more generally — with fines and, at the judge's
      discretion, flogging.
    sources:
      - wiki
      - cr
  cultivation:
    text: Cultivation is treated as production for trafficking.
    sources:
      - cr
  enforcement:
    text: >-
      Corporal punishment and prison for users, execution for traffickers. Saudi Arabia resumed drug
      executions in late 2022, and people have since been beheaded for hashish trafficking.
    sources:
      - cr
      - wiki
  sharing:
    text: >-
      Dealing brings two to ten years with flogging; one reported case ended in ten years and 1,200
      lashes for 59 kg. Smuggling and repeat dealing can bring the death penalty.
    sources:
      - wiki
      - gdn
  consumption:
    text: Use is a crime; users who seek treatment voluntarily may avoid prosecution.
    sources:
      - wiki
  access:
    text: None.
    sources:
      - wiki
context:
