name: Ukraine
region: Europe
iso_numeric: 804
recreational: decriminalised
medical: limited
updated: 2026-10-04
summary: >-
  Possession of up to 5 g is an administrative offence. Medical cannabis became legal in August
  2024.
scores:
  possession: 3
  cultivation: 2
  enforcement: 3
  sharing: 1
  consumption: 2
  access: 1
segments:
  possession:
    text: >-
      Possession of a small amount without intent to sell — up to 5 g of cannabis — is an
      administrative offence punished by a fine or community work, not a crime. Above 5 g it becomes
      a criminal offence with possible imprisonment.
    sources:
      - wiki
      - cms
  cultivation:
    text: >-
      Growing up to ten cannabis plants without intent to sell is likewise an administrative offence
      with a fine and confiscation; more than ten is a crime. It is not legal, but a small grow does
      not bring a criminal record.
    sources:
      - wiki
  enforcement:
    text: >-
      Small amounts and small grows mean a fine. Larger quantities and dealing are crimes with
      prison terms.
    sources:
      - wiki
      - cms
  sharing:
    text: Any supply is a criminal offence.
    sources:
      - wiki
      - cms
  consumption:
    text: Recreational use remains prohibited; public use is an administrative offence.
    sources:
      - rub
      - wiki
  access:
    text: >-
      No adult-use source. Since 16 August 2024 pharmacies may dispense cannabis-based medicines on
      electronic prescription, with the first products arriving slowly.
    sources:
      - rub
      - wt
context:
  production:
    text: >-
      The 2024 law permits licensed cultivation of medical cannabis under strict tracking, and eased
      rules for industrial hemp (up to 0.3% THC).
    sources:
      - wt
      - cms
  products:
    text: Registered cannabis-based medicines on prescription; hemp products.
    sources:
      - wt
  medical:
    text: >-
      Legal since August 2024: doctors can issue electronic prescriptions for cannabis medicines for
      a list of conditions, a reform driven by the needs of war veterans and cancer patients.
      Cannabis was moved from the list of banned substances to those permitted under strict control.
    sources:
      - rub
      - wt
  consequences:
    text: Administrative offences do not create a criminal record.
    sources:
      - wiki
