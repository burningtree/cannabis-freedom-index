name: Ukraine
region: Europe
iso_numeric: 804
recreational: decriminalised
medical: limited
updated: 2026-10-26
summary: >-
  Possession of up to 5 g is an administrative offence. Medical cannabis became legal in August
  2024; the first patients received prescribed capsules on 11 June 2026.
answers:
  buy:
    answer: limited
    text: >-
      Prescribed medicines began dispensing in June 2026 through a small pharmacy network; adult-use
      sales remain illegal
scores:
  possession: 2
  cultivation: 2
  enforcement: 3
  sharing: 1
  consumption: 2
  access: 1
segments:
  possession:
    text: >-
      Small personal possession without intent to sell is an administrative offence: a fine of 50
      to 100 non-taxable minimum incomes, 20 to 60 hours of community work or up to fifteen days’
      administrative arrest; voluntary surrender can remove liability.[@admin44_current] Above the
      small amount, ordinary criminal possession carries a fine of 1,000 to 3,000 non-taxable
      minimums, corrective work for up to two years, probation supervision for up to five years or
      restriction of liberty for that period.[@possession_current] Large quantities, a group
      agreement or offending within a year after conviction under the same article can bring a
      larger fine or up to three years in prison; especially large quantities or involving a minor
      carry five to eight years.[@possession_current]
    sources:
      - admin44_current
      - possession_current
  cultivation:
    text: >-
      Ordinary unlawful growing below ten cannabis plants falls in the administrative band: a fine
      and confiscation.[@grow2009] At ten plants the ordinary criminal tier begins; its penalties
      are a fine of 100 to 500 non-taxable minimum incomes, probation supervision for up to three
      years or restriction of liberty for that period.[@growing_current] Fifty or more plants,
      specified prior drug crimes or group growing for sale can bring three to seven years in
      prison.[@growing_current]
    sources:
      - grow2009
      - growing_current
  enforcement:
    text: >-
      Even small personal possession can bring up to fifteen days’ administrative arrest,
      alongside fine and community-work options.[@admin44_current] Small ordinary grows carry an
      administrative fine and confiscation; criminal possession and growing have separate
      sentencing ranges, including probation, restriction of liberty and imprisonment in
      aggravated cases.[@grow2009, possession_current, growing_current]
    sources:
      - admin44_current
      - grow2009
      - possession_current
      - growing_current
  sharing:
    text: Any supply is a criminal offence.
    sources:
      - wiki
      - cms
  consumption:
    text: >-
      Drug use in private is not itself a criminal offence; possession remains separately
      punishable.[@use1991, euda_law] Public or group use at educational, sporting and cultural
      venues, and other places where crowds gather, is a crime under Article 316: up to four
      years of restriction of liberty or three years in prison. Repetition or specified previous
      drug crimes can bring three to five years in prison.[@public_use]
    sources:
      - use1991
      - euda_law
      - public_use
  access:
    text: >-
      Medical dispensing began on 11 June 2026. The Health Ministry reported six operating
      pharmacies in six cities; the wider licensing count does not mean all sites stock medicines.
      Patients need an electronic prescription valid for ten days. Adult-use supply remains illegal.
    sources:
      - dispensing2026

context:
  production:
    status: medical
    text: >-
      The 2024 law permits licensed, quota-controlled indoor cultivation of medical cannabis from
      certified seed under plant-by-plant electronic tracking. Industrial hemp up to 0.3% THC is
      grown through the separate registered commercial channel.
    sources:
      - narcotics
  products:
    text: >-
      The first dispensing involved hard delta-9 THC capsules with an initial 5 mg dose. The
      framework covers registered or pharmacy-compounded medicines; it does not establish retail
      flower availability.
    sources:
      - dispensing2026
      - narcotics
  medical:
    text: >-
      The first three patients in Vinnytsia received prescribed delta-9 THC capsules on 11 June
      2026: one person with multiple sclerosis and two wounded veterans with neuropathic or phantom
      pain. Eligibility and prescribing remain tightly controlled.
    sources:
      - dispensing2026
  consequences:
    text: Administrative offences do not create a criminal record.
    sources:
      - wiki
  planting:
    seeds: grey
    seeds_trade: regulated
    clones: licensed
    clones_trade: regulated
    text: >-
      The narcotics law's definition of cannabis excludes seeds, and the general seed law exempts an
      individual's non-commercial storage and use of seed. Germinating cannabis is nevertheless
      unlawful outside the authorised medical, scientific or industrial channels. Commercial seed
      and planting material must be certified; medical growers must obtain certified seed from a
      registered seed or nursery operator. A cutting is planting material and also a cannabis plant,
      so clones are confined to authorised cultivation and regulated trade.
    sources:
      - narcotics
      - seed_order
      - seed_law
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and no law provides for them: any supply of cannabis is a
      criminal offence.
    sources:
      - wiki
      - cms
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone.[@narcotics] Small personal possession without intent
      to sell can bring a fine, community work or up to fifteen days’ administrative
      arrest.[@admin44_current] Above the small amount, possession is a criminal offence with
      penalties that depend on quantity and aggravating circumstances.[@possession_current]
    sources:
      - narcotics
      - admin44_current
      - possession_current
  driving:
    status: impairment
    text: >-
      Administrative Code article 130(1) covers driving in a state of drug
      intoxication and refusal of the prescribed examination. Official 2026 appellate
      case summaries confirm a UAH17,000 fine and one year's loss of driving rights
      for the ordinary first-offence provision. A February case upheld a drug-driving
      conviction, treating the intoxication finding, rather than drug type or quantity,
      as decisive. A September ruling set aside another conviction: a positive rapid
      test lacked mandatory laboratory confirmation and the medical report had other
      procedural defects. These case outcomes should not be read as a universal rule
      that any positive screening result proves the offence. Suspected drug
      intoxication is examined at a health facility under article 266 and the joint
      2015 Instruction; testing and medical evidence matter. A July appellate summary
      separately confirms that a properly established refusal can attract article 130
      liability without proving intoxication. No numeric THC allowance, general
      medical-cannabis defence or complete repeat-offence tariff was established here.
    sources:
      - drugappeal2026
      - drugtesting2026
      - refusal2026
  black_market:
    text: >-
      Figures reported by the government to the UN drugs office record 2,061 kg of herbal
      cannabis seized in 2024, against 1,794 kg in 2023, and 1 kg of cannabis resin seized
      in 2024, against 3.1 kg in 2023. The UN publishes them as kilogram equivalents, and
      countries count seizures differently, so the figures are not comparable across
      borders.
    sources:
      - unodc_szr
  arrests:
    text: >-
      A data analysis by Texty.org.ua, drawing on court statistics and the National
      Police's annual report, found more than 20,000 proceedings in 2024 under article 309
      of the Criminal Code, possession without intent to sell, against about 17,000 under
      article 307 for sale. Over 2014 to 2024 about 106,000 people were convicted under
      article 309, of whom more than 43,000 were released from punishment; the most common
      sentence is a fine, and convictions for possession were almost eight times as
      frequent as for sale. One in four servicemen convicted in 2024 was convicted of a
      drug offence, 95 per cent of them under article 309. The figures cover all drugs.
    sources:
      - texty25
