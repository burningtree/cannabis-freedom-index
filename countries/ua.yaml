segments:
  possession:
    text: >-
      Possession of a small amount without intent to sell — up to 5 g of cannabis — is an
      administrative offence punished by a fine or community work, not a crime. Above 5 g it becomes
      a criminal offence with possible imprisonment.
    sources:
      - wiki
      - cms
  cultivation:
    text: >-
      Growing up to ten cannabis plants without intent to sell is likewise an administrative offence
      with a fine and confiscation; more than ten is a crime. It is not legal, but a small grow does
      not bring a criminal record.
    sources:
      - wiki
      - kupap
  enforcement:
    text: >-
      Small amounts and small grows mean a fine. Larger quantities and dealing are crimes with
      prison terms.
    sources:
      - wiki
      - cms
  sharing:
    text: Any supply is a criminal offence.
    sources:
      - wiki
      - cms
  consumption:
    text: Recreational use remains prohibited; public use is an administrative offence.
    sources:
      - rub
      - wiki
  access:
    text: >-
      No adult-use source. The medical law provides for licensed pharmacies to dispense registered
      or pharmacy-compounded cannabis medicines on an electronic prescription. The Ministry of
      Health says prescribing should begin only once cannabis substance or finished medicines have
      been imported and pharmacies are ready, so the route remains difficult to use.
    sources:
      - narcotics
      - moz
context:
  production:
    text: >-
      The 2024 law permits licensed, quota-controlled indoor cultivation of medical cannabis from
      certified seed under plant-by-plant electronic tracking. Industrial hemp up to 0.3% THC is
      grown through the separate registered commercial channel.
    sources:
      - narcotics
  products:
    text: Registered finished medicines or medicines compounded by a licensed pharmacy; hemp products.
    sources:
      - narcotics
      - moz
  medical:
    text: >-
      Legal in a tightly controlled framework since August 2024. The Ministry of Health lists the
      qualifying conditions and electronic-prescription process, but says prescriptions depend on
      imports and pharmacy readiness.
    sources:
      - narcotics
      - moz
  consequences:
    text: Administrative offences do not create a criminal record.
    sources:
      - wiki
  planting:
    seeds: grey
    seeds_trade: regulated
    clones: licensed
    clones_trade: regulated
    text: >-
      The narcotics law's definition of cannabis excludes seeds, and the general seed law exempts an
      individual's non-commercial storage and use of seed. Germinating cannabis is nevertheless
      unlawful outside the authorised medical, scientific or industrial channels. Commercial seed
      and planting material must be certified; medical growers must obtain certified seed from a
      registered seed or nursery operator. A cutting is planting material and also a cannabis plant,
      so clones are confined to authorised cultivation and regulated trade.
    sources:
      - narcotics
      - seed_order
      - seed_law
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and no law provides for them: any supply of cannabis is a
      criminal offence.
    sources:
      - wiki
      - cms
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. British travel advice says only that
      penalties for being caught in possession of drugs are severe.
    sources:
      - narcotics
      - moz
      - fcdo
