segments:
  possession:
    text: >-
      Holding a small amount without intent to sell, up to 5 g of cannabis, is an administrative
      offence under Article 44 of the Code on Administrative Offences: a fine of 25 to 50 non-
      taxable minimum incomes, 20 to 60 hours of community work, or administrative arrest of up
      to 15 days. A person who hands the drug in voluntarily is released from liability. Above
      the small amount it is a crime under Article 309 of the Criminal Code, with a fine,
      correctional work, arrest, or restriction of liberty or imprisonment for up to three
      years; two to five years for a large amount.
    sources:
      - koap44
      - kk309
      - wiki
      - cms
  cultivation:
    text: >-
      Growing fewer than ten cannabis plants without intent to sell is an administrative offence
      with a fine and confiscation. Ten to fifty plants is a crime under Article 310 of the
      Criminal Code, with a fine, arrest of up to six months or restriction of liberty for up to
      three years; fifty or more, or a repeat offence, brings three to seven years in prison.
    sources:
      - kk310
      - wiki
      - kupap
  enforcement:
    text: >-
      Small amounts and small grows mean a fine. Larger quantities and dealing are crimes with
      prison terms.
    sources:
      - wiki
      - cms
  sharing:
    text: Any supply is a criminal offence.
    sources:
      - wiki
      - cms
  consumption:
    text: Recreational use remains prohibited; public use is an administrative offence.
    sources:
      - rub
      - wiki
  access:
    text: >-
      No adult-use source. The medical law provides for licensed pharmacies to dispense registered
      or pharmacy-compounded cannabis medicines on an electronic prescription. The Ministry of
      Health says prescribing should begin only once cannabis substance or finished medicines have
      been imported and pharmacies are ready, so the route remains difficult to use.
    sources:
      - narcotics
      - moz
context:
  production:
    text: >-
      The 2024 law permits licensed, quota-controlled indoor cultivation of medical cannabis from
      certified seed under plant-by-plant electronic tracking. Industrial hemp up to 0.3% THC is
      grown through the separate registered commercial channel.
    sources:
      - narcotics
  products:
    text: Registered finished medicines or medicines compounded by a licensed pharmacy; hemp products.
    sources:
      - narcotics
      - moz
  medical:
    text: >-
      Legal in a tightly controlled framework since August 2024. The Ministry of Health lists the
      qualifying conditions and electronic-prescription process, but says prescriptions depend on
      imports and pharmacy readiness.
    sources:
      - narcotics
      - moz
  consequences:
    text: Administrative offences do not create a criminal record.
    sources:
      - wiki
  planting:
    seeds: grey
    seeds_trade: regulated
    clones: licensed
    clones_trade: regulated
    text: >-
      The narcotics law's definition of cannabis excludes seeds, and the general seed law exempts an
      individual's non-commercial storage and use of seed. Germinating cannabis is nevertheless
      unlawful outside the authorised medical, scientific or industrial channels. Commercial seed
      and planting material must be certified; medical growers must obtain certified seed from a
      registered seed or nursery operator. A cutting is planting material and also a cannabis plant,
      so clones are confined to authorised cultivation and regulated trade.
    sources:
      - narcotics
      - seed_order
      - seed_law
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and no law provides for them: any supply of cannabis is a
      criminal offence.
    sources:
      - wiki
      - cms
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. Possession of up to 5 g of cannabis
      without intent to sell is an administrative offence punished by a fine or community work;
      above 5 g it is a crime with possible imprisonment.
    sources:
      - wiki
      - cms
      - narcotics
      - moz
  driving:
    status: impairment
    text: >-
      Administrative Code article 130(1) covers driving in a state of drug
      intoxication and refusal of the prescribed examination. Official 2026 appellate
      case summaries confirm a UAH17,000 fine and one year's loss of driving rights
      for the ordinary first-offence provision. A February case upheld a drug-driving
      conviction, treating the intoxication finding, rather than drug type or quantity,
      as decisive. A September ruling set aside another conviction: a positive rapid
      test lacked mandatory laboratory confirmation and the medical report had other
      procedural defects. These case outcomes should not be read as a universal rule
      that any positive screening result proves the offence. Suspected drug
      intoxication is examined at a health facility under article 266 and the joint
      2015 Instruction; testing and medical evidence matter. A July appellate summary
      separately confirms that a properly established refusal can attract article 130
      liability without proving intoxication. No numeric THC allowance, general
      medical-cannabis defence or complete repeat-offence tariff was established here.
    sources:
      - drugappeal2026
      - drugtesting2026
      - refusal2026
