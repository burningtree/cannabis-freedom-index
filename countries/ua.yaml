name: Ukraine
region: Europe
iso_numeric: 804
recreational: decriminalised
medical: limited
updated: '2026-10-28'
summary: >-
  Possession of up to 5 g is an administrative offence. Medical cannabis became legal in August
  2024; the first patients received prescribed capsules on 11 June 2026.
answers:
  buy:
    answer: limited
    text: >-
      Prescribed medicines began dispensing in June 2026 through a small pharmacy network; adult-use
      sales remain illegal
scores:
  possession: 2
  cultivation: 2
  enforcement: 3
  sharing: 1
  consumption: 2
  access: 1
segments:
  possession:
    text: >-
      Small personal possession without intent to sell is an administrative offence: a fine of 50 to
      100 non-taxable minimum incomes, 20 to 60 hours of community work or up to fifteen days’
      administrative arrest; voluntary surrender can remove liability.[@admin44_current] Above the
      small amount, ordinary criminal possession carries a fine of 1,000 to 3,000 non-taxable
      minimums, corrective work for up to two years, probation supervision for up to five years or
      restriction of liberty for that period.[@possession_current] Large quantities, a group
      agreement or offending within a year after conviction under the same article can bring a
      larger fine or up to three years in prison; especially large quantities or involving a minor
      carry five to eight years.[@possession_current] The small ceiling is 5 g of dried cannabis,
      0.5 g of resin or 0.3 g of extract; cannabis reaches the large tier at 500 g and the
      especially large tier at 2,500 g.[@quantities] One fine unit here is UAH17, giving ordinary
      administrative fines of UAH850–1,700 and ordinary criminal fines of
      UAH17,000–51,000.[@fineunit,admin44_current,possession_current]
    sources:
      - admin44_current
      - possession_current
      - quantities
      - fineunit
    currency: UAH
    penalties:
      - upto: 5 g
        treatment: civil
        term: Small amount, Article 44
        prison: 15 days
        fine_min: 850
        fine: 1700
        note: Dried cannabis; fine, community work or detention
      - label: Above small but below large amount
        treatment: criminal
        term: Article 309(1)
        fine_min: 17000
        fine: 51000
        note: Fine, corrective work, probation or restriction of liberty; no imprisonment in this tier
      - label: Large amount
        treatment: criminal
        term: Article 309(2)
        prison: 3 years
        fine_min: 34000
        fine: 85000
        note: Prison or a fine; statutory quantity threshold is inclusive
      - label: Especially large amount
        treatment: criminal
        term: Article 309(3)
        prison_min: 5 years
        prison: 8 years
  cultivation:
    text: >-
      Ordinary unlawful growing below ten cannabis plants falls in the administrative band: a fine
      and confiscation.[@grow2009] At ten plants the ordinary criminal tier begins; its penalties
      are a fine of 100 to 500 non-taxable minimum incomes, probation supervision for up to three
      years or restriction of liberty for that period.[@growing_current] Fifty or more plants,
      specified prior drug crimes or group growing for sale can bring three to seven years in
      prison.[@growing_current] The administrative fine is eighteen to one hundred non-taxable
      minimums, UAH306–1,700; the ordinary criminal fine is
      UAH1,700–8,500.[@grow2009,growing_current,fineunit]
    sources:
      - grow2009
      - growing_current
      - fineunit
    currency: UAH
    penalties:
      - upto: 9 plants
        treatment: civil
        term: Article 106-2
        fine_min: 306
        fine: 1700
        note: Plants confiscated
      - over: 9 plants
        upto: 49 plants
        treatment: criminal
        term: Article 310(1)
        fine_min: 1700
        fine: 8500
        note: Fine, probation or restriction of liberty; no imprisonment in this tier
      - over: 49 plants
        treatment: criminal
        term: Article 310(2)
        prison_min: 3 years
        prison: 7 years
  enforcement:
    text: >-
      Even small personal possession can bring up to fifteen days’ administrative arrest, alongside
      fine and community-work options.[@admin44_current] Small ordinary grows carry an
      administrative fine and confiscation; criminal possession and growing have separate sentencing
      ranges, including probation, restriction of liberty and imprisonment in aggravated
      cases.[@grow2009, possession_current, growing_current]
    sources:
      - admin44_current
      - grow2009
      - possession_current
      - growing_current
  sharing:
    text: >-
      Unauthorised supply carries four to eight years in prison under Article 307.[@supply] Large
      quantities, specified places, involvement of a minor and other aggravating circumstances raise
      the range to six to ten years with confiscation; organised-group cases, especially large
      quantities or involvement of a young child carry nine to twelve years with
      confiscation.[@supply]
    sources:
      - supply
    penalties:
      - label: Ordinary unlawful supply
        treatment: criminal
        term: Article 307(1)
        prison_min: 4 years
        prison: 8 years
      - label: Large quantity or other statutory aggravation
        treatment: criminal
        term: Article 307(2)
        prison_min: 6 years
        prison: 10 years
        note: Confiscation of property
      - label: Especially large quantity, organised group or young child
        treatment: criminal
        term: Article 307(3)
        prison_min: 9 years
        prison: 12 years
        note: Confiscation of property
  consumption:
    text: >-
      Drug use in private is not itself a criminal offence; possession remains separately
      punishable.[@use1991, euda_law] Public or group use at educational, sporting and cultural
      venues, and other places where crowds gather, is a crime under Article 316: up to four years
      of restriction of liberty or three years in prison. Repetition or specified previous drug
      crimes can bring three to five years in prison.[@public_use]
    sources:
      - use1991
      - euda_law
      - public_use
    penalties:
      - label: Public or group use at specified venues
        treatment: criminal
        term: Article 316(1)
        prison: 3 years
        note: Restriction of liberty is an alternative
      - label: Repeat public use or specified previous drug offence
        repeat: 2
        treatment: criminal
        term: Article 316(2)
        prison_min: 3 years
        prison: 5 years
  access:
    text: >-
      Medical dispensing began on 11 June 2026.[@dispensing2026] The Health Ministry reported six
      operating pharmacies in six cities; the wider licensing count does not mean all sites stock
      medicines.[@dispensing2026] Patients need an electronic prescription valid for ten
      days.[@dispensing2026] Adult-use supply remains illegal.[@supply]
    sources:
      - dispensing2026
      - supply
words:
  - { word: Конопля, say: konoplya, lang: Ukrainian, meaning: "the standard word; the law's term for the plant", sources: [narcotics] }
  - { word: Канабіс, say: kanabis, lang: Ukrainian, meaning: "the medical law's loanword", sources: [dispensing2026] }
  - { word: Трава, say: trava, lang: Ukrainian, meaning: "literally grass; colloquial for a natural drug (cannabis)", sources: [wiktionary-trava] }
context:
  production:
    status: medical
    text: >-
      The 2024 law permits licensed, quota-controlled indoor cultivation of medical cannabis from
      certified seed under plant-by-plant electronic tracking.[@narcotics] Industrial hemp meeting
      the transitional 0.2% THC limit is grown through the separate registered commercial
      channel.[@narcotics,hemptransition]
    sources:
      - narcotics
      - hemptransition
  medical:
    text: >-
      Patients began receiving prescribed THC capsules on [11 June
      2026](/history/ukraine-first-medical-dispensing-2026/), initially through six pharmacies in
      six cities.[@dispensing2026] The first three patients included a woman with multiple sclerosis
      and two wounded veterans with neuropathic or phantom pain.[@dispensing2026] The ten-day
      electronic prescription specifies the formulation and dose; pharmacies need the relevant
      licences and compounding quotas.[@dispensing2026] The Health Ministry continued preparing
      digital tools for wider pharmacy compounding in [July
      2026](/history/ukraine-medical-digital-tools-2026/).[@digital26]
    sources:
      - dispensing2026
      - digital26
  consequences:
    text: >-
      Small personal possession is handled under the administrative code, while larger amounts can
      result in a criminal conviction.[@admin44_current,possession_current] Voluntary surrender can
      exempt the administrative offence.[@admin44_current] Someone who voluntarily enters treatment
      for drug dependence can be exempted from the ordinary criminal possession offence under
      Article 309(4).[@possession_current]
    sources:
      - admin44_current
      - possession_current
  planting:
    seeds: grey
    seeds_trade: regulated
    clones: licensed
    clones_trade: regulated
    text: >-
      The narcotics law's definition of cannabis excludes seeds, and the general seed law exempts an
      individual's non-commercial storage and use of seed.[@narcotics, seed_law] Germinating cannabis is nevertheless
      unlawful outside the authorised medical, scientific or industrial channels.[@narcotics] Commercial seed
      and planting material must be certified; medical growers must obtain certified seed from a
      registered seed or nursery operator.[@seed_order, seed_law] A cutting is planting material and also a cannabis plant,
      so clones are confined to authorised cultivation and regulated trade.[@narcotics, seed_law]
    sources:
      - narcotics
      - seed_order
      - seed_law
  clubs:
    status: none
    text: >-
      Supplying cannabis to other adults remains a crime, including outside the pharmacy
      route.[@supply] Private collective growing has no recreational exemption from the cultivation
      offence.[@growing_current]
    sources:
      - supply
      - growing_current
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone.[@narcotics] Small personal possession
      without intent to sell can bring a fine, community work or up to fifteen days’ administrative
      arrest.[@admin44_current] Above the small amount, possession is a criminal offence with
      penalties that depend on quantity and aggravating circumstances.[@possession_current]
      Travellers may carry prescribed cannabis medicines for personal use within the amount covered
      by their prescription.[@patientfaq]
    sources:
      - narcotics
      - admin44_current
      - possession_current
      - patientfaq
  driving:
    status: impairment
    text: >-
      Administrative Code article 130(1) covers driving in a state of drug intoxication and refusal
      of the prescribed examination.[@kupap] Official 2026 appellate case summaries confirm a UAH17,000 fine
      and one year's loss of driving rights for the ordinary first-offence provision.[@drugappeal2026] A February
      case upheld a drug-driving conviction, treating the intoxication finding, rather than drug
      type or quantity, as decisive.[@drugappeal2026] A September ruling set aside another conviction: a positive
      rapid test lacked mandatory laboratory confirmation and the medical report had other
      procedural defects.[@drugtesting2026] These case outcomes should not be read as a universal rule that any
      positive screening result proves the offence.[@drugtesting2026] Suspected drug intoxication is examined at a
      health facility under article 266 and the joint 2015 Instruction; testing and medical evidence
      matter.[@drugtesting2026] A July appellate summary separately confirms that a properly established refusal can
      attract article 130 liability without proving intoxication.[@refusal2026] No numeric THC allowance, general
      medical-cannabis defence or complete repeat-offence tariff was established here.[@drugappeal2026, drugtesting2026, refusal2026]
    sources:
      - kupap
      - drugappeal2026
      - drugtesting2026
      - refusal2026
  black_market:
    text: >-
      Figures reported by the government to the UN drugs office record 2,061 kg of herbal cannabis
      seized in 2024, against 1,794 kg in 2023, and 1 kg of cannabis resin seized in 2024, against
      3.1 kg in 2023.[@unodc_szr] The UN publishes them as kilogram equivalents, and countries count seizures
      differently, so the figures are not comparable across borders.[@unodc_szr]
    sources:
      - unodc_szr
  arrests:
    text: >-
      A data analysis by Texty.org.ua, drawing on court statistics and the National Police's annual
      report, found more than 20,000 proceedings in 2024 under article 309 of the Criminal Code,
      possession without intent to sell, against about 17,000 under article 307 for sale.[@texty25] Over 2014
      to 2024 about 106,000 people were convicted under article 309, of whom more than 43,000 were
      released from punishment; the most common sentence is a fine, and convictions for possession
      were almost eight times as frequent as for sale.[@texty25] One in four servicemen convicted in 2024 was
      convicted of a drug offence, 95 per cent of them under article 309.[@texty25] The figures cover all
      drugs.[@texty25]
    sources:
      - texty25
  recreational:
    text: >-
      Adults have no legal recreational shop, and supplying cannabis remains a crime.[@supply] Small
      possession can bring administrative detention; the dried-plant ceiling is 5 g, with lower
      ceilings for resin and extracts.[@admin44_current,quantities] The [medical
      law](/history/ukraine-medical-2024/) operates through licensed medicines and
      prescriptions.[@narcotics]
    sources:
      - supply
      - admin44_current
      - quantities
      - narcotics
  culture:
    text: >-
      Herodotus, writing about 440 BCE, described the Scythians of the Black Sea steppe
      raising cannabis smoke in felt tents — the oldest account of taking the plant for its
      effect.[@wiki-scythians] See [the Scythian vapour
      bath](/culture/traditions/the-scythian-vapour-bath/). Folk custom kept hemp close:
      unmarried Ukrainian girls sowed hemp seed on St Andrew's Eve to dream of their future
      husbands.[@benet75] See [the hemp dance](/culture/traditions/the-hemp-dance/). The Soviet
      Union banned unauthorised growing in [1934](/history/ukraine-soviet-ban-1934/), though the
      republic's hemp fields stayed vast into the 1950s.[@istmat34]
      [Hemp peaked under Soviet rule in 1940.](/history/ukraine-soviet-hemp-1940/)
    sources:
      - wiki-scythians
      - benet75
      - istmat34
  hemp:
    status: strict
    text: >-
      Industrial hemp remains subject to a 0.2% THC ceiling in dried straw during the transitional
      period.[@hemptransition] The scheduled ceiling rises to 0.3% on 16 February
      2027.[@hemptransition] Commercial industrial cultivation uses the separate registered route
      under the narcotics law, while medical cultivation requires licensing and
      tracking.[@narcotics]
    sources:
      - hemptransition
      - narcotics
