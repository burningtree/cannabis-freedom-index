name: Bosnia and Herzegovina
region: Europe
iso_numeric: 70
recreational: illegal
medical: limited
updated: 2026-10-23
summary: >-
  Illegal. In the Federation, unauthorized possession of a narcotic drug is a criminal offence
  with up to one year in prison, including for personal use. Republika Srpska's criminal code
  does not copy that offence. A December 2025 decision opened the way to cannabis-based
  medicines, but the prescribing rules it depends on will not be adopted in the Federation
  before 2027.
scores:
  possession: 1
  cultivation: 1
  enforcement: 2
  sharing: 1
  consumption: 1
  access: 0
segments:
  possession:
    text: >-
      Cannabis is illegal. In the Federation, article 239(3) of the criminal code punishes
      unauthorized possession of a narcotic drug with up to one year in prison. That paragraph
      sets no smaller tier for a personal amount. Republika Srpska's criminal code, consolidated
      through 2023, punishes unauthorized production and trade, including holding a drug in order
      to sell it, and enabling another person to use a drug. It has no matching standalone
      possession offence. Brčko District's possession penalty was not established from a statute
      read for this entry.
    sources:
      - fbihcc
      - rscc
  cultivation:
    text: Growing cannabis is a criminal offence.
    sources:
      - cann
  enforcement:
    text: >-
      In the Federation, unauthorized possession can bring up to one year in prison. The statute
      sets that maximum. Growers and dealers face the longer production and trade sentences.
    sources:
      - fbihcc
      - rscc
  sharing:
    text: Sale and supply are crimes with prison.
    sources:
      - cann
  consumption:
    text: Use is not separately criminalised; 'enabling' others to use is.
    sources:
      - wiki
  access:
    text: >-
      No legal source yet. On 29 December 2025 the Council of Ministers moved cannabis, its resin,
      extracts and tinctures from the table of prohibited substances to the table of substances under
      strict control, so that cannabis-based medicines can be prescribed. Prescribing still depends
      on entity rulebooks. In September 2026 the Federation health ministry said it would not adopt
      its new rulebook until the first quarter of 2027; Republika Srpska's amendments were still in
      their final drafting stage. Without the rules, the medicines agency cannot send the UN control
      board the estimate it needs before imports can be approved.
    sources:
      - gi
      - para25
      - para26
      - mcpsep26
context:
  recreational:
    text: >-
      There is no legal recreational supply. In the Federation unauthorised possession brings
      up to one year with no smaller personal tier; Republika Srpska has no standalone
      possession offence but punishes production, trade and enabling use.[@fbihcc,rscc] Use
      itself is not separately criminalised, while sale and supply bring prison.[@wiki,cann]
    sources:
      - fbihcc
      - rscc
      - wiki
      - cann
  production:
    text: Industrial hemp only, under tightly regulated permits with large fines for violations.
    sources:
      - cms
  products:
    text: No legal THC products.
    sources:
      - cms
  medical:
    text: >-
      The Council of Ministers approved medical use on 29 December 2025, after a decade of
      campaigning that began with a state task force in 2016. Only pharmaceutical preparations
      prescribed by a doctor are allowed; the Agency for Medicines and Medical Devices oversees
      import and distribution, and growing cannabis for medicine remains prohibited. No patient
      could be treated by September 2026. The Federation drafted changes covering indications,
      prescribing doctors, registers, doses and pharmaceutical forms, but said it would replace the
      rulebook only in the first quarter of 2027. Republika Srpska's amendments were still in their
      final drafting stage.
    sources:
      - gi
      - para25
      - para26
      - mcpsep26
      - wiki
  consequences:
    text: >-
      In the Federation, unauthorized possession is a criminal offence under article 239(3), so a
      conviction is a criminal record. An indictment is not itself a conviction.
    sources:
      - fbihcc
  planting:
    seeds: licensed
    seeds_trade: regulated
    clones: illegal
    clones_trade: banned
    text: >-
      Industrial hemp may be grown only for fibre, for seed used as animal feed, and for
      further reproduction, processing and marketing of seed, with THC in the dry plant no
      higher than 0.2%. Only people and companies authorised by the competent body may grow
      hemp or place it on the market.
    sources:
      - cmsg
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited.
    sources:
      - cann
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. In the Federation, unauthorized possession
      can bring up to one year in prison under article 239(3) of the criminal code. Republika
      Srpska's criminal code does not contain that standalone possession offence. Brčko District's
      penalty was not established from a statute read for this entry.
    sources:
      - fbihcc
      - rscc
