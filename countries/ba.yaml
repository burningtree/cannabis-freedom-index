summary: >-
  Illegal. In the Federation, unauthorized possession of a narcotic drug is a criminal offence
  with up to one year in prison, including for personal use. Republika Srpska's criminal code
  does not copy that offence. A December 2025 decision opened the way to cannabis-based
  medicines, but the prescribing rules it depends on will not be adopted in the Federation
  before 2027.
scores:
  possession: 1
  cultivation: 1
  enforcement: 2
  sharing: 1
  consumption: 1
  access: 0
segments:
  possession:
    text: >-
      In the Federation, article 239(3) makes unauthorised possession criminal, with up to one
      year and no smaller personal-amount tier.[@fbihcc] Republika Srpska and Brčko’s current
      criminal codes lack a matching standalone possession offence, although holding for sale
      remains criminal.[@rsnow,brcko] The state drug law separately prohibits unauthorised
      possession and provides a BAM1,000–3,000 individual fine.[@state] This is not a single
      uniform criminal regime across the country.[@fbihcc,rsnow,brcko]
    sources:
      - fbihcc
      - rsnow
      - brcko
      - state
    currency: BAM
    penalties:
      - label: Federation — unauthorised possession
        treatment: criminal
        term: Federation Criminal Code 239(3)
        prison: 1 year
        note: No statutory smaller personal-amount tier
      - label: State drug law — individual unlawful possession offence
        treatment: civil
        term: Articles 4(1) and 85(3)
        fine_min: 1000
        fine: 3000
        note: >-
          Entity and district criminal rules differ; this is not a guarantee of a fine instead
          of prosecution
  cultivation:
    text: >-
      Unauthorised drug production ordinarily carries one–ten years under both the Federation
      and Republika Srpska codes.[@fbihcc,rsnow] Republika Srpska expressly includes growing
      psychoactive cannabis within production.[@rsnow] The state law allows hemp cultivation
      only for specified fibre and seed purposes with a foreign-trade ministry permit.[@state]
      It separately fines individuals BAM5,000–10,000 for growing that hemp without the
      permit.[@state]
    sources:
      - fbihcc
      - rsnow
      - state
    currency: BAM
    penalties:
      - label: Republika Srpska — unauthorised psychoactive cannabis growing
        treatment: criminal
        term: Article 207(1), (5)
        prison_min: 1 year
        prison: 10 years
      - label: Federation — unauthorised drug production
        treatment: criminal
        term: Article 238(1)
        prison_min: 1 year
        prison: 10 years
        note: No household plant allowance stated here
      - label: State law — individual grows industrial hemp without required permit
        treatment: civil
        term: Articles 25 and 83(3)
        fine_min: 5000
        fine: 10000
        note: Industrial hemp offence; not a safe tariff for psychoactive cannabis growing
  enforcement:
    text: >-
      The Federation prosecutes possession under Article 239(3); production and trade have
      longer prison ranges.[@fbihcc] In Republika Srpska, police issued a public-use ticket
      after seeing a person smoke marijuana in Vlasenica on [26 February
      2026](/history/bosnia-vlasenica-public-use-ticket-2026/).[@ticket26] That example concerns
      public-use enforcement, rather than a cannabis arrest total.[@ticket26]
    sources:
      - fbihcc
      - ticket26
  sharing:
    text: >-
      Sale and other unlawful distribution ordinarily carry one–ten years in the Federation,
      Republika Srpska and Brčko.[@fbihcc,rsnow,brcko] Giving drugs for another person to use,
      or providing premises for use, has a separate offence: three months–five years in the
      Federation and Brčko, one–eight years in Republika Srpska.[@fbihcc,brcko,rsnow] These
      provisions do not require a sale.[@fbihcc,rsnow,brcko] The Federation punishes organising
      or joining a supply group with at least three years; giving to a child or several people,
      or causing particularly grave consequences, carries one to ten years.[@fbihcc] Republika
      Srpska’s protected-person/place, professional-abuse, dealer-network and group supply cases
      carry five to fifteen years, rising to at least eight where the specified serious-health
      or death result occurs.[@rsnow] Its aggravated enabling-use offence carries two to twelve
      years, or three to fifteen where the recipient dies.[@rsnow]
    sources:
      - fbihcc
      - rsnow
      - brcko
    penalties:
      - label: Federation / Republika Srpska / Brčko — ordinary unlawful sale or distribution
        treatment: criminal
        term: FBiH238(1), RS207(1), BD232(1)
        prison_min: 1 year
        prison: 10 years
        note: Aggravated offences carry higher penalties
      - label: Federation / Brčko — giving for use or enabling use
        treatment: criminal
        term: FBiH239(1), BD233(1)
        prison_min: 3 months
        prison: 5 years
      - label: Republika Srpska — giving for use or enabling use
        treatment: criminal
        term: RS208(1)
        prison_min: 1 year
        prison: 8 years
      - label: Federation — organising or joining a supply group
        treatment: criminal
        term: Aggravated supply / enabling use
        prison_min: 3 years
        note: Article 238(2); statutory minimum
      - label: Federation — aggravated giving/enabling use
        treatment: criminal
        term: Aggravated supply / enabling use
        prison_min: 1 year
        prison: 10 years
        note: 'Article 239(2): child, several people or particularly grave consequences'
      - label: Republika Srpska — protected persons/places, professional abuse, network or group
        treatment: criminal
        term: Aggravated supply / enabling use
        prison_min: 5 years
        prison: 15 years
        note: Article 207(2)–(3)
      - label: Republika Srpska — supply causing specified serious injury or death
        treatment: criminal
        term: Aggravated supply / enabling use
        prison_min: 8 years
        note: Article 207(4); statutory minimum
      - label: Republika Srpska — aggravated enabling use
        treatment: criminal
        term: Aggravated supply / enabling use
        prison_min: 2 years
        prison: 12 years
        note: 'Article 208(2): protected persons/places or professional abuse'
      - label: Republika Srpska — recipient dies after enabling use
        treatment: criminal
        term: Aggravated supply / enabling use
        prison_min: 3 years
        prison: 15 years
        note: Article 208(3)
  consumption:
    text: >-
      The state drug law prohibits use outside its authorised conditions.[@state] Republika
      Srpska separately fines public consumption BAM700–1,700 under Article 17 of its
      public-order law; police applied it to marijuana use in February 2026.[@publicrs,ticket26]
      Enabling someone else’s use is a different criminal offence, described under
      sharing.[@fbihcc,rsnow,brcko]
    sources:
      - state
      - publicrs
      - ticket26
      - fbihcc
      - rsnow
      - brcko
    currency: BAM
    penalties:
      - label: Republika Srpska — public drug consumption
        treatment: civil
        term: Public Order and Peace Law, Article 17
        fine_min: 700
        fine: 1700
        note: This row is specific to Republika Srpska; other jurisdictions have their own rules
  access:
    text: >-
      The [29 December 2025 decision](/history/bosnia-medical-use-approved-2025/) removed the
      main scheduling obstacle to controlled medical use.[@mcpsep26] By the September 2026
      follow-up, the prescribing framework remained unfinished: the Federation planned its new
      rulebook for the first quarter of 2027, while Republika Srpska was finalising
      amendments.[@mcpsep26] The medicines agency said the rules were needed before it could
      provide the requirements estimate for approved imports.[@mcpsep26]
    sources:
      - mcpsep26
context:
  recreational:
    text: >-
      There is no general recreational authorisation under the state law.[@state] Possession is
      criminal in the Federation, while the current Republika Srpska and Brčko codes do not
      reproduce that standalone offence.[@fbihcc,rsnow,brcko] Public use in Republika Srpska
      brings a separate fine; supplying another user can bring prison even without
      payment.[@publicrs,fbihcc,rsnow,brcko]
    sources:
      - state
      - fbihcc
      - rsnow
      - brcko
      - publicrs
  production:
    status: hemp
    text: >-
      The [state law](/history/bosnia-narcotics-law-commencement-2006/) allows a foreign-trade
      ministry permit for hemp grown for fibre and specified seed purposes.[@state] Applicants
      generally need a production-and-purchase contract with a registered operator, or must
      themselves be registered for the relevant activity.[@state] These agricultural rules do
      not create a general recreational production licence.[@state]
    sources:
      - state
  medical:
    text: >-
      The December 2025 rescheduling opened a route to controlled cannabis medicines.[@mcpsep26]
      After the [April roundtable](/history/bosnia-patient-access-roundtable-2026/), in
      September 2026 the Ministry of Civil Affairs reported that the implementing framework was
      still incomplete after almost nine months.[@mcpsep26] Required work covered prescribing
      indications, authorised specialties, registers, doses and pharmaceutical forms.[@mcpsep26]
      The Federation planned a new rulebook in early 2027; Republika Srpska’s amendments were
      still being finalised.[@mcpsep26]
    sources:
      - mcpsep26
  consequences:
    text: >-
      A Federation possession conviction is a criminal conviction under Article 239(3).[@fbihcc]
      The state law also provides confiscation of unlawfully held drugs and plants.[@state]
      Different jurisdictional routes mean the Republika Srpska public-use fine cannot be
      treated as the national consequence for possession.[@publicrs,fbihcc,state]
    sources:
      - fbihcc
      - state
      - publicrs
  planting:
    seeds: licensed
    seeds_trade: regulated
    clones: illegal
    clones_trade: banned
    text: >-
      Industrial hemp growing requires a permit for the specified fibre and seed
      purposes.[@state] The medicines agency describes an industrial ceiling of 0.2% THC in dry
      plant matter.[@alm22] This does not supply a general route to recreational cuttings or
      home growing.[@state]
    sources:
      - state
      - alm22
  clubs:
    status: none
    text: >-
      Giving cannabis for someone else to use or making premises available for use falls within
      the entity and district enabling-use offences.[@fbihcc,rsnow,brcko] The state hemp permit
      covers specified crop purposes, rather than collective recreational supply.[@state]
    sources:
      - fbihcc
      - rsnow
      - brcko
      - state
  visitors:
    status: none
    text: >-
      Visitors face the rules of the jurisdiction where they are found: the Federation
      criminalises unauthorised possession, while Republika Srpska and Brčko have different
      criminal provisions.[@fbihcc,rsnow,brcko] The state law also prohibits unauthorised
      possession, so absence of a matching criminal paragraph is not permission to carry
      cannabis.[@state] Medical rescheduling has not by itself completed the domestic
      prescribing and import system.[@mcpsep26]
    sources:
      - fbihcc
      - rsnow
      - brcko
      - state
      - mcpsep26
  hemp:
    status: strict
    text: >-
      Permitted crop purposes are fibre, seed for animal feed, further propagation and seed
      processing.[@state] A ministry permit is required, with reporting duties where diversion
      is suspected.[@state] The medicines agency’s [2022
      explanation](/history/bosnia-agency-cannabis-warning-2022/) identifies a ceiling of 0.2%
      THC in dry plant matter.[@alm22] That agricultural exception does not authorise cannabis
      flowers or CBD oil as a general medicine.[@alm22,mcpsep26]
    sources:
      - state
      - alm22
      - mcpsep26
  driving:
    status: impairment
    text: >-
      Driving under the influence of narcotic drugs is prohibited by Article 173.[@road] The
      [May 2026 amendment](/history/bosnia-reckless-drug-driving-2026/) includes driving under
      narcotics or other psychoactive substances within reckless driving, punishable by
      BAM2,000–3,000, a six-month driving ban and two penalty points; causing an accident raises
      these to BAM3,000–5,000, nine months and four points.[@road26] A repeat reckless-driving
      violation within two years can lead to seizure of the vehicle, with permanent confiscation
      available to the court under the statutory conditions.[@road26] Drug-test refusal carries
      the maximum BAM1,000 under its separate provision, alongside the associated ban and
      points.[@road26,road]
    sources:
      - road
      - road26
  arrests:
    text: >-
      SIPA’s [2023 report](/history/bosnia-sipa-drug-results-2023/) records 68 drug-trafficking
      cases worked on and sixteen reports to prosecutors concerning 32 people, plus one
      supplementary report concerning three people.[@sipa23] These are one state agency’s
      proceedings across all drugs.[@sipa23] In a separate local example, Republika Srpska
      police arrested one person in Šamac in December 2025 after finding 3.8 kg of suspected
      marijuana.[@samac25]
    sources:
      - sipa23
      - samac25
  black_market:
    text: >-
      SIPA’s 2023 operational seizures included 78.904 kg of marijuana/skank and 126 cannabis
      plants.[@sipa23] These are the state agency’s own seizures, alongside cocaine and
      amphetamine in its annual report.[@sipa23] The report describes joint work with the Border
      Police against drug trafficking and international cooperation in five drug-trafficking
      matters.[@sipa23]
    sources:
      - sipa23
