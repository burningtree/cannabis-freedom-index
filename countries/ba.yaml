segments:
  possession:
    text: >-
      Cannabis is illegal. Possession for personal use is generally handled as a misdemeanour with a
      fine under the state law on narcotic drugs, while the entity criminal codes punish production
      and trade; practice differs between the Federation, Republika Srpska and Brčko District.
    sources:
      - cann
      - wiki
  cultivation:
    text: Growing cannabis is a criminal offence.
    sources:
      - cann
  enforcement:
    text: Fines for users, prison for growers and dealers.
    sources:
      - cann
  sharing:
    text: Sale and supply are crimes with prison.
    sources:
      - cann
  consumption:
    text: Use is not separately criminalised; 'enabling' others to use is.
    sources:
      - wiki
  access:
    text: >-
      No legal source yet. On 29 December 2025 the Council of Ministers moved cannabis, its resin,
      extracts and tinctures from the table of prohibited substances to the table of substances under
      strict control, so that cannabis-based medicines can be prescribed. Prescribing still depends
      on entity rulebooks that had not been amended by July 2026, and without them the medicines
      agency cannot send the UN control board the estimate it needs before imports can be approved.
    sources:
      - gi
      - para25
      - para26
context:
  production:
    text: Industrial hemp only, under tightly regulated permits with large fines for violations.
    sources:
      - cms
  products:
    text: No legal THC products.
    sources:
      - cms
  medical:
    text: >-
      The Council of Ministers approved medical use on 29 December 2025, after a decade of
      campaigning that began with a state task force in 2016. Only pharmaceutical preparations
      prescribed by a doctor are allowed; the Agency for Medicines and Medical Devices oversees
      import and distribution, and growing cannabis for medicine remains prohibited. No patient
      could be treated by July 2026: the rulebook that is to set indications, prescribing doctors,
      registers and doses had not been amended, and the Federation's health ministry was given
      until 1 August 2026 to draft the changes.
    sources:
      - gi
      - para25
      - para26
      - wiki
  consequences:
    text: A misdemeanour is recorded but is not a criminal conviction.
    sources:
      - cann
  planting:
    seeds: licensed
    seeds_trade: regulated
    clones: illegal
    clones_trade: banned
    text: >-
      Industrial hemp may be grown only for fibre, for seed used as animal feed, and for
      further reproduction, processing and marketing of seed, with THC in the dry plant no
      higher than 0.2%. Only people and companies authorised by the competent body may grow
      hemp or place it on the market.
    sources:
      - cmsg
  clubs:
    status: none
    text: >-
      No cannabis clubs are known, and the law leaves no room for them: growing cannabis and
      supplying it to another person are both prohibited.
    sources:
      - cann
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. British travel advice says illegal
      drugs, including cannabis, carry severe penalties and tells travellers to expect a long
      jail sentence and heavy fines for possessing, using or smuggling them, also when only
      changing planes. Airport scanners are also used on the baggage of passengers in transit.
    sources:
      - gi
      - wiki
      - fcdo
