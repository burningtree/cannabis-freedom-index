  credit: V-Dem, Our World in Data
  title: "V-Dem (2026), Democracy report v16, processed by Our World in Data — Human rights index (V-Dem's civil liberties index)"
  url: https://ourworldindata.org/grapher/civil-liberties-index-vdem
  data_url: https://ourworldindata.org/grapher/civil-liberties-index-vdem.csv?v=1&csvType=full&useColumnShortNames=true
  data_label: OWID chart data, CSV
