- id: osm_shops
  file:
    - { file: osm-cannabis-shops-2026-10-21.csv, edition: 2026 }
  name: Cannabis shops on the map
  publisher: OpenStreetMap contributors
  credit: OpenStreetMap
  title: "OpenStreetMap contributors — places tagged shop=cannabis, via the Overpass API (data © OpenStreetMap contributors, ODbL)"
  url: https://wiki.openstreetmap.org/wiki/Tag:shop%3Dcannabis
  data_url: https://overpass-api.de/
  data_label: Overpass API
  when: counted October 2026
  about: >-
    How many places volunteers have tagged as cannabis shops in OpenStreetMap, the open map of
    the world, inside each country's borders: dispensaries, licensed shops, coffeeshops and CBD
    shops alike, wherever mappers used the tag. It shows where cannabis is sold openly, but also
    how thoroughly an area is mapped: Thailand, with thousands of shops, has only a few hundred
    tagged. Each count is a dated edition; counting again later adds a new one, so the trend
    builds up over time. Shown per million people.
  origin: >-
    Counted on 21 October 2026 through the Overpass API by scripts/fetch-open-data.py (osm): for
    each country, the elements tagged shop=cannabis inside its boundary (ISO 3166-1 code, admin
    level 2). Countries without such a boundary in OpenStreetMap, such as the disputed
    territories, are left out. Map data © OpenStreetMap contributors, under the Open Database
    Licence.
  profile:
    headline: "{shops} shops mapped"
    details: "{per} per million people · {year}"
    each: "{shops} in {year}"
  country: { column: country, by: id }
  fields:
    shops: { column: shops, about: "Places tagged shop=cannabis: map colour (per million people) and profile" }
    points: { column: points, about: "Of them, mapped as a point" }
    buildings: { column: buildings, about: "Of them, mapped as a building or area" }
  map:
    field: shops
    per: 1000000
    format: rate
    group: Context
    slug: cannabis-shops-mapped
    label: Shops on the map
    missing: No cannabis shops tagged in OpenStreetMap
    steps: [[0, "Under 1"], [1, "1–5"], [5, "5–20"], [20, "20–50"], [50, "50 or more"]]
    title: Cannabis shops mapped in OpenStreetMap
    lede: >-
      Places tagged as cannabis shops in OpenStreetMap, per million people. It shows where
      cannabis is sold openly, and how well each country is mapped. The stronger the blue, the
      more shops.
    sub: >-
      The stronger the blue, the more cannabis shops per million people are tagged in
      OpenStreetMap. Mapping is uneven, so a pale country may simply be less mapped.
    note: >-
      © OpenStreetMap contributors (ODbL): elements tagged shop=cannabis, counted October 2026,
      per million people. Not part of the score.

- id: gbif_plant
  file: gbif-cannabis-records.csv
  name: Records of the cannabis plant
  publisher: Global Biodiversity Information Facility (GBIF)
  credit: GBIF
  title: "GBIF.org (21 October 2026), GBIF Occurrence Search, genus Cannabis"
  url: https://www.gbif.org/occurrence/search?taxon_key=2984538
  data_url: https://api.gbif.org/v1/occurrence/search?taxonKey=2984538&facet=country&limit=0
  data_label: GBIF occurrence API
  when: records from 1500 to 2026
  about: >-
    Every record of the cannabis plant that herbaria, museums, botanical surveys and citizen
    scientists have shared through GBIF, by the country where the plant was found: wild, feral or
    grown. Old herbarium sheets show where the plant was collected centuries ago; recent records
    are mostly photographs from apps such as iNaturalist. The numbers say as much about who
    records plants as about where cannabis grows. The map and charts count records with a date;
    many have none, and those are given separately.
  origin: >-
    Counted on 21 October 2026 through GBIF's public API by scripts/fetch-open-data.py (gbif):
    the genus Cannabis with all its species and synonyms, faceted by country and then by year.
    The individual records keep the licences their publishers chose (CC0, CC BY or CC BY-NC);
    only counts are kept here.
  profile:
    headline: "{records_total} dated records"
    details: "{undated} more without a date · {records} in {year}"
    each: "{records_total} by {year}"
    years: [1900, 1960, 2000]
  country: { column: country, by: id }
  year: { column: year }
  fields:
    records_total: { column: records_total, about: "Dated records up to that year: map colour and profile" }
    records: { column: records, about: "Records from that year" }
    undated: { column: undated, about: "Records without a year, on a country's last row" }
  map:
    field: records_total
    format: number
    group: Context
    slug: cannabis-plant-records
    label: Plant records
    missing: No dated records of cannabis in GBIF
    steps: [[0, "Under 10"], [10, "10–50"], [50, "50–200"], [200, "200–1,000"], [1000, "1,000 or more"]]
    title: Where the cannabis plant has been recorded
    lede: >-
      Dated records of the cannabis plant shared through GBIF: herbarium sheets, botanical
      surveys and citizen-science photographs, by the country where the plant was found. The
      stronger the blue, the more records.
    sub: >-
      The stronger the blue, the more dated records of the cannabis plant. Countries with none are
      hatched. Use the slider to see how the records built up over the centuries.
    note: >-
      GBIF.org, genus Cannabis, dated records up to the year shown. Not part of the score.

- id: hemp
  file: faostat-hemp.csv
  name: Hemp grown
  publisher: Food and Agriculture Organization of the United Nations (FAO)
  credit: FAO
  title: "FAOSTAT — Production: Crops and livestock products (QCL), hemp fibre and hempseed"
  url: https://www.fao.org/faostat/en/#data/QCL
  data_url: https://bulks-faostat.fao.org/production/Production_Crops_Livestock_E_All_Data_(Normalized).zip
  data_label: bulk download, all crops and livestock
  when: 1961 to 2024
  about: >-
    How much hemp each country grows for fibre and for seed, in hectares harvested and tonnes
    produced, every year since 1961, as governments report them to FAO. It shows the crop itself,
    not cannabis use: industrial hemp has little THC. Fibre and seed areas overlap where one crop
    gives both, so the area shown is the larger of the two, not their sum. Records are patchy:
    some countries report only fibre or only seed, some only area, and many stop for years.
  origin: >-
    FAO's bulk file (last updated 23 December 2025, about 34 MB) was downloaded on 21 October 2026
    and read by scripts/extract-faostat-hemp.py, which keeps the hemp rows: "True hemp, raw or
    retted" (fibre) and "Hempseed", production and area harvested, every year, with FAO's flag
    for each figure (A official, E estimated, I imputed, X another international body). The bulk
    file is too large to keep here. Countries are matched by their M49 code; FAO's "China"
    aggregate is left out in favour of mainland China, and former states (the USSR,
    Czechoslovakia, Yugoslavia) are kept in the file without a country, so the site does not show
    them.
  profile:
    headline: "{hemp_ha} ha in {year}"
    details: "{fibre_t} t of fibre · {seed_t} t of seed"
    each: "{hemp_ha} ha in {year}"
    years: [1961, 1980, 2000]
  country: { column: country, by: id }
  year: { column: year }
  fields:
    hemp_ha: { column: hemp_ha, about: "Hectares of hemp: map colour and profile" }
    fibre_t: { column: fibre_t, about: "Tonnes of hemp fibre" }
    seed_t: { column: seed_t, about: "Tonnes of hempseed" }
    fibre_ha: { column: fibre_ha, about: "Hectares harvested for fibre" }
    seed_ha: { column: seed_ha, about: "Hectares harvested for seed" }
  map:
    field: hemp_ha
    format: number
    group: Context
    since: 2015
    slug: hemp-grown
    label: Hemp grown
    missing: No hemp reported to FAO since 2015
    steps: [[0, "Under 100 ha"], [100, "100–1,000 ha"], [1000, "1,000–5,000 ha"], [5000, "5,000–20,000 ha"], [20000, "20,000 ha or more"]]
    title: Where hemp is grown, by country
    lede: >-
      Hectares of hemp harvested for fibre or seed in the latest year each country reported to
      FAO, since 2015. Hemp is the same plant as cannabis, grown for its stalks and seeds rather
      than for THC. The stronger the blue, the more hemp.
    sub: >-
      The stronger the blue, the more hectares of hemp, for fibre or seed. Countries that have not
      reported hemp to FAO since 2015 are hatched.
    note: >-
      FAOSTAT, hemp fibre and hempseed, area harvested, latest year reported since 2015. Not part
      of the score.

- id: research_papers
