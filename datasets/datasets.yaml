  publisher: OpenAlex (OurResearch)
  credit: OpenAlex
  title: OpenAlex — works mentioning cannabis, marijuana, marihuana or cannabinoids in their title or abstract, by author country
  url: https://openalex.org/
  data_url: https://api.openalex.org/works?filter=title_and_abstract.search:cannabis%7Cmarijuana%7Cmarihuana%7Ccannabinoid&group_by=authorships.countries
  data_label: OpenAlex API
  when: 1950 to 2025
  about: >-
    How many research papers about cannabis have authors working in each country, every year
    since 1950: papers whose title or abstract mentions cannabis, marijuana, marihuana or a
    cannabinoid, in OpenAlex's open catalogue of scholarly works. A paper with authors in
    several countries counts for each. It shows where cannabis is studied, which laws can make
    easier or harder. Shown per million people using today's population.
