    steps: [[0, "Under 10"], [10, "10–50"], [50, "50–100"], [100, "100–250"], [250, "250 or more"]]
    title: Police contact for drug use or possession, by country
    lede: >-
      How many people per 100,000 were brought into contact with the police for using or
      possessing drugs, in the latest year each country reported to UNODC. All drugs together,
      cannabis included. The stronger the blue, the more people.
    sub: >-
      The stronger the blue, the more people per 100,000 the police dealt with for drug use or
      possession. All drugs together; countries count differently. Countries that do not report
      are hatched.
    note: >-
      UNODC World Drug Report 2026, table 10.1: persons in formal contact with the police for
      drug use or possession, all drugs, latest year reported. Not part of the score.

- id: seizures
  file: unodc-cannabis-seizures.csv
  original: unodc-wdr2026-7.1-drug-seizures.xlsx
  name: Cannabis seized
  publisher: United Nations Office on Drugs and Crime (UNODC)
  credit: UNODC
  title: UNODC — World Drug Report 2026, statistical annex, table 7.1 Drug seizures 2015–2024
  url: https://www.unodc.org/unodc/en/data-and-analysis/world-drug-report-2026-annex.html
  data_url: https://www.unodc.org/documents/data-and-analysis/WDR_2026/Annex/7.1_Drug_seizures_2015-2024.xlsx
  data_label: table 7.1, spreadsheet
  when: 2015 to 2024
  about: >-
    Kilograms of cannabis herb and cannabis resin seized by the authorities each year, as
    reported to UNODC. Seizures show where enforcement and trafficking routes are, not how much
    cannabis is used: a transit country can seize far more than it consumes. Figures are as
    reported, and some countries appear to count plants destroyed in the field as herb, which
    makes their totals very large. Plants, oil and seeds are left out.
  origin: >-
    The publisher's spreadsheet was downloaded on 21 October 2026 and is published here
    unchanged. The CSV is extracted from it by scripts/extract-unodc.py (seizures): herb and resin
    in kilograms for every country and year, adding up rows of the same kind, with UNODC's source
    for each figure (ARQ: the government's annual questionnaire; GOV: another government source;
    AU: the African Union; INCSR: the US State Department).
  profile:
    headline: "{total_kg} kg in {year}"
    details: "{herb_kg} kg of herb · {resin_kg} kg of resin"
    each: "{total_kg} kg in {year}"
    years: [2015, 2020]
  country: { column: country, by: id }
  year: { column: year }
  fields:
    total_kg: { column: total_kg, about: "Herb and resin together: map colour and profile" }
    herb_kg: { column: herb_kg, about: "Kilograms of herb" }
    resin_kg: { column: resin_kg, about: "Kilograms of resin" }
    reported_by: { column: reported_by, type: text, about: "UNODC's source for the figures" }
  map:
    field: total_kg
    format: number
    group: Law
    since: 2020
    slug: cannabis-seizures
    label: Cannabis seized
    missing: No seizures reported to UNODC since 2020
    steps: [[0, "Under 100 kg"], [100, "100 kg–1 t"], [1000, "1–10 t"], [10000, "10–100 t"], [100000, "100 t or more"]]
    title: Cannabis seized by the authorities, by country
    lede: >-
      Kilograms of cannabis herb and resin seized in the latest year each country reported to
      UNODC. Seizures follow enforcement and trafficking routes, not use. The stronger the blue,
      the more was seized.
    sub: >-
      The stronger the blue, the more cannabis herb and resin was seized. Figures as reported;
      countries that have not reported since 2020 are hatched.
    note: >-
      UNODC World Drug Report 2026, table 7.1: cannabis herb and resin seized, latest year since
      2020. Not part of the score.

