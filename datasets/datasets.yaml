    Counted on 21 October 2026 through OpenAlex's public API by scripts/fetch-open-data.py
    (openalex): one query per year, grouped by the countries of the authors' institutions. The
    current year, still incomplete, is left out. OpenAlex data is CC0.
  profile:
    headline: "{per} papers per million people"
    details: "{papers} papers in {year}"
    each: "{papers} in {year}"
    years: [1970, 1990, 2010]
  country: { column: country, by: id }
  year: { column: year }
  fields:
    papers: { column: papers, about: "Papers that year: map colour (per million people) and profile" }
  map:
    field: papers
    per: 1000000
    format: rate
    since: 2024
    slug: cannabis-research
    label: Cannabis research
    missing: No cannabis papers in OpenAlex in the latest year
    steps: [[0, "Under 1"], [1, "1–3"], [3, "3–10"], [10, "10–30"], [30, "30 or more"]]
    title: Where cannabis is studied
    lede: >-
      Research papers about cannabis per million people, by the countries their authors work in,
      in the latest full year, from OpenAlex's open catalogue. The stronger the blue, the more
      research.
    sub: >-
      The stronger the blue, the more papers about cannabis per million people. Use the slider to
      go back to 1950.
    note: >-
      OpenAlex, papers mentioning cannabis by author country, per million people (today's
      population). Not part of the score.

