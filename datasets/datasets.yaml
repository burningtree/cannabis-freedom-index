# Outside datasets: what each CSV file in this folder is and how to read it. The site reads the
# files as they are at build time (src/lib/datasets.js); nothing is copied into the country files.
# A dataset whose file is missing is left out of the site with a warning, so a definition can wait
# here for its file.
#
#   file      the CSV in this folder, published unchanged at /data/datasets/<file>; or, for a
#             dataset published as a new file each time (a yearly survey), a list of
#             { file, edition }, one per edition, whose rows take the edition's year
#   origin    how the file was made: downloaded as published, or transcribed, and when
#   original  optional: the publisher's own file, kept and published beside an extract made from it
#   country   which column names the country, and whether it holds our file names (`by: id`,
#             "de", "us") or country names (`by: name`, matched to the `name:` of each country
#             file, ignoring accents and punctuation); `aliases` maps names that differ
#   year      optional: a column with the year of each row. Every dataset is kept as a series,
#             one row per country and year, so that profiles can chart it; the site's own
#             figures and the map use the latest year
#   fields    our name for each figure → the column it is read from, its decimals, `type: boolean`
#             for a column that is "true" or empty or `text`, and `about`, what the site uses it
#             for, and how it is written on a profile: `format` (number, percent, decimal, rank or
#             text; `values` names the codes of a text field)
#   credit    optional: a short name for the publisher, for the profile's Datasets tab
#   profile   how the dataset reads in the profile's Datasets tab: a `headline` and a line of
#             `details`, with {field} for a figure ({per} for the rate per `map.per` people).
#             A part of the details whose figure is missing is left out. For a series, `years`
#             picks the years listed in the details
#   rail      true for the few datasets also shown in the profile's side column ("Beyond the
#             law"); every dataset is listed in the profile's Datasets tab
#   map       optional: how one field colours the world map, on a view of its own in `group`
#             (Society by default): `steps` are where each of the five colours starts; `format`
#             is percent, decimal or rate; `per` divides the field by the country's population
#             and multiplies by it (100000: per 100,000 people)
#   pages     optional: the pages that show the dataset, for one with views of its own, and
#             `also`, words after them
# Everything shown on the site is never part of the score.

- id: cannabis_use
  file: unodc-cannabis-use.csv
  original: unodc-wdr2026-1.2-prevalence-national.xlsx
  name: Cannabis use
  publisher: United Nations Office on Drugs and Crime (UNODC)
  credit: UNODC
  title: UNODC — World Drug Report 2026, statistical annex, table 1.2 Prevalence of drug use in the general population, national data
  url: https://www.unodc.org/unodc/en/data-and-analysis/world-drug-report-2026-annex.html
  data_url: https://www.unodc.org/documents/data-and-analysis/WDR_2026/Annex/1.2_prevalence_of_drug_use_in_the_general_population_national_data.xlsx
  data_label: table 1.2, spreadsheet
  when: national surveys from 1995 to 2024
  about: >-
    The share of adults who used cannabis in the past year, from each country's most recent
    national survey as reported to UNODC, and the number of people that share stands for today.
    The count uses a population of the same age band as the survey. Most surveys ask people aged
    15 to 64; where a survey used another age band, the band is given with the figure. Every
    country and territory on the site has a row.
  origin: >-
    Rebuilt on 23 October 2026 by scripts/extract-unodc.py from UNODC's spreadsheet, which is
    published here unchanged: sheet "Cannabis", the best estimate of the latest survey for each
    country (a survey period such as 2022/23 counts as its last year). The United Kingdom is
    represented by England and Wales. Where the table has no figure, `source` says what was used
    instead: "earlier" keeps the figure this site had before, taken from Wikipedia's list of
    older UNODC figures; "estimate" is the median of the measured countries in the same region,
    computed here, not a regional total published by UNODC. A disputed territory with no survey
    takes instead the figure of the country it is internationally regarded as part of
    (`estimate_from`), whose survey covered nearly the same people, applied to its own population
    aged 15 to 64: its total from datasets/population.csv times that country's share of those
    ages. Corrected on 25 October 2026: the World Bank's regional and income aggregates had been
    taken for Northern Cyprus (XN) and Transnistria (XT), which gave them some two billion people. `users` applies the share to a
    population of the survey's own age band, from the World Bank's five-year age groups (male
    and female summed, latest year). A band that cuts through a group is split evenly across
    those ages and marked `users_approximate`. A survey with no recorded age, and a regional
    median, use the population aged 15 to 64 (SP.POP.1564.TO). Where that population is missing,
    the row has no user count. The sum of these country counts is not UNODC's separate estimate
    of 256 million cannabis users worldwide in 2024.
  profile:
    headline: "{prevalence} of adults"
    details: "{users} people · survey {period} · ages {ages} · {source}"
  country: { column: country, by: id }
  fields:
    prevalence: { column: prevalence, format: percent, about: "Share of adults: map, rankings, profile" }
    users: { column: users, about: "Number of users: map, rankings, profile" }
    year: { column: year, about: "Survey year (the last year of a period), empty for estimates" }
    period: { column: period, type: text, about: "Survey year or period as UNODC gives it" }
    ages: { column: ages, type: text, about: "The survey's age band, shown with the figure" }
    source: { column: source, type: text, about: "wdr2026, earlier or estimate", values: { wdr2026: "UNODC 2026", earlier: "earlier figure, not in UNODC 2026", estimate: "computed here: the median of surveyed countries in the region, or the figure of the country a territory is part of" } }
    estimate: { column: estimate, type: boolean, about: "Marks a figure computed here for a place with no survey (shown with ~)" }
    estimate_from: { column: estimate_from, type: text, about: "For a disputed territory with no survey: the country whose figure it takes" }
    population_15_64: { column: population_15_64, about: "Population aged 15 to 64, kept for reference" }
    population_band: { column: population_band, about: "Population the user count is applied to" }
    population_ages: { column: population_ages, type: text, about: "Age band of population_band" }
    users_approximate: { column: users_approximate, type: boolean, about: "The user count splits an age group, or assumes ages 15 to 64 because the survey age was not recorded" }
  pages:
    - { label: the map of users, path: map/users/ }
    - { label: the map of the share of adults, path: map/share-of-adults/ }
    - { label: the map of use against freedom, path: map/use-against-freedom/ }
    - { label: the rankings, path: "#rankings" }
  also: and every country profile

- id: youth_use
  file: unodc-cannabis-use-youth.csv
  original: unodc-wdr2026-1.4-prevalence-youth.xlsx
  name: Cannabis use at 15 and 16
  publisher: United Nations Office on Drugs and Crime (UNODC)
  credit: UNODC
  title: UNODC — World Drug Report 2026, statistical annex, table 1.4 Prevalence of drug use in the youth population, national data
  url: https://www.unodc.org/unodc/en/data-and-analysis/world-drug-report-2026-annex.html
  data_url: https://www.unodc.org/documents/data-and-analysis/WDR_2026/Annex/1.4_prevalence_of_drug_use_in_the_youth_population_national_data_national_data.xlsx
  data_label: table 1.4, spreadsheet
  when: school surveys from 2003 to 2024
  about: >-
    The share of 15- and 16-year-olds who used cannabis in the past year, mostly from school
    surveys such as ESPAD, as each government reports them to UNODC. Only surveys of this age
    group are used, so that countries can be compared: some large countries, Germany, France and
    Spain among them, report only other age bands and are left out.
  origin: >-
    The publisher's spreadsheet was downloaded on 21 October 2026 and is published here
    unchanged. The CSV is extracted from it by scripts/extract-unodc.py (youth): sheet "Cannabis",
    rows covering ages 15 to 16 with a past-year figure, the latest survey for each country. Rows
    about herb or resin only, or about one part of a country, are left out, and UNODC's age
    group is written out ("(SS) 15 - 16" as "ages 15–16, school survey").
  profile:
    headline: "{past_year} in the past year"
    details: "{lifetime} ever · {past_month} in the past month · {year} · {coverage}"
  country: { column: country, by: id }
  fields:
    past_year: { column: past_year, format: percent, about: "Map colour and profile" }
    lifetime: { column: lifetime, format: percent }
    past_month: { column: past_month, format: percent }
    year: { column: year, format: text }
    coverage: { column: coverage, type: text, about: "Age group, and whether it was a school survey" }
  map:
    field: past_year
    format: percent
    group: Use
    slug: youth-cannabis-use
    label: Use at 15 and 16
    missing: No survey of 15- and 16-year-olds reported to UNODC
    steps: [[0, "Under 3%"], [3, "3–7%"], [7, "7–12%"], [12, "12–18%"], [18, "18% or more"]]
    title: Cannabis use among 15- and 16-year-olds, by country
    lede: >-
      The share of 15- and 16-year-olds who used cannabis in the past year, from the latest school
      survey each country reported to UNODC. The stronger the blue, the higher the share.
    sub: >-
      The stronger the blue, the more 15- and 16-year-olds used cannabis in the past year.
      Countries without a survey of this age group are hatched.
    note: >-
      UNODC World Drug Report 2026, table 1.4: past-year use among 15- and 16-year-olds, latest
      survey reported. Survey years differ between countries.

- id: pew_marijuana
  file:
    - { file: pew-marijuana-morality-2026.csv, edition: 2025 }
  rail: true
  origin: >-
    Transcribed by hand on 20 October 2026 from the "Total" row of each country in the topline
    PDF (question 17g, "Using marijuana"). The columns are the per cent of adults answering
    morally acceptable, morally unacceptable, not a moral issue, depends on the situation
    (volunteered) and don't know or refused, and the number of people asked.
  name: Is using marijuana morally wrong?
  publisher: Pew Research Center
  title: Pew Research Center — In 25-country survey, Americans especially likely to view fellow citizens as morally bad (5 March 2026)
  url: https://www.pewresearch.org/religion/2026/03/05/in-25-country-survey-americans-especially-likely-to-view-fellow-citizens-as-morally-bad/
  data_url: https://www.pewresearch.org/wp-content/uploads/sites/20/2026/03/pr_2026.03.05_international-morality_topline.pdf
  data_label: topline, question 17g
  when: surveyed January to May 2025
  about: >-
    Adults were asked whether using marijuana is morally acceptable, morally unacceptable, or not
    a moral issue. Nationally representative samples of about 1,000 people or more in each of 25
    countries.
  notes:
    us: In the United States the question said “morally wrong” instead of “morally unacceptable”.
  profile:
    headline: "{unacceptable} call it immoral"
    details: "{acceptable} acceptable · {not_moral} not a moral issue · {sample} people asked"
  country: { column: country, by: id }
  fields:
    unacceptable: { column: unacceptable, format: percent }
    acceptable: { column: acceptable, format: percent }
    not_moral: { column: not_moral, format: percent }
    depends: { column: depends, format: percent }
    unsure: { column: unsure, format: percent }
    sample: { column: n }
  map:
    field: unacceptable
    format: percent
    slug: marijuana-morality
    label: Says marijuana is immoral
    missing: Not among the 25 countries Pew surveyed
    steps: [[0, "Under 20%"], [20, "20–35%"], [35, "35–50%"], [50, "50–70%"], [70, "70% or more"]]
    title: Is using marijuana morally wrong? Views in 25 countries
    lede: >-
      The share of adults who say using marijuana is morally unacceptable, from Pew Research
      Center's 2025 survey of 25 countries. The stronger the blue, the more people disapprove.
    sub: >-
      The stronger the blue, the more adults say using marijuana is morally unacceptable. Only 25
      countries were surveyed; the rest are hatched.
    note: >-
      Pew Research Center, 2025 survey of 25 countries, published March 2026. Moral views are shown
      for context and are not part of the score.

- id: cannabis_offences
  file: euda-cannabis-use-offences.csv
  original: euda-sb2026-dlo-03-2-0-cannabis-use-offences.xml
  name: Offences for cannabis use or possession
  publisher: European Union Drugs Agency (EUDA)
  credit: EUDA
  title: EUDA — Statistical Bulletin 2026, drug law offences, cannabis, use (table DLO-03-2-0)
  url: https://www.euda.europa.eu/data/stats2026/dlo_en#displayTable:DLO-03-2-0
  data_url: https://www.euda.europa.eu/modules/sbdata/SBDataService2026.cfc?method=fetchxlsx&tableid=DLO-03-2-0
  data_label: table DLO-03-2-0, spreadsheet
  when: 2007 to 2024
  about: >-
    Offences of using cannabis or possessing it for one's own use that the police record each
    year, as European countries report them to the EUDA ("drug law offences, cannabis, use"):
    cannabis alone, unlike UNODC's figures for all drugs, and not offences of supply such as
    dealing, trafficking or growing for sale. An offence is not a conviction: depending on the
    country it may end in a fine, a caution, a referral to treatment or a criminal case. Countries
    record offences or offenders, and define them, in different ways, so compare a country with
    itself over time rather than with its neighbours. The EUDA notes that Slovenia counted only
    use-related offences in 2023, that Portugal's figures for 2017 to 2021 lack one police force,
    and that Greece's include all cannabis products since 2018. Shown per 100,000 people using
    today's population.
  origin: >-
    The EUDA's site refuses scripted downloads, so the table was read in a browser on 21 October
    2026 from its data service (the XML behind the table) and saved unchanged; its SHA-256 was
    checked against the browser's copy. scripts/extract-euda.py (cannabis_offences) turns it into
    one row per country and year with a figure.
  profile:
    headline: "{per} per 100,000 people"
    details: "{offences} offences in {year} · cannabis only · use or possession, not dealing"
    each: "{offences} in {year}"
    years: [2010, 2020]
  country: { column: country, by: id }
  year: { column: year }
  fields:
    offences: { column: offences, about: "Offences recorded: map colour (per 100,000) and profile" }
  map:
    field: offences
    per: 100000
    format: rate
    group: Law
    since: 2020
    slug: cannabis-offences-europe
    label: Cannabis offences (Europe)
    missing: No cannabis-use offences reported to the EUDA since 2020
    steps: [[0, "Under 10"], [10, "10–50"], [50, "50–100"], [100, "100–250"], [250, "250 or more"]]
    title: Offences for cannabis use or possession in Europe
    lede: >-
      Offences of using or possessing cannabis per 100,000 people, in the latest year each
      European country reported to the EUDA since 2020. The stronger the blue, the more offences.
    sub: >-
      The stronger the blue, the more cannabis use or possession offences per 100,000 people.
      Countries count differently; those without a report since 2020 are hatched.
    note: >-
      EUDA Statistical Bulletin 2026, table DLO-03-2-0: cannabis use offences, latest year since
      2020, per 100,000 people. Not part of the score.

- id: police_possession
