    title: The street price of cannabis in Europe
    lede: >-
      The mean retail price of a gram of cannabis herb, in euros, in the latest year each European
      country reported to the EUDA since 2020. The stronger the blue, the dearer.
    sub: >-
      The stronger the blue, the more a gram of cannabis herb costs. Countries without a reported
