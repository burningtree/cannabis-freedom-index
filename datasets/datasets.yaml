    for each figure (A official, E estimated, I imputed, X another international body). The bulk
    file is too large to keep here. Countries are matched by their M49 code; FAO's "China"
    aggregate is left out in favour of mainland China, and former states (the USSR,
    Czechoslovakia, Yugoslavia) are kept in the file without a country, so the site does not show
    them.
