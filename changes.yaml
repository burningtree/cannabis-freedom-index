- id: chile-pharmacy-regulation-1905
  date: "1905"
  category: other
  country: cl
  title: Chile's Pharmacy Regulation names controlled substances
  description: >-
    The 1905 Reglamento de Farmacia was the first to define substances such as coca, opium and
    Indian hemp as subject to special control, but it only prescribed cautions for medicines that
    contained them.
  checked: true
  sources:
    - title: "Marcos Fernández Labbé — Del ficticio entusiasmo: el mercado de las drogas en el tránsito a la prohibición en Chile, 1920–1960 (Historia Crítica 39, 2009)"
      url: https://www.redalyc.org/pdf/811/81112363006.pdf

- id: congo-free-state-hemp-ordinance-1903
  date: "1903-01-22"
  category: ban
  country: cd
  title: The Congo Free State bans smoking hemp
  description: >-
    An ordinance-law titled measures against the use of smoking hemp, approved by decree on 1 March
    1903, prohibited growing, selling, transporting and possessing hemp for smoking, and using it in
    any way. Offenders faced a fine of 100 to 1,000 francs and fifteen days to a year of penal
    servitude, and village chiefs were jointly liable for the fines. It refers to an earlier order
    of 8 May 1899 on destroying confiscated hemp.
  before: {possession: 10, cultivation: 10, enforcement: 10, sharing: 10, consumption: 10, access: 8}
  checked: true
  sources:
    - title: Leganet.cd — Ordonnance-loi du 22 janvier 1903, mesures contre l'usage de fumer le chanvre
      url: https://www.leganet.cd/Legislation/DroitSocial/Secu/OL.22.01.1903.htm

