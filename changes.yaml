- id: france-reimbursement-decree-2026
  date: "2026-07-02"
  category: medical
  country: fr
  title: France sends its medical cannabis decree to the Conseil d'État
  description: >-
    The decree sets out how the health authority will assess cannabis medicines and at what rate
    they are reimbursed. About 700 patients left in the pilot are covered until 31 December 2026;
    first prescriptions under a permanent regime are possible in 2027.
  checked: true
  sources:
