- id: australia-ban-1926
  date: "1926"
  country: au
  title: Australia begins banning cannabis
  description: >-
    The federal government prohibited imports after signing the Geneva convention. The states then
    banned possession and use one by one, from Victoria in 1928 to Tasmania in 1959.
