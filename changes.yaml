  date: "2026-09-01"
  category: debate
  country: ad
  title: Andorra prepares a licence for growing medicinal cannabis
  description: >-
    The government presented a reform of the Agriculture and Livestock Farming Act that it called
    the most important step towards allowing cannabis to be grown for medicinal purposes, creating
    the legal structure for a single cultivation licence.
  checked: true
  sources:
