- id: indonesia-colonial-ban-1927
  date: "1927"
  country: id
  title: The Dutch East Indies ban cannabis
  description: >-
    A colonial narcotics ordinance prohibited growing cannabis and tightly restricted its
    possession, use and distribution across the archipelago. Medical and scientific activity
    required prior authorisation; other offences brought fines or up to six months in prison.
  before: {possession: 10, cultivation: 10, enforcement: 10, sharing: 10, consumption: 10, access: 8}
  source:
    title: Transnational Institute — Cannabis in Indonesia, patterns in consumption, production and policies
    url: https://www.tni.org/files/publication-downloads/dpb_44_13012016_map_web.pdf

- id: new-zealand-dangerous-drugs-1927
  date: "1927"
  country: nz
  title: New Zealand bans cannabis
  description: >-
    The Dangerous Drugs Act restricted cannabis to medical use on prescription, following the Geneva
    convention. Almost nobody used it at the time; the first notable prosecutions came in the 1960s.
  before: {possession: 10, cultivation: 10, enforcement: 10, sharing: 10, consumption: 10, access: 8}
  source:
    title: Wikipedia — Cannabis in New Zealand
    url: https://en.wikipedia.org/wiki/Cannabis_in_New_Zealand

- id: argentina-possession-crime-1926
  date: "1926"
  country: ar
  title: Argentina makes drug possession a crime
  description: >-
