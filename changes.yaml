- id: geneva-opium-convention-1925
  date: "1925-02-19"
  title: Cannabis enters international drug control
  description: >-
    At Egypt's request, the International Opium Convention signed in Geneva added "Indian hemp" to
    the substances under control. It restricted export and import to medical and scientific use,
    the first time cannabis was covered by an international treaty.
  source:
    title: Wikipedia — International Opium Convention
    url: https://en.wikipedia.org/wiki/International_Opium_Convention

