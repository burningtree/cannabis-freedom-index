  date: "2026-07-21"
  category: debate
  country: es
  title: Spain's cabinet backs a tobacco law that would hit cannabis clubs
  description: >-
    The Council of Ministers approved a draft overhaul of the 2005 tobacco law that would remove the
    exemption for private smokers' clubs, one of the legal props the cannabis clubs rely on. It had
    not completed its passage by October.
  checked: true
  sources:
