  date: "2026-08-10"
  category: tightening
  country: pg
  title: A court sets a K30,000 fine or 20 years for marijuana
  description: >-
    The Tari District Court convicted a man after police and soldiers found about 4.7 kg in
    60 rolls. It ordered him to pay K30,000 or serve 20 years, illustrating the severe sentences
    courts continued to impose under the 2021 regime.
