- id: argentina-arriola-2009
  date: "2009-08-25"
  country: ar
  title: Argentina's Supreme Court protects private use
  description: >-
    In the Arriola ruling the court held that punishing an adult for holding a small amount for
    personal use in private is unconstitutional. The law itself was never changed and no gram limit
    was set, so judges decide case by case.
  before: {possession: 1, cultivation: 1, enforcement: 2, sharing: 1, consumption: 1, access: 0}
  source:
    title: Wikipedia — Cannabis in Argentina
