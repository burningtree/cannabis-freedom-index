# Changes: a law or other important development that moved a country's score.
# The home page shows the four most recent. Add new entries anywhere; they are sorted by date.
#
#   id:      unique, short, lower-case
#   date:    when the change took effect: "YYYY-MM-DD", or "YYYY-MM" / "YYYY" if that is all we know
#   country: the file name in /countries, e.g. "gd"
#   before:  the six segment scores (0-10) before the change. The scores after it are taken from
#            the same country's next change, or from the country file if this is its latest one.
#
# An entry without `before` is context that moves no score: a report or court ruling in a country,
# or, with no `country` either, a treaty or UN decision.
#
# `estimate: true` marks a first restriction with no known date. It is assumed to have happened
# between the 1925 and 1961 treaties: the charts spread it over those years, and the History page
# leaves it out. Replace it with a dated entry when the country's first law is found.

- id: thailand-cabinet-bill-2026
  date: "2026-09-22"
  country: th
  title: Thailand's cabinet approves a medical-only cannabis bill
  description: >-
    The draft Cannabis and Hemp Act would write the 2025 prescription rule into law, make growers
    register their plantations and raise penalties. It still has to pass parliament.
  source:
    title: The Edge Malaysia (Bloomberg) — Thai Cabinet approves bill to tighten cannabis controls (September 2026)
    url: https://theedgemalaysia.com/node/818915

- id: brazil-cultivation-rules-2026
  date: "2026-08-04"
  country: br
  title: Brazil's first legal cannabis cultivation rules take effect
  description: >-
    Companies may grow low-THC cannabis for medicines and research under special authorisation, and
    patient associations may grow for their members in a supervised trial scheme.
  source:
    title: GrowerIQ — Anvisa publishes five new cannabis resolutions (RDC 1.011 to 1.015)
    url: https://groweriq.ca/2026/03/20/anvisa-cannabis-resolutions-2026/

- id: saudi-arabia-ethiopian-hashish-executions-2026
  date: "2026-07-27"
  country: sa
  title: Saudi Arabia executes ten Ethiopians in hashish cases
  description: >-
    Five Ethiopian migrants were executed for allegedly smuggling hashish, after five others on
    23 June. Human Rights Watch reported that the latest group had no lawyers and only limited
    interpretation during extremely short court hearings.
  source:
    title: Human Rights Watch — Saudi Arabia, new executions of Ethiopian migrants
    url: https://www.hrw.org/news/2026/07/28/saudi-arabia-new-executions-of-ethiopian-migrants

- id: singapore-cannabis-execution-2026
  date: "2026-04-16"
  country: sg
  title: Singapore carries out another cannabis execution
  description: >-
    Omar bin Yacob Bamadhaj was executed for importing 1,009.1 g of cannabis, about twice the
    500 g capital threshold. His conviction dated from 2021 and had been upheld on appeal.
  source:
    title: CNB — Execution of a convicted drug importer, 16 April 2026
    url: https://www.cnb.gov.sg/mediaroom/news/execution-of-a-convicted-drug-importer---16-april-2026/

- id: philippines-medical-cannabis-panel-2026
  date: "2026-02-24"
  country: ph
  title: Philippine House panels revive medical-cannabis legislation
  description: >-
    The House committees on dangerous drugs and health approved a consolidated bill, subject to
    style and amendments, that would allow regulated access to cannabis in pharmaceutical dosage
    forms. The proposal had not become law by October.
  source:
    title: House of Representatives — panel approves bill on medical cannabis
