      url: https://businessofcannabis.com/is-cannabis-legal-in-spain-clubs-courts-and-a-market-in-limbo

- id: bahamas-licensing-delayed-2026
  date: "2026-07"
  category: medical
  country: bs
  title: The Bahamas still has not opened cannabis licensing
  description: >-
    Two years after the cannabis legislation passed, the chairman of the Bahamas Cannabis Authority
    said the licence application portal had not opened; an earlier target of late June or early July
    had slipped. Applications will go through compliance checks and police vetting before the board
    decides, and every dispensary will need a registered pharmacist.
  checked: true
  sources:
