- id: greece-sprayed-products-ban-2026
  date: "2026-07-24"
  category: tightening
  country: gr
  title: Greece bans smokable products with added cannabinoids
  description: >-
    Article 84 of Law 5322/2026 banned making, selling or buying any product meant for smoking,
    vaping or inhaling that consists of plant material to which natural or synthetic cannabinoids
    have been added, for example by spraying. Offenders face the trafficking penalties of the drug
    law. Licensed pharmaceutical cannabis is exempt.
  checked: true
  sources:
    - title: Ν. 5322/2026, άρθρο 84 (ΦΕΚ Α' 117/24-07-2026), text on Taxheaven
      url: https://www.taxheaven.gr/law/5322/2026/arthro/84

