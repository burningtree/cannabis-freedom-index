- id: us-state-bans-1913
  date: "1913"
  category: ban
  country: us
  title: American states begin banning cannabis
  description: >-
    California prohibited cannabis in 1913, after Massachusetts in 1911. By 1933 most states had
    restricted it, many by adopting the Uniform State Narcotic Drug Act. This entry stands for the
    whole process.
  before: {possession: 10, cultivation: 10, enforcement: 10, sharing: 10, consumption: 10, access: 8}
  checked: true
  sources:
