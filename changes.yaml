  date: "2026-04-13"
  category: debate
  country: cl
  title: Chilean deputies ask the Constitutional Court to stop a tougher drug law
  description: >-
    Thirty-seven opposition deputies challenged a reform of Law 20.000 that Congress had passed. It
    would let trafficking penalties apply to small amounts when a substance is judged capable of
    serious harm, weighing potential harm and not only quantity. The deputies argued it would treat
    users and medical growers as traffickers. The law had not yet been promulgated.
  checked: true
  sources:
