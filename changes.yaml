      url: https://cannabishealthnews.co.uk/2026/07/07/france-submits-decree-for-reimbursement-of-medical-cannabis/

- id: vietnam-drug-law-2026
  date: "2026-07-01"
  category: other
  country: vn
  title: Vietnam's new drug law takes effect
  description: >-
    Law 120/2025/QH15, passed on 10 December 2025, replaced the 2021 drug law. It names the cannabis
    plant as a narcotic plant, bans growing it or teaching others to grow it, and leaves cultivation
    out of the activities that can be licensed.
  checked: true
  sources:
    - title: Law No. 120/2025/QH15 on Drug Prevention and Control (LuatVietnam English translation)
