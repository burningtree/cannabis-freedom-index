      url: https://www.infobae.com/colombia/2026/05/12/avanza-proyecto-que-busca-regular-el-cannabis-de-uso-adulto-en-colombia-esto-le-falta-para-ser-nueva-ley/

- id: switzerland-committee-continues-cannabis-bill-2026
  date: "2026-05-08"
  category: debate
  country: ch
  title: Swiss committee continues work on the cannabis market bill
  description: >-
    The National Council health committee voted 16–8, with one abstention, to continue work on its
    cannabis-market bill despite divided consultation responses. It asked a subcommittee to revise
    the draft's most disputed points during 2026 and rejected, by 17–8, a proposal to suspend the
    work pending full results from the pilot trials.
  checked: true
  sources:
