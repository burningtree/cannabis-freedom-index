    The Ganja Ordinance created a licensed system for selling cannabis, which Indian indentured
    workers had brought to the islands. Ten years later it was banned outright.
  before: {possession: 10, cultivation: 10, enforcement: 10, sharing: 10, consumption: 10, access: 8}
  checked: true
  sources:
    - title: Wikipedia — Cannabis in Trinidad and Tobago
      url: https://en.wikipedia.org/wiki/Cannabis_in_Trinidad_and_Tobago

- id: us-el-paso-ban-1915
  date: "1915"
  category: ban
  country: us
  title: El Paso bans marijuana
  description: >-
    The Texas border city's ordinance was the first American measure to draw on Mexican beliefs that
    marijuana caused madness and violence. Between 1915 and 1930 practically every state west of the
    Mississippi passed an anti-marijuana law.
  checked: true
  sources:
    - title: Addiction — Hall and Yeates, review of Isaac Campos, Home Grown (2025)
      url: https://pmc.ncbi.nlm.nih.gov/articles/PMC12426359/

- id: mozambique-portaria-2054-1914
  date: "1914-09-19"
  category: ban
  country: mz
  title: Portuguese Mozambique brings cannabis under control
  description: >-
    Portaria No. 2,054, published in the colony's Boletim Oficial, is the order Portugal later cited
    to the United Nations as its control on cannabis, known locally as suruma, in Mozambique. A 1957
    UN survey says the order prohibits cultivating the cannabis plant and prohibits importing and
    selling it.
  before: {possession: 10, cultivation: 10, enforcement: 10, sharing: 10, consumption: 10, access: 8}
  checked: true
  sources:
    - title: United Nations — Commission on Narcotic Drugs, E/CN.7/286/Add.10
