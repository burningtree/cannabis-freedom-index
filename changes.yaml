- id: sri-lanka-import-ban-1897
  date: "1897"
  category: tightening
  country: lk
  title: Ceylon bans imports of bhang and ganja
  description: >-
    The colonial government prohibited importing cannabis, thirty years after it had limited sales
    to licensed dealers.
  checked: true
  sources:
    - title: Wikipedia — Cannabis in Sri Lanka
      url: https://en.wikipedia.org/wiki/Cannabis_in_Sri_Lanka

- id: suriname-ganja-pharmacy-only-1896
  date: "1896"
  category: other
  country: sr
  title: Suriname limits ganja sales to pharmacies
  description: >-
    According to the Dutch Wikipedia article, ganja was already heavily taxed in 1894 and from 1896
    could be sold only by pharmacies. No statute text has been read.
  checked: true
  sources:
    - title: Wikipedia (Dutch) — Cannabis in Suriname
      url: https://nl.wikipedia.org/wiki/Cannabis_in_Suriname

- id: india-act-xii-1896
  date: "1896"
  category: tightening
  country: in
  title: India puts cannabis growing under licence
  description: >-
    On the Hemp Drugs Commission's recommendations, Act XII of 1896 gave the government control over
    growing the plant and over preparing, importing, exporting and transporting its drugs.
    Cultivation was allowed only in certain places under licence and supervision and prohibited
    elsewhere, gathering wild plants was restricted, and all products passed through bonded
    warehouses to licensed vendors after duty was paid.
  checked: true
  sources:
    - title: I. C. Chopra and R. N. Chopra — The use of the cannabis drugs in India, UN Bulletin on Narcotics, 1957, issue 1
      url: https://www.unodc.org/unodc/en/data-and-analysis/bulletin/bulletin_1957-01-01_1_page003.html

- id: india-hemp-drugs-commission-1894
  date: "1894"
  category: debate
  country: in
  title: The Indian Hemp Drugs Commission reports
  description: >-
    After hearing nearly 1,200 witnesses across British India, the commission concluded that
    moderate use of hemp drugs does practically no harm and that banning them would be unjustified.
    It recommended taxing and licensing them, which remained the system in India until 1985.
  checked: true
  sources:
    - title: Wikipedia — Indian Hemp Drugs Commission
      url: https://en.wikipedia.org/wiki/Indian_Hemp_Drugs_Commission

- id: egypt-caillard-regulation-proposal-1892
  date: "1892"
  category: debate
  country: eg
  title: Egypt's customs chief says the ban is not working
  description: >-
    Caillard Pasha, the British director general of customs, reported that prohibition had produced
    trafficking and that hashish was too widely used to stamp out. A law modelled on India's, to
    register, license and tax its manufacture, sale and import, was drafted but never put into
    effect.
  checked: true
