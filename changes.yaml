# Changes: a law or other important development that moved a country's score.
# The home page shows the four most recent. Add new entries anywhere; they are sorted by date.
#
#   id:      unique, short, lower-case
#   date:    when the change took effect: "YYYY-MM-DD", or "YYYY-MM" / "YYYY" if that is all we know
#   category: what kind of event it is: ban, tightening, death, easing, legalisation, medical,
#            debate, international or other (see CHANGE_CATEGORIES in src/lib/segment-ids.js)
#   country: the file name in /countries, e.g. "gd"
#   before:  the six segment scores (0-10) before the change. The scores after it are taken from
#            the same country's next change, or from the country file if this is its latest one.
#
# An entry without `before` is context that moves no score: a report or court ruling in a country,
# or, with no `country` either, a treaty or UN decision.
#
#   sources: one or more {title, url}. Add every source that supports the entry.
#   checked: true once the date and the event have been compared with a source that was read.
#            Leave it out otherwise: the site then shows the entry as "not yet checked".
#
# `estimate: true` marks a first restriction with no known date. It is assumed to have happened
# between the 1925 and 1961 treaties: the charts spread it over those years, and the History page
# leaves it out. Replace it with a dated entry when the country's first law is found.

- id: trinidad-age-limit-bill-2026
  date: "2026-10-07"
  category: tightening
  country: tt
  title: Trinidad and Tobago's Senate votes to raise the cannabis age to 25
  description: >-
    The Senate passed the Miscellaneous Provisions (Alcohol, Cannabis, Dangerous Drugs, Gambling and
    Tobacco) Bill by 15 votes to 12, with three abstentions and only government senators in favour.
    It raises the age for cannabis use and gambling to 25 and for alcohol and tobacco to 21. It
    still needed the President's assent.
  checked: true
  sources:
    - title: Trinidad Guardian — Age-limit Bill passes 15-12; Govt gets no outside support (7 October 2026)
      url: https://www.guardian.co.tt/news/agelimit-bill-passes-1512-govt-gets-no-outside-support-6.2.2683723.790e1992f9

- id: algeria-first-death-sentences-2026
  date: "2026-10-05"
  category: death
  country: dz
  title: An Algiers court hands down the first death sentences under the new drug law
  description: >-
    The criminal court of Algiers sentenced nine people to death, six of them in their absence, for
    trafficking 113 kg of cocaine and 225,030 pregabalin tablets as an organised group. The justice
    minister had said on 22 September that the death penalty would be activated against traffickers.
    No cannabis case was involved.
  checked: true
  sources:
    - title: "Le Matin d'Algérie — Trafic de drogue : neuf condamnations à mort, première application de la nouvelle loi"
      url: https://lematindalgerie.com/trafic-de-drogue-neuf-condamnations-a-mort-premiere-application-de-la-nouvelle-loi/

- id: thailand-cabinet-bill-2026
  date: "2026-09-22"
  category: tightening
  country: th
  title: Thailand's cabinet approves a medical-only cannabis bill
  description: >-
    The draft Cannabis and Hemp Act would write the 2025 prescription rule into law, make growers
    register their plantations and raise penalties. It still has to pass parliament.
  checked: true
  sources:
    - title: The Edge Malaysia (Bloomberg) — Thai Cabinet approves bill to tighten cannabis controls (September 2026)
      url: https://theedgemalaysia.com/node/818915

- id: oman-narcotics-law-2026
  date: "2026-09-07"
  category: tightening
  country: om
  title: Oman replaces its drug law
  description: >-
    Royal Decree 67/2026, signed on 3 September and published on 6 September, repealed the 1999 law.
    Possessing, buying or growing a drug plant for personal use, or using, carries one to three
    years in prison and a fine of 1,000 to 5,000 rials, and a court may send a dependent user to
    treatment instead. Smuggling for trafficking can bring the death penalty. Viable cannabis seeds
    are banned along with the plant.
  checked: true
  sources:
    - title: Royal Decree 67/2026 promulgating the Law on Combating Narcotic Drugs and Psychotropic Substances (Qanoon.om)
      url: https://qanoon.om/p/2026/rd2026067/

