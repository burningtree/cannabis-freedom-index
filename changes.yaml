      url: https://web.archive.org/web/2024/https://digitallibrary.un.org/record/4089944/files/E_CN.7_286_Add.10-EN.pdf

- id: kenya-ban-1914
  date: "1914-01-01"
  category: ban
  country: ke
  title: The East Africa Protectorate bans cannabis
  description: >-
    The Opium Ordinance of the British protectorate that became Kenya took effect and prohibited
    cannabis, which had been widely used there.
  before: {possession: 10, cultivation: 10, enforcement: 10, sharing: 10, consumption: 10, access: 8}
  checked: true
