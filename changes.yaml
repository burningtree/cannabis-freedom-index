- id: hague-opium-convention-1912
  date: "1912-01-23"
  category: international
  title: The Hague Opium Convention
  description: >-
    The first international drug treaty covered opium, morphine and cocaine. Italy and the United
    States asked for cannabis to be included; the conference only agreed to study the question. It
    was added thirteen years later.
  checked: true
  sources:
    - title: Wikipedia — International Opium Convention
      url: https://en.wikipedia.org/wiki/International_Opium_Convention
    - title: Wikipedia — First International Opium Convention
      url: https://en.wikipedia.org/wiki/First_International_Opium_Convention

- id: us-massachusetts-first-state-1911
  date: "1911"
  category: ban
  country: us
  title: Massachusetts becomes the first US state to restrict cannabis
  description: >-
    Massachusetts acted in 1911, followed by Maine, California and Vermont. Historians now stress
    that these earliest state laws had little to do with Mexican immigration and reflected fears
    about youth, violence and madness.
  checked: true
  sources:
    - title: Addiction — Hall and Yeates, review of Isaac Campos, Home Grown (2025)
      url: https://pmc.ncbi.nlm.nih.gov/articles/PMC12426359/

