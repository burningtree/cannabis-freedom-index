      url: https://www.cfsm.gov.fm/wp-content/uploads/2026/05/CB-24-153.pdf

- id: colombia-adult-use-first-debate-2026
  date: "2026-05-12"
  category: debate
  country: co
  title: A Colombian House committee backs a legal cannabis market
  description: >-
    The First Committee of the House of Representatives approved in first debate a bill to regulate
    adult use: sales to adults through dispensaries, clubs of 10 to 350 members, up to 20 plants per
    adult at home, a 20% tax, and most cultivation licences reserved for peasant and ethnic growers.
    It was the ninth such bill since 2020; the earlier ones were all shelved. It still needed the
    full House and the Senate.
  checked: true
  sources:
