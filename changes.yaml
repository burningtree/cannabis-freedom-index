      url: https://islandtimes.org/driving-under-the-influence-of-illegal-drugs-now-a-felony-in-palau/

- id: us-medical-schedule-iii-2026
  date: "2026-04-28"
  category: medical
  country: us
  title: The US moves state-licensed medical cannabis to Schedule III
  description: >-
    A DEA final rule, announced by the acting attorney general on 23 April and in force on
    publication, placed cannabis in FDA-approved medicines and cannabis held under a state medical
    licence in Schedule III. It relied on treaty obligations, which let it skip the usual comment
    period. Unlicensed and adult-use cannabis stayed in Schedule I, and a hearing on moving all
    cannabis opened on 29 June.
  checked: true
  sources:
    - title: Gibson Dunn — DEA downschedules state medical marijuana to Schedule III; expedited hearing set to consider broader rescheduling (29 April 2026)
      url: https://www.gibsondunn.com/dea-downschedules-state-medical-marijuana-to-schedule-iii-expedited-hearing-set-to-consider-broader-rescheduling/

