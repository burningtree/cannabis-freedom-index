    morphine. Cannabis was not restricted until 1934.
  checked: true
  sources:
    - title: Wikipedia — Cannabis in Russia
      url: https://en.wikipedia.org/wiki/Cannabis_in_Russia

- id: panama-canal-zone-committee-1926
  date: "1926"
  category: debate
  country: pa
  title: A Canal Zone committee finds marijuana does little harm
  description: >-
    After a judge jailed an American seaman for a year in November 1926 for smoking cannabis
    cigarettes, an official committee studied the drug with 17 subjects. It found only minor effects
    and recommended against special legislation in the Canal Zone.
  checked: true
  sources:
    - title: Wikipedia — Cannabis in Panama
      url: https://en.wikipedia.org/wiki/Cannabis_in_Panama

- id: romania-resin-cultivation-ban-1926
