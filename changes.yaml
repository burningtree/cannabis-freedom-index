  date: "2026-08-03"
  category: medical
  country: np
  title: A Nepali province legalises cannabis farming for medicine
  description: >-
    Gandaki province's law took effect, letting farmers grow cannabis for medical use with official
    permission and under close monitoring. The national ban on growing, holding and using cannabis
    stayed in force, so the provincial law conflicts with federal law.
