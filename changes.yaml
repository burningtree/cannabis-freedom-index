  date: "2026-07-30"
  category: medical
  country: de
  title: German health insurers stop paying for cannabis flower
  description: >-
    Cannabis flower lost its eligibility for reimbursement by the statutory health insurance funds.
    Extracts and other cannabis-based medicines are still covered, and doctors can still prescribe
    flower privately.
  checked: true
