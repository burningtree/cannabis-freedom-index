- id: sri-lanka-import-ban-1897
  date: "1897"
  category: tightening
  country: lk
  title: Ceylon bans imports of bhang and ganja
  description: >-
    The colonial government prohibited importing cannabis, thirty years after it had limited sales
    to licensed dealers.
  checked: true
  sources:
    - title: Wikipedia — Cannabis in Sri Lanka
      url: https://en.wikipedia.org/wiki/Cannabis_in_Sri_Lanka

- id: india-hemp-drugs-commission-1894
  date: "1894"
  category: debate
  country: in
  title: The Indian Hemp Drugs Commission reports
  description: >-
    After hearing nearly 1,200 witnesses across British India, the commission concluded that
    moderate use of hemp drugs does practically no harm and that banning them would be unjustified.
    It recommended taxing and licensing them, which remained the system in India until 1985.
  checked: true
  sources:
    - title: Wikipedia — Indian Hemp Drugs Commission
      url: https://en.wikipedia.org/wiki/Indian_Hemp_Drugs_Commission

- id: egypt-caillard-regulation-proposal-1892
  date: "1892"
  category: debate
  country: eg
  title: Egypt's customs chief says the ban is not working
  description: >-
    Caillard Pasha, the British director general of customs, reported that prohibition had produced
    trafficking and that hashish was too widely used to stamp out. A law modelled on India's, to
    register, license and tax its manufacture, sale and import, was drafted but never put into
    effect.
  checked: true
  sources:
    - title: Transnational Institute — The Rise and Decline of Cannabis Prohibition, chapter 1
      url: https://www.tni.org/files/download/rise_and_decline_ch1.pdf

- id: myanmar-ban-1891
  date: "1891"
  category: ban
  country: mm
  title: British Burma bans cannabis
  description: >-
    The colonial government prohibited cannabis in Burma, while it kept licensing and taxing it
    across the border in India.
  before: {possession: 10, cultivation: 10, enforcement: 10, sharing: 10, consumption: 10, access: 8}
  checked: true
  sources:
    - title: Wikipedia — Cannabis in Myanmar
      url: https://en.wikipedia.org/wiki/Cannabis_in_Myanmar

- id: greece-hashish-ban-1890
  date: "1890"
  category: ban
  country: gr
  title: Greece bans hashish
  description: >-
    A royal decree prohibited growing, importing and using hashish, one of the first national bans
    in Europe.
  before: {possession: 10, cultivation: 10, enforcement: 10, sharing: 10, consumption: 10, access: 8}
  checked: true
  sources:
    - title: Wikipedia — Cannabis in Greece
      url: https://en.wikipedia.org/wiki/Cannabis_in_Greece

- id: morocco-hassan-regulations-1890
  date: "1890"
  category: other
  country: ma
  title: Morocco's sultan regulates kif and licenses the Rif
  description: >-
    Sultan Hassan I put strict rules on growing and trading cannabis while granting the right to
    produce it to certain tribes of the Rif.
  checked: true
  sources:
    - title: Wikipedia — Cannabis in Morocco
      url: https://en.wikipedia.org/wiki/Cannabis_in_Morocco

- id: egypt-cultivation-ban-1884
  date: "1884"
  category: ban
  country: eg
  title: Egypt bans growing cannabis
  description: >-
    Five years after banning imports, the Egyptian government prohibited cultivation as well.
  checked: true
  sources:
    - title: Wikipedia — Cannabis in Egypt
      url: https://en.wikipedia.org/wiki/Cannabis_in_Egypt

- id: seychelles-ban-1882
  date: "1882"
  category: ban
  country: sc
  title: Seychelles bans cannabis
  description: >-
    The prohibition was copied word for word from the law of Mauritius, of which Seychelles was then
    a dependency.
  before: {possession: 10, cultivation: 10, enforcement: 10, sharing: 10, consumption: 10, access: 8}
  checked: true
  sources:
    - title: Wikipedia — Cannabis in Seychelles
