- id: egypt-import-ban-1879
  date: "1879"
  category: ban
  country: eg
  title: Egypt bans the import of hashish
  description: >-
    After earlier attempts to stamp out hashish, the Khedivate banned its import, and five years
    later its cultivation. Egypt went on to ask for cannabis to be included in the 1925 Geneva
    convention.
  before: {possession: 10, cultivation: 10, enforcement: 10, sharing: 10, consumption: 10, access: 8}
  checked: true
  sources:
    - title: Wikipedia — Cannabis in Egypt
      url: https://en.wikipedia.org/wiki/Cannabis_in_Egypt

- id: egypt-destruction-order-1877
  date: "1877"
  category: tightening
  country: eg
  title: The Ottoman sultan orders Egypt's hashish destroyed
  description: >-
    A campaign was ordered to confiscate and destroy cannabis across Egypt. Two years later a new
    law made growing and importing it illegal.
  checked: true
  sources:
    - title: Transnational Institute — The Rise and Decline of Cannabis Prohibition, chapter 1
      url: https://www.tni.org/files/download/rise_and_decline_ch1.pdf

- id: germany-pharmacy-only-1872
  date: "1872"
  category: other
  country: de
  title: Germany restricts Indian hemp to pharmacies
  description: >-
    An imperial ordinance on the trade in medicines limited the sale of Indian hemp to pharmacies.
    It regulated a medicine; it did not prohibit possession or use.
  sources:
    - title: Wikipedia — Cannabis in Germany
      url: https://en.wikipedia.org/wiki/Cannabis_in_Germany

- id: south-africa-natal-1870
  date: "1870"
  category: ban
  country: za
  title: Natal bans dagga for Indian workers
  description: >-
    The colony of Natal prohibited Indian indentured labourers from smoking, using or possessing
    dagga, one of the earliest cannabis laws anywhere. Other provinces followed with restrictions of
    their own before the national ban of 1922.
  checked: true
  sources:
    - title: Wikipedia — Cannabis in South Africa
      url: https://en.wikipedia.org/wiki/Cannabis_in_South_Africa

