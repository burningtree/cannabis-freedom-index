- id: sri-lanka-indian-hemp-ordinance-1905
  date: "1905"
  category: ban
  country: lk
  title: Ceylon passes the Indian Hemp Ordinance
  description: >-
    After banning imports in 1897, the colonial government moved from licensing to prohibition. The
    1907 version set a fine of 100 rupees and up to six months in prison. Later law kept an
    exception that still stands: licensed Ayurvedic practitioners may use and dispense cannabis.
  before: {possession: 6, cultivation: 3, enforcement: 6, sharing: 3, consumption: 5, access: 6}
  checked: true
  sources:
    - title: Wikipedia — Cannabis in Sri Lanka
