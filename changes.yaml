      url: https://www.canorml.org/the-origins-of-californias-1913-cannabis-law/

- id: angola-portuguese-ban-1913
  date: "1913-05-13"
  category: ban
  country: ao
  title: Portugal bans cannabis in Angola
  description: >-
    A colonial law prohibited cannabis in Angola. It was aimed at colonial troops and also meant to
    push farmers towards growing tobacco. A United Nations survey names the order as Portaria
    No. 508 of 13 May 1913.
  before: {possession: 10, cultivation: 10, enforcement: 10, sharing: 10, consumption: 10, access: 8}
  checked: true
  sources:
