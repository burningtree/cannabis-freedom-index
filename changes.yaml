- id: portugal-decriminalisation-2001
  date: "2001-07-01"
  country: pt
  title: Portugal decriminalises all drugs
  description: >-
    Possessing up to a ten-day supply, 25 g of cannabis flower, stopped being a crime. Police
    confiscate it and refer the person to a dissuasion commission, which can suspend the case or
    impose a fine. Growing and selling remain crimes.
  before: {possession: 1, cultivation: 1, enforcement: 2, sharing: 1, consumption: 1, access: 0}
  source:
