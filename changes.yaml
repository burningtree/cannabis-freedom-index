    url: https://idpc.net/news/2018/02/antigua-and-barbuda-set-to-decriminalise-cannabis-as-pm-says-it-is-part-of-the-culture-of-the-country

- id: belize-decriminalisation-2017
  date: "2017-11"
  country: bz
  title: Belize decriminalises 10 g
  description: >-
    Adults may possess up to 10 g and use it on private premises without committing an offence.
    Growing any amount remains a crime, and a later law to create a regulated market was shelved.
  before: {possession: 1, cultivation: 1, enforcement: 2, sharing: 1, consumption: 1, access: 0}
  source:
    title: Misuse of Drugs (Amendment) Act 2017, No. 47 of 2017 (PDF, via OAS)
