- id: ireland-drugs-committee-report-2026
  date: "2026-06"
  category: debate
  country: ie
  title: An Irish parliamentary committee recommends decriminalising possession
  description: >-
    The Oireachtas committee on drugs use, chaired by Gary Gannon, published a final report with 161
    recommendations. It called for repealing Section 3 of the Misuse of Drugs Act 1977, so that
    possessing any drug for personal use would no longer be a crime. The government had committed to
    a health-led approach but had shown little sign of preparing such a law.
  checked: true
  sources:
    - title: Dublin People — Committee backs major overhaul of Irish drug laws (1 July 2026)
      url: https://dublinpeople.com/news/dublin/articles/2026/07/01/committee-backs-major-overhaul-of-irish-drug-laws/

- id: greece-hemp-flower-ban-2026
  date: "2026-05-20"
  category: tightening
  country: gr
  title: Greece bans retail sale of hemp flower
  description: >-
    Article 43 of Law 5302/2026 raised the THC limit for hemp from 0.2% to 0.3%, but at the same
    time banned selling dried hemp flower to consumers, and consumers buying or using it. Import and
    wholesale for industrial processing, such as cosmetics, stay legal. The medicines agency said
    the ban applied at once and announced shop inspections.
  checked: true
  sources:
    - title: Ν. 5302/2026, άρθρο 43 (ΦΕΚ Α' 78/20-05-2026), text on Taxheaven
      url: https://www.taxheaven.gr/law/5302/2026/arthro/43

- id: micronesia-trafficking-fine-bill-2026
  date: "2026-05-14"
  category: debate
  country: fm
  title: A bill in Micronesia's Congress would set minimum fines for trafficking
  description: >-
    Congressional Bill 24-153 would amend the trafficking section of the national code to add a
    minimum fine of 5,000 dollars for Schedule I and II narcotics, alongside up to ten years in
    prison. It keeps the rule that giving away an ounce or less of marihuana for no payment is
    treated as simple possession.
  checked: true
  sources:
