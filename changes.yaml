  category: ban
  country: ro
  title: Romania prohibits growing cannabis for resin
  description: >-
    Romania was one of the Eastern European countries where traffickers tried to establish cannabis
    growing for hashish after Greece's 1920 ban. It prohibited the crop in 1926, according to the
    UN's 1951 survey of cannabis.
  checked: true
  sources:
    - title: J. Bouquet — Cannabis (concluded), UN Bulletin on Narcotics, 1951, issue 1
      url: https://www.unodc.org/unodc/en/data-and-analysis/bulletin/bulletin_1951-01-01_1_page005.html

