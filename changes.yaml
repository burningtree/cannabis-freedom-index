# Changes: a law or other important development that moved a country's score.
# The home page shows the four most recent. Add new entries anywhere; they are sorted by date.
#
#   id:      unique, short, lower-case
#   date:    when the change took effect: "YYYY-MM-DD", or "YYYY-MM" if the day is not known
#   country: the file name in /countries, e.g. "gd"
#   before:  the six segment scores (0-10) before the change. The scores after it are taken from
#            the same country's next change, or from the country file if this is its latest one.

- id: grenada-decriminalisation-2026
  date: "2026-02"
  country: gd
  title: Grenada decriminalises cannabis
  description: >-
    The Drug Abuse (Prevention and Control) (Amendment) Act passed with support from both sides of
    parliament and received assent in February. Adults 21 and over may possess 56 g and grow four
    plants per household, and records for minor offences are expunged. There is no legal market yet.
  before: {possession: 1, cultivation: 1, enforcement: 2, sharing: 1, consumption: 1, access: 0}
  source:
    title: Virgin Islands News Online — Grenadian parliament approves amendment to marijuana legislation
    url: https://www.virginislandsnewsonline.com/en/news/grenadian-parliament-approves-amendment-to-marijuana-legislation

- id: czechia-home-grow-2026
  date: "2026-01-01"
  country: cz
  title: Czechia legalises possession and home growing
  description: >-
    A criminal-code reform took effect on 1 January. Adults 21 and over may grow three plants and
    keep 100 g at home or 25 g in public; before, small amounts were only an administrative offence.
    Shops and clubs are still not allowed.
  before: {possession: 3, cultivation: 2, enforcement: 5, sharing: 1, consumption: 4, access: 1}
  source:
    title: Expats.cz — Inside Czechia's 2026 cannabis law
    url: https://www.expats.cz/czech-news/article/inside-czechia-s-2026-cannabis-laws-how-much-can-you-legally-grow-and-possess

- id: thailand-prescription-only-2025
  date: "2025-06-25"
  country: th
  title: Thailand goes prescription-only
  description: >-
    Three years after removing cannabis from its narcotics list, Thailand reclassified the flower as
    a controlled herb. Buying or possessing it now requires a prescription, and thousands of
    dispensaries have closed rather than convert to medical premises.
  before: {possession: 8, cultivation: 7, enforcement: 7, sharing: 3, consumption: 3, access: 6}
  source:
    title: The Thaiger — Cannabis in Thailand 2026, the new medical-only rules
    url: https://thethaiger.com/guides/cannabis/cannabis-thailand-2026-medical-rules

- id: japan-use-criminalised-2024
  date: "2024-12-12"
  country: jp
  title: Japan makes cannabis use a crime
  description: >-
    Japan used to punish possession but not use. Amendments in force from 12 December moved cannabis
    under the narcotics law, made use itself an offence and raised the maximum for possession from
    five to seven years in prison. The same reform allowed cannabis-derived medicines.
  before: {possession: 0, cultivation: 0, enforcement: 1, sharing: 0, consumption: 1, access: 0}
  source:
    title: GrowerIQ — Japan's cannabis law reform, criminalizing use while opening the door to medicine
    url: https://groweriq.ca/2026/04/09/japan-cannabis-law-reform-2024/

- id: brazil-supreme-court-2024
  date: "2024-06-26"
  country: br
  title: Brazil's Supreme Court decriminalises personal possession
  description: >-
    After a case that ran for nine years, the court ruled that possessing cannabis for personal use
    is not a crime. Up to 40 g or six female plants is presumed to be personal use and is handled
    with a warning or an educational course. It is still prohibited, and the cannabis is seized.
  before: {possession: 2, cultivation: 1, enforcement: 2, sharing: 1, consumption: 1, access: 1}
  source:
    title: Conectas — Brazilian Supreme Court decriminalizes possession of marijuana for personal use
    url: https://conectas.org/en/noticias/nine-years-into-the-case-the-brazilian-federal-supreme-court-stf-decriminalizes-possession-of-marijuana-for-personal-use/

- id: germany-cannabis-act-2024
  date: "2024-04-01"
  country: de
  title: Germany legalises possession and home growing
  description: >-
    The Cannabis Act took effect on 1 April. Adults may carry 25 g, keep 50 g at home and grow three
    plants, and non-profit growing associations were allowed from July. There are no shops, and
    passing cannabis to another person remains a crime.
  before: {possession: 2, cultivation: 1, enforcement: 4, sharing: 1, consumption: 3, access: 1}
  source:
    title: Bundesgesundheitsministerium — FAQ zum Cannabisgesetz
    url: https://www.bundesgesundheitsministerium.de/themen/cannabis/faq-cannabisgesetz

- id: luxembourg-home-grow-2023
  date: "2023-07-21"
  country: lu
  title: Luxembourg legalises home growing
  description: >-
    Adults may grow up to four plants per household and consume at home. Cannabis stays prohibited
    in public, but carrying up to 3 g became a €145 fine instead of a criminal matter. There is no
    legal place to buy it.
  before: {possession: 2, cultivation: 1, enforcement: 4, sharing: 1, consumption: 2, access: 1}
  source:
    title: IDPC — Growing and smoking weed at home now legal in Luxembourg
    url: https://idpc.net/news/2023/07/growing-and-smoking-weed-at-home-now-legal-in-luxembourg

- id: malta-legalisation-2021
  date: "2021-12-18"
  country: mt
  title: Malta becomes the first EU country to legalise
  description: >-
    Adults may carry 7 g, keep 50 g at home and grow four plants per household. Instead of shops,
    the law allows licensed non-profit associations that grow for their members. Smoking in public
    is still prohibited.
  before: {possession: 3, cultivation: 1, enforcement: 4, sharing: 1, consumption: 2, access: 1}
  source:
    title: Authority on the Responsible Use of Cannabis Act (Cap. 628)
    url: https://legislation.mt/eli/cap/628/eng

- id: mexico-supreme-court-2021
  date: "2021-06-28"
  country: mx
  title: Mexico's Supreme Court strikes down the ban on personal use
  description: >-
    The court declared the ban on adult personal use unconstitutional after Congress missed several
    deadlines to legislate. Adults can apply to the health regulator for a permit to grow and
    consume, but Congress never passed a law to regulate it and there is no legal market.
  before: {possession: 2, cultivation: 1, enforcement: 3, sharing: 1, consumption: 2, access: 0}
  source:
    title: Transcend Media Service — Supreme Court in Mexico declares cannabis prohibition unconstitutional
    url: https://www.transcend.org/tms/2021/07/supreme-court-in-mexico-declares-cannabis-prohibition-unconstitutional

- id: trinidad-decriminalisation-2019
  date: "2019-12-23"
  country: tt
  title: Trinidad and Tobago decriminalises cannabis
  description: >-
    Adults may possess up to 30 g and grow four plants each with no penalty. Between 30 g and 60 g
    is a fixed-penalty ticket instead of a prosecution. Before, possession could mean years in
    prison. No legal market was created.
  before: {possession: 1, cultivation: 0, enforcement: 1, sharing: 0, consumption: 1, access: 0}
  source:
    title: TNI — Trinidad and Tobago lawmakers approve marijuana decriminalization bill
    url: https://ungassondrugs.org/en/site_content/item/9516-trinidad-and-tobago-lawmakers-approve-marijuana-decriminalization-bill.html

- id: canada-cannabis-act-2018
  date: "2018-10-17"
  country: ca
  title: Canada legalises cannabis nationwide
  description: >-
    The Cannabis Act made Canada the second country, and the first G7 member, to legalise. Adults
    may carry 30 g, grow four plants per household in most provinces, share with other adults and
    buy from licensed shops.
  before: {possession: 1, cultivation: 1, enforcement: 3, sharing: 1, consumption: 1, access: 2}
  source:
    title: Department of Justice Canada — Cannabis legalization and regulation
    url: https://www.justice.gc.ca/eng/cj-jp/cannabis/

- id: south-africa-constitutional-court-2018
  date: "2018-09-18"
  country: za
  title: South Africa's top court protects private use and growing
  description: >-
    The Constitutional Court ruled that adults have a right to use, possess and grow cannabis in
    private, with no fixed gram or plant limit. Buying and selling stayed illegal, and so did use in
    public.
  before: {possession: 1, cultivation: 1, enforcement: 2, sharing: 1, consumption: 1, access: 0}
  source:
    title: Constitutional Court of South Africa — Minister of Justice v Prince [2018] ZACC 30
    url: https://www.saflii.org/za/cases/ZACC/2018/30.html

- id: georgia-constitutional-court-2018
  date: "2018-07-30"
  country: ge
  title: Georgia's Constitutional Court ends punishment for use
  description: >-
    The court abolished the administrative fines for consuming cannabis, making private use legal.
    Growing and selling remain crimes, so there is no lawful way to get it.
  before: {possession: 3, cultivation: 1, enforcement: 3, sharing: 1, consumption: 2, access: 0}
  source:
    title: IDPC — Cannabis use can no longer be punished in Georgia, court rules
    url: https://idpc.net/news/2018/08/cannabis-use-can-no-longer-be-punished-in-georgia-court-rules

- id: uruguay-legalisation-2013
  date: "2013-12"
  country: uy
  title: Uruguay becomes the first country to legalise
  description: >-
    Law 19.172 put the whole chain under state control. Registered residents choose one of three
    routes: growing six plants at home, joining a club, or buying up to 40 g a month in pharmacies.
    Possession for personal use had not been a crime since 1974.
  before: {possession: 5, cultivation: 1, enforcement: 5, sharing: 1, consumption: 6, access: 0}
  source:
    title: Ley N° 19.172 — Regulación y control del cannabis (IMPO)
    url: https://www.impo.com.uy/bases/leyes/19172-2013

- id: thailand-decriminalisation-2022
  date: "2022-06-09"
  country: th
  title: Thailand removes cannabis from its narcotics list
  description: >-
    Thailand became the first Asian country to decriminalise. Possessing and growing the plant
    stopped being offences, home growers only had to register through an app, and thousands of
    dispensaries opened within months. No law regulating the new market followed.
  before: {possession: 1, cultivation: 0, enforcement: 1, sharing: 0, consumption: 1, access: 1}
  source:
    title: Wikipedia — Cannabis in Thailand
    url: https://en.wikipedia.org/wiki/Cannabis_in_Thailand
