  date: "1907"
  category: ban
  country: fj
  title: Fiji bans the import of Indian hemp
  description: >-
    Ordinance No. 21 prohibited importing Indian hemp or anything made from it. It was aimed at the
    Indian labourers brought to work the sugar plantations.
