  title: Canada opens legal medical access
  description: >-
    After courts ruled that a ban with no medical exemption was unconstitutional, federal
    regulations let authorised patients possess cannabis and grow their own or name a grower.
    Recreational possession stayed a crime.
  before: {possession: 1, cultivation: 1, enforcement: 3, sharing: 1, consumption: 1, access: 0}
