      url: https://laveulliure.ad/en/news/andorra-single-licence-medicinal-cannabis-cultivation

- id: tanzania-seed-possession-bill-2026
  date: "2026-09-01"
  category: debate
  country: tz
  title: Tanzania moves to make holding cannabis seeds a crime
  description: >-
    The Attorney General presented a bill amending the Drugs Control and Enforcement Act. It would
    make it an offence to hold or distribute seeds of prohibited plants, cannabis among them,
    whatever they are meant for, and would extend the law to drugs in liquid form. The report gave
    no penalties and no vote.
  checked: true
  sources:
    - title: Tanzania Daily News via AllAfrica — Tanzanian proposes amendments to the Drugs Control and Enforcement Act (1 September 2026)
      url: https://allafrica.com/stories/202609020722.html

