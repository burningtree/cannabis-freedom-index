  date: "2026-04-07"
  category: debate
  country: ec
  title: Ecuador's Assembly admits a citizens' cannabis bill
  description: >-
    With 142 of 151 votes the National Assembly admitted a proposal from cannabis organisations to
    allow growing for personal use and sales in state-regulated shops. Its backers must now collect
    at least 35,000 signatures for the electoral council to verify; the Assembly then has three
