- id: palau-drug-law-2026
  date: "2026-05-07"
  category: tightening
  country: pw
  title: Palau toughens its drug law
  description: >-
    President Surangel Whipps Jr. signed RPPL 12-5, which the legislature had passed in April. It
    raises penalties for drug crimes, requires drug tests at least twice a year for police, health
    workers and other designated employees, and treats a positive test for an illegal drug as
    possession of a small amount; driving under the influence of an illegal drug, marijuana
    included, can be charged the same way. The reports read deal mainly with methamphetamine and do
    not say how marijuana penalties changed.
  checked: true
  sources:
    - title: Island Times — Late-night traffic stop leads to drug charges for woman under Palau's new drug law (26 June 2026)
      url: https://islandtimes.org/late-night-traffic-stop-leads-to-drug-charges-for-woman-under-palaus-new-drug-law/
    - title: PINA / Island Times — Zero-tolerance drug law clears Palau legislature (29 April 2026)
