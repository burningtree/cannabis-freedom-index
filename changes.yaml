  category: ban
  country: pg
  title: The Territory of New Guinea restricts cannabis extracts
  description: >-
    The Dangerous Drugs Ordinance treated extracts and tinctures of Indian hemp as dangerous drugs,
    prohibited their unlicensed import and limited licences to medicinal purposes. The restriction
