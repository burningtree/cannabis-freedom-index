- id: italy-first-drug-law-1923
  date: "1923"
  country: it
  title: Italy passes its first drug law
  description: >-
    The Mussolini-Oviglio law punished the sale and unauthorised possession of narcotics, including
    hashish, with prison.
  before: {possession: 10, cultivation: 10, enforcement: 10, sharing: 10, consumption: 10, access: 8}
  source:
    title: Wikipedia — Timeline of cannabis law
    url: https://en.wikipedia.org/wiki/Timeline_of_cannabis_law

- id: canada-ban-1923
  date: "1923-04-23"
  country: ca
  title: Canada bans cannabis
  description: >-
    Cannabis was added to the schedule of the Opium and Narcotic Drug Act without debate in
    Parliament. Nobody has established why: there was almost no use in Canada, and the first seizure
    was not until 1932.
  before: {possession: 10, cultivation: 10, enforcement: 10, sharing: 10, consumption: 10, access: 8}
  source:
    title: Wikipedia — Cannabis in Canada
    url: https://en.wikipedia.org/wiki/Cannabis_in_Canada

- id: south-africa-national-ban-1922
  date: "1922"
  country: za
  title: South Africa bans dagga nationwide
  description: >-
    Provinces had restricted dagga since the nineteenth century, at first only for Indian labourers.
    A national law now prohibited growing, selling and possessing it. South Africa then asked the
    League of Nations to put cannabis under international control.
  before: {possession: 6, cultivation: 6, enforcement: 6, sharing: 5, consumption: 6, access: 5}
  source:
    title: Wikipedia — Cannabis in South Africa
    url: https://en.wikipedia.org/wiki/Cannabis_in_South_Africa

- id: belgium-drug-law-1921
  date: "1921-02-24"
  country: be
  title: Belgium passes its drug law
  description: >-
    The law of 24 February 1921, still the basis of Belgian drug law, made possessing and trading
    controlled substances a crime. Cannabis was among them.
  before: {possession: 10, cultivation: 10, enforcement: 10, sharing: 10, consumption: 10, access: 8}
  source:
    title: Wikipedia — Cannabis in Belgium
    url: https://en.wikipedia.org/wiki/Cannabis_in_Belgium

- id: sierra-leone-ban-1920
  date: "1920"
  country: sl
  title: Sierra Leone bans cannabis
  description: >-
    The British colony prohibited cannabis, which had long been grown and smoked there.
  before: {possession: 10, cultivation: 10, enforcement: 10, sharing: 10, consumption: 10, access: 8}
  source:
    title: Wikipedia — Timeline of cannabis law
    url: https://en.wikipedia.org/wiki/Timeline_of_cannabis_law

- id: mexico-ban-1920
  date: "1920-03-15"
  country: mx
  title: Mexico bans marijuana
  description: >-
    A federal health decree prohibited growing and selling marijuana, seventeen years before the
    United States acted. It had been restricted in Mexico City since the 1880s.
  before: {possession: 10, cultivation: 10, enforcement: 10, sharing: 10, consumption: 10, access: 8}
  source:
    title: Wikipedia — Cannabis in Mexico
    url: https://en.wikipedia.org/wiki/Cannabis_in_Mexico

- id: algeria-french-decrees-1916
  date: "1916-09-14"
  country: dz
  title: France bans hashish in Algeria
  description: >-
    Decrees of September 1916 and February 1917 applied the new French drug law to Algeria and
    prohibited hashish.
  before: {possession: 10, cultivation: 10, enforcement: 10, sharing: 10, consumption: 10, access: 8}
  source:
    title: Wikipedia — Cannabis in Algeria
    url: https://en.wikipedia.org/wiki/Cannabis_in_Algeria

- id: france-first-drug-law-1916
  date: "1916-07-12"
  country: fr
  title: France passes its first drug law
  description: >-
    Hashish was listed with opium and cocaine. The law punished importing, selling, possessing and
    using these drugs in company, but left private use alone, which stayed the position until 1970.
  before: {possession: 10, cultivation: 10, enforcement: 10, sharing: 10, consumption: 10, access: 8}
  source:
    title: Wikipedia — Cannabis in France
    url: https://en.wikipedia.org/wiki/Cannabis_in_France

- id: kenya-ban-1914
  date: "1914"
  country: ke
  title: The East Africa Protectorate bans cannabis
  description: >-
    The British protectorate that became Kenya prohibited cannabis.
  before: {possession: 10, cultivation: 10, enforcement: 10, sharing: 10, consumption: 10, access: 8}
  source:
    title: Wikipedia — Timeline of cannabis law
    url: https://en.wikipedia.org/wiki/Timeline_of_cannabis_law

- id: jamaica-ganja-law-1913
  date: "1913"
  country: jm
  title: Jamaica passes the Ganja Law
  description: >-
    Ganja had come to Jamaica with Indian indentured workers in the 1840s. Pressed by the churches,
    the colonial legislature banned growing and importing it, and later possession and smoking.
  before: {possession: 10, cultivation: 10, enforcement: 10, sharing: 10, consumption: 10, access: 8}
  source:
    title: Wikipedia — Cannabis in Jamaica
    url: https://en.wikipedia.org/wiki/Cannabis_in_Jamaica

- id: guyana-indian-hemp-ordinance-1913
  date: "1913"
  country: gy
  title: British Guiana passes the Indian Hemp Ordinance
  description: >-
    The ordinance moved from licensing to prohibition, banning the growing and possession of
    cannabis.
  before: {possession: 6, cultivation: 3, enforcement: 6, sharing: 3, consumption: 5, access: 6}
  source:
    title: Wikipedia — Cannabis in Guyana
    url: https://en.wikipedia.org/wiki/Cannabis_in_Guyana

- id: us-state-bans-1913
  date: "1913"
  country: us
  title: American states begin banning cannabis
  description: >-
    California prohibited cannabis in 1913, after Massachusetts in 1911. By 1933 most states had
    restricted it, many by adopting the Uniform State Narcotic Drug Act. This entry stands for the
    whole process.
  before: {possession: 10, cultivation: 10, enforcement: 10, sharing: 10, consumption: 10, access: 8}
  source:
    title: Wikipedia — Legal history of cannabis in the United States
    url: https://en.wikipedia.org/wiki/Legal_history_of_cannabis_in_the_United_States

- id: hague-opium-convention-1912
  date: "1912-01-23"
  title: The Hague Opium Convention
  description: >-
    The first international drug treaty covered opium, morphine and cocaine. Italy and the United
    States asked for cannabis to be included; the conference only agreed to study the question. It
    was added thirteen years later.
  source:
    title: Wikipedia — International Opium Convention
    url: https://en.wikipedia.org/wiki/International_Opium_Convention

- id: fiji-import-ban-1907
  date: "1907"
  country: fj
  title: Fiji bans the import of Indian hemp
  description: >-
    Ordinance No. 21 prohibited importing Indian hemp or anything made from it. It was aimed at the
    Indian labourers brought to work the sugar plantations.
  before: {possession: 10, cultivation: 10, enforcement: 10, sharing: 10, consumption: 10, access: 8}
  source:
    title: Wikipedia — Cannabis in Fiji
    url: https://en.wikipedia.org/wiki/Cannabis_in_Fiji

- id: sri-lanka-indian-hemp-ordinance-1905
  date: "1905"
  country: lk
  title: Ceylon passes the Indian Hemp Ordinance
  description: >-
    After banning imports in 1897, the colonial government moved from licensing to prohibition. The
    1907 version set a fine of 100 rupees and up to six months in prison. Later law kept an
    exception that still stands: licensed Ayurvedic practitioners may use and dispense cannabis.
  before: {possession: 6, cultivation: 3, enforcement: 6, sharing: 3, consumption: 5, access: 6}
  source:
    title: Wikipedia — Cannabis in Sri Lanka
    url: https://en.wikipedia.org/wiki/Cannabis_in_Sri_Lanka

- id: uganda-ban-1902
  date: "1902"
  country: ug
  title: The Uganda Protectorate bans cannabis
  description: >-
    The British colonial administration prohibited producing cannabis in any form, naming bhang,
    ganja and charas.
  before: {possession: 10, cultivation: 10, enforcement: 10, sharing: 10, consumption: 10, access: 8}
  source:
    title: Wikipedia — Cannabis in Uganda
    url: https://en.wikipedia.org/wiki/Cannabis_in_Uganda

- id: india-hemp-drugs-commission-1894
  date: "1894"
  country: in
  title: The Indian Hemp Drugs Commission reports
  description: >-
    After hearing nearly 1,200 witnesses across British India, the commission concluded that
    moderate use of hemp drugs does practically no harm and that banning them would be unjustified.
    It recommended taxing and licensing them, which remained the system in India until 1985.
  source:
    title: Wikipedia — Indian Hemp Drugs Commission
    url: https://en.wikipedia.org/wiki/Indian_Hemp_Drugs_Commission

- id: myanmar-ban-1891
  date: "1891"
  country: mm
  title: British Burma bans cannabis
  description: >-
    The colonial government prohibited cannabis in Burma, while it kept licensing and taxing it
    across the border in India.
  before: {possession: 10, cultivation: 10, enforcement: 10, sharing: 10, consumption: 10, access: 8}
  source:
    title: Wikipedia — Cannabis in Myanmar
    url: https://en.wikipedia.org/wiki/Cannabis_in_Myanmar

- id: greece-hashish-ban-1890
  date: "1890"
  country: gr
  title: Greece bans hashish
  description: >-
    A royal decree prohibited growing, importing and using hashish, one of the first national bans
    in Europe.
  before: {possession: 10, cultivation: 10, enforcement: 10, sharing: 10, consumption: 10, access: 8}
  source:
    title: Wikipedia — Cannabis in Greece
    url: https://en.wikipedia.org/wiki/Cannabis_in_Greece

- id: egypt-import-ban-1879
  date: "1879"
  country: eg
  title: Egypt bans the import of hashish
  description: >-
    After earlier attempts to stamp out hashish, the Khedivate banned its import, and five years
    later its cultivation. Egypt went on to ask for cannabis to be included in the 1925 Geneva
    convention.
  before: {possession: 10, cultivation: 10, enforcement: 10, sharing: 10, consumption: 10, access: 8}
  source:
    title: Wikipedia — Cannabis in Egypt
    url: https://en.wikipedia.org/wiki/Cannabis_in_Egypt

- id: germany-pharmacy-only-1872
  date: "1872"
  country: de
  title: Germany restricts Indian hemp to pharmacies
  description: >-
    An imperial ordinance on the trade in medicines limited the sale of Indian hemp to pharmacies.
    It regulated a medicine; it did not prohibit possession or use.
  source:
    title: Wikipedia — Cannabis in Germany
    url: https://en.wikipedia.org/wiki/Cannabis_in_Germany

- id: south-africa-natal-1870
  date: "1870"
  country: za
  title: Natal bans dagga for Indian workers
  description: >-
    The colony of Natal prohibited Indian indentured labourers from smoking, using or possessing
    dagga, one of the earliest cannabis laws anywhere. Other provinces followed with restrictions of
    their own before the national ban of 1922.
  source:
    title: Wikipedia — Cannabis in South Africa
    url: https://en.wikipedia.org/wiki/Cannabis_in_South_Africa

- id: singapore-ban-1870
  date: "1870"
  country: sg
  title: The Straits Settlements ban cannabis
  description: >-
    The British colony that included Singapore prohibited cannabis amid concern about use among
    Indian labourers, making it one of the first cannabis bans in Asia.
  before: {possession: 10, cultivation: 10, enforcement: 10, sharing: 10, consumption: 10, access: 8}
  source:
    title: Wikipedia — Cannabis in Singapore
    url: https://en.wikipedia.org/wiki/Cannabis_in_Singapore

- id: malaysia-straits-ban-1870
  date: "1870"
  country: my
  title: The Straits Settlements ban covers Penang and Malacca
  description: >-
    The British colony of the Straits Settlements, which included Penang and Malacca as well as
    Singapore, prohibited cannabis. The Malay states followed under British rule.
  before: {possession: 10, cultivation: 10, enforcement: 10, sharing: 10, consumption: 10, access: 8}
  source:
    title: Wikipedia — Cannabis in Singapore
    url: https://en.wikipedia.org/wiki/Cannabis_in_Singapore

- id: sri-lanka-licensing-1867
  date: "1867"
  country: lk
  title: Ceylon restricts cannabis sales to licensed dealers
