- id: jamaica-ganja-reform-2015
  date: "2015-04-15"
  country: jm
  title: Jamaica decriminalises ganja
  description: >-
    Possessing up to 2 oz became a ticket with a small fixed penalty: no arrest and no criminal
    record. Each household may grow five plants, Rastafari may use ganja as a sacrament, and a
    licensed medical industry was set up.
  before: {possession: 1, cultivation: 1, enforcement: 2, sharing: 1, consumption: 1, access: 0}
  source:
