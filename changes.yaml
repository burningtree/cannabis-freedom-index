- id: chile-drug-law-reform-2026
  date: "2026-04"
  category: tightening
  country: cl
  title: Chile lets trafficking penalties reach small amounts
  description: >-
    A reform of Law 20.000, passed by Congress on 23 March and in force since April, shifts the
    law's test from the quantity seized to the potential harm of the substance: trafficking
    penalties can apply to small amounts of a drug judged capable of serious harm, a class in which
    the regulations place cannabis. On 2 May the Supreme Court still downgraded one
    micro-trafficking case to personal use for lack of proof of intent.
  before: {possession: 3, cultivation: 2, enforcement: 4, sharing: 1, consumption: 3, access: 1}
  checked: true
  sources:
