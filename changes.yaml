    url: https://ncst.gov.jm/wp-content/uploads/2015/09/Ganja-FACT-SHEET-Amendment-to-Dangerous-Drug-ACT.pdf

- id: malta-depenalisation-2015
  date: "2015-04-15"
  country: mt
  title: Malta stops prosecuting small possession
  description: >-
    The Drug Dependence Act turned possession of up to 3.5 g into a fine of €50 to €100 decided by a
    commissioner, not a criminal court. Growing a single plant no longer carried a mandatory prison
    term.
  before: {possession: 1, cultivation: 0, enforcement: 2, sharing: 1, consumption: 1, access: 0}
  source:
    title: Wikipedia — Cannabis in Malta
    url: https://en.wikipedia.org/wiki/Cannabis_in_Malta

- id: switzerland-fine-2013
  date: "2013-10-01"
  country: ch
  title: Switzerland introduces a CHF 100 fine
  description: >-
    Adults caught using cannabis with up to 10 g on them pay a fixed CHF 100 fine and are not
    prosecuted. Courts later held that simply possessing up to 10 g is not punishable at all.
  before: {possession: 2, cultivation: 1, enforcement: 3, sharing: 1, consumption: 1, access: 0}
  source:
    title: ch.ch (Swiss authorities) — Cannabis
    url: https://www.ch.ch/en/safety-and-justice/police/cannabis

- id: croatia-misdemeanour-2013
  date: "2013-01-01"
  country: hr
  title: Croatia makes personal possession a misdemeanour
  description: >-
    A new criminal code took possession of a small amount for personal use out of criminal law. It
    is punished with a fine, though a large one. Growing even a few plants is still a crime.
  before: {possession: 1, cultivation: 1, enforcement: 2, sharing: 1, consumption: 1, access: 0}
  source:
    title: Wikipedia — Cannabis in Croatia
