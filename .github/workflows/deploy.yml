name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Let the workflow publish to Pages using GitHub's own token.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; let a running deployment finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # the whole history: the changelog is built from it (src/lib/gitlog.js)
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - id: pages
        uses: actions/configure-pages@v6
      - run: npm ci
      # Every profile's quick answers ("Can I carry it?") against its own text, and no sentence
      # known to be false (scripts/answers.test.mjs, scripts/profile-claims.test.mjs): a failure
      # stops the deploy instead of going live.
      - run: npm run answers:test
      # the facts earlier issues corrected, which a later rewrite must not lose
      - run: npm run history:test
      # The social preview images (one per page) take minutes to draw and rarely change. Each is
      # kept under a hash of its own content, so restoring the folder redraws only what is new.
      - uses: actions/cache@v4
        with:
          path: |
            .cache/og
            .cache/changelog
          key: og-${{ hashFiles('src/og/**', 'package-lock.json') }}-${{ github.run_id }}
          restore-keys: |
            og-${{ hashFiles('src/og/**', 'package-lock.json') }}-
            og-
      # The site URL and sub-path come from the repository's Pages settings, so the
      # same build works for user.github.io/repo and for a custom domain.
      - run: npm run build
        env:
          SITE: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
