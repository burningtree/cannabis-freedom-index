# Currencies in which a price can be given in the survey, and what each was worth.
# `per_eur` are the European Central Bank's euro reference rates of `date` (units of the currency
# for one euro), from https://www.ecb.europa.eu/stats/eurofxref/eurofxref-daily.xml. The counting
# script turns every reported price into US dollars with them. Update the rates when an edition
# closes, and note the date: prices are converted at these rates, not at the day of the answer.
# A currency that is not listed cannot be chosen; those respondents answer in US dollars.
